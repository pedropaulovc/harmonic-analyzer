[project]
name = "harmonic-analyzer"
version = "0.1.0"
description = "Parametric CAD model + build pipeline for a Michelson-style harmonic analyzer (SolidWorks-driven, doit-orchestrated)."
readme = "README.md"
license = { file = "LICENSE" }
# grpcio has no CPython 3.15 wheel; avoid an implicit native build until it does.
requires-python = ">=3.12,<3.15"

# Core: everything the doit pipeline and the SolidWorks-free gates / comparison
# diff tooling import directly.
#   doit      - pipeline orchestrator (dodo.py)
#   pyyaml    - cad/config registry parsing (_config.py, gen_dimensions.py)
#   pillow    - PNG export/trim (_part_save, trim_renders, cad/comparisons/tools)
#   numpy     - geometry / Hausdorff diff (render_diff, release_diff)
#   trimesh   - mesh diff (render_diff.py, the SolidWorks-free release diff)
#   matplotlib- offline render fallback (render_diff_mpl)
#   pywin32   - SolidWorks COM (win32com/pythoncom) on the COM tasks
#   comtypes  - SolidWorks COM (alternate binding) on the COM tasks
#   azure-storage-blob / azure-identity
#             - remote build-artefact cache backend (_artifact_cache.py): a Blob
#               container over HTTPS, keyless auth via DefaultAzureCredential
#   opentelemetry-api / opentelemetry-sdk
#             - observability spine (cad/scripts/_telemetry.py): the whole
#               pipeline is traced + logged through OTel. The SDK ships the
#               console span/log exporters we preconfigure, so no collector or
#               extra exporter package is required for the default console path.
dependencies = [
    "doit>=0.36",
    # filelock - the cross-process COM seat lock in dodo.py (_com_seat): serializes
    #            the single SolidWorks STA seat at runtime (replaces the old task_dep
    #            spine). Was only transitive; declared direct so a dep bump can't drop it.
    "filelock>=3.13",
    # jsonschema - checks OMP-route machinist verdicts against the review schema
    #              (machinist_review_transport.py). Was only transitive via mcp;
    #              declared direct because the transport imports it.
    "jsonschema>=4.0",
    # fonttools  - picture_clip.py names glyphs for the Arial (Helvetica AFM) widths
    #              with fontTools.agl. Was only transitive via matplotlib; declared
    #              direct because picture_clip imports it.
    "fonttools>=4.0",
    # Blind machinist review uses the SDK transport with explicit API credentials.
    # The SDK bundles the Claude Code CLI; claude-opus-5-5 requires CLI >= 2.1.280
    # (0.2.174 bundles 2.1.310; 0.1.76's 2.1.132 is refused with an API 400).
    "claude-agent-sdk==0.2.174",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "rtree>=1.4",
    "scipy>=1.15",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "pywin32>=306 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # OTLP exporters so spans+logs ship either to the local Aspire dashboard over
    # HTTP or to Azure Monitor Agent's local gRPC endpoint.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    # The vendored SolidWorks COM adapter (cad/scripts/solidworks_mcp) imports
    # pydantic (input models) and loguru (adapter logging).
    "pydantic>=2.5",
    "loguru>=0.7",
    "pypdfium2>=5.11.0",
    "pypdf>=6.14.2",
    # Read-only inspection and evidence rendering for release glTF/GLB models.
    "meshprobe>=1.4.0,<2",
    # Farm executor (cad/scripts/_farm.py): dispatches cache-missing part/assembly/
    # drawing leaves as Temporal workflows to the SolidWorks build farm.
    "temporalio>=1.32",
    # Shop stock BOM workbook (cad/scripts/stock_bom.py --format xlsx).
    "xlsxwriter>=3.2",
]

[dependency-groups]
# Backs the SolidWorks-free `check:*` gates (math/config/graph/nameplate/recipe).
# Synced by default with `uv sync`.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.8",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
# The first nine entries are pytest's defaults, which a custom list replaces;
# `.*` also skips .git, .venv and the nested checkouts under .claude/worktrees.
testpaths = ["cad/scripts", "cad/comparisons/tools", "tests", "tools/machinist-review-evals"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "references",
]

[tool.uv]
# This repo is a workspace of scripts (cad/scripts, cad/comparisons/tools added to
# sys.path at runtime), not an installable package — don't try to build it.
package = false
