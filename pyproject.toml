[project]
name = "harmonic-analyzer"
version = "0.1.0"
description = "Parametric CAD model + build pipeline for a Michelson-style harmonic analyzer (SolidWorks-driven, doit-orchestrated)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

# Core: everything the doit pipeline and the SolidWorks-free gates / comparison
# diff tooling import directly.
#   doit      - pipeline orchestrator (dodo.py)
#   pyyaml    - cad/config registry parsing (_config.py, gen_dimensions.py)
#   pillow    - PNG export/trim (_common, trim_renders, cad/comparisons/tools)
#   numpy     - geometry / Hausdorff diff (render_diff, release_diff)
#   trimesh   - mesh diff (render_diff.py, the SolidWorks-free release diff)
#   matplotlib- offline render fallback (render_diff_mpl)
#   pywin32   - SolidWorks COM (win32com/pythoncom) on the COM tasks
#   comtypes  - SolidWorks COM (alternate binding) on the COM tasks
#   azure-storage-blob / azure-identity
#             - remote build-artefact cache backend (_artifact_cache.py): a Blob
#               container over HTTPS, keyless auth via DefaultAzureCredential
#   opentelemetry-api / opentelemetry-sdk
#             - observability spine (cad/scripts/_telemetry.py): the whole
#               pipeline is traced + logged through OTel. The SDK ships the
#               console span/log exporters we preconfigure, so no collector or
#               extra exporter package is required for the default console path.
dependencies = [
    "doit>=0.36",
    # filelock - the cross-process COM seat lock in dodo.py (_com_seat): serializes
    #            the single SolidWorks STA seat at runtime (replaces the old task_dep
    #            spine). Was only transitive; declared direct so a dep bump can't drop it.
    "filelock>=3.13",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "pywin32>=306 ; sys_platform == 'win32'",
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # OTLP/HTTP exporter so spans+logs ship to a collector / the .NET Aspire
    # dashboard out of the box (see _telemetry._DEFAULT_OTLP_ENDPOINT). HTTP, not
    # gRPC, to avoid a grpcio build on newer Pythons.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    # The SolidWorks COM adapter + gate logic (verify.py, _common.py, _assembly.py
    # all `from solidworks_mcp...`) lives in the sibling repo. Pulled in editable so
    # the whole pipeline runs from this one uv venv.
    "solidworks-mcp-python",
    "pypdfium2>=5.11.0",
    "pypdf>=6.14.2",
    # Read-only inspection and evidence rendering for release glTF/GLB models.
    "meshprobe>=1.2.0,<2",
]

[dependency-groups]
# Backs the SolidWorks-free `check:*` gates (math/config/graph/nameplate/recipe).
# Synced by default with `uv sync`.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.15.20",
    # Pull the submodule's `ui` extra (fastapi + prefab-ui) transitively through
    # the editable path source, so its UI server test suite
    # (SolidworksMCP-python/tests/solidworks_mcp/ui) collects and runs from this
    # one venv. Single source of truth — the versions stay pinned in the
    # submodule's own pyproject, not duplicated here.
    "solidworks-mcp-python[ui]",
]

[tool.uv]
# This repo is a workspace of scripts (cad/scripts, cad/comparisons/tools added to
# sys.path at runtime), not an installable package — don't try to build it.
package = false

[tool.uv.sources]
# Vendored as a git submodule (./SolidworksMCP-python, tracking branch `personal`);
# editable so local edits to the COM adapter are picked up live. Run
# `git submodule update --init` after cloning so this path exists.
solidworks-mcp-python = { path = "SolidworksMCP-python", editable = true }
