<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <title>Tangential Arc Profile</title>
  <desc>2D profile with concave rounded corner demonstrating tangential arc</desc>

  <!-- Main profile shape - symmetric with concave arcs on both sides -->
  <path d="M 50 175
           L 50 100
           Q 50 50, 100 50
           L 140 50
           Q 160 50, 160 70
           L 160 90
           Q 160 110, 140 110
           L 260 110
           Q 240 110, 240 90
           L 240 70
           Q 240 50, 260 50
           L 300 50
           Q 350 50, 350 100
           L 350 175
           Z"
        fill="#000000"
        stroke="none"/>
</svg>
