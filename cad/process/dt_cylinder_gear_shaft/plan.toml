# Cylinder gear shaft MHA-DT-13, one off (owner ruling 2026-11-21: turned
# parts get lathe travelers, no NC). The drawing supplies the arbor uncut:
# SUPPLY 7-1/2 LONG; the length is cut to fit and both domes turned at
# assembly, where the #43 set-screw spots are drilled through the MHA-DT-02
# taps (MHA-DT-00). Route chosen for speed: the O.D. is 3/8 ground stock as
# supplied (the sheet prints the stock, not limits: drawing-guidelines rule
# 4; the MHA-DT-12 bores are reamed to it, the bar their gauge), and the
# supply length takes the title block's .X band, so nothing is turned: saw
# one piece 7-1/2 long, deburr both ends, check the length, oil. No lathe
# and no NC.
#
# Stock: 3/8 in 1018 or 1045 ground round is to order
# (cad/config/shop-equipment/stock-to-order.toml 1018-or-1045-ground-round-3-8);
# none is on hand.
title = "Cylinder Gear Shaft"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "SAE 1018 CF or 1045 precision-ground round bar, 3/8 in"
stock = "Ø{{process.stock_dia_in:.4dot}} ground bar (to order, not on hand); one piece {{process.blank_length_in:.2dot}} in long."
note = "Inches. The bar's O.D. is left as supplied; the arbor's final length, both domes and the set-screw spots are made at assembly (MHA-DT-00)."
shop = "../shop"
stock_refs = ["1018-or-1045-ground-round-3-8"]

[cad]
file = "../../out/features/dt_cylinder_gear_shaft/features.toml"
adapter = "turned_shaft"
part = "dt-cylinder-gear-shaft"

[parameters]
quantity = 1
stock_dia_in = 0.375
# The drawing's supply length, sawn to a scribed mark (SUPPLY 7-1/2 LONG).
blank_length_in = 7.5
as_supplied_outer = 1

[[tools]]
id = "saw"
name = "Metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "file"
name = "Files (10 in mill second-cut, 8 in smooth)"
ref = "jig-files"

[[tools]]
id = "rule"
name = "Steel rule, 48 in"
ref = "steel-rule-48"

[[setups]]
machine_kind = "other"
title = "Saw the supply length"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 3/8 in ground bar on the saw: one piece 7-1/2 in long sawn from its end, the O.D. left as supplied." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in (7-1/2) from the bar end with the steel rule and saw on the waste side of the scribe, the bar flat in the saw vise."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The supplied arbor bar: 7-1/2 in long, the O.D. as supplied; domes, final length and spots made at assembly." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr both sawn ends with the file and break their edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the O.D. untouched."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "rule"
drilling = "none"
sizing = "other"
instruction = "Lay the steel rule along the bar: about 7-1/2 in, the supply length (MHA-DT-00 cuts it to fit, about 6.9 in)."
feed = "hand"

[[setups.operations]]
instruction = "Wipe the bar with machine oil and wrap it for storage. It leaves here uncut: MHA-DT-00 cuts it to fit, domes both ends and drills the set-screw spots."
