<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 2: the tip end .58 out; Op 40 faces the sawn end .03 off (to scale, 300 px/in)</text>
  <!-- To scale, 300 px/in: the Ø.250 bar, the jaw fronts .45 behind Z0, the
       stub's faced end Z+.10, about .03 faced off the sawn end. The rest of
       this setup's removal shown hatched: the Ø.112 #4-40 blank to the
       shoulder at Z-.30, the stub faced off to Z0, the tip's 45 deg chamfer
       to the Ø.085 minor and the .0625 relief to Ø.068. The AR tool
       schematic (not on record). The dead centre drawn backed off: it comes
       up for Ops 60-80, after the centre drill. -->
  <!-- The 3-jaw, schematic (its jaws' and body's sizes are not on record):
       its jaw fronts to scale from the part. -->
