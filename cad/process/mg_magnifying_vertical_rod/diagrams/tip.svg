  <rect class="part-removed" x="380.0" y="183.2" width="18.8" height="6.6"/>
  <rect class="part-removed" x="380.0" y="210.2" width="18.8" height="6.6"/>
  <!-- The AR turning tool, schematic (its size is not on record), its
       point on the face, facing toward the centre. -->
  <path class="cutter" d="M500.0 218.0L530.0 230.0L530.0 328.0L506.0 328.0L506.0 242.0Z"/>
