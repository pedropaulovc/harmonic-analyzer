  <line class="datum" x1="470" y1="100" x2="470" y2="150"/>
  <text class="datum-label" x="410" y="94">Z0 the tip's finished plane</text>
  <line class="leader" x1="315.0" y1="273.5" x2="295.0" y2="352"/>
  <text class="label" x="105.0" y="366">3-jaw over a brass shim wrap on the 1/4 bar</text>
  <line class="leader" x1="100" y1="166.5" x2="100" y2="70"/>
