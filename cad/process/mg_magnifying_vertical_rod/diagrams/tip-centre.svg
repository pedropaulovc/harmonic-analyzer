<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 2, the centre drill: No. 1 from the tailstock in the stub's end (to scale across, 300 px/in)</text>
  <!-- The No. 1 centre drill (tools.centre-drills-carbide-60, for a 3/64
       drill): its 3/64 pilot (14.1 px) and 60 deg countersink to about Ø.08
       at the stub's end (the op's), to scale across. The pilot's length and
       the body's Ø are not on record: the pilot drawn .04 long (its point .017 inside the stub, short of Z0) and the body
       at the countersink's Ø.08, schematic, to a break line. -->
