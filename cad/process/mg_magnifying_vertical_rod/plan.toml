[[setups.operations]]
cut_kind = "other"
instruction = "Blank under {{cad.step_dia_min_in:.4dot}}: scrap the blank and make another from Setup 1. Over {{cad.step_dia_max_in:.4dot}}: another light pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Withdraw the tailstock. Face the stub off in light skims, from the O.D. to the centre, down to Z0: the centre hole goes with it."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: read the thread blank from the tip to the shoulder face with the calipers' depth rod: the beam's end on the tip, the rod down beside the blank onto the shoulder face."
inspection = "Tip to shoulder {{cad.thread_length_min_in:.2dot}}–{{cad.thread_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thread_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Tip to shoulder over {{cad.thread_length_max_in:.2dot}}: face the tip back as Op 100 in light skims, reading again as Op 110. Under {{cad.thread_length_min_in:.2dot}}: scrap the blank and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Chamfer the tip 45° to the minor (the drawing's TO MINOR Ø, the #4-40 basic minor Ø{{process.tip_chamfer_minor_in:.3dot}}): swing the compound to 45°, bring the AR tool's point to the tip's O.D. corner and feed it in along the compound in light cuts until the flat left on the tip reads Ø{{process.tip_chamfer_minor_in:.3dot}} across with the calipers' jaw tips. The die starts on this chamfer."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, in low range: take the dead centre out of the quill and bring the tailstock up. Put the #4-40 die in the die stock, lettered face toward the tip, and square its back against the quill's face."

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Start the die on the chamfer, turning the die stock by hand, dry, a half turn forward and a quarter back, the quill following; run it on until it stops at the shoulder, then back it off."
diagram = { file = "diagrams/tip-die.svg", alt = "The 13/16 #4-40 die in its die stock started on the tip's chamfer, the tailstock quill's face square on its back, following it." }
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Turn the die over (lettered face toward the shoulder) and run it on again to the shoulder the same way, so its lead's incomplete threads end in the relief. Back it off and back the tailstock away."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "part"
drilling = "none"
sizing = "other"
instruction = "Relief with the {{process.blade_width_in:.4dot}} cutoff blade (mike its width: {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}}), on centre height and square to the axis. Spindle stopped: bring the blade's chuck-side face on the shoulder face, just gripping a cigarette paper, and lock the carriage there. Zero the cross-slide dial with the blade's tip touching the thread's crest. Spindle on: plunge (the miked blank − {{process.relief_aim_dia_in:.3dot}})/2 in on the radius, to a floor about Ø{{process.relief_aim_dia_in:.3dot}}; back out for chips."
diagram = { file = "diagrams/tip-relief.svg", alt = "To scale: the 1/16 cutoff blade's chuck-side face on the shoulder, plunged to the relief's Ø.068 floor." }
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: read the relief's floor with the calipers' jaw tips and run a MHA-MG-VN-52 #4-40 nut (McMaster 92671A005) on by hand to the relief."
inspection = "Relief Ø{{cad.groove_dia_max_in:.3dot}} max, the blade's {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide; the nut runs on by hand to the relief."
gauge_checks = [{ gauge = "calipers", band_mm = [0.0, "{{cad.groove_dia_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Relief floor over {{cad.groove_dia_max_in:.3dot}}: plunge again as Op 170, .001 deeper on the radius (the floor .002 smaller). A nut that binds: close the split die a little with its adjusting screw and run it over once more as Ops 150–160; still binding: scrap the blank and make another from Setup 1."

[[setups]]
machine_kind = "lathe"
title = "Trial offcut: set the ball turner's radius"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over the brass shim wrap on the trial offcut, {{process.end_stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the offcut's end, faced in Op 200, touched with the ball turner's tip in Op 240."
diagram = { file = "diagrams/trial.svg", alt = "The trial offcut in the 3-jaw over the shim wrap, its end faced; the ball turner's pivot on the axis one radius behind the faced end, its bit swept from the apex toward you." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the offcut's end square, about .02 off, to the centre with no pip."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound swung to 45°: with the AR tool's point on the faced end's corner, feed the compound in to rough the corner off, a 45° chamfer {{process.dome_chamfer_in:.3dot}} along the face and along the O.D. It stays outside the dome (a {{cad.dome_far_form_chamfer_max_in:.3dot}} leg would touch it)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: clamp the ball turner's 3/8 shank in an AXA No. 1 holder, the inner frame swung parallel to the spindle axis. Set the bit's tip level with the tailstock dead centre's point. Take the centre out and run the tailstock back: nothing may stand within 4 in beyond the faced end."

[[setups.operations]]
cut_kind = "other"
instruction = "Set the bit to the bar's radius, about R{{cad.dome_far_form_radius_in:.3dot}}: lay a 1-2-3 block's ground edge across the inner frame's edges and read the bit's tip from it with the calipers' depth rod: {{process.ball_turner_rule_in:.4dot}} (the radius plus the maker's 3/16 from the frame's end to the pivot). Tighten the bit's set screw."

[[setups.operations]]
cut_kind = "other"
instruction = "Inner frame parallel to the axis: bring the carriage up until the bit's tip just touches the faced end; lock the carriage and zero the DRO Z. The pivot is now one radius behind the faced plane, so the apex stays on it. The carriage stays locked until the dome is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: run the cross slide out until the bit clears the end through the whole sweep. Swing the frame through the sweep and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms (they reach .19 either side of the pivot). Any touch: the offcut stands short; chuck it again {{process.end_stickout_in:.2dot}} in out of the jaw fronts on the rule and repeat from Op 200."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the corner somewhere in the sweep. Sweep the frame from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes: the pivot is then on the axis. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: look at the trial dome under the loupe and draw a fingernail over where it meets the bar."
inspection = "R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}} tangent hemisphere: no step or ridge where it meets the bar (it is then the bar's own radius, inside the band on any bar the stock allows); no pip, flat or ring at the apex."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A step where it meets the bar (too round): loosen the bit's set screw and set the tip .005 further out on the depth rod; a ridge there (too flat): .005 further in; tighten. Draw the offcut out to {{process.end_stickout_in:.2dot}} in again, face the dome off (Op 200), chamfer (Op 210), then repeat Ops 240–280. Under .30 in left in the jaws: saw a new trial offcut. Once it passes, leave the set screw alone until the rod's dome is cut."

[[setups]]
machine_kind = "lathe"
title = "Dome end: face to the body length, form its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap on the body, the dome end's faced plane {{process.end_stickout_in:.2dot}} in out of the jaws (the sawn end about .10 beyond it); the threaded end back through the jaws into the spindle bore."
datum = "The body length is read from the shoulder face with the calipers (Op 310). For the dome the DRO Z is zeroed with the ball turner's tip on the faced end in Op 340."
diagram = { file = "diagrams/dome.svg", alt = "The rod turned round, the dome end out over a shim wrap: faced to the 4.92 body length, its corner chamfered, then the R.13 dome swept by the ball turner, its pivot one radius behind the faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square in light skims toward {{cad.shoulder_in:.2dot}} from the shoulder face, reading the length between them (Op 310); stop inside {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, stop the spindle and take the rod out: read from the shoulder face to the faced end with the calipers, one jaw on the faced end, the other over the thread against the shoulder face; chuck it again over the shim and touch the facing tool on the end before the next skim."
inspection = "Shoulder to faced end {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.shoulder_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Faced under {{cad.shoulder_min_in:.2dot}}: scrap the rod and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound at 45°: rough the dome end's corner off as Op 210, a 45° chamfer {{process.dome_chamfer_in:.3dot}} along the face and along the O.D."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Ball turner in its holder, bit as set in Op 230 (set screw untouched), inner frame parallel to the axis: bring the carriage up until the tip just touches the faced end; lock the carriage and zero the DRO Z. It stays locked until the dome is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: cross slide out until the bit clears the end through the whole sweep. Swing the frame through it and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms. Any touch: unlock the carriage, chuck the rod again with the faced plane {{process.end_stickout_in:.2dot}} in out of the jaw fronts on the rule and repeat from Op 340."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the chamfer somewhere in the sweep. Sweep from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: look at the dome under the loupe and draw a fingernail over where it meets the body."
inspection = "No pip, flat or ring at the apex; no step or ridge where the dome meets the body."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A flat at the apex: the pivot is short of the axis: one more sweep with the cross slide in .001 (Op 360), then Op 380 again. A ring or point at the apex, or a step or ridge at the body: scrap the rod and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Read from the shoulder face to the dome's apex as Op 310, the faced-end jaw now on the apex."
inspection = "Shoulder to apex {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.shoulder_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Under {{cad.shoulder_min_in:.2dot}}: a carriage moved during a sweep: scrap the rod and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, bag"
machine = "Bench"
holding = "In the hand; the bench vise with soft jaws over the shim wrap on the body if needed."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished rod: the #4-40 thread, the relief, the 1/4 body and the R.13 dome." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the shoulder's outer edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the body's O.D., the thread and the dome untouched."
feed = "hand"

[[setups.operations]]
instruction = "Bag the rod (FINISH: machined)."
