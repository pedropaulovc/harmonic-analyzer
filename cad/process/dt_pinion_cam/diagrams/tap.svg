<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 7 px/mm. Left: a section at the hole (X 4.100, cad.set_screw_tap_station_mm), seen from the jaws' right ends looking −X, so +Y (the fixed jaw) is to the right and +X comes out of the page toward you. The cam on the inner top edges of the two 1 in parallels, 1/8 thick, one against each jaw (process.parallel_height_mm, process.parallel_thickness_mm), its O.D. axis 6.023 mm over their tops (process.cross_axis_height_mm); the jaw tops 6.223 mm over Z0 (process.cross_jaw_top_mm); the bore Ø.2510 (cad.bore_dia_mm) 2.000 below the O.D.'s centre (thick wall up). The 1/4 orienting shank is out of the bore (op 200). The jaws' thickness and the bed are schematic. Right (the #50 picture): from the front (looking +Y, +X right), face F (X0) LEFT, the rear face 6.35 mm in from the jaws' right ends (process.cross_jaw_end_mm); the fixed jaw and its parallel behind the cam, running on left to a break line; the balance cam at the jaws' left ends is off the picture and called out. The #2-56 plug tap to scale across its .086 major Ø (the #2-56 thread; its own sizes are not on record), its end square with the round cue, its point at the bore's axis (the noted Z less 9.30 mm, cad.set_screw_tap_into_axis_mm). The tap's length and the T-handle wrench are schematic (not on record). The Fisher tap guide from the shop record (tap-guide-fisher: 1/2 shank, 3/16 point), its spring point in the wrench's centre hole, in the 1/2 collet to a break line; the tap, the wrench and the guide in the tool colour. Spindle off. The front view is in the #50 picture. -->
