<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), a section through the axis, to scale at 200 px/in: the 5/8 bar (process.bar_dia_in) 1.25 out of the jaw fronts (process.stickout_mm), Z0 face F, the faced end. The 3-jaw's body and jaws are schematic (their sizes are not on record). The bar runs on into the chuck to a break line. The O.D. turned to Ø.575 over 1.00 (cad.cam_od_dia_in, process.turn_length_in). The P1 blade to scale across (shop cutoff-blade-p1, 1/16 = 12.5 px), its near (tailstock-side) face .350 from F (cad.cam_od_length_in), cut in near the centre; its length runs on to a break line. Hatched: the kerf. -->
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 1, Op 40: the P1 blade parts the first cam off, its near side .350 from face F (to scale, 200 px/in)</text>
  <rect class="fixture-vise" x="250" y="71.5" width="56" height="217"/>
  <path class="part-rest" d="M40 117.5L400 117.5L400 242.5L40 242.5L37 235.15L40 227.79L37 220.44L40 213.09L37 205.74L40 198.38L37 191.03L40 183.68L37 176.32L40 168.97L37 161.62L40 154.26L37 146.91L40 139.56L37 132.21L40 124.85Z"/>
  <rect class="part-rest" x="400" y="122.5" width="117.5" height="115"/>
  <rect class="part-removed" x="517.5" y="122.5" width="12.5" height="115"/>
  <rect class="part-kept" x="530" y="122.5" width="70" height="115"/>
  <rect class="clamp" x="306" y="83.5" width="46" height="34"/>
  <rect class="clamp" x="306" y="242.5" width="46" height="34"/>
  <line class="centre-line" x1="20" y1="180" x2="740" y2="180"/>
  <path class="cutter" d="M517.5 375L517.5 184L530 184L530 375L523.75 372Z"/>
  <line class="arrow" x1="550" y1="365" x2="550" y2="325"/>
  <line class="datum" x1="600" y1="50" x2="600" y2="84"/>
  <text class="datum-label" x="606" y="62">Z0: face F</text>
  <text class="label" x="507.5" y="330" text-anchor="end">P1 blade, its near side {{cad.cam_od_length_in:.3dot}} from F (depth rod);</text>
  <text class="label" x="507.5" y="346" text-anchor="end">let the cam fall: pick it up once the spindle has stopped</text>
  <text class="label" x="380" y="60">O.D. Ø{{cad.cam_od_dia_min_in:.3dot}}–{{cad.cam_od_dia_max_in:.3dot}}</text>
  <line class="leader" x1="420" y1="66" x2="560" y2="122.5"/>
  <circle class="leader-dot" cx="560" cy="122.5" r="2"/>
  <text class="label" x="100" y="60">the second cam comes from here (Ops 50–70)</text>
  <line class="leader" x1="200" y1="66" x2="450" y2="122.5"/>
  <circle class="leader-dot" cx="450" cy="122.5" r="2"/>
</svg>
