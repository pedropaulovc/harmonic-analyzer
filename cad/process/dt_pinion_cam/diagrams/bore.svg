<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 10 px/mm. Left: a section at Y0 seen from the front (looking +Y, +X to the right): the cam upright, face F down on the two 1.5 in stacks (a 1 in parallel under a 1/2 in, both 1/8 thick; process.riser_height_mm), the rear face up at Z0, its lower 6.845 mm in the jaws (process.bore_grip_mm); the fixed jaw and its stack behind the cut, the moving jaw and its stack in front of it (not drawn: they would hide the cam). The bore at X+2.000 (cad.bore_eccentricity_mm) runs out into the 8.25 mm gap between the stacks (process.bore_parallel_gap_mm). The jaw and the stack run on past the picture and down to break lines. Right, 7 px/mm: from above (+X right, +Y toward the fixed jaw up), the stacks dashed under the cam, the tool's circle at the bore. In the left section the stacks are dashed too: they stand behind and in front of the cut plane, clear of the bore, which runs out into the gap between them. The C drill (shop drill-c, Ø6.147 mm) at X 2.000 Y0, its point at Z-11.847, CM01's posted depth: its full diameter 1.0 mm (process.drill_past_mm) past face F, in the gap; it runs up to a break line. The T1 centre drill's spot under it is not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 2, CM01 T2: the C drill through the cam at X+2.000, its point at Z-11.847, into the gap (10 px/mm)</text>
