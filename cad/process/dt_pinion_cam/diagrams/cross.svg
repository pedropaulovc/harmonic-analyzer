<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 7 px/mm. Left: a section at the hole (X 4.100, cad.set_screw_tap_station_mm), seen from the jaws' right ends looking −X, so +Y (the fixed jaw) is to the right and +X comes out of the page toward you. The cam on the inner top edges of the two 1 in parallels, 1/8 thick, one against each jaw (process.parallel_height_mm, process.parallel_thickness_mm), its O.D. axis 6.023 mm over their tops (process.cross_axis_height_mm); the jaw tops 6.223 mm over Z0 (process.cross_jaw_top_mm); the bore Ø.2510 (cad.bore_dia_mm) 2.000 below the O.D.'s centre (thick wall up). The 1/4 orienting shank is out of the bore (op 200). The jaws' thickness and the bed are schematic. Right (the #50 picture): from the front (looking +Y, +X right), face F (X0) LEFT, the rear face 6.35 mm in from the jaws' right ends (process.cross_jaw_end_mm); the fixed jaw and its parallel behind the cam, running on left to a break line; the balance cam at the jaws' left ends is off the picture and called out. The #50 drill (shop drill-50, Ø1.778 mm) on Y0 at X 4.100, its point at Z-9.834, CM02's posted depth: its full diameter at the bore's axis, 9.30 mm below the top line (cad.set_screw_tap_into_axis_mm); it runs up to a break line. The T1 centre drill's spot is under it and not drawn. -->
