[[setups]]
machine_kind = "other"
title = "Ream the eccentric bore"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2f}} tall above its seat; check with the calipers before loading). A 1 in parallel with a 1/2 in parallel on it, both 1/8 in thick, against each jaw (1.5 in stacks). The cam upright on both stacks, face F DOWN, gripped on its O.D., centred on the jaws: its lower {{process.bore_grip_mm:in.3dot}} is in the jaws, its rear face stands above the jaw tops. Tap it down onto both stacks while closing the vise. Under the bore the {{process.bore_parallel_gap_mm:in.3dot}} gap between the stacks: the bore is offset ALONG the jaws, so the drill and reamer run out into that gap. Before Cycle Start look under the cam from the side: both stacks against the jaws, the gap clear."
datum = "Program CM01_bore (cam:dt_pinion_cam). G54: X0 Y0 the O.D. axis, Z0 the rear face; +Y toward the fixed jaw; the bore at X+{{cad.bore_eccentricity_mm:.3f}} mm ({{cad.bore_eccentricity_in:.3dot}} in). Tool lengths from the tool setter at each M6."
diagram = { file = "diagrams/bore.svg", alt = "The cam upright on two parallel stacks in the vise; the centre drill, C drill and .2510 reamer go through it {{cad.bore_eccentricity_in:.3dot}} off its axis along the jaws." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.cam_od_dia_mm}}", along_jaws_mm = "{{cad.cam_od_dia_mm}}", part_height_mm = "{{cad.envelope_z_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = [-72.0369, "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "rod" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.envelope_z_mm}}"], clamp_mm = [0, "{{process.bore_grip_mm}}"], section_mm = { diameter = "{{cad.cam_od_dia_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Start only with the .2510 reamer (to order) and an MHA-DT-17 rod (or a length of its 1/4 ground stock) in hand. Mike each cam's O.D. and write it on a tag with the cam."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0: the O.D. axis, half the miked O.D. from the fixed jaw. X0: the O.D. axis, midway between its left and right sides at Y0."
instruction_detailed = "Edge finder (900 rpm) on the fixed jaw's face beside the cam: G10 L20 P1 Y(half your O.D. reading in mm − 2.540); for .575, Y4.763. MDI G0 Y0. Edge finder down beside the O.D. between the jaws, on the LEFT side from the left: G10 L20 P1 X0. On the RIGHT side from the right: G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the rear face, the centre drill's point on a .002 feeler leaf at X-4.000 Y0, clear of the parting pip."
instruction_detailed = "Console M6 T1 (#2 centre drill; the tool setter measures it). MDI G0 X-4.000 Y0 (on the flat rear face, clear of the parting pip at the axis). Spindle stopped, its point just dragging a .002 leaf there: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First cam only: prove CM01_bore in air, Z0 raised 1.000 in. Then Z0 back."
