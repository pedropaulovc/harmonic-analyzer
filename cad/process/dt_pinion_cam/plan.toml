# Pinion eccentric cam MHA-DT-23 (qty 2), from 5/8 in round 1018 CF.
# Route, chosen for speed (owner ruling 2026-11-21: the agent picks the
# faster route and says why; the owner corrects afterwards):
# - Setup 1, PM-1127VF-LB lathe, 6 in 3-jaw, manual (turned setups get no NC,
#   owner 2026-11-21): one chucking makes both cams. Face, turn the Ø.575 O.D.
#   over both, break the edge, part off to length; face again, part off the
#   second. Parting to length removes a second facing chucking; the parting
#   pip sits inside the eccentric bore and is drilled away.
# - Setup 2, PM-30MV CNC, vise: the cam upright on its faced front face,
#   gripped on the turned O.D.; the fixed jaw and the edge finder locate the
#   O.D. axis and CM01 spots, drills C and reams .2510 through at the drawn
#   offset. The lathe was not chosen for the bore: the shop records only the
#   3-jaw (workholding.chuck-3jaw-6), so an offset bore there means shimming
#   a jaw by trial; on the mill the offset is a program coordinate.
# - Setup 3, PM-30MV, vise: the cam lying, thick side up, oriented by a 1/4
#   drill shank in the bore and the edge finder; CM02 spots and drills #50
#   into the bore, CM03 brings the tap guide over it for hand tapping #2-56
#   (FluidNC cannot rigid-tap; as mg_magnifying_clamp). No drill press is
#   recorded in the shop.
# - Setup 4, bench: deburr, inspect (eccentricity over the 1/4 drill's
#   shank on the height gauge, with the shank's miked reading), oil, bag the
#   set screw.
# To order before Setup 2 runs: the .2510 reamer (tools.reamer-2510, owner
# ruling #3073 buys fixed reamers for running fits). The bore prints no band
# and the MHA-DT-17 rod sliding in by hand accepts it (drawing-guidelines
# rule 4, form 3; fit audit F19: ".2510 REAM THRU; MHA-DT-17 ROD SLIDES IN BY
# HAND"); the Class ZZ pins zz-pins-2510-2515 are not used. No V-blocks or
# setting mandrel are used.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "remove mention of dead centre ; use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (CM03).
#
# NC (cam:dt_pinion_cam, cad/process/dt_pinion_cam/cam.py): CM01_bore,
# CM02_set_screw, CM03_set_screw_tap. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 centre drill, T2 C
# drill, T3 .2510 reamer, T4 #50 drill, T5 the tap guide.
title = "Pinion eccentric cam"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 5/8 in round (drawing: {{cad.material_spec}})"
stock = "{{process.bar_dia_in:fraction}} in round bar: saw one piece {{process.bar_length_min_in:.2f}}–3.00 in long off it, which makes both cams ({{process.quantity:d}} off); never chuck the whole bar (it would run out past the spindle's rear end)."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished Ø{{cad.cam_od_dia_min_in:.3dot}}–{{cad.cam_od_dia_max_in:.3dot}} × {{cad.cam_od_length_min_in:.3dot}}–{{cad.cam_od_length_max_in:.3dot}} long; the bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}} {{cad.bore_eccentricity_min_in:.3dot}}–{{cad.bore_eccentricity_max_in:.3dot}} off the O.D. axis (thin wall {{cad.bore_thin_wall_min_mm:in.4dot}} min); the #2-56 set-screw hole opposite the thin side, {{cad.set_screw_tap_station_min_in:.3dot}}–{{cad.set_screw_tap_station_max_in:.3dot}} from the front face. Mill speeds on the PM-30MV low belt (100–2800 rpm). Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Every file is proved in air on the first cam. Edges: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
shop = "../shop"
stock_refs = ["1018-round-5-8"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_pinion_cam/features.toml"
adapter = "drilled_block"
part = "dt-pinion-cam"

[parameters]
quantity = 2
bar_dia_in = 0.625
# Both cams from one chucking: two lengths, two parting cuts, a .010 face
# and the 3-jaw's grip, rounded up.
bar_length_min_in = 2.0
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
# Stick-out for both cams: 2 × .354 + two P1 blade widths + the first face's
# .010 (.843), plus room for the blade to clear the jaws: 1.25 in.
stickout_mm = 31.75
turn_length_in = 1.0
# The blank a cam is cut from (stock_fit: envelope X, Y, Z).
blank_x_in = 0.625
blank_y_in = 0.625
blank_z_in = 0.36
# Turning (A R Warner AR holder, TCMT insert, R0.4 nose, carbide):
# LittleMachineShop "Cutting Speeds" (read 2026-11-20), turning plain carbon
# steels with carbide well over 300 ft/min; 1200 rpm on Ø.625 is 196 ft/min,
# the author's choice for a hobby lathe. Finish pass .002 in/rev: R.016 nose,
# theoretical Ra = f²/(32 r) = 8 µin, under the O.D.'s 63.
turn_rpm = 1200
part_rpm = 400
# CM01: the cam upright on its front face on the 1 in and 1/2 in parallels
# stacked against each jaw (1.5 in), so its rear face stands above the jaw
# tops; the jaws grip the O.D. over the jaw height less the stack.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
bore_grip_mm = 6.8453
# Gap between the two stacks under the cam (O.D. less two parallels): the
# drill and reamer run out into it.
bore_parallel_gap_mm = 8.25
# Bore: spot Ø.160 with the #2 centre drill (under the C drill, no chamfer
# at the mouth), C (.242) through in one feed (L/D 1.5), its
# full diameter 1.0 mm past the front face; then the .2510 reamer through,
# 1.5 mm past it (its 45° lead), fed in and fed out with the spindle running.
bore_spot_dia_mm = 4.064
drill_past_mm = 1.0
ream_past_mm = 1.5
# Tips below the rear face (Z0): the C drill's 9.0 + 1.0 + its 118° point
# 1.847; the reamer 9.0 + 1.5. cam.py checks both.
bore_drill_tip_mm = -11.847
bore_ream_tip_mm = -10.5
# CM02: lying, axis along the jaws, the O.D. on the 1 in parallels' inner
# top edges (gap 8.25): the axis 6.023 above their tops, the jaw tops 6.222
# above the O.D.'s top line (Z0). The rear face .25 in from the jaws' right
# ends, so the orienting shank stands out past them.
cross_axis_height_mm = 6.0228
cross_jaw_top_mm = 6.2225
cross_jaw_end_mm = 6.35
# Set-screw hole: spot Ø.063 with the centre drill's pilot point only (its
# 5/64 pilot is over the #50), then #50 in pecks of .040 with full retracts,
# its full diameter to the bore's axis; its point 0.534 below that.
tap_spot_dia_mm = 1.6002
peck_50_mm = 1.016
tap_drill_tip_mm = -9.834
# That tip below the jaw tops (6.2225 + 9.834): the jobber #50 must stand out
# of its chuck further than this. cam.py checks it.
tap_tip_below_jaw_top_mm = 16.057
# Setup 3 orientation: the set-screw hole is drawn at 180° from the thin
# side under the title block's ±1°. Turning the cam about its O.D. axis
# moves the bore's axis sideways by eccentricity × tan(angle), so the shank
# in the bore may sit at most 2.0 × tan 1° = 0.0349 mm off Y0. cam.py
# computes it from the export. The shank rests on the bore's bottom under
# gravity, so its .001–.0015 in clearance goes into Z, not Y; what is left
# is the edge finder's repeatability (.0002 in, 0.005 mm, the usual figure
# for a mechanical edge finder at 900 rpm; not measured in this shop), well
# inside the band.
orient_band_mm = 0.0349
# Speeds and feeds, authored in the operations: LittleMachineShop "Cutting
# Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003 in/rev,
# a size between two columns taking the lower one's feed. Centre drill 1800
# rpm × .001 = 1.8 in/min (the column clamp's spot); C 1000 rpm (63 ft/min) ×
# .003 = 3.0 in/min; the reamer at 400 rpm (26 ft/min, under half the
# drilling speed, the author's choice) × .004 = 1.6 in/min; the pilot spot and
# #50 at the spindle's 2800 (51 ft/min on the #50) × .001 = 2.8 in/min.
bore_spot_feed_per_min_mm = 45.72
drill_c_feed_per_min_mm = 76.2
ream_feed_per_min_mm = 40.64
tap_spot_feed_per_min_mm = 71.12
drill_50_feed_per_min_mm = 71.12
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (431.8) less 25.0 to bring the
# point down onto the wrench, the vise bed (73.304), the 1 in parallels, the
# cam's top above them (13.323) and the collet gauge (6.3): 288.47, rounded
# down to .01 in. cam.py recomputes it. The guide is 3 1/8 in (79.375)
# overall, its sellers' size and the most it can stand below the collet
# face; the tap's reach in its wrench is not on record, so the traveler stops
# before the tap file unless the tap, point to the wrench's centre hole, is
# at most tap_wrench_reach_max_mm: 288.29 less 79.375, 208.915, rounded down
# to .01 in.
tap_stack_max_mm = 288.29
tap_wrench_reach_max_mm = 208.78

