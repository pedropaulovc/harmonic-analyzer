[[setups]]
machine_kind = "other"
title = "Drill and tap the set-screw hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2f}} tall above its seat). A 1 in parallel, 1/8 in thick, against each jaw. The cam lying along the jaws, face F to the LEFT, its rear face {{process.cross_jaw_end_mm:in.2f}} in from the jaws' RIGHT ends, its O.D. on the parallels' inner top edges, the bore BELOW the O.D.'s centre (thick wall up). A 1/4 in drill from the 115-piece index, shank first, in the bore from the right, standing out past the jaw ends. The other cam (or, for the second, the finished first) lies the same way at the jaws' LEFT ends as the balance, so the jaws close square. Snug the vise (ops 180–200 orient it)."
datum = "Programs CM02_set_screw and CM03_set_screw_tap. G54: X0 face F, +X toward the rear face; Y0 the O.D. axis; Z0 the O.D.'s top line. Tool lengths from the tool setter at each M6; every move between holes runs above the jaw tops, which stand {{process.cross_jaw_top_mm:in.3dot}} above Z0."
diagram = { file = "diagrams/cross.svg", alt = "The cam lying in the vise on the parallels' edges, thick side up, a drill shank in the bore; the #50 drills down from the top {{cad.set_screw_tap_station_in:.2dot}} from face F into the bore." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.cam_od_dia_mm}}", along_jaws_mm = "{{cad.envelope_z_mm}}", part_height_mm = "{{cad.cam_od_dia_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-143.3238, "rest"], jaw_offset = "balanced", balance = "twin_part", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "rod" }
beam = { axis = "x", hold = "solid", extent_mm = [0, "{{cad.envelope_z_mm}}"], seat = "gripped full length across the O.D. in the vise jaws, on the parallels' edges", seat_mm = [0, "{{cad.envelope_z_mm}}"] }

[[setups.operations]]
instruction = "G54 Y0: the O.D. axis, half the miked O.D. from the fixed jaw, as Setup 2."
instruction_detailed = "Edge finder (900 rpm) on the fixed jaw's face: G10 L20 P1 Y(half your O.D. reading in mm − 2.540)."
feed = "hand"

[[setups.operations]]
instruction = "Orient: the shank resting on the bore's bottom (do not lift it), edge-find its −Y and +Y sides past the jaws' right ends and average the two DRO Y readings."
feed = "hand"

[[setups.operations]]
instruction = "Average more than {{process.orient_band_mm:.3f}} mm from 0: loosen, turn the cam a touch by the shank (0.035 mm of shank movement is 1° of turn), snug, and repeat op 180."
feed = "hand"

[[setups.operations]]
instruction = "Average inside: tighten the vise, touch both sides once more, then pull the shank out of the bore."
inspection = "After tightening: the shank's average Y reading at most {{process.orient_band_mm:.3f}} mm from Y0, either side (the drawn 180° ±1° from the thin side, at the .079 eccentricity)."
gauge_checks = [{ gauge = "mill-y-dro", band_mm = [0.0, "{{process.orient_band_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "G54 X0: face F, the edge finder from the left on the face beside the bore at Y0. Z0: the O.D.'s top line, the centre drill on a .002 leaf at the hole's station."
instruction_detailed = "Edge finder on face F from the left, at Y0, below the O.D.'s top line: G10 L20 P1 X-2.540. Console M6 T1 (#2 centre drill). MDI G0 X{{cad.set_screw_tap_station_mm:.3f}} Y0. Spindle stopped, its point just dragging a .002 leaf on the O.D.'s top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First cam only: prove CM02_set_screw in air, Z0 raised 1.000 in. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400). Run CM02_set_screw through every M6, watching each move clear the jaw tops. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CM02_set_screw (M6 T1, centre drill; set 2800): spot Ø{{process.tap_spot_dia_mm:in.3dot}} with the pilot's point only, at X {{cad.set_screw_tap_station_mm:.3f}} mm on the top line."
rpm = 2800
feed = "{{process.tap_spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "tap spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.tap_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.tap_spot_feed_per_min_mm}}", stations_mm = "{{cad.set_screw_tap_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-50"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.set_screw_tap_dia_band_mm}}" }
instruction = "Same file, M6 T4: #50 down into the bore, its full diameter to the bore's axis ({{cad.set_screw_tap_into_axis_in:.3dot}} below the top line), pecks of {{process.peck_50_mm:in.3dot}} with full retract; set 2800. Tapmatic Gold. At least 1.00 out of the chuck: it reaches {{process.tap_tip_below_jaw_top_mm:in.2dot}} below the jaw tops."
rpm = 2800
feed = "{{process.drill_50_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{cad.set_screw_tap_into_axis_mm}}"
peck = { step_mm = 1.016, retract = "full" }
milling_cuts = [
  { name = "tap drill", kind = "drill", phase = "rough", cutter_dia_mm = 1.778, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_50_feed_per_min_mm}}", stations_mm = "{{cad.set_screw_tap_station_mm}}" },
]

[[setups.operations]]
instruction = "Stop check before the tap file: measure the 2-56 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, this cam, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run CM03_set_screw_tap: M6 T5, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the hole."
diagram = { file = "diagrams/tap.svg", alt = "The cam lying in the vise; the #2-56 tap in the T-handle wrench in the hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to reach the bore's axis." }

[[setups.operations]]
instruction = "Tap depth reference: with the tap's point standing on the top line beside the hole and the tap guide's point pushed fully home in the wrench, note the DRO's work Z (mm)."
instruction_detailed = "MDI G0 X7.000 (on the top line, beside the hole). Stand the tap in its wrench on its point there; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO's work Z. Jog Z up clear, MDI G0 X{{cad.set_screw_tap_station_mm:.3f}} Y0."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-2-56"
drilling = "none"
sizing = "other"
instruction = "Tap #2-56 by hand under the tap guide, spindle off, Tapmatic Gold: tap's point in the hole, jog Z down until the guide's point is pushed fully home, then turn the wrench, a half turn back each turn; the spring follows the tap. To read, push the point fully home again: stop at the noted Z less {{cad.set_screw_tap_into_axis_mm:.3f}} mm ({{cad.set_screw_tap_into_axis_in:.3dot}} in), the point at the bore's axis. A #2 tap breaks easily: stop at any rise in effort and back out."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, back the tap out, blow out the hole and the bore. Swap the two cams' positions: load the second cam at the jaws' RIGHT ends per Setup 3 Holding (face F LEFT, rear face .25 from the jaw ends, bore below centre, the 1/4 shank back in the bore), the drilled cam at the LEFT ends as the balance; then repeat from op 170 in order: its own Y0 from its O.D., orient it, then its X0 and Z0."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect, oil"
machine = "Bench, surface plate"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The cam lying on the surface plate, thick side down, the 1/4 drill's shank in the bore; the height gauge reads over the shank to give the eccentricity." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr both bore mouths, the hole's mouth on the O.D. and the rear face's parted edge (scraper and smooth file), to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Turn the .2510 reamer through the bore by hand in a tap wrench to clear the #50's breakthrough burr. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Length and O.D. were accepted on the lathe. Eccentricity: mike the 1/4 drill's shank (Setup 3's) as R and lay the cam on the surface plate on its O.D. with the shank in the bore; hold it on the plate by hand, roll it slowly and read the highest point H over the shank with the height gauge. Eccentricity = H − O.D./2 − R/2 (the shank's shake in the bore reads up to .0012 low)."
feed = "hand"
inspection = "Eccentricity {{cad.bore_eccentricity_min_in:.3dot}}–{{cad.bore_eccentricity_max_in:.3dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.bore_eccentricity_band_mm}}" }]

[[setups.operations]]
instruction = "Thin wall from that eccentricity: O.D./2 − eccentricity − {{cad.bore_dia_max_in:.4dot}}/2 (the reamed bore's largest, fit audit F19: no pins)."
feed = "hand"
inspection = "Thin wall at least {{cad.bore_thin_wall_min_mm:in.4dot}}."
gauge_checks = "other"

[[setups.operations]]
instruction = "Set-screw hole: station from face F {{cad.set_screw_tap_station_min_in:.3dot}}–{{cad.set_screw_tap_station_max_in:.3dot}} (calipers from face F over the #50's shank in the hole, less half the miked shank); the hole on the thick side, opposite the bore offset; a #2-56 screw runs in by hand to the bore."
feed = "hand"
inspection = "Station {{cad.set_screw_tap_station_min_in:.3dot}}–{{cad.set_screw_tap_station_max_in:.3dot}} from face F."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.set_screw_tap_station_band_mm}}" }]

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil, into the tapped hole. Bag each cam with one ASME B18.3 #2-56 × 3/16 flat-point socket set screw, loose (drawing note 1)."
feed = "hand"
