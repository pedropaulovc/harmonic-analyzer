<!-- The 1/2 in brass bar in the 3-jaw: face, turn the outside, centre, drill #31, ream .1260, part off at length. Drawn once by prechips.bush_diagrams and kept as a picture: the template labels the reamed bore with a size band, and the drawing prints none (fit audit 2026-11-23). Not to scale after a model change; its sizes are bound. -->
