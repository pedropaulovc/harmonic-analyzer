<?xml version="1.0" encoding="UTF-8"?>
<!-- Setup 4: the stick on its tape from above, two stretches at 10 px/mm (left X-150..-124, right X-22..0), ticks and numerals as MS03 and MS04 cut them; lower right: the groove in section at 200 px/mm; upper right: T2 from the side at 6 px/mm. +X right, +Y up (rear). T2, the ESAO 30° V engraving bit (shop tools.engravers-esao-30-0-1, 32.45 long), is drawn at MS03's first tick, the 0 tick, at its full depth: from above its 1/8 in shank Ø3.175 (shank_mm) = 31.75 px; in the section its 30° V (included_angle_deg) and 0.1 mm flat tip (engraver_tip_mm; 20 px) at the tick's depth, .030 (tick_depth_mm; 152.4 px), the face .020 wide (tick_width_mm; 101.7 px), broken off above the face; from the side, 15.24 mm out of the 1/8 collet (engraver_projection_mm; 91.4 px), the shank 19.05 px wide, its V 5.74 mm long (the 3.175 shank less the 0.1 tip, over 2 tan 15°; 34.4 px), the collet broken off above. Hand-drawn; styles: prechips.palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="820" height="450" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <text class="title" x="12" y="20">Setup 4: graduations MS03 and numerals MS04 (from above; two stretches of the stick)</text>
  <!-- Fixture bar top under the stick: Y-12.7..0 is 127 px; the stick Y-8.763..-0.762. -->
  <rect class="fixture-plate" x="20" y="102" width="700" height="127"/>
  <rect class="part-kept" x="40" y="110" width="260" height="80"/>
  <rect class="part-kept" x="470" y="110" width="220" height="80"/>
  <rect class="paper" x="300" y="103" width="170" height="125"/>
  <path class="dims" d="M300 96 L306 122 L294 152 L306 182 L300 236 M470 96 L476 122 L464 152 L476 182 L470 236"/>
  <text class="label" x="322" y="150">ticks 1.5 to 8.6</text>
  <text class="label" x="322" y="166">left out</text>
  <rect class="part-removed" x="83.2" y="159.5" width="5" height="30.5"/>
  <rect class="part-removed" x="97.4" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="111.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="125.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="140.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="154.2" y="149.4" width="5" height="40.6"/>
  <rect class="part-removed" x="168.4" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="182.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="196.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="211.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="225.2" y="159.5" width="5" height="30.5"/>
  <rect class="part-removed" x="239.4" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="253.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="267.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="282.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="468.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="482.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="497.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="511.2" y="159.5" width="5" height="30.5"/>
  <rect class="part-removed" x="525.4" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="539.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="553.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="568.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="582.2" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="596.4" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="610.6" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="624.8" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="639.0" y="172.2" width="5" height="17.8"/>
  <rect class="part-removed" x="653.2" y="159.5" width="5" height="30.5"/>
  <text class="label" font-size="20" text-anchor="middle" transform="translate(96.2,141) rotate(90)">0</text>
  <text class="label" font-size="20" text-anchor="middle" transform="translate(238.2,141) rotate(90)">1</text>
  <text class="label" font-size="20" text-anchor="middle" transform="translate(524.2,141) rotate(90)">9</text>
  <text class="label" font-size="20" text-anchor="middle" transform="translate(631.2,141) rotate(90)">10</text>
  <!-- Datums. -->
  <line class="datum" x1="690" y1="70" x2="690" y2="240"/>
  <text class="datum-label" x="560" y="64">X0: the milled DATUM END</text>
  <line class="datum" x1="40" y1="110" x2="300" y2="110"/>
  <text class="label" x="44" y="94">PLAIN EDGE (rear)</text>
  <text class="label" x="200" y="250">RULED EDGE (toward you)</text>
  <line class="arrow" x1="85.7" y1="222" x2="85.7" y2="196"/>
  <path class="leader" d="M85.7 228 L85.7 262"/>
  <text class="label" x="30" y="278">0 tick: X−{{cad.graduations_zero_station_mm:.3f}}</text>
  <text class="label" x="30" y="294">({{cad.graduations_zero_station_in:.3f}} from the datum end)</text>
  <path class="leader" d="M156.7 150 L200 84"/>
  <text class="label" x="180" y="78">the one half-division tick, {{cad.graduations_half_length_in:.2dot}} long</text>
  <path class="leader" d="M655.7 190 L648 250"/>
  <text class="label" x="590" y="264">10 tick: X−{{cad.graduations_ten_station_ref_mm:.3f}}</text>
  <text class="label" x="30" y="330">every tick starts off the RULED EDGE</text>
  <!-- T2 on the 0 tick, half way along it. -->
  <circle class="cutter" cx="85.7" cy="175" r="15.9"/>
  <text class="label-halo" x="106" y="220">T2 on the 0 tick (MS03's first)</text>
  <!-- Upper right: T2 from the side, 6 px/mm. Collet face at y 92; the shank x 760.5..779.5 down to y 149; its V to the tip at y 183.4 (0.6 px wide). -->
  <path class="cutter" d="M752 92 L752 76 L758 72 L764 78 L770 72 L776 78 L782 72 L788 76 L788 92 Z"/>
  <path class="cutter" d="M760.5 92 L760.5 149 L769.7 183.4 L770.3 183.4 L779.5 149 L779.5 92 Z"/>
  <path class="dims" d="M792 92 L806 92 M792 183.4 L806 183.4 M800 92 L800 183.4"/>
  <text class="label" x="732" y="204" font-size="11">T2 from the side:</text>
  <text class="label" x="732" y="218" font-size="11">{{process.engraver_projection_mm:in.2f}} in out of</text>
  <text class="label" x="732" y="232" font-size="11">the 1/8 collet</text>
  <text class="label" x="30" y="346">and runs toward +Y</text>
  <text class="label" x="30" y="370">long ticks {{cad.graduations_full_length_in:.2dot}}, short ticks {{cad.graduations_minor_length_in:.2dot}},</text>
  <text class="label" x="30" y="386">{{cad.graduations_minor_pitch_in:.4dot}} apart</text>
  <text class="label" x="30" y="410">numerals read with the 10 end up</text>
  <text class="label" x="30" y="434">right: a tick's groove in section, much enlarged</text>
  <!-- Lower right: the groove in section, 200 px/mm. Face at y 290, width .020 (101.7 px, x 449.2..550.8), depth .030 (152.4 px, tip at y 442.4), tip 0.1 mm (20 px, x 490..510). -->
  <rect class="section" x="400" y="290" width="200" height="156"/>
  <path class="paper" d="M449.2 290 L550.8 290 L510 442.4 L490 442.4 Z"/>
  <path class="dims" d="M449.2 290 L490 442.4 L510 442.4 L550.8 290"/>
  <path class="dims" d="M449.2 280 L449.2 256 M550.8 280 L550.8 256 M449.2 262 L550.8 262"/>
  <text class="label" x="454" y="252">{{process.tick_width_mm:in.3dot}} at the face</text>
  <!-- T2's V in the groove, its flat tip at the tick's depth; broken off 12 px above the face (half-width there 10 + 164.4 tan 15° = 54.1 px). -->
  <path class="cutter" d="M445.9 278 L490 442.4 L510 442.4 L554.1 278 L540.5 274 L513.5 282 L486.5 274 L459.5 282 L445.9 278 Z"/>
  <text class="label" x="438" y="276" text-anchor="end">T2, the V bit</text>
  <path class="dims" d="M557 290 L622 290 M514 442.4 L622 442.4 M614 290 L614 442.4"/>
  <text class="label" x="626" y="362">{{process.tick_depth_mm:in.3dot}} deep</text>
  <text class="label" x="626" y="378">(numerals {{process.numeral_depth_mm:in.3dot}})</text>
  <text class="label" x="626" y="410">30° V, {{process.engraver_tip_mm:.1f}} mm flat tip:</text>
  <text class="label" x="626" y="426">deeper = wider</text>
</svg>
