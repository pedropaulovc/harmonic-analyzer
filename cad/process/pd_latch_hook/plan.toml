[[setups.operations]]
instruction = "Console M6 T2 (1/4 in end mill, {{process.em_quarter_projection_min_mm:in.2dot}}–{{process.em_quarter_projection_max_mm:in.2dot}} out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the bare plate top in front of the blank: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

# The channel first, all five levels: a slot along the inner half's face,
# then a pass along the outer half's face, each run in from past the blank's
# end; then each half cut round at each level (back edge, ends, face) from a
# lead-in past the blank's end along its back edge.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-quarter"
drilling = "none"
sizing = "other"
instruction = "Run HL02_former (M6 T2: set 2800, then Cycle Start; about 25 min). It cuts the channel between the two faces the blank's whole length, five levels down to {{process.die_tip_z_mm:in.3dot}} into the plate, then cuts each half round: its back edge, ends and face. Dry: blow the chips out of the channel as it goes."
rpm = 2800
feed = "18.5 in/min"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.die_blank_width_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "outer die half", kind = "part", area_mm2 = "{{process.outer_die_bond_area_mm2}}", width_mm = "{{process.die_least_width_mm}}" }, { name = "inner die half", kind = "part", area_mm2 = "{{process.inner_die_bond_area_mm2}}", width_mm = "{{process.die_least_width_mm}}" }] } }
milling_cuts = [
  { name = "former", kind = "slot", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.die_cutter_dia_mm}}", flutes = 3, rpm = 2800, feed_mm_min = "{{process.former_feed_mm_min}}", axial_doc_mm = "{{process.die_level_depth_mm}}", radial_woc_mm = "{{process.die_cutter_dia_mm}}", traverse_mm = [0, "{{process.former_to_x_mm}}"] },
]

