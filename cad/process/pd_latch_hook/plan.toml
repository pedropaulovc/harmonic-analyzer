[[setups.operations]]
instruction = "Spoil plate in the vise as in Setup 2 (the parallels, the fixed jaw, centred); G54 X and Y with the edge finder the same way."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Degrease the plate top and one broad face of the die blank with isopropyl alcohol. Tape the plate's whole top, strips along the jaws, butted; tape the blank's face the same, trimmed flush." },
  { kind = "action", text = "With the square and a marker, mark on the plate's tape the blank's back edge line {{process.die_blank_back_y_mm:in.3dot}} from the fixed jaw." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
