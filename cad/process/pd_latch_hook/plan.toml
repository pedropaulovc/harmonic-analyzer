  { kind = "action", text = "Wait 5 minutes, then push the blank hard along and across with the heel of the hand: no movement, no creak." },
  { kind = "stop", text = "It moves or lies off its line by more than 1/64 in: free it with the blade under the plate's tape, peel, and bond it again." },
]
