[[setups.operations]]
instruction = "Plate out of the vise. Free each die half with the blade under the plate's tape as in Setup 3; peel the tape; acetone off any CA. Mark the halves OUT (the one cut nearer the fixed jaw) and IN on their top faces. File the burr off every cut edge except the faces; stone the faces' edges lightly, one stroke."
