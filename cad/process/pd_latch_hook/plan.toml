[[setups]]
machine_kind = "other"
title = "Bench: mike the sheet and the 1/2 x 6 bar; saw the sheet blank and the die blank"
machine = "Bench; Evolution miter saw"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "To scale: the 6 x 6 in sheet with the blank, {{process.blank_width_in:.2dot}} x {{process.blank_length_in:.2dot}} in, marked off one corner and the rest kept for the platen clips; below, the sheet between two wood blocks in the bench vise, the hacksaw on the line; right, the 1/2 x 6 bar with the {{process.die_blank_length_in:.2dot}} in die blank marked off its end." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the sheet 1 in in from two opposite edges, and the 1/2 x 6 bar's thickness 1 in from its end at both edges."
inspection = "Sheet: both readings {{cad.strip_thickness_min_in:.3dot}}–{{cad.strip_thickness_max_in:.3dot}}, else stop: it is not the .032 sheet. Bar: {{process.die_blank_thickness_min_mm:in.3dot}}–{{process.die_blank_thickness_max_mm:in.3dot}}, else stop: HL02 starts its cut at the thickest."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.strip_thickness_band_mm}}" }, { gauge = "micrometers", band_mm = ["{{process.die_blank_thickness_min_mm}}", "{{process.die_blank_thickness_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "With the square and a marker, mark a line {{process.blank_width_in:.2dot}} in in from one edge of the sheet, across it. Lay the sheet between two scrap wood blocks that run past the line, and clamp the stack in the bench vise, the line 1/2 in out past the vise jaws." },
  { kind = "action", text = "Saw down the line through block, sheet and block, the kerf on the line's waste side; light, full-length strokes. Then mark the {{process.blank_width_in:.2dot}} in strip {{process.blank_length_in:.2dot}} in from one end and saw it off the same way: the blank. Keep the rest of the sheet for the platen clips." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw a {{process.die_blank_length_in:.2dot}} in length off the 1/2 x 6 bar's end with the miter saw, the bar flat on the saw bed (tape measure): the die blank."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "File the saw burr off every sawn edge of the blank, the blank flat on the spoil plate, and off the die blank's two sawn edges." },
  { kind = "check", text = "The blank lies flat on the plate: no edge rocks or stands up when pressed." },
  { kind = "stop", text = "An edge stands up: saw a new blank off the sheet the same way and try again." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "CNC mill: bond the blank to the spoil plate; cut the hook and the trial strip"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Spoil plate on 1 in parallels across the vise jaws, its back edge on the fixed jaw, centred along the jaws: the jaw tops stand {{process.jaw_top_over_plate_mm:in.3dot}} above the plate top, and at the least stickout the collet's nose passes {{process.sheet_collet_over_jaw_mm:in.2dot}} over them at the cut. The blank bonded to its top: blue tape under its whole face, on the plate and on the blank, and a zigzag CA bead between that runs under the hook and the strip (stack {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}); its left end flush with the plate's left end, its back edge against a 1/8 in strip of the tape on the fixed jaw's face."
datum = "Program HL01_sheet. G54: X0 the plate's left end, Y0 the fixed jaw's bare face, Z0 the plate top, bare right of the tape; +Y toward the fixed jaw. The hook's top bar stands at X {{process.part_left_x_mm:in.3dot}}, its base's end at Y {{process.hook_base_end_y_mm:in.3dot}}. After homing again: check the blank has not moved or lifted on its tape (push test), then check the zeros."
diagram = { file = "diagrams/sheet.svg", alt = "Plan of the spoil plate in the vise, to scale: the blank on its tape against the fixed jaw, flush with the plate's left end; on it the hook's flat pattern, the ear and base as a bar across the blank at the left with the arm running along the blank toward the right, its full round tip at the right; the trial strip in the L's elbow. The 1/16 in end mill at HL01's first plunge, on the path beside the top bar's edge, the anticlockwise way arrowed. A section across the jaws: the plate on a 1 in parallel at each jaw, the blank on its tape stack." }
envelope = { x_span_mm = ["{{process.blank_length_mm}}"], y_span_mm = ["{{process.blank_width_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.tape_stack_max_mm}}", "{{process.strip_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.sheet_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_sixteenth_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_sixteenth_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{process.blank_area_mm2}}", width_mm = "{{process.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Spoil plate on the 1 in parallels across the jaws, its back edge on the fixed jaw, centred along the jaws; close the vise and tap the plate down onto the parallels."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the plate's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face from the plate's side (−Y), G10 L20 P1 Y-2.540. X: its tip .10 below the plate top, on the plate's left end from the left, G10 L20 P1 X-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "Mike the blank 1/2 in in from each end and write both readings down in mm (in × 25.4): the stack check below subtracts them."
feed = "hand"

[[setups.operations]]
instruction = "Clean: degrease the plate top and the blank's underside with isopropyl alcohol on a clean rag; wipe each dry with a fresh rag."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Tape the plate: two strips of the blue tape along the jaws from the plate's left end (trimmed flush) to 5 in, the first against the fixed jaw, edges butted, never overlapped. Tape the blank's whole underside the same: two strips along its length, butted, trimmed flush with a knife." },
  { kind = "action", text = "Burnish both tapes down hard with the round back of a screwdriver handle. Knife a 1/8 in strip of the tape and lay it along the fixed jaw's face over the plate's length, its lower edge down on the plate's tape: squeezed-out glue lands on it, not on the jaw." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Thick CA on the plate's tape in the blank's place, a zigzag bead about 1/16 wide, lines about 3/4 in apart, from 1/16 in off the jaw's strip to 1/4 in inside the blank's front edge and ends. No glue on bare metal." },
  { kind = "action", text = "Mist the accelerator on the blank's tape, two or three sprays; within about 10 seconds lower the blank, its back edge against the jaw's tape strip and its left end against the square's blade held on the plate's left end. Press it down over its whole face with a flat block for 1 minute, then wait 5 minutes." },
]
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/16 in end mill, {{process.em_sixteenth_projection_min_mm:in.2dot}}–{{process.em_sixteenth_projection_max_mm:in.2dot}} out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the bare plate top right of the tape: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Check, stack (spindle stopped): drag the same leaf under the tip on the blank's top 1/2 in in from each end; read Z (mm). Stack = reading − 0.051 (the leaf) − that end's miked thickness. Then push the blank hard along and across with the heel of the hand." },
  { kind = "check", text = "Each stack {{process.tape_stack_min_mm:.2f}}–{{process.tape_stack_max_mm:.2f}} mm, the two within 0.05 mm of each other; no movement, no lifted corner." },
  { kind = "stop", text = "Out, or it moves: free the blank with a thin blade under the plate's tape, peel all the tape and bond it again from the cleaning step." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-sixteenth"
drilling = "none"
sizing = "other"
instruction = "Run HL01_sheet (M6 T1: set 2800, then Cycle Start; about 12 min). It plunges into waste beside the hook's top bar at a quarter feed and cuts the hook round, then the trial strip the same; two levels each, the last {{process.sheet_tip_into_plate_mm:in.3dot}} into the plate. Dry: blow the chips off as it goes, no coolant (the paper tape soaks and lets go)."
settings = "endmill-carbide-3fl-1-16-downcut-c260"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "hook", kind = "part", area_mm2 = "{{process.hook_bond_area_mm2}}", width_mm = "{{process.hook_least_width_mm}}" }, { name = "trial strip", kind = "part", area_mm2 = "{{process.trial_bond_area_mm2}}", width_mm = "{{process.trial_width_mm}}" }, { name = "waste", kind = "waste", area_mm2 = "{{process.sheet_waste_bond_area_mm2}}" }] } }
milling_cuts = [
  { name = "sheet", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.sheet_cutter_dia_mm}}", axial_doc_mm = "{{process.sheet_level_depth_mm}}", radial_woc_mm = "{{process.sheet_cutter_dia_mm}}", traverse_mm = ["{{process.sheet_from_x_mm}}", "{{process.sheet_to_x_mm}}"] },
]

[[setups.operations]]
steps = [
  { kind = "stop", text = "The cut smokes or smells hot (CA softens with heat): Feed Hold, then Reset (the spindle stops); jog Z up clear and wait until the blank is cool to a finger." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: free the hook and the trial strip, deburr, check the flat hook"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The flat hook, to scale, from above as it lay on the plate: the top bar's length and width, the arm's width below the root and past the taper, where the calipers read them; every other station is the program's." }
envelope = "other"
vise_hold = "other"
beam = "other"
# The outline's stations, the taper, the root relief and the tip round are
# held by the program (cam:pd_latch_hook checks the posted path against the
# drawing's bands); the calipers read the widths that set the forming.
inspection = [
  "Flat hook: the top bar {{cad.strip_width_min_in:.2dot}}–{{cad.strip_width_max_in:.2dot}} long (ear and base, across), {{cad.side_edge_width_min_in:.2dot}}–{{cad.side_edge_width_max_in:.2dot}} wide; the arm {{cad.arm_front_width_min_in:.2dot}}–{{cad.arm_front_width_max_in:.2dot}} wide below the root and {{cad.arm_low_front_width_min_in:.2dot}}–{{cad.arm_low_front_width_max_in:.2dot}} past the taper.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.strip_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.side_edge_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.arm_front_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.arm_low_front_width_band_mm}}" },
]

[[setups.operations]]
instruction = "Peel the tape strip off the fixed jaw; plate out of the vise, on the bench. Waste first: slide a thin blade (single-edge razor or .010 feeler) flat under the plate's tape at the waste's outer edge, work it along and peel the waste off with its tape. Then the hook and the strip the same, the blade worked along their whole length so the tape bends, not the part; never lift the arm by its tip while tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Lay each part tape-up on the plate, hold it flat close to the peel line and peel its tape back on itself, low and slow. Any CA spot: acetone on a rag; tape film: isopropyl alcohol. Peel the plate's tape and wipe the plate."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "stone"
drilling = "none"
sizing = "other"
instruction = "Rub each face of both parts flat on the 320-grit face of the stone to take the cut's burr off. Break the hook's edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max: the outside edges with the smooth file, the root relief and the taper's corner with the deburring set's scraper, one light stroke."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Measure the flat hook with calipers: the setup's inspection line." },
  { kind = "check", text = "Every width in its band, and both parts lie flat on the plate." },
  { kind = "stop", text = "A width out: scrap the hook and stop; find the cause (cutter, G54, the blank's seat) before cutting a new blank." },
]
feed = "hand"

