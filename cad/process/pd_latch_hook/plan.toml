# Latch hook MHA-PD-14 (pd-latch-hook.yaml process: ".032 in C26000 H02
# half-hard brass strip, as supplied: cut the blank to the flat pattern, bend
# the ear 90 degrees, drill the screw holes from the formed ear, roll the arm
# and form the tab"; the pin hole is drilled at assembly, MHA-PD-00).
#
# Route (approved by Main 2026-11-27, wave3/w3b-small route-proposals.md,
# recommendation 1). Setup 1 at the bench: mike the on-hand .032 x 6 x 6 in
# sheet (owner 2026-11-24: "Use the sheet; buy strip only if the hook takes a
# set"), saw a 2.00 x 4.50 in blank off it, the rest kept for the platen
# clips; saw a 3.75 in length off the on-hand 6061 1/2 x 6 bar for the
# former. Setup 2 on the PM-30MV: the blank bonded to the spoil plate on blue
# painter's tape on both faces with CA glue between (owner 2026-11-23);
# HL01_sheet (cam:pd_latch_hook, cad/process/pd_latch_hook/cam.py) cuts the
# hook's flat pattern and a trial strip (the arm's width and length, the same
# full round tip) nested in its elbow with the 1/16 downcut end mill. Setup 3
# frees them. Setup 4: the 1/2 x 6 blank bonded the same way, its 6 in along
# the jaws; HL02_former cuts the former from it, an outer and an inner die
# half whose faces are the strip's two faces as pressed, facing each other
# across a channel, with the 1/4 in carbide end mill (a 1/2 x 1 bar's 5 mm of
# body behind a face fails the bond's lift screen; W3B-Small 2026-11-27, no
# purchase). Setup 5 frees the
# halves and presses the trial strip between them in the vise: its two
# caliper readings gate the former. Setup 6 bends the ear 90° R.05 over a
# 3/32 drill's shank in the vise. Setup 7: the hook's base bonded flat to
# the plate, ear up; HL03_holes drills the 2X #30 screw holes from the formed
# ear's outer face and the base's low edge. Setup 8 presses the roll and the
# tab in one squeeze in the former, checks the hook, then flexes the arm at
# the pin station by the worst single release, 8.46 mm
# (transgear_hanger_joints LATCH_RELEASE_FLEX_WORST): a set stops the job.
#
# The former (fixtures.pd-latch-hook-former, Main's ruling on the former
# 2026-11-27, option 1): the die faces are posted at the design point, the
# middle of the H02 yield range on record (324.5 MPa) and the nominal .032,
# from Ri/Rf = 4x^3 - 3x + 1, x = Ri Y/(E t), the bend angle keeping the
# mid surface's length; E 16,000 ksi (McMaster-Carr's figure for its 260
# strip, 8859K86; the sheet's own listing was not read), Y 290-359 MPa (the
# former record's range; Copper Development Association, C26000 flat
# products, H02: 52 ksi = 359 MPa typical). The recipe checks that the design
# point presses every printed formed value and that the tab's R.38 lands at
# every corner of the yield range and the strip's ±.002. No fixed die
# covers the whole yield range at ±.002: the printed R3.13 ±.02 holds only
# within the yield window [parameters] window_yield_* (about ±2.7 MPa), so
# the trial strip, pressed before the hook, is the gate. The sheet's temper
# is not on its packing list; the H02 range on record, the trial strip and
# the temper trial carry that unknown.
#
# To order: the 1/16 downcut end mill (tools-special-cutters.toml
# endmill-carbide-3fl-1-16-downcut, Harvey Tool 896262, #3740) and the
# junior hacksaw (tools-hand.toml junior-hacksaw), both on the platen clip's
# list too. To make: the spoil plate (fixtures.sheet-spoil-plate). On hand:
# the sheet, the 6061 1/2 x 6 bar, the 1/4 in end mill, the #30 and 3/32 drills (the
# 115-piece index), the tape, the CA glue and its accelerator.
title = "Latch Hook"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
material_key = "c260-h02"
milling_material = "brass"
stock = "Qty {{process.quantity:g}}. 260 brass sheet .032 x 6 x 6 in (McMaster-Carr 8956K425, on hand; its packing list states no temper): one {{process.blank_width_in:.2dot}} x {{process.blank_length_in:.2dot}} in blank off one corner; the rest is the platen clips'. 6061-T6511 flat bar 1/2 x 6 in (Online Metals 1173, on hand, the free rest of the 54 in): one {{process.die_blank_length_in:.2dot}} in length for the former."
shop = "../shop"
stock_refs = ["c260-sheet-032-6x6", "6061-flat-1-2x6-54in"]

# The shop's standing page carries what every traveler shares (units,
# homing, Feed Hold, tool changes, proving a file, burrs); This job says what
# only this hook needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Parts", "One hook. HL01 also cuts a trial strip beside it, and HL02 the former's two die halves from the 1/2 x 6 bar; the trial strip is pressed in the former before the hook and gates it. Keep the strip and the halves with this traveler."],
  ["Temper", "The sheet's packing list states no temper. The hook is the sheet's temper trial (owner 2026-11-24): a set in Setup 8's flex test stops the job, and buying the H02 strip is the owner's."],
  ["To buy or make first", "Not on hand: the 1/16 in downcut end mill and the junior hacksaw (both also on the platen clip's list). The spoil plate is to make from owned stock."],
]

