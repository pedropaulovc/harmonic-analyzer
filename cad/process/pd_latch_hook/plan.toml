datum = "Program HL03_holes. G54: X0 the ear's outer face, Y0 the base's low edge (the edge the arm leaves from), Z0 the plate top, bare beside the tape; +Y toward the fixed jaw. After homing again: check the hook has not moved, then check the zeros."
diagram = { file = "diagrams/holes.svg", alt = "From above, to scale: the hook's base bonded on the spoil plate, the ear standing along its right end and the arm running from it toward the moving jaw; the #30 drill in the first screw hole, nearer the ear. Beside it, from the moving jaw's side: the base on its tape, the ear standing up, the drill's point through the base into the plate." }
envelope = { x_span_mm = ["{{cad.base_end_length_mm}}"], y_span_mm = ["{{cad.side_edge_width_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.tape_stack_max_mm}}", "{{process.ear_height_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.holes_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_30_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_30_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.base_end_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.holes_plate_from_mm}}", "{{process.holes_plate_to_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "base", kind = "part", area_mm2 = "{{process.holes_bond_area_mm2}}", width_mm = "{{cad.side_edge_width_mm}}" }] } }

[[setups.operations]]
instruction = "Spoil plate in the vise as in Setup 2; degrease the plate top and the base's underside; tape the plate under the hook's place (one strip) and the base's underside, trimmed flush. Mark on the plate's tape the ear's outer face line {{process.holes_ear_x_on_plate_mm:in.2dot}} from the plate's left end and the base's side edge line {{process.holes_base_from_jaw_mm:in.2dot}} off the fixed jaw."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
drilling = "none"
sizing = "other"
instruction = "A dot of thick CA under the base's place; mist the accelerator on the base's tape; within about 10 seconds set the base down on its two lines, the ear up, the arm toward the moving jaw. Press the base down for 1 minute; never press on the arm. Wait 5 minutes."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the ear's outer face, Y0 the base's low edge: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm). X: its tip about .05 above the plate's tape, on the ear's outer face from +X, G10 L20 P1 X2.540. Y: its tip the same height, on the base's low edge from −Y between the ear and the base's end, G10 L20 P1 Y-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T3 (#30 drill, at least {{process.drill_30_projection_min_mm:in.2dot}} out of the chuck, so the chuck clears the ear). Spindle stopped, its point just dragging a .002 feeler leaf on the bare plate top beside the tape: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-30"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.screw_holes_dia_band_mm}}" }
instruction = "Run HL03_holes (M6 T3: set 2800, then Cycle Start; about 1 min): the #30 drills each screw hole through the base in one feed, the near hole first, its point {{process.holes_tip_z_mm:in.3dot}} below the plate top. Dry."
settings = "pd-drill-30-c260"
hole_depth_mm = "{{cad.strip_thickness_mm}}"
peck = "none"
milling_cuts = [
  { name = "holes", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.drill_30_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = 71.12, stations_mm = ["{{cad.screw_holes_x_near_mm}}", "{{cad.screw_holes_x_far_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Plate out; free the base with the blade under the plate's tape and peel it. Break each hole's edge on both faces with the deburring set's countersink, turned by hand a turn or two: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Then the #30's shank enters each hole (the #30 is .1285, inside the holes' {{cad.screw_holes_dia_min_in:.3dot}}–{{cad.screw_holes_dia_max_in:.3dot}}; the program holds the stations)."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Vise, spindle off: press the roll and the tab; check the hook; the temper trial"
machine = "PM-30MV vise, spindle off"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/form.svg", alt = "From above, to scale: the two die halves on their parallels against the jaws as in Setup 5, the hook's arm on edge between the faces, the ear's lower edge on the square's blade across the halves' top ends and the base standing off past them. Below, the formed hook with its two caliper readings: across from the ear's outer face to the tab's far point, and along from the strip's top end to the tip." }
inspection = [
  "The hook, pressed: the ear's outer face to the tab's far point {{process.check_tip_x_min_mm:in.3dot}}–{{process.check_tip_x_max_mm:in.3dot}}; the strip's top end (the ear and base's edge opposite the arm) to the tip {{process.check_overall_min_mm:in.3dot}}–{{process.check_overall_max_mm:in.3dot}}. Within the dies' springback, these two readings hold the drawing's formed values: roll start {{cad.roll_start_min_in:.2dot}}–{{cad.roll_start_max_in:.2dot}}, R{{cad.roll_radius_min_in:.2f}}–{{cad.roll_radius_max_in:.2f}}, R{{cad.tab_radius_min_in:.2dot}}–{{cad.tab_radius_max_in:.2dot}}, the far face {{cad.far_face_x_min_in:.2dot}}–{{cad.far_face_x_max_in:.2dot}} by {{cad.far_face_y_min_in:.2f}}–{{cad.far_face_y_max_in:.2f}}, the tab's end {{cad.tab_end_x_min_in:.2f}}–{{cad.tab_end_x_max_in:.2f}}.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{process.check_tip_x_min_mm}}", "{{process.check_tip_x_max_mm}}"] },
  { gauge = "calipers", band_mm = ["{{process.check_overall_min_mm}}", "{{process.check_overall_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "former"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "The halves on their parallels in the vise as Setup 5 stood them, top ends flush on the square's blade, the parallels' ends flush with the top ends (the base stands past them)." },
  { kind = "action", text = "Stand the hook's arm on edge between the faces, the ear's outer face on OUT's side, the arm's rear edge flush with the halves' top faces, the outer corner of the ear's lower edge on the blade. Close the vise by hand, firmly, until both faces bear on the arm along its whole length; open it and lift the hook out." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Calipers: the fixed jaw flat on the ear's outer face, the beam square to it, the moving jaw closed on the tab's far point; write the reading down. Then the length: one jaw on the strip's top end, the other on the tip." },
  { kind = "check", text = "Both readings in the setup's inspection line." },
  { kind = "stop", text = "A reading out: stop and keep the hook and the halves for the owner." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Temper trial: grip the base flat between two wood blocks in the bench vise, the arm free. Mark the arm's far face (the straight's face that looks away from the ear's side) {{cad.far_face_y_nominal_in:.2f}} below the base's low edge." },
  { kind = "action", text = "Hold the calipers' depth rod square to the straight at the mark from a block clamped beside it on the far face's side; read it. Set the rod .333 shorter (the worst single release, 8.46 mm). Push the arm at the mark toward the block until the far face meets the rod's end; hold one second; let go." },
  { kind = "action", text = "Take the hook out and read the ear's face to the tab's far point again, as above." },
  { kind = "check", text = "The reading is within .002 of the one written down: the arm came back." },
  { kind = "stop", text = "It moved more: the sheet takes a set. Stop and keep the hook for the owner; buying the H02 strip is the owner's (owner 2026-11-24)." },
]
feed = "hand"

[[setups.operations]]
instruction = "Bag the hook (FINISH: {{cad.finish}}). Keep the two die halves and the trial strip taped together with this traveler: they are the former."
feed = "hand"
