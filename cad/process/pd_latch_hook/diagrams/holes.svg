  <rect class="bond" x="640.0" y="467.76" width="176.0" height="2.24"/>
  <rect class="part-kept" x="665.89" y="461.26" width="134.11" height="6.5"/>
  <rect class="part-kept" x="793.5" y="343.81" width="6.5" height="123.95"/>
  <path class="cutter" d="M741.83,470.19 L754.89,478.04 L767.94,470.19 L767.94,274.84 L741.83,274.84 Z"/>
  <path class="leader" d="M734.89,274.84 L741.55,268.84 L748.22,274.84 L754.89,268.84 L761.55,274.84 L768.22,268.84 L774.89,274.84"/>
