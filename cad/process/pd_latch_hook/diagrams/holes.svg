  <text class="label" x="165.89" y="198.98">base (taped)</text>
  <text class="label" x="198.89" y="288.0" text-anchor="middle">far hole (next)</text>
  <text class="label" x="60.0" y="508.0">From above; the ear and the flat arm stand on edge</text>
  <text class="label" x="60.0" y="526.0">along X0, the arm toward the moving jaw</text>
