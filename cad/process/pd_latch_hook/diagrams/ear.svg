<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="sans-serif" font-size="14">
  <!-- Hand picture, to scale at 9 px/mm, looking along the bend line. The PM vise's jaws (jaw_height_mm 44.95, drawn short to a break line), the flat hook .032 thick (strip thickness) between them, its top bar's bend line at the jaw tops: below it 14.66 mm of the ear (ear_bend flat_centreline) with the arm lying along the jaws behind it; above, the base standing up. The 3/32 drill's shank, Ø2.381 mm (tools.drill-3-32), between the hook and the moving jaw, its centre on the bend line. The base pressed over toward the moving jaw to 91° (ear_press_deg), drawn dashed with its arrow; the flat block that pushes it is not on record: schematic. -->
  <rect class="paper" x="0" y="0" width="900" height="560"/>
  <text class="title" x="20" y="24">Setup 6: the ear bent over the 3/32 drill's shank in the vise (end view along the bend line, to scale, 9 px/mm)</text>
  <rect class="clamp" x="195.0" y="330.0" width="225.0" height="198.0"/>
  <rect class="clamp" x="448.75" y="330.0" width="225.0" height="198.0"/>
  <path class="leader" d="M195.0,528.0 L232.5,522.0 L270.0,528.0 L307.5,522.0 L345.0,528.0 L382.5,522.0 L420.0,528.0"/>
  <path class="leader" d="M448.75,528.0 L486.25,522.0 L523.75,528.0 L561.25,522.0 L598.75,528.0 L636.25,522.0 L673.75,528.0"/>
  <text class="label-on-clamp" x="307.5" y="402.0" text-anchor="middle">fixed jaw</text>
  <text class="label-on-clamp" x="561.25" y="402.0" text-anchor="middle">moving jaw</text>
  <rect class="part-kept" x="420.0" y="186.59" width="7.32" height="275.38"/>
  <circle class="fixture-support" cx="438.03" cy="330.0" r="10.72"/>
  <path class="hidden" d="M420.0,186.59 L420.0,330.0 L420.0,330.0 L420.23,327.15 L420.9,324.37 L422.01,321.73 L423.52,319.3 L425.39,317.14 L427.59,315.3 L430.04,313.84 L432.7,312.78 L435.49,312.15 L438.35,311.97 L563.75,314.16"/>
