  <rect class="fixture-support" x="366.0" y="168.59" width="40.5" height="54.0"/>
  <text class="label" x="366.0" y="162.59" text-anchor="end">flat block (schematic)</text>
  <text class="label" x="435.32" y="196.59">base, standing up</text>
  <text class="label" x="189.0" y="466.98" text-anchor="end">ear (the arm behind it)</text>
  <line class="leader" x1="195.0" y1="461.98" x2="420.0" y2="461.98"/>
  <text class="label" x="478.0" y="249.0">3/32 drill shank on the bend line</text>
