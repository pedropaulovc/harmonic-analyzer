<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="sans-serif" font-size="14">
  <!-- Hand picture. The plan to scale at 4 px/mm: the spoil plate 152.4 x 127 mm (plate_length_mm, plate_width_mm), the vise jaws 158.67 mm long (shop vise-pm-6 jaw_width_mm; their depth schematic), the blank 114.3 x 50.8 mm (blank_length_mm, blank_width_mm) on two strips of the 1.41 in tape from X0 to 5 in, and the hook's flat pattern and the trial strip from HL01_sheet's checked outline (cam:pd_latch_hook context). HL01's first cut drawn: the 1/16 in downcut end mill, Ø1.5748 mm (sheet_cutter_dia_mm), at its first plunge X3.023 Y-17.839 (posted NC), beside the hook's top bar, its first move down -Y arrowed; the detail at 20 px/mm. The section across the jaws at 2 px/mm, seen from the plate's right end, the fixed jaw on the right: the 1 in parallels (parallel_height_mm 25.4, 1/8 in thick), the 1/2 in plate, the jaw tops 6.845 mm above it (jaw_top_over_plate_mm), the tape stack 0.28 mm (tape_stack_mm), the blank .032; the end mill at the same plunge, its tip at the first level Z0.546, 19.05 mm out of the collet at the least (em_sixteenth_projection_min_mm), drawn short to a break line. -->
