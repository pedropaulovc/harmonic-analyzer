[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 in hex bar with one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Caliper the piece on hand. {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long: use it as it is. Longer: saw it to that length, the hex lying on a flat in the saw's vise. Shorter than {{process.blank_length_min_in:.2f}}: stop, it is too short. File the burr off both ends and the corners so it seats flat on the parallels; mark one flat A with the blue marking fluid; mic across flat A and its opposite and write the reading down: Setups 2–4 grip that pair, flat A to the fixed jaw, and set Y0 from it."
feed = "hand"
inspection = "Blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long; across flat A {{process.blank_af_min_in:.3dot}}–{{process.blank_af_max_in:.3dot}}. Outside either: stop, every program assumes this blank."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] },
  { gauge = "micrometers", band_mm = [12.573, 12.827] },
]

[[setups]]
machine_kind = "other"
title = "Bottom end: face, drill and tap the rod hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels, 1/8 in thick, one against each jaw. The blank upright on them, BOTTOM end up (either end of a fresh blank), gripped on flat A (to the fixed jaw) and its opposite, a corner pointing LEFT and one RIGHT, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. Its sawn top stands at most {{cad.blank_length_max_mm:in.2f}} above the parallels ({{process.upright_top_max_mm:in.2f}} once faced), the lower {{process.upright_grip_mm:in.2dot}} of it in the jaws."
datum = "Programs MC01_bottom and MC02_rod_tap (cam:mg_magnifying_clamp). G54: X0 Y0 the hex axis, Z0 the faced bottom end; +Y toward the fixed jaw. Tool lengths from the tool setter at each M6; every file starts with an M6 for its first tool, and at every M6 stop the file has stopped the spindle (M5) and lifted the tool above the clamp."
diagram = { file = "diagrams/bottom-drill.svg", alt = "The blank upright on two parallels in the vise, bottom end up; the 1/2 in end mill faces it in two passes, the centre drill spots the axis and the #43 drill drills the rod hole." }
envelope = { x_span_mm = ["{{cad.ac_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.rod_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.af_mm}}", along_jaws_mm = "{{cad.ac_mm}}", part_height_mm = "{{cad.blank_length_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_centred_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { diameter = "{{cad.af_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "G54 X0 midway between the two corners; Y0 the hex axis, half the miked across flats from the fixed jaw."
instruction_detailed = "Edge finder (900 rpm) on the fixed jaw's face beside the blank: G10 L20 P1 Y(half your across-flats reading in mm − 2.540); for .500, Y3.810. On the LEFT corner from the left: G10 L20 P1 X0. On the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced bottom end, the sawn top's high point less the {{process.bottom_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least {{process.half_mill_projection_min_mm:in.2f}} in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.bottom_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "First part only: prove MC01_bottom in air, Z0 raised 1.000 in; every move clears the jaws and parallels. Then Z0 back."
instruction_detailed = "First part only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run MC01_bottom through every M6, watching each move clear the jaws and parallels. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC01_bottom (M6 T1, 1/2 in end mill; set 2800): face the bottom end at Z0, {{process.bottom_skim_mm:in.3dot}} off the high point, two passes. At the M6 T2 stop look: the whole end faced. No chamfer or spotface at this end: it is the MHA-MG-04 shoulder seat."
settings = "clamp-em-half-brass"
milling_cuts = [
  { name = "bottom face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.bottom_skim_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "A sawn patch left on the end: abort the file, set G54 Z0 .020 below the end as it now stands and run MC01_bottom again."
instruction_detailed = "A sawn patch left on the end: abort the file. Console M6 T1, its tip on the .002 leaf on the faced end: G10 L20 P1 Z0.559. Run MC01_bottom again."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the axis Ø{{process.end_spot_dia_mm:in.3dot}}, under the #43 drill; set 2800."
settings = "clamp-spot-brass"
milling_cuts = [
  { name = "rod spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.end_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T3: #43 drill, {{cad.rod_drill_depth_in:.2dot}} deep to the full diameter, pecks of {{process.peck_43_mm:in.3dot}} with full retract; set 2800. A drop of Tapmatic Gold. The depth ({{cad.rod_drill_depth_min_in:.3dot}}–{{cad.rod_drill_depth_max_in:.3dot}}) is the program's Z from the faced end, not gauged. The clamp stays in the vise for the tap."
settings = "clamp-drill-43-brass"
hole_depth_mm = "{{cad.rod_drill_depth_mm}}"
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "rod drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "The 4-40 tap goes in the T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the 4-40 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, this clamp, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MC02_rod_tap: M6 T5, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the hole."
diagram = { file = "diagrams/bottom-tap.svg", alt = "The clamp upright in the vise, bottom end up; the 4-40 tap in the T-handle wrench in the rod hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} below the end." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the faced end beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X3.810 (over the faced end beside the hole), then send G20: the DRO reads inches. Stand the 4-40 plug tap, in its T-handle wrench, on its point on the faced end; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, MDI G0 X0 Y0."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, Tapmatic Gold: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z less {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} (aim {{cad.rod_tap_reach_in:.3dot}}): thread {{cad.rod_thread_depth_min_in:.3dot}}–{{cad.rod_thread_depth_max_in:.3dot}} full, short of the drilled depth. Not gauged on the part."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring holds the tap square and follows it down. Turn the wrench, a half turn back each turn. To read, push the point fully home again: stop at the noted Z less {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} (aim {{cad.rod_tap_reach_in:.3dot}}), thread {{cad.rod_thread_depth_min_in:.3dot}}–{{cad.rod_thread_depth_max_in:.3dot}} full."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Cross bore through the corners"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Same two 1 in parallels against the jaws ({{cad.cross_parallel_gap_mm:in.3dot}} gap between them), slid LEFT so their RIGHT ends reach only {{process.cross_parallel_end_mm:in.3dot}} in under the clamp from its bottom end, the rest of them out to the left. The clamp lies along the jaws, a corner straight UP and one DOWN, the faced bottom end to the LEFT: its two lower diagonal flats rest on the parallels' inner top edges (the lower corner {{cad.cross_corner_drop_mm:in.3dot}} below their tops, between them), gripped on the two vertical flats ({{cad.flat_width_mm:in.3dot}} tall), flat A to the fixed jaw. Under the bore nothing but air: the parallels stop {{cad.cross_parallel_clear_mm:in.3dot}} short of the drill. Tap it down onto both edges while closing the vise; the top corner level by eye along the jaws. The jaw tops stand above the clamp: MC03 moves between holes above them."
datum = "Program MC03_cross_bore. G54: X0 the faced bottom end, +X toward the top end; Y0 the hex axis, +Y toward the fixed jaw; Z0 the top corner. Tool lengths from the tool setter at each M6; at every M6 stop the file has stopped the spindle and lifted the tool above the jaws."
diagram = { file = "diagrams/cross.svg", alt = "The clamp lying along the jaws, corner up, its lower diagonal flats on the parallels' inner edges at the bottom end; the centre drill spots the top corner and the F drill drills through both corners {{cad.bore_height_in:.2dot}} from the bottom end, into air below." }
envelope = { x_span_mm = ["{{cad.block_height_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.cross_top_height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.cross_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_f_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "solid", extent_mm = [0, "{{cad.block_height_mm}}"], seat = "gripped full length in the vise jaws, the bottom end on the parallels' edges", seat_mm = [0, "{{cad.block_height_mm}}"] }

[[setups.operations]]
instruction = "Bore gauges, before the setup: mic the F drill's shank, .2570–.2575 makes it the GO; mic the G drill's shank, .2600–.2610 makes it the NO-GO (each sits inside the band, as fixed gauges do; no pin gauges are owned). F under .2570: no GO; write BORE MIN NOT GAUGED on a tag on the clamp now, and gauge with the NO-GO only."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the faced bottom end; Y0 the hex axis, half the miked across flats from the fixed jaw."
instruction_detailed = "Edge finder (900 rpm) on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540); for .500, Y3.810. On the clamp's faced bottom end from the left: G10 L20 P1 X-2.540 (minus: the edge finder's centre is left of the end)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top corner, touched with the centre drill at the bore's station (the 1/2 in end mill is too wide to go between the jaws)."
instruction_detailed = "Console M6 T2 (#2 centre drill; the tool setter measures it). MDI G0 X{{cad.bore_height_mm:.3f}} Y0. Spindle stopped, its point just dragging a .002 feeler leaf on the top corner: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove MC03_cross_bore in air, Z0 raised 1.000 in; every move clears the jaws and parallels. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run MC03_cross_bore through every M6, watching each move clear the jaw tops and the parallels. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run MC03_cross_bore (M6 T2, centre drill; set 2800): spot the top corner Ø{{process.corner_spot_dia_mm:in.3dot}} at X {{cad.bore_height_mm:.3f}} mm, on the axis."
settings = "clamp-spot-brass"
milling_cuts = [
  { name = "corner spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.corner_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.bore_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-f"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Same file, M6 T4: F drill through both corners, no peck, its full diameter {{process.cross_drill_past_mm:in.3dot}} past the lower corner, into the air past the parallels' ends; set 2400. A drop of Tapmatic Gold. At least 1.10 out of its collet or chuck: it reaches .96 below the jaw tops."
settings = "clamp-drill-f-brass"
hole_depth_mm = "{{cad.ac_mm}}"
peck = "none"
milling_cuts = [
  { name = "cross drill", kind = "drill", phase = "rough", cutter_dia_mm = 6.5278, flutes = 2, rpm = 2400, feed_mm_min = "{{process.drill_f_feed_per_min_mm}}", stations_mm = "{{cad.bore_height_mm}}" },
]
inspection = "Bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}}, before unclamping: the GO shank (if there is one) enters, the NO-GO shank does not. If the MHA-MG-03 lever is at hand, its 1/4 in body slides through."
gauge_checks = [{ gauge = "clamp-bore-drill-shanks", band_mm = "{{cad.bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "The GO does not enter: run MC03_cross_bore again, still clamped (same spot, the F drill through again), and re-check. Still not: reject the clamp."
feed = "hand"

[[setups.operations]]
instruction = "The NO-GO enters: reject the clamp."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Top end: face to length, drill and tap the thumb hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
