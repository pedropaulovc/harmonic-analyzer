envelope = "other"
vise_hold = "other"
beam = "other"
inspection = ["Length accepted at the MC04 stop. Each position below is a height over a parallel laid flat on the bench, read with the calipers' depth rod: the beam's end on top of a drill shank where it stands out of the clamp, the rod down past the clamp to the parallel; less the shank's miked Ø/2. Bore height {{cad.bore_height_min_in:.3dot}}–{{cad.bore_height_max_in:.3dot}}: the clamp standing on its bottom end, the F drill's shank through the bore. Bore from flat A (parallel to the bore) {{cad.bore_flat_location_min_in:.3dot}}–{{cad.bore_flat_location_max_in:.3dot}}: the clamp lying on flat A, the same shank. Each tapped hole from flat A {{cad.tap_location_min_in:.3dot}}–{{cad.tap_location_max_in:.3dot}}: still on flat A, the #43 drill's shank in the hole; then the same lying on either flat next to it (60° from it). Both threads: a 4-40 screw runs in by hand. Edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, except the bottom end's rod-hole mouth: no chamfer or spotface (MHA-MG-04 seat), burr only."]
