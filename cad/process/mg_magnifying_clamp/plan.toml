# Magnifying clamp MHA-MG-02, routed for the CNC mill (owner rulings
# 2026-11-17, relayed by Main). One block, 1.16 long, from 1/2 in hex brass:
# both ends faced, a #4-40 tapped hole on the axis in each end (the rod tap
# blind from the bottom, the thumb tap from the top into the bore) and an F
# (Ø.257 +.004/0) bore through two corners at .79 from the bottom.
#
# Route: saw the blank; Setup 2 upright, bottom end up, on two 1 in
# parallels, one against each jaw, gripped across the Z flats: face, spot
# and drill the rod hole (MC01), then tap it by hand under the spring tap
# guide in the spindle (MC02); Setup 3 lying corner up between the same
# parallels, gripped on the two vertical Z flats, the bottom end's lower
# diagonal flats on the parallels' inner edges: spot the corner and drill F
# through (MC03);
# Setup 4 upright, top end up: face to length, spot, drill into the bore
# (MC04), tap by hand (MC05). Bench: deburr, inspect.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "remove mention of dead centre ; use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so each tap stop is its
# own file ending M30 over its hole (MC02, MC05).
#
# Finish: the registry calls for chemical blackening (brass black). Owner
# (Pedro, 2026-11-17, relayed by Main): buy a brass-black solution; "The
# clamp is machined now and blackened later. The traveler may end at bare
# machined with the part tagged awaiting brass black." The last setup
# blackens it with Birchwood Casey Brass Black, by the maker's directions
# (cad/config/shop-equipment/ consumables.brass-black-birchwood-casey),
# and is gated on that solution and its named degreaser, oil and PPE.
#
# NC (cam:mg_magnifying_clamp, cad/process/mg_magnifying_clamp/cam.py):
# MC01_bottom, MC02_rod_tap, MC03_cross_bore, MC04_top, MC05_thumb_tap.
# Program names, the [parameters] and the milling_cuts names are a contract
# with that recipe. Tool numbers are the places in the tools list among the
# mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #43, T4 F, T5 the
# tap guide (the tap is turned by hand).
title = "Magnifying clamp"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "Brass hex, 1/2 in across flats (alloy not on record; a piece at least 1.25 in long is on hand, owner 2026-11-17)"
stock = "{{process.blank_af_in:.3dot}} in hex bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in length."
note = "Inches unless mm; G-code and console entries in mm. Finished {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} long. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then, before Cycle Start, touch one of the setup's zeros again with the edge finder: it must read what its step set, within .001 in. It does not, or the part may have moved: take the setup again from its first step, the part out. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; console M6 for the tool in the spindle, then Cycle Start. Every cutting file (MC01, MC03, MC04) is proved in air on its first run; the tap files (MC02, MC05) move only at the machine top and over the hole, spindle off. Finish: brass black, the last setup, once the Brass Black is bought (owner 2026-11-17): machined now, blackened later; until then the clamp is tagged AWAITING BRASS BLACK."
shop = "../shop"
stock_refs = ["c360-hex-1-2"]
material_key = "clamp-brass-hex"
milling_material = "brass"

[cad]
file = "../../out/features/mg_magnifying_clamp/features.toml"
adapter = "hex_block"
part = "mg-magnifying-clamp"

[parameters]
quantity = 1
blank_af_in = 0.5
# Across flats the programs assume: the registry takes the supplier's hex as
# ±.005 for its wall checks, so a piece outside that is not run.
blank_af_min_in = 0.495
blank_af_max_in = 0.505
# The blank the programs are posted for: MC01 skims bottom_skim_mm off the
# sawn bottom end and MC04 faces the top down to length from at most the
# longest blank. A piece longer than 1.30 in is sawn down first (Setup 1).
blank_length_min_in = 1.25
blank_length_max_in = 1.30
kerf_in = 0.125
# MC01: one level, .020 in off the sawn bottom end's high point (the author's
# allowance to clean a saw cut). Z0 is the faced bottom, so the sawn top
# stands this much above it when Z0 is touched off.
bottom_skim_mm = 0.508
# MC04: the top end faced to length in equal levels no deeper than this
# (.050 in, the author's choice for the carbide end mill in brass), from the
# longest blank less the bottom skim.
face_step_max_mm = 1.27
# Facing passes: two, one each side of the axis, a cutter radius out, so each
# takes half the 1/2 in end mill (6G's chip-load factor 1.0 at 50 %
# engagement, shop settings.clamp-em-half-brass).
face_cutter_dia_mm = 12.7
face_stepover_mm = 6.35
# Spots, the #2 centre drill (60°): Ø.080 on the end holes, under the #43
# drill, so no chamfer is left at the bottom's MHA-MG-04 seat; Ø.180 on the
# cross bore's corner, under the F drill and the centre drill's 3/16 body.
end_spot_dia_mm = 2.032
corner_spot_dia_mm = 4.572
# #43 pecks of .080 in, full retract (the rod hole is L/D 5.4, over
# prechips' full-retract band; the thumb hole, L/D 4.2, is pecked the same).
peck_43_mm = 2.032
# MC03: the F drill's full diameter runs this far past the bottom corner.
cross_drill_past_mm = 1.0
# Feeds each program runs and the sheet prints, one number each (mm/min),
# the shop settings' (cad/process/shop/mg.toml settings.clamp-*-brass, sourced
# there): centre drill and #43 2800 rpm × .001 in/rev = 2.8 in/min; F
# 2400 × .004 = 9.6 in/min. cam.py refuses a feed that is not its setting's.
spot_feed_per_min_mm = 71.12
drill_43_feed_per_min_mm = 71.12
drill_f_feed_per_min_mm = 243.84
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745): two
# 1 in parallels, 1/8 in thick, one against each jaw. Upright, the bottom
# end spans both. Lying corner up, the lower diagonal flats rest on their
# inner top edges from the bottom end to cross_parallel_end_mm (3/8 in): the
# parallels stop short of the bore, so the F drill exits into air.
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
cross_parallel_end_mm = 9.525
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The block centred on the jaws, its corners along them: each end of it
# (jaw width − across corners)/2 in from the jaw sides, to 0.01 mm.
vise_centred_inset_mm = -72.0
# Upright, the block is a cantilever up out of the jaws: gripped from the
# parallels' tops to the jaw tops (jaw height − parallels), loaded at its
# top. Its section is taken as the across-flats circle, inside the hex.
upright_grip_mm = 19.5453
# Machine-capacity inputs (mm): heights above the parallels' tops, tool
# lengths from spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall, 1 in of flute: at least its flute length
# + 10 % out of the collet, 27.94 mm (owner ruling 2026-11-25 on #3386, HA
# #3624: "min stickout based on flute length then add 10pct on top of it").
half_mill_projection_min_mm = 27.94
# ASME B94.11M jobber lengths, overall: F 4-1/8 in; the #2 combined drill
# and countersink 1-7/8 in. Bounded by their whole length below the chuck.
drill_f_oal_mm = 104.775
centre_drill_oal_mm = 47.625
# The upright setups' tallest stock: the longest blank less the bottom skim.
upright_top_max_mm = 32.512
# Deepest tips above the parallels: Setup 2, the rod hole's #43 point in the
# shortest blank (31.75 − 0.508 − 12.192 − its 118° point 0.679); Setup 4,
# the thumb hole's point at the bore axis (29.464 − 9.514 − 0.679); Setup 3,
# the F drill's point below the parallels' tops (the bottom corner 1.833
# below them, its 1.961 point and cross_drill_past_mm). cam.py checks each.
rod_tip_height_mm = 18.37
thumb_tip_height_mm = 19.27
cross_tip_height_mm = -4.794
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the parallels, the tallest stock
# (upright_top_max_mm) and the collet gauge: 269.284, rounded down to .01
# in; it is also the guide-and-tap stack's declared reach in the setups'
# capacity check. The guide is 3 1/8 in (79.375) overall, its sellers' size
# and the most it can stand below the collet face; the tap's reach in its
# wrench is not on record, so the traveler stops before the first tap file
# unless the tap, point to the wrench's centre hole, is at most
# tap_wrench_reach_max_mm: 269.24 less 79.375, 189.865, rounded down to
# .01 in.
tap_stack_max_mm = 269.24
tap_wrench_reach_max_mm = 189.73
# The tap guide (shop tools.tap-guide-fisher): its 1/2 in shank and 3/16 in
# point, the sellers' sizes, restated for the tap pictures
# (test_shop_equipment.py holds them to the record).
tap_guide_dia_mm = 12.7
tap_guide_point_dia_mm = 4.7625

