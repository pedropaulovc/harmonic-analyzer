[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MC05_thumb_tap: M6 T5, the tap guide, spindle off; the file ends Idle at the machine top over the hole. Setup 2's stop check covers this setup: the clamp is shorter now."
diagram = { file = "diagrams/top-tap.svg", alt = "The clamp upright in the vise, top end up; the 4-40 tap in the T-handle wrench in the thumb hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{cad.thumb_tap_reach_min_in:.3dot}}–{{cad.thumb_tap_reach_max_in:.3dot}} below the end." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the faced top beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X3.810 (over the faced top beside the hole), then send G20. Stand the tap in its wrench on its point on the faced top; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, MDI G0 X0 Y0."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide as the rod hole, reading the depth with the point pushed fully home, until the DRO Z reads the noted Z less {{cad.thumb_tap_reach_min_in:.3dot}}–{{cad.thumb_tap_reach_max_in:.3dot}} (aim {{cad.thumb_tap_reach_in:.3dot}}); the thread runs into the bore (.25 REF)."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand; blow the hole and the bore out."
feed = "hand"

