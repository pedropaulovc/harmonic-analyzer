[[setups.operations]]
instruction = "Before the clamp goes in, G54 Z0: the parallels' top (the faced bottom end), touched with the 1/2 in end mill on the fixed-jaw parallel, the jaws open."
instruction_detailed = "Before the clamp goes in, the parallels in place and the jaws open: console M6 T1 (1/2 in end mill, at least {{process.half_mill_projection_min_mm:in.2f}} in out of the collet; the tool setter measures it). Jog it over the fixed-jaw parallel, its edge clear of the jaw. Spindle stopped, its tip just dragging a .002 feeler leaf on the parallel: G10 L20 P1 Z0.051. Raise Z. Not with the clamp in: no tool reaches the parallel beside it before its holder meets the clamp."
feed = "hand"

[[setups.operations]]
instruction = "The clamp in as Holding says: G54 X0 midway between the two corners, touched above the cross bore (the bore has cut the corners below .93); Y0 the hex axis, half the miked across flats from the fixed jaw."
instruction_detailed = "The clamp in as Holding says. Edge finder (900 rpm) on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540). The edge finder's tip .10 below the top end, above the bore: on the LEFT corner from the left: G10 L20 P1 X0. On the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "Prove MC04_top in air, Z0 raised 1.000 in; every move clears the jaws and the clamp. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run MC04_top through every M6, watching each move clear the jaw tops and the clamp. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC04_top (M6 T1, 1/2 in end mill; set 2800): face the top end down to Z {{cad.block_height_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}}, two passes each, from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). At the M6 T2 stop: check the length in place."
settings = "clamp-em-half-brass"
inspection = "Length {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} at the M6 T2 stop, the clamp still clamped: the calipers' depth rod, the beam's end on the faced top at the LEFT corner and again at the RIGHT, the rod down past the corner onto the fixed-jaw parallel's top, not into the gap between the parallels."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.block_height_band_mm}}" }]
milling_cuts = [
  { name = "top face", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "Length over {{cad.block_height_max_in:.3dot}}: abort, lower G54 Z by the reading less {{cad.block_height_mm:in.3dot}}, run MC04_top again and re-check. Under {{cad.block_height_min_in:.3dot}}: the clamp is scrap."
instruction_detailed = "Length over {{cad.block_height_max_in:.3dot}}: abort; send $# and note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{cad.block_height_mm:in.3dot}}) × 25.4): a 1.174 reading is 0.356 less. Run MC04_top again and check the length again at its M6 T2 stop. Under {{cad.block_height_min_in:.3dot}}: the clamp is scrap."
feed = "hand"

