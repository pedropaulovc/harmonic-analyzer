[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 in hex bar with one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Caliper the piece on hand. {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long: use it as it is. Longer: saw it to that length, the hex lying on a flat in the saw's vise. Shorter than {{process.blank_length_min_in:.2f}}: stop, it is too short. File the burr off both ends and the corners so it seats flat on the parallels; mic across one pair of flats ({{process.blank_af_in:.3dot}} nominal) and write the reading down: Setups 2–4 set Y0 from it."
feed = "hand"
inspection = "Blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long; across flats read and noted."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "Bottom end: face, drill and tap the rod hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels, 1/8 in thick, one against each jaw. The blank upright on them, BOTTOM end up (either end of a fresh blank), gripped across one pair of flats, a corner pointing LEFT and one RIGHT, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. Its top stands at most {{process.upright_top_max_mm:in.2f}} above the parallels, the lower {{process.upright_grip_mm:in.2f}} of it in the jaws."
datum = "Programs MC01_bottom and MC02_rod_tap (cam:mg_magnifying_clamp). G54: X0 Y0 the hex axis, Z0 the faced bottom end; +Y toward the fixed jaw. Tool lengths from the tool setter at each M6; every file starts with an M6 for its first tool."
diagram = { file = "diagrams/bottom-drill.svg", alt = "The blank upright on two parallels in the vise, bottom end up; the 1/2 in end mill faces it in two passes, the centre drill spots the axis and the #43 drill drills the rod hole." }
envelope = { x_span_mm = ["{{cad.ac_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.rod_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.af_mm}}", along_jaws_mm = "{{cad.ac_mm}}", part_height_mm = "{{cad.blank_length_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_centred_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { diameter = "{{cad.af_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet). Edge finder on the fixed jaw's face beside the blank: G10 L20 P1 Y(half your across-flats reading in mm − 2.540): for .500, Y3.810. Edge finder on the LEFT corner from the left: G10 L20 P1 X0; then on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). T1 back in, spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.bottom_skim_mm:in.3dot}} skim plus the .002 leaf), so Z0 is the faced end."
instruction_detailed = "Home the mill first ($H). Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet). Edge finder (900 rpm) on the fixed jaw's face beside the blank: G10 L20 P1 Y(half your across-flats reading in mm − 2.540): for .500, Y3.810. Edge finder on the LEFT corner from the left: G10 L20 P1 X0; then on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). T1 back in, spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.bottom_skim_mm:in.3dot}} skim plus the .002 leaf), so Z0 is the faced end."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC01_bottom (M6 T1, 1/2 in end mill; set 2800): face the bottom end at Z0, {{process.bottom_skim_mm:in.3dot}} off the high point, two passes. At the M6 T2 stop: the whole end must be faced; a sawn patch left: abort, re-touch Z on the faced end (G10 L20 P1 Z0.559 at the leaf) and run MC01 again. No chamfer or spotface at this end: it is the MHA-MG-04 shoulder seat."
settings = "clamp-em-half-brass"
milling_cuts = [
  { name = "bottom face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.bottom_skim_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the axis Ø{{process.end_spot_dia_mm:in.3dot}}, under the #43 drill; set 2800."
settings = "clamp-spot-brass"
milling_cuts = [
  { name = "rod spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.end_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T3: #43 drill, {{cad.rod_drill_depth_in:.2dot}} deep to the full diameter, pecks of {{process.peck_43_mm:in.3dot}} with full retract; set 2800. A drop of Tapmatic Gold. The depth ({{cad.rod_drill_depth_min_in:.3dot}}–{{cad.rod_drill_depth_max_in:.3dot}}) is the program's Z from the faced end, not gauged. Then the block stays in the vise for the tap."
settings = "clamp-drill-43-brass"
hole_depth_mm = 12.192
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "rod drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the dead centre from its tip to the collet's face and the 4-40 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). The two together must be at most {{process.tap_stack_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, this blank, the collet and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "dead-centre"
drilling = "none"
sizing = "other"
instruction = "Run MC02_rod_tap: M6 T5 (the dead centre in its 3/4 in collet; the tool setter measures it), Z to the machine top, over the hole, end. The spindle stays off."
diagram = { file = "diagrams/bottom-tap.svg", alt = "The blank upright in the vise, bottom end up; the 4-40 tap in the T-handle wrench in the rod hole, the dead centre in the spindle seated in the wrench's centre hole; the tape flag on the tap at the tap-reach band." }

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Depth by the DRO (CNCjs work Z): jog Z up 1/2 in, MDI G0 X3.810 (onto the faced end beside the hole), then send G20 so the DRO reads inches. Stand the 4-40 plug tap, in the T-handle wrench, on its point on the faced end; jog Z down until the dead centre's point sits in the wrench's centre hole, light pressure only, and note the DRO Z: the tap's point is at the face. Jog Z up 1/2 in, MDI G0 X0 Y0. The tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the centre is seated again: the point guides, it does not push. Turn the wrench, backing off a half turn each turn to break the chip, jogging Z down to keep the point seated. Stop when the DRO Z reads the noted Z less {{cad.rod_tap_reach_min_in:.3dot}}–{{cad.rod_tap_reach_max_in:.3dot}} (aim {{cad.rod_tap_reach_in:.3dot}}): thread {{cad.rod_thread_depth_min_in:.3dot}}–{{cad.rod_thread_depth_max_in:.3dot}} full, the point short of the drilled depth. Jog Z up clear, send G21, back the tap out by hand, blow the hole out. The thread depth is held by that Z, not gauged on the part."
feed = "hand"

[[setups]]
