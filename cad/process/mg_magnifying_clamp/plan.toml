  { gauge = "calipers", band_mm = "{{cad.bore_flat_location_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.tap_location_band_mm}}" },
]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: the bore's ends at both corners and inside, the top tap's mouth and the clamp's edges, scraper from the deburring set and a smooth file, to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. The bottom end and its rod-hole mouth: burr off only, no chamfer, no spotface (the MHA-MG-04 shoulder seat). Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Tag the clamp AWAITING BRASS BLACK unless Setup 6 follows now."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blacken (once the Brass Black is bought)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/surfaces.svg", alt = "The finished clamp, every surface to be blackened: both ends, the six flats, the cross bore and the two tapped holes." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Start only with Birchwood Casey Brass Black, Birchwood Casey Cleaner-Degreaser and Barricade oil, chemical-resistant gloves and safety glasses in hand: all to buy, none on record. Until then the clamp stays bare, tagged AWAITING BRASS BLACK."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the label: severe skin burns and eye damage). Clean the clamp with the Cleaner-Degreaser."
feed = "hand"

[[setups.operations]]
instruction = "Scuff the outside faces lightly with the 220 sanding roll for soft metals (the maker: 00 steel wool or abrasive paper). Not in the bore or the tapped holes."
feed = "hand"

[[setups.operations]]
instruction = "Degrease again with the Cleaner-Degreaser and rinse with clear water. Hold the clamp by its ends from here on."
feed = "hand"

[[setups.operations]]
instruction = "Swab or brush the Brass Black on every surface, into the bore and the tapped holes; let it act about one minute (the maker's time). Rinse in cold water; pat dry."
feed = "hand"

[[setups.operations]]
instruction = "One coat is this traveler's finish: the maker's darker repeat needs 0000 steel wool, not on record. Solution and rinse waste to local rules, not down the drain (label: very toxic to aquatic life)."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on Barricade oil; leave it overnight, then wipe off the excess (the maker's step)."
feed = "hand"

[[setups.operations]]
instruction = "Fits after blackening: a 4-40 screw runs into each tapped hole by hand; if the MHA-MG-03 lever is at hand, its 1/4 in body still slides through the bore. Tight: stop and tell the owner; do not re-tap or ream."
feed = "hand"
