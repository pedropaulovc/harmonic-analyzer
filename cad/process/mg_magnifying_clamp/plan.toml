[[setups]]
machine_kind = "other"
title = "Top end: face to length, drill and tap the thumb hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The parallels back against the jaws, full length under the block. The block upright, TOP end up (the faced bottom end down on both parallels), gripped across the same pair of flats as Setup 2 (the bore's ends to the LEFT and RIGHT), centred on the jaws. Tap it down onto both parallels while closing the vise."
datum = "Programs MC04_top and MC05_thumb_tap. G54: X0 Y0 the hex axis, Z0 the parallels' top (the faced bottom end); +Y toward the fixed jaw. Tool lengths from the tool setter at each M6."
diagram = { file = "diagrams/top-drill.svg", alt = "The block upright on two parallels, top end up, the bore's ends left and right; the 1/2 in end mill faces the top to length in levels, the centre drill spots the axis and the #43 drill drills down into the bore." }
envelope = { x_span_mm = ["{{cad.ac_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.af_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.thumb_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.af_mm}}", along_jaws_mm = "{{cad.ac_mm}}", part_height_mm = "{{process.upright_top_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_centred_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{process.upright_top_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { diameter = "{{cad.af_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). Edge finder on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540). Edge finder on the LEFT corner from the left: G10 L20 P1 X0; on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). Console M6 T1, spindle stopped, its tip just dragging a .002 feeler leaf on a parallel's top beside the block: G10 L20 P1 Z0.051."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm) on the fixed jaw's face: G10 L20 P1 Y(half your across-flats reading in mm − 2.540). Edge finder on the LEFT corner from the left: G10 L20 P1 X0; on the RIGHT corner from the right: G10 L20 P1 X(half the DRO X reading). Console M6 T1, spindle stopped, its tip just dragging a .002 feeler leaf on a parallel's top beside the block: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MC04_top (M6 T1, 1/2 in end mill; set 2800): face the top end down to Z {{cad.block_height_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}}, two passes each, from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). At the M6 T2 stop: mic the length at two corners."
settings = "clamp-em-half-brass"
inspection = "Length {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} at two corners, at the M6 T2 stop (over: abort, G10 L2 P1 Z(G54 Z − the excess) and run MC04 again; under: scrap)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.block_height_band_mm}}" }]
milling_cuts = [
  { name = "top face", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the axis Ø{{process.end_spot_dia_mm:in.3dot}}; set 2800."
settings = "clamp-spot-brass"
milling_cuts = [
  { name = "thumb spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.end_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.block_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T3: #43 drill down into the bore, its full diameter to the bore's axis, {{cad.thumb_drill_depth_in:.2dot}} deep; pecks of {{process.peck_43_mm:in.3dot}} with full retract; set 2800. A drop of Tapmatic Gold. The depth ({{cad.thumb_drill_depth_min_in:.3dot}}–{{cad.thumb_drill_depth_max_in:.3dot}}) is the program's Z, not gauged; look through the bore: the drill has broken into it."
settings = "clamp-drill-43-brass"
hole_depth_mm = 9.514
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "thumb drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{cad.block_height_mm}}" },
]

[[setups.operations]]
instruction = "The stop check of Setup 2 covers this setup: the block is shorter now."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "dead-centre"
drilling = "none"
sizing = "other"
instruction = "Run MC05_thumb_tap: M6 T5 (the dead centre), Z to the machine top, over the hole, end. The spindle stays off."
diagram = { file = "diagrams/top-tap.svg", alt = "The block upright in the vise, top end up; the 4-40 tap in the T-handle wrench in the thumb hole, the dead centre in the spindle seated in the wrench's centre hole; the tape flag on the tap." }

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap the thumb hole as the rod hole: note the DRO Z in inches with the tap's point standing on the faced top beside the hole (MDI G0 X3.810, then G20; back to X0 Y0), Tapmatic Gold, the dead centre seated by jogging Z, a half turn back each turn; stop when the DRO Z reads the noted Z less {{cad.thumb_tap_reach_min_in:.3dot}}–{{cad.thumb_tap_reach_max_in:.3dot}} (aim {{cad.thumb_tap_reach_in:.3dot}}); the thread runs into the bore (.25 REF). Jog Z up clear, send G21, back the tap out, blow the hole and the bore out."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished block: length end to end, the cross bore's height from the bottom end and its offset from a Z flat, the two tapped holes on the axis." }
envelope = "other"
vise_hold = "other"
beam = "other"
inspection = ["Length {{cad.block_height_min_in:.3dot}}–{{cad.block_height_max_in:.3dot}} (micrometers, at two corners). Bore height {{cad.bore_height_min_in:.3dot}}–{{cad.bore_height_max_in:.3dot}}: the F drill's shank pushed through the bore, calipers from the bottom end to the shank's far side less the shank's miked Ø/2. Bore from a Z flat {{cad.bore_flat_location_min_in:.3dot}}–{{cad.bore_flat_location_max_in:.3dot}}: calipers from that flat over the shank, less the shank's Ø/2. Each tapped hole from the same Z flat {{cad.tap_location_min_in:.3dot}}–{{cad.tap_location_max_in:.3dot}}: the #43 drill's shank in the hole, calipers from the flat over the shank less its Ø/2; and the same from the hole's own diagonal flat beside it. Both threads: a 4-40 screw runs in by hand. Edges R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max, except the bottom end's rod-hole mouth: no chamfer or spotface (MHA-MG-04 seat), burr only."]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.block_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_flat_location_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.tap_location_band_mm}}" },
]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: the bore's ends at both corners and inside, the top tap's mouth and the block's edges, scraper from the deburring set and a smooth file, to R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max. The bottom end and its rod-hole mouth: burr off only, no chamfer, no spotface (the MHA-MG-04 shoulder seat). Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Finish: leave it bare machined brass. The drawing calls for brass black; no blackening chemical is on the shop records, so the blackening is NOT done in this traveler."
feed = "hand"
