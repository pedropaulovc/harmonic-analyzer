# Keyed cutting arbor backing collar MHA-DT-03-TL-04, three configurations
# (C175, C100, C050: one each), turned on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: each collar comes off its own bar left at stock diameter
# (drawing: Ø1.75 / Ø1.00 / Ø.50 STOCK OK) in one chucking: face the bar end
# square (Z0), spot it with the centre drill, drill L (.290, the drawing's
# Ø.290 DRILL THRU +.004/0) through the part and past the parting line, part
# off .33 from the faced end. No second chucking: the parted face is the
# collar's other face, held to the .32-.34 band by the carriage DRO. Bench:
# deburr both faces' edges and both ends of the hole, check length and hole.
#
# Stock: 1018 cold-finished round (drawing: low-carbon steel, e.g. 12L14 CF).
# 1 in and 1/2 in bar are on hand (cad/config/shop-equipment/stock-bought.toml
# 1018-round-1, 1018-round-1-2); 1-3/4 in is to order (stock-to-order.toml
# 1018-round-1-3-4, a 1.5 in piece). Kerf: the P1 HSS cutoff blade's width
# plus an authored allowance (cad/process/shop/lathe.toml tools.cutoff-blade-p1).
title = "Keyed Cutting Arbor Backing Collar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel round (drawing: low-carbon steel, e.g. 12L14 CF)"
stock = "One each: Ø{{process.stock_dia_in:.2dot}} × {{process.bar_length_in:g}} in piece (to order, not on hand), Ø{{process.stock_dia_c100_in:.2dot}} and Ø{{process.stock_dia_c050_in:.2dot}} bar (on hand): saw a 3 in piece off each for the lathe, never the whole bar (it would run out past the spindle's rear end); each collar takes {{cad.pitch_in:.2dot}} in of bar."
shop = "../shop"
stock_refs = ["1018-round-1-3-4", "1018-round-1", "1018-round-1-2"]
material_key = "lathe-1018-cold-finished"

# The shop's standing page carries what every traveler shares (units, lathe
# speeds, coolant); the setups' titles and part-off ops print which bar makes
# which collar and its mark, so nothing else in the old note was only theirs.
standing = true

[cad]
file = "../../out/features/dt_cone_gear_tl_arbor_collar/features.toml"
adapter = "turned_bush"
part = "dt-cone-gear-tl-arbor-collar"

[parameters]
quantity = 1
stock_dia_in = 1.75
stock_dia_c100_in = 1.0
stock_dia_c050_in = 0.5
# The 1-3/4 in piece to order and the length the 3-jaw grips of it.
bar_length_in = 1.5
chuck_grip_in = 0.75
# Facing allowance: enough to square a sawn or parted bar end.
face_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off ops mike the blade's cutting edge and preset the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-l"
name = "L drill"
ref = "drill-l"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "lathe"
title = "C175: face, drill L and part off the 1-3/4 in piece"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.2dot}} × {{process.bar_length_in:g}} in piece: {{cad.stickout_in:.2dot}} in out of the jaw fronts, measured with the rule, and the rest of the piece behind them, in the jaws (at least {{process.chuck_grip_in:.2dot}} in gripped), its back end against the chuck face if it reaches it."
datum = "Z0 (carriage DRO) the end faced in Op 10."
diagram = { file = "diagrams/bar.svg", alt = "The 1-3/4 in piece in the 3-jaw: the end faced, centre-spotted and drilled L past the parting line; the cutoff blade parts the collar {{cad.part_off_in:.2dot}} from the faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.20 across the countersink: under the L drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-l"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the L drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}: the drill's full diameter then runs through the collar and past the parting line."
settings = "lathe-drill-l-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}; on this Ø1.75, at .10 deep back out and step .010 toward the chuck, alternating; that face stays at Z-{{cad.part_off_in:.3dot}}. Hands clear: let it fall; pick it up once the spindle stops; mark it C175."
settings = "lathe-part-1018-large"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "C100: face, drill L and part off the 1 in bar"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_c100_in:.2dot}} bar; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the end faced in Op 50."
diagram = { file = "diagrams/bar-c100.svg", alt = "The 1 in bar in the 3-jaw: the end faced, centre-spotted and drilled L past the parting line; the cutoff blade parts the collar {{cad.part_off_in:.2dot}} from the faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_c100_dia_mm}}", stock_diameter_mm = "{{cad.outer_c100_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_c100_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_c100_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre, about Ø.20 across the countersink."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-l"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Drill L as in Op 30, the quill scale zeroed with its lips on the spot's rim, until the scale reads {{cad.run_in:.2dot}}: through the collar and past the parting line at full diameter."
settings = "lathe-drill-l-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, as in Op 40: the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}. Hands clear: let the collar fall; pick it up from the bed or the chip tray only after the spindle has stopped, and mark it C100."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_c100_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "C050: face, drill L and part off the 1/2 in bar"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_c050_in:.2dot}} bar; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the end faced in Op 90."
diagram = { file = "diagrams/bar-c050.svg", alt = "The 1/2 in bar in the 3-jaw: the end faced, centre-spotted and drilled L past the parting line; the cutoff blade parts the collar {{cad.part_off_in:.2dot}} from the faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_c050_dia_mm}}", stock_diameter_mm = "{{cad.outer_c050_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_c050_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_c050_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre, about Ø.20 across the countersink."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-l"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Drill L as in Op 30, the quill scale zeroed with its lips on the spot's rim, until the scale reads {{cad.run_in:.2dot}}: through the collar and past the parting line at full diameter."
settings = "lathe-drill-l-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, as in Op 40: the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}. Hands clear: let the collar fall; pick it up from the bed or the chip tray only after the spindle has stopped, and mark it C050."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_c050_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and inspect the three collars"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished collar, C175 drawn: its {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}} length between the faced and the parted face, and the L hole through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr each collar: file the parting burr off the parted face flat on the smooth file, break the outside edges and both ends of the hole, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
feed = "hand"

[[setups.operations]]
instruction = "Each collar: length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}} across the two faces, calipers; the hole takes the {{cad.bore_dia_min_in:.3dot}} pin gauge and not the {{cad.bore_dia_max_in:.3dot}}."
inspection = "Length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}; hole Ø{{cad.bore_dia_min_in:.3dot}}–{{cad.bore_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }, { gauge = "pin-gauges", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "A collar that fails a check in Op 140 is scrapped, not reworked: make it again by repeating its lathe setup, then Ops 130–140. C100 and C050 come again from the same bar; the C175 piece is too short to hold a second time, so a C175 remake needs a fresh Ø1.75 × 1.5 in piece (to order)."
feed = "hand"
