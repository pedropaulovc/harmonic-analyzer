feed = "hand"

[[setups]]
machine_kind = "other"
title = "Black oxide + oil: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/finish.svg", alt = "The finished rail, every face, both ends and the nine taps brushed black with the Presto Black Steel PC9, then sealed with oil." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the rail with soap and water, into the nine taps, to take off the oil; rinse and dry it. Hold it by its ends from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff every face except U lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping the faces flat; U, the Ra {{cad.bottom_face_finish_callout}} slide face, only wiped clean. Not in the taps. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every face, both ends and into the taps with even, light strokes; re-wet the brush and go over the edges, the taps and any light spot until the rail is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with compressed air, blowing out the taps, or a lint-free cloth. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal (the oil): wipe the stone lubricant (a light oil) over every face, both ends and into the taps (the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "An even black on every face and end, no bare or rusty patch (else wash, brush again, rinse, dry and seal); a #4-40 screw runs through each tap by hand."
gauge_checks = "other"
