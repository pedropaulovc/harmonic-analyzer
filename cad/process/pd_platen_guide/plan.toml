# Platen guide MHA-PD-11 (qty 1), routed for the CNC mill (agent's choice for
# speed, owner ruling 2026-11-21: the owner corrects the route afterwards).
# One sawn blank of 3/8 x 1/2 in 1018 cold-finished flat bar about 10.8
# long, every face milled lying along the vise jaws on parallel stacks,
# centred, both ends 2.3 in out past the jaws: the .29 height, the
# .390-.400 depth, the 10.62 length and the nine #4-40 taps A1-A9 through
# the rail, all drilled from the rear face from one zero, then tapped by
# hand under the spring tap guide. The sister rail MHA-PD-27 (the platen
# bottom guide) is the template: the same faces, ends, holes and taps.
#
# Route: saw; Setup 2 gripped across the two 1/2 in cold-finished faces,
# skim the underside U (PG01, the Ra 63 slide face); Setup 3 the same grip,
# U down, face the top to the rough height .345, .055 over the finished
# (PG02); Setup 4 gripped on U and that top, skim the front face F (PG03);
# Setup 5 F down, face the rear R to the depth (PG04); Setup 6, one stack
# under the rough top's edge against the moving jaw (the hole exits fall .14
# from U, over the fixed jaw's side, clear of it): mill both ends to the
# length with the cutter's side, spot and drill the nine #43 holes through
# (PG05), tap each by hand (PG06-PG14); Setup 7 U down on the same stacks,
# face the top to the height (PG15); bench deburr and inspect; black oxide
# + oil, in the shop with Presto Black Steel PC9 (owner ruling 2026-11-21;
# the PC9 and supplies are to buy).
# Why the holes come before the height: at the finished .29 the tap row
# (.140 from U, its thread .056 each side) leaves .079 to either edge, less
# than a 1/8 in parallel; at the rough .345 the one stack under the top's
# edge clears the exits by .019 (cam.py checks both). The rough height also
# puts a machined face at both jaws in Setups 4-6 (a cold-finished face at
# the moving jaw opposite a machined one at the fixed jaw would need a rod,
# and a rod there would leave the stack under nothing). The depth's .110 is
# split .050 off the front and .060 off the rear, and the height's .085
# .020/.065, so the cold-finished skin comes off both sides of each pair.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21, cnc rulings record: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so each tap stop is its
# own file ending M30 over its hole (PG06-PG14). The sheet's hole table says
# THRU ALL for all nine: the five front taps (into MHA-PD-02) and the four
# lock taps (from MHA-PD-12) are drilled and tapped from R alike.
#
# Stock (cad/config/shop-equipment/ stock-to-order.toml
# stock.1018-flat-3-8x1-2, to order: OnlineMetals part 7482, 12 in pieces):
# one 12 in piece yields this blank (10.86 max + the trimmed end).
#
# Flagged, not owned: the 3/8 x 1/2 bar (above); the spiral-point #4-40
# tap (owner ruling 2026-11-20, #2427; shop-equipment
# tools.tap-4-40-spiral-point, to_order); the black oxide's Presto Black
# Steel PC9 and gloves and glasses (shop-equipment
# consumables.presto-black-steel-pc9 and chemical-gloves-eye-protection,
# to_order). Owner (Pedro), answered in person 2026-11-21: "Black oxide:
# cold blackening in the shop with Presto Black PC9 is acceptable as the
# drawing's black oxide." Setup 9 follows the PC9 instructions (cited on
# that record: steps 1 prepare, 2b brush-on, 3 stop, 4 dry, 6 seal with
# oil, the drawing's "+ oil").
#
# Zeroing: the touch probe has no holder (its 6 mm R8 collet is off the buy
# list, cad/config/shop-equipment/ gauges.touch-probe-diy0-tp05), so every
# X/Y zero is the owned .200 in edge finder at 900 rpm (logbook 2026-11-04,
# tools.edge-finder) and every Z zero the end mill on a .002 feeler leaf. The
# 4 in stacks lie wholly under the 10.8 in rail, so no stack top shows
# beside it: a skim's Z0 is the face it cuts (the high point less the skim),
# a to-size face's Z0 the stacks' top set from the miked thickness.
#
# NC (cam:pd_platen_guide, cad/process/pd_platen_guide/cam.py):
# PG01_underside, PG02_top, PG03_front, PG04_depth, PG05_ends_drill,
# PG06_tap_1 to PG14_tap_9, PG15_height. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2
# centre drill, T3 #43, T4 the tap guide (the tap is turned by hand).
title = "Platen guide"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/8 x 1/2 in flat: a plain carbon steel (the drawing's MATERIAL: {{cad.material_name}}; the part's spec: {{cad.material_spec}})"
stock = "{{process.blank_height_in:fraction}} x {{process.blank_depth_in:fraction}} in flat bar; {{process.quantity:d}} blank sawn about {{process.blank_length_nominal_in:.2f}} in long (at least {{process.blank_length_min_in:.2f}}, at most {{process.blank_length_max_in:.2f}}: Setup 1)."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.right_end_length_min_in:.2f}}–{{cad.right_end_length_max_in:.2f}} long (left end to right end), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (U, the underside, to the top), {{cad.rear_face_depth_min_in:.3dot}}–{{cad.rear_face_depth_max_in:.3dot}} deep (F, the front face, to R, the rear face). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Every cutting file is proved in air before it cuts; the tap files move only at the machine top and over a hole, spindle off."
shop = "../shop"
stock_refs = ["1018-flat-3-8x1-2"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pd_platen_guide/features.toml"
adapter = "drilled_block"
part = "pd-platen-guide"

[parameters]
quantity = 1
# The blank (stock.1018-flat-3-8x1-2): the bar's section and the sawn length
# the programs are posted for; stock_fit reads blank_<axis>_in (model axes:
# X the length, Y the height, Z the depth).
blank_x_in = 10.8
blank_y_in = 0.375
blank_z_in = 0.5
blank_height_in = 0.375
blank_height_mm = 9.525          # blank_height_in × 25.4.
blank_depth_in = 0.5
blank_depth_mm = 12.7            # blank_depth_in × 25.4.
# The incoming bar gate (.373-.377 by .498-.502); the programs start their
# to-size faces from the thickest.
blank_height_min_mm = 9.4742
blank_height_max_mm = 9.5758
blank_depth_min_mm = 12.6492
blank_depth_max_mm = 12.7508
# Sawn about 10.80. At least 10.70: X0 is the left-end skim (.060) in, the
# right end mills at 10.620 from it, and .020 must stand past it to clean
# up (cam.py). At most 10.86: PG05's right-end passes start at the longest
# blank's end (10.800 from X0).
blank_length_nominal_in = 10.8
blank_length_min_in = 10.7
blank_length_max_in = 10.86
blank_length_min_mm = 271.78
blank_length_max_mm = 275.844
end_cleanup_min_mm = 0.508       # the shortest blank's stock past the right end.
right_end_raw_mm = 274.32        # blank_length_max_mm less left_end_skim_mm, from X0.
kerf_in = 0.125
# Targets, the middle of each band (cam.py checks them against the export):
# length 10.62 (10.61-10.63), height .29 (.28-.30), depth .395 (.390-.400
# LIMIT; the model sits on its .400 limit).
length_target_mm = 269.748
height_target_mm = 7.366
depth_target_mm = 10.033
# Skims (author's choice): the underside .020 (one level), the front face
# .050, the left end .060 (a sawn end's lean and burr). The rear face and
# the right end are faced to size from them, the top first to the rough
# height and last to the height; the right end's raw station (the longest
# blank) to the length in equal steps.
underside_skim_mm = 0.508
front_skim_mm = 1.27
left_end_skim_mm = 1.524
# The right end's finished station from the sawn left end: the skim plus
# the length (the end cuts' beam station).
right_end_station_mm = 271.272
# The length window on the work X DRO: the length band plus the .200 edge
# finder's radius (cam.py checks them).
length_dro_min_mm = 272.034
length_dro_max_mm = 272.542
# U to the raw top (the thinnest and the thickest bar less the underside
# skim), and the raw rear (the thickest bar less the front skim): the
# to-size faces start from the thickest. cam.py checks them.
height_raw_min_mm = 8.9662
height_raw_max_mm = 9.0678
depth_raw_max_mm = 11.4808
# The rough height (.345), faced in Setup 3 and held across the jaws in
# Setups 4-6: at least top_skim_min_mm (.005, a clean-up cut through the
# cold-finished skin) off the thinnest bar's top, .055 over the finished
# height for Setup 7 (cam.py checks both).
rough_height_mm = 8.763
top_skim_min_mm = 0.127
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) at shop
# settings.em-half-carbide-1018-3439-face, measured stable on the PM-30MV
# at up to 1.27 mm (.050) deep and 6.4 mm wide, 2420-2490 rpm in the cut
# (dechatter session of 2026-11-23, #3439; cad/config/shop-equipment/
# measured-cuts.toml, which allows the 28.45 mm stick-out): equal passes
# across the face no wider than .207, the widest any face takes (the depth
# faces' 10.033 + the 0.5 overhang in two: 5.2665; the rough-height faces'
# 8.763 + 0.5 in two: 4.632; the 1/2 in faces' 12.7 + 0.5 in three: 4.400,
# two would need 6.6, over the limit; cam.py
# checks it is the declared cut), in equal levels no deeper than each
# face's own ceiling: light, so the thin rail's 2.2 in overhang past the
# jaws bends under the cut within the traveler's finish limit (prechips
# milling_deflection, both ways, at the declared width): the underside's
# .020 skim and the top's rough skim in one level, the front face's .050 in
# three (.017 max), the rear's .057 in four (.015 max), the finished
# height's .055 in five (.011 max: at the .207 width four levels bend the
# rail's free end over the limit; five levels of two passes are ten passes,
# where 3.3 mm wide took sixteen). The faces zigzag (owner ruling
# 2026-11-16), so every other pass climbs: that half is not what the
# dechatter cut measured.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.2665
underside_step_max_mm = 0.508
top_step_max_mm = 0.381
front_step_max_mm = 0.4318
depth_step_max_mm = 0.381
height_step_max_mm = 0.2794
# Ends: the same cutter's side, one level from the rear face to .020 under
# the front face (end_axial_doc_mm, cam.py checks it), in equal radial steps
# no deeper than .007, one-way conventional passes across the rail: the
# whole depth on the cutter's side pushes the 2.2 in overhang sideways,
# within the finish limit only at so light a step (prechips
# milling_deflection). They stay on the chart setting (shop
# settings.endmill-carbide-3fl-1-2-1018-cf): 10.541 deep is past the
# deepest measured cut, 6.6 (measured-cuts.toml).
end_step_max_mm = 0.1778
end_past_mm = 0.508
end_axial_doc_mm = 10.541
# Tap holes: spot Ø.080 with the #2 centre drill, under the #43 (no chamfer
# at the mouth; the tap's start is the drill's), then the #43 through,
# pecked .080 (under one diameter) with full retracts (L/D 4.4), its full
# diameter 1.0 mm past the front face into the air beside the stack.
spot_dia_mm = 2.032
peck_mm = 2.032
drill_past_mm = 1.0
# The #43's point 1.0 + its 118° point (0.679) below the stacks' top;
# cam.py checks it.
drill_tip_height_mm = -1.679
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003 in/rev,
# a size between two columns taking the lower one's feed. Centre drill:
# 1800 rpm (88 ft/min on its 3/16 body; MHA-SH-01's spot) × .001 (its 5/64
# pilot) = 1.8 in/min. #43 (.089): 2800 rpm (65 ft/min, the mill's top)
# × .001 = 2.8 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
drill_feed_per_min_mm = 71.12
# Tapping #4-40 through: the tap's point stops this far below the rear face
# (.550): with a spiral-point (plug) chamfer of at most .125 the full thread
# runs through the .400 deepest rail, and a standard #4 hand tap's 9/16
# thread keeps its shank out of the hole. The point then stands .150 under
# the front face, in the air beside the stack.
tap_point_depth_mm = 13.97
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745,
# 1/8 in thick, 4 in long, 1/2-1 in by 1/16): the set's 1 in and 1/2 in
# parallels stacked (1.5 in), one stack against each jaw in Setups 2-5 and
# 7; in Setup 6 one stack only, against the moving jaw under the rough
# top's edge.
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grip: jaw height less the stacks (cam.py checks it). In Setup 7 the
# finished top stands height_jaw_clear_mm (.020) over the jaw tops: the
# last level clears them by at least jaw_clear_min_mm (cam.py checks it,
# and every PG15 move against the jaws). A taller stack (the set's next,
# 1 9/16 in) would leave under the 6 mm minimum grip in the jaws.
lying_grip_mm = 6.8453
height_jaw_clear_mm = 0.5207
jaw_clear_min_mm = 0.5
# Setup 6: the hole exits' clearance to the stack under the rough top
# (cam.py checks it: the tap's major diameter at the top of its height
# band).
stack_exit_clear_mm = 0.4826
# The blank centred on the jaws, the longest one: each end (its length −
# the jaw width)/2 out past the jaw sides; the jaws grip it from there to
# vise_clamp_end_mm (the beams' clamp).
vise_overhang_mm = 58.5851
vise_clamp_end_mm = 217.2589
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# 1/2 in end mill, 3 in overall, set 1.12 in (28.45) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"): the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm).
half_mill_projection_mm = 28.45
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the stack, the deepest rail (.400) and the
# collet gauge, rounded down to .01 in; cam.py checks it. It is also the
# guide-and-tap stack's declared reach in the capacity check. The guide is
# 3 1/8 in (79.375) overall, its sellers' size and the most it can stand
# below the collet face; the tap's reach in its wrench is not on record, so
# the traveler stops before the first tap file unless the tap, point to the
# wrench's centre hole, is at most tap_wrench_reach_max_mm: 278.892 less
# 79.375, 199.517, rounded down to .01 in (cam.py checks it).
tap_stack_max_mm = 278.892
tap_wrench_reach_max_mm = 199.39

