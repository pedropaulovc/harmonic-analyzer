instruction = "Still clamped: hole A1's station from the left end."
instruction_detailed = "The #43 drill that cut the hole, out of its collet: mic its shank. Its shank in hole A1; the calipers from the left end over the shank, less half its miked Ø."
inspection = "Hole A1 {{cad.tap_a1_station_min_in:.3dot}}–{{cad.tap_a1_station_max_in:.3dot}} from the left end. The other holes: the program's stations from the same X0, not gauged. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.tap_a1_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "No #4-40 spiral-point tap in hand (it is to buy): unclamp, tag the rail AWAITING 4-40 TAP and stop here. When it comes: clamp as this setup, edge finder Y0 as before and X0 on the milled left end (G10 L20 P1 X-2.540), then go on."
feed = "hand"

[[setups.operations]]
instruction = "The #4-40 spiral-point tap, its thread at least 9/16 long (a standard hand tap), goes in the T-handle tap wrench with the centre hole in its top (the one the shop's 4-40 plug tap uses): the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the tap in the T-handle wrench from its point to the wrench's centre hole. It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stack, the rail, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PG06_tap_1: M6 T4, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over hole A1."
diagram = { file = "diagrams/tap.svg", alt = "The rail as before, rear face up; the 4-40 tap in the T-handle wrench in a hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_point_depth_mm:in.3dot}} below the rear face, through the front face." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on R beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 X3.810 (beside the hole, on R), G90, then send G20: the DRO reads inches. Stand the tap, in its wrench, on its point on R; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21 and MDI G91 G0 X-3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Send G20. Tap {{cad.tap_a1_thread}} through by hand under the tap guide, spindle off, cutting oil: the spring keeps the point in the wrench as the tap feeds, up to 1/2 in. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z − {{process.tap_point_depth_mm:in.3dot}}: the point through F, the full thread the whole depth."
instruction_detailed = "Send G20, as when the depth was noted. Tap's point in the hole, a drop of cutting oil; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench steadily (a spiral point pushes its chips ahead, through F); push the point home again before the tap has gone 1/2 in. To read, push it fully home: stop at the noted Z − {{process.tap_point_depth_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
inspection = "A #4-40 screw runs through the thread by hand. Binds: run the tap through again under the tap guide; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PG07_tap_2, then PG08_tap_3 to PG14_tap_9 in turn (the tap guide still in, spindle off; each ends Idle over its hole, A2 to A9). Tap each the same way: G20, depth reference beside it, tap through to the same depth under the tap guide, G21, back out, blow out, screw check."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Top face to the height"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in), as in Setups 2-5. The rail lying on them, U down, gripped on F and R: R against the FIXED jaw, the LEFT end still to the left, centred. Tap it down onto both stacks along its length while closing the vise; the lower {{process.lying_grip_mm:in.3dot}} of the rail is in the jaws, and the finished top stands only {{process.height_jaw_clear_mm:in.4dot}} above the jaw tops."
datum = "Program PG15_height. G54: X0 the milled LEFT end, Y0 the fixed jaw's face (R), Z0 the stacks' top (U), set from the miked height."
diagram = { file = "diagrams/height.svg", alt = "The rail lying on stacked parallels, the underside down, gripped on its front and rear faces; the 1/2 in end mill faces the top down to the height in levels, just above the jaw tops." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.depth_target_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.rough_height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.height_target_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.depth_target_mm}}", along_jaws_mm = "{{process.length_target_mm}}", part_height_mm = "{{process.rough_height_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.length_target_mm}}"], clamp_mm = ["{{process.vise_overhang_mm}}", "{{process.vise_clamp_end_mm}}"], section_mm = { y = "{{process.depth_target_mm}}", z = "{{process.height_target_mm}}" }, vise_left = "start" }

[[setups.operations]]
speed_kind = "other"
tool = "deburring-set"
drilling = "none"
sizing = "other"
instruction = "Before clamping: scrape the tap burrs on F and R flush with a scraper from the deburring set, and file the burr off both milled ends' edges, stroking along each edge; wipe the rail clean. Setup 7 grips F and R and seats U: a burr there tilts it."
feed = "hand"

[[setups.operations]]
instruction = "Before clamping: mic U to the top at the rail's middle and write it down (mm = in × 25.4). Clamp it as Holding says; X0 on the milled LEFT end and Y0 on the fixed jaw's face with the edge finder."
instruction_detailed = "Before clamping: mic U to the top at the rail's middle; write it down in mm (in × 25.4). Clamp it as Holding says. Edge finder (900 rpm): on the fixed jaw's face, G10 L20 P1 Y-2.540; on the milled LEFT end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, from that reading and the end mill touched on the top at the rail's middle."
instruction_detailed = "Console M6 T1 (the tool setter measures it); MDI G0 X134.874 Y-5.017 (the rail's middle). Spindle stopped, its tip just dragging a .002 feeler leaf on the top: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PG15_height in air, Z0 raised 1.000 in; every move clears the jaws, the last level only {{process.height_jaw_clear_mm:in.4dot}} over them. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Do not run this file: its last level passes {{process.height_jaw_clear_mm:.2f}} mm ({{process.height_jaw_clear_mm:in.4dot}} in) over the jaw tops, under the shop's 1.0 mm floor (#3607); stop and tell the owner. Run PG15_height (M6 T1; 2450, display near 2485): face the top down from the rough {{process.rough_height_mm:in.3dot}} to Z {{process.height_target_mm:in.4dot}} in equal levels no deeper than {{process.height_step_max_mm:in.3dot}}. Unclamp; mic the height."
settings = "em-half-carbide-1018-3439-face"
inspection = "Height {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}}, U to the top, miked at both ends and the middle."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.top_face_height_band_mm}}" }]
milling_cuts = [
  { name = "height", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.height_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

[[setups.operations]]
instruction = "Over {{cad.top_face_height_max_in:.3dot}}: wipe U and the stacks clean (a chip under it is the usual cause), then repeat this setup from its first op with the new middle reading (it sets Z0 again) and run PG15_height again; it faces only what stands above Z {{process.height_target_mm:in.4dot}}. Under {{cad.top_face_height_min_in:.3dot}}: the rail is scrap."
feed = "hand"

