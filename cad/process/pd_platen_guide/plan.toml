[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/8 x 1/2 in flat bar with one blank about {{process.blank_length_nominal_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar across both pairs of faces, at the end and 11 in along it."
inspection = "The 3/8 in faces .373–.377 apart, the 1/2 in faces .498–.502. Outside: stop, the programs assume this section."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.blank_height_min_mm}}", "{{process.blank_height_max_mm}}"] }, { gauge = "micrometers", band_mm = ["{{process.blank_depth_min_mm}}", "{{process.blank_depth_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blank about {{process.blank_length_nominal_in:.2f}} in long off the 3/8 x 1/2 in 1018 flat bar, the bar flat in the saw's vise. File the burr off both ends and the four long edges so it seats flat on the parallels and the jaws. Mark the end that is LEFT from here on with marking fluid: every X counts from it."
feed = "hand"
inspection = "Blank length on the combination square's 12 in blade: {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} (shorter: the right end does not clean up; longer: PG05's first end pass is overloaded). Longer: saw it again. Shorter: saw a new blank."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Underside"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The blank lying on them along the jaws, a 3/8 in face up, LEFT end to the left, gripped across the two 1/2 in faces, centred on the jaws (both ends about 2.3 in out past them). Tap it down onto both stacks along its length while closing the vise. The face up becomes the underside U; the lower {{process.lying_grip_mm:in.3dot}} of the blank is in the jaws."
datum = "Program PG01_underside. G54: X0 {{process.left_end_skim_mm:in.3dot}} right of the LEFT end (the finished end, as in every setup), Y0 the fixed jaw's face, Z0 the skimmed underside (the face up's high point less {{process.underside_skim_mm:in.3dot}}); +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/underside.svg", alt = "The blank lying along the jaws on stacked parallels, a 3/8 in face up, both ends out past the jaws; the 1/2 in end mill skims the face up, which becomes the underside." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_depth_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_height_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.height_raw_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_depth_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.blank_height_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = ["{{process.vise_overhang_mm}}", "{{process.vise_clamp_end_mm}}"], section_mm = { y = "{{process.blank_depth_mm}}", z = "{{process.height_raw_max_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 X0 {{process.left_end_skim_mm:in.3dot}} right of the LEFT end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the blank, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, G10 L20 P1 X-4.064 (its .100 radius plus the {{process.left_end_skim_mm:in.3dot}} end skim: X0 is the finished end)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the skimmed underside, the face up's high point less the {{process.underside_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the face up (try both ends and the middle): G10 L20 P1 Z0.559 (the {{process.underside_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PG01_underside in air: Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PG01_underside, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PG01_underside (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): skim the face up at Z0, in passes along the rail no wider than {{process.face_stepover_max_mm:in.3dot}}. A cold-finished patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.127) (Z0 .005 lower) and run it again. Unclamp; mark this face U (the underside) with marking fluid."
settings = "em-half-carbide-1018-3439-face"
inspection = "U is the slide face on MHA-PD-07, Ra {{cad.bottom_face_finish_callout}} µin: one even end-mill finish end to end, no cold-finished patch, tear or chatter, by eye and fingernail. Torn or chattered: stop and tell the owner."
