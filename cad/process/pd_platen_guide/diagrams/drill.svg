  <rect class="part-kept" x="460" y="140" width="265.5" height="9"/>
  <circle class="holes" cx="486.6" cy="143.5" r="1.1"/>
  <circle class="holes" cx="532.7" cy="143.5" r="1.1"/>
  <circle class="holes" cx="539.6" cy="143.5" r="1.1"/>
  <circle class="holes" cx="546.5" cy="143.5" r="1.1"/>
