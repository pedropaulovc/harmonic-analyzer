  <text class="label" x="430" y="338">{{cad.tap_a4_station_in:.3f}}, {{cad.tap_a5_station_in:.3f}}, {{cad.tap_a6_station_in:.3f}}, {{cad.tap_a7_station_in:.3f}}, {{cad.tap_a8_station_in:.3f}}, {{cad.tap_a9_station_in:.3f}}</text>
