  <line class="leader" x1="438" y1="184.03" x2="308.67" y2="248.14"/>
  <circle class="leader-dot" cx="308.67" cy="248.14" r="2"/>
  <text class="label" x="440" y="234.03">U down on the stacks, R at the fixed jaw.</text>
  <text class="label" x="440" y="250.03">Height {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}}, U to the top.</text>
  <text class="label" x="440" y="440">1 in + 1/2 in parallels, one stack</text>
