  <line class="dims" x1="183.34" y1="195.59" x2="183.34" y2="234"/>
  <text class="label" x="197.34" y="222">0.521 mm</text>
  <line class="dims" x1="110" y1="250" x2="153.34" y2="250"/>
  <text class="label" x="131.67" y="266" text-anchor="middle">2.167 mm</text>
  <text class="label-on-clamp" x="140" y="234" text-anchor="middle">fixed jaw</text>
  <text class="label" x="20" y="141.59">Detail at the fixed jaw's top, 20 px/mm</text>
  <text class="label" x="20" y="62">FINDING (#3607): drawn true, the end mill's end</text>
  <text class="label" x="20" y="78">passes {{process.height_jaw_clear_mm:in.4dot}} over both jaw tops, under</text>
  <text class="label" x="20" y="94">the 1.0 mm allowed, 2.167 mm over the fixed jaw</text>
  <text class="label" x="20" y="110">and 0.500 mm past the moving jaw's face.</text>
  <text class="label" x="20" y="126">Not to be run until #3607 is fixed.</text>
</svg>
