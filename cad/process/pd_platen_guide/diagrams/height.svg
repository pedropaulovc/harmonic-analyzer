<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the section to scale at 4 px/mm (101.6 px/in), the plan at 1 px/mm, from the rail's sizes: 10.0330 mm across the jaws, 7.3660 mm above the stacks after the cut. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 28.45 mm out (half_mill_projection_mm) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on PG15_height's pass Y-4.183 (-X) at Z7.366, the same place in both views: its last level (five, Z8.484 to 7.366); both its passes cross a jaw. Hatched: what the cut takes, from 8.7630 mm above the stacks. The section is seen from the RIGHT end, the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745), stacked 1 in + 1/2 in (riser_height_mm 38.1). Drawn true, a finding (#3607): at PG15's last level, Z7.366, the end mill's end stands 0.5207 mm (height_jaw_clear_mm) over both jaw tops (6.8453 mm over the stacks: 44.9453 - 38.1) and its pass Y-4.183 reaches Y2.167, 2.167 mm over the fixed jaw, and Y-10.533, .500 mm past the moving jaw's face; the other pass, Y1.083, stands 7.433 mm over the fixed jaw. Under the 1.0 mm the conventions allow. Not to be run until #3607 is fixed; the NC is not changed here. -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">PG15: U down, gripped on F and R, the top faced to the height (to scale, 4 px/mm)</text>
