<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="430"/>
  <text class="title" x="20" y="20">Section across the jaws, from the LEFT end (1 in = 100 px)</text>
  <line class="fixture-table" x1="60" y1="400" x2="420" y2="400"/>
  <rect class="clamp" x="150.5" y="223" width="60" height="177"/>
  <rect class="clamp" x="250" y="223" width="60" height="177"/>
  <text class="label-on-clamp" x="156" y="390">moving</text>
  <text class="label-on-clamp" x="260" y="390">fixed</text>
  <rect class="fixture-support" x="210.5" y="250" width="12.5" height="150"/>
  <rect class="fixture-support" x="237.5" y="250" width="12.5" height="150"/>
  <rect class="part-kept" x="210.5" y="221" width="39.5" height="29"/>
  <rect class="part-removed" x="210.5" y="215.5" width="39.5" height="5.5"/>
  <rect class="cutter" x="220" y="150" width="50" height="60"/>
  <line class="arrow" x1="245" y1="140" x2="215" y2="140"/>
  <line class="datum" x1="80" y1="250" x2="145" y2="250"/>
  <text class="datum-label" x="30" y="246">Z0 (U)</text>
  <line class="datum" x1="250" y1="190" x2="250" y2="212"/>
  <text class="datum-label" x="300" y="214">Y0 (R)</text>
  <text class="label-halo" x="214" y="242">F</text>
  <text class="label-halo" x="238" y="242">R</text>
  <line class="leader" x1="252" y1="218" x2="320" y2="170"/>
  <text class="label" x="300" y="165">top faced to Z {{process.height_target_mm:in.4dot}} in levels</text>
  <line class="dims" x1="380" y1="221" x2="380" y2="250"/>
  <line class="dims" x1="370" y1="221" x2="390" y2="221"/>
  <line class="dims" x1="370" y1="250" x2="390" y2="250"/>
  <text class="label" x="395" y="240">height {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}}, miked</text>
  <line class="leader" x1="212" y1="222" x2="120" y2="200"/>
  <text class="label" x="20" y="196">finished top only {{process.height_jaw_clear_mm:in.3dot}} over the jaws</text>
  <text class="label" x="345" y="300">1 in + 1/2 in parallels, one stack at each jaw</text>
  <text class="label" x="345" y="318">{{process.lying_grip_mm:in.3dot}} in the jaws, gripped on F and R</text>
</svg>
