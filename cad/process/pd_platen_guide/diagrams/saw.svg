<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above, to scale at 2.25 px/mm (57.15 px/in) from the bar's 12.7 mm width. The blank drawn at its longest, blank_length_max_in; the kerf is the plan's kerf_in (.125), the blade drawn in it, cut short to break lines (its 14 in diameter runs off the picture). The saw's vise jaws' size is not on record: schematic. The rest of the 12 in piece drawn as left by the longest blank. -->
  <rect class="paper" x="0" y="0" width="780" height="260"/>
  <text class="title" x="20" y="24">Setup 1: one blank off the 12 in piece, from above (to scale, 2.25 px/mm)</text>
  <rect class="part-rest" x="667.79" y="110" width="58.01" height="28.57"/>
  <rect class="part-kept" x="40" y="110" width="620.65" height="28.57"/>
  <rect class="part-waste" x="660.65" y="110" width="7.14" height="28.57"/>
  <rect class="clamp" x="675.79" y="84" width="46.01" height="26"/>
  <rect class="clamp" x="675.79" y="138.57" width="46.01" height="26"/>
  <text class="label" x="698.8" y="182.57" text-anchor="middle">saw's vise</text>
  <path class="cutter" d="M660.65 70L662.43 67L664.22 70L666.01 67L667.79 70L667.79 178.57L666.01 181.57L664.22 178.57L662.43 181.57L660.65 178.57Z"/>
  <line class="dims" x1="40" y1="160.57" x2="660.65" y2="160.57"/>
  <line class="dims" x1="40" y1="152.57" x2="40" y2="168.57"/>
  <line class="dims" x1="660.65" y1="188.57" x2="660.65" y2="152.57"/>
  <text class="label" x="350.32" y="178.57" text-anchor="middle">blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in</text>
  <text class="label" x="654.65" y="202.57" text-anchor="end">saw blade in its {{process.kerf_in:.3dot}} kerf</text>
  <text class="label" x="760" y="58" text-anchor="end">rest of the 12 in piece (about 1 in)</text>
  <line class="datum" x1="40" y1="90" x2="40" y2="172.57"/>
  <text class="datum-label" x="44" y="84">LEFT end (marked)</text>
  <text class="label-halo" x="100" y="129.29">3/8 x 1/2 in 1018 CF flat, a 1/2 in face down</text>
  <text class="label" x="20" y="236">The bar lying flat in the saw's vise. File both ends' burr off: the blank goes on parallels next.</text>
</svg>
