<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="230"/>
  <text class="title" x="20" y="20">Setup 1, the bar lying flat in the saw's vise (plan, 1/16 scale along the bar)</text>
  <line class="fixture-table" x1="20" y1="150" x2="760" y2="150"/>
  <!-- The rest of the 12 in piece to the right of the blank. -->
  <rect class="part-rest" x="330" y="122" width="20" height="28"/>
  <!-- The blank, about 10.8 in, and the kerf. -->
  <rect class="part-kept" x="40" y="122" width="270" height="28"/>
  <rect class="part-removed" x="310" y="118" width="20" height="36"/>
  <rect class="clamp" x="330" y="92" width="40" height="30"/>
  <rect class="clamp" x="330" y="150" width="40" height="30"/>
  <line class="dims" x1="40" y1="104" x2="310" y2="104"/>
  <line class="dims" x1="40" y1="98" x2="40" y2="118"/>
  <line class="dims" x1="310" y1="98" x2="310" y2="118"/>
  <text class="label-halo" x="70" y="98">blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in</text>
  <line class="leader" x1="320" y1="170" x2="320" y2="192"/>
  <text class="label" x="250" y="208">saw kerf, about {{process.kerf_in:.3dot}}</text>
  <text class="label" x="390" y="112">rest of the 12 in piece (about 1 in)</text>
  <line class="datum" x1="40" y1="160" x2="40" y2="182"/>
  <text class="datum-label" x="46" y="182">LEFT end (marked)</text>
  <text class="label-halo" x="90" y="141">3/8 x 1/2 in 1018 CF flat</text>
</svg>
