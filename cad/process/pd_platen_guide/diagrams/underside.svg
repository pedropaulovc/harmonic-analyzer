  <text class="label" x="440" y="236.7">A 3/8 in face up, gripped across the</text>
  <text class="label" x="440" y="252.7">two 1/2 in faces, centred on the jaws,</text>
  <text class="label" x="440" y="268.7">both ends about 2.3 in out past them.</text>
  <text class="label" x="440" y="284.7">It becomes U (Ra {{cad.bottom_face_finish_callout}}).</text>
  <text class="label" x="440" y="440">1 in + 1/2 in parallels, one stack</text>
