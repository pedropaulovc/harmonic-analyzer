  <text class="label" x="440" y="150.7">Arrowed: this pass runs +X, along the rail;</text>
  <text class="label" x="440" y="166.7">the passes zigzag across it, end to end.</text>
  <text class="label" x="440" y="190.7">1/2 in end mill, PG01's pass Y-6.850,</text>
  <text class="label" x="440" y="206.7">its one level: {{process.underside_skim_mm:in.3dot}} off</text>
