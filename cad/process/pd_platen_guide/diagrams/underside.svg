<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the section to scale at 4 px/mm (101.6 px/in), the plan at 1 px/mm, from the rail's sizes: 12.7000 mm across the jaws, 9.0678 mm above the stacks after the cut. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 28.45 mm out (half_mill_projection_mm) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on PG01_underside's pass Y-6.850 (+X) at Z9.068, the same place in both views: its one level; the pass least past the rail's edges (.500 mm past the moving-jaw side, 2.2 mm over that jaw's top); the first pass, Y1.950, hangs 8.30 mm over the fixed jaw. Hatched: what the cut takes, from 9.5758 mm above the stacks. The section is seen from the RIGHT end, the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745), stacked 1 in + 1/2 in (riser_height_mm 38.1). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">PG01: the face up skimmed {{process.underside_skim_mm:in.3dot}}: it becomes the underside U (to scale, 4 px/mm)</text>
