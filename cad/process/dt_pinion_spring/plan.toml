# Pinion return leaf spring MHA-DT-24, one off: a .015 strip of full-hard
# 17-7 PH, its #30 hole drilled on the PM-30MV from a program (the
# manufacturing premise, AGENTS.md: the CNC mill is never run as a manual
# mill), its outline filed from the hole, both bends formed by hand over a
# drill shank in the bench vise.
#
# - Setup 1 (bench): mike the roll; hacksaw a .60 x 2.50 in piece off its
#   corner along the roll's length (the drawing's note), between wood blocks
#   in the bench vise. No shear is owned (#2381), so the material spec's
#   "sheared 1/4 in wide" is sawn oversize and filed.
# - Setup 2 (PM-30MV, program PS01_hole): the spoil plate
#   (fixtures.sheet-spoil-plate) on 1 in parallels across the vise jaws; the
#   piece bonded to it, and a 1 in length of the owned 1/2 x 3/4 in 6061 bar
#   (fixtures.dt-pinion-spring-drill-cover) bonded over it on its 1/2 in
#   face, both on blue painter's tape both faces with thick CA between
#   (owner 2026-11-23, R1). The #30 pecks through the cover and the strip
#   into the plate, so the .015 strip is backed on both faces as the tool
#   audit's drill-30-cobalt row asks (no breakthrough grab, no lobing).
#   G54: X0 the plate's left end, Y0 the fixed jaw's face, Z0 the plate's
#   bare top.
# - Setup 3 (bench): free the piece; file the outline to calipers readings
#   over the #30 drill's shank in the hole (no spot drill: the hole only has
#   to land inside the oversize piece); file the tip to the developed
#   length; tick the two bends' marks.
# - Setup 4 (bench vise): the kink, then the foot bend, each over the shank
#   of the #2 drill (cam.py: its springback-corrected radius lands inside
#   both bends' R.110-.150 at the strip's thickness limits and the yield on
#   record), each bend's mark level with the jaw tops; each angle bent past
#   its free angle by the springback and checked on the template.
# - Setup 5 (bench): the free form on a 1:1 template printed on this sheet;
#   degrease (FINISH).
#
# Flagged: the 17-7 PH roll (McMaster-Carr 2325K19) and the pin gauges
# (gauges.pin-gauges) are to order, not on hand; the spoil plate and the
# drill cover are to make from owned 6061.
title = "Pinion Return Leaf Spring"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
material_key = "mill-17-7-ph-c"
# prechips' milling-material row nearest the strip (it computes no force for
# a drilled hole); the speeds are the shop setting's.
milling_material = "stainless_304"
stock = "Qty {{process.quantity:g}}. 17-7 PH stainless shim stock, full hard, .015 x 6 x 50 in roll (McMaster-Carr 2325K19; to order, not on hand): one {{process.blank_width_in:.2dot}} x {{process.blank_length_in:.2dot}} in piece off a corner of the roll, its length along the roll's length. The rest of the roll replaces a piece that fails a check."
shop = "../shop"
stock_refs = ["ss177-c-roll-015x6"]

# The shop's standing page carries what every traveler shares (units,
# homing, speeds, Feed Hold, tool changes); the Holdings and the template
# print the rest. This job keeps what is bought or made ahead.
standing = true

[[notes]]
title = "This job"
rows = [
  ["To order", "The 17-7 PH roll (McMaster-Carr 2325K19) and the pin gauges are to order, not on hand."],
  ["To make", "Before Setup 2: the spoil plate (a 5 in length of the owned 1/2 x 6 in 6061 bar) and the drill cover (a 1 in length of the owned 1/2 x 3/4 in 6061 bar), each sawn and its burrs filed off."],
]

[cad]
file = "../../out/features/dt_pinion_spring/features.toml"
adapter = "formed_blank"
part = "dt-pinion-spring"

[parameters]
quantity = 1
# The piece: .60 x 2.50 in off the roll's corner, .015 as bought. Its 2.50
# covers the pad's end allowance (.12), the developed strip (2.060) and
# .32 past the tip; its .60 leaves .11 to file off each pad edge.
blank_length_in = 2.5
blank_width_in = 0.6
blank_thickness_in = 0.015
blank_length_mm = 63.5
blank_width_mm = 15.24
blank_area_mm2 = 967.74
# The strip's thickness as bought: McMaster-Carr 2325K19, .015 -.00075/
# +.00075 (stock-to-order.toml ss177-c-roll-015x6), the drawing's band.
strip_thickness_min_mm = 0.36195
strip_thickness_max_mm = 0.40005
# --- Forming (Setup 4; cam.py recomputes each) ---
# Modulus and minimum yield of the full-hard strip: 200 GPa and 1205 MPa
# (175 ksi), the design's (dt_pinion_spring_geometry MODULUS_MPA, YIELD_MPA,
# ASTM A693 Condition C). The yield is a minimum only.
strip_modulus_mpa = 200000.0
strip_yield_min_mpa = 1205.0
# The mandrel: the #2 drill's shank (shop tools.drill-2 diameter_mm).
shank_dia_mm = 5.6134
# Let go from the shank (inside radius 2.807), the strip springs back to
# these inside radii at its thickness limits and the minimum yield (the
# thinnest the largest), inside both bends' R.110-.150; the radius reaches
# R.150 only at this yield, 1.9 times the minimum.
formed_radius_min_mm = 3.2132
formed_radius_max_mm = 3.2627
formed_radius_nominal_mm = 3.2365
strip_yield_limit_mpa = 2288.0
# Each bend's angle on the shank, its free angle (the drawing's 81.6° foot
# bend, the 25° kink) times (formed R + t/2) / (shank R + t/2), the
# mid-surface keeping its length; the kink read off the jaw tops with the
# protractor (90° less it).
bend_on_shank_deg = 93.3
kink_on_shank_deg = 28.6
kink_protractor_deg = 61.4
# The shank's axis this far under the jaw tops, the kink's mid-surface arc
# on it, so the kink's start mark stands at the jaw tops (tip end clamped);
# the shank's top then stands this much over them.
shank_below_jaw_mm = 1.495
shank_top_over_jaw_mm = 1.3114
# Setup 3's marks from the pad's end on the straight strip: the tip at the
# developed length (filed to the flat's ±.010); the kink's start; the foot
# bend's mark (the foot, 9.572 mm from the pad's end to the bend's
# tangent, plus the bend's arc on the shank, less the shank's depth).
foot_length_mm = 9.572
tip_from_end_in = 2.060
tip_from_end_min_in = 2.050
tip_from_end_max_in = 2.069
kink_mark_from_end_in = 1.921
foot_mark_from_end_in = 0.510
# --- Setup 3 readings over the #30's shank in the hole ---
# Each drawing station from the hole's axis plus the shank's radius
# (.0643), rounded inward to the calipers' .001: the pad's end (.17-.19),
# the pad's forward edge (.18-.20), the wing's face (.14-.16).
end_reading_min_in = 0.235
end_reading_max_in = 0.254
edge_reading_min_in = 0.245
edge_reading_max_in = 0.264
wing_reading_min_in = 0.205
wing_reading_max_in = 0.224
# The hole's pins, its .1285-.1325 band inward to the pins' .001 steps.
hole_pin_min_in = 0.129
hole_pin_max_in = 0.132
# Setup 3's rough marks, each from the hole's centre: a nominal edge's
# station (the pad's end .18, the pad's forward edge .19, the aft edge .19,
# the wing's face .15 toward the tip, the strip's forward edge .06 forward,
# the tip 1.880) plus 1/32 outside it (cam.py recomputes each).
mark_end_from_hole_in = 0.211
mark_edge_from_hole_in = 0.221
mark_aft_from_hole_in = 0.221
mark_wing_from_hole_in = 0.181
mark_strip_edge_from_hole_in = 0.091
mark_tip_from_hole_in = 1.911
# --- Setup 2: layout on the spoil plate (work X/Y) ---
# The hole's station on the piece: .30 from its left (pad) end, across its
# middle. The piece's left end .25 from the plate's left end, its back edge
# .25 off the fixed jaw, so no glue reaches the jaw.
hole_from_piece_end_mm = 7.62
hole_from_piece_edge_mm = 7.62
piece_x_mm = 6.35
piece_y_mm = 6.35
piece_end_x_mm = 69.85
hole_x_mm = 13.97
hole_y_mm = -13.97
# The spoil plate (fixtures.sheet-spoil-plate): the 1/2 x 6 in bar's 6 in
# width along the jaws, its sawn 5 in length across them.
plate_length_mm = 152.4
plate_width_mm = 127.0
plate_thickness_mm = 12.7
plate_from_x_mm = 0.0
plate_to_x_mm = 152.4
# The hold (owner 2026-11-23, R1): ScotchBlue 2090 on both faces, GH1200
# thick CA between. Stack and strengths as the shop record
# (consumables.hold-painters-tape-ca: .011 nominal, .009-.013; 600 kPa
# accepted by the shop owner). The operator proves each bond by a push test.
tape_stack_mm = 0.28
tape_stack_min_mm = 0.23
tape_stack_max_mm = 0.33
bond_accepted_shear_mpa = 0.6
bond_accepted_tensile_mpa = 0.6
# The cover (fixtures.dt-pinion-spring-drill-cover): 1 in long along the
# piece, its left end flush with the piece's, 1/2 in wide (under the
# piece's .60) and its 3/4 in height miked inside this band before use
# (authored: the bar's supply tolerance is not on record): the program's R
# plane stands 1 mm over the highest top, and a cover at the band's foot
# adds under 1 mm of air to the first peck.
cover_length_mm = 25.4
cover_width_mm = 12.7
cover_height_min_in = 0.740
cover_height_max_in = 0.760
cover_height_min_mm = 18.796
cover_height_max_mm = 19.304
# The cover's top over Z0 at the limits: two tape stacks, the strip, the
# cover (recomputed).
cover_top_min_mm = 19.618
cover_top_max_mm = 20.364
# The #30's full diameter runs this far into the plate (authored): its tip
# then stands under Z0 by its 118° point and this; cam.py checks it.
hole_drill_past_mm = 0.25
hole_tip_z_mm = -1.2306
# The deepest the tip may score the spoil plate (authored; the plate is
# 12.7 thick and scored by every part).
spoil_cut_max_mm = 1.5
# From the cover's highest top to the tip (prechips drill_pecking's depth).
hole_depth_mm = 21.5946
# Pecks of the #30: under one diameter, full retract.
hole_peck_mm = 3.0
# The #30 drill (shop tools.riser-drill-30.diameter_mm); cam.py checks it.
drill_30_dia_mm = 3.2639
# Machine-capacity inputs (mm): heights above the mill table, tool lengths
# from spindle nose to tip.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
parallel_height_mm = 25.4        # 1 in parallels (shop-equipment fixtures.parallels-lms-6745).
# The jaw tops above the plate top: jaw height − parallels − plate (recomputed).
jaw_top_over_plate_mm = 6.8453
# The plate's ends inside the jaws' width, centred: no overhang either side.
plate_overhang_mm = 0.0
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# ASME B94.11M jobber, #30: 2-3/4 in overall, 1-3/4 in flute.
drill_30_oal_mm = 69.85
drill_30_flute_mm = 44.45
# The least length the #30 stands out of the chuck: the chuck clears the
# cover's top by 5 mm with the tip at depth; cam.py checks it.
drill_30_projection_min_mm = 27.0

