  <line class="leader" x1="722" y1="212" x2="715" y2="248"/>
  <text class="label" x="672" y="262">dead centre</text>
  <text class="label" x="20" y="385">Journal miked at both ends and the middle; a reamed blank slides its length with no shake.</text>
