  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 9: each gear on the cam fixture (TL-00 steps 15-19); cam turned to Ø1.203-1.205</text>
  <rect class="fixture-vise" x="60" y="60" width="70" height="60"/>
  <rect class="fixture-vise" x="60" y="290" width="70" height="60"/>
  <rect class="fixture-plate" x="130" y="50" width="120" height="310"/>
  <rect class="part-kept" x="250" y="60" width="40" height="300"/>
  <rect class="part-kept" x="290" y="150" width="60" height="150"/>
  <rect class="part-removed" x="290" y="300" width="60" height="30"/>
