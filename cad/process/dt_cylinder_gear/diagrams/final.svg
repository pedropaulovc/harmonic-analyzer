  <text class="title" x="20" y="22">Setup 10: throw on the setting mandrel; cam edge broken; final check</text>
  <rect class="fixture-support" x="180" y="310" width="160" height="50"/>
  <circle class="part-kept" cx="260" cy="190" r="110"/>
  <circle class="part-rest" cx="260" cy="150" r="52"/>
  <circle class="holes" cx="260" cy="190" r="16"/>
  <circle class="fixture-support" cx="260" cy="187" r="14"/>
  <rect class="cutter" x="254" y="58" width="12" height="40"/>
  <line class="leader" x1="266" y1="78" x2="380" y2="70"/>
