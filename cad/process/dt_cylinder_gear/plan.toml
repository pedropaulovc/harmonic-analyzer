instruction = "Over pins, each gear: mike its O.D.; Ø.040 pins in two opposite spaces (60 apart), mike over them (about {{process.over_pins_min_in:.4dot}}-{{process.over_pins_max_in:.4dot}}, REF) and subtract the O.D."
inspection = "Over pins less O.D. {{process.pins_less_od_min_in:.4dot}}-{{process.pins_less_od_max_in:.4dot}}; O.D. {{cad.teeth_dia_min_in:.3dot}}-{{cad.teeth_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = [0.64008, 0.73914] }, { gauge = "micrometers", band_mm = "{{cad.teeth_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Tooth runout to the bore, each gear: on the 3/8 setting mandrel in the V-blocks, the gear hanging on it (the bore rests on the mandrel's top). A Ø.040 pin in the top space, the DTI on the pin. Turn the gear 10 spaces at a time; at each reading, set the pin in the space now on top and bring the DTI onto it (12 readings)."
inspection = "Runout {{cad.teeth_tooth_runout_tir_max_mm:in.3dot}} TIR or under (largest less smallest reading)."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, 0.0508] }]
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Cam on the fixture MHA-DT-12-TL-01"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The cam fixture kit fitted and set in the 6 in 4-jaw by sheet MHA-DT-12-TL-00 steps 1-14 (once for all 20). Each gear by its steps 15-19: bore on the stub, cam boss out, notched space over the clock pin, turned clockwise onto the pin, the washer and screw snug."
datum = "The fixture's stub (the bore) and clock pin (the notch) set the cam's throw and phase; the rim face is the cam's shoulder."
diagram = { file = "diagrams/cam.svg", alt = "A gear on the fixture in the 4-jaw, its boss out; the cam turned eccentric to the bore down to the rim face." }
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the cam from the boss to Ø{{cad.cam_dia_min_in:.3dot}}-{{cad.cam_dia_max_in:.3dot}}, light cuts at first (the cut is interrupted until the cam rounds up), along to the rim face: the last cut stops as the tool's point marks the rim face. The fixture and gear run off-centre: low rpm. The cam's Ra 63 from a light last pass at the power feed. Remove the gear by steps 15-19 reversed."
settings = "mg-lathe-ar-c360-centre"
cut_diameter_mm = "{{cad.cam_dia_mm}}"
inspection = "Cam Ø{{cad.cam_dia_min_in:.3dot}}-{{cad.cam_dia_max_in:.3dot}} (micrometer). Ra 63: no chatter or tears (visual)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.cam_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Stop after the first gear of each load (gears 0 and 10): take it through Setup 10's throw and phase checks now (they are its only ones); turn the next only when they pass. Out: stop, reset the fixture by TL-00 steps 9-13 and its clock pin before going on."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: cam check, edges, polish"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/final.svg", alt = "The finished gear on the setting mandrel in the V-blocks, the dial indicator on the cam." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Throw, gears 0 and 10 at Setup 9's stop, then every fifth gear after (5 and 15): on the setting mandrel in the V-blocks, the dial indicator on the cam's O.D.; turn the gear a full turn: the swing is twice the throw, .6764-.6844. Out: stop, check the fixture's setting (TL-00 steps 9-13)."
inspection = "Throw {{cad.cam_throw_min_in:.4dot}}-{{cad.cam_throw_max_in:.4dot}} (half the swing)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Cam phase, gears 0 and 10 only, at Setup 9's stop (not again here): on the setting mandrel in the V-blocks on the surface plate, the cam face toward you, a .013 pin gauge in the notch (the .014 kerf takes it). Turn the gear until the pin's top reads the mandrel's top less .1816 on the height gauge (the notch level, out to the right); tape the rim to the V-block to hold it."
feed = "hand"

[[setups.operations]]
instruction = "Pin's top again at the mandrel's top less .1816, then read the cam's top and bottom on the height gauge. The gear's axis height (the mandrel's top less .1881: the gear hangs on the mandrel's top, half its bore clearance low) less half their sum is the cam's drop below the axis. Out: stop, check the fixture's clock pin (TL-00)."
inspection = "Drop {{process.phase_drop_min_in:.4dot}}-{{process.phase_drop_max_in:.4dot}} (the lobe 3° ±.7° clockwise of the notch)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the cam's O.D. edge at the cam face R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file. Never the bore, the cam's O.D., the faces or the teeth."
feed = "hand"

[[setups.operations]]
instruction = "Polish the cosmetic faces (the back face, and the rim face outside the teeth on the cam side): a few light strokes flat on the stone's fine face, oiled, only until the turning marks dull evenly. Never the bore, the cam's O.D. or the teeth."
feed = "hand"

[[setups.operations]]
instruction = "Final check after the polishing, each gear: mike it on the boss and across the rim; write the final thickness on the tally card. Out of band: set the gear aside and tell the owner (a replacement's aim is in Setup 3)."
inspection = "Thickness {{cad.cam_face_thickness_min_in:.4dot}}-{{cad.cam_face_thickness_max_in:.4dot}}; rim {{cad.rim_face_face_width_min_in:.3dot}}-{{cad.rim_face_face_width_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.cam_face_thickness_band_mm}}" }, { gauge = "micrometers", band_mm = "{{cad.rim_face_face_width_band_mm}}" }]
feed = "hand"
