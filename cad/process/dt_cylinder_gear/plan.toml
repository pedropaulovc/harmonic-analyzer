sizing = "other"
instruction = "Run GP02_teeth straight after the accepted GP01 and the index to space 2 (no reset, no jog; after a reset run GP01 again first, before the index). It cuts space 2 (+X); at each stop (spindle off) unlock, index 5 spaces as its message says, lock, cycle start: it cuts the next space, alternately -X and +X. Its pass in space 61 and its last, back in space 1's marked hole, cut no chips."
