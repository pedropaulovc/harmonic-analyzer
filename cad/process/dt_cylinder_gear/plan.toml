[[setups]]
machine_kind = "other"
title = "Saw the slices"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 2-5/8 in bar in the saw's vise, slices .34 thick marked off its end; the 5/8 in arbor bar, 7 in, once." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw-bar"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} slices {{process.slice_in:.2dot}}-.37 thick off the 2-5/8 in bar, the bar in the saw's vise, each mark .34 from the end by the calipers. File the burrs off both faces' edges."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw-bar"
drilling = "none"
sizing = "other"
instruction = "Once, for the gang arbor (skip if it is on hand): saw {{process.arbor_saw_in:.1f}} in off the 5/8 in 1018 bar. File the burrs off."
feed = "hand"

[[setups.operations]]
instruction = "Mike each slice at three places: {{process.slice_in:.2dot}} or over everywhere, else set it aside (too thin to face to {{cad.cam_face_thickness_min_in:.3dot}})."
inspection = "Each slice at least {{process.slice_in:.2dot}} thick (micrometer, three places)."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Chucking 1: cam face, boss, rim face, bore"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "6 in 3-jaw on the slice's sawn O.D., {{process.slice_grip_in:.2dot}} in the jaws and the rest out past the jaw fronts; jaws tight."
datum = "The out face, faced here, is the cam face; the boss's shoulder (the rim face) and the bore are cut from it in this chucking, square and concentric to each other."
diagram = { file = "diagrams/chuck1.svg", alt = "The slice in the 3-jaw, .12 in the jaws; the out face faced, the Ø1.92 boss turned .182 long to its shoulder, the bore drilled and reamed through." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.slice_dia_mm}}", stock_diameter_mm = "{{process.slice_dia_mm}}", stickout_mm = "{{process.slice_stickout_mm}}", minimum_diameter_mm = "{{cad.bore_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the out face clean, about .02 off: the cam face."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{process.slice_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the boss Ø{{process.boss_dia_mm:in.2dot}} ±.01 to a square shoulder {{process.boss_length_min_in:.3dot}}-{{process.boss_length_max_in:.3dot}} from the cam face, and face the shoulder (the rim face) out to Ø2.60. The jaw fronts are .20-.23 behind the cam face (the slice less .14), at least .017 behind the rim face: keep the tool on the out side of the shoulder."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{process.boss_dia_mm}}"
inspection = "Boss length {{process.boss_length_min_in:.3dot}}-{{process.boss_length_max_in:.3dot}}, cam face to shoulder (calipers' depth rod)."
gauge_checks = [{ gauge = "calipers", band_mm = [4.5974, 4.6482] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, under the 23/64 drill."
settings = "lathe-centre-c360"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill"
drilling = "twist_drill"
sizing = "other"
instruction = "Drill 23/64 through from the tailstock."
