]

[[setups.operations]]
instruction = "Depth check on blanks {{process.depth_deep_blank:d}} and {{process.depth_shallow_blank:d}}: Ø.040 pin gauges in spaces 1 and 61, mike over them, subtract that blank's O.D. from the tally card (Setup 5). Accept: both within {{process.depth_window_min_in:.4dot}}-{{process.depth_window_max_in:.4dot}} (.0002 a side inside Setup 8's band: the two micrometer readings' resolution)."
inspection = "Over pins less O.D. {{process.depth_window_min_in:.4dot}}-{{process.depth_window_max_in:.4dot}} on blanks {{process.depth_deep_blank:d}} and {{process.depth_shallow_blank:d}} before GP02."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Either reading under {{process.depth_window_min_in:.4dot}}, or the two readings more than {{process.depth_spread_stop_in:.4dot}} apart: stop and tell the owner; never cut deeper."
feed = "hand"

[[setups.operations]]
instruction = "Otherwise a reading over {{process.depth_window_max_in:.4dot}} is a cut too shallow (expected on the first run, set .003 shallow): send $#, then G10 L2 P1 Y(the G54 line's Y + 25.4 × (the mean of the two readings - {{process.depth_aim_in:.4f}}) / 2)."
