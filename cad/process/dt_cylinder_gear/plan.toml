  { name = "tooth space", kind = "side", phase = "finish", cutter_dia_mm = 44.45, axial_doc_mm = 1.6624, radial_woc_mm = "{{process.plunge_aim_mm}}", stations_mm = [0.0, 35.79, 71.58] },
]

[[setups.operations]]
instruction = "Index to space 61, the opposite space: unlock, {{process.opposite_turns:d}} whole crank turns the same way (count them; the plunger drops back in the marked hole), lock."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "cutter"
drilling = "none"
sizing = "other"
instruction = "Run GP01_first_space again: it cuts space 61. Spindle stopped at its end, as before."
settings = "cylinder-gear-cutter-c360"
milling_cuts = [
