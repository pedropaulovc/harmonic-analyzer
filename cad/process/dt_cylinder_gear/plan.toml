# Cylinder gear MHA-DT-12 (qty 20), C36000 brass, 120T 48DP 20PA with an
# eccentric cam boss and an alignment notch in one tooth space.
#
# Route R2, a gang of ten blanks on a shop-made arbor (owner ruling
# 2026-11-22, relayed by Main; Main's conditions of the same day are checks
# here and in cam.py, not prose only):
# - Setup 1, saw: 20 slices off the 2-5/8 in C360 bar (and, once, 7 in of the
#   5/8 in 1018 bar for the arbor).
# - Setups 2-3, lathe, two chuckings a blank: the cam face, the Ø1.92 boss,
#   its shoulder (the rim face) and the reamed bore in one; the back face to
#   thickness in the other, gripped on the boss.
# - Setup 4, lathe, once (skip if on hand): the gang arbor (cad/config/
#   shop-equipment/ fixtures.dt-cylinder-gear-gang-arbor). It has no drawing
#   or part identity, so no feature bundle and no traveler of its own: it is
#   made here, as the amplitude bar's riser is made in its traveler.
# - Setup 5, lathe: ten blanks on the arbor, the stack's O.D. turned in one
#   cut between the 3-jaw (on the arbor's turned body) and the dead centre.
# - Setups 6-7, PM-30MV CNC with the BS-0 dividing head and its tailstock:
#   GP01 cuts space 1 for the depth check, GP02 the other 119 spaces and a
#   closure pass in space 1 (one M0 index stop a space), GP03 the notch
#   through space 1 with the slotting saw.
# - Setup 8, bench: the stack broken, each gear deburred and accepted on its
#   own (over-pins, tooth runout to its bore).
# - Setup 9, lathe 4-jaw on the cam fixture MHA-DT-12-TL-01 (its kit sheet
#   MHA-DT-12-TL-00): the cam turned on each gear, located by the notch.
# - Setup 10, bench: the cam checked, its edge broken, cosmetic faces polished, the final check.
# The CNC cuts only the teeth and the notch (AGENTS.md: CNC for milled work,
# the manual lathe for turning); the index is the BS-0's crank, by hand at
# each M0.
#
# R1 stays recoverable: one blank at a time on the cone gears' keyed arbor
# MHA-DT-03-TL-03 (seat .3755-.3760, key out), the same GP01-GP03 with one
# blank's ends. R2b, a gang of 20 on a longer arbor, would save about 1.3 h
# over the 20 gears (one setup, touch-off and depth check fewer) and is not
# taken: its arbor's journal doubles in length.
#
# Main's conditions (2026-11-22) and where each is checked:
# 1. Outboard support: the BS-0's tailstock (cad/config/shop-equipment/
#    fixtures.bs-0-tailstock; on hand with its dead centre, owner
#    2026-11-24). The arbor's deflection under the
#    cut at its worst station is computed by cam.py (stepped beam, fixed at
#    the BS-0 jaws, pinned at the tailstock) and booked in the depth budget.
# 2. Each gear accepted after the stack is broken (Setup 8): over-pins and
#    tooth runout to its own bore. The arbor fit (the journal turned to the
#    reamed blanks, .3758 at least, in the reamed bore) is booked in
#    cam.py's runout budget.
# 3. Index: 120 spaces × 5 holes on the 15-hole circle = 40 crank turns,
#    back in the start hole (cam.py computes it from machines.bs-0; GP02's
#    stops print each index; its last pass, in space 1 again, must cut no
#    chips). GP01 ends after space 1 for the depth check; the stack comes off
#    only after GP02's closure pass and GP03.
# 4. Exit burrs: every rim stands free between the cam bosses, so a washer
#    can back only the end blank; Setup 8 stones the burrs off the rim faces
#    flat, never into a tooth space, before the cam fixture needs the gear to
#    lie flat.
# 5. The arbor: fixtures.dt-cylinder-gear-gang-arbor (to_make), made in
#    Setup 4 (reason above).
#
# Program names, [parameters] and milling_cuts names are a contract with
# cad/process/dt_cylinder_gear/cam.py. Tool numbers: T1 the gear cutter, T2
# the slotting saw (the mill's tools in the order of the tools list).
#
# Fits (owner 2026-11-23/24; fit audit fit-audit-2026-11-23 README rows
# "Cylinder gears, 20 bores, owned .3760 reamer" and "Cylinder gear bore
# stays reamed"; policy PR #3513, tracking issue #3511): the bore is reamed
# with the owned .3760 reamer and accepted by its mate, the 3/8 ground
# setting mandrel (the MHA-DT-13 shaft's own bar) entering with no shake; no
# plug gauge pair is bought. The sheet prints the same: Ø.3760 REAM THRU,
# MHA-DT-13 ENTERS, NO SHAKE, with no band (#3524). cad.bore_dia_* is the
# spec's analysis band, what the reamer is expected to cut, used to size the
# reaming, the arbor fit and the runout budget. The gang arbor's journal is
# made to fit the reamed blanks the same way.
#
# To order before the first load (records cited): the #2 48DP cutter TTC
# 10-289-482 (tools.gear-cutters-48dp-20pa), the 7/8 stub arbor HHIP
# 3900-0162 (tools.gear-cutter-arbor-7-8; its 3/4 shank goes in the owned R8
# collet set), the slotting saw TTC 10-215-014 (tools.cylinder-notch-saw; it
# runs on the owned R8 stepped saw arbor, tools.saw-arbor-r8-stepped, so no
# 1 in arbor is bought), the pin gauges (gauges.pin-gauges, on the owner's
# order), the 3/8 ground bar the setting mandrel is cut from
# (tools.setting-mandrel-375), the India stone (tools.india-stone-ib8), the
# 2-5/8 C360 bar (stock.c360-round-gear-blanks). The V-blocks are on hand
# (fixtures.v-blocks, owner 2026-11-24). The cone kit's TL-04 1.75 collar
# and arbor nut are made by that kit.
#
# Mill speeds are the spindle's stops, 107.7 rpm apart (#3439): 215 for the
# cutter (two stops), 108 for the saw (one), 969 for the edge finder (nine).
#
# ASSUMED until bought or measured (each checked at the machine before
# cutting): the cutter's 12 teeth (shop dt.toml
# settings.cylinder-gear-cutter-c360), the stub arbor's nut and shoulder no
# larger than Ø1.50, the BS-0 tailstock no wider than 2 in across at centre
# height within 4 in of its centre point (its manual gives only the base,
# 87 mm wide), the BS-0 chuck's 5 in body.
title = "Cylinder Gear"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass, 2-5/8 in round (drawing: {{cad.material_name}})"
stock = "2-5/8 in round C360 bar (to order, 12 in, shared with the cone gears MHA-DT-03): 20 slices {{process.slice_in:.2dot}} thick. Arbor, once: 7 in of the 5/8 in 1018 CF bar on hand."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Brass cut dry. Lathe PM-1127VF-LB (70-380 and 380-2000 rpm). Teeth: 120, 48DP 20°, cutter #2 (55-134 teeth). Finished O.D. Ø{{cad.teeth_dia_min_in:.3dot}}-{{cad.teeth_dia_max_in:.3dot}}, thickness {{cad.cam_face_thickness_min_in:.3dot}}-{{cad.cam_face_thickness_max_in:.3dot}}, bore Ø{{cad.bore_dia_min_in:.4dot}} reamed (the MHA-DT-13 bar enters, no shake). Twenty gears in two loads of ten: load 1 is gears 0-9. Load 2 (gears 10-19): Setups 5 to 8 again, every op except those marked first load only (the zeros and the depth check are taken again). Setup 9 after both loads."
shop = "../shop"
stock_refs = ["c360-round-gear-blanks", "1018-round-5-8"]
material_key = "lathe-c360"
turning_material = "brass"
milling_material = "brass"

[cad]
file = "../../out/features/dt_cylinder_gear/features.toml"
adapter = "drilled_block"
part = "dt-cylinder-gear"

[parameters]
quantity = 20
# prechips stock_fit: one sawn slice of the 2-5/8 bar.
blank_x_in = 2.625
blank_y_in = 2.625
blank_z_in = 0.34
# Blanks a load (route R2, owner ruling 2026-11-22).
gang = 10
# Slices off the 2-5/8 bar: the gear's .300 and about .02 a face to face.
slice_in = 0.34
# Chucking 1: the sawn slice .12 in the jaws, .22 out (the boss and its
# shoulder are cut in the .22 out, clear of the jaws).
slice_grip_in = 0.12
slice_dia_mm = 66.675
slice_stickout_mm = 5.588
# The cam boss: Ø1.92 holds the finished cam (its centre .3402 off the bore,
# its radius .6025: .9427 from the bore's axis, the test checks it) with .017
# to clean up. Its length, cam face to shoulder: the gear's .300 less the
# rim's .118.
boss_dia_mm = 48.768
boss_length_min_in = 0.181
boss_length_max_in = 0.183
# Chucking 2: the boss in the jaws to the rim face, about .15.
boss_grip_stickout_mm = 4.0
# The gang arbor (Setup 4; fixtures.dt-cylinder-gear-gang-arbor), from the
# 5/8 bar's raw stub in the jaws: a body Ø.600 2.50 long, the shoulder, the
# journal 2.94, the pilot .21 for the TL-04 collar's .290 bore, then the
# 1/4-28 thread .65 to the tail centre, its first 1/16 a relief groove Ø.180
# (the cone kit's relief diameter) so the nut runs full threads onto the
# collar (its minor .2113 = .250 - 1.0825/28). The pilot ends short of the
# collar's outer face at the thinnest stack (cam.py checks the nut bears on
# the collar two threads past the relief).
# X here: from the shoulder (blank 1's back face, G54 X0 in Setup 6).
arbor_bar_dia_mm = 15.875
arbor_saw_in = 7.0
arbor_stub_in = 0.5
arbor_stickout_mm = 160.02
body_dia_mm = 15.24
body_length_in = 2.5
# The journal is made to fit the reamed blanks (Setup 4): no upper limit is
# set by number, the blank sliding on is the limit. The lower limit is the
# runout budget's (cam.py), read with the micrometer.
journal_dia_min_mm = 9.54532
journal_length_mm = 74.676
pilot_dia_mm = 6.985
pilot_length_mm = 5.334
relief_dia_mm = 4.572
relief_width_mm = 1.5875
thread_major_mm = 6.35
thread_pitch_mm = 0.907143
thread_minor_mm = 5.368
thread_length_mm = 16.51
# The cutter set's records (cad/config/shop-equipment/tools-gear-cutting.toml,
# tools.gear-cutters-48dp-20pa: #2 member's tooth range, its pitch and
# angle) and the saw's width (tools-cutting.toml, tools.cylinder-notch-saw,
# .014): the test reads them against the inventory. The least cutter tooth
# count Setup 6 accepts: at the settings record's feed (12 teeth assumed) a
# 10-tooth cutter's chip still keeps the depth budget (cam.py).
cutter_member_teeth_min = 55
cutter_member_teeth_max = 134
cutter_diametral_pitch = 48
cutter_pressure_angle_deg = 20
saw_thickness_mm = 0.3556
cutter_teeth_min = 10
# The shoulder's relief: the P1 blade .010 into the journal at the shoulder
# (the AR insert's R0.4 nose would leave a fillet past the blank's .010 bore
# break, and blank 1 would not seat).
relief_depth_in = 0.010
# The P1 cutoff blade's width (tools.cutoff-blade-p1, width_in). The blade
# only plunges the arbor's thread relief here; nothing is parted with it.
blade_width_in = 0.0625
# The BS-0's 3-jaw grips the body .75; its jaw fronts stand this far from
# the shoulder: the cutter's and the saw's reach toward the jaws stays
# short of it (cam.py).
standoff_mm = 44.45
body_grip_in = 0.75
# TL-04 C175 collar on the pilot (Ø1.75 × .33, MHA-DT-03-TL-04; the test
# reads the cone arbor spec).
collar_dia_mm = 44.45
collar_length_mm = 8.382
# Setup 5 and 6 mount acceptance: the body at the lathe's jaws, and the
# stack's O.D. on the BS-0, within .001 TIR (the shop's runout row floor).
# On the BS-0 it is the stack's eccentricity to the head: the runout's mount
# term only (cam.py). The depth check's two opposite pins cancel it; tilt or
# taper along X is read by that check on blanks 1 and 9.
mount_tir_max_mm = 0.0254
# Setup 5: the stack's O.D., the print's band, aim mid-band.
stack_od_min_in = 2.532
stack_od_max_in = 2.536
stack_od_aim_mm = 64.3636
# Prove-out (Setups 6 and 7, first load): G54 Y moved back .200 so the
# saw's deepest Y (3.048) stays 2.03 short of the tips.
prove_out_back_mm = 5.08
# Setup 5 lathe hold: the arbor body in the 3-jaw, the dead centre in the
# tail: jaw fronts to the tail centre.
stack_stickout_mm = 140.97
# GP01/GP02: the cutter lies in the XY plane at the stack's axis height (Z0),
# on the operator's side of the stack (-Y); +Y into the work. Y0: the
# cutter's rim on the stack's tips through .001 paper (touch Y -0.025).
paper_mm = 0.0254
# Plunge aim: the middle of the print's band (cam.py checks the band and
# the budget).
plunge_aim_mm = 1.143
# Pass ends, past the work by pass_margin_mm at the deepest plunge's reach
# (cam.py computes them: the cutter's half chord at depth plus the margin).
pass_margin_mm = 0.5
cutter_x_start_mm = 79.19
cutter_x_end_mm = -7.61
# Every rapid and every index stop's approach stays .100 out from the tips.
clear_y_mm = -2.54
# GP01 ends with the cutter drawn back 2.00 from the tips past blank 1: room
# for the micrometer's anvil and frame over the pin on the cutter's side
# (parked at depth, the rim would stand .008 off blank 1's
# tips, where the pin and anvil go). GP02 feeds back to the depth along +Y,
# the way every GP01 run reaches it, so only the axis's one-way repeat
# stands between the measured spaces and the rest.
measure_park_y_mm = -50.8
# GP01's first run is set .003 shallow (G54 Y back 0.076 mm) and deepened
# from the depth check.
first_run_shallow_mm = 0.0762
# The depth check (Main's condition 1): GP01 cuts space 1, then, 20 crank
# turns on (60 spaces, the opposite one), space 61. Two Ø.040 pins in spaces
# 1 and 61, the micrometer over them, less that blank's O.D.: the drawing's
# own over-pins measure, in which the stack's eccentricity on the head
# cancels. It moves 2:1 with the depth. Read on the deepest blank (the least
# arbor deflection, blank 1) and the shallowest (the most, blank 9; cam.py
# finds both): every blank lies between them. The window is the acceptance
# band less a micrometer reading's resolution at each end, two readings. A
# shallow cut is corrected by the two readings' mean to the aim, mid-window,
# so both blanks land inside whatever their spread up to the stop; a wider
# spread than the stop (over twice the expected one, cam.py) is not cut on.
pin_dia_in = 0.040
depth_deep_blank = 1
depth_shallow_blank = 9
depth_window_min_in = 0.0254
depth_window_max_in = 0.0289
depth_spread_in = 0.0013
depth_aim_in = 0.0272
depth_spread_stop_in = 0.0030
# The crank turns from space 1 to space 61 (half the worm's 40).
opposite_turns = 20
# Acceptance over two Ø.040 pins in opposite spaces less the gear's own
# O.D. (the plunge's effect); the absolute reading prints as REF (the test
# recomputes both from dt_cylinder_gear_spec's profiles).
over_pins_min_in = 2.5572
over_pins_max_in = 2.5651
pins_less_od_min_in = 0.0252
pins_less_od_max_in = 0.0291
# Setup 10 phase check: the notch level, the cam's centre falls below the
# bore's axis by the mid throw × sin(3° ∓ .7°), rounded inward (the test
# recomputes it from the drawing's cam requirement).
phase_drop_min_in = 0.0137
phase_drop_max_in = 0.0219
# The index (prechips' indexing check; cam.py prints it at each stop).
index_tolerance_deg = 0.01
# GP03, the notch: the slotting saw at Z0 through space 1 to the notch
# band's middle, one pass -X to its centre over blank 1's back face (full
# depth through blank 1, the saw's reach .375 short of the jaws), then out
# along Y. Y0: the saw's rim on a tooth tip through .001 paper, the saw
# raised half a space (1.5°) so it touches the tip beside space 1: touch at
# Z +0.843 and set Y -0.014 (the paper less R(1 - cos 1.5°): that tip stands the drop
# past Y0); cam.py agrees.
notch_aim_mm = 3.048
saw_x_start_mm = 86.9
saw_x_end_mm = 0.0
saw_touch_z_mm = 0.843
saw_touch_y_mm = -0.0144
# ASSUMED until bought or measured (checked at Setups 6 and 7): the stub
# arbor's nut and shoulder at most Ø1.50; the BS-0 tailstock within 1 in of
# its axis at centre height; the BS-0 chuck's 5 in body
# (workholding.chuck-3jaw-5-bs0). Measured by the owner (2026-11-24): the
# owned R8 stepped saw arbor's cap and body, 1.25 in across
# (cad/config/shop-equipment/ tools.saw-arbor-r8-stepped, cap_dia_in; the
# test reads it).
cutter_arbor_nut_dia_mm = 38.1
saw_arbor_cap_dia_mm = 31.75
tailstock_half_width_mm = 25.4
bs0_chuck_dia_mm = 127.0
# The deflection's material constants (cam.py), as prechips' own turning
# config (prechips turning.toml, materials.brass and materials.steel_1018,
# Machinery's Handbook Table 3a medium brass and the 30 million psi steel
# proxy): the brass's unit power, hp per in³/min, and the 1018 arbor's
# modulus. The HA venv does not carry prechips, so the recipe cannot read it.
brass_unit_power_hp_min_per_in3 = 0.50
arbor_modulus_gpa = 207.0
# prechips' milling_deflection bends the beam with the cut material's
# modulus (materials.brass, 103 GPa), but the stack rides on the 1018
# arbor: Setups 6 and 7 declare the beam at the journal's brass-equivalent
# diameter, the least journal × (207/103)^¼ (equal E·I), which cam.py agrees.
brass_modulus_gpa = 103.0
beam_brass_equiv_dia_mm = 11.364

