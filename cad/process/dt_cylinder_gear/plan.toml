indexing = { head = "bs-0", tolerance_deg = "{{process.index_tolerance_deg}}", positions = 120 }
holding = "BS-0 on the table, spindle along X, chuck at the left. The loaded arbor in the BS-0 3-jaw on the body's last {{process.body_grip_in:.2f}}, the jaw fronts {{process.standoff_mm:in.2f}} from the shoulder (calipers), the .50 raw stub behind the jaws; the BS-0 tailstock's centre in the tail centre, oiled, snug. Lock the head's spindle for every cut."
datum = "Programs GP01_first_space and GP02_teeth. G54: X0 blank 1's back face (the shoulder), +X toward the tailstock; Y0 the stack's tips on the operator's side, +Y into the stack; Z0 the stack's axis. The cutter lies flat at Z0 on the operator's side. An alarm, E-stop, stall or reset during GP02: stop and tell the owner (GP02 does not resume part-way; the zeros are kept, the head's count is not)."
diagram = { file = "diagrams/teeth.svg", alt = "Top view: the stack on the arbor between the BS-0 chuck and tailstock; the gear cutter flat at the stack's axis height on the operator's side, passing along X; index plate A, 15-hole circle." }
envelope = "other"
vise_hold = "other"
beam = { axis = "x", hold = "between", extent_mm = [-44.45, 96.52], supports_mm = [-44.45, 96.52], section_mm = { diameter = "{{process.beam_brass_equiv_dia_mm}}" } }

[[setups.operations]]
instruction = "Before the first load: the BS-0 tailstock's centre reaches the arbor's tail at centre height, and the tailstock measures 2.00 or under across at centre height within 4 in of its point (calipers). Either fails: stop and tell the owner. The cutter is a #2 48DP 20° (55-134 teeth); count its teeth and mike its width across its side faces; write both down. Fewer than {{process.cutter_teeth_min}} teeth: stop and tell the owner (the programs' feed would overload the arbor)."
feed = "hand"

[[setups.operations]]
instruction = "Indicate the arbor's body beside the jaws and the stack's O.D. on blanks 1 and 10, each within {{process.mount_tir_max_mm:in.3dot}} TIR, shimming a jaw (the tooth depth and runout budgets rest on them). More after shimming: stop (the stack has moved on the arbor)."
inspection = "Body and stack O.D. (blanks 1 and 10) {{process.mount_tir_max_mm:in.3dot}} TIR or under."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Index plate A on the head, the plunger on the 15-hole circle, the sector arms spanning 5 spaces (the setup's index setting). Plunger in a hole: that hole is space 1's; mark it with a felt pen. Always crank the same way; overshoot: back half a turn and come in again."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0: the edge finder (in a collet, set 969) on blank 1's back face from the chuck side, at Y about .1 in from the tips: G10 L20 P1 X-2.540. Retract."
feed = "hand"

[[setups.operations]]
instruction = "Spindle stopped (M5). Mount the cutter on the 7/8 stub arbor in the 3/4 R8 collet, teeth cutting with M3 (clockwise seen from above), its key in, its nut and shoulder no larger than Ø{{process.cutter_arbor_nut_dia_mm:in.2f}} (calipers; larger: stop). Do not run the tool setter."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0, the stack's axis: mike blank 5's O.D.; the height gauge on the table reads the top of blank 5's rim, less half that O.D. is the axis height. Set the gauge to that less half the cutter's width; jog Z until the cutter's lower side face just drags the gauge's scriber (cutter beside the stack, Y clear): G10 L20 P1 Z0."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0: spindle at 215, the cutter over blank 5's rim (X 32.0), jog +Y until it just takes a .001 paper on the tips: G10 L20 P1 Y-0.025. Jog Y back to -2.54. Then shift Y0 back .003 for the first GP01 run: send $#, G10 L2 P1 Y(the G54 line's Y - {{process.first_run_shallow_mm:.3f}})."
feed = "hand"

[[setups.operations]]
instruction = "First load only, spindle stopped: jog the cutter to X {{process.cutter_x_end_mm:.2f}} and to X {{process.cutter_x_start_mm:.2f}} at Y -2.54 and then at Y {{process.plunge_aim_mm:.3f}}: its rim, nut and the collet clear the BS-0 jaws, the collar, the nut and the tailstock by eye with a rule held across."
feed = "hand"

[[setups.operations]]
instruction = "First load only, prove-out with the cutter clear of the work: send $#, note the G54 Y, then G10 L2 P1 Y(that Y - {{process.prove_out_back_mm:.2f}}). Spindle on, single block: run GP01_first_space (an air pass beside the tips), then GP02_teeth to its first stop without indexing; reset. Restore G54 Y to the noted value (G10 L2 P1 Y...): the .003 shallow shift is in it."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "cutter"
drilling = "none"
sizing = "other"
instruction = "Run GP01_first_space (T1 already in; set 215): one pass -X through space 1 of all ten rims to Y {{process.plunge_aim_mm:.3f}}. It ends past blank 1 with the cutter drawn back 2.00 from the tips (room for the micrometer), the spindle stopped and the program ended: do not jog. Check the spindle has stopped before reaching in."
settings = "cylinder-gear-cutter-c360"
