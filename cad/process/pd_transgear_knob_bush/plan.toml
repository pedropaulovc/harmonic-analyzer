# Transgear knob bush MHA-PD-28, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC). The 5/8
# in 1018 bar on hand (cad/config/shop-equipment/stock-bought.toml
# 1018-round-5-8, allocated to MHA-PD-28 by owner ruling 2026-11-20, #2425).
# Setup 1, the bar's end, about 1 in out: MHA-PD-19's hole is read first,
# by a pilot. Op 10 squares the sawn end and turns the first .06 of it to
# Ø.4400; Op 20 brings it down with an abrasive strip on a file, a few
# strokes between readings (the MHA-PD-23 journal's polishing route: an
# insert does not take a dependable tenth, traveler review r3), until the
# plate's reamed hole just slides on it without shake, and mikes
# it (that reading is the hole); Op 40 faces the pilot off. The pilot only
# reads the hole and is gone before anything of the bush is cut, so the
# finished press diameter is one diameter from the shoulder to the rear
# face, as the sheet draws it (traveler review r2: a pilot left on the bush
# was a land the drawing does not show). It has its own short chucking
# because the .06 it takes, added to Setup 2's stick-out, would stand the
# bar past three times the press diameter (prechips lathe_holding).
# Setup 2, the bar pulled out, rear end out: face the rear face (Z0), turn
# the hub to its .51-.53 band back past the parting line, then the press
# diameter and the shoulder (datum A): Op 90 finishes the press diameter to
# the PILOT reading plus .0007-.0016. That is the sheet's .0005-.0016 over
# the hole (Codjiflo #3486: the pilot stands in for the hole, so its slip
# comes off the interference): Op 20 mikes the pilot after every few strokes and
# writes the last two readings, the one the plate would not go on (BEFORE)
# and the one it slides on (PILOT); the hole lies between them, so with
# BEFORE at most .0002 over PILOT (pilot_step_max_in) a press diameter of
# PILOT plus .0007 is at least .0005 over the hole, and PILOT plus .0016 at
# most .0016 over it.
# The shoulder's root is formed by the P1 blade's corner
# (R.005 MAX; the AR's R0.4 mm nose cannot form it). Then spot and drill B
# (.238) through past the parting line in the same chucking, and part off
# .02 long. That is the route pd_transgear_knob_bush_geometry's wall stack
# assumes: the hub, the press diameter, the shoulder and the B hole in one
# chucking, so the hole runs true to the press diameter and square to the
# shoulder within the drill's run-off. MHA-PD-00 step 11 presses the bush
# into MHA-PD-19 from face A and reams the B hole with the .2490 reamer in place
# (sheet: REAM THRU AFTER PRESSING IN MHA-PD-19); the reamer follows this
# hole and makes only the size, so the bore's axis is this drilled hole's.
# The wall stack budgets the drill's run-off (DRILL_RUN_OFF_DEG) for the WALL
# .068 MIN, but that run-off is wider than the bore's .002 perpendicularity to
# A, so the drill does not hold the .002: Ops 160–180 check the drilled hole over
# a gauge pin before part-off, still in the chucking that turned the
# shoulder, and a bush whose hole has run off is scrapped there. No boring
# bar on hand trues a Ø.24 hole 1.14 deep (cad/config/shop-equipment/
# tools-cutting.toml: the MEDA 6045000 set's smallest bar is 3/8 in, the
# S10R-SCLCR3 has a 10 mm shank, and the Micro 100 BB-180500S, to order,
# reaches .500 deep), so the hole is not bored true.
# Setup 3: the bush turned round, its hub in the 3-jaw over a shim wrap, the
# parted end (the hub face) out: faced to .809 from the shoulder, read over a
# .350 gauge block standing on the shoulder.
#
# No gauge is bought for the plate's hole (rule 4, form 2, the bush made to
# the hole; the owner on the audit: "why do we need single micron
# level tolerance x class plug gauges for a hobby machining project"; "can
# the holes not be reamed in the first place"): MHA-PD-19 reams it with the
# over/under set's .4385 reamer and this traveler fits the bush to it, the
# plate itself the gauge and the .0001 micrometer the only instrument. The
# sheet prints the press diameter (Ø.4385) REF and the interference
# .0005-.0016. The feature export declares that reference and the
# interference and no diameter band, so the pictures print the fit to the
# measured mate; the checks on the press diameter are against the written
# PILOT reading.
# The minus pin gauges (gauges.toml pin-gauges, to
# order) are for Op 160's pin in the B hole. The .2490 reamer (reamer-2490, to order) is
# MHA-PD-00's, not this traveler's.
title = "Transgear Knob Bush"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel round bar, 5/8 in"
stock = "Lot: {{process.quantity:d}} bush. Ø{{process.stock_dia_in:.3dot}} bar, on hand (saw a {{process.bar_length_in:g}} in working piece off the bar); the bush takes {{cad.pitch_in:.2dot}} in of it."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); steel cut with cutting oil. MHA-PD-19, the plate this bush is pressed into, is made first and is at the lathe: Setup 1 fits a pilot to its hole and writes its reading, and Op 90 turns the press diameter from that reading. Left for MHA-PD-00 step 11 (not made here): the Ø{{cad.bore_dia_min_in:.4dot}} ream after pressing (the MHA-PD-08 journal is turned to that bore), which follows the B hole this traveler drills in the chucking that turns the press diameter and the shoulder (Ops 160–180 check the hole's squareness to the shoulder before part-off). To order (not on hand): the minus pin gauges for the B hole (Op 160)."
shop = "../shop"
stock_refs = ["1018-round-5-8"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_knob_bush/features.toml"
adapter = "turned_bush"
part = "pd-transgear-knob-bush"

[parameters]
quantity = 1
stock_dia_in = 0.625
# The bar on hand, cut to a working piece, and the length the 3-jaw grips.
bar_length_in = 4.0
chuck_grip_in = 0.75
# Facing allowance: squares the bar end in Setup 2.
face_allowance_in = 0.015
# Left on the parted end (the hub face) for Setup 3 to face to the shoulder.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts: .06, so the bar stands
# 1.313 out, inside three times the press diameter turned at its end.
jaw_clearance_in = 0.06
# Setup 3: how much of the hub the jaws take, from the shoulder.
regrip_grip_in = 0.5
# Left a side over the band's low end for the finish passes.
finish_allowance_in = 0.01
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.0762
turn_start_z_mm = 0.5
# Ops 160-180, the B hole's squareness to the shoulder over a gauge pin. The pin
# is the largest minus pin of the set (gauges.toml pin-gauges, Class ZZ, .001
# steps) that enters by hand, pushed in pin_depth_in; the indicator reads it
# at pin_near_in and pin_far_in out of the rear face, with a chuck mark at
# top, bottom, front and back. A difference across the turn (top less bottom, front less back)
# is twice the pin's offset from the spindle axis in that plane, so the far
# difference less the near one is twice the tilt in that plane times the
# stations' .80 spacing; the pin's offset at the mouth cancels. The pin can
# lie in the hole tilted by its fit: under the next size up plus the ZZ
# minus tolerance, .001 + .0002, over pin_depth_in. The bore's Ø.002 zone
# over its longest length (1.145) allows .002/1.145 of tilt; less the pin's
# .0012/1.00 that leaves .00055, and /√2 for each of the two planes:
# 2 x .00039 x .80 = .00062 in (.0157 mm), set down to .015 mm on the
# 0.001 mm indicator. test_pd_transgear_knob_bush_drawing holds it to the
# spec and the geometry.
pin_depth_in = 1.0
pin_near_in = 0.1
pin_far_in = 0.9
pin_fit_max_in = 0.0012
pin_tilt_reading_max_mm = 0.015
# The feeler leaf the tools are touched through (the shop's feeler gauges,
# cad/config/shop-equipment/gauges.toml feeler-gauges).
touch_leaf_in = 0.002
# Setup 1's pilot: the bar's stick-out for it (authored, short), the
# smallest the pilot can come out (under the .4385 reamer's hole), for the
# hold, the length of the bar's end turned to a slip in MHA-PD-19's hole,
# the diameter it is turned to before the fitting passes (over the largest
# hole the reamer is modelled to cut, .4390), the most the last fitting
# pass may take off the diameter, and the least the press diameter stands
# over PILOT: the sheet's least interference plus that step
# (test_pd_transgear_knob_bush_drawing holds the sum).
pilot_stickout_in = 1.0
pilot_stickout_mm = 25.4
pilot_min_dia_mm = 11.1
pilot_length_in = 0.06
pilot_rough_dia_in = 0.44
pilot_step_max_in = 0.0002
press_over_pilot_min_in = 0.0007

