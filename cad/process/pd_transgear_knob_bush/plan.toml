[[setups]]
machine_kind = "lathe"
title = "Bar, rear end out: turn the hub, the stub and the shoulder, drill B, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts. The bar stays in the jaws from Op 10 to Op 160: the stub, the shoulder and the B hole share this chucking."
datum = "Z0 (carriage DRO): the bar end faced in Op 10, the bush's rear face. The shoulder (datum A) is at Z{{cad.step_far_out_far_z_mm:in.3dot}}, the hub face {{cad.length_in:.3dot}} in."
diagram = { file = "diagrams/bar.svg", alt = "The 5/8 in bar in the 3-jaw, rear end out: the rear face faced, the hub turned back past the parting line, the stub turned back to the shoulder, the B hole drilled through past the parting line; the bush parted off .02 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the sawn bar end square, the last {{process.face_allowance_in:.3dot}} in off: the rear face, the cup's thrust face, Ra 63. The last skim no more than .002 deep at the settings' feed: the AR's R0.4 mm nose at that feed leaves about Ra 32. Set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Hub rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Hub finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the hub's diameter from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}, cutting oil: rough to Ø{{cad.outer_rough_dia_mm:in.3dot}}, then one finish pass to Ø{{cad.outer_dia_mm:in.3dot}}; mike it once. Ops 40–50 turn the stub out of its end, back to the shoulder."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Hub Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Hub over {{cad.outer_dia_max_in:.3dot}} in Op 20: another finish pass. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Stub rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.outer_dia_mm}}", end_diameter_mm = "{{cad.step_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the stub from Z0 back to the shoulder at Z{{cad.step_far_out_far_z_mm:in.3dot}}, cutting oil, to Ø{{cad.step_rough_dia_mm:in.4dot}}: on each pass feed the AR out along the shoulder at that Z, squaring the shoulder's face (datum A)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_rough_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Stub finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.step_rough_dia_mm}}", end_diameter_mm = "{{cad.step_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish it to the same shoulder Z in passes of .001 a side or less, miking between them, to Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}, aiming at Ø{{cad.step_dia_mm:in.4dot}}: the sheet's bonded fit in MHA-PD-19's reamed hole, clearance {{cad.step_clearance_min_in:.4dot}}–{{cad.step_clearance_max_in:.4dot}}. The AR's nose leaves its R0.4 mm in the root (Ops 60–80 take it out). Write down the cross-slide DRO X (diameter) at the finished diameter."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Stub Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} along its length, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, P1 blade in the post, its chuck-side face about .10 from the shoulder (clear of the root's fillet). Bring its tip onto the stub through the {{process.touch_leaf_in:.3dot}} leaf until it drags; set DRO X to the Op 50 reading plus .004 (the leaf, on the diameter). Leaf out."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Back X out to DRO X the Op 50 reading plus .04 (on the diameter, .02 a side): above the root's fillet, still below the hub. Z: bring the blade's chuck-side face onto the shoulder's face through the leaf until it drags. Leaf out; move the carriage {{process.touch_leaf_in:.3dot}} toward the chuck by its handwheel dial and lock it."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Spindle running, cutting oil: plunge until DRO X reads the Op 50 reading, no further. The blade cuts only the AR's fillet out of the root, leaving its own corner: the sheet's R{{cad.shoulder_root_r_max_in:.3dot}} MAX, which the AR's nose cannot form. Back the blade out in X and unlock the carriage."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Root: square to the eye, no fillet, step or groove at the stub's end; the stub by micrometer next to the root, Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Stub over {{cad.step_dia_max_in:.4dot}} in Op 50: another AR finish pass of .001 a side or less to the same shoulder Z, checked again as Op 50, before Op 60. Over in Op 80: the same AR pass, write down its new DRO X, then repeat Ops 60–80 with that reading. Under {{cad.step_dia_min_in:.4dot}}, or a groove at the root: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 3 centre drill, about Ø.18 across the countersink: under the B drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-b"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the B drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}, cutting oil, backing fully out to clear chips and re-oil every .24 in (once its diameter): through the bush and past the parting line, in the chucking that turned the stub and the shoulder. MHA-PD-00 step 11 reams this hole after the bond has cured."
settings = "lathe-drill-b-1018"
cut_diameter_mm = 6.0452
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = 6.0452, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "pins"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, tailstock back. A pin for the B hole's squareness check: the largest minus pin of the set that enters the hole by hand (the next size up does not). Push it {{process.pin_depth_in:.2dot}} in into the rear face, calipers' depth rod."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
instruction = "Mark the chuck's rim. Lever indicator on the carriage, its tip on top of the pin at {{process.pin_near_in:.2dot}} out of the rear face (DRO Z). Turning the chuck by hand, read it with the mark at the top and at the bottom, then at the front and at the back; write the two differences, top less bottom and front less back."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
instruction = "The same four readings at {{process.pin_far_in:.2dot}} out, and the same two differences. Pull the pin."
inspection = "Each difference here less its Op 130 difference, either sign: at most {{process.pin_tilt_reading_max_mm:.3f}} mm on the 0.001 mm indicator (holds ⊥ Ø{{cad.bore_perpendicularity_in:.3dot}} to A with both planes at this limit together and the pin's fit charged; a full-swing difference reads twice the tilt)."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{process.pin_tilt_reading_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{process.pin_tilt_reading_max_mm:.3f}} mm in Op 140: the B hole has run off; part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}, cutting oil: {{process.regrip_allowance_in:.2dot}} over length, for Setup 2. Hands clear: let the bush fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face the hub face to the shoulder station"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap of brass shim, {{process.regrip_grip_in:.2dot}} in of the hub in the jaws from the shoulder (a pencil line that far from it at the jaw fronts), the wrap cut no wider than that, the stub clear of the jaws behind it; the parted end (the hub face) out. Nothing seats the bush axially."
datum = "Z0 (carriage DRO): the hub face as faced in Op 180, {{cad.shoulder_in:.3dot}} from the shoulder, preset in Op 170 from the shoulder's reading over the .350 gauge block through a {{process.touch_leaf_in:.3dot}} feeler leaf."
diagram = { file = "diagrams/regrip.svg", alt = "The bush turned round, its hub in the jaws over a shim wrap with nothing behind it: the parted end faced to the shoulder station." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_datum_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "blocks"
drilling = "none"
sizing = "other"
instruction = "Stand the .350 gauge block on the shoulder against the stub and mike from the parted end over the block's top; less .350, that is the parted end's height over the shoulder (about .829). Chuck it. Spindle stopped, bring the AR's tip onto the parted end's rim through the {{process.touch_leaf_in:.3dot}} leaf until it drags; set DRO Z to that height less {{cad.shoulder_in:.3dot}}, plus the leaf."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Leaf out, spindle running, cutting oil: face in light skims to Z0, the last no more than .002 deep at the settings' feed (the hub face, MHA-PD-15's thrust face, Ra 63: about Ra 32 from the R0.4 mm nose). Unchuck; mike over the block again and across the faces."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Shoulder {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}} from the hub face (micrometer over the .350 block, less .350); length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} across the faces, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.shoulder_band_mm}}" }, { gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Shoulder over {{cad.shoulder_max_in:.3dot}} in Op 180: chuck it again as Op 170 and repeat Ops 170–180 from that reading. Under {{cad.shoulder_min_in:.3dot}}, or the length outside its band with the shoulder in: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and oil the bush"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bush: hub, shoulder at {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}} from the hub face, stub, {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} long, the B-drilled bore left for the ream at assembly." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr the outside edges with the smooth file: the hub face's and the shoulder's outer edges and the rear face's edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Keep the file off the hub face and the rear face (the Ra 63 thrust faces), the shoulder's face and root, and the stub."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the bore with a light twist of the deburring set's countersink by hand, no burr standing on a face; the ream at assembly finishes the bore."
