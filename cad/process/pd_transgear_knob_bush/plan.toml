# Transgear knob bush MHA-PD-28, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC). The 5/8
# in 1018 bar on hand (cad/config/shop-equipment/stock-bought.toml
# 1018-round-5-8, allocated to MHA-PD-28 by owner ruling 2026-11-20, #2425).
# Setup 1, the bar: face the end (Z0, the hub face), turn the hub to its
# .51-.53 band back past the parting line, spot, drill B (.238) through and
# past the parting line, part off .02 long. The bore stays at the B drill:
# MHA-PD-00 step 11 presses the bush into MHA-PD-19 from face A and reams it
# .2490-.2495 in place (sheet: REAM THRU AFTER PRESSING IN MHA-PD-19), so its
# size, its .002 perpendicularity to the shoulder and its WALL .068 MIN are
# made there; this traveler leaves the reamer .011 on the diameter.
# Setup 2: the bush turned round, its hub in the 3-jaw over a shim wrap, the
# parted end out: face to length from the miked length (the MHA-MG-10 drum's
# regrip, touched through a feeler leaf), then the press diameter, turned to
# MHA-PD-19's gauged hole: the sheet's .4387-.4391 is .0005-.0016 over any
# hole that passes the plate's .4375 GO / .4382 NO-GO pair, so gauging the
# hole with that pair and turning to the band makes the matched press. The
# shoulder at .809 from the hub face, its root formed by the P1 blade's
# corner (R.005 MAX; the AR's R0.4 mm nose cannot form it).
#
# Not on hand (cad/config/shop-equipment/gauges.toml plug-gauges-4375-4382,
# to order): the .4375 GO / .4382 NO-GO Class X pair, shared with MHA-PD-19's
# own hole acceptance. The .2490 reamer (reamer-2490, to order) is
# MHA-PD-00's, not this traveler's.
title = "Transgear Knob Bush"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel round bar, 5/8 in"
stock = "Lot: {{process.quantity:d}} bush. Ø{{process.stock_dia_in:.3dot}} bar, on hand (saw a {{process.bar_length_in:g}} in working piece off the bar); the bush takes {{cad.pitch_in:.2dot}} in of it."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); steel cut with cutting oil. Left for MHA-PD-00 step 11 (not made here): the bore's ream to Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}} after pressing, its perpendicularity to the shoulder and its wall; this traveler leaves the B drill. To order (not on hand): the .4375 GO / .4382 NO-GO plug gauge pair for MHA-PD-19's hole."
shop = "../shop"
stock_refs = ["1018-round-5-8"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_knob_bush/features.toml"
adapter = "turned_bush"
part = "pd-transgear-knob-bush"

[parameters]
quantity = 1
stock_dia_in = 0.625
# The bar on hand, cut to a working piece, and the length the 3-jaw grips.
bar_length_in = 4.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Setup 2: how much of the hub the jaws take, from the hub face: all but
# .11 of its .809, so the rear end stands 1.143 - .70 = .443 in (11.25 mm)
# out of the jaw fronts, the blade clear of the jaws at the shoulder.
regrip_grip_in = 0.7
# Left a side over the band's low end for the finish passes.
finish_allowance_in = 0.01
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.0762
turn_start_z_mm = 0.5
# The feeler leaf the AR's tip is touched through in Setup 2 (the shop's
# feeler gauges, cad/config/shop-equipment/gauges.toml feeler-gauges).
touch_leaf_in = 0.002

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-b"
name = "B drill"
ref = "drill-b"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "feelers"
name = "Feeler gauges"
ref = "feeler-gauges"

[[tools]]
id = "plugs"
name = "Plug gauges .4375 GO, .4382 NO-GO"
ref = "plug-gauges-4375-4382"
status = "to_order"

[[tools]]
id = "blocks"
name = "Gauge blocks (the .350)"
ref = "gauge-blocks-mitutoyo"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "Bar: face the hub face, turn the hub, drill B through, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the bar end faced in Op 10: the bush's hub face."
diagram = { file = "diagrams/bar.svg", alt = "The 5/8 in bar in the 3-jaw: the hub face faced, the hub turned back past the parting line, the bore spotted and drilled B through past the parting line; the bush parted off .02 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off: the hub face, MHA-PD-15's thrust face, Ra 63. The last skim no more than .002 deep at the settings' feed: the AR's R0.4 mm nose at that feed leaves about Ra 32. Set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Hub rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Hub finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the hub from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}, cutting oil: rough to Ø{{cad.outer_rough_dia_mm:in.3dot}}, then one finish pass to Ø{{cad.outer_dia_mm:in.3dot}}; mike it once. Setup 2 turns the press diameter out of this length's far end."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Hub Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Hub over {{cad.outer_dia_max_in:.3dot}} in Op 20: take another finish pass and mike again. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 3 centre drill, about Ø.18 across the countersink: under the B drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-b"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the B drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}, cutting oil, backing fully out to clear chips and re-oil every .24 in (once its diameter): the hole runs through the bush and past the parting line. The bore stays at this drill: MHA-PD-00 step 11 reams it after pressing."
settings = "lathe-drill-b-1018"
cut_diameter_mm = 6.0452
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = 6.0452, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}, cutting oil: {{process.regrip_allowance_in:.2dot}} over length, for Setup 2. Catch the bush."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face to length, turn the press diameter to the gauged hole, form the shoulder"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap of brass shim, {{process.regrip_grip_in:.2dot}} in of the hub in the jaws from the hub face (a pencil line that far from it at the jaw fronts), the wrap cut no wider than that; the parted end about .46 in out of the jaw fronts, .44 once faced to length. Nothing seats the bush axially."
datum = "Z0 (carriage DRO): the rear face, faced to length in Op 80 and touched again in Op 100 through a {{process.touch_leaf_in:.3dot}} feeler leaf. The hub face is the length written in Op 80 behind it, so the shoulder, {{cad.shoulder_in:.3dot}} from the hub face, is at Z-(that length less {{cad.shoulder_in:.3dot}}): Z{{cad.outer_far_out_near_z_mm:in.3dot}} for a {{cad.length_in:.3dot}} bush."
diagram = { file = "diagrams/regrip.svg", alt = "The bush turned round, its hub in the jaws over a shim wrap: the parted end faced to length, the press diameter turned back to the shoulder, the shoulder's root formed by the parting blade." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = 11.75, minimum_diameter_mm = "{{cad.step_dia_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = -11.25 }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Mike the length at the outer rim (about {{cad.part_off_in:.3dot}} the first time). Chuck it. Spindle stopped, bring the AR's tip onto the parted end's outer rim with the {{process.touch_leaf_in:.3dot}} feeler leaf between, until the leaf just drags; set DRO Z to that length less {{cad.length_in:.3dot}}, plus the leaf."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Pull the leaf out. Spindle running, cutting oil, face in light skims to Z0, the last no more than .002 deep at the settings' feed: the rear face is the cup's thrust face, Ra 63, and the AR's R0.4 mm nose at that feed leaves about Ra 32. Unchuck, mike at the rim and write the length down."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} across the faces, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{cad.length_max_in:.3dot}} in Op 80: chuck it again as Op 70 and repeat Ops 70–80 from that reading. Under {{cad.length_min_in:.3dot}}: scrapped, not reworked; make another from Setup 1 on the bar."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "feelers"
drilling = "none"
sizing = "other"
instruction = "Chuck it again as Op 70 (the pencil line at the jaw fronts). Spindle stopped, bring the AR's tip onto the rear face's outer rim through the {{process.touch_leaf_in:.3dot}} leaf until it just drags and set DRO Z{{process.touch_leaf_in:.3dot}} there: Z0 on the rear face again. Work out the shoulder's Z: minus (the length written in Op 80 less {{cad.shoulder_in:.3dot}}); write it here."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "MHA-PD-19, the plate this bush is pressed into, made first: gauge its knob-bush hole. The .4375 GO plug enters it from face A; the .4382 NO-GO does not. Any hole passing this takes the {{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} press diameter as a {{cad.step_interference_min_in:.4dot}}–{{cad.step_interference_max_in:.4dot}} press: the sheet's measured hole. A hole failing it goes back to MHA-PD-19's traveler; do not turn the press diameter to it."
inspection = "{{cad.step_mate}} Ø.4375–.4382, GO/NO-GO plugs."
gauge_checks = [{ gauge = "plug-gauges-4375-4382", band_mm = [11.1125, 11.13028] }]
feed = "hand"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Press diameter rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.outer_far_out_near_z_mm}}", start_diameter_mm = "{{cad.outer_dia_mm}}", end_diameter_mm = "{{cad.step_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the press diameter from Z0 back to the shoulder's Z written in Op 100, cutting oil, to Ø{{cad.step_rough_dia_mm:in.4dot}}: on each pass feed the AR out along the shoulder at that Z, squaring the shoulder's face."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_rough_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Press diameter finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_start_z_mm = 0.0, kept_end_z_mm = "{{cad.outer_far_out_near_z_mm}}", start_diameter_mm = "{{cad.step_rough_dia_mm}}", end_diameter_mm = "{{cad.step_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish it to the same shoulder Z in passes of .0005 a side or less, miking between them, to Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}, aiming at its middle. The AR's nose leaves its R0.4 mm in the root (Ops 140–150 take it out). Write down the cross-slide DRO X (diameter) at the finished diameter."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Press diameter Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} along its length, micrometer (a press of {{cad.step_interference_min_in:.4dot}}–{{cad.step_interference_max_in:.4dot}} in the hole gauged in Op 110)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, P1 blade in the post. Z: bring the blade's chuck-side face onto the shoulder's face with the {{process.touch_leaf_in:.3dot}} leaf between until it drags, then move the carriage {{process.touch_leaf_in:.3dot}} toward the chuck by its handwheel dial and lock it. X: bring the blade's tip onto the press diameter through the leaf until it drags; set DRO X to the Op 130 reading plus .004 (the leaf, on the diameter)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Leaf out, spindle running, cutting oil: plunge until DRO X reads the Op 130 reading, no further. The blade cuts only the AR's fillet out of the root, leaving its own corner: the sheet's R{{cad.shoulder_root_r_max_in:.3dot}} MAX, which the AR's nose cannot form."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Root: square to the eye, no fillet, step or groove at the press diameter's end; the press diameter by micrometer next to the root as Op 130."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Press diameter over {{cad.step_dia_max_in:.4dot}} in Op 130: another AR finish pass of .0005 a side or less to the same shoulder Z, checked again as Op 130, before Op 140. Over in Op 150: the same AR pass, write down its new DRO X, then repeat Ops 140–150 with that reading. Under {{cad.step_dia_min_in:.4dot}} (too light a press in that hole), or a groove at the root: scrapped, not reworked; make another from Setup 1 on the bar."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check the bush"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bush: hub, shoulder at {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}} from the hub face, press diameter, {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} long, the B-drilled bore left for the ream at assembly." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr the outside edges with the smooth file: the hub face's and the shoulder's outer edges and the rear face's edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Keep the file off the hub face and the rear face (the Ra 63 thrust faces), the shoulder's face and root, and the press diameter."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the bore with a light twist of the deburring set's countersink by hand, no burr standing on a face; the ream at assembly finishes the bore."
feed = "hand"

[[setups.operations]]
instruction = "Shoulder station: stand the .350 gauge block on the shoulder, its face against the press diameter, its top .016 above the rear face; hold it there and mike from the hub face to the block's top. The reading less .350 is the shoulder's distance from the hub face."
inspection = "Shoulder {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}} from the hub face, micrometer over the .350 block."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.shoulder_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "A bush failing Op 190 is scrapped, not reworked: make another from Setup 1 on the bar."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: bright machined; protect with ISO VG 32 machine-oil film): wipe the bush clean and oil it with ISO VG 32 machine oil; wipe the press diameter and the bore dry before MHA-PD-00 step 11 presses and reams it."
feed = "hand"
