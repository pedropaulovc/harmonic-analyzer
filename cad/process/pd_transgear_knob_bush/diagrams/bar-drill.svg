<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 300 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.625 bar (stock_dia_in), the jaw fronts 1.298 behind Z0 (cad.jaw_z_mm), the hub Ø.520 (cad.outer_dia_mm) back to Z-1.238 (cad.run_end_z_mm), the press diameter Ø.4385 (cad.step_dia_mm) to the shoulder at Z-.334 (cad.step_far_out_far_z_mm), the part-off face at Z-1.163 (cad.part_off_in) with the 1/16 blade's kerf behind it. The 3-jaw's body and jaws are schematic (their sizes are not on record). The B drill to scale (shop drill-b, Ø.2380 = 71.4 px), its 118 deg point; its full diameter drawn at the quill reading Z-1.238 (cad.run_in, zeroed with the lips on the spot's rim). Drawn short to a break line (its length out of the chuck is not on record). The No. 3 centre drill's spot is not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 2, Op 150: the B drill from the tailstock through the bush, past the parting line (to scale, 300 px/in)</text>
