<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 1, drawn by hand: the turned-bush template's label row does not fit across the picture with both diameters' bands labelled, and leaving the hub's label out also left its turned band undrawn (traveler review r3). Bush at about 240 px per inch; the bar's stub in the chuck is shortened. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 1: the bar in the 3-jaw, rear end out, seen from the operator's side (not to scale)</text>
  <rect class="fixture-vise" x="30" y="80" width="130" height="240"/>
  <rect class="part-rest" x="160" y="125" width="90" height="150"/>
  <rect class="part-removed" x="250" y="125" width="14" height="150"/>
  <rect class="part-removed" x="264" y="125" width="194" height="12.5"/>
  <rect class="part-removed" x="264" y="262.5" width="194" height="12.5"/>
  <rect class="part-removed" x="458" y="125" width="80" height="22.5"/>
  <rect class="part-removed" x="458" y="252.5" width="80" height="22.5"/>
  <rect class="part-removed" x="538" y="125" width="6" height="150"/>
  <rect class="part-kept" x="264" y="137.5" width="194" height="125"/>
  <rect class="part-kept" x="458" y="147.5" width="80" height="105"/>
  <line class="hidden" x1="250" y1="171.5" x2="538" y2="171.5"/>
  <line class="hidden" x1="250" y1="228.5" x2="538" y2="228.5"/>
  <line class="centre-line" x1="140" y1="200" x2="730" y2="200"/>
  <line class="datum" x1="538" y1="115" x2="538" y2="285"/>
  <rect class="cutter" x="250" y="280" width="14" height="56"/>
  <path class="cutter" d="M500 256l22 6v50h-22z"/>
  <path class="cutter" d="M552 200l16 -9h74v18h-74z"/>
  <text class="label" x="72" y="70">3-jaw</text>
  <text class="label" x="168" y="112">Ø{{process.stock_dia_in:.3dot}} bar</text>
  <text class="label" x="232" y="56">turn the hub Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}</text>
  <line class="leader" x1="330" y1="62" x2="352" y2="135"/>
  <text class="label" x="430" y="80">turn the stub</text>
  <text class="label" x="430" y="96">Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}</text>
  <line class="leader" x1="470" y1="102" x2="492" y2="146"/>
  <text class="datum-label" x="548" y="130">Z0, the rear face</text>
  <text class="label" x="574" y="176">tailstock: centre drill,</text>
  <text class="label" x="574" y="232">then drill B through</text>
  <text class="label" x="376" y="318">shoulder (datum A)</text>
  <line class="leader" x1="440" y1="304" x2="457" y2="264"/>
  <text class="label" x="150" y="350">parting blade:</text>
  <text class="label" x="150" y="366">part off {{process.regrip_allowance_in:.2dot}} long</text>
  <line class="leader" x1="240" y1="344" x2="255" y2="337"/>
  <text class="label" x="530" y="300">AR: face the end, turn</text>
  <text class="label" x="530" y="316">the diameters and the shoulder</text>
  <text class="label" x="300" y="384">B hole, drilled through past the parting line</text>
  <line class="leader" x1="320" y1="372" x2="300" y2="230"/>
</svg>
