[[setups]]
machine_kind = "lathe"
title = "Bar: size the arm's bore on a plug, then turn the barrel and relief, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.bar_dia_in:.3dot}} bar, {{process.stickout_mm:in.2dot}} in out of the jaw fronts (rule)."
datum = "Z0 (carriage DRO): the bar end, faced in Op 10 for the sizing plug, then faced again in Op 50: the hub's REAR face (the relief end)."
diagram = { file = "diagrams/bar.svg", alt = "The 1 in bar in the 3-jaw: the rear end faced, the barrel Ø.88 turned back past the parting line, the relief Ø.65 turned .16 long at the rear end; the hub parted off 1.01 from the rear face." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = 25.4, stock_diameter_mm = 25.4, stickout_mm = "{{process.stickout_mm}}", minimum_diameter_mm = "{{cad.relief_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, about {{process.face_allowance_in:.2dot}} off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = 25.4

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Sizing plug for crank arm MHA-DT-06's seat bore (made first): turn the bar end Ø.770 from Z0 back to Z-{{process.plug_length_in:.2dot}}. Then, spindle stopped between passes, mike and take .0005–.001 a side a pass to about Ø.762, .002 over the expected bore; then .0001 a side a pass, trying the arm after each, until its bore first slides onto the plug with a light push and no rock."
settings = "lathe-ar-1018"
cut_diameter_mm = 19.558

[[setups.operations]]
cut_kind = "other"
instruction = "Mike the plug where the arm fitted; write it on this sheet as B (about .760): the bore's size. Mike the arm's thickness at four places round its bore; write the smallest as T (about .3125)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{process.plug_off_in:.3dot}}: the plug comes off; keep it with the arm."
settings = "lathe-part-1018"
cut_diameter_mm = 25.4

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the new bar end square, clean of the parting pip; set DRO Z0 on it again. This is the hub's rear face."
settings = "lathe-ar-1018"
cut_diameter_mm = 25.4

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the barrel from Z0 back to Z-{{process.barrel_run_in:.2dot}}, past the parting line: rough to Ø.89, then finish in light passes, miking between them, to Ø{{cad.barrel_dia_in:.3dot}} (the band's middle)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.barrel_dia_mm}}"
inspection = "Barrel Ø{{cad.barrel_dia_min_in:.3dot}}–{{cad.barrel_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.barrel_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the relief from Z0 back to Z-{{cad.relief_length_in:.3dot}} by the DRO: rough to Ø.66, then finish in light passes, miking between them, to Ø{{cad.relief_dia_in:.3dot}}; the AR leaves the step square to the axis."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.relief_dia_mm}}"
inspection = "Relief Ø{{cad.relief_dia_min_in:.3dot}}–{{cad.relief_dia_max_in:.3dot}}, micrometer; {{cad.relief_length_min_in:.3dot}}–{{cad.relief_length_max_in:.3dot}} long from the rear face, calipers' depth rod."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.relief_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.relief_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Barrel or relief over its band in Op 60 or Op 70: another finish pass, mike again; relief short: turn on to the length. Under a band, or a relief over {{cad.relief_length_max_in:.3dot}} long: part it off as scrap; chuck a fresh piece of the bar at least 1.75 long, 1.25 in out (rule), and start again at Op 50, keeping the plug and the B and T written in Op 30."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{process.part_off_in:.3dot}}: {{process.regrip_allowance_in:.2dot}} over length, for Setup 2. Hands clear: let the hub fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-1018"
cut_diameter_mm = 25.4

[[setups.operations]]
cut_kind = "other"
instruction = "The bar's remainder still in the jaws: on the 0–1 in micrometer (reads .0001; trust a reading to ±.00005), mike the {{cad.bore_dia_min_in:.4dot}} GO pin, the {{cad.bore_dia_max_in:.4dot}} NO-GO pin, and the .3760 reamer across two opposite margins at its front end. Write the three readings here, and each pin's reading on its tag."
inspection = "GO pin reads {{cad.bore_dia_min_in:.4dot}}–{{process.go_pin_max_in:.4dot}}, NO-GO pin {{process.nogo_pin_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}}: a pin outside its range is not used. The reamer reads under the NO-GO pin's reading, else it is not used: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "This sheet accepts a bore the GO pin enters and the NO-GO pin does not: GO reading ≤ bore < NO-GO reading. With both pins at their size limits only {{process.go_pin_max_in:.4dot}}–{{process.nogo_pin_min_in:.4dot}} is sure to pass; a good bore within .0002 of either band limit may be refused (owner ruling 2026-11-23)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Only if the reamer read under the GO pin, before unchucking the bar's remainder: face its end, then spot, drill L and 23/64 and ream it .40 deep by the quill scale as Ops 170–200 do; gauge it as Op 210. The GO pin enters: go on. Refused: stop and tell the owner (the pins refuse this reamer's holes)."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face to length, turn the seat to the arm, ream the bore"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap of brass shim on the barrel, {{process.regrip_grip_in:.2dot}} in of the hub in the jaws from the rear face (the relief end inward), the parted end {{process.regrip_out_mm:in.2dot}} in out. Nothing seats the hub axially: the jaw tips may stand proud of the chuck face."
datum = "Z0: the front face, faced in Op 140 to {{process.length_target_in:.3dot}} from the rear face, preset from the length miked there."
diagram = { file = "diagrams/regrip.svg", alt = "The hub turned round, its barrel in the jaws over a shim wrap, the parted end out: faced to length, the seat turned back to the shoulder, the bore drilled and reamed through from the tailstock." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.barrel_dia_mm}}", stock_diameter_mm = "{{cad.barrel_dia_mm}}", stickout_mm = "{{process.regrip_out_mm}}", minimum_diameter_mm = "{{cad.seat_dia_ref_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
instruction = "Write the targets from B and T (Op 30): seat Ø = B + .0009 (the bore lies within .0002 over B, so B + .0006 to B + .0012 holds the .0004–.0012 press); seat length S = T − .001 (the middle of −.000/−.002)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Mike the hub's length across the rims, clear of the parting pip on the parted end; write it as L0 (about {{process.part_off_in:.3dot}}). Chuck it; spindle running, touch the AR lightly on the parted end's rim and set DRO Z to L0 less {{process.length_target_in:.3dot}}. Face in light skims to Z0: the front face."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.barrel_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the seat from Z0 back to Z−S by the DRO, the shoulder square: rough to Ø(B + .010), then finish in light passes of .0005–.001 a side, miking between them, to within .002 of Ø(B + .0009); then .0001–.0002 a side a pass, miking after each, to Ø(B + .0009)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.seat_dia_ref_mm}}"
inspection = "Seat Ø B + .0006 to B + .0012, micrometer. Shoulder: touch the AR on it, the DRO reads −T to −(T − .002)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Seat over B + .0012 in Op 150: another pass of .0001 a side; shoulder short of −(T − .002): turn on to Z−S. Seat under B + .0006, or the shoulder past −T: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 3 centre drill, about Ø.20 across: under the L drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 5.08

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-l"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the L drill in until its lips touch the spot's rim; zero the tailstock quill scale. Drill through until it reads 1.15, backing fully out to clear chips every .29: the point breaks out of the rear face inside the jaws; ease off as it does."
settings = "lathe-drill-l-1018"
cut_diameter_mm = 7.366
hole_depth_mm = 29.21
peck = { step_mm = 7.366, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-23-64"
drilling = "twist_drill"
sizing = "other"
instruction = "Open it with the 23/64 drill: lips on the L hole's edge, zero the quill scale, drill through until it reads 1.15, backing fully out every .36. It leaves the reamer about .008 a side."
settings = "lathe-drill-23-64-1018"
cut_diameter_mm = 9.128125
hole_depth_mm = 29.21
peck = { step_mm = 9.128125, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Ream .3760 through from the tailstock, spindle running: feed the reamer in until its lead chamfer meets the hole's mouth, zero the quill scale, feed slowly until it reads 1.10, and withdraw with the spindle still running."
settings = "lathe-ream-3760-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Still chucked, the bore wiped clean: the GO pin passes through and the NO-GO pin does not enter the front end (both ends are checked again at the bench, after the cross hole, Op 310)."
inspection = "GO enters, NO-GO does not: bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}} through."
gauge_checks = [{ gauge = "zz-pins-3760-3765", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "The GO pin refused in Op 210: clear the chips, oil, run the same reamer through once more as Op 200 and gauge again. Still refused (the pins cannot show the bore at or over {{cad.bore_dia_min_in:.4dot}}, and a reamer cannot be made to cut larger), or the NO-GO pin entering (no cut remedies it): scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Drill the #14 cross hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2f}} tall above its seat). A 1 in parallel, 1/8 in thick, against each jaw. The hub lying along the jaws, centred on them, front face to the LEFT, its barrel on the parallels' inner top edges and gripped by the jaws; the seat and relief hang clear of both. Between the parallels a {{process.cross_parallel_gap_mm:in.3dot}} gap: the #14 runs out into it. Tap the barrel down onto both edges while closing the vise."
datum = "Program CM01_pin_hole (cam:dt_crank_hub). G54: X0 the front face, +X toward the rear face; Y0 the barrel's axis, +Y toward the fixed (rear) jaw; Z0 the barrel's top line. Tool lengths from the tool setter at each M6; the jaw tops stand {{process.cross_jaw_top_mm:in.3dot}} above Z0. After homing again (the note says when), or if the hub is disturbed in the vise: repeat Ops 230–250 before Cycle Start (once the hole is spotted, Op 250's leaf on the top line beside the hole, not over it). At each M6 the program has stopped the spindle (M5) and shows the tool and speed: wait for the spindle to stop, change the tool, set the speed, then Cycle Start."
diagram = { file = "diagrams/cross.svg", alt = "The hub lying in the vise on two parallels' edges, gripped on its barrel; the #14 drills down through the barrel and bore {{cad.pin_hole_station_in:.2dot}} from the front face, into the gap between the parallels." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.barrel_dia_mm}}", along_jaws_mm = "{{cad.envelope_y_mm}}", part_height_mm = "{{cad.barrel_dia_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-66.7639, -66.7639], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "rod" }
beam = { axis = "x", hold = "solid", extent_mm = [0, "{{cad.envelope_y_mm}}"], seat = "gripped across the barrel in the vise jaws, on the parallels' edges", seat_mm = [7.9375, 21.082] }

[[setups.operations]]
instruction = "G54 Y0: the barrel's axis, half its miked diameter from the fixed jaw."
instruction_detailed = "Mike the barrel. Edge finder (900 rpm) on the fixed jaw's face about 1 in left of the hub's front face, brought to it from the hub's side (−Y), its tip's centre about .30 below the jaw top, above the parallel: G10 L20 P1 Y(half your barrel reading in mm − 2.540); for .880, Y8.636."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0: the front face, the edge finder from the left at Y0, its tip .16 below the top line (on the face, between the seat's top and the bore)."
instruction_detailed = "Edge finder (900 rpm) down at Y0 left of the front face, its tip's centre 4.0 mm below the barrel's top line; bring it to the face from the left: G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the barrel's top line, the centre drill's point on a .002 feeler leaf at the hole's station."
instruction_detailed = "Console M6 T1 (#2 centre drill; the tool setter measures it). MDI G0 X{{cad.pin_hole_station_mm:.3f}} Y0. Spindle stopped, its point just dragging a .002 leaf on the barrel's top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove CM01_pin_hole in air, Z0 raised 1.000 in. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400). Run CM01_pin_hole to its end in air, through both tool changes (T1, then T2), watching each move clear the jaw tops. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CM01_pin_hole (M6 T1, #2 centre drill; set 1800): spot Ø{{process.spot_dia_mm:in.3dot}} on the top line at X {{cad.pin_hole_station_mm:.3f}} mm, under the #14."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.pin_hole_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-14"
drilling = "twist_drill"
# The #14 is the drawing's drilled size (.182 +.004/0): the export's band
# starts at the HA drill table's 4.623 mm, .0002 mm over the shop record's
# .1820 in (4.6228 mm), so the band is not this op's sizing; cam.py holds
# the drill to the band within that rounding.
sizing = "other"
instruction = "Same file, M6 T2: at its prompt, hold the #14 with at least 1.25 in out of the chuck's nose (its point runs about 1.0 below the jaw tops, between jaws .880 apart). #14 down through the barrel and the bore, its full diameter {{process.drill_past_mm:in.3dot}} past the barrel's bottom, pecks of {{process.peck_14_mm:in.3dot}} with full retract; set 1250. Cutting oil."
rpm = 1250
feed = "{{process.drill_14_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{cad.barrel_dia_mm}}"
peck = { step_mm = 4.572, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 4.6228, flutes = 2, rpm = 1250, feed_mm_min = "{{process.drill_14_feed_per_min_mm}}", stations_mm = "{{cad.pin_hole_station_mm}}" },
]
inspection = "Hole station {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from the front face to the hole's centre: the calipers' depth rod from the front face to the hole's near edge, plus half the #14 (.091). First article only: the program holds it."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pin_hole_station_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check the length, oil"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished hub: the seat turned to the arm, the barrel, the relief, the reamed bore and the #14 cross hole; its length from the front face to the rear face." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: break the outside edges and both ends of the bore and the #14 hole, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "reamer"
drilling = "none"
sizing = "other"
instruction = "Clear the #14's breakthrough burrs inside the bore: grip the .3760 reamer's shank upright in the bench vise between soft jaws, oil it, and turn the hub down over it by hand, always in the reamer's cutting direction, through the full length; lift it off turning the same way. Blow out and wipe the bore."
feed = "hand"

[[setups.operations]]
instruction = "Mike the length across the front and rear faces. The GO pin passes the full length of the bore, past the cross hole; the NO-GO pin enters from neither end."
inspection = "Length {{cad.rear_face_length_min_in:.3dot}}–{{cad.rear_face_length_max_in:.3dot}}, micrometer; GO enters, NO-GO does not: bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}} through after the cross hole."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.rear_face_length_band_mm}}" }, { gauge = "zz-pins-3760-3765", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "GO pin refused in Op 310: clear the chips, oil, repeat Op 300 once and gauge again. Still refused, the NO-GO pin entering (no cut remedies it), or the length outside its band: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: bright machined, oiled): wipe the hub clean and give it a light coat of light machine oil; wipe the seat dry for the press into MHA-DT-06."
feed = "hand"
