# Crank hub MHA-DT-31, one off, from the 1 in 1018 CF bar on hand
# (cad/config/shop-equipment/stock-bought.toml 1018-round-1). Turned on the
# manual PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe
# travelers, no NC); the #14 cross hole drilled on the PM-30MV CNC (CM01).
# Route, chosen for speed (owner ruling 2026-11-21: the agent picks):
# - Setup 1, lathe, the bar in the 3-jaw, Z0 the faced rear end: turn the
#   barrel Ø.88 back past the parting line and the relief Ø.65 x .16 at the
#   rear end, part off .02 long. Both steps face the tailstock, so the AR
#   turns them; the seat, smaller than the barrel at the far end, waits for
#   Setup 2, where it stands out.
# - Setup 2, lathe: crank arm MHA-DT-06 is made first (the seat is turned to
#   its measured bore and thickness, notes on the sheet). The hub turned
#   round, its barrel in the 3-jaw over a shim wrap, the parted end out:
#   face to length from the miked length (Z0 the front face), turn the seat
#   to the plug-measured bore plus .0009 back to the shoulder at the measured
#   arm thickness less .001, then centre, drill L and 23/64 and ream .3760
#   through from the tailstock in the same chucking, so the bore runs true
#   to the seat the arm is pressed on.
# - Setup 3, PM-30MV, vise: the hub lying on two parallels, gripped on the
#   barrel; CM01 spots and drills #14 through it at .53 from the front face.
# - Setup 4, bench: deburr, check the length, oil.
# The taper ream through the #14 hole (note 1) and the .156 seam ream with the
# arm (MHA-DT-VN-59) are assembly operations on the drive-train package.
#
# Not on hand (to order): the bore's two Class ZZ pins, .3760 plus (GO) and
# .3765 minus (NO-GO), shop dt.toml zz-pins-3760-3765. Owner ruling
# 2026-11-23 (tool audit Q1, re-answered on the corrected facts), verbatim:
# "ZZ singles per the record: 29 pins (17 plus GO, 12 minus NO-GO), about
# $130. Accept that good holes near a limit may be refused; the traveler
# mikes each pin so the real window is known per pin." Setup 1 ends by
# miking both pins and the reamer (a trial hole in the bar's remainder if
# the reamer reads under the GO pin); the bore is accepted between the two
# pins' written readings.
#
# NC (cad/process/dt_crank_hub/cam.py): CM01_pin_hole. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the places in the tools list among the mill's tools: T1
# centre drill, T2 #14 drill.
title = "Crank Hub"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1 in round (drawing: {{cad.material_spec}})"
stock = "Lot: {{process.quantity:d}} hub. Ø{{process.bar_dia_in:.3dot}} bar, on hand; Setup 1 takes about {{process.bar_use_in:.2dot}} in of it, the sizing plug included: saw a 3 in piece off it for the lathe (1.75 out of the jaws, .50 in them), never the whole bar (it would run out past the spindle's rear end)."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); mill PM-30MV low belt (100–2800 rpm). Cutting oil on the steel. Crank arm MHA-DT-06 is finished before Setup 1: Op 20 sizes a plug to its bore and Op 30 mikes its thickness; the seat is turned to both. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: do what that setup's Datum says for it; where the Datum says nothing, take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Prove CM01 in air before it cuts. To order (not on hand): the two Class ZZ pins, .3760 plus (GO) and .3765 minus (NO-GO)."
shop = "../shop"
stock_refs = ["1018-round-1"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_crank_hub/features.toml"
adapter = "drilled_block"
part = "dt-crank-hub"

[parameters]
quantity = 1
bar_dia_in = 1.0
# Setup 1: .02 faced, the .40 sizing plug and its kerf, about .01 re-faced,
# the hub's 1.01 parted length and its kerf.
bar_use_in = 1.57
# The blank a hub is cut from (stock_fit: envelope X, Y, Z): the 1 in bar,
# the hub's length plus the Setup 2 allowance.
blank_x_in = 1.0
blank_y_in = 1.03
blank_z_in = 1.0
# Setup 1: out of the jaw fronts, the sizing plug's .40, its kerf and the
# re-facing (.50 in all), then the hub's 1.01 parted length, its kerf and
# room for the blade to clear the jaws.
stickout_mm = 44.45
# The sizing plug Setup 1 turns on the bar end to the arm's bore (its
# length, and the Z its parting face stands at).
plug_length_in = 0.3
plug_off_in = 0.4
face_allowance_in = 0.02
# Left on the parted end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
# Parting kerf: the blade's width plus .0125 (authored).
part_kerf_in = 0.075
# Setup 1 parts the hub off .02 over its .990 length.
part_off_in = 1.01
# Setup 1 turns the barrel this far back from Z0, past the parting line.
barrel_run_in = 1.12
# Setup 2: the barrel in the jaws from the rear end, the rest out.
regrip_grip_in = 0.4
# And the parted end out of the jaw fronts: the 1.01 parted length less that.
regrip_out_mm = 15.494
# The overall length Setup 2 faces to: inside the .980-.994 band.
length_target_in = 0.987
# Mill, CM01 (shop records, as dt_pinion_cam): the PM 6 in vise.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
# A 1 in parallel, 1/8 in thick, against each jaw; the barrel on their
# inner top edges: the gap between them and the barrel's axis above their
# tops (cam.py recomputes both).
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
cross_parallel_gap_mm = 16.002
cross_axis_height_mm = 7.8031
# The jaw tops above Z0 (the barrel's top line): cam.py recomputes it.
cross_jaw_top_mm = 0.5662
# Spot Ø.150 with the #2 centre drill, under the #14 (.182); the #14
# through the barrel and the bore in pecks of .18 (its own diameter) with
# full retracts, its full diameter 1.0 mm past the barrel's bottom line.
spot_dia_mm = 3.81
peck_14_mm = 4.572
drill_past_mm = 1.0
# The #14's tip below Z0: the barrel's .88 + 1.0 + its 118° point 1.389;
# cam.py checks it.
drill_tip_mm = -24.7406
# Speeds and feeds, authored in the operations: LittleMachineShop "Cutting
# Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read live
# 2026-11-22): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20, as dt_pinion_cam), row Stl, Carbon: 1/8 in .003
# in/rev, a size between two columns taking the lower one's feed. #14 1250
# rpm (60 ft/min) x .003 = 3.75 in/min; the centre drill 1800 rpm x .001 =
# 1.8 in/min, as dt_pinion_cam's spots.
spot_feed_per_min_mm = 45.72
drill_14_feed_per_min_mm = 95.25
# The Class ZZ pins (shop dt.toml zz-pins-3760-3765; owner ruling 2026-11-23,
# tool audit Q1): GO a plus pin at the band's low limit, true size .3760 to
# .3762; NO-GO a minus pin at the high limit, .3763 to .3765 (one pin's ZZ
# tolerance, .0002, is the record's resolution_mm 0.00508). The largest GO
# pin and the smallest NO-GO pin a sheet may use: with both pins there, a
# bore is sure to pass only between them, the middle .0001 of the .0005 band.
go_pin_max_in = 0.3762
nogo_pin_min_in = 0.3763

