<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left, 7 px/mm: a section at the hole (X 13.462, cad.pin_hole_station_mm), seen from the rear face looking −X, so +Y (the fixed jaw) is to the right and +X comes out of the page toward you. The barrel Ø.88 (cad.barrel_dia_mm) on the inner top edges of the two 1 in parallels, 1/8 thick, one against each jaw (process.parallel_height_mm, process.parallel_thickness_mm), 16.002 mm apart (process.cross_parallel_gap_mm); its axis 7.803 mm over their tops (process.cross_axis_height_mm), the jaw tops 0.566 mm over Z0 (process.cross_jaw_top_mm); the bore Ø.375 (cad.bore_dia_mm). The jaws' thickness and the vise bed are schematic. The #14 drill (shop drill-14, Ø4.623 mm) on Y0, its point at Z-24.741, CM01's posted depth: its full diameter 1.0 mm (process.drill_past_mm) past the barrel's bottom, in the gap; it runs up to a break line. Right, 4 px/mm: the hub from the front (looking +Y, +X to the right), front face (X0) to the LEFT, the same drill at X 13.462. The #2 centre drill's spot (T1) is under it and not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="470"/>
  <text class="title" x="20" y="22">Setup 3, CM01 T2: the #14 drills down through the barrel and bore into the gap (to scale, 7 and 4 px/mm)</text>
