  <text class="datum-label" x="530" y="320">X0: the front face</text>
  <line class="active-face" x1="689" y1="108" x2="689" y2="252"/>
  <line class="leader" x1="689" y1="252" x2="700" y2="338"/>
  <text class="label" x="650" y="352">#14 at {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}}</text>
