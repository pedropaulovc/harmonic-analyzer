<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 3. Left: end view seen from the rear face (looking along -X, so +Y is to the right), 200 px to the inch: the barrel Ø.88 between the vise jaws on two 1 in parallels, 1/8 thick, against the jaws. Right: side view, 150 px to the inch, X0 the front face. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 3: the hub lying in the vise on two parallels' edges; CM01 drills #14 through the barrel and bore</text>
  <text class="label" x="20" y="40">left: end view, seen from the rear face</text>
  <rect class="clamp" x="172" y="88" width="120" height="212"/>
  <rect class="clamp" x="468" y="88" width="120" height="212"/>
  <rect class="fixture-support" x="292" y="241" width="25" height="120"/>
  <rect class="fixture-support" x="443" y="241" width="25" height="120"/>
  <circle class="part-kept" cx="380" cy="180" r="88"/>
  <circle class="part-kept" cx="380" cy="180" r="76"/>
  <circle class="holes" cx="380" cy="180" r="37.6"/>
  <polyline class="hidden" points="362,92 362,288"/>
  <polyline class="hidden" points="398,92 398,288"/>
  <rect class="cutter" x="362" y="36" width="36" height="52"/>
  <line class="centre-line" x1="380" y1="30" x2="380" y2="380"/>
  <line class="centre-line" x1="270" y1="180" x2="490" y2="180"/>
