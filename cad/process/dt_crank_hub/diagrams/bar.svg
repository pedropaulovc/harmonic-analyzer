<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 1, section through the axis, 200 px to the inch: the 1 in bar 1.25 out of the 3-jaw; Z0 the faced rear end at the right. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1: the 1 in bar in the 3-jaw; Z0 the faced rear end; barrel and relief turned, the hub parted off long</text>
  <rect class="fixture-vise" x="30" y="60" width="80" height="280"/>
  <rect class="clamp" x="110" y="70" width="40" height="30"/>
  <rect class="clamp" x="110" y="300" width="40" height="30"/>
  <rect class="part-rest" x="110" y="100" width="76" height="200"/>
  <rect class="part-removed" x="176" y="100" width="192" height="12"/>
  <rect class="part-removed" x="176" y="288" width="192" height="12"/>
  <rect class="part-removed" x="368" y="100" width="32" height="35"/>
  <rect class="part-removed" x="368" y="265" width="32" height="35"/>
  <rect class="part-waste" x="186" y="112" width="12" height="176"/>
  <polygon class="part-kept" points="198,112 368,112 368,135 400,135 400,265 368,265 368,288 198,288"/>
  <line class="centre-line" x1="100" y1="200" x2="560" y2="200"/>
  <line class="active-face" x1="400" y1="135" x2="400" y2="265"/>
  <rect class="cutter" x="186" y="300" width="12" height="70"/>
  <line class="leader" x1="400" y1="160" x2="470" y2="150"/>
  <text class="label" x="474" y="154">Z0: the rear face, faced in Op 10</text>
  <line class="leader" x1="300" y1="112" x2="330" y2="60"/>
  <text class="label" x="300" y="54">barrel Ø{{cad.barrel_dia_min_in:.3dot}}–{{cad.barrel_dia_max_in:.3dot}}, back past the parting line</text>
  <line class="leader" x1="384" y1="135" x2="470" y2="104"/>
  <text class="label" x="474" y="100">relief Ø{{cad.relief_dia_min_in:.3dot}}–{{cad.relief_dia_max_in:.3dot}}</text>
  <text class="label" x="474" y="116">{{cad.relief_length_min_in:.3dot}}–{{cad.relief_length_max_in:.3dot}} long</text>
  <line class="leader" x1="198" y1="370" x2="240" y2="380"/>
  <text class="label" x="244" y="384">blade's tailstock-side face at Z-{{process.part_off_in:.3dot}}</text>
  <text class="label" x="30" y="384">3-jaw</text>
</svg>
