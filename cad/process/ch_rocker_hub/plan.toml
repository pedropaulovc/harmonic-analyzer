# Rocker hub MHA-CH-12, 20 off, turned on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route B, chosen
# for speed (owner ruling 2026-11-21: the agent chooses the route; comparison
# sketch on PR #3262, branch evidence/cnc-bush-hub-sketch): bar-fed from the 24 in 1/2 in
# 1018 bar, two hubs per pull, about 128 min for the lot against 191 min one
# at a time from 20 sawn slugs. Setup 1 saws a 10 in piece off the bar for
# the lathe (#3424: the whole bar would run out past the spindle's rear end;
# limit cad/config/shop-equipment/ machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in); it makes all 20. Each pull: face the bar end
# (Z0), rough and finish the land over both hubs, spot, drill D through both
# and past the second parting line, part off the first hub, face the new end
# to Z0 again, part off the second. The land is turned before the drill (the
# turning-deflection screen models solid round). The drawing's made-to-fit
# land governs (owner ruling 2026-11-24, fit audit question 2, approved as
# recommended: "ream .400 with no band; hub turned until it slides in
# (clearance .0005-.0030); bond"): (Ø.400) REF, TURN TO SLIDE INTO MHA-CH-13
# HOLE / .0005-.0030 CLEARANCE, LOCTITE 638 (rule 4, form 2). The lathe turns
# every land into one micrometer aim, land_min_in-land_max_in
# (ch_rocker_hub_fit.LAND_WINDOW, which test_ch_rocker_hub_drawing binds):
# the largest hole the .4000 reamer (tools.reamer-4000) is taken to cut less
# the greatest clearance, to the smallest less the least
# (ch_rocker_hub_fit.STRAP_HOLE_BAND, BOND_CLEARANCE), so a land in the aim
# holds the drawing's clearance in every strap of the lot. The made-to-fit
# check on the lathe: the land slides by hand into a finished strap's reamed
# hole with no shake. The pair actually bonded is accepted where it is
# joined, at the rocker arm traveler's dry fit (cad/process/ch_rocker_arm,
# Setup 1): hub n into strap n, slides by hand, no force, no shake; a hub
# that fits no strap of the lot goes to the owner. Traveler review r2
# (2026-11-24) retired the telescoping hole reading and the numbering of
# straps by it: the reading's .0005 repeatability left a window narrower than
# the turned row. The matched press (owner ruling 2026-11-21), its four
# Class X reading pins (tool audit Q2, 2026-11-23) and the .4000/.4005 pair
# stay retired. The hubs part .02 long over the .32 MIN supply length: the
# drawing's note 1 finishes bore and length after joining, on MHA-CH-06.
# Bench: deburr, check length. Each hub has one lathe-faced end (Op 20 or
# Op 90); the other is parted. The rocker arm traveler stands each hub on
# its lathe-faced end, bonds it into its own strap (LOCTITE 638) and faces
# both ends from the strap.
title = "Rocker Hub"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished round, 1/2 in"
stock = "Ø{{process.stock_dia_in:.2dot}} bar, on hand; Setup 1 saws a {{process.bar_length_in:g}} in piece off it: {{process.quantity:d}} hubs at {{cad.pitch_in:.2dot}} in each ({{cad.parts_per_bar:d}} fit the piece)."
shop = "../shop"
stock_refs = ["1018-round-1-2"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

# The shop's standing page carries what every traveler shares (units, lathe
# speeds, coolant); This job says what only these hubs need.
standing = true

[[notes]]
title = "This job"
rows = [
  ["After joining", "Bore and length are finished after joining to MHA-CH-13 (drawing note 1, MHA-CH-06)."],
]

[cad]
file = "../../out/features/ch_rocker_hub/features.toml"
adapter = "turned_bush"
part = "ch-rocker-hub"

[parameters]
quantity = 20
# The micrometer aim for the land: the drawing's clearance over every hole
# the reamer is taken to cut, the largest hole less the greatest clearance to
# the smallest less the least (ch_rocker_hub_fit.LAND_WINDOW;
# test_ch_rocker_hub_drawing binds both).
land_min_in = 0.3975
land_max_in = 0.3995
stock_dia_in = 0.5
# The piece Setup 1 saws off the bar: it makes the 20 hubs (prechips'
# parts_per_bar) and, at the first pull, leaves about 9 in behind the jaw
# fronts, inside the spindle (limit machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in, test_lathe_bar_length).
bar_length_in = 10.0
chuck_grip_in = 1.0
# Facing allowance: squares a parted bar end.
face_allowance_in = 0.02
# Parted .02 over the supply length: finished on MHA-CH-06 after joining.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 2
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Land passes: roughing to within a finish pass, then finish passes of
# .002 in a side (authored), at the AR setting's .004 in/rev feed.
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
# Left a side over the land's low limit for the finish passes.
finish_allowance_in = 0.002
turn_feed_mm_rev = 0.1016
# The tool starts its pass this far off the faced end.
turn_start_z_mm = 0.5

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-d"
name = "D drill"
ref = "drill-d"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the working piece"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the piece free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 in bar on the saw: one {{process.bar_length_in:g}} in piece off its end, for the {{cad.parts_per_bar:d}} hubs." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.bar_length_in:g}} in from the bar end and saw on the waste side of the line; let the piece drop clear and pick it up only after the blade has stopped. File the burrs off the sawn ends. The piece makes {{cad.parts_per_bar:d}} hubs; never chuck the whole bar in the lathe (it would run out past the spindle's rear end)."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Bar: two hubs per pull, ten pulls"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.2dot}} piece from Setup 1, the rest of it back in the spindle bore; pull {{cad.stickout_in:.2dot}} in out of the jaw fronts each time."
datum = "Z0 (carriage DRO) the bar end faced in Op 20, set again on the parted end in Op 90."
diagram = { file = "diagrams/bar.svg", alt = "The 1/2 in bar in the 3-jaw with two hubs out: the end faced, the land turned over both, the D hole drilled through both past the second parting line, each hub parted off {{cad.part_off_in:.2dot}} from its faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Land rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the land from Z0 back to Z{{cad.run_end_z_mm:in.2dot}} (past the second parting line) to Ø{{cad.outer_rough_dia_mm:in.4dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Land finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the land over the same length in light passes. Before each micrometer reading, stop the spindle and put the lathe in neutral; then mike each hub's length of land. Turn each land to the aim Ø{{process.land_min_in:.4dot}}–{{process.land_max_in:.4dot}}, the turning target that holds the drawing's clearance in every hole the .4000 reamer cuts. Once a land is in the aim, spindle stopped and lathe in neutral, slide a finished MHA-CH-13 strap (any one) onto the bar end and over that hub's land by hand."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "The made-to-fit check: the strap slides over each hub's land by hand, no force, no shake (the drawing's {{cad.outer_clearance_min_in:.4dot}}–{{cad.outer_clearance_max_in:.4dot}} clearance in the reamed hole). The pair that is bonded is accepted at the rocker arm traveler's dry fit (MHA-CH-06, Setup 1), hub n in strap n."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The strap will not slide over a land: take another light pass and try again. It slides but shakes: part both hubs off and scrap them; pull the piece and start the pair again from Op 20 (if the piece runs short, saw another, Setup 1)."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.18 across the countersink: under the D drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-d"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the D drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}, backing fully out to clear chips every {{cad.bore_dia_mm:in.2dot}} in: the drill's full diameter then runs through both hubs and past the second parting line."
settings = "lathe-drill-d-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = "{{cad.bore_dia_mm}}", retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off the first hub with that face at Z-{{cad.part_off_in:.2dot}}: {{process.regrip_allowance_in:.2dot}} over the {{cad.length_min_in:.2dot}} MIN supply length. Hands clear: let it fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the parted end {{process.face_allowance_in:.2dot}} in with the AR tool; set DRO Z0 on it again. Bring the blade's chuck-side face onto the new faced end and set DRO Z there to the blade's width, as in Op 80: the DRO again reads the blade's tailstock-side face."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Part off the second hub with the blade's tailstock-side face at Z-{{cad.part_off_in:.2dot}}. Hands clear: let it fall; pick it up from the bed or the chip tray only after the spindle has stopped. Pull the piece for the next two and repeat from Op 20 until there are {{process.quantity:d}} hubs."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check the hubs"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished hub: the land along its length, the D hole through, the supply length from the faced end." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr each hub: file the parting burr off the parted face, break both outside edges and both ends of the hole, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; no burr may stand on the land."
feed = "hand"

[[setups.operations]]
instruction = "Each hub: length across the faces at least {{cad.length_min_in:.2dot}}, calipers; run a fingertip along the land: no burr stands on it."
inspection = "Length {{cad.length_min_in:.2dot}} min; no burr on the land."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.length_min_mm}}", "{{cad.part_off_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "A hub under the length in Op 120 is scrapped, not reworked: a later pull makes another (if the piece runs short, saw another, Setup 1)."
feed = "hand"
