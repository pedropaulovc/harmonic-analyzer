# Rocker hub MHA-CH-12, 20 off, turned on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route B, chosen
# for speed (owner ruling 2026-11-21: the agent chooses the route; comparison
# sketch on PR #3262, branch evidence/cnc-bush-hub-sketch): bar-fed from the 24 in 1/2 in
# 1018 bar, two hubs per pull, about 128 min for the lot against 191 min one
# at a time from 20 sawn slugs. Setup 1 saws a 10 in piece off the bar for
# the lathe (#3424: the whole bar would run out past the spindle's rear end;
# limit cad/config/shop-equipment/ machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in); it makes all 20. Setup 1 also numbers the 20
# finished MHA-CH-13 straps and reads each one's hub hole, S, with the owned
# telescoping gauge on the micrometer (about .0005 repeatable, as the
# MHA-CH-13-TL-02 plug traveler states); hub n is turned to strap n and stays
# with it through the bond. Each pull: face the bar end (Z0), rough the land
# over both hubs, finish each hub's land to its own strap's S less .0010-.0025,
# spot, drill D through both and past the second parting line, part off the
# first hub, face the new end to Z0 again, part off the second. The land is
# turned before the drill (the turning-deflection screen models solid round).
# The drawing's made-to-fit land governs (owner ruling 2026-11-24, fit audit
# question 2, approved as recommended: "ream .400 with no band; hub turned
# until it slides in (clearance .0005-.0030); bond"): (Ø.400) REF, TURN TO
# SLIDE INTO MHA-CH-13 HOLE / .0005-.0030 CLEARANCE, LOCTITE 638. Machinist
# review r1 (2026-11-24): the clearance is to the actual hole, so the land is
# turned to the measured mate, the reading's .0005 taken off each end of the
# drawing's clearance; the slide by hand only shows some clearance exists.
# Over the .4000 reamer's modelled .4000-.4005 (tools.reamer-4000,
# ch_rocker_hub_fit.STRAP_HOLE_BAND) those windows span .3975-.3995
# (ch_rocker_hub_fit.LAND_WINDOW, land_min_in/land_max_in). The matched press
# (owner ruling 2026-11-21), its four Class X reading pins (tool audit Q2,
# 2026-11-23) and the .4000/.4005 pair stay retired. The hubs part .02 long
# over the .32 MIN supply length: the drawing's note 1 finishes bore and
# length after joining, on MHA-CH-06. Bench: deburr, check length. Setup 4
# bonds each hub into its own
# finished strap with LOCTITE 638 (consumables.loctite-638, on hand) on the
# owned surface plate, the strap held parallel to it on two gauge blocks from
# the owned Mitutoyo set so the hub stands square at the strap's middle; no
# fixture is made. The joint cures 24 h before MHA-CH-06's F drill and facing
# load it.
title = "Rocker Hub"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished round, 1/2 in"
stock = "Ø{{process.stock_dia_in:.2dot}} bar, on hand; Setup 1 saws a {{process.bar_length_in:g}} in piece off it: {{process.quantity:d}} hubs at {{cad.pitch_in:.2dot}} in each ({{cad.parts_per_bar:d}} fit the piece)."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil on the steel. Setup 2 runs ten times, two hubs per pull. Hub n is turned to strap n and stays with it to the bond. Bore and length are finished after joining to MHA-CH-13 (drawing note 1, MHA-CH-06)."
shop = "../shop"
stock_refs = ["1018-round-1-2"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/ch_rocker_hub/features.toml"
adapter = "turned_bush"
part = "ch-rocker-hub"

[parameters]
quantity = 20
# Each land is turned under its own strap's hole reading S by .0010-.0025:
# the drawing's .0005-.0030 clearance with the telescoping reading's .0005
# taken off each end.
land_under_min_in = 0.001
land_under_max_in = 0.0025
# A reading S outside the reamer's modelled .4000-.4005 by more than the
# reading's .0005 is read again, then the strap is set aside.
strap_read_min_in = 0.3995
strap_read_max_in = 0.401
# The span of those land windows over every hole the reamer is taken to cut
# (.4000-.4005): .4000 less .0025 to .4005 less .0010.
# test_ch_rocker_hub_drawing binds both to ch_rocker_hub_fit.LAND_WINDOW.
land_min_in = 0.3975
land_max_in = 0.3995
stock_dia_in = 0.5
# The piece Setup 1 saws off the bar: it makes the 20 hubs (prechips'
# parts_per_bar) and, at the first pull, leaves about 9 in behind the jaw
# fronts, inside the spindle (limit machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in, test_lathe_bar_length).
bar_length_in = 10.0
chuck_grip_in = 1.0
# Facing allowance: squares a parted bar end.
face_allowance_in = 0.02
# Parted .02 over the supply length: finished on MHA-CH-06 after joining.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 2
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Land passes: roughing to within a finish pass, then finish passes of
# .002 in a side (authored), at the AR setting's .004 in/rev feed.
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
# Left a side over the land's low limit for the finish passes.
finish_allowance_in = 0.002
turn_feed_mm_rev = 0.1016
# The tool starts its pass this far off the faced end.
turn_start_z_mm = 0.5

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-d"
name = "D drill"
ref = "drill-d"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[tools]]
id = "gauge-blocks"
name = "Gauge blocks"
ref = "gauge-blocks-mitutoyo"

[[tools]]
id = "telescoping"
name = "Telescoping gauges and the 0–1 in micrometer"
ref = "telescoping-gauges-starrett-s579gz"

[[setups]]
machine_kind = "other"
title = "Saw the working piece; number the straps and read their hub holes"
machine = "Saw / bench"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the piece free beyond the blade. Then the finished straps on the bench."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 in bar on the saw: one {{process.bar_length_in:g}} in piece off its end, for the {{cad.parts_per_bar:d}} hubs." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.bar_length_in:g}} in from the bar end and saw on the waste side of the line; let the piece drop clear and pick it up only after the blade has stopped. File the burrs off the sawn ends. The piece makes {{cad.parts_per_bar:d}} hubs; never chuck the whole bar in the lathe (it would run out past the spindle's rear end)."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "telescoping"
drilling = "none"
sizing = "other"
instruction = "Read the hub hole of each of the {{process.quantity:d}} finished MHA-CH-13 straps (the strap traveler done) with the 5/16–1/2 in telescoping gauge, locked square across it at mid-thickness at two places 90° apart, each miked. Their mean is that strap's S."
inspection = "Each strap: its two readings within .0005 of each other; S {{process.strap_read_min_in:.4dot}}–{{process.strap_read_max_in:.4dot}}."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Readings further apart, or S outside {{process.strap_read_min_in:.4dot}}–{{process.strap_read_max_in:.4dot}}: read that hole again; still so, set the strap aside and tell the owner. No hub is turned to it."
feed = "hand"

[[setups.operations]]
instruction = "Number the straps 1–{{process.quantity:d}} in order of S, smallest first, with a marker on one arm, and write each S beside its number on this sheet. Hub n is turned to strap n and stays with it to the bond: pull k makes hubs 2k−1 and 2k."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Bar: two hubs per pull, ten pulls"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.2dot}} piece from Setup 1, the rest of it back in the spindle bore; pull {{cad.stickout_in:.2dot}} in out of the jaw fronts each time."
datum = "Z0 (carriage DRO) the bar end faced in Op 50, set again on the parted end in Op 120."
diagram = { file = "diagrams/bar.svg", alt = "The 1/2 in bar in the 3-jaw with two hubs out: the end faced, the land turned over both, the D hole drilled through both past the second parting line, each hub parted off {{cad.part_off_in:.2dot}} from its faced end." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Land rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the land from Z0 back to Z{{cad.run_end_z_mm:in.2dot}} (past the second parting line) to Ø{{cad.outer_rough_dia_mm:in.4dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Land finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the land over the same length in light passes, miking each hub's length of land between passes, to the pull's window: the higher S of its two straps less {{process.land_under_max_in:.4dot}}, up to the lower S less {{process.land_under_min_in:.4dot}}. Then stop the spindle, lathe in neutral, and slide each of the pull's two straps onto the bar end and over its own hub's land by hand."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Both lands in the pull's window, micrometer; each strap slides over its own hub's land by hand, no force: the drawing's {{cad.outer_clearance_min_in:.4dot}}–{{cad.outer_clearance_max_in:.4dot}} clearance in that strap's hole, the reading's .0005 allowed for (over the reamer's .4000–.4005 the windows fall in Ø{{process.land_min_in:.4dot}}–{{process.land_max_in:.4dot}})."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A land under the pull's window: part both hubs off and scrap them; pull the piece and start the pair again from Op 50 (if the piece runs short, saw another, Setup 1). A land in the window that its strap will not slide over: read that strap's hole again (Op 20) and tell the owner."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.18 across the countersink: under the D drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-d"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the D drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}, backing fully out to clear chips every {{cad.bore_dia_mm:in.2dot}} in: the drill's full diameter then runs through both hubs and past the second parting line."
settings = "lathe-drill-d-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = "{{cad.bore_dia_mm}}", retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off the first hub with that face at Z-{{cad.part_off_in:.2dot}}: {{process.regrip_allowance_in:.2dot}} over the {{cad.length_min_in:.2dot}} MIN supply length. Hands clear: let it fall; pick it up from the bed or the chip tray only after the spindle has stopped. It goes with strap 2k−1."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the parted end {{process.face_allowance_in:.2dot}} in with the AR tool; set DRO Z0 on it again. Bring the blade's chuck-side face onto the new faced end and set DRO Z there to the blade's width, as in Op 110: the DRO again reads the blade's tailstock-side face."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Part off the second hub with the blade's tailstock-side face at Z-{{cad.part_off_in:.2dot}}. Hands clear: let it fall; pick it up from the bed or the chip tray only after the spindle has stopped. It goes with strap 2k. Pull the piece for the next two and repeat from Op 50 until there are {{process.quantity:d}} hubs."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check the hubs"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished hub: the land along its length, the D hole through, the supply length from the faced end." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr each hub, keeping it with its strap: file the parting burr off the parted face, break both outside edges and both ends of the hole, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; no burr may stand on the land."
feed = "hand"

[[setups.operations]]
instruction = "Each hub: length across the faces at least {{cad.length_min_in:.2dot}}, calipers; run a fingertip along the land: no burr stands on it."
inspection = "Length {{cad.length_min_in:.2dot}} min; no burr on the land."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.length_min_mm}}", "{{cad.part_off_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "A hub under the length in Op 150 is scrapped, not reworked: turn another for its strap on a later pull (if the piece runs short, saw another, Setup 1)."
feed = "hand"

# Setup 4: the bond (owner ruling 2026-11-24, fit audit question 2). Held
# with owned equipment only, no fixture made: the hub stands on its faced end
# on the surface plate (gauges.surface-plate), so its axis is square to the
# plate, and the strap lies on two gauge blocks of the owned Mitutoyo set
# (gauges.gauge-blocks-mitutoyo, the .101-.149 by .001 series), so it is
# parallel to the plate at the hub's middle: square hub to strap within the
# blocks' .001 difference over their spacing. The offset of the strap from
# the hub's middle (blocks within .005 of the half-difference, plus the paper)
# is taken by the .020 face stock each end (ch_rocker_hub_spec.FACE_STOCK).
# LOCTITE 638 (consumables.loctite-638, on hand): fixture about 4 min on
# steel, full cure 24 h (Henkel, LOCTITE 638 product page, read 2026-11-24:
# https://next.henkel-adhesives.com/us/en/products/industrial-adhesives/central-pdp.html/loctite-638/BP000000450822.html);
# 30 min on the blocks is the shop's margin for the .0030 widest gap, which
# cures slower. The joint is loaded first by MHA-CH-06's F drill and facing,
# after the 24 h. Degrease with isopropyl alcohol, as the strap traveler's
# bond does. No running joint lies beside this one: the F pivot bore is
# drilled through the hub after the cure, so the compound is kept off the
# hub's ends and out of its bore, which that drill and facing would meet.
[[setups]]
machine_kind = "other"
title = "MHA-CH-06 joining (drawing note 1): bond each hub into its own strap, LOCTITE 638, 24 h cure"
machine = "Surface plate (bench)"
indexing = "none"
holding = "On the surface plate, one joint at a time per pair of blocks: a square of plain paper under the hub's place (it keeps the 638 off the plate); the strap lying flat across two gauge blocks, one under each arm about 1 in either side of the hub hole; the hub through the strap's hub hole, standing on its faced end on the paper."
datum = "None. The plate squares the hub (it stands on its faced end); the two blocks hold the strap parallel to the plate at the hub's middle."
diagram = { file = "diagrams/bond.svg", alt = "Section through the hub: the surface plate, a paper square under the hub, the hub standing on its end through the strap's hub hole, the strap resting on a gauge block under each arm, the 638 film in the land's middle." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "gauge-blocks"
drilling = "none"
sizing = "other"
instruction = "For each hub: its length L across the faces, calipers; half the difference H = (L − .098)/2, the strap's thickness taken off. Pick two blocks of the .101–.149 series within .005 of H and within .001 of each other (for example .120 and .121 when H is .121); up to five joints go at once on different pairs."
feed = "hand"

[[setups.operations]]
instruction = "Dry fit as in Holding, no compound: the hub slides through its own strap's hole by hand and stands on its end on the paper, the strap on both blocks."
inspection = "Dry fit: the strap rests on both blocks (no light under either), the hub stands upright on the paper without being held."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Lift the strap and hub off. Degrease the land and the strap's hub hole with isopropyl alcohol on a clean rag and let them dry; from here on touch neither."
feed = "hand"

[[setups.operations]]
instruction = "Put a thin ring of LOCTITE 638 round the middle of the land, no more than covers it once the hub is in; none on the hub's ends or in its bore. Slide the hub into its strap's hole with a quarter turn to spread the compound and set both back as in the dry fit: the hub on its end on the paper, the strap on its two blocks."
feed = "hand"

[[setups.operations]]
instruction = "At once wipe any squeeze-out off both strap faces and the hub's outside with a dry rag; none may run down onto the paper."
feed = "hand"

[[setups.operations]]
instruction = "Leave the joint untouched on its blocks for 30 min. Then lift it off by the strap, peel the paper off the hub's end and set it aside untouched until 24 h from the bond. Wipe the blocks with isopropyl alcohol and oil them. Nothing loads the joint (MHA-CH-06's F drill and facing) before the 24 h."
inspection = "At 24 h: the hub does not turn or shift in the strap when twisted hard by hand; no 638 on the hub's ends or in its bore. The hub moves: stop and tell the owner (do not re-bond over cured 638)."
gauge_checks = "other"
feed = "hand"
