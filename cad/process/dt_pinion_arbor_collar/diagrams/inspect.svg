<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="sans-serif" font-size="13">
  <!-- Hand picture, a section through the axis and the pin hole, to scale at 400 px/in: the collar Ø.59 (cad.outer_dia_in) x .66 (cad.far_end_length_in), the 5/16 bore through (cad.bore_dia_mm), the 1/16 pin hole (cad.pin_hole_dia_mm) through both walls .33 from face F (cad.pin_hole_station_in), the 1/16 drill's shank in it, standing out (its length beyond the collar not on record: break lines). -->
  <rect class="paper" x="0" y="0" width="760" height="340"/>
  <text class="title" x="20" y="22">The finished collar: the 1/16 drill's shank in the pin hole, the calipers from face F (to scale, 400 px/in)</text>
  <rect class="part-kept" x="296" y="52" width="264" height="236"/>
  <rect class="holes" x="296" y="107.5" width="264" height="125"/>
  <rect class="holes" x="415.5" y="52" width="25" height="236"/>
  <path class="part-rest" d="M415.5 40L440.5 40L440.5 300L415.5 300Z"/>
  <line class="centre-line" x1="200" y1="170" x2="640" y2="170"/>
  <line class="datum" x1="560" y1="40" x2="560" y2="300"/>
  <text class="datum-label" x="566" y="50">face F</text>
  <line class="dims" x1="560" y1="312" x2="415.5" y2="312"/>
  <line class="dims" x1="560" y1="304" x2="560" y2="320"/>
  <line class="dims" x1="415.5" y1="304" x2="415.5" y2="320"/>
  <text class="label" x="40" y="332">face F to the shank's far side {{process.station_far_side_min_in:.4dot}}–{{process.station_far_side_max_in:.4dot}} for a {{process.shank_in:.4dot}} shank: pin hole {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from F</text>
  <text class="label" x="600" y="110">length {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}};</text>
  <text class="label" x="600" y="126">Ø{{cad.outer_dia_in:.3dot}}; 5/16 bore through</text>
  <line class="leader" x1="598" y1="106" x2="480" y2="52"/>
  <circle class="leader-dot" cx="480" cy="52" r="2"/>
</svg>
