  <line class="arrow" x1="149.91" y1="60" x2="149.91" y2="100"/>
  <line class="datum" x1="90" y1="110" x2="90" y2="244.93"/>
  <text class="datum-label" x="86" y="260.93">X0 face F</text>
  <line class="datum" x1="50" y1="140" x2="191.6" y2="140"/>
  <text class="datum-label" x="46" y="144" text-anchor="end">Z0</text>
  <text class="label" x="168" y="40">1/16 drill at X {{cad.pin_hole_station_mm:.3f}} mm (.33 from face F), pecks through the top wall,</text>
  <text class="label" x="168" y="56">the bore and the bottom wall into the air under it</text>
  <line class="leader" x1="164" y1="44" x2="134.91" y2="80"/>
  <circle class="leader-dot" cx="134.91" cy="80" r="2"/>
  <text class="label" x="220" y="400">1 in x 4 in parallel on edge, centred, its left end flush with the jaws</text>
  <line class="leader" x1="330" y1="388" x2="353.5" y2="324.15"/>
  <circle class="leader-dot" cx="353.5" cy="324.15" r="2"/>
  <text class="label-on-clamp" x="534.5" y="131.78">1 in offcut, on the parallel</text>
