<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the vise from the front (the operator's side, looking +Y): +X to the right, +Z up, the fixed jaw behind the blank; the moving jaw, in front, is not drawn. To scale at 5 px/mm: the blank 1.98 long (process.blank_length_in less the facing), Ø5/8 (process.bar_dia_in) with its turned Ø.59 x .80 end (cad.outer_dia_in, process.turn_length_in) to the LEFT, face F (X0) .50 past the jaws' left face (process.end_overhang_mm); the jaw tops 4.115 mm over the turned top (process.jaw_top_over_od_mm); the 1 in x 4 in parallel (process.riser_height_mm, process.parallel_length_mm) on edge, its left end flush with the jaws; the 1 in offcut on its right end. The jaw's height is from process.vise_jaw_height_mm; its length runs on to a break line; the vise bed is schematic. The 1/16 drill (process.drill_1_16_dia_mm, 7.9 px) at X 8.382 (cad.pin_hole_station_mm), its point at Z-15.963, PC01's posted depth: its full diameter 0.5 mm (process.pin_drill_past_mm) past the bottom wall, in air; it runs up to a break line. Dashed: the 5/16 bore. The #1 centre drill's spot (PC01 T1) is under it and not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="20" y="22">Setup 3, PC01 T2: the 1/16 drill pecks the pin hole through both walls, seen from the front (to scale, 5 px/mm)</text>
