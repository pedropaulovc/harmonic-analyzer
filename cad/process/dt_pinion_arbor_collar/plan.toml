[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "Op 10, to scale: a {{process.blank_length_in:.2f}} in blank marked off the 5/8 bar and sawn on the waste side, then a 1 in offcut for the mill's balance." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2f}} in from the bar end and saw on the waste side of the line; let the blank drop clear and pick it up only after the blade has stopped. Saw a 1 in offcut too: the spacer for Setup 3. File the burrs off the sawn ends."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Face, turn the O.D., drill 5/16"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the blank, {{process.stickout_mm:in.2f}} in out of the jaw fronts, measured with the rule; the rest of the blank in the jaws."
datum = "Z0 (carriage DRO) the end faced in Op 20: the collar's datum end. The pin hole's station and the part-off run from it."
diagram = { file = "diagrams/lathe.svg", alt = "Op 20, to scale: the blank 1.00 in out of the 3-jaw; the AR tool faces face F square, {{process.face_allowance_in:.2f}} off, to the centre: Z0. Dotted: the O.D. Ø.59 to come over {{process.turn_length_in:.2f}} and the bore." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bar_dia_mm}}", stock_diameter_mm = "{{process.bar_dia_mm}}", stickout_mm = "{{process.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square, {{process.face_allowance_in:.2f}} in off, to the centre with no pip; set DRO Z0 on it. Mark this face F with a marker dot near its edge: it is the collar's datum end."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the O.D. from Z0 to Z-{{process.turn_length_in:.2f}}: rough to Ø{{process.rough_dia_in:.3dot}}, then one finish pass to Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, aiming {{cad.outer_dia_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the turned O.D. by the faced end and at Z-.70."
inspection = "O.D. Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}} at both stations."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{cad.outer_dia_max_in:.3dot}} at either station: another finish pass and mike again (Op 40). Under {{cad.outer_dia_min_in:.3dot}}: saw another {{process.blank_length_in:.2f}} in blank (Setup 1) and start Setup 2 again."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-3"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock (the No. 3 centre drill in the tailstock chuck), about Ø.20 across the countersink: under the 5/16 drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-5-16"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the 5/16 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill in one steady feed until the scale reads {{process.drill_run_in:.2f}}: the drill's full diameter then runs past the parting line."
diagram = { file = "diagrams/lathe-drill.svg", alt = "Op 70, to scale: the O.D. turned; the 5/16 drill from the tailstock, run {{process.drill_run_in:.2f}} on the quill from the spot's rim: its full diameter past the parting line." }
settings = "lathe-drill-5-16-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{process.drill_run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Break the faced end's outer edge with a smooth file held flat, and the bore's mouth with the file's corner, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; spindle at the low range."
rpm = 200
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Mill: the 1/16 pin hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise. One 1 in, 4 in long parallel of the 1/8 in thick set standing on edge, centred between the jaws, its left end flush with the jaws' left face (a rule across both). The blank on its top edge along the jaws, the turned end to the LEFT, set {{process.end_overhang_mm:in.2f}} in out past the jaws' left face with the calipers' depth rod, never under .45; the jaws close on the blank's 5/8 end. The 1 in offcut (Op 10) on the parallel's right end, so the moving jaw closes square. Tap both down onto the parallel while closing the vise. Under the pin hole nothing but air."
datum = "Program PC01_pin_hole (cam:dt_pinion_arbor_collar). G54: X0 face F (faced in Op 20), +X along the blank; Y0 the turned O.D.'s axis, +Y toward the fixed jaw; Z0 the top of the turned O.D. The file starts with an M6 for the centre drill; tool lengths from the tool setter at each M6; at the M6 stop the file has stopped the spindle and lifted the tool above the jaws."
diagram = { file = "diagrams/pin-hole.svg", alt = "PC01 T2, to scale, from the front: the blank on the 1 in x 4 in parallel on edge, face F {{process.end_overhang_mm:in.2f}} past the jaws' left face, the 1 in offcut on the parallel's right end; the 1/16 drill {{cad.pin_hole_station_in:.2dot}} from face F through both walls and the bore into the air under it." }
envelope = { x_span_mm = ["{{process.blank_length_mm}}", 3.175], y_span_mm = ["{{process.bar_dia_mm}}", 3.175], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.bar_dia_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.pin_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_1_16_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.bar_dia_mm}}", along_jaws_mm = "{{process.blank_length_mm}}", part_height_mm = "{{process.bar_dia_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.end_overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_mm}}"], clamp_mm = ["{{process.end_overhang_mm}}", "{{process.blank_length_mm}}"], section_mm = { diameter = "{{cad.outer_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 Y0 the turned O.D.'s axis: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm, Ø.200), its tip level with the blank's axis, on the turned O.D. in the overhang: from the −Y side, G10 L20 P1 Y0; MDI G0 Z clear of the blank, then from the +Y side G10 L20 P1 Y(half the DRO's work Y reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 face F: edge finder (900 rpm) at Y5.750, on face F's ring between the Ø.313 bore and the Ø.59 O.D."
instruction_detailed = "X and Z have no work zero yet, so jog: Z up until the tip clears the blank's top; X left until the tip is about .3 in left of face F; then MDI G0 Y5.750 (Y0 is set; the Ø.200 tip then spans R.126–.326, across face F's ring); jog Z down to put the tip at the blank's axis height. Bring the edge finder in from the left onto face F: G10 L20 P1 X-2.540. Jog X left .3 in and Z up clear before Op 110."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the turned O.D., touched with the centre drill over the axis."
instruction_detailed = "Console M6 T1 (#1 centre drill in the drill chuck, at least {{process.spot_projection_min_mm:in.2f}} in out of it; the tool setter measures it). MDI G0 X3.000 Y0.000: over the overhang. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PC01_pin_hole in air, Z0 raised 1.000 in. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PC01_pin_hole, watching every move clear the jaws; at its first M6 prompt T1 is already in, so continue; at the second put the 1/16 drill in (at least {{process.drill_projection_min_mm:in.2f}} in out of the chuck). G10 L2 P1 Z(the noted Z) puts Z0 back, and the centre drill goes back in for the real run."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run PC01_pin_hole: the #1 centre drill (T1, set 1800) spots the pin hole {{cad.pin_hole_station_in:.2dot}} in from face F on the axis, to Ø{{process.spot_dia_mm:in.3dot}}; at the M6 stop the 1/16 drill (T2, at least {{process.drill_projection_min_mm:in.2f}} in out of the chuck) goes in."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.pin_hole_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-1-16"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.pin_hole_dia_band_mm}}" }
instruction = "Cycle Start: the 1/16 drill (T2, set 2800) pecks the pin hole through the top wall, the bore and the bottom wall into the air under it, {{process.pin_peck_mm:in.3dot}} in pecks, full retract between. Cutting oil."
rpm = 2800
feed = "{{process.drill_feed_per_min_mm:in.1f}} in/min"
peck = { step_mm = "{{process.pin_peck_mm}}", retract = "full" }
hole_depth_mm = "{{cad.outer_dia_mm}}"
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.drill_1_16_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = "{{cad.pin_hole_station_mm}}" },
]

[[setups]]
machine_kind = "lathe"
title = "Part the collar off"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the blank's 5/8 end, the turned end out, {{process.part_off_stickout_mm:in.2f}} in out of the jaw fronts (the turned shoulder .15 in out of them)."
datum = "DRO Z set on face F (Op 20's datum end) through the blade, as Op 150 says: the collar is parted .66 from it."
diagram = { file = "diagrams/part-off.svg", alt = "Op 150, to scale: the blank back in the 3-jaw, the turned end out; the P1 blade parts the collar off {{cad.far_end_length_in:.2dot}} from face F." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bar_dia_mm}}", stock_diameter_mm = "{{process.bar_dia_mm}}", stickout_mm = "{{process.part_off_stickout_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.far_end_length_in:.3dot}}, steady hand feed, cutting oil; the blade breaks into the bore, so no pip is left. Hands clear: let the collar fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
holding = "Bench vise with soft jaws on the collar's O.D."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished collar: Ø.59 × .66 long, the 5/16 bore through, the 1/16 pin hole through both walls .33 from face F; the 1/16 drill's shank in the pin hole, the calipers from face F to its far side." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "File the parting burr off the parted face flat on the smooth file; break that face's outer edge and the bore's mouth there, and both ends of the pin hole, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Clear the pin hole's breakthrough burr inside the bore with the 1/16 drill turned by hand."
feed = "hand"

[[setups.operations]]
instruction = "Length: calipers across face F and the parted face. Bore: the telescoping gauge at both ends, read on the micrometers. Pin hole: an MHA-DT-VN-63 pin, tried by hand at each end, does not enter (it must be driven at assembly; fit audit F15). Station: the 1/16 drill's shank through the hole, calipers from face F to the shank's far side, {{process.station_far_side_min_in:.4dot}}–{{process.station_far_side_max_in:.4dot}} for a {{process.shank_in:.4dot}} shank (the station plus half the shank; a smaller shank reads half its shortfall less)."
inspection = "Length {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}; bore Ø{{process.bore_print_min_in:.3dot}}–{{process.bore_print_max_in:.3dot}}; MHA-DT-VN-63 does not enter the pin hole by hand; pin hole {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from face F."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" }, { gauge = "telescoping-gauges-starrett-s579gz", band_mm = ["{{process.bore_print_min_mm}}", "{{process.bore_print_max_mm}}"] }, { gauge = "calipers", band_mm = "{{cad.pin_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Out of any limit in Op 170: scrap the collar and make another from Setup 1. Over-long only: face the parted end on the lathe (3-jaw over a brass shim wrap, face F in) into the band, break the re-faced end's outer edge and bore mouth again as in Op 160, then read Op 170 again."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil, into the bore and the pin hole (FINISH: {{cad.finish}}). Bag the collar with its number."
feed = "hand"
