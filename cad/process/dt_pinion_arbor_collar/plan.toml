# Pinion arbor retention collar MHA-DT-33, one off, from 5/8 in round 1018 CF.
# Route, chosen for speed (owner ruling 2026-11-21: turned setups are manual
# lathe work on the PM-1127VF-LB with a traveler and no NC; milled features
# run from a program on the PM-30MV):
# - Setup 1, saw: a 2.00 in blank, and a 1 in offcut for Setup 3's spacer.
# - Setup 2, lathe, 3-jaw: face the end (the collar's datum end), turn the
#   Ø.59 O.D. .80 in long, spot and drill 5/16 past the parting line, break
#   the faced end's edge. The collar stays on its blank.
# - Setup 3, mill, vise: the 1/16 pin hole is drilled while the collar is
#   still the blank's turned end: the blank lies along the jaws on one 1 in
#   parallel on edge, the turned end .50 in out past the jaws' left face, so
#   the hole (.33 from the faced end) is drilled in that overhang into air.
#   Program PC01_pin_hole spots it and pecks the 1/16 through both walls.
#   Drilling it on the blank, not on the parted collar, needs no second
#   fixture, no balance part of the collar's diameter and no drill run-out
#   into a parallel.
# - Setup 4, lathe, 3-jaw: the blank again, turned end out; the P1 blade
#   parts the collar off .66 from the faced end. The parted face is the
#   collar's far end, held to .65-.67 by the carriage DRO; no facing.
# - Setup 5, bench: deburr, check, oil, bag.
#
# Checks: the O.D. on the lathe (micrometers); length, bore (telescoping
# gauge and micrometers), pin hole (an MHA-DT-VN-63 pin does not enter by
# hand, fit audit F15) and the hole's station at the bench. The bore is a
# plain drilled hole (DRILL THRU, +.004/0) that slides on the MHA-DT-22
# arbor, not a matched fit; the MHA-DT-VN-63 spring pin is driven into the
# pin hole at assembly.
#
# NC (cam:dt_pinion_arbor_collar, cad/process/dt_pinion_arbor_collar/cam.py):
# PC01_pin_hole. The program name, the [parameters] and the milling_cuts
# names are a contract with that recipe. Tool numbers are the places in the
# tools list among the mill's tools: T1 the centre drill, T2 the 1/16 drill.
title = "Pinion Arbor Retention Collar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 5/8 in round (drawing: {{cad.material_name}})"
stock = "Qty {{process.quantity:g}}. {{process.bar_dia_in:fraction}} in round bar on hand: one blank {{process.blank_length_in:.2f}} in long, and a 1 in offcut for the mill setup's spacer."
note = "Inches unless mm; G-code and console entries in mm (the file and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil on the steel. Finished Ø{{cad.outer_dia_min_in:.2dot}}–{{cad.outer_dia_max_in:.2dot}} × {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}} long, the Ø{{process.bore_print_min_in:.3dot}}–{{process.bore_print_max_in:.3dot}} drilled bore through, the 1/16 pin hole through both walls {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from the faced (datum) end. Mill speeds on the PM-30MV low belt (100–2800 rpm). Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Prove the file in air first."
shop = "../shop"
stock_refs = ["1018-round-5-8"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_pinion_arbor_collar/features.toml"
adapter = "drilled_block"
part = "dt-pinion-arbor-collar"

[parameters]
quantity = 1
bar_dia_in = 0.625
bar_dia_mm = 15.875
# The blank: the .80 in turned end, the 1.00 in the 3-jaw grips in Setup 2
# and the faced-off .02, rounded up.
blank_length_in = 2.0
blank_length_mm = 50.8
# The blank the collar is cut from (stock_fit: envelope X, Y, Z; Z the axis).
blank_x_in = 0.625
blank_y_in = 0.625
blank_z_in = 2.0
# Setup 2: the blank 1.00 in out of the jaw fronts; the O.D. turned .80 in
# long: the .66 collar, the P1 blade's width and .08 in beyond it, so the
# blade parts inside the turned length and stands .20 clear of the jaws.
stickout_mm = 25.4
turn_length_in = 0.8
# Facing allowance: enough to square a sawn end.
face_allowance_in = 0.02
# Turning (A R Warner AR holder, TCMT insert, R0.4 nose, carbide): the
# O.D. roughed to .600, then one finish pass to the .58-.60 band, aiming .590.
rough_dia_in = 0.6
# The 5/16 drill: its full diameter to .80 from the faced end (past the
# parting line at .66 + the blade's .0625), in one feed (L/D 2.6).
drill_run_in = 0.8
drill_run_mm = 20.32
# Setup 4: the blank's 5/8 end in the 3-jaw, the turned end .95 in out: the
# blade's far face at .7225 stays .23 in clear of the jaw fronts.
part_off_stickout_mm = 24.13
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander.
part_kerf_in = 0.075
# Mill (shop workholding.vise-pm-6, fixtures.parallels-lms-6745, 1/8 in
# thick): one 1 in parallel of the set standing on edge, centred between the
# jaws, its left end flush with the jaws' left face; the blank lies on its
# top edge with the turned end .50 in out past the jaws' left face; the 1 in
# offcut on the parallel's right end balances the jaws.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The LMS 6745 parallels are 4 in long (as the dt_pinion_bracket plan
# records); the offcut spacer sits on the parallel's right end.
parallel_length_mm = 101.6
# The turned end past the jaws' left face; the pin hole drills in this
# overhang (its .34 far limit plus half the centre drill's 1/8 body is .40).
end_overhang_mm = 12.7
# Z0 is the turned O.D.'s top; the jaw tops stand this far above it (the jaw
# height less the parallel, the bar's radius and the turned radius); cam.py
# checks it.
jaw_top_over_od_mm = 4.1148
# The 1/16 drill runs this far past the turned O.D.'s underside (authored);
# its tip then stands this far above the parallel's top (the bar's and the
# turned O.D.'s radii less the O.D., the run past and the point); cam.py
# checks it.
pin_drill_past_mm = 0.5
pin_tip_height_mm = -0.5324
# The #1 centre drill spots to Ø2.0 mm (over the 1/16's 1.5875), cam.py
# computes the depth.
spot_dia_mm = 2.0
# The 1/16 drill (shop tools.drill-1-16.diameter_mm); cam.py checks it.
drill_1_16_dia_mm = 1.5875
# Pecks of the 1/16: under one diameter (prechips drill_pecking's step
# limit), full retract.
pin_peck_mm = 1.5
# Speeds and feeds: LittleMachineShop "Cutting Speeds", Drilling & Reaming,
# Plain carbon steels 1006-1026 (read 2026-11-20): drilling 60-100 ft/min;
# AutoDrill "Suggested drilling feed rates" (read 2026-11-20), row Stl,
# Carbon: 1/16 in .001 in/rev (both as the dt_pinion_cam plan). The 1/16 at
# the spindle's 2800 (46 ft/min, under the range: the spindle's top) × .001
# = 2.8 in/min; the centre drill 1800 × .001 = 1.8 in/min (the cam's spot).
spot_feed_per_min_mm = 45.72
drill_feed_per_min_mm = 71.12
# Machine-capacity inputs (mm): tool lengths from spindle nose to tip.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# ASME B94.11M jobber length overall, 1/16: 1-7/8 in; the #1 combined drill
# and countersink 1-1/4 in. Bounded by their whole length below the chuck.
drill_1_16_oal_mm = 47.625
centre_drill_oal_mm = 31.75
# The least length each must stand out of the drill chuck to reach its
# depth with the chuck above the jaw tops; cam.py checks it.
spot_projection_min_mm = 20.0
drill_projection_min_mm = 26.0
# Bench: the pin hole has no gauge pin: an MHA-DT-VN-63 must drive, not
# enter by hand (necessity N-01, kind bought_seat; fit audit F15). The station is
# read over the 1/16 drill's shank: the faced end to the shank's far side is
# the station plus half the shank (.03125).
shank_in = 0.0625
station_far_side_min_in = 0.3513
station_far_side_max_in = 0.3713
# The bore as the sheet prints it: Ø.313 DRILL THRU under the title block's
# DRILLED HOLES +.004/0, .313-.317 (the export carries the unrounded .3125
# nominal with the same band, .3125-.3165).
bore_print_min_in = 0.313
bore_print_max_in = 0.317
bore_print_min_mm = 7.9502
bore_print_max_mm = 8.0518

