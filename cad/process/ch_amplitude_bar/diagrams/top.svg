<path class="axis" d="M560 370 H610"/><text class="label" x="614" y="374">+X</text>
<path class="axis" d="M560 370 V320"/><text class="label" x="552" y="316">+Y</text>
<text class="label" x="20" y="256">End view from the top end, fixed jaw on the right (riser drawn short)</text>
<rect class="clamp" x="40" y="264" width="30" height="120"/>
<text class="label" x="22" y="396">moving jaw</text>
<rect class="part-kept" x="70" y="270" width="36" height="36"/>
<rect class="part-removed" x="70" y="278.25" width="36" height="18.75"/>
<rect class="part-kept" x="106" y="270" width="36" height="36"/>
<rect class="part-removed" x="106" y="278.25" width="36" height="18.75"/>
<rect class="part-kept" x="142" y="270" width="36" height="36"/>
<rect class="part-removed" x="142" y="278.25" width="36" height="18.75"/>
