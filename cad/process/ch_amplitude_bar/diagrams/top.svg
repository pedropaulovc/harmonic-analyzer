<?xml version="1.0" encoding="UTF-8"?>
<!-- Setup 4: four bars rolled over, top ends .75 past the right jaw side; CA03 faces them to length, CA04 saws the top notch, CA05 spots, drills and reams the pin holes. Top view and an end view. Styles: prechips.palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="12">
<rect class="paper" width="640" height="330"/>
<text class="label" x="20" y="20">Top view</text>
<rect class="clamp" x="190" y="30" width="200" height="40"/>
<text class="label" x="240" y="24">fixed jaw</text>
<rect class="clamp" x="190" y="134" width="200" height="40"/>
<text class="label" x="230" y="188">moving jaw</text>
<rect class="part-kept" x="0" y="70" width="440" height="16"/>
<rect class="part-kept" x="0" y="86" width="440" height="16"/>
<rect class="part-kept" x="0" y="102" width="440" height="16"/>
<rect class="part-kept" x="0" y="118" width="440" height="16"/>
<circle class="cutter" cx="500" cy="102" r="80" fill-opacity="0.75"/>
<circle class="holes" cx="425" cy="78" r="3"/>
<circle class="holes" cx="425" cy="94" r="3"/>
<circle class="holes" cx="425" cy="110" r="3"/>
<circle class="holes" cx="425" cy="126" r="3"/>
<text class="label" x="474" y="60">slitting saw</text>
<path class="arrow" d="M600 200 V230"/>
<text class="label" x="530" y="222">feed −Y</text>
<line class="datum" x1="440" y1="64" x2="440" y2="140"/>
<text class="label" x="460" y="212">X0 = length</text>
<path class="leader" d="M470 200 L442 138"/>
<path class="dims" d="M390 186 H440"/>
<text class="label" x="392" y="182">{{process.end_protrusion_mm:in.2dot}}</text>
<text class="label" x="20" y="196">foot ends flush, past the table</text>
<path class="axis" d="M60 300 H110"/><text class="label" x="114" y="304">+X</text>
<path class="axis" d="M60 300 V250"/><text class="label" x="52" y="246">+Y</text>
<text class="label" x="300" y="262">End view of one top end</text>
<rect class="part-kept" x="320" y="270" width="48" height="48"/>
<rect class="part-removed" x="320" y="281" width="48" height="25"/>
<line class="centre-line" x1="344" y1="264" x2="344" y2="324"/>
<line class="active-face" x1="310" y1="318" x2="378" y2="318"/>
<text class="label" x="380" y="322">R face on the parallels (Z0)</text>
<text class="label" x="380" y="298">notch {{process.top_notch_width_mm:in.4dot}} wide, ledge {{cad.top_notch_ledge_in:.3dot}} above R</text>
<text class="label" x="380" y="280">pin hole down through both cheeks</text>
</svg>
