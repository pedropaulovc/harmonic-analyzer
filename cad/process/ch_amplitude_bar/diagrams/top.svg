<?xml version="1.0" encoding="UTF-8"?>
<!-- Setup 4: four bars rolled over, side by side on the riser (two blocks end to end on the vise bed against the fixed jaw), top ends .75 past the right jaw side; CA03 faces them to length, CA04 saws the top notch, CA05 spots, drills and reams the pin holes. Top view and an end view of the load. Styles: prechips.palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="sans-serif" font-size="12">
<rect class="paper" width="640" height="400"/>
<text class="label" x="20" y="20">Top view</text>
<rect class="clamp" x="190" y="30" width="200" height="40"/>
<text class="label" x="240" y="24">fixed jaw</text>
<rect class="clamp" x="190" y="126" width="200" height="40"/>
<text class="label" x="200" y="182">moving jaw</text>
<rect class="part-kept" x="0" y="70" width="440" height="14"/>
<rect class="part-kept" x="0" y="84" width="440" height="14"/>
<rect class="part-kept" x="0" y="98" width="440" height="14"/>
<rect class="part-kept" x="0" y="112" width="440" height="14"/>
<rect class="hidden" x="194" y="70" width="96" height="53"/>
<rect class="hidden" x="290" y="70" width="96" height="53"/>
<text class="label" x="100" y="60">bar 1</text>
<path class="leader" d="M114 64 L114 76"/>
<text class="label" x="100" y="146">bar 4</text>
<path class="leader" d="M114 134 L114 120"/>
<circle class="cutter" cx="500" cy="98" r="80" fill-opacity="0.75"/>
<circle class="holes" cx="425" cy="77" r="3"/>
<circle class="holes" cx="425" cy="91" r="3"/>
<circle class="holes" cx="425" cy="105" r="3"/>
<circle class="holes" cx="425" cy="119" r="3"/>
<text class="label" x="474" y="12">slitting saw</text>
<path class="arrow" d="M600 236 V206"/>
<text class="label" x="530" y="228">feed +Y</text>
<line class="datum" x1="440" y1="64" x2="440" y2="132"/>
<text class="label" x="456" y="212">X0 = length</text>
<path class="leader" d="M466 200 L442 134"/>
<path class="dims" d="M390 196 H440"/>
<text class="label" x="392" y="192">{{process.end_protrusion_mm:in.2dot}}</text>
