<line class="centre-line" x1="196" y1="264" x2="196" y2="312"/>
<rect class="fixture-support" x="78" y="306" width="136" height="78"/>
<rect class="clamp" x="214" y="264" width="30" height="120"/>
<text class="label" x="190" y="396">fixed jaw</text>
<line class="active-face" x1="70" y1="306" x2="214" y2="306"/>
<text class="label" x="254" y="276">pin hole down through both cheeks</text>
<path class="leader" d="M250 272 L198 268"/>
<text class="label" x="254" y="298">notch {{process.top_notch_width_mm:in.4dot}} wide, ledge {{cad.top_notch_ledge_in:.3dot}} above R</text>
