<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif" font-size="13">
  <!-- Setup 5, the saw. Sizes from the plan's [parameters]: bars 1/4 in square (blank_width_in), riser 1 in tall (riser_parallel_height_mm) and .92-.96 wide (riser_width_min/max_mm, drawn .94), two 3 in blocks end to end centred on the 6.247 in jaws (vise_jaw_width_mm), jaws 1.770 in tall (vise_jaw_height_mm), the ends .75 in past the jaw side (end_protrusion_mm). The jaws' depth across the vise and the vise body are not on record: drawn schematic. The slitting saw to scale (saw_dia_mm 69.85, saw_thickness_mm 1.6256; shop tools.slitting-saw-2-75-064), horizontal, on the R8 stepped arbor: body above and cap below the saw both Ø1.25 (saw_arbor_body_dia_mm, saw_arbor_cap_dia_mm), the cap .50 thick (saw_arbor_cap_thickness_mm), all in the tool colour; the arbor's body drawn short to a break line. The screw head under the cap is not drawn (its stand past the cap is to be measured). CA04's first level, last step: saw centre X +20.955 (its rim top_notch_depth_mm 13.970 into the ends), lower face Z 1.600 (the ledge), fed +Y from -62.763 to +37.465; drawn at Y -12.649, the load's middle. The light pass and the steps before it (top_notch_step_mm 2.794) and the second level (Z 3.175) are not drawn; the notch is shown whole. -->
