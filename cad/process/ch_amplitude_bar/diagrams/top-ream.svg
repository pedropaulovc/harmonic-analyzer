<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif" font-size="13">
  <!-- Setup 5, the reamer. Sizes from the plan's [parameters]: bars 1/4 in square (blank_width_in), riser 1 in tall (riser_parallel_height_mm) and .92-.96 wide (riser_width_min/max_mm, drawn .94), two 3 in blocks end to end centred on the 6.247 in jaws (vise_jaw_width_mm), jaws 1.770 in tall (vise_jaw_height_mm), the ends .75 in past the jaw side (end_protrusion_mm). The jaws' depth across the vise and the vise body are not on record: drawn schematic. Section along the P1 bar's centre (Y -3.175, CA05's first hole), from the moving jaw's side: the fixed jaw behind, the moving jaw and the P2-P4 bars in front cut away. The hole at X -6.350 (.25 from the top end), the top notch already sawn (CA04: .55 deep, 3.200 mm wide, its ledge 1.600 mm over R). The riser starts .87 in from the top end, under the jaws: out of this view. The .0775 reamer to scale (cutter_dia_mm 1.9685 = 23.2 px; plan tool reamer-0775), its end drawn as the near half of the end face, 12 % deep, its true end at CA05's Z -1.000 (ream_past_mm 1.0 past R); drawn short to a break line, 1.00 in out of the chuck (ream_projection_mm; the chuck is not drawn). -->
