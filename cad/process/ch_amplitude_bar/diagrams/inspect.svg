<?xml version="1.0" encoding="UTF-8"?>
<!-- Setup 5: the finished bar's two ends, side views. Styles: prechips.palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" font-family="sans-serif" font-size="12">
<rect class="paper" width="640" height="220"/>
<text class="label" x="20" y="20">Foot end (L face down)</text>
<rect class="part-kept" x="20" y="40" width="240" height="60"/>
<rect class="paper" x="20" y="58" width="22" height="26"/>
<line class="dims" x1="20" y1="110" x2="42" y2="110"/>
<text class="label" x="20" y="126">depth {{cad.foot_notch_depth_min_in:.4dot}}–{{cad.foot_notch_depth_max_in:.4dot}}</text>
<text class="label" x="20" y="142">width {{cad.foot_notch_width_min_in:.3dot}}–{{cad.foot_notch_width_max_in:.3dot}}</text>
<text class="label" x="20" y="158">ledge {{cad.foot_notch_ledge_min_in:.3dot}}–{{cad.foot_notch_ledge_max_in:.3dot}} from L</text>
<text class="label" x="340" y="20">Top end (R face down)</text>
<rect class="part-kept" x="340" y="40" width="280" height="60"/>
<rect class="paper" x="478" y="54" width="142" height="30"/>
<circle class="holes" cx="560" cy="70" r="5"/>
<line class="centre-line" x1="560" y1="30" x2="560" y2="110"/>
<text class="label" x="340" y="126">depth {{cad.top_notch_depth_min_in:.2f}}–{{cad.top_notch_depth_max_in:.2f}}, width {{cad.top_notch_width_min_in:.3dot}}–{{cad.top_notch_width_max_in:.3dot}}</text>
<text class="label" x="340" y="142">ledge {{cad.top_notch_ledge_min_in:.3dot}}–{{cad.top_notch_ledge_max_in:.3dot}} from R</text>
<text class="label" x="340" y="158">pin hole {{cad.top_pin_hole_drop_min_in:.2f}}–{{cad.top_pin_hole_drop_max_in:.2f}} from the end</text>
<text class="label" x="340" y="174">reamed to the pin (sheet note 1)</text>
<text class="label" x="20" y="200">Length {{cad.top_end_length_min_in:.2f}}–{{cad.top_end_length_max_in:.2f}}, foot end to top end</text>
</svg>
