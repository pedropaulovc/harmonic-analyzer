<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif" font-size="13">
  <!-- Setup 3. Sizes from the plan's [parameters]: bars 1/4 in square (blank_width_in), riser 1 in tall (riser_parallel_height_mm) and .92-.96 wide (riser_width_min/max_mm, drawn .94), two 3 in blocks end to end centred on the 6.247 in jaws (vise_jaw_width_mm), jaws 1.770 in tall (vise_jaw_height_mm), the ends .75 in past the jaw side (end_protrusion_mm). The jaws' depth across the vise and the vise body are not on record: drawn schematic. The 1/2 in end mill to scale (face_cutter_dia_mm 12.7 = 50 px in front, 25 px above), its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line (2.00 in out of the collet, half_mill_projection_min_mm; the collet is not drawn, its size is not on record). CA01's one pass: cutter centre X -6.350, its side on X0, tip Z -0.100 (end_tip_below_mm), fed +Y from Y -34.188 to +8.890; drawn at Y -12.649, the load's middle. The 1-2-3 block that sets the ends flush is taken away before the vise closes: a callout, not drawn. No work stop in this setup. -->
  <rect class="paper" x="0" y="0" width="780" height="430"/>
