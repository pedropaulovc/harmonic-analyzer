<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="sans-serif" font-size="13">
  <!-- Setup 1: two blanks from each 72 in length, the bar flat in the saw's vise (the vise and blade schematic: their sizes are not on record); the bow check on the surface plate. Lengths not to scale. -->
  <rect class="paper" x="0" y="0" width="640" height="250"/>
  <text class="label" x="20" y="24">72 in length of 1/4 in square, two blanks; the bar flat in the saw's vise</text>
  <rect class="part-kept" x="20" y="40" width="270" height="14"/>
  <rect class="part-kept" x="296" y="40" width="270" height="14"/>
  <rect class="part-rest" x="572" y="40" width="48" height="14"/>
  <rect class="part-removed" x="290" y="36" width="6" height="22"/>
  <rect class="part-removed" x="566" y="36" width="6" height="22"/>
  <rect class="clamp" x="300" y="26" width="40" height="14"/>
  <rect class="clamp" x="300" y="54" width="40" height="14"/>
  <line class="leader" x1="380" y1="100" x2="342" y2="64"/>
  <circle class="leader-dot" cx="342" cy="64" r="2"/>
  <text class="label" x="384" y="104">saw vise (schematic), the next cut at its left</text>
  <line class="dims" x1="20" y1="64" x2="290" y2="64"/>
  <line class="dims" x1="20" y1="58" x2="20" y2="70"/>
  <line class="dims" x1="290" y1="58" x2="290" y2="70"/>
  <text class="label" x="80" y="82">{{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}}</text>
  <text class="label" x="120" y="104">kerfs</text>
  <line class="leader" x1="150" y1="94" x2="292" y2="58"/>
  <circle class="leader-dot" cx="292" cy="58" r="2"/>
  <text class="label" x="576" y="80">rest</text>
  <text class="label" x="20" y="140">Bow check: the blank on its L face, then its F face</text>
  <rect class="fixture-table" x="20" y="190" width="600" height="22"/>
  <text class="label" x="26" y="230">surface plate</text>
  <path class="part-kept" d="M40 186 Q330 176 620 186 L620 176 Q330 166 40 176 Z"/>
  <path class="leader" d="M300 181H360V185H300Z"/>
  <line class="leader" x1="360" y1="150" x2="330" y2="182"/>
