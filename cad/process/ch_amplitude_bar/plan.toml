[[setups.operations]]
instruction = "Home ($H) if not yet homed this session. G54 Y0 the fixed jaw's face; X0 the top end at the length: edge finder (900 rpm) on the top end that stands farthest right, less that bar's x (Setup 4). It is the bar of the four with the largest x: if not, stop and recheck the x written on them."
instruction_detailed = "Home ($H) if not yet homed this session. Edge finder (900 rpm). Y: its tip .10 below the jaw top (well above the bars), on the fixed jaw's face from the bars' side (−Y), G10 L20 P1 Y-2.540. X: its tip .10 below the bars' top, on the top end farthest right (the bar with the largest x of the four; if not, stop and recheck the x written on them), from the right: G10 L20 P1 X(2.540 + that bar's x × 25.4); for x = .060, X4.064."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the bars' down face, from the top face of the bar against the fixed jaw and its miked section, with T1 as in Setup 3 (2.00 in out of the collet)."
