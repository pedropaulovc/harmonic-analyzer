[[setups.operations]]
instruction = "Every load, before the X pick-up: at the far (foot) ends, rest the end of the calipers' beam on the foot end that stands out farthest, the beam along the bars, and run the depth rod to each other foot end; read each step to .001."
inspection = "Every step {{process.foot_flush_max_mm:in.3dot}} or less: the four face to one length. Over: open the vise, push the foot ends flush against the 1-2-3 block, close it tapping each bar down, and repeat the seat sweep and this check."
