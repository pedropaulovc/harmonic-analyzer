[[setups]]
machine_kind = "other"
title = "Saw, mic, bow-check and straighten the blanks; saw the riser"
machine = "Saw / bench / surface plate / arbor press"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "A 72 in length of the 1/4 in square bar with two blanks marked off it, a kerf between; below, a blank on the surface plate with a .005 feeler leaf at its side face." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long, two from each 72 in length, the bar flat in the saw's vise, each marked off with the 48 in rule. File the burrs off both ends."
feed = "hand"
inspection = "Each blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long: the 48 in rule (to buy; 1/64 in graduations). Shorter: scrap it (another length); longer: saw it again."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
instruction = "Number each blank 1–{{process.quantity:d}} at one end in marker; that end becomes the foot. Lay the blank flat, the foot end toward you: mark the left side face L and the upward face F (front) along their length with marking fluid and a scribe; the right side face is R and the face on the bench is B (back)."
feed = "hand"

[[setups.operations]]
instruction = "Mic each blank across both pairs of faces at both ends and the middle. Write each end's L-to-R reading to .0001 on the blank at that end: Setup 3 zeros and sweeps on the foot end's, Setup 5 on the top end's."
inspection = "Every reading {{cad.front_face_section_min_in:.3dot}}–{{cad.front_face_section_max_in:.3dot}}: this traveler's incoming-stock gate (the drawing gives the section as 1/4 SQ STOCK, reference). Outside: set the blank aside and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.front_face_section_band_mm}}" }]

[[setups.operations]]
instruction = "Bow check (MHA-CH-00's acceptance, done here first): lay each blank on the surface plate on its L face, then on its F face, and try a .005 feeler leaf under it along its length. If the plate is shorter than the blank, check it in overlapping lengths, sliding it along."
inspection = "The .005 leaf does not enter under either face anywhere. Enters: straighten it (next operation)."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "arbor-press"
drilling = "none"
sizing = "other"
instruction = "Straighten a bowed blank: two pieces of bar stock on the press bed about 6 in apart under the high spot, the bow up, a short piece of bar on top under the ram; press in small steps, a little past straight, and recheck on the plate after each. Work along the blank in steps."
feed = "hand"
inspection = "Rechecked as above: the .005 leaf does not enter. Still bowed after three tries, or kinked: scrap it and saw another."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "The riser, made once and kept for later lots (skip if it is on hand): saw two slices {{process.riser_width_min_mm:in.2dot}}–{{process.riser_width_max_mm:in.2dot}} thick across the 1 × 3 in 6061 bar (the 12 in bar on hand), the bar flat in the saw's vise, each mark scribed .94 from the end with the calipers. File the burrs off every edge."
feed = "hand"
inspection = "Each block {{process.riser_width_min_mm:in.2dot}}–{{process.riser_width_max_mm:in.2dot}} across its sawn faces at both ends and the middle (the calipers): under {{process.riser_width_max_mm:in.2dot}}, the four narrowest bars (4 × .248) still close the vise on the bar against the moving jaw, not the riser. Over: file or saw it back; under: saw another."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.riser_width_min_mm}}", "{{process.riser_width_max_mm}}"] }]

[[setups.operations]]
instruction = "Each slice is a riser block: 3 in long (the bar's width), 1 in tall (the bar's thickness), {{process.riser_width_min_mm:in.2dot}}–{{process.riser_width_max_mm:in.2dot}} wide across its sawn faces. Mark TOP on one of each block's two 3 in long faces that are the bar's broad faces, not the sawn ones."
feed = "hand"

[[setups.operations]]
instruction = "Calipers each new block's 3 in length (the bar's as-bought width) at both ends: Setup 2 grips both blocks at once across that length."
inspection = "Every reading {{process.riser_length_min_mm:in.2dot}}–{{process.riser_length_max_mm:in.2dot}}, and the two blocks within .002 of each other (sawn next to each other off the bar, they match). Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.riser_length_min_mm}}", "{{process.riser_length_max_mm}}"] }]

[[setups.operations]]
instruction = "Mic each new riser block's height (the bar's 1 in thickness) at its four corners, to .0001, and write the highest reading on its block."
inspection = "Every reading {{process.riser_blank_height_min_mm:in.3dot}}–{{process.riser_blank_height_max_mm:in.3dot}}, and all eight within {{process.riser_blank_spread_max_mm:in.3dot}} of each other: CA00's one {{process.riser_face_mm:in.3dot}} pass, touched off on the higher top, then faces every corner of both, leaving {{process.riser_height_min_mm:in.3dot}}–{{process.riser_height_max_mm:in.3dot}}. A reading outside the band: stop and tell the owner (another slice off the same bar would read the same). All in the band, the spread over {{process.riser_blank_spread_max_mm:in.3dot}}: saw a third block next to the two, calipers and mic it as above, and keep the two closest in height; still over: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.riser_blank_height_min_mm}}", "{{process.riser_blank_height_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "Face a new riser (skip if it is on hand)"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Skip this setup if the riser is on hand. The two new blocks in the PM 6 in vise on the 1 in pair from the parallel set, one parallel against each jaw. Each block stands across the jaws, TOP up, its 3 in length between them: the bar's as-bought edges against the jaws, never a sawn face, and it rests on both parallels. The two side by side along the jaws, centred. Their tops stand about .2 above the jaw tops; the jaws grip their lower .77 in."
datum = "Program CA00_riser_face (end mill). G54: X0 the vise's left jaw side, Y0 the fixed jaw's face, Z0 the higher riser top. +X along the jaws to the right, +Y toward the fixed jaw."
diagram = { file = "diagrams/riser.svg", alt = "Two riser blocks side by side along the jaws, each standing across the jaws on the two 1 in parallels, their tops above the jaw tops; the end mill faces both tops in passes along the jaws." }
envelope = { x_span_mm = ["{{process.vise_jaw_width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.riser_length_max_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_parallel_height_mm}}", "{{process.riser_blank_height_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_parallel_height_mm}}", "{{process.riser_height_min_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.riser_length_max_mm}}", along_jaws_mm = "{{process.riser_pair_width_max_mm}}", part_height_mm = "{{process.riser_blank_height_max_mm}}", parallel_height_mm = "{{process.riser_parallel_height_mm}}", overhang_mm = ["{{process.riser_face_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "y", hold = "cantilever", extent_mm = [0, "{{process.riser_length_max_mm}}"], clamp_mm = [0, "{{process.riser_length_max_mm}}"], section_mm = { x = "{{process.riser_width_min_mm}}", z = "{{process.riser_height_min_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "The vise empty. Home ($H) if not yet homed this session. G54 for CA00_riser_face: Y0 the fixed jaw's face, X0 the vise's left jaw side, edge finder (900 rpm)."
instruction_detailed = "The vise open and empty. Home ($H) if not yet homed this session. Edge finder (900 rpm), its tip .10 below the jaw top. Y: on the fixed jaw's face from the open side (−Y), G10 L20 P1 Y-2.540. X: on the fixed jaw's left side from the left, G10 L20 P1 X-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "The 1 in pair from the parallel set on the vise bed, one against each jaw. Stand each block across the jaws on both parallels, TOP up, its 3 in length between the jaws (as-bought edges to the jaws); the two side by side along the jaws, centred. Close the vise, tapping each block down onto both parallels. Their tops stand about .2 above the jaw tops: CA00 passes over the jaws."
feed = "hand"
inspection = "Each block tight: pushed along the jaws by hand, neither moves. Loose: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Console M6 T1 (1/2 in end mill, 2.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip on a .002 leaf on the higher riser top (the higher reading written in Setup 1): G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "The first time: prove CA00_riser_face in air, Z0 raised 1.000 in (send $#, G10 L2 P1 Z(the G54 line's Z + 25.400)); every move passes over the jaws. Then Z0 back (G10 L2 P1 Z(the noted Z))."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CA00_riser_face (M6 T1; set 2650). It faces both tops {{process.riser_face_mm:in.3dot}} at one Z, in passes along X past both jaw sides, stepping from over the fixed jaw's top to past the moving jaw's face: both blocks edge to edge, wherever they stand along the jaws."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "riser face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.riser_face_mm}}", radial_woc_mm = "{{process.riser_face_woc_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "CA00 has ended with the spindle stopped (M5), T1 raised clear; confirm it has stopped. Open the vise and lift the blocks and parallels out. Break the faced top edges: file a {{process.riser_chamfer_mm:in.2dot}} × 45° chamfer along both 3 in edges of each top, so no bar sits on a burr."
feed = "hand"

[[setups.operations]]
instruction = "Mic each block's height at its four corners, .10 in in from the chamfers (the micrometer, to .0001)."
inspection = "Every reading {{process.riser_height_min_mm:in.3dot}}–{{process.riser_height_max_mm:in.3dot}}, all eight within .0005: CA00 faced both tops at one Z in one clamping, each block on both matched parallels, so they are one plane parallel to their bottoms. Spread over .0005, every reading over {{process.riser_reface_floor_mm:in.3dot}}: do the next op. Otherwise outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.riser_height_min_mm}}", "{{process.riser_height_max_mm}}"] }]

[[setups.operations]]
instruction = "Only if its spread failed (otherwise skip), once: stone the bottoms' burrs, set the blocks back on the parallels and clamp as above, touch off T1 on the higher top again (G10 L20 P1 Z0.051) and run CA00_riser_face again ({{process.riser_face_mm:in.3dot}} more). Break the edges again."
feed = "hand"
inspection = "Mic again as above: every reading {{process.riser_height_min_mm:in.3dot}}–{{process.riser_height_max_mm:in.3dot}}, all eight within .0005. Fails again: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.riser_height_min_mm}}", "{{process.riser_height_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "Foot ends and foot notches"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The riser (made in Setups 1 and 2, then kept): its two blocks end to end on the bed of the PM 6 in vise (jaws 6.247 long: the two 3 in blocks fit inside both jaw sides), TOP up, a sawn face of each against the fixed jaw, centred along the jaws, neither past a jaw side, never clamped: the jaws close on the bars above it. Four blanks of any numbers side by side across the jaws on the riser, in positions P1 (against the fixed jaw) to P4 (against the moving jaw). Each on its L face, its F face toward the fixed jaw, foot ends to the LEFT. Before closing the vise, hold a 1-2-3 block's 2 in face across the four foot ends and its 1 in face along the P4 bar, and push the ends against it so they are flush; then slide the four together until the foot ends stand {{process.end_protrusion_mm:in.2dot}} past the left jaw side (the calipers' depth rod). Tap each blank down onto the riser while closing the vise. The rest of each blank, about 25 in, hangs past the right jaw side."
datum = "Programs CA01_foot_end (end mill) and CA02_foot_notch (saw). G54: X0 the faced foot end, Y0 the fixed jaw's face, Z0 the bars' down face (on the riser). +X toward the jaws, +Y toward the fixed jaw."
diagram = { file = "diagrams/foot.svg", alt = "Four bars side by side across the jaws on the riser's two blocks, foot ends past the left jaw side; the end mill faces the ends, then the slitting saw, horizontal, cuts the notch across all four." }
# The saw arbor is now the shortest tool: its saw's lower face is at least
# the saw's own thickness below the nose (the shoulder's height below the
# nose is not on record: at most .90, the record's 1.4 less the cap).
envelope = { x_span_mm = ["{{process.saw_dia_mm}}", "{{process.foot_notch_depth_mm}}", 5.0], y_span_mm = ["{{process.saw_dia_mm}}", "{{process.load_width_mm}}", 4.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_max_mm}}", "{{cad.envelope_width_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_min_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = "{{process.saw_thickness_mm}}" }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.load_width_mm}}", along_jaws_mm = "{{cad.envelope_length_mm}}", part_height_mm = "{{cad.envelope_thickness_mm}}", parallel_height_mm = "{{process.riser_height_min_mm}}", overhang_mm = ["{{process.end_protrusion_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.envelope_length_mm}}"], clamp_mm = ["{{process.end_protrusion_mm}}", "{{process.foot_clamp_end_mm}}"], section_mm = { y = "{{process.bar_section_min_mm}}", z = "{{process.bar_section_min_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Every lot: brush the vise bed and the riser blocks clean; stand the two blocks end to end on the bed, TOP up, a sawn face of each against the fixed jaw, centred along the jaws. They stay there unclamped for every load of Setups 3 and 5; brush them before each load."
inspection = "A rule held flat against each jaw side touches neither block: the two 3 in blocks (6 in end to end) inside the 6.247 in jaws, none past a jaw side (beyond the bars' ends the saw arbor's cap passes lower than the riser's top)."
gauge_checks = "other"

[[setups.operations]]
instruction = "Every load, clamped as above, the seat sweep: spindle stopped, the DTI in the collet. Its tip on the P1 bar's top .20 in in from its foot end, preloaded to mid-range; zero the dial there."
feed = "hand"

[[setups.operations]]
instruction = "Jog Y only (X and Z stay) to the middle of the P2, P3 and P4 bars and write each reading in mm, + up, then back to P1: it must read 0 ±{{process.sweep_zero_return_mm:.3f}} mm, or the zero slipped: zero it there again and repeat the sweep. For each bar: d = its reading ÷ 25.4 − (its foot-end L-to-R reading − P1's)."
inspection = "Every d within ±{{process.seat_offset_max_mm:in.4dot}}: that bar's down face, where its notch is cut, stands within that of P1's, which the saw's Z0 is touched on, so its ledge stays inside {{cad.foot_notch_ledge_min_in:.3dot}}–{{cad.foot_notch_ledge_max_in:.3dot}} with the touch-off's own error. Over: open the vise, brush the riser and the bars, reseat, tap down while closing and sweep again. Over after a second reseat: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Home ($H) if not yet homed this session. G54 Y0 the fixed jaw's face; X0 the faced foot end, {{process.foot_skim_mm:in.3dot}} inside the shortest foot end: edge finder (900 rpm)."
instruction_detailed = "Home ($H) if not yet homed this session. Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face from the bars' side (−Y), G10 L20 P1 Y-2.540 (the finder's centre is its radius short of Y0). X: its tip .10 below the bars' top, on the foot end nearest the jaws, from the left: G10 L20 P1 X-3.048 (the finder's radius 2.540 plus the {{process.foot_skim_mm:in.3dot}} skim to its left)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the bars' down face, from the top face of the bar against the fixed jaw and its miked section. The end mill 2.00 in out of the collet, so the collet clears the jaw tops at the cut."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 2.00 in out of the collet, so the collet nose is above the jaw tops at the cut; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the top of the bar against the fixed jaw, inside the jaws: G10 L20 P1 Z(that bar's L-to-R reading × 25.4 + 0.051); for .2490, Z6.376."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CA01_foot_end in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "First load only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run CA01_foot_end, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CA01_foot_end (M6 T1, 1/2 in end mill; set 2650): face the four foot ends at X0 with the cutter's side, the full bar height in one pass along −Y (conventional: the ends on the cutter's left), {{process.foot_skim_mm:in.3dot}} off the shortest. It ends with T1 parked for the saw: up, left of the ends, over the P1 bar."
settings = "endmill-carbide-3fl-1-2-1018-cf"
inspection = "Every foot end cut clean across. A sawn patch left: do the next op."
gauge_checks = "other"
milling_cuts = [
  { name = "foot end", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = 6.45, radial_woc_mm = "{{process.foot_skim_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "Only if a sawn patch was left (otherwise skip): send $#, note the G54 line's X, G10 L2 P1 X(that X + 0.254) (X0 .010 farther in; the length is set from this face later) and run CA01_foot_end again."
feed = "hand"

[[setups.operations]]
instruction = "First load, and again whenever the cap's screw has been loosened: mic the slitting saw's thickness at its rim, just inside the teeth, at four places a quarter turn apart, to .0001. Write the largest on this sheet: t. First load only: also the calipers across the tips of two opposite teeth, at three places round the saw. Write the largest: D."
inspection = "t {{process.saw_swept_min_mm:in.4dot}}–{{process.saw_swept_max_mm:in.4dot}}: two passes of it make each notch, the second {{process.foot_notch_rise_mm:in.3dot}} higher for the foot notch's {{cad.foot_notch_width_min_in:.3dot}}–{{cad.foot_notch_width_max_in:.3dot}} width and {{process.top_notch_rise_mm:in.3dot}} higher for the top notch's {{cad.top_notch_width_min_in:.3dot}}–{{cad.top_notch_width_max_in:.3dot}}, the two kerfs overlapping (no fin between them). Outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.saw_swept_min_mm}}", "{{process.saw_swept_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "saw-arbor"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped (M5), the head where CA01_foot_end parked it: do not jog X or Y. Jog Z only, up, until the arbor can go up into the spindle with its saw clear above the bars. Take out the collet and end mill. Wipe the R8 stepped saw arbor's shank and the spindle's taper clean and mount the arbor (drawbar tight). Do not move the bars. Loads after the first: the saw is still clamped on it."
inspection = "Loads after the first: both witness lines on the saw (drawn below) unbroken. A line broken: the saw has turned on the arbor: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "First load, and whenever the screw has been loosened: wipe the arbor's shoulder, the saw's faces round its hole and the cap's face clean and dry (friction alone drives the saw). Saw on the pilot's 1 in step, up against the shoulder, teeth cutting with M3 (clockwise from above); cap under it; its M8 screw from below, the 5 mm hex bit on the torque wrench: {{process.saw_clamp_torque_nm:.0f}} N·m (15 ft·lb), spindle held as for the drawbar."
inspection = "No torque wrench covering 15 ft·lb with a 5 mm hex bit to hand, or the screw not torqued with it: stop: run no saw program; tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "First load only, before the spindle starts: lay the combination square's blade on edge across the cap's lower face, over the screw's head. If the head stands past the face, measure how far: the calipers' beam end on the head, the depth rod run up to the cap's face."
inspection = "The head flush with the cap's face or under it, or standing {{process.saw_screw_head_stand_max_mm:in.3dot}} or less: CA02, CA04 and their air proofs carry the cap and that much head clear over the bars. More: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.saw_screw_head_stand_max_mm}}"] }]

[[setups.operations]]
instruction = "First load, and whenever the screw has been loosened: with a marker draw two witness lines: one from the arbor's body across the shoulder onto the saw's upper face, one from the cap's rim onto the saw's lower face. A line that breaks later shows the saw has turned on the arbor."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Every load (the taper never seats the arbor quite the same twice): the lever indicator on its magnetic base on the vise, its tip up against the saw's lower face 1/8 in in from the teeth. Turn the spindle one turn by hand: the needle's total swing, in mm, is A. Wipe off any old LOW mark; mark LOW on the tooth that is over the tip where that face stands lowest."
inspection = "A ≤ ({{process.saw_swept_max_mm:in.4dot}} − t) × {{process.saw_axial_reading_per_in_mm:.1f}} mm (t .0640: {{process.saw_axial_nominal_mm:.3f}} mm): the saw's wobble then keeps both notches' widths in their bands. Over: take the arbor out, wipe its shank and the taper, mount it and read again. Still over: loosen the screw, wipe, turn the saw a quarter turn on the pilot, clamp to {{process.saw_clamp_torque_nm:.0f}} N·m, draw new witness lines and read again, then the tips' swing. Over after two such tries: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "dial-indicator"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "First load, and whenever the screw has been loosened: the .001 in dial indicator on its magnetic base, its plunger square on the tips of the teeth. Turn the spindle one turn backward by hand (counter-clockwise seen from above, so no tooth catches the plunger). The needle drops into every gullet: read its peaks, on the tips, only. R = the highest peak less the lowest."
inspection = "R + (D − {{process.saw_dia_mm:in.3dot}}) from −{{process.foot_saw_radial_tir_max_mm:in.3dot}} to {{process.foot_saw_radial_tir_max_mm:in.3dot}}: the files are posted for a {{process.saw_dia_mm:in.3dot}} saw, and the deepest tooth cuts the floor half that sum deeper, inside both notches' depth bands. Over: re-seat the saw as for A and read both again. Over after two tries, or under: stop and tell the owner D and R."
gauge_checks = "other"

[[setups.operations]]
instruction = "Only if the mill had to be homed ($H) since CA01_foot_end parked T1 (a controller reset, an alarm, a stall or an E-stop): from the homed Z, MDI G0 X-{{process.saw_touch_x_mm:.3f}} Y{{process.saw_touch_y_mm:.3f}} (the station, X and Y only), then the touch-off below, Z only."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again, from the saw's lower face: spindle stopped, turn the saw by hand until the tooth marked LOW is over the end of the P1 bar, the rim 3 mm in over it. Jog Z only, down in CNCjs ({{process.saw_touch_step_mm:.2f}} mm steps near the leaf), until a .002 leaf just drags under the saw on that bar's top; G10 L20 P1 Z(that bar's L-to-R reading × 25.4 + 0.051). CA02 loads no tool."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CA02_foot_notch in air, Z0 raised {{process.saw_proof_raise_mm:in.3f}} in (send $#, then G10 L2 P1 Z(the G54 line's Z + {{process.saw_proof_raise_mm:.3f}})); it rises straight to its clear height before any X or Y move, and the saw, the arbor's body, the cap and the screw clear the jaws and the four bars' ends; Cycle Start again at its M0 stop. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Run CA02_foot_notch (the saw; set 100): first one light pass along −Y across the four foot ends, {{process.foot_notch_light_mm:in.3dot}} deep, the saw's lower face at the ledge (conventional: clockwise left of the ends, each tooth cuts from the floor outward; fed the other way the saw would climb and turn on the arbor). Cutting oil on the saw. The file then stops (M0): spindle off, the saw raised clear beyond the moving jaw's side."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "foot notch light", kind = "side", phase = "rough", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.foot_notch_light_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "At CA02's M0 stop, the spindle stopped: look at both witness lines on the saw."
inspection = "Both unbroken: Cycle Start (the file restarts the spindle; 100 still set). A line broken: the saw has slipped on the arbor: do not restart; stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Same file, after Cycle Start: two more passes along −Y, {{process.foot_notch_depth_mm:in.3dot}} deep: the first with the saw's lower face at the ledge, {{cad.foot_notch_ledge_in:.3dot}} above the L face, the second {{process.foot_notch_rise_mm:in.3dot}} higher, widening the notch to {{process.foot_notch_width_mm:in.4dot}}."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "foot notch", kind = "side", phase = "finish", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.foot_notch_depth_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "Every load (each has its own saw Z0 touch-off), still clamped: CA02 has ended with the spindle stopped (M5) and the saw raised clear beyond the moving jaw's side; confirm it has stopped. Then check the foot notch's width and ledge on all four bars (Z0 is touched on the P1 bar; the P2–P4 bars hold their ledges through the seat sweep, so each is checked), and the saw's witness lines."
inspection = "Width {{cad.foot_notch_width_min_in:.3dot}}–{{cad.foot_notch_width_max_in:.3dot}}: the {{cad.foot_notch_width_min_in:.3dot}} gauge block enters across the notch, the {{cad.foot_notch_width_max_in:.3dot}} does not. Ledge (the L-side cheek) {{cad.foot_notch_ledge_min_in:.3dot}}–{{cad.foot_notch_ledge_max_in:.3dot}}: the calipers' outside jaw tips across it. Witness lines unbroken. Any outside, or a line broken (the saw slipped in the cut): stop and tell the owner."
gauge_checks = [
  { gauge = "gauge-blocks-mitutoyo", band_mm = "{{cad.foot_notch_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.foot_notch_ledge_band_mm}}" },
]

[[setups.operations]]
instruction = "First load only, still clamped: the foot notch's depth on each bar (CA02's X travel from the X0 CA01 faced, the same for every load)."
inspection = "Depth {{cad.foot_notch_depth_min_in:.3dot}}–{{cad.foot_notch_depth_max_in:.3dot}} from the foot end: the calipers' depth rod. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.foot_notch_depth_band_mm}}" }]

[[setups.operations]]
instruction = "After every load, the fifth included: spindle stopped (M5). Jog Z only, up (X and Y untouched), until the clamped saw clears the bars and the arbor can drop out of the spindle. Lift the arbor out with the saw still clamped on it (the screw untouched); back to the collet."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp the load, the riser left in place. Clamp the next four and repeat this setup from the seat sweep, skipping the riser's and the first-load ops: 5 loads for the 20 bars. The X0 each load's foot notch is cut from is the end CA01 faced in that same clamping."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Compare each bar's length with bar 1"
machine = "Bench / surface plate"
indexing = "none"
diagram = { file = "diagrams/measure.svg", alt = "Bar 1 and another bar side by side on the surface plate, their foot ends against a 1-2-3 block as the stop; at the top ends the calipers' beam end on the end that stands out, the depth rod run out to the other end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "rule"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Rule bar 1 from its faced foot end to its sawn top end, a 1-2-3 block square against the foot end, to the nearest 1/64 in. Write it on this sheet as a decimal to .001 (for example 31 57/64 = 31.891): L1. Bar 1 is the length every other bar is compared with."
inspection = "L1 {{process.measured_length_min_mm:in.3f}}–{{process.measured_length_max_mm:in.3f}}: bar 1's own x (L1 − {{cad.top_end_length_in:.2f}}) then lies in the 0 to {{process.top_excess_max_mm:in.3dot}} every bar's x is held to below, the most CA03 is written to face off. Over: saw or file its top end back and rule it again. Under: it cannot reach the length; scrap it and the next bar becomes bar 1."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.measured_length_min_mm}}", "{{process.measured_length_max_mm}}"] }]

[[setups.operations]]
instruction = "The stop: stand a 1-2-3 block on the surface plate near its left edge, its 2 × 3 in face toward the right, and a V-block against its left side to back it. Push bars against it gently: the stop must not move between two readings."
feed = "hand"

[[setups.operations]]
instruction = "Each other bar in turn: lay it and bar 1 side by side on the plate, touching, L faces down, and push both foot ends against the stop. Where the bars run past the plate, rest both top ends together on one support level with the plate."
feed = "hand"

[[setups.operations]]
instruction = "At the top ends: rest the end of the calipers' beam on the end that stands out, the beam along the bars, and run the depth rod out until it touches the other bar's end; read the step to .001. Write e on the bar, signed: + when this bar's top end stands out past bar 1's, − when bar 1's stands out (a .012 step with bar 1 the longer: e = −.012). Bar 1's e is 0."
instruction_detailed = "Calipers zeroed closed. Press both foot ends to the stop, rest the end of the beam on the top end that stands out and run the depth rod to the other top end: the step, to .001; read it twice (differ by over .001: push both to the stop again). Write e on the bar, signed: + when this bar stands out past bar 1, − when bar 1 does (a .012 step, bar 1 longer: e = −.012). Bar 1's e is 0."
inspection = "Each bar's x = e + (L1 − {{cad.top_end_length_in:.2f}}) from 0 to {{process.top_excess_max_mm:in.3dot}}: it reaches the length, and CA03 faces no more off. Over: saw or file its top end back and compare it again. Under 0: the bar is short; scrap it."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.top_excess_max_mm}}"] }]

[[setups.operations]]
instruction = "Write each bar's x near its top end and sort the bars into 5 loads of four of near equal x."
feed = "hand"

[[setups]]
machine_kind = "other"
