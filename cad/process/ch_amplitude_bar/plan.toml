]

[[setups.operations]]
instruction = "Still clamped: CA03 has ended with the spindle stopped (M5) and T1 parked up, right of the ends; confirm it has stopped. Rule each bar in place from its foot end (the 1-2-3 block square across the four) to its top end, to the nearest 1/64 in."
inspection = "Each bar {{process.length_rule_min_mm:in.3f}}–{{process.length_rule_max_mm:in.3f}} ({{cad.top_end_length_in:.2f}} ± 1/32) is accepted: the length is accepted to ±1/32 only. This does NOT prove the printed ±.01 ({{cad.top_end_length_min_in:.2f}}–{{cad.top_end_length_max_in:.2f}}): the rule cannot read it (owner ruling 2026-11-23, tool audit Q3: \"absolute length accepted to +/-1/32. Does not prove the printed +/-.01.\"). Over: the next op. Under: stop and tell the owner."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.length_rule_min_mm}}", "{{process.length_rule_max_mm}}"] }]

[[setups.operations]]
instruction = "Only if the four read over {{process.length_rule_max_mm:in.3f}} (otherwise skip): the X0 was set from a wrong x. Check the x written on the bar it was picked on against its e and L1. Send $#, note the G54 line's X; G10 L2 P1 X(that X − (the right x − the x entered) × 25.4); run CA03_top_end again."
feed = "hand"
inspection = "Rule the four again: each {{process.length_rule_min_mm:in.3f}}–{{process.length_rule_max_mm:in.3f}} is accepted (±1/32 only, as above). Still over, or no wrong x found: stop and tell the owner."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.length_rule_min_mm}}", "{{process.length_rule_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "saw-arbor"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped (M5), the head where CA03_top_end parked it: do not jog X or Y. Jog Z only, up, until the arbor can go up into the spindle with its saw clear above the bars. Take out the collet and end mill. Wipe the saw arbor's shank and the spindle's taper clean and mount the arbor (drawbar tight), the saw still clamped on it as checked in Setup 3, teeth cutting with M3. Do not move the bars."
inspection = "Both witness lines unbroken and the screw untouched since Setup 3: its t, its D and its tips' swing R stand for the top notch too (Setup 3's t limits are set for both notches' widths, and the top notch's {{cad.top_notch_depth_min_in:.2f}}–{{cad.top_notch_depth_max_in:.2f}} depth allows at least the foot's swing). Otherwise: do Setup 3's first-load saw ops again here, from the miking, to the same limits."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Every load (the arbor is seated afresh): read the saw's swing A again as in Setup 3, the lever indicator's tip up against the saw's lower face 1/8 in in from the teeth, one turn by hand. Wipe off the old LOW mark; mark LOW on the tooth that is over the tip where that face stands lowest."
inspection = "A ≤ ({{process.saw_swept_max_mm:in.4dot}} − t) × {{process.saw_axial_reading_per_in_mm:.1f}} mm, Setup 3's limit (t .0640: {{process.saw_axial_nominal_mm:.3f}} mm). Over: take the arbor out, wipe its shank and the taper, mount it and read again. Still over: loosen the screw, wipe, turn the saw a quarter turn on the pilot, clamp to {{process.saw_clamp_torque_nm:.0f}} N·m, draw new witness lines and read again, then the tips' swing as in Setup 3. Over after two such tries: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Only if the mill had to be homed ($H) since CA03_top_end parked T1 (a controller reset, an alarm, a stall or an E-stop): from the homed Z, MDI G0 X{{process.saw_touch_x_mm:.3f}} Y{{process.saw_touch_y_mm:.3f}} (the station, X and Y only), then the touch-off below, Z only."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again, from the saw's lower face: spindle stopped, turn the saw by hand until the tooth marked LOW is over the end of the P1 bar, the rim 3 mm in over it. Jog Z only, down in CNCjs ({{process.saw_touch_step_mm:.2f}} mm steps near the leaf), until a .002 leaf just drags under the saw on that bar's top; G10 L20 P1 Z(that bar's L-to-R reading × 25.4 + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CA04_top_notch in air, Z0 raised {{process.saw_proof_raise_mm:in.3f}} in (send $#, then G10 L2 P1 Z(the G54 line's Z + {{process.saw_proof_raise_mm:.3f}})); it rises straight to its clear height before any X or Y move, and the saw, the arbor's body, the cap and the screw clear the jaws and the four bars' ends; Cycle Start again at its M0 stop. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Run CA04_top_notch (the saw; set 100): first one light pass along +Y across the four top ends, {{process.top_notch_light_mm:in.3dot}} into the ends, the saw's lower face at the ledge (conventional: clockwise right of the ends, each tooth cuts from the floor outward; fed the other way the saw would climb and turn on the arbor). Cutting oil on the saw. The file then stops (M0): spindle off, the saw raised clear beyond the fixed jaw's side."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "top notch light", kind = "side", phase = "rough", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.top_notch_light_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "At CA04's M0 stop, the spindle stopped: look at both witness lines on the saw."
inspection = "Both unbroken: Cycle Start (the file restarts the spindle; 100 still set). A line broken: the saw has slipped on the arbor: do not restart; stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Same file, after Cycle Start: at each of two levels, passes along +Y stepping {{process.top_notch_step_mm:in.3dot}} deeper into the ends each time to {{process.top_notch_depth_mm:in.3dot}}: the first level with the saw's lower face at the ledge, {{cad.top_notch_ledge_in:.3dot}} above the R face, the second {{process.top_notch_rise_mm:in.4dot}} higher, widening the notch to {{process.top_notch_width_mm:in.4dot}}."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "top notch rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.top_notch_step_mm}}", stations_mm = 0 },
  { name = "top notch", kind = "side", phase = "finish", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.top_notch_step_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "Every load (each has its own saw Z0 touch-off), still clamped: CA04 has ended with the spindle stopped (M5) and the saw raised clear beyond the fixed jaw's side; confirm it has stopped. Then check the top notch's width and ledge on all four bars (Z0 is touched on the P1 bar; the P2–P4 bars hold their ledges through the seat sweep, so each is checked), and the saw's witness lines."
inspection = "Width {{cad.top_notch_width_min_in:.3dot}}–{{cad.top_notch_width_max_in:.3dot}}: the {{cad.top_notch_width_min_in:.3dot}} gauge block enters across the notch, the {{cad.top_notch_width_max_in:.3dot}} does not. Ledge (the R-side cheek) {{cad.top_notch_ledge_min_in:.3dot}}–{{cad.top_notch_ledge_max_in:.3dot}}: the calipers' outside jaw tips across it. Witness lines unbroken. Any outside, or a line broken (the saw slipped in the cut): stop and tell the owner."
gauge_checks = [
  { gauge = "gauge-blocks-mitutoyo", band_mm = "{{cad.top_notch_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.top_notch_ledge_band_mm}}" },
]

[[setups.operations]]
instruction = "First load only, still clamped: the top notch's depth on each bar (CA04's X travel from the X0 CA03 faced to, the same for every load)."
inspection = "Depth {{cad.top_notch_depth_min_in:.2f}}–{{cad.top_notch_depth_max_in:.2f}} from the top end: the calipers' depth rod. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.top_notch_depth_band_mm}}" }]

[[setups.operations]]
instruction = "Jog Z only, up (X and Y untouched), until the clamped saw clears the bars and the arbor can drop out of the spindle. Lift it out, the saw still clamped on it (the screw untouched), and swap to the drill chuck. Set each CA05 tool out of the chuck by at least: #1 centre drill {{process.spot_projection_mm:in.2dot}}, #49 {{process.drill_projection_mm:in.2f}}, reamer {{process.ream_projection_mm:in.2f}} (the calipers' depth rod), so the chuck's nose stays above the jaw tops at its deepest cut."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again with T3: console M6 T3 (the tool setter measures it; T4 and T5 are measured against it at their M6), spindle stopped, its tip on a .002 leaf on the P1 bar's top inside the jaws, G10 L20 P1 Z(that bar's top-end L-to-R reading × 25.4 + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CA05_pin_hole in air, Z0 raised 1.000 in, through each M6. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CA05_pin_hole (M6 T3, #1 centre drill {{process.spot_projection_mm:in.2dot}} out of the chuck; set 2800): spot the four pin holes Ø{{process.spot_dia_mm:in.3dot}}, {{cad.top_pin_hole_drop_in:.2f}} in from the top ends, each {{cad.top_pin_hole_location_from_back_in:.3dot}} from its bar's B face."
rpm = 2800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = -6.35 },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-49"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: the file has stopped the spindle (M5) and holds at the tool change, the tool raised clear. Change to the #49 {{process.drill_projection_mm:in.2f}} out of the chuck, set 2800, Cycle Start: the M6 measures it on the tool setter against T3's Z0 (do not touch off again). It drills both cheeks of each bar, pecks of {{process.peck_mm:in.3dot}}, full retract, full diameter {{process.drill_past_mm:in.3dot}} past R. Cutting oil."
rpm = 2800
feed = "{{process.drill_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{cad.envelope_thickness_mm}}"
peck = { step_mm = 1.27, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 1.8542, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = -6.35 },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-0775"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.top_pin_hole_dia_band_mm}}" }
instruction = "Same file, M6 T5: stopped and held as at M6 T4; change to the .0775 reamer (to buy) {{process.ream_projection_mm:in.2f}} out of the chuck, set 2000, Cycle Start: the M6 measures it on the tool setter against T3's Z0 (do not touch off again). It reams each hole through, in and out at feed, its full diameter {{process.ream_past_mm:in.3dot}} past the R face. Cutting oil."
rpm = 2000
feed = "{{process.ream_feed_per_min_mm:in.1f}} in/min, in and out"
milling_cuts = [
  { name = "pin ream", kind = "drill", phase = "finish", cutter_dia_mm = 1.9685, flutes = 4, rpm = 2000, feed_mm_min = "{{process.ream_feed_per_min_mm}}", stations_mm = -6.35 },
]

[[setups.operations]]
instruction = "Every load: CA05 has ended with the spindle stopped (M5), the reamer 5 mm over the last hole. Confirm it has stopped, then jog Z up and the head off the bars before any hands-in check."
feed = "hand"

[[setups.operations]]
instruction = "Every load, before the next: try an MHA-SH-VN-58 pin by hand in each hole, chamfered end first, and take it out again."
inspection = "The pin does not enter past its chamfer by hand (sheet note 1: press fit; the pin is pressed in only at assembly, MHA-CH-00). It enters: try the set's .079 pin in that hole. The .079 does not enter: do not scrap the bar; write SLIP on its tag (MHA-CH-00 bonds its pin). The .079 enters: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Still clamped, first load only and after any X0 remedy or change to CA05: each hole's drop, the set's .077 pin pushed into it (.0005-.0011 loose; the #49 shank is .004 loose and would shift the reading)."
inspection = "Drop {{cad.top_pin_hole_drop_min_in:.2f}}–{{cad.top_pin_hole_drop_max_in:.2f}} from the top end: the calipers from the end over the .077 pin, less half its .077. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.top_pin_hole_drop_band_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp the load. Every load: the P4 bar's hole place from its B face (CA05 places the holes on a {{process.bar_pitch_mm:in.4dot}} pitch from Y0, so the P4 hole carries the P1–P3 bars' widths, within .003 of them). First load (write its G54 Y, from $#, on this sheet), and any later load whose G54 Y differs from it by more than 0.05 mm (.002): every bar's. The set's .077 pin in the hole."
inspection = "From B {{cad.top_pin_hole_location_from_back_min_in:.3dot}}–{{cad.top_pin_hole_location_from_back_max_in:.3dot}}: the calipers from the B face over the .077 pin, less half its .077. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.top_pin_hole_location_from_back_band_mm}}" },
]

[[setups.operations]]
instruction = "Back to the collet (edge finder, then T1), clamp the next four on the riser and repeat this setup from the seat sweep, skipping the first-load-only ops (the X pick-up uses that load's own largest-x bar and its x): 5 loads."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect, buff and oil"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "Both ends of the finished bar: the foot notch with its ledge from the L face, the top notch with its ledge from the R face and the pin hole through both cheeks." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Inspect first, the edges still sharp."
inspection = "Pin hole: tried with the MHA-SH-VN-58 pin in Setup 5 (every load); a bar tagged SLIP goes on as it is (MHA-CH-00 bonds its pin). Foot notch's floor finish: Ra {{cad.foot_notch_finish_ra_uin:d}} µin, a smooth saw cut with no torn marks; torn: tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr the notch edges, the pin holes' mouths and the ends: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file and a scraper; no burr may stand inside a notch or a hole. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "The bars equal: on the surface plate against the Setup 4 stop, compare every finished bar with bar 1 as Setup 4 does (side by side, foot ends to the stop, the calipers' depth rod across the top ends' step, to .001)."
inspection = "Every step {{process.compare_spread_max_mm:in.3dot}} or less: the 20 bars are equal by comparison (the method's own error; it says nothing about the printed ±.01). Over: set that bar aside and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.compare_spread_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Buff the four cold-finished faces bright along their length with the 220-grit abrasive roll, wipe, then oil all over with ISO VG 32 light machine oil. No plating."
feed = "hand"
