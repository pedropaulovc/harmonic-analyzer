inspection = "Every d within ±{{process.seat_offset_max_mm:in.4dot}}: that bar's down face, where its notch is cut, stands within that of P1's, which the saw's Z0 is touched on, so its ledge stays inside {{cad.top_notch_ledge_min_in:.3dot}}–{{cad.top_notch_ledge_max_in:.3dot}} with the touch-off's own error. Over: open the vise, brush the riser and the bars, reseat, tap down while closing and sweep again. Over after a second reseat: stop and tell the owner."
