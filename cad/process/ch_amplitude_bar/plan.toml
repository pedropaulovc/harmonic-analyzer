# Amplitude bar MHA-CH-01 (qty 20), routed for the CNC mill (owner ruling
# 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). Each bar is
# the 1/4 in square 1018 CF as bought: only its two ends are cut. Per the part
# registry's process text (cad/config/parts/ch-amplitude-bar.yaml), the bought
# square bows about .013 over the length, so every blank is straightened or
# selected to the MHA-CH-00 bow check before it is machined.
#
# Route: saw 20 blanks, two from each 72 in bar; mic, bow-check and
# straighten them; the riser, once (owner ruling 2026-11-21, "riser": a
# plain riser block so four bars sit in the vise): two blocks sawn off the
# 1 x 3 in 6061 bar, then Setup 2 faces them as a pair in the vise (CA00);
# Setup 3, four bars at a time side by side on the riser, with their foot
# ends .75 in past the left jaw side: face the foot ends (CA01), then the
# slitting saw cuts the foot notches (CA02); the bench (Setup 4): each bar's
# length; Setup 5, four bars rolled
# over (L face up) with their top ends .75 in past the right jaw side: face
# them to the length (CA03), the slitting saw cuts the top notches (CA04),
# then spot, drill and ream the pin holes through both cheeks (CA05);
# deburr, inspect, buff and oil. 20 bars are 5 loads.
#
# Notches: ROOTS R.015 MAX rules out an end mill along the bar's depth (its
# root would be a full R.0625), and an end mill along the cheeks cannot reach
# between them. The owned 2-3/4 x .064 HSS slitting saw (McMaster 3062A21,
# 1 in hole) runs horizontally on the vertical spindle: its periphery cuts
# the root straight across the bar's depth with the saw's sharp corners, its
# faces cut the notch walls, two passes per width (kerf: the .064 saw twice,
# the second level .043 above the first for the foot's .104-.110, .062 for
# the top's .124-.131: half its least width, so the two kerfs overlap at
# every saw Setup 3 accepts and leave no fin).
#
# The saw's arbor is the owned R8 stepped saw arbor (cad/config/shop-
# equipment/ tools.saw-arbor-r8-stepped, owner 2026-11-24; shop key
# saw-arbor-r8-stepped): drawn up in the spindle, the saw on the 1 in step of
# its spring pilot, seated against the body's shoulder ABOVE it (the spindle
# side) and clamped by the cap and its M8 flat-head screw BELOW it. Body and
# cap are both 1.25 across, so the saw cuts at most
# saw_depth_past_arbor_max_mm (.711) past them: (2.75 - 1.25)/2 less
# saw_arbor_clear_mm; the top notch's deepest .56 leaves .15 more. At every
# cut the bars' ends stand beside the saw's rim, the jaws .75 behind the
# ends; the body passes above the saw and the cap and screw below it, both
# beyond the ends (cap to end .20 at the top notch's last step, .67 at the
# foot's), never over the jaws nor under the bars. NOT MEASURED, each a
# bounded assumption a STOP measures before the spindle starts: the screw
# head's stand past the cap's face (saw_screw_head_stand_max_mm) and the
# saw's runout (the saw_swept_* and *_saw_radial_tir_max_mm limits). The
# drive is friction alone (not keyed): the screw at 20 N·m, witness lines,
# a light first pass and a stop to look at them.
#
# FLAGGED: the .0775 reamer is to buy (tools.reamer-0775). Owner ruling
# 2026-11-24, fit audit question 3: the hole prints the reamer's size with
# no band and the MHA-SH-VN-58 pin itself is its gauge (it does not enter by
# hand); no special Class ZZ pins. A hole the pin enters by hand is not a
# scrapped bar: tagged SLIP, MHA-CH-00 bonds its pin, if the .079 pin of the
# .061-.500 set (gauges.pin-gauges, on order) does not enter it (the largest
# hole bonded: rule 4's single limit read with one pin of the set,
# sh_vn_pivot_pin_spec.BOND_HOLE_MAX). The set's .077 pin
# stands in the hole for the drop and place readings.
#
# Length: owner ruling 2026-11-23 (tool audit Q3), verbatim: "B. Buy only the
# Insize rule; make the 20 bars equal by comparison (stop on the surface
# plate, ends compared with calipers to .001); absolute length accepted to
# +/-1/32. Does not prove the printed +/-.01." Neither end of a 31.8 in bar
# reaches the other within the mill's 23 in X travel, and the calipers stop at
# 6 in. The one long gauge is the 48 in steel rule to buy (tools.steel-rule-48,
# the Insize 7110-1200: finest graduation 1/64 in, rated ±.031 over its
# length). Setup 4 rules bar 1 once (L1, to 1/64) and compares every other
# bar with it: the two side by side on the surface plate, foot ends against a
# 1-2-3 block standing on the plate as the stop, the step between their top
# ends read with the calipers' depth rod to .001 (e, + when the bar is the
# longer). A bar's excess over the length to face is x = e + (L1 - 31.82);
# Setup 5 sets each load's X0 on the top end standing farthest right, less
# that bar's x, after checking the four foot ends flush to .001 with the
# same depth rod. Every bar is then faced to bar 1's length less (L1 -
# 31.82): equal to bar 1 within the method's own error, two .001 caliper
# readings and the edge finder's pick-up, which Setup 6 accepts as .003
# (compare_spread_max_mm) by comparing every finished bar with bar 1 again.
# The absolute length is accepted only to ±1/32 (31.79-31.85, the rule,
# Setup 5): the printed ±.01 (31.81-31.83) is NOT proven by this method.
#
# Workholding: the vise on a riser (owner ruling 2026-11-21, "riser": make a
# plain riser block so 4 bars sit in the vise per load). The riser is not a
# drawn tooling part, only squared faces; its sizes are the riser_*
# parameters below. Two blocks, each a .92-.96 in slice sawn across the
# 1 x 3 in 6061-T6511 bar (stock.6061-flat-1x3, 12 in on hand, freed by the
# oblique jig's deletion): 3 in long (the bar's width, as bought), 1 in tall
# (the bar's thickness), .92-.96 wide (the saw cut). A new pair is faced by
# CA00_riser_face in Setup 2: each block standing across the jaws on both
# 1 in parallels, the two side by side along the jaws, their tops over the
# jaw tops: one Z, one clamping, edge to
# edge wherever they stand along the jaws, so their tops are one plane at one
# height (miked: all eight corners within .0005); every faced top edge is
# then broken with a .03 x 45° chamfer. In use they stand end to end
# on the vise bed (3 + 3 in under the 6.247 in jaws, neither past a jaw
# side), their sawn faces against the fixed jaw, not clamped: the jaws grip
# the four bars, whose load (.992-1.000 wide) is wider than the riser, so
# the moving jaw meets bar 4 and never the riser. Bar 1 seats on all but the
# .03 chamfer; bar 4, the farthest, on at least half its width (cam.py
# checks both, and that at the riser's least height every holder clears the
# jaw tops). The bars are tapped down onto the riser while the vise closes;
# every load, the seat sweep (the DTI across the four bars' tops by the
# notch, less each bar's miked section) holds each bar's down face within
# .0005 of P1's, the share of the ledge band the budget below gives it. The
# jaws' grip and that seat keep them from lifting (the cuts are a
# .020 side skim, horizontal saw passes and #49/reamer thrust down).
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), as the column clamp plan does.
# Every Z zero is a bar's top face, touched with the tool on a .002 feeler
# leaf less that bar's miked section: the four bars sit on the riser's one
# faced plane, so their down faces, the faces the notch ledges are measured
# from, share one plane.
#
# Holders: the riser lifts the bars so that every holder's nose (collet,
# drill chuck) stays above the jaw tops at its deepest cut, each tool set out
# of its holder by at least its stated projection (cam.py checks each
# against the jaw tops and the tool's length less a 1/2 in grip). The saw
# arbor never stands over the jaws: its body, cap and screw stay beyond the
# bars' ends, and every move of them after the saw's first rise misses the
# bars, the riser and the jaws (cam.py checks it).
#
# NC (cam:ch_amplitude_bar, cad/process/ch_amplitude_bar/cam.py):
# CA00_riser_face (a new riser only), CA01_foot_end, CA02_foot_notch,
# CA03_top_end, CA04_top_notch, CA05_pin_hole.
# Program names, the [parameters] and the milling_cuts names are a contract
# with that recipe. Tool numbers are the places in the tools list among the
# mill's tools: T1 1/2 in end mill, T2 slitting saw, T3 #1 centre drill, T4
# #49 drill, T5 .0775 reamer.
title = "Amplitude bar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/4 in square (drawing: {{cad.material_spec}})"
stock = "{{process.blank_width_in:fraction}} in square bar, 72 in lengths; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks, two per length. The riser (made once, kept): two {{process.riser_width_min_mm:in.2dot}}–{{process.riser_width_max_mm:in.2dot}} in slices sawn across the 1 × 3 in 6061-T6511 bar."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). The bar's section is the stock's, {{cad.front_face_section_min_in:.3dot}}–{{cad.front_face_section_max_in:.3dot}} square, never cut. Finished {{cad.top_end_length_min_in:.2f}}–{{cad.top_end_length_max_in:.2f}} long, foot end to top end. Faces: the drawing names none; this traveler names them L, F, R and B and marks them on each blank in Setup 1 (Op 20). L carries the foot notch's ledge (Detail A, .073), R the top notch's ledge (Detail B, .063), and B is the face the pin hole is located from (View C, .125). Keep the marks readable. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once a session, not at every setup; each mill setup touches off its own G54. A Reset after a Feed Hold keeps G54: no homing, no new zero. After any other controller reset (it restarted by itself in a pass once, and lost home: logbook 2026-11-06), an alarm, a stall or an E-stop: home and touch off again before Cycle Start. Every file is proved in air on the first load. The bars hang about 25 in past the vise: before every X move, check nothing stands in their sweep beside the table."
shop = "../shop"
stock_refs = ["1018-square-1-4", "6061-flat-1x3"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_amplitude_bar/features.toml"
adapter = "flat_bar"
part = "ch-amplitude-bar"

[parameters]
quantity = 20
# The adapter's axes: the bar's length along model Y, its thickness (the
# notch walls' spacing direction) along model X.
blank_length_axis = 1
blank_thickness_axis = 0
# The blank: the 1/4 in square bar (stock.1018-square-1-4, eleven 72 in
# lengths on hand), sawn 31.88-31.94 long: .02 for the foot-end skim and
# .04-.10 faced off the top end to the length. Two per length: 2 × 31.94 +
# the .125 kerf leaves about 8 in.
blank_length_in = 31.88
blank_length_max_in = 31.94
blank_length_min_mm = 809.752
blank_length_max_mm = 811.276
blank_width_in = 0.25
blank_thickness_in = 0.25
kerf_in = 0.125
# Four bars per load on the riser (owner ruling 2026-11-21, "riser"): bar 1
# against the fixed jaw, bar 4 against the moving jaw; 20 bars are 5 loads.
# Each bar's place across the jaws is taken at the stock band's middle,
# .249 (cad front_face_section), so bar 4's pin hole is at most 3 × .001
# off its back face (Setup 5 checks bar 4's every load).
bars_per_load = 4
bar_pitch_mm = 6.3246
# The load across the jaws: bars_per_load × bar_pitch_mm (cam.py checks it).
load_width_mm = 25.2984
# The riser (see the header): two blocks, each riser_length_min_mm to
# riser_length_max_mm long (the 1 x 3 in bar's 3 in width, as bought: its
# tolerance is not on record, so Setup 1 calipers it to 2.97-3.03), sawn
# riser_width_min_mm to riser_width_max_mm wide (.92-.96: under the
# narrowest load, 4 × .248 = .992, so the moving jaw grips bar 4; the last
# bar seated at least half its width), every faced top edge filed
# riser_chamfer_mm (.03) × 45°. cam.py checks the widths, the chamfer and
# the length against the load and the jaws, and the holders against the jaw
# tops at the least height.
riser_length_min_mm = 75.438
riser_length_max_mm = 76.962
riser_width_min_mm = 23.368
riser_width_max_mm = 24.384
riser_chamfer_mm = 0.762
# Heights: the 1 in bar as miked in Setup 1 (.975-1.020; its tolerance is
# not on record), less one riser_face_mm (.005) CA00 pass: .970-1.015
# (cam.py checks both). A reface (one more pass) only for a block over
# riser_reface_floor_mm (.975), so it never goes under the least height.
# Setup 1 accepts a pair only with all eight corners within
# riser_blank_spread_max_mm (.003): CA00's pass, touched off on the higher
# top, then still takes at least riser_face_mm less that (.002) off the
# lowest corner (cam.py checks the spread leaves at least .001 to cut).
riser_blank_height_min_mm = 24.765
riser_blank_height_max_mm = 25.908
riser_blank_spread_max_mm = 0.0762
riser_face_mm = 0.127
riser_height_min_mm = 24.638
riser_height_max_mm = 25.781
riser_reface_floor_mm = 24.765
# Setup 2 faces the new pair on the 1 in pair of the parallel set
# (fixtures.parallels-lms-6745), one against each jaw: each block stands
# across the jaws, its 3 in length gripped on the bar's as-bought edges and
# resting on both parallels; the two blocks side by side along the jaws,
# centred (riser_pair_width_max_mm: the two widest side by side;
# riser_face_overhang_mm: the pair's inset from the left jaw side, as the
# vise hold states it; cam.py checks both). Their tops stand over the jaw tops,
# the jaws grip their lower .77 in (cam.py checks both), and the end mill
# steps across by riser_face_woc_mm (its radius).
riser_parallel_height_mm = 25.4
riser_pair_width_max_mm = 48.768
riser_face_overhang_mm = -54.9529
riser_face_woc_mm = 6.35
# The P2-P4 ledge budget (cam.py checks it against each ledge band's
# ±.002, ledge_margin_min_mm to spare). Each P2-P4 ledge is cut from the
# P1 bar's saw Z0 and is off by:
# - saw_touch_error_mm (.0006): the saw lowered in saw_touch_step_mm
#   (0.01 mm, .0004) steps to the first drag of the .002 leaf, the leaf's
#   ±.0001 and P1's miked section's ±.0001;
# - seat_offset_max_mm (.0005): the seat sweep's acceptance of the bar's
#   down face against P1's where the notch is cut (the DTI on each bar's top
#   less its miked section), covering the riser's spread, the bar's seat
#   and any tilt together;
# - seat_measure_mm (.0003): the sweep's error, two micrometer readings'
#   ±.0001, the DTI's .001 mm and the zero's drift the sweep's return to
#   P1 accepts (sweep_zero_return_mm, .002 mm).
# Total .0014 of the ±.002: .0006 to spare, over ledge_margin_min_mm. cam.py
# also floors the two measuring terms at those steps and the shop's gauge
# resolutions.
saw_touch_step_mm = 0.01
sweep_zero_return_mm = 0.002
saw_touch_error_mm = 0.01524
seat_offset_max_mm = 0.0127
seat_measure_mm = 0.00808
ledge_margin_min_mm = 0.0127
# Each load's ends stand this far past the jaw side (.75 in): past the top
# notch's depth, so the saw never reaches the jaws.
end_protrusion_mm = 19.05
# The ends stand .75 in past the jaw side for every cut: the top notch's
# deflection grows with the overhang cubed.
# Ends: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) on its
# side, full bar height in one level, its tip .1 mm under the bars' down
# face (past the jaw side, in air), passes no deeper than .020 into the end.
face_cutter_dia_mm = 12.7
end_step_max_mm = 0.508
foot_skim_mm = 0.508
end_tip_below_mm = 0.1
# The top end's most stock past X0: the longest blank less the foot skim,
# past the length X0 is set to, the drawing band's middle 31.82 (Setup 5;
# computed by cam.py: 811.276 − 0.508 − 808.228).
top_excess_max_mm = 2.54
# The slitting saw (McMaster 3062A21: 2-3/4 in, .064 in, 72 teeth, 1 in
# hole): 100 rpm, the slowest in the mill's shop record (100-2800; its plate
# reads L 50-1500, so 100 is inside the L range), is 72 ft/min at its rim;
# LittleMachineShop "Cutting Speeds" (read 2026-11-20), Milling, Plain carbon
# steels 1006-1026, HSS: 80-110 ft/min; the bottom of the mill's range is the
# nearest it runs. Feed .001 in/tooth × 72 × 100 = 7.2 in/min (182.88
# mm/min): the author's choice, the lowest chip load prechips' force table
# holds; a thinner chip rubs the HSS teeth.
saw_dia_mm = 69.85
saw_thickness_mm = 1.6256
saw_bore_mm = 25.4
saw_teeth = 72
saw_rpm = 100
saw_feed_per_min_mm = 182.88
# The owned R8 stepped saw arbor, from its record (cad/config/shop-
# equipment/ tools.saw-arbor-r8-stepped, owner 2026-11-24; the process test
# holds these to it): the body above the saw (body_dia_above_saw_in), the
# cap below it (cap_dia_in, cap_thickness_in), the screw's head
# (screw_head_dia_in) and the cap's lower face below the spindle nose with
# no saw on (below_spindle_nose_in).
saw_arbor_body_dia_mm = 31.75
saw_arbor_cap_dia_mm = 31.75
saw_arbor_cap_thickness_mm = 12.7
saw_arbor_screw_head_dia_mm = 15.8242
saw_arbor_nose_to_cap_mm = 35.56
# The saw cuts no deeper past the arbor than its radius less the wider of
# body and cap, less saw_arbor_clear_mm: (69.85 - 31.75)/2 - 1.0 = 18.05
# (.711), on both sides of the saw (cam.py checks each notch's deepest
# limit, .094 and .56, against it).
saw_arbor_clear_mm = 1.0
saw_depth_past_arbor_max_mm = 18.05
# NOT MEASURED: how far the screw's head stands past the cap's lower face
# (countersunk: normally flush or under). A bounded assumption, .115: the
# largest, to .005, at which the saw programs' 1.000 in air proof still
# carries the head 5 mm over the bars' top (cam.py checks it); Setup 3
# measures it on the first load, before the spindle starts. The stack below
# the saw's lower face is the cap plus that (saw_below_max_mm), and the saw
# moves between passes with that stack 5 mm over the bars' top
# (saw_clear_z_mm; cam.py checks every move of the body, the cap and the
# screw head, after the saw's first rise from the touch-off, against the
# bars, the riser and the jaws, as cut and as proved in air).
saw_screw_head_stand_max_mm = 2.921
saw_below_max_mm = 15.621
saw_clear_z_mm = 26.971
saw_proof_raise_mm = 25.4
# The drive (record keyed = false): the cap's screw clamps the saw between
# the shoulder and the cap. From the record: screw_thread M8 x 1.25 (the
# pitch gauged by the owner, the M8 read from the head),
# screw_key_mm_inferred 5, clamp_torque_nm 20 (saw_clamp_torque_nm): about
# 11 kN of preload (the record's cited table: 13.2 kN at 23 N·m, friction
# .14); and screw_engagement_no_saw_mm 10.0 (the owner's 8 turns from first
# bite to seated). With this saw between the shoulder and the cap the thread
# holds by 10.0 less the saw's thickness, 8.4 mm: over one screw diameter
# (saw_screw_dia_mm; cam.py checks it). One face's friction on the ring
# between the 1 in pilot and the 1.25 cap (mean radius 14.35 mm) carries
# .14 × 11 kN × 14.35 mm = 22.1 N·m (saw_drive_torque_max_nm). That
# friction and preload are a table's, not measured, and the saw runs oiled:
# a pass may take half of it at most (cam.py's DRIVE_RESERVE: oil in the
# clamp, friction .10, under a preload a quarter low would leave 11.8 N·m).
# The heaviest pass here, .110 into the ends at the full .064 width, takes
# 5.0 N·m by the handbook's milling power. Every saw program's first pass is
# half a step (foot_notch_light_mm, top_notch_light_mm); the file then stops
# (M0, spindle off) for a look at the witness lines.
saw_screw_dia_mm = 8.0
saw_screw_engagement_no_saw_mm = 10.0
saw_clamp_torque_nm = 20.0
saw_clamp_preload_kn = 11.0
saw_drive_friction = 0.14
saw_drive_torque_max_nm = 22.1
# Runout, NOT MEASURED: the axial read at every mounting of the arbor (the
# R8 taper does not seat it the same twice), the radial at every clamping
# of the saw (the pilot is a sliding fit). Axial: a notch's width is the
# second level's rise above the first (its target less .064:
# foot_notch_rise_mm, top_notch_rise_mm) plus the saw's swept thickness, its
# miked thickness t plus its axial runout at the rim. Swept from the width's
# least less the rise to its most less the rise and saw_swept_margin_mm
# (.0005), and never under the rise, or the two kerfs leave a fin between
# them. One saw cuts both notches, so Setup 3 accepts the window both allow,
# .0620-.0665 (saw_swept_min_mm, the top's .124 less its .062 rise;
# saw_swept_max_mm, the foot's .110 less .043 and the margin): every saw it
# accepts overlaps both notches' kerfs and keeps the top notch .124-.1285
# (cam.py checks them). The lever indicator reads the saw's lower face 1/8
# in in from the teeth, where the rim's runout shows 1/1.10 of itself:
# saw_axial_reading_per_in_mm is its reading, in mm, per inch at the rim;
# saw_axial_nominal_mm the reading a saw miking .0640 may show. Z0 is
# touched under the tooth where that face stands lowest, so the ledge keeps
# its budget and the far wall takes the runout. Radial: the files are posted
# for the saw's catalogue diameter (saw_dia_mm, the packing list's, not
# measured), so the calipers read it over two opposite tips on the first
# load: D. The deepest tooth cuts the floor half of (D less 2.750, plus the
# tips' total swing R) deeper than the file's depth, the band's middle: that
# sum within twice (the depth's most less its target less
# saw_depth_margin_mm, .002) either way: .016 for both notches.
saw_swept_margin_mm = 0.0127
saw_depth_margin_mm = 0.0508
saw_axial_reading_per_in_mm = 23.091
foot_notch_rise_mm = 1.0922
top_notch_rise_mm = 1.5748
saw_swept_min_mm = 1.5748
saw_swept_max_mm = 1.6891
saw_axial_nominal_mm = 0.0577
foot_saw_radial_tir_max_mm = 0.4063
top_saw_radial_tir_max_mm = 0.4064
# The saw's touch-off station: over the middle of the bar against the fixed
# jaw, the saw's rim 3 mm in over the ends (its centre the saw's radius less
# 3 mm past them, X mirrored for the top ends), the cap and its screw beyond
# the ends. CA01 and CA03 end with T1 parked over it: up to saw_park_z_mm,
# along X past the ends, along Y over the bar. T1 (its collet and its 2 in
# projection: 2.25 from the nose) is longer than the arbor
# (saw_arbor_length_mm), so its tip parks 5 mm over the bars' top and the
# arbor, swapped in for it, hangs higher still. An R8 shank goes up into
# the spindle from below, so for every change of the arbor the builder jogs
# Z only, up, until the saw on it clears the bars; X and Y stay, and Z0 is
# touched again from the saw.
saw_touch_x_mm = 31.925
saw_touch_y_mm = -3.1623
saw_park_z_mm = 11.35
# After a homing ($H) between the park and the touch-off (a controller
# reset other than one after a Feed Hold, an alarm, a stall or an E-stop
# needs one), the saw goes back over the station by MDI from the homed Z
# (its top), X and Y only, then down in Z.
# Notch targets: the depths each band's middle; the foot's width its band's
# middle, the top's .126, the .064 saw plus a .062 rise, half its .124 least
# width, so the two kerfs overlap at every accepted saw (cam.py checks them).
foot_notch_width_mm = 2.7178
foot_notch_depth_mm = 2.1273
top_notch_width_mm = 3.2004
top_notch_depth_mm = 13.97
# The top notch is cut in equal steps into the end no deeper than .118 (3.0
# mm) at each of its two levels: in one 13.97 mm bite the saw's push would
# bend the .75 in overhang about .085 mm (prechips' estimate), past the
# finish limit. Five steps of 2.794 (cam.py checks them). Each notch's first
# pass is half a step, at the ledge's level: half the foot's depth, half a
# top step (cam.py checks them).
top_notch_step_mm = 2.794
foot_notch_light_mm = 1.0637
top_notch_light_mm = 1.397
# Pin hole: spot Ø.065 with the #1 carbide centre drill (under the #49, so no
# chamfer at the mouth), the #49 through in pecks of .050 with full retracts,
# its full diameter .5 mm past the down face, then the .0775 reamer through,
# its full diameter 1.0 mm past it, in and out at feed.
spot_dia_mm = 1.651
peck_mm = 1.27
drill_past_mm = 0.5
# The #49's point (118°) under that: cam.py checks it.
drill_tip_height_mm = -1.057
ream_past_mm = 1.0
# Speeds, authored in the operations: LittleMachineShop "Cutting Speeds",
# Drilling & Reaming, Plain carbon steels 1006-1026 (read 2026-11-20):
# drilling 60-100 ft/min, reaming 40-65. The #49 (.073) at 2800 rpm, the
# mill's top, is 54 ft/min; AutoDrill "Suggested drilling feed rates" (read
# 2026-11-20), Stl, Carbon, 1/16 in: .001 in/rev = 2.8 in/min. The #1 centre
# drill (1/8 body, 3/64 pilot) at 2800, .0005 in/rev (half the 1/16 column,
# its pilot being under it) = 1.4 in/min. The reamer at 2000 rpm (41
# ft/min), .002 in/rev (twice the drill's) = 4.0 in/min.
spot_feed_per_min_mm = 35.56
drill_feed_per_min_mm = 71.12
ream_feed_per_min_mm = 101.6
# Holding (shop workholding.vise-pm-6): the bars on the riser, inside the
# jaws, neither block past a jaw side; the jaws grip the bars' full height
# above it.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Past the other jaw side: the bar's length less the jaw width and the
# protrusion (cam.py checks it).
far_overhang_mm = 630.57
# The beams prechips bends, in each setup's frame (cam.py checks them): the
# thinnest section the stock band allows; Setup 3's grip from the foot end,
# and Setup 5's bar from its foot end (X −length) to its top end (X0), the
# grip its last jaw width but the protrusion.
bar_section_min_mm = 6.2992
foot_clamp_end_mm = 177.7238
top_extent_start_mm = -808.2932
top_clamp_start_mm = -177.7238
top_clamp_end_mm = -19.05
# Bar 1's ruled length L1 (Setup 4): its own x (L1 - 31.82, e = 0) must lie
# in every bar's x window, 0 to top_excess_max_mm, so L1 runs from the
# drawing band's middle (31.82 in = 808.228 mm) to that plus top_excess_max_mm
# (810.768 mm = 31.920 in, the longest blank less the skim; cam.py checks
# them).
measured_length_min_mm = 808.228
measured_length_max_mm = 810.768
# The absolute length accepted with the 1/64 in rule (owner ruling
# 2026-11-23, tool audit Q3: "absolute length accepted to +/-1/32"): the
# drawing band's middle, 31.82 in = 808.228 mm, ± 1/32 in = 0.79375 mm
# (cam.py checks them against the drawing band).
length_rule_min_mm = 807.43425
length_rule_max_mm = 809.02175
# The comparison's spread (Setup 6; delegated ruling 2026-11-23, no
# precedent, #2144): every finished bar within .003 of bar 1
# = 0.0762 mm. Why .003: bar 1's step e is read to .001 with the calipers
# (their own ±.001), the finished bars are compared again to .001, and the
# edge finder's X pick-up and the foot-end flush (below) add about .001; the
# 20 bars are then alike to a sixth of the printed .02 band, though where
# that band sits is known only to ±1/32.
compare_spread_max_mm = 0.0762
# The four foot ends of a load flush before CA03 to .001 (0.0254 mm), one
# caliper depth-rod reading: CA03 faces the four to one X0, so a foot end
# standing back makes that bar short by as much.
foot_flush_max_mm = 0.0254
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Each tool's least projection out of its holder: at its deepest tip (the
# riser's least height plus its Z) the holder's nose stands at least 1 mm above
# the jaw tops; none more than the tool's length less a holder_grip_min_mm
# grip (cam.py checks both). The 1/2 in end mill, 3 in overall, 2 in out.
holder_grip_min_mm = 12.7
half_mill_oal_mm = 76.2
half_mill_projection_min_mm = 50.8
# ANSI #1 centre drill, 1-1/4 in overall: .70 in out.
centre_drill_oal_mm = 31.75
spot_projection_mm = 17.78
# The #49 and the reamer: 1.00 in out.
drill_projection_mm = 25.4
ream_projection_mm = 25.4
# The saw arbor's lowest point from the spindle nose: the record's 1.4 in to
# the cap's lower face with no saw on (saw_arbor_nose_to_cap_mm) plus the
# .064 saw is 1.464; taken as 1.5 (saw_arbor_below_nose_mm), plus the screw
# head's stand bound: the length the T1 parks before it (saw_park_z_mm)
# allow for (cam.py checks them). The saw's own Z is always touched off.
saw_arbor_below_nose_mm = 38.1
saw_arbor_length_mm = 41.021
# ASME B94.11M jobber, #49: 1-7/8 in overall; the reamer bounded by 2-1/2 in.
drill_49_oal_mm = 47.625
reamer_oal_mm = 63.5

