# Harmonic-analyzer shop file for prechips travelers: tooling, cutting settings,
# machines, workholding, gauges and limits, in the prechips shop schema. Checks
# use these values as written. Part-specific tool keys do not assert tool
# equivalence. Material identities preserve each source's stated stock
# condition; they are not inferred from the printed material text or treated as
# interchangeable. Facts the prechips schema cannot hold that CAD specs read
# live in cad/config/shop-equipment.toml; no field is in both files.

# Source: prechips v0.9.0 examples/shop.toml (archive/pre-v0.10-2026-11-08
# examples/inventory/pedro-shop.toml and examples/shop-policy.toml, converted to
# millimetres), plus the HA records marked below.
[machines.pm-30mv]
kind = "mill"
rpm_ranges = [[50, 3000]]
travel_mm = { x = 584.2, y = 222.25, z = 355.6 }
spindle_to_table_mm = [60.96, 431.8]

[machines.pm-1127vf-lb]
kind = "lathe"
rpm_ranges = [[70, 380], [380, 2000]]
swing_over_bed_mm = 279.4
swing_over_cross_slide_mm = 169.926
between_centres_mm = 699.77

[machines.bs-0]
kind = "dividing_head"
worm_ratio = 40
direct_index_positions = 24
plate_holes = { A = [15, 16, 17, 18, 19, 20], B = [21, 23, 27, 29, 31, 33], C = [37, 39, 41, 43, 47, 49] }

[workholding.chuck-3jaw-6]
kind = "chuck"
grip_range_mm = [3.0, 140.0]
body_diameter_mm = 158.0
body_length_mm = 72.0

[workholding.chuck-4jaw-6]
kind = "chuck"
grip_range_mm = [6.0, 150.0]
body_diameter_mm = 158.0
body_length_mm = 70.0

[workholding.chuck-4jaw-5-bs0]
kind = "chuck"
grip_range_mm = [4.0, 110.0]
body_diameter_mm = 127.0
body_length_mm = 62.0

[gauges.calipers]
range_mm = [0.0, 152.4]
resolution_mm = 0.0127

[gauges.micrometers]
range_mm = [0.0, 76.2]
resolution_mm = 0.00254

# Pin-gauge set range, 0.011-0.500 in by 0.001 in; its grade note is
# cad/config/shop-equipment.toml gauges.pin-gauges. 0.011 in = 0.2794 mm exactly.
[gauges.pin-gauges]
range_mm = [0.2794, 12.7]
resolution_mm = 0.0254

[gauges.height-gauge]
range_mm = [0.0, 304.8]
resolution_mm = 0.0254

# HA: dial test indicator, 0.03 in travel read from zero, 0.0005 in divisions;
# its kind and make are cad/config/shop-equipment.toml gauges.dti. Both values
# are #1413 placeholders, still to be remeasured.
[gauges.dti]
range_mm = [0.0, 0.762]
resolution_mm = 0.0127

# 10x measuring loupe with a 0.1 mm reticle (edge breaks, relief corners).
[gauges.measuring-loupe]
range_mm = [0.0, 10.0]
resolution_mm = 0.1

# PM-1127VF-LB carriage Z DRO scale read as a length gauge (fit-scribe hold).
[gauges.lathe-z-dro]
range_mm = [0.0, 699.77]
resolution_mm = 0.005

# PM-30MV X DRO scale read as a length gauge (feed-lever length, hand sheet
# TL-26 Setup B). Range: machines.pm-30mv X travel; resolution: archive
# machines PM-30MV EL400-class DRO resolution_mm.
[gauges.mill-x-dro]
range_mm = [0.0, 584.2]
resolution_mm = 0.005

[limits]
stickout_ld_max = 4.0
tool_change_clearance_mm = 25.0

# Source: base-bar.toml; source hand traveler dated 2026-11-05 and
# table-clamped squaring sequence dated 2026-11-07 (see plan provenance).
# diameter_mm: standard nominal size stated in each description, × 25.4.
# The 8-32 tap records the plan's authored #29 (.136 in) tap drill. The v48
# drawing calls the #12 bracket drill (notes.process).
[tools.basebar-saw]
description = "Aluminium saw"
[tools.basebar-em-half]
description = "1/2 in centre-cutting 2-flute end mill; flutes ≥5/8 in"
diameter_mm = 12.7
[tools.basebar-em-face]
description = "3/4 in 4-flute end mill"
diameter_mm = 19.05
[tools.basebar-spot]
description = "#2 centre drill"
[tools.basebar-rail-drill]
description = "#29 (.136 in) drill"
diameter_mm = 3.4544
[tools.basebar-bracket-drill]
description = "#12 (.189 in) drill"
diameter_mm = 4.8006
[tools.basebar-slot-drill]
description = "3/8 in drill"
diameter_mm = 9.525
[tools.basebar-tap]
description = "8-32 plug tap"
tap_drill_mm = 3.4544
[tools.basebar-counterbore]
description = "5/16 in centre-cutting 2-flute end mill"
diameter_mm = 7.9375
# Diameter remains a plan-owned parameter and local description override.
[tools.basebar-slot-finish]
description = "Centre-cutting 2-flute HSS end mill; flutes ≥5/8 in"

[settings.basebar-edge-6061-t6511]
tool = "basebar-em-half"
material = "6061-t6511"
rpm = 1250
feed = "6 in/min"
[settings.basebar-slot-rough-6061-t6511]
tool = "basebar-em-half"
material = "6061-t6511"
rpm = 1250
feed = "5 in/min"
# Source guide's 165 ft/min HSS milling speed and .002 in (0.0508 mm)/tooth.
[settings.basebar-slot-finish-6061-t6511]
tool = "basebar-slot-finish"
material = "6061-t6511"
sfm = 165
chip_load_mm_per_tooth = 0.0508
flutes = 2
feed_unit = "in/min"

# Source: comparison/pivot-shaft.toml; archived pivot-shaft plan rev 7,
# inventory/pedro-shop.toml and cutting-data.toml pivot-shaft/DataShaft4 rows.
# These are authored choices, not drawing requirements (MHA-065 v40).
[tools.shaft-ar]
description = "AR carbide turning/facing tool"
[tools.shaft-centre]
description = "#2 M42 centre drill, Ø1.98 pilot / 60° seat"
# Angles, nose radius, blade width and corner radius remain local parameters.
[tools.shaft-hss]
description = "3/8 in M42 RH bit"
[tools.shaft-blade]
description = "M2 square blade"

# LMS 2569: supplied pre-ground HSS bit; 3/8 in shank; convex Ø0–19.05 mm.
# https://littlemachineshop.com/products/ball-and-radius-turning-tool-small
# https://littlemachineshop.com/cdn/shop/files/SmallRadiustoolinstructions.pdf?v=15026407504268274368
[tools.lms-2569]
description = "LMS 2569 ball-turning attachment, 3/8 in shank, HSS cutter"

# Calculated settings: archived cutting-data.toml rows (Machinery's Handbook
# 27th ed. starting values as cited there); operations supply the diameter.
# AR carbide face row; at Ø10 the 300 ft/min speed clamps to the lathe top speed.
[settings.shaft-face-carbide-1018]
tool = "shaft-ar"
material = "shaft-1018-cold-finished"
sfm = 300
feed_mm_rev = 0.08
# ShaftPrep centre-drill row, taken at the pilot; the quill is fed by hand.
[settings.shaft-centre-drill-1018]
tool = "shaft-centre"
material = "shaft-1018-cold-finished"
sfm = 110
feed = "Hand quill, 0.038 mm/rev"
# DataShaft4 M42 HSS bit rows.
[settings.shaft-face-hss-1018]
tool = "shaft-hss"
material = "shaft-1018-cold-finished"
sfm = 90
feed_mm_rev = 0.08
[settings.shaft-rough-turn-hss-1018]
tool = "shaft-hss"
material = "shaft-1018-cold-finished"
sfm = 90
feed_mm_rev = 0.10
[settings.shaft-finish-turn-hss-1018]
tool = "shaft-hss"
material = "shaft-1018-cold-finished"
sfm = 110
feed_mm_rev = 0.05
# M2 blade form_relief and cut_to_fit rows; parting is hand-fed.
[settings.shaft-relief-1018]
tool = "shaft-blade"
material = "shaft-1018-cold-finished"
sfm = 70
feed_mm_rev = 0.02
[settings.shaft-parting-1018]
tool = "shaft-blade"
material = "shaft-1018-cold-finished"
sfm = 70
feed = "Hand plunge, 0.025 mm/rev"
# Retained authored 1400 rpm HSS starting speed, not an LMS recommendation.
# Manual pp. 6–7: light manual cross-slide increments and handle sweeps.
[settings.shaft-dome-1018]
tool = "lms-2569"
material = "shaft-1018-cold-finished"
rpm = 1400
feed = "Manual light cross-slide infeed / handle sweep"

