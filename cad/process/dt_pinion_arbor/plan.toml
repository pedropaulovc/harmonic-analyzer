drilling = "none"
sizing = "other"
instruction = "The follow rest still off. Trial cut first: spindle running, skim .25 in at Z+{{process.rest_joint_in:.2f}} at a setting .002 over the aim; stop the spindle, mike it, and move the cross slide in by half the difference from the written aim A."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Then finish the head-end stretch from Z+{{process.rest_joint_in:.2f}} to Z+{{cad.neck_length_in:.3dot}} in one pass at the settings column's power feed, aiming A (the journals made to the strap, inside the span's {{cad.shaft_dia_min_in:.4dot}}–{{cad.shaft_dia_max_in:.4dot}}). Write the cross-slide DRO's reading for this finish setting."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Sharp-nose tool. First, spindle stopped: touch its left side on the head's rear face and set DRO Z0 there (the AR tool's zero does not carry over). Then finish the inside corner at the bar's shoulder, Z+{{cad.neck_length_in:.3dot}}, to R.010 max, and face the shoulder square down to the shaft."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
instruction = "Bolt the follow rest on the saddle's headstock side. With the rule, measure its jaws' lead L ahead of the AR tool's left edge, and write it: it must lie under 2.75 (the jaws then stop clear of the neck). The jaws are set before each pass on the diameter that pass has not yet cut, and stop at Z+{{process.rest_joint_in:.2f}} − L, clear of the neck."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "AR tool back (re-zero it on the rear face if its holder was moved, the rest off for the touch). Rough from the back end toward Z+{{process.rest_joint_in:.2f}} in cuts of {{process.rough_doc_in:.3dot}} per side to Ø{{process.rough_dia_in:.3dot}}, the follow rest's jaws, ahead of the tool, set on the diameter the last pass left; stop each pass at Z+{{process.rest_joint_in:.2f}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish from the back end to Z+{{process.rest_joint_in:.2f}} in one pass at the settings column's power feed, aiming A, the follow rest's jaws, ahead of the tool, set on the roughed Ø{{process.rough_dia_in:.3dot}}. First, spindle running, skim .25 in at the back end at the written finish reading, stop, mike it, and move the cross slide by half the difference from A (the AR holder may have moved since); then the pass. Stop at Z+{{process.rest_joint_in:.2f}}, where it meets the head-end stretch."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the shaft at Z+2.2 and Z+8.6 (the journals) and at Z+1.0, Z+3.5, Z+7.5 and Z+9.2. Journals smooth to the nail, no chatter (Ra 63)."
inspection = "Journals: the front AF and the back AB to .0004 under it, so .001–.003 under its strap's SF or SB (note 1: turned to the measured strap bores); the journal whose aim is under A is skimmed to it as below. The bond lands (Z+3.5 and Z+7.5): at least .002 under D, else skim them as below. Elsewhere Ø{{cad.shaft_dia_min_in:.4dot}}–{{cad.shaft_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.shaft_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "A journal over its aim (AF or AB), or a span or land over its band's top: spindle stopped, the follow rest lifted off; the AR tool's left edge on the head's rear face, DRO Z0 again. Bolt the rest back (jaws on the finished diameter) unless the stretch lies under Z+{{process.rest_joint_in:.2f}}."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Skim that stretch only to its aim, the cross slide in by half the miked excess per side: the front journal Z+{{cad.front_journal_station_in:.2dot}} to Z+{{cad.front_journal_end_station_in:.2dot}} to AF or the back Z+{{cad.back_journal_station_in:.2dot}} to Z+{{cad.back_journal_end_station_in:.2dot}} to AB; a span or land, to A, from the journal's end to the next journal, shoulder or back end. Mike again. A journal more than .003 under its strap's SF or SB, or any other reading under its band's bottom: the arbor is scrap; start again from Setup 1."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Only if A is over D − .002 (the drum would not slide on): skim both bond lands to D − {{process.land_clearance_aim_in:.3dot}}, the same way, the front land from Z+{{cad.front_journal_end_station_in:.2dot}} to Z+{{cad.bond_relief_station_in:.2dot}} and the back land from Z+{{cad.bond_relief_end_station_in:.2dot}} to Z+{{cad.back_journal_station_in:.2dot}}, the journals untouched. Mike both lands."
inspection = "Each land D − {{process.land_clearance_aim_in:.3dot}} to .0004 under it (note 3: turned to MHA-DT-01, .002–.008 clear)."
gauge_checks = [{ gauge = "micrometers", band_mm = [7.8359, 7.9273] }]
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "reamer-adj"
drilling = "none"
sizing = "other"
instruction = "Only if AF was written again from SF alone (owner ruling 2026-11-25: no journal size fits both bores): open the drum's front end to the front journal + {{process.drum_front_ream_over_in:.3dot}}. Mike the front journal at Z+2.2. Set the piece of the adjustable reamer set that spans that reading + {{process.drum_front_ream_over_in:.3dot}}, read with the micrometer over its blades. The drum in the bench vise's soft jaws, its marked front end up: turn the reamer in by hand in the tap wrench, with cutting oil, until its blades' full diameter stands {{process.drum_front_ream_depth_in:.2dot}} deep (past the .23 the drum's front end reaches onto the journal); turn it out the same way. Measure the front end with the telescoping gauge: that is DF now."
inspection = "DF at least the front journal + {{process.drum_front_ream_over_in:.3dot}} and at most .3165 (the drilled top, which note 3's .008 reads over the front land); reamed {{process.drum_front_ream_depth_in:.2dot}} deep or more. Over .3165: stop and tell the owner."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = [7.9375, 8.0391] }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "AR tool back. Spindle stopped, the follow rest lifted off: touch its left edge on the head's rear face, DRO Z0 again; bolt the rest back."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "The rest's jaws for the relief. L under 2.55: set on the diameter the last pass left (the Ø.3117 for the first); each later pass stops when they come .05 short of Z+{{cad.bond_relief_station_in:.2dot}}, then the jaws are backed off and the last stretch fed by hand. L 2.55 or more: on the Ø.3117 head-side of the relief for every pass."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the relief from Z+{{process.relief_rough_start_z_in:.2dot}} toward Z+{{cad.bond_relief_station_in:.2dot}} in .008 cuts per side to Ø{{cad.bond_relief_dia_min_in:.3dot}}–{{cad.bond_relief_dia_max_in:.3dot}}, aiming {{process.relief_aim_in:.3dot}}, the jaws as above; stop .005 short of Z+{{cad.bond_relief_station_in:.2dot}}. Each pass starts .05 short of the Z+{{cad.bond_relief_end_station_in:.2dot}} end: the insert's trailing edge then stays clear of it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.bond_relief_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Sharp-nose tool. Spindle stopped, the follow rest lifted off: touch its left side on the head's rear face, DRO Z0, and mike its tip's width; bolt the rest back, its jaws backed off."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Turn off the .05 step the AR passes left beside the Z+{{cad.bond_relief_end_station_in:.2dot}} end, .008 per side per pass down to the relief's diameter, each fed toward that end and stopped at Z+{{cad.bond_relief_end_station_in:.2dot}} less the tip's width."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Square the relief's end at Z+{{cad.bond_relief_station_in:.2dot}} with the tool's left side at that reading; the end at Z+{{cad.bond_relief_end_station_in:.2dot}} faces the head, so cut it with the tool's right side, the DRO at Z+{{cad.bond_relief_end_station_in:.2dot}} less the tip's width. Inside corners R.010 max."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the relief at both ends and its middle."
inspection = "Relief Ø{{cad.bond_relief_dia_min_in:.3dot}}–{{cad.bond_relief_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.bond_relief_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Relief over {{cad.bond_relief_dia_max_in:.3dot}}: AR tool back; spindle stopped, the follow rest lifted off, its left edge on the head's rear face, DRO Z0 again; the rest bolted back, its jaws set as for the relief's passes; another .004 cut per side as before, then the sharp-nose ops above again; mike again. Under {{cad.bond_relief_dia_min_in:.3dot}}: the arbor is scrap; start again from Setup 1."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.bond_relief_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "AR tool back. Spindle stopped, the follow rest lifted off: touch its left edge on the head's rear face, DRO Z0 again; the rest bolted back, its jaws on the Ø.3117. Step the SR.28 back crown from the rim at Z+{{cad.back_crown_rim_station_in:.2dot}}: at each line, carriage at the Z, face from the Ø out to the shaft's O.D.: Z+9.3602 from Ø.280; Z+9.3707 Ø.240; Z+9.3792 Ø.200; Z+9.3860 Ø.160; Z+9.3912 Ø.120. The dead centre's hole stays inside Ø.12."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the crown's steps smooth from the centre hole out to the rim, until the step corners are just gone, never past the rim at Z+{{cad.back_crown_rim_station_in:.2dot}}."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: break the outside edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file's corner: the shoulder's outer edge at Z+{{cad.neck_length_in:.3dot}} and the relief's step edges at Z+{{cad.bond_relief_station_in:.2dot}} and Z+{{cad.bond_relief_end_station_in:.2dot}}. The file's flat never on the journals. The back crown's rim is broken after its check."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the follow rest lifted off. Sharp-nose tool (R.004): touch its left side on the head's rear face and set DRO Z0 there; touch the nose on the miked shaft and set the cross-slide DRO to that diameter, as in Setup 6. Touch the nose on the crown at Ø.300, at Ø.280 and at Ø.120, reading Z. The bands allow for the R.004 nose; Ø.300 sits just inside the rim, still sharp."
inspection = "Crown rise from Ø.280 to Ø.120 +.0306 to +.0333 (SR{{cad.back_crown_radius_min_in:.2dot}}–{{cad.back_crown_radius_max_in:.2dot}}, read with the R.004 nose); at Ø.300 Z+9.342 to +9.362: the rim at Z+{{cad.back_crown_rim_station_min_in:.2dot}} to +{{cad.back_crown_rim_station_max_in:.2dot}} plus the crown's .002 rise from the rim to the nose's reading at Ø.300."
gauge_checks = [{ gauge = "lathe-z-dro", band_mm = "{{cad.back_crown_radius_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.back_crown_rim_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Rise over its band (the crown too full): file again from the rim inward and read the check above again. Rise under its band, or the rim outside its band: the arbor is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: break the back crown's rim at Z+{{cad.back_crown_rim_station_in:.2dot}} R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file's corner."
rpm = 200
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
holding = "Bench vise with soft jaws on the head."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished arbor: the Ø.59 head with its SR.43 crown and the .2510 reamed cross hole .23 from its rear face, the Ø.41 neck, the Ø.3125 shaft with the 1/16 pin hole at 1.50, the journals at 1.82–2.61 and 8.25–9.04, the Ø.28 relief at 4.20–6.80, the SR.28 back crown at 9.35." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the cross hole and of the pin hole with the smooth file's corner, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; turn the .2510 reamer through the cross hole by hand in a tap wrench to clear any burr turned into it. Never file the journals."
feed = "hand"

[[setups.operations]]
instruction = "Cross hole: an MHA-DT-15 rod (or an offcut of its 1/4 bar) enters by hand through it; mike the rod. With it in the hole, the calipers' depth end of the beam on the head's rear face beside the neck, the depth rod along the head's O.D. onto the rod's near side: that reading plus half the miked rod is the station."
inspection = "MHA-DT-15's 1/4 rod enters the cross hole by hand (fit audit F14); the cross hole {{cad.cross_hole_station_min_in:.2dot}}–{{cad.cross_hole_station_max_in:.2dot}} from the head's rear face."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.cross_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Pin hole: an MHA-DT-VN-63 pin, tried by hand at each end, does not enter (it must be driven at assembly; fit audit F15). Mike the 1/16 drill's shank; with the shank in the hole, the calipers' step faces (both faces point to the back end): the beam's end on the head's rear face, the slider's step on the shank's far side, {{process.pin_far_side_min_in:.4dot}}–{{process.pin_far_side_max_in:.4dot}} for a {{process.pin_shank_in:.4dot}} shank (a smaller shank reads half its shortfall less)."
inspection = "MHA-DT-VN-63 does not enter the pin hole by hand; the pin hole {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from the head's rear face."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pin_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Spans: slide the MHA-DT-33 collar (made before this arbor) on from the back crown, by hand, over the back stub and on to the pin hole; slide it off again."
inspection = "MHA-DT-33 slides on by hand over both spans (note 2: turned to the collar's bore). A tight spot: chuck the arbor again as in Setup 7 and skim that span only to A."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Drum: slide the MHA-DT-01 drum on from the back crown by hand, its marked front end leading, over the back journal and on until its front end stands 2.40 or less from the head's rear face (the calipers' depth rod from the head's rear face to the drum's front end); slide it off again."
inspection = "MHA-DT-01 slides on by hand over both journals (note 1). A stop on a bond land: chuck the arbor again as in Setup 7 and skim that land to D − {{process.land_clearance_aim_in:.3dot}}. A stop on the front journal: open the drum's front end as in Setup 7 (owner ruling 2026-11-25). A stop on the back journal: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Neck length: the calipers' depth rod, the beam's end on the neck's step to the shaft, the rod along the neck onto the head's rear face (both faces point to the back end)."
inspection = "Neck {{cad.neck_length_min_in:.2dot}}–{{cad.neck_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.neck_length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Out of any limit in the station and length checks above: the arbor is scrap; make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil (FINISH: {{cad.finish}}). Bag the arbor with its number, the journals wrapped."
feed = "hand"
