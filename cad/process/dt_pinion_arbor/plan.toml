instruction = "Measure each MHA-DT-14 strap's arbor bore (the journals' mates) with the telescoping gauge and the 0–1 in micrometer (reads .0001), at each end: write the smaller reading of the front strap SF and of the back strap SB. Then the MHA-DT-01 drum's bore the same way at each end (the journals pass into it, the bond lands bond in it): the end with the larger reading goes on first, toward the head; mark it with the felt pen and write its reading DF, and D, the smaller of the two ends. The drum slides over both journals (owner ruling 2026-11-25): the front journal's aim AF is the smallest of SF − {{process.journal_clearance_aim_in:.3dot}}, DF − {{process.journal_drum_clearance_in:.4dot}} and {{process.journal_aim_in:.4dot}}; the back journal's AB the smallest of SB − {{process.journal_clearance_aim_in:.3dot}}, D − {{process.journal_drum_clearance_in:.4dot}} and {{process.journal_aim_in:.4dot}} (the drum's whole bore passes over it). Write AF, AB and A, the larger of the two: the whole shaft is finished to A."
inspection = "SF and SB each at most {{process.strap_bore_max_fit_in:.4dot}}. Over it (with the aim held at the {{process.journal_aim_in:.4dot}} limit, a journal .0004 under it would run more than .003 loose): stop and tell the owner; the journals are not finished. D at least {{process.drum_bore_min_fit_in:.4dot}}: under it, stop and tell the owner. Each aim at least its strap's reading less .0026, so the journal, the aim to .0004 under it, runs .001–.003 in its strap. AB under that (SB more than {{process.strap_over_drum_max_in:.4dot}} over D): stop and tell the owner. AF under that (SF more than {{process.strap_over_drum_max_in:.4dot}} over DF): write AF again as the smaller of SF − {{process.journal_clearance_aim_in:.3dot}} and {{process.journal_aim_in:.4dot}}, and open the drum's front end at the end of this setup."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = [7.9375, 8.0391] }]

