[[setups.operations]]
cut_kind = "other"
instruction = "A journal over A, or a span or land over its band's top: spindle stopped, the follow rest lifted off; the AR tool's left edge on the head's rear face, DRO Z0 again. Bolt the rest back (jaws on the finished diameter) unless the stretch lies under Z+{{process.rest_joint_in:.2f}}."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Skim that stretch only to A, the cross slide in by half the miked excess per side: a journal Z+{{cad.front_journal_station_in:.2dot}} to Z+{{cad.front_journal_end_station_in:.2dot}} or Z+{{cad.back_journal_station_in:.2dot}} to Z+{{cad.back_journal_end_station_in:.2dot}}; a span or land from the journal's end to the next journal, shoulder or back end. Mike again. A journal more than .003 under S, or any other reading under its band's bottom: the arbor is scrap; start again from Setup 1."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Only if A is over D − .002 (the drum would not slide on): skim both bond lands to D − {{process.land_clearance_aim_in:.3dot}}, the same way, the front land from Z+{{cad.front_journal_end_station_in:.2dot}} to Z+{{cad.bond_relief_station_in:.2dot}} and the back land from Z+{{cad.bond_relief_end_station_in:.2dot}} to Z+{{cad.back_journal_station_in:.2dot}}, the journals untouched. Mike both lands."
inspection = "Each land D − {{process.land_clearance_aim_in:.3dot}} to .0004 under it (note 3: turned to MHA-DT-01, .002–.008 clear)."
gauge_checks = [{ gauge = "micrometers", band_mm = [7.8359, 7.9273] }]
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "AR tool back. Spindle stopped, the follow rest lifted off: touch its left edge on the head's rear face, DRO Z0 again; bolt the rest back."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "The rest's jaws for the relief. L under 2.55: set on the diameter the last pass left (the Ø.3117 for the first); each later pass stops when they come .05 short of Z+{{cad.bond_relief_station_in:.2dot}}, then the jaws are backed off and the last stretch fed by hand. L 2.55 or more: on the Ø.3117 head-side of the relief for every pass."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the relief from Z+{{process.relief_rough_start_z_in:.2dot}} toward Z+{{cad.bond_relief_station_in:.2dot}} in .008 cuts per side to Ø{{cad.bond_relief_dia_min_in:.3dot}}–{{cad.bond_relief_dia_max_in:.3dot}}, aiming {{process.relief_aim_in:.3dot}}, the jaws as above; stop .005 short of Z+{{cad.bond_relief_station_in:.2dot}}. Each pass starts .05 short of the Z+{{cad.bond_relief_end_station_in:.2dot}} end: the insert's trailing edge then stays clear of it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.bond_relief_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Sharp-nose tool. Spindle stopped, the follow rest lifted off: touch its left side on the head's rear face, DRO Z0, and mike its tip's width; bolt the rest back, its jaws backed off."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Turn off the .05 step the AR passes left beside the Z+{{cad.bond_relief_end_station_in:.2dot}} end, .008 per side per pass down to the relief's diameter, each fed toward that end and stopped at Z+{{cad.bond_relief_end_station_in:.2dot}} less the tip's width."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Square the relief's end at Z+{{cad.bond_relief_station_in:.2dot}} with the tool's left side at that reading; the end at Z+{{cad.bond_relief_end_station_in:.2dot}} faces the head, so cut it with the tool's right side, the DRO at Z+{{cad.bond_relief_end_station_in:.2dot}} less the tip's width. Inside corners R.010 max."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the relief at both ends and its middle."
inspection = "Relief Ø{{cad.bond_relief_dia_min_in:.3dot}}–{{cad.bond_relief_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.bond_relief_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Relief over {{cad.bond_relief_dia_max_in:.3dot}}: AR tool back; spindle stopped, the follow rest lifted off, its left edge on the head's rear face, DRO Z0 again; the rest bolted back, its jaws set as for the relief's passes; another .004 cut per side as before, then the sharp-nose ops above again; mike again. Under {{cad.bond_relief_dia_min_in:.3dot}}: the arbor is scrap; start again from Setup 1."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.bond_relief_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "AR tool back. Spindle stopped, the follow rest lifted off: touch its left edge on the head's rear face, DRO Z0 again; the rest bolted back, its jaws on the Ø.3117. Step the SR.28 back crown from the rim at Z+{{cad.back_crown_rim_station_in:.2dot}}: at each line, carriage at the Z, face from the Ø out to the shaft's O.D.: Z+9.3602 from Ø.280; Z+9.3707 Ø.240; Z+9.3792 Ø.200; Z+9.3860 Ø.160; Z+9.3912 Ø.120. The dead centre's hole stays inside Ø.12."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.shaft_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the crown's steps smooth from the centre hole out to the rim, until the step corners are just gone, never past the rim at Z+{{cad.back_crown_rim_station_in:.2dot}}."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: break the outside edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file's corner: the shoulder's outer edge at Z+{{cad.neck_length_in:.3dot}} and the relief's step edges at Z+{{cad.bond_relief_station_in:.2dot}} and Z+{{cad.bond_relief_end_station_in:.2dot}}. The file's flat never on the journals. The back crown's rim is broken after its check."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the follow rest lifted off. Sharp-nose tool (R.004): touch its left side on the head's rear face and set DRO Z0 there; touch the nose on the miked shaft and set the cross-slide DRO to that diameter, as in Setup 6. Touch the nose on the crown at Ø.300, at Ø.280 and at Ø.120, reading Z. The bands allow for the R.004 nose; Ø.300 sits just inside the rim, still sharp."
inspection = "Crown rise from Ø.280 to Ø.120 +.0306 to +.0333 (SR{{cad.back_crown_radius_min_in:.2dot}}–{{cad.back_crown_radius_max_in:.2dot}}, read with the R.004 nose); at Ø.300 Z+9.342 to +9.362: the rim at Z+{{cad.back_crown_rim_station_min_in:.2dot}} to +{{cad.back_crown_rim_station_max_in:.2dot}} plus the crown's .002 rise from the rim to the nose's reading at Ø.300."
gauge_checks = [{ gauge = "lathe-z-dro", band_mm = "{{cad.back_crown_radius_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.back_crown_rim_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Rise over its band (the crown too full): file again from the rim inward and read the check above again. Rise under its band, or the rim outside its band: the arbor is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: break the back crown's rim at Z+{{cad.back_crown_rim_station_in:.2dot}} R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file's corner."
rpm = 200
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
holding = "Bench vise with soft jaws on the head."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished arbor: the Ø.59 head with its SR.43 crown and the .2510 reamed cross hole .23 from its rear face, the Ø.41 neck, the Ø.3125 shaft with the 1/16 pin hole at 1.50, the journals at 1.82–2.61 and 8.25–9.04, the Ø.28 relief at 4.20–6.80, the SR.28 back crown at 9.35." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the cross hole and of the pin hole with the smooth file's corner, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; turn the .2510 reamer through the cross hole by hand in a tap wrench to clear any burr turned into it. Never file the journals."
feed = "hand"

[[setups.operations]]
instruction = "Cross hole: the {{process.cross_go_pin_in:.3dot}} GO pin passes, the {{process.cross_nogo_pin_in:.3dot}} NO-GO enters neither end; with the GO in it, the calipers' depth end of the beam on the head's rear face beside the neck, the depth rod along the head's O.D. onto the pin's near side, {{process.cross_near_side_min_in:.4dot}}–{{process.cross_near_side_max_in:.4dot}}."
inspection = "Cross hole Ø{{cad.cross_hole_dia_min_in:.3dot}}–{{cad.cross_hole_dia_max_in:.3dot}}, {{cad.cross_hole_station_min_in:.2dot}}–{{cad.cross_hole_station_max_in:.2dot}} from the head's rear face."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.cross_hole_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.cross_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Pin hole: the {{process.pin_go_pin_in:.4dot}} GO gauge pin passes, the {{process.pin_nogo_pin_in:.3dot}} NO-GO enters neither end; with the GO in it, the calipers' step faces (both faces point to the back end): the beam's end on the head's rear face, the slider's step on the pin's far side, {{process.pin_far_side_min_in:.4dot}}–{{process.pin_far_side_max_in:.4dot}}."
inspection = "Pin hole Ø{{cad.pin_hole_dia_min_in:.4dot}}–{{cad.pin_hole_dia_max_in:.4dot}}, {{cad.pin_hole_station_min_in:.2dot}}–{{cad.pin_hole_station_max_in:.2dot}} from the head's rear face."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.pin_hole_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.pin_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Neck length: the calipers' depth rod, the beam's end on the neck's step to the shaft, the rod along the neck onto the head's rear face (both faces point to the back end)."
inspection = "Neck {{cad.neck_length_min_in:.2dot}}–{{cad.neck_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.neck_length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Out of any limit in the three checks above: the arbor is scrap; make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil (FINISH: {{cad.finish}}). Bag the arbor with its number, the journals wrapped."
feed = "hand"
