# Integral pinion arbor and grip head MHA-DT-22, one off, from 5/8 in round
# 1018 CF. Route, chosen for speed (owner ruling 2026-11-21: turned setups are
# manual lathe work with a traveler and no NC; milled features run from a
# program on the PM-30MV):
# - Setup 1, saw: a 10.20 in blank.
# - Setup 2, lathe, 3-jaw: face the head end (the crown's apex), the datum
#   every later station is read from until the head's rear face is turned.
# - Setup 3, lathe, 3-jaw, turned round: face the back end to length from
#   the faced head end (height gauge) and centre-drill it for the tailstock.
# - Setups 4 and 5, mill, vise: the two cross holes while the blank is still 5/8 bar
#   its whole length (the stiff section keeps the overhang's deflection under
#   the drill thrust small): the blank along the jaws on one 1 in parallel on
#   edge, the faced head end 2.25 in out past the jaws' left face, both holes
#   in that overhang, drilled into air. PA01_cross_hole spots, drills C and
#   reams .2510 through the bar .3672 from the faced head end; PA02_pin_hole
#   pecks the 1/16 through it 2.0972 from it (the holes stay through when the
#   head is turned to Ø.59 and the shaft to Ø.3125).
# - Setup 6, lathe, 3-jaw, the head end out, the rest of the blank back in
#   the spindle bore: turn the Ø.59 head and the Ø.41 neck from the faced
#   head end, face the head's rear shoulder, step the SR.43 crown from a DRO
#   table and file it smooth.
# - Setup 7, lathe, between the 3-jaw (on the head, over a brass shim wrap)
#   and the tailstock dead centre, the follow rest behind the tool: rough the
#   shaft from the bar, finish it whole length to the aim set by the
#   measured strap and drum bores (inside the spans' and lands' .3087-.3121), turn the Ø.28
#   relief, step the SR.28 back crown from a DRO table, every station by the
#   carriage DRO from the head's rear face.
# - Setup 8, bench: deburr, check, oil, bag.
#
# Made to fit (note 1; owner ruling 2026-11-24, fit audit question 12): the
# journals run in the two MHA-DT-14 straps' 5/16 drilled bores, and (owner
# ruling 2026-11-25, option A) the MHA-DT-01 drum slides over both: its
# front end leads from the back crown over the back journal and seats .19
# min on the front one, so its whole bore passes the back journal and its
# front end takes the front one. Setup 7 measures each strap's bore and the
# drum's two ends with the telescoping gauge and the micrometer before the
# shaft is finished; each journal's aim is its own strap's bore less .002,
# held .0004 under the drum bore it must enter, never over .3117 (the collar
# still slides over it): the journals then run at the drawing's .001-.003.
# When no aim does both (the strap's bore more than .0022 over the drum's:
# the .003 loosest clearance less the .0004 turning window and the .0004
# the drum needs to slide), the front journal is turned to its strap alone
# and the drum's front end is reamed to it + .001 with the owned adjustable
# set, .30 deep (past the .23 the seat reaches): its wall stays .151 (rule
# 17: .080 target) and the front land's gap under it at most .0042 (note 3:
# .008). No ruling covers the back journal: there the fitter stops and
# tells the owner. No gauge pins on the
# journals. The bond lands are made to the MHA-DT-01 drum's 5/16 drilled
# bore too (note 3; owner ruling 2026-11-24, fit audit question 13): Setup 7
# skims the lands only where the aim leaves the drum less than .002 clear.
# The spans are made to the MHA-DT-33 collar's
# 5/16 drilled bore too (note 2; drawing-guidelines rule 4, form 2):
# Setup 7's aim keeps them under its .3125 minimum, and Setup 8 slides the
# collar, then the drum, over them by hand.
#
# To order before Setup 4 runs: the .2510 reamer (tools.reamer-2510, owner
# ruling #3073). No gauge pins: the MHA-DT-15 rod and the MHA-DT-VN-63 pin
# gauge their holes (fit audit F14, F15).
#
# NC (cam:dt_pinion_arbor, cad/process/dt_pinion_arbor/cam.py):
# PA01_cross_hole, PA02_pin_hole. The program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 the #2 centre drill, T2
# the C drill, T3 the .2510 reamer, T4 the 1/16 drill.
title = "Integral Pinion Arbor and Grip Head"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 5/8 in round (drawing: {{cad.material_spec}})"
stock = "Qty {{process.quantity:g}}. {{process.bar_dia_in:fraction}} in round bar on hand: one blank {{process.blank_length_in:.2f}} in long."
note = "Inches unless mm; G-code and console entries in mm (the file and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil on the steel. Stations are read from the faced head end through Setup 6, and from the head's rear face from Setup 7 on. Inside corners R.010 max: finish each shoulder's corner with the sharp-nose tool. Mill speeds on the PM-30MV low belt (100–2800 rpm). Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Prove the file in air first."
shop = "../shop"
stock_refs = ["1018-round-5-8"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_pinion_arbor/features.toml"
adapter = "drilled_block"
part = "dt-pinion-arbor"

[parameters]
quantity = 1
bar_dia_in = 0.625
bar_dia_mm = 15.875
# The 9.995 in arbor (crown apex to apex), .02 faced off the head end and
# about .18 faced off the back end, rounded up.
blank_length_in = 10.2
blank_length_mm = 259.08
# The blank the arbor is cut from (stock_fit: envelope X, Y, Z; Z the axis).
blank_x_in = 0.625
blank_y_in = 0.625
blank_z_in = 10.2
# Setup 6: the head end 1.10 in out of the jaw fronts: the .117 crown, the
# .48 head, the .41 neck and .09 clear of the jaws.
head_stickout_mm = 27.94
face_allowance_in = 0.02
# The head's rear face from the faced end: the crown's height (head crown
# SR.43 on the Ø.59: .43 − √(.43² − .295²) = .1172) plus the .48 head.
crown_height_in = 0.1172
head_rear_z_in = 0.5972
# Setup 6 accepts the rear face .5872-.6072 from the faced end (an in-process
# aim of .5972): the holes, drilled .3672 and 2.0972 from that end, then stand
# inside the drawing's .23 ±.01 and 1.50 ±.01 from it, and the head inside
# .47-.49; Setup 8 accepts the holes on the drawing's limits.
head_rear_min_in = 0.5872
head_rear_max_in = 0.6072
# The neck's end (the shaft's shoulder) from the faced end: plus the .41 neck.
neck_end_z_in = 1.0072
# Setup 3: the back end 1.00 in out; faced to length from the faced head
# end, an in-process target (the drawing's 10.0 is REF): the head's rear face
# .5972, the 9.35 rim and the SR.28 crown's height on the Ø.3125 (.28 −
# √(.28² − .15625²) = .0477), 9.9949, read with the height gauge. Over
# 9.9969 the back end is skimmed again. Scrap under 9.990: the rear face is
# cut at .5972 on the DRO (within .002) and Setup 7 steps the crown's last
# step at Z+9.3912 from it, so .5992 + 9.3912 = 9.9904 must stand on metal.
end_stickout_mm = 25.4
overall_in = 9.9949
overall_min_in = 9.990
overall_max_in = 9.9969
overall_min_mm = 253.746
overall_max_mm = 253.9213
back_crown_height_in = 0.0477
# Setup 4 (mill, shop workholding.vise-pm-6, fixtures.parallels-lms-6745,
# 1/8 in thick): one 1 in parallel on edge, centred between the jaws, its
# left end flush with the jaws' left face; the blank (still 5/8 bar its whole
# length) on its top edge, the faced head end 2.25 in out past the jaws' left
# face (both holes in the overhang). The blank runs past the jaws' right end.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_length_mm = 101.6
jaw_left_x_mm = 57.15
# The blank's length past the jaws' left face, from the faced head end (the
# crown's apex): the overhang the vise hold reads.
left_overhang_mm = 57.15
# The holes from the faced head end: the head's rear face is .5972 in from
# it, the cross hole .23 back toward the end (.3672 in), the pin hole 1.50
# beyond (2.0972 in).
cross_x_mm = 9.3256
pin_x_mm = 53.2676
# The arbor's length in Setup 4 (the head end and the back end faced): 9.995 in.
part_length_mm = 253.868
# The 1/16 out of the chuck at least the jaw tops' height over its tip plus
# 5 mm: the chuck passes over the jaws beside the pin hole.
drill_projection_min_mm = 26.0
# The jaws' right end from the faced head end: the overhang plus the jaw width.
clamp_end_mm = 215.8238
# Setup 4 (the cross hole alone): the faced head end .75 in out past the
# jaws' left face, the hole .367 from it: a short overhang keeps the bar's
# bending under the C drill's and the reamer's thrust small. The jaws' right
# end from the faced head end; the C drill and the reamer out of the chuck
# at least the jaw tops' height over the C drill's tip plus 5 mm (the chuck
# passes over the jaws beside the hole).
cross_jaw_left_mm = 19.05
cross_clamp_end_mm = 177.7238
cross_projection_min_mm = 28.0
# Z0 is the bar's top; the jaw tops stand above it by the jaw height less the
# parallel and the bar; cam.py checks it.
jaw_top_over_bar_mm = 3.6703
# Cross hole: spot Ø.160 with the #2 centre drill (under the C drill), C
# (.242) through the bar, its full diameter 1.0 mm past the bar's underside;
# the .2510 reamer through, 1.5 mm past (its 45° lead). The head is turned
# to Ø.59 over the hole afterwards (Setup 6).
cross_spot_dia_mm = 4.064
drill_past_mm = 1.0
ream_past_mm = 1.5
# Pin hole: spot Ø.063 with the centre drill's pilot point only (its 5/64
# pilot is over the 1/16), the 1/16 pecked through the bar 0.5 mm past.
pin_spot_dia_mm = 1.6002
pin_drill_past_mm = 0.5
pin_peck_mm = 1.5
# The tips, from Z0 (cam.py checks them): C drill −(15.875 + 1.0 + its 118°
# point 1.847); reamer −(15.875 + 1.5); 1/16 −(15.875 + .5 + its point .477).
cross_drill_tip_mm = -18.722
cross_ream_tip_mm = -17.375
pin_drill_tip_mm = -16.852
# The 1/16 (shop tools.drill-1-16.diameter_mm); cam.py checks it.
drill_1_16_dia_mm = 1.5875
# Speeds and feeds: LittleMachineShop "Cutting Speeds", Drilling & Reaming,
# Plain carbon steels 1006-1026 (read 2026-11-20): drilling 60-100 ft/min;
# AutoDrill "Suggested drilling feed rates" (read 2026-11-20), row Stl,
# Carbon: 1/16 in .001, 1/4 in .004 in/rev (as the dt_pinion_cam plan).
# Centre drill 1800 rpm × .001 = 1.8 in/min; C 1000 rpm (63 ft/min) × .003
# = 3.0 in/min; the reamer 400 rpm (26 ft/min) × .004 = 1.6 in/min; the 1/16
# at the spindle's 2800 × .001 = 2.8 in/min.
spot_feed_per_min_mm = 45.72
drill_c_feed_per_min_mm = 76.2
ream_feed_per_min_mm = 40.64
drill_feed_per_min_mm = 71.12
# Setup 7: the 3-jaw on the head over the shim wrap, the back end on the
# greased dead centre; the shaft roughed in passes of .040 per side from
# Ø.625 to Ø.330, then finished whole length to the aim A, the larger of the
# two journals' aims (each its strap's measured bore less
# journal_clearance_aim_in, never over journal_aim_in, .3117, .0004 under the
# spans' .3121 top), the other journal skimmed to its own.
# The follow rest bolts to the saddle's headstock side, its jaws a lead L
# ahead of the tool, so it cannot reach the head: the stretch from the
# shoulder to the joint at Z+3.20 (in the span between the front journal
# and the relief) is turned first with the rest off; the rest goes on for the
# back end to the joint, its jaws then at 3.20 − L, clear of the neck.
rough_doc_in = 0.04
rough_dia_in = 0.33
journal_aim_in = 0.3117
journal_clearance_aim_in = 0.002
relief_aim_in = 0.28
rest_joint_in = 3.2
# The AR holder's TCMT insert (60° included) has a trailing edge at 30° or
# more to the axis: a pass started beside a wall that faces the chuck
# reaches toward it by the pass's total depth ÷ tan 30° plus the R.016 nose.
# The neck (Ø.590 to .420, .085 per side) starts .17 from the head's rear
# face (.147 + .016), the relief (Ø.3117 to .280, .016 per side) .05 short of
# its 6.80 end (.028 + .016); the sharp-nose tool turns off what is left.
neck_rough_start_z_in = 0.7672
relief_rough_start_z_in = 6.75
# Bench: the pin hole's station is read over the 1/16 drill's shank (miked),
# the hole in the shaft: the station plus half the shank. The hole has no
# gauge pin: an MHA-DT-VN-63 must drive, not enter by hand (the hole's
# acceptance; fit audit F15). The cross hole's station is read over the
# MHA-DT-15 rod itself, miked (fit audit F14: the rod is its gauge).
pin_shank_in = 0.0625
pin_far_side_min_in = 1.5213
pin_far_side_max_in = 1.5413
# Setup 5: a 1/4 rod (MHA-DT-15 or an offcut of its bar) set upright in the
# cross hole before the pin hole is drilled (the drawing's two holes
# parallel, the title block's ±1° on angles): the spindle DTI (shop
# gauges.dti) on the rod over .200 of Z, .200 × tan 1° = .0035 in = 0.089 mm.
# The rod's .001-.0035 play in the reamed hole tilts it at most .0011 over
# .200, inside the window.
pin_square_dti_mm = 0.089
# Setup 7: each MHA-DT-14 strap's arbor bore, 5/16 drilled (.3125-.3165 at
# the DRILLED HOLES row). Each journal is accepted from its aim down to .0004
# under it; strap_bore_max_fit_in is the largest bore for which that whole
# window, at the journal_aim_in cap, stays inside the drawing's .001-.003
# (.3117 + .003 - .0004). A bigger bore: stop and tell the owner.
strap_bore_max_fit_in = 0.3143
# Setup 7: the bond lands are made to the MHA-DT-01 drum's 5/16 drilled bore
# (note 3, .002-.008 clear; owner ruling 2026-11-24, fit audit question 13):
# they take the shaft's aim A unless that leaves the drum's smaller end D
# under .002 clear; then they are skimmed to D − land_clearance_aim_in. A D
# under drum_bore_min_fit_in would put a skimmed land under the .3085 the
# lands are modelled to (D − .003 − .0004).
land_clearance_aim_in = 0.003
drum_bore_min_fit_in = 0.3119
# Setup 7: the drum slides over both journals (owner ruling 2026-11-25,
# option A). Each journal's aim stays journal_drum_clearance_in under the
# drum bore it enters (the spans' .0004 under the drum's and the collar's
# 5/16): the front's under DF, the back's under D. A journal, its aim down to
# .0004 under it, then stays .001-.003 in its strap only while the strap's
# bore S is at most strap_over_drum_max_in over that drum bore
# (.003 − .0004 − .0004). Over it at the front: the front journal is turned
# to its strap alone and the drum's front end reamed to the miked journal +
# drum_front_ream_over_in (the ruling's +.001), drum_front_ream_depth_in
# deep, past the .23 the drum's front end reaches onto the journal
# (dt_pinion_arbor_spec.DRUM_FRONT_END_ON_JOURNAL_MAX). At the journal_aim_in
# cap that bore is .3127: the drum's wall to its tooth root (Ø.6145 min) is
# .151 (rule 17 target .080), and the front land under the reamed length
# (a land at least .3085) is at most .0042 clear, inside note 3's .008. An O
# drill (.316, cutting to .320) would leave .0115 there, past LOCTITE 638's
# .0098: the reamer only.
journal_drum_clearance_in = 0.0004
strap_over_drum_max_in = 0.0022
drum_front_ream_over_in = 0.001
drum_front_ream_depth_in = 0.3

