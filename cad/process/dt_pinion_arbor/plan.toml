[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 5/8 in bar on the saw: a 10.20 in blank off its end." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Mark {{process.blank_length_in:.2f}} in from the bar end with the rule and saw on the waste side of the line; pick the blank up only after the blade has stopped. File the burrs off both sawn ends."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Head end: face"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the blank, one end {{process.end_stickout_mm:in.2f}} in out of the jaw fronts (rule), the rest of the blank back through the chuck into the spindle bore. That end is the head end from here on: mark the bar beside it with a felt pen."
datum = "The faced head end is the crown's apex: every later station is read from it until the head's rear face is turned (Setup 6)."
diagram = { file = "diagrams/head-face.svg", alt = "The blank in the 3-jaw, the head end out 1.00 in, faced square." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bar_dia_mm}}", stock_diameter_mm = "{{process.bar_dia_mm}}", stickout_mm = "{{process.end_stickout_mm}}", minimum_diameter_mm = "{{process.bar_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the head end square, {{process.face_allowance_in:.2dot}} in off, to the centre with no pip."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Back end: face to length, centre-drill"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw on the blank's 5/8 bar, the back end {{process.end_stickout_mm:in.2f}} in out of the jaw fronts, the head end back through the chuck into the spindle bore."
datum = "Z0 (carriage DRO) the back end faced in the first op; the length is read from the faced head end with the height gauge."
diagram = { file = "diagrams/back-end.svg", alt = "The blank turned round, the back end out: faced to length from the head's rear face and centre-drilled for the tailstock." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bar_dia_mm}}", stock_diameter_mm = "{{process.bar_dia_mm}}", stickout_mm = "{{process.end_stickout_mm}}", minimum_diameter_mm = "{{process.bar_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the back end square in light skims toward the length, to the centre with no pip; set DRO Z0 on the last skim."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the blank out and stand it on its back end on the surface plate: the height gauge's scriber on the faced head end reads the length. Aim {{process.overall_in:.4dot}}, an in-process target (the drawing's 10.0 is REF). Write the final reading on the traveler."
inspection = "Back end to the faced head end {{process.overall_min_in:.3dot}}–{{process.overall_max_in:.4dot}} (in process; shorter leaves no metal under the back crown)."
gauge_checks = [{ gauge = "height-gauge", band_mm = ["{{process.overall_min_mm}}", "{{process.overall_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{process.overall_max_in:.4dot}}: chuck it again as in this setup and take another skim from the back end. Under {{process.overall_min_in:.3dot}}: the blank is scrap; saw another (Setup 1)."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-1"
drilling = "none"
sizing = "other"
instruction = "Chucked again as in this setup's first op: centre-drill the back end with the No. 1 centre drill from the tailstock chuck, to about Ø.08 across the countersink (inside the crown's Ø.12 step)."
settings = "lathe-centre-1018"
cut_diameter_mm = 1.191

[[setups]]
machine_kind = "other"
title = "Mill: the cross hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise. One 1 in, 4 in long parallel of the 1/8 in thick set standing on edge, centred between the jaws, its left end flush with the jaws' left face (a rule across both). The blank (still 5/8 bar its whole length) on its top edge along the jaws, the marked head end to the LEFT, {{process.cross_jaw_left_mm:in.2f}} in out past the jaws' left face (calipers' depth rod), never under .70 nor over .80; the blank runs on past the jaws' right end. Tap it down onto the parallel while closing the vise. Under the hole nothing but air."
datum = "Program PA01_cross_hole (cam:dt_pinion_arbor). G54: X0 the faced head end (Setup 2), +X toward the back end; Y0 the bar's axis; Z0 the top of the 5/8 bar. The file starts with an M6 for the centre drill; tool lengths from the tool setter at each M6; at each M6 stop the file has stopped the spindle and lifted the tool above the jaws."
diagram = { file = "diagrams/cross-hole.svg", alt = "The blank along the vise jaws on a parallel on edge, the faced head end out .75 past the jaws' left face; the cross hole .367 from it, through the 5/8 bar into air." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.bar_dia_mm}}", along_jaws_mm = "{{process.part_length_mm}}", part_height_mm = "{{process.bar_dia_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.cross_jaw_left_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.part_length_mm}}"], clamp_mm = ["{{process.cross_jaw_left_mm}}", "{{process.cross_clamp_end_mm}}"], section_mm = { diameter = "{{process.bar_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Start only with the .2510 reamer in hand (to order). Home the mill ($H). G54 Y0 the bar's axis: edge finder (900 rpm)."
instruction_detailed = "Home the mill ($H). Edge finder (900 rpm, Ø.200), its tip level with the bar's axis, on the bar between the head end and the jaws: from the −Y side, G10 L20 P1 Y0; jog Z up clear of the blank, then from the +Y side G10 L20 P1 Y(half the DRO's work Y reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the faced head end: edge finder (900 rpm) on the bar's axis."
instruction_detailed = "X and Z have no work zero yet, so jog: Z up until the tip clears the bar's top; X left until the tip is about .3 in left of the faced head end; MDI G0 Y0.000; jog Z down to the bar's axis height; bring it in from the left onto the faced head end: G10 L20 P1 X-2.540. Jog X left .3 in and Z up clear."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the bar, touched with the centre drill over the axis."
instruction_detailed = "Console M6 T1 (#2 centre drill; the tool setter measures it). MDI G0 X9.000 Y0.000: over the bar. Spindle stopped, its point just dragging a .002 feeler leaf on the bar's top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PA01_cross_hole in air, Z0 raised 1.000 in. Then Z0 back. The C drill and the reamer stand at least {{process.cross_projection_min_mm:in.2f}} in out of the chuck."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400). Run PA01_cross_hole through every M6, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back, and the centre drill goes back in for the real run."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run PA01_cross_hole (M6 T1, centre drill; set 1800): spot the cross hole Ø{{process.cross_spot_dia_mm:in.3dot}} on the bar's top at X{{process.cross_x_mm:.3f}} mm."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
