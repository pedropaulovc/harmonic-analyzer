<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 68 px/in along and across the axis: the 3-jaw over a brass shim wrap on the Ø.59 head (its rear face .25 out of the jaw fronts and the shim), Z0 the head's rear face, the neck Ø.41 x .41 (cad.neck_length_in), the shaft to the back end at Z+9.40 on the MT3 dead centre (schematic). The 3-jaw's body and jaws are schematic (their sizes are not on record). The shim's thickness is not on record: drawn .03 (2 px), from the head's left end to just past the jaw fronts. The AR tool schematic (not on record), on the first rough pass from Z+3.20 toward the shoulder at Z+.41, .040 per side (process.rough_doc_in) to Ø.545; hatched: what it has cut behind it; travelling toward the chuck, drawn at Z+1.5. The follow rest is off for the head-end stretch (from the shoulder to Z+3.20, process.rest_joint_in): not drawn; a callout says so. -->
  <rect class="paper" x="0" y="0" width="760" height="330"/>
  <text class="title" x="20" y="22">Setup 7, Op 300: the AR tool roughs the head-end stretch to Ø.33, the follow rest OFF (to scale, 68 px/in)</text>
  <rect class="fixture-vise" x="-7" y="111.9" width="56" height="116.2"/>
  <rect class="fixture-support" x="49.39" y="147.9" width="26.33" height="2.04"/>
  <rect class="fixture-support" x="49.39" y="190.06" width="26.33" height="2.04"/>
  <rect class="part-kept" x="49.39" y="149.94" width="40.61" height="40.12"/>
  <rect class="part-kept" x="90" y="156.06" width="27.88" height="27.88"/>
  <rect class="part-kept" x="117.88" y="148.75" width="189.72" height="42.5"/>
  <rect class="part-kept" x="307.6" y="148.75" width="421.44" height="42.5"/>
  <rect class="clamp" x="49" y="123.9" width="24" height="24"/>
  <rect class="clamp" x="49" y="192.1" width="24" height="24"/>
  <line class="centre-line" x1="20" y1="170" x2="745" y2="170"/>
  <path class="clamp" d="M723.04 170L743.04 158L750 158L750 182L743.04 182Z"/>
  <text class="label" x="650" y="120">MT3 dead centre</text>
  <line class="datum" x1="90" y1="60" x2="90" y2="96"/>
  <text class="datum-label" x="96" y="72">Z0 the head's rear face</text>
  <rect class="part-removed" x="192" y="148.75" width="115.6" height="2.72"/>
  <rect class="part-removed" x="192" y="188.53" width="115.6" height="2.72"/>
  <path class="cutter" d="M192 188.53L222 200.53L222 278.53L214 275.53L206 278.53L198 278.53L198 212.53Z"/>
  <line class="arrow" x1="182" y1="251.25" x2="132" y2="251.25"/>
  <text class="label" x="300" y="300">AR tool: rough to Ø{{process.rough_dia_in:.3dot}} from Z+{{process.rest_joint_in:.2f}} toward the shoulder;</text>
  <text class="label" x="300" y="316">the follow rest OFF for this stretch (it goes on only after it is finished)</text>
  <line class="leader" x1="298" y1="296" x2="212" y2="231.25"/>
  <circle class="leader-dot" cx="212" cy="231.25" r="2"/>
  <text class="label" x="40" y="300">3-jaw over a brass shim on the head</text>
</svg>
