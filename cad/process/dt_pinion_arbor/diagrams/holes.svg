<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 6 px/mm. Left: a section along the bar's axis (Y0) seen from the front (looking +Y, +X to the right): the blank on the top edge of one 1 in parallel standing on edge between the jaws (process.riser_height_mm, process.parallel_thickness_mm), its left end flush with the jaws' left face; the fixed jaw behind the cut, its top 3.670 mm over the bar's top (process.jaw_top_over_bar_mm); X0 the faced head end, Z0 the bar's top. The bar, jaw and parallel run on to break lines. Right: the bar end-on, seen from the head end looking +X, so +Y (the fixed jaw) is to the LEFT and −X comes toward you: the 5/8 bar between the jaws on the parallel's 1/8 top edge. In the end view the parallel is dashed: it starts at the jaws' left face, behind the drill in X, so the drill runs out into air in front of it. The head end 2.25 past the jaws' left face (process.jaw_left_x_mm); the reamed cross hole at X 9.326. The 1/16 drill (Ø1.588 mm, process.drill_1_16_dia_mm) at X 53.268 (process.pin_x_mm) Y0, its point at Z-16.852, PA02's posted depth: its full diameter 0.5 mm (process.pin_drill_past_mm) under the bar, in air left of the jaws and the parallel. It runs up to a break line. The T1 spot is not drawn. -->
