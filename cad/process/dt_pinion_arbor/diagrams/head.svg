  <text class="label" x="565" y="330">AR tool: the head Ø{{cad.head_dia_min_in:.3dot}}–{{cad.head_dia_max_in:.3dot}},</text>
  <text class="label" x="565" y="346">to Z-{{process.neck_end_z_in:.3dot}}</text>
  <line class="leader" x1="563" y1="326" x2="542" y2="299"/>
