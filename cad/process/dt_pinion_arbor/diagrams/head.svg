<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), a section through the axis, to scale at 200 px/in: the blank's head end 1.10 out of the jaw fronts (process.head_stickout_mm), the rest back through the spindle, to a break line; Z0 the faced head end (the crown's apex). The head Ø.59 (cad.head_dia_in) to Z-1.0072 (process.neck_end_z_in) first, then the neck Ø.41 (cad.neck_dia_in) from the head's rear face at Z-.5972 (process.head_rear_z_in) to Z-1.0072. The 3-jaw's body and jaws are schematic (their sizes are not on record). The AR tool schematic (not on record), on the finish pass at Ø.59, travelling toward the chuck. Hatched: the turned-off skin; dashed: the neck and the SR.43 crown to come. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 6, Op 230: the AR tool turns the head Ø.59 from Z0 to Z-1.0072 (to scale, 200 px/in)</text>
  <rect class="fixture-vise" x="298" y="71.5" width="56" height="217"/>
  <path class="part-rest" d="M40 117.5L418.56 117.5L418.56 242.5L40 242.5L37 235.15L40 227.79L37 220.44L40 213.09L37 205.74L40 198.38L37 191.03L40 183.68L37 176.32L40 168.97L37 161.62L40 154.26L37 146.91L40 139.56L37 132.21L40 124.85Z"/>
  <rect class="part-kept" x="418.56" y="121" width="201.44" height="118"/>
  <rect class="part-removed" x="520" y="117.5" width="100" height="3.5"/>
  <rect class="part-removed" x="520" y="239" width="100" height="3.5"/>
  <rect class="clamp" x="354" y="83.5" width="46" height="34"/>
  <rect class="clamp" x="354" y="242.5" width="46" height="34"/>
  <rect class="hidden" x="418.56" y="121" width="82" height="18"/>
  <rect class="hidden" x="418.56" y="221" width="82" height="18"/>
  <line class="centre-line" x1="20" y1="180" x2="740" y2="180"/>
