<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), a section through the axis, to scale at 200 px/in: the blank's head end 1.10 out of the jaw fronts (process.head_stickout_mm), the rest back through the spindle, to a break line; Z0 the faced head end (the crown's apex). The head Ø.59 (cad.head_dia_in) to Z-1.0072 (process.neck_end_z_in) first, then the neck Ø.41 (cad.neck_dia_in) from the head's rear face at Z-.5972 (process.head_rear_z_in) to Z-1.0072. The 3-jaw's body and jaws are schematic (their sizes are not on record). The neck roughed to Ø.42 by the AR tool. The sharp-nose tool is schematic (its sizes are not on record; its R.004 nose is the plan's). Drawn on the neck's finish pass, its right side squaring the head's rear face at Z-.5972 plus its tip's width. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 6: the sharp-nose tool finishes the neck Ø.41 and the head's rear face (to scale, 200 px/in)</text>
