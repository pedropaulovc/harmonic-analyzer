<?xml version="1.0" encoding="UTF-8"?>
<!-- Setup 1: the .040 brass sheet on the surface plate; the blank scribed off two straight sheet edges and sawn outside the lines. Hand-drawn, about 3:1; styles: prechips.palette. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" width="560" height="370" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <text class="title" x="12" y="20">Setup 1: blank from the sheet (top view, on the surface plate)</text>
  <rect class="fixture-table" x="20" y="34" width="520" height="284"/>
  <text class="label" x="30" y="308">surface plate</text>
  <!-- The sheet: its two straight edges at the lower left. -->
  <rect class="part-rest" x="70" y="70" width="420" height="200"/>
  <text class="label" x="362" y="250">brass sheet .040</text>
  <!-- The blank, .90 x .62 at 300 px/in, off the sheet's straight edges. -->
  <rect class="part-kept" x="70" y="84" width="270" height="186"/>
  <line class="datum" x1="340" y1="70" x2="340" y2="270"/>
  <line class="datum" x1="70" y1="84" x2="490" y2="84"/>
  <text class="label-halo" x="150" y="182">blank {{process.blank_x_in:.2f}} × {{process.blank_y_in:.2f}}</text>
  <!-- Saw kerfs just outside the scribed lines. -->
  <rect class="part-removed" x="342" y="70" width="8" height="200"/>
  <rect class="part-removed" x="70" y="74" width="280" height="8"/>
  <path class="leader" d="M350 150 L410 150"/>
  <text class="label" x="414" y="154">saw outside</text>
  <text class="label" x="414" y="170">the lines</text>
  <path class="leader" d="M340 230 L400 230"/>
  <text class="datum-label" x="404" y="234">scribed line</text>
  <!-- Thickness, miked first. -->
  <text class="label" x="74" y="296">straight sheet edges (bottom, left)</text>
  <text class="label" x="74" y="60">mike .036–.044 thick first</text>
  <!-- Holding the setup's text names, not drawn in this top view: the 1-2-3 block (scribing) and the saw's vise with its scrap boards (sawing). -->
  <text class="label" x="20" y="342">scribe: the sheet stood on each straight edge against a 1-2-3 block on the plate</text>
  <text class="label" x="20" y="360">saw: the sheet clamped flat between two scrap boards in the saw's vise (not shown)</text>
</svg>
