# Transgear drive collar MHA-PD-22, one off, from the 7/8 in C36000 bar on
# hand (cad/config/shop-equipment/stock-bought.toml c360-round-7-8, a 7 in
# piece shared with other parts). Turned on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC), the
# bore drilled #11 on the lathe; the three small axial holes drilled and
# reamed on the PM-30MV CNC (CM01).
# Route, chosen for speed (owner ruling 2026-11-21: the agent picks):
# - Setup 1, lathe, the bar in the 3-jaw, Z0 the faced pilot end: turn the
#   outside Ø.687 back past the parting line, the pilot Ø.390 to its .140
#   supply length (the shoulder faced square: the seat face), spot and drill
#   #11 through past the parting line in the same chucking, part the body
#   off at its .300 supply length. The body (.292 MIN) and the pilot
#   (.134 MIN) are supplied long: MHA-PD-00 faces both to fit (sheet notes 5
#   and 6), so the parted rear face is not faced again.
# - Setup 2, PM-30MV, vise: the collar seat face down on two stacked
#   parallels against each jaw, the pilot hanging between them, gripped on
#   the outside; G54 X0 Y0 swept true to the drilled bore with the DTI, Z0
#   the rear face. CM01 spots, drills #43 and reams the 2X .0930 dowel holes
#   through, then drills #53 and reams the .0615 flat-pin hole blind to its
#   floor, all on one line through the axis.
# - Setup 3, bench: deburr, clear the flat-pin breakthrough from the bore,
#   check the flat pin's centre over pins and its floor, press the
#   MHA-PD-VN-70 flat pin to the floor, oil. The pin is pressed here, not at
#   MHA-PD-00: MHA-PD-08's D-flat is milled to this collar with its pin
#   pressed (MHA-PD-08 note 2), and that shaft is needed finished before the
#   collar's own assembly step (Codjiflo P2 on #3485). Collar and pin leave
#   this traveler as one permanent pair.
# Left to MHA-PD-00 (final op): the MHA-PD-VN-54 dowel presses (step 20A),
# the pressed flat pin checked (20C), the three MHA-PD-09 wheels tried on
# the dowels (20E), the pilot faced to fit (21A), the rear faced to fit (29D)
# and the rear bore mouth's .008 X 45° break through the pin (29E).
#
# Owner ruling 2026-11-24, fit audit questions 7 (the bore drilled, the
# D-core turned to it) and 8 (the dowel centres by trial); the reams to the
# bought pins rest on drawing-guidelines rule 4 (owner, 2026-11-23: "can the
# holes not be reamed in the first place"):
# - The bore is the #11 drill's (the title block's DRILLED HOLES row);
#   MHA-PD-08's D-core is turned to slide in it. No .1920 reamer, no pins
#   for a .0005 bore band.
# - The dowel holes and the flat pin's hole are reamed to the bought pins,
#   which are their gauges: none enters by hand. No band is gauged, no pin
#   or reamer is miked, no trial hole is reamed. A pin that does enter by
#   hand is in a hole of unknown size (the pins' least sizes lie over the
#   whole of what the reamers are taken to cut), so no bonded clearance can
#   be stated for it: the collar is scrap (the sheet's note 3; Codjiflo P2
#   on #3485 removed the bond salvage).
# - The dowel centres are the program's targets: their acceptance is the
#   three MHA-PD-09 wheels dropping on at MHA-PD-00 (20E), never a reading
#   over pins here. The flat pin's centre keeps its printed ±.002 and is
#   read over set pins (Setup 3), accepted as read: the spec charges the
#   reading's bias in its worst cases (D6).
# - The feature export still binds limits for the reamed sizes and the dowel
#   centres (the adapter requires them): they are the spec's ANALYSIS bands
#   and no step here accepts by them.
#
# Not on hand (to order): the .0930 and .0615 chucking reamers
# (cad/config/shop-equipment/tools-reamers-taps.toml reamer-0930,
# reamer-0615) and the .001-step pin gauge set (gauges.toml pin-gauges; the
# bore's .191 and .195, the .093 and .061 for the flat pin's centre).
#
# NC (cad/process/pd_transgear_drive_collar/cam.py): CM01_holes. Program
# names, the [parameters] and the milling_cuts names are a contract with that
# recipe. Tool numbers are the places in the tools list among the mill's
# tools: T1 #2 centre drill, T2 #43, T3 .0930 reamer, T4 #53, T5 .0615
# reamer.
title = "Transgear Drive Collar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass, 7/8 in round (drawing: {{cad.material_name}})"
stock = "Lot: {{process.quantity:d}} collar. Ø{{process.bar_dia_in:.3dot}} bar, on hand; Setup 1 takes about {{process.bar_use_in:.2dot}} in of it: saw a 3 in piece off it for the lathe, never the whole bar (it would run out past the spindle's rear end)."
shop = "../shop"
stock_refs = ["c360-round-7-8"]
material_key = "lathe-c360"
milling_material = "brass"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant, homing, Feed Hold, tool changes, proving a file); This job says
# what only this collar needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Left long", "The body and the pilot leave this traveler long (supply {{cad.rear_face_supply_length_min_mm:in.3dot}} and {{cad.pilot_face_supply_length_min_mm:in.3dot}} MIN): MHA-PD-00 faces both to fit."],
  ["Gauges", "The reamed holes' gauges are their own pins (2 MHA-PD-VN-54 dowels, 1 MHA-PD-VN-70 pin): have them at the mill."],
  ["To order", "To order (not on hand): the .0930 and .0615 reamers and the .001-step pin gauge set."],
]

[cad]
file = "../../out/features/pd_transgear_drive_collar/features.toml"
adapter = "drilled_block"
part = "pd-transgear-drive-collar"

[parameters]
quantity = 1
bar_dia_in = 0.875
# Setup 1: .02 faced, the collar's .44 parted length and its kerf.
bar_use_in = 0.54
# The blank a collar is cut from (stock_fit: envelope X, Y, Z): the 7/8 bar,
# the parted length plus the facing allowance.
blank_x_in = 0.875
blank_y_in = 0.875
blank_z_in = 0.46
# Setup 1: out of the jaw fronts, the .44 collar, its kerf and room for the
# blade to clear the jaws.
stickout_mm = 20.32
face_allowance_in = 0.02
# Supply lengths (the sheet's .134 and .292 MIN, faced to fit at MHA-PD-00):
# the pilot from the faced end to the seat face, the body from the seat face
# to the parted rear face. The body's .297–.303 window keeps the flat pin's
# floor, drilled from the rear face, inside its .07–.09 station (cam.py);
# with the part-off fixed at Z-.440, the seat face's window is the body's
# mirrored (cam.py checks it).
pilot_supply_in = 0.14
pilot_supply_min_in = 0.137
pilot_supply_max_in = 0.143
body_supply_in = 0.3
body_min_in = 0.297
body_max_in = 0.303
# Setup 1 turns the outside this far back from Z0, past the parting line.
outer_run_in = 0.55
# The #11 runs its full diameter past the parting line, in pecks under its
# own diameter.
drill_run_in = 0.58
peck_11_in = 0.18
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
# Parting kerf: the blade's width plus .0125 (authored).
part_kerf_in = 0.075
# Setup 1 parts the collar off at the pilot plus the body.
part_off_in = 0.44
# Mill, CM01 (shop records, as dt_crank_hub): the PM 6 in vise.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
# Against each jaw a stack of the set's 1 in and 1/2 in parallels, 1/8 in
# thick (fixtures.parallels-lms-6745, 1/2 to 1 in by 1/16), the seat face on
# their tops, the pilot hanging between them: the gap between the stacks (at
# the outside's Ø.687 target) and the rear face over the jaw tops; cam.py
# recomputes both.
parallel_stack_mm = 38.1
parallel_thickness_mm = 3.175
parallel_gap_mm = 11.0992
rear_over_jaws_mm = 0.7747
# Spots with the #2 centre drill, one size for all three holes: Ø.030 on
# its pilot's point, under both the #53 (.0595) and the #43 (.089), and
# .0055 clear of the largest drilled bore's edge (.195) beside the flat pin
# (Ø.040 left .0005 there); cam.py checks both.
spot_dia_mm = 0.762
# Dowels: the #43's full diameter 1.0 mm past the seat face, the reamer's end
# 1.5 mm past it (its full diameter past the face with the 45° bevel lead),
# both into the gap between the stacks. Pecks under each drill's diameter.
drill_past_mm = 1.0
ream_past_mm = 1.5
peck_43_mm = 2.032
peck_53_mm = 1.27
# The flat pin's blind hole, stations from the seat face: the reamer's end
# at .075 and the #53's full diameter at .070, .005 past it. A chucking
# reamer cuts full size behind its 45° bevel (taken at most .010, authored),
# so the full-diameter floor lands .075–.085, inside the .07–.09 band with
# the body's ±.003 window (cam.py checks both ends).
flat_ream_station_in = 0.075
flat_drill_station_in = 0.07
ream_bevel_max_in = 0.01
# The tips below Z0 (the rear face) the file drills to; cam.py checks each.
dowel_drill_tip_mm = -9.2988
dowel_ream_tip_mm = -9.12
flat_drill_tip_mm = -6.2958
flat_ream_tip_mm = -5.715
# Each tool at least this far out of the chuck: the deepest tip below Z0
# plus 5 mm of clearance over the rear face (cam.py checks it).
tool_out_min_in = 0.6
# The flat pin's centre over pins (Setup 3), with the .001-step set's pins
# at their marked sizes: D, a dowel hole's centre from the bore's axis, is
# the reading over the bore's pin (the largest that enters) and the .093
# pin less half the sum of those two sizes; R is the reading over the .093
# and the .061 pins; the centre is D + over_flat_half_sum_in - R, the
# constant half of .093 + .061.
over_flat_half_sum_in = 0.077
# The pins stand loose in their holes and up to .0002 under their marked
# sizes, so a reading can sit up to .0012 off the true centre. The
# acceptance is the sheet's .116-.120 as printed: the spec charges that
# .0012 in every worst case that reads the centre
# (pd_transgear_drive_collar_spec.FLAT_PIN_CENTRE_READ_BIAS; delegated
# ruling 2026-11-24 (Main), D6), so a narrower window would only
# scrap parts that meet the print. A reading near a limit is taken again
# with the pins re-seated.
# Speeds and feeds: the shop settings (cad/process/shop/pd.toml, the
# MHA-PD-22 block, sourced there): spot, #43 and #53 2800 rpm × .001 in/rev
# = 2.8 in/min; the reamers 1400 × .001 = 1.4 in/min. cam.py refuses a feed
# that is not its setting's.
spot_feed_per_min_mm = 71.12
drill_feed_per_min_mm = 71.12
ream_feed_per_min_mm = 35.56

