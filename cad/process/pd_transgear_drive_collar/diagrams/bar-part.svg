<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 250 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.875 bar (bar_dia_in), the jaw fronts .78 behind Z0 (stickout_mm 20.32 less the .02 faced off), the outside Ø.687 (cad.outer_dia_mm) back to Z-.55 (outer_run_in), the pilot Ø.390 (cad.pilot_dia_mm) .140 long (pilot_supply_in) to the seat face, the #11 bore to the quill reading .58 (drill_run_in), the part-off face at Z-.44 (part_off_in) with the 1/16 blade's kerf behind it. The 3-jaw's body and jaws are schematic (their sizes are not on record). The P1 blade to scale across (shop cutoff-blade-p1, 1/16 = 15.6 px), its tailstock-side face at Z-.44, drawn at the moment its tip reaches the bore; its length runs on past the break line (not on record). Hatched: the kerf. -->
