# Held integral solid-stock process candidate; not enrolled for machining.
# CAD authority: current dt_cone_pivot_post_spec and drawing contracts.
# FINISH UNRESOLVED: owner selected solid stock; the drawing still requires
# paint and MASK MACHINED FACES. No paint/mask split has been authorized.
# All actual tooling, fixture/pose, cutting, inspection and calibration availability
# remains unknown. AUTHOR'S CHOICE geometry/methods below are proposals, not evidence.
# Native rotary, manual-root and honing replay is unresolved; no default
# full-feature sweep or bounding-box removal may stand in for actual cutter moves.
# PRACTICAL HELD ROUTE proposal (no ball milling): S1 turns Y0..68.072 to an Ø46
# envelope and finishes the boss-free lathe bands; S1C saws the tail off; S2B/S2BR
# remove head-band bulk with flat-end floors/terraces/crank stairs; S2H cuts head arcs
# and body free arcs directly to CAD radius on a horizontal dividing head (rotary
# stock/motion UNKNOWN, no credit); S2F files the remaining 1-3mm root sectors to
# qualified source masters. Actual tools/fixtures/settings/results unknown.
part = "dt-cone-pivot-post"
features = "../../out/features/dt_cone_pivot_post/features.toml"
construction = "one_piece"
quantity = 1 # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity
quantity_cite = ["harmonic-analyzer/cad/config/parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.quantity"]

[drawing]
number = "MHA-DT-05" # parts/dt-cone-pivot-post.yaml:dt-cone-pivot-post.number
revision = "v48" # authored next-revision candidate; not an assertion of machining approval

[stock]
form = "rectangular_bar"
material = "unknown" # ferrous_noncritical source; actual grade/heat/certificate unknown
on_hand = false # purchase candidate only; no allocation or ownership claim
section_mm = [50.8, 76.2] # AUTHOR'S CHOICE: nominal2x3in flat-bar proposal
length_mm = 128.742
north_allowance_mm = 6.0
south_grip_mm = 28.0
origin_mm = [-25.4, -6.0, 52.2]
axis = [0.0, 1.0, 0.0]
section_axis = [1.0, 0.0, 0.0] # axis cross section_axis = model-Z
as_is_faces = []
note = "AUTHOR'S CHOICE: proposed purchase/sawn rectangular2x3in flat bar, modelX[-25.4,25.4],Z[-24.0,52.2],Y[-6,122.742]. Contains bodyR20.955, headR21.336, cone with0.20 cap allowance (extreme|X|13.185222,|Z|22.60475215), common crank capsZ[-21.5753,50.8591]. Section margins: cone low-Z1.39524785, crank high-Z1.3409, head low-Z2.664. Offset centroidZ14.1 from body axisZ0 via independent four-jaw contacts. Rotating corner radius58.05170109, diameter116.1034022 is SWING ONLY, never material/contact diameter or stiffness. Low-carbon steel is a proposal; actual material/heat/certificate, ownership/allocation, incoming dimensions/straightness, fixtures/tools/poses/bindings/calibration unknown. Qualify source/allowance containment, contacts/reach, imbalance, interrupted cuts and swept clearance; no example inventory or observations adopted."
cite = ["AUTHOR'S CHOICE: nominal2x3in purchase candidate, offset envelope and allowances", "harmonic-analyzer/cad/scripts/dt_cone_pivot_post_spec.py:post_envelope.BLOCK_DIA,HEAD_DIA,BLOCK_HEIGHT,CONE_BOSS_LENGTH,CRANK_BOSS_START_Z,CRANK_BOSS_END_Z,CRANK_BOSS_DIA"]

# Existing shaft convention: X diametric, Z toward the exposed end. The EL400
# is only a manual reference; its installation on this lathe remains unknown.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false # AUTHOR'S CHOICE: a physical10mm X jog displays20mm on the lathe
[dro.direction]
x = "away_from_spindle_axis" # AUTHOR'S CHOICE; verify each machine's positive sense
y = "away" # AUTHOR'S CHOICE: existing EL400 positive mill-Y convention
z = "toward_exposed_end"

# Owner-selected common manufacturing axis, centred in the permitted printed
# separation band. The original CAD/manifest and setup frames stay unchanged.
# Native placement proof must preserve boss/bore concentricity and head support.
[axis_placements.crank]
