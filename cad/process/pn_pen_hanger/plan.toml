[[setups]]
machine_kind = "other"
title = "Saw and mic the blanks; the spoil plate"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "A length of the 1/8 x 1-1/2 in flat marked into the 7.0 in strap blank and two 1.75 in plate blanks with kerfs between; beside it the 1/2 x 6 in aluminium flat with a 1.40 in strip marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw the strap's blank at least {{process.blank_length_in:.2f}} long (aim 7.05) and two plate blanks {{process.plate_blank_length_in:.2f}}–{{process.plate_blank_length_max_in:.2f}} long (aim 1.77) off the end of a 72 in length of the 1/8 x 1-1/2 in flat, each marked off with the tape. File the burrs off every sawn end."
feed = "hand"
inspection = "Strap blank at least {{process.blank_length_in:.2f}} long (the tape): the 6.380 strap with .31 at its top end and at least .30 past its foot for the frame. Each plate blank {{process.plate_blank_length_in:.3f}}–{{process.plate_blank_length_max_in:.3f}} (the calipers): PH02 cuts plate 2 at a fixed place, 1.775 from X0, and the blanks are butted, so blank 1's length sets plate 2's frame ends; inside this band every frame end keeps at least .18 past the cutter. Shorter: saw another; longer: file it down."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{process.plate_blank_length_min_mm}}", "{{process.plate_blank_length_max_mm}}"] },
]

[[setups.operations]]
instruction = "Mic each of the three blanks' thickness at both ends and the middle. Mark one wide face of the strap blank BACK with marking fluid; mark the plate blanks 1 and 2."
inspection = "Every reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}}: the drawing's 1/8 CF FLAT as supplied (no face is machined). Outside: saw another blank from another part of the bar."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw a 1.40 in strip across the end of the 1/2 x 6 in 6061 flat (the spoil plate, 1.40 x 6 in: narrower than the 1-1/2 in bar, so the jaws grip the bar, not the plate). File its burrs; it lies 6 in along X, 1.40 across the jaws."
feed = "hand"
inspection = "Width 1.35–1.40 (the calipers): at least .05 under the bar each side. Wider: file it down."
gauge_checks = [{ gauge = "calipers", band_mm = [34.29, 35.56] }]

[[setups]]
machine_kind = "other"
title = "Strap: screw hole and outline on tabs"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the bed of the 6 in PM vise (shop vise-pm-6; jaws 6.25 wide), one against each jaw; the spoil plate on them, 6 in along X. The strap blank on the spoil plate, BACK up, its two as-supplied edges in the jaws, centred along the jaws by eye (about .40 past each jaw side). The spoil plate is shorter than the strap: slide it along under the blank until its left end is .05–.15 inside the blank's left end (a rule), so it lies under the strap's top end and the screw hole; the foot end is cut over air. Close the vise snug, tapping the blank down: the strap hangs on its tabs in the blank's frame, and the frame's two long strips carry the grip; do not crank it."
datum = "Program PH01_strap (T1, T2, T3). G54: X0 the blank's left end (the strap's top end .315 in from it), Y0 the fixed jaw's face, Z0 the spoil plate's top. +X toward the blank's right end (the strap's foot), +Y toward the fixed jaw: the strap lies at −Y, its outer edge toward the fixed jaw."
diagram = { file = "diagrams/strap.svg", alt = "Plan view: the strap blank across the jaws on the spoil plate, back face up, the strap's tapering outline drawn in it with the top end to the left, the screw hole near the top end's outer corner, seven tabs along each long edge; the jaws on the blank's long edges, the blank's ends past the jaws' sides." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.eighth_cutter_dia_mm}}", "{{process.eighth_cutter_dia_mm}}", 5.08], y_span_mm = [38.1, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.drill_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_15_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = 38.1, along_jaws_mm = "{{process.blank_length_min_mm}}", part_height_mm = "{{process.blank_thickness_min_mm}}", parallel_height_mm = "{{process.support_height_mm}}", overhang_mm = ["{{process.jaw_start_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = ["{{process.strap_start_mm}}", "{{process.strap_end_mm}}"], seat = "the blank's frame, gripped along its edges by the jaws; the strap hangs on its tabs in it, its top end over the spoil plate, its foot over air", seat_mm = [0, "{{process.blank_length_min_mm}}"], clamps_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { y = "{{process.strap_width_min_mm}}", z = "{{process.blank_thickness_min_mm}}" }, tabs = { stations_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { x = "{{process.tab_width_mm}}", z = "{{process.tab_thickness_mm}}" }, length_mm = "{{process.eighth_cutter_dia_mm}}" } }

[[setups.operations]]
instruction = "Home ($H). Put the two 1 in parallels on the vise bed, one against each jaw, and the spoil plate on them, roughly centred along the jaws; close the vise on a scrap of the 1-1/2 in bar laid on the spoil plate, just snug."
feed = "hand"

[[setups.operations]]
instruction = "The jaws' top above the spoil plate's top."
inspection = "Jaws' top {{process.jaw_top_min_mm:in.3dot}}–{{process.jaw_top_max_mm:in.3dot}} above the spoil plate's top (the calipers' depth rod, at both ends of each jaw; the 1/2 in plate on 1 in parallels reads about .270): the jaws grip the bar's whole thickness. Outside: check the parallels' heights and the plate; stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.jaw_top_min_mm}}", "{{process.jaw_top_max_mm}}"] }]

[[setups.operations]]
instruction = "G54 Z0 on the spoil plate's top: console M6 T3 (1/8 in end mill, at least .55 in out of the collet); spindle stopped, its tip just dragging a .002 feeler leaf on the spoil plate beside the scrap. This Z0 stays for Setup 3."
instruction_detailed = "Console M6 T3 (the tool setter measures it). Spindle stopped, the T3 tip just dragging a .002 feeler leaf on the spoil plate's top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0 the fixed jaw's face: edge finder (900 rpm), from the −Y side, the scrap removed. This Y0 stays for Setup 3."
instruction_detailed = "Open the vise, lift the scrap out. Edge finder (900 rpm), its tip .10 below the jaw top, touched on the fixed jaw's face from −Y: G10 L20 P1 Y-2.540."
feed = "hand"

[[setups.operations]]
