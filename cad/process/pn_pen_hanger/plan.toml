[[setups.operations]]
speed_kind = "other"
tool = "feelers"
drilling = "none"
sizing = "other"
instruction = "Drawing note 2 and the slots' clearance, on the pen rod MHA-PN-04: hold the hanger upright by the strap's edges, its top end up and the plates' slots facing you, and lower the rod into the upper plate's slot from above. Then lay the {{cad.slots_fit_feeler_in:.3dot}} feeler leaf flat on one side of the rod and try rod and leaf together into each slot, at its mouth and at its floor."
inspection = "The rod slides down through both slots under its own weight; with the {{cad.slots_fit_feeler_in:.3dot}} leaf beside it, it enters neither slot (the drawing's CLEARANCE {{cad.slots_fit_feeler_in:.3dot}} MAX). Tight, or rod and leaf enter a slot: stop and tell the owner."
gauge_checks = [{ gauge = "feeler-gauges", band_mm = [0, "{{cad.slots_fit_feeler_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "Black oxide: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished hanger, as inspected, to be blackened all over: the strap, the plates, the slots and the screw hole." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, all over (no masking). Done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9; the chemical-resistant gloves and safety glasses are those bought for Setup 5."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the hanger with soap and water to take off the oil; rinse and dry it. Hold it by the strap's edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "No sanding: the faces are the bar's mill finish and the machined edges are fresh metal (the maker's step 1). Mill scale or a rust spot only: touch that spot lightly with the 220 roll, never on the bond lines. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface with even, light strokes, into the screw hole and both slots and along the bond lines; re-wet the brush and go over the edges and any light spot until the hanger is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part), flushing the slots and the corners at the bond lines; dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over, no bare spot and no wiping-off coating. Fit after blackening: the pen rod MHA-PN-04 still slides down through both slots under its own weight; neither plate moves by hand. Tight or a plate moves: stop and tell the owner."
gauge_checks = "other"
