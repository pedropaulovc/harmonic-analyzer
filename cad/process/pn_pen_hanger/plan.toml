[[setups]]
machine_kind = "other"
title = "Bond the plates (Loctite 638), 24 h cure in the vise"
machine = "PM-30MV vise, swivel off (no spindle)"
indexing = "none"
holding = "The vise bare (no parallels on the bed). The support 1-2-3 block laid flat on the bed, 1 in high, its 3 in length along the jaws, its 2 in width against the fixed jaw, its left end 1.40 left of the jaws' centre. The strap on it, FRONT up, its foot to the left, its foot end .10 past the support block's left end, its outer foot corner against the fixed jaw. Beside the strap's inner edge, one 1/2 in parallel (1/8 thick: the strap's thickness) laid flat on the support block along the jaws. A screw jack on the bed under the strap, about 4.3 in from the foot, run up to just touch the strap's back (the strap then lies level on the block and the jack, not tipping). The 1.000 gauge block stands 35 mm (1.38) tall on its 1.000 x 9 mm end, one 35 x 9 mm side flat on the fixed jaw, its 1.000 x 35 mm face against the strap's foot end and the lower plate's outer face: it squares the foot end to the jaw (the strap's angle, and with it the upper plate's overhang) and flushes the lower plate. The plates stand on their B ends on the strap's front, their outer sides against the fixed jaw: the lower one at the foot, the upper one 1.440 above it (the gauge-block stack .950 + .350 + .140 between them). The second 1-2-3 block (the packing) lies on its 2 x 3 face on the strap's front and the parallel, 1 in high (its top about .03 above the plates' far ends), 2 in across the jaws, its 3 in length along the jaws from the foot end (centred along the jaws), against both plates' inner sides; the moving jaw closes on it."
datum = "None (no NC). The fixed jaw squares both plates to the strap's outer foot corner; the 1.000 gauge block on the jaw squares the foot end and flushes the lower plate; the gauge stack sets the upper plate."
diagram = { file = "diagrams/bond.svg", alt = "Plan view: the strap front up on a 1-2-3 block in the vise, its foot to the left; the two plates standing on it against the fixed jaw, the gauge stack between them, the packing 1-2-3 block between the plates and the moving jaw, the 1.000 gauge block against the fixed jaw across the foot end and the lower plate's outer face; a screw jack under the strap's far end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Put on the chemical-resistant gloves and the safety glasses (to buy before this setup). Degrease the plates' B ends and the strap's front where each plate sits (from the foot end to 1.25 in up, and from 4.55 to 4.95 in below the top end) with the Birchwood Casey Cleaner-Degreaser (to buy), both faces of every joint, and let them dry; from here on touch none of them."
feed = "hand"

[[setups.operations]]
instruction = "Wrap one layer of plain paper smoothly over the 1.000 gauge block's 1.000 x 35 mm face: the paper keeps the 638 off the block, and one layer under both the foot end and the plate keeps them flush."
feed = "hand"

[[setups.operations]]
instruction = "Dry fit: set up the support block, the strap, the jack, the 1.000 block, the plates, the gauge stack (.950 + .350 + .140, wrung) and the packing block as in Holding. Push the strap's foot end lightly against the 1.000 block (a finger on its top end) and close the vise snug on the packing block."
inspection = "The lower plate flush with the strap's foot end (the 1.000 block bears on both, no light between) and with both foot corners (a fingernail drawn across each corner feels no step); the foot end on the 1.000 block, which lies flat on the fixed jaw; both plates' outer sides on the fixed jaw; the stack touches both plates' facing faces; the upper plate's overhang: beside its top-end face, a .050 feeler stack enters between the fixed jaw and the strap's outer edge and a .070 stack does not ({{cad.guide_plates_upper_overhang_min_in:.3dot}}–{{cad.guide_plates_upper_overhang_max_in:.3dot}}). Any of these off: loosen, reseat, and check again; still off: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Open the vise .02 in. Without moving the strap or the 1.000 block, lift each plate, put one thin bead of Loctite 638 along the middle of its B end, stopping .03 short of its outer and facing edges (no more than covers it when pressed), stand it back in place, the stack between, and close the vise snug again, the strap's foot end pushed lightly against the 1.000 block as in the dry fit."
feed = "hand"

[[setups.operations]]
instruction = "Check the seat again at once, the stack still in; then slide the gauge stack out from between the plates within 2 min of closing the vise (the jaws now hold both plates; the stack must not stay beside the 638 at their feet). Wipe any squeeze-out off the plates' sides and facing faces and the jaw with a dry cloth. Keep a finger's light push on the strap's top end toward the 1.000 block for 30 min."
inspection = "Before the stack comes out: the lower plate flush with the foot end and both corners, the foot end on the 1.000 block, both plates on the fixed jaw, the stack touching both; beside the upper plate's top-end face a .050 feeler stack enters between the jaw and the strap's outer edge and a .070 stack does not. Off: correct it now, before the stack comes out."
gauge_checks = "other"

[[setups.operations]]
instruction = "After 1 h: slide the 1.000 block out gently, without disturbing the plates or the strap, and peel its paper off; paper held at the joint line: tear it away and scrape the residue off the foot end and the lower plate's outer face with the deburring tool, keeping them flush. Wipe the gauge stack and the block with the degreaser, then oil them. Leave the vise closed and untouched for the rest of the 24 h cure."
feed = "hand"

[[setups.operations]]
instruction = "At 24 h from the bond: the cure is done (drawing note 2: slots after the 24 h cure). Leave everything clamped for Setup 6."
inspection = "No 638 wet at any joint's edge (a toothpick); no gap at either plate's B end (light behind it). Wet or a gap: stop and tell the owner."
gauge_checks = "other"

