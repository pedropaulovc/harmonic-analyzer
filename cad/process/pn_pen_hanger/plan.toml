# Pen hanger MHA-PN-02 (qty 1), routed for the CNC mill (owner ruling
# 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). A built-up
# part: the strap and two guide plates, all 1/8 in 1018 CF flat as supplied
# (no face machined), the plates bonded to the strap's front with Loctite
# 638 (drawing note 1), then both slots cut in line after the 24 h cure
# (note 2).
#
# Stock (CncFlatA ruling 2026-11-22, no rotation): every piece from the
# owned 1/8 x 1-1/2 in 1018 CF flat (stock.1018-flat-1-8x1-1-2, 4 × 72 in on
# hand): the strap's blank 7.00-7.10 in long, and two plate blanks
# 1.75-1.80 in long, each its own blank (prechips flat_bar blank groups:
# the plate group is guide_plates, two alike). The placeholder's 1/8 x 3/4
# in bar is not used: the strap is .870 wide along the bar's width.
#
# Route: Setup 1 saw the three blanks and a 1.40 x 6 in spoil plate off the
# 1/2 x 6 in 6061 flat (stock.6061-flat-1-2x6-54in) and mic the blanks.
# Setup 2 (PH01): the strap blank flat on the spoil plate on two 1 in
# parallels, back face up, gripped on its two as-supplied edges: spot and
# drill the #15 screw hole, then the strap's outline on fourteen tabs (seven
# on each long edge). Setup 3 (PH02): the two plate blanks end to end the same
# way: each plate's outline on four tabs (two on each long side). Setup 4,
# bench: saw the parts off their tabs, file the stubs, deburr, inspect.
# Setup 5, in the mill's vise (no spindle): degrease, bond the plates to the
# strap's front with Loctite 638, the lower plate flush with the foot and
# both corners against a gauge block, the upper one set from the lower by a
# gauge-block stack; 24 h cure in the clamping. Setup 6 (PH03), the same
# clamping: the strap's rise and the upper plate's drop read on the DRO,
# then both slots in line in one set of passes with the 3/16 in end mill.
# Setup 7, bench: deburr, try the slots on the pen rod with a .007 feeler
# leaf, check the bond by hand. Setup 8: black oxide in the shop, Presto
# Black Steel PC9.
#
# Workholding: the vise only (no drawn fixture). The blanks lie on a spoil
# plate cut from the 1/2 x 6 in 6061 flat's free remainder (the channel
# lever's precedent, ch_channel_lever Setup 2), narrower than the bar so the
# jaws grip the bar only. The parts hang on tabs in their blanks' frames
# (frame strips at least .18 wide past the cutter, cam.py checks): the
# strap, 6.38 in long, is longer than the 6.25 in jaws, so its frame's ends
# stand past the jaws and the jaws' push reaches the strap only through
# the tabs; a snug clamp (Setup 2). The bond and the slots use the two owned
# Taytools 1-2-3 blocks (fixtures.blocks-123), one under the strap, one as
# the packing between the plates and the moving jaw, and one of the owned
# HHIP screw jacks under the strap's free end
# (fixtures.screw-jacks-hhip-3901-0076). The mill is tied up for the 24 h
# cure (Setups 5-6): plan it for a day the mill is not needed.
#
# FLAGGED: to buy: the Birchwood Casey Cleaner-Degreaser
# (consumables.cleaner-degreaser-birchwood-casey, to_order) and the gloves
# and glasses (consumables.chemical-gloves-eye-protection, to_order), both
# needed from Setup 5; the PC9 (consumables.presto-black-steel-pc9,
# to_order). The slots are made to the pen rod MHA-PN-04 (owner ruling
# 2026-11-24, fit audit, MHA-PN-02.guide_slots: no pin gauges), so the rod
# is made before Setup 7. Owned and used: the 3/16 in carbide end mill
# (tools-cutting endmill-carbide-3fl-3-16, 2 on hand; shop record added in
# shop/pn.toml), Loctite 638 (consumables.loctite-638, on hand), the
# Mitutoyo 81-piece gauge-block set, the two Taytools 1-2-3 blocks, a screw
# jack, the feeler gauges. The placeholder's 1/8 x 3/4 in bar is dropped
# (above); its #15 drill and 1/8 in end mill stay.
#
# Black oxide: the drawing's finish, matte black oxide, oil sealed (all
# over, no masking), is done in the shop: delegated ruling 2026-11-21
# (Main, owner review #2144, cnc rulings record; precedent:
# ch_channel_lever's header) drops MIL-DTL-13924 from the sheet. Owner
# (Pedro), answered in person 2026-11-21: "Black oxide: cold blackening in
# the shop with Presto Black PC9 is acceptable as the drawing's black
# oxide." Setup 8 blackens the hanger with Birchwood Presto Black Steel PC9
# by the maker's instructions (Presto Black Steel PC9 Instructions, steps 1
# prepare, 2b brush-on, 3 stop, 4 dry, 6 seal; cad/config/shop-equipment/
# consumables.presto-black-steel-pc9, which cites them).
#
# Zeroing: Setups 2-3: Z0 the spoil plate's bare top before a blank goes on,
# touched with T3 (1/8 in end mill) on a .002 feeler leaf, kept for both
# setups (the tool setter measures each M6); Y0 the fixed jaw, edge finder,
# kept for both; X0 the left end of the (left) blank, edge finder. Setup 6:
# X0 the strap's foot end, Y0 the fixed jaw, Z0 the plates' far ends.
#
# NC (cam:pn_pen_hanger, cad/process/pn_pen_hanger/cam.py): PH01_strap,
# PH02_plates, PH03_slots. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 #1 centre drill, T2
# #15 drill, T3 1/8 in end mill, T4 3/16 in end mill.
title = "Pen hanger"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/8 x 1-1/2 in flat (drawing: LOW-CARBON STEEL, E.G. 1018 CF; (.125) 1/8 CF FLAT)"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.1f}} in flat bar (one 72 in length): the strap's blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in and two plate blanks {{process.plate_blank_length_in:.2f}}–{{process.plate_blank_length_max_in:.2f}} in. Spoil plate: a 1.35–1.40 x 6 in piece off the 1/2 x 6 in 6061 flat."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Faces: the strap's back (the drawing's back, away from the plates) and front (the plates' side); every face is the bar's as supplied. Words: the spoil plate is the aluminium plate the blanks lie on (Z0 in Setups 2-3); a frame is what is left of a blank round its part. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) at the start of every mill setup; after a reset, E-stop or stall: home ($H), console M6 for the tool in the spindle, pick up X0 again with the edge finder, then restart the program from its start. The mill stays tied up from Setup 5 to the end of Setup 6 (the 24 h cure). To buy before Setup 5: the degreaser, the chemical-resistant gloves and the safety glasses; before Setup 7: the pen rod MHA-PN-04 made (the slots are tried on it); before Setup 8: the PC9."
shop = "../shop"
stock_refs = ["1018-flat-1-8x1-1-2", "6061-flat-1-2x6-54in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pn_pen_hanger/features.toml"
adapter = "flat_bar"
part = "pn-pen-hanger"

[parameters]
quantity = 1
# The adapter's axes: the strap's length along model Y, its thickness along
# model Z (the plates stand off the front along -Z: their own group).
blank_length_axis = 1
blank_thickness_axis = 2
# The strap's blank: the 6.380 in strap with .31 at its top end (the left
# end in Setup 2) and at least .30 at its foot.
blank_length_in = 7.0
blank_length_max_in = 7.1
blank_length_min_mm = 177.8
blank_length_max_mm = 180.34
blank_width_in = 1.5
blank_thickness_in = 0.125
# The plates (guide_plates, two alike): each its own blank off the same bar,
# the .970 plate centred in it with .39 each end.
blank_groups = ["plate"]
plate_blank_features = ["guide_plates"]
plate_blank_size_fields = ["guide_plates.reach", "guide_plates.width", "guide_plates.thickness_as_supplied"]
plate_blank_count = 2
plate_blank_length_in = 1.75
plate_blank_length_max_in = 1.8
plate_blank_length_min_mm = 44.45
plate_blank_length_max_mm = 45.72
plate_blank_width_in = 1.5
plate_blank_thickness_in = 0.125
# The bar's thickness as supplied (the drawing's 1/8 CF FLAT band,
# strap_front.thickness_band_mm): the incoming-stock gate.
blank_thickness_min_mm = 3.0988
blank_thickness_max_mm = 3.2512
# Holding, Setups 2-3 (shop workholding.vise-pm-6): the spoil plate (1/2 in
# 6061, 1.35-1.40 x 6 in, as sawn) on two 1 in parallels (fixtures.parallels-
# lms-6745), one against each jaw; the blank on it, gripped by its edges.
# The spoil plate is shorter than the strap: its left end .05-.15 in inside
# the strap blank's left end, under the top end, the screw hole and the
# outline's plunge (cam.py checks); the foot is cut over air on its tabs.
parallel_height_mm = 25.4
spoil_plate_thickness_mm = 12.7
spoil_plate_width_mm = 35.56
spoil_plate_length_mm = 152.4
spoil_plate_start_min_mm = 1.27
spoil_plate_start_max_mm = 3.81
support_height_mm = 38.1
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_grip_min_mm = 6.0           # Shop limits.vise_grip_min_mm.
# The jaws' top above the spoil plate's top (Z0): the vise's jaw height less
# the parallels and the plate; Setup 2 gauges it .250-.280.
jaw_top_mm = 6.8453
jaw_top_min_mm = 6.35
jaw_top_max_mm = 7.112
# The strap in its blank (Setup 2): its top end .315 from the blank's left
# end; centred across the bar, its outer top corner .555 from the fixed
# jaw's edge of the bar (cam.py checks both against the frame strips).
top_waste_mm = 8.0
bar_edge_offset_mm = 14.097
# The jaws centred on the blank: their left side from X0.
jaw_start_mm = 9.5631
# The plates in theirs (Setup 3): each centred along its blank, the two
# blanks end to end, the second's plate one mean blank length on.
plate_end_waste_mm = 9.906
plate_pitch_mm = 45.085
plate_jaw_start_mm = -34.8869
# The 1/8 in carbide end mill: each outline in four equal levels from the
# thickest bar's top to .010 into the spoil plate; fourteen tabs on the
# strap (seven per long edge, 6 to 155 mm from its top end, so no run between
# tabs is over 25 mm and neither end overhangs its last tab more than 7.1 mm;
# the last stays off the lower plate's seat at the foot) and two on each
# long side of each plate, a quarter of its length in from each end, all
# .100 wide and .050 thick on the bar's
# underside. Plunges into metal at 1 in/min.
eighth_cutter_dia_mm = 3.175
outline_levels = 4
outline_level_mm = 0.8763
outline_through_mm = 0.254
tab_thickness_mm = 1.27
tab_top_mm = 1.27
tab_width_mm = 2.54
tab_pitch_max_mm = 25.0
# The strap's tab stations from X0 (its top end at top_waste_mm), and plate
# 1's (plate 2's are one plate_pitch_mm on).
strap_tabs = 7
tab_station_1_mm = 14.0
tab_station_2_mm = 39.0
tab_station_3_mm = 64.0
tab_station_4_mm = 89.0
tab_station_5_mm = 114.0
tab_station_6_mm = 139.0
tab_station_7_mm = 163.0
plate_tab_station_1_mm = 16.0655
plate_tab_station_2_mm = 28.3845
strap_start_mm = 8.0
strap_end_mm = 170.052
# The strap's section between tabs: its narrowest width (the foot) and the
# bar's thinnest thickness.
strap_width_min_mm = 12.192
# Holes: spot Ø.080 with the #1 carbide centre drill on the thinnest bar's
# top (under the #15), the #15 through in pecks of one diameter with full
# retracts, its full diameter .020 into the spoil plate.
spot_dia_mm = 2.032
spot_z_mm = 1.1795
drill_past_mm = 0.5
drill_tip_mm = -1.8736
# Speeds: LittleMachineShop "Cutting Speeds", Drilling & Reaming, Plain
# carbon steels 1006-1026 (read 2026-11-20, as ch_channel_lever): drilling
# 60-100 ft/min. The #15 (.180) at 1700 rpm (80 ft/min), .002 in/rev (the
# channel lever's #21 rate) = 3.4 in/min; the #1 centre drill at 2800,
# .0005 in/rev = 1.4 in/min (the channel lever's). The end mills at their
# shop settings: the 1/8 in at endmill-carbide-3fl-1-8-1018-cf-tru-edge,
# the 3/16 in at pn-em-3-16-1018-cf (shop/pn.toml).
spot_rpm = 2800
spot_feed_per_min_mm = 35.56
drill_rpm = 1700
drill_feed_per_min_mm = 86.36
em_rpm = 2800
em_feed_per_min_mm = 213.36
plunge_feed_per_min_mm = 25.4
slot_rpm = 2800
slot_feed_per_min_mm = 234.696
# Setups 5-6 (the bond and the slots, one clamping): the strap's back on a
# 1-2-3 block laid flat (1 in high, 3 in along the strap under both plates'
# seats), its outer foot corner and both plates' outer sides against the
# fixed jaw; the second 1-2-3 block standing on the strap's front (1 in
# high, 2 in across the jaws, 3 in along) against the plates' inner sides,
# the moving jaw on it. The upper plate's seat from the lower's: a
# gauge-block stack 1.440 in (.950 + .350 + .140) between their facing
# faces; the set's 1.000 block squares the foot end to the fixed jaw.
support_block_mm = 25.4
packing_block_mm = 25.4
packing_width_mm = 50.8
packing_length_mm = 76.2
plate_gap_mm = 36.576
slot_jaw_start_mm = -41.2369
# The jaws' top and the packing block's top from Z0 (the plates' far ends).
slot_jaw_top_mm = -8.2677
packing_top_mm = 0.762
# The slots: the 3/16 in end mill on two passes .00675 either side of the
# centre line (.2010 wide, the band's middle), through both plates in line,
# in 22 equal levels to the drawn depth (.019 each).
slot_cutter_dia_mm = 4.7625
slot_offset_mm = 0.1715
slot_width_mm = 5.1055
slot_levels = 22
slot_level_mm = 0.4849
slot_level_max_mm = 0.508
slot_depth_mm = 10.668
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/8 in end mill, 1-1/2 in overall: at least .55 in out (its 1/2 in flutes
# clear and the collet's nose over the jaws); 3/16 in, 2 in overall: at
# least .70 in out (its 5/8 in flutes clear, the nose over the packing
# block); the drills at least 1.00 in out of the chuck. The #15 jobber is
# under 4 in overall (ASME B94.11M: the D, .246, is 4 in).
eighth_projection_min_mm = 13.97
slot_projection_min_mm = 17.78
drill_projection_min_mm = 25.4
drill_15_oal_mm = 101.6
# The strap's and the plates' heights in Setups 5-6: the support block and
# the strap, the strap and a plate's reach.
bond_seat_mm = 28.575
assembly_height_mm = 27.813

