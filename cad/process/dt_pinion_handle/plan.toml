# Pinion grip cross rod MHA-DT-15, one off (owner ruling 2026-11-21: turned
# parts get lathe travelers, no NC; bench and trivially cut parts get
# travelers too). Route chosen for speed: the fewest honest steps. Nothing is
# turned: the 1/4 in cold-finished bar is used as received (drawing note and
# the REF 1/4 diameter). Each end is faced on the manual PM-1127VF-LB with
# under 3 diameters out of the 3-jaw (the shop's unsupported stickout limit;
# the 2.56 rod parted off the bar would stand 2.8 out), so the rod is sawn,
# not parted. Setup 1 at the saw: a 2.60 piece off the 72 in bar on hand.
# Setup 2: one sawn end faced (Z0), the rest of the piece inside the chuck
# and spindle bore. Setup 3: turned round, the other end faced to the
# 2.55-2.57 length, measured between skims. Bench: break the edges, check the
# length, oil (FINISH: mill bright, machine-oil film). A lathe face, not the
# placeholder's file, squares both ends (registry: cut and face).
title = "Pinion Grip Cross Rod"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel round, 1/4 in (drawing: 1018, 1020 or 12L14 CF, 1/4 in)"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} bar, the 72 in bar on hand; the rod takes a {{process.saw_length_in:.2dot}} in piece of it."
shop = "../shop"
stock_refs = ["1018-round-1-4"]
material_key = "lathe-1018-cold-finished"

standing = true

[cad]
file = "../../out/features/dt_pinion_handle/features.toml"
adapter = "turned_bush"
part = "dt-pinion-handle"

[parameters]
quantity = 1
stock_dia_in = 0.25
# The sawn piece: the 2.56 rod and a facing allowance off each end, which
# also take up the saw's squareness.
saw_length_in = 2.60
# Facing allowance: squares the sawn end faced first.
face_allowance_in = 0.02
# Left on the other sawn end for Setup 3 to face the rod to length.
regrip_allowance_in = 0.02
# The saw's kerf (authored; the blade is not measured on record).
part_kerf_in = 0.09
# How much of the piece is inside the chuck in Setups 2 and 3: all but a
# short end, the rest running into the spindle bore past the jaws.
regrip_grip_in = 2.3

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw: a 2.60 piece off the bar"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, clamped in the saw's vise, its end free beyond the blade."
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "Plan of the saw bed: the 1/4 bar in the vise, the blade on the far side of a line 2.60 from its end." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe the bar {{process.saw_length_in:.2dot}} in from its end and saw on the far side of the line, the bar clamped in the saw's vise; let the piece drop clear onto the saw base and pick it up only after the blade has stopped. File the burrs off both sawn ends."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Lathe: face the first end"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the Ø{{process.stock_dia_in:.3dot}} piece (the jaws close on the rod's as-received O.D.), {{cad.outer_stickout_datum_mm:in.2dot}} in out of the jaw fronts; the rest of the piece runs back through the jaws into the spindle bore."
datum = "Z0 (carriage DRO) the end faced in Op 20."
diagram = { file = "diagrams/bar.svg", alt = "The 1/4 in piece in the 3-jaw over a shim wrap with little out: one sawn end faced square." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_datum_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the sawn end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Lathe: turned round, face to length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the piece turned round, the faced end in the jaws and on into the spindle bore; the sawn end {{cad.outer_stickout_far_mm:in.2dot}} in out of the jaw fronts."
datum = "The Op 20 face, inside the chuck: the length is measured across both faces."
diagram = { file = "diagrams/second-end.svg", alt = "The piece turned round, the faced end in the jaws over a shim wrap: the sawn end faced to the rod's length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_far_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the sawn end square in light cuts toward the {{cad.length_nominal_in:.2dot}} length: between cuts, stop the spindle, take the rod out and caliper it across both faces, then chuck it again over the shim. Stop inside {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}; Op 50 is the acceptance."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: break the edges, check the length, oil"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished rod: its 2.56 length and the 1/4 bar outside as received." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break both end edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, without rounding the faced ends' flats."
feed = "hand"

[[setups.operations]]
instruction = "Measure the length across the ends with calipers."
inspection = "Length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Over {{cad.length_max_in:.2dot}}: face it again as in Setup 3, then repeat Ops 40 and 50. Under {{cad.length_min_in:.2dot}}: scrap it, not reworked; make another by repeating Setups 1 to 3 on the bar."
feed = "hand"

[[setups.operations]]
instruction = "Wipe the rod with an ISO VG 32 machine-oil film (FINISH: mill bright, oil film) and bag it with its number."
feed = "hand"
