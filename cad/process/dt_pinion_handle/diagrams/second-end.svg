<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 200 px/in along and across the axis: the Ø.250 piece (cad.stock_dia_mm), 2.60 sawn (process.saw_length_in), the jaw fronts 0.26 behind Z0 (cad.outer_regrip_jaw_z_datum_mm), the sawn end .28 out (cad.outer_stickout_far_mm), the Op 20 face inside the chuck. The AR holder and insert are schematic (no size on record), its point on the face it cuts. The 3-jaw's body and jaws are schematic (their sizes are not on record). The brass shim wrap's thickness is not on record: drawn 2 px. The piece's far end runs on through the jaws into the spindle bore. Hatched: the 0.02 left over the 2.56 length (cad.length_mm), faced off in light cuts. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 3, Op 30: turned round, the AR tool faces the sawn end to the 2.56 length (to scale, 200 px/in)</text>
  <rect class="fixture-vise" x="492" y="107" width="56" height="146"/>
  <rect class="part-kept" x="128" y="155" width="512" height="50"/>
  <rect class="part-removed" x="640" y="155" width="4" height="50"/>
  <rect class="clamp" x="548" y="119" width="40" height="34"/>
  <rect class="clamp" x="548" y="207" width="40" height="34"/>
  <rect class="fixture-support" x="548" y="153" width="40" height="54"/>
  <rect class="part-kept" x="548" y="155" width="40" height="50"/>
  <line class="centre-line" x1="20" y1="180" x2="740" y2="180"/>
  <line class="datum" x1="128" y1="139" x2="128" y2="221"/>
  <path class="cutter" d="M640 188L670 200L670 298L662 295L654 298L646 298L646 212Z"/>
  <line class="arrow" x1="688" y1="258" x2="688" y2="208"/>
  <text class="datum-label" x="134" y="133">the Op 20 face, inside the chuck</text>
  <line class="dims" x1="128" y1="300" x2="640" y2="300"/>
  <line class="dims" x1="128" y1="292" x2="128" y2="308"/>
  <line class="dims" x1="640" y1="292" x2="640" y2="308"/>
  <text class="label" x="148" y="324">length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}} across both faces, calipered off the chuck</text>
  <text class="label" x="470" y="270" text-anchor="end">AR tool: face to length</text>
  <line class="leader" x1="472" y1="266" x2="658" y2="258"/>
  <circle class="leader-dot" cx="658" cy="258" r="2"/>
  <text class="label" x="260" y="60">3-jaw over the brass shim wrap; the sawn end {{cad.outer_stickout_far_mm:in.2dot}} out</text>
  <line class="leader" x1="330" y1="66" x2="568" y2="123"/>
  <circle class="leader-dot" cx="568" cy="123" r="2"/>
</svg>
