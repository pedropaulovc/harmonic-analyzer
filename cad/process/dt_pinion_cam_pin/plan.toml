# Pinion cam pin MHA-DT-25, two off, on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: the O.D. is the 5/32 O1 ground drill rod as supplied (the
# drawing's Ø.1558-.1568 band is the rod's own; registry: cut from drill rod,
# crown turned), so nothing is turned on the diameter. The 3-jaw closes no
# smaller than Ø.1750 (owner 2026-11-24; shop workholding.chuck-3jaw-6), so
# the Ø.156 rod is never gripped in the jaws (#3499): Setup 2 makes a split
# bush from the 1/2 in brass bar on hand, drilled #21 through in the 3-jaw
# and slit, a nick on its rim against jaw 1, as the MHA-PD-23 traveler makes
# one (delegated ruling 2026-11-27 (Main), precedent: the transgear pin's
# split bush, #3494; owner review #2144 (D57)); the jaws grip the bush's
# Ø.50 and the bush closes on the rod, brass on the ground O.D. No reamer:
# the #21's .159 clears the rod's .1558-.1568 by .002-.003, which the slit
# closes. Each pin is a blank sawn a little long, faced at end A (the flat
# datum end) with under 3 diameters out of the bush (the shop's unsupported
# stickout limit: a .82 pin parted off the rod would stand over 5 diameters
# out), then turned round in the same bush: end B faced to the faced length
# (the root station plus the crown's height, the apex staying on the faced
# plane) and crowned with the LittleMachineShop 2569 ball turner swept to
# R.125, inside the drawing's R.11-.13 band. Bench: break end A's edge, look
# for marks (the O.D. is accepted at Op 10 and never cut), oil.
#
# The bush goes back into the 3-jaw by its nick after it is slit, so its bore
# runs out by the drill's drift and the chuck's repeatability (not measured:
# #3754); no printed size of this pin reads it (an off-centre crown changes
# its height reading by about the offset, against a .0064 band). The
# tailstock chuck that carries the centre drill and the drill is not on
# record either (#3754).
#
# The crown: owner ruling 2026-11-23 (tool audit Q5, option D): "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569,
# $124.95; convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file
# is the fallback for any dome it cannot reach. Confirm each dome is convex
# and reachable before buying." Reach test: the crown is convex, ball Ø.25
# (2 x R.125) under the tool's .75; end B is free (no centre); the .40
# stickout holds the crown's centre .40 - .13 = .27 out of the split bush's
# face, which stands .10 proud of the jaw fronts (the frame's arms need .25:
# R.13 + .25 = .38 at the band's top) and stays under 3 x Ø.156 = .47;
# nothing over Ø.75 near it. Reachable. The radius is set
# once on a trial offcut and checked with the radius gauges' 1/8 leaf, the
# one leaf inside R.11-.13. A crown .03 high or less is swept from the square
# corner (no roughing chamfer).
#
# The 5/32 O1 drill rod is on hand (cad/config/shop-equipment/
# stock-bought.toml o1-drill-rod-5-32, McMaster 8893K162, 36 in, PO
# 1103PCAMPOS). Flagged: the ball turner (shop/lathe.toml
# tools.ball-radius-turner-lms-2569), the radius gauges
# (gauges.radius-gauges) and the junior hacksaw that slits the bush are to
# order. The O1 lathe settings in shop/dt.toml are LittleMachineShop's
# low-end O1 row.
title = "Pinion Cam Pin"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI O1 drill rod, precision ground, 5/32 in"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.4dot}} ground drill rod, the 36 in rod on hand; one blank {{process.blank_length_in:.2dot}} in long per pin and one {{process.trial_offcut_in:.2dot}} in trial offcut (allow a saw kerf each). For the split bush that holds them: a {{process.bush_length_in:.2dot}} in piece of the Ø{{process.bush_dia_in:.2dot}} C360 brass bar on hand."
shop = "../shop"
stock_refs = ["o1-drill-rod-5-32", "c360-round-1-2"]  # the brass is the split bush's (#3499)
material_key = "lathe-o1-drill-rod"

standing = true

[[notes]]
title = "This job"
rows = [
  ["O.D.", "The O.D. is left as supplied: the ground rod's own surface is the drawing's Ra 63 cam contact, so hold it only in the brass split bush and never cut, file or stone it."],
]

