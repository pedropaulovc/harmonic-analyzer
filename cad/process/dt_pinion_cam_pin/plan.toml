[parameters]
quantity = 2
stock_dia_in = 0.15625
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the crown's height, faced length and sweep
# from it): R.125 on the 5/32 rod is .0274 high, inside the drawing's R.11-.13
# band, and the radius gauges' 1/8 leaf checks it.
dome_form_radius_in = 0.125
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .125 + .1875.
ball_turner_rule_in = 0.3125
# A trial offcut of the same rod, sawn with the blanks, for setting the
# radius: the .40 stickout plus about .6 in the split bush.
trial_offcut_in = 1.0
# The crown's height band read in Op 270, from the drawing's R.11–.13 on the
# Ø.15625 rod (r .078125): .13 − √(.13² − r²) = .0261 and
# .11 − √(.11² − r²) = .0326, printed inward at four places (.0261–.0325);
# the gauge band is the adapter's exact cad.dome_far_height_band_mm.
crown_height_min_in = 0.0261
crown_height_max_in = 0.0325
# Sawn a little over the faced length: about .02 in to face off each end.
blank_length_in = 0.86
as_supplied_outer = 1
# Out of the split bush's face while an end is faced and crowned: under 3 × Ø.
end_stickout_in = 0.4
end_stickout_mm = 10.16
# The split bush (#3499, as MHA-PD-23's): a piece of the 1/2 in C360 bar on
# hand, held on bush_grip_in with the rest out of the jaws, drilled #21
# through, then slit along one side. The 3-jaw grips its Ø.50, inside the
# chuck's measured range. .60 long so a blank's .46 in it lies mostly inside
# the jaws.
bush_dia_in = 0.5
bush_dia_mm = 12.7
bush_length_in = 0.6
bush_length_mm = 15.24
bush_grip_in = 0.5
bush_stickout_mm = 2.54

