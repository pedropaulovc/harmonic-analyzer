# Pinion cam pin MHA-DT-25, two off, on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: the O.D. is the 5/32 O1 ground drill rod as supplied (the
# drawing's Ø.1558-.1568 band is the rod's own; registry: cut from drill rod,
# crown turned), so nothing is turned on the diameter. Each pin is a blank
# sawn a little long, faced at end A (the flat datum end) with under 3
# diameters out of the 3-jaw (the shop's unsupported stickout limit: a .82
# pin parted off the rod would stand over 5 diameters out), then turned
# round: end B faced to the faced length (the root station plus the crown's
# height, the apex staying on the faced plane) and crowned with the
# LittleMachineShop 2569 ball turner swept to R.125, inside the drawing's
# R.11-.13 band. Bench: break end A's edge, look for jaw marks (the O.D. is
# accepted at Op 10 and never cut), oil.
#
# The crown: owner ruling 2026-11-23 (tool audit Q5, option D): "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569,
# $124.95; convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file
# is the fallback for any dome it cannot reach. Confirm each dome is convex
# and reachable before buying." Reach test: the crown is convex, ball Ø.25
# (2 x R.125) under the tool's .75; end B is free (no centre); the .40
# stickout holds the crown's centre .40 - .13 = .27 out of the jaws (the
# frame's arms need .25: R.13 + .25 = .38 at the band's top) and stays under
# 3 x Ø.156 = .47; nothing over Ø.75 near it. Reachable. The radius is set
# once on a trial offcut and checked with the radius gauges' 1/8 leaf, the
# one leaf inside R.11-.13. A crown .03 high or less is swept from the square
# corner (no roughing chamfer).
#
# Flagged: the 5/32 O1 drill rod (stock-to-order.toml o1-drill-rod-5-32,
# McMaster 8893K162), the ball turner (shop/lathe.toml
# tools.ball-radius-turner-lms-2569) and the radius gauges
# (gauges.radius-gauges) are to order. The O1 lathe settings in shop/dt.toml
# are LittleMachineShop's low-end O1 row.
title = "Pinion Cam Pin"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI O1 drill rod, precision ground, 5/32 in"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.4dot}} ground drill rod (to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long per pin and one {{process.trial_offcut_in:.2dot}} in trial offcut (allow a saw kerf each)."
shop = "../shop"
stock_refs = ["o1-drill-rod-5-32"]
material_key = "lathe-o1-drill-rod"

standing = true

[[notes]]
title = "This job"
rows = [
  ["O.D.", "The O.D. is left as supplied: the ground rod's own surface is the drawing's Ra 63 cam contact, so grip it over a brass shim wrap and never cut, file or stone it."],
]

[cad]
file = "../../out/features/dt_pinion_cam_pin/features.toml"
adapter = "turned_shaft"
part = "dt-pinion-cam-pin"

[parameters]
quantity = 2
stock_dia_in = 0.15625
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the crown's height, faced length and sweep
# from it): R.125 on the 5/32 rod is .0274 high, inside the drawing's R.11-.13
# band, and the radius gauges' 1/8 leaf checks it.
dome_form_radius_in = 0.125
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .125 + .1875.
ball_turner_rule_in = 0.3125
# A trial offcut of the same rod, sawn with the blanks, for setting the
# radius: the .40 stickout plus about .6 in the jaws.
trial_offcut_in = 1.0
# The crown's height band read in Op 230, from the drawing's R.11–.13 on the
# Ø.15625 rod (r .078125): .13 − √(.13² − r²) = .0261 and
# .11 − √(.11² − r²) = .0326, printed inward at four places (.0261–.0325);
# the gauge band is the adapter's exact cad.dome_far_height_band_mm.
crown_height_min_in = 0.0261
crown_height_max_in = 0.0325
# Sawn a little over the faced length: about .02 in to face off each end.
blank_length_in = 0.86
as_supplied_outer = 1
# Out of the jaw fronts while an end is faced and crowned: under 3 × Ø.
end_stickout_in = 0.4

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "ball"
name = "Ball turner (LittleMachineShop 2569)"
ref = "ball-radius-turner-lms-2569"
description = "Ball and radius turning tool, small: a bit on an inner frame swung by hand about a vertical pivot; it sweeps the convex R.12 crown"
status = "to_order"

[[tools]]
id = "radius"
name = "Radius gauges (to buy)"
ref = "radius-gauges"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blanks"
machine = "Evolution 14 in metal-cutting saw"
holding = "The rod flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 5/32 drill rod on the saw: a blank sawn a little over the faced length." }

[[setups.operations]]
instruction = "Mike the rod over the length you will cut, at both ends and the middle: every reading {{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}} (the O.D. is left as supplied)."
inspection = "Rod Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
instruction = "A reading outside the band: mark that length scrap and mike the next length of the rod."

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the rod end and saw on the waste side of the line; let the blank drop clear onto the saw base and pick it up only after the blade has stopped. Saw the second blank, then a {{process.trial_offcut_in:.2dot}} in trial offcut, the same way. File the burrs off the sawn ends."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "End A: face"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the ground O.D., {{process.end_stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) end A, faced in Op 40."
diagram = { file = "diagrams/end-a.svg", alt = "A blank in the 3-jaw, end A out: faced square." }
# The 5/32 rod is under the 3-jaw's .1750 least grip (owner 2026-11-24;
# workholding.chuck-3jaw-6): this hold is impossible as written, #3499.
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face end A square, about {{cad.face_stock_per_end_in:.3dot}} in off, to the centre with no pip; set DRO Z0 on it. Face the second blank's end A the same way."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Trial offcut: set the ball turner's radius"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over the brass shim wrap on the trial offcut, {{process.end_stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the offcut's end, faced in Op 50, touched with the ball turner's tip in Op 80."
diagram = { file = "diagrams/trial.svg", alt = "The trial offcut in the 3-jaw over the shim wrap, its end faced; the ball turner's pivot on the axis one radius behind the faced end, its bit swept from the apex toward you." }
# Under the 3-jaw's .1750 least grip, as above: #3499.
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the offcut's end square, about .02 off, to the centre with no pip."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: clamp the ball turner's 3/8 shank in an AXA No. 1 holder, the inner frame swung parallel to the spindle axis. Set the bit's tip level with the tailstock dead centre's point. Take the centre out and run the tailstock back: nothing may stand within 4 in beyond the faced end."

[[setups.operations]]
cut_kind = "other"
instruction = "Set the bit to R{{cad.dome_far_form_radius_in:.3dot}}: lay a 1-2-3 block's ground edge across the inner frame's edges and read the bit's tip from it with the calipers' depth rod: {{process.ball_turner_rule_in:.4dot}} (the radius plus the maker's 3/16 from the frame's end to the pivot). Tighten the bit's set screw."

[[setups.operations]]
cut_kind = "other"
instruction = "Inner frame parallel to the axis: bring the carriage up until the bit's tip just touches the faced end; lock the carriage and zero the DRO Z. The pivot is now one radius behind the faced plane, so the apex stays on it. The carriage stays locked until the crown is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: run the cross slide out until the bit clears the end through the whole sweep. Swing the frame through the sweep and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms (they reach .19 either side of the pivot). If they touch: chuck the offcut {{process.end_stickout_in:.2dot}} in out again and repeat Op 80."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the corner somewhere in the sweep. Sweep the frame from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes: the pivot is then on the axis. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: hold the radius gauges' {{cad.dome_far_form_radius_in:fraction}} leaf (concave) square across the crown through the axis, at two places 90° apart, against a light."
inspection = "Crown R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}}: no light under the {{cad.dome_far_form_radius_in:fraction}} leaf; no pip, flat or ring at the apex."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Light at the leaf's ends (crown too round): reset the bit (Op 70) to a depth-rod reading .005 longer; light at its middle (too flat): .005 shorter. Face the crown off (Op 50), draw the offcut back out to {{process.end_stickout_in:.2dot}} in, and repeat Ops 80–120. Under .30 in left in the jaws: saw a new trial offcut. Once it passes, leave the bit's set screw alone until both pins are crowned."

[[setups]]
machine_kind = "lathe"
title = "End B: face to length, form the crown"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap, end B {{process.end_stickout_in:.2dot}} in out, end A toward the chuck."
datum = "End B's length is read by micrometer across both faces (Op 150). For the crown the DRO Z is zeroed where the ball turner's tip touches end B's faced end (Op 170)."
diagram = { file = "diagrams/end-b.svg", alt = "The blank turned round, end B out: faced to length, then crowned by the ball turner swept about its pivot on the axis." }
# Under the 3-jaw's .1750 least grip, as above: #3499.
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face end B square in light skims toward {{cad.faced_length_in:.3dot}}, reading the length between them (Op 150); stop inside {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}} ({{cad.dome_far_root_station_min_in:.2dot}}–{{cad.dome_far_root_station_max_in:.2dot}} root + {{cad.dome_far_form_height_in:.4dot}} crown, rounded inward)."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, stop the spindle, take the blank out and mike it across both faces, then chuck it again over the shim, end B {{process.end_stickout_in:.2dot}} in out."
inspection = "Faced length {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Faced under {{cad.faced_length_min_in:.3dot}}: scrap the blank and saw another (Setup 1)."

[[setups.operations]]
cut_kind = "other"
instruction = "Ball turner in its holder, bit as set in Op 70 (set screw untouched), inner frame parallel to the axis: bring the carriage up until the tip just touches end B's faced end; lock the carriage and zero the DRO Z. It stays locked until the crown is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: cross slide out until the bit clears end B through the whole sweep. Swing the frame through it and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches end B's corner somewhere in the sweep. Sweep from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: look at the crown under the loupe. The {{cad.dome_far_form_radius_in:fraction}} leaf across it is a guide only (the trial set the radius); Op 230 reads the crown's height."
inspection = "No pip, flat or ring at the apex."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A flat at the apex: the pivot is short of the axis: one more sweep with the cross slide in .001 (Op 190), then Op 210 again. A ring or point at the apex: scrap the pin and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Stand the pin on end A on the surface plate against the 1-2-3 block's face. Height gauge: read the apex. Then lower the scriber .001 at a time, each time sliding its tip in from outside the O.D.: the root is the highest setting at which it catches on the cylindrical O.D. without riding onto the crown. Crown height = apex − root."
inspection = "Root length {{cad.dome_far_root_station_min_in:.2dot}}–{{cad.dome_far_root_station_max_in:.2dot}} from end A; crown {{process.crown_height_min_in:.4dot}}–{{process.crown_height_max_in:.4dot}} high (R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}})."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.dome_far_root_station_band_mm}}" }, { gauge = "height-gauge", band_mm = "{{cad.dome_far_height_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Root length or crown height outside its band: scrap the pin and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Repeat Ops 140–240 on the second blank."

[[setups]]
machine_kind = "other"
title = "Bench: break the edge, check, oil"
machine = "Bench"
holding = "Bench vise with soft jaws, the pin gripped lightly over the brass shim wrap on its O.D., the end being filed just clear of the jaws."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pin: the flat end A, the O.D. as supplied and the R.12 crown at end B." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break end A's edge, and the edge where the crown meets the O.D., R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file; leave the O.D. and the crown's face uncut."
feed = "hand"

[[setups.operations]]
instruction = "Look along the O.D. under a light: no jaw mark or scratch on the Ra 63 cam contact (its size is the rod's, accepted in Op 10; nothing here cuts it)."

[[setups.operations]]
instruction = "A jaw mark or scratch on the O.D.: scrap the pin (the ground surface is not reworked) and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe both pins with a light ISO VG 32 machine-oil film (FINISH: as-received drill rod, oiled) and bag them with their number."
