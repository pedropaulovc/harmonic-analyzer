  <circle class="leader-dot" cx="330" cy="202.34" r="2"/>
  <text class="label" x="500" y="330">Upright on the 1 in parallels, B up,</text>
  <text class="label" x="500" y="346">gripped on the front and back faces,</text>
  <text class="label" x="500" y="362">BK at the fixed jaw, L on the RIGHT.</text>
  <text class="label" x="500" y="378">Hole {{cad.thumb_screw_tap_station_in:.3dot}} from L, {{cad.thumb_screw_tap_z_from_min_in:.3dot}} from BK.</text>
