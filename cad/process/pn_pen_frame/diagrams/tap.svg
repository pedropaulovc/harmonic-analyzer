<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the frame and the tap's diameter to scale at 5 px/mm from the frame's depth (.310, 7.874 mm). 4-40 tap Ø.112 (the thread's major diameter, the hole it makes), its point at tap_reach_mm 10.16 below B (the aim of 9.271-11.43), its arc-ended near face 12 % of its diameter deep. The tap's length, the T-handle wrench and the tap guide's body are not on record: schematic (the guide's 3 1/8 in length bounds the stack, not the picture). Wrench and guide in the tool's colour: they travel with the tap. The window hidden, dashed. The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
  <rect class="paper" x="0" y="0" width="760" height="560"/>
  <text class="title" x="20" y="24">PF08: tap 4-40 by hand under the tap guide, the frame to scale (5 px/mm)</text>
