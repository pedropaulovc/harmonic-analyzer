<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm from the blank's 3/8 in (9.525 mm) thickness. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (an arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out to a break line (half_mill_projection_min_mm 25.4 is a least stick-out; the collet is not drawn). Drawn at PF02's last level, Z40.132 (the height 1.580), on its second pass, Y1.088 (the first, at Y6.100, hangs over the fixed jaw); hatched: the levels from the longest blank's 43.942 (upright_top_max_mm). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
  <rect class="paper" x="0" y="0" width="760" height="520"/>
  <text class="title" x="20" y="24">PF02, across the jaws, to scale (4 px/mm): T down, the bottom end B faced to the height</text>
  <rect class="fixture-vise" x="190.95" y="495" width="218.1" height="14"/>
  <rect class="clamp" x="190.95" y="315.22" width="90" height="179.78"/>
  <rect class="clamp" x="319.05" y="315.22" width="90" height="179.78"/>
