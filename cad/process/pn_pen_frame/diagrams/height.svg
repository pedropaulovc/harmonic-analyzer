  <text class="datum-label" x="236.95" y="398.4" text-anchor="end">Z0 the parallels' top (T)</text>
  <line class="datum" x1="240.95" y1="232.87" x2="276.95" y2="232.87"/>
  <text class="datum-label" x="236.95" y="237.87" text-anchor="end">Z 1.580</text>
