  <text class="label" x="470" y="246">Levels of .050 max down to</text>
  <text class="label" x="470" y="262">the height 1.570-1.590.</text>
  <text class="label" x="470" y="278">The faced end is B: the tap goes in it.</text>
  <text class="label" x="470" y="380">1 in parallel against each jaw</text>
