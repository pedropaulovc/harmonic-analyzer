  <path class="cutter" d="M329.75 226.78L329.75 131.27L325.52 134.27L321.29 131.27L317.05 134.27L312.82 131.27L308.59 134.27L304.35 131.27L300.12 134.27L295.89 131.27L291.65 134.27L287.42 131.27L283.19 134.27L278.95 131.27L278.95 226.78A25.4 6.1 0 0 0 329.75 226.78Z"/>
  <line class="centre-line" x1="300" y1="40" x2="300" y2="515"/>
