  <text class="datum-label" x="294" y="50" text-anchor="end">Y0 the bar's axis</text>
  <text class="label" x="420" y="127.63">1/2 in end mill on the second pass,</text>
  <text class="label" x="420" y="143.63">Y1.088, along X (into the page):</text>
  <text class="label" x="420" y="159.63">.020 off the sawn top; it becomes T</text>
