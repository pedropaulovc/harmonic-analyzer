<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm from the blank's 3/8 in (9.525 mm) thickness. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (an arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out to a break line (half_mill_projection_min_mm 25.4 is a least stick-out; the collet is not drawn). The pass shown is PF01's second, at Y1.088 (the first, at Y6.100, hangs over the fixed jaw); the pass runs along X, into the page. Blank 1.75 in tall (the longest, vise_hold part_height_mm 44.45) on the 1 in parallels (parallel_height_mm, parallel_thickness_mm). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
  <rect class="paper" x="0" y="0" width="760" height="520"/>
  <text class="title" x="20" y="24">PF01, across the jaws, to scale (4 px/mm): the top end T faced, the second pass</text>
