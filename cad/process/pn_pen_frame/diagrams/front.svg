<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="sans-serif" font-size="13">
  <!-- Hand picture, both views to scale at 5 px/mm from the blank's width (1.000, 25.4 mm nominal, drawn at the finished .990). 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (an arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out to a break line (half_mill_projection_min_mm 25.4 is a least stick-out; the collet is not drawn). The cutter on PF05's middle pass, Y-19.045, over the blank (its first pass, Y1.271, hangs over the fixed jaw), the same place in both views; the passes along X step across the jaws. Stacks: the 1 in and 1/2 in parallels of the 1/8 in set (riser_height_mm 38.1, parallel_thickness_mm). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
  <rect class="paper" x="0" y="0" width="820" height="480"/>
  <text class="title" x="20" y="24">PF05: the back face BK skimmed, to scale (5 px/mm)</text>
