<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="sans-serif" font-size="13">
  <!-- Hand picture, both views to scale at 5 px/mm from the blank's width (.990, 25.146 mm). 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (an arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out to a break line (half_mill_projection_min_mm 25.4 is a least stick-out; the collet is not drawn). The cutter on PF06's middle face pass, Y-19.045, at the depth Z7.874 (.310), over the blank, the same place in both views. Hatched in the plan: the window the 1/8 in end mill cuts next (its own picture), X3.302-22.098, Y-6.096 to -34.036 (window_right_mm, window_near_mm, window_far_mm, the side rails .13). Stacks: 1 in + 1/2 in parallels (riser_height_mm 38.1). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
