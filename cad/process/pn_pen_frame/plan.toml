instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the frame, G10 L20 P1 Y-2.540; its tip .10 below B, on L from the right, G10 L20 P1 X2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the bottom end B, touched with the centre drill."
instruction_detailed = "Console M6 T3 (#2 centre drill). MDI G0 X-5.000 Y-3.937. Spindle stopped, its point just dragging a .002 feeler leaf on B: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run PF07_tap_drill (M6 T3, #2 centre drill; set 2800): spot the hole Ø{{process.spot_dia_mm:in.3dot}}, under the #43 drill."
settings = "pn-spot-c360"
milling_cuts = [
  { name = "tap spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.top_face_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-4-40" }
instruction = "Same file, M6 T4 (spindle stopped and the tool lifted: put a drop of Tapmatic Gold on the #43's point now): #43 drill down through the bottom rail into the window, its full diameter {{process.tap_drill_past_mm:in.3dot}} past the rail, pecks of {{process.peck_mm:in.3dot}} with full retract; set 2800. Look through the window: the drill has broken through."
settings = "pn-drill-43-c360"
hole_depth_mm = "{{process.drill_full_depth_mm}}"
peck = { step_mm = 2.032, retract = "full" }
milling_cuts = [
  { name = "tap drill", kind = "drill", phase = "rough", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = "{{cad.top_face_height_mm}}" },
]

[[setups.operations]]
instruction = "Still clamped: mic the #43 drill's shank and stand it shank-down in the hole. The calipers' outside jaws from L over the shank, less half the shank's Ø: the hole from L. The same from BK (it stands above the fixed jaw) over the shank: the hole from BK."
feed = "hand"
inspection = "Hole from L {{cad.thumb_screw_tap_station_min_in:.3dot}}–{{cad.thumb_screw_tap_station_max_in:.3dot}}; from BK {{cad.thumb_screw_tap_depth_station_min_in:.3dot}}–{{cad.thumb_screw_tap_depth_station_max_in:.3dot}} (with the depth inside its band this keeps the thread's wall to each face at least {{process.tap_wall_min_mm:in.3dot}}, the drawing's WALL MIN). Outside either: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.thumb_screw_tap_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.thumb_screw_tap_depth_station_band_mm}}" },
]

[[setups.operations]]
instruction = "The 4-40 tap goes in the T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the tap file: measure the 4-40 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, this frame, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PF08_tap: M6 T5, the tap guide in the 1/2 in collet, pointed end out, spindle off; the file ends Idle at the machine top over the hole. The tap file moves only at the machine top and over the hole, spindle off."
diagram = { file = "diagrams/tap.svg", alt = "The frame upright in the vise, B up, BK at the fixed jaw; the 4-40 tap in the T-handle wrench in the hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} below B, into the window. The frame and the tap's diameter to scale; the wrench and the guide schematic." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on B beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X-5.000 (over B beside the hole), then send G20: the DRO reads inches. Stand the 4-40 plug tap, in its T-handle wrench, on its point on B; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, MDI G0 X-0.500 (over the hole, in inches)."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, Tapmatic Gold: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}): the tap's chamfer is then through the rail into the window and every thread in the rail is full. Not gauged on the part."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn. To read, push the point fully home again: stop at the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}), the tap's point showing in the window."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole and the window out."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished frame: the window, its four rails and the tapped hole in the bottom end B breaking into the window." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: every outside edge, the window's edges on both faces, the drill's exit in the window and the thread's mouth on B, scraper from the deburring set and a smooth file, to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; no countersink at the tap. The window's corners stay sharp to the cutter's radius: break their edges only. Wash off the oil. Finish: as machined, no coating."
feed = "hand"
inspection = "Accepted on the mill: height, width, depth (Setups 3, 5, 7), the window and its rails (Setup 7), the hole's place (Setup 8). Here: no burr stands on any edge, the window's corners are round with no step (the 1/8 in end mill's finish), and the tapped hole shows full threads through the bottom rail into the window."
gauge_checks = "other"
