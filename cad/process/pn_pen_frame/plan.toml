# Pen frame MHA-PN-01 (qty 1), routed for the CNC mill by the author for
# speed (owner ruling 2026-11-21: the agent chooses the route, the owner
# corrects afterwards). One blank sawn from the 3/8 x 1-1/4 in C36000 flat
# bar allocated to this part (stock.c360-flat-3-8x1-1-4, 4 in, on hand): the
# 1.58 height lies along the bar, the 1.00 width comes from the 1-1/4 and
# the .31 depth from the 3/8. Squared as the column clamp front squares its
# blank (ends upright, edges on edge, faces lying), then the window and the
# thumb-screw tap.
#
# Route: saw and mic the bar; Setups 2-3 upright on the 1 in parallels,
# gripped on the bar's two wide faces: face the top end T (PF01), turn over,
# face the bottom end to the height (PF02); Setups 4-5 on edge on the same
# parallels, gripped on the same faces: skim the left face L (PF03), turn
# over, face the right face to the width (PF04); Setups 6-7 lying on the
# 1 in + 1/2 in parallel stacks under the end rails, gripped on the faced
# ends: skim the back face (PF05), turn over, face the front face to the
# depth, slot round the window with the 1/8 in carbide end mill (the slug
# drops between the stacks), then finish its walls and corners with the
# same end mill (PF06); Setup 8
# upright, the bottom end up, the back face to the fixed jaw: spot and
# drill the #43 through the bottom rail into the window (PF07), then tap
# 4-40 through by hand under the spring tap guide (PF08); bench deburr and
# inspect. Finish as machined.
#
# The window's corners print R.065 (.060-.070): owner ruling 2026-11-23,
# tool audit Q9, "Print a local corner limit R.065 (.060-.070), cut with
# the 1/8 end mill; no 5/64 cutter". The 1/8 in end mill's finish turns
# each corner about the slot's corner, so the corners come out at its
# radius plus the finish stock, R.0655 (cam.py checks the band). Every
# setup needs only what is on hand.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (tools.edge-finder; the touch probe has no holder) and every Z zero a
# cutter on a .002 feeler leaf, as the column clamp and magnifying clamp
# plans do.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (PF08).
#
# NC (cam:pn_pen_frame, cad/process/pn_pen_frame/cam.py): PF01_top_end,
# PF02_height, PF03_left_face, PF04_width, PF05_back_face, PF06_window,
# PF07_tap_drill, PF08_tap. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2
# 1/8 in end mill, T3 centre drill, T4 #43, T5 the tap guide (the tap is
# turned by hand).
title = "Pen frame"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass (360-H02, extruded), 3/8 × 1-1/4 in flat bar (drawing: {{cad.material_spec}})"
stock = "3/8 × 1-1/4 in flat bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank."
shop = "../shop"
stock_refs = ["c360-flat-3-8x1-1-4"]
material_key = "pn-c360-flat"
milling_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# homing, Feed Hold, tool changes, proving a file, burrs); This job says what
# only this frame needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Finished", "{{cad.right_face_width_min_in:.3dot}}–{{cad.right_face_width_max_in:.3dot}} wide (L, the left face, to the right face), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (B, the bottom end with the tap, to T, the top end), {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} deep (back face to front face)."],
  ["Coolant", "Brass: no coolant on the end mills."],
]

[cad]
file = "../../out/features/pn_pen_frame/features.toml"
adapter = "drilled_block"
part = "pn-pen-frame"

[parameters]
quantity = 1
# The bar (stock.c360-flat-3-8x1-1-4) and the blank the programs are posted
# for: its section across the width (model X) and the depth (model Z), sawn
# 1.70 ±.05 along the height (model Y). blank_*_in are the model-axis sizes
# prechips' stock_fit reads (the shortest blank along Y).
blank_width_in = 1.25
blank_width_mm = 31.75           # blank_width_in × 25.4.
blank_thick_in = 0.375
blank_thick_mm = 9.525           # blank_thick_in × 25.4.
blank_length_min_in = 1.65
blank_length_max_in = 1.75
blank_x_in = 1.25
blank_y_in = 1.65
blank_z_in = 0.375
kerf_in = 0.125
# Skims (the author's choice, .020 in each, enough to clean a sawn end or
# the bar's extruded face): the top end T, the left face L and the front
# face. The bottom end, the right face and the front face are faced to size
# from them in equal levels no deeper than face_step_max_mm (.050 in).
end_skim_mm = 0.508
edge_skim_mm = 0.508
face_skim_mm = 0.508
# The heights PF03 and PF05 skim to above the parallels or stacks: the
# nominal bar less its skim; cam.py checks them.
edge_level_mm = 31.242
face_level_mm = 9.017
face_step_max_mm = 1.27
# PF03 and PF05 skim L and the back face at a fixed height above the
# parallels (the nominal bar less the .020 skim): the bar is miked before
# Setup 2 and must give each skim at least bar_skim_min_mm (.005 in, the
# least that cleans the extruded skin, as the V block plan's window) and at
# most one face level (face_step_max_mm). cam.py checks the windows.
bar_skim_min_mm = 0.127
bar_width_min_mm = 31.369
bar_width_max_mm = 32.512
bar_thick_min_mm = 9.144
bar_thick_max_mm = 10.287
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2), equal
# passes no wider than .200 in, under half the cutter (the 6G chip-load
# factor 1.0 holds to 50 % engagement, shop settings.pn-em-half-c360).
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.08
# Upright, the longest blank less the top-end skim stands above the
# parallels in PF02 (44.45 − 0.508); cam.py checks it.
upright_top_max_mm = 43.942
# The window (PF06), all with the 1/8 in carbide end mill (owner ruling
# 2026-11-23, tool audit Q9: no 5/64 cutter). First a slot round its edge,
# window_finish_stock_mm (.003 in) inside the walls, in equal levels no
# deeper than .35 × its diameter (Harvey Tool miniature square end mills,
# series 720xx, speeds and feeds table, Brass row, slotting axial depth
# .35 x Dia, read 2026-11-21): 8 levels of 1.047 mm from the front face to
# window_run_past_mm (.020 in) below the back face, between the parallel
# stacks; the slug inside the slot drops onto the vise bed at the last
# level. Then the finish: walls and corners to size, its path a cutter
# radius inside the walls, at the slot's 8 levels and setting, taking the
# .003 stock all round. It turns each corner on an arc of the stock's
# radius about the slot path's corner, so the stock is even in the corners
# too and they come out at the cutter's radius plus the stock, R.0655,
# inside the printed R.065 (.060-.070). At the slot's depth and feed it is
# a lighter cut than the slot. Every path runs clockwise (conventional
# inside the window, right-hand spindle) and enters each level by a
# straight plunge on the left wall's path, at half the cutter's chip load
# (the rocker strap plan's choice): 2800 × 3 × .00055 = 4.62 in/min.
window_cutter_dia_mm = 3.175
window_finish_stock_mm = 0.0762
window_run_past_mm = 0.508
window_step_mm = 1.04775
window_plunge_feed_per_min_mm = 117.348
# PF06's frame (X0 L, Y0 T at the fixed jaw): the window's right wall from L
# (the width less the right rail) and its walls from T (the height less the
# bottom rail, and the top rail); cam.py checks each against the model.
window_right_mm = 22.098
window_far_mm = 34.036
window_near_mm = 6.096
# Thumb-screw tap (PF07, PF08), from the bottom end B: spot Ø.080 with the
# #2 centre drill, under the #43 (the magnifying clamp plan's spot); #43
# pecks of .080 with full retract, its full diameter tap_drill_past_mm (1.0)
# past the .24 bottom rail into the window: drill_full_depth_mm 7.096 (the
# rail 6.096 + 1.0), its point (118°, 0.679) at drill_tip_depth_mm 7.775
# below the end. The plug tap's point runs past the rail by its chamfer, 5
# threads (5 × .025 = .125 in), so every thread in the rail is full:
# tap_reach_min_mm 9.271 (the rail + 3.175), aim .40 in, at most .45 in, in
# the open window (cam.py checks the minimum).
spot_dia_mm = 2.032
peck_mm = 2.032
tap_drill_past_mm = 1.0
drill_full_depth_mm = 7.096
drill_tip_depth_mm = 7.775
tap_reach_min_mm = 9.271
tap_reach_mm = 10.16
tap_reach_max_mm = 11.43
# The drawing's WALL .074 MIN from the thread to either face (the feature
# export's thumb_screw_tap.wall_min, which binds without a unit); cam.py
# checks it.
tap_wall_min_mm = 1.8796
# Feeds of the holes (cad/process/shop/pn.toml settings.pn-spot-c360 and
# pn-drill-43-c360, sourced there): 2800 rpm × .001 in/rev = 2.8 in/min.
spot_feed_per_min_mm = 71.12
drill_43_feed_per_min_mm = 71.12
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): upright and on edge, a 1 in parallel against each jaw; lying,
# the set's 1 in and 1/2 in parallels stacked against each jaw (1.5 in), as
# the column clamp plans stack them, under the end rails: the window lies
# between the stacks and every face stands above the jaw tops.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright, on edge) or the stacks
# (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides: upright the bar's 1-1/4 width, on edge the
# height, lying and in Setup 8 the width.
vise_upright_inset_mm = -63.46
vise_edge_inset_mm = -59.27
vise_lying_inset_mm = -66.64
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set at least 1 in out of the collet. 1/8 in
# end mill (1-1/2 in overall, 1/2 in of flute): at least 5/8 in out, so its
# collet stays 7.5 mm above the front face at the window's deepest level.
half_mill_projection_min_mm = 25.4
eighth_mill_projection_min_mm = 15.875
# ASME B94.11M jobber length, overall: #43 1-7/8 in; the #2 combined drill
# and countersink 1-7/8 in. Bounded by their whole length below the chuck.
drill_43_oal_mm = 47.625
centre_drill_oal_mm = 47.625
# Setup 8: the drill's point above the parallels, the height less
# drill_tip_depth_mm (40.132 − 7.775); cam.py checks it.
drill_tip_height_mm = 32.357
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the parallels, the frame's height and the collet
# gauge: 261.664, rounded down to .01 in; it is also the guide-and-tap
# stack's declared reach in Setup 8's capacity check. The guide is 3 1/8 in
# (79.375) overall, its sellers' size and the most it can stand below the
# collet face; the tap's reach in its wrench is not on record, so the
# traveler stops before the tap file unless the tap, point to the wrench's
# centre hole, is at most tap_wrench_reach_max_mm: 261.62 less 79.375,
# 182.245, rounded down to .01 in.
tap_stack_max_mm = 261.62
tap_wrench_reach_max_mm = 182.11

