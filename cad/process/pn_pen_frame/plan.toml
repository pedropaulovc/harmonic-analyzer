[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "From above, to scale: the 3/8 × 1-1/4 in brass bar, its long end in the saw's vise, the blade in its .125 kerf; one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 4 in brass bar, the bar flat in the saw's vise. File the burr off both ends and the four long edges so the blank seats flat on the parallels. Mark one wide face BK (the back face) with marking fluid: Setups 2–5 grip that wide face and the other, BK to the fixed jaw. BK is the back face of the drawing's views, the face its .16 hole location is measured from."
feed = "hand"
inspection = "Blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Shorter: saw another from the bar; longer: saw it again. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = [41.91, 44.45] }]

[[setups.operations]]
instruction = "Mic the blank's thickness (across the wide faces) and width (across the narrow faces), each at both ends. Setups 4 and 6 skim L and BK at a fixed height above the parallels: these windows give each skim {{process.bar_skim_min_mm:in.3dot}}–{{process.face_step_max_mm:in.3dot}}."
feed = "hand"
inspection = "Thickness {{process.bar_thick_min_mm:in.3dot}}–{{process.bar_thick_max_mm:in.3dot}} and width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}, micrometers. Outside either: stop; the bar is not the 3/8 × 1-1/4 these programs are posted for: tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.bar_thick_min_mm}}", "{{process.bar_thick_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] },
]

[[setups]]
machine_kind = "other"
title = "Top end T"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel against each jaw. The blank upright on them, a sawn end up, gripped across its two wide faces (BK to the fixed jaw), the 1-1/4 width along the jaws, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. The lower {{process.upright_grip_mm:in.2dot}} of it is in the jaws."
datum = "Program PF01_top_end (cam:pn_pen_frame). G54: X0 Y0 the bar's axis, Z0 the faced top end; +Y toward the fixed jaw (BK). The file starts with an M6 for the end mill."
diagram = { file = "diagrams/top-end.svg", alt = "To scale, across the jaws: the blank upright on two 1 in parallels, a sawn end up, BK at the fixed jaw; the 1/2 in end mill on its second pass along the jaws, .020 off the sawn end." }
envelope = { x_span_mm = ["{{process.blank_width_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_thick_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", 44.45], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_thick_mm}}", along_jaws_mm = "{{process.blank_width_mm}}", part_height_mm = 44.45, parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, 44.45], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_width_mm}}", y = "{{process.blank_thick_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "G54 X0 Y0 the bar's axis: edge finder (900 rpm) on the fixed jaw and on the blank's left and right edges."
instruction_detailed = "Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face beside the blank, G10 L20 P1 Y(half the miked 3/8 thickness in mm − 2.540); for .375, Y2.223. X: its tip .10 below the sawn top, on the blank's LEFT edge from the left, G10 L20 P1 X0; on its RIGHT edge from the right, G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced top end, the sawn top's high point less the {{process.end_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.end_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PF01_top_end (M6 T1, 1/2 in end mill; set 2800): face the top end at Z0, {{process.end_skim_mm:in.3dot}} off the high point, two passes. A sawn patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run it again. Unclamp; mark this end T with marking fluid."
settings = "pn-em-half-c360"
milling_cuts = [
  { name = "top end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.end_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "Bottom end B to the height"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 2, the blank turned over: T down on both parallels, BK to the fixed jaw, the sawn end up."
datum = "Program PF02_height. G54: X0 Y0 the bar's axis, Z0 the parallels' top (T); +Y toward the fixed jaw (BK)."
diagram = { file = "diagrams/height.svg", alt = "To scale, across the jaws: the blank upright on two 1 in parallels, T down; the 1/2 in end mill at its last level, the height 1.580, the levels above it hatched: it becomes the bottom end B." }
envelope = { x_span_mm = ["{{process.blank_width_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_thick_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.top_face_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_thick_mm}}", along_jaws_mm = "{{process.blank_width_mm}}", part_height_mm = "{{process.upright_top_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{process.upright_top_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_width_mm}}", y = "{{process.blank_thick_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Before clamping: the blank's length, T to the sawn end, at the sawn end's left corner (calipers). Repeat Setup 2's X0 Y0 (the blank was turned over), then M6 T1 and Z0 as below."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top (T), set from the end mill touched on the sawn end's left corner and the blank's length there; the parallels sit between the jaws, where the cutter cannot reach."
instruction_detailed = "Console M6 T1. MDI G0 X-9.525 Y0: the cutter over the blank's left corner, clear of both jaws above them. Spindle stopped, its tip just dragging a .002 feeler leaf on that corner: G10 L20 P1 Z(the length in inches × 25.4 + 0.051)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PF02_height (M6 T1; set 2800): face the sawn end down to Z {{cad.top_face_height_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). Unclamp; mic the height. This end is B, the bottom end the tap goes into: mark it."
settings = "pn-em-half-c360"
inspection = "Height {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}}, T to B, miked at both edges."
