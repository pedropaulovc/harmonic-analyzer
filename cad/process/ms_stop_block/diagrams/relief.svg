<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">
  <!-- Setup 6, MS05_relief, same clamping as the rebate picture. Left: to scale at 11 px/mm (the .56 height = 156.5 px); right: 6 px/mm (the bar's 1-1/4 = 190.5 px). The 1/16 in end mill with 1/2 in of flutes (MSC 35497056, shop tools.endmill-carbide-3fl-1-16-loc-1-2): cutting Ø1.5875 (relief_cutter_dia_mm) = 17.5 px left, 9.5 px right (drawn 17.3 and 9.4, within a pixel), at X 3.080 beside the roof, its end at the plunge's bottom, Z −9.779 (relief_bottom_mm); its 1/8 shank starts .500 above its tip (the record's flute length; 139.7 px). No neck: the flutes run at the cutting diameter up to the shank. The shank is drawn short, broken off. -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="16" y="22">Setup 6 (MS05_relief): plunge the relief beside the roof</text>
  <rect class="fixture-support" x="44.0" y="254.1" width="168.5" height="20.0"/>
  <rect class="part-kept" x="50.0" y="120.0" width="156.5" height="134.1"/>
  <rect class="part-removed" x="75.1" y="120.0" width="38.0" height="92.8"/>
