<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">
  <!-- To scale at 4 px/mm (the .485 depth = 48.8 px). The 1/2 in end mill Ø12.7 (milling_cuts "far end") = 50.8 px, on MS07's second pass, Y −5.850 (over the block), its end on the last level, Z 21.336 (the length); at least 1.00 in out of the collet (half_mill_projection_min_mm): drawn short, broken off. Its first pass, Y −12.196, runs over the moving jaw 1.79 mm above its top at this level. The far roof corner is chamfered lying, in Setup 9 (chamfer-far.svg). -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="16" y="22">Setup 8 (MS07): face the far end to the length</text>
