  <line class="leader" x1="296.0" y1="196.0" x2="180.0" y2="228.4"/>
  <circle class="leader-dot" cx="180.0" cy="228.4" r="2.5"/>
  <text class="label" x="300.0" y="235.0">1 in parallels</text>
