  <path class="cutter" d="M155.6 44 L155.6 137 A25.4 6.1 0 0 0 206.4 137 L206.4 44 L200.1 40 L187.3 48 L174.7 40 L161.9 48 L155.6 44 Z"/>
  <text class="label" x="300.0" y="60.0">1/2 in end mill; passes along the jaws</text>
