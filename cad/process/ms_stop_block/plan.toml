# Stop block MHA-MS-02 (qty 1), routed for the CNC mill for speed (owner
# ruling 2026-11-21: where a part can be made either way the agent chooses for
# speed; the owner corrects afterwards). One slice of the 3/4 × 1-1/4 C360
# flat (stock.c360-flat-3-4x1-1-4, the bar MHA-PN-05 also draws on): the
# bar's 1-1/4 width becomes the .84 length X, its 3/4 thickness the .56
# height Y, the sawn slice the (.48) depth Z, so the least brass is milled.
# Six faces squared with the 1/2 in carbide end mill, the rebate milled with
# the 1/8 in end mill and its corner relief PLUNGE-milled with a 1/16 in
# long-reach stub-flute end mill (Harvey Tool 34662, to buy; owner ruling 2026-11-21:
# plunging keeps Harvey's chip load and loads the long tool along its axis),
# the roof corners chamfered with the 90° chamfer mill, the
# #4-40 thumb hole drilled #43 and hand-tapped under the tap guide. The two
# #2-56 plate holes are pair-piloted #49 from MHA-MS-03 by that part's
# traveler (its Setups 3-5, the block finished but for them); this traveler
# then taps them bottoming under the tap guide (Setup 12).
#
# Route: saw (Setup 1); lying on the 1 in and 1/2 in parallels stacked under
# each jaw (1.5 in): skim the sawn back face (MS01), back face down, face the
# mating face to the depth (MS02); gripped on those, skim the locating edge
# (MS03), locating edge down, face the top to the height (MS04); mating face
# up, gripped across the bar's as-bought 1-1/4 ends (the waste beyond both
# final ends), mill the rebate and its relief (MS05): the cuts stop short of
# the bar's ends, so the roof is never squeezed by the jaws and stays tied at
# both ends while it is cut; upright on 1 in parallels, gripped on the mating
# and back faces, face the locating end and chamfer its roof corner (MS06),
# then the far end to the length and its roof corner (MS07), the end facing
# opening the rebate through; lying, locating edge up, spot and drill the
# thumb hole into the rebate (MS08), tap it by hand under the spring tap guide
# (MS09); bench deburr; MHA-MS-03's pair pilot; tap both plate holes (MS10,
# MS11); deburr, inspect; brass black (gated: the solution is to buy).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so each tap stop is its
# own file ending M30 over its hole (MS09, MS10, MS11).
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero a cutter on a
# .002 feeler leaf, as the column clamp and magnifying clamp plans do.
#
# NC (cam:ms_stop_block, cad/process/ms_stop_block/cam.py): MS01_back,
# MS02_mating, MS03_edge, MS04_height, MS05_rebate, MS05_relief,
# MS06_locating_end, MS07_far_end, MS08_thumb, MS09_thumb_tap,
# MS10_plate_tap_1, MS11_plate_tap_2. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 1/8 in end mill, T3
# 1/16 in long-reach end mill, T4 chamfer mill, T5 centre drill, T6 #43, T7
# the tap guide (the taps are turned by hand).
title = "Stop block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass, 3/4 × 1-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.blank_y_in:fraction}} × {{process.blank_x_in:fraction}} in flat bar; {{process.quantity:d}} slice {{process.blank_z_min_mm:in.2dot}}–{{process.blank_z_max_mm:in.2dot}} in thick sawn off its end."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.far_end_length_min_in:.3dot}}–{{cad.far_end_length_max_in:.3dot}} long (locating end to far end), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (locating edge to top face), ({{cad.envelope_z_in:.2dot}}) deep (mating face to back face). Every cutting speed is 2800 rpm (the edge finder runs at 900), all on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then, before Cycle Start, touch one of the setup's zeros again with the edge finder: it must read what its step set, within .001 in. It does not, or the part may have moved: take the setup again from its first step, the part out. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; console M6 for the tool in the spindle, then Cycle Start. Every cutting file is proved in air first. At every M6 stop the file has stopped the spindle and lifted the tool clear; press Cycle Start only with hands clear. The 1/16 in long-reach end mill (Harvey Tool 34662) is TO BUY: not owned; Setup 6 stops at its relief until it is in hand. The plate holes are pair-piloted by MHA-MS-03's traveler; keep this block with its plate from then on. Finish: brass black, the last setup, once the solution is bought."
shop = "../shop"
stock_refs = ["c360-flat-3-4x1-1-4"]
material_key = "stop-c360"
milling_material = "brass"

[cad]
file = "../../out/features/ms_stop_block/features.toml"
adapter = "drilled_block"
part = "ms-stop-block"

[parameters]
quantity = 1
# The bar (stock.c360-flat-3-4x1-1-4, Online Metals 3/4 × 1-1/4 C360) and the
# slice the programs are posted for: the bar's width along the block's X,
# its thickness along Y, the slice .56-.62 thick along Z (the saw's ±.03 on a
# .59 mark).
blank_x_in = 1.25
blank_y_in = 0.75
blank_z_in = 0.62
bar_width_mm = 31.75             # blank_x_in × 25.4
bar_thickness_mm = 19.05         # blank_y_in × 25.4
blank_z_min_mm = 14.224          # .56
blank_z_max_mm = 15.748          # .62
kerf_in = 0.125
# Skims (author's choice, .020 in, enough to clean a sawn face or the bar's
# extruded face): the back face and the locating edge. The mating face, the
# top face and both ends are faced to size in equal levels no deeper than
# face_step_max_mm (.050 in, the author's choice for the carbide end mill in
# brass, as the magnifying clamp's).
back_skim_mm = 0.508
edge_skim_mm = 0.508
face_step_max_mm = 1.27
# Each end gives up half the bar's width less the length: the locating end
# first (MS06), from the bar's end down to far_top_mm above the parallels,
# then the far end to the length (MS07). cam.py recomputes both.
end_trim_mm = 5.207
far_top_mm = 26.543
# The tallest stock each sizing program starts from: the thickest slice less
# the back skim (MS02); the bar's thickness less the edge skim (MS04).
mating_top_max_mm = 15.24
height_top_mm = 18.542
# The depth is (.48) REF: the rebate width plus the back wall. It is
# accepted between the widest rebate plus the thinnest wall and the narrowest
# rebate plus the thickest wall, and faced to that window's middle, .485: at
# the rebate's +.010/0 (owner ruling 2026-11-21) the window's floor is the
# model's .480 (cam.py recomputes all three).
thickness_min_mm = 12.192
thickness_max_mm = 12.446
thickness_aim_mm = 12.319
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2), passes
# across the face no wider than half the cutter (6G chip-load factor 1.0 to
# 50 % engagement, shop settings.stop-em-half-c360), equally spaced.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
# The rebate (MS05), aimed at each printed band's middle: the roof .090
# under the top face, the rebate .139 high and .335 deep from the mating
# face, the relief .050 past the rebate's back. The 1/8 in end mill slots
# down the middle in levels of .020 (.16 × D, under Harvey's .18 × D for
# slotting), then finishes each wall full depth, each taking rebate_wall_mm.
# Both stop rebate_tab_mm short of the bar's ends, in the waste MS06 and MS07
# face off.
# The relief is plunge-milled: the 1/16 in long-reach end mill plunges
# straight down from the rebate's back to relief_bottom_mm at 36 stations
# relief_plunge_step_mm (.0287) apart. Between two plunges a ridge stands on
# each side of the relief, the cutter's radius less the half-chord:
# relief_scallop_mm (.0035) for the .0620 cutter. The relief's clear height
# between the ridges is √(D² − s²) for a cutter D at the step s, .0550 for
# the .0620 cutter, inside the printed .05–.07. The least cutter that keeps
# it there is relief_cutter_min_mm = hypot(.050, s) = .0577, and the step is
# held to half of that (s ≤ .050/√3), so any cutter the traveler accepts
# plunges no more than half itself apart. The relief's depth is the plunges'
# flat bottoms. cam.py recomputes all three and checks a plunge at every
# station.
roof_aim_mm = 2.286
rebate_height_aim_mm = 3.5306
rebate_depth_aim_mm = 8.509
relief_bottom_mm = 9.779
rebate_centre_x_mm = 4.0513
rebate_wall_mm = 0.1778
rebate_step_mm = 0.508
relief_plunge_step_mm = 0.7293
relief_scallop_mm = 0.0895
relief_cutter_min_mm = 1.4645
relief_cutter_max_mm = 1.778
# The ceiling's Ra in microinches, the inch drawing's unit (cam.py checks it
# against the export's 1.6 µm).
ceiling_ra_uin = 63
rebate_tab_mm = 1.524
slot_cutter_dia_mm = 3.175
relief_cutter_dia_mm = 1.5748
# Setup 6's test plunges gauge each 3-flute cutter by its cut (three flutes
# cannot be miked across): the 1/8 in cut's band is the rebate band less the
# two wall passes; the 1/16 in cut's is the relief cutter band. Read with the
# class ZZ minus pins: GO the least pin whose least size is not under the
# band, NO-GO the largest not over it. Each plunge feeds as its program
# plunges. cam.py recomputes them all.
slot_cut_min_mm = 3.048
slot_cut_max_mm = 3.302
slot_go_pin_in = 0.121
slot_nogo_pin_in = 0.130
relief_go_pin_in = 0.058
relief_nogo_pin_in = 0.070
slot_test_feed_mm_min = 106.68
relief_test_feed_mm_min = 64.008
# The test holes: at test_y_mm from the fixed jaw's face in the waste end
# MS06/MS07 face off, a retest as far from the moving jaw's (test_far_y_mm,
# recomputed); cam.py holds each, at the largest cut the pins pass, .75 mm
# clear of the faces, the final end, the rebate and the other hole.
slot_test_x_mm = 8.25
relief_test_x_mm = 12.0
test_y_mm = 2.5
test_far_y_mm = 29.25
# The relief cutter's point above the stacks at the relief's floor (the
# thinnest accepted block, thickness_min_mm, less relief_bottom_mm; cam.py
# recomputes it).
relief_floor_height_mm = 2.413
# Roof chamfers: the 90° chamfer mill's axis chamfer_offset_mm outside the
# top face, its point chamfer_tip_depth_mm below the end (the leg plus the
# offset), so its cone cuts the .04 leg on both faces; its point taken as
# sharp. Point heights above the parallels: MS06 and MS07.
chamfer_offset_mm = 0.25
chamfer_tip_depth_mm = 1.266
locating_chamfer_tip_mm = 25.277
far_chamfer_tip_mm = 20.07
# Thumb hole: spot Ø.080 with the #2 centre drill, under the #43 (no chamfer
# at the mouth), then the #43 through the floor in pecks of .080 with full
# retract, its full diameter thumb_drill_past_mm past the rebate floor; its
# point thumb_tip_height_mm above the stacks (the top face), well under the
# roof. cam.py checks both.
spot_dia_mm = 2.032
peck_43_mm = 2.032
thumb_drill_past_mm = 0.5
thumb_tip_height_mm = 4.51
# Tap reaches below the face the tap enters, read on the DRO: the 4-40 plug
# tap's point .450 up from the locating edge (into the rebate, .020 under the
# roof: a plug tap's 3-5 thread lead then ends inside the rebate, the thread
# full through the floor); both 2-56 taps' points .280 below the mating face
# (past the .255 thread, short of the .295 drilled depth).
thumb_tap_reach_mm = 11.43
plate_tap_reach_mm = 7.112
# Feeds the holes run (mm/min), the shop settings' (shop/ms.toml
# settings.stop-*-c360): centre drill and #43 2800 rpm × .001 in/rev =
# 2.8 in/min.
spot_feed_per_min_mm = 71.12
drill_43_feed_per_min_mm = 71.12
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): lying, the set's 1 in and 1/2 in parallels stacked against each
# jaw (1.5 in), so every face cut lying stands above the jaw tops; upright,
# a 1 in parallel against each jaw.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
lying_grip_mm = 6.8453
upright_grip_mm = 19.5453
# The part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides: the bar's width (Setups 2-5), the height
# (Setups 6-8, 12), the length (Setup 9).
vise_bar_inset_mm = -63.4619
vise_height_inset_mm = -72.2249
vise_length_inset_mm = -68.6689
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# the spindle nose to the tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Each end mill set out of its collet at least this far: the 1/2 in 1.00 in;
# the 1/8 in and the 1/16 in long-reach .60 in (their cuts reach .38 below
# the mating face; the 1/16's shank starts .50 up); the chamfer mill .50 in.
half_mill_projection_min_mm = 25.4
small_mill_projection_min_mm = 15.24
chamfer_projection_min_mm = 12.7
# ASME B94.11M jobber lengths, overall: #43 2-1/4 in; the #2 combined drill
# and countersink 1-7/8 in.
drill_43_oal_mm = 57.15
centre_drill_oal_mm = 47.625
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench, the vise bed, the
# stacks, the tallest tapping setup (Setup 9, the .56 height) and the collet
# gauge, rounded down to .01 in (cam.py recomputes it); it is also the
# guide-and-tap stack's declared reach in the setups' capacity check. The
# guide is 3 1/8 in (79.375) overall, its sellers' size and the most it can
# stand below the collet face; the tap's reach in its wrench is not on
# record, so the traveler stops before the first tap file unless the tap,
# point to the wrench's centre hole, is at most tap_wrench_reach_max_mm:
# 274.828 less 79.375, 195.453, rounded down to .01 in.
spindle_to_table_mm = 431.8
tap_stack_max_mm = 274.828
tap_wrench_reach_max_mm = 195.32

