[[setups]]
machine_kind = "other"
title = "Saw the slice"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 × 1-1/4 in brass bar lying on its wide face in the saw; one slice {{process.blank_z_min_mm:in.2dot}}–{{process.blank_z_max_mm:in.2dot}} in thick marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one slice {{process.blank_z_min_mm:in.2dot}}–{{process.blank_z_max_mm:in.2dot}} in thick (mark .59) off one end of the 3/4 × 1-1/4 C360 bar, the bar lying on a wide face in the saw's vise, the cut across its full 1-1/4 × 3/4 section. The rest of the bar stays for MHA-PN-05. File the burr off both sawn faces and the four edges so the slice seats flat on the parallels. Mark L with marking fluid on one 3/4 × .59 face, an end of the 1-1/4 width: it becomes the locating end's side."
feed = "hand"
inspection = "Slice {{process.blank_z_min_mm:in.3dot}}–{{process.blank_z_max_mm:in.3dot}} thick at all four corners, calipers. Every program assumes this slice."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_z_min_mm}}", "{{process.blank_z_max_mm}}"] }]

[[setups.operations]]
instruction = "Only if the slice read out of its band. Thinner: scrap it and saw another. Thicker: file the sawn face flat until the calipers read {{process.blank_z_max_mm:in.3dot}} or less, then check all four corners again."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Back face skim"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The slice lying flat on them, a sawn face up, gripped across the bar's 3/4 thickness (its two as-bought wide faces), its 1-1/4 width along the jaws, end L to the LEFT, centred on the jaws. Tap it down onto both stacks with a soft mallet while closing the vise. The lower {{process.lying_grip_mm:in.3dot}} of it is in the jaws; the sawn top stands at most {{process.blank_z_max_mm:in.3dot}} above the stacks."
datum = "Program MS01_back (cam:ms_stop_block). G54: X0 the slice's LEFT end (L), Y0 the fixed jaw's face, Z0 the faced back face; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/back.svg", alt = "The slice lying flat on stacked parallels, a sawn face up, gripped across its 3/4 thickness; the 1/2 in end mill skims the sawn top, which becomes the back face." }
envelope = { x_span_mm = ["{{process.bar_width_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.bar_thickness_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_z_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.mating_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.bar_thickness_mm}}", along_jaws_mm = "{{process.bar_width_mm}}", part_height_mm = "{{process.blank_z_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_bar_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.bar_width_mm}}"], clamp_mm = [0, "{{process.bar_width_mm}}"], section_mm = { y = "{{process.bar_thickness_mm}}", z = "{{process.blank_z_max_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 X0 the slice's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the slice, G10 L20 P1 Y-2.540; on the slice's LEFT end (L) from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced back face, the sawn top's high point less the {{process.back_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.back_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "Prove MS01_back in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run MS01_back, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MS01_back (M6 T1, 1/2 in end mill; set 2800): skim the sawn top {{process.back_skim_mm:in.3dot}} off its high point at Z0, in passes no wider than {{process.face_stepover_max_mm:in.3dot}}. A sawn patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run it again. Unclamp; mark this face BACK."
settings = "stop-em-half-c360"
milling_cuts = [
  { name = "back face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.back_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.bar_width_mm}}"] },
]

[[setups]]
machine_kind = "other"
title = "Mating face to the depth"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
