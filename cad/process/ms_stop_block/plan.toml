holding = "The 1 in and 1/2 in parallels stacked against each jaw (1.5 in). The block alone (its plate set aside), lying MATING face up, gripped across the .84 length: the LOCATING END against the FIXED jaw (as MHA-MS-03 held the pair), the locating edge to the RIGHT; centred on the jaws. Never across the .56: the roof would bend."
datum = "Programs MS10_plate_tap_1 and MS11_plate_tap_2. G54: X0 the locating edge (RIGHT), the block to −X; Y0 the fixed jaw's face (the locating end). No Z0: these files move Z only to the machine top (G53); each tap's depth is the DRO Z you note by hand. Hole 1 at Y −{{cad.plate_tap_1_x_from_min_in:.3f}}, hole 2 at Y −{{cad.plate_tap_2_x_from_min_in:.3f}}, both at X −{{cad.plate_tap_1_y_from_min_in:.3f}} in: the pair pilot's places, from the same flush end and edge."
diagram = { file = "diagrams/plate-tap.svg", alt = "The block lying mating face up, gripped across its length, locating end on the fixed jaw; the 2-56 tap in the T-handle wrench in a piloted hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to stop {{process.plate_tap_reach_mm:in.3dot}} below the mating face." }
envelope = { x_span_mm = ["{{cad.envelope_y_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.envelope_x_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.envelope_z_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.envelope_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.chamfer_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.envelope_x_mm}}", along_jaws_mm = "{{cad.envelope_y_mm}}", part_height_mm = "{{cad.envelope_z_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_height_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = "other"

[[setups.operations]]
instruction = "G54 X0 the locating edge (right), Y0 the fixed jaw's face: edge finder (900 rpm). Z0 is not used: the tap files move Z only to the machine top."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the block, G10 L20 P1 Y-2.540; on the locating edge (RIGHT) from the right, G10 L20 P1 X2.540."
feed = "hand"

[[setups.operations]]
instruction = "The 2-56 taps go in the T-handle tap wrench with the centre hole in its top, one at a time. Setup 9's stop check covers this setup: the block stands lower here."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MS10_plate_tap_1: M6 T7, the tap guide, spindle off; the file ends Idle at the machine top over hole 1 (near the locating end)."

[[setups.operations]]
instruction = "Centre the tap guide on the hole: send G20 (the DRO reads inches); stand the 2-56 plug tap, in its wrench, in the hole by hand; jog Z down until the guide's point nears the wrench's centre hole; jog X and Y in .001 in steps until the point drops into the centre hole without tilting the wrench (a square against the wrench's shank reads it upright)."
feed = "hand"

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the mating face beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "Still in G20: note the DRO X and Y. Lift the tap out; jog X by +.050 in (over the mating face beside the hole); stand the tap on its point there, jog Z down until the guide's point is in the wrench's centre hole and pushed fully home; note the DRO Z. Jog Z up clear; jog X back to the noted X (inches, as noted)."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-2-56-plug"
drilling = "none"
sizing = "other"
instruction = "Tap's point in the hole; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Tap by hand, spindle off, Tapmatic Gold, a half turn back each turn: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home: stop when the DRO Z reads the noted Z less {{process.plate_tap_reach_mm:in.3dot}}. Jog Z up clear; back the tap out; blow the hole out."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-2-56-bottoming"
drilling = "none"
sizing = "other"
instruction = "Same hole, the 2-56 bottoming tap in the wrench: start it by hand in the plug tap's thread, jog Z down to push the guide's point fully home in the wrench, and tap under the tap guide to the same DRO Z (the noted Z less {{process.plate_tap_reach_mm:in.3dot}}), read with the point pushed fully home; never past it: the pilot is only {{cad.plate_tap_1_drill_depth_min_in:.2dot}} deep. Jog Z up clear, send G21, back the tap out, blow the hole out."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MS11_plate_tap_2 (hole 2) and repeat the four steps above on it: centre the tap guide, the depth reference, the plug tap, the bottoming tap."

[[setups.operations]]
instruction = "The thread depth ({{cad.plate_tap_1_thread_depth_min_in:.2dot}}–{{cad.plate_tap_1_thread_depth_max_in:.2dot}}) is held by the bottoming tap run to its DRO Z in the {{cad.plate_tap_1_drill_depth_min_in:.2dot}}–{{cad.plate_tap_1_drill_depth_max_in:.2dot}} pilot, not gauged. In each hole run a 2-56 screw (at least 3/8 under the head) in by hand to its stop; mark it at the mating face; out, read the mark to its end."
inspection = "Each hole takes the screw at least {{cad.plate_tap_1_thread_depth_min_in:.2dot}} deep (calipers, mark to end). The plate's screws run in by hand and seat."
gauge_checks = "other"

[[setups.operations]]
instruction = "Only if a hole takes less: blow it out and run the bottoming tap to the same DRO Z again, never deeper. Still less: record it and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Last, blow the chips out of both blind 2-56 holes with the air gun (safety glasses on), so a screw runs to the bottom of each at assembly."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished block: its length, height and depth, the rebate under the roof with its relief, the roof chamfers, the thumb hole from the locating edge into the rebate and the two plate holes in the mating face." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr the plate holes' mouths flush with the mating face (scraper; no countersink: the plate seats there). Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Final check, the sizes accepted at their setups: length (Setup 8), height (Setup 5), the rebate and back wall (Setup 6), the chamfers (Setups 7, 8), the thumb hole (Setup 9), the plate threads (Setup 12)."
inspection = "The plate screws its two 2-56 screws down flat, the locating ends and edges flush; a 4-40 thumbscrew runs into the rebate; if the MHA-MS-01 stick is at hand, the block slides along its full length (NOTE 1; MHA-MS-01 NOTE 1). Any failure: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Tag the block AWAITING BRASS BLACK, with its plate, unless Setup 14 follows now."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blacken (once the Brass Black is bought)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/surfaces.svg", alt = "The finished block, every surface to be blackened: the six faces, the rebate and relief, the chamfers and the tapped holes." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Start only with Birchwood Casey Brass Black, Birchwood Casey Cleaner-Degreaser and Barricade oil, chemical-resistant gloves and safety glasses in hand: all to buy before starting. Until then the block stays bare, tagged AWAITING BRASS BLACK."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the label: severe skin burns and eye damage). Clean the block with the Cleaner-Degreaser; degrease again and rinse with clear water. Hold it by its ends from here on."
feed = "hand"

[[setups.operations]]
instruction = "Swab or brush the Brass Black on every surface, into the rebate and the tapped holes; let it act about one minute (the maker's time). Rinse in cold water; pat dry. Solution and rinse waste to local rules, not down the drain."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on Barricade oil; leave it overnight, then wipe off the excess."
feed = "hand"

[[setups.operations]]
instruction = "Fits after blackening: the plate's 2-56 screws and the 4-40 thumbscrew run in by hand; the MHA-MS-01 stick, if at hand, still slides through the rebate. Tight: stop and tell the owner; do not re-tap or re-cut."
feed = "hand"
