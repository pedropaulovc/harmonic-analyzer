[[setups.operations]]
instruction = "The 4-40 tap goes in the T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the tap file: measure the 4-40 tap in its wrench from its point to the wrench's centre hole. It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stacks, this block, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MS09_thumb_tap: M6 T7, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the hole."
diagram = { file = "diagrams/thumb-tap.svg", alt = "The block lying locating edge up; the 4-40 tap in the T-handle wrench in the thumb hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to stop {{process.thumb_tap_reach_mm:in.3dot}} below the locating edge, inside the rebate and short of the roof." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the locating edge beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X-6.000 (over the locating edge beside the hole), then G20. Stand the 4-40 plug tap, in its wrench, on its point on the locating edge; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear; G21, MDI G0 X-{{cad.thumb_tap_x_mm:.3f}} Y-{{cad.thumb_tap_z_mm:.3f}} (over the hole), G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, Tapmatic Gold: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z less {{process.thumb_tap_reach_mm:in.3dot}}: the point is then in the rebate, .020 under the roof, and the thread full through the floor. Never past it: the roof is not to be touched."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn. To read, push the point fully home again: stop at the noted Z less {{process.thumb_tap_reach_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand; blow the hole and the rebate out."
inspection = "A 4-40 screw runs in by hand from the locating edge through into the rebate; the roof unmarked."
gauge_checks = "other"

[[setups.operations]]
instruction = "Only if the screw binds: send G20 and run the tap again under the tap guide to the same DRO Z, never deeper; then G21 and the screw again. Still binds, or the roof is marked: stop and tell the owner."
feed = "hand"

