# --- r7 shop kit: heat-treat, lapping, materials (Pedro 2026-10) ---
# Pedro's approved shop-capability kit (review-loop/r3/shop-additions.md §7, rulings
# 2026-10): torch/oil hardening and oven tempering of O1, bench grinder, stones, a
# cast-iron lap with ring and barrel laps, the bar the fixture parts are made from,
# two adhesives, a bought box parallel and a bought Class X gauge pin. ILLUSTRATIVE
# EXAMPLE DATA: vendor SKUs/URLs and prices were read from the vendor pages named in
# shop-additions.md; every physical value presented as the shop's own reading is
# labelled fact-locally `measured = { by = "example (plausible, not measured)", ... }`.
# Facts with no schema home (temperatures, hardness, grit, flatness/squareness,
# volumes, a consumable's vendor and spec) are stated in `note`/`products`/comments
# only; no rule reads them. MH = Machinery's Handbook 27th ed., printed page numbers.

# Heat-treat kit (shop-additions.md §A): O1 hardened by torch in a soft-brick chamber,
# quenched in medium-speed oil, tempered in a dedicated toaster oven, checked by files.
[tools.torch-bernzomatic-ts8000]
name = "MAP-Pro torch (Bernzomatic TS8000)"
kind = "torch"
make = "Bernzomatic"
sku = "TS8000BZKC"
source = "https://www.homedepot.com/p/Bernzomatic-DuraCast-8000-Torch-Kit-with-14-1-oz-MAP-Pro-Cylinder-and-Premium-Blow-Torch-with-Adjustable-Flame-TS8000BZKC/205683985"
note = "illustrative example item: TS8000 trigger-start torch with a 14.1 oz MAP-Pro cylinder, fired through a hole into the fire-brick chamber. AUTHOR'S CHOICE: bring O1 up slowly to a dull red (about 1200 °F) to equalise, then to non-magnetic and one shade further to an even cherry red (1475-1500 °F), hold about 5 min for 4-12 mm sections, because overheating causes warpage, scale and decarburisation (MH p.514-515) and Hudson's O1 sheet gives 1475-1500 °F. Judge colour in shade, never in sunlight. The torch gives hardness, never size."
cite = ["MH 27th p.496 Table 9 (O1: harden 1450-1500 °F, oil)", "MH 27th p.514-515", "https://www.hudsontoolsteel.com/technical-data/steelO1"]

