# hypothetical possession and named identities for the 18 legacy unresolved roots plus
# the two shop-made trammel records. present=true / verify=false below qualify this
# trial input, NOT actual ownership, completed fabrication, purchase or metrology.
# Identity provenance is comment-only (item-root measured is forbidden); every newly
# assigned operative physical fact has its own explicit Measurement or a schema-safe
# scalar/text/vector provenance comment. Catalogue capacities stay within publications;
# generic dimensions/fit classes are explicitly estimates with no fabricated citation.
# Remeasure and establish actual identity/possession before shop use. The preceding
# ownership prohibition and original unresolved-item notes below are historical only.
# Existing 550 placeholder-fact provenance occurrences and all real readings are retained.
