note = "Vendor data. McMaster-Carr 86825K763, read live 2026-10-17 (distributor; manufacturer not stated): Easy-to-Machine MIC6 cast aluminum sheet, 3/8 in thick (-0.005 to +0.005 in), 6 x 24 in, flatness 0.015 in (0.38 mm). 3M 444 TDS, read 2026-10-16: 0.10 mm thick; 90-degree peel 3.5 N/cm after 15 min, 6.6 N/cm after 72 h; long-term limit 82 C. 3M publishes no thickness tolerance for 444; ASSUMED +/-0.005-0.01 mm, so measure the strip on receipt. Owner choices (ruling (c), 2026-10-17). Fixture frame: origin at the centre of the tape top, X along the table, plate centred on the centre T-slot (Y0). Table top Z-9.625 and plate top Z-0.1 at the catalogue plate thickness; the skim thins the plate by its cleanup depth. One clamp at each plate end, in the centre slot: the strap overlaps the plate top by 25.4 mm (toe contact centred 12.7 mm in from the plate end), stud at X+/-330.2, T-nut slid in from the table end, heel on a 3/8 in kit step block. Both straps start 279.4 mm from X0, clear of any cut inside X+/-250. Commissioning, once, with the plate clamped as above: skim the land between the strap toes (cutter edge inside X+/-270, full width) with a fly cutter or face mill in 0.05-0.1 mm passes until the whole land cleans up, so the plate's flatness error and the table's are cut out; the 25.4 mm under each strap stays unskimmed and never carries work. Then sweep the land with a DTI from the spindle and record its flatness and its height above the table. Re-skim the same way if the plate is ever unclamped. Before each use: wipe the plate and the work with IPA, deburr the work's underside, lay one continuous strip (no lap or splice), press the work down and give the adhesive at least 15 min. Release: warm the work and plate to 70-80 C (under the 82 C limit) or wick IPA or heptane in from the edges, then roll the work off slowly. Never pry thin work off cold: it bends. Clean residue with IPA. Thickness stack: work underside = skimmed plate top + tape thickness."
