# Preserved original inventory comments (rev-3 status vocabulary is superseded above):
# rev-3 inventory line 1: Sample shop inventory (Pedro's shop). prechips ships no default inventory; each user supplies their own file in this schema.
# rev-3 inventory line 2: `verify: true` marks a value taken from a vendor page, a forum, a photo or
# rev-3 inventory line 3: memory rather than measured/confirmed on the machine. Rules that depend on a
# rev-3 inventory line 4: `verify: true` value report at `warn`, never `block`, until it is cleared.
# rev-3 inventory line 5: Photo citations refer to C:/src/dt-logs/shop-photos/INVENTORY-DRAFT.md.
# rev-3 inventory line 11: read 2026-10-02
# rev-3 inventory line 13: positions exact, feeds by hand
# rev-3 inventory line 19: irrelevant under cncjs; kept for hand-crank fallback
# rev-3 inventory line 20: vendor ratings
# rev-3 inventory line 22: until soft limits measured
# rev-3 inventory line 26: discontinued; 2022 snapshot
# rev-3 inventory line 29: vendor (2019+ motor) and panel photo 20260707_043127222 agree
# rev-3 inventory line 31: "now standard" on the 2022 page; older units threaded — confirm on the machine
# rev-3 inventory line 44: vendor page, not measured
# rev-3 inventory line 57: PM lists 3 plates but not the circles; standard BS-0 set — count the plates to confirm
# rev-3 inventory line 68: assumed the standard 6" PM vise, not the Homge 8"-open; confirm
# rev-3 inventory line 71: jaws inside; 14 with jaws reversed
# rev-3 inventory line 72: bed slideway to top of jaw
# rev-3 inventory line 103: LittleMachineShop items. `by: user` = named by Pedro; `by: photo` = seen in the
# rev-3 inventory line 104: 2025-06-28 photos; `by: lms-package` = part of an LMS Bench Mill / Bench Lathe
# rev-3 inventory line 105: tooling package Pedro bought — confirm each row. Everything else: verify.
# rev-3 inventory line 135: radius per division
# rev-3 inventory line 141: Lathe
# rev-3 inventory line 165: none on hand (2026-10-02)
