# Thin-part face-first hold (Pedro 2026-10-17, ruling (c) via #1577). Flat work fits
# between the plate clamps: cuts stay inside X+/-250 and Y+/-60, about 19.7 x 4.7 in.
# It is faced on double-sided film tape over a MIC-6 sub-plate, with no clamp over the
# work. Candidate purchases only: not owned, no receipt metrology.
# Shortlist (read 2026-10-16/17): 3M 444 film tape is the only tape with published
# static shear: 3M's typical test held 1000 g on 13 x 25 mm (3.0 N/cm2) for 813 min
# at 23 C. Scaled by area over the drawn 350 x 40 strip (140 cm2) that is about 420 N,
# 4.7-7x the 60-90 N design load. The scaling is an unvalidated estimate, not a rated
# hold: it does not cover peel or uplift, temperature, cutting oil or surface prep.
# Design load: the HSS face row in cutting-data.toml (fz 0.0254 mm under 1/2 in) on a
# 3/8 in 4-flute end mill at ae 7 mm and ap 0.25 mm in 1018 gives hm 0.018 mm (118 deg
# engagement), kc = 1500 x hm^-0.25 = 4090 N/mm2 (Sandvik P1.1.Z.AN kc1 1500 N/mm2,
# mc 0.25) and a mean tangential force ap x ae x z x fz x kc / (pi x D) = 24 N. The
# 60-90 N design load is 2.5-3.7x that, an allowance for peak tooth force, the radial
# component and a dull cutter; it is not a measurement. Rejected:
#   3M 410M paper tape: no shear data.
#   Turner's tape (XFasten, Rockler 25801): no published hold or thickness.
#   Painter's tape + CA: about 1.2-1.9x margin and a 0.27 mm compliant stack.
#   Pierson SmartVac 3: about $2,134 plus shop air.
#   DIY venturi vacuum plate: about $400 plus a compressor.
# Upgrade path: this plate can later be grooved for vacuum.
# Table fit: the PM-30MV table is 33 x 8-1/4 in, with three 14 mm T-slots on 63.5 mm
# centres (manual v3 2020-10 p6, read 2026-10-17). A 12 in wide blank would overhang
# it, so the plate is 6 x 24 in (152.4 x 609.6). That leaves 28.6 mm of table each
# side and 4.5 in of table beyond each plate end.
# Plate source (read live 2026-10-17): McMaster-Carr stocks 3/8 x 6 x 24 MIC6. Rejected:
#   TCI DB-MIC6-0375-12-24 (USD 125.51) trimmed to 6 x 24: TCI's .375 range has no
#     6 x 24 blank, and its Custom Size calculator returned HTTP 500, so no trim price.
#   OnlineMetals mp-00004541: no 6 x 24 (12 x 24 USD 150.61; custom cut price unshown).
#   Speedy Metals 3/8 cast tool and jig plate: 12 x 12, 12 x 18, 12 x 24 only.
