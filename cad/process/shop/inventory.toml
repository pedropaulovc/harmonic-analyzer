# Riser bars, 63.5 mm across: they sit inside the rocker's 65 mm jaw opening (0.75 mm
# each side) under both parallels' full footprints; a 1-2-3 block's 50.8 mm edge cannot
# carry both parallels and its 76.2 mm edge cannot fit the opening. AUTHOR'S CHOICE: cut
# as a pair from one bought 1 x 2-1/2 in precision-ground O1 flat-stock bar (annealed,
# ground both broad faces), because the shop has no surface grinder and two pieces of one
# ground bar match in height; the shop only saws them 3 in long and mills the ends square.

# Shared S3/S4 profile fixture (illustrative example shop-made item). Frame: rocker
# frame A of the CAD part (pivot axis at the origin, upper hub face Z0, rod end +X, hub
# at the 7.0565 band minimum). Both plans pose it at setup Z -0.0235: the 7.080-aim
# part's upper hub face (the setup Z0) stands 0.0235 higher above the same pads, so
# as posed the pad tops are at Z-4.80175 and the hub shim top at Z-7.080. Plate X-180..180, Y-70..75, Z-40.4..-15 under the whole 340 x 65
# blank (raw Z-11.52825..4.47175): bought 1 in Blanchard-ground steel plate. 25.4 thick
# so that, with the S4 1/4 in finisher at 25 mm projection (Z-6.02825 deepest), the R8
# spindle nose stays 4.4 mm above the PM-30MV's 2.4 in spindle-to-table minimum
# (the setup Z0 is 40.4235 above the table). Twelve strap pads (tops Z-4.77825 on the lower
# strap face, ~6 mm inside the finished outline, so outside the end mills' swept
# bands), a bored hub stand (OD 9.4 with an 8.0 relief bore, top Z-7.1065) and a
# per-part hub shim stack on it (0.05 nominal, top Z-7.0565 on the lower hub face; the
# relief clears the S3 reamer exit and the S4 shoulder, which locates only in the
# reamed hub and the plate's 6.500 bore). Pad tops stand 2.328 above the stand top
# (±0.02, measured and recorded): 0.05 more than the 2.278 hub-proud step S1 and S2 cut
# from each hub face, so the shim stack, built with feeler gauges after the strap
# seats on the pads, takes up each part's actual step and the stand's actual depth.
# Z figures here are in the fixture frame; each setup touches Z on the part, never on
# the plate. AUTHOR'S CHOICE (Pedro ruling 5): the pads and the stand are
# unhardened and bonded against a common granite reference with EA 9462, because the
# shop has no surface grinder and fly-cutting cannot hold the pads coplanar to 0.005.
# Each pad is about 0.07 and the stand about 0.09 short of its slot or counterbore floor, so its
# top, not the floor, sets the height; the slots are 0.10 wider and longer than their
# pads (0.05 bond gap a side). Four rail rests sit under the retained rails, the upper
# pair at X+-30 and the lower pair at X+-130
# (>16 mm outside the outline): a 3.0 mm rest (top Z-12) seated on its slot floor plus
# a per-blank shim stack, nominal 0.49525 mm up to the raw rail underside (setup Z-11.52825, fixture Z-11.50475): seat B on the pads and
# stand first, then build each stack with feeler gauges to the gap under that rail on
# the actual blank, without lifting the part, so the rails never overconstrain the
# strap seat. The plate has a stepped hole for the S4 shoulder screw: a 6.500 H7
# locating bore (full size Z-20.3..-17, under the stand counterbore), a letter-D step to
# Z-21.5 for the reamer lead, and a blind #10-24 tap under it (full thread Z-22.3..-29.5), a reamed 3.00
# rod-pin hole for the bonded diamond-pin shank, blind 3/8-16 stud taps (13.2 deep) at
# X+-70 Y45 (S3 hub straps), X+-30 Y45 and X+-130 Y-36 (S4 rail clamps) and four counterbored 3/8-16 socket-head hold-down screws to
# table T-nuts (heads 0.475 below the plate top). Tapped holes are voids at the thread
# major diameter plus a small clearance so a threaded engagement reads as mating, not
# interference. The Y-60/+65 hold-down pitch (125 mm) is the example's assumed T-slot
# pair: confirm on the PM-30MV table before making the plate. The diamond pin is a
# separate item, permanently bonded in the plate's rod-pin hole and posed at the same
# pose in both S3 and S4.

# S3 hub strap (illustrative example rocker-only stepped strap clamp, one owner).
# Frame: origin at the centre of the toe's underside on the upper strap face, +x
# along the beam toward the heel, +z up. S3 poses two at frame-A origin [+-70, 3.27,
# -2.27825] with x = [0, 1, 0]: toe Y0.27..6.27 over the strap pads, beam underside
# Z6 (clears the raw rails at Z4.47175), 3/8-16 stud at Y45 in the plate tap, heel
# Y60..70 on the plate. The beam's stud hole cuts only the beam, so the stud is
# continuous. Toe load is ~32% of stud tension (stud 41.73 from toe, 20 from heel).

# S4 rail clamp (illustrative example rocker-only flat strap, one owner). Frame:
# origin at the centre of the toe end's contact on the rail top, +x outward along
# the beam, +z up. S4 poses four: upper rail origin [+-30, 34.5, 4.47175] x = [0, 1,
# 0] (contact Y32..37, stud Y45, heel Y55..65); lower rail origin [+-130, -25.5,
# 4.47175] x = [0, -1, 0] (contact Y-28..-23, stud Y-36, heel Y-46..-56). Toes are
# >17 mm outside the finished outline; studs clear the stock by >3.2 mm.
# AUTHOR'S CHOICE: the clamps stand where the op 25 / op 27 1/4 in end mill's
# Ø31.75 R8 collet nose (25 projection, so Z+18.975 at the Z-6.025 cut) passes
# 3 mm or more beside every beam and nut, because the beam top (Z+17.15) and the
# nut stand higher than 3 mm under the collet: the top arc is nearest the upper
# rail away from X0 and the bottom arc nearest the lower rail near X0, so the
# upper pair moved from X+-70 to X+-30 and the lower pair to X+-130. Each clamp
# stays over its rail rest; the CLEARANCE table gives the distances.

# S4 pivot shoulder screw with its bored washer (illustrative example rocker-only
# fastener, one owner; the washer bore cuts only the washer). Frame: origin on the
# pivot axis at the upper hub face, +z up; S4 poses it at frame-A origin [0, 0, 0],
# x = [1, 0, 0], z = [0, 0, 1]. The 6.49 lapped shoulder fits the 6.50-6.53 reamed
# bore (datum A) and the plate's 6.500 H7 locating bore; the shoulder ends 0.3 mm above
# the end of that bore's full size, so the head clamps washer -> hub -> hub stand. Pedro ruling 2: the
# screw is unhardened 4140, its 8 mm head and 6.49 shoulder turned and ring-lapped in
# one chucking; head-to-shoulder TIR spec 0.01 (the S4 pickup limit), goal 0.003,
# measured and recorded; slot drive (1.0 x 1.5). Main ruling (HA#1239): the washer is a
# clamp washer only, as-supplied O1 drill rod with a drilled 6.6 bore.

# S3/S4 rod-hole diamond pin (illustrative example rocker-only item, one owner): an
# in-process orientation locator, not datum C. Datum C is the finished rod-side tip
# land, cut in S4 op 40 and inspected off-machine in S4 op 50. Frame: origin on the
# rod-hole axis at the lower strap face (the pad-top plane), +x radial from the pivot
# to the rod hole, +z DOWN into the plate. S3 and S4 pose (same, permanently bonded
# in the plate): origin [133.067402, 8.456064, -4.80175] (the pad-top plane: the lower
# strap face at the 7.080 hub aim, as the profile fixture is posed), x = [0.997987, 0.063419, 0],
# z = [0, 0, -1]. The working tip is drawn Ø2.0035, 0.0005 under the 2.004 reamed rod
# hole the S2 reamer leaves, as its preloaded land contact; the bought pin itself is 1.9863-1.9873. Pedro ruling 3: a bought Class X gauge pin (1.9863-1.9873) is the
# working tip, bonded with Loctite 638 into a turned, unhardened 4140 body whose
# 2.990-2.998 shank is a bonded slip fit in the plate's reamed 3.00 hole and whose
# Ø4.5 collar seats on the plate top (Z-15..-9.1). Flats 1.76 across along the radial
# line: the full round lands orient the part about datum A in the reamed 2.000-2.010
# rod hole (0.0127-0.0237 diametral clearance); the flats tolerate the rod hole's
# radial position. Tip ends at Z-2.4, below the upper strap face. AUTHOR'S CHOICE: no
# neck; the bare Ø1.987 pin stands from the collar top to the tip, because the S4 op
# 25/27 end mill runs down to Z-6.02825 beside the rod hole: the old Ø3.0 neck stood
# 0.5 nearer that cut than the pin does, and the collar top stays 3.07 below the
# cutter tip. The pin carries no Z: the strap pads do. It is the positive tangential
# stop for the S4 closing profile pass (op 27) only, after the retained web is cut
# (the web reacts the earlier passes); in S3 the straps react the loads. Before
# tightening, the part is preloaded CCW (viewed from above, looking down -Z) against
# it. It is never a clamp or lift.

# S2 adjustable support jacks (illustrative example matched pair; passive supports,
# not clamps). Frame: origin on the jack axis at the head's bearing face under the
# strap, +z DOWN toward the riser bar (a passive support reacting upward, so its
# bearing face lies along -pose.z). S2 poses two at frame-B origin [+-40, -1,
# -4.80175] (the S1-finished strap face at the 7.080 hub aim), z = [0, 0, -1],
# x = [1, 0, 0]: at the nominal 19.45 mm working extension the base sits on the
# riser-bar seat at Z-24.25175; the screw adjusts to the actual strap face. Run each
# 1/4-20 screw up to touch the S1-finished strap face without lifting the part, then
# jam the lock nut on the body. Everything wider than the 10 mm head stays below local
# z 7.25 (world Z -12.05175), under the raw blank bottom at -11.55175. About 4 mm of exposed thread
# between head and lock nut gives roughly +-2 mm of adjustment about nominal.

# S1/S2 blank-end position stop (illustrative example rocker-only assembly, one
# owner): a switchable rare-earth magnetic base on the fixed (rear) jaw's external
# left end face carries a rigid steel arm. The arm runs left, behind the rear jaw's
# inner plane, to a finger outside the blank's left end. The finger's hardened nose
# gently touches the raw left end face (the full-height ear) at X-170. It only
# positions the blank along X before the jaws close: no cutting or clamping load.
# The Pedro vise is unmodified. Frame: origin at the fixed jaw's left end, on its
# inner (gripping) plane at the jaw top, x = setup +X, y = toward the back of the
# vise, z = up. Base placement: its magnetic face (local x = 0) flat on the jaw's left
# end face, body local x -30..0, y 0.5..17.5 (front side 0.5 behind the gripping
# plane), z -25..-1 (top 1.0 below the jaw top), on/off knob on its back side
# (y 17.5). Screw axis: the one M6 SHCS runs along local x at y 9.0, z -6.0, through
# the finger and the arm into the base's M6 back tap. AUTHOR'S CHOICE: every stop
# dimension on the 0.1 make grid (arm 65.2, key slot 0.5, nose 4.0 proud), so the
# nose face is at local x -90.7 and the nose axis at y -32.5 (blank centre), z -0.3.
# The nose sets the blank end at X-170, so the jaw end sits at X-79.3: the jaws are
# centred 0.0369 right of the blank centre (jaw_width 6.247 in = 158.6738 mm).
# Poses (x = [1, 0, 0], z = [0, 0, 1]), z at the jaw top: S1 [-79.3, 37, -4.68295]
# (nose at Y4.5); S2 [-79.3, 28, -4.70645] (nose at Y-4.5). The arm stays >= 3.5 mm behind the rear
# jaw plane (outside the blank) and the finger and nose at X <= -170, so no steel
# enters the cutter-clear region (X >= -160 inside the rails).

