# up as an end-mill "profile" row, so the drilling data rides on the member as its chart (read
# before any cutting-data row). feed_mm_min = rpm x 2 flutes x chip load = rpm x feed per rev.
chart = "LMS Cutting Speeds, Drilling & Reaming table, row Plain carbon steels (1006...1018...1026): drilling 60-100 ft/min, low end 60 used (https://littlemachineshop.com/pages/cutting-speeds); UF MAE Design Lab Speeds and Feeds, table Recommended Feed Rates for 2 Flute HSS & Carbide Drills, row 1/8 to 1/4 in: 0.002-0.004 in/rev (https://web.mae.ufl.edu/designlab/Advanced%20Manufacturing/Speeds%20and%20Feeds/Speeds%20and%20Feeds.htm); AUTHOR'S CHOICE 0.001 in/rev = 0.0254 mm/rev, half the low end, because each chain hole leaves only a 0.75 mm web to the previous one and a light feed keeps the point from walking into it; / 2 flutes = 0.0127 mm/tooth"
sfm = 60.0
chip_load_mm_per_tooth = 0.0127

