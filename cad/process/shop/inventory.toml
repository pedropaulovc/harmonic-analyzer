# Illustrative purchase choices for the bonded-sleeve route: socket drills and reamers,
# a socket bore gauge, and the bench cradle the sleeves cure in. The fit bands and the
# retaining-compound procedure belong to built-up.toml.




# Pre-ream drills for the post-cure crank and journal bores: jobber-length, straight shank.
# Each leaves 0.23 mm on diameter for its decimal reamer (Machinery's Handbook 27th ed.
# p.833 allowance 0.005-0.010 in = 0.127-0.254 mm; p.1133 .004-.008 in per side).



# Gauge rods for the S11 crank-bore angularity check: each rests on the bottom of its reamed
# bore and carries the bore axis 40 mm past both ends for the height-gauge DTI.


# Shop-made gauge arbor for the S6 bond cradle: it beds in both matched seats as the S5 post
# does, so its crown carries the post axis for the pin-top readings (from the post axis,
# harmonic-analyzer MHA-DT-005-TL-01); the relief between the sections clears the pins.

# Shop-made jaw buttons for the cone S11 vise hold: one between each soft jaw and a cone-sleeve
# cap, its spigot in the reamed Ø12.27 journal bore. HA print MHA-DT-005-TL-03: face Ø15.0 (.X,
# 14.2-15.8) and spigot Ø12.2 +0/-0.05; the largest face shifted by the largest spigot float
# (0.135) stays under the Ø17.26 socket mouth and the smallest still covers the bore edge, so a
# button bears on the cap annulus only; the 3 mm face holds each jaw off the body.



# S10 saw cradle (illustrative example shop-made item, cone-pivot-post only), to the
# harmonic-analyzer print MHA-DT-005-TL-02 (HA #1249, 3219f2698): one milled 1018 block, no
# screws or dowels. Local frame = cone plan frame B6: post axis along -X (head top X0, foot B
# X86), cone cross-bore axis vertical (+Z, south cap up), so the post's body axis is Y0 Z0.
# Two saddles, milled from the solid, carry the body at X28.5..41.5 and X66..80 (clear of the
# head shoulder at X26.6, the crank sleeve at X2.3..24.3 and the cone sleeve at X44..61.2).
# Their seats are bored Ø43.6 together on one axis, larger than the largest printed body, with
# the seat bottoms on the nominal body's underside line (Z-21.0055), so the seat axis stands
# 0.7945 above the post axis. An 8 x 28 land under the cone axis (X48.63..56.63, Y-14..14) is
# left proud and milled down to suit the post until the north cap bears with the body seated,
# so the bridge's load runs down the cone sleeve onto the land and never through the bonded
# joint; it is drawn at its fitted nominal, flush with the seat bottoms. The 19.0 mm base ends
# at X2, 3 mm on the kept side of the 1.5 mm kerf at X-2.5..-1; the raw tail overhangs it and
# falls clear. The base is gripped across its 100 mm width by the bandsaw's own vise; those
# jaws (110 x 12 x 60 mm, from vise-bandsaw-4x6) are drawn here as closed on the base, rear jaw
# at +Y, so the scene shows every solid.

# S10 cap bridge (illustrative example shop-made two-stud bridge, cone-pivot-post only).
# Frame: origin at the centre of the brass pad's underside on the south cap, +x along the
# beam, +z away from the work. S10 poses it at B6 [52.63, 0, 21.0505], x = B6 +Y: the pad
# bears on the south cap annulus and the 76 mm beam spans the post with studs at B6 Y+-30
# (4.2 mm clear of the body), screwed into the cradle base taps. The pad is 16 mm square so
# along the post axis it stays inside the Ø17.26 socket mouth: wherever it overhangs the
# sleeve its corner is over body that has curved at least 0.25 mm away, so only the cap,
# never the body, can carry the clamp load.

# S11 vise configuration (illustrative example): the PM 6 in vise with shop-made 6061
# aluminium soft-jaw plates on its M10 jaw bolts in place of the hardened plates. The
# plates are 19.1 mm thick and stand 63.5 mm above the vise bed (18.55 mm above the
# hardened-jaw top), so on 1/2 in parallels they reach Z50.8 above foot B: over the full
# 17.2 mm cone caps (Z24.77..41.97) and below the head shoulder (Z59.4) and crank sleeve
# (Z61.7). Body facts are the vise-pm-6 readings; the opening loses the thicker plates.

