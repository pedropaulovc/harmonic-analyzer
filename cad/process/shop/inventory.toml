# Threading for shop-made fixtures (Main ruling, 2026-10: ANSI inch UNC, 2B internal;
# M4 -> #8-32, M5 -> #10-24, M6 -> 1/4-20, larger as needed up to 3/8-16). Taps and dies are
# Drill America / Tap America, from DrillsandCutters.com. All geometry is vendor-listed
# nominal, labelled as example readings.
# Drills: no new drills. tools.drill-index-115 (coverage "#1-60", "A-Z" and "1/16-1/2 by
# 64ths") already resolves every tap and clearance drill below as drill-index-115/<size>,
# e.g. drill-index-115/#25 or drill-index-115/F. The resolver's drill_index branch
# (src/prechips/rules/resolution.py:363-383) covers this. The diameter is unknown unless
# the index's nominal_dia_mm lists it.
#   thread    tap drill: 75% / LMS steel   clearance: close / free (LMS chart)
#   #8-32     #29 / #27                    #18 / #16
#   #10-24    #25 / #20                    #9 / #7
#   1/4-20    #7 / 7/32                    F / H
#   5/16-18   F / J                        P / Q
#   3/8-16    5/16 / Q                     W / X
# Sources: the 75% drill is each tap's "Matching Drill Bit" on its vendor page. The LMS
# steel drill and the close/free clearances are from the LittleMachineShop tap and
# clearance drill chart, https://cdn.shopify.com/s/files/1/0671/3157/2405/files/tapdrillsizes.pdf
[tools.taps-unc-hand]
name = "UNC hand taps, plug and bottoming"
kind = "tap_set"
