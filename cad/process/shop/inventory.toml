note = "Vendor data. Fuji Tool Grade A radius gauges, read live 2026-10-17 on the maker's English and Japanese pages and the ZenPlus/edenki listing: 272HRMAA is 9 leaves, R0.2 to R1.0 by 0.1 mm, carbon tool steel (SK) hardened to HRC 50 +/-2, leaf accuracy +/-0.01 mm for 0.2R-1.0R. The 272 type is the corner-groove gauge: each leaf carries one R for internal inspection (a fillet in a corner) and one for external inspection (a rounded edge), stored by size at both ends of the case. Selection (agent recommendation 2026-10-17, not an owner ruling): the hardened Grade A set over the SPCC 272MAA, because its R0.2 leaf is held to +/-0.01 mm and its tip resists denting. Use: check that the pressed hub-to-strap corner is at most R0.2, any fillet or burr in it included. Wipe the corner clean, set the R0.2 leaf's internal-inspection R into the corner in a plane through the hub axis and sight it against a backlight. Both straight flanks seat on the hub wall and the strap face with no light: the corner is no larger than the leaf's own radius. The leaf rides on the corner with light along a flank: the corner exceeds the leaf's actual radius; reject only if that radius is known to be 0.200 mm or more, otherwise the result is inconclusive and needs another qualified method. The R0.3 leaf brackets the limit from above. The set has no leaf under R0.2, so a sharp corner reads only as at most the leaf's radius. Decision rule: the maker holds the leaf to R0.2 +/-0.01 mm, so a seat alone proves only R0.21 or less against the R0.2 MAX limit. Before this gauge accepts the limit, establish the R0.2 leaf's actual tip radius (maker inspection data, or a comparator or measuring-microscope reading) and accept on a seat only if it is 0.200 mm or less; with a larger leaf a seat is inconclusive and the corner needs another qualified method. Receipt: checking the leaf markings and that the R0.2 and R0.3 tips are undamaged under a 10x loupe establishes identity and condition only, not leaf size; no calibration certificate is claimed."
