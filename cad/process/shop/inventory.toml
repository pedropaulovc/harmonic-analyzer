# they do not supersede the adjacent new fact-local records. Catalog citations are kept.
# Solids retain authored positions/axes and make dimensions: whole-primitive measurement
# metadata qualifies the trial physical-size/fit surrogate, not proof of those placements
# or padded void extents. Scalar/vector-only fields carry provenance in comments only.
# No item ownership, purchase authorization, calibration certificate or validation is
# asserted by this cutover; unknown/unowned identity records remain unresolved.
