# Rocker profile template (illustrative example item made to order by an outside wire-EDM
# and grinding shop, because this shop cannot hold an R800 blade edge; every size below is
# an example value, plausible, not measured). A 380 x 110 x 12.7 mm ground steel base
# plate with a pressed 6.500 h6 pivot pin, a 2.000 diamond pin (flats radial) at the
# nominal rod-hole position X133.067 Y8.456 and a 14 mm x 3 mm deep relief under the hub,
# so the finished part lies on its lower strap face. Two 2.0 mm ground blades are doweled
# and screwed round it, each working edge 1.00 mm outside the nominal outline: top blade
# R799.00 and bottom blade R817.00 about the arc centre 808.00 above the pivot pin. Gaps
# are read with the kit's 0.02-1.00 mm feeler set at stations engraved on the blades;
# arc-length limits are lines engraved radially through the centre (top blade X+-144.808
# and +-145.309, bottom blade X+-132.668 and +-133.172 from the pivot pin, for arc lengths
# 291.59/292.61 and 266.19/267.21). A loose land square (40 mm convex R800.00 stock
# face ground with the top blade, 12 mm blade square to it at its end within 0.01 over
# 10) beds on the part's own top edge to read each tip-land angle off the template.

