# Hub filing buttons for MHA-CH-06 (Pedro 2026-10-11: the rotary table cannot swing the
# 336 mm blank, so the hub OD is stair-milled and filed to buttons). Two hardened O1 buttons
# (MHA-CH-06-TL-04) on a headed stud (MHA-CH-06-TL-05) through the reamed pivot bore. The
# stud tail is gripped in the bench vise and a #10-24 hex coupling nut (McMaster 90264A425,
# 3/4 in long, 5/16 in across flats) clamps the stack. The TL CAD parts are retired (Numbers
# reserved); the solids below carry the kit's geometry inline.
# Local frame: stud axis Z, Z0 on the upper hub face (P02), lower hub face at Z-7.0565.
# Shop-process acceptance retained from fcfc947c4:cad/scripts/ch_rocker_arm_tl_filing_button_spec.py
# and ch_rocker_arm_tl_filing_stud_spec.py (former TL-04/TL-05 bands), checked by
# test_process_shop.py against this inventory and the live rocker.
# The arm's hub OD is Ø9.69-10.71, hub coaxiality Ø0.10 to A and pivot bore Ø6.50-6.53:
#   button OD 10.070-10.330; button bore 6.505-6.515 (lapped, slides on the stud by hand);
#   stud body 6.485-6.490; button OD runout to its bore 0.025 TIR.
#   Centre shift (docs/rules-coordinates.md manual_arc), worst case of those bands:
#   (6.53-6.485)/2 + (6.515-6.485)/2 + 0.025/2 = 0.0225 + 0.015 + 0.0125 = 0.05, so the
#   filed hub is Ø9.97 (10.07 - 0.10) to Ø10.43 (10.33 + 0.10), inside 9.69-10.71. The filed
#   OD's axis is within 0.05 of the bore's, a coaxiality of Ø0.10.
# Stack: buttons 3.87-4.13 each + hub 7.0565-7.1065 = 14.7965-15.3665 above the stud head;
# the body runs 13.9 (13.64-14.16) from the head's seat face to the thread-relief shoulder,
# under the stack top, so the nut seats on the upper button. The faced tip is 26.0 from the
# seat. Head Ø9.0 x 5 and the nut corners (Ø9.17) stay inside the button OD (10.07 min), so a
# file riding a button rim never touches them. Tail Ø8.0 x 30: 25 in the vise jaws, 5 bare
# below the head; overall length 61.
# Make: buttons from O1 drill rod, turned, drilled and reamed, torch-hardened (canola-oil
# quench) and tempered, then faces, bore and OD lapped. Stud turned in one chucking from
# 4140 pre-hardened rod (HRC 32) and left unhardened.
# Hardening (Pedro 2026-10-11): torch kit and canola quench bought (tools.map-torch-kit,
# consumables.quench-oil-canola). verify = false is an ASSUMED placeholder pending Pedro's
