# Copied from https://github.com/pedropaulovc/prechips/blob/0dd7614/examples/inventory/pedro-shop.toml
# Inventory verification flags and author-choice process proposals are unchanged.
# Pedro shop inventory, rev 6. No purchases or measurements added.
# YAML nulls are the explicit string "unknown"; all original verify flags remain.
# Category cutover: workholding → fixtures; measuring → gauges; collet/QCTP sets → holders.
# Under PLAN rev 6, verify = true always makes dependent results unknown, not warn/pass.
# Drill nominal diameters below are cited identities, not measured geometry.
# Centre-drill angle_deg = 60 is a centre-seat angle, NOT a drill point_angle.
