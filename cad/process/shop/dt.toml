# hub pair (common.toml gauges.plug-gauges-4000-4005): Vermont Gage standard
# Class X steel pin/plug gages, .2510 GO (plus tolerance) and .2515 NO-GO
# (minus tolerance), each ± .000040 in (= 0.001016 mm, the resolution here).
# Not owned: to buy (cad/config/shop-equipment/ gauges, same key). The tools
# record lets a plan list the pair in its tooling.
[tools.plug-gauges-2510-2515]
description = "Plug gauge pair, .2510 GO (plus) and .2515 NO-GO (minus), Vermont Gage Class X"

# --- MHA-DT-14 pinion bracket strap (cad/process/dt_pinion_bracket/plan.toml) ---
# Go/no-go pairs for its other two reamed sizes, as the .2510-.2515 pair
# above: Vermont Gage standard Class X steel pin/plug gages, GO at the low
# limit (plus tolerance) and NO-GO at the high limit (minus tolerance), each
# ± .000040 in (= 0.001016 mm, the resolution here). The arbor bore Ø.3125
# +.0010/+.0015 (.3135-.3140) and the follower seat Ø.1570 +.0005/.0000
# (.1570-.1575). Not owned: to buy (cad/config/shop-equipment/ gauges, same
# keys). The tools records let the plan list each pair in its tooling.
[tools.plug-gauges-3135-3140]
description = "Plug gauge pair, .3135 GO (plus) and .3140 NO-GO (minus), Vermont Gage Class X"
[tools.plug-gauges-1570-1575]
description = "Plug gauge pair, .1570 GO (plus) and .1575 NO-GO (minus), Vermont Gage Class X"
# The follower seat's FLAT-BOTTOM REAM (.1570 +.0005/.0000, .16 deep, floor
# corners R.008 max): a chucking reamer's 45° lead cannot reach the floor
# corner, so the seat takes a bottoming (square-end, end-cutting) reamer,
# bought with its corner break .002 in max to stay inside R.008. Not owned:
# to buy (cad/config/shop-equipment/ tools-reamers-taps, same key).
# diameter_mm is its nominal size.
[tools.reamer-1570-bottoming]
