# --- Class ZZ go/no-go pins for the dt-only reamed bands ---------------------
# Owner ruling 2026-11-23 (tool audit Q1, re-answered on the corrected facts),
# verbatim: "ZZ singles per the record: 29 pins (17 plus GO, 12 minus NO-GO),
# about $130. Accept that good holes near a limit may be refused; the traveler
# mikes each pin so the real window is known per pin." Same scheme as the
# shared bands in common.toml (zz-pins-3135-3140, zz-pins-0930-0935): GO a
# plus pin at the low limit (the limit to .0002 over), NO-GO a minus pin at
# the high limit (.0002 under to the limit), from the .061-.500 minus box
# where that limit is a whole thousandth (cad/config/shop-equipment/
# gauges.toml gauges.pin-gauges, the #3075 record). range_mm is the band; the
# resolution is one pin's Class ZZ tolerance, .0002 in = 0.00508 mm. Of the
# Class X pairs only .0930-.0935 (MHA-DT-11) keeps its records: the
# crankshaft's test reads its range (test_dt_crankshaft_process.py).
# .3760-.3765: MHA-DT-02 arbor bore, MHA-DT-31 hub bore (MHA-DT-11 re-gauges
# the hub's).
[gauges.zz-pins-3760-3765]
range_mm = [9.5504, 9.5631]
resolution_mm = 0.00508
[tools.zz-pins-3760-3765]
description = "Class ZZ pins for .3760-.3765: GO .3760 plus (single), NO-GO .3765 minus (single)"
# .2510-.2515: MHA-DT-18 pivot and lift bores, MHA-DT-23 bore, MHA-DT-14.
[gauges.zz-pins-2510-2515]
range_mm = [6.3754, 6.3881]
resolution_mm = 0.00508
[tools.zz-pins-2510-2515]
description = "Class ZZ pins for .2510-.2515: GO .2510 plus (single), NO-GO .2515 minus (single)"
# .2500-.2505: MHA-DT-20 pivot bore.
