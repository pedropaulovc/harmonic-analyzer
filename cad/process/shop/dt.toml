range_mm = [6.35, 6.3627]
resolution_mm = 0.00508
[tools.zz-pins-2500-2505]
description = "Class ZZ pins for .2500-.2505: GO .2500 plus (single), NO-GO .2505 minus (single)"
# .0625-.0630: MHA-DT-38 bushing bore.
