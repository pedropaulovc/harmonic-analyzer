# --- Lathe settings for the drill-rod pins (MHA-DT-25, MHA-DT-29) ----------------
# lathe-ar-o1 (O1 drill rod, annealed as supplied; the 1/8 in rod may be O1 or
# W1, stock-to-order drill-rod-1-8, the slower O1 row serves both) is in
# lathe.toml: MHA-MG-07 needs it too.

# The cam pin's R.125 form tool cuts its whole width at once: University of
# Florida EML2322L "Parting Facts" (lathe.toml header), the 300 rpm start for
# a full-width form cut, fed along Z by hand with cutting oil.
[settings.lathe-form-r125-o1]
tool = "form-tool-r125"
material = "lathe-o1-drill-rod"
rpm = 300
feed = "carriage handwheel along Z, a slow steady feed, cutting oil"

# --- MHA-DT-38 cone tip bushing (cad/process/dt_cone_tip_bushing/plan.toml) --
# Facing, turning, chamfering and parting take shop/lathe.toml's C360 rows.
# LittleMachineShop "Cutting Speeds" (read live 2026-11-22, lathe.toml header),
# Drilling & Reaming, Brass (C36000): drilling and reaming both 160-175
# ft/min. The low end asks about 10,000 rpm of the #53 drill and the .0625
# reamer; both clamp to the lathe's 2000 rpm top speed.
[settings.lathe-drill-53-c360]
tool = "drill-53"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, light and steady, dry; back fully out to clear chips"
[settings.lathe-ream-0625-c360]
tool = "reamer-0625"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, slow and light, dry; withdraw with the spindle running"

# --- MHA-DT-39 cone tip end screw (cad/process/dt_cone_tip_end_screw) --------
# The bought 18-8 screw's pivot hole. LittleMachineShop "Cutting Speeds" (read
# live 2026-11-22, lathe.toml header), Drilling & Reaming, Stainless steels
# (Austenitic) 201-348 (18-8 is 302/304): drilling 50-55, reaming 30-35
# ft/min; each takes the low end. The centre drill and the #53 drill ask over
# 3000 rpm and clamp to the lathe's 2000; the .0630 reamer 1819 rpm. 18-8
# work-hardens under a rubbing edge: a steady positive feed and cutting oil.
[settings.lathe-centre-18-8]
tool = "centre-drills-carbide-60"
material = "lathe-18-8"
sfm = 50
feed = "tailstock quill by hand, a steady positive feed, cutting oil; never dwell"
[settings.lathe-drill-53-18-8]
tool = "drill-53"
material = "lathe-18-8"
sfm = 50
feed = "tailstock quill by hand, a steady positive feed, cutting oil; back fully out to clear chips, never dwell"
[settings.lathe-ream-0630-18-8]
tool = "reamer-0630"
material = "lathe-18-8"
sfm = 30
feed = "tailstock quill by hand, steady, cutting oil; withdraw with the spindle running"

# --- MHA-DT-31 crank hub (cad/process/dt_crank_hub/plan.toml) ----------------
# Facing, turning, the L drill and parting take shop/lathe.toml's 1018 rows.
# LittleMachineShop "Cutting Speeds" (read live 2026-11-22, lathe.toml
# header), Drilling & Reaming, Plain carbon steels 1006-1026: drilling 60-100,
# reaming 40-65 ft/min; each takes the low end (the 23/64 drill 637 rpm, the
# .3760 reamer 406 rpm).
[settings.lathe-drill-23-64-1018]
tool = "jig-drill-23-64"
material = "lathe-1018-cold-finished"
sfm = 60
feed = "tailstock quill by hand, steady, cutting oil"
[settings.lathe-ream-3760-1018]
tool = "reamer-0376"
material = "lathe-1018-cold-finished"
sfm = 40
feed = "tailstock quill by hand, slow and steady, cutting oil; withdraw with the spindle running"

