# cutting settings and stock only dt_* plans name (or dt specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# Source: ch_rocker_arm_tl_oblique_carrier/plan.toml (MHA-CH-06-TL-21 v49).
# Number and letter drills are the 115-piece index's (jig-drill-11-32);
# diameter_mm and tap_drill_mm are the standard nominal sizes × 25.4: #43
# .089 (4-40 tap drill), 23/64 .3594 (reamer pilot); the F drill and 5/16-18
# plug tap are the blocks' records (tools.jig-drill-f, jig-tap-5-16-18-plug).
# The .3760 reamer is the owned over reamer named in
# cad/scripts/_fit_ream_slide.py (REAM_SLIDE); its cutting size is its nominal.
