# Measuring stick (ms_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only ms_* plans name (or ms specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# HA: the MHA-MS-01 stick's engraving bit (cad/config/shop-equipment/
# tools.ms-stick-engraver: make, SKU, 30 deg V, .005 in tip) on its brass,
# read by test_ms_stick_drawing. Source: 2L "Feeds and Speeds for Engraving
# with an Engraving Tool" (engraving_tool_speed_and_feed_table.pdf, read live
# 2026-11-11), row Brass/Bronze: .002 in/tooth, 6 in/min at 3,000 rpm, halved
# for small tip widths as its note says: .001 in/tooth, so 2.8 in/min at the
# PM-30MV's 2800 rpm top speed (owner 2026-11-16)
# by handwheel, plunge at half that; passes .005 deep, the last .001-.002 at a
# slower feed to leave no burr. diameter_mm is the 1/8 in shank (the bit's
# body); the cutting width is the V at depth, set by the equipment record.
[tools.ms-stick-engraver]
description = "MHA-MS-01 engraving bit, see cad/config/shop-equipment/ tools.ms-stick-engraver"
diameter_mm = 3.175
[settings.ms-stick-engrave-brass]
tool = "ms-stick-engraver"
material = "ms-stick-brass"
rpm = 2800
feed = "2.8 in/min"

# --- MHA-MS-03 stop plate (cad/process/ms_stop_plate/plan.toml) ---
# The owned 7-piece deburring scraper set (cad/config/shop-equipment/
# tools.deburring-set, McMaster 4289A78): the plate's edges and hole mouths.
[tools.deburring-set]
description = "7-piece deburring scraper and countersink set (McMaster 4289A78)"
# The plate's Ø.094 +.004/0 holes: no pin gauges are owned (gauges.pin-gauges
# is to_order). As MHA-MG-02's bore (gauges.clamp-bore-drill-shanks), a drill
# shank of the owned 115-piece index, miked first, is the NO-GO: the #40
# (.098 in, nominal × 25.4) does not enter. The lower limit rests on the
# miked #41 (.096 in) that cuts the hole; no GO is owned at .094. The check
# reads no scale: its resolution is the micrometers' reading of the shank;
# its range is the drawing band it accepts (as clamp-bore-drill-shanks).
[gauges.ms-plate-hole-drill-shanks]
range_mm = [2.3876, 2.4892]
resolution_mm = 0.00254

# --- Stock the process plans name (stock_refs) ---------------------------------
# One record per cad/config/shop-equipment/stock-*.toml key a plan names, so
# prechips can check each plan's stock_refs. Description only: the ownership
# status stays in the inventory under the same key (stock assignment audit,
# owner 2026-11-19).
[stock.c360-flat-1-8x3-8]
description = "C36000 free-machining brass (360-H02, extruded), flat bar, 1/8 x 3/8 in"
