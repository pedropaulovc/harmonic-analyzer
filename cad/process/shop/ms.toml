# Measuring stick (ms_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only ms_* plans name (or ms specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# HA: the MHA-MS-01 stick's engraving bit (cad/config/shop-equipment/
# tools.engravers-esao-30-0-1: ESAO, 30 deg V, 0.1 mm tip, on hand) on its
# brass, read by test_ms_stick_drawing. ESAO publishes no feed table; the
# source is 2L's general one, "Feeds and Speeds for Engraving with an
# Engraving Tool" (engraving_tool_speed_and_feed_table.pdf, read live
# 2026-11-11), row Brass/Bronze: .002 in/tooth, 6 in/min at 3,000 rpm, halved
# for small tip widths as its note says: .001 in/tooth, so 2.8 in/min at the
# PM-30MV's 2800 rpm top speed (owner 2026-11-16)
# by handwheel, plunge at half that; passes .005 deep, the last .001-.002 at a
# slower feed to leave no burr. diameter_mm is the 1/8 in shank (the bit's
# body); the cutting width is the V at depth, set by the equipment record.
[tools.engravers-esao-30-0-1]
description = "30° included V engraving bit, 0.1 mm flat tip, 3.175 mm shank, titanium coated (ESAO 3.175*30*0.1), on hand"
diameter_mm = 3.175
[settings.ms-stick-engrave-brass]
tool = "engravers-esao-30-0-1"
material = "ms-stick-brass"
rpm = 2800
feed = "2.8 in/min"

# MHA-MS-01 stick on the CNC (cad/process/ms_stick/plan.toml): its outline,
# the owned 1/2 in 3-flute carbide end mill on the C36000 bar
# (stock.c360-flat-1-8x3-8), under the engraving setting's material key. The
# figures are settings.stop-em-half-c360's below, from the source it cites
# (6G "Carbide End Mill Speeds and Feeds, General Purpose, Uncoated", row
# Non-Ferrous N, Brass/Bronze: 400 SFM, 1/2 in .0042 in/tooth; 2800 rpm, the
# spindle's top). The stick's plan also faces its 6061 fixture bar's top
# .010 with it, because a plan has one material key: the same table's Al/Al
# Alloys row allows 500 SFM (ch.toml settings.endmill-carbide-3fl-1-8-6061),
# so 2800 rpm (367 ft/min) is under it; its 1/2 in chip load was not read,
# and the brass row's .0042 is kept.
[settings.ms-stick-em-half-brass]
tool = "endmill-carbide-3fl-1-2"
material = "ms-stick-brass"
rpm = 2800
chip_load_mm_per_tooth = 0.10668  # .0042 in; 2800 × 3 × .0042 = 35.28 in/min
flutes = 3
feed_unit = "in/min"

# --- MHA-MS-02 stop block (cad/process/ms_stop_block/plan.toml) ----------------
# The blank: C36000 free-machining brass, stock.c360-flat-3-4x1-1-4 (common).
# The material key names this bar; the sources below read their brass rows.
#
# Facing, the owned 1/2 in 3-flute carbide end mill: The Carbide End Mill
# Store "Carbide End Mill Speeds and Feeds, General Purpose, Uncoated"
# (6gtools.com, PDF read 2026-11-17, as mg.toml settings.clamp-em-half-brass),
# row Non-Ferrous N, Brass/Bronze: 400 SFM, 1/2 in .0042 in/tooth at
# chip-load factor 1.0 (50 % radial engagement: the faces' passes take at
# most half the cutter). 400 × 3.82 / .5 = 3056 rpm, over the spindle's 2800
# (machines.pm-30mv), so 2800 (367 ft/min).
[settings.stop-em-half-c360]
tool = "endmill-carbide-3fl-1-2"
material = "stop-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.10668  # .0042 in; 2800 × 3 × .0042 = 35.28 in/min
flutes = 3
feed_unit = "in/min"

# The rebate, the owned 1/8 in 3-flute carbide end mill: Harvey Tool
# "General Machining Guidelines", Carbide End Mills, Non-Ferrous table
# (harveytool.com/resources/general-machining-guidelines, read 2026-11-20),
# row Copper, Yellow Brass, High Lead Brass, Red Brass (C36000 is the
# free-cutting leaded brass): 800-1500 SFM, 1/8 in .001 in/tooth. 800 SFM on
# 1/8 in is 24,450 rpm, so the spindle's 2800 (92 ft/min, carbide running
# slow and cool); 2800 × 3 × .001 = 8.4 in/min. Plunges at half that.
[settings.stop-em-eighth-c360]
tool = "endmill-carbide-3fl-1-8"
material = "stop-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.0254  # .001 in; 8.4 in/min
flutes = 3
feed_unit = "in/min"

# The rebate's corner relief (.05 deep × .06 high, beside the roof, at the
# bottom of the .134 rebate) is plunge-milled with the plain 1/16 in end mill
# (owner ruling 2026-11-21, relayed by CncBlockA; the cutter: MSC 35497056,
# delegated ruling 2026-11-24 (Main), #3568): its tools record,
# endmill-carbide-3fl-1-16-loc-1-2, is in common.toml (MHA-PD-17 plunges
# with it too).
# Its setting, re-derived for it (#3568): its .500 of flutes on .0625 stand
# out 8x its diameter. No maker's figure for it is on record, so the
# long-reach table stands in: Harvey Tool Speeds & Feeds, Miniature End
# Mills - Square - Long Reach, Stub Flute, 9x Reach Multiple (W.C. Chapman's
# copy, shop.wcchapman.com/speeds-feeds/harvey-tool-miniature-end-mills-
# square-long-reach-stub-flute-9x-reach-multiple/, read 2026-11-21; the 9x
# table, the next longer than 8x, is the lower of the two), row Brass
# (C2xxxx-C4xxxx): 500 SFM, .062 in Slotting .00035 in/tooth; run at .0003,
# under it. 500 SFM on .0625 is 30,560 rpm, so the spindle's 2800; 2800 × 3
# × .0003 = 2.52 in/min, as before. Plunged, the load runs along the axis,
# so its fluted (slimmer) 8x is loaded as the necked one was. Plunged: .0003
# × 3 = .0009 in/rev of thrust, inside prechips' drilling feed table
# (Machinery's Handbook, from .0005 in/rev); as a side cut its .0003
# in/tooth would lie below the milling feed-factor table's .001 floor,
# which is not extended without a source.
[settings.stop-em-sixteenth-c360]
tool = "endmill-carbide-3fl-1-16-loc-1-2"
material = "stop-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.00762  # .0003 in; 2.52 in/min
flutes = 3
feed_unit = "in/min"

# The .04 × 45° roof chamfers: the owned 1/4 in 2-flute 90° carbide
# chamfering end mill (common.toml tools.chamfer-mill-carbide-1-4-90; McMaster
# 3073A46, "90 Degree Cut": 45° each side of its axis). Setting: the Harvey
# general Non-Ferrous table above, Yellow/High Lead Brass, 1/4 in .002
# in/tooth; 2800 rpm (183 ft/min on the body); 2800 × 2 × .002 = 11.2 in/min.
[settings.stop-chamfer-c360]
tool = "chamfer-mill-carbide-1-4-90"
material = "stop-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.0508  # .002 in; 11.2 in/min
flutes = 2
feed_unit = "in/min"

# Holes (HSS), as mg.toml's clamp settings and from the same sources:
# LittleMachineShop "Cutting Speeds", Drilling & Reaming, row Brass (C35600,
# C37700, C36000, ...): 160-175 ft/min (read 2026-11-17); AutoDrill
# "Suggested drilling feed rates" (read 2026-11-17), row Brass: 1/16 in .001
# in/rev, 1/8 in .003, a size between two columns taking the lower one's.
# - #2 centre drill (5/64 pilot, 3/16 body): 160 ft/min is over 3200 rpm on
#   the body, so 2800; the pilot under 1/8 in, .001 in/rev: 2.8 in/min.
# - #43 (.089 in): 160 ft/min is 6870 rpm, so 2800 (65 ft/min); between the
#   1/16 and 1/8 in columns, .001 in/rev: 2.8 in/min.
[settings.stop-spot-c360]
tool = "jig-spot"
material = "stop-c360"
rpm = 2800
feed = "2.8 in/min"
[settings.stop-drill-43-c360]
tool = "jig-drill-43"
material = "stop-c360"
rpm = 2800
feed = "2.8 in/min"

# --- MHA-MS-03 stop plate (cad/process/ms_stop_plate/plan.toml) ---
# The plate's Ø.094 +.004/0 holes: no pin gauges are owned (gauges.pin-gauges
# is to_order). As MHA-MG-02's bore (gauges.clamp-bore-drill-shanks), a drill
# shank of the owned 115-piece index, miked first, is the NO-GO: the #40
# (.098 in, nominal × 25.4) does not enter. The lower limit rests on the
# miked #41 (.096 in) that cuts the hole; no GO is owned at .094. The check
# reads no scale: its resolution is the micrometers' reading of the shank;
# its range is the drawing band it accepts (as clamp-bore-drill-shanks).
[gauges.ms-plate-hole-drill-shanks]
range_mm = [2.3876, 2.4892]
resolution_mm = 0.00254

# --- Stock the process plans name (stock_refs) ---------------------------------
# One record per cad/config/shop-equipment/stock-*.toml key a plan names, so
# prechips can check each plan's stock_refs. Description only: the ownership
# status stays in the inventory under the same key (stock assignment audit,
# owner 2026-11-19).
[stock.c360-flat-1-8x3-8]
description = "C36000 free-machining brass (360-H02, extruded), flat bar, 1/8 x 3/8 in"
# The stick's fixture bar (cad/process/ms_stick/plan.toml): the 12 in bar,
# freed by the oblique jig's deletion (inventory note, same key), used whole.
[stock.6061-flat-1-2x1-12in]
description = "6061-T6511 aluminium, flat bar, 1/2 x 1 in, 12 in length"
