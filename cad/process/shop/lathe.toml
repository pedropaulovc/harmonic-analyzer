# Lathe records for the turned bushes, spacers, rings, washers, collars, cups
# and plugs that several families' plans (ch, dt, mg, sm) turn on the
# PM-1127VF-LB: the turning and parting tools and their cutting settings by
# material. A set several families need, so its own topic file (common.toml
# header; cad/process/README.md, "Shop records"). Drills, centre drills and
# taps stay where their other readers keep them (common.toml or the family
# file); only their lathe settings are here.
#
# Cutting speeds: LittleMachineShop, "Cutting Speeds"
# (https://littlemachineshop.com/pages/cutting-speeds, read live 2026-11-21).
# Turning rows are "adjusted to the feed rate of the mini lathe (0.004/rev.),
# a depth of cut of 0.040"; the settings take that .004 in/rev (0.1016 mm/rev)
# and the low end of each range:
# - Plain carbon steels (1018): turning HSS 125-215, carbide 800-885 ft/min;
#   drilling 60-100 ft/min.
# - Brass (C36000): turning HSS 300-350, carbide 1170 ft/min; drilling
#   160-175 ft/min.
# - Aluminium (6061-T6): turning carbide 2820 ft/min; drilling 350-400 ft/min.
# - 1018 milling 65-110 ft/min (a chamfer mill plunged from the tailstock
#   takes the milling row).
# On these small diameters most speeds exceed the lathe's 2000 rpm top speed
# and clamp to it (prechips fits every calculated rpm to the machine's
# ranges).
# Parting: University of Florida EML2322L, "Parting Facts"
# (https://web.mae.ufl.edu/designlab/Advanced%20Manufacturing/Lathe%20Parting/Parting%20Facts.pdf):
# part at about 60 % of the turning speed and under 600 rpm, starting at
# 300 rpm, fed by hand with cutting oil, backing out to clear chips. The
# settings take the 300 rpm start for every material; brass is parted dry,
# as it is drilled.

# Moved from ch.toml: the rocker hub (ch), washer (ch), collar (dt), ferrule
# (dt), pinion cam (dt) and spacer (mg) plans read it, and it faces the
# MHA-CH-06 kit nut. The AR holder is the A R Warner LMS
# 4132 set's (TCMT insert, R0.4 nose); ownership: cad/config/shop-equipment/
# tools-cutting.toml tools.lathe-ar, same key.
[tools.lathe-ar]
description = "A R Warner AR carbide turning holder, TCMT insert, R0.4 nose (LMS 4132)"

# Every turned plan parts off with the P1 HSS T-type blade, on every material
# (owner 2026-11-21: "p1 hss and 0.252\""). Ownership: cad/config/
# shop-equipment/tools-cutting.toml, same key (1/16 in nominal width, the
# makers' P1 size). The plans' blade_width_in is that record; the travelers
# mike the edge and preset the DRO to the reading. The .252 in carbide
# inserts (tools.cutoff-inserts) are not used: no on-hand holder takes them
# (tools.cutoff-blade-holder is for .161 in inserts), and their kerf is four
# P1 widths.
[tools.cutoff-blade-p1]
description = "P1 HSS T-type cutoff blade, 1/16 in wide x 1/2 in high, in the AXA No. 7 parting blade holder"

# To order (owner 2026-11-21: a better parting blade): the premium P1, same
# 1/16 in kerf, for the same No. 7 holder. Ownership and the choice's reasons:
# cad/config/shop-equipment/tools-cutting.toml, same key (status to_order).
# The plans keep cutoff-blade-p1 until it is on hand.
[tools.cutoff-blade-p1-t15]
description = "P1 T15 HSS T-type cutoff blade, 1/16 in wide x 1/2 in high (A R Warner, LittleMachineShop 1728), in the AXA No. 7 parting blade holder"

# The lathe's tool post (owner 2026-11-21: LittleMachineShop 2280). Ownership:
# cad/config/shop-equipment/tools-cutting.toml, same key, with its five
# holders as members.
[tools.qctp-axa-lms-2280]
description = "AXA (series 100) wedge-type quick-change tool post set, LMS 2280: holders No. 1 turning and facing, No. 2 boring, turning and facing, No. 4 heavy-duty boring (5/8 or 3/4 in round shanks), No. 7 parting blade, No. 10 knurling, facing and turning"

