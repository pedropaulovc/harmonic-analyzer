material = "lathe-6061"
rpm = 300
feed = "by hand, steady, cutting oil; back out to clear chips"

# The turned shafts and pins (ch_fulcrum_shaft, dt_crank_pinion_pin,
# dt_pinion_pivot_shaft and mg_wheel_axle plans; lathe-ar-o1 moved here from
# dt.toml, a second family needing it). Speeds from the LittleMachineShop "Cutting Speeds"
# page above (read live 2026-11-21), low end of each range: O1 ("Cold work,
# oil hardening tool steel O1, O2, O6, O7") turning carbide 590 ft/min,
# drilling 45 ft/min (the O1 drill rod is bought annealed). The grooving
# tool cuts on a full-width edge, as a parting blade does: it takes the
# parting rule above, 300 rpm, fed by hand with cutting oil.

# The fulcrum shaft's flats, milled on the PM-30MV after its lathe setups: a
# plan has one material_key, so the 1/8 in end mill's 1018 CF row at
# Tru-Edge's chip load (ch.toml settings.endmill-carbide-3fl-1-8-1018-cf-tru-edge,
# owner ruling 2026-11-17: 2800 rpm, .001 in/tooth, its sources there; the
# 6G .0006 in/tooth is under prechips' feed-factor table) is repeated under
# the lathe plans' key.
[settings.endmill-carbide-3fl-1-8-lathe-1018]
tool = "endmill-carbide-3fl-1-8"
material = "lathe-1018-cold-finished"
rpm = 2800
chip_load_mm_per_tooth = 0.0254  # .001 in; 2800 × 3 × .001 = 8.4 in/min
flutes = 3
feed_unit = "in/min"

[settings.lathe-ar-o1]
tool = "lathe-ar"
material = "lathe-o1-drill-rod"
sfm = 590
feed_mm_rev = 0.1016

[settings.lathe-groove-o1]
tool = "grooving-tool-020"
material = "lathe-o1-drill-rod"
rpm = 300
feed = "by hand, light and steady, cutting oil"

[settings.lathe-centre-o1]
tool = "centre-drills-carbide-60"
material = "lathe-o1-drill-rod"
sfm = 45
feed = "tailstock quill by hand"

# The dome ends, swept (owner ruling 2026-11-23, tool audit Q5, option D: buy
# the LittleMachineShop "Ball and Radius Turning Tool, Small", SKU 2569, "for
# all 14 domes; step-and-file is the fallback for any dome it cannot reach").
# Maker's facts (LittleMachineShop listing and "Instructions for Using the
# Small Ball and Radius Turning Tool", updated 11/12/2024,
# https://littlemachineshop.com/instructions/SmallRadiusToolInstructions.pdf,
# read 2026-11-22): convex radii only, 0 to 3/4 in ball diameter; 3/8 in
# shank; the bit's tip 1/4 in above the shank's bottom; the radius cut is the
# tip's distance from the inner frame's pivot axis, which lies 3/16 in from
# the frame's end; a pre-ground HSS bit; "basically a finishing tool ...
# designed to take a large number of light cuts". The frame is 3/8 in wide
# (listing: 3.25 L x .375 W x 3.00 H without the handle). Ownership:
# cad/config/shop-equipment/ tools.ball-radius-turner-lms-2569, to order.
# Speeds are authored, under each material's HSS turning band above (the bit
# sweeps by hand to the axis, where the surface speed falls to zero): 600 rpm
# on steel is 39 ft/min at Ø.250, 1000 rpm on brass 65 ft/min.
[tools.ball-radius-turner-lms-2569]
description = "LittleMachineShop 2569 Ball and Radius Turning Tool, Small: convex radii to 3/4 in ball diameter, 3/8 in shank in an AXA No. 1 holder, pre-ground HSS bit"

[settings.lathe-ball-turner-1018]
tool = "ball-radius-turner-lms-2569"
material = "lathe-1018-cold-finished"
rpm = 600
feed = "inner frame swept by hand, cross slide in .003 a sweep at most, cutting oil"

[settings.lathe-ball-turner-o1]
tool = "ball-radius-turner-lms-2569"
material = "lathe-o1-drill-rod"
rpm = 600
feed = "inner frame swept by hand, cross slide in .003 a sweep at most, cutting oil"

[settings.lathe-ball-turner-c360]
tool = "ball-radius-turner-lms-2569"
material = "lathe-c360"
rpm = 1000
feed = "inner frame swept by hand, cross slide in .003 a sweep at most, dry"
