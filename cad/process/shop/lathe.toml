# MHA-SM-05 end plug: #10-24 tap drill in 1018.
[settings.lathe-drill-25-1018]
tool = "drill-25"
material = "lathe-1018-cold-finished"
sfm = 60
feed = "tailstock quill by hand, pecking, cutting oil"

# MHA-DT-35 butt cup (1018): #20 through, #1 under the pocket (shallow, no
# peck), the pocket plunged with the end mill below and the #20 hole's
