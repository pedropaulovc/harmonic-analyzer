# Pen (pn_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only pn_* plans name (or pn specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# --- MHA-PN-07 pen adjust screw (cad/process/pn_pen_adjust_screw/plan.toml) ---
# The eye on the PM-30MV (program PS01_eye), in the C360 blank. Speeds:
# LittleMachineShop "Cutting Speeds", Drilling & Reaming, row Brass (C35600,
# C37700, C36000, ...): 160-175 ft/min (read 2026-11-17, as shop/mg.toml's
# clamp holes): over 11,000 rpm on the #54 and on the #1 centre drill's 3/64
# pilot, so the spindle's 2800. Feeds per rev: AutoDrill "Suggested drilling
# feed rates" (as shop/mg.toml), row Brass, 1/16 in column .001 in/rev for
# the .055 drill and the 3/64 pilot (under 1/16 takes that column's feed):
# 2.8 in/min.
[settings.pn-centre-drill-c360]
tool = "centre-drills-carbide-60"
material = "lathe-c360"
rpm = 2800
feed = "2.8 in/min"
[settings.pn-drill-54-c360]
tool = "drill-54"
material = "lathe-c360"
rpm = 2800
feed = "2.8 in/min"

# --- Placeholder process plans' tools (quotes-2026-11-17-rev3.xlsx) ----------
# The tools the placeholder plans name (cad/process/<stem>/plan.toml with
# revision = "placeholder", not in _process_plans.TRAVELER_STEMS), from the
# owner's quote workbook quotes-2026-11-17-rev3.xlsx (owner 2026-11-19). The
# comment on each header cites its workbook row: an Items item_id, a Drills
# size or a Tap coverage thread. diameter_mm is the drill or reamer's nominal
# size. Ownership is the inventory's status under the same key
# (cad/config/shop-equipment/).
[tools.ignition-wrenches]  # F-ignition-wrenches
description = "Open-end wrench, 5/32 in (ignition size)"

# --- PN family C36000 flat brass settings (MHA-PN-01, MHA-PN-05) ---------------
# Plans: cad/process/pn_pen_frame/plan.toml, cad/process/pn_pen_v_block/plan.toml.
# Material key pn-c360-flat: C36000 free-machining brass, 360-H02 extruded
# flat bar (shop-equipment stock c360-flat-*, as bought); the sources' rows
# below are their brass rows, read for that bar. On the PM-30MV, whose low
# belt tops out at 2800 rpm (machines.pm-30mv, owner 2026-11-16).
#
# Carbide end mills: The Carbide End Mill Store "Carbide End Mill Speeds and
# Feeds, General Purpose, Uncoated" (6gtools.com,
# uploaded/files/feedsandspeeds/Carbide_End_Mill_Feeds_And_Speeds_General_Purpose_Uncoated.pdf,
# read 2026-11-21; the PDF mg.toml settings.clamp-em-half-brass cites), row
# Non-Ferrous N, Brass/Bronze: 400 SFM; 1/8 in .0011 and 1/2 in .0042
# in/tooth at chip-load factor 1.0 (50 % radial engagement and more, so the
# table's lowest load: every cut here engages 50 % or less, or slots).
# 400 SFM is 3056 rpm on the 1/2 in and 12,224 on the 1/8 in: both run at
# the spindle's 2800 (367 and 92 ft/min).
[settings.pn-em-half-c360]
tool = "endmill-carbide-3fl-1-2"
material = "pn-c360-flat"
rpm = 2800
chip_load_mm_per_tooth = 0.10668  # .0042 in; 2800 × 3 × .0042 = 35.3 in/min
flutes = 3
feed_unit = "in/min"
[settings.pn-em-eighth-c360]
tool = "endmill-carbide-3fl-1-8"
material = "pn-c360-flat"
rpm = 2800
chip_load_mm_per_tooth = 0.02794  # .0011 in; 2800 × 3 × .0011 = 9.2 in/min
flutes = 3
feed_unit = "in/min"
# Holes (HSS): the sources mg.toml's settings.clamp-*-brass cite.
# LittleMachineShop "Cutting Speeds", Drilling & Reaming, row Brass
# (C35600, C37700, C36000, ...): 160-175 ft/min; AutoDrill "Suggested
# drilling feed rates", row Brass: 1/16 in .001, 1/8 in .003 in/rev, a size
# between two columns taking the lower column's feed.
# - #2 centre drill (5/64 pilot, 3/16 body): 160 ft/min is over 3200 rpm on
#   the body, so 2800; its pilot under 1/8 in, .001 in/rev: 2.8 in/min.
# - #43 (.089 in): 160 ft/min is 6870 rpm, so 2800 (65 ft/min); .089 lies
#   between the 1/16 and 1/8 in columns, .001 in/rev: 2.8 in/min.
[settings.pn-spot-c360]
tool = "jig-spot"
material = "pn-c360-flat"
rpm = 2800
feed = "2.8 in/min"
[settings.pn-drill-43-c360]
tool = "jig-drill-43"
material = "pn-c360-flat"
rpm = 2800
feed = "2.8 in/min"

# --- MHA-PN-05 pen V block (cad/process/pn_pen_v_block/plan.toml) -------------
# Its other settings are the PN family's above (material pn-c360-flat).
# The owned 1/4 in 90° chamfer mill (common.toml
# tools.chamfer-mill-carbide-1-4-90, McMaster 3073A46: 1/8 in length of cut
# on a 1/4 in mill, so its 45° cone runs to a point) cuts the V's flanks and
# the pivot bore's top chamfer. Each V level steps 1.0 mm down with passes
# 1.0 mm apart, so the cone engages at most 3.0 mm across (the step plus
# the half-pass ridge left above it, both sides), under 1/8 in: the 6G
# table's brass row (the PDF the family block above cites) at 1/8 in,
# .0011 in/tooth; 400 SFM is 6112 rpm on 1/4 in, so the spindle's 2800
# (183 ft/min).
[settings.pn-chamfer-1-4-c360]
tool = "chamfer-mill-carbide-1-4-90"
material = "pn-c360-flat"
rpm = 2800
chip_load_mm_per_tooth = 0.02794  # .0011 in; 2800 × 2 × .0011 = 6.2 in/min
flutes = 2
feed_unit = "in/min"
# Pivot bore (HSS): the family block's LittleMachineShop and AutoDrill rows.
# - #30 (.1285 in, common.toml tools.riser-drill-30, the owned 115-piece
#   index), the bore's finish (owner ruling 2026-11-24, fit audit question
#   20): 160 ft/min is 4760 rpm, so the spindle's 2800 (94 ft/min, 26 stops
#   of 107.7); .001 in/rev, the 1/16-1/8 in columns' lower row, kept for a
#   clean finish: 2.8 in/min.
[settings.pn-drill-30-c360]
tool = "riser-drill-30"
material = "pn-c360-flat"
rpm = 2800
feed = "2.8 in/min"
# MHA-PN-04 pen rod (C36000 key stock): the #0-80 tap drill from the lathe's
# tailstock, at the C360 drill rows' 160 sfm (shop/lathe.toml
# lathe-drill-n-c360; the 3/64 runs at the lathe's 2000 rpm top), pecked.
[settings.pn-lathe-drill-3-64-c360]
tool = "drill-3-64"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, pecking, dry"
# The Ø.125 pivot turned off the 5 mm square, 4-jaw only: shop/lathe.toml
# lathe-ar-c360's 1170 sfm at the feeds prechips' turning_deflection passed
# for the overhung pivot, .002 in/rev roughing and .001 in/rev finishing
# (its .004 row feed springs the pivot past the finish limit).
[settings.pn-lathe-ar-c360-turn]
tool = "lathe-ar"
material = "lathe-c360"
sfm = 1170
feed_mm_rev = 0.0508
[settings.pn-lathe-ar-c360-finish]
tool = "lathe-ar"
material = "lathe-c360"
sfm = 1170
feed_mm_rev = 0.0254

# --- Stock the process plans name (stock_refs) ---------------------------------
# One record per cad/config/shop-equipment/stock-*.toml key a plan names, so
# prechips can check each plan's stock_refs. Description only: the ownership
# status stays in the inventory under the same key (stock assignment audit,
# owner 2026-11-19).
[stock.c360-flat-3-8x1-1-4]
description = "C36000 free-machining brass (360-H02, extruded), flat bar, 3/8 x 1-1/4 in"
[stock.c360-square-5mm-key]
description = "C36000 brass key stock, DIN 6880 undersized, square bar, 5 x 5 mm"
