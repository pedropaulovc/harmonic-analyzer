# Magnifier (mg_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only mg_* plans name (or mg specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# --- MHA-MG-02 magnifying clamp (cad/process/mg_magnifying_clamp/plan.toml) ---
# The blank: 1/2 in hex brass, alloy not on record (the part registry says
# "Brass"; owner 2026-11-17, relayed by Main: a piece at least 1.25 in long is
# on hand). Its settings below read the sources' generic brass rows, so the
# material key names this bar and asserts no alloy.
#
# Facing, the owned 1/2 in 3-flute carbide end mill: The Carbide End Mill
# Store "Carbide End Mill Speeds and Feeds, General Purpose, Uncoated"
# (6gtools.com, PDF read 2026-11-17), row Non-Ferrous N, Brass/Bronze: 400
# SFM, 1/2 in .0042 in/tooth at chip-load factor 1.0 (50 % radial
# engagement, the clamp's facing passes). 400 × 3.82 / .5 = 3056 rpm, over
# the spindle's 2800 (machines.pm-30mv), so 2800 (367 ft/min).
[settings.clamp-em-half-brass]
tool = "endmill-carbide-3fl-1-2"
material = "clamp-brass-hex"
rpm = 2800
chip_load_mm_per_tooth = 0.10668  # .0042 in; 2800 × 3 × .0042 = 35.3 in/min
flutes = 3
feed_unit = "in/min"

# Holes (HSS), speeds: LittleMachineShop "Cutting Speeds", Drilling &
# Reaming, row Brass (C35600, C37700, C36000, ...): 160-175 ft/min (read
# 2026-11-17). Feeds per rev: AutoDrill "Suggested drilling feed rates"
# (autodrill.com/resources/charts/suggested-drilling-feed-rates, read
# 2026-11-17), row Brass: 1/16 in .001, 1/8 in .003, 1/4 in .004, 1/2 in
# .008 in/rev; a size between two columns takes the lower column's feed.
# - #2 centre drill (5/64 pilot, 3/16 body): 160 ft/min is over 3200 rpm on
#   the body, so 2800; the pilot is under 1/8 in, .001 in/rev: 2.8 in/min.
# - #43 (.089 in): 160 ft/min is 6870 rpm, so 2800 (65 ft/min); .089 is
#   between the 1/16 and 1/8 in columns, .001 in/rev: 2.8 in/min.
# - F (.257 in): 160-175 ft/min is 2378-2601 rpm: 2400 (161 ft/min); .257 is
#   between the 1/4 and 1/2 in columns, .004 in/rev: 9.6 in/min.
[settings.clamp-spot-brass]
tool = "jig-spot"
material = "clamp-brass-hex"
rpm = 2800
feed = "2.8 in/min"
[settings.clamp-drill-43-brass]
tool = "jig-drill-43"
material = "clamp-brass-hex"
rpm = 2800
feed = "2.8 in/min"
[settings.clamp-drill-f-brass]
tool = "jig-drill-f"
material = "clamp-brass-hex"
rpm = 2400
feed = "9.6 in/min"

# The bore's Ø.257 +.004/0 has no gauge of its class on record (pin gauges
# and reamers of the size are not owned, owner 2026-11-17). Owner decision
# 2026-11-17 (relayed by Main): the F drill's shank is the GO and the G
# drill's shank the NO-GO, each miked first. G (.261 in) is a member of the
# owned 115-piece index (letter drills A-Z among its 115, as jig-drill-f);
# diameter_mm is its nominal × 25.4. The pair reads no scale: its
# resolution is the micrometers' (gauges.micrometers) reading of each shank;
# its range is the drawing band: the traveler accepts an F shank of
# .2570-.2575 as the GO and a G shank of .2600-.2610 as the NO-GO.
# A shank is not ground to a gauge class; an F shank under .2570 cannot be
# the GO, and the lower limit then rests on the F drill alone.
[tools.clamp-drill-g]
description = "G (.261 in) drill, 115-piece index; its shank the bore's NO-GO"
diameter_mm = 6.6294

# --- MHA-MG-03 magnifying lever (cad/process/mg_magnifying_lever/plan.toml) ---
# Its facing takes shop/lathe.toml lathe-ar-c360. Authored, no source on
# record, in the lathe's low range (70-380 rpm): single-pointing runs at the
# 70 rpm bottom speed so the cross slide can be backed out within .025 of
# carriage travel at the thread's end (the half-nuts stay closed; the spindle
# is reversed).
# Turning the thread's major between the 3-jaw and the dead centre (the
# 6.6 in rod on a plain centre): authored, at the low range's 300 rpm so the
# oiled dead centre does not gall and the slender rod does not whip.
[settings.mg-lathe-ar-c360-centre]
tool = "lathe-ar"
material = "lathe-c360"
rpm = 300
feed_mm_rev = 0.0508
[settings.lathe-thread-c360]
tool = "threading-bits-lms-6685"
material = "lathe-c360"
rpm = 70
feed = "compound at 29°, the bit on centre height and square to the axis; half-nuts on the 20 TPI gearbox setting; compound .003-.005 a pass, less near depth, dry"

# --- MHA-MG-06 output fixture (cad/process/mg_output_fixture/plan.toml) ------
# C36000 7/16 hex bar: its lathe facing and turning take shop/lathe.toml
# lathe-ar-c360, its spotting the lathe-centre-c360 row, its parting
# lathe-part-c360. Every setting it names is under the one material key
# lathe-c360 (prechips refuses a plan whose settings name two).
# - #43 (.089 in) from the tailstock: LittleMachineShop "Cutting Speeds",
#   Drilling & Reaming, row Brass (C35600, C37700, C36000, ...): 160-175
#   ft/min (read 2026-11-17, as the clamp's rows above), taken at 160; fed by
#   hand, pecking, dry.
# - Mill, the cross bore: the clamp's brass rows above (#2 centre drill 2800
#   rpm × .001 in/rev = 2.8 in/min; F 2400 rpm × .004 in/rev = 9.6 in/min),
#   restated under lathe-c360 for this plan.
[settings.fixture-drill-43-c360]
tool = "jig-drill-43"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, pecking every .06, dry"
# The output fixture's groove with the one full-radius groover (tool audit
# 2026-11-23, MG-06's groove: "cut MG-06's FULL R groove with the one
# full-radius groover bought for MG-05"): it cuts its whole .048 width at
# once, so an authored 300 rpm (33 ft/min at the Ø.42 spigot), the parting
# start of shop/lathe.toml's header, fed by hand, dry. No maker's figure: a
# hand-fed form plunge.
[settings.fixture-form-r024-c360]
tool = "form-tool-r024"
material = "lathe-c360"
rpm = 300
feed = "cross slide by hand, slow and steady, dry"
[settings.fixture-spot-c360]
tool = "jig-spot"
material = "lathe-c360"
rpm = 2800
feed = "2.8 in/min"
[settings.fixture-drill-f-c360]
tool = "jig-drill-f"
material = "lathe-c360"
rpm = 2400
feed = "9.6 in/min"

# --- MHA-MG-10 wheel drum (cad/process/mg_wheel_drum/plan.toml) -------------
# Facing, turning and parting take shop/lathe.toml's C360 rows. The V pilot
# and the 1/2 drill run blind into the bar past the parting line, so their
# feed cue is the quill scale, not a breakthrough. LittleMachineShop "Cutting Speeds" (read live
# 2026-11-22, shop/lathe.toml header), Drilling & Reaming, Brass (C36000):
# drilling 160-175 ft/min; it takes the low end (the V drill 1622 rpm, the
# 1/2 drill 1222 rpm). The bore is the 1/2 drill's (owner ruling 2026-11-24,
# fit audit question 17): no reamer, no pins.
[settings.lathe-drill-v-blind-c360]
tool = "drill-v"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, steady, dry; ease off as the scale nears the depth"
[settings.lathe-drill-1-2-c360]
tool = "drill-1-2"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, steady, dry"
[tools.drill-1-2]  # Drills 1/2; MHA-MG-10 1/2 DRILL THRU
description = "1/2 (.5000 in) drill, 115-piece index"
diameter_mm = 12.7

