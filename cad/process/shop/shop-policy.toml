# Harmonic-analyzer shop policy for prechips travelers (docs/policy.md).
#
# Authored from scratch for the rocker-arm trial (2026-10-11). Every rule a
# traveler must clear before the shop cuts metal is listed here. A required
# rule's warn/unknown/unsupported blocks the gate (exit 4), so a traveler that
# passes has had every listed check resolved. joint_fit, joint_assembly,
# manual_arc, centre_support, prepared_blank and purchased_tooling are always
# required by prechips and are not repeated here.

revision = 1

[required]
# Declared-input resolution: every tool, holder, fixture and gauge the plan names
# must resolve to the shop inventory, and every hole must have a sized tool.
tool_resolves = "*"
sizing = "holes"
consistency = "*"
hold_fields = "setups"

# Route integrity: ops chain stock to finished feature, blind depths are reachable,
# ops run in a valid order, and every datum the drawing uses is established
# before it is consumed.
op_chain = "*"
order = "*"
blind_depth = "holes"
datum_consistency = "*"

# Manual-machine coordinates: every position is a DRO number from a declared
# zero, and every zero is checked before cutting.
coordinates = "*"
zero_check = "setups"

# Cutting physics on a hobby-size machine.
speeds_feeds = "*"
engagement = "*"
headroom = "setups"

# Measured mill feasibility (M5): the setup must fit the machine's envelope and
# axis travels.
envelope = "setups"
travel = "setups"

# Geometry (FreeCAD kernel): tools reach and clear, vise and fixtures hold
# without collision, and every face is cut.
accessibility = "*"
reach = "*"
internal_corner_radius = "*"
coverage = "*"
finish_coverage = "*"
vise = "setups"
fixture_interference = "setups"
thin_wall_under_clamp = "setups"

# Every toleranced feature has a named inspection with a gauge that resolves.
inspection = "toleranced_features"
finish_route = "*"

[numbers]
# Values the shop has not yet chosen or sourced stay "unknown" (docs/policy.md:
# "rather than copying unsourced shop folklore"). The rules that read them
# report ? until Pedro supplies a cited value.
refixture_budget_mm = "unknown"
stickout_ld_max = "unknown"
thin_wall_floor_mm = "unknown"
