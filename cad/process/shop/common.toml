# Harmonic-analyzer shop directory for prechips travelers (cad/process/shop/),
# in the prechips shop schema: tooling, cutting settings, machines,
# workholding, gauges and limits. prechips (0.11.10 and later) merges every
# *.toml here by section and refuses a key defined in two files; HA's readers
# merge it the same way (cad/scripts/_process_plans.py load_shop). This
# common.toml holds the machines, workholding, limits and gauges, and every
# tool, cutting setting and stock record that plans of more than one
# subsystem family name; <prefix>.toml (ch, dt, fr, mg, ms, pd, pn, sm) holds
# the records only that family's plans (cad/process/<prefix>_*/plan.toml) or
# specs/tests read. A family without a file adds <prefix>.toml for its first
# record of its own; a record a second family needs moves here; a new set
# several families need may start its own topic file (cad/process/README.md,
# "Shop records"). The directory holds only records an HA plan
# (cad/process/<stem>/plan.toml) or an HA spec/test reads.
# Checks use these values as written, with no measured/placeholder provenance
# (owner ruling 2026-11-10, cad/process/README.md). Part-specific tool keys do
# not assert tool equivalence. Material identities preserve each source's
# stated stock condition; they are not inferred from the printed material text
# or treated as interchangeable. Facts the prechips schema cannot hold that CAD
# specs read live in cad/config/shop-equipment/*.toml, read through
# cad/scripts/_shop_equipment.py; no field is in both.

# Source: prechips v0.9.0 examples/shop.toml (archive/pre-v0.10-2026-11-08
# examples/inventory/pedro-shop.toml and examples/shop-policy.toml, converted to
# millimetres), plus the HA records marked below. Where HA's own records
# (45952b66bc:cad/process/shop/{inventory,shop-policy}.toml) gave a different
# value, HA's value is used and marked "HA:".
# The PM-30MV is CNC-converted (GRBL, ballscrews on X/Y; owner 2026-11-16):
# prechips has no control or repeatability field, so those facts are
# cad/config/shop-equipment/ cnc.pm-30mv.
[machines.pm-30mv]
kind = "mill"
# Owner (Pedro, 2026-11-16): spindle 100 rpm minimum, 2800 rpm maximum.
# Owner (Pedro, 2026-11-16), "2800 max with low belty": the low belt alone
# covers 100–2800 rpm, so no job on this mill needs a belt change.
rpm_ranges = [[100, 2800]]
travel_mm = { x = 584.2, y = 222.25, z = 355.6 }
