# Class ZZ go/no-go pins for the reamed bands (owner ruling 2026-11-23, tool
# audit Q1, verbatim: "ZZ singles per the record: 29 pins (17 plus GO, 12
# minus NO-GO), about $130. Accept that good holes near a limit may be
# refused; the traveler mikes each pin so the real window is known per pin.").
# One record per band, key zz-pins-<low>-<high>, here when two families' plans
# gauge the band, else in the family file. GO is a plus pin at the low limit
# (its size the limit to .0002 over), NO-GO a minus pin at the high limit (its
# size .0002 under to the limit), as the #3075 record has it
# (cad/config/shop-equipment/gauges.toml gauges.pin-gauges). The pair reads no
# scale; its resolution is one pin's Class ZZ tolerance, .0002 in =
# 0.00508 mm: with both pins at their tolerance limits only the middle .0001
# of a .0005 band is sure to pass, so each traveler mikes its pins and
# accepts between the two readings. Of the Class X pairs the ZZ pins replace,
# only .0930/.0935's gauges record below stays: a test reads it.
[gauges.zz-pins-3135-3140]
range_mm = [7.9629, 7.9756]
resolution_mm = 0.00508
[tools.zz-pins-3135-3140]
description = "Class ZZ pins for .3135-.3140: GO .3135 plus (single), NO-GO .314 minus (the .061-.500 box)"
[gauges.zz-pins-0930-0935]
range_mm = [2.3622, 2.3749]
