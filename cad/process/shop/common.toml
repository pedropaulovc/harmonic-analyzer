# Their cutting settings on 1018 cold-finished steel at the PM-30MV. Material
# key: settings.rocker-profile-hss-low-carbon-steel's, unchanged.
# Speed: the spindle tops out at 2800 rpm (machines.pm-30mv, owner
# 2026-11-16), which is 92, 183, 275 and 367 ft/min on the 1/8, 1/4, 3/8 and
# 1/2 in cutters. Ceiling: The Carbide End Mill Store "Carbide End Mill Speeds
# and Feeds, General Purpose, Uncoated" (6gtools.com, PDF read 2026-11-17),
# row Steels P, Mild - 1018 (.2-.3 Carbon): 350 SFM. The 1/2 in cutter is
# held under it: 350 × 3.82 / .5 = 2674 rpm, taken down to 2650 (347 ft/min);
# the other three run at 2800. Tru-Edge "Solid Carbide Endmills Feeds and
# Speeds" (PDF read 2026-11-17), row Low Carbon Steel - 1018: 200-400 SFM,
# would admit 2800 on all four; the lower ceiling is kept for this mill.
# Chip load: the same 6G table's Mild - 1018 feeds, .0006, .0017, .0025 and
# .0028 in/tooth for 1/8, 1/4, 3/8 and 1/2 in, × 25.4. These are its low end:
# the table multiplies them by a chip-load factor of 1.0 at 50 % radial
# engagement (and more) up to 5.0 at 1 %, and the factor is left at 1.0. For
# comparison Tru-Edge's 1018 row gives .001 (1/8), .0015 (1/4), .003 (1/2).
# Carbide on this mill (Blondihacks, "Common Beginner Mistakes In Hobby
# Machining", https://www.youtube.com/watch?v=PwSE3BeWuiM, mistake 1: carbide
# pays only up to the machine's rigidity and power, and a sharp carbide edge
# mimics HSS on a small machine). At 2800 rpm the 1/8 in cutter's 92 ft/min
# is inside the HSS milling range for 1018 (LittleMachineShop "Cutting
# Speeds", Milling, Plain carbon steels 1006-1026: 65-110 ft/min, read
# 2026-11-17) and under the carbide ranges above, so there carbide buys
# stiffness, about three times HSS's (FM Carbide "Solid Carbide vs. HSS End
# Mills", read 2026-11-17: Young's modulus ~600 GPa against 200-210 GPa), not
# speed. The 1/4 in cutter's 183 ft/min is already past the HSS range, and the
# speed gain grows with diameter to 3.2× the HSS top at 1/2 in.
[settings.endmill-carbide-3fl-1-8-1018-cf]
tool = "endmill-carbide-3fl-1-8"
material = "rocker-1018-cold-finished"
rpm = 2800
chip_load_mm_per_tooth = 0.01524  # .0006 in; 2800 × 3 × .0006 = 5.0 in/min
flutes = 3
feed_unit = "in/min"
[settings.endmill-carbide-3fl-1-4-1018-cf]
tool = "endmill-carbide-3fl-1-4"
material = "rocker-1018-cold-finished"
rpm = 2800
chip_load_mm_per_tooth = 0.04318  # .0017 in; 2800 × 3 × .0017 = 14.3 in/min
flutes = 3
feed_unit = "in/min"
[settings.endmill-carbide-3fl-3-8-1018-cf]
tool = "endmill-carbide-3fl-3-8"
material = "rocker-1018-cold-finished"
rpm = 2800
chip_load_mm_per_tooth = 0.0635  # .0025 in; 2800 × 3 × .0025 = 21.0 in/min
flutes = 3
feed_unit = "in/min"
[settings.endmill-carbide-3fl-1-2-1018-cf]
tool = "endmill-carbide-3fl-1-2"
material = "rocker-1018-cold-finished"
rpm = 2650
chip_load_mm_per_tooth = 0.07112  # .0028 in; 2650 × 3 × .0028 = 22.3 in/min
flutes = 3
feed_unit = "in/min"
# Measured (#3383): dechatter 0.4.0 reports v5 and v6, 2026-11-22, on the
# PM-30MV with this cutter in an R8 collet, side-milling 1018 cold-finished,
# conventional, every pass at .0028 in (.071 mm)/tooth except v5's chip-load
# sweep: cad/process/dechatter/2026-11-22-pm30mv-em-half-carbide-1018-v5.html
# and -v6.html. Stick-out 27.94 mm (1.100 in), the owner's measurement; both
# reports' setup field reads 30.0, the value entered before the cut (owner,
# Pedro, 2026-11-22: "stickout is recorded as 30mm but is actually 27.94").
# The reports are his recorded data and stay as written. The travelers set
# 28.45 mm (1.12 in), which the session of 2026-11-23 cut at (owner, Pedro,
# 2026-11-24: "28.45"); each record's band, and what was and was not cut at
# 28.45, is in measured-cuts.toml. The work: a
# 126 x 13 x 73 mm 1018 plate upright in the vise, about 30 mm above the jaws
# (the reports' setup text). Valid only for that tool assembly, and only inside
# each record's depth and width; those limits and the stick-out are data in
# cad/config/shop-equipment/measured-cuts.toml (prechips refuses any other key
# on a setting), and test_measured_cuts.py refuses a plan cut outside them.
# NOT tested, so the chart record above still carries them: any cut deeper
# than 6.6 mm (the 10.54 mm side finishing); any cut wider than 6.4 mm at
# 1.27 mm deep (7.6 mm chattered) or wider than 3.0 mm deeper (the 12.7 mm
# full-width passes); climb milling; slotting; any other holder or material.
# 3.2 mm deep had one pass, which chattered; v6 planned a 1.27 mm re-check and
# did not run it.
# Full width at shallow depth (#3428) is still NOT measured. The session of
# 2026-11-23 (cad/process/dechatter/2026-11-23-pm30mv-em-half-carbide-1018-
# issue3428-v1.html, 0.75 mm deep, setup stick-out 28.4 mm) ran one round on
# stock 11 mm wide, narrower than the cutter: 1.3 mm wide stable at 2380 (asked
# 2300 and 2420), 2600, 2690 and 2800 rpm as heard, 2.5 mm stable at 2375; its
# second round (4.6 and 6.2 mm) was planned and not cut. Nothing wider than
# 2.5 mm, so it adds no setting.
# Speed: 2800 rpm chattered at both depths (1.8 mm wide at 1.27 deep, 1.3 mm
# wide at 6.6 deep) and no speed between 2400 and 2800 was cut, so the chart's
# 2650 is unmeasured, between the stable 2400 and the chattering 2800.
# Deep, up to 6.6 mm deep and 2.2 mm wide. Owner, Pedro, 2026-11-22: "deeper
# cuts caused violent chatter". v6 at 6.6 mm deep: stable at 1500 rpm 0.6 and
# 1.3 mm wide (0.3 mm chattered), 1930 and 2370 rpm 0.3-1.3 mm, 2370 at
# 1.8 mm, 2400 at 2.2 mm, 2800 at 0.3 and 0.6 mm; chatter at 2330 rpm 2.4 mm,
# 2400 rpm 2.6 mm and 2330 rpm 3.0 mm (aborted, verdict set by hand). The
# report logs 2320 rpm 2.7 mm as stable and lists it first of its
# recommended cuts; it lies between those chattering passes, so this record
# does not take it. At 3.2 mm deep the one pass, 2350 rpm 3.0 mm wide, was
# aborted as chatter. 2400 × 3 × .0028 = 20.2 in/min.
[settings.em-half-carbide-1018-v6-deep]
tool = "endmill-carbide-3fl-1-2"
material = "rocker-1018-cold-finished"
rpm = 2400
chip_load_mm_per_tooth = 0.07112
flutes = 3
feed_unit = "in/min"
# Face, up to 1.27 mm (.050 in) deep and 3.4 mm wide. v5, all at 1.27 mm
# deep: 2370 rpm stable at 3.0, 3.2 and 3.4 mm, the widest cut made; 1800 and
# 2300 rpm stable at 0.5-1.8 mm; 2310 at 2.1, 2320 at 2.4, 2330 at 2.6 and
# 2.8 mm; 2800 rpm stable at 0.5 and 1.0 mm, chatter at 1.8 mm, the only
# chatter in v5. No width limit was found at 2370 rpm: wider than 3.4 mm is
# untested, not known bad. The chip-load sweep at 2370 rpm 3.4 mm cut 0.043
# and 0.062 mm/tooth, both stable, below the 0.071 the round before held;
# nothing above 0.071 was cut. 2370 × 3 × .0028 = 19.9 in/min.
# The speeds above are the ones v5 asked for. As heard (the v5 session's
# results.json), every pass asked 2300 to 2370 ran at 2375-2381 but the 2.4 mm
# one, which ran at 2270. The next session heard 3.4 mm chatter at 2272
# (settings.em-half-carbide-1018-3439-face), so this record's speed has
# chatter one step of the dial below it: new plans use that record.
[settings.em-half-carbide-1018-v5-face]
tool = "endmill-carbide-3fl-1-2"
material = "rocker-1018-cold-finished"
rpm = 2370
chip_load_mm_per_tooth = 0.07112
flutes = 3
feed_unit = "in/min"
# Face, up to 1.27 mm (.050 in) deep and 6.4 mm wide (#3439): session
# 1018-3.4mm-3fl-issue3439-v1, 2026-11-23, dechatter 0.5.0, same cutter and
# collet, conventional, .0028 in (.071 mm)/tooth, 1.27 mm deep; the passes,
# the speeds heard and why the limit is 6.4 mm and not the report's 7.1 are
# beside measured_cuts.em-half-carbide-1018-3439-face (cad/config/
# shop-equipment/measured-cuts.toml). Set 2450: asked for 2450, the spindle
# ran 2486-2488 before the cut and 2455 in the 6.4 mm pass. The limit holds
# for 2420-2490 rpm in the cut (2450-2490 before it); 3.4 mm chattered at 2272
# and at 2582, so the stable band is about 100 rpm either side of 2480 at
# most, and across four sessions the dial landed up to 80 rpm from the speed
# asked. Up to 4.6 mm wide a spindle found near 2380 is also measured stable;
# wider, bring it up to 2450-2490 first. 2450 × 3 × .0028 = 20.6 in/min.
# The spindle rests only on stops 107.7 rpm apart (cad/config/shop-equipment/
# machines.toml, machines.pm-30mv) and the head's display is a tachometer: the
# travelers say "set 2450: the display rests near 2485, not 2380"
# (measured_cuts' display_rest_rpm; 2380 is one stop low, 2590 one stop high,
# where 3.4 mm chattered). rpm stays 2450: it is the speed in the cut, which
# the feed is computed for.
[settings.em-half-carbide-1018-3439-face]
tool = "endmill-carbide-3fl-1-2"
material = "rocker-1018-cold-finished"
rpm = 2450
chip_load_mm_per_tooth = 0.07112
flutes = 3
feed_unit = "in/min"

