# Summing (sm_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only sm_* plans name (or sm specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# --- Placeholder process plans' tools (quotes-2026-11-17-rev3.xlsx) ----------
# The tools the placeholder plans name (cad/process/<stem>/plan.toml with
# revision = "placeholder", not in _process_plans.TRAVELER_STEMS), from the
# owner's quote workbook quotes-2026-11-17-rev3.xlsx (owner 2026-11-19). The
# comment on each header cites its workbook row: an Items item_id, a Drills
# size or a Tap coverage thread. diameter_mm is the drill or reamer's nominal
# size. Ownership is the inventory's status under the same key
# (cad/config/shop-equipment/).
[tools.drill-36]  # Drills #36
description = "#36 (.1065 in) drill, 115-piece index"
diameter_mm = 2.7051
[tools.tap-10-24-bottoming]  # Tap coverage #10-24 UNC
description = "#10-24 UNC bottoming hand tap (OSG 1025000)"
tap_drill_mm = 3.7973  # #25 (.1495 in), MHA-SM-02's drawn tap drill
[tools.tap-6-32-plug]  # Tap coverage #6-32 UNC
description = "#6-32 UNC plug hand tap (OSG 1023700)"
[tools.digital-angle-gauge]  # F-digital-angle-gauge
description = "Digital angle gauge"

# --- Drawing cross-check additions (2026-11-19) -------------------------------
# Tools the v50 drawings call for that the quote workbook left out, from the
# drawing cross-check of the placeholder plans (2026-11-19) and the owner's
# rulings of that day. The comment cites the drawing callout or the inventory
# record that holds the tool's ownership.
[tools.sm-gooseneck-bend-form]  # inventory fixtures.sm-gooseneck-bend-form
description = "Shop-made two-plate 6061 bend form for the MHA-SM-01 gooseneck tube: a closed half-round channel holding the tail, a quarter cove round the R3 arc"

# --- MHA-SM-01 gooseneck (cad/process/sm_gooseneck/plan.toml) -----------------
# The bend form's groove is cut with the owned 1/4 in ball end mill (owner
# ruling 2026-11-22, option A). Ownership: cad/config/shop-equipment/
# tools-cutting.toml, same key (McMaster 8878A17, on hand). diameter_mm: the
# nominal 1/4 in × 25.4. flute_length_mm: McMaster's 8878A17 page, read
# 2026-11-22 (https://www.mcmaster.com/8878A17/): "Length of Cut 3/4"", 2
# flutes, centre cutting, 30° helix, mill diameter tolerance -0.002 to 0.
[tools.ball-endmill-carbide-2fl-1-4]
description = "1/4 in 2-flute uncoated carbide ball end mill, 3/4 in length of cut, 2-1/2 in OAL (McMaster 8878A17)"
diameter_mm = 6.35
flute_length_mm = 19.05
helix_deg = 30
# 6G Tools, "Carbide End Mill Speeds and Feeds, General Purpose, Uncoated"
# (https://www.6gtools.com/uploaded/files/feedsandspeeds/Carbide_End_Mill_Feeds_And_Speeds_General_Purpose_Uncoated.pdf,
# read 2026-11-22): Non-Ferrous, aluminium and aluminium alloys, 500 SFM,
# 1/4 in (6 mm) column .0022 in (.056 mm) per tooth. 500 SFM on 1/4 in is
# 3.82 × 500 / .25 = 7640 rpm, over the PM-30MV's 2800 (machines.pm-30mv):
# run at 2800 at the chart's chip load, 2800 × 2 × .0022 = 12.32 in/min.
[settings.ball-endmill-carbide-2fl-1-4-6061-t6511]
tool = "ball-endmill-carbide-2fl-1-4"
material = "6061-t6511"
rpm = 2800
chip_load_mm_per_tooth = 0.05588  # .0022 in
flutes = 2
# The finish's oil (sheet: "polished bare; oil or wax"); its polish, the
# 220 sanding roll, is common.toml's (MHA-CH-06 scuffs with it too).
# Ownership: cad/config/shop-equipment/consumables.toml, same key (the oil
# to buy, as MHA-MG-02 needs).
[tools.barricade-birchwood-casey]
description = "Birchwood Casey Barricade rust protection oil"

# --- Stock the process plans name (stock_refs) ---------------------------------
# One record per cad/config/shop-equipment/stock-*.toml key a plan names, so
# prechips can check each plan's stock_refs. Description only: the ownership
# status stays in the inventory under the same key (stock assignment audit,
# owner 2026-11-19).
[stock.4130n-tube-1-2x0065]
description = "4130-N seamless alloy steel tube, round tube, 1/2 in OD x .065 in wall"
[stock.4140-ht-flat-5-8x1-1-4]
description = "4140/4142 HT alloy steel, pre-hardened 28-32 HRC as supplied, flat bar, 5/8 x 1-1/4 in"

# --- MHA-SM-02 knife mount (cad/process/sm_knife_mount/plan.toml) ------------
# Cutting settings on 4140/4142 HT, pre-hardened 28-32 HRC as supplied
# (stock.4140-ht-flat-5-8x1-1-4), at the PM-30MV. Material key
# 4140-ht-28-32-hrc. Hardness row: 28-32 HRC is 271-301 HB (Machinery's
# Handbook, comparative hardness table, PDF0871/p550), read in the handbook's
# 275-325 HB rows.
# End mill: Machinery's Handbook Table 11, Cutting Feeds and Speeds for
# Milling Plain Carbon and Alloy Steels (PDF1368/p1047), alloy steels 4130,
# 4135, 4137, 4140, 4142, 275-325 HB, end milling, uncoated carbide, average
# speed 170 ft/min: 170 × 3.82 / .5 = 1299, set 1300. Chip load: The Carbide
# End Mill Store "Carbide End Mill Speeds and Feeds, General Purpose,
# Uncoated" (6gtools.com, PDF read 2026-11-17), row Hardened 35-45 Rc, 1/2 in:
# .002 in/tooth, the low end at its chip-load factor 1.0 (50 % radial
# engagement and more); its Mild 4140 row (annealed) is not used. The
# Hardened row's own 200 SFM ceiling is above the handbook's 170.
[settings.endmill-carbide-3fl-1-2-4140-ht]
tool = "endmill-carbide-3fl-1-2"
material = "4140-ht-28-32-hrc"
rpm = 1300
chip_load_mm_per_tooth = 0.0508  # .002 in; 1300 × 3 × .002 = 7.8 in/min
flutes = 3
feed_unit = "in/min"
# Drills and reamers (HSS): Machinery's Handbook Table 17, Speeds for Drilling,
# Reaming and Threading Plain Carbon and Alloy Steels (PDF1384/p1063), the same
# alloy steels at 275-325 HB: drilling 45 (35) ft/min, reaming 30 (25) ft/min;
# the bracketed lower speeds are used. Feeds: the handbook's twist-drill feeds
# (PDF1381/p1060): under 1/8 in .001-.003 in/rev, 1/8-1/4 in .002-.006,
# 1/4-1/2 in .004-.010, "the lower values ... for hard materials"; each tool
# takes the low end of its size's range, or half of it (the centre drill, its
# 3/16 body in the 1/8-1/4 range). The reamer takes the drilling feed of its
# own size range (author's choice; the handbook
# gives no reaming feed in that table). Per-tooth figures are per lip of a
# two-lip drill: rpm × 2 × chip load is the feed per minute.
# #2 centre drill, its 3/16 body: 35 × 3.82 / .1875 = 713, set 700; .001 in/rev.
[settings.jig-spot-4140-ht]
tool = "jig-spot"
material = "4140-ht-28-32-hrc"
rpm = 700
chip_load_mm_per_tooth = 0.0127  # .0005 in/lip; 700 × 2 × .0005 = .7 in/min
flutes = 2
feed_unit = "in/min"
# #30 (.1285, MHA-SM-02 datum B, owner ruling 2026-11-24, fit audit OQ19):
# 35 × 3.82 / .1285 = 1040, set 1050; .002 in/rev (1/8-1/4 in).
[settings.riser-drill-30-4140-ht]
tool = "riser-drill-30"
material = "4140-ht-28-32-hrc"
rpm = 1050
chip_load_mm_per_tooth = 0.0254  # .001 in/lip; 1050 × 2 × .001 = 2.1 in/min
flutes = 2
feed_unit = "in/min"
# #25 (.1495): 35 × 3.82 / .1495 = 894, set 900; .002 in/rev.
[settings.drill-25-4140-ht]
tool = "drill-25"
material = "4140-ht-28-32-hrc"
rpm = 900
chip_load_mm_per_tooth = 0.0254  # .001 in/lip; 900 × 2 × .001 = 1.8 in/min
flutes = 2
feed_unit = "in/min"
# The knife bore at Ø.4985 +.0015/0 (owner ruling 2026-11-23, tool audit Q13:
# "dia .4985 +.0015/0 (owner chose against the agent's recommendation to
# keep .4720); no 12 mm reamer"): pre-drilled with the owned 31/64 drill
# (common.toml tools.drill-31-64) and reamed with the .4990 reamer of the
# over/under set (common.toml tools.reamer-4990), on the rates above.
# 31/64 (.4844): 35 × 3.82 / .4844 = 276, set 275 (275 × .4844 / 3.82 =
# 34.9 ft/min); .004 in/rev.
[settings.drill-31-64-4140-ht]
tool = "drill-31-64"
material = "4140-ht-28-32-hrc"
rpm = 275
chip_load_mm_per_tooth = 0.0508  # .002 in/lip; 275 × 2 × .002 = 1.1 in/min
flutes = 2
feed_unit = "in/min"
# .4990 reamer: 25 × 3.82 / .499 = 191, set 190; .004 in/rev (1/4-1/2 in).
[settings.reamer-4990-4140-ht]
tool = "reamer-4990"
material = "4140-ht-28-32-hrc"
rpm = 190
chip_load_mm_per_tooth = 0.0508  # .002 in/lip; 190 × 2 × .002 = .76 in/min
flutes = 2
feed_unit = "in/min"

# The knife mount's reamed bore gauged with Class ZZ pins (owner ruling
# 2026-11-23, tool audit Q1, verbatim: "ZZ singles per the record: 29 pins
# (17 plus GO, 12 minus NO-GO), about $130. Accept that good holes near a
# limit may be refused; the traveler mikes each pin so the real window is
# known per pin."). The knife bore .4985-.5000: GO a plus .4985 single
# (.4985-.4987), NO-GO the .500 minus pin of the .061-.500 box
# (.4998-.5000). Each pin's resolution is its ZZ tolerance, .0002 in =
# 0.00508 mm; the traveler mikes each pin and accepts a hole between the two
# readings. Datum B is drilled #30 (owner ruling 2026-11-24, fit audit
# OQ19): its .1275/.1285 pins are retired.
[gauges.zz-pins-4985-5000]
range_mm = [12.6619, 12.7]
resolution_mm = 0.00508
[tools.zz-pins-4985-5000]
description = "Class ZZ pins for .4985-.5000: GO .4985 plus (single), NO-GO .500 minus (the .061-.500 box)"

