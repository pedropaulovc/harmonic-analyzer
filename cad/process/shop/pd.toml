# Paper drive (pd_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only pd_* plans name (or pd specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# The MHA-PD-20 spacer bore's go/no-go pair (cad/config/shop-equipment/
# gauges.plug-gauges-1855-1860, to buy): GO .1855 and NO-GO .1860 in =
# 4.7117 and 4.7244 mm. A fixed-limit pair reads no scale; its resolution is
# each member's Class X tolerance, .000040 in = 0.001016 mm. The tools record
# lets a plan list the pair.
[gauges.plug-gauges-1855-1860]
range_mm = [4.7117, 4.7244]
resolution_mm = 0.001016
[tools.plug-gauges-1855-1860]
description = "Plug gauge pair, .1855 GO (plus) and .1860 NO-GO (minus), Vermont Gage Class X"

# The MHA-PD-16 cup pilot's go/no-go pair (cad/config/shop-equipment/
# gauges.plug-gauges-2500-2510, to buy): GO .2500 and NO-GO .2510 in =
# 6.35 and 6.3754 mm, Class X as the pair above.
[gauges.plug-gauges-2500-2510]
range_mm = [6.35, 6.3754]
resolution_mm = 0.001016
[tools.plug-gauges-2500-2510]
description = "Plug gauge pair, .2500 GO (plus) and .2510 NO-GO (minus), Vermont Gage Class X"

# Class ZZ go/no-go pins for the paper-drive reamed bands (owner ruling
# 2026-11-23, tool audit Q1, verbatim: "ZZ singles per the record: 29 pins
# (17 plus GO, 12 minus NO-GO), about $130. Accept that good holes near a
# limit may be refused; the traveler mikes each pin so the real window is
# known per pin."). Conventions as common.toml's zz-pins records: GO a plus
# pin at the low limit, NO-GO a minus pin at the high limit (from the
# .061-.500 minus box where that limit is a whole thousandth), resolution one
# pin's Class ZZ tolerance, .0002 in = 0.00508 mm. The K bore's .4375-.4382
# band is the odd one: its NO-GO is a
# .4380 plus pin, .4380-.4382, at or under the .4382 limit. Bands only pd
# plans gauge: .1240-.1245 (MHA-PD-18), .4375-.4382 (MHA-PD-19, and MHA-PD-28
# re-gauging PD-19's hole with the same pins), .0615-.0620 (MHA-PD-17).
[gauges.zz-pins-1240-1245]
range_mm = [3.1496, 3.1623]
resolution_mm = 0.00508
[tools.zz-pins-1240-1245]
description = "Class ZZ pins for .1240-.1245: GO .1240 plus (single), NO-GO .1245 minus (single)"
[gauges.zz-pins-4375-4382]
range_mm = [11.1125, 11.13028]
resolution_mm = 0.00508
[tools.zz-pins-4375-4382]
description = "Class ZZ pins for .4375-.4382: GO .4375 plus (single), NO-GO .4380 plus (single)"
[gauges.zz-pins-0615-0620]
range_mm = [1.5621, 1.5748]
resolution_mm = 0.00508
[tools.zz-pins-0615-0620]
description = "Class ZZ pins for .0615-.0620: GO .0615 plus (single), NO-GO .062 minus (the .061-.500 box)"

