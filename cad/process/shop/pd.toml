# --- MHA-PD-17 disc hub (cad/process/pd_transgear_disc_hub/plan.toml) --------
# Lathe: facing, turning, the centre drill, the N drill and parting take
# shop/lathe.toml's C360 rows. The bore is reamed by hand with the owned
# adjustable reamer (dt.toml tools.reamers-adjustable-lms-5948), the
# spindle stopped, so it takes no setting. The sharp-nose finishing tool is
# HSS (its R.003-.004 nose): the LittleMachineShop HSS turning row for brass
# (lathe.toml header), 300-350 ft/min, at its low end. Its feed is not the
# page's .004 in/rev roughing reference: the PM-1127's finest longitudinal
# power feed, .0025 in/rev (shop machines.pm-1127vf-lb
# longitudinal_feed_mm_rev), whose cusp the hub plan charges against the
# spigot's band (Codjiflo #3407 P2).
[settings.lathe-sharp-nose-c360]
tool = "lathe-tool-sharp-nose"
material = "lathe-c360"
sfm = 300
feed_mm_rev = 0.0635
# Mill (PM-30MV low belt, 100-2800 rpm), the rows the MHA-PD-22 block above
# cites: #51 (.067 in) and #56 (.0465 in) at 160 ft/min are 9120 and 13140
# rpm, so 2800; the AutoDrill 1/16 in column's .001 in/rev (the #56 under
# the first column takes it): 2.8 in/min.
[settings.pd-hub-drill-51-c360]
tool = "drill-51"
material = "lathe-c360"
rpm = 2800
feed = "2.8 in/min"
[settings.pd-hub-drill-56-c360]
tool = "drill-56"
material = "lathe-c360"
rpm = 2800
feed = "2.8 in/min"
# MHA-PD-17's flat with the owned Kyocera 1800.0625.200 1/16 in (.0625)
# 4-flute carbide square end mill, .200 in of flutes, 1/8 in shank, 1-1/2 in
# OAL, 30° helix (cad/config/shop-equipment/tools-cutting.toml
# tools.endmill-kyocera-1800-1-16, on hand, #3739; replaces MSC 35497056):
# CM02 needs only .10 in (2.54 mm) of flute reach above the flat, well inside
# its .200 in (5.08 mm) flutes. Speed and feed keep the conservative miniature
# carbide plunge figure from Harvey Tool Speeds & Feeds, Miniature End Mills -
# Square - Long Reach, Stub Flute, 9x Reach Multiple (W.C. Chapman's copy,
# read 2026-11-21), row Brass (C2xxxx-C4xxxx): 500 SFM, .062 in Slotting
# .00035 in/tooth. Plunged at the spindle's 2800 rpm and .0005 in/rev (half a
# drill's feed, an end mill plunged off square): .0005 / 4 = .000125 in/tooth,
# well under the table's figure; 2800 × .0005 = 1.4 in/min.
[tools.endmill-kyocera-1800-1-16]
description = "1/16 in (.0625) 4-flute carbide square end mill, .200 in LOC, 1-1/2 in OAL, 1/8 in shank (Kyocera 1800.0625.200), on hand"
diameter_mm = 1.5875
flute_length_mm = 5.08
helix_deg = 30
[settings.pd-hub-plunge-1-16-c360]
tool = "endmill-kyocera-1800-1-16"
material = "lathe-c360"
rpm = 2800
feed = "1.4 in/min"
# MHA-PD-14 latch hook (cad/process/pd_latch_hook): the 2X #30 screw holes
# through the formed hook's .032 C26000 base, on the spoil plate. C26000 is
# not a LittleMachineShop "Cutting Speeds" row (read live 2026-11-22, lathe.toml
# header); its Brass drilling row is 160-175 ft/min, 4760 rpm on the #30, so
# the spindle's 2800 (94 ft/min, under the row: conservative for the tougher
# alloy); AutoDrill's .001 in/rev, the 1/16-1/8 in columns' lower row, as
# pn.toml settings.pn-drill-30-c360 takes it: 2.8 in/min.
[settings.pd-drill-30-c260]
tool = "riser-drill-30"
material = "c260-h02"
rpm = 2800
feed = "2.8 in/min"

