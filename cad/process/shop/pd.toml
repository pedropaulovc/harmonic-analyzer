# --- MHA-PD-24/-25 transgear bushings (cad/process/pd_transgear_*_bushing) --
# The Ø.1260-.1265 running bores on the MHA-PD-23 pin, drilled #31 and reamed
# .1260 from the tailstock (C36000, dry). LittleMachineShop "Cutting Speeds"
# (read live 2026-11-22, lathe.toml header), Drilling & Reaming, Brass
# (C36000): drilling and reaming both 160-175 ft/min. The low end asks about
# 5,100 rpm of the #31 drill and 4,850 of the .1260 reamer; both clamp to the
# lathe's 2000 rpm top speed. The #31 (.1200) leaves the reamer .006 on the
# diameter.
[settings.lathe-drill-31-c360]
tool = "drill-31"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, light and steady, dry"
[settings.lathe-ream-1260-c360]
tool = "reamer-1260"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, slow and light, dry; withdraw with the spindle running"

# --- MHA-PD-23 transgear pin (cad/process/pd_transgear_pin) -----------------
# Turned from the 1/4 in 1018 bar. Speeds: lathe.toml header (LittleMachineShop
# "Cutting Speeds", read live 2026-11-21), low end of each 1018 range:
# turning HSS 125, carbide 800 ft/min; the grooving tool takes the
# parting rule there (300 rpm, fed by hand, cutting oil). The Ø.1248-.1250
# journal, about 2.1 in between the chuck and the tailstock centre, is roughed
# with the AR at .002 in/rev and finished with the sharp-nose tool at .001
# in/rev, in the passes turning_deflection's 0.10 and 0.005 mm screens allow
# (the plan's rough_radial_doc_mm and finish_radial_doc_mm); every speed
# clamps to the lathe's 2000 rpm top speed at these diameters.
[settings.lathe-ar-light-1018]
tool = "lathe-ar"
material = "lathe-1018-cold-finished"
sfm = 800
feed_mm_rev = 0.0508
[settings.lathe-sharp-nose-1018]
tool = "lathe-tool-sharp-nose"
material = "lathe-1018-cold-finished"
sfm = 125
feed_mm_rev = 0.0254
[settings.lathe-groove-1018]
tool = "grooving-tool-020"
material = "lathe-1018-cold-finished"
rpm = 300
feed = "by hand, light and steady, cutting oil"

