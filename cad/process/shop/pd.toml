# MHA-PD-02 platen (cnc/flat-b-pd-platen)
# Plan: cad/process/pd_platen/plan.toml. Material key platen-c360: the C360
# flat bar as bought (stock.c360-flat-1-4x6 above); the source's row below is
# its Brass/Bronze row, read for that bar. On the PM-30MV, whose low belt
# tops out at 2800 rpm (machines.pm-30mv, owner 2026-11-16).
#
# Carbide end mills: The Carbide End Mill Store "Carbide End Mill Speeds and
# Feeds, General Purpose, Uncoated" (6gtools.com,
# uploaded/files/feedsandspeeds/Carbide_End_Mill_Feeds_And_Speeds_General_Purpose_Uncoated.pdf,
# read 2026-11-22; the PDF pn.toml settings.pn-em-half-c360 cites), row
# Non-Ferrous N, Brass/Bronze: 400 SFM; 1/4 in .0022 and 1/2 in .0042
# in/tooth at chip-load factor 1.0 (50 % radial engagement and more, the
# table's lowest load: every cut of the platen engages 50 % or less). 400
# SFM is 3056 rpm on the 1/2 in and 6112 on the 1/4 in: both run at the
# spindle's 2800 (367 and 183 ft/min).
[settings.platen-em-half-c360]
tool = "endmill-carbide-3fl-1-2"
material = "platen-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.10668  # .0042 in; 2800 × 3 × .0042 = 35.3 in/min
flutes = 3
feed_unit = "in/min"
[settings.platen-em-quarter-c360]
tool = "endmill-carbide-3fl-1-4"
material = "platen-c360"
rpm = 2800
chip_load_mm_per_tooth = 0.05588  # .0022 in; 2800 × 3 × .0022 = 18.5 in/min
flutes = 3
feed_unit = "in/min"

# MHA-PD-26 feed rack (cnc/w3b-rack)
# Plan: cad/process/pd_feed_rack/plan.toml. Material key rack-brass: the SDP/SI
# A 1B12-Y324 strip, "Brass" with no alloy stated (stock.sdp-rack-a-1b12-y324);
# the rows below are each source's brass rows. On the PM-30MV's low belt,
# 100-2800 rpm (machines.pm-30mv).
# - #1 carbide centre drill (3/64 pilot, 1/8 body) and the 3/64 (.0469 in)
#   drill: LittleMachineShop "Cutting Speeds" (read live 2026-11-22, as the
#   MHA-PD-22 block above), Drilling & Reaming, Brass (C36000): 160-175
#   ft/min, the low end 4890 rpm on the body and 13000 on the 3/64, so the
#   spindle's 2800; AutoDrill "Suggested drilling feed rates" (read
#   2026-11-20), row Brass: 1/16 in .001 in/rev (the 3/64 and the pilot under
#   the first column take it): 2800 × .001 = 2.8 in/min.
# - 1/4 in carbide end mill, the ends' side passes: The Carbide End Mill
#   Store's Brass/Bronze row (the platen block above): 400 SFM (6112 rpm, so
#   2800) and 1/4 in .0022 in/tooth. The rack plan takes half of it, .0011
#   (author's choice, kept conservative): each end is milled .30 in past
#   its jaw side, one hold per end, a cantilever of about 7 mm on the 3/16
#   square strip; the plan's beam check (prechips milling_deflection) passes.
[settings.rack-spot-brass]
tool = "centre-drills-carbide-60"
material = "rack-brass"
rpm = 2800
feed = "2.8 in/min"
[settings.rack-drill-3-64-brass]
tool = "drill-3-64"
material = "rack-brass"
rpm = 2800
feed = "2.8 in/min"
[settings.rack-em-quarter-brass]
tool = "endmill-carbide-3fl-1-4"
material = "rack-brass"
rpm = 2800
chip_load_mm_per_tooth = 0.02794  # .0011 in; 2800 × 3 × .0011 = 9.2 in/min
flutes = 3
feed_unit = "in/min"
