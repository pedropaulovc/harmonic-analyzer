# Paper drive (pd_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only pd_* plans name (or pd specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# The MHA-PD-19 knob-bush hole's go/no-go pair (cad/config/shop-equipment/
# gauges.plug-gauges-4375-4382, to buy): GO .4375 and NO-GO .4382 in =
# 11.1125 and 11.13028 mm. A fixed-limit pair reads no scale; its resolution is
# each member's Class X tolerance, .000040 in = 0.001016 mm. The tools record
# lets a plan list the pair.
[gauges.plug-gauges-4375-4382]
range_mm = [11.1125, 11.13028]
resolution_mm = 0.001016
[tools.plug-gauges-4375-4382]
description = "Plug gauge pair, .4375 GO (plus) and .4382 NO-GO (minus), Vermont Gage Class X"

