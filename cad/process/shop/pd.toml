# Paper drive (pd_*) records of the HA prechips shop directory: the tools,
# cutting settings and stock only pd_* plans name (or pd specs/tests read).
# Machines, workholding, limits, gauges and every record more than one family
# names are in common.toml, with the conventions every file follows; prechips
# merges the directory's files by section and refuses a key defined twice.

# --- MHA-PD-15 ring, MHA-PD-20 spacer, MHA-PD-28 bush, MHA-PD-16 cup ---------
# (cad/process/pd_transgear_knob_thrust_ring, pd_transgear_pivot_spacer,
# pd_transgear_knob_bush, pd_transgear_knob_cup). Facing, turning and parting
# take shop/lathe.toml's C360 and 1018 rows. LittleMachineShop "Cutting
# Speeds" (read live 2026-11-22, lathe.toml header), Drilling & Reaming:
# Brass (C36000) drilling and reaming 160-175 ft/min, the low end taken; Low
# Carbon Steel (1018) as shop/lathe.toml's 1018 drill rows, 60 ft/min. The
# cup's flat-bottom pilot and pocket are plunged from the tailstock with a
# centre-cutting end mill as a drill: the brass drilling row.
# The lever indicator (cad/config/shop-equipment/ gauges.dti, its range and
# graduation in shop/common.toml) on the shop's magnetic base (gauges.mag-base),
# listed as a tool where a plan indicates a face on the lathe.
[tools.dti]
description = "Lever (dial test) indicator, 0.001 mm graduation, on the magnetic base"
[settings.lathe-drill-f-c360]
tool = "jig-drill-f"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, steady, dry"
# MHA-PD-20's #11 DRILL THRU, a short hole drilled in one feed (D17, Q7b).
[settings.spacer-lathe-drill-11-c360]
tool = "drill-11"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, steady, dry"
[settings.lathe-drill-b-1018]
tool = "drill-b"
material = "lathe-1018-cold-finished"
sfm = 60
feed = "tailstock quill by hand, pecking, cutting oil; back fully out to clear chips"
[settings.lathe-drill-b-c360]
tool = "drill-b"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, steady, dry"
[settings.lathe-drill-33-c360]
tool = "drill-33"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, light and steady, dry"
[settings.lathe-plunge-1-4-c360]
tool = "endmill-hss-2fl-1-4"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, slow, dry; back out to clear chips every .03"

