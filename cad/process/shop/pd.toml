# --- MHA-PD-24/-25 transgear bushings (cad/process/pd_transgear_*_bushing) --
# The Ø.1260-.1265 running bores on the MHA-PD-23 pin, drilled #31 and reamed
# .1260 from the tailstock (C36000, dry). LittleMachineShop "Cutting Speeds"
# (read live 2026-11-22, lathe.toml header), Drilling & Reaming, Brass
# (C36000): drilling and reaming both 160-175 ft/min. The low end asks about
# 5,100 rpm of the #31 drill and 4,850 of the .1260 reamer; both clamp to the
# lathe's 2000 rpm top speed. The #31 (.1200) leaves the reamer .006 on the
# diameter.
[settings.lathe-drill-31-c360]
tool = "drill-31"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, light and steady, dry"
[settings.lathe-ream-1260-c360]
tool = "reamer-1260"
material = "lathe-c360"
sfm = 160
feed = "tailstock quill by hand, slow and light, dry; withdraw with the spindle running"
# The bores' go/no-go pair (gauges record gauges.plug-gauges-1260-1265 in
# shop/common.toml, to buy): the tools record lets a plan list the pair.
[tools.plug-gauges-1260-1265]
description = "Plug gauge pair, .1260 GO (plus) and .1265 NO-GO (minus), Vermont Gage Class X"

# --- MHA-PD-03 platen clip (cad/process/pd_platen_clip/plan.toml) ---
# The clip's cutter: Harvey Tool 896231, Variable Helix End Mill for
# Aluminum Alloys - Square - Downcut (harveytool.com/products/tool-details-
# 896231 and the family page, read 2026-11-22): .0310 (1/32) cutter, .0930
# length of cut, 3 left-hand spiral right-hand cut flutes (a downcut:
# "prevents lifting of workpiece"), centre cutting, 1/8 shank, 1-1/2
# overall, uncoated, the family "excellent performance in copper, brass, and
# bronze alloys". It fits the .04 slit, which it cuts by running down one
# side and back up the other. Ownership: cad/config/shop-equipment/
# tools-special-cutters.toml, same key. diameter_mm and flute_length_mm: its
# .0310 and .0930 × 25.4.
[tools.endmill-carbide-3fl-1-32-downcut]
description = "1/32 in (.0310) 3-flute carbide downcut square end mill, .093 length of cut, 1/8 shank (Harvey Tool 896231)"
diameter_mm = 0.7874
flute_length_mm = 2.3622
# Harvey's own speeds and feeds for the series (SF_896200, "Variable Helix End
# Mills for Aluminum Alloys - Square - Downcut", harveyperformance.widen.net/
# content/urxytgzfxb/pdf/SF_896200.pdf, read 2026-11-22), uncoated, Brass
# (Copper Zinc alloys, C2xxxx): 500 SFM; .031 cutter slotting .00033 in/tooth
# (1x D radial, .5x D axial), max .00044. Every clip cut is a full-width slot
# level, so the slotting figure is the ceiling (.00033 × 25.4).
maker_chip_load_mm_per_tooth = { brass = 0.008382 }
maker_chip_load_source = "Harvey Tool SF_896200 (8962xx downcut), uncoated, Brass C2xxxx, .031 cutter, slotting .00033 in/tooth"
# Its setting in half-hard C26000 strip: Harvey's 500 SFM on .031 in is
# 61,600 rpm, so the spindle's 2800 (machines.pm-30mv; 23 ft/min). Chip load
# at Harvey's slotting figure, rounded down to the 0.1 in/min the sheet
# prints: 2800 × 3 × .00033 = 2.77, so 2.7 in/min, .000321 in/tooth
# (2.7 × 25.4 / 8400 mm); the plan holds each level to Harvey's .5 x D depth.
# Delegated ruling 2026-11-22 (Main, owner review #2144): never above the
# maker's published chip load without a measurement.
[settings.endmill-carbide-3fl-1-32-downcut-c260]
tool = "endmill-carbide-3fl-1-32-downcut"
material = "c260-h02"
rpm = 2800
chip_load_mm_per_tooth = 0.0081643  # .000321 in; 2800 × 3 × .000321 = 2.7 in/min
flutes = 3
feed_unit = "in/min"

