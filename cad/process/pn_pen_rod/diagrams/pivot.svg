<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
  <!-- Hand picture, the blank to scale at 20 px/mm from the 5 mm square (square_mm). The faced end .60 in (pivot_stickout_in) out of the jaw fronts; the Ø.125 x .41 pivot (pivot_aim_dia_mm, pivot_len_in) and the groove .165-.315 from the shoulder, floor Ø.106 (groove_plunge_1_in, groove_aim_dia_in, the drawing) hatched: cut later in this setup. The sawn excess over the length L read in Op 120 varies blank to blank: drawn .05 in, schematic. The 4-jaw, its shims and the AR tool (its TCMT insert size is not on record) are schematic. -->
