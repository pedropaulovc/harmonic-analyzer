<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
  <!-- Hand picture, the blank and the tap's diameter to scale at 20 px/mm from the 5 mm square (square_mm). #0-80 plug tap Ø.060 (the thread's major diameter, the hole it makes), its point .15 deep (plug_tap_reach_in). The tap's length, the T-handle wrench and the MT3 dead centre are not on record: schematic. The wrench and the dead centre are drawn in the tool's colour: they travel with the tap (the quill follows it). The 4-jaw and its shims are schematic. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="24">Top end, the blank to scale (20 px/mm): the plug tap by hand, the dead centre in the wrench</text>
