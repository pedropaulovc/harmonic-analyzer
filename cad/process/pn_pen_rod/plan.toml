# Pen rod MHA-PN-04, one off, on the manual PM-1127VF-LB (owner ruling
# 2026-11-21: turned parts get lathe travelers, no NC), from the 5 x 5 mm
# C360 key stock (the drawing: SQ as supplied, McMaster-Carr 90457A730):
#
# - Saw a blank; mike both pairs of flats (the square is left as bought).
# - 4-jaw on the flats over four soft packing strips, the top end out, the
#   square indicated to run true within the shop's .001 TIR (the #0-80's
#   .067 TAP WALL): face the top end, spot, drill 3/64, tap #0-80 with the
#   plug then the bottoming tap from the tailstock centre.
# - Turned round in the 4-jaw over the strips, indicated again, the pivot end out: face to
#   the overall length, turn the Ø.125 pivot, square its shoulder corner with
#   the 1/16 P1 blade (R.008 MAX; the AR insert's R0.4 nose cannot) and
#   plunge the set-screw groove with it in three overlapping plunges.
# - Bench: deburr, check, oil (FINISH: square as supplied; ends, pivot
#   machined; oiled).
#
# Packing (#3495): the 6 in 4-jaw closes no smaller than Ø.2865 (owner
# 2026-11-24, cad/process/shop/common.toml workholding.chuck-4jaw-6), and
# the square is .1950-.1970 across its flats, so each jaw bears on a soft
# strip on its flat that brings the jaws out inside that range (delegated
# ruling 2026-11-27 (Main), precedent: the transgear pin's split bush,
# #3494; owner review #2144 (D57)). Any strip .050-.125 thick does: at
# .050 on the smallest square the jaws stand .295 apart, .0085 over the
# least grip; at .125 a strip no wider than .18 still lies flat. No wider
# than .18, under the .1950 flat, so neighbouring strips never touch at a
# corner; about .5 long. The example is four strips from the offcut of the
# owned .063 brass sheet (stock-bought.toml c260-sheet-063-6x6), about
# .80 x .50 of it with the saw kerfs (jaws .321-.323 apart); it is a strip
# from the offcut, not an allocation of that sheet (its packing list names
# MHA-PD-12 and MHA-FR-04). How the least grip was measured, the jaws' tip
# width and the offcut's size are owner facts to measure (#3754).
#
# Flagged: the key stock (stock-to-order.toml c360-square-5mm-key), the
# .040 pin gauge of Op 70's depth check (gauges.pin-gauges) and the junior
# hacksaw that cuts the strips (junior-hacksaw) are to order. The groove's
# stations are read off a gauge block standing in it (Op 250). The
# placeholder's sharp-nose tool and ignition wrenches are not needed: the
# P1 blade cuts the R.008 MAX corner sharp, and the taps turn in a tap
# wrench.
title = "Pen Rod"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
stock = "Qty {{process.quantity:g}}. 5 x 5 mm C36000 brass key stock, DIN 6880 ({{cad.flat_x_pos_stock}}, to order), the 12 in bar; one blank {{process.blank_length_in:.2dot}} in long."
shop = "../shop"
stock_refs = ["c360-square-5mm-key"]
material_key = "lathe-c360"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant, burrs); This job says what only this rod needs. The taps' drop of
# cutting oil stays at the plug tap's step ("the same way" carries it to the
# bottoming tap).
standing = true

[[notes]]
title = "This job"
rows = [
  ["Square", "The square is the bar as bought: never cut it."],
  ["Packing", "Four soft packing strips, one between each jaw and its flat (the jaws cannot close on the bare square): brass, copper or aluminium, any thickness {{process.packing_min_in:.3dot}}–{{process.packing_max_in:.3dot}}, no wider than {{process.packing_width_max_in:.2dot}} (narrower than a flat, so neighbouring strips never touch), about {{process.packing_length_in:.2dot}} long. For example, four strips sawn with the junior hacksaw from the offcut of the .063 brass sheet, about .80 x .50 of it in all; file the burrs off so each lies flat. The same four strips serve Setups 2 and 3."],
]

[cad]
file = "../../out/features/pn_pen_rod/features.toml"
adapter = "drilled_block"
part = "pn-pen-rod"

[parameters]
quantity = 1
# The 5 mm key stock as the stock fit reads it (the export's envelope, the
# pivot turned from the square).
blank_x_in = 0.197
blank_y_in = 5.0
blank_z_in = 0.197
# Sawn over the 4.82 overall: about .05 to face off each end, and .10 more.
blank_length_in = 5.0
# Setup 2: the top end out of the jaw fronts (the .28 drilled depth and room
# for the tap wrench's work); Setup 3: the faced pivot end (Z0) out .60 (the
# .41 pivot, the blade's .0625 and .125 clear of the jaws), so the sawn end
# is chucked .60 + (L - 4.82) out: Op 150 faces the excess off.
top_stickout_in = 0.5
pivot_stickout_in = 0.6
pivot_stickout_mm = 15.24
jaw_front_z_mm = -15.24
# The square across its corners, the turning's start: 5.00 mm × √2.
square_corners_mm = 7.07
square_mm = 5.0
# The overall length from the top face to the pivot end, (4.82) REF on the
# drawing: the top face's 4.41 station plus the .41 pivot. Setup 3 presets
# its DRO from the blank's length read off the machine (Op 120), so Z0 is
# the finished pivot end and the shoulder is at Z−.410.
overall_in = 4.82
top_station_in = 4.41
pivot_len_in = 0.41
# The groove's width, its end station less its station (.310-.320 less
# .160-.170): .140-.160, gauged with the owned gauge blocks (.140, and .110
# wrung to .050 for .160).
groove_width_min_in = 0.140
groove_width_max_in = 0.160
groove_width_min_mm = 3.556
groove_width_max_mm = 4.064
# The 3/64 drill's depth: its point zeroed on a .100 gauge block held flat
# on the faced top face over the spot (the No. 1 centre drill's pilot is the
# 3/64 size, so the drill's corners meet no cone to touch); full diameter
# .270 deep is then .100 + .270 + the 118° point's .014 = .384 on the scale.
drill_scale_in = 0.384
# The square indicated to run true within this on each pair of flats (TIR),
# the shop table's runout floor: the hole then sits within .0005 of the
# square's centre, inside the .067 TAP WALL's margin.
indicate_tir_in = 0.001
# The soft packing strips under the 4-jaw (#3495): at the thinnest, the
# smallest .1950 square plus two strips stands .295 across the jaws, over
# the 4-jaw's .2865 least grip; at the thickest a strip at the widest still
# lies flat (no thicker than about 2/3 of its width); no wider than the
# smallest flat less .015, so the strips on two neighbouring flats never meet.
packing_min_in = 0.05
packing_max_in = 0.125
packing_width_max_in = 0.18
packing_length_in = 0.5
# The tap drill: spotted to about Ø.055 with the No. 1 centre drill (a lead
# for the tap), then the 3/64 to full diameter .26-.28 deep, pecked every
# .040 (under one diameter). The taps' points stop by pencil marks: the plug at .15 deep, the
# bottoming tap at .20 (its 1-1/2-thread lead at 80 per inch is .019, so the
# full thread runs .18-.19 deep).
spot_dia_in = 0.055
peck_mm = 1.016
plug_tap_reach_in = 0.15
bottoming_tap_reach_in = 0.20
# Turning the pivot from the square (Z0 the pivot end): passes end .2 mm
# short of the shoulder (the blade squares the corner); the shoulder at the
# drawn .41.
turn_start_z_mm = 0.0
turn_end_z_mm = -10.214
shoulder_z_mm = -10.414
rough_dia_mm = 3.25
# The drawing's DRILL .0469 is the 3/64 drill (1.190625 mm); the export
# rounds its band's low end to 1.191 mm, so the sizing check reads the band
# from the exact 3/64 to the drawing's .0509 (cad.stud_tap_dia_band_mm).
tap_drill_min_mm = 1.190625
tap_drill_max_mm = 1.2926
pivot_aim_dia_mm = 3.1674
pivot_dia_min_mm = 3.1496
rough_radial_doc_mm = 0.25
# Finish passes .0006 in deep at .001 in/rev: the Ø.125 pivot out of the
# jaws springs .0001 under them (prechips turning_deflection's .005 mm).
finish_radial_doc_mm = 0.015
finish_feed_mm_rev = 0.0254
turn_feed_mm_rev = 0.0508
# The 1/16 P1 cutoff blade (tools-cutting.toml cutoff-blade-p1 width_in):
# the groove's .150 width in three plunges, the blade's chuck-side face at
# .165, .209 and .2525 from the shoulder (the last puts its tailstock-side
# face on .315).
blade_width_in = 0.0625
groove_plunge_1_in = 0.165
groove_plunge_2_in = 0.209
groove_plunge_3_in = 0.2525
groove_aim_dia_in = 0.106

