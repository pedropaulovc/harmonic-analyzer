[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Evolution 14 in metal-cutting saw"
holding = "The key stock flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 5 mm brass key stock on the saw: one blank sawn a little over the rod's overall length." }

[[setups.operations]]
instruction = "Mike both pairs of flats at three places along the blank you will cut (the square is left as bought)."
inspection = "Square {{cad.flat_x_pos_across_min_in:.3dot}}–{{cad.flat_x_pos_across_max_in:.3dot}} across both pairs of flats."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.flat_x_pos_across_band_mm}}" }]

[[setups.operations]]
instruction = "A reading outside {{cad.flat_x_pos_across_min_in:.3dot}}–{{cad.flat_x_pos_across_max_in:.3dot}}: do not cut that length; mike the next length of the bar."

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the bar's end and saw on the waste side of the scribe; pick up the blank only after the blade has stopped. Deburr both sawn ends with the file."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Top end: face, drill and tap #0-80"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "6 in 4-jaw, each jaw on a flat over a soft packing strip (This job: Packing; the 4-jaw cannot close on the bare square), the top end {{process.top_stickout_in:.2dot}} in out of the jaw fronts, the rest of the blank back through the spindle bore. Indicate two adjacent flats next to the jaws with the dial test indicator, turning the chuck by hand, and adjust opposite jaws until each pair reads within {{process.indicate_tir_in:.3dot}} TIR."
datum = "Z0 (carriage DRO) the top face, faced in Op 50. The tailstock quill's scale for the drill's depth, zeroed in Op 70."
diagram = { file = "diagrams/top.svg", alt = "The square in the 4-jaw on its flats over four packing strips, the top end .50 in out: the AR tool faces it to Z0, the top face. Drawn to scale but for the chuck and the tool." }
lathe_hold = "other"
turning_support = { kind = "chuck_only", chuck_z_mm = -12.7 }

[[setups.operations]]
cut_kind = "other"
instruction = "Indicate the square as the holding says; snug every jaw a little at a time, reading again after each."
inspection = "Each pair of flats within {{process.indicate_tir_in:.3dot}} TIR."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, 0.0254] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the top end square in light skims, about .05 in off, to the centre with no pip. Set the DRO Z to zero on it: Z0 is the top face."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{process.square_corners_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Spot the centre with the No. 1 centre drill from the tailstock chuck to about Ø{{process.spot_dia_in:.3dot}} at the countersink (a lead for the tap)."
settings = "lathe-centre-c360"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-3-64"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = ["{{process.tap_drill_min_mm}}", "{{process.tap_drill_max_mm}}"] }
instruction = "3/64 drill in the tailstock chuck, short out of it. Spindle stopped: hold the .100 gauge block flat on the faced top face over the spot, feed the drill's point onto it and zero the quill scale there; take the block away. Drill until the scale reads {{process.drill_scale_in:.3dot}}: full diameter {{cad.stud_tap_drill_depth_min_in:.2dot}}–{{cad.stud_tap_drill_depth_max_in:.2dot}} deep. Back out to clear chips every .040 in."
settings = "pn-lathe-drill-3-64-c360"
cut_diameter_mm = "{{cad.stud_tap_dia_mm}}"
hole_depth_mm = "{{cad.stud_tap_drill_depth_mm}}"
peck = { step_mm = "{{process.peck_mm}}", retract = "full" }
inspection = "Drill depth {{cad.stud_tap_drill_depth_min_in:.2dot}}–{{cad.stud_tap_drill_depth_max_in:.2dot}}: a .040 pin gauge dropped to the bottom reads its length less its stick-up above the top face (calipers' depth rod), about .002 past full diameter."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.stud_tap_drill_depth_band_mm}}" }]
diagram = { file = "diagrams/top-drill.svg", alt = "To scale: the 3/64 drill from the tailstock chuck in the top end, its full diameter .26–.28 deep, its point beyond." }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "tap-0-80-plug"
drilling = "none"
sizing = "other"
instruction = "Spindle off, in low range. Swap the drill chuck for the dead centre. Pencil-mark the plug tap {{process.plug_tap_reach_in:.2dot}} from its point. Start {{cad.stud_tap_thread}} with it in the T-handle tap wrench, the dead centre's point seated in the wrench's top centre hole. Hold the chuck still with one hand and turn the wrench with the other, a drop of cutting oil, backing off every half turn, the quill following; stop when the mark reaches the top face."
feed = "hand"
diagram = { file = "diagrams/top-tap.svg", alt = "The #0-80 plug tap in the T-handle wrench in the drilled hole, its pencil mark .15 from its point at the top face; the dead centre's point in the wrench's top centre hole. The blank and the tap's diameter to scale; the wrench and the dead centre schematic." }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "tap-0-80-bottoming"
drilling = "none"
sizing = "other"
instruction = "Finish with the bottoming tap the same way, pencil-marked {{process.bottoming_tap_reach_in:.2dot}} from its point; stop when the mark reaches the top face: never bottom the tap in the hole."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Mark a #0-80 screw {{cad.stud_tap_thread_depth_min_in:.2dot}} from its end (the calipers' depth rod against the screw, marker); it runs in by hand until the mark reaches the top face."
inspection = "Full thread at least {{cad.stud_tap_thread_depth_min_in:.2dot}} deep; the {{cad.stud_tap_thread_depth_max_in:.2dot}} maximum is held by stopping the bottoming tap at its pencil mark."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.stud_tap_thread_depth_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "A screw that stops short of its mark: run the bottoming tap in once more to its mark and try again. Still short, or a tap broken in the hole: scrap the blank and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Take the blank out of the chuck. Read its length L from the faced top face to the sawn end with the calipers, and write it on this sheet."
inspection = "L, at least {{process.overall_in:.2dot}} + .02: written on this sheet."
gauge_checks = [{ gauge = "calipers", band_mm = [122.94, 127.0] }]

[[setups.operations]]
cut_kind = "other"
instruction = "L under {{process.overall_in:.2dot}} + .02: too short to face both ends; scrap the blank and make another from Setup 1."

[[setups]]
machine_kind = "lathe"
title = "Pivot end: face to length, turn the pivot, groove"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: the 4-jaw on the flats over the same packing strips, the sawn pivot end {{process.pivot_stickout_in:.2dot}} + (L − {{process.overall_in:.2dot}}) in out of the jaw fronts (L from Op 120), set with the calipers' depth rod, the beam's end on the jaw fronts, so the faced end stands {{process.pivot_stickout_in:.2dot}} out; the tapped end back through the spindle bore; indicated again as Setup 2 to {{process.indicate_tir_in:.3dot}} TIR."
datum = "Z0 (carriage DRO) the pivot end's finished plane, {{process.overall_in:.3dot}} from the top face: the DRO preset from L (Op 120) in Op 150, the blade touched on it again in Op 190. The shoulder at Z−{{process.pivot_len_in:.3dot}}."
diagram = { file = "diagrams/pivot.svg", alt = "The square turned round in the 4-jaw, the pivot end .60 in out: the AR tool faces it to Z0; the Ø.125 x .41 pivot and the groove it and the blade cut next hatched. Drawn to scale but for the chuck and the tool." }
lathe_hold = "other"
turning_support = { kind = "chuck_only", chuck_z_mm = "{{process.jaw_front_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
instruction = "Indicate the square to run true as Setup 2's first step."
inspection = "Each pair of flats within {{process.indicate_tir_in:.3dot}} TIR."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, 0.0254] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Touch the AR tool on the sawn end's high point and set the DRO Z to +(L − {{process.overall_in:.3dot}}). Face the end square in light skims down to Z0, to the centre with no pip."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{process.square_corners_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Pivot rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{process.turn_end_z_mm}}", kept_start_z_mm = "{{process.turn_start_z_mm}}", kept_end_z_mm = "{{process.turn_end_z_mm}}", start_diameter_mm = "{{process.square_corners_mm}}", end_diameter_mm = "{{process.rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{process.rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the pivot from the end to Z−({{process.pivot_len_in:.3dot}} − .008) to Ø{{process.rough_dia_mm:in.3dot}}, the first passes interrupted on the square's corners: light, steady feed."
settings = "pn-lathe-ar-c360-turn"
cut_diameter_mm = "{{process.square_corners_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Pivot finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{process.turn_end_z_mm}}", kept_start_z_mm = "{{process.turn_start_z_mm}}", kept_end_z_mm = "{{process.turn_end_z_mm}}", start_diameter_mm = "{{process.rough_dia_mm}}", end_diameter_mm = "{{process.pivot_aim_dia_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.finish_feed_mm_rev}}", minimum_diameter_mm = "{{process.pivot_dia_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the pivot over the same length to Ø{{cad.pivot_dia_min_in:.4dot}}–{{cad.pivot_dia_max_in:.4dot}}, aiming at Ø{{process.pivot_aim_dia_mm:in.4dot}}, miking between light passes."
settings = "pn-lathe-ar-c360-finish"
cut_diameter_mm = "{{process.pivot_aim_dia_mm}}"
inspection = "Pivot Ø{{cad.pivot_dia_min_in:.4dot}}–{{cad.pivot_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.pivot_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Pivot under {{cad.pivot_dia_min_in:.4dot}}: scrap the blank and make another from Setup 1. Over {{cad.pivot_dia_max_in:.4dot}}: another light pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "part"
drilling = "none"
sizing = "other"
instruction = "Shoulder, R{{cad.pivot_corner_radius_max_mm:in.3dot}} MAX corner: the blade on centre height, square to the axis. Spindle stopped: with the .002 feeler leaf on the faced end, touch the blade's chuck-side face on it and set DRO Z to +.002. Bring the blade's chuck-side face on Z−{{process.pivot_len_in:.3dot}}, lock the carriage. Spindle on: plunge to the pivot's O.D., stopping as it marks: the shoulder face square, its corner sharp."
settings = "lathe-part-c360"
cut_diameter_mm = "{{process.square_corners_mm}}"
diagram = { file = "diagrams/pivot-blade.svg", alt = "To scale: the 1/16 P1 blade's chuck-side face on the shoulder at Z−.410, plunged to the Ø.125 pivot's O.D.; the groove it plunges next hatched, .165–.315 from the shoulder." }

[[setups.operations]]
cut_kind = "other"
instruction = "Read the pivot's length with the calipers' depth rod (the beam's end on the pivot end, the rod down beside the pivot onto the shoulder face); write it down as P."
inspection = "Pivot length {{cad.pivot_length_min_in:.2dot}}–{{cad.pivot_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pivot_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "A ring left standing at the shoulder, or the pivot under {{cad.pivot_length_min_in:.2dot}}: the blade stopped short; plunge again as Op 190 at Z−{{process.pivot_len_in:.3dot}} to the pivot's O.D. and read again. Over {{cad.pivot_length_max_in:.2dot}}: the top face's {{process.top_station_in:.2dot}} station is then short; scrap the blank and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "part"
drilling = "none"
sizing = "other"
instruction = "Groove, three plunges with the {{process.blade_width_in:.4dot}} blade to a floor of Ø{{process.groove_aim_dia_in:.3dot}}: zero the cross-slide dial with the blade's tip on the pivot. Its chuck-side face {{process.groove_plunge_1_in:.4dot}}, then {{process.groove_plunge_2_in:.4dot}}, then {{process.groove_plunge_3_in:.4dot}} toward the end from the shoulder (DRO Z−({{process.pivot_len_in:.3dot}} − each)); lock the carriage and plunge (the miked pivot − {{process.groove_aim_dia_in:.3dot}})/2 in on the radius each time, backing out for chips. The DRO holds the groove's stations."
settings = "lathe-part-c360"
cut_diameter_mm = "{{process.pivot_aim_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Read the groove's floor with the calipers' jaw tips. Gauge its width with the gauge blocks: the {{process.groove_width_min_in:.3dot}} block's edge drops between its walls, the {{process.groove_width_max_in:.3dot}} (.110 wrung to .050) does not."
inspection = "Groove Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{process.groove_width_min_in:.3dot}}–{{process.groove_width_max_in:.3dot}} wide."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }, { gauge = "gauge-blocks-mitutoyo", band_mm = ["{{process.groove_width_min_mm}}", "{{process.groove_width_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Groove floor over {{cad.groove_dia_max_in:.3dot}}: plunge again at all three Op 220 stations, .002 deeper on the radius (the floor about .004 smaller), then read again as Op 230. Floor under {{cad.groove_dia_min_in:.3dot}}, or the width outside {{process.groove_width_min_in:.3dot}}–{{process.groove_width_max_in:.3dot}}: scrap the blank and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Stand the {{process.groove_width_min_in:.3dot}} block on edge in the groove. Read the calipers' depth rod, the beam's end on the pivot end, the rod down beside the pivot onto the block's face: the block pushed toward the shoulder (R1), then toward the end (R2). Station = P − R1 − {{process.groove_width_min_in:.3dot}}; end station = P − R2."
inspection = "Groove station {{cad.groove_station_min_in:.3dot}}–{{cad.groove_station_max_in:.3dot}}, end station {{cad.groove_end_station_min_in:.3dot}}–{{cad.groove_end_station_max_in:.3dot}} from the shoulder."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.groove_end_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Either station outside its band: the groove is off the set screw's seat; scrap the blank and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
holding = "In the hand; the bench vise with soft jaws on the flats if needed."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pen rod: the square, the tapped top end, the Ø.125 pivot with its set-screw groove." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the square's edges at both ends, the pivot end's edge and the groove's two edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, no burr left standing above the pivot's O.D.; leave the flats, the pivot's O.D. and the shoulder's corner otherwise untouched."
feed = "hand"

[[setups.operations]]
instruction = "Read the top face's station from the shoulder face with the calipers, one jaw on each."
inspection = "Shoulder to top face {{cad.top_face_station_min_in:.2dot}}–{{cad.top_face_station_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.top_face_station_band_mm}}" }]

[[setups.operations]]
instruction = "Outside {{cad.top_face_station_min_in:.2dot}}–{{cad.top_face_station_max_in:.2dot}}: scrap the rod and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the rod with machine oil (FINISH: {{cad.finish}}) and bag it."
