instruction = "Compound swung to 45°: with the AR tool's point on the faced end's corner, feed the compound in to rough the corner off, a 45° chamfer {{process.dome_chamfer_in:.3dot}} along the face and along the O.D. It stays outside the crown (a {{cad.dome_far_form_chamfer_max_in:.3dot}} leg would touch it)."
settings = "lathe-ar-1018"
