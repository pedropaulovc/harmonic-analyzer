[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: clamp the ball turner's 3/8 shank in an AXA No. 1 holder, the inner frame swung parallel to the spindle axis. Set the bit's tip level with the tailstock dead centre's point. Take the centre out and run the tailstock back: nothing may stand within 4 in beyond the faced end."

[[setups.operations]]
cut_kind = "other"
instruction = "Set the bit to R{{cad.dome_far_form_radius_in:.3dot}}: lay a 1-2-3 block's ground edge across the inner frame's edges and read the bit's tip from it with the calipers' depth rod: {{process.ball_turner_rule_in:.4dot}} (the radius plus the maker's 3/16 from the frame's end to the pivot). Tighten the bit's set screw."

[[setups.operations]]
cut_kind = "other"
instruction = "Inner frame parallel to the axis: bring the carriage up until the bit's tip just touches the faced end; lock the carriage and zero the DRO Z. The pivot is now one radius behind the faced plane, so the apex stays on it. The carriage stays locked until the crown is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: run the cross slide out until the bit clears the end through the whole sweep. Swing the frame through the sweep and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms (they reach .19 either side of the pivot)."

[[setups.operations]]
cut_kind = "other"
instruction = "An arm touches the jaws: unlock the carriage, chuck the offcut {{process.end_stickout_in:.2dot}} in out again over the shim wrap and repeat Ops 100–110."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the chamfer somewhere in the sweep. Sweep the frame from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes: the pivot is then on the axis. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Take the offcut out and stand it on its other faced end on the surface plate. Zero the height gauge's scriber on the apex; lower it until its tip, slid in across the top, just stops on the O.D.'s top edge (the crown's rim) and read it: the crown height. Note it: Op 170 uses it."
inspection = "Trial crown {{cad.dome_far_height_min_in:.3dot}}–{{cad.dome_far_height_max_in:.3dot}} high; no pip, flat or ring at the apex."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.dome_far_height_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Crown under {{cad.dome_far_height_min_in:.3dot}}: reset the bit (Op 90) to a depth-rod reading .010 shorter; over {{cad.dome_far_height_max_in:.3dot}}: .010 longer (each .010 moves the crown about .004). Chuck the offcut again as Op 60, {{process.end_stickout_in:.2dot}} in out, face the crown off and repeat Op 70, Ops 100–110 and Ops 130–150. Under .30 in left in the jaws: saw a new trial offcut. Once it passes, leave the bit's set screw alone until both crowns are cut."

