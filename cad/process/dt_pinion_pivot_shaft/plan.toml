# Pinion pivot shaft MHA-DT-19, one off, on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: the O.D. is 1/4 ground stock as supplied (owner ruling
# 2026-11-20, #2346: a ground-stock shaft is cut to length, faced and has its
# features added, never turned on its fitted diameter). Saw a blank a little
# long; in the 3-jaw over a shim wrap, a short stick-out, the rest of the bar
# back in the spindle bore: face end A; turn it round, face end B to the
# faced length (the body plus both crown heights; the crowns keep their
# apexes on the faced planes) and sweep its crown with the LittleMachineShop
# 2569 ball turner set to R.180 on a trial offcut; turn it round again and
# sweep crown A. The two spring-pin holes are match-drilled at assembly
# (MHA-DT-00 SHAFT DRILL SET), so the shaft leaves without them.
#
# The crowns: owner ruling 2026-11-23 (tool audit Q5, option D): "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569,
# $124.95; convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file
# is the fallback for any dome it cannot reach. Confirm each dome is convex
# and reachable before buying." Reach test, both ends alike: convex .05-high
# crown, R.180 (SR.18 REF), ball Ø.36 under the tool's .75; each end free (no
# centre); the .50 stickout holds the crown's centre .50 - .18 = .32 out of
# the jaws (the frame's arms need .25) and stays under 3 x Ø.25 = .75;
# nothing over Ø.75 on the shaft. Reachable. The radius is set once on a
# trial offcut (both ends faced so it stands on the surface plate) and
# checked by the crown's height with the height gauge, the drawing's .04-.06
# band. The corner is roughed off first with a 45° chamfer that stays
# outside the sphere.
#
# Flagged: the ball turner (shop/lathe.toml tools.ball-radius-turner-lms-2569)
# is to order; the 1/4 in ground round (stock-to-order.toml
# 1018-ground-round-1-4) is to order. The bar ruled and carted is ground
# 12L14 (owner ruling 2026-11-24; McMaster 5227T232); the material line and
# material_key below and the drawing still say 1018 until issue #3561 changes
# them. 12L14 turns faster than 1018: the lathe-*-1018 settings this plan
# uses are on the slow side for it and may be re-derived from the maker rows.
# Lengths over 6 in are read with the owned 0-12 in height gauge on the
# surface plate (the owned calipers stop at 6 in).
title = "Pinion Pivot Shaft"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel, precision-ground round, 1/4 in"
stock = "Ø{{process.stock_dia_in:.4dot}} ground bar (to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long and one {{process.trial_offcut_in:.2dot}} in trial offcut (allow two saw kerfs)."
shop = "../shop"
stock_refs = ["1018-ground-round-1-4"]
material_key = "lathe-1018-cold-finished"

standing = true

[[notes]]
title = "This job"
rows = [
  ["O.D.", "The O.D. is left as supplied: grip it over a brass shim wrap and never cut it."],
]

[cad]
file = "../../out/features/dt_pinion_pivot_shaft/features.toml"
adapter = "turned_shaft"
part = "dt-pinion-pivot-shaft"

[parameters]
quantity = 1
stock_dia_in = 0.25
# Sawn a little over the faced length: about .03 in to face off each end.
blank_length_in = 7.88
as_supplied_outer = 1
# Out of the jaw fronts while an end is faced and crowned: under 4 × Ø.
end_stickout_in = 0.5
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the crowns' height, the faced length and the
# sweep from it): each crown is swept full (to the centre, no flat at the
# apex) on the Ø.250, .180 − √(.180² − .125²) = .0505 high
# (cad.dome_*_form_height), inside the drawing's .05 (.XX) band. The set
# radius is proved on the trial offcut, whose crown is read (Op 150) and may
# land anywhere in .04-.06; end B is faced to the body's 7.70-7.72 plus twice
# that reading (each apex stays on its faced plane), so the body holds
# whatever the trial crown is. cad.faced_length_* (at .0505) is not used.
dome_form_radius_in = 0.18
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .180 + .1875.
ball_turner_rule_in = 0.3675
# A trial offcut of the same bar, sawn with the blank, for setting the
# radius: the .50 stickout plus about .5 in the jaws.
trial_offcut_in = 1.0
# The roughing chamfer's leg, ahead of the sweep: .9 × the .04 cap height
# that limits it on the flattest crown the drawing's .04-.06 band admits
# (R.215, whose sphere a 45° line first meets at the root), rounded down to
# .005; the R.180 set here would allow .0501 on the least Ø.2492 bar
# (cad.dome_*_form_chamfer_max; the adapter refuses more).
dome_chamfer_in = 0.035

