note = "HOLD: nominal Ø6.350 CAD surface table only, not a qualified tool path or dome-to-body blend for the Ø6.340 process aim. Proposed contour feeding uses X/Z handwheels at a light, steady manual feed with power feed disengaged; a cutting-data mm/rev reference is not travel per table row. Qualify tool compensation and profile/height inspection before cutting; preserve the overall-length apex and the drawing's dome geometry."

