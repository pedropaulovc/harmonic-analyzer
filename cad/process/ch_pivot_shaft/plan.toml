machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2dot}} high). One 1 in parallel of the 1/8 in thick set standing on edge, centred between the jaws, 1/16 in clear of each. The shaft lying on its top edge along the jaws, gripped on its O.D.: the datum-end tip {{process.vise_jaw_from_x0_mm:in.2dot}} in out past the left jaw side, the far-end tip just out past the right. Tap it down onto the parallel while closing the vise. Its top stands {{process.jaw_top_over_od_mm:in.3dot}} under the jaw tops. The datum-end flat lies wholly left of the jaws."
datum = "Program PS01_flat (cam:ch_pivot_shaft). G54: X0 the datum-end tip (the datum-end dome's apex), +X along the shaft; Y0 the shaft's axis; Z0 the top of the O.D. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/flats.svg", alt = "The domed shaft lying along the vise jaws on a parallel, the datum-end tip out at the left; the 1/8 in end mill cuts the datum-end flat on top, left of the jaws." }
