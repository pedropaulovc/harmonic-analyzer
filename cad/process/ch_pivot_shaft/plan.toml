note = "HOLD: no released cradle fabrication/anchoring specification or secured apex-pickup support/normality qualification is established. This is a proposed holding and pickup method, not actual hardware availability or machining approval. Nominal drawing/frame heights do not verify actual installed spindle/holder clearance; measure and qualify the installed stack before execution."

[setups.stock_state]
od_mm = 6.35
top_z = 3.175                # bar top = axis + 6.35/2 (zero.z below)
bottom_z = -3.175            # nominal cylindrical underside in M3, not a measured V-block seat
note = "Along M3 X the north apex sits at X0, the south apex at the measured overall length, nominal X162.56."

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "unknown"          # proposed split-bore machining cradle; not an available or qualified inventory item
pose = "unknown"
stop_face = "north_dome"
support = "none"             # proposed cradle and bolted caps provide the complete restraint; no independent support claimed
grip_on = "proposed paired split-bore saddles on the middle running body, clear of both flats, with positively bolted upper caps"
grip_mm = "unknown"          # actual saddle contact lengths and clamp qualification not established
fixed_jaw = "not_applicable" # no vise-body squeeze is claimed to clamp the shaft
jaws_along = "not_applicable" # proposed split-bore caps are not vise jaws; saddle axes follow setup X
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "HOLD: qualify secured support and normality for a nonrotating flat contact pickup against the north dome apex on the shaft axis, with its tool-reference offset accounted for. No hand-held contact or rotating edge-finder pickup on the curved dome is claimed."
clamp = "HOLD: design, build and qualify a table-anchored split-bore cradle. Bolt each upper cap onto its lower saddle so preload positively restrains the shaft against rotation and lift; tighten table anchors and cap bolts to the fixture's qualified instructions before cutting. Merely squeezing V-block bodies in a vise is not shaft restraint."
note = "Proposed process hardware, unbuilt/unqualified: paired split cylindrical saddles and bolted upper caps on a connected base anchored to the mill table, with contacts between the flat-cut zones. A source-backed design may bore at drawing maximum6.350 and locate a fixed lower tangent: for actual D in6.32968..6.350 the shaft axis shifts by(D-6.350)/2 and the cap must close by6.350-D, up to0.02032. Qualify contact, cap travel/preload and antiroll across that range, rather than treating a larger bore as a free-air grip. In the nominal frame the lower tangent isZ-3.175 and AF5.334 gives flatZ2.159; actual fixture bottom/pose are not measured or approved. Establish availability, bore/contact geometry, cap bolts, table anchoring, grip and pose before execution. Select actual base/riser height and installed cutter projection to clear the machine's spindle-to-table minimum at the deepest cut; specify a transfer height above every cap, nut, stud and holder obstacle. With spindle stopped, sweep the qualified cradle reference face parallel to setup X over its measured usable span and adjust to the approved alignment limit. No example fixture dimensions, installed-tool measurements or availability claims are transferred. Grip, pose, limit/span, pickup and travel remain HOLD."
align = { indicator = "dti", limit_mm = "unknown", over_mm = "unknown", face = "unknown", cite = "HOLD: proposed split-bore cradle reference face and actual alignment limit/span require design and qualification" }

[setups.zero.transfer]
