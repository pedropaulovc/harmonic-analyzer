check_jog_mm = 10.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "parting-blade-lms-1728"
x_method = "spindle stopped: touch the blade tip on the stub's trial-cut land through cigarette paper (0.05)"  # proposed contact recipe; Axis Set comes only from structured paper compensation
x_face = "x_zero"            # this setup's actual trial-cut land on the waste stub
x_paper_mm = 0.05            # proposed paper allowance, not a reported measurement
corner = "chuck_side"
gauge = "micrometers/0-1in"
z_face = "south stub end"
z_gauge = "height-gauge"
z_measure = "north apex to south stub end, measured before holding"
z_offset_mm = -162.56
edge_mm = 18.5
paper_mm = 0.05              # author's choice: cigarette paper
method = "measure_then_set"
before_ops = [5]

[[setups.zero.tool_touches]]
tool = "hss-toolbit-3-8-rh"
x_method = "touch the turned body just measured by micrometer; Axis Set its measured diameter"  # author's choice
x_face = "pivot_bearing"
x_paper_mm = 0.0
gauge = "micrometers/0-1in"
z_face = "south parted end"
edge_mm = 1.0
paper_mm = 0.0               # author's choice: direct contact
method = "touch; withdraw along X without moving Z; Axis Set Z"  # author's choice
after_op = 5
