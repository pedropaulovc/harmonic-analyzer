[[setups.ops]]
op = 5
do = "part_off"
feature = "south_dome"
keep = "pivot_bearing"       # chuck-side shaft stays held; discard only south grip stub
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
to_dia = 0.0
doc_mm = 3.175               # maximum nominal radial plunge in the turned length; no support/grip qualification implied
to_z = 1.0                   # author's choice: chuck-side blade corner 1.0 past the south apex plane, inside the turned length (to +1.5)
direction = "plunge_radial"  # author's choice
note = "Part the grip stub off inside the turned length. Peck and clear chips; pick the offcut up only with the spindle stopped."

[[setups.ops]]
op = 10
do = "face"
feature = "south_dome"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0                   # south apex plane: overall 162.56 tip to tip
to_dia = 0.0
direction = "radially_inward"  # author's choice
note = "Face deterministically to Z0, the nominal 162.560 mm overall tip-to-tip target, before starting the dome at Z0. The drawing acceptance band is inspected separately; it is not an indeterminate tool stop. HOLD until the height-gauge/support method is qualified; the 6 in caliper cannot span this shaft."

[setups.ops.checks]
length = "height-gauge"

[[setups.ops]]
op = 20
do = "form_dome"
feature = "south_dome"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -1.524                # apex 0.0, base -1.524, sphere R 4.069 centred at -4.069
doc_mm = 0.1                 # author's proposed axial rough-stair increment, not a shop observation
rough_allowance_mm = 0.2     # author's proposed diametral leave before the compensated finish table
direction = "apex_to_base"   # author's choice
