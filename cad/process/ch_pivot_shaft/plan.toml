# Pivot shaft MHA-CH-05, one off. The ends are turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC); the two set-screw flats are milled on the CNC PM-30MV (NC: cam.py).
# Route chosen for speed, the fulcrum shaft's (MHA-CH-04): the O.D. is 1/4
# ground stock as supplied (1/4 REF, GROUND ROD, AS SUPPLIED on the sheet; owner ruling
# 2026-11-20, #2346: a ground-stock shaft is cut to length, faced and has its
# features added, never turned on its fitted diameter). Saw a blank a little
# long; in the 3-jaw over a shim wrap, a short stick-out, the rest of the bar
# back in the spindle bore: face the datum end; turn it round, face
# the far end to the 6.85 tip-to-tip length (each swept dome keeps its apex
# on the faced plane) and sweep its .06 dome with the LittleMachineShop 2569
# ball turner set to R.160 on a trial offcut; turn it round again and sweep
# the datum-end dome. Then on the mill: the shaft
# lying along the vise jaws on one centred parallel, the datum-end tip .55 out
# past the left jaw side, PS01_flat cuts the datum-end flat (X0 on the datum-end
# tip); turned end for end, the datum-end flat set level with the end mill's tip
# on a feeler (BOTH FLATS IN LINE, ONE SIDE), the same file cuts the far-end
# flat from the far-end tip (each flat is stationed from its own tip). One
# clamping cannot cut both: centred on the 6.25 in jaws the 6.85 shaft puts
# each .18 wide flat's inner end between the jaw faces, where the 1/8 in
# cutter's sweep would reach them. Centres are not used (CENTRES OK allows
# them; the shaft is never held between centres).
#
# NC (cam:ch_pivot_shaft, cad/process/ch_pivot_shaft/cam.py): PS01_flat, run
# once per flat. Program name, the [parameters] and the milling_cuts names
# are a contract with that recipe. T1 is the 1/8 in end mill.
#
# The domes: owner ruling 2026-11-23 (tool audit Q5, option D): "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569,
# $124.95; convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file
# is the fallback for any dome it cannot reach. Confirm each dome is convex
# and reachable before buying." Reach test, both ends alike: convex .06-high
# dome, R.160 (SR.16 REF), ball Ø.32 under the tool's .75; each end free (no
# centre); the .50 stickout holds the dome's centre .50 - .16 = .34 out of the
# jaws (the frame's arms need .25) and stays under 3 x Ø.25 = .75; nothing
# over Ø.75 on the shaft. Reachable. The radius is set once on a trial offcut
# (both ends faced so it stands on the surface plate) and checked by the
# dome's height with the height gauge, the drawing's .05-.07 band (any R
# .147-.181 on the Ø.250). The corner is roughed off first with a 45° chamfer
# that stays outside the sphere.
#
# Flagged: the ball turner (shop/lathe.toml tools.ball-radius-turner-lms-2569)
# is to order. 1/4 in 1018 ground
# round (stock-to-order.toml 1018-ground-round-1-4) is to order. Lengths over
# 6 in are read with the owned 0-12 in height gauge on the surface plate (the
# owned calipers stop at 6 in).
title = "Pivot Shaft"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel, precision-ground round, 1/4 in"
stock = "Ø{{process.stock_dia_in:.4dot}} ground bar (to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long and one {{process.trial_offcut_in:.2dot}} in trial offcut (allow two saw kerfs)."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. The O.D. is left as supplied: grip it over a brass shim wrap (lathe) and never cut it. Home the mill ($H) and touch off G54 before the mill setup; after any controller reset, stall or E-stop, home and touch off again before Cycle Start. Prove the file in air first."
shop = "../shop"
stock_refs = ["1018-ground-round-1-4"]  # 1/4 GROUND STOCK OK (owner ruling 2026-11-20, #2346)
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_pivot_shaft/features.toml"
adapter = "turned_shaft"
part = "ch-pivot-shaft"

[parameters]
quantity = 1
stock_dia_in = 0.25
# Sawn a little over the faced length: about .03 in to face off each end.
blank_length_in = 6.91
# Out of the jaw fronts while an end is faced and domed: under 4 × Ø.
end_stickout_in = 0.5
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the domes' height, the faced length and the
# sweep from it): each dome is swept full to the centre on the Ø.250,
# .160 − √(.160² − .125²) = .0601 high (cad.dome_*_form_height), its apex on
# the faced plane.
dome_form_radius_in = 0.16
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .160 + .1875.
ball_turner_rule_in = 0.3475
# A trial offcut of the same bar, sawn with the blank, for setting the
# radius: the .50 stickout plus about .5 in the jaws.
trial_offcut_in = 1.0
# The roughing chamfer's leg, ahead of the sweep: .9 × the .05 cap height
# that limits it on the flattest crown the drawing's .05-.07 band admits
# (R.181, whose sphere a 45° line first meets at the root), rounded down to
# .005; the R.160 set here would allow .0583 on the least Ø.2492 bar
# (cad.dome_*_form_chamfer_max; the adapter refuses more).
dome_chamfer_in = 0.045
# Mill (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): one 1 in parallel of the set standing on edge, centred between the
# jaws, 1/16 in clear of each (two parallels would fill the 1/4 in gap and
# take the grip off the shaft); the shaft lying on its top edge along the
# jaws, gripped on its O.D.; the cutter works down between the jaw faces.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The jaw tops over the O.D. top (Z0): jaw height less the parallel and the
# O.D.; cam.py checks it.
jaw_top_over_od_mm = 13.1953
# The out tip (X0) .55 in past the left jaw side: the flat ends .34 in from
# it, and the 1/8 in cutter then clears the jaws by .21 in (cam.py's jaw
# keep-outs prove it); the other tip stands .05 in past the right jaw side.
vise_jaw_from_x0_mm = 13.97
# The 1/8 in end mill's flats (shop endmill-carbide-3fl-1-8): its centre
# crosses each flat's width at X stations no more than half the cutter apart.
em_eighth_dia_mm = 3.175
flat_stepover_max_mm = 1.5875
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# 1/8 in end mill, 1-1/2 in overall: set at least .875 in out of the collet,
# so it reaches the flat .04 in below the O.D. top beside the jaws with the
# collet nut, which overhangs them, 5 mm above the jaw tops (cam.py checks it).
em_eighth_projection_min_mm = 22.225
# Each flat's depth below the O.D. top: the O.D. less the across, nominal
# (.2500 − .2100 = .0400 in); cam.py checks it against the export.
flat_depth_mm = 1.016
# The flat's ends from its own tip (X0) as the R.160 sweep cuts it (the same
# for both flats), and the right jaw side; cam.py checks them.
flat_from_mm = 2.543
flat_to_mm = 8.639
vise_jaw_to_x0_mm = 172.644
# Both flats' Y0 pick-up on the O.D.: the .200 edge finder's radius, and the
# shaft's axis that far plus the bought rod's radius off the O.D. it touches
# (stock_dia_in, the stock record's Ø; cam.py recomputes it from the export's
# as-supplied O.D. and refuses a mismatch).
edge_finder_radius_mm = 2.54
y0_edge_find_mm = 5.715

