indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap, {{process.end_stickout_in:.2dot}} in out, the north end back in the spindle bore."
datum = "DRO Z touched on the south end with the facing tool before each skim (Op 50), and with the form tool's arc in Op 70."
diagram = { file = "diagrams/end-b.svg", alt = "The shaft turned round, the south end out: faced to the 6.85 length, then domed with the R.160 form tool." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the south end square in light skims, reading the length between them (Op 60), to {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}}, aiming {{cad.faced_length_in:.3dot}}: the tip-to-tip length (each form-cut dome keeps its tip on the faced plane)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the shaft out, stand it on the north end on the surface plate, held upright by hand against the side of a 1-2-3 block, and read the south end with the height gauge (the 0–6 in calipers do not reach 6.85 in). Chuck it again {{process.end_stickout_in:.2dot}} out and touch the facing tool on the south end before the next skim."
inspection = "Length {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Set the R.160 form tool on centre height, square to the axis, its arc spanning the whole end. Bring it up to the south end and set the cross-slide until the arc touches the O.D. corner on both sides together (no light at either side): the arc is then centred. Zero the DRO Z there."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Form the south dome: feed along Z to Z−{{cad.dome_far_form_height_in:.4dot}} (the dome's height on the Ø.250). The form then reaches the centre, the tip on the faced plane."
settings = "lathe-form-r160-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Look at the south dome under a light: no pip or flat at the tip, the dome's edge a clean corner all round the O.D."

[[setups.operations]]
cut_kind = "other"
instruction = "A pip at the tip: the tool is off centre height. Reset its height; if that moved the tool along Z, touch the arc on the dome's rim (it now sits at Z−{{cad.dome_far_form_height_in:.4dot}}) and set the DRO Z to −{{cad.dome_far_form_height_in:.4dot}} there, not zero. Take one more light pass to Z−{{cad.dome_far_form_height_in:.4dot}}, never deeper (it would shorten the 6.85 length)."

[[setups.operations]]
cut_kind = "other"
instruction = "A step on one side of the rim: the arc is not centred across the bar. Centre it, the arc touching the rim on both sides together, and set the DRO Z to −{{cad.dome_far_form_height_in:.4dot}} there, not zero (the rim sits at Z−{{cad.dome_far_form_height_in:.4dot}}). Take one more light pass to Z−{{cad.dome_far_form_height_in:.4dot}}."

[[setups.operations]]
cut_kind = "other"
instruction = "A flat at the tip with the DRO at Z−{{cad.dome_far_form_height_in:.4dot}}: the form is not cut to R.160. Stop: the shaft is scrap and the tool goes back."

