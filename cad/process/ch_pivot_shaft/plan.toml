direction = "positive_setup_y"
note = "Traverse across both round sides along setup +Y, stepping X between transverse passes to produce planar axial endwalls, not an axial slot with rounded ends; stop each axis individually. Removal bounds M3 X2.540 to X8.636 define a 6.096 long flat centred 5.588 from the north tip. Pick up the boundaries using the actual cutter diameter; bounds are not cutter-centre coordinates. For nominal diameter 4.7625 only, illustrative cutter-centre X limits are 4.92125 to 6.25475; qualify actual diameter and pickup before cutting."

[setups.ops.checks]
