beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{process.vise_jaw_from_x0_mm}}", "{{process.vise_jaw_to_x0_mm}}"], section_mm = { diameter = "{{cad.stock_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 Y0 the shaft's axis and X0 the datum-end tip: edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm), its tip level with the shaft's axis. Y: on the O.D. from the moving-jaw side, left of the jaws, G10 L20 P1 Y-{{process.y0_edge_find_mm:.3f}} (the supplied Ø{{process.stock_dia_in:.4dot}} ground rod's radius plus the .200 edge finder's; the rod is not miked, it is used as bought). X: on the datum-end tip from the left, Y0, G10 L20 P1 X-{{process.edge_finder_radius_mm:.3f}}."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis."
instruction_detailed = "Console M6 T1 (1/8 in end mill, at least {{process.em_eighth_projection_min_mm:in.3dot}} in out of the collet; the tool setter measures it). MDI G0 X5.000 Y0.000: over the O.D. left of the jaws, past the dome. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PS01_flat in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PS01_flat: at its M6 prompt T1 is already in, so continue; the spindle runs at 2800 in air. Watch each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run PS01_flat (M6 T1, 1/8 in end mill; set 2800): the datum-end flat ramped in across its width, then cut {{process.flat_depth_mm:in.3dot}} deep in passes across it, {{process.flat_from_mm:in.3dot}}–{{process.flat_to_mm:in.3dot}} from the datum-end tip."
settings = "endmill-carbide-3fl-1-8-lathe-1018"
milling_cuts = [
  { name = "flat_north", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_from_mm}}", "{{process.flat_to_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp and read the datum-end flat across to the O.D. under it with the calipers' outside jaws, the jaw tips on the flat (a micrometer's Ø.25 anvil is wider than the flat)."
inspection = "Datum-end flat across {{cad.flat_north_across_min_in:.3dot}}–{{cad.flat_north_across_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_north_across_band_mm}}" }]

[[setups.operations]]
instruction = "Across outside the band: the shaft is scrap; make another from Setup 1 (a flat is not re-cut)."

