instruction = "Readings further apart: raise the bit, turn the shaft a touch in the snug jaws to lower the high side, and repeat Op 230."

[[setups.operations]]
instruction = "Tighten the vise, tap the shaft down onto the parallel, and repeat Op 230's two readings: still within 0.025 mm, else back to Op 240."

[[setups.operations]]
instruction = "G54 Y0 the shaft's axis and X0 the south tip: edge finder (900 rpm), as Op 170."
