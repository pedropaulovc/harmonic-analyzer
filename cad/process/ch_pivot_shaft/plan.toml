# no holes on this part

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "none"              # tailstock withdrawn for dome access
grip_on = "finished body near the shoulder, south of the south relief"
grip_mm = 25.0             # author's choice: grip body from T2 Z -37 to -12
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "jaw fronts at T2 Z -12, 4.5 mm south of shoulder north face"  # author's choice
clamp = "tighten chuck key by hand at all three pinions; remove key; indicate after clamping"  # author's choice
jaw_protection = "prepare clean paper sleeve under smooth, deburred jaw contacts; reject marks or slip"  # author's choice; bring sleeve, no inventory accessory claimed
stickout_mm = 27.0          # author's choice: stub Z15 - jaw front Z(-12)

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bearing"
gauge = "dial-indicator"
runout_limit_mm = "unknown"   # no coaxiality tolerance on the drawing

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # on the north allowance stub, EL400 §9.2.1 p62
tool = "turning-tools-warner-lms-4132/AR"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0         # author's choice: physical radial jog

[setups.zero.z]
face = "shoulder_north_face"
edge_mm = -7.5                # shoulder north face in T2: -(6.0 + 1.5)
from = "+z"
method = "touch"              # EL400 §9.2.1 p62: touch, withdraw without Z motion
tool = "turning-tools-warner-lms-4132/AR"
paper_mm = 0.0
check_jog_mm = 10.0         # author's choice: physical axial jog
retouch_after = []

[[setups.zero.tool_touches]]
tool = "turning-tools-warner-lms-4132/E"
x_method = "touch the cylinder just measured by micrometer; Axis Set its measured diameter"  # author's choice
gauge = "micrometers/0-1in"
z_face = "shoulder_north_face"
edge_mm = -7.5
paper_mm = 0.0              # author's choice: direct contact
method = "touch; withdraw along X without moving Z; Axis Set Z"  # author's choice
before_ops = [20]

[[setups.ops]]
op = 10
do = "face"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0                    # temporary face at the north apex plane
direction = "radially_inward"  # author's choice
note = "Face off the north allowance and centre seat down to the apex plane."

[[setups.ops]]
op = 20
do = "form_dome"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -1.5                   # apex 0.0, base -1.5, sphere R 4.11 centred at -4.11
direction = "apex_to_base"  # author's choice: hand traverse from T2 Z0 to -1.5
contour = { method = "axial_table", step_mm = 0.1 }  # author's choice: target spherical surface, not nose-compensated toolpath
note = "Forms the dome and with it the north end of the journal (JournalLength)."

[setups.ops.checks]
height = "calipers"         # author's choice: axial outside-jaw contact at apex and visible base rim

[setups.ops.inspection_methods]
height = "With spindle stopped, align outside caliper jaws axially at apex and visible base rim; repeat around rim."  # author's choice

[[setups.ops]]
op = 30
do = "inspect"               # manual: no tool, holder or cut
feature = "pivot_journal"
note = "JournalLength runs from the dome base edge (formed in op 20) to the shoulder north face."

[setups.ops.checks]
length = "calipers"         # author's choice: outside jaws, dome base rim to shoulder north face

[setups.ops.inspection_methods]
length = "With spindle stopped, align outside caliper jaws axially at the dome base rim and shoulder north face; repeat around rim."  # author's choice

