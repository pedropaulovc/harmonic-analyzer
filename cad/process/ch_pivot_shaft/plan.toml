# Adapted from https://github.com/pedropaulovc/prechips/blob/55cae713860a491b8925aed1ad8a24fb30502fe0/examples/pivot-shaft/plan.toml
# Hand-authored reference plan for MHA-CH-005 (pivot shaft), rev 7: the part
# is now a PLAIN Ø1/4 in rod (user, 2026-10-10: shoulder, reliefs and north
# journal gone) with two set-screw flats, so the O.D. is the bought
# cold-finished shafting and is never turned. Route: S1 lathe, dome the north
# end; S2 mill, both flats in line on one side, stations from the north end
# (the drawing dimensions them from there, so both are milled BEFORE the plain
# end is cut to fit); S3 lathe, cut the plain end to fit and dome it.
# Holding, stick-out and DRO recipe numbers are author's choices, not
# measurements. RPM remains unknown/derived. Station values below are the
# nominal model's (rocker_bank_layout.PIVOT_SHAFT_LENGTH /
# PIVOT_SHAFT_FLAT_STATIONS); refresh them whenever the layout moves.
part = "ch-pivot-shaft"
features = "../../out/features/ch_pivot_shaft/features.toml"
construction = "one_piece"   # author's route: all shaft geometry cut from the declared single bar
quantity = 1                 # harmonic-analyzer/cad/config/parts/ch-pivot-shaft.yaml:ch-pivot-shaft.quantity

[drawing]
number = "MHA-CH-005"        # parts/ch-pivot-shaft.yaml:ch-pivot-shaft.number
revision = "unknown"         # release/operator matching pending

[paths]
inventory = "../shop/inventory.toml"
policy = "../shop/shop-policy.toml"
cutting_data = "../shop/cutting-data.toml"

[stock]
form = "round_bar"
material = "AISI 1018 cold-finished steel shafting, Ø1/4 in"  # parts/ch-pivot-shaft.yaml:ch-pivot-shaft.material_specification
dia_mm = 6.35                # the finished O.D. as bought (ch_pivot_shaft_spec.py:40-41); actual bar not measured
length_mm = 175.0            # "SUPPLY 175 LONG, PLAIN END UNCUT." (ch_pivot_shaft_spec.py:148-153)
supply_length_mm = 175
supply_datum = "north dome apex plane to south supply end"  # author's choice; drawing leaves datum unstated
on_hand = false              # inventory stock = []
prerequisite = "none: the O.D. is the shafting's; CENTRES OK is permission, not a requirement"

# The lathe has no DRO listed in the inventory. The EL400 functions below are
# the manual's; installation on the PM-1127VF-LB is unknown. The authored
# recipe requires X diametric, X+ away from the spindle axis and Z+ toward the
# exposed end in every chucking.
# EL400 §9.2.1 p62: trial cut outside, withdraw without disturbing X, measure,
# enter X; face or touch the end, withdraw without Z motion, enter Z); §6.2 p20
# Direction and Radial/Diametric; §7.4 p31 Axis Set; §8.1 p37 Preset is
# distance-to-go and never used for zero.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false          # author's choice: X diametric; a physical 10 mm X jog displays 20 mm

[dro.direction]
x = "away_from_spindle_axis" # author's choice: positive radial tool withdrawal
z = "toward_exposed_end"     # author's choice: +T1 north, +T3 south; redo sign check after rechuck

# Plan-owned setup frames. The exported manifest declares only `model` and an
# unknown `setup`. Origins and axes are model coordinates. The frame choice is
# the author's; the cited source geometry is CAD's.

# S1: origin at the north apex plane, z = +DomeHeight = +1.5
# (exported north_dome base_z 0.0 + height_nominal 1.5).
[frames.T1]
origin = [0.0, 0.0, 1.5]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"   # set on the faced north end, op 10
note = "AUTHOR'S CHOICE: north apex plane; +Z toward the north end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/ch_pivot_shaft_spec.py:42-45",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py:271-283,376",
]

# S2: origin on the axis at the north end of the cylinder (the dome's base
# plane, model z 0), +Z up = model +Y (the flats' outward normal), +X along
# the bar toward the plain end (model -Z).
[frames.M2]
origin = [0.0, 0.0, 0.0]
x = [0.0, 0.0, -1.0]
y = [-1.0, 0.0, 0.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"   # X0 touched off the north dome's base rim, Z0 on the bar's top
note = "AUTHOR'S CHOICE: north cylinder end on the axis; +Z = flat normal; +X toward the plain end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/ch_pivot_shaft_spec.py:56-87",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py:162-269",
]

# S3: origin at the scribe the fitter makes at the south ear's outer face,
# +Z toward the plain end. Nominal model position = -ShaftLength REF
# (exported south_dome base_z); the real position is the installed-ear span,
# which no input supplies.
[frames.T3]
origin = [0.0, 0.0, -159.31]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "unknown"   # awaiting the measured span over both installed MHA-CH-008 ears
note = "AUTHOR'S CHOICE: scribe at the south ear outer face, north end flush with the north ear; +Z toward the plain end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/rocker_bank_layout.py:163-166",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py:88,375",
]

# ---------------------------------------------------------------- S1
[[setups]]
id = "S1"
machine = "PM-1127VF-LB"
frame = "T1"                 # plan.frames.T1 (author's choice; exported `setup` stays unknown)
coolant = "CRC cutting oil brushed on"  # author's choice; listed consumable, not a cutting-data claim
deburr_mm = 0.25             # title block: break edges R0.25 OR CHAMFER 0.25 MAX (title_block.yaml:edge_break.radius_mm, edge_break.chamfer_max_mm)
stock_in = "bar"

[setups.stock_state]
od_mm = 6.35                 # shafting as bought, nominal; not measured
north_end_z = 1.0            # author's choice: 1 mm to face past the apex plane
south_end_z = -174.0         # supply 175 from the bought end

[setups.stock_state.local_thickness]
# no holes on this part: nothing to pierce

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "none"             # short stick-out; tailstock not needed
grip_on = "bar body, 20 mm from the north end"
grip_mm = 25.0               # author's choice: grip T1 Z -45 to -20
fixed_jaw = "not_applicable" # scroll chuck
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "jaw fronts at T1 Z -20"  # author's choice
clamp = "tighten chuck key by hand at all three pinions; remove key; check grip before cutting"  # author's choice
jaw_protection = "prepare clean paper sleeve under smooth, deburred jaw contacts; reject marks or slip"  # author's choice; the O.D. is the finished running face
stickout_mm = 21.0           # author's choice: north end Z1 - jaw front Z(-20)

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # EL400 §9.2.1 p62: on the waste north millimetre
tool = "turning-tools-warner-lms-4132/AR"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog, +20 on diametric display

[setups.zero.z]
face = "north_dome"
edge_mm = 0.0
from = "+z"
method = "face_then_set"     # EL400 §9.2.1 p62: face, withdraw without Z motion
after_op = 10
tool = "turning-tools-warner-lms-4132/AR"
paper_mm = 0.0               # tool on the cut face, no paper
check_jog_mm = 10.0          # author's choice: physical axial jog
retouch_after = []

[[setups.zero.tool_touches]]
tool = "turning-tools-warner-lms-4132/E"
x_method = "touch the bar just measured by micrometer; Axis Set its measured diameter"  # author's choice
gauge = "micrometers/0-1in"
z_face = "north_dome"
edge_mm = 0.0
paper_mm = 0.0               # author's choice: direct contact, no paper
method = "touch; withdraw along X without moving Z; Axis Set Z"  # author's choice
before_ops = [20]

[[setups.ops]]
op = 10
do = "face"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0                   # temporary face at the north apex plane = T1 origin
direction = "radially_inward"  # author's choice: feed toward spindle axis
note = "Face the bought end square, 1 mm, down to the apex plane, then set T1 Z0."

[[setups.ops]]
op = 20
do = "form_dome"
feature = "north_dome"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -1.5                  # apex 0.0, base -1.5, sphere R 4.11 centred at -4.11
direction = "apex_to_base"   # author's choice: hand traverse from T1 Z0 to -1.5
contour = { method = "axial_table", step_mm = 0.1 }  # author's choice: target spherical surface, not nose-compensated toolpath
note = "Forms the dome; its base rim is the north end of the cylinder, the flats' station datum."

[setups.ops.checks]
height = "calipers"          # author's choice: axial outside-jaw contact at apex and visible base rim

[setups.ops.inspection_methods]
height = "With spindle stopped, align outside caliper jaws axially at apex and visible base rim; repeat around rim."  # author's choice

[[setups.ops]]
op = 30
do = "inspect"               # manual: no tool, holder or cut
feature = "pivot_bearing"
note = "The O.D. is the bought shafting's: check it before any flat is milled; no roughness comparator in the inventory."

[setups.ops.checks]
dia = "micrometers/0-1in"
finish_ra = "unknown"

# ---------------------------------------------------------------- S2
# Both flats in one setup, so they lie in line, one side ("BOTH FLATS IN
# LINE, ONE SIDE."). Stations run from the north cylinder end (the dome's base
# rim), so the south flat is milled at its nominal station before fit-up.
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "M2"                 # plan.frames.M2 (author's choice; exported `setup` stays unknown)
coolant = "CRC cutting oil brushed on"  # author's choice
deburr_mm = 0.25
stock_in = "S1"

[setups.stock_state]
od_mm = 6.35
north_end_x = -1.5           # the north dome's apex, past M2 X0
south_end_x = 173.5          # supply end, uncut

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "vise-pm-6"
support = "v-blocks"         # author's choice: bar laid in a matched V-block pair, clamped in the vise
grip_on = "bar body in two V-blocks, clear of both flats"
grip_mm = "unknown"          # V-block lengths not recorded in the inventory
fixed_jaw = "against the V-blocks"
jaws_along = "bar axis"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "north dome base rim touched off with the edge finder, M2 X0"  # author's choice
clamp = "close the vise on the V-blocks by hand; check the bar cannot roll"  # author's choice
stickout_mm = "not_applicable"

[setups.zero.transfer]
from = "S1"
indicate = "pivot_bearing"
gauge = "dial-indicator"
runout_limit_mm = "unknown"  # no parallelism tolerance on the drawing; sweep the top of the bar level along X

[setups.zero.x]
feature = "north_dome"
edge_mm = 0.0
from = "-x"
method = "edge_find"         # author's choice: edge finder on the dome's base rim
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "pivot_bearing"
edge_mm = 3.175              # bar top = axis + 6.35/2
from = "+z"
method = "touch_then_set"    # author's choice: end mill touched on paper on the bar top
tool = "endmills-lms-6784"
paper_mm = 0.05              # author's choice: cigarette paper
check_jog_mm = 10.0
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "north_flat"
tool = "endmills-lms-6784"
holder = "unknown"
to_z = 2.675                 # flat plane = AF 5.850 - 6.35/2 above the axis
x_from = 1.5                 # station 4.0 - length 5.0/2
x_to = 6.5                   # station 4.0 + length 5.0/2
direction = "positive_setup_x"
note = "Plunge-free side passes across the bar; flat 5.0 long centred 4.0 from the north end."

[setups.ops.checks]
height = "micrometers/0-1in"
length = "calipers"
station = "calipers"

[[setups.ops]]
op = 20
do = "face"
feature = "south_flat"
tool = "endmills-lms-6784"
holder = "unknown"
to_z = 2.675
x_from = 152.81              # station 155.31 - 2.5
x_to = 157.81                # station 155.31 + 2.5
direction = "positive_setup_x"
note = "Same Z as op 10 without moving the knee: the two flats are in line. Station from the north end, not the uncut plain end."

[setups.ops.checks]
height = "micrometers/0-1in"
length = "calipers"
station = "calipers"

# ---------------------------------------------------------------- S3
# After fit-up scribes the shaft at the south ear's outer face; the excess is
# faced off on the lathe.
[[setups]]
id = "S3"
machine = "PM-1127VF-LB"
frame = "T3"                 # plan.frames.T3 (author's choice; physical binding unknown)
coolant = "CRC cutting oil brushed on"  # author's choice
deburr_mm = 0.25
stock_in = "S2"

[setups.stock_state]
od_mm = 6.35
plain_end_z = "unknown"      # T3: supply end past the scribe
north_end_z = "unknown"

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "none"
grip_on = "body near the plain end, north of the scribe and clear of the south flat"
grip_mm = 25.0               # author's choice: body grip from T3 Z -35 to -10
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "jaw fronts 10 mm north of actual fit-up scribe, T3 Z -10"  # author's choice; actual scribe position remains unmeasured
clamp = "tighten chuck key by hand at all three pinions; remove key; indicate after clamping"  # author's choice
jaw_protection = "prepare clean paper sleeve under smooth, deburred jaw contacts; reject marks or slip"  # author's choice
stickout_mm = "unknown"      # depends on actual scribe-to-supply-end length, not the REF length

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bearing"
gauge = "dial-indicator"
runout_limit_mm = "unknown"

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"
tool = "turning-tools-warner-lms-4132/AR"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog

[setups.zero.z]
face = "scribe"
edge_mm = 0.0
from = "+z"
method = "align_tool_point_to_scribe"  # author's choice: stationary spindle, align point to centre of actual scribe
tool = "turning-tools-warner-lms-4132/AR"
paper_mm = 0.0               # author's choice: no paper at scribe
check_jog_mm = 10.0          # author's choice: physical axial jog
retouch_after = []

[[setups.zero.tool_touches]]
tool = "turning-tools-warner-lms-4132/E"
x_method = "touch the bar just measured by micrometer; Axis Set its measured diameter"  # author's choice
gauge = "micrometers/0-1in"
z_face = "cut_face_after_op10"
edge_mm = 1.75               # author's choice: new apex plane after facing
paper_mm = 0.0               # author's choice: direct contact
method = "touch; withdraw along X without moving Z; Axis Set Z"  # author's choice
after_op = 10
before_ops = [20]

[[setups.ops]]
op = 10
do = "cut_to_fit"
feature = "south_dome"       # exported final surface at the cut-to-fit plain end
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 1.75                  # author's choice: midpoint of sourced 1.5–2.0 past-scribe band; not absolute fitted length
to_z_band = [1.5, 2.0]       # "CUT THE PLAIN END 1.5 TO 2.0 PAST THE SCRIBE"
direction = "radially_inward"  # author's choice: repeated facing, not an undeclared parting blade
note = "Face the excess off; no parting blade selected."

[[setups.ops]]
op = 15
do = "inspect"
feature = "pivot_bearing"
missing_requirements = { length = "calipers" }  # author's choice: scribe-to-face transfer, then assembly fit check

[setups.ops.inspection_methods]
length = "Measure 1.75 past the actual scribe to the cut face with calipers; after doming verify cylinder end 0.25 past scribe and trial fit over the installed ears."  # author's choice; actual span remains unknown

[[setups.ops]]
op = 20
do = "form_dome"
feature = "south_dome"
tool = "turning-tools-warner-lms-4132/E"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 1.75                # author's choice: op 10 apex face
z_to = 0.25                  # author's choice: apex 1.75 - sourced dome height 1.5
direction = "apex_to_base"   # author's choice
contour = { method = "axial_table", step_mm = 0.1 }  # author's choice; tool nose geometry still unknown

[setups.ops.checks]
height = "calipers"          # author's choice: axial outside-jaw contact at apex and base rim

[setups.ops.inspection_methods]
height = "With spindle stopped, align outside caliper jaws axially at apex and visible base rim; repeat around rim and trial fit the assembly."  # author's choice
