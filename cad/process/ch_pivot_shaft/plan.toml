title = "Mill the north flat"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2dot}} high). One 1 in parallel of the 1/8 in thick set standing on edge, centred between the jaws, 1/16 in clear of each. The shaft lying on its top edge along the jaws, gripped on its O.D.: the north tip {{process.vise_jaw_from_x0_mm:in.2dot}} in out past the left jaw side, the south tip just out past the right. Tap it down onto the parallel while closing the vise. Its top stands {{process.jaw_top_over_od_mm:in.3dot}} under the jaw tops. The north flat lies wholly left of the jaws."
datum = "Program PS01_flat (cam:ch_pivot_shaft). G54: X0 the north tip (the north dome's apex), +X along the shaft; Y0 the shaft's axis; Z0 the top of the O.D. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/flats.svg", alt = "The domed shaft lying along the vise jaws on a parallel, the north tip out at the left; the 1/8 in end mill cuts the north flat on top, left of the jaws." }
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.em_eighth_dia_mm}}"], y_span_mm = ["{{cad.stock_dia_mm}}", "{{process.em_eighth_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.stock_dia_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.flat_north_across_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_eighth_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_eighth_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.stock_dia_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.stock_dia_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_jaw_from_x0_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{process.vise_jaw_from_x0_mm}}", "{{process.vise_jaw_to_x0_mm}}"], section_mm = { diameter = "{{cad.stock_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 Y0 the shaft's axis and X0 the north tip: edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm), its tip level with the shaft's axis. Y: on the O.D. from the moving-jaw side, left of the jaws, G10 L20 P1 Y-(the miked O.D./2 + 2.540) in mm; for .2500, Y-5.715. X: on the north tip from the left, Y0, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis."
instruction_detailed = "Console M6 T1 (1/8 in end mill, at least {{process.em_eighth_projection_min_mm:in.3dot}} in out of the collet; the tool setter measures it). MDI G0 X5.000 Y0.000: over the O.D. left of the jaws, past the dome. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PS01_flat in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PS01_flat: at its M6 prompt T1 is already in, so continue; the spindle runs at 2800 in air. Watch each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run PS01_flat (M6 T1, 1/8 in end mill; set 2800): the north flat ramped in across its width, then cut {{process.flat_depth_mm:in.3dot}} deep in passes across it, {{process.flat_from_mm:in.3dot}}–{{process.flat_to_mm:in.3dot}} from the north tip."
settings = "endmill-carbide-3fl-1-8-lathe-1018"
milling_cuts = [
  { name = "flat_north", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_from_mm}}", "{{process.flat_to_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp and read the north flat across to the O.D. under it with the calipers' outside jaws, the jaw tips on the flat (a micrometer's Ø.25 anvil is wider than the flat)."
