feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis, as Op 180."
instruction_detailed = "Console M6 T1. MDI G0 X5.000 Y0.000: over the O.D. left of the jaws, past the dome. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PS01_flat in air, Z0 raised 1.000 in, as Op 190. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run PS01_flat (M6 T1, 1/8 in end mill; set 2800): the south flat, {{process.flat_from_mm:in.3dot}}–{{process.flat_to_mm:in.3dot}} from the south tip, {{process.flat_depth_mm:in.3dot}} deep."
settings = "endmill-carbide-3fl-1-8-lathe-1018"
milling_cuts = [
  { name = "flat_south", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_from_mm}}", "{{process.flat_to_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp and read the south flat across as Op 210."
inspection = "South flat across {{cad.flat_south_across_min_in:.3dot}}–{{cad.flat_south_across_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_south_across_band_mm}}" }]

[[setups.operations]]
instruction = "Across outside the band: the shaft is scrap; make another from Setup 1 (a flat is not re-cut)."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished shaft: 6.85 tip to tip, both .06 domes, the two .21 flats on one side, the O.D. as supplied." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the flats' edges with the smooth file, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the O.D. and the domes untouched."
feed = "hand"

[[setups.operations]]
instruction = "Each flat from its own tip: read with the calipers from the tip to the flat's nearer end, and the flat's length; its station is the first reading plus half the second."
inspection = "Each flat's centre {{cad.flat_north_station_min_in:.2dot}}–{{cad.flat_north_station_max_in:.2dot}} from its own tip; each {{cad.flat_north_length_min_in:.2dot}}–{{cad.flat_north_length_max_in:.2dot}} long."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_north_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.flat_north_length_band_mm}}" }]

[[setups.operations]]
instruction = "Mike the O.D. at both ends and the middle: the jaws must not have marked it."
inspection = "O.D. Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
instruction = "A flat out of station or length, or a jaw-marked O.D. under {{cad.outer_dia_min_in:.4dot}}: scrap the shaft and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the shaft with machine oil."
