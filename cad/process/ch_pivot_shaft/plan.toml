tool = "endmills-lms-6784/3-16in-2fl"
holder = "r8-collets-lms-4860/3-8in"
faces = "unknown"            # flat floor is labelled; transition end faces lack stable export labels: binding HOLD
to_z = 2.159
stock_removal_bounds = { x = [153.924, 160.020], y = [-3.175, 3.175], z = [2.159, 3.175] }
direction = "positive_setup_y"
note = "Traverse across both round sides along setup +Y, stepping X between transverse passes to produce planar axial endwalls, not an axial slot with rounded ends; stop each axis individually. Nominal removal bounds M3 X153.924 to X160.020 centre the flat at X156.972 only when overall length is162.560. Apply the measured-length calculation below before locating the south flat. Pick up boundaries using actual cutter diameter; bounds are not cutter-centre coordinates. Keep the same Z as op10 without moving the knee: flats in line, each5.588 from its own tip. Qualify actual diameter, controller grid and pickup before cutting; fixture, binding and commissioning HOLDs remain."
inspection_note = [
  "With a qualified method, record actual tip-to-tip length L={L_mm} mm. Calculate delta=L-162.560={delta_mm} mm.",
  "Calculate actual south-flat axial walls: Xnear=153.924+delta={Xnear_mm}; Xfar=160.020+delta={Xfar_mm} mm. These are workpiece boundaries, not cutter-centre settings.",
  "Measure actual cutter diameter D={D_mm} mm. First transverse cutter centre=Xnear+D/2; last transverse cutter centre=Xfar-D/2. Round the first inward toward +X and the last inward toward -X on the qualified controller grid; use overlapping intermediate passes. Do not substitute an illustrative nominal cutter diameter for the measured diameter.",
  "Inspect station from the actual south tip, axial length and AF. Keep the same Y cutting direction and unchanged Z as op10. This proposed calculation does not establish actual hardware availability, pickup qualification or native retained-stock proof."
]

