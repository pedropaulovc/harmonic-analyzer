jaw_protection = "prepare clean paper sleeve under smooth, deburred jaw contacts; reject marks or slip"  # author's choice; no listed accessory invented
stickout_mm = "unknown"     # depends on actual scribe-to-supply-end length, not the 156.67 REF

[setups.zero.transfer]
