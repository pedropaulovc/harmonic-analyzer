indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/4 in ground bar on the saw: one blank sawn a little over the faced length." }

[[setups.operations]]
instruction = "Check the bar's tag: 1/4 in 1018 precision-ground round (stock 1018-ground-round-1-4), the O.D. used as supplied. Cut from a length free of dents and rust."
inspection = "Bar tagged 1/4 in precision-ground; no dent or rust on the length cut."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the bar end and saw on the waste side of the scribe; then saw a {{process.trial_offcut_in:.2dot}} in trial offcut the same way. Deburr the sawn ends with the file."
