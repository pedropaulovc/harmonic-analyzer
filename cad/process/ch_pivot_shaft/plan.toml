# CAD reconciliation: current plain-shaft design; not the superseded shoulder/cut-to-fit route.
# PLANNED/HOLD: no physical stock, commissioning or inspection approval is asserted.
# Frozen geometry pair: harmonic-analyzer v47, source cd98207012d02b9b3653287ef8ce18735e12cdff.
# Current source is next_revision v48; the delivered v47 bytes are not relabelled.
# Hand-authored reference plan for MHA-CH-05 (pivot shaft), rev 9: a PLAIN
# Ø6.35 rod with two set-screw flats, finished to its overall length on the
# part (machinist review, fleet pass: nothing is cut to fit at assembly).
# Owner ruling 2026-10-16: the shaft is MACHINED FROM ROUGH STOCK, not used as
# drawn cold-finished shafting, so the O.D. is turned to its running band and
# carries the sheet's material-removal Ra 63 µin. Stock: AISI 1018 cold-finished
# Owner-approved starting-stock departure, 2026-11-07: allocated Ø3/8 in
# 1018 CF bar (9.525 nominal), 1.5875 radial stock over Ø6.35; the CAD drawing's
# Ø5/16 in stock note and finished geometry stay unchanged. Route: S0 lathe, face and centre-drill the north end of the
# blank; S1 lathe, chuck and tailstock dead centre with the follow rest, turn
# the O.D. to the band over the full length; S2 lathe, part the north waste
# off, face and dome the north end; S3 lathe, end for end, part the south grip
# stub off, face to the overall length and dome the south end; S4 mill, both
# flats in line on one side, each stationed from its own end's tip (the
# drawing dimensions them from there).
# Holding, stick-out, allowance and DRO recipe numbers are author's choices,
# not measurements. RPM remains unknown/derived. Station values below are the
# nominal model's (rocker_bank_layout.PIVOT_SHAFT_OVERALL_LENGTH /
# ch_pivot_shaft_spec.FLAT_TIP_STATION); refresh them whenever the layout moves.
part = "ch-pivot-shaft"
features = "../../out/features/ch_pivot_shaft/features.toml"
construction = "one_piece"   # author's route: all shaft geometry cut from the declared single bar
quantity = 1                 # harmonic-analyzer/cad/config/parts/ch-pivot-shaft.yaml:ch-pivot-shaft.quantity

[drawing]
number = "MHA-CH-05"        # parts/ch-pivot-shaft.yaml:ch-pivot-shaft.number
revision = "v49"             # authored HA next-revision plan, held pending matching native export and commissioning
# Prechips preserves the exact delivered v47 feature/STEP pair and its v47 provenance.
# This authored revision does not qualify the historical pair as a current v48 export.

[stock]
form = "round_bar"
material = "1018 cold-finish carbon steel"  # current HA allocation: OnlineMetals 4792, owner-approved 3/8 in stock
dia_mm = 9.525               # nominal allocated diameter; not measured
length_mm = 201.56           # author's choice: north waste 20 + overall 162.56 + south turn-out 1.5 + jaw clearance 2.0 + grip 15.0 + 0.5 to face
north_allowance_mm = 20.0    # author's choice: S0 centre seat and the S1 follow-rest dwell, parted off in S2
south_grip_mm = 15.0         # proposed S1 grip; qualify for the actual jaws before execution; not measured
on_hand = false              # ordered allocation, not confirmed received
# Allocation ordered 2026-11-03; receipt unconfirmed. Owner approved the larger
# starting stock on 2026-11-07; CAD's 5/16 in note and finished geometry unchanged.
prerequisite = "HOLD: receive and qualify the allocated OnlineMetals 4792 3/8 in 1018 CF bar; saw a nominal 201.56 mm blank before S0. Qualify the proposed S1 15.0 mm grip for the actual jaws. Measure diameter, length and straightness; establish grip/support, DRO installation, tooling and inspection capability before machining. Proposed settings are not measurements."
origin_mm = [0.0, 0.0, -179.536]
axis = [0.0, 0.0, 1.0]
as_is_faces = []
material_verify = true
material_cite = ["harmonic-analyzer/cad/process/shop/inventory.toml: stock OnlineMetals 4792 ordered allocation", "Owner decision 2026-11-07: use allocated 3/8 in bar, departing from CAD's 5/16 in starting-stock note"]

# The lathe has no DRO listed in the inventory. The EL400 functions below are
# the manual's; installation on the PM-1127VF-LB is unknown. The authored
# recipe requires X diametric, X+ away from the spindle axis and Z+ toward the
# exposed end in every chucking.
# EL400 §9.2.1 p62: trial cut outside, withdraw without disturbing X, measure,
# enter X; face or touch the end, withdraw without Z motion, enter Z); §6.2 p20
# Direction and Radial/Diametric; §7.4 p31 Axis Set; §8.1 p37 Preset is
# distance-to-go and never used for zero.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false          # author's choice: X diametric; a physical 10 mm X jog displays 20 mm

[dro.direction]
x = "away_from_spindle_axis" # author's choice: positive radial tool withdrawal
z = "toward_exposed_end"     # author's choice: +T0/T1 north, +T2 south; redo sign check after rechuck

# Plan-owned setup frames. The exported manifest declares only `model` and an
# unknown `setup`. Origins and axes are model coordinates. The frame choice is
# the author's; the cited source geometry is CAD's.

# S0: origin on the faced north end of the blank, the north apex plane +
# north_allowance = 1.524 + 20.0 = 21.524; +Z toward the north end.
[frames.T0]
origin = [0.0, 0.0, 21.524]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"   # set on the faced end, op 10
note = "AUTHOR'S CHOICE: faced north end of the blank, 20.0 past the north apex plane; +Z toward the north end"
cite = ["AUTHOR'S CHOICE"]

# S1 and S2: origin at the north apex plane, z = +DomeHeight = +1.524
# (exported north_dome base_z 0.0 + height_nominal 1.524).
[frames.T1]
origin = [0.0, 0.0, 1.524]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"   # Z set on the S0-faced north end at T1 Z20.0 in S1 and S2
note = "AUTHOR'S CHOICE: north apex plane; +Z toward the north end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/ch_pivot_shaft_spec.py:53-58",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py:274-286,379",
]

# S4: origin on the axis at the north apex plane (model z +1.524), +Z up =
# model +Y (the flats' outward normal), +X along the bar toward the south end
# (model -Z).
[frames.M3]
origin = [0.0, 0.0, 1.524]
x = [0.0, 0.0, -1.0]
y = [-1.0, 0.0, 0.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"   # X0 touched off the north dome's apex, Z0 on the bar's top
note = "AUTHOR'S CHOICE: north apex on the axis; +Z = flat normal; +X toward the south end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/ch_pivot_shaft_spec.py:69-104",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py:165-272",
]

# S3: origin at the south apex plane, end for end, z = DomeHeight - overall
# length = 1.524 - 162.56 = -161.036 (exported south_dome base_z -159.512 -
# height 1.524); +Z toward the south end.
[frames.T2]
origin = [0.0, 0.0, -161.036]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"   # set from the measured overall length after the trial face, op 20
note = "AUTHOR'S CHOICE: south apex plane at the printed overall length; +Z toward the south end"
cite = [
  "AUTHOR'S CHOICE",
  "harmonic-analyzer/cad/scripts/rocker_bank_layout.py (PIVOT_SHAFT_OVERALL_LENGTH)",
  "harmonic-analyzer/cad/scripts/build_ch_pivot_shaft.py (_flats OverallLength)",
]

# Plan-owned stock preparation: S0 faces the blank's north end and
# centre-drills it for S1's dead centre. Neither is a drawing surface; S2
# parts both off with the north waste.
[process_features.north_end]
kind = "end_face"
at = [0.0, 0.0, 21.524]
axis = [0.0, 0.0, -1.0]     # process axis points inward; outward face normal is setup +Z
note = "the sawn north end of the blank faced square, 20.0 past the north apex plane"
cite = ["AUTHOR'S CHOICE: a centre drill wanders on a sawn end and the dead centre needs a square seat"]

[process_features.north_end_centre]
kind = "centre_hole"
at = [0.0, 0.0, 21.524]
axis = [0.0, 0.0, -1.0]     # tailstock quill feeds into the north end along setup -Z
size = "#2 plain combined drill and countersink"
drill_dia_mm = 1.98           # Table 6 size 2: drill D 5/64 in
drill_length_mm = 1.98        # Table 6 size 2: drill length C 5/64 in, tip to the countersink, point included
mouth_dia_mm = 3.0            # AUTHOR'S CHOICE: shallow seat on nominal Ø9.525 end
countersink_angle_deg = 60.0  # Table 6: 60° countersink, the dead centre's point angle
cite = [
  "Machinery's Handbook 27th ed. p.873 Table 6 Combined Drills and Countersinks, plain type, size 2: body A 3/16 in, drill D 5/64 in, drill length C 5/64 in, overall L 1-7/8 in, 60° countersink",
  "harmonic-analyzer/cad/scripts/ch_pivot_shaft_spec.py (DRAWING_NOTES: CENTRES OK)",
]

# ---------------------------------------------------------------- S0
# T0 stations: faced north end 0, sawn end 0.5, jaw fronts -14.5; the rest of
# the blank runs back through the chuck and the spindle bore.
[[setups]]
id = "S0"
machine = "PM-1127VF-LB"
frame = "T0"                 # plan.frames.T0 (author's choice)
coolant = "CRC cutting oil brushed on"  # author's choice; listed consumable, not a cutting-data claim
deburr_mm = 0.254            # title block (inch): break edges R.010 OR CHAMFER .010 MAX (title_block.yaml:in.edge_break.radius_in, in.edge_break.chamfer_max_in) = 0.254 mm
stock_in = "stock"

[setups.stock_state]
od_mm = 9.525                # allocated nominal; not measured
north_end_z = 0.5            # sawn north end, 0.5 proud of the faced end
south_end_z = -201.06        # sawn south end, inside the spindle bore

[setups.stock_state.local_thickness]
# no holes on this part: nothing to pierce

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
stop_face = "stock_end"
pose = { origin_mm = [0.0, 0.0, -14.5], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
jaw_clock_deg = "unknown"
support = "none"             # the tailstock carries the drill chuck for op 20, not a centre
grip_on = "plain bar behind the jaw fronts, near the sawn north end"
grip_mm = 20.0               # author's choice
fixed_jaw = "not_applicable" # scroll chuck
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "sawn north end 15 mm out of the jaw fronts, checked with a steel rule before tightening"  # author's choice: short stick-out, so the end faces and centre-drills without chatter
clamp = "tighten chuck key by hand at all three pinions; remove key"  # author's choice
stickout_mm = 15.0           # author's choice: jaw fronts Z-14.5 to the sawn end Z0.5

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # EL400 §9.2.1 p62: skim the waste end, measure, enter the diameter
tool = "hss-toolbit-3-8-rh"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog, +20 on diametric display

[setups.zero.z]
face = "north end (sawn)"
edge_mm = 0.5                # author's choice: the sawn end, 0.5 proud of the faced end
from = "+z"
method = "touch the sawn end with the spindle running until the first chip shows; no paper: the end is waste, parted off in S2"  # EL400 §9.2.1 p62
tool = "hss-toolbit-3-8-rh"
paper_mm = 0.0
check_jog_mm = 10.0          # author's choice: physical axial jog
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "north_end"
tool = "hss-toolbit-3-8-rh"  # AUTHOR'S CHOICE: HSS for the allocated 1018 CF bar; establish actual starting speed
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0
to_dia = 0.0                 # face right across the centre: no pip for the centre drill
direction = "radially_inward"  # author's choice
note = "Two passes of 0.25 from the O.D. to the centre, the second to Z0. The tool point must be on centre height: a pip left at the centre makes the centre drill wander."

[[setups.ops]]
op = 20
do = "center_drill"
feature = "north_end_centre"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-tailstock-mt3"
tool_mount = "tailstock"     # authored operation location, not proof that the actual chuck/tailstock is commissioned
note = "Lock the carriage clear of the end. Feed the centre drill from the tailstock quill by hand with oil, backing out twice to clear chips, until the countersink mouth is Ø3.0: the dead-centre seat for S1."

# ---------------------------------------------------------------- S1
# T1 stations: faced north end +20.0 (centre seat), north apex 0, south apex
# -162.56, turned to -164.06, jaw fronts -166.06, south end -181.06.
[[setups]]
id = "S1"
note = "HOLD — actual stock, tooling, support engagement, clearance and retained-stock verification are not approved. The Ø6.340 process aim is within the CAD running band Ø6.32968–6.350; nominal-geometry screening does not by itself prove or disprove that route. Start each pass with follow-rest jaws backed off. Only after the tool reaches Z0, stop feed/spindle, hold the carriage at Z0 and withdraw the tool radially clear before adjusting the jaws onto the newly turned diameter. Restart only with the rest secured and hands/adjustment tools clear; re-enter without increasing pass depth. Qualify actual support/jaw positions before machining; do not continue while incoming stock or holding remains unproved."
machine = "PM-1127VF-LB"
frame = "T1"                 # plan.frames.T1 (author's choice; exported `setup` stays unknown)
coolant = "CRC cutting oil brushed on"  # author's choice
deburr_mm = 0.254
stock_in = "S0"

[setups.stock_state]
od_mm = 9.525                # allocated nominal; not measured
north_end_z = 20.0           # faced and centre-drilled in S0
south_end_z = -181.06

[setups.stock_state.local_thickness]
# no holes on this part: nothing to pierce

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
stop_face = "north_end"
pose = { origin_mm = [0.0, 0.0, -166.06], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
jaw_clock_deg = "unknown"
# PM-1127VF-LB standard accessories: the MT3 dead centre in the S0 centre, and
# the carriage-mounted follow rest riding the freshly turned diameter 8 mm
# behind the tool on the 26:1 body (between centres alone it would deflect
# away from the tool). Its jaws go on each new diameter with the tool at Z0,
# so they sit on Z+2..+14, inside the north waste S2 parts off, and the dwell
# mark never reaches the finished body.
support = "dead_centre_tailstock_mt3"
supports = [{ ref = "follow_rest", ops = [10, 20], jaw_lead_mm = 8.0, jaw_side = "turned", engage_at_z_mm = 0.0 }]  # AUTHOR'S CHOICE
grip_on = "south end of the plain bar: the proposed 15.0 mm between a rule mark and the south end; qualify for the actual jaws before execution"
grip_mm = 15.0               # proposed author's choice, not measured: jaw fronts Z-166.06 to south end Z-181.06
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "mark a line 15.0 mm from the south end and push the bar into the jaws until the mark is at the jaw fronts, so the north end stands 186.06 out"  # proposed placement; qualify actual jaw grip before execution
clamp = "with spindle stopped and centre withdrawn, securely tighten the chuck key at all three pinions and remove the key before any spindle motion. Take the prepared-end Z20 touch with the spindle still stopped, then withdraw the tool radially clear without changing Z. Only then bring up the lubricated dead centre with light quill pressure and lock the quill. Perform the X trial cut only after this support is engaged; never rotate a bar held in a merely snug chuck"  # proposed sequence; actual grip/support/clearance remain HOLD
centre_lubrication = "CRC cutting oil on the dead-centre seat; replenish between passes; back the quill off a touch if the seat squeals as the bar warms"  # author's choice
stickout_mm = 186.06         # author's choice: jaw fronts Z-166.06 to north end Z20.0, tailstock supported
centre_hole = "north_end_centre"  # made by S0 op 20
centre_hole_dia_mm = 3.0     # the S0 centre's Ø3.0 countersink mouth
support_tip_mm = [0.0, 0.0, 17.4019]  # the 60° point seated in the Ø3.0 countersink: 20 - 1.5 / tan 30° = 17.40192
quill_extension_mm = 30.0    # author's choice

[setups.zero]
procedure = "S1 proposed execution order: secure chuck and remove key; with spindle stopped and centre withdrawn, touch the prepared end for Z20; withdraw the tool clear; seat and secure the lubricated dead centre; only then perform the X trial cut. The separate X and Z recipes below are axis settings, not their execution order. Qualify the actual setup and DRO before use; existing HOLDs remain."

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # EL400 §9.2.1 p62: on the north waste, Z+14 to +20
tool = "hss-toolbit-3-8-rh"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog

[setups.zero.z]
face = "north end (faced and centre-drilled in S0)"
edge_mm = 20.0               # the faced north end = north apex plane + north allowance
from = "+z"
method = "spindle stopped, chuck securely tightened and key removed, centre still withdrawn: touch the prepared north-end annulus directly, outside the centre hole; withdraw radially without moving Z and Axis Set Z20 before inserting the centre"  # proposed stopped-spindle contact sequence; no paper
tool = "hss-toolbit-3-8-rh"
paper_mm = 0.0
check_jog_mm = 10.0          # author's choice: physical axial jog
retouch_after = []

[[setups.ops]]
op = 10
do = "rough_turn"
feature = "pivot_bearing"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 20.3                # author's choice: start 0.3 clear of the north end
z_to = -164.06               # 1.5 past the south apex, 2.0 clear of the jaws: S3 parts inside the turned length
to_dia = 6.55
rough_allowance_mm = 0.2     # on diameter: rough Ø6.55
doc_mm = 0.35                # author's maximum radial roughing depth: four full passes, then 0.0875 at nominal stock size
direction = "toward_chuck"   # author's choice: the cutting load pushes into the headstock
note = "HOLD: measure raw diameter and straightness and establish clean-up allowance and follow-rest engagement. From nominal Ø9.525, rough to diameters 8.825, 8.125, 7.425, 6.725, then 6.550: four 0.35 radial passes and one 0.0875 radial pass. Adapt the initial pass count to actual stock without exceeding 0.35 radial depth. Leave Ø6.550 for the Ø6.340 finish pass (0.105 radial). At tool Z0 on each pass, stop feed/spindle and withdraw the tool radially without changing Z before setting rest jaws on the new diameter; keep hands clear before restarting. S2 removes the dwell. Raw-stock readings are not final O.D. acceptance."

[[setups.ops]]
op = 20
do = "finish_turn"
feature = "pivot_bearing"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 20.3
z_to = -164.06
to_dia = 6.34
doc_mm = 0.105                 # Ø6.55 → Ø6.34, mid-band of Ø6.35000 +0/-0.02032 (.2500 +0/-.0008); example (plausible, not measured)
direction = "toward_chuck"
note = "One pass to the running band, the rest jaws set on the finished diameter with the tool at Z0. Spindle stopped, carriage run back: mic at both ends and the middle for taper. This pass is the drawing's Ra 63 µin running surface."

[setups.ops.checks]
dia = "micrometers/0-1in"
finish_ra = "unknown"        # no roughness comparator in the inventory

# ---------------------------------------------------------------- S2
# Part the north waste (centre seat and rest dwell) off, face and dome the
# north end.
[[setups]]
id = "S2"
machine = "PM-1127VF-LB"
frame = "T1"                 # plan.frames.T1 (author's choice; exported `setup` stays unknown)
coolant = "CRC cutting oil brushed on"  # author's choice
deburr_mm = 0.254
stock_in = "S1"

[setups.stock_state]
od_mm = 6.35                 # turned in S1, nominal
north_end_z = 20.0           # the S0 face, waste
south_end_z = -181.06        # nominal Ø9.525 grip stub inside spindle bore

[setups.stock_state.local_thickness]
# no holes on this part

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
stop_face = "north_end"
pose = { origin_mm = [0.0, 0.0, -5.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
jaw_clock_deg = "unknown"
support = "none"             # tailstock withdrawn for dome access
grip_on = "turned body, 5 mm south of the north apex plane"
grip_mm = 25.0               # author's choice: grip T1 Z -30 to -5
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "jaw fronts at T1 Z -5; north dome base Z-1.524 has 3.476 mm axial jaw clearance"  # author's choice
clamp = "tighten chuck key by hand at all three pinions; remove key; check grip before cutting"  # author's choice
jaw_protection = "prepare clean paper sleeve under smooth, deburred jaw contacts; reject marks or slip"  # author's choice; the O.D. is the finished running face
stickout_mm = 25.0           # author's choice: north end Z20.0 - jaw front Z(-5); unsupported exposure below 25.4 mm

[setups.zero]
procedure = "Before op5: touch the HSS turning tool directly on the north waste end and Axis Set Z20.000. Then independently touch the parting blade's chuck-side corner on that same end through the proposed 0.050 mm paper and set Z20.050. After op5, before op10/20: refit the HSS tool and retouch the newly parted end directly at Z1.000. These are successive tool-specific settings on one datum, not alternative zeros. Retouch each tool's X using its own recipe; do not borrow the previous tool's X setting. Qualify the paper and touches before use; remove paper before cutting. Existing HOLDs remain."

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # EL400 §9.2.1 p62: on the north waste
tool = "hss-toolbit-3-8-rh"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog

[setups.zero.z]
face = "north end (S0 face)"
edge_mm = 20.0
from = "+z"
method = "touch with the spindle running until the first chip shows; no paper: the end is waste"  # EL400 §9.2.1 p62
tool = "hss-toolbit-3-8-rh"
paper_mm = 0.0
check_jog_mm = 10.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "parting-blade-lms-1728"
x_method = "spindle stopped: touch the blade tip on the waste between Z14 and Z20 through cigarette paper (0.05)"  # proposed contact recipe; Axis Set comes only from structured paper compensation
x_face = "pivot_bearing"     # same diameter turned through the north waste in S1; not a raw-bar diameter
x_paper_mm = 0.05            # proposed radial paper allowance; verify actual paper before execution
corner = "chuck_side"        # this corner forms the retained +Z-facing end at the parting target
gauge = "micrometers/0-1in"
z_face = "north_end"
edge_mm = 20.0
paper_mm = 0.05              # author's choice: cigarette paper
method = "spindle stopped; chuck-side corner to the end through the paper; withdraw along X without moving Z"  # author's choice
before_ops = [5]

[[setups.zero.tool_touches]]
tool = "hss-toolbit-3-8-rh"
x_method = "touch the turned body just measured by micrometer; Axis Set its measured diameter"  # author's choice
x_face = "pivot_bearing"
x_paper_mm = 0.0             # direct touch on turned waste before facing it away
gauge = "micrometers/0-1in"
z_face = "north parted end"
edge_mm = 1.0
paper_mm = 0.0               # author's choice: direct contact, no paper
method = "touch; withdraw along X without moving Z; Axis Set Z"  # author's choice
after_op = 5
before_ops = [10, 20]

[[setups.ops]]
op = 5
do = "part_off"
feature = "north_dome"
keep = "pivot_bearing"       # chuck-side shaft stays held; only north centre/rest waste is discarded
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
to_dia = 0.0
doc_mm = 3.175               # maximum nominal radial plunge from Ø6.350 to the axis; actual entry diameter must be measured
to_z = 1.0                   # author's choice: chuck-side blade corner 1.0 past the apex plane; op 10 faces the pip and the 1.0 off
direction = "plunge_radial"  # author's choice
