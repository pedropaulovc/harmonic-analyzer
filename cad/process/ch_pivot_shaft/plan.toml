[[setups.operations]]
instruction = "Console M6 T1 (the 1/8 in end mill). Spindle stopped: jog it by eye over the middle of the datum-end flat (between the jaws, at the right), G54 Y−1.200 (Y0 unchanged from Op 310: same fixed jaw, same O.D.; the cutter's edge then stands .015 in clear of each jaw face), and lower it until it just drags a .002 feeler leaf on the flat. Note the DRO Z. Do the same at Y1.200."
inspection = "The two Z readings within 0.025 mm (.001 in) of each other: the flat level across within .74° (the end mill's two touches land 1.94 mm apart on the .21-across flat), inside the title block's ±1° angle."
gauge_checks = "other"

[[setups.operations]]
instruction = "Readings further apart: raise the bit, roll the shaft a touch about its axis in the snug jaws to lower the high side, and repeat Op 370."

[[setups.operations]]
instruction = "Tighten the vise, tap the shaft down onto the parallel, and repeat Op 370's two readings: still within 0.025 mm, else back to Op 380."

[[setups.operations]]
instruction = "G54 Y0 the shaft's axis and X0 the far-end tip: edge finder (900 rpm), as Op 310."
instruction_detailed = "Edge finder (900 rpm), its tip level with the shaft's axis. Y: on the O.D. from the moving-jaw side, left of the jaws, G10 L20 P1 Y-{{process.y0_edge_find_mm:.3f}} (the supplied Ø{{process.stock_dia_in:.4dot}} ground rod's radius plus the .200 edge finder's; the rod is not miked, it is used as bought). X: on the far-end tip from the left, Y0, G10 L20 P1 X-{{process.edge_finder_radius_mm:.3f}}."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis, as Op 320."
instruction_detailed = "Console M6 T1. MDI G0 X5.000 Y0.000: over the O.D. left of the jaws, past the dome. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PS01_flat in air, Z0 raised 1.000 in, as Op 330. Then Z0 back."
feed = "hand"

