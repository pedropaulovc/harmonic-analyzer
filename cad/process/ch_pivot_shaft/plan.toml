[setups.zero]
procedure = "Before holding, measure M from the north apex to the south stub end with a qualified method. Before op5: touch the HSS turning tool directly on the stub end and Axis Set Z=M-162.560. Independently touch the parting blade's chuck-side corner on that same end through the proposed 0.050 mm paper and set Z=M-162.510. The nominal Z18.500 is not a substitute for measured M. After op5, before op10/20: refit the HSS tool and retouch the newly parted end directly at Z1.000. Retouch each tool's X using its own recipe; these tool changes retain the common datum. Qualify the paper and touches before use; remove paper before cutting. Existing HOLDs remain."

[setups.zero.transfer]
from = "S2"
indicate = "pivot_bearing"
gauge = "dial-indicator"
runout_limit_mm = "unknown"

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"  # on nominal Ø9.525 stub, removed in op 5
tool = "hss-toolbit-3-8-rh"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0          # author's choice: physical radial jog

[setups.zero.z]
face = "south stub end"
edge_mm = 18.5               # nominal M181.06 - overall162.56; Axis Set uses the measured length
from = "+z"
method = "measure_then_set"
measure = "north apex to south stub end, measured before holding"
offset_mm = -162.56
measure_before_hold = true
gauge = "height-gauge"       # 12 in range; stand square stub on plate, measure north apex before holding
tool = "hss-toolbit-3-8-rh"
