indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 6, reversed end for end: the far-end tip {{process.vise_jaw_from_x0_mm:in.2dot}} in out past the left jaw side, the datum-end flat up: the datum-end tip then stands about .05 in past the jaws' right side (6.85 less .55 less the 6.25 jaws), so that flat (.10–.34 from its tip) lies between the jaws at their right end. Close the vise snug, not tight, until Op 390."
datum = "Program PS01_flat again. G54: X0 the far-end tip (the far-end dome's apex), +X along the shaft; Y0 the shaft's axis; Z0 the top of the O.D. The datum-end flat set level first (Ops 370–390), so the far-end flat is cut in line with it."
diagram = { file = "diagrams/flats-south.svg", alt = "The shaft reversed end for end, the far-end tip out at the left, the datum-end flat up between the jaws at the right; the end mill cuts the far-end flat, left of the jaws." }
