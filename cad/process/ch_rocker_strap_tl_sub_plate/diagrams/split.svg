<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="16">SP01, plan (back of the table at the top): split the plate off, mill both its long edges</text>
  <rect class="fixture-table" x="0" y="24" width="760" height="380"/>
  <!-- The bar: remainder at the back, the slot, the plate at the front. -->
  <rect class="part-rest" x="40" y="50" width="660" height="124.46"/>
  <rect class="part-removed" x="40" y="174.46" width="660" height="25.91"/>
  <rect class="part-kept" x="40" y="200.37" width="660" height="152.4"/>
  <rect class="part-removed" x="40" y="352.77" width="660" height="2.03"/>
  <rect class="part-arriving" x="40" y="50" width="660" height="304.8"/>
  <!-- 1-2-3 blocks under each piece, 1 in in from the ends. -->
  <rect class="fixture-support" x="90.8" y="225.77" width="152.4" height="101.6"/>
  <rect class="fixture-support" x="497.2" y="225.77" width="152.4" height="101.6"/>
  <rect class="fixture-support" x="90.8" y="50" width="152.4" height="101.6"/>
  <rect class="fixture-support" x="497.2" y="50" width="152.4" height="101.6"/>
  <!-- Step clamps along X from studs beyond the ends, over the blocks' middles. -->
  <rect class="clamp" x="0" y="260.7" width="179" height="31.75"/>
  <rect class="clamp" x="561.4" y="260.7" width="198.6" height="31.75"/>
  <rect class="clamp" x="0" y="84.93" width="179" height="31.75"/>
  <rect class="clamp" x="561.4" y="84.93" width="198.6" height="31.75"/>
  <!-- The 1/2 in end mill at the front edge's start; its passes. -->
  <circle class="cutter" cx="22.2" cy="365.5" r="12.7"/>
  <line class="arrow" x1="44" y1="384" x2="690" y2="384"/>
  <line class="arrow" x1="690" y1="187.4" x2="80" y2="187.4"/>
  <line class="arrow" x1="80" y1="187.4" x2="690" y2="187.4"/>
  <!-- Y0: 2.540 in behind the as-received front edge (Setup 3's fence face). -->
  <line class="datum" x1="65.4" y1="215.77" x2="65.4" y2="235.77"/>
  <line class="datum" x1="55" y1="225.77" x2="76" y2="225.77"/>
  <text class="datum-label" x="44" y="249">X0 Y0</text>
  <text class="label" x="250" y="400">cutter path, front edge: .030 rough + .010 finish, cutter moving +X</text>
  <text class="label-halo" x="200" y="182">cutter path: slot .50 through, levels alternate; then the back edge .010, −X</text>
  <text class="label-halo" x="300" y="280">plate, 3.00 wide</text>
  <text class="label-halo" x="300" y="116">bar remainder</text>
  <text class="label" x="44" y="432">LEFT end: X0 is .500 in in from it. Blocks under each piece; no step clamp over an edge the cutter runs along.</text>
</svg>
