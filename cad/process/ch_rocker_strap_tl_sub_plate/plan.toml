tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, T2: the {{cad.pocket_count:d}} clamp pockets at X {{cad.pocket_stations_in}}, {{cad.pocket_length_in:.2dot}} × {{cad.pocket_width_mm:in.3dot}} × {{cad.pocket_depth_in:.3dot}} deep, their far walls at Y −{{cad.pocket_back_wall_in:.3f}}. Each pocket level, and each level of the right notch at its closed end, starts with a straight plunge, 4.6 in/min."
rpm = 2800
feed = "4.6 in/min plunge"
milling_cuts = [
  { name = "pocket plunges", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", flutes = 3, feed_per_tooth_mm = "{{process.eighth_plunge_chip_mm}}", stations_mm = "{{cad.pocket_beam_x_mm}}" },
  { name = "hub tap spot", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", flutes = 3, feed_per_tooth_mm = "{{process.eighth_plunge_chip_mm}}", stations_mm = "{{cad.hub_beam_x_mm}}" },
  { name = "notch plunge", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", flutes = 3, feed_per_tooth_mm = "{{process.eighth_plunge_chip_mm}}", stations_mm = 295.72 },
]

