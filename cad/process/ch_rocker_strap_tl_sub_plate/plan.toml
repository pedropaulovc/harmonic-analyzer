# The holes are tapped in this clamping (their XY are the drills'), one file
# per hole; the tool setter measures the dead centre at each file's M6, so no
# program assumes its length.
[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Before SP03_tap_clamp_1, stop check: measure the dead centre from its tip to the collet's face, and each tap in the T-handle wrench from its point to the wrench's centre hole (calipers or rule). The centre's reach plus each tap's must be at most {{process.tap_stack_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, the plate up to the pocket floors, the collet, and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup. Then load and run SP03_tap_clamp_1, _2, _3, _4, one file per hole. Each: M6 T6 (the dead centre in its collet, spindle stays off), Z to the top, over its hole, end. The 4-40 tap in the T-handle wrench in the hole, tap fluid; jog Z down until the dead centre's point sits in the wrench's centre hole, light pressure only: the point guides, it does not push. Turn the wrench, backing off to clear chips, jogging Z down to keep the point seated, until the tap is through. Back the tap out; jog Z up clear of the wrench before loading the next file."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-1-4-20"
drilling = "none"
sizing = "other"
instruction = "Load and run SP03_tap_hub: the same, the 1/4-20 tap in the hub hole from the counterbore floor. Jog Z up clear of the wrench at the end."
feed = "hand"

