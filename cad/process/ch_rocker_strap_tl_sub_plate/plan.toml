# The holes are tapped in this clamping (their XY are the drills'), one file
# per hole; the tool setter measures the tap guide at each file's M6, so no
# program assumes its length.
[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Stop check before SP03_tap_clamp_1: measure each tap in the T-handle wrench from its point to the wrench's centre hole (calipers or rule). Each must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in. Over: stop; do not tap on this setup."
instruction_detailed = "Stop check before SP03_tap_clamp_1: measure the 4-40 and the #10-32 tap, each in the T-handle wrench, from its point to the wrench's centre hole (calipers or rule). Each must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in: the mill's 17 in opening less the vise, the parallels, the plate up to the pocket floors, the collet, the tap guide's 3 1/8 in, and 1 in to bring the point down onto the wrench. Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Load and run SP03_tap_clamp_1, then _2, _3, _4, one file per hole, the steps below on each: each file loads T6 (M6; the tap guide in the 1/2 in collet, pointed end out, spindle stays off; the tool setter measures it), goes to Z top over its hole and ends Idle."
feed = "hand"

[[setups.operations]]
instruction = "4-40 tap in the T-handle wrench in the hole, tap fluid; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home."
diagram = { file = "diagrams/top-tap-clamp.svg", alt = "Section across the jaws at clamp hole 2, inside the jaws: the 4-40 tap, to scale across, in the T-handle wrench in the hole, the tap guide's 1/2 in shank in the collet, its spring point in the wrench's centre hole, all in the tool colour. SP03_tap_clamp_1 taps hole 1 first, at X 25.400 in the overhang past the left jaw." }
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, backing off to clear chips, until the tap is through: the spring keeps the point in the wrench and the tap square as it feeds, up to 1/2 in; should the point run out, jog Z down to push it home again. Back the tap out; jog Z up clear of the wrench before loading the next file."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-10-32"
drilling = "none"
sizing = "other"
instruction = "Load and run SP03_tap_hub: the same, the #10-32 tap in the hub hole from the counterbore floor, under the tap guide, its point pushed fully home in the wrench. Jog Z up clear of the wrench at the end."
diagram = { file = "diagrams/top-tap-hub.svg", alt = "Section across the jaws at the hub hole: the #10-32 tap, to scale across, in the T-handle wrench from the counterbore floor, under the tap guide, its spring point in the wrench's centre hole, all in the tool colour." }
feed = "hand"

[[setups.operations]]
instruction = "Before unclamping: pick up X0 and Y0 again on the cut stop and fence faces (edge finder): the drawing dimensions the walls and hub from them."
instruction_detailed = "Before unclamping. Spindle off: tap guide out, the edge finder in the collet; MDI M3, set 900 rpm by hand. Finder on the cut fence face from the front: G10 L20 P1 Y-2.540; on the cut stop face from the right: G10 L20 P1 X2.540 (its .100 radius). The drawing dimensions the walls and hub from these faces."
feed = "hand"

[[setups.operations]]
instruction = "The pockets' far walls (edge finder), against this setup's Inspection."
instruction_detailed = "Send G20 so the DRO reads inches. The finder into each pocket and onto its far wall (the one farthest from the fence): DRO Y less the finder's .100 radius is the wall. Band: this setup's Inspection."
feed = "hand"

[[setups.operations]]
instruction = "Before unclamping: the counterbore's centre (DTI), against this setup's Inspection; then G21."
instruction_detailed = "M5, spindle stopped: edge finder out, DTI in. Sweep it round the counterbore, turning the spindle by hand, and jog until it reads even: DRO X and Y are its centre. Band: this setup's Inspection. Send G21."
feed = "hand"

