<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the bench vise from the front, to scale at 200 px/in: the Ø.040 brass wire (cad.ring_dia_in, 8 px). The bench vise's soft jaws are schematic (their size is not on record), seen from the front. The smooth file is schematic (its width and thickness are not on record). The 6 in length clamped 1.50 out (process.blank_length_in); the piece above the jaws is kept, the rest of the length below runs on to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="470"/>
  <text class="title" x="20" y="22">Setup 1, Op 10: the wire 1.50 out of the soft jaws, filed through flush with their top (to scale, 200 px/in)</text>
  <rect class="clamp" x="256" y="390" width="120" height="65"/>
  <rect class="clamp" x="384" y="390" width="120" height="65"/>
  <text class="label-on-clamp" x="266" y="412">soft jaw</text>
  <text class="label-on-clamp" x="394" y="412">soft jaw</text>
  <path class="part-rest" d="M376 462L376 390L384 390L384 462L380 459Z"/>
  <rect class="part-kept" x="376" y="90" width="8" height="300"/>
  <rect class="cutter" x="384" y="381" width="296" height="9"/>
  <line class="arrow" x1="540" y1="366" x2="440" y2="366"/>
  <line class="datum" x1="180" y1="390" x2="373" y2="390"/>
  <text class="datum-label" x="368" y="384" text-anchor="end">jaws' top: filed through flush with it</text>
  <text class="label" x="400" y="110">the {{process.blank_length_in:.2dot}} piece standing above the jaws</text>
  <line class="leader" x1="398" y1="106" x2="384" y2="120"/>
  <circle class="leader-dot" cx="384" cy="120" r="2"/>
  <text class="label" x="500" y="350">smooth file flat on the jaws, stroking across</text>
</svg>
