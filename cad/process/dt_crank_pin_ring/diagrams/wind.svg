<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the bench vise from the front, to scale at 200 px/in: the 27/64 drill (shop drill-27-64, Ø10.716 mm, 84.4 px) gripped by its flutes, its plain shank standing up to a break line (its length out of the jaws is not on record); the Ø.040 wire (8 px) wound once round the shank, square to it, its two filed ends meeting at the front. The bench vise's soft jaws are schematic (their size is not on record), seen from the front. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 2, Op 60: the wire wound one turn on the 27/64 drill's shank, flutes in the jaws (to scale, 200 px/in)</text>
  <rect class="clamp" x="217.81" y="280" width="120" height="70"/>
  <rect class="clamp" x="422.19" y="280" width="120" height="70"/>
  <text class="label-on-clamp" x="227.81" y="302">soft jaw</text>
  <text class="label-on-clamp" x="432.19" y="302">soft jaw</text>
  <path class="cutter" d="M337.81 356L337.81 70L344.84 67L351.88 70L358.91 67L365.94 70L372.97 67L380 70L387.03 67L394.06 70L401.09 67L408.12 70L415.16 67L422.19 70L422.19 356Z"/>
  <rect class="part-kept" x="329.81" y="170" width="100.38" height="8"/>
  <line class="leader" x1="380" y1="170" x2="380" y2="178"/>
  <text class="label" x="462.19" y="140">one turn, square to the shank (not a helix);</text>
  <text class="label" x="462.19" y="156">the two filed ends meet here</text>
  <text class="label" x="462.19" y="172">(the wire's length sets the size: the</text>
  <text class="label" x="462.19" y="188">ring stands slightly loose when closed)</text>
  <line class="leader" x1="460.19" y1="144" x2="382" y2="174"/>
  <circle class="leader-dot" cx="382" cy="174" r="2"/>
  <text class="label" x="550.19" y="260">27/64 drill: flutes in</text>
  <text class="label" x="550.19" y="276">the jaws, shank up</text>
  <line class="leader" x1="548.19" y1="256" x2="416.19" y2="240"/>
  <circle class="leader-dot" cx="416.19" cy="240" r="2"/>
</svg>
