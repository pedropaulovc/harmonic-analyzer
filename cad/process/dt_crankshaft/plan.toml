# Crankshaft MHA-DT-11, one off, from 1 in round 1018 CF. Route (owner ruling
# 2026-11-21: turned setups are manual lathe work with a traveler and no NC;
# milled features run from a program on the PM-30MV; owner ruling 2026-11-22,
# option C2: the two drive-pin holes on the lathe, the cutters in the
# headstock, the shaft in a shop-made jig on the cross slide; sketch
# sketches/turnmill-a-crankshaft-lathe-jig.png):
# - Setup 1, saw: a 6.50 in blank and a 4.00 in proof-slug blank.
# - Setup 2, lathe, 3-jaw: face the far end (F) and centre-drill it (the
#   drawing: LATHE CENTRE OK AT THIS END).
# - Setup 3, lathe, 3-jaw on 1.00 in of extra stock, the dead centre in F:
#   every diameter and face from F (Z0), then part off past the dome.
# - Setup 4, lathe, 3-jaw on the stub (brass shim): face to length, step the
#   SR.26 dome from a DRO table and file it (no centre hole in the dome).
# - Setup 5, lathe, 3-jaw: the proof slug, the crankshaft's stub, seat face,
#   spigot and one journal in one chucking.
# - Setup 6, lathe, 3-jaw on the slug's journal (brass shim): face the slug's
#   parted stub end, the end every cutter touches off on in Setup 7.
# - Setup 7, lathe: the jig on the tool post bored in place, then the drive-
#   pin holes: first in the slug (measured; the DRO targets corrected), then
#   in the shaft. The jig stays on the tool post throughout.
# - Setup 8, mill, vise: the #9 cross hole through the stub, the pin line
#   clocked level from the drive-pin holes (PK01_cross_hole).
# - Setup 9, bench: deburr, punch mark, check, oil.
#
# At assembly, not here: the Ø.125 match-ream through MHA-DT-10 and the seat,
# and the 1:48 taper-ream of the cross hole with MHA-DT-31 (the drawing's
# notes).
#
# Drive-pin offsets .2756 ±.0009 (±22.9 um) from the stub's axis: the C2
# budget holds them only with each assumed term checked or proven on the
# slug: the DTI's X0 sweep (front and back within .010 mm, inside the shop's
# indicator row), the jig bore's clearance (telescoping gauge), the DRO moves
# approached one way with the gib locked and re-read (procedure), the DRO's
# scale accuracy and the drills' walk (proven on the slug; the scale's
# accuracy is not recorded: gauges.lathe-x-dro), the shaft not moving while
# cut (the stub swept again before unclamping); heat is assumed negligible.
# The slug's and the shaft's offsets are read with the .0930 plus pin (a
# measuring rod here, not a gauge of the hole) in the hole and the
# micrometer over pin and stub; that reading is good to about ±.0003 (±8 um:
# the hole's size taken at mid band, ±.000125, the micrometer and the stub's
# half). The slug's targets are corrected only for an error the reading
# resolves (over .0003), and the slug passes inside the drawing's band less
# that uncertainty (±.0006); the shaft is accepted to the drawing's band and
# never re-cut.
#
# Note 3, the matched fits: the crankshaft is made last, and each fit
# diameter prints as a REF turned to its mate's bore less .0010-.0023 (fit
# audit 2026-11-23, MHA-DT-31.bore__MHA-DT-11.hub_shaft, MHA-DT-11.journals,
# MHA-DT-10.bore__MHA-DT-11.pinion_seat). The mates' bores print no band and
# no pin gauges them; MHA-DT-10's is cut with the owned adjustable reamer
# set (tools reamers-adjustable-lms-5948), whose size scatters, and
# MHA-DT-31's is the 3/8 drill's at DRILLED HOLES (.375-.379; D27, delegated
# ruling 2026-11-25 (Main), precedent: the fit-necessity rule of the
# owner-approved fit policy (owner ruling 2026-11-24); owner review #2144),
# which is not round: so no bore is taken at its
# tool's size, and the stub is turned to the hub bore's smaller reading of
# two orientations 90° apart. Setup 3 measures all three with the telescoping
# gauge on the micrometer before any finishing pass (B31, B05, B10), turns
# each diameter to its written bore less .0010-.0023 on the micrometer while
# the shaft is still between the chuck and the centre, and tries the 16T and
# the post on their diameters from F. The hub cannot pass the journals, so
# the stub is accepted on B31 alone. Owner ruling 2026-11-23, tool audit Q11:
# "Both bores dia .4385 +.0005/0 (7/16 over reamer of the Shars set), both
# journals .4375 0/-.0008" (the journals now print as REF under note 3).
#
# The drive-pin holes are the .0930 reamer's, no band (fit audit 2026-11-23,
# MHA-DT-11.drive_pin_holes): MHA-DT-VN-67 pressing in at MHA-DT-00 step 4 is
# their acceptance, so no NO-GO is used; the .0930 plus pin stays as the
# reading rod for the offsets, the depth and the pins' line (owner ruling
# 2026-11-23, tool audit Q1: "the traveler mikes each pin"; its .0935 minus
# partner, zz-pins-0930-0935, still serves MHA-PD-22).
#
# To order before Setup 7: the drill chuck on its straight arbor
# (holders.drill-chuck-jt33-straight-1-2), the 1/8 carbide spot drill
# (tools.spot-drill-carbide-1-8), the #54 taper-length drill
# (tools.drill-54-taper-length), the .0930 and .4385 reamers
# (tools.reamer-0930, tools.reamer-4385), the .0930 plus pin
# (zz-pins-0930-0935); to make: the jig (fixtures.dt-crankshaft-drive-pin-jig).
#
# NC (cam:dt_crankshaft, cad/process/dt_crankshaft/cam.py): PK01_cross_hole.
# The program name, the [parameters] and the milling_cuts names are a
# contract with that recipe. Tool numbers are the places in the tools list
# among the mill's tools: T1 the #2 centre drill, T2 the #9 drill.
title = "Crankshaft"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1 in round (drawing: {{cad.material_spec}})"
stock = "Qty {{process.quantity:g}}. {{process.bar_dia_in:fraction}} in round bar on hand: one blank {{process.blank_length_in:.2f}} in long and one {{process.slug_blank_in:.2f}} in proof-slug blank."
shop = "../shop"
stock_refs = ["1018-round-1"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

standing = true

[[notes]]
title = "This job"
rows = [
  ["DRO", "Lathe cross-slide DRO in inch diameter mode for Setups 2–6 (Setup 7 switches it to mm radius)."],
  ["Inside corners", "Inside corners R.010 max: finish each shoulder's corner with the sharp-nose tool."],
  ["Not made here", "Not made here (drawing notes, at assembly): the Ø.125 pin hole match-reamed through MHA-DT-10 and the pinion seat, and the cross hole's 1:48 taper ream with MHA-DT-31; nothing is drilled for either on this traveler."],
]

[cad]
file = "../../out/features/dt_crankshaft/features.toml"
adapter = "drilled_block"
part = "dt-crankshaft"

[parameters]
quantity = 1
bar_dia_in = 1.0
bar_dia_mm = 25.4
# The 5.13 in shaft (F to the dome's apex), .02 faced off F, .07 left past
# the apex for facing the parted end, the P1 blade's kerf, .20 clear of the
# jaws and 1.00 in gripped (Setup 3), rounded up.
blank_length_in = 6.5
blank_length_mm = 165.1
# The blank the shaft is cut from (stock_fit: envelope X, Y, Z; Y the axis).
blank_x_in = 1.0
blank_y_in = 6.5
blank_z_in = 1.0
# The proof slug's blank: 1.00 gripped, the slug's 2.62 and the blade's kerf
# out of the jaws, .20 clear.
slug_blank_in = 4.0
face_allowance_in = 0.02
# Setup 2: F 1.00 in out of the jaw fronts.
end_stickout_mm = 25.4
# Setup 3: the blank gripped on 1.00 in, F out at 6.50 − .02 − 1.00 = 5.48.
turn_stickout_mm = 139.192
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander.
part_kerf_in = 0.075
# Setup 3 parts off with the blade's tailstock-side face 5.20 from F: the
# 5.13 apex plus .07 to face in Setup 4. The stub is turned on past the kerf
# (5.20 + .075) to 5.35, so the blade parts through Ø.375, .13 clear of the
# jaws at 5.48.
part_z_in = 5.2
stub_end_z_in = 5.35
# Roughing: the whole length to Ø.720 in cuts of .040 per side, then the
# journals' run (F to the collar's rear face) to Ø.480 and the stub's to
# Ø.400, each .030 over its finish for the finishing passes.
rough_doc_in = 0.04
rough_dia_in = 0.72
journal_rough_in = 0.48
stub_rough_in = 0.4
relief_aim_in = 0.41
neck_aim_in = 0.375
# Setup 4: the 3-jaw over a brass shim wrap on the stub itself, the parted
# end .30 in out of the jaw fronts (.07 to face off plus the .08 dome and
# .15 of stub), the collar and the rest of the shaft back in the chuck.
dome_stickout_mm = 7.62
# The SR.26 dome on the Ø.375 stub (the export's nominal .2597): its height
# .2597 − √(.2597² − .1875²) = .0800 (.07–.09 printed). Faced to length F to
# the apex aiming 5.132 (the rim at 5.052, the middle of 5.044–5.060, plus
# .080), accepted in process 5.124–5.140 on the height gauge (the rim's band
# plus .080); the rim itself is checked after the dome.
overall_in = 5.132
overall_min_in = 5.124
overall_max_in = 5.14
overall_min_mm = 130.1496
overall_max_mm = 130.556
dome_height_in = 0.08
# Setup 5: the slug 2.90 in out of the jaw fronts, its faced end centre-
# drilled and on the dead centre; from that end the journal to Z-1.60 (under
# the jig's set screw), the spigot to Z-1.872 (.272 thick, as the shaft's),
# the stub on to the part-off at Z-2.622 (.75 long), turned to Z-2.75 so the
# blade parts through Ø.375, .15 clear of the jaws.
slug_stickout_mm = 73.66
slug_rear_z_in = 1.6
slug_seat_z_in = 1.872
slug_stub_end_z_in = 2.75
slug_part_z_in = 2.622
# Setup 6: the slug's journal in the 3-jaw over brass shim, the stub (.75)
# and the spigot (.272) out, the journal's last .08 too: 1.10 in out.
slug_face_stickout_mm = 27.94
# Setup 7 (owner ruling 2026-11-22, option C2): the jig bored in place, the
# .4385 reamer (owner ruling 2026-11-23, tool audit Q11: the journals' own
# reamer) 2.95 deep (past the inboard neck at 2.89 from the jig face with
# the 1/8 spacer in), breaking into the 3/8 clearance the jig was made with
# from its back end for the pinion seat (fixtures.dt-crankshaft-drive-pin-jig).
# The 27/64 drill (.4219) leaves the reamer .0166 nominal, a hair over the
# fleet's .016 (ream_stock_max_mm); a 27/64 cuts a little oversize, so the
# real stock is inside it. A 7/16 drill cuts about the reamer's own size and
# would leave it nothing to cut.
jig_ream_depth_in = 2.95
# The jig bore over the journals: at most .0025 diametral (the budget's
# ±1.6 um vertical term), read with the telescoping gauge and micrometer;
# the reamed .4385-.4390 bore on the .4367-.4375 journals gives .0010-.0023.
jig_clearance_max_in = 0.0025
# The cross-slide DRO targets for the two holes, ±7.000 mm from the stub's
# axis (the drawing's .2756), each move ending in −X with the gib locked.
pin_x_mm = 7.0
# Each cutter's stickout from the drill chuck: the stub and dome stand 1.21
# proud of the spigot face, 7.0 − 4.76 = 2.24 mm off the cutter's axis, so
# the chuck's nose must stay .10 clear of the dome's apex with the cutter's
# tip at its deepest: 1.21 + that depth + .10. The spot 1.35 (2.00 long), the
# #43 1.51 (its point at .202), the .0930 reamer 1.48 (its end at about .17),
# the #54 1.63 (its tip at .32; 3.00 long).
spot_stickout_in = 1.35
drill_43_stickout_in = 1.51
ream_stickout_in = 1.48
knockout_stickout_in = 1.63
# Depths from the seat face (carriage DRO, each cutter touched on it): the
# spot to Ø.070 (.035 deep, 90°); the #43 to full diameter .175 (its point
# .027 more); the .0930 reamer's full diameter to the .1555 printed; the #54
# from the hole's floor through the .272 spigot into the gap behind it, its
# tip to .32.
spot_depth_in = 0.035
drill_43_depth_in = 0.175
drill_43_tip_in = 0.202
knockout_tip_in = 0.32
# The .0930 reamer's chamfer length is not measurable with the shop's
# gauges: the slug is reamed with the tip .010 past the .1555 full-diameter
# depth, its full-diameter depth read with the .0930 plus pin, and the difference
# (the chamfer allowance c) written and used for the shaft.
ream_tip_in = 0.1655
# The DTI's X0 sweep: its front and back readings agree within .010 mm
# (.0004 in, inside the shop's ±.0005 indicator row), at the seat face and
# 20 mm out; the slug proves out what is left.
dti_x0_mm = 0.01
# The slug's offset reading is good to ±.0003 (the header): an error within it
# is not corrected; a larger one moves that side's target. The slug passes
# within ±.0006 of .2756 (the drawing's ±.0009 less the reading's ±.0003);
# outside the drawing's band the job stops for a check of the jig and slide.
pin_uncertainty_in = 0.0003
pin_guard_in = 0.0006
# The .0930 plus pin and the hole's mid size, for the offset from the
# micrometer reading over pin and stub: offset = reading − stub/2 + .09325/2
# − .0930 (the pin pushed onto the hole's inner wall by the anvil).
pin_go_in = 0.093
# Setup 8 (mill, shop workholding.vise-pm-6, fixtures.parallels-lms-6745,
# 1/8 in thick, 4 in long): one 1 in parallel on edge under the journals, its
# left end flush with the jaws' left face (its right end .45 right of F); the
# shaft along the jaws on it, F to the right, the jaws' left face 3.55 from F
# (on the outboard journal), the collar, the stub and the dome out past it.
# The spacer: the pair's other 1 in parallel on edge against the moving jaw,
# beside the first (its inner face .099 off the axis, clear of the first's
# .0625), its right end 2.75 right of F (the jaws' right face at 6.247 −
# 3.55 = 2.697); on it the proof slug, journal toward F, the journal's end
# 1.20 right of F: the journal (1.60) runs to 2.80, so the spigot (Ø.687)
# hangs past the parallel's end and the jaws; the slug's centre of mass
# (about 2.49) lies over the parallel. The slug sits on the parallel's
# corner, .023 lower than the shaft: only its diameter sets the jaw. The
# shaft clears that parallel by the same .023. The 1.20 gap leaves the Ø.200
# edge finder room to touch F (tip .2 right of F).
slug_gap_in = 1.2
spacer_parallel_end_in = 2.75
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_length_mm = 101.6
jaw_left_from_f_mm = 90.17
# From the dome's apex (the beam's start): the jaws' left face, the cross
# hole's station and the shaft's length.
left_overhang_mm = 40.386
cross_station_mm = 15.494
part_length_mm = 130.556
# G54 X0 is F, +X toward the jaws' right end: the cross hole at X-115.062.
cross_x_mm = -115.062
# Z0 the stub's top; the jaw tops stand above it by the jaw height less the
# parallel, the journal's radius and the stub's; cam.py checks it.
jaw_top_over_stub_mm = 9.2266
# Spot Ø.160 with the #2 centre drill (under the #9); the #9 through the
# Ø.375 stub, its full diameter 1.0 mm past the underside; its tip −(9.525 +
# 1.0 + its 118° point 1.496).
cross_spot_dia_mm = 4.064
drill_past_mm = 1.0
cross_drill_tip_mm = -12.021
cross_projection_min_mm = 27.0
# Speeds and feeds: LittleMachineShop "Cutting Speeds", Drilling & Reaming,
# Plain carbon steels 1006-1026 (read 2026-11-20): drilling 60-100 ft/min;
# AutoDrill "Suggested drilling feed rates" (read 2026-11-20), row Stl,
# Carbon: 3/16 in .003 in/rev. Centre drill 1800 rpm × .001 = 1.8 in/min;
# #9 1000 rpm (51 ft/min) × .003 = 3.0 in/min.
spot_feed_per_min_mm = 45.72
drill_9_feed_per_min_mm = 76.2
# The pins' line level within 1° before the cross hole (the drawing's ±1°):
# the DTI on the .0930 plus pin in each hole, 14.0 mm apart, read within 0.10 mm
# (.10 / 14.0 = 0.4°).
pin_level_dti_mm = 0.1
# Bench: the cross hole's .196 GO and .200 NO-GO (gauges.pin-gauges, class ZZ
# minus); its station from F to the GO pin's far side, 4.53 + .098 ±.01.
cross_go_pin_in = 0.196
cross_nogo_pin_in = 0.2
cross_far_side_min_in = 4.618
cross_far_side_max_in = 4.638

