speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the end square. Spindle stopped: with a .002 feeler leaf between the AR tool's left edge and the faced end, set DRO Z to +.002, then take the leaf out."
