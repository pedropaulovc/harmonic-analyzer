[[setups]]
machine_kind = "other"
title = "Mill: the cross hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise. One 1 in, 4 in long parallel of the 1/8 in thick set standing on edge, centred between the jaws, its left end flush with the jaws' left face; the shaft on its top edge along the jaws, F to the RIGHT, the jaws' left face 3.55 in from F (on the outboard journal; calipers' depth rod), brass shim over both journals at the jaws. The jaw spacer is the proof slug: the pair's other 1 in parallel on edge against the moving jaw, beside the first, its right end {{process.spacer_parallel_end_in:.2dot}} right of F; the slug on its corner, its journal toward F, the journal's end {{process.slug_gap_in:.2dot}} right of F (rule), the same brass shim over its journal at the jaws, its spigot hanging past the parallel's end and the jaws. That {{process.slug_gap_in:.2dot}} gap is the edge finder's room at F. Under the hole nothing but air."
datum = "Program PK01_cross_hole (cam:dt_crankshaft). G54: X0 F, +X toward the jaws' right end; Y0 the stub's axis; Z0 the stub's top. The file starts with an M6 for the centre drill."
diagram = { file = "diagrams/cross-hole.svg", alt = "From the front, 3 px/mm: the shaft on its journals on a 1 in parallel on edge, F to the right, the jaws behind; the stub and the dome out past the jaws' left face; the #9 through the stub {{cad.cross_hole_station_in:.2f}} from F, its full diameter 1.0 mm past the underside; the slug as the spacer on a second parallel against the moving jaw, its journal's end {{process.slug_gap_in:.2f}} right of F." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.outboard_journal_dia_ref}}", along_jaws_mm = "{{process.part_length_mm}}", part_height_mm = "{{cad.outboard_journal_dia_ref}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.left_overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.part_length_mm}}"], clamp_mm = ["{{process.left_overhang_mm}}", "{{process.part_length_mm}}"], section_mm = { diameter = "{{cad.hub_shaft_dia_least_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before tightening: the pins' line level. The .0930 plus pin in one drive-pin hole, the DTI in the spindle on its top beside the stub; read. Move the pin to the other hole and read there. Roll the shaft and read both again until the two readings agree. Write them."
inspection = "The pin's top in the two holes within {{process.pin_level_dti_mm:.2f}} mm of each other (the line within 0.4°; the drawing's ±1°)."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{process.pin_level_dti_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Over {{process.pin_level_dti_mm:.2f}} mm: open the vise a little, roll the shaft to raise the low hole, close it and read both again."
feed = "hand"

[[setups.operations]]
instruction = "Tighten the vise fully; read the pin in both holes again."
inspection = "Still within {{process.pin_level_dti_mm:.2f}} mm of each other."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{process.pin_level_dti_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Over {{process.pin_level_dti_mm:.2f}} mm after tightening: open the vise a little, roll the shaft to raise the low hole, tighten fully and read both again."
feed = "hand"

[[setups.operations]]
instruction = "Take the .0930 plus pin out of the drive-pin hole."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0 the stub's axis: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm, Ø.200), its tip level with the stub's axis, on the stub between the spigot and the dome: from the −Y side, G10 L20 P1 Y0; jog Z up clear of the stub, then from the +Y side G10 L20 P1 Y(half the DRO's work Y reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 F: edge finder (900 rpm), 2.5 mm off the axis (off F's centre hole)."
instruction_detailed = "X and Z have no work zero yet, so jog: Z up until the tip clears the jaws; X right until the tip is about .2 in right of F, in the {{process.slug_gap_in:.2dot}} gap before the slug; MDI G0 Y2.500; jog Z down to the shaft's axis height; bring it in from the right onto F: G10 L20 P1 X2.540. Jog X right .2 in and Z up clear."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the stub, touched with the centre drill over its axis."
instruction_detailed = "Console M6 T1 (#2 centre drill). MDI G0 X-120.000 Y0.000: over the stub. Spindle stopped, its point just dragging a .002 feeler leaf on the stub's top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "The #9 stands at least {{process.cross_projection_min_mm:in.2f}} in out of the chuck. Run PK01_cross_hole (M6 T1, centre drill; set 1800): spot the cross hole Ø{{process.cross_spot_dia_mm:in.3dot}} on the stub's top at X{{process.cross_x_mm:.3f}} mm."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "cross spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.cross_spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.cross_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-9"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.cross_hole_dia_band_mm}}" }
instruction = "Same file, M6 T2: the #9 through the stub in one feed (L/D 1.9), its full diameter {{process.drill_past_mm:in.3dot}} past the stub's underside; set 1000. Cutting oil."
rpm = 1000
feed = "{{process.drill_9_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{cad.hub_shaft_dia_ref_mm}}"
peck = "none"
milling_cuts = [
  { name = "cross drill", kind = "drill", phase = "rough", cutter_dia_mm = 4.9784, flutes = 2, rpm = 1000, feed_mm_min = "{{process.drill_9_feed_per_min_mm}}", stations_mm = "{{process.cross_station_mm}}" },
]

[[setups.operations]]
instruction = "Before unclamping: the {{process.cross_go_pin_in:.3dot}} pin (GO) passes through the cross hole, the {{process.cross_nogo_pin_in:.3dot}} pin (NO-GO) does not enter."
inspection = "Cross hole Ø{{cad.cross_hole_dia_min_in:.3dot}}–{{cad.cross_hole_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.cross_hole_dia_band_mm}}" }]

[[setups.operations]]
instruction = "The GO does not pass: T2 still in, MDI G0 X{{process.cross_x_mm:.3f}} Y0 Z1, M3 S1000, G1 Z{{process.cross_drill_tip_mm:.3f}} F{{process.drill_9_feed_per_min_mm:.1f}}, G0 Z10, M5; gauge again. Still tight, or the NO-GO enters: the shaft is scrap; start again from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, mark, check, oil"
machine = "Bench"
holding = "Bench vise with soft jaws on the spigot."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished crankshaft: F with its centre, the (Ø.3125) pinion seat, the (Ø.4375) journals, the Ø.41 relief, the Ø.687 spigot with the two .0930 drive-pin holes and their knockouts, the (Ø.3750) stub with the #9 cross hole, the SR.26 dome." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the cross hole with the smooth file's corner, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, never on the stub's O.D.; the drive-pin holes' mouths and the knockouts' exits the same."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break all remaining outside edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the file's corner, the journals' ends and the spigot's edges included; never lay the file's flat on the journal diameters or the spigot's faces."
feed = "hand"

[[setups.operations]]
instruction = "Prick one punch mark on the dome, about .10 off the apex (the drawing: location not critical), the shaft upright in the soft jaws on the spigot, dome up. Stone off any raised burr round the mark."
feed = "hand"

[[setups.operations]]
instruction = "Cross hole: the {{process.cross_go_pin_in:.3dot}} GO pin passes, the {{process.cross_nogo_pin_in:.3dot}} NO-GO enters neither end; with the GO in it, the calipers' outside jaws from F to the pin's far side. Mike the stub across the hole's ends: no raised burr."
inspection = "Cross hole Ø{{cad.cross_hole_dia_min_in:.3dot}}–{{cad.cross_hole_dia_max_in:.3dot}}; F to the pin's far side {{process.cross_far_side_min_in:.3dot}}–{{process.cross_far_side_max_in:.3dot}} ({{cad.cross_hole_station_min_in:.2dot}}–{{cad.cross_hole_station_max_in:.2dot}} plus half the pin); stub there within .0002 of its Setup 3 reading."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.cross_hole_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.cross_hole_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "A raised burr on the stub: stone it off and mike again. The hole out of its band or station: the shaft is scrap; start again from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil (FINISH: {{cad.finish}}). Bag the shaft with its number, the journals wrapped."
feed = "hand"
