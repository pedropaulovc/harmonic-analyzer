cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-1"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the faced end with the No. 1 centre drill from the tailstock chuck, to about Ø.08 across the countersink; then the dead centre into it, quill locked."
diagram = { file = "diagrams/slug-centre.svg", alt = "As Setup 5's picture: the No. 1 centre drill from the tailstock chuck in the faced end, about Ø.08 across the countersink." }
