[[setups.operations]]
cut_kind = "other"
instruction = "The slug out (the jig, the cross slide and the drill chuck untouched). Each hole: the .0930 plus pin goes in (the hole is the reamer's, drawing: no band; it is the reading rod for what follows)."

[[setups.operations]]
cut_kind = "other"
instruction = "The pin refused: the re-ream ops at the end of this setup."

[[setups.operations]]
cut_kind = "other"
instruction = "With the .0930 plus pin in each hole in turn, mike over the pin and the stub's far side beside the spigot face; offset = reading − stub/2 + .09325/2 − the pin's written reading (the anvil pushes the pin onto the hole's inner wall). Write both offsets."
inspection = "Each offset {{cad.drive_pin_1_offset_min_in:.4dot}}–{{cad.drive_pin_1_offset_max_in:.4dot}} (the drawing's band); the slug passes within {{process.pin_guard_in:.4dot}} of {{cad.drive_pin_1_offset_in:.4dot}} (the band less the reading's ±{{process.pin_uncertainty_in:.4dot}})."
gauge_checks = [{ gauge = "micrometers", band_mm = [6.9848, 7.0152] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Slug hole depth: mike the .0930 plus pin's length; stand it in a hole, where it stops at the reamer's chamfer; the calipers' depth rod from the spigot face to the pin's top reads its protrusion. Depth = the pin's length − the protrusion. Write c = {{process.ream_tip_in:.4dot}} − that depth: the reamer's chamfer allowance for the shaft."
inspection = "c between .000 and .020 (a .0930 chucking reamer's chamfer); outside it, read again."
gauge_checks = [{ gauge = "calipers", band_mm = [3.6957, 4.2037] }]

[[setups.operations]]
cut_kind = "other"
instruction = "c still outside .000–.020 on a second reading: stop, do not ream the shaft, and tell the owner (check the pin's seating and the reamer's chamfer)."

[[setups.operations]]
cut_kind = "other"
instruction = "An offset within {{process.pin_uncertainty_in:.4dot}} of {{cad.drive_pin_1_offset_in:.4dot}} (inside the reading's own uncertainty): no correction to that side. More than {{process.pin_uncertainty_in:.4dot}} off: that side's DRO target moves by its error the other way, in mm; write the new target."

[[setups.operations]]
cut_kind = "other"
instruction = "Both offsets within {{process.pin_guard_in:.4dot}} of {{cad.drive_pin_1_offset_in:.4dot}}: the slug passes; the shaft is cut at the targets written."

[[setups.operations]]
cut_kind = "other"
instruction = "An offset more than {{process.pin_guard_in:.4dot}} off but inside {{cad.drive_pin_1_offset_min_in:.4dot}}–{{cad.drive_pin_1_offset_max_in:.4dot}}: the slug back in the jig turned 90°; the slug ops above run again at the new targets and are read by these rules. Later tries turn it 45° and 135°; past those, turn a new slug (Setups 5 and 6)."

[[setups.operations]]
cut_kind = "other"
instruction = "An offset outside {{cad.drive_pin_1_offset_min_in:.4dot}}–{{cad.drive_pin_1_offset_max_in:.4dot}}: stop, the shaft not drilled. Check the jig bore's clearance, the holder's clamping and the cross slide's gib; then correct the target and try again on the slug turned as above."

[[setups.operations]]
cut_kind = "other"
instruction = "A slug hole the .0930 plus pin does not enter: ream it again by the re-ream ops at the end of this setup, its tip to Z-{{process.ream_tip_in:.4dot}} as at first (not the shaft's .1555 + c), then read it as above."

[[setups.operations]]
cut_kind = "other"
instruction = "The shaft in the jig as Holding says. Mike its stub beside the spigot face (within .0002 of its Setup 3 reading). Sweep the stub with the DTI as for the slug, beside the spigot face and 15 mm out; set DRO X0. Write the readings, and the shaft's H: the calipers' depth rod from the dome's apex to the spigot face."
inspection = "Front and back within {{process.dti_x0_mm:.3f}} mm at both places."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{process.dti_x0_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Out of the limit: take the shaft out, clean the bore and the journals, seat it again and sweep again."

