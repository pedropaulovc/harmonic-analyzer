cut_kind = "other"
instruction = "Before the centre goes in, spindle stopped: with a .002 feeler leaf between the AR tool's left edge and F, set DRO Z to +.002, then take the leaf out. Then bring the dead centre into F and lock the quill."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough from F to Z-{{process.stub_end_z_in:.2f}} in cuts of {{process.rough_doc_in:.3dot}} per side to Ø{{process.rough_dia_in:.3dot}}; then F to Z-{{cad.collar_rear_station_in:.3dot}} to Ø{{process.journal_rough_in:.3dot}}, stopped .010 short of the shoulder; then the stub to Ø{{process.stub_rough_in:.3dot}} to Z-{{process.stub_end_z_in:.2f}}, each pass started .30 past the spigot's stub-side face Z-{{cad.collar_seat_station_in:.3dot}}: the insert's trailing edge then clears that face."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{process.bar_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Before any finishing pass: on the 0–1 in micrometer (reads .0001; trust a reading to ±.00005), mike the .0930 plus pin and write the reading here and on its tag: Setup 7 reads the drive-pin offsets, the depth and the pins' line over it."
inspection = "The pin reads .0930 to .0932; outside that it is not used: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = [2.3622, 2.36728] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "telescoping-gauges-starrett-s579gz"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Note 3, before any finishing pass: measure the three mates' bores; never take one at its tool's size (MHA-DT-10's is cut with the adjustable reamer set and scatters; MHA-DT-31's is drilled 3/8 and is not round). Lock a telescoping gauge across the bore, take it out square and read it on the 0–1 in micrometer; two readings 90° apart at each end of the bore. Write each bore's smallest reading: B31, the hub MHA-DT-31's bore (the stub's mate; the stub is turned to this smaller reading, never to the larger one 90° from it); B05, the smaller of the cone pivot post MHA-DT-05's two crank bores (the journals' mate); B10, the 16T MHA-DT-10's bore (the pinion seat's mate). Keep MHA-DT-10 and MHA-DT-05 at the lathe, clean and dry, for the trials below."
inspection = "MHA-DT-05's and MHA-DT-10's four readings within .0003 of each other (round, straight); MHA-DT-31's four readings within .375–.379 (its 3/8 drill's DRILLED HOLES; they may spread, a drilled hole is not round); MHA-DT-05's two bores within .0013 of each other (note 3's {{cad.outboard_journal_diametral_clearance_min_in:.4dot}}–{{cad.outboard_journal_diametral_clearance_max_in:.4dot}} is .0013 wide, so one journal diameter serves both)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A reamed bore whose readings spread wider: read it again, the gauge rocked through square each time. An MHA-DT-31 reading outside .375–.379: the hub is off its drawing; stop before the stub is finished and tell the owner. MHA-DT-05's two bores still more than .0013 apart: stop before the journals are finished and tell the owner (one journal diameter cannot give both bores note 3's clearance); the other diameters may be finished."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the spigot from Z-{{cad.collar_rear_station_in:.3dot}} to Z-{{cad.collar_seat_station_in:.3dot}} to Ø{{cad.spigot_dia_min_in:.3dot}}–{{cad.spigot_dia_max_in:.3dot}}, aiming {{cad.spigot_dia_in:.3dot}}; then the stub from .30 past Z-{{cad.collar_seat_station_in:.3dot}} to Z-{{process.stub_end_z_in:.2f}} to B31 less {{cad.hub_shaft_diametral_clearance_min_in:.4dot}}–{{cad.hub_shaft_diametral_clearance_max_in:.4dot}}, aiming B31 less {{cad.hub_shaft_diametral_clearance_in:.4dot}} (drawing: Ø{{cad.hub_shaft_dia_ref_in:.4dot}} REF, note 3), miking between the last light passes."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.spigot_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish F to Z-{{cad.outboard_journal_end_station_in:.2dot}} in one pass to B05 less {{cad.outboard_journal_diametral_clearance_min_in:.4dot}}–{{cad.outboard_journal_diametral_clearance_max_in:.4dot}}, aiming B05 less {{cad.outboard_journal_diametral_clearance_in:.4dot}} (drawing: 2X Ø.4375 REF, note 3), miking between the last light passes: both journals, smooth to the nail (Ra 63). Then the relief to Ø{{cad.relief_dia_min_in:.3dot}}–{{cad.relief_dia_max_in:.3dot}}, aiming {{process.relief_aim_in:.3dot}}, in .010 cuts per side, each started .05 past Z-{{cad.inboard_journal_end_station_in:.2dot}} (clear of that end) and stopped .005 short of Z-{{cad.outboard_journal_station_in:.2dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outboard_journal_dia_ref}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "The pinion seat from F to Z-{{cad.seat_step_station_in:.2dot}} in .010 cuts per side to B10 less {{cad.pinion_seat_diametral_clearance_min_in:.4dot}}–{{cad.pinion_seat_diametral_clearance_max_in:.4dot}}, aiming B10 less {{cad.pinion_seat_diametral_clearance_in:.4dot}} (drawing: Ø{{cad.pinion_seat_dia_ref_in:.4dot}} REF, note 3), miking between the last light passes; stop .005 short of the step."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.pinion_seat_dia_ref_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Note 3 trials, spindle stopped: back the dead centre out of F and the tailstock clear. Slide MHA-DT-10 onto the pinion seat from F, then MHA-DT-05's crank bores over F onto the journal diameter; take each off. Bring the centre back into F, a dab of grease, the quill snug and locked."
inspection = "Each slides on by hand, no force: a cross-check of the readings; the acceptance is each diameter miked inside its written bore less .0010–.0023 (note 3)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "A mate that will not go on: mike that diameter and read its bore again as above. The diameter over its bore less {{cad.pinion_seat_diametral_clearance_min_in:.4dot}}: another .0002 a side, the centre back in, and try again. The diameter already inside its bore less .0010–.0023 yet refused: the bore's first reading was high; write the new reading as that bore and turn to it the same way, never below the new reading less {{cad.pinion_seat_diametral_clearance_max_in:.4dot}}."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Sharp-nose tool. First, spindle stopped: touch its left side on F, DRO Z0 (the AR tool's zero does not carry over), and mike its tip's width. Plunge the inboard neck first, .010 per side, to Ø{{cad.neck_inboard_dia_min_in:.3dot}}–{{cad.neck_inboard_dia_max_in:.3dot}}, aiming {{process.neck_aim_in:.3dot}}, from Z-{{cad.seat_step_station_in:.2dot}} to Z-{{cad.inboard_journal_station_in:.2dot}}, never past the journal's station."
diagram = { file = "diagrams/turn-sharp.svg", alt = "As Setup 3's picture, the diameters turned: the sharp-nose tool plunged in the inboard neck between the seat step and the journal, to Ø{{process.neck_aim_in:.3dot}}." }
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Then the outboard neck the same way, its right side never past the journal's end Z-{{cad.outboard_journal_end_station_in:.2dot}}: the DRO from −({{cad.outboard_journal_end_station_in:.2dot}} + the tip's width) to Z-{{cad.collar_rear_station_in:.3dot}}. The necks form the faces the next two ops finish."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the pinion seat, touch the sharp-nose tool's nose on it and set the cross-slide DRO to that diameter. The seat step's face is cut down to that reading and no lower: no lip and no undercut on the seat."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Faces that point at F take the tool's left side at the station: the seat step Z-{{cad.seat_step_station_in:.2dot}}, the journals' starts Z-{{cad.inboard_journal_station_in:.2dot}} and Z-{{cad.outboard_journal_station_in:.2dot}}, the spigot's rear face Z-{{cad.collar_rear_station_in:.3dot}} (Ra 63)."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "The steps the AR passes left: .05 of relief beside the inboard journal's end, .30 of stub beside the spigot's stub-side face. Turn each off with the right side leading, .010 per side per pass, fed toward that face and stopped at −(its station + the tip's width)."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "The last passes on those steps to the finished sizes: spindle stopped, the nose touched on the miked stub (then on the miked relief) and the cross-slide DRO set to that diameter; each step's last pass at that reading, so it meets the AR-turned diameter."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Faces that point at the chuck take the tool's right side, the DRO at −(the station + the tip's width): the inboard journal's end Z-{{cad.inboard_journal_end_station_in:.2dot}}, the outboard's Z-{{cad.outboard_journal_end_station_in:.2dot}}, the spigot's stub-side face Z-{{cad.collar_seat_station_in:.3dot}}. Inside corners R.010 max."
rpm = 400
feed = "hand, light"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the pinion seat, both journals (each at two places) and the stub, and write each reading here (Setups 5 and 9 read against them)."
inspection = "Note 3: seat B10 less {{cad.pinion_seat_diametral_clearance_min_in:.4dot}}–{{cad.pinion_seat_diametral_clearance_max_in:.4dot}}; journals B05 less {{cad.outboard_journal_diametral_clearance_min_in:.4dot}}–{{cad.outboard_journal_diametral_clearance_max_in:.4dot}}; stub B31 less {{cad.hub_shaft_diametral_clearance_min_in:.4dot}}–{{cad.hub_shaft_diametral_clearance_max_in:.4dot}} (B10, B05 and B31 as written above)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the relief and the spigot."
inspection = "Relief Ø{{cad.relief_dia_min_in:.3dot}}–{{cad.relief_dia_max_in:.3dot}}; spigot Ø{{cad.spigot_dia_min_in:.3dot}}–{{cad.spigot_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.relief_dia_band_mm}}" }, { gauge = "micrometers", band_mm = "{{cad.spigot_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "The necks are too narrow for the micrometer's anvil: spindle stopped, the sharp-nose tool's nose touched on the miked journal and the cross-slide DRO set to that diameter; bring the nose down onto each neck's floor and read the DRO."
inspection = "Necks Ø{{cad.neck_inboard_dia_min_in:.3dot}}–{{cad.neck_inboard_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "lathe-x-dro", band_mm = "{{cad.neck_inboard_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "A fit diameter over its bore less .0010, or the relief or the spigot over its band: one more light pass over that feature only, the cross slide in by half the miked excess per side, and mike again. A fit diameter under its bore less .0023, or the relief or the spigot under its band: the shaft is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the sharp-nose tool zeroed on F as above: touch each face with the side named above and read Z. A face cut with the right side reads −(its station + the tip's width): add the tip's width to that negative reading (a face on its station then reads −station) before comparing it with the bands below."
inspection = "Seat step Z-{{cad.seat_step_station_min_in:.2dot}} to -{{cad.seat_step_station_max_in:.2dot}}; journals Z-{{cad.inboard_journal_station_min_in:.2dot}} to -{{cad.inboard_journal_station_max_in:.2dot}} / -{{cad.inboard_journal_end_station_min_in:.2dot}} to -{{cad.inboard_journal_end_station_max_in:.2dot}} and -{{cad.outboard_journal_station_min_in:.2dot}} to -{{cad.outboard_journal_station_max_in:.2dot}} / -{{cad.outboard_journal_end_station_min_in:.2dot}} to -{{cad.outboard_journal_end_station_max_in:.2dot}}; spigot faces Z-{{cad.collar_rear_station_min_in:.3dot}} to -{{cad.collar_rear_station_max_in:.3dot}} and -{{cad.collar_seat_station_min_in:.3dot}} to -{{cad.collar_seat_station_max_in:.3dot}}."
gauge_checks = [{ gauge = "lathe-z-dro", band_mm = "{{cad.seat_step_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.inboard_journal_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.inboard_journal_end_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.outboard_journal_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.outboard_journal_end_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.collar_rear_station_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.collar_seat_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "A face short of its band above (material still to come off): face it again toward its station and read again. Past its band: the shaft is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: back the tailstock off clear of F (the shaft stays in the 3-jaw) for the blade's touch-off; mike the P1 blade's cutting edge."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width as miked ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Then the dead centre back in F, the quill locked."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Part off with that face at Z-{{process.part_z_in:.3dot}}, steady hand feed, cutting oil, down to about Ø.10; then stop the spindle."
diagram = { file = "diagrams/turn-part.svg", alt = "As Setup 3's picture, every diameter finished: the P1 blade with its tailstock-side face at Z-{{process.part_z_in:.3f}}, fed in to about Ø.10, the dead centre in F." }
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.hub_shaft_dia_ref_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: back the tailstock off, support the shaft by hand and finish the cut by turning the chuck by hand."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Dome end: face to length, the SR.26 dome"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the (Ø.3750) stub (a sliding fit: the shim keeps the jaws off it), the parted end {{process.dome_stickout_mm:in.2f}} in out of the jaw fronts; the spigot and the rest of the shaft back through the chuck into the spindle bore."
datum = "Z0 (carriage DRO) the faced apex, set by each tool on it; the length is read from F with the height gauge."
diagram = { file = "diagrams/dome.svg", alt = "Plan from above, 6 px/mm: the stub in the 3-jaw over a brass shim, the parted end {{process.dome_stickout_mm:in.2dot}} out; the AR tool facing it square to the centre, in light skims toward the length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.hub_shaft_dia_ref_mm}}", stock_diameter_mm = "{{cad.hub_shaft_dia_ref_mm}}", stickout_mm = "{{process.dome_stickout_mm}}", minimum_diameter_mm = "{{cad.hub_shaft_dia_least_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the parted end square to the centre with no pip, in light skims toward the length."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.hub_shaft_dia_ref_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the shaft out and stand it on F on the surface plate: the height gauge's scriber on the faced end reads the length. Aim {{process.overall_in:.3dot}}. Write the final reading: the rim check after the dome uses it."
inspection = "F to the faced end {{process.overall_min_in:.3dot}}–{{process.overall_max_in:.3dot}} in process (the rim's {{cad.far_end_length_min_in:.3dot}}–{{cad.far_end_length_max_in:.3dot}} plus the .080 dome; the rim is checked after the dome)."
gauge_checks = [{ gauge = "height-gauge", band_mm = ["{{process.overall_min_mm}}", "{{process.overall_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{process.overall_max_in:.3dot}}: chuck it again as in this setup and take another skim. Under {{process.overall_min_in:.3dot}}: the rim would land short of its band; the shaft is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped: touch the AR tool's point on the faced end, DRO Z0. Step the dome: at each line, carriage at the Z, face from the Ø out to the stub's O.D.: Z-.0012 from Ø.050; Z-.0049 Ø.100; Z-.0111 Ø.150; Z-.0200 Ø.200; Z-.0321 Ø.250; Z-.0477 Ø.300; Z-.0678 Ø.350. The dome meets the stub's O.D. at Z-{{process.dome_height_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.hub_shaft_dia_ref_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the steps off the dome with the smooth file, stroking from the apex out to the rim, blending the Ø.05 face left at the apex into the dome, until the step corners are just gone. No centre hole in the dome. The rim is broken after the dome's check."
diagram = { file = "diagrams/dome-file.svg", alt = "As Setup 4's picture: the SR.26 dome stepped; the smooth file (schematic) stroked from the apex out to the rim. No centre hole in the dome." }
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped. Sharp-nose tool (R.004): touch its nose on the apex and set DRO Z0 there; touch the nose on the miked stub and set the cross-slide DRO (diameter mode) to that diameter, so X and Z read the same point of the tool. Touch the nose on the dome at Ø.200 and at Ø.300, reading Z. The bands allow for the R.004 nose."
inspection = "Dome at Ø.200 Z-.0193 to -.0232 and at Ø.300 Z-.0442 to -.0546 (read with the R.004 nose): the dome's height {{cad.dome_height_min_in:.2dot}}–{{cad.dome_height_max_in:.2dot}} (SR.26 REF); no step left at the apex (the Ø.05 face blended in)."
gauge_checks = [{ gauge = "lathe-z-dro", band_mm = "{{cad.dome_height_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Either reading nearer zero than its band (the dome too full), or a step still at the apex: file again from the rim inward (from the apex out for the step) and read the check above again. Either reading past its band (too deep): the shaft is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "The rim, before it is broken: the sharp-nose tool still zeroed as above, touch its nose on the dome at Ø.360 and read Z (unsigned). Its nose is R.004 or sharper, so work the rim from F out both ways: the length written above less (the reading + .005), for R.004; and less (the reading + .0073), for a sharp nose."
inspection = "The R.004 figure no more than {{cad.far_end_length_max_in:.3dot}} and the sharp-nose figure no less than {{cad.far_end_length_min_in:.3dot}} from F: the rim is then in the drawing's 5.06 +.000/−.016 whatever the nose."
gauge_checks = [{ gauge = "lathe-z-dro", band_mm = "{{cad.far_end_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "R.004 figure past {{cad.far_end_length_max_in:.3dot}}: skim the apex .005, then stand the shaft on F on the surface plate and write its new length from the height gauge; chuck it again as in this setup, step the dome again from the table above (Z0 again on the new face), file, and read the dome and the rim again. Sharp-nose figure short of {{cad.far_end_length_min_in:.3dot}}: the shaft is scrap; start again from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "lathe-file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: break the dome's rim R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file's corner."
rpm = 200
feed = "hand"

[[setups]]
machine_kind = "lathe"
