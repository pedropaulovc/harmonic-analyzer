[[setups]]
machine_kind = "lathe"
title = "Drive-pin holes in the jig: the slug, then the shaft"
machine = "PM-1127VF-LB lathe / the jig on the AXA No. 4 holder; cutters in the 3-jaw, then in the drill chuck"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The drive-pin jig (fixtures record; made before this setup): 1 in 1018, 4.75 long, its Ø.750 shank 2.00 long, a 3/8 clearance 1.90 deep from the shank end, a 10-32 set screw on a brass pad 1.25 from the front face; its .4385 bore, 2.95 deep, is reamed here and breaks into the 3/8 hole. Its shank in the AXA No. 4 holder on the tool post, its head toward the headstock, the holder's height collar set with the jig's axis at the spindle's centre height (by the centre in the 3-jaw on the jig face). The holder is not moved again until the shaft's holes are done, except for a new slug or a restart, whose turning needs the post: then the holder comes off, goes back on its height collar, X0 is swept again and the targets are proved again on the new slug before the shaft. The cross slide's gib locked between moves. The gap spacer: the 1/2 in high parallel of the 1/8 in thick set, stood upright beside the journal between the spigot's rear face and the jig face, slid out sideways once the set screw is snug. The shaft in the jig: far end first, the spacer in, the set screw down on the relief (snug, not tight), the spacer then withdrawn: F then sits 3.53 into the jig, in the 3/8 hole. The slug likewise: its centre-drilled journal end first, the spacer behind its spigot, the set screw on its journal (.23 from its end), the journal's end 1.48 into the jig; its stub end, faced in Setup 6, stands out."
datum = "X0 (cross-slide DRO, set to read mm and radius for this setup) the stub's axis: the DTI in the drill chuck swept round the stub, front and back readings equal. Z (carriage DRO, inches) the spigot's stub-side face (the spigot face): its height H below the stub's end (the slug's stub end faced in Setup 6, the shaft's dome apex) read with the calipers' depth rod and written; each cutter at X0, spindle stopped, its tip touched on the stub's end, DRO Z set to +H, then the carriage backed off .10 before any cross-slide move; the spindle started only at the hole's target. No cutter is touched on the face itself: the holes' stations would swallow its tip. The jig's bore lies on the spindle axis because it is cut in place."
diagram = { file = "diagrams/jig.svg", alt = "Plan from above, 3 px/mm: the jig on the tool post in the AXA No. 4 holder, its head toward the headstock; the 27/64 drill in the 3-jaw, the jig fed onto it with the carriage to {{process.jig_ream_depth_in:.2f}} plus .10 deep." }
lathe_hold = "other"

