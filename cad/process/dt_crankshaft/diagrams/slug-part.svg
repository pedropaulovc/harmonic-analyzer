<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <!-- As Setup 5's picture. The P1 blade (1/16 = 6.35 px wide, its height to a break) with its tailstock-side face at Z-2.622 (slug_part_z_in), fed in to about Ø.10, the dead centre in. -->
  <rect class="paper" x="0" y="0" width="760" height="300"/>
