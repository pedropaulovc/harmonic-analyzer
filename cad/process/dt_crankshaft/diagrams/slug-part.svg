  <line class="centre-line" x1="20" y1="150" x2="740" y2="150"/>
  <rect class="fixture-vise" x="125.36" y="49.2" width="60" height="201.6"/>
  <rect class="clamp" x="185.36" y="65.2" width="40" height="34"/>
  <rect class="clamp" x="185.36" y="200.8" width="40" height="34"/>
  <text class="label" x="125.36" y="43.2">3-jaw (schematic)</text>
  <rect class="part-rest" x="20" y="99.2" width="205.36" height="101.6"/>
  <rect class="part-kept" x="225.36" y="99.2" width="15.24" height="101.6"/>
