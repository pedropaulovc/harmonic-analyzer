<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <!-- Plan from above, 6 px/mm. The (Ø.3750) stub (57.2 px) in the 3-jaw over a brass shim wrap (its thickness not on record: drawn schematic), the parted end dome_stickout_mm 7.62 out. The AR tool (schematic) on a facing skim, feeding in toward the centre (up), in light skims toward the length. -->
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="22">Setup 4: face the parted end to length (AR tool), the stub on a brass shim (6 px/mm)</text>
  <line class="centre-line" x1="20" y1="150" x2="740" y2="150"/>
  <rect class="fixture-vise" x="304.28" y="68.42" width="60" height="163.15"/>
  <rect class="clamp" x="364.28" y="84.42" width="40" height="34"/>
  <rect class="clamp" x="364.28" y="181.57" width="40" height="34"/>
  <text class="label" x="304.28" y="62.42">3-jaw (schematic)</text>
  <rect class="part-rest" x="364.28" y="118.44" width="40" height="2"/>
  <rect class="part-rest" x="364.28" y="179.56" width="40" height="2"/>
  <rect class="part-rest" x="20" y="121.42" width="384.28" height="57.15"/>
  <rect class="hidden" x="277.8" y="97.5" width="41.45" height="105"/>
  <text class="label" x="30" y="71.42">spigot and shaft back through the chuck</text>
  <rect class="part-kept" x="404.28" y="121.42" width="43.32" height="57.15"/>
  <rect class="part-removed" x="447.6" y="121.42" width="2.4" height="57.15"/>
  <path class="cutter" d="M450 162L460 188L460 252L453 249L446 252L439 249L432 252L432 182Z"/>
