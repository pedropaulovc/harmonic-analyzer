<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <!-- Plan from above, 4 px/mm: the 1 in blank (101.6 px) in the 3-jaw, F end_stickout_mm 25.4 (101.6 px) out of the jaw fronts. The AR tool (schematic: holder and TCMT insert not on record) on its first facing skim, face_allowance_in .02 off F, feeding in toward the centre (-X, up in this view), to the centre with no pip. -->
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="22">Setup 2: face F square (AR tool), F {{process.end_stickout_mm:in.2f}} in out of the 3-jaw (4 px/mm)</text>
  <line class="centre-line" x1="20" y1="160" x2="740" y2="160"/>
  <rect class="fixture-vise" x="318.4" y="59.2" width="60" height="201.6"/>
  <rect class="clamp" x="378.4" y="75.2" width="40" height="34"/>
  <rect class="clamp" x="378.4" y="210.8" width="40" height="34"/>
  <text class="label" x="318.4" y="53.2">3-jaw (schematic)</text>
  <rect class="part-rest" x="40" y="109.2" width="378.4" height="101.6"/>
  <rect class="part-kept" x="418.4" y="109.2" width="99.57" height="101.6"/>
  <rect class="part-removed" x="517.97" y="109.2" width="2.03" height="101.6"/>
  <line class="active-face" x1="517.97" y1="109.2" x2="517.97" y2="210.8"/>
  <path class="cutter" d="M520 180L530 206L530 270L523 267L516 270L509 267L502 270L502 200Z"/>
  <line class="arrow" x1="550" y1="176" x2="550" y2="148"/>
  <text class="label" x="560" y="110">F: faced {{process.face_allowance_in:.2dot}}, square,</text>
  <text class="label" x="560" y="126">to the centre with no pip;</text>
  <text class="label" x="560" y="142">centre-drilled next (Op 30)</text>
  <line class="leader" x1="556" y1="116" x2="518.8" y2="120"/>
  <circle class="leader-dot" cx="518.8" cy="120" r="2"/>
