<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <!-- Plan from above, 4 px/mm. The slug's journal (Ø.4375) in the 3-jaw over a brass shim wrap (thickness schematic), the centre-drilled end in the chuck, the parted stub end slug_face_stickout_mm 27.94 out. The AR tool (schematic) on a facing skim to the centre. -->
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="22">Setup 6: face the slug's parted stub end (AR tool), on its journal over a brass shim (4 px/mm)</text>
  <line class="centre-line" x1="20" y1="150" x2="740" y2="150"/>
  <rect class="fixture-vise" x="308.24" y="75.78" width="60" height="148.45"/>
  <rect class="clamp" x="368.24" y="91.78" width="40" height="34"/>
  <rect class="clamp" x="368.24" y="174.22" width="40" height="34"/>
  <text class="label" x="308.24" y="69.78">3-jaw (schematic)</text>
  <rect class="part-rest" x="368.24" y="125.76" width="40" height="2"/>
  <rect class="part-rest" x="368.24" y="172.24" width="40" height="2"/>
  <rect class="part-kept" x="40" y="127.78" width="368.24" height="44.45"/>
  <rect class="part-kept" x="408.24" y="115" width="27.64" height="70"/>
  <rect class="part-kept" x="435.88" y="130.95" width="83.12" height="38.1"/>
  <rect class="part-removed" x="519" y="130.95" width="1" height="38.1"/>
  <path class="cutter" d="M520 158L530 184L530 248L523 245L516 248L509 245L502 248L502 178Z"/>
  <line class="arrow" x1="550" y1="162" x2="550" y2="138"/>
  <text class="label" x="560" y="70">parted end faced flat to the centre,</text>
  <text class="label" x="560" y="86">light skims, .010 in all</text>
  <line class="leader" x1="556" y1="76" x2="519.6" y2="134"/>
  <circle class="leader-dot" cx="519.6" cy="134" r="2"/>
  <text class="label" x="30" y="70">journal (Ø.4375) in the chuck over a</text>
  <text class="label" x="30" y="86">brass shim, the centre-drilled end in</text>
  <line class="leader" x1="140" y1="86" x2="200" y2="128"/>
  <circle class="leader-dot" cx="200" cy="128" r="2"/>
  <text class="label" x="150" y="270">spigot Ø{{cad.spigot_dia_in:.3dot}}; stub (Ø{{cad.hub_shaft_dia_ref_in:.4dot}}), {{process.slug_face_stickout_mm:in.2f}} out</text>
  <line class="leader" x1="240" y1="258" x2="424" y2="184.8"/>
  <circle class="leader-dot" cx="424" cy="184.8" r="2"/>
</svg>
