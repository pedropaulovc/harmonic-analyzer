# Cone tip bushing MHA-DT-38, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC). Route:
# two chuckings of the 1/4 in C36000 bar on hand (cad/config/shop-equipment/
# stock-bought.toml c360-round-1-4).
# Setup 1, the bar: face the end (Z0), turn the outside to its .223-.233 band
# back past the parting line, chamfer the faced end's edge with the compound
# at 45°, spot, drill #53 and ream .0625 through and past the parting line in
# the same chucking, part off .02 long.
# Setup 2: the bushing turned round, .10 of its outside in the 3-jaw over a
# shim wrap, the parted end out; nothing seats it axially, so the length is
# set from the micrometer, not a stop (the MHA-MG-11 spacer's regrip): mike
# the length, touch the AR on the parted end, preset the DRO to the miked
# length less the .160 nominal, face to Z0, then chamfer that end's edge.
# Bench: deburr the bore's ends.
#
# The bore prints the .0625 reamer's size with no band: MHA-DT-37's pivot is
# turned last to slide in it (fit audit 2026-11-23, F10 and MHA-DT-37.stems;
# drawing-guidelines rule 4, form 2), so no gauge reads it here and the Class
# ZZ pins (zz-pins-0625-0630) are no longer this part's. Not on hand
# (cad/config/shop-equipment/, to order): the .0625 reamer
# (tools-reamers-taps.toml reamer-0625).
title = "Cone Tip Bushing"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 1/4 in"
stock = "Lot: {{process.quantity:d}} bushing. Ø{{process.stock_dia_in:.3dot}} bar, on hand: saw a {{process.bar_length_in:g}} in piece off it for the lathe, never the whole bar (it would run out past the spindle's rear end); the bushing takes {{cad.pitch_in:.2dot}} in of it."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. To order (not on hand): the .0625 chucking reamer."
shop = "../shop"
stock_refs = ["c360-round-1-4"]
material_key = "lathe-c360"
turning_material = "brass"

[cad]
file = "../../out/features/dt_cone_tip_bushing/features.toml"
adapter = "turned_bush"
part = "dt-cone-tip-bushing"

[parameters]
quantity = 1
stock_dia_in = 0.25
# A piece of the bar on hand and the length the 3-jaw grips of it.
bar_length_in = 3.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Setup 2: how much of the outside the jaws take, from the Setup 1 faced end.
regrip_grip_in = 0.1
# Left a side over the band's low end for the finish passes: roughed to the
# band's top, finished to its middle.
finish_allowance_in = 0.005
rough_radial_doc_mm = 0.25
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.0508
turn_start_z_mm = 0.5

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-53"
name = "#53 drill"
ref = "drill-53"

[[tools]]
id = "reamer"
name = ".0625 chucking reamer"
ref = "reamer-0625"
status = "to_order"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "Bar: face, turn, chamfer, drill and ream the bore, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the bar end faced in Op 10."
diagram = { file = "diagrams/bar.svg", alt = "The 1/4 in bar in the 3-jaw: the end faced, the outside turned, the faced end's edge chamfered, the bore spotted, drilled and reamed through past the parting line; the bushing parted off .02 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Outside rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Outside finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the outside from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}: rough to Ø{{cad.outer_rough_dia_mm:in.3dot}}, then finish in light passes, miking between them, to Ø{{cad.outer_dia_mm:in.3dot}} (the band's middle)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Outside Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Outside over {{cad.outer_dia_max_in:.3dot}} in Op 20: take another finish pass and mike again. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound at 45°: chamfer the outside edge of the faced end {{cad.chamfer_datum_leg_min_in:.3dot}}–{{cad.chamfer_datum_leg_max_in:.3dot}} × 45° with the AR's nose in light passes, checking between them."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Chamfer {{cad.chamfer_datum_leg_min_in:.3dot}}–{{cad.chamfer_datum_leg_max_in:.3dot}} × 45°: lay the calipers' jaws flat on the end face and close them onto the chamfer; the flat reads the outside Ø less twice the leg."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Chamfer under {{cad.chamfer_datum_leg_min_in:.3dot}} in Op 40: take another light pass and check again. Over {{cad.chamfer_datum_leg_max_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 1 centre drill, only the point's cone, about Ø.04 across: under the #53 drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 1.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-53"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #53 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{cad.run_in:.2dot}}, backing fully out to clear chips every .06 in (once its own diameter): the hole runs through the bushing and past the parting line. It leaves the reamer about .0015 a side."
settings = "lathe-drill-53-c360"
cut_diameter_mm = 1.5113
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = 1.5113, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Ream .0625 from the tailstock, spindle running: feed the reamer in until its lead chamfer meets the hole's mouth and zero the quill scale there; feed slowly until it reads {{cad.run_in:.2dot}} (past the parting line), and withdraw with the spindle still running."
settings = "lathe-ream-0625-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: {{process.regrip_allowance_in:.2dot}} over length, for Setup 2. Hands clear: let the bushing fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face the parted end to length, chamfer it"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap of brass shim, {{process.regrip_grip_in:.2dot}} in of the outside in the jaws from the chamfered Setup 1 end, the wrap cut no wider than that so it stands no further out than the jaws; the parted end {{cad.outer_stickout_far_mm:in.2dot}} in out. Nothing seats the bushing axially: the jaw tips may stand proud of the chuck face."
datum = "Z0: the parted face, {{cad.length_nominal_in:.3dot}} from the Setup 1 faced end, preset from the length miked in Op 100; the setting error, about .0005 either way, plus a touch mark of at most .001, which only shortens it, stays well inside the {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} band."
diagram = { file = "diagrams/regrip.svg", alt = "The bushing turned round, its chamfered end in the jaws over a shim wrap with nothing behind it: the parted end faced to length from the miked length and its outside edge chamfered." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_far_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Mike the length at the outer rim; write it down (about {{cad.part_off_in:.3dot}} the first time). Chuck it; spindle running, touch the AR lightly on the parted end's outer rim, a mark no deeper than .001, and set DRO Z to that length less {{cad.length_nominal_in:.3dot}}. Face in light skims to Z0; unchuck and mike at the rim."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} across the faces, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{cad.length_max_in:.3dot}} in Op 100: chuck it again and repeat Op 100 from that reading. Under {{cad.length_min_in:.3dot}}: scrapped, not reworked; make another from Setup 1. Only a part in the band goes on to Op 120."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Chuck it again as Op 100. Compound at 45°: chamfer the outside edge of this end {{cad.chamfer_far_leg_min_in:.3dot}}–{{cad.chamfer_far_leg_max_in:.3dot}} × 45° with the AR's nose in light passes, checking between them; the chamfer stops about .02 short of the jaw fronts, so watch the nose there."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Chamfer {{cad.chamfer_far_leg_min_in:.3dot}}–{{cad.chamfer_far_leg_max_in:.3dot}} × 45°: lay the calipers' jaws flat on the end face and close them onto the chamfer; the flat reads the outside Ø less twice the leg."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A far chamfer under {{cad.chamfer_far_leg_min_in:.3dot}} in Op 120: another light pass. Over {{cad.chamfer_far_leg_max_in:.3dot}}: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bushing: its {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} length, the turned outside, both end chamfers and the reamed bore through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr: break both ends of the bore, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, with a twist of the deburring set's countersink by hand, without touching the faces' flats or the bore's wall."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: bright machined, oiled): wipe the bushing clean and give its outside a light coat of light machine oil; keep the bore dry and oil-free for the Loctite 638 bond on MHA-DT-37, and keep the bushing with MHA-DT-37's blank: its pivot is turned last to slide in this bore."
feed = "hand"
