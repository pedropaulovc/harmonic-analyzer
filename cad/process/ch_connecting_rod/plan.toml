# MHA-CH-03 connecting rod, twenty, CNC-milled from 1/4 x 2 in 1018 cold-
# finished flat (stock.1018-flat-1-4x2-72in and -36in).
#
# Route: saw 20 blanks (nine from each of two 72 in bars, two from the 36 in), mic
# them and pair them by thickness; saw a 3.9 x 6 in support plate off the 1/2
# in 6061 flat once per batch. Every mill setup holds two blanks across the
# jaws on the plate on the 1 in parallels, each rod along its blank, the ring
# at the left end. Each face is pocketed only where the rod and its outline
# need it: the ring's zone to the blank's uncut edges (the frame), and along
# the shank a band the width of the shank and the outline's kerf; the ring
# and the fork stand as islands, the band goes down to the shank's face, the
# waste beyond it stays whole. Setup 2, face F (the fork's far face) up: skim
# the fork's face and rough F to .020 over its floors (CR01). Setup 3, face D
# (the datum face, kept as bought) up: rough D (CR02); release and reseat the
# blanks; finish D (CR03). Setup 4, F up again: finish F, trim the blank's
# right end to the fork's crown and cut through round the fork's end (CR04);
# bore the ring (CR05). Setup 5, the same clamping: saw the fork slot (CR06);
# spot, drill and ream the pin hole (CR07). Setup 6, the same clamping: cut
# the outline on seven tabs and recut the four inside corners to R.039
# (CR08). Setup 7, bench: break the rods out, file the stubs, deburr,
# inspect. Setup 8: black oxide, sent out.
#
# The route departs from the drawing's process (cad/config/parts/ch-
# connecting-rod.yaml), by the owner's ruling of 2026-11-21 (the author
# chooses the route for speed; the owner corrects afterwards): D stays as
# bought and F alone is skimmed .010 (not .005 off each fork face), and the
# bore, slot and pin hole are cut before the outline, the rod still in its
# frame (not after it). Both faces are still roughed in turns to .020 over,
# the blanks released and reseated, then both finished.
#
# Speed (owner's priority): NC 45 min per load of two (about 22 min a rod),
# from 100 in the first draft: only the ring's zone and the shank's band are
# pocketed (the waste beside the shank was pocketed on both faces), the skim
# covers the fork alone, the outline takes three levels instead of five and
# the roots three instead of fourteen.
#
# Workholding: the agent's recommendation (option A, the vise; owner's
# per-part choice pending, 2026-11-21). The plate supports the two blanks'
# inner edges; nothing cuts into it. A switch to a plate fixture replaces
# only Setup 6 (CR08) and its holding.
#
# The fork slot (.106 ±.002 through the fork's thickness, its floor under the
# title block's INSIDE CORNERS R.040 MAX) is sawn with the owned 2-3/4 x .064
# HSS slitting saw (McMaster 3062A21) running horizontally, two passes per
# width, its rim cutting a square floor across the fork: an end mill on its
# side would leave R.047 or more there. FLAGGED: it needs the R8 1 in saw
# arbor (tools.gear-cutter-arbor-1, to buy: the TTC 67-600-016 spacer-type
# arbor CH-01 names, its own spacers and nut) and the saw's arbor hole is
# not on its packing list (1 in assumed, UNVERIFIED). The arbor's sizes are
# ASSUMED, UNVERIFIED until it is bought, and checked when it is mounted
# (Setup 5): the spacers by the saw under saw_collar_dia_max_mm (or the
# collar meets the crown), the spacers and nut below the saw within
# saw_below_max_mm of its lower face, the nut under saw_nut_dia_max_mm.
# CR06 and its touch-off are laid out on those limits (cam.py checks every
# move of the saw, its spacers and its nut against the stock and the vise).
# Also to buy: the .0775 reamer (tools.reamer-0775) and the 5/64 in end mill
# (tools.endmill-5-64-long). The pin hole's size is gauged by a special
# Class ZZ pin-gauge pair, GO .0775 plus and NO-GO .0779 minus, TO BUY (as
# CH-01's; owner ruling 2026-11-21, "ill buy pin gauges", superseding the
# 2026-11-19 decision of #3124 item 5): a reamed hole is the reamer's size
# +.0005/0, wider than the drawing's .0004 band, so the reamer alone does
# not hold it; the pin-gauge sets on order (gauges.pin-gauges) step .001.
# The drawing's finish, matte black oxide per MIL-DTL-13924 Class 1 (owner
# ruling 2026-11-20, #2348; a hot process, all over, no masking), has no
# line on record: Setup 8 sends the rods out, as CH-02's.
#
# Zeroing: X0 the blanks' left ends, flushed with a 1-2-3 block, edge finder
# at 900 rpm; Y0 the fixed jaw, edge finder; Z0 with F up the plate's top,
# which is face D (touched with T1 on a .002 feeler leaf on the plate beside
# the blanks' left ends); with D up face D itself, on top.
#
# NC (cam:ch_connecting_rod, cad/process/ch_connecting_rod/cam.py):
# CR01_rough_2, CR02_rough_1, CR03_finish_1, CR04_finish_2, CR05_bore,
# CR06_slot, CR07_pin, CR08_outline. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2 1/8
# in end mill, T3 #1 centre drill, T4 #49 drill, T5 .0775 reamer, T6 5/64 in
# end mill, T7 the slitting saw (no tool-setter length; CR06 loads no tool).
title = "Connecting rod"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/4 x 2 in flat (the drawing's MATERIAL: Plain Carbon Steel; 1018 CF chosen)"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.0f}} in flat bar: two 72 in lengths and one 36 in; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks. Support plate: one 3.9 x 6 in piece of the 1/2 x 6 in 6061 flat."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Faces: D, the datum face (the fork's near face), stays as bought; F, the fork's far face, is skimmed in Setup 2. Mark D on each blank in Setup 1 and keep it readable. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and pick up G54 X and Y once, in Setup 2, and again after any reset, stall or E-stop (FluidNC loses home); the vise, the parallels and the plate stay put, so X and Y carry through Setups 2 to 6. Z0 is touched where each setup's Datum says. Setups 2 and 3 each run for all the loads in turn before the next; Setups 4, 5 and 6 are one clamping, run through on each load before the next load is clamped. Tools to buy before Setup 5: the R8 1 in saw arbor, the .0775 reamer and the 5/64 in end mill."
shop = "../shop"
stock_refs = ["1018-flat-1-4x2-72in", "1018-flat-1-4x2-36in", "6061-flat-1-2x6-54in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_connecting_rod/features.toml"
adapter = "flat_bar"
part = "ch-connecting-rod"

[parameters]
quantity = 20
# The adapter's axes: the rod's length along model Y, its thickness (the
# faces) along model Z.
blank_length_axis = 1
blank_thickness_axis = 2
# The blank: the 1/4 x 2 in flat, sawn 7.42-7.48 long: the 7.24 in rod with
# at least .12 in (3 mm) past the ring (end_margin_min_mm) and the crown at
# least crown_margin_min_mm short of the shortest blank's right end: the
# tape reads to 1/32 in (0.8 mm) and a miter-saw end is out of square by a
# few tenths across 2 in, so a blank the tape passes at 7.42 may be 1.1 mm
# short at the crown; the margin keeps the crown whole, and the slot's depth
# and the boss's length (both from the crown) in band (CR04 trims the end
# to the crown). Nine per 72 in length (9 × 7.48 + 8 × .125 kerf = 68.3 in,
# 3.7 in left): 18 from two lengths, two from the 36 in (2 × 7.48 + .125 =
# 15.1): 20.
blank_length_in = 7.42
blank_length_max_in = 7.48
blank_length_min_mm = 188.468
blank_length_max_mm = 189.992
blank_width_in = 2.0
blank_thickness_in = 0.25
# ASTM A108 cold-drawn flat, 2 in wide: thickness +.000/-.004.
blank_thickness_max_mm = 6.35
blank_thickness_min_mm = 6.2484
end_margin_min_mm = 3.0
crown_margin_min_mm = 1.5
# The ring's centre from the blank's left end; the crown's place from it
# (cam.py checks both against the export).
ring_from_end_mm = 23.5
crown_x_mm = 186.819
end_trim_max_mm = 3.173
# Two blanks per load across the jaws, each at its nominal width.
blanks_per_load = 2
blank_pitch_mm = 50.8
# Targets, each band's middle (cam.py checks them against the export): the
# heights above face D of the fork's far face, the ring's two faces and the
# shank's two faces; the rough floors .020 over each finished face, with F
# up (Z0 face D, below) and with D up (Z0 face D, on top).
fork_thickness_mm = 6.096
ring_near_mm = 0.889
ring_far_mm = 5.207
shank_near_mm = 1.27
shank_far_mm = 4.572
floor_stock_mm = 0.508
ring_rough_2_mm = 5.715
floor_rough_2_mm = 5.08
ring_rough_1_mm = -0.381
floor_rough_1_mm = -0.762
# Holding (shop workholding.vise-pm-6): the support plate (1/2 in 6061, 3.9
# x 6 in, its top faced) on two 1 in parallels (fixtures.parallels-lms-
# 6745), one against each jaw, its left edge with the blanks' left ends; the
# blanks on it, gripped by their edges. The jaws' top stands this far above
# the plate: over the blanks' top, so nothing but the pockets is cut.
parallel_height_mm = 25.4
support_plate_thickness_mm = 12.7
support_plate_width_mm = 99.06
support_plate_length_mm = 152.4
support_height_mm = 38.1
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
jaw_top_mm = 6.8453
# The jaws' left side .47 in right of X0, their right side short of the
# slot's floor, so the saw sweeps past them.
jaw_start_mm = 12.0
jaw_end_mm = 170.6738
# The bending screen (beam) in Setups 2-4: each blank lies on the plate and
# is gripped along both long edges (the jaw on one, its pair on the other)
# for the jaws' full 6 in, so a cut's lift and side push bend it across its
# width between its edges: a beam across Y over the blank's width, its
# section the blank's width along it (a long strip held on both edges
# carries a point load on about twice its span: half that, conservatively)
# by the thinnest web under any cut of the setup: Setup 2 the rough floor
# over D, Setup 3 the rough floor over D's finished floor, Setup 4 the shank.
# Every cut is screened at the blank's middle, the span's worst station.
blank_mid_mm = 25.4
web_d_finish_mm = 3.81
# The 1/2 in carbide end mill: rows along X no more than .300 apart, each
# face's levels no deeper than .0315 (0.8 mm); plunges into metal at 1
# in/min. Only the ring's zone is pocketed to the frame (each blank's edges
# outside the 1/8 in band round the ring, cam.py computes the half width, at
# least .060 of frame each side); along the shank the two middle rows clear
# the shank and the outline's kerf, and the waste beyond stays whole.
face_cutter_dia_mm = 12.7
pocket_level_max_mm = 0.8
pocket_woc_max_mm = 7.62
half_plunge_feed_per_min_mm = 25.4
pocket_half_width_mm = 23.622
frame_min_mm = 1.5
# The 1/8 in carbide end mill: the band round each ring (its wall down to
# the shank's face) in levels no deeper than .020; its plunges into metal at
# 1 in/min.
eighth_cutter_dia_mm = 3.175
eighth_plunge_feed_per_min_mm = 25.4
band_level_max_mm = 0.5
# Cuts through the waste, the ring's bore and the outline end this far past
# the face they break through.
through_mm = 0.254
# The fork slot: its floor's place from X0 (the crown less the slot's depth,
# band middle); the slitting saw (McMaster 3062A21: 2-3/4 in, .064 in, 72
# teeth) at 100 rpm, the mill's slowest, 72 ft/min at its rim
# (LittleMachineShop "Cutting Speeds", Milling, Plain carbon steels
# 1006-1026, HSS: 80-110 ft/min; read 2026-11-20); .001 in/tooth × 72 × 100 =
# 7.2 in/min, the lowest chip load prechips' force table holds (the author's
# choice). Its lower face at the near tine's wall, then .042 higher (.1090
# above Z0) so its
# upper face makes the far wall; each level in steps no deeper than
# slot_step_max_mm into the crown. The largest arbor spacer by the saw: 2 ×
# (the saw's radius − the slot's depth − 1.0 mm clear of the crown).
slot_floor_x_mm = 172.087
# The pin hole's centre from X0: the crown's centre. The saw's cut spreads
# over the slot's depth, from its floor to the crown: its force acts about
# halfway (the bending screen's station).
pin_x_mm = 181.866
slot_mid_x_mm = 179.453
saw_dia_mm = 69.85
saw_thickness_mm = 1.6256
saw_rpm = 100
saw_feed_per_min_mm = 182.88
saw_collar_dia_max_mm = 38.386
saw_low_mm = 1.7018
saw_high_mm = 2.7686
slot_step_max_mm = 15.0
slot_step_mm = 14.732
# The arbor round the saw, ASSUMED until it is bought (tools.gear-cutter-
# arbor-1; Setup 5 checks the real one at its mounting): below the saw at
# least .125 in of spacers, then the nut, all within .75 in of the saw's
# lower face; the nut no wider than 1.75 in across its corners. CR06 moves
# between passes with the saw's lower face at saw_clear_z_mm, the stack's
# lowest point .20 in (5 mm) over the stock top. Its passes run along +Y:
# with the saw turning clockwise seen from above (M3) right of the forks,
# that is conventional (along −Y it would climb and the saw could grab).
saw_spacer_below_min_mm = 3.175
saw_below_max_mm = 19.05
saw_nut_dia_max_mm = 44.45
saw_clear_z_mm = 30.4
# The saw's touch-off station: over the fork against the fixed jaw, the
# saw's rim 3 mm in over its crown (its centre the crown plus the saw's
# radius less 3 mm), the spacers and the nut past the crown. CR05 ends with
# T1 parked over it: up to saw_park_z_mm, along X past the crowns, along Y
# over the fork; there the arbor, swapped in for T1 (its lowest point no
# more than saw_arbor_length_mm from the nose, T1 at least its collet and
# its 1 in projection out), hangs 5 mm over the stock top.
saw_touch_x_mm = 218.744
saw_touch_y_mm = -25.4
saw_park_z_mm = 43.15
# The saw's and T3's Z0 touch-offs on the fork's F face: the fork's
# thickness plus the .002 leaf under the tool (cam.py checks it).
fork_touch_z_mm = 6.147
# The ring's bore Ø1.213 +.003/0: interpolated with the 1/2 in end mill, a
# plunge on the bore's centre and a circle at each level (no slug left), the
# rough .010 a side (.020 on the diameter) under the band's middle, then the finish circle
# full depth and a spring pass, clockwise (conventional inside), entered and
# left on half-circle arcs from and back to the bore's centre (no plunge on
# the wall, no rapid up it). cam.py computes the circles' radii.
bore_finish_mm = 0.254
bore_rough_radius_mm = 8.8201
bore_finish_radius_mm = 9.0741
# Pin hole: spot Ø.065 with the #1 carbide centre drill (under the #49, so no
# chamfer at the mouth), the #49 through the fork in pecks of .050 with full
# retracts, its full diameter .5 mm past face D (in the air past the plate's
# end), then the .0775 reamer through, its tip 1.0 mm past it, in
# and out at feed.
spot_dia_mm = 1.651
drill_past_mm = 0.5
ream_past_mm = 1.0
# The #49's tip below Z0: its full diameter drill_past_mm past face D plus
# its 118° point (the Setup 5 envelope's deepest cut).
drill_tip_mm = -1.057
# The pin MHA-SH-VN-58, McMaster 90145A299: 5/64 in, 0/+.0002 (.0781-.0783,
# cad/config/parts/sh-vn-pivot-pin.yaml): the .0775 reamer is .0004-.0008
# under it, inside the drawing's .0002-.0008 (sheet note 1).
pin_dia_min_mm = 1.98374
pin_dia_max_mm = 1.98882
# Speeds, authored in the operations: LittleMachineShop "Cutting Speeds",
# Drilling & Reaming, Plain carbon steels 1006-1026 (read 2026-11-20):
# drilling 60-100 ft/min, reaming 40-65. The #49 (.073) at 2800 rpm, the
# mill's top, is 54 ft/min; AutoDrill "Suggested drilling feed rates" (read
# 2026-11-20), Stl, Carbon, 1/16 in: .001 in/rev = 2.8 in/min. The #1 centre
# drill at 2800, .0005 in/rev = 1.4 in/min. The reamer at 2000 rpm (41
# ft/min), .002 in/rev = 4.0 in/min. The 5/64 in end mill: no shop setting;
# 2800 rpm, .001 in/tooth × 2 = 5.6 in/min, the lowest chip load prechips'
# force table holds (the author's choice).
spot_feed_per_min_mm = 35.56
drill_feed_per_min_mm = 71.12
ream_feed_per_min_mm = 101.6
root_feed_per_min_mm = 142.24
# The outline: the 1/8 in end mill round each rod at its radius outside the
# drawn edge, through the shank's thickness (both faces pocketed to the
# shank's over the kerf) in levels no deeper than .047 (1.2 mm, 0.37 of its
# diameter: three), from the shank's far face to .010 past its near face;
# open past the slot's floor, where CR04 cut round the fork's end.
# Seven tabs .100 wide and .060 thick on the shank's near face: two on the
# ring (its top, 90°, and its lower left, 225°, toward the moving jaw, where
# frame stands outside the kerf) and five along the shank, alternately on
# its top and bottom flanks, 27 to 140.5 mm from the ring's centre, so no
# stretch between tabs, nor the fork past the last, bends past prechips'
# finish limit under the cut. Each lap starts 83 mm out on the bottom flank.
outline_level_max_mm = 1.2
outline_level_mm = 1.185
tab_thickness_mm = 1.524
tab_top_mm = 2.794
tab_width_mm = 2.54
tab_top_1_x_mm = 27
tab_bottom_1_x_mm = 55
tab_top_2_x_mm = 83
tab_bottom_2_x_mm = 111
tab_top_3_x_mm = 140.5
tab_ring_1_deg = 90
tab_ring_2_deg = 225
outline_start_x_mm = 83
# The tabs' stations from X0 (cam.py checks them), and the outline's extent:
# the ring's far side to just past the slot's floor.
tab_station_1_mm = 9.042
tab_station_2_mm = 23.5
tab_station_3_mm = 50.5
tab_station_4_mm = 78.5
tab_station_5_mm = 106.5
tab_station_6_mm = 134.5
tab_station_7_mm = 164.0
rod_start_mm = 3.053
outline_end_mm = 173.087
# The roots: the title block's INSIDE CORNERS R.040 MAX; the 5/64 in end
# mill's radius .039 is under it. A side cut .024 wide (the 1/8 in cutter's
# radius less its own) at each corner, in levels no deeper than .047 (1.2
# mm, 0.6 of its diameter) through the shank's thickness; the bending
# screen takes it at the fork's step, the corner farthest from the ring
# (cam.py checks the cutter, the station and the width).
inside_corner_max_mm = 1.016
root_level_max_mm = 1.2
root_level_mm = 1.185
root_cutter_dia_mm = 1.984375
root_station_mm = 168.785
root_woc_mm = 0.595
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set at least 1 in out of the collet; 1/8
# in end mill, 1-1/2 in overall: at least .75 in out.
half_mill_projection_min_mm = 25.4
eighth_mill_projection_min_mm = 19.05
# The saw arbor (tools.gear-cutter-arbor-1): 2 in shoulder to nut; the saw
# is on it within that, so the whole arbor is under 2.5 in from the nose
# (ASSUMED, the arbor to buy): Setup 5's shortest tool, and the length the
# T1 park before it (saw_park_z_mm) allows for.
saw_arbor_length_mm = 63.5
# The reamer bounded by 2-1/2 in overall.
reamer_oal_mm = 63.5

