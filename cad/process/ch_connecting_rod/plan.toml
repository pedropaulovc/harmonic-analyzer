# The fork stands past the jaws' right end (the support plate stops short
# of it too): a cantilever from the jaws, screened on the fork's own section
# (the whole blank's runs on 1.4 mm past the jaws to the slot's floor).
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.crown_x_mm}}"], clamp_mm = ["{{process.jaw_start_mm}}", "{{process.jaw_end_mm}}"], section_mm = { y = "{{cad.fork_width_mm}}", z = "{{process.fork_thickness_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "First load only (the spacers stay on the arbor after): before mounting the saw, mic every spacer and collar of the R8 1 in spacer-type arbor (TTC 67-600-016, TO BUY) that will sit within 1/4 in above or below the saw, and the nut across its corners."
inspection = "Each spacer and collar under {{process.saw_collar_dia_max_mm:in.2dot}} in diameter, or it meets the fork's crown; the nut under {{process.saw_nut_dia_max_mm:in.2dot}} in across its corners. CR06 and the touch-off are laid out on these, assumed before the arbor was bought. Over: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Spindle stopped, the head where CR05_bore left it (T1 in line with the fork against the fixed jaw, past its crown, clear above it): do not jog X or Y. Take out the collet and T1. Do not move the blanks."
feed = "hand"

[[setups.operations]]
instruction = "Mount the arbor in the spindle (drawbar tight), the slitting saw on it between the spacers just checked, at least .25 in of them above the saw and at least {{process.saw_spacer_below_min_mm:in.3dot}} in below it, then the nut; the teeth cutting with the spindle turning clockwise (M3) seen from above."
inspection = "The arbor's lowest point (the nut's lower face, or the arbor's end if it stands past the nut) no more than {{process.saw_below_max_mm:in.2dot}} in below the saw's lower face (the calipers' depth rod): CR06 rises that much higher between its passes to carry it over the stock. Over: take spacers from below the saw (keep at least {{process.saw_spacer_below_min_mm:in.3dot}} in), or stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.saw_below_max_mm}}"] }]

[[setups.operations]]
instruction = "Only after a reset or homing ($H) since CR05_bore parked T1: from the homed Z, MDI G0 X{{process.saw_touch_x_mm:.3f}} Y{{process.saw_touch_y_mm:.3f}} (the station, X and Y only), then the touch-off below, Z only."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again, from the saw's lower face, its rim 3 mm in over that fork's crown, the spacers and the nut past it. Spindle stopped, jog Z only, down in CNCjs (.001 in steps near the leaf), until a .002 feeler leaf just drags under the saw on the fork's F face; G10 L20 P1 Z{{process.fork_touch_z_mm:.3f}} (the fork's {{process.fork_thickness_mm:.3f}} plus the leaf). CR06 loads no tool."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CR06_slot in air, Z0 raised 1.000 in: it rises straight to Z{{process.saw_clear_z_mm:.2f}} (the nut clear over the stock) before any X or Y move and between its passes; the saw clears the jaws, the frames' ends and both crowns. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Run CR06_slot (the saw; set 100): two passes along +Y across the whole load (conventional: the saw turns clockwise right of the forks), {{cad.fork_slot_depth_in:.3dot}} into both forks' crowns and the waste strips beside them: the first with the saw's lower face {{process.saw_low_mm:in.4dot}} above Z0 (the near tine's wall), the second {{process.saw_high_mm:in.4dot}} above Z0, its upper face making the far tine's wall. Cutting oil on the saw."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "fork slot", kind = "side", phase = "finish", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.slot_step_mm}}", stations_mm = "{{process.slot_mid_x_mm}}" },
]

[[setups.operations]]
instruction = "Every load, after CR06_slot ends, spindle stopped, still clamped: the fork slot of the blank against the fixed jaw (its depth on the first load only: X is not moved after CR04 trims the crown)."
inspection = "Width {{cad.fork_slot_width_min_in:.4dot}}–{{cad.fork_slot_width_max_in:.4dot}}: the .1040 gauge block enters the slot, the .1080 does not. First load: depth {{cad.fork_slot_depth_min_in:.3dot}}–{{cad.fork_slot_depth_max_in:.3dot}} from the crown: the calipers' depth rod. Near tine {{cad.fork_slot_near_tine_min_in:.4dot}}–{{cad.fork_slot_near_tine_max_in:.4dot}} and far tine {{cad.fork_slot_far_tine_min_in:.4dot}}–{{cad.fork_slot_far_tine_max_in:.4dot}}: the calipers' outside jaw tips across each tine at the crown. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "gauge-blocks-mitutoyo", band_mm = "{{cad.fork_slot_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_depth_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_near_tine_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_far_tine_band_mm}}" },
]

[[setups.operations]]
instruction = "Swap to the drill chuck. G54 Z0 again with T3, the #1 centre drill: console M6 T3, spindle stopped, its tip on a .002 leaf on the fork's F face of the blank against the fixed jaw ({{process.fork_thickness_mm:in.4dot}} above the plate), G10 L20 P1 Z{{process.fork_touch_z_mm:.3f}} (the fork's {{process.fork_thickness_mm:.3f}} plus the leaf). First load only: prove CR07_pin in air, Z0 raised 1.000 in, through each M6; then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CR07_pin (M6 T3; set 2800): spot each fork's pin hole on the crown's centre Ø{{process.spot_dia_mm:in.3dot}}."
rpm = 2800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-49"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: #49 drill through both tines of each fork, pecks of .050 with full retract, its full diameter {{process.drill_past_mm:in.3dot}} past face D into the air past the plate's end; set 2800. Cutting oil."
rpm = 2800
feed = "{{process.drill_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{process.fork_thickness_mm}}"
peck = { step_mm = 1.27, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 1.8542, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-0775"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.pin_hole_dia_band_mm}}" }
instruction = "Same file, M6 T5: ream each hole through with the .0775 reamer (to buy), in and out at feed, its tip {{process.ream_past_mm:in.3dot}} past face D (its full diameter through); set 2000. Cutting oil."
rpm = 2000
feed = "{{process.ream_feed_per_min_mm:in.1f}} in/min, in and out"
milling_cuts = [
  { name = "pin ream", kind = "drill", phase = "finish", cutter_dia_mm = 1.9685, flutes = 4, rpm = 2000, feed_mm_min = "{{process.ream_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
instruction = "First load and the first load after any reamer change, before the next load: gauge each hole with the Class ZZ pin-gauge pair (GO .0775 plus, NO-GO .0779 minus; TO BUY), then try the miked MHA-SH-VN-58 pin by hand in each hole, chamfered end first."
inspection = "Size Ø.0775–.0779: the GO enters through by hand, the NO-GO does not enter. Then the pin does not enter past its chamfer (note 1's press fit). Either fails: stop and tell the owner. The pin is pressed in only at assembly."
gauge_checks = "other"

[[setups.operations]]
instruction = "The pin hole's place from the bore: not gauged."
inspection = "The drawing's Ø{{cad.pin_hole_position_dia_in:.3dot}} position, {{cad.pin_hole_basic_from_a_in:.3f}} basic from the bore: process-held. The bore (CR05) and the pin hole (CR07) are cut in this one clamping from the same G54, {{cad.pin_hole_basic_from_a_in:.3f}} apart on the program. It is not gauged: measured over pins it spans more than the 6 in calipers reach."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Face F: outline on tabs"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Unchanged from Setups 4 and 5: the same load, F up, still clamped."
datum = "Program CR08_outline (T2, T6). G54 X0 and Y0 unchanged; Z0 as set with T3 in Setup 5 (the plate's top; the tool setter measures T2 and T6 at each M6): do not touch off again."
diagram = { file = "diagrams/outline.svg", alt = "The pair F up on the support plate; the 1/8 in end mill cuts each rod's outline through the waste on seven tabs, two on the ring and five along the shank, lifting past the fork's end; the 5/64 in end mill recuts the four inside corners." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.eighth_cutter_dia_mm}}", 5.08], y_span_mm = [101.6, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", 1.016], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", 50.8], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = 101.6, along_jaws_mm = "{{process.blank_length_min_mm}}", part_height_mm = "{{process.blank_thickness_max_mm}}", parallel_height_mm = "{{process.support_height_mm}}", overhang_mm = ["{{process.jaw_start_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = ["{{process.rod_start_mm}}", "{{process.outline_end_mm}}"], seat = "the blanks' frames, gripped along their edges by the jaws; the rods hang on their tabs in them, over the support plate", seat_mm = [0, "{{process.blank_length_min_mm}}"], clamps_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { y = "{{cad.shank_right_flank_width_mm}}", z = "{{cad.shank_far_face_thickness_mm}}" }, tabs = { stations_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { x = "{{process.tab_width_mm}}", z = "{{process.tab_thickness_mm}}" }, length_mm = "{{process.eighth_cutter_dia_mm}}" } }

[[setups.operations]]
instruction = "Back to the collet. First load only: prove CR08_outline in air, Z0 raised 1.000 in, through each M6. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run CR08_outline (M6 T2; set 2800): each rod's outline anticlockwise round its drawn edge through the waste, in levels from the shank's far face to .010 past its near face, lifting past the fork's end (cut in CR04); below {{process.tab_top_mm:in.3dot}} above Z0 the cutter lifts over seven tabs, {{process.tab_width_mm:in.3dot}} wide and {{process.tab_thickness_mm:in.3dot}} thick on the shank's near face: two on the ring, five along the shank, alternately top and bottom. Plunges into metal at {{process.eighth_plunge_feed_per_min_mm:in.1f}} in/min."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "outline", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_level_mm}}", radial_woc_mm = "{{process.eighth_cutter_dia_mm}}", traverse_mm = ["{{process.rod_start_mm}}", "{{process.outline_end_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-5-64"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T6 (5/64 in end mill, to buy; set 2800): the four inside corners of each rod, where the shank's flanks meet the ring and the fork's step, recut through the waste from the 1/8 in cutter's R.0625 to R.039, under the drawing's INSIDE CORNERS R.040 MAX."
rpm = 2800
feed = "{{process.root_feed_per_min_mm:in.2f}} in/min"
milling_cuts = [
  { name = "roots", kind = "side", phase = "finish", cutter_dia_mm = "{{process.root_cutter_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.root_feed_per_min_mm}}", axial_doc_mm = "{{process.root_level_mm}}", radial_woc_mm = "{{process.root_woc_mm}}", stations_mm = "{{process.root_station_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp the load and lift the blanks out, each rod hanging on its tabs in its frame. Back to the collet and T1: touch G54 Z0 on the bare plate's top again as at the start of Setup 4; if the first load's ring check lowered Z0, lower it again by the same amount (G10 L2 P1 Z, as there). Clamp the next pair as in Setup 4 and repeat Setups 4 to 6 from CR04_finish_2."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Break out, deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "A finished rod: the ring with its bore, the stepped-down shank, the fork with its slot through the thickness and the pin hole across both tines." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break each rod out of its frame: bend the frame at each tab until it snaps, or cut the tab with a hacksaw. File each tab's stub flush with the edge. Deburr the edges, the bore's, the slot's and the pin hole's mouths: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file and a scraper; clear the slot's burrs inside the pin hole with the reamer by hand; the NO-GO .0779 still does not enter. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "Inspect each rod; the first rod of the batch in full."
inspection = "Each rod: ring {{cad.ring_far_face_thickness_min_in:.4dot}}–{{cad.ring_far_face_thickness_max_in:.4dot}} thick (the micrometers; its near face and the bore were checked on the mill for every load); no tab stub standing proud. The first rod also: ring Ø{{cad.ring_dia_min_in:.2f}}–{{cad.ring_dia_max_in:.2f}}; shank {{cad.shank_far_face_thickness_min_in:.3dot}}–{{cad.shank_far_face_thickness_max_in:.3dot}} thick and {{cad.shank_right_flank_width_min_in:.2dot}}–{{cad.shank_right_flank_width_max_in:.2dot}} wide; the fork {{cad.fork_width_min_in:.2dot}}–{{cad.fork_width_max_in:.2dot}} wide and its step {{cad.fork_boss_length_min_in:.2dot}}–{{cad.fork_boss_length_max_in:.2dot}} from the crown (the micrometers, the calipers); later rods hold these on the program's path. The inside corners: process-held by the 5/64 in cutter in Setup 6 (R.039, under R.040 MAX). Outside: set it aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.ring_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ring_dia_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.shank_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.shank_right_flank_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_boss_length_band_mm}}" },
]

[[setups.operations]]
instruction = "Each rod, once free: the spring check. On the surface plate, face D down: the fork's D face on the plate and, under the ring's near face at its far side from the shank, a stack of feeler leaves {{cad.ring_near_face_offset_in:.3dot}} thick (.015 and .020). Press lightly on the shank's middle."
inspection = "The rod does not rock (no twist), and a .002 feeler leaf enters neither under the fork's D face nor between the ring's face and the stack (no bow): the ring's face is within .002 of its {{cad.ring_near_face_offset_in:.3dot}} below D once free, inside its {{cad.ring_near_face_offset_min_in:.4dot}}–{{cad.ring_near_face_offset_max_in:.4dot}} band. Rocks, or the leaf enters: set it straight by hand on the surface plate, the fork held flat on it, bending the shank back a little at a time (never at the bore or the fork); then repeat this check. Still rocks or the leaf still enters: set it aside and tell the owner."
gauge_checks = "other"

