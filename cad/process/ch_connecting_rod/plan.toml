# The width op's feed, as ch_channel_lever's (#3647): the cutter crosses the
# plate right to left (the table moving right), at most 10 in/min, each pass
# with the uncut edge in front of the cutter's centre (on its left with M3:
# conventional), three passes .250 apart, back to front, over the 1/2 edge.
# Delegated ruling 2026-11-26 (Main), no precedent (as D44 on
# ch_channel_lever, #3647); owner review #2144.
[[setups.operations]]
instruction = "Once per batch, before the first load: console M6 T1. Mill one long edge of the new support plate, stood on edge in the vise, in three passes back to front, the table moving right (conventional), at most 10 in/min, so the plate is 3.940–3.960 wide."
instruction_detailed = "Once per batch, before the first load, the parallels out of the vise. Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet). Calipers across the new support plate's width at its LEFT end: W. Stand the plate on one long edge on the parallel set's 5/32 in shim pair, one against each jaw, its two faces in the jaws, LEFT end to the left; tap it down onto both while closing the vise (the jaws grip the lower 1.61 of its 4 in). Spindle stopped, touch the T1 tip on the top edge at the LEFT end over a .002 feeler leaf and note Z (mm); lift, pull the leaf, jog clear past the plate's RIGHT end, set 2650 and start the spindle; bring Z to the noted Z less (.002 + W − 3.950) × 25.4. Take the top edge by hand jog in three passes along X, each with the table moving right (the cutter crossing the plate from its RIGHT end to its LEFT, the uncut edge in front of the cutter's centre: conventional), at most 10 in/min, the cutter running off both ends: first with its centre over the edge's back face, then .250 nearer you, then .250 nearer again; lift and return past the RIGHT end between passes. The plate is then 3.950 wide. Lift Z clear and stop the spindle before the next op."
feed = "hand"

[[setups.operations]]
instruction = "Once per batch: open the vise, lift the plate out and take the shim pair out; the plate's width. Then the 1 in parallels on the vise bed, one against each jaw, and the plate on them as in the Holding, its milled edge toward the moving jaw."
inspection = "3.940–3.960 (the calipers across the plate, at both ends and the middle): under the narrowest pair (3.990), so the jaws grip the blanks and never the plate, and at least .061 onto the 1/8 in moving parallel on the widest (4.004). Over 3.960: stand it back on the shim pair and take the edge again as in the op before (touch, three passes, the table moving right), with the LEFT-end reading in place of W, and recheck. Under 3.940: saw a new plate and start again from the op before."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.support_plate_width_min_mm}}", "{{process.support_plate_width_max_mm}}"] }]

[[setups.operations]]
instruction = "Once per batch, before the Y pick-up: face the support plate's top on the 1 in pair stacked on the 1/2 in pair, its top above the jaws. Take the plate and the 1 in pair out; set the 1 in pair on the 1/2 in pair against each jaw and the plate on them, LEFT edge to the left, milled edge toward the moving jaw; clamp it alone and face its top {{process.support_plate_face_mm:in.3dot}} with T1 by hand jog in overlapping passes, the cutter running off both long edges. Unclamp; the 1 in pair and the plate back as in the Holding."
feed = "hand"

[[setups.operations]]
instruction = "First load only, before the blanks go in (the plate on the parallels, the vise open): G54 Y0 the fixed jaw's face, edge finder (900 rpm); note the G54 Y (Setup 3 shifts it and Setup 4 sets it back)."
instruction_detailed = "Edge finder (900 rpm), its tip .10 below the jaw top, on the fixed jaw's face from the work side: G10 L20 P1 Y-2.540. Send $# and note the G54 line's Y (mm): the noted Setup 2 Y."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the support plate's top with T1, before the blanks go in (the plate alone on the parallels, as for the Y pick-up)."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the plate's top, the vise open and no blank on the plate: G10 L20 P1 Z0.051. The plate stays on the parallels when the blanks go in, so Z0 holds for every load."
feed = "hand"

[[setups.operations]]
instruction = "Clamp the pair as in the Holding. First load only: G54 X0 the blanks' flush left ends, edge finder (900 rpm). Later loads: the 1-2-3 block sets the ends flush with the plate's left edge, at the same X0."
instruction_detailed = "Edge finder (900 rpm), its tip .10 below the blanks' top, on the left end of the blank against the fixed jaw, from the left: G10 L20 P1 X-2.540."
feed = "hand"

# Not measured: owner (Pedro), 2026-11-22, on full-width passes: "same log
# new dechatter issues to try full radial depth but shallow axial" (#3428).
# CR01's cuts stay as they are, on the chart setting; this stop flags them.
[[setups.operations]]
instruction = "First load only: these CR01_rough_2 cuts at 2650 rpm have not been chatter-tested on this end mill (owner's test list #3428): fork skim .010 deep x {{process.face_cutter_dia_mm:in.3dot}} wide, rows .025 deep x {{process.face_cutter_dia_mm:in.3dot}} wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CR01_rough_2 (M6 T1; set 2650): the skim of each fork's face to {{process.fork_thickness_mm:in.4dot}} above Z0 (finished here); then each blank's ring zone and the band along its shank, rows along X, to {{process.ring_rough_2_mm:in.4dot}}, and the band to the rough floor {{process.floor_rough_2_mm:in.4dot}} round the ring; the fork's contour at each level."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "skim 2", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = 0.254, radial_woc_mm = "{{process.face_cutter_dia_mm}}", stations_mm = "{{process.blank_mid_mm}}" },
  { name = "rough 2", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = 0.635, radial_woc_mm = "{{process.face_cutter_dia_mm}}", traverse_mm = [0, "{{process.blank_pitch_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2 (1/8 in end mill, at least .75 in out; set 2800): the band round each ring, its circle in levels to the same rough floor."
diagram = { file = "diagrams/face_f-band.svg", alt = "From above: the 1/8 in end mill, to scale, at the start of its circle round ring 1's band. Section across the jaws through it: the end mill at the band's rough floor, between the jaws." }
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "band rough 2", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", axial_doc_mm = 0.3175, radial_woc_mm = "{{process.eighth_cutter_dia_mm}}", traverse_mm = [0, "{{process.blank_pitch_mm}}"] },
]

[[setups.operations]]
instruction = "First load only: unclamp, lift out the blank against the fixed jaw, mic the fork near its right end, then put it back flush and clamp again."
inspection = "Fork {{process.fork_thickness_mm:in.4dot}} ±.001 over D and F: this traveler's in-process target (the drawing prints the fork ({{cad.fork_far_face_thickness_in:.3dot}}) REF; the tines and the ring's faces are set from it). Over: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − (the reading − {{process.fork_thickness_mm:in.4dot}}) × 25.4), which lowers Z0, and run CR01_rough_2 again. Under: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = [6.0706, 6.1214] }]

[[setups.operations]]
instruction = "Unclamp the load and keep its two together; back to T1, clamp the next pair flush on the plate, its lower number against the fixed jaw, and repeat this setup from CR01_rough_2: X, Y and Z0 stay."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Face D: rough, reseat, finish"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Take the load's two blanks and turn them over together as one stack about its length (D up, F on the plate): the higher number against the fixed jaw, the lower (against it in Setup 2) against the moving jaw; numbers still at the left ends. Left ends flushed with the 1-2-3 block against the plate's left edge. Tap the blanks down while closing the vise."
datum = "Programs CR02_rough_1 and CR03_finish_1 (T1, T2). G54: X0 unchanged; Y0 the noted Setup 2 Y shifted by this load's width (op below); Z0 face D, the top of the blank against the fixed jaw (its pair agrees within .0005)."
diagram = { file = "diagrams/face_d.svg", alt = "From above: the pair D up, the higher number (2) against the fixed jaw; the 1/2 in end mill, to scale, on its first row along blank 2's ring zone and shank band, fed along +X. Section across the jaws: the blanks on the plate and parallels, the end mill just under face D." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = [101.6, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_min_mm}}", "{{process.floor_rough_1_mm}}", -0.508], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}", 50.8], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = 101.6, along_jaws_mm = "{{process.blank_length_min_mm}}", part_height_mm = "{{process.blank_thickness_max_mm}}", parallel_height_mm = "{{process.support_height_mm}}", overhang_mm = ["{{process.jaw_start_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "y", hold = "between", extent_mm = [0, "{{process.blank_pitch_mm}}"], supports_mm = [0, "{{process.blank_pitch_mm}}"], section_mm = { x = "{{process.blank_pitch_mm}}", z = "{{process.web_d_finish_mm}}" } }

# Turned over as one stack, the pair's F-side features lie mirrored about
# the load's middle, so both move by 4.000 - W across the jaws; one Y shift
# registers both blanks' D side on their F side (each turned over in its own
# place, blank 2's would miss by 1.5 x (2.000 - width), .0075 at 1.995).
# The cuts keep the frame (1.524 mm or more, cam.py) from each blank's
# edges, so from the jaws, after the shift.
