# MHA-CH-03 connecting rod, twenty, CNC-milled from 1/4 x 2 in 1018 cold-
# finished flat (stock.1018-flat-1-4x2-72in and -36in).
#
# Route: saw 20 blanks (nine from each of two 72 in bars, two from the 36 in), mic
# them and pair them by thickness; saw a 3.9 x 6 in support plate off the 1/2
# in 6061 flat once per batch. Every mill setup holds two blanks across the
# jaws on the plate on the 1 in parallels, each rod along its blank, the ring
# at the left end. Each face is pocketed only where the rod and its outline
# need it: the ring's zone to the blank's uncut edges (the frame), and along
# the shank a band the width of the shank and the outline's kerf; the ring
# and the fork stand as islands, the band goes down to the shank's face, the
# waste beyond it stays whole. Setup 2, face F (the fork's far face) up: skim
# the fork's face and rough F to .020 over its floors (CR01). Setup 3, face D
# (the datum face, kept as bought) up: rough D (CR02); release and reseat the
# blanks; finish D (CR03). Setup 4, F up again: trim the blank's right end to
# the fork's crown (CR04a); finish F and cut through round the fork's end (CR04);
# bore the ring, the rough levels then, after a speed stop, the finish
# circle (CR05). Setup 5, the same clamping: saw the fork slot (CR06);
# spot, drill and ream the pin hole (CR07). Setup 6, the same clamping: cut
# the outline on seven tabs, the 1/8 in end mill leaving the shank's four
# corners at its R.0625 (CR08). Setup 7, bench: break the rods out, file the
# stubs, deburr, inspect. Setup 8: black oxide in the shop, Presto Black
# Steel PC9.
#
# The route departs from the drawing's process (cad/config/parts/ch-
# connecting-rod.yaml), by the owner's ruling of 2026-11-21 (the author
# chooses the route for speed; the owner corrects afterwards): D stays as
# bought and F alone is skimmed .010 (not .005 off each fork face), and the
# bore, slot and pin hole are cut before the outline, the rod still in its
# frame (not after it). Both faces are still roughed in turns to .020 over,
# the blanks released and reseated, then both finished.
#
# Speed (owner's priority): NC 50 min per load of two (about 25 min a rod),
# from 100 in the first draft: only the ring's zone and the shank's band are
# pocketed (the waste beside the shank was pocketed on both faces), the skim
# covers the fork alone and the outline takes three levels instead of five.
# The 5/64 in corner recut and its tool change went with owner ruling
# 2026-11-23, tool audit Q9 (2 min and one M6 a load). The slot's light
# pass and its three steps a level, for the owned arbor's friction drive
# and its reserve, put 5 min a load back (CR06 7.5 min, from 2.1). The
# 1/2 in end mill's chart speed down to 2483 (owner ruling 2026-11-25) and
# the bore's finish circle at 1839 (its measured deep-wall setting) put
# about 1 min a load back.
#
# Workholding: the agent's recommendation (option A, the vise; owner's
# per-part choice pending, 2026-11-21). The plate supports the two blanks'
# inner edges; nothing cuts into it. A switch to a plate fixture replaces
# only Setup 6 (CR08) and its holding.
#
# The fork slot (.106 ±.002 through the fork's thickness, its floor under the
# title block's INSIDE CORNERS R.040 MAX) is sawn with the owned 2-3/4 x .064
# HSS slitting saw (McMaster 3062A21, 1 in hole) running horizontally, two
# levels per width, its rim cutting a square floor across the fork: an end
# mill on its side would leave R.047 or more there. The saw's arbor is the
# owned R8 stepped saw arbor (cad/config/shop-equipment/
# tools.saw-arbor-r8-stepped, owner 2026-11-24; shop key
# saw-arbor-r8-stepped): drawn up in the spindle, the saw on the 1 in step of
# its spring pilot, seated against the body's shoulder ABOVE it (the spindle
# side) and clamped by the cap and its M8 flat-head screw BELOW it. Body and
# cap are both 1.25 across, so the saw cuts at most
# saw_depth_past_arbor_max_mm (.711) past them: (2.75 - 1.25)/2 less
# saw_arbor_clear_mm; the slot's deepest .590 leaves .12 more. At every cut
# the forks' crowns stand beside the saw's rim; the body passes above the
# saw and the cap and screw below it, both beyond the crowns (cap to crown
# .17 at the full depth), never over the blanks, the plate or the jaws. NOT
# MEASURED, each a bounded assumption a STOP measures before the spindle
# starts: the screw head's stand past the cap's face
# (saw_screw_head_stand_max_mm) and the saw's runout (slot_saw_swept_*_mm,
# slot_saw_radial_tir_max_mm). The drive is friction alone (not keyed): the
# screw at 20 N·m, witness lines, a light first pass and a stop to look at
# them; the slot is cut in three steps a level (slot_step_max_mm), one step's
# handbook torque inside half the clamp's friction. CR06 and its touch-off are
# laid out on the record's sizes and those bounds (cam.py checks every move
# of the saw, the arbor's body, the cap and the screw head against the stock
# and the vise).
# Also to buy: the .0775 reamer (tools.reamer-0775). The shank's four
# corners take the 1/8 in end mill's R.0625 inside their printed R.065
# (.060-.070; owner ruling 2026-11-23, tool audit Q9): no 5/64 in end mill.
# The pin hole's size is gauged by a special
# Class ZZ pin-gauge pair, GO .0775 plus and NO-GO .0779 minus, TO BUY (as
# CH-01's; owner ruling 2026-11-21, "ill buy pin gauges", superseding the
# 2026-11-19 decision of #3124 item 5): a reamed hole is the reamer's size
# +.0005/0, wider than the drawing's .0004 band, so the reamer alone does
# not hold it; the pin-gauge sets on order (gauges.pin-gauges) step .001.
# The drawing's finish, matte black oxide (owner ruling 2026-11-20, #2348;
# all over, no masking), is done in the shop. The sheet prints it per
# MIL-DTL-13924 Class 1 until #3318 lands: that PR makes the callout a
# process-neutral "matte black oxide, oil sealed" (delegated ruling
# 2026-11-21, owner review #2144, following the owner's PC9 ruling below),
# and this plan merges after it. Setup 8 prints the sheet's callout as it is.
# Owner (Pedro), answered in person 2026-11-21: "Black oxide: cold
# blackening in the shop with Presto Black PC9 is acceptable as the
# drawing's black oxide." Setup 8 blackens the rods with Birchwood Presto
# Black Steel PC9 by the maker's instructions (Presto Black Steel PC9
# Instructions, steps 1 prepare, 2b brush-on, 3 stop, 4 dry, 6 seal), as
# CH-02's; the PC9 and the gloves and glasses are to buy (to_order).
#
# Zeroing: X0 the blanks' left ends, flushed with a 1-2-3 block, edge finder
# at 900 rpm; Y0 the fixed jaw, edge finder; Z0 with F up the plate's top,
# which is face D (touched with T1 on a .002 feeler leaf on the plate beside
# the blanks' left ends); with D up face D itself, on top.
#
# NC (cam:ch_connecting_rod, cad/process/ch_connecting_rod/cam.py):
# CR01_rough_2, CR02_rough_1, CR03_finish_1, CR04a_end_trim, CR04_finish_2,
# CR05_bore, CR06_slot, CR07_pin, CR08_outline. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2 1/8
# in end mill, T3 #1 centre drill, T4 #49 drill, T5 .0775 reamer, T6 the
# slitting saw (no tool-setter length; CR06 loads no tool).
title = "Connecting rod"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/4 x 2 in flat (the drawing's MATERIAL: Plain Carbon Steel; 1018 CF chosen)"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.0f}} in flat bar: two 72 in lengths and one 36 in; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks. Support plate: one 3.9 x 6 in piece of the 1/2 x 6 in 6061 flat."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Faces: D, the datum face (the fork's near face), stays as bought; F, the fork's far face, is skimmed in Setup 2. Mark D on each blank in Setup 1 and keep it readable. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once a session, not at every setup. A Reset after a Feed Hold keeps G54: no homing, no new zero. Pick up G54 X and Y once, in Setup 2, and again after any other controller reset, an alarm, a stall or an E-stop (FluidNC loses home: home first), except with the saw mounted (Setup 5): there $H brings the stored G54 back, the edge finder not fitting with the arbor in; the vise, the parallels and the plate stay put, so X and Y carry through Setups 2 to 6. Z0 is touched where each setup's Datum says. Setups 2 and 3 each run for all the loads in turn before the next; Setups 4, 5 and 6 are one clamping, run through on each load before the next load is clamped. To buy before Setup 5: the .0775 reamer and the Class ZZ pin-gauge pair (.0775 plus, .0779 minus). The slitting saw and its R8 stepped saw arbor are owned."
shop = "../shop"
stock_refs = ["1018-flat-1-4x2-72in", "1018-flat-1-4x2-36in", "6061-flat-1-2x6-54in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_connecting_rod/features.toml"
adapter = "flat_bar"
part = "ch-connecting-rod"

[parameters]
quantity = 20
# The adapter's axes: the rod's length along model Y, its thickness (the
# faces) along model Z.
blank_length_axis = 1
blank_thickness_axis = 2
# The blank: the 1/4 x 2 in flat, sawn 7.42-7.48 long: the 7.24 in rod with
# at least .12 in (3 mm) past the ring (end_margin_min_mm) and the crown at
# least crown_margin_min_mm short of the shortest blank's right end: the
# tape reads to 1/32 in (0.8 mm) and a miter-saw end is out of square by a
# few tenths across 2 in, so a blank the tape passes at 7.42 may be 1.1 mm
# short at the crown; the margin keeps the crown whole, and the slot's depth
# and the boss's length (both from the crown) in band (CR04a trims the end
# to the crown). Nine per 72 in length (9 × 7.48 + 8 × .125 kerf = 68.3 in,
# 3.7 in left): 18 from two lengths, two from the 36 in (2 × 7.48 + .125 =
# 15.1): 20.
blank_length_in = 7.42
blank_length_max_in = 7.48
blank_length_min_mm = 188.468
blank_length_max_mm = 189.992
blank_width_in = 2.0
blank_thickness_in = 0.25
# ASTM A108 cold-drawn flat, 2 in wide: thickness +.000/-.004.
blank_thickness_max_mm = 6.35
blank_thickness_min_mm = 6.2484
end_margin_min_mm = 3.0
crown_margin_min_mm = 1.5
# The ring's centre from the blank's left end; the crown's place from it
# (cam.py checks both against the export).
ring_from_end_mm = 23.5
crown_x_mm = 186.819
end_trim_max_mm = 3.173
# The end trim (CR04a_end_trim), on the measured deep setting
# (settings.em-half-carbide-1018-v6-deep, dechatter v6, 2026-11-22: stable
# 6.6 mm deep at 2.2 mm wide, chatter wider; cad/config/shop-equipment/
# measured-cuts.toml): the longest blank's excess in two passes of half of it
# each, every pass the full thickness and end_trim_run_past_mm past it, so
# 6.6 mm deep (the thickest blank plus the run-past; cam.py checks both). Along
