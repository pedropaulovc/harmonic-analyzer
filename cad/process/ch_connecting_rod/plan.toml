[[setups.operations]]
instruction = "Wash off the oil and the marker numbers (acetone). Finish: {{cad.finish}}, all over as the drawing states (no masking). Hot black oxide is not done in this shop (no line on record; the owned cold blue is not equivalent): send the rods out to a black-oxide shop with that callout."
