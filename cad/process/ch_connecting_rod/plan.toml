# tape reads to 1/32 in (0.8 mm) and a miter-saw end is out of square by a
# few tenths across 2 in, so a blank the tape passes at 7.42 may be 1.1 mm
# short at the crown; the margin keeps the crown whole, and the slot's depth
# and the boss's length (both from the crown) in band (CR04a trims the end
# to the crown). Nine per 72 in length (9 × 7.48 + 8 × .125 kerf = 68.3 in,
# 3.7 in left): 18 from two lengths, two from the 36 in (2 × 7.48 + .125 =
# 15.1): 20.
blank_length_in = 7.42
blank_length_max_in = 7.48
blank_length_min_mm = 188.468
blank_length_max_mm = 189.992
blank_width_in = 2.0
blank_thickness_in = 0.25
