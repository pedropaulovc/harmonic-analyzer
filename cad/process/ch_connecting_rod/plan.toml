# packing list's, not measured), so the calipers read it over two opposite
# tips on the first load: D. The deepest tooth cuts the floor half of (D
# less 2.750, plus the tips' total swing R) deeper than the file's depth,
# the band's middle: that sum within twice (the depth's most less its
# target less saw_depth_margin_mm, .002) either way: .016.
saw_swept_margin_mm = 0.0127
saw_depth_margin_mm = 0.0508
saw_axial_reading_per_in_mm = 23.091
slot_saw_swept_min_mm = 1.5748
slot_saw_swept_max_mm = 1.6637
slot_saw_axial_nominal_mm = 0.0346
slot_saw_radial_tir_max_mm = 0.4064
# The saw's touch-off station: over the fork against the fixed jaw, the
# saw's rim 3 mm in over its crown (its centre the crown plus the saw's
# radius less 3 mm), the cap and its screw beyond the crown. CR05 ends with
# T1 parked over it: up to saw_park_z_mm, along X past the crowns, along Y
# over the fork; there the arbor, swapped in for T1 (its lowest point no
# more than saw_arbor_length_mm from the nose, T1 its collet and its 1.12 in
# projection out), hangs 5 mm over the stock top. An R8 shank goes up into
# the spindle from below, so for every change of the arbor the builder jogs
# Z only, up, until the saw on it clears the blanks; X and Y stay, and Z0
# is touched again from the saw.
saw_touch_x_mm = 218.744
saw_touch_y_mm = -25.4
saw_park_z_mm = 17.748
# The saw's and T3's Z0 touch-offs on the fork's F face: the fork's
# thickness plus the .002 leaf under the tool (cam.py checks it).
fork_touch_z_mm = 6.147
# The ring's bore Ø1.213 +.005/0: interpolated with the 1/2 in end mill, a
# plunge on the bore's centre and a circle at each level (no slug left), the
# rough .010 a side (.020 on the diameter) under the band's middle, then the finish circle
# full depth and a spring pass, clockwise (conventional inside), entered and
# left on half-circle arcs from and back to the bore's centre (no plunge on
# the wall, no rapid up it). cam.py computes the circles' radii.
bore_finish_mm = 0.254
bore_rough_radius_mm = 8.8329
bore_finish_radius_mm = 9.086
# Pin hole: spot Ø.065 with the #1 carbide centre drill (under the #49, so no
# chamfer at the mouth), the #49 through the fork in pecks of .050 with full
# retracts, its full diameter .5 mm past face D (in the air past the plate's
# end), then the .0775 reamer through, its tip 1.0 mm past it (more than its
# chamfer + 0.25, so its full diameter passes by more than 0.25: cnc.toml
# cnc.ream-full-diameter, D45), in and out at feed.
spot_dia_mm = 1.651
drill_past_mm = 0.5
ream_past_mm = 1.0
# The #49's tip below Z0: its full diameter drill_past_mm past face D plus
# its 118° point (the Setup 5 envelope's deepest cut).
drill_tip_mm = -1.057
# Speeds, authored in the operations: LittleMachineShop "Cutting Speeds",
# Drilling & Reaming, Plain carbon steels 1006-1026 (read 2026-11-20):
# drilling 60-100 ft/min, reaming 40-65. The #49 (.073) at 2800 rpm, the
# mill's top, is 54 ft/min; AutoDrill "Suggested drilling feed rates" (read
# 2026-11-20), Stl, Carbon, 1/16 in: .001 in/rev = 2.8 in/min. The #1 centre
# drill at 2800, .0005 in/rev = 1.4 in/min. The reamer at 2000 rpm (41
# ft/min), .002 in/rev = 4.0 in/min.
spot_feed_per_min_mm = 35.56
drill_feed_per_min_mm = 71.12
ream_feed_per_min_mm = 101.6
# The outline: the 1/8 in end mill round each rod at its radius outside the
# drawn edge, through the shank's thickness (both faces pocketed to the
# shank's over the kerf) in levels no deeper than .047 (1.2 mm, 0.37 of its
# diameter: three), from the shank's far face to .010 past its near face;
# open past the slot's floor, where CR04 cut round the fork's end.
# Seven tabs .100 wide and .060 thick on the shank's near face: two on the
# ring (its top, 90°, and its lower left, 225°, toward the moving jaw, where
# frame stands outside the kerf) and five along the shank, alternately on
# its top and bottom flanks, 27 to 140.5 mm from the ring's centre, so no
# stretch between tabs, nor the fork past the last, bends past prechips'
# finish limit under the cut. Each lap starts 83 mm out on the bottom flank.
outline_level_max_mm = 1.2
outline_level_mm = 1.185
tab_thickness_mm = 1.524
tab_top_mm = 2.794
tab_width_mm = 2.54
tab_top_1_x_mm = 27
tab_bottom_1_x_mm = 55
tab_top_2_x_mm = 83
tab_bottom_2_x_mm = 111
tab_top_3_x_mm = 140.5
tab_ring_1_deg = 90
tab_ring_2_deg = 225
outline_start_x_mm = 83
# The tabs' stations from X0 (cam.py checks them), and the outline's extent:
# the ring's far side to just past the slot's floor.
tab_station_1_mm = 9.042
tab_station_2_mm = 23.5
tab_station_3_mm = 50.5
tab_station_4_mm = 78.5
tab_station_5_mm = 106.5
tab_station_6_mm = 134.5
tab_station_7_mm = 164.0
rod_start_mm = 3.053
outline_end_mm = 173.087
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"). The deep setting the end trim runs on
# was measured at 27.94 mm and allows 28.45 by that ruling, not by a cut: a
# longer tool is the less stiff case (cad/config/shop-equipment/
# measured-cuts.toml); 1/8 in end mill, 1-1/2 in overall: at least .75 in
# out.
half_mill_projection_mm = 28.45
eighth_mill_projection_min_mm = 19.05
# The saw arbor's lowest point from the spindle nose: the record's 1.4 in to
# the cap's lower face with no saw on (saw_arbor_nose_to_cap_mm) plus the
# .064 saw is 1.464; taken as 1.5 (saw_arbor_below_nose_mm), plus the screw
# head's stand bound: the length the T1 park before it (saw_park_z_mm)
# allows for (cam.py checks them). The saw's own Z is always touched off.
saw_arbor_below_nose_mm = 38.1
saw_arbor_length_mm = 41.148
# The reamer bounded by 2-1/2 in overall.
reamer_oal_mm = 63.5

