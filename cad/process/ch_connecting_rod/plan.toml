beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.crown_x_mm}}"], clamp_mm = ["{{process.jaw_start_mm}}", "{{process.jaw_end_mm}}"], section_mm = { y = "{{cad.fork_width_mm}}", z = "{{process.fork_thickness_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Every load, before the saw goes in: hold the combination square's blade flat against the jaws' right side, across the right ends of both parallels."
inspection = "The blade touches neither parallel: both end inside the jaws' right side. Past the forks the saw's cap and its screw pass up to {{process.saw_below_plate_top_mm:in.2dot}} below the plate's top, lower than the parallels' top. A parallel out: tap it in along its jaw until the blade clears it, the load still clamped."
gauge_checks = "other"

[[setups.operations]]
instruction = "First load, and again whenever the cap's screw has been loosened: mic the slitting saw's thickness at its rim, just inside the teeth, at four places a quarter turn apart, to .0001. Write the largest on this sheet: t. First load only: also the calipers across the tips of two opposite teeth, at three places round the saw. Write the largest: D."
inspection = "t {{process.slot_saw_swept_min_mm:in.4dot}}–{{process.slot_saw_swept_max_mm:in.4dot}}: two levels of it, the second {{process.slot_rise_mm:in.3dot}} higher, make the fork slot's {{cad.fork_slot_width_min_in:.4dot}}–{{cad.fork_slot_width_max_in:.4dot}} width. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.slot_saw_swept_min_mm}}", "{{process.slot_saw_swept_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "saw-arbor"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped (M5), the head where CR05_bore left it: do not jog X or Y. Jog Z only, up, until the arbor can go up into the spindle with its saw clear above the blanks. Take out the collet and T1. Wipe the R8 stepped saw arbor's shank and the spindle's taper clean and mount the arbor (drawbar tight). Do not move the blanks. Loads after the first: the saw is still clamped on it."
inspection = "Loads after the first: both witness lines on the saw (drawn below) unbroken. A line broken: the saw has turned on the arbor: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "First load, and whenever the screw has been loosened: wipe the arbor's shoulder, the saw's faces round its hole and the cap's face clean and dry (friction alone drives the saw). Saw on the pilot's 1 in step, up against the shoulder, teeth cutting with M3 (clockwise from above); cap under it; its M8 screw from below, the 5 mm hex bit on the torque wrench: {{process.saw_clamp_torque_nm:.0f}} N·m (15 ft·lb), spindle held as for the drawbar."
inspection = "No torque wrench covering 15 ft·lb with a 5 mm hex bit to hand, or the screw not torqued with it: stop: run no saw program; tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "First load only, before the spindle starts: lay the combination square's blade on edge across the cap's lower face, over the screw's head. If the head stands past the face, measure how far: the calipers' beam end on the head, the depth rod run up to the cap's face."
inspection = "The head flush with the cap's face or under it, or standing {{process.saw_screw_head_stand_max_mm:in.3dot}} or less: CR06 moves between its passes, and its air proof runs, with the cap and that much head clear over the stock. More: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.saw_screw_head_stand_max_mm}}"] }]

[[setups.operations]]
instruction = "First load, and whenever the screw has been loosened: with a marker draw two witness lines: one from the arbor's body across the shoulder onto the saw's upper face, one from the cap's rim onto the saw's lower face. A line that breaks later shows the saw has turned on the arbor."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Every load (the taper never seats the arbor quite the same twice): the lever indicator on its magnetic base on the vise, its tip up against the saw's lower face 1/8 in in from the teeth. Turn the spindle one turn by hand: the needle's total swing, in mm, is A. Wipe off any old LOW mark; mark LOW on the tooth that is over the tip where that face stands lowest."
inspection = "A ≤ ({{process.slot_saw_swept_max_mm:in.4dot}} − t) × {{process.saw_axial_reading_per_in_mm:.1f}} mm (t .0640: {{process.slot_saw_axial_nominal_mm:.3f}} mm): the saw's wobble then keeps the slot's width and the far tine in their bands. Over: take the arbor out, wipe its shank and the taper, mount it and read again. Still over: loosen the screw, wipe, turn the saw a quarter turn on the pilot, clamp to {{process.saw_clamp_torque_nm:.0f}} N·m, draw new witness lines and read again, then the tips' swing. Over after two such tries: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "dial-indicator"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "First load, and whenever the screw has been loosened: the .001 in dial indicator on its magnetic base, its plunger square on the tips of the teeth. Turn the spindle one turn backward by hand (counter-clockwise seen from above, so no tooth catches the plunger). The needle drops into every gullet: read its peaks, on the tips, only. R = the highest peak less the lowest."
inspection = "R + (D − {{process.saw_dia_mm:in.3dot}}) from −{{process.slot_saw_radial_tir_max_mm:in.3dot}} to {{process.slot_saw_radial_tir_max_mm:in.3dot}}: the file is posted for a {{process.saw_dia_mm:in.3dot}} saw, and the deepest tooth cuts the floor half that sum deeper, inside the slot's depth band. Over: re-seat the saw as for A and read both again. Over after two tries, or under: stop and tell the owner D and R."
gauge_checks = "other"

