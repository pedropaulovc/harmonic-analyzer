pin_x_mm = 181.866
slot_mid_x_mm = 179.453
saw_dia_mm = 69.85
saw_thickness_mm = 1.6256
saw_bore_mm = 25.4
saw_teeth = 72
saw_rpm = 100
saw_feed_per_min_mm = 182.88
saw_low_mm = 1.7018
saw_high_mm = 2.7686
slot_rise_mm = 1.0668
slot_step_max_mm = 5.0
slot_step_mm = 4.910667
slot_light_mm = 2.455333
# The owned R8 stepped saw arbor, from its record (cad/config/shop-
