speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Every load (the taper never seats the arbor quite the same twice): the lever indicator on its magnetic base on the vise, its tip up against the saw's lower face 1/8 in in from the teeth. Turn the spindle one turn by hand: the needle's total swing, in mm, is A. Wipe off any old LOW mark; mark LOW on the tooth that is over the tip where that face stands lowest."
inspection = "A ≤ ({{process.slot_saw_swept_max_mm:in.4dot}} − t) × {{process.saw_axial_reading_per_in_mm:.1f}} mm (t .0640: {{process.slot_saw_axial_nominal_mm:.3f}} mm): the saw's wobble then keeps the slot's width and the far tine in their bands. Over: take the arbor out, wipe its shank and the taper, mount it and read again. Still over: loosen the screw, wipe, turn the saw a quarter turn on the pilot, clamp to {{process.saw_clamp_torque_nm:.0f}} N·m, draw new witness lines and read again, then the tips' swing. Over after two such tries: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "dial-indicator"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "First load, and whenever the screw has been loosened: the .001 in dial indicator on its magnetic base, its plunger square on the tips of the teeth. Turn the spindle one turn backward by hand (counter-clockwise seen from above, so no tooth catches the plunger). The needle drops into every gullet: read its peaks, on the tips, only. R = the highest peak less the lowest."
inspection = "R + (D − {{process.saw_dia_mm:in.3dot}}) from −{{process.slot_saw_radial_tir_max_mm:in.3dot}} to {{process.slot_saw_radial_tir_max_mm:in.3dot}}: the file is posted for a {{process.saw_dia_mm:in.3dot}} saw, and the deepest tooth cuts the floor half that sum deeper, inside the slot's depth band. Over: re-seat the saw as for A and read both again. Over after two tries, or under: stop and tell the owner D and R."
gauge_checks = "other"

[[setups.operations]]
instruction = "Only if the mill had to be homed ($H) since CR05_bore parked T1 (a controller reset, an alarm, a stall or an E-stop): from the homed Z, MDI G0 X{{process.saw_touch_x_mm:.3f}} Y{{process.saw_touch_y_mm:.3f}} (the station, X and Y only), then the touch-off below, Z only."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again, from the saw's lower face: spindle stopped, turn the saw by hand until the tooth marked LOW is over the fork against the fixed jaw, the rim .118 in over its crown. Jog Z only, down in CNCjs (.001 in steps near the leaf), until a .002 feeler leaf just drags under the saw on the fork's F face; G10 L20 P1 Z{{process.fork_touch_z_mm:.3f}} (the fork's {{process.fork_thickness_mm:.3f}} plus the leaf). CR06 loads no tool."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Run CR06_slot (the saw; set 100): first one light pass along +Y across the whole load, {{process.slot_light_mm:in.3dot}} into both forks' crowns, the saw's lower face {{process.saw_low_mm:in.4dot}} above Z0 (conventional: clockwise right of the forks, each tooth cuts from the floor outward; fed the other way the saw would climb and turn on the arbor). Cutting oil on the saw. The file then stops (M0): spindle off, the saw raised clear past the fixed jaw."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "fork slot light", kind = "side", phase = "rough", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.slot_light_mm}}", stations_mm = "{{process.slot_mid_x_mm}}" },
]

[[setups.operations]]
instruction = "At CR06's M0 stop, the spindle stopped: look at both witness lines on the saw."
inspection = "Both unbroken: Cycle Start (the file restarts the spindle; 100 still set). A line broken: the saw has slipped on the arbor: do not restart; stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Same file, after Cycle Start: six more passes along +Y into both forks' crowns and the waste strips beside them, in three steps of {{process.slot_step_mm:in.3dot}} to {{cad.fork_slot_depth_in:.3dot}}: three with the saw's lower face {{process.saw_low_mm:in.4dot}} above Z0 (the near tine's wall), three with it {{process.saw_high_mm:in.4dot}} above Z0, its upper face making the far tine's wall."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "fork slot", kind = "side", phase = "finish", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.slot_step_mm}}", stations_mm = "{{process.slot_mid_x_mm}}" },
]

[[setups.operations]]
instruction = "Every load, after CR06_slot ends, spindle stopped, still clamped: the saw's witness lines, and the fork slot of the blank against the fixed jaw (its depth on the first load only: X is not moved after CR04a trims the crown)."
inspection = "Witness lines unbroken. Width {{cad.fork_slot_width_min_in:.4dot}}–{{cad.fork_slot_width_max_in:.4dot}}: the .1040 gauge block enters the slot, the .1080 does not. First load: depth {{cad.fork_slot_depth_min_in:.3dot}}–{{cad.fork_slot_depth_max_in:.3dot}} from the crown: the calipers' depth rod. Near tine {{cad.fork_slot_near_tine_min_in:.4dot}}–{{cad.fork_slot_near_tine_max_in:.4dot}} and far tine {{cad.fork_slot_far_tine_min_in:.4dot}}–{{cad.fork_slot_far_tine_max_in:.4dot}}: the calipers' outside jaw tips across each tine at the crown. Any outside, or a line broken (the saw slipped in the cut): stop and tell the owner."
gauge_checks = [
  { gauge = "gauge-blocks-mitutoyo", band_mm = "{{cad.fork_slot_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_depth_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_near_tine_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_far_tine_band_mm}}" },
]

[[setups.operations]]
instruction = "Jog Z only, up (X and Y untouched), until the clamped saw clears the blanks and the arbor can drop out of the spindle. Lift the arbor out, the saw still clamped on it (the screw untouched), and swap to the drill chuck."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again with T3, the #1 centre drill: console M6 T3, spindle stopped, its tip on a .002 leaf on the fork's F face of the blank against the fixed jaw ({{process.fork_thickness_mm:in.4dot}} above the plate), G10 L20 P1 Z{{process.fork_touch_z_mm:.3f}} (the fork's {{process.fork_thickness_mm:.3f}} plus the leaf)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CR07_pin (M6 T3; set 2800): spot each fork's pin hole on the crown's centre Ø{{process.spot_dia_mm:in.3dot}}."
rpm = 2800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-49"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: #49 drill through both tines of each fork, pecks of .050 with full retract, its full diameter {{process.drill_past_mm:in.3dot}} past face D into the air past the plate's end; set 2800. Cutting oil."
diagram = { file = "diagrams/fork-drill.svg", alt = "Section along fork 1: the #49 drill, to scale, through both tines either side of the slot, its point just under face D, in the air. From above: the drill in fork 1's pin hole." }
rpm = 2800
feed = "{{process.drill_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{process.fork_thickness_mm}}"
peck = { step_mm = 1.27, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 1.8542, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-0775"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.pin_hole_dia_band_mm}}" }
instruction = "Same file, M6 T5: ream each hole through with the .0775 reamer, in and out at feed, its tip {{process.ream_past_mm:in.3dot}} past face D (its full diameter through); set 2000. Cutting oil."
diagram = { file = "diagrams/fork-ream.svg", alt = "Section along fork 1: the .0775 reamer, to scale, through both tines either side of the slot, its tip just under face D, in the air. From above: the reamer in fork 1's pin hole." }
rpm = 2000
feed = "{{process.ream_feed_per_min_mm:in.1f}} in/min, in and out"
milling_cuts = [
  { name = "pin ream", kind = "drill", phase = "finish", cutter_dia_mm = 1.9685, flutes = 4, rpm = 2000, feed_mm_min = "{{process.ream_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
instruction = "Every load, before the next: try an MHA-SH-VN-58 pin by hand in each hole, chamfered end first, and take it out again."
inspection = "The pin does not enter past its chamfer by hand (note 1: press fit; the pin is pressed in only at assembly, MHA-CH-00). It enters: try the set's .079 pin in that hole. The .079 does not enter: do not scrap the rod; write SLIP on its tag (MHA-CH-00 bonds its pin). The .079 enters: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "The pin hole's place from the bore: not gauged."
inspection = "The drawing's Ø{{cad.pin_hole_position_dia_in:.3dot}} position, {{cad.pin_hole_basic_from_a_in:.3f}} basic from the bore: process-held. The bore (CR05) and the pin hole (CR07) are cut in this one clamping from the same G54, {{cad.pin_hole_basic_from_a_in:.3f}} apart on the program. It is not gauged: measured over pins it spans more than the 6 in calipers reach."
gauge_checks = "other"

