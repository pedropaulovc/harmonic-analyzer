# .14); and screw_engagement_no_saw_mm 10.0 (the owner's 8 turns from first
# bite to seated). With this saw between the shoulder and the cap the thread
# holds by 10.0 less the saw's thickness, 8.4 mm: over one screw diameter
# (saw_screw_dia_mm; cam.py checks it). One face's friction on the ring
# between the 1 in pilot and the 1.25 cap (mean radius 14.35 mm) carries
# .14 × 11 kN × 14.35 mm = 22.1 N·m (saw_drive_torque_max_nm). That
# friction and preload are a table's, not measured, and the saw runs oiled:
# a pass may take half of it at most (cam.py's DRIVE_RESERVE: oil in the
# clamp, friction .10, under a preload a quarter low would leave 11.8 N·m).
# One step of the slot, .193 into the crowns at the full .064 width, takes
# 8.7 N·m by the handbook's milling power; two steps a level would take
# 13.1 each, over half the drive, and the whole .580 in one 26: hence
# slot_step_max_mm (cam.py checks them). CR06's first pass is half a step
# (slot_light_mm); the file then stops (M0, spindle off) for a look at the
