# blanks on it, gripped by their edges. The jaws' top stands this far above
# the plate: over the blanks' top, so nothing but the pockets is cut.
parallel_height_mm = 25.4
support_plate_thickness_mm = 12.7
support_plate_width_mm = 99.06
support_plate_length_mm = 152.4
support_height_mm = 38.1
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
jaw_top_mm = 6.8453
# The jaws' left side .47 in right of X0, their right side short of the
