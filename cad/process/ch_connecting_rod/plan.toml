]

[[setups.operations]]
instruction = "Unclamp the load and lift the blanks out, each rod hanging on its tabs in its frame. Back to the collet and T1: touch G54 Z0 on the bare plate's top again as at the start of Setup 4. Clamp the next pair as in Setup 4, its lower number against the fixed jaw, and repeat Setups 4 to 6 from CR04a_end_trim."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Break out, deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "A finished rod: the ring with its bore, the stepped-down shank, the fork with its slot through the thickness and the pin hole across both tines." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break each rod out of its frame: bend the frame at each tab until it snaps, or cut the tab with a hacksaw. File each tab's stub flush with the edge. Deburr the edges, the bore's, the slot's and the pin hole's mouths: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file and a scraper; clear the slot's burrs inside the pin hole with the reamer by hand. Wash off the oil."
feed = "hand"
inspection = "Each rod: the edges, the bore's, the slot's and the pin hole's mouths broken, no burr left in the slot or the pin hole."
gauge_checks = "other"

[[setups.operations]]
instruction = "Each rod, after the reamer: try an MHA-SH-VN-58 pin by hand in its pin hole again, chamfered end first, and take it out again."
inspection = "The reamer by hand may have opened the hole: the same try as on the mill. The pin does not enter past its chamfer by hand. It enters: try the set's .079 pin in that hole. The .079 does not enter: do not scrap the rod; write SLIP on its tag, if not already there (MHA-CH-00 bonds its pin). The .079 enters: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Inspect each rod; the first rod of the batch in full."
inspection = "Each rod: ring {{cad.ring_far_face_thickness_min_in:.4dot}}–{{cad.ring_far_face_thickness_max_in:.4dot}} thick (the micrometers; its near face and the bore were checked on the mill for every load); no tab stub standing proud. The first rod also: ring Ø{{cad.ring_dia_min_in:.2f}}–{{cad.ring_dia_max_in:.2f}}; shank {{cad.shank_far_face_thickness_min_in:.3dot}}–{{cad.shank_far_face_thickness_max_in:.3dot}} thick and {{cad.shank_right_flank_width_min_in:.2dot}}–{{cad.shank_right_flank_width_max_in:.2dot}} wide; the fork {{cad.fork_width_min_in:.2dot}}–{{cad.fork_width_max_in:.2dot}} wide and its step {{cad.fork_boss_length_min_in:.2dot}}–{{cad.fork_boss_length_max_in:.2dot}} from the crown (the micrometers, the calipers); later rods hold these on the program's path. The shank's four corners at the ring and the fork's step, R{{cad.shank_right_flank_corner_r_min_in:.3dot}}–{{cad.shank_right_flank_corner_r_max_in:.3dot}}: process-held by the 1/8 in end mill's R.0625 in Setup 6. Outside: set it aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.ring_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ring_dia_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.shank_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.shank_right_flank_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_boss_length_band_mm}}" },
]

[[setups.operations]]
instruction = "Each rod, once free: the spring check. On the surface plate, face D down: the fork's D face on the plate and, under the ring's near face at its far side from the shank, a stack of feeler leaves {{cad.ring_near_face_offset_in:.3dot}} thick (.015 and .020). Press lightly on the shank's middle."
inspection = "The rod does not rock (no twist), and a .002 feeler leaf enters neither under the fork's D face nor between the ring's face and the stack (no bow): the ring's face is within .002 of its {{cad.ring_near_face_offset_in:.3dot}} below D once free, inside its {{cad.ring_near_face_offset_min_in:.4dot}}–{{cad.ring_near_face_offset_max_in:.4dot}} band. Rocks, or the leaf enters: set it straight by hand on the surface plate, the fork held flat on it, bending the shank back a little at a time (never at the bore or the fork); then repeat this check. Still rocks or the leaf still enters: set it aside and tell the owner."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Black oxide: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished rod, as inspected, to be blackened all over: the ring, the shank, the fork, the bore, the slot and the pin hole." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, all over as the drawing states (no masking), done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the rods with soap and water to take off the oil and any marker left on them; rinse and dry them. Hold each by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff both faces of each rod lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping them flat. Not in the bore, the slot or the pin hole. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface of each rod with even, light strokes, into the bore, the slot and the pin hole; re-wet the brush and go over the edges, the slot, the holes and any light spot until the rod is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse each rod thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air, blowing out the slot and the pin hole. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over each rod, no bare spot and no wiping-off coating."
gauge_checks = "other"
