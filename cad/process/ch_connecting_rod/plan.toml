# holds these to it): the body above the saw (body_dia_above_saw_in), the
# cap below it (cap_dia_in, cap_thickness_in), the screw's head
# (screw_head_dia_in) and the cap's lower face below the spindle nose with
# no saw on (below_spindle_nose_in).
saw_arbor_body_dia_mm = 31.75
saw_arbor_cap_dia_mm = 31.75
saw_arbor_cap_thickness_mm = 12.7
saw_arbor_screw_head_dia_mm = 15.8242
saw_arbor_nose_to_cap_mm = 35.56
# The saw cuts no deeper past the arbor than its radius less the wider of
# body and cap, less saw_arbor_clear_mm: (69.85 - 31.75)/2 - 1.0 = 18.05
# (.711), on both sides of the saw (cam.py checks the slot's deepest limit,
# .590, against it).
saw_arbor_clear_mm = 1.0
saw_depth_past_arbor_max_mm = 18.05
# NOT MEASURED: how far the screw's head stands past the cap's lower face
# (countersunk: normally flush or under). A bounded assumption, .120: the
# largest, to .005, at which CR06's 1.000 in air proof still carries the
# head 5 mm over the stock top (cam.py checks it); Setup 5 measures it on
# the first load, before the spindle starts. The stack below the saw's lower
# face is the cap plus that (saw_below_max_mm); CR06 moves between passes
# with that stack 5 mm over the stock top (saw_clear_z_mm; cam.py checks
# every move of the body, the cap and the screw head, after the saw's first
# rise from the touch-off, against the stock, the plate and the vise, as cut
# and as proved in air). Its passes run along +Y: with the saw turning
# clockwise seen from above (M3) right of the forks, that is conventional
# (along −Y it would climb: the saw would grab and turn on the arbor).
saw_screw_head_stand_max_mm = 3.048
saw_below_max_mm = 15.748
saw_clear_z_mm = 27.098
# At the cut that stack passes saw_below_plate_top_mm (.55) below Z0, the
# plate's top: the stack's depth less saw_low_mm, lower than the parallels'
# top (the plate's thickness below Z0). It passes beyond the crowns, .80 or
# more past the jaws' right side (cam.py checks it against the vise as far
# as that side); Setup 5 checks, every load, that no parallel stands past
# that side.
saw_below_plate_top_mm = 14.0462
# The drive (record keyed = false): the cap's screw clamps the saw between
# the shoulder and the cap. From the record: screw_thread M8 x 1.25 (the
# pitch gauged by the owner, the M8 read from the head),
# screw_key_mm_inferred 5, clamp_torque_nm 20 (saw_clamp_torque_nm): about
