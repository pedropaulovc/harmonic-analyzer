  { gauge = "gauge-blocks-mitutoyo", band_mm = "{{cad.fork_slot_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_depth_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_near_tine_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_slot_far_tine_band_mm}}" },
]

[[setups.operations]]
instruction = "Jog Z only, up (X and Y untouched), until the clamped saw clears the blanks and the arbor can drop out of the spindle. Lift the arbor out, the saw still clamped on it (the screw untouched), and swap to the drill chuck."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0 again with T3, the #1 centre drill: console M6 T3, spindle stopped, its tip on a .002 leaf on the fork's F face of the blank against the fixed jaw ({{process.fork_thickness_mm:in.4dot}} above the plate), G10 L20 P1 Z{{process.fork_touch_z_mm:.3f}} (the fork's {{process.fork_thickness_mm:.3f}} plus the leaf). First load only: prove CR07_pin in air, Z0 raised 1.000 in, through each M6; then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CR07_pin (M6 T3; set 2800): spot each fork's pin hole on the crown's centre Ø{{process.spot_dia_mm:in.3dot}}."
rpm = 2800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-49"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: #49 drill through both tines of each fork, pecks of .050 with full retract, its full diameter {{process.drill_past_mm:in.3dot}} past face D into the air past the plate's end; set 2800. Cutting oil."
rpm = 2800
feed = "{{process.drill_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{process.fork_thickness_mm}}"
peck = { step_mm = 1.27, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 1.8542, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-0775"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.pin_hole_dia_band_mm}}" }
instruction = "Same file, M6 T5: ream each hole through with the .0775 reamer (to buy), in and out at feed, its tip {{process.ream_past_mm:in.3dot}} past face D (its full diameter through); set 2000. Cutting oil."
rpm = 2000
feed = "{{process.ream_feed_per_min_mm:in.1f}} in/min, in and out"
milling_cuts = [
  { name = "pin ream", kind = "drill", phase = "finish", cutter_dia_mm = 1.9685, flutes = 4, rpm = 2000, feed_mm_min = "{{process.ream_feed_per_min_mm}}", stations_mm = "{{process.pin_x_mm}}" },
]

[[setups.operations]]
instruction = "First load and the first load after any reamer change, before the next load: gauge each hole with the Class ZZ pin-gauge pair (GO .0775 plus, NO-GO .0779 minus; TO BUY), then try the miked MHA-SH-VN-58 pin by hand in each hole, chamfered end first."
inspection = "Size Ø.0775–.0779: the GO enters through by hand, the NO-GO does not enter. Then the pin does not enter past its chamfer (note 1's press fit). Either fails: stop and tell the owner. The pin is pressed in only at assembly."
gauge_checks = "other"

[[setups.operations]]
instruction = "The pin hole's place from the bore: not gauged."
inspection = "The drawing's Ø{{cad.pin_hole_position_dia_in:.3dot}} position, {{cad.pin_hole_basic_from_a_in:.3f}} basic from the bore: process-held. The bore (CR05) and the pin hole (CR07) are cut in this one clamping from the same G54, {{cad.pin_hole_basic_from_a_in:.3f}} apart on the program. It is not gauged: measured over pins it spans more than the 6 in calipers reach."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Face F: outline on tabs"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Unchanged from Setups 4 and 5: the same load, F up, still clamped."
datum = "Program CR08_outline (T2). G54 X0 and Y0 unchanged; Z0 as set with T3 in Setup 5 (the plate's top; the tool setter measures T2 at its M6): do not touch off again."
diagram = { file = "diagrams/outline.svg", alt = "The pair F up on the support plate; the 1/8 in end mill cuts each rod's outline through the waste on seven tabs, two on the ring and five along the shank, lifting past the fork's end; its radius leaves the four corners where the shank meets the ring and the fork's step." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.eighth_cutter_dia_mm}}", 5.08], y_span_mm = [101.6, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", 1.016], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", 50.8], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = 101.6, along_jaws_mm = "{{process.blank_length_min_mm}}", part_height_mm = "{{process.blank_thickness_max_mm}}", parallel_height_mm = "{{process.support_height_mm}}", overhang_mm = ["{{process.jaw_start_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = ["{{process.rod_start_mm}}", "{{process.outline_end_mm}}"], seat = "the blanks' frames, gripped along their edges by the jaws; the rods hang on their tabs in them, over the support plate", seat_mm = [0, "{{process.blank_length_min_mm}}"], clamps_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { y = "{{cad.shank_right_flank_width_mm}}", z = "{{cad.shank_far_face_thickness_mm}}" }, tabs = { stations_mm = ["{{process.tab_station_1_mm}}", "{{process.tab_station_2_mm}}", "{{process.tab_station_3_mm}}", "{{process.tab_station_4_mm}}", "{{process.tab_station_5_mm}}", "{{process.tab_station_6_mm}}", "{{process.tab_station_7_mm}}"], section_mm = { x = "{{process.tab_width_mm}}", z = "{{process.tab_thickness_mm}}" }, length_mm = "{{process.eighth_cutter_dia_mm}}" } }

[[setups.operations]]
instruction = "Back to the collet. First load only: prove CR08_outline in air, Z0 raised 1.000 in, through its M6. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run CR08_outline (M6 T2; set 2800): each rod's outline anticlockwise round its drawn edge through the waste, in levels from the shank's far face to .010 past its near face, lifting past the fork's end (cut in CR04); below {{process.tab_top_mm:in.3dot}} above Z0 the cutter lifts over seven tabs, {{process.tab_width_mm:in.3dot}} wide and {{process.tab_thickness_mm:in.3dot}} thick on the shank's near face: two on the ring, five along the shank, alternately top and bottom. Plunges into metal at {{process.eighth_plunge_feed_per_min_mm:in.1f}} in/min."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "outline", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.eighth_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_level_mm}}", radial_woc_mm = "{{process.eighth_cutter_dia_mm}}", traverse_mm = ["{{process.rod_start_mm}}", "{{process.outline_end_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp the load and lift the blanks out, each rod hanging on its tabs in its frame. Back to the collet and T1: touch G54 Z0 on the bare plate's top again as at the start of Setup 4. Clamp the next pair as in Setup 4 and repeat Setups 4 to 6 from CR04a_end_trim."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Break out, deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "A finished rod: the ring with its bore, the stepped-down shank, the fork with its slot through the thickness and the pin hole across both tines." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break each rod out of its frame: bend the frame at each tab until it snaps, or cut the tab with a hacksaw. File each tab's stub flush with the edge. Deburr the edges, the bore's, the slot's and the pin hole's mouths: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file and a scraper; clear the slot's burrs inside the pin hole with the reamer by hand. Wash off the oil."
feed = "hand"
inspection = "Each rod, after the reamer: the NO-GO .0779 pin does not enter the pin hole. Enters: set the rod aside and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "Inspect each rod; the first rod of the batch in full."
inspection = "Each rod: ring {{cad.ring_far_face_thickness_min_in:.4dot}}–{{cad.ring_far_face_thickness_max_in:.4dot}} thick (the micrometers; its near face and the bore were checked on the mill for every load); no tab stub standing proud. The first rod also: ring Ø{{cad.ring_dia_min_in:.2f}}–{{cad.ring_dia_max_in:.2f}}; shank {{cad.shank_far_face_thickness_min_in:.3dot}}–{{cad.shank_far_face_thickness_max_in:.3dot}} thick and {{cad.shank_right_flank_width_min_in:.2dot}}–{{cad.shank_right_flank_width_max_in:.2dot}} wide; the fork {{cad.fork_width_min_in:.2dot}}–{{cad.fork_width_max_in:.2dot}} wide and its step {{cad.fork_boss_length_min_in:.2dot}}–{{cad.fork_boss_length_max_in:.2dot}} from the crown (the micrometers, the calipers); later rods hold these on the program's path. The shank's four corners at the ring and the fork's step, R{{cad.shank_right_flank_corner_r_min_in:.3dot}}–{{cad.shank_right_flank_corner_r_max_in:.3dot}}: process-held by the 1/8 in end mill's R.0625 in Setup 6. Outside: set it aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.ring_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ring_dia_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.shank_far_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.shank_right_flank_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.fork_boss_length_band_mm}}" },
]

[[setups.operations]]
instruction = "Each rod, once free: the spring check. On the surface plate, face D down: the fork's D face on the plate and, under the ring's near face at its far side from the shank, a stack of feeler leaves {{cad.ring_near_face_offset_in:.3dot}} thick (.015 and .020). Press lightly on the shank's middle."
inspection = "The rod does not rock (no twist), and a .002 feeler leaf enters neither under the fork's D face nor between the ring's face and the stack (no bow): the ring's face is within .002 of its {{cad.ring_near_face_offset_in:.3dot}} below D once free, inside its {{cad.ring_near_face_offset_min_in:.4dot}}–{{cad.ring_near_face_offset_max_in:.4dot}} band. Rocks, or the leaf enters: set it straight by hand on the surface plate, the fork held flat on it, bending the shank back a little at a time (never at the bore or the fork); then repeat this check. Still rocks or the leaf still enters: set it aside and tell the owner."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Black oxide: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished rod, as inspected, to be blackened all over: the ring, the shank, the fork, the bore, the slot and the pin hole." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, all over as the drawing states (no masking), done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the rods with soap and water to take off the oil and any marker left on them; rinse and dry them. Hold each by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff both faces of each rod lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping them flat. Not in the bore, the slot or the pin hole. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface of each rod with even, light strokes, into the bore, the slot and the pin hole; re-wet the brush and go over the edges, the slot, the holes and any light spot until the rod is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse each rod thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air, blowing out the slot and the pin hole. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over each rod, no bare spot and no wiping-off coating. Fit after blackening: the GO .0775 pin still enters the pin hole. Tight: stop and tell the owner; do not re-ream."
gauge_checks = "other"
