[[setups]]
machine_kind = "other"
title = "Saw, mic and pair the blanks; the support plate"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "A 72 in length of the 1/4 x 2 in flat marked into nine 7.42–7.48 in blanks with kerfs between; beside it the 1/2 x 6 in aluminium flat with a 4 in piece marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long: nine from each of the two 72 in lengths and two from the 36 in, each marked off with the tape. File the burrs off both ends."
feed = "hand"
inspection = "Each blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long, from the filed left end: the calipers' jaws over the first 6 in, the tape for the rest. Shorter: it will not clean up at the crown, saw another; longer: CR04's end trim is laid out for {{process.blank_length_max_in:.2f}}, saw it again."
gauge_checks = "other"

[[setups.operations]]
instruction = "Mic each blank's thickness at both ends and the middle, and its width at the middle. Mark one wide face D with marking fluid along its length; the other is F. Number the blanks 1–{{process.quantity:d}} in marker on one sawn end face (no cut reaches it); that end is the left end in every setup. Write each blank's width (to .0001) beside its number. Pair them into loads of two whose thickness readings agree within .0005, and keep each load's two together."
inspection = "Every thickness reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}}: this traveler's incoming-stock gate (the fork, ({{cad.fork_far_face_thickness_in:.3dot}}) REF on the drawing, is skimmed from F to this traveler's {{process.fork_thickness_mm:in.4dot}}). Width 1.9950–2.0020: this traveler's gate, which keeps the support plate (3.940–3.960) narrower than any pair and on the moving parallel under the widest, and the frame beside each ring. Outside either: set the blank aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.blank_width_min_mm}}", "{{process.blank_width_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Once per batch: saw a 4.0 in piece off the end of the 1/2 x 6 in 6061 flat (the support plate, 4.0 x 6 in; 3.98–4.06 across it by the calipers, else saw another), file its burrs, and mark one 4 in edge LEFT: its 6 in length runs along X under the blanks, its 4 in across the jaws. Setup 2 mills one long edge so it is narrower than the pair, then faces it; it is kept for every load."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Face F: skim and rough"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the vise bed, one against each jaw; the support plate on them, its LEFT edge to the left and its milled edge toward the moving jaw. A pair of blanks side by side across the jaws on the plate, each on its D face (F up), numbers to the left, the lower number against the fixed jaw. Hold a 1-2-3 block's 2 in face across the two left ends and the plate's left edge and push them flush; then set the jaws' left side {{process.jaw_start_mm:in.2dot}} right of the ends (the calipers' depth rod) and close the vise on the blanks (the plate, narrower than the load, is not gripped), tapping them down onto the plate."
datum = "Program CR01_rough_2 (T1, T2). G54: X0 the blanks' left ends, Y0 the fixed jaw's face, Z0 the support plate's top (face D). +X toward the blanks' right ends, +Y toward the fixed jaw."
diagram = { file = "diagrams/face_f.svg", alt = "From above: the two blanks F up across the jaws, the support plate hidden under them; the 1/2 in end mill, to scale, on its first pass, skimming fork 1 along −X; the ring zones and shank bands it then roughs, hatched. Section across the jaws at the fork: the blanks on the plate, the plate on a 1 in parallel at each jaw, the end mill on the fork's face. The 1-2-3 block that flushed the ends is taken away." }
