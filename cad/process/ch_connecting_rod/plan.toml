[[setups]]
machine_kind = "other"
title = "Saw, mic and pair the blanks; the support plate"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "A 72 in length of the 1/4 x 2 in flat marked into nine 7.42–7.48 in blanks with kerfs between; beside it the 1/2 x 6 in aluminium flat with a 3.9 in piece marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long: nine from each of the two 72 in lengths and two from the 36 in, each marked off with the tape. File the burrs off both ends."
feed = "hand"
inspection = "Each blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long, from the filed left end: the calipers' jaws over the first 6 in, the tape for the rest. Shorter: it will not clean up at the crown, saw another; longer: CR04's end trim is laid out for {{process.blank_length_max_in:.2f}}, saw it again."
gauge_checks = "other"

[[setups.operations]]
instruction = "Mic each blank's thickness at both ends and the middle. Mark one wide face D with marking fluid along its length; the other is F. Number the blanks 1–{{process.quantity:d}} in marker on one sawn end face (no cut reaches it); that end is the left end in every setup. Pair them into loads of two whose readings agree within .0005."
inspection = "Every reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}}: this traveler's incoming-stock gate (the fork, ({{cad.fork_far_face_thickness_in:.3dot}}) REF on the drawing, is skimmed from F to this traveler's {{process.fork_thickness_mm:in.4dot}}). Outside: set the blank aside and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Once per batch: saw a {{process.support_plate_width_mm:in.1f}} in piece off the end of the 1/2 x 6 in 6061 flat (the support plate, {{process.support_plate_width_mm:in.1f}} x 6 in), file its burrs, and mark one {{process.support_plate_width_mm:in.1f}} in edge LEFT: its 6 in length runs along X under the blanks, its 3.9 in across the jaws, narrower than the pair. It is faced in Setup 2 and kept for every load."
feed = "hand"

[[setups.operations]]
instruction = "Mic one MHA-SH-VN-58 pin from the lot the rods will be assembled with (sheet note 1 fits the hole to it), and mic the .0775 reamer across its flutes."
inspection = "The pin {{process.pin_dia_min_mm:in.4dot}}–{{process.pin_dia_max_mm:in.4dot}} (McMaster 90145A299, 5/64 in 0/+.0002) and the reamer .0775–.0777. A hole the Setup 5 gauges pass (.0775–.0779) is then .0002–.0008 under the pin, note 1's fit. Outside: stop and tell the owner before reaming any rod."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.pin_dia_min_mm}}", "{{process.pin_dia_max_mm}}"] },
  { gauge = "micrometers", band_mm = [1.9685, 1.97358] },
]

[[setups]]
machine_kind = "other"
title = "Face F: skim and rough"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the vise bed, one against each jaw; the support plate on them, its LEFT edge to the left. A pair of blanks side by side across the jaws on the plate, each on its D face (F up), numbers to the left. Hold a 1-2-3 block's 2 in face across the two left ends and the plate's left edge and push them flush; then set the jaws' left side {{process.jaw_start_mm:in.2dot}} right of the ends (the calipers' depth rod) and close the vise on the blanks (the plate, narrower than the load, is not gripped), tapping them down onto the plate."
datum = "Program CR01_rough_2 (T1, T2). G54: X0 the blanks' left ends, Y0 the fixed jaw's face, Z0 the support plate's top (face D). +X toward the blanks' right ends, +Y toward the fixed jaw."
diagram = { file = "diagrams/face_f.svg", alt = "Two blanks across the vise jaws on the support plate on two parallels, F up; the end mill skims each fork and pockets the ring's zone and a band along the shank round the fork, the 1/8 in end mill rings the ring." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = [101.6, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.floor_rough_2_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}", 50.8], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = 101.6, along_jaws_mm = "{{process.blank_length_min_mm}}", part_height_mm = "{{process.blank_thickness_max_mm}}", parallel_height_mm = "{{process.support_height_mm}}", overhang_mm = ["{{process.jaw_start_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "y", hold = "between", extent_mm = [0, "{{process.blank_pitch_mm}}"], supports_mm = [0, "{{process.blank_pitch_mm}}"], section_mm = { x = "{{process.blank_pitch_mm}}", z = "{{process.floor_rough_2_mm}}" } }

[[setups.operations]]
instruction = "Home ($H) if not yet homed this session. First load only, before the blanks go in (the plate on the parallels, the vise open): G54 Y0 the fixed jaw's face, edge finder (900 rpm)."
instruction_detailed = "Home ($H) if not yet homed this session. Edge finder (900 rpm), its tip .10 below the jaw top, on the fixed jaw's face from the work side: G10 L20 P1 Y-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the support plate's top with T1, before the blanks go in (the plate alone on the parallels, as for the Y pick-up)."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the plate's top, the vise open and no blank on the plate: G10 L20 P1 Z0.051. The plate stays on the parallels when the blanks go in, so Z0 holds for every load."
feed = "hand"

[[setups.operations]]
instruction = "First batch only, before the first load: face the support plate's top. Clamp the plate alone on the parallels, face its top .010 with T1 by hand jog in overlapping passes, touch Z0 again as above, then unclamp the plate, leaving it on the parallels."
feed = "hand"

[[setups.operations]]
instruction = "Clamp the pair as in the Holding. First load only: G54 X0 the blanks' flush left ends, edge finder (900 rpm). Later loads: the 1-2-3 block sets the ends flush with the plate's left edge, at the same X0."
instruction_detailed = "Edge finder (900 rpm), its tip .10 below the blanks' top, on the left end of the blank against the fixed jaw, from the left: G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CR01_rough_2 in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "First load only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run the file, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

