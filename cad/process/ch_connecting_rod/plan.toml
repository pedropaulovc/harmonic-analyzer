fork_thickness_mm = 6.096
ring_near_mm = 0.889
ring_far_mm = 5.207
shank_near_mm = 1.27
shank_far_mm = 4.572
floor_stock_mm = 0.508
ring_rough_2_mm = 5.715
floor_rough_2_mm = 5.08
ring_rough_1_mm = -0.381
floor_rough_1_mm = -0.762
# Holding (shop workholding.vise-pm-6): the support plate (1/2 in 6061, 3.9
