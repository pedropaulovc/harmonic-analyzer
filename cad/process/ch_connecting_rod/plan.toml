# R8 taper does not seat it the same twice), the radial at every clamping
# of the saw (the pilot is a sliding fit). Axial: the slot's width is
# slot_rise_mm plus the saw's swept
# thickness, its miked thickness t plus its axial runout at the rim. Swept
# from the width's least less the rise to its most less the rise and
# saw_swept_margin_mm (.0005): .0620-.0655; the far tine is then .0655 or
# more, inside its band (cam.py checks them). The lever indicator reads the
# saw's lower face 1/8 in in from the teeth, where the rim's runout shows
# 1/1.10 of itself: saw_axial_reading_per_in_mm is its reading, in mm, per
# inch at the rim; slot_saw_axial_nominal_mm the reading a saw miking .0640
# may show. Z0 is touched under the tooth where that face stands lowest, so
# the near tine keeps its size and the far wall takes the runout. Radial:
# the file is posted for the saw's catalogue diameter (saw_dia_mm, the
# packing list's, not measured), so the calipers read it over two opposite
# tips on the first load: D. The deepest tooth cuts the floor half of (D
# less 2.750, plus the tips' total swing R) deeper than the file's depth,
# the band's middle: that sum within twice (the depth's most less its
# target less saw_depth_margin_mm, .002) either way: .016.
saw_swept_margin_mm = 0.0127
saw_depth_margin_mm = 0.0508
saw_axial_reading_per_in_mm = 23.091
slot_saw_swept_min_mm = 1.5748
slot_saw_swept_max_mm = 1.6637
slot_saw_axial_nominal_mm = 0.0346
slot_saw_radial_tir_max_mm = 0.4064
