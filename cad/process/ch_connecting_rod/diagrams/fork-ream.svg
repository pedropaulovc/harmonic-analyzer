<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif" font-size="13">
  <!-- Setup 5, the .0775 reamer. Hand picture. The section along fork 1's centre line (Y -25.400) at 8 px/mm: the fork 6.096 thick (fork_thickness_mm) on Z0, the plate's top (face D), its crown X 186.819 (crown_x_mm); the slot cut by CR06 from its floor X 172.087 (slot_floor_x_mm) to the crown, between Z 1.702 (saw_low_mm) and 4.394 (saw_high_mm 2.769 + the saw's 1.626); the pin hole at X 181.866 (pin_x_mm). The jaws end at X 170.674 and the plate at 152.4: the fork is in the air. The .0775 reamer to scale (cutter_dia_mm 1.9685 = 15.7 px; plan tool reamer-0775), its end drawn as the near half of the end face, 12 % deep, its true end at CR07's Z -1.000 (ream_past_mm 1.0); drawn short to a break line (its chuck not drawn). -->
  <rect class="paper" x="0" y="0" width="780" height="430"/>
  <text class="title" x="20" y="24">Setup 5, CR07 T5, the .0775 reamer: section along fork 1 (8 px/mm); from above (4 px/mm)</text>
