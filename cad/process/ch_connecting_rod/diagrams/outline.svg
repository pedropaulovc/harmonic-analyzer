  <!-- Setup 6. Hand picture, both views at 2.4 px/mm (61 px/in). From the plan's [parameters]: blanks 2 x 1/4 in (blank_width_in, blank_thickness_max_mm), two side by side across the jaws, 50.8 mm apart (blank_pitch_mm); the jaws X 12.0 to 170.674 (jaw_start_mm, jaw_end_mm), their tops 6.845 mm over the plate (jaw_top_mm); the support plate 100.33 x 152.4 (one long edge milled) x 12.7 mm (support_plate_*_mm) from X0, centred across the load (its place across is not stated), on two 1 in parallels (parallel_height_mm), 1/8 in thick (the parallel set's thickness as the shaft plans' parallel_thickness_mm restates it). Not on record, drawn schematic: the jaws' depth (6 mm drawn), the vise body, the parallels' length (drawn jaw to jaw). The part outline in the view from above is main's picture, rescaled. Z0 the plate's top (face D), as set with T3 in Setup 5. CR08: T2, the 1/8 in end mill to scale (eighth_cutter_dia_mm 3.175 = 7.6 px), on blank 1's shank edge at Y -31.051, at its last level Z 1.016 (.010 past the shank's near face, shank_near_mm 1.27), fed +X from X 106.500 to 131.643 before it lifts over the tab at X 134.5; drawn at X 120.0. Its square end 12 % deep; drawn short to a break line (at least .75 in out of the collet, eighth_mill_projection_min_mm; the collet is not drawn). The section at X 120 shows blank 1's frame (6.35 thick), its shank band (from 1.27 to 4.572 over the plate: shank_near_mm, shank_far_mm, Setups 3 and 4) and the shank (8.1 mm wide, main's picture) in it. -->
