  <!-- Setup 5. Hand picture, from above at 1.6 px/mm, the section at 2.4 px/mm. From the plan's [parameters]: blanks 2 x 1/4 in (blank_width_in, blank_thickness_max_mm), two side by side across the jaws, 50.8 mm apart (blank_pitch_mm); the jaws X 12.0 to 170.674 (jaw_start_mm, jaw_end_mm), their tops 6.845 mm over the plate (jaw_top_mm); the support plate 99.06 x 152.4 x 12.7 mm (support_plate_*_mm) from X0, centred across the load (its place across is not stated), on two 1 in parallels (parallel_height_mm), 1/8 in thick (the parallel set's thickness as the shaft plans' parallel_thickness_mm restates it). Not on record, drawn schematic: the jaws' depth (6 mm drawn), the vise body, the parallels' length (drawn jaw to jaw). The part outline in the view from above is main's picture, rescaled. Z0 the plate's top (face D), touched from the saw. CR06's first cut on the part: the slitting saw to scale (saw_dia_mm 69.85, saw_thickness_mm 1.6256; shop tools.slitting-saw-2-75-064), horizontal on the R8 stepped arbor (body and cap Ø1.25, saw_arbor_body_dia_mm, saw_arbor_cap_dia_mm; cap .50 thick, saw_arbor_cap_thickness_mm; all in the tool colour, the body drawn short to a break line; the screw head under the cap not drawn, its stand past the cap is measured in the setup). The light pass: centre X 219.289 (its rim slot_light_mm 2.455 into the crowns, crown_x_mm 186.819), lower face Z 1.702 (saw_low_mm), fed +Y from Y -139.065 to +37.465; drawn at Y -25.400, fork 1. The six passes after it (slot_step_mm 4.911, to the slot floor X 172.087 at Z 1.702 and Z 2.769) are not drawn. -->
