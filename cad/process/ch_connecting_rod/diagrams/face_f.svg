<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" font-family="sans-serif" font-size="13">
  <!-- Setup 2. Hand picture, both views at 2.4 px/mm (61 px/in). From the plan's [parameters]: blanks 2 x 1/4 in (blank_width_in, blank_thickness_max_mm), two side by side across the jaws, 50.8 mm apart (blank_pitch_mm); the jaws X 12.0 to 170.674 (jaw_start_mm, jaw_end_mm), their tops 6.845 mm over the plate (jaw_top_mm); the support plate 100.33 x 152.4 (one long edge milled) x 12.7 mm (support_plate_*_mm) from X0, centred across the load (its place across is not stated), on two 1 in parallels (parallel_height_mm), 1/8 in thick (the parallel set's thickness as the shaft plans' parallel_thickness_mm restates it). Not on record, drawn schematic: the jaws' depth (6 mm drawn), the vise body, the parallels' length (drawn jaw to jaw). The part outline in the view from above is main's picture, rescaled. CR01's first cut on the part: T1, the 1/2 in end mill to scale (face_cutter_dia_mm 12.7 = 30.5 px), the fork skim of blank 1 at Y -25.400, Z 6.096 (fork_thickness_mm), fed -X from X 198.882 to 168.785; drawn at X 183, over the fork. The same pass skims fork 2 at Y -76.200. Its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line, 1.12 in out of the collet (half_mill_projection_mm 28.45; the collet is not drawn, its size is not on record). Blanks drawn raw at the section (the skim takes .010; the rows and the band come after). The 1-2-3 block that set the ends flush with the plate is taken away before the vise closes: a callout. -->
  <rect class="paper" x="0" y="0" width="840" height="490"/>
  <text class="title" x="20" y="24">Setup 2, CR01 skims fork 1: from above (2.4 px/mm)</text>
