  <text class="label" x="471.2" y="112.96" text-anchor="end">−X</text>
  <text class="label" x="20" y="378">The 1/2 in end mill skims fork 1 to {{process.fork_thickness_mm:in.4dot}} over Z0, one pass along −X</text>
  <text class="label" x="20" y="394">(fork 2 the same), then rows the ring zones and shank bands (hatched);</text>
  <text class="label" x="20" y="410">the 1/8 in band round each ring has its own picture. X0 the left ends, flushed</text>
  <text class="label" x="20" y="426">with the plate's left edge by a 1-2-3 block, taken away before the vise closes.</text>
