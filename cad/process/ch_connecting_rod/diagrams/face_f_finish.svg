  <!-- Setup 4. Hand picture, both views at 2.4 px/mm (61 px/in). From the plan's [parameters]: blanks 2 x 1/4 in (blank_width_in, blank_thickness_max_mm), two side by side across the jaws, 50.8 mm apart (blank_pitch_mm); the jaws X 12.0 to 170.674 (jaw_start_mm, jaw_end_mm), their tops 6.845 mm over the plate (jaw_top_mm); the support plate 100.33 x 152.4 (one long edge milled) x 12.7 mm (support_plate_*_mm) from X0, centred across the load (its place across is not stated), on two 1 in parallels (parallel_height_mm), 1/8 in thick (the parallel set's thickness as the shaft plans' parallel_thickness_mm restates it). Not on record, drawn schematic: the jaws' depth (6 mm drawn), the vise body, the parallels' length (drawn jaw to jaw). The part outline in the view from above is main's picture, rescaled. Z0 the plate's top (face D). CR04a's first cut on the part: T1, the 1/2 in end mill to scale (face_cutter_dia_mm 12.7 = 30.5 px), on its last pass, centre X 193.169 (its side on the crown, crown_x_mm 186.819), Z -0.250 (end_trim_run_past_mm), fed +Y from Y -110.490 to +8.890; drawn at Y -25.400, fork 1. The pass before it, 1.587 mm out (end_trim_step_mm, X 194.755), is not drawn. Its square end 12 % deep; drawn short to a break line (1.12 in out of the collet; the collet is not drawn). -->
