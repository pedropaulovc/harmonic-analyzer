  <!-- Setup 2, T2. Hand picture, both views at 2.4 px/mm (61 px/in). From the plan's [parameters]: blanks 2 x 1/4 in (blank_width_in, blank_thickness_max_mm), two side by side across the jaws, 50.8 mm apart (blank_pitch_mm); the jaws X 12.0 to 170.674 (jaw_start_mm, jaw_end_mm), their tops 6.845 mm over the plate (jaw_top_mm); the support plate 99.06 x 152.4 x 12.7 mm (support_plate_*_mm) from X0, centred across the load (its place across is not stated), on two 1 in parallels (parallel_height_mm), 1/8 in thick (the parallel set's thickness as the shaft plans' parallel_thickness_mm restates it). Not on record, drawn schematic: the jaws' depth (6 mm drawn), the vise body, the parallels' length (drawn jaw to jaw). The part outline in the view from above is main's picture, rescaled. CR01's T2: the 1/8 in end mill to scale (eighth_cutter_dia_mm 3.175 = 7.6 px), on ring 1's band, a circle of radius 22.034 about (23.500, -25.400) clockwise (G3 from X 45.534), at its last level Z 5.080 (floor_rough_2_mm, over the plate); drawn at X 45.534, the circle's right point and its start, on the section through the cutter. Its square end 12 % deep; drawn short to a break line (at least .75 in out of the collet, eighth_mill_projection_min_mm; the collet is not drawn). Ring 2 the same at Y -76.200. -->
