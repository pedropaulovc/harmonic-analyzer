# Magnifying lever MHA-MG-03, one off, on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: the O.D. is the 1/4 in C360 brass rod as bought (drawing: ROD
# STOCK, REF 1/4; registry: the stock's .000/-.002 governs), so nothing is
# turned on it except, if the rod reads over the class 2A major, the thread's
# length. A blank sawn a little long; end B (the flat threaded end) out of
# the 3-jaw with the steady rest under it, faced, single-pointed 1/4-20
# UNC-2A for .70-.72 (owner 2026-11-19: single-pointed) and its tip
# chamfered; turned round, end A a short stickout out of the 3-jaw with the
# thread back in the spindle bore: faced to the 6.58-6.60 length, then the
# SR.125 tip formed with the R.125 form tool, its apex on the faced plane.
# Bench: deburr, check, bag (FINISH: machined).
#
# Why the steady rest: the thread's .70-.72 out of the jaws, plus room for
# the threading tool, stands over 3 diameters of its .19 minor out of the
# chuck (the shop's unsupported stickout limit), and a tailstock centre
# would leave a hole in the flat tip. The owner's steady rest
# (cad/config/shop-equipment/fixtures.toml steady-rest-pm-1127) carries the
# rod an inch behind end B.
#
# Flagged: the R.125 form tool (tools-special-cutters.toml form-tool-r125)
# is to order; the 12 in calipers the placeholder named are to order too, so
# the 6.59 length is read with the owned height gauge on the surface plate.
# No 1/4-20 class 2A ring gauge is on record: the thread is accepted by its
# major (micrometer), its pitch (the 40-piece set's screw pitch gauge) and a
# hand trial in the magnifying bracket's tapped hole. The class 2A major
# .2408-.2489 (ASME B1.1, 1/4-20 UNC-2A) is quoted in the plan; the threading
# and form-tool settings in shop/mg.toml are authored (low range).
title = "Magnifying Lever"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass rod, 1/4 in (drawing: brass)"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} C360 rod, the 48 in bar on hand; one blank {{process.blank_length_in:.2dot}} in long."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. The O.D. is left as bought: grip it over a brass shim wrap."
shop = "../shop"
stock_refs = ["c360-round-1-4"]
material_key = "lathe-c360"

[cad]
file = "../../out/features/mg_magnifying_lever/features.toml"
adapter = "turned_shaft"
part = "mg-magnifying-lever"

[parameters]
quantity = 1
stock_dia_in = 0.25
# The SR.125 tip is cut by the R.125 form tool (form-tool-r125): a full
# hemisphere on the 1/4 rod.
dome_form_radius_in = 0.125
# Sawn a little over the 6.59 length: about .03 in to face off each end.
blank_length_in = 6.66
# Out of the jaw fronts while end A is faced and formed: under 3 × Ø.
end_stickout_in = 0.4
# Setup 2: end A's .60 in the jaws, the rest out to the steady rest.
steady_stickout_mm = 154.0
# ASME B1.1-2019, 1/4-20 UNC-2A major diameter limits.
thread_major_min_in = 0.2408
thread_major_max_in = 0.2489

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "thread"
name = "60° HSS threading bit"
ref = "threading-bits-lms-6685"

[[tools]]
id = "form"
name = "R.125 form tool"
ref = "form-tool-r125"
status = "to_order"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Evolution 14 in metal-cutting saw"
holding = "The rod flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/4 in brass rod on the saw: a blank sawn a little over the 6.59 length." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the bar end and saw on the waste side of the line; let the blank drop clear onto the saw base and pick it up only after the blade has stopped. File the burrs off the sawn ends."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "End B: face, thread, chamfer (steady rest)"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on end A's .60 in; the rest of the blank out toward the tailstock, the steady rest's jaws on the rod 1 in behind end B, oiled and set to touch without marking it."
datum = "Z0 (carriage DRO) end B, faced in Op 30."
diagram = { file = "diagrams/end-b.svg", alt = "The blank out of the 3-jaw with the steady rest under it an inch behind end B: end B faced, threaded 1/4-20 for .71 and its tip chamfered." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{process.steady_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "steady_rest" }

[[setups.operations]]
cut_kind = "other"
instruction = "Mike the rod at both ends and the middle. Over {{process.thread_major_max_in:.4dot}} where the thread goes: Op 30 turns the thread's length down first."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face end B square, about {{cad.face_stock_per_end_in:.3dot}} in off, to the centre with no pip; set DRO Z0 on it. Only if the rod read over {{process.thread_major_max_in:.4dot}}: turn Z0 to Z-.75 to {{process.thread_major_min_in:.4dot}}–{{process.thread_major_max_in:.4dot}} (the class 2A major), aiming .2460."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Mike the thread's length where it was turned (skip if Op 30 turned nothing)."
inspection = "Thread major Ø{{process.thread_major_min_in:.4dot}}–{{process.thread_major_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = [6.11632, 6.32206] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "thread"
drilling = "none"
sizing = "other"
instruction = "Single-point {{cad.thread_designation}}, compound at 29°, the bit on centre height and square to the axis. Each pass: start off end B and cut toward the chuck; at Z-{{cad.thread_length_in:.3dot}} back the cross slide out and stop the spindle, half-nuts still closed (the thread then ends {{cad.thread_length_in:.2dot}} from end B, run-out {{cad.thread_incomplete_max_in:.3dot}} max). Reverse the spindle to run the carriage back past end B, return the cross slide to its mark, feed the compound, go forward again. Less feed near depth; stop when Ops 60 and 70 pass."
settings = "lathe-thread-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the rod still in the chuck and steady rest: seat the 20 TPI leaf of the 40-piece set's screw pitch gauge in the thread along its length. Calipers from end B to where the thread ends, run-out included; then the run-out alone, from the last full-depth turn to the thread's end."
inspection = "Pitch-gauge leaf seats along the whole thread, no light under it; thread length {{cad.thread_length_min_in:.2dot}}–{{cad.thread_length_max_in:.2dot}} from end B, run-out included; run-out {{cad.thread_incomplete_max_in:.3dot}} max."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thread_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Screw the magnifying bracket MHA-MG-01 (make it first; its 1/4-20 hole is the lever's mate) onto end B by hand, still in the chuck and steady rest: it must run the whole thread without forcing and without shake."

[[setups.operations]]
cut_kind = "other"
instruction = "Tight: take another .001–.002 compound pass and try again (Op 70). Shake, or the thread length or run-out out of Op 60's limits: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Break end B's tip 45° × .010 max (the title block's edge break), so the thread starts clean."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "End A: face to length, form the SR.125 tip"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap on plain rod, end A {{process.end_stickout_in:.2dot}} in out; the threaded end back through the jaws into the spindle bore."
datum = "End A's length is read with the height gauge (Op 110). For the tip (Op 130) the DRO Z is zeroed where the form tool's arc touches end A's corner."
diagram = { file = "diagrams/end-a.svg", alt = "The rod turned round, end A out: faced to length, then formed to the SR.125 tip." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face end A square in light skims toward {{cad.faced_length_in:.2dot}}, reading the length between them (Op 110); stop inside {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, stop the spindle and take the rod out: stand it on end B on the surface plate against a V-block and read end A with the height gauge; chuck it again over the shim."
inspection = "Length {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Faced under {{cad.faced_length_min_in:.2dot}}: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: set the R.125 form tool (a concave R.125 arc) on centre height, the arc facing end A and spanning it. Bring the arc's tips up along Z, adjusting the cross slide, until both touch end A's O.D. corner at once, no light showing at either tip: the arc is then centred on the axis. Zero the DRO Z at that touch."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Spindle on: feed the carriage along Z to Z−{{cad.dome_datum_form_height_in:.3dot}} (the rod's radius): a full SR{{cad.dome_datum_radius_ref_in:.3dot}} hemisphere, its apex on the faced plane and tangent to the rod. Never past Z−{{cad.dome_datum_form_height_in:.3dot}}."
settings = "lathe-form-r125-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Stop the spindle and look at the tip under a loupe: no pip or flat at the apex, no step where the tip meets the rod."

[[setups.operations]]
cut_kind = "other"
instruction = "A pip (tool off centre height) or a step at the rod (arc off centre): correct the tool's height or the cross slide, spindle stopped. Then bring the arc up along Z until it just touches the formed tip, zero the DRO Z at that touch, and take one light pass to Z−.002 only; Op 170 then reads the length."

[[setups.operations]]
cut_kind = "other"
instruction = "Read the length over the tip as Op 110."
inspection = "Length over the tip {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Under {{cad.faced_length_min_in:.2dot}}: the form ran past its Z: scrap the lever and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, try the thread, bag"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished lever: the SR.125 tip, the rod as bought and the 1/4-20 thread at end B." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Take the burr off the thread's start and end B's chamfer; leave the tip and the rod untouched."
feed = "hand"

[[setups.operations]]
instruction = "After deburring, screw end B by hand into the magnifying bracket MHA-MG-01's 1/4-20 hole once more, the whole thread length: it runs in without forcing and without shake."

[[setups.operations]]
instruction = "Tight: a burr is left; file it off the thread's start and try again. Shake or a torn thread: scrap the lever and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the lever clean and dry (FINISH: machined) and bag it with its number."
