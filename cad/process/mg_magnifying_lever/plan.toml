instruction = "Mike the rod at three places along where the thread goes: from the pilot's shoulder to {{cad.thread_length_max_in:.2dot}} beyond end B's plane (.50 in from the stub's faced end) toward the chuck. Over {{process.thread_major_max_in:.4dot}} at any: Op 60 turns the thread's length down first."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
