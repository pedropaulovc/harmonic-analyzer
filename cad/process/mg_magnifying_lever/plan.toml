# Magnifying lever MHA-MG-03, one off, on the manual PM-1127VF-LB (owner
# ruling 2026-11-21: turned parts get lathe travelers, no NC). Route chosen
# for speed: the O.D. is the 1/4 in C360 brass rod as bought (drawing: ROD
# STOCK, REF 1/4; registry: the stock's .000/-.002 governs), so nothing is
# turned on it except, if the rod reads over the class 2A major, the thread's
# length. A blank sawn long by a .535 stub, stock allowance that never
# becomes part of the lever; the stub's end faced, turned to a Ø.18 pilot
# and centre-drilled; end B single-pointed 1/4-20 UNC-2A for .70-.72 (owner
# 2026-11-05: single-pointed, not die-cut) between the 3-jaw on end A and
# the dead centre in the stub, and tried in the MHA-MG-01 bracket over the
# pilot before the stub comes off; end B's face cut at Z0 by the cutoff
# blade, leaving a Ø.06 neck to the stub; the stub sawn off through the neck
# and the pip filed flush at the bench; turned round, end A a short stickout
# out of the 3-jaw with the thread back in the spindle bore: faced to the
# 6.58-6.60 length, then the SR.125 tip swept with the LittleMachineShop
# 2569 ball turner, its apex on the faced plane. Bench: deburr, check, bag
# (FINISH: machined).
#
# The tip (owner ruling 2026-11-23, tool audit Q5, option D: "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569, $124.95;
# convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file is the
# fallback for any dome it cannot reach. Confirm each dome is convex and
# reachable before buying."). Reach test, from the spec (dome-pattern,
# 2026-11-23): convex, a tangent hemisphere (SR.125) REF on the Ø.248-.250
# rod, ball Ø.25 under the tool's .75; end A is free (no centre in Setup
# 7); the frame's arms reach .19 either side of the pivot along Z, so the
# tip's centre must stand .25 out of the jaws: R + .25 = .375 against the
# .40 stick-out, which is inside 3 × Ø.248 = .74 (lathe_holding, no
# centre); nothing over Ø.75 within .25 of the centre (the jaws are .275
# from it). Reachable. It replaces the R.125 form tool (form-tool-r125).
#
# Why the stub: threading end B for .70-.72 needs it out of the jaws by the
# thread plus the threading bit's half-width and clearance (about .95), over
# the shop's 3 x D stickout limit on the 1/4 rod (.75). A centre in end B
# itself would leave an undrawn hole in the flat tip, which stands .05 past
# the bracket's far face (mg_lever_thread_joint); a die is ruled out by the
# owner; the steady rest leaves 1 in free past it with no carriage clearance
# on record. The stub carries the centre and is cut off: the lever leaves
# with no feature the drawing does not show. End B's face is cut in the same
# hold (Op 190), so no setup holds the threaded end out of the jaws. Route
# chosen by the agent and approved by Main 2026-11-21 (the owner corrects
# afterwards), over the steady rest, a follow rest, a chuck-only hold .95
# out, a centre in end B and a die.
#
# The dead centre clears the bit: the stub's outer .20 is a Ø.18 pilot,
# under the bit's point (the thread's minor, Ø.19), so each pass starts at
# Z+.40 over the pilot in air; the bit's right side is then .025 past the
# stub's end, where the dead centre's 60° point is still inside the #1
# centre drill's Ø.09 countersink (its cone reaches Ø.12 there), while the
# bit's flank stands over .26 off the axis: no half-centre is needed. The
# dead centre's nose is not measured. The tailstock taper is MT3 and the
# owner's MT3 dead centre fits it (owner 2026-11-21: machines.pm-1127vf-lb,
# tools.dead-centre-mt3, no longer the mill's tap guide). Op 100's dry run proves the
# clearance before the first pass.
#
# Flagged: the ball turner (tools.ball-radius-turner-lms-2569) is to order;
# the 6.59 length is read with the owned height gauge on the
# surface plate (no calipers on record reach it).
# No 1/4-20 class 2A ring gauge is on record: the thread is accepted by its
# major (micrometer), its pitch (the 40-piece set's screw pitch gauge) and a
# hand trial in the magnifying bracket's tapped hole. The class 2A major
# .2408-.2489 (ASME B1.1, 1/4-20 UNC-2A) is quoted in the plan; the threading
# and the ball turner's settings in shop/mg.toml and shop/lathe.toml are authored (low range).
title = "Magnifying Lever"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass rod, 1/4 in (drawing: brass)"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} C360 rod, 360-H02 extruded, the 48 in bar on hand (Online Metals part 1257); one blank {{process.blank_length_in:.2dot}} in long and a {{process.trial_offcut_in:.2dot}} in trial offcut for the ball turner. Before sawing, mike the bar at three places along the blank: every reading .248–.250 (the lever's O.D. is the bar as bought; with the MHA-MG-02 bore accepted at .257–.261 on its own traveler, that is the drawing's .007–.013 sliding clearance); then slide the MHA-MG-02 clamp (made first) along it: it slides without catching. Either fails: do not cut that bar, order another."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. The O.D. is left as bought: the drawn rod's own surface is the drawing's Ra 125 MHA-MG-02 screw seat, so grip it over a brass shim wrap and never cut, file or stone it."
shop = "../shop"
stock_refs = ["c360-round-1-4"]
material_key = "lathe-c360"

[cad]
file = "../../out/features/mg_magnifying_lever/features.toml"
adapter = "turned_shaft"
part = "mg-magnifying-lever"

[parameters]
quantity = 1
stock_dia_in = 0.25
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the tip's height, the faced length and the
# sweep from it): the rod's radius, so the tip is a full tangent hemisphere
# .125 high, its apex on the faced plane, checked with the radius gauges'
# 1/8 leaf.
dome_form_radius_in = 0.125
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .125 + .1875.
ball_turner_rule_in = 0.3125
# A trial offcut of the same bar, sawn with the blank, for setting the
# radius: the .40 stick-out plus about .6 in the jaws.
trial_offcut_in = 1.0
# The roughing chamfer's leg, ahead of the sweep: .55 × the tip's radius on
# the smallest rod (r .124; dome pattern, 2026-11-23), under the leg that
# would touch the sphere (cad.dome_datum_form_chamfer_max; the adapter
# refuses more).
dome_chamfer_in = 0.068
# Sawn long: the 6.59 length and about .085 to face off at end A, plus the
# .535 stub allowance (stub_allowance_in: .500 out past end B's plane and
# .035 faced off its sawn end). End B's face is cut at Z0 in Setup 3, so end
# B takes no facing allowance of its own.
blank_length_in = 7.21
stub_allowance_in = 0.535
# The stub's faced end stands .500 out from end B's plane (Z0 of Setup 3);
# its outer .20 is the Ø.18 pilot, under the bracket's 1/4-20 minor (.196
# min), so MHA-MG-01 passes over it for the fit trial.
stub_in = 0.5
pilot_dia_in = 0.18
pilot_dia_mm = 4.572
pilot_length_in = 0.2
thread_start_z_in = 0.4
# Out of the jaw fronts while the stub's end and end A are faced: under 3 × Ø.
end_stickout_in = 0.4
# Setup 3: end A's .60 in the jaws, the rest out to the dead centre.
centre_stickout_mm = 167.0
# Op 190: the 1/16 P1 cutoff blade plunges at Z+.100 and Z+.050 first, then
# at Z0 (end B's face) last, each down to a Ø.06 neck (each under one blade
# width apart, no web): each plunge cuts on the chuck side of any neck already
# cut, so its cutting torque never passes through the Ø.06 neck; the stub
# rides on that neck (and the dead centre's friction) from the first plunge on. The
# groove is about .16 wide, room for the saw's kerf mid-groove; Setup 4 saws
# through the neck.
neck_dia_in = 0.06
blade_width_in = 0.0625
# ASME B1.1-2019, 1/4-20 UNC-2A major diameter limits.
thread_major_min_in = 0.2408
thread_major_max_in = 0.2489
# Single-pointing: the compound feeds at 29°, so at full depth (about .035 of
# compound travel) the point sits about .017 nearer the chuck than the
# carriage DRO reads (the bit was touched on the stub's end at compound
# zero). The cross slide is backed out briskly from DRO Z-.673 and is clear
# by DRO Z-.698 (at 70 rpm and 20 TPI the carriage runs .058 in/s, so about
# .4 s): on the last, deepest pass the point backs out at about .690 and is
# clear by about .715, so the run-out ends inside the drawing's .70-.72 and
# under its .075 maximum.
thread_retract_start_in = 0.673
thread_retract_clear_in = 0.698

