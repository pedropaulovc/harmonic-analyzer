[[setups.operations]]
cut_kind = "other"
instruction = "Mike the turned diameter along the thread's length (skip if Op 60 turned nothing)."
inspection = "Thread major Ø{{process.thread_major_min_in:.4dot}}–{{process.thread_major_max_in:.4dot}}."
