instruction = "Over {{process.thread_major_max_in:.4dot}}: take another light skim to Z-{{cad.thread_length_max_in:.3dot}} and mike it again. Under {{process.thread_major_min_in:.4dot}}: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: the threading bit on centre height and square to the axis; touch its point on the stub's faced end and set DRO Z+{{process.stub_in:.3dot}}; then touch it on the rod's O.D. over a cigarette-paper shim and zero DRO X there: X0 is the cross slide's mark for every pass."

[[setups.operations]]
cut_kind = "other"
instruction = "Dry run, spindle stopped, half-nuts open: the bit's point at Z+{{process.thread_start_z_in:.3dot}} over the pilot must clear the dead centre with daylight between them; run the carriage by hand to Z-{{process.thread_retract_clear_in:.3dot}}: the bit stays clear of the jaws."

[[setups.operations]]
cut_kind = "other"
instruction = "The bit touches the dead centre: start the passes at Z+.350 instead (still over the pilot, whose shoulder is Z+.300) and run Op 100 again; still touching there: draw the quill back until the centre just holds and run Op 100 again before cutting."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "thread"
drilling = "none"
sizing = "other"
instruction = "Single-point {{cad.thread_designation}}, one pass: from Z+{{process.thread_start_z_in:.3dot}} over the pilot toward the chuck; at DRO Z-{{process.thread_retract_start_in:.3dot}} back the cross slide out briskly, clear by DRO Z-{{process.thread_retract_clear_in:.3dot}} (the 29° compound carries the point about .017 past the DRO at depth), and stop the spindle, half-nuts closed. Bit backed out, reverse at 70 rpm back to Z+{{process.thread_start_z_in:.3dot}}; stop."
settings = "lathe-thread-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Return the cross slide to its mark, feed the compound, and repeat Op 120 until Ops 140 and 150 pass; the half-nuts stay closed until then."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: seat the 20 TPI leaf of the 40-piece set's screw pitch gauge in the thread along its length: it seats along the whole thread with no light under it."

[[setups.operations]]
cut_kind = "other"
instruction = "Only once Op 140 passes: back the cross slide fully off and the tailstock away; steady the rod near end B with one hand and screw the magnifying bracket MHA-MG-01 (make it first) over the pilot to the thread's end with the fingers only, no wrench, and off again: it runs the whole thread without forcing and without shake. Bring the dead centre back, oiled and snug."

[[setups.operations]]
cut_kind = "other"
instruction = "The leaf rocks on the crests or drifts out of step along the thread at any pass (the pitch is wrong, not the depth): the gearbox is off 20 TPI; set it right, scrap the lever and make another from Setup 1. A leaf that seats but shows light only because the thread is still shallow: keep cutting as Op 130. The bracket shakes at Op 150 (cut too deep): scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Tight on the bracket (Op 150): spindle stopped, half-nuts closed, turn the chuck forward by hand until the DRO reads about Z-.300 (over full thread), then bring the cross slide to X0: the bit's point sits in the groove with no gap on either flank (the rod has not slipped or bent). Off the groove: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "The point sits (Op 170): take a .001–.002 compound pass as Op 120 and try the bracket again as Op 150. Shake or a torn thread at Op 150: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "part"
drilling = "none"
sizing = "other"
instruction = "The cutoff blade on centre height, square: touch its chuck-side face on the pilot's shoulder, just gripping a cigarette paper, and set DRO Z+.301 (the paper). Plunge at Z+.100, then at Z+.050, each to a Ø{{process.neck_dia_in:.2dot}} neck; then at DRO Z0 (its chuck-side face on end B's plane) to the same neck, last: a groove about .16 wide with the {{process.blade_width_in:.4dot}} blade, room for the saw. Back out for chips; the dead centre stays in."
diagram = { file = "diagrams/centres-part.svg", alt = "To scale: the 1/16 cutoff blade's last plunge, its chuck-side face on end B's plane, down to the Ø.06 neck; the dead centre still in the stub." }
