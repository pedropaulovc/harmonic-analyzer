title = "Bench: deburr, try the thread, bag"
machine = "Bench"
holding = "Bench vise with soft jaws, the lever gripped lightly over the brass shim wrap on plain rod near end B, the thread clear of the jaws."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished lever: the SR.125 tip, the rod as bought and the 1/4-20 thread at end B." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Take the burr off the thread's start and end B's chamfer; leave the tip and the rod untouched."
feed = "hand"

[[setups.operations]]
instruction = "After deburring, screw end B by hand into the magnifying bracket MHA-MG-01's 1/4-20 hole once more, the whole thread length: it runs in without forcing and without shake."

[[setups.operations]]
instruction = "Tight: a burr is left; file it off the thread's start and try again. Shake or a torn thread: scrap the lever and make another from Setup 1."

[[setups.operations]]
instruction = "Look along the O.D. under a light, then slide the MHA-MG-02 clamp along the rod: it slides without catching, and the MHA-MG-02 screw seat (main view, the plain rod near the SR.125 tip) has no raised burr, dent or scratch that breaks its Ra 125."

[[setups.operations]]
instruction = "The clamp catches, or the screw seat is marked: scrap the lever (the drawn surface is not reworked) and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the lever clean and dry (FINISH: machined) and bag it with its number."
