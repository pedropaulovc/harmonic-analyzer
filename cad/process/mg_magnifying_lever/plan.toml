instruction = "Spindle stopped: clamp the ball turner's 3/8 shank in an AXA No. 1 holder, the inner frame swung parallel to the spindle axis. Set the bit's tip level with the tailstock dead centre's point. Take the centre out and run the tailstock back: nothing may stand within 4 in beyond the faced end."

[[setups.operations]]
cut_kind = "other"
instruction = "Set the bit to R{{cad.dome_datum_form_radius_in:.3dot}}: lay a 1-2-3 block's ground edge across the inner frame's edges and read the bit's tip from it with the calipers' depth rod: {{process.ball_turner_rule_in:.4dot}} (the radius plus the maker's 3/16 from the frame's end to the pivot). Tighten the bit's set screw."

[[setups.operations]]
cut_kind = "other"
instruction = "Inner frame parallel to the axis: bring the carriage up until the bit's tip just touches the faced end; lock the carriage and zero the DRO Z. The pivot is now one radius behind the faced plane, so the apex stays on it. The carriage stays locked until the dome is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: run the cross slide out until the bit clears the end through the whole sweep. Swing the frame through the sweep and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms (they reach .19 either side of the pivot). Any touch: the offcut stands short; chuck it again {{process.end_stickout_in:.2dot}} in out of the jaw fronts on the rule and repeat from Op 250."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the corner somewhere in the sweep. Sweep the frame from parallel to the axis round toward you to {{cad.dome_datum_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes: the pivot is then on the axis. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: hold the radius gauges' {{cad.dome_datum_form_radius_in:fraction}} leaf (concave) square across the dome through the axis, at two places 90° apart, against a light."
inspection = "SR{{cad.dome_datum_radius_ref_in:.3dot}} REF hemisphere: no light under the {{cad.dome_datum_form_radius_in:fraction}} leaf; no step or ridge where it meets the O.D.; no pip, flat or ring at the apex."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Light at the leaf's ends (too round): loosen the bit's set screw and set the tip .005 further out on the depth rod; light at its middle, or a ridge at the O.D. (too flat): .005 further in; tighten. Draw the offcut out to {{process.end_stickout_in:.2dot}} in again, face the dome off (Op 250), chamfer (Op 260), then repeat Ops 290–330. Under .30 in left in the jaws: saw a new trial offcut. Once it passes, leave the set screw alone until the lever's tip is cut."

[[setups]]
machine_kind = "lathe"
title = "End A: face to length, form its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap on plain rod, end A's faced plane {{process.end_stickout_in:.2dot}} in out of the jaws (the sawn end about .085 beyond it); the threaded end back through the jaws into the spindle bore."
datum = "End A's length is read with the height gauge (Op 360). For the tip the DRO Z is zeroed with the ball turner's tip on the faced end in Op 390."
diagram = { file = "diagrams/end-a.svg", alt = "To scale: the rod turned round in the 3-jaw over a shim wrap, end A .40 out, the AR tool facing it to length; the SR.125 tip to come." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face end A square in light skims toward {{cad.faced_length_in:.2dot}}, reading the length between them (Op 360); stop inside {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, stop the spindle and take the rod out: stand it on end B on the surface plate against a V-block and read end A with the height gauge; chuck it again over the shim."
inspection = "Length {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Faced under {{cad.faced_length_min_in:.2dot}}: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound at 45°: rough end A's corner off as Op 260, a 45° chamfer {{process.dome_chamfer_in:.3dot}} along the face and along the O.D."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Ball turner in its holder, bit as set in Op 280 (set screw untouched), inner frame parallel to the axis: bring the carriage up until the tip just touches end A's faced end; lock the carriage and zero the DRO Z. It stays locked until the dome is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: cross slide out until the bit clears end A through the whole sweep. Swing the frame through it and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms. Any touch: unlock the carriage, chuck the lever again with end A's faced plane {{process.end_stickout_in:.2dot}} in out of the jaw fronts on the rule and repeat from Op 390."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the chamfer somewhere in the sweep. Sweep from parallel to the axis round toward you to {{cad.dome_datum_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
diagram = { file = "diagrams/end-a-ball.svg", alt = "To scale: the ball turner's bit sweeping end A's SR.125 tip, its pivot on the axis .125 behind the faced plane, the frame's arms .19 either side of it." }
settings = "lathe-ball-turner-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: look at the tip under the loupe and draw a fingernail over where it meets the rod. Its radius is the trial's (SR{{cad.dome_datum_radius_ref_in:.3dot}} REF), not re-gauged here."
inspection = "No pip, flat or ring at the tip; no step or ridge where the tip meets the rod."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A flat at the tip: the pivot is short of the axis: one more sweep with the cross slide in .001 (Op 410), then Op 430 again. A ring or point at the tip, or a step or ridge at the rod: scrap the lever and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
instruction = "Read the length over the tip as Op 360."
inspection = "Length over the tip {{cad.faced_length_min_in:.2dot}}–{{cad.faced_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Under {{cad.faced_length_min_in:.2dot}}: a carriage moved during a sweep: scrap the lever and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, try the thread, bag"
machine = "Bench"
holding = "Bench vise with soft jaws, the lever gripped lightly over the brass shim wrap on plain rod near end B, the thread clear of the jaws."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished lever: the SR.125 tip, the rod as bought and the 1/4-20 thread at end B." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Take the burr off the thread's start and end B's chamfer; leave the tip and the rod untouched."
feed = "hand"

[[setups.operations]]
instruction = "After deburring, screw end B by hand into the magnifying bracket MHA-MG-01's 1/4-20 hole once more, the whole thread length: it runs in without forcing and without shake."

[[setups.operations]]
instruction = "Tight: a burr is left; file it off the thread's start and try again. Shake or a torn thread: scrap the lever and make another from Setup 1."

[[setups.operations]]
instruction = "Look along the O.D. under a light, then slide the MHA-MG-02 clamp along the rod: it slides without catching, and the MHA-MG-02 screw seat (main view, the plain rod near the SR.125 tip) has no raised burr, dent or scratch that breaks its Ra 125."

[[setups.operations]]
instruction = "The clamp catches, or the screw seat is marked: scrap the lever (the drawn surface is not reworked) and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the lever clean and dry (FINISH: machined) and bag it with its number."
