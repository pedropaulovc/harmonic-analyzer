  <line class="dims" x1="370" y1="228" x2="370" y2="244"/>
  <line class="dims" x1="610" y1="228" x2="610" y2="244"/>
  <text class="label" x="400" y="262">.40 out of the jaw fronts</text>
  <text class="label" x="520" y="290">sawn end, about .085 faced off</text>
