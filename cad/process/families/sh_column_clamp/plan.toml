[[setups]]
machine_kind = "other"
title = "Saw the blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 in square bar with blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end, a saw kerf between each." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.blank_count:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/4 in square 1018 bar, the bar flat in the saw's vise: {{process.quantity:d}} for the fronts and {{process.quantity:d}} for the backs, about {{process.bar_length_in:.1f}} in of bar with the kerfs."
feed = "hand"
inspection = "Each blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Outside: shorter, scrap it; longer, saw it again. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] }]
table = { columns = ["Finished size", "Front {{cad.front.drawing_number}}", "Back {{cad.back.drawing_number}}"], rows = [
  ["Width, N to the far end", "{{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}", "{{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}"],
  ["Height, B to the top", "{{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}", "{{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}"],
  ["Depth, mating face to outside face", "{{cad.front.depth_min_in:.3dot}}–{{cad.front.depth_max_in:.3dot}}", "{{cad.back.depth_min_in:.3dot}}–{{cad.back.depth_max_in:.3dot}} ({{cad.back.pre_face_depth_min_in:.3dot}}–{{cad.back.pre_face_depth_max_in:.3dot}} until Setup 11's face-off)"],
  ["Ear holes, both", "#9 drill through, Ø{{cad.front.ear_dia_min_in:.3dot}}–{{cad.front.ear_dia_max_in:.3dot}}", "{{cad.back.ear_thread}} through, #29 tap drill"],
  ["Ear holes from N: near, far", "{{cad.ear_near_x_min_in:.3dot}}–{{cad.ear_near_x_max_in:.3dot}}, {{cad.ear_far_x_min_in:.3dot}}–{{cad.ear_far_x_max_in:.3dot}}", "the same"],
  ["Ear holes from B", "{{cad.ear_height_min_in:.3dot}}–{{cad.ear_height_max_in:.3dot}}", "the same"],
  ["Bore, cut in the bolted pair", "Ø{{cad.bore_dia_in:.3dot}} REF, {{cad.bore_clearance_min_in:.3dot}}–{{cad.bore_clearance_max_in:.3dot}} over the miked column; {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}} from N", "the same"],
  ["Ear web to the bore", "at least {{cad.front.ear_wall_min_in:.3dot}} (MIN EAR WALL)", "no limit printed"],
] }

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the burr off both ends and the four long edges of each blank so it seats flat on the parallels. Mark the blanks F1, F2, F3 (fronts) and B1, B2, B3 (backs) on a cold-finished long face with marking fluid (the sawn ends are faced off)."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "First end"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel against each jaw. The blank upright on them, a sawn end up, gripped across two opposite faces of the square, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. The lower {{process.upright_grip_mm:in.2dot}} of it is in the jaws."
datum = "Program CF01/CB01_first_end (cam:sh_column_clamp_front, cam:sh_column_clamp_back). G54: X0 Y0 the bar's axis, Z0 the faced first end; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/first-end.svg", alt = "The blank upright on two 1 in parallels in the vise, a sawn end up; the 1/2 in end mill faces it in passes across the square." }
envelope = { x_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_length_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{process.blank_section_mm}}", part_height_mm = "{{cad.blank_length_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_section_mm}}", y = "{{process.blank_section_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 Y0 the bar's axis: edge finder (900 rpm) on the left and right faces and on the fixed jaw."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face beside the blank, G10 L20 P1 Y(half the miked section in mm − 2.540); for .750, Y6.985. X: its tip .10 below the sawn top, on the blank's LEFT face from the left, G10 L20 P1 X0; on its RIGHT face from the right, G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced first end, the sawn top's high point less the {{process.end_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.end_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "The first front and the first back: prove CF01/CB01_first_end in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "The first front and the first back: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run CF01/CB01_first_end, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF01/CB01_first_end (M6 T1, 1/2 in end mill; set 2650): face the first end at Z0, {{process.end_skim_mm:in.3dot}} off the high point, in passes no wider than {{process.face_stepover_max_mm:in.3dot}}. A sawn patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run it again."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "first end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.end_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "Other end to the width"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 2, the blank turned over: the faced first end down on both parallels, the sawn end up."
datum = "Program CF02/CB02_length. G54: X0 Y0 the bar's axis, Z0 the parallels' top (the faced first end); +Y toward the fixed jaw."
diagram = { file = "diagrams/length.svg", alt = "The blank upright on two 1 in parallels, the faced end down; the 1/2 in end mill faces the sawn end down to the width in levels." }
envelope = { x_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.width_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{process.blank_section_mm}}", part_height_mm = "{{process.upright_top_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{process.upright_top_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_section_mm}}", y = "{{process.blank_section_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). Repeat Setup 2's touch-off: edge finder X0 Y0 on the bar's axis (the blank was turned over), then M6 T1 and Z0 as below."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top, touched with the end mill on the fixed-jaw parallel beside the blank."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-17.000 Y2.675: the cutter left of the blank, its edge .02 off the fixed jaw, over that jaw's parallel. Spindle stopped, its tip just dragging a .002 feeler leaf on the parallel: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "The first front and the first back: prove CF02/CB02_length in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF02/CB02_length (M6 T1; set 2650): face the sawn end down to Z {{cad.width_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). Then, still clamped, check the width."
settings = "endmill-carbide-3fl-1-2-1018-cf"
inspection = "Width {{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}: the calipers' depth rod from the faced top to the fixed-jaw parallel beside the blank, at two corners."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]
milling_cuts = [
  { name = "length", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "Over {{cad.width_max_in:.3dot}}: lower G54 Z by the reading less {{cad.width_mm:in.3dot}} and run CF02/CB02_length again. Under {{cad.width_min_in:.3dot}}: the blank is scrap."
instruction_detailed = "Over {{cad.width_max_in:.3dot}}: send $# and note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{cad.width_mm:in.3dot}}) × 25.4). Run CF02/CB02_length again and check again. Under {{cad.width_min_in:.3dot}}: the blank is scrap."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bottom face B"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The blank lying on them along the jaws, gripped across two opposite cold-finished faces, centred on the jaws; the face up becomes the bottom face B. Tap it down onto both stacks while closing the vise. Its top stands {{process.blank_section_in:.3dot}} above the stacks, the lower {{process.lying_grip_mm:in.3dot}} of it in the jaws."
datum = "Program CF03/CB03_bottom. G54: X0 the blank's LEFT end, the near side N (scribed after this cut), Y0 the fixed jaw's face, Z0 the stacks' top; +Y toward the fixed jaw."
diagram = { file = "diagrams/bottom.svg", alt = "The blank lying along the jaws on stacked parallels; the 1/2 in end mill skims the top face, which becomes the bottom face B." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_section_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{process.blank_section_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{process.blank_section_mm}}", z = "{{process.blank_section_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 the blank's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm): on the fixed jaw's face beside the blank, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack left of the blank."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-12.700 Y-6.850: the cutter left of the blank, its edge .02 off the fixed jaw, over that jaw's stack. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "The first front and the first back: prove CF03/CB03_bottom in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
