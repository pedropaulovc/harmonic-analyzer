  { name = "ear drill", kind = "drill", phase = "finish", cutter_dia_mm = 3.4544, flutes = 2, rpm = 1700, feed_mm_min = "{{process.drill_feed_per_min_mm}}", stations_mm = ["{{cad.ear_near_x_mm}}", "{{cad.ear_far_x_mm}}"] },
]

[[setups.operations]]
instruction = "Every back, still clamped, before tapping: each hole's X from N, the calipers from the left end over the largest pin gauge that slips in, less half its Ø. Write both readings on this traveler with the blank's number: Setup 12 checks them against the bore."
inspection = "Near hole {{cad.ear_near_x_min_in:.3dot}}–{{cad.ear_near_x_max_in:.3dot}} and far hole {{cad.ear_far_x_min_in:.3dot}}–{{cad.ear_far_x_max_in:.3dot}} from N: the drawing's {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}} about the bore, which the pair bore (Setup 10) puts {{cad.bore_location_in:.3dot}} from N. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.ear_near_x_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ear_far_x_band_mm}}" },
]

[[setups.operations]]
instruction = "First back only, then: unclamp, check each hole's height on the surface plate, reclamp as before and repeat the edge-finder X0 and Y0 (Z0 stands: the same stacks)."
inspection = "Each hole from B (Y) {{cad.ear_height_min_in:.3dot}}–{{cad.ear_height_max_in:.3dot}}: the part on B on the surface plate, the height gauge over the slip-in pin less half its Ø. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.ear_height_band_mm}}" }]

[[setups.operations]]
instruction = "The 8-32 plug tap, its thread at least .750 long (a standard hand tap), goes in the small T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole. If that wrench does not take the 8-32 tap: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the 8-32 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stacks, this half, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run CB07_tap_1: M6 T4, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the near tap drill."
diagram = { file = "diagrams/tap.svg", alt = "The half as before, outside face up; the 8-32 tap in the T-handle wrench in a tap drill, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_point_depth_mm:in.3dot}} below the outside face, through the mating face." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the outside face beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 X3.810 (beside the hole, on the outside face), G90, then send G20: the DRO reads inches. Stand the 8-32 plug tap, in its T-handle wrench, on its point on the outside face; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21 and MDI G91 G0 X-3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-8-32"
drilling = "none"
sizing = "other"
instruction = "Send G20 (the DRO reads inches). Tap {{cad.ear_thread}} through by hand under the tap guide, spindle off, cutting oil: the spring keeps the point in the wrench as the tap feeds, up to 1/2 in. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z − {{process.tap_point_depth_mm:in.3dot}}: the point through the mating face, the full thread the whole depth."
instruction_detailed = "Send G20, as when the depth was noted. Tap's point in the hole, a drop of cutting oil; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn; push the point home again before the tap has gone 1/2 in. To read, push it fully home: stop at the noted Z − {{process.tap_point_depth_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
inspection = "One of the pair's MHA-SH-VN-53 screws runs through the thread by hand. Binds: run the tap through again under the tap guide; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run CB08_tap_2 (the tap guide still in, spindle off; it ends Idle over the far tap drill). Tap it the same way: G20, depth reference beside it, tap through to the same depth under the tap guide, G21, back out, blow out, screw check."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr for the pair"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/deburr.svg", part = "front", alt = "A front on the bench, mating face up: the drill exits deburred flush, the edges broken." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Every half: deburr the drill exits (a back's: the tap exits) on the mating face flush (scraper from the deburring set; no countersink), then break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. The mating face must lie flat on its mate's: stone it lightly on a flat stone and wipe it. Keep N and B readable. Wash off the oil."
feed = "hand"
inspection = "Mating face down on the surface plate: it does not rock and no burr stands proud. Rocks: stone it again."
gauge_checks = "other"

[[setups.operations]]
part = "back"
instruction = "Each back: mic the pre-face depth, mating face to outside face, at the N end and at the far end; write both readings, labelled N and far, on this traveler with the back's number (Setups 10 and 11 use them)."
feed = "hand"
inspection = "Pre-face depth {{cad.pre_face_depth_min_in:.3dot}}–{{cad.pre_face_depth_max_in:.3dot}} at both ends."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.pre_face_depth_band_mm}}" }]
diagram = { file = "diagrams/deburr.svg", part = "back", alt = "A back on the bench, mating face up, at its pre-face depth: the tap exits deburred flush, the edges broken." }

[[setups]]
machine_kind = "other"
part = "back"
title = "Pair bore: each back bolted to its front"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The bolted pair (op before this setup's touch-off) in the vise: the back's outside face against the FIXED jaw; a 1-2-3 block standing on the vise bed on a 1 x 3 in face, 2 in tall, its 1 x 2 in face against the front's outside face centred between the screw heads ({{cad.block_head_clear_in:.3dot}} clear of each head); the MOVING jaw on the block's far 1 x 2 in face. Under the pair, the 1 in parallels: one against the block under the front's band; one against the fixed jaw under the back's N end only, its end {{process.back_parallel_end_mm:in.3dot}} from the bore axis ({{cad.back_parallel_clear_in:.3dot}} clear of the bore). Close the vise SNUG, NOT HARD (the back's wall behind the bore is {{cad.bore_wall_worst_in:.3dot}} at worst): tap the pair down onto both parallels with a soft mallet while closing it; both parallels pinned."
datum = "Program CB09_pair_bore. G54: X0 the two N ends (flush, on the LEFT), the pair to +X; Y0 the split line, +Y toward the fixed jaw (the back); Z0 the parallels' top (both B faces). The bore at X {{cad.bore_location_in:.3f}} in, Y0."
diagram = { file = "diagrams/pair.svg", alt = "From above: the fixed jaw on the back's outside face, the back, the split line, the front, the two screw heads on the front's bar face with the 1-2-3 block between them against the moving jaw; one parallel along the front against the block, one along the back stopped short of the bore; the 1/2 in end mill interpolates the full bore on the split line." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.pair_depth_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.bore_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.bore_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.bore_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.pair_jaw_span_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{cad.height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{cad.pair_depth_mm}}", z = "{{cad.height_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "On the bench: bolt a back to a front (both through Setup 9), mating face to mating face, with the pair's own two MHA-SH-VN-53 screws (90280A201 #8-32 × 1-1/4 narrow fillisters; none in hand: stop, no substitute) through the front's ear holes into the back's taps, heads on the front's outside face."
instruction_detailed = "On the surface plate: both halves on their B faces, N ends together against the side of a 1-2-3 block; snug the screws, then tighten them. The screw tips stop at least {{cad.screw_short_in:.3dot}} short of the back's outside face."
inspection = "N ends flush (a fingernail across them finds no step) and both B faces flat on the plate (no rock); each screw tip at least {{cad.screw_short_in:.3dot}} below the back's outside face (the calipers' depth rod down each tapped hole). Else loosen, reseat and tighten again; a tip proud: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Mic the column this clamp goes on (MHA-FR-03, 1020 DOM tube, 1.000 OD × .120 wall) where the clamp will sit, two readings 90° apart; record both for this pair. The bore is accepted on them."
feed = "hand"

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 the N ends, Y0 the split line: edge finder (900 rpm) on the N ends and on the fixed jaw, less this back's recorded pre-face depth."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm), its tip .10 below the pair's top: on the N ends from the left, G10 L20 P1 X-2.540. On the fixed jaw's face beside the pair (right of it), G10 L20 P1 Y(the mean of this back's two recorded pre-face depths, in mm, − 2.540). The split line is that depth from the jaw."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top, touched with the end mill on the front's parallel right of the pair."
instruction_detailed = "Console M6 T1, the 1/2 in end mill at least {{process.bore_mill_projection_min_mm:in.2dot}} out of the collet (the collet's face must clear the block and the fixed jaw at the bore's bottom; the tool setter measures it). MDI G0 X55.400 Y-12.000: the cutter right of the pair, over the front's parallel and clear of the block. Spindle stopped, its tip just dragging a .002 feeler leaf on that parallel: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First pair only: prove CB09_pair_bore in air, Z0 raised 1.000 in; the helix circles the bore's place and clears the screw heads and the block. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CB09_pair_bore (M6 T1; set 2650): the end mill helixes down the bore's place, climbing, {{process.helix_pitch_mm:in.3dot}} a turn, to {{process.bore_past_mm:in.3dot}} below the pair, then a finish turn and a spring turn at full depth. Cutting oil on the pair before Cycle Start; hands clear until the program ends, then blow the chips out of the bore. It puts the bore {{cad.bore_location_in:.3dot}} from the flush N ends, where both halves' holes were drilled from. Then, still clamped, gauge the bore."
rpm = 2650
feed = "{{process.bore_feed_per_min_mm:in.1f}} in/min"
inspection = "Bore Ø (Ø{{cad.bore_dia_in:.3dot}} REF) still clamped: at least {{cad.bore_clearance_min_in:.3dot}} over the larger column reading and at most {{cad.bore_clearance_max_in:.3dot}} over the smaller, each reading on the 3/4–1-1/4 in telescoping gauge at mid-height, across the split line and along it, read on the 0–1 in or 1–2 in micrometer."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = "{{cad.bore_dia_band_mm}}" }]
milling_cuts = [
  { name = "bore rough", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{process.helix_pitch_mm}}", radial_woc_mm = "{{process.face_cutter_dia_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
  { name = "bore finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = "{{process.bore_finish_stock_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Bore under the larger column reading plus {{cad.bore_clearance_min_in:.3dot}} either way: run CB10_bore_open (M6 T1; set 2650): down the bore's centre, out, a turn {{process.bore_open_mm:in.3dot}} larger on the diameter and a spring turn; gauge again. Over the smaller column reading plus {{cad.bore_clearance_max_in:.3dot}} either way, or still under after CB10: stop and tell the owner."
rpm = 2650
feed = "{{process.bore_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "bore open", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = "{{process.bore_open_radial_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp (the pair still bolted) and gauge the bore again the same two ways: the vise's squeeze may have held it round or oval."
inspection = "Bore Ø unclamped, across the split line and along it: at least {{cad.bore_clearance_min_in:.3dot}} over the larger column reading and at most {{cad.bore_clearance_max_in:.3dot}} over the smaller. Outside it only now: stop and tell the owner (the vise sprang the pair; do not re-clamp to open it). In band: scribe the pair number on both halves' N ends and record both bore readings and both column readings for the pair."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = "{{cad.bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "Unbolt the pair; keep the screws with it. The back goes to Setup 11; the front waits for it at Setup 12."
feed = "hand"

[[setups]]
machine_kind = "other"
part = "back"
title = "Backs: face the grip offset off the mating face"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The back alone, on the stacks: the outside face down, B against the FIXED jaw, gripped on B and the top, centred; the mating face up, the half bore open upward. Snug: the wall behind the bore is thin. Tap it down onto both stacks while closing the vise."
datum = "Program CB11_face_off. G54: X0 the RIGHT end (N), the part to −X; Y0 the fixed jaw's face (B); Z0 the mating face as it stands."
diagram = { file = "diagrams/face-off.svg", alt = "The back lying on stacked parallels, outside face down, bottom face at the fixed jaw, the half bore open upward; the 1/2 in end mill faces {{cad.grip_offset_in:.3dot}} off the mating face." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.height_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.pre_face_depth_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.depth_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{cad.pre_face_depth_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{cad.height_mm}}", z = "{{cad.pre_face_depth_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 the RIGHT end (N), Y0 the fixed jaw's face (B): edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm): on the fixed jaw's face beside the part, G10 L20 P1 Y-2.540; on the part's RIGHT end (N) from the right, G10 L20 P1 X2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the mating face as it stands, touched with the end mill on its N-end pad, beside the bore."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-4.000 Y-8.000 (over the N-end pad, clear of the bore). Spindle stopped, its tip just dragging a .002 feeler leaf on the mating face: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First back only: prove CB11_face_off in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CB11_face_off (M6 T1; set 2650): face the mating face down {{cad.grip_offset_mm:in.3dot}} at Z −{{cad.grip_offset_mm:in.3dot}} in one level, across the half bore. Unclamp; mic the depth, mating face to outside face, at both ends."
settings = "endmill-carbide-3fl-1-2-1018-cf"
inspection = "Depth {{cad.depth_min_in:.3dot}}–{{cad.depth_max_in:.3dot}}, miked at the N end and the far end; and at each end the grip offset, that end's recorded pre-face depth less its reading here, {{cad.grip_offset_min_in:.3dot}}–{{cad.grip_offset_max_in:.3dot}}."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.depth_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.grip_offset_band_mm}}" },
]
milling_cuts = [
  { name = "face off", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{cad.grip_offset_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{cad.width_mm}}"] },
]

[[setups.operations]]
instruction = "Too little off (at either end, depth over {{cad.depth_max_in:.3dot}} or offset under {{cad.grip_offset_min_in:.3dot}}): reclamp as before (Z0 stands); send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − (the largest, over both ends, of the depth reading − {{cad.depth_mm:in.3dot}} and {{cad.grip_offset_mm:in.3dot}} − that end's offset) × 25.4); run CB11_face_off again and re-check. Too much off (at either end, depth under {{cad.depth_min_in:.3dot}} or offset over {{cad.grip_offset_max_in:.3dot}}), or one band short and the other full: stop and tell the owner."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Inspect, deburr, black enamel"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", part = "front", alt = "The finished front, looking down the bore: the ear holes either side, the web between each and the bore, the bore's place from the N end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
part = "front"
instruction = "Each front. Inspect first, the bore's edges still sharp (the deburr below breaks them): the bore was accepted in the pair (Setup 10). The ears and the bore's place from N now; under the web or outside a band: stop and tell the owner."
inspection = "Each ear's web to the bore, on the mating face: the calipers' outside jaw tips into the ear hole and the bore, closed on the web: at least {{cad.ear_wall_min_in:.3dot}} (MIN EAR WALL). Each ear's station: that web plus half the ear hole's pin plus half the bore's recorded Ø, {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}}. The bore's place: the calipers from N to the bore's near edge on the mating face, plus half its recorded Ø, {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{cad.ear_wall_min_mm}}", "{{cad.ear_wall_best_mm}}"] },
  { gauge = "calipers", band_mm = "{{cad.ear_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_location_band_mm}}" },
]

[[setups.operations]]
part = "back"
instruction = "Each back. Inspect first, the bore's edges still sharp (the deburr below breaks them); its depth and grip offset were accepted in Setup 11. Outside a band: stop and tell the owner."
inspection = "Bore Ø accepted in the pair (Setup 10). The bore's place, the calipers from N to the half bore's near edge on the mating face, plus half its recorded Ø, {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}}. Each tap drill's station from the bore: that place less the hole's X recorded in Setup 8 (near hole), or the far hole's X less that place, {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.bore_location_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ear_station_band_mm}}" },
]
diagram = { file = "diagrams/inspect.svg", part = "back", alt = "The finished back, looking down the half bore: the tapped ear holes either side, the bore's place from the N end." }

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Every half: deburr the bore's edges at the top and bottom faces and along the mating face (a back's is the faced one), R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, scraper and smooth file; no burr may stand proud of the mating face. Each back also: break the four outer edges of the mating face that Setup 11 faced and deburr both tap mouths on it flush (scraper; no countersink), then run a screw through each tapped hole again. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "If the enamel cannot follow now: oil each half lightly, bag each pair together and tag it with its pair number; wash the oil off before the enamel."
feed = "hand"

[[setups.operations]]
instruction = "Paint: the owner's Rust-Oleum Stops Rust Flat Black 376855 over Rust-Oleum Stops Rust Clean Metal Primer 7780830, the paint maker's primer for bare metal. The primer is not owned: buy it. The enamel: check the shelf, buy if none."
feed = "hand"

[[setups.operations]]
instruction = "Wash every half in detergent, rinse it in clean water and dry it thoroughly."
feed = "hand"

[[setups.operations]]
instruction = "Mask. A front: the bore, both ear holes (a plug or a #8 screw in each) and the outside face (the bar seats on it), the face opposite the bore. A back: the half bore and both tapped holes (a #8-32 screw in each)."
feed = "hand"

[[setups.operations]]
instruction = "Spray outdoors or in a well-ventilated space, at 50–90 °F and humidity under 70 %. Primer: shake the can a full minute after the ball rattles; 2 light coats a few minutes apart, the can 10–16 in off."
feed = "hand"

[[setups.operations]]
instruction = "Enamel straight after the primer: every unmasked face black, 2 or more light coats a few minutes apart, the can moving and at one distance, no runs. Any further coat within 1 hour or after 48 hours."
feed = "hand"

[[setups.operations]]
instruction = "Let it dry: tack-free in 2–4 hours, handle after 5–9 hours, fully dry in 24 hours."
feed = "hand"

[[setups.operations]]
instruction = "Unmask; wipe the bare bores, the ear and tapped holes and the fronts' outside faces with light oil."
feed = "hand"
