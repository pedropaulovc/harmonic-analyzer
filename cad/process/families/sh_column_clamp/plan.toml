# Column clamp pair: front MHA-SH-01 and back MHA-SH-02 (qty 3 each), one
# traveler for both halves. TRIAL (owner, Pedro, 2026-11-22: "theres too much
# repetition bw front and back clamps ; trial authoring a shared traveler for
# both; dont merge yet"). It is rendered by prechips' part-family plans
# ([[parts]]), which no release carries yet; the two single-part plans
# (../../sh_column_clamp_front, ../../sh_column_clamp_back) stay the enrolled
# travelers and the CAM recipes' source until the owner rules.
#
# Route: saw six blanks of 3/4 in square 1018 about 2.0 long; Setups 2-5 cut
# all six alike (first end, width, bottom face B, height: CF01-CF04 and
# CB01-CB04 post the same moves); Setup 6 skims the mating face and makes a
# blank a front (N at the left, CF05) or a back (N at the right, CB05);
# Setup 7 the fronts' outside face and #9 ear holes (CF06); Setup 8 the backs'
# outside face to the pre-face depth, #29 tap drills (CB06) and the 8-32 taps
# under the spring tap guide (CB07, CB08); Setup 9 bench deburr; Setup 10 each
# back bolted to its front, the bore interpolated on the split line (CB09,
# CB10 to open it); Setup 11 the backs' grip offset faced off (CB11); Setup
# 12 inspect, deburr, black enamel.
#
# A setup or operation with part = "front" or "back" binds that half's
# drawing values; the others bind only values both halves' manifests give
# alike (prechips refuses any that differ), so a shared setup cannot print a
# number that is true of one half only. {{cad.front.KEY}} and
# {{cad.back.KEY}} name a half anywhere.
#
# Rulings, tapping, zeroing and the sources of every parameter: the headers
# and [parameters] comments of the two single-part plans, which
# test_sh_column_clamp_family.py holds this plan's numbers to.
#
# NC: the two recipes' files as they are, cam:sh_column_clamp_front
# (CF01-CF06) and cam:sh_column_clamp_back (CB01-CB11). A shared setup names
# its two files CFnn/CBnn_name. Tool numbers are per file: T1 the 1/2 in end
# mill, T2 the centre drill in both; T3 the #9 in CF06 and the #29 in CB06;
# T4 the tap guide in CB07 and CB08.
title = "Column clamp front and back"
part = "{{cad.front.drawing_number}} front, {{cad.back.drawing_number}} back"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (drawing: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.blank_count:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks ({{process.quantity:d}} fronts, {{process.quantity:d}} backs), {{process.bar_length_in:.1f}} in of bar with the kerfs."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). One traveler for the pair: {{process.quantity:d}} fronts ({{cad.front.drawing_number}}) and {{process.quantity:d}} backs ({{cad.back.drawing_number}}), bored bolted together. Setups 1–6, 9 and 12 serve both halves (through Setup 5 all six blanks are cut alike; Setup 6 makes a blank a front or a back): every blank goes through a setup in turn before the next setup (after each, unclamp it, clamp the next as the Holding says and pick up every zero again). Setup 7 is the fronts', Setups 8 and 11 the backs', Setup 10 the bolted pairs'. Programs: a CF file cuts a front, a CB file a back; a setup for both names its two files as CF01/CB01_first_end: run the file of the half in the vise. Tool numbers are per file: T3 is the #9 drill in CF06_bar_drill and the #29 in CB06_back_drill; each file's tool-change message names the tool. Finished sizes: Setup 1's table. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home (logbook 2026-11-06). After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every file is proved in air on the first blank it cuts. Keep each back with its front from the pair bore (Setup 10) on: scribe the pair number on both."
shop = "../../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[[parts]]
id = "front"
label = "Front {{cad.drawing_number}}"
file = "../../../out/features/sh_column_clamp_front/features.toml"
adapter = "clamp_half"
part = "sh-column-clamp-front"

# The front's own numbers: the back's pre-face depth band (the pair
# picture's other half), the Ø.150 spot and the #9's peck, tip and feed.
[parts.parameters]
other_half_depth_min_mm = 15.24
other_half_depth_max_mm = 15.748
spot_dia_mm = 3.81
peck_mm = 4.572
drill_tip_height_mm = -2.496
drill_feed_per_min_mm = 91.44
drill_9_oal_mm = 88.9

[[parts]]
id = "back"
label = "Back {{cad.drawing_number}}"
file = "../../../out/features/sh_column_clamp_back/features.toml"
