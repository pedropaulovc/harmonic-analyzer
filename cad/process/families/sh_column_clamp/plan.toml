part = "sh-column-clamp-back"

# The back's own numbers: the front's depth band, the Ø.120 spot and the
# #29's peck, tip and feed, the tap, the bolted pair and its bore.
[parts.parameters]
other_half_depth_min_mm = 17.272
other_half_depth_max_mm = 17.526
spot_dia_mm = 3.048
peck_mm = 3.048
drill_tip_height_mm = -2.038
drill_feed_per_min_mm = 129.54
tap_point_depth_mm = 19.05
spacer_block_height_mm = 50.8
spacer_block_length_mm = 76.2
pair_jaw_span_mm = 109.093
bore_finish_stock_mm = 0.254
helix_pitch_mm = 0.508
bore_past_mm = 1.0
bore_tip_height_mm = -1.0
bore_open_mm = 0.0508
bore_open_radial_mm = 0.0254
bore_feed_per_min_mm = 279.27
bore_mill_projection_min_mm = 31.75
tap_stack_max_mm = 270.002
tap_wrench_reach_max_mm = 190.5

# What both halves share: the blank, the skims and facing passes, the holding
# and the machine-capacity inputs.
[parameters]
# Blanks sawn here, both halves together, and the bar they come off:
# blank_count × blank_length_max_in + (blank_count − 1) × kerf_in.
blank_count = 6
bar_length_in = 12.925
quantity = 3
blank_section_in = 0.75
blank_section_mm = 19.05
blank_length_min_in = 1.95
blank_length_max_in = 2.05
kerf_in = 0.125
end_skim_mm = 0.508
bottom_skim_mm = 0.508
mating_skim_mm = 0.508
face_step_max_mm = 1.27
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.08
drill_past_mm = 1.0
spot_feed_per_min_mm = 45.72
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044
vise_jaw_height_mm = 44.9453
vise_jaw_width_mm = 158.6738
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
vise_upright_inset_mm = -69.81
vise_lying_inset_mm = -55.33
upright_top_max_mm = 51.562
screw_head_dia_mm = 6.858
screw_head_height_mm = 3.9624
screw_length_mm = 31.75
spacer_block_width_mm = 25.4
back_parallel_end_mm = 15.875
r8_collet_gauge_mm = 6.3
drill_chuck_gauge_mm = 95.0
half_mill_projection_min_mm = 25.4
centre_drill_oal_mm = 47.625

[[tools]]
