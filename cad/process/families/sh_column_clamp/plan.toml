name = "#9 drill"
ref = "riser-drill-9"
[[tools]]
id = "drill-29"
name = "#29 drill"
ref = "jig-drill-29"
[[tools]]
id = "tap-guide"
name = "Fisher spring tap guide"
ref = "tap-guide-fisher"
[[tools]]
