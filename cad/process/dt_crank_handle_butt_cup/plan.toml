# Crank handle butt cup MHA-DT-35, one off, turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). Route chosen for speed, two chuckings of the 1/2 in 1018 bar on hand.
# Order of manufacture: this cup first (bonded into the handle), the MHA-DT-32
# screw last. Owner ruling 2026-11-26 (#3743, option A): plunge the pocket
# .250 to the .217 floor with the owned 1/4 carbide square end mill from the
# tailstock, then bore .0125/side out to Ø.275 +/-.005 (.270-.280) with the
# owned 3/16 carbide square end mill clamped in the AXA No. 2 V-groove boring
# holder (its square corner leaves the floor corner well inside R.015 MAX),
# check with .270 GO / .280 NO-GO pins, and chamfer the #20 floor-hole mouth
# with the owned 1/4 in 90° 330CH chamfer mill (retiring the $67 Harvey
# 902345-C3 3/16 chamfer cutter and tight band N-01). First the
# MHA-DT-08 counterbore is measured (note 2 turns the body to it). Setup 1
# saws a 3 in piece off the bar: the lathe never runs the whole bar, whose
# length behind the jaws would pass the spindle's rear end (#3424; limit
# cad/config/shop-equipment/ machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in). Setup 2, the piece pocket end out: face (Z0), turn the body to the measured
# counterbore less its clearance, spot, drill #20 through past the parting
# line, drill #1 short of the pocket floor, plunge the pocket to the floor
# depth with the 1/4 carbide end mill from the tailstock, bore the pocket wall
# out to Ø.270-.280 with the 3/16 carbide end mill in AXA #2, check with .270
# and .280 pins, and chamfer the #20 hole's floor-side edge with the owned 1/4
# 90° chamfer mill. Part off .02 long. Setup 3, the cup turned round on its
# body over a shim wrap: mike its length, touch the AR on the parted end and
# preset the DRO from that length (nothing seats the cup axially), face the far
# end to length and chamfer its outside edge. Bench: deburr and check.
title = "Crank Handle Butt Cup"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel rod, 1/2 in"
stock = "Ø{{process.stock_dia_in:.3dot}} bar, on hand; Setup 1 saws one {{process.bar_length_in:g}} in piece off it, which makes the one cup ({{cad.pitch_in:.2dot}} in of it)."
shop = "../shop"
stock_refs = ["1018-round-1-2"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

# The shop's standing page carries what every traveler shares (units, lathe
# speeds, coolant); This job says what only this cup needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["To order", "To order (not on hand): the Class ZZ pin-gauge set (.061–.500 minus) for the pocket's .270/.280 check and the #20 hole check."],
  ["Make first", "Make this cup before the MHA-DT-32 screw, which is fitted to the bonded handle."],
]

[cad]
file = "../../out/features/dt_crank_handle_butt_cup/features.toml"
adapter = "turned_bush"
part = "dt-crank-handle-butt-cup"

[parameters]
quantity = 1
stock_dia_in = 0.5
# The piece Setup 1 saws off the bar, and the length the 3-jaw grips of it:
# 3.0 in leaves about 2.4 in behind the jaw fronts, inside the spindle (limit
# machines.pm-1127vf-lb bar_behind_jaw_fronts_max_in, test_lathe_bar_length).
bar_length_in = 3.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn or parted bar end.
face_allowance_in = 0.02
# Left on the far end for Setup 3 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Setup 3: how much of the body the jaws take, from the pocket end.
regrip_grip_in = 0.2
# Left a side on the body for its finish passes.
finish_allowance_in = 0.005
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.1016
turn_start_z_mm = 0.5

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-20"
name = "#20 drill"
ref = "drill-20"

[[tools]]
id = "drill-1"
name = "#1 drill"
ref = "drill-1"

# The owned 1/4 in carbide square end mill plunges the pocket to depth, then
# the owned 3/16 in carbide square end mill in AXA #2 bores .0125/side out to
# Ø.275 +/-.005 (owner ruling 2026-11-26, #3743 option A).
[[tools]]
id = "end-mill"
name = "1/4 in 3-flute carbide square end mill, in the tailstock drill chuck"
ref = "endmill-carbide-3fl-1-4"

[[tools]]
id = "bore-em"
name = "3/16 in 3-flute carbide square end mill, in the AXA No. 2 boring holder"
ref = "endmill-carbide-3fl-3-16"

[[tools]]
id = "pins"
name = "Class ZZ minus pin gauges, .061–.500 set"
ref = "pin-gauges"
status = "to_order"

[[tools]]
id = "chamfer-mill"
name = "1/4 in 90° 2-flute chamfer mill, in the tailstock drill chuck"
ref = "chamfer-mill-330ch-1-4-90"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "telescoping-gauges-starrett-s579gz"
name = "Telescoping gauges"
ref = "telescoping-gauges-starrett-s579gz"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the working piece"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the piece free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 in bar on the saw: one {{process.bar_length_in:g}} in piece off its end, for the one cup." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.bar_length_in:g}} in from the bar end and saw on the waste side of the line; let the piece drop clear and pick it up only after the blade has stopped. File the burrs off the sawn ends. The piece makes the one cup; never chuck the whole bar in the lathe (it would run out past the spindle's rear end)."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Bar, pocket end out: turn the body, drill, plunge and bore the pocket, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} piece from Setup 1, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the bar end, faced in this setup: the pocket end, left flat (it shows flush in the handle's butt)."
diagram = { file = "diagrams/bar.svg", alt = "The 1/2 in bar in the 3-jaw, pocket end out: the end faced, the body turned, the #20 hole drilled through, the pocket cut to a flat floor, the cup parted off .02 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
drilling = "none"
sizing = "other"
feed = "hand"
tool = "telescoping-gauges-starrett-s579gz"
instruction = "Measure the MHA-DT-08 handle's butt counterbore with a telescoping gauge and the micrometer and write it on this sheet: the body is that counterbore less {{cad.outer_clearance_min_in:.3dot}}–{{cad.outer_clearance_max_in:.3dot}} (drawing note 2), inside Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}; a counterbore needing a body outside that band: stop and report."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Body rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Body finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the body from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}: rough to {{process.finish_allowance_in:.3dot}} a side over the target, then finish in light passes, miking between them, to the recorded counterbore less {{cad.outer_clearance_min_in:.3dot}}–{{cad.outer_clearance_max_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Body Ø the recorded counterbore less {{cad.outer_clearance_min_in:.3dot}}–{{cad.outer_clearance_max_in:.3dot}} and Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, by micrometer; over: skim again; under: scrap."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.13 across the countersink: under the #20 drill, so the drill removes it."
settings = "lathe-centre-1018"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-20"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the drill in until its lips just touch the spot's rim and zero the tailstock quill scale there (its point is then about .04 below the faced end). Drill #20 until the scale reads {{cad.run_in:.2dot}}, backing out to clear chips every {{cad.bore_dia_mm:in.2dot}} in: through the cup and past the parting line."
settings = "lathe-drill-20-1018"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = { step_mm = "{{cad.bore_dia_mm}}", retract = "full" }
peck_reason = "1018 drilled from a hand-fed tailstock quill, L/D about 2.7: backing out every diameter keeps the #20's chips from packing in its flutes"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-1"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #1 drill in until its lips just touch the #20 hole's edge and zero the quill scale there (its point is then about .05 below the faced end). Drill until it reads .20: the full diameter is then about .18 deep and the drill's cone meets the #20 hole about .20 deep, above the {{cad.pocket_depth_min_in:.3dot}} floor; the point itself runs in the #20 hole. It leaves the end mill about .010 a side."
settings = "lathe-drill-1-steady-1018"
cut_diameter_mm = 5.7912
hole_depth_mm = 4.572
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "end-mill"
drilling = "none"
sizing = "other"
instruction = "Put the 1/4 end mill in the tailstock drill chuck gripped on its shank only, all its flutes out of the jaws, tightened at all three key holes. Spindle running, touch its end on the faced end and zero the quill scale. Feed it in with the quill, light and steady with cutting oil, backing out to clear chips, until the scale reads .205."
settings = "lathe-endmill-1-4-plunge-1018"
cut_diameter_mm = 6.35

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "end-mill"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, the end mill backed out: read the floor's depth with the calipers' depth rod beside the #20 hole. Spindle on: feed the end mill in by the difference to {{cad.pocket_depth_in:.3dot}} on the quill scale, back it out and read again; repeat until it reads {{cad.pocket_depth_min_in:.3dot}}–{{cad.pocket_depth_max_in:.3dot}}."
settings = "lathe-endmill-1-4-plunge-1018"
cut_diameter_mm = 6.35
inspection = "Pocket depth {{cad.pocket_depth_min_in:.3dot}}–{{cad.pocket_depth_max_in:.3dot}} to a flat floor (calipers' depth rod beside the #20 hole); short: feed on; deep: scrap."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pocket_depth_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "bore-em"
drilling = "none"
sizing = "other"
instruction = "Clamp the 3/16 carbide square end mill on its shank in the AXA No. 2 V-groove boring holder on center height, parallel to the spindle axis, projecting about .40. Touch its end on the faced end to verify DRO Z0, then bring its cutting flute lightly against the .250 plunged pocket wall and zero the cross-slide. Bore the pocket wall out .0125 a side to Ø{{cad.pocket_ref_in:.3dot}} (.270–{{cad.pocket_dia_max_in:.3dot}}) in three light passes (.005, .005 and .0025 radial on the cross-slide) to Z-{{cad.pocket_depth_in:.3dot}}, kissing the flat floor cleanly; the square end-mill corner leaves the floor corner well inside R{{cad.pocket_corner_r_max_in:.3dot}} max."
settings = "dt-lathe-bore-em-3-16-1018"
cut_diameter_mm = "{{cad.pocket_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the pocket blown clean: try the .270 GO pin and the {{cad.pocket_dia_max_in:.3dot}} NO-GO pin of the set in the pocket by hand, clean and dry, no force."
inspection = "Pocket Ø.270–{{cad.pocket_dia_max_in:.3dot}}: the .270 pin enters and the {{cad.pocket_dia_max_in:.3dot}} pin does not. Tight (.270 refuses): take a spring pass or .001 radial skim as Op 100 and recheck; {{cad.pocket_dia_max_in:.3dot}} enters: scrap."
gauge_checks = [{ gauge = "pin-gauges", band_mm = [6.858, 7.112] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "chamfer-mill"
drilling = "none"
sizing = "other"
instruction = "Chamfer the #20 hole's edge on the pocket floor with the 1/4 in 90° chamfer mill from the tailstock (its .250 body clears the .270–{{cad.pocket_dia_max_in:.3dot}} pocket wall): touch the edge, then feed about .007 by the quill scale (drawn {{cad.chamfer_bore_leg_min_in:.3dot}} MIN × 45°; the title block's chamfer {{cad.chamfer_bore_leg_max_in:.3dot}} max caps it)."
settings = "lathe-chamfer-1-4-1018"
cut_diameter_mm = 6.35

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: {{process.regrip_allowance_in:.2dot}} over length, for Setup 3. Hands clear: let the cup fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round on the body: face to length, chamfer the far edge"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap on the body, {{process.regrip_grip_in:.2dot}} in of it in the jaws from the pocket end, closed lightly (the pocket wall is about .08); the parted end {{cad.outer_stickout_far_mm:in.2dot}} in out. Nothing seats the cup axially: Op 140 locates the pocket end by the miked length instead."
datum = "The pocket end (in the jaws), located through the miked length: Op 140 presets the DRO so the pocket end is Z-{{cad.length_in:.3dot}} and the faced far end Z0. The setting error, about .002 (the micrometer reading and the tool's touch on the face), stays inside the {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} band; a cup pushed back in the light grip only comes out long."
diagram = { file = "diagrams/regrip.svg", alt = "The cup turned round, its pocket end in the jaws over a shim wrap: the parted end faced to length from the miked pocket end and its outside edge chamfered." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_far_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Before chucking, mike the cup's length across both ends and write it on this sheet as L0 (about {{cad.part_off_in:.2dot}}). Chuck it, then with the spindle running bring the AR in until it just marks the parted end and set the DRO Z there to L0 less {{cad.length_in:.3dot}}. Face the parted end in light skims to Z0: the length is then {{cad.length_in:.3dot}} within the .002 setting error (miked at the bench, Op 170)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound at 45°: chamfer the outside edge of this end {{cad.chamfer_far_leg_min_in:.3dot}}–{{cad.chamfer_far_leg_max_in:.3dot}} × 45° with the AR's nose in light passes, checking between them (it clears the counterbore's corner in MHA-DT-08)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Chamfer {{cad.chamfer_far_leg_min_in:.3dot}}–{{cad.chamfer_far_leg_max_in:.3dot}} × 45°: lay the calipers' jaws flat on the end face and close them onto the chamfer; the flat reads the body Ø less twice the leg. Small: another pass; large: scrap."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished cup: the body to the measured counterbore, the pocket in the flat end, the #20 hole through and the two chamfers." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr: break the pocket mouth, the outside edge of the pocket end and the #20 hole's far end R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; keep the pocket-end face flat and the body diameter otherwise untouched."
feed = "hand"

[[setups.operations]]
instruction = "Mike the length across both ends."
inspection = "Length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Check the #20 hole: a Ø{{cad.bore_dia_min_in:.3dot}} pin gauge enters and a Ø{{cad.bore_dia_max_in:.3dot}} does not."
inspection = "Hole Ø{{cad.bore_dia_min_in:.3dot}}–{{cad.bore_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "A cup long in Op 170 goes back to Op 140 (a new L0, chucked, touched, preset and faced to Z0), then Op 150 (the far chamfer cut and checked again), Op 160 (the far end deburred again), then Op 170. One short in Op 170 or failing the hole check in Op 180 is scrapped, not reworked: make another from a new sawn piece (Setups 1 and 2)."
feed = "hand"

[[setups.operations]]
instruction = "Oil the pocket, the pocket-end face and the #20 hole lightly with light machine oil (drawing finish: bright turned, oiled), the faces that show in the handle's butt; leave the body and the far end dry and clean for the epoxy into the MHA-DT-08 counterbore. Tag it with the recorded counterbore: it goes to that handle."
feed = "hand"
