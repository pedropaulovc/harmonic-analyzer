[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Evolution 14 in metal-cutting saw"
holding = "The bar flat on the saw bed, its long end clamped in the saw's vise, the blank free beyond the blade."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/4 in brass bar on the saw: a 1.08 in blank off its end." }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the bar end and saw on the waste side of the line; let the blank drop clear onto the saw base and pick it up only after the blade has stopped. File the burrs off both sawn ends. Saw a 1 in offcut too: the spacer for Setup 4."
feed = "hand"

[[setups.operations]]
instruction = "Mike the blank at both ends and the middle: the head is the bar as bought."
inspection = "Blank Ø{{process.head_skim_min_in:.4dot}}–{{process.head_skim_max_in:.4dot}} at all three stations."
gauge_checks = [{ gauge = "micrometers", band_mm = [6.223, 6.35] }]

[[setups.operations]]
instruction = "Over {{process.head_skim_max_in:.4dot}} anywhere: Op 50 skims the head. Under {{process.head_skim_min_in:.3dot}}: saw a blank from another length of the bar (the Setup 5 hold needs a head of at least {{process.head_skim_min_in:.3dot}})."

[[setups]]
machine_kind = "lathe"
title = "Head end: face"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the blank, the head end {{process.end_stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the head end, faced in Op 40: the eye's station and the head's length run from it."
diagram = { file = "diagrams/head-end.svg", alt = "The blank in the 3-jaw, the head end out: faced square." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the head end square, about .03 in off, to the centre with no pip; set DRO Z0 on it. Break its edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Only if Op 20 read over {{process.head_skim_max_in:.4dot}}: skim Z0 to Z-{{process.head_turn_in:.2dot}} to {{process.head_skim_min_in:.4dot}}–{{process.head_skim_max_in:.4dot}}, aiming .2475, then mike it. Otherwise skip."
inspection = "Head Ø{{process.head_skim_min_in:.4dot}}–{{process.head_skim_max_in:.4dot}} (skimmed heads only)."
gauge_checks = [{ gauge = "micrometers", band_mm = [6.223, 6.35] }]
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Skimmed under {{process.head_skim_min_in:.4dot}}: scrap the blank and make another from Setup 1."

[[setups]]
machine_kind = "lathe"
title = "Thread end: face to length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw on the blank, the thread end {{process.end_stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the thread end as faced; the length is miked across both faces (Op 80), from the head end faced in Op 40."
diagram = { file = "diagrams/thread-end.svg", alt = "The blank turned round, the thread end out: faced to the screw's length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the thread end square in light skims toward {{cad.length_in:.2dot}}, reading the length between them (Op 80); stop inside {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, stop the spindle, take the blank out and mike it across both faces; chuck it again, the thread end {{process.end_stickout_in:.2dot}} in out. Write the final reading on the traveler: Op 160 sets the shoulder from it."
inspection = "Length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Under {{cad.length_min_in:.2dot}}: scrap the blank and saw another (Setup 1)."

[[setups]]
machine_kind = "other"
title = "Mill: the #54 eye"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise. One 1 in, 4 in long parallel of the 1/8 in thick set standing on edge, centred between the jaws, 1/16 in clear of each, its left end flush with the jaws' left face (a rule across both). The blank on its top edge along the jaws, the head end to the LEFT, set {{process.head_overhang_mm:in.2dot}} in out past the jaws' left face with the calipers' depth rod, never under .24; the 1 in offcut (Op 10) on the parallel's right end, so the moving jaw closes square. Tap both down onto the parallel while closing the vise. Under the eye nothing but air."
datum = "Program PS01_eye (cam:pn_pen_adjust_screw). G54: X0 the head end (faced in Op 40), +X along the blank; Y0 the blank's axis, +Y toward the fixed jaw; Z0 the top of the O.D. The file starts with an M6 for the centre drill."
diagram = { file = "diagrams/eye.svg", alt = "To scale: the blank on a 1 x 4 in parallel on edge between the jaws, its head end .25 in out past the jaws' left face; the #54 drill through the eye .16 in from the head end, its point in the air under it; a 1 in offcut on the parallel's right end balances the jaws." }
envelope = { x_span_mm = ["{{cad.length_mm}}", 3.175], y_span_mm = ["{{cad.stock_dia_mm}}", 3.175], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.stock_dia_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.eye_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_54_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.stock_dia_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.stock_dia_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.head_overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{process.head_overhang_mm}}", "{{cad.length_mm}}"], section_mm = { diameter = "{{cad.stock_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 Y0 the blank's axis from the fixed jaw, X0 the head end: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm, Ø.200). Y, before the blank goes in, the vise open: on the fixed jaw's face from the moving-jaw side, G10 L20 P1 Y(the miked O.D./2 − 2.540) in mm; for .2500, Y0.635. X, the blank clamped: its tip level with the blank's axis, on the head end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the centre drill over the axis."
instruction_detailed = "Console M6 T1 (#1 centre drill in the drill chuck, at least {{process.spot_projection_min_mm:in.2dot}} in out of it). MDI G0 X3.000 Y0.000: over the head end's overhang. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run PS01_eye: the #1 centre drill (T1, set 2800) spots the eye {{cad.cross_hole_station_in:.3dot}} in from the head end on the axis, to Ø{{process.spot_dia_mm:in.3dot}}; at the M6 stop the #54 drill (T2, at least {{process.drill_54_projection_min_mm:in.2dot}} in out of the chuck) goes in."
settings = "pn-centre-drill-c360"
milling_cuts = [
  { name = "eye spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = 71.12, stations_mm = "{{cad.cross_hole_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-54"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.cross_hole_dia_band_mm}}" }
instruction = "Cycle Start: the #54 drill (T2, set 2800) pecks the eye through the blank into the air under it, {{process.eye_peck_mm:in.3dot}} in pecks, full retract between."
settings = "pn-drill-54-c360"
peck = { step_mm = "{{process.eye_peck_mm}}", retract = "full" }
hole_depth_mm = "{{cad.stock_dia_mm}}"
milling_cuts = [
  { name = "eye drill", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.drill_54_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = 71.12, stations_mm = "{{cad.cross_hole_station_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp; a .055 pin gauge enters the eye through, a .059 does not."
inspection = "Eye Ø{{cad.cross_hole_dia_min_in:.3dot}}–{{cad.cross_hole_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.cross_hole_dia_band_mm}}" }]

[[setups.operations]]
instruction = "The .055 pin does not enter, or the .059 does: the drill is not a #54 or ran out; scrap the blank and make another from Setup 1."

[[setups]]
machine_kind = "lathe"
title = "Spigot: step-turn toward the chuck"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Thread end out, as in Setup 3: the eye's burrs filed off first; 3-jaw over a brass shim wrap on the head, the wrap trimmed to stay behind the jaw fronts; the thread end set {{process.spigot_stickout_mm:in.3dot}} in out of the jaw fronts with the calipers' depth rod (3 × the head's least Ø.245, the shop's limit for a step-turned hold); the head end toward the chuck."
datum = "Z0 (carriage DRO) the thread end, touched with the AR tool. The shoulder is at Z−(the Op 80 length − {{process.shoulder_aim_in:.3dot}}), .025–.045 in out of the jaw fronts."
diagram = { file = "diagrams/spigot.svg", alt = "To scale: the head in the 3-jaw over a shim wrap, the thread end .735 in out; the spigot turned to Ø.058 in .080 in steps toward the chuck; the AR tool's square left edge at the shoulder, .025–.045 in clear of the jaw fronts." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{process.spigot_stickout_mm}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}", support = "none", load_diameter_mm = "{{process.head_load_dia_mm}}" }
turning_support = { kind = "chuck_only", chuck_z_mm = -18.669 }

[[setups.operations]]
cut_kind = "other"
instruction = "Set the AR tool square to the axis, its point the leftmost part of tool and holder. Touch the thread end, DRO Z0; spindle stopped, bring the tool's left edge to the jaw fronts: the DRO reads from Z−(the Op 80 length − .295) to Z−{{process.spigot_stickout_mm:in.3dot}}, else re-chuck (Op 80 length over 1.025: face the thread end to 1.025 first, touch Z0 again). The shoulder's Z: −(that length − {{process.shoulder_aim_in:.3dot}}); for 1.020, Z−.700. Never feed past it."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_step = { length_mm = "{{process.step_mm}}", load_diameter_mm = "{{process.head_load_dia_mm}}" }
turning_cuts = [
  { name = "Spigot rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_datum_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_datum_out_far_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{process.rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.rough_feed_per_rev_mm}}" },
  { name = "Spigot finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_datum_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_datum_out_far_z_mm}}", start_diameter_mm = "{{process.rough_dia_mm}}", end_diameter_mm = "{{cad.step_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.finish_feed_per_rev_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Step-turn the spigot from Z0 toward the shoulder in steps {{process.step_mm:in.3dot}} long, never longer: in each step rough from Ø.25 to Ø{{process.rough_dia_mm:in.3dot}} in {{process.rough_radial_doc_mm:in.3dot}} cuts per side, then finish into Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}, aiming Ø{{process.spigot_aim_in:.4dot}}, in one {{process.finish_radial_doc_mm:in.4dot}} cut per side, before moving on. Never pass back over a finished step."
settings = "lathe-ar-c360"
