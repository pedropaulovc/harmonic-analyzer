# Pen adjust screw MHA-PN-07, one off. Turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC); the
# #54 eye is drilled on the PM-30MV from a program (the manufacturing
# premise, AGENTS.md: the CNC mill is never run as a manual mill). Route
# chosen for speed, from a 1.08 in blank of the 1/4 in C360 bar on hand, one
# piece as drawn (the two-piece and tailstock-stub routes are rejected: the
# first changes the drawing, the second bends the spigot past the shop's
# turning-deflection limit):
#
# - The head is the bar as bought: the drawing's head is Ø.24 at the title
#   block's .XX band, .23-.25, and the 1/4 bar lies in it. Only a bar over
#   .2500 has its head end skimmed to .245-.250, in the setup that faces it.
# - Both ends are faced next, so the blank is the screw's 1.01-1.03 length.
# - The eye is drilled while the blank is Ø.25 along its whole length: it
#   lies along the vise jaws on one parallel on edge, the head end .25 in out
#   past the jaws' left side, so the eye (.16 from the head end) is drilled
#   in the overhang into air; an offcut of the same bar on the 4 in
#   parallel's right end balances the jaw.
# - The Ø.058 x .70 spigot is step-turned toward the chuck with the head in
#   the jaws (prechips turning_step, #515): each step .080 in long at most is
#   roughed and finished before the tool moves on, so every cut loads the
#   head between the jaws and the tool, and the finished spigot outboard of
#   it is never cut again. prechips' turning_deflection screen (its packaged
#   brass data) accepts .080 steps (#515's case, a Ø.25 load section, finish
#   0.0049 mm against the 0.005 limit) and refuses .10.
# - The stick-out is inside the shop's 3 x D rule for a step-turned hold:
#   3 x the least head the hold allows (.245) = .735 in, which leaves the
#   shoulder .025-.045 in (0.6-1.1 mm) clear of the jaw fronts. The AR tool
#   reaches it safely: its 0° side cutting angle puts its point leftmost,
#   its left edge square to the axis, so nothing of tool or holder passes the
#   shoulder; the carriage stops at the shoulder and the cross slide faces
#   out to the head's O.D. and no further.
# - The #0-80 UNF thread is die-cut by hand at the bench (registry: die-cut
#   #0-80 thread), the head in the bench vise's soft jaws.
#
# Setups: 1 saw the blank, mike the bar; 2 lathe: face the head end (skim
# the head only if the bar is over .2500); 3 lathe: face the thread end to
# length; 4 mill: the #54 eye (program PS01_eye); 5 lathe: step-turn the
# spigot; 6 bench: die-cut the thread, deburr, check, bag (FINISH: plain).
#
# Flagged: no #0-80 class 2A ring gauge and no tailstock die holder are on
# record: the thread is die-cut at the bench and accepted by the blank's
# major (micrometer, before the die) and a hand trial of the MHA-PN-VN-53
# nut (McMaster 92671A115, the screw's mate).
title = "Pen Adjust Screw"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass rod, 1/4 in (drawing: brass)"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} C360 rod, the 48 in bar on hand; one blank {{process.blank_length_in:.2dot}} in long."
shop = "../shop"
stock_refs = ["c360-round-1-4"]
material_key = "lathe-c360"
milling_material = "brass"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant, homing, Feed Hold, tool changes, proving a file, burrs). No This
# job rows: the note's one job fact ("The head is the bar as bought") is
# Op 20's own words.
standing = true

[cad]
file = "../../out/features/pn_pen_adjust_screw/features.toml"
adapter = "turned_shaft"
part = "pn-pen-adjust-screw"

[parameters]
quantity = 1
stock_dia_in = 0.25
# The head (outer) is the bar as bought, inside the drawing's .23-.25.
as_supplied_outer = 1
# The 1.02 screw and about .03 to face off each end (authored).
blank_length_in = 1.08
# Setups 2 and 3: the out end this far out of the jaw fronts.
end_stickout_in = 0.4
# Setup 2, only for a bar over .2500: the head end skimmed this far (past
# the head's .32, so the shoulder lands on it) to .245-.250.
head_turn_in = 0.34
head_skim_min_in = 0.245
head_skim_max_in = 0.25
# Setup 5: the step-turned hold's load section is the head in the jaws, at
# least Ø.245 (6.223 mm); the shop's 3 x D rule then allows 18.669 mm
# (.735 in) out of the jaw fronts.
head_load_dia_mm = 6.223
spigot_stickout_mm = 18.669
# The head's length from the head end the shoulder is turned to (the
# drawing's .31-.33, aimed at its middle).
shoulder_aim_in = 0.32
# Setup 6: the die's chamfered face first stops at .60, aimed short because
# no die record gives the start chamfer (authored): a 1.5-thread chamfer at
# 80 TPI (.019) leaves about .58 of full thread, a 3-thread one (.0375)
# about .56, and Op 250 runs the die on a quarter turn at a time into the
# drawing's .57-.59; never within .04 of the shoulder's fillet at .70.
die_stop_in = 0.6
die_stop_max_in = 0.66
# Setup 6: the eye's .15-.17 station read to a .055 pin's far side (plus
# half the pin, .0275).
eye_far_side_min_in = 0.1775
eye_far_side_max_in = 0.1975
# Setup 5: the spigot's steps (authored; prechips' screen judges them).
turn_start_z_mm = 0.5
step_mm = 2.032
rough_dia_mm = 1.6002
rough_radial_doc_mm = 0.6096
rough_feed_per_rev_mm = 0.0508
finish_radial_doc_mm = 0.0635
# The finish aim: the rough Ø less one finish cut per side (.063 - 2 x .0025),
# inside the #0-80 class 2A major band .0563-.0595 (the test checks both).
spigot_aim_in = 0.058
finish_feed_per_rev_mm = 0.0254
# Mill (shop workholding.vise-pm-6, fixtures.parallels-lms-6745, 1/8 in
# thick): one 1 in parallel of the set standing on edge, centred between the
# jaws, 1/16 in clear of each (two would fill the 1/4 gap and take the
# grip), its left end at the jaws' left side; the blank lies on its top edge
# with the head end .25 in out past the jaws' left side.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The LMS 6745 parallels are 4 in long (as the dt_pinion_bracket plan
# records); the offcut spacer sits on the parallel's right end.
parallel_length_mm = 101.6
# The head end past the jaws' left side; the eye drills in this overhang.
head_overhang_mm = 6.35
# The jaw tops over the O.D. top (Z0); cam.py checks it.
jaw_top_over_od_mm = 13.1953
# The #54 drill runs this far past the rod's underside (authored); its tip
# then stands under the parallel's top by its point and this; cam.py checks it.
eye_drill_past_mm = 0.5
eye_tip_height_mm = -0.92
# The #1 centre drill spots to Ø1.6 mm (over the #54's 1.397), cam.py
# computes the depth.
spot_dia_mm = 1.6
# The #54 drill (shop tools.drill-54.diameter_mm); cam.py checks it.
drill_54_dia_mm = 1.397
# Pecks of the #54: under one diameter (prechips drill_pecking's step
# limit), full retract.
eye_peck_mm = 1.39
# Machine-capacity inputs (mm): tool lengths from spindle nose to tip.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# ASME B94.11M jobber length overall, #54: 1-7/8 in; the #1 combined drill
# and countersink 1-1/4 in. Bounded by their whole length below the chuck.
drill_54_oal_mm = 47.625
centre_drill_oal_mm = 31.75
# The least length each must stand out of the drill chuck to reach its
# depth with the chuck above the jaw tops; cam.py checks it.
spot_projection_min_mm = 20.0
drill_54_projection_min_mm = 26.0

