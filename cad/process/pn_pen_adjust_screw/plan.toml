cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "The last step ends at the shoulder's Z (Op 160), never past it: the tool's R.016 nose leaves the R{{cad.fillet_shoulder_radius_min_in:.2dot}}–{{cad.fillet_shoulder_radius_max_in:.2dot}} fillet. There, carriage still, feed the cross slide out to face the shoulder square, stopping as the point clears the head's O.D. (the jaw fronts are .025–.045 behind the point), then back off along +Z."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"
load_diameter_mm = "{{process.head_load_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: mike the spigot at the thread end, the middle and by the shoulder, before the die."
inspection = "Spigot Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} (the #0-80 class 2A major)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{cad.step_dia_max_in:.4dot}} or under {{cad.step_dia_min_in:.4dot}} at any station: scrap the screw and make another from Setup 1 (never a pass back over the spigot)."

[[setups]]
machine_kind = "other"
title = "Bench: die-cut the thread, check, bag"
machine = "Bench"
holding = "Bench vise with soft jaws on the head, the spigot up and square to the jaws."
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished screw: the .58 full #0-80 thread, the Ø.24 x .32 head with its #54 eye .16 from the head end, 1.02 overall." }

[[setups.operations]]
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Mike the die's thickness T. The #0-80 split die in the die stock, its start (chamfered) side down, its adjusting screw opened so the die cuts its largest; start it square on the spigot's end."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Cut down, half a turn on and a quarter back, dry, until the calipers' depth rod from the spigot's end to the die's top face reads {{process.die_stop_in:.2dot}} − T: the chamfered face is then {{process.die_stop_in:.2dot}} from the end, aimed short of {{cad.thread_length_in:.2dot}} of full thread (the die's chamfer is not on record; Op 250 runs it on). Never past {{process.die_stop_max_in:.2dot}} (the shoulder is about .70 from the end). Back the die off."
feed = "hand"

[[setups.operations]]
instruction = "Calipers from the thread end to where the full thread stops."
inspection = "Full thread {{cad.thread_length_min_in:.2dot}}–{{cad.thread_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thread_length_band_mm}}" }]

[[setups.operations]]
instruction = "Run the MHA-PN-VN-53 #0-80 nut (the screw's mate) on by hand to the full thread's end: it runs on without forcing and without shake."

[[setups.operations]]
instruction = "Full thread short: run the die on a quarter turn at a time, never past {{process.die_stop_max_in:.2dot}}, and read Op 230 again. Tight on the nut: close the die's adjusting screw an eighth of a turn, run the die down again to the same stop and try again. Shake, a torn thread or a full thread over {{cad.thread_length_max_in:.2dot}}: scrap the screw and make another from Setup 1."

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Take the burrs off the eye's two ends and the thread's start; break the shoulder's outer edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
feed = "hand"

[[setups.operations]]
instruction = "A .055 pin gauge through the eye: calipers from the head end to the pin's far side read {{process.eye_far_side_min_in:.4dot}}–{{process.eye_far_side_max_in:.4dot}} (the eye's station plus half the pin, .0275). Then the calipers' outside jaws across the head end and the shoulder face, the spigot beside the jaw."
inspection = "Eye {{cad.cross_hole_station_min_in:.2dot}}–{{cad.cross_hole_station_max_in:.2dot}} from the head end; head {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}} long."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.cross_hole_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.shoulder_band_mm}}" }]

[[setups.operations]]
instruction = "Eye or head out of its limits: scrap the screw and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the screw clean and dry (FINISH: plain; no coating) and bag it with its number."
