diagram = { file = "diagrams/face-off.svg", alt = "The back lying on stacked parallels, outside face down, bottom face at the fixed jaw, the half bore open upward; the 1/2 in end mill faces {{cad.grip_offset_in:.3dot}} off the mating face." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.height_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.pre_face_depth_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.depth_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{cad.pre_face_depth_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{cad.height_mm}}", z = "{{cad.pre_face_depth_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Work stop unlocked, its rod drawn back clear of the vise. G54 X0 the RIGHT end (N), Y0 the fixed jaw's face (B): edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the part, G10 L20 P1 Y-2.540; on the part's RIGHT end (N) from the right, G10 L20 P1 X2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the mating face as it stands, touched with the end mill on its N-end pad, beside the bore."
instruction_detailed = "Console M6 T1, the 1/2 in end mill reset to {{process.half_mill_projection_mm:in.2dot}} in out of the collet, the facing set (the bore ran it longer; the tool setter measures it). MDI G0 X-4.000 Y-8.000 (over the N-end pad, clear of the bore). Spindle stopped, its tip just dragging a .002 feeler leaf on the mating face: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "work-stop"
drilling = "none"
sizing = "other"
instruction = "Set the work stop: its rod between the jaws, low, its tip touching the blank's RIGHT end (N). Lock it."
inspection = "The rod's top at most {{process.stop_rod_top_max_mm:in.3dot}} above the stacks' top (the calipers' depth rod beside it). Each later blank is pushed against the rod as the vise closes: a .002 feeler leaf does not enter between them."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.stop_rod_top_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "First back only: prove CB11_face_off in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CB11_face_off (M6 T1; 2450, display near 2485): face the mating face down {{cad.grip_offset_mm:in.3dot}} at Z −{{cad.grip_offset_mm:in.3dot}} in one level, across the half bore. Unclamp; mic the depth, mating face to outside face, at both ends."
settings = "em-half-carbide-1018-3439-face"
inspection = "Depth {{cad.depth_min_in:.3dot}}–{{cad.depth_max_in:.3dot}}, miked at the N end and the far end; and at each end the grip offset, that end's recorded pre-face depth less its reading here, {{cad.grip_offset_min_in:.3dot}}–{{cad.grip_offset_max_in:.3dot}}."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.depth_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.grip_offset_band_mm}}" },
]
milling_cuts = [
  { name = "face off", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.grip_offset_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{cad.width_mm}}"] },
]

[[setups.operations]]
instruction = "Too little off (at either end, depth over {{cad.depth_max_in:.3dot}} or offset under {{cad.grip_offset_min_in:.3dot}}): reclamp as before (Z0 stands); send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − (the largest, over both ends, of the depth reading − {{cad.depth_mm:in.3dot}} and {{cad.grip_offset_mm:in.3dot}} − that end's offset) × 25.4); run CB11_face_off again and re-check. Too much off (at either end, depth under {{cad.depth_min_in:.3dot}} or offset over {{cad.grip_offset_max_in:.3dot}}), or one band short and the other full: stop and tell the owner."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Inspect, deburr, black enamel"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", part = "front", alt = "The finished front, looking down the bore: the ear holes either side, the web between each and the bore, the bore's place from the N end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
part = "front"
instruction = "Each front. Inspect first, the bore's edges still sharp (the deburr below breaks them): the bore was accepted in the pair (Setup 9). The ears and the bore's place from N now; under the web or outside a band: stop and tell the owner."
inspection = "Each ear's web to the bore, on the mating face: the calipers' outside jaw tips into the ear hole and the bore, closed on the web: at least {{cad.ear_wall_min_in:.3dot}} (MIN EAR WALL). Each ear's station: that web plus half the largest pin gauge that slips into that ear hole (try it now) plus half the bore's Ø recorded along the split line, {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}}. The bore's place: the calipers from N to the bore's near edge on the mating face, plus half its Ø recorded along the split line, {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{cad.ear_wall_min_mm}}", "{{cad.ear_wall_best_mm}}"] },
  { gauge = "calipers", band_mm = "{{cad.ear_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bore_location_band_mm}}" },
]

[[setups.operations]]
part = "back"
instruction = "Each back. Inspect first, the bore's edges still sharp (the deburr below breaks them); its depth and grip offset were accepted in Setup 10. Outside a band: stop and tell the owner."
inspection = "Bore Ø accepted in the pair (Setup 9). The bore's place, the calipers from N to the half bore's near edge on the mating face, plus half its Ø recorded along the split line, {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}}. Each tap drill's station from the bore: that place less the hole's X recorded in Setup 8 (near hole), or the far hole's X less that place, {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.bore_location_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ear_station_band_mm}}" },
]
diagram = { file = "diagrams/inspect.svg", part = "back", alt = "The finished back, looking down the half bore: the tapped ear holes either side, the bore's place from the N end." }

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Every half: deburr the bore's edges at the top and bottom faces and along the mating face (a back's is the faced one), R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, scraper and smooth file; no burr may stand proud of the mating face. Each back also: break the four outer edges of the mating face that Setup 10 faced and deburr both tap mouths on it flush (scraper; no countersink), then run a screw through each tapped hole again. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "If the enamel cannot follow now: oil each half lightly, bag each pair together and tag it with its pair number; wash the oil off before the enamel."
feed = "hand"

[[setups.operations]]
instruction = "Paint: the owner's Rust-Oleum Stops Rust Flat Black 376855 over Rust-Oleum Stops Rust Clean Metal Primer 7780830, the paint maker's primer for bare metal. The primer is not owned: buy it. The enamel: check the shelf, buy if none."
feed = "hand"

[[setups.operations]]
instruction = "Wash every half in detergent, rinse it in clean water and dry it thoroughly."
feed = "hand"

[[setups.operations]]
instruction = "Mask. A front: the bore, both ear holes (a plug or a #8 screw in each) and the outside face (the bar seats on it), the face opposite the bore. A back: the half bore and both tapped holes (a #8-32 screw in each)."
feed = "hand"

[[setups.operations]]
instruction = "Spray outdoors or in a well-ventilated space, at 50–90 °F and humidity under 70 %. Primer: shake the can a full minute after the ball rattles; 2 light coats a few minutes apart, the can 10–16 in off."
feed = "hand"

[[setups.operations]]
instruction = "Enamel straight after the primer: every unmasked face black, 2 or more light coats a few minutes apart, the can moving and at one distance, no runs. Any further coat within 1 hour or after 48 hours."
feed = "hand"

[[setups.operations]]
instruction = "Let it dry: tack-free in 2–4 hours, handle after 5–9 hours, fully dry in 24 hours."
feed = "hand"

[[setups.operations]]
instruction = "Unmask; wipe the bare bores, the ear and tapped holes and the fronts' outside faces with light oil."
feed = "hand"
