[[setups.operations]]
instruction = "The 8-32 plug tap, its thread at least .750 long (a standard hand tap), goes in the small T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole. If that wrench does not take the 8-32 tap: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the 8-32 tap in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stacks, this half, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run CB07_tap_1: M6 T5, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the near tap drill."
diagram = { file = "diagrams/tap.svg", alt = "The half as before, outside face up; the 8-32 tap in the T-handle wrench in a tap drill, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_point_depth_mm:in.3dot}} below the outside face, through the mating face." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the outside face beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 X3.810 (beside the hole, on the outside face), G90, then send G20: the DRO reads inches. Stand the 8-32 plug tap, in its T-handle wrench, on its point on the outside face; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21 and MDI G91 G0 X-3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-8-32"
drilling = "none"
sizing = "other"
instruction = "Send G20 (the DRO reads inches). Tap {{cad.ear_thread}} through by hand under the tap guide, spindle off, cutting oil: the spring keeps the point in the wrench as the tap feeds, up to 1/2 in. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z − {{process.tap_point_depth_mm:in.3dot}}: the point through the mating face, the full thread the whole depth."
instruction_detailed = "Send G20, as when the depth was noted. Tap's point in the hole, a drop of cutting oil; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn; push the point home again before the tap has gone 1/2 in. To read, push it fully home: stop at the noted Z − {{process.tap_point_depth_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
inspection = "One of the pair's MHA-SH-VN-53 screws runs through the thread by hand."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Only if the screw binds: run the tap through again under the tap guide and try the screw again. Still binds: stop and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run CB08_tap_2 (the tap guide still in, spindle off; it ends Idle over the far tap drill). Tap it the same way: G20, depth reference beside it, tap through to the same depth under the tap guide, G21, back out, blow out, screw check."
feed = "hand"

[[setups]]
machine_kind = "other"
part = "back"
title = "Deburr, then the pair bore: each back bolted to its front"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The bolted pair (op before this setup's touch-off) in the vise: the back's outside face against the FIXED jaw; a 1-2-3 block standing on the vise bed on a 1 x 3 in face, 2 in tall, its 1 x 2 in face against the front's outside face centred between the screw heads ({{cad.block_head_clear_in:.3dot}} clear of each head); the MOVING jaw on the block's far 1 x 2 in face. Under the pair, the 1 in parallels: one under the front, against the block; one against the fixed jaw under the back's N end only, its end {{process.back_parallel_end_mm:in.3dot}} from the bore axis ({{cad.back_parallel_clear_in:.3dot}} clear of the bore). Close the vise SNUG, NOT HARD (the back's wall behind the bore is {{cad.bore_wall_worst_in:.3dot}} at worst): tap the pair down onto both parallels with a soft mallet while closing it; both parallels pinned."
serves = ["front", "back"]
programs = ["CB09_pair_bore", "CB10_bore_open"]
datum = "Program CB09_pair_bore. G54: X0 the two N ends (flush, on the LEFT), the pair to +X; Y0 the split line, +Y toward the fixed jaw (the back); Z0 the parallels' top (both B faces). The bore at X {{cad.bore_location_in:.3f}} in, Y0. No work stop here. Every pair: every touch-off again (Y0 is that back's own depth)."
diagram = { file = "diagrams/pair.svg", alt = "From above: the fixed jaw on the back's outside face, the back, the split line, the front, the two screw heads on the front's bar face with the 1-2-3 block between them against the moving jaw; one parallel along the front against the block, one along the back stopped short of the bore; the 1/2 in end mill interpolates the full bore on the split line." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.pair_depth_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.bore_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.bore_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.bore_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.pair_jaw_span_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{cad.height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{cad.pair_depth_mm}}", z = "{{cad.height_mm}}" }, vise_left = "start" }

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Every half: deburr the drill exits (a back's: the tap exits) on the mating face flush (scraper from the deburring set; no countersink), then break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. The mating face must lie flat on its mate's: stone it lightly on a flat stone and wipe it. Keep N and B readable. Wash off the oil."
feed = "hand"
inspection = "Mating face down on the surface plate: it does not rock and no burr stands proud."
gauge_checks = "other"
diagram = { file = "diagrams/deburr.svg", part = "front", alt = "A front on the bench, mating face up: the drill exits deburred flush, the edges broken." }

[[setups.operations]]
instruction = "Only if it rocks or a burr stands proud: stone it again and check it again."
feed = "hand"

[[setups.operations]]
part = "back"
instruction = "Each back: mic the pre-face depth, mating face to outside face, at the N end and at the far end; write both readings, labelled N and far, on this traveler with the back's number (this setup's Y0 and Setup 10 use them)."
feed = "hand"
inspection = "Pre-face depth {{cad.pre_face_depth_min_in:.3dot}}–{{cad.pre_face_depth_max_in:.3dot}} at both ends. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.pre_face_depth_band_mm}}" }]
diagram = { file = "diagrams/deburr.svg", part = "back", alt = "A back on the bench, mating face up, at its pre-face depth: the tap exits deburred flush, the edges broken." }

[[setups.operations]]
instruction = "On the bench: bolt a back to a front (both deburred as above), mating face to mating face, with the pair's own two MHA-SH-VN-53 screws (90280A201 #8-32 × 1-1/4 narrow fillisters; none in hand: stop, no substitute) through the front's ear holes into the back's taps, heads on the front's outside face."
instruction_detailed = "On the surface plate: both halves on their B faces, N ends together against the side of a 1-2-3 block; snug the screws, then tighten them. The screw tips stop at least {{cad.screw_short_in:.3dot}} short of the back's outside face."
inspection = "N ends flush (a fingernail across them finds no step) and both B faces flat on the plate (no rock); each screw tip at least {{cad.screw_short_in:.3dot}} below the back's outside face (the calipers' depth rod down each tapped hole). A tip proud: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Only if the N ends step or a B face rocks: loosen the screws, reseat the halves and tighten again; check again."
feed = "hand"

[[setups.operations]]
instruction = "Mic the column this clamp goes on (MHA-FR-03, 1020 DOM tube, 1.000 OD × .120 wall) where the clamp will sit, two readings 90° apart; record both for this pair. The bore is accepted on them."
feed = "hand"

[[setups.operations]]
instruction = "No work stop in this setup: its rod drawn back clear of the vise. G54 X0 the N ends, Y0 the split line: edge finder (900 rpm) on the N ends and on the fixed jaw, less this back's recorded pre-face depth."
instruction_detailed = "Edge finder (900 rpm), its tip .10 below the pair's top: on the N ends from the left, G10 L20 P1 X-2.540. On the fixed jaw's face beside the pair (right of it), G10 L20 P1 Y(the mean of this back's two recorded pre-face depths, in mm, − 2.540). The split line is that depth from the jaw."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top, touched with the end mill on the front's parallel right of the pair."
instruction_detailed = "Console M6 T1, the 1/2 in end mill at least {{process.bore_mill_projection_min_mm:in.2dot}} out of the collet (the collet's face must clear the block and the fixed jaw at the bore's bottom; the tool setter measures it). MDI G0 X55.400 Y-12.000: the cutter right of the pair, over the front's parallel and clear of the block. Spindle stopped, its tip just dragging a .002 feeler leaf on that parallel: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First pair only: prove CB09_pair_bore in air, Z0 raised 1.000 in; the helix circles the bore's place and clears the screw heads and the block. Then Z0 back."
feed = "hand"

# CB09 runs outside the measured envelope of the 1/2 in end mill (shop
# settings.em-half-carbide-1018-3439-face/-v6-deep): the rough helix cuts the
# cutter's full width, the finish a 17.0 mm deep wall. Owner ruling (Pedro,
# 2026-11-22), no re-cut: for full-width passes "same log new dechatter
# issues to try full radial depth but shallow axial" (#3428); for deep walls
# "log new dechatter issues to try deep axial cuts but with shallow radial
# depth" (#3427). It keeps the chart setting; the first pair is watched.
[[setups.operations]]
instruction = "First pair only: these CB09 cuts at 2650 rpm have not been chatter-tested on this end mill (owner's test list #3427, #3428): rough helix {{process.helix_pitch_mm:in.3dot}} deep a turn x {{process.face_cutter_dia_mm:in.3dot}} wide, finish turn about .67 deep x {{process.bore_finish_stock_mm:in.3dot}} wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CB09_pair_bore (M6 T1; set 2650): the end mill helixes down the bore's place, climbing, {{process.helix_pitch_mm:in.3dot}} a turn, to {{process.bore_past_mm:in.3dot}} below the pair, then a finish turn and a spring turn at full depth. Cutting oil on the pair before Cycle Start; hands clear until the program ends, then blow the chips out of the bore. It puts the bore {{cad.bore_location_in:.3dot}} from the flush N ends, where both halves' holes were drilled from. Then, still clamped, gauge the bore."
rpm = 2650
feed = "{{process.bore_feed_per_min_mm:in.1f}} in/min"
inspection = "Bore Ø (Ø{{cad.bore_dia_in:.3dot}} REF) still clamped: at least {{cad.bore_clearance_min_in:.3dot}} over the larger column reading and at most {{cad.bore_clearance_max_in:.3dot}} over the smaller, each reading on the 3/4–1-1/4 in telescoping gauge at mid-height, across the split line and along it, read on the 0–1 in or 1–2 in micrometer."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = "{{cad.bore_dia_band_mm}}" }]
milling_cuts = [
  { name = "bore rough", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{process.helix_pitch_mm}}", radial_woc_mm = "{{process.face_cutter_dia_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
  { name = "bore finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = "{{process.bore_finish_stock_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
]

# CB10 runs outside the measured envelope too: a 17.0 mm deep wall. Owner
# ruling (Pedro, 2026-11-22), no re-cut: "log new dechatter issues to try
# deep axial cuts but with shallow radial depth" (#3427).
[[setups.operations]]
instruction = "First pair that needs CB10 only: this CB10 cut at 2650 rpm has not been chatter-tested on this end mill (owner's test list #3427): opening turn about .67 deep x {{process.bore_open_radial_mm:in.3dot}} wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Bore under the larger column reading plus {{cad.bore_clearance_min_in:.3dot}} either way: run CB10_bore_open (M6 T1; set 2650): down the bore's centre, out, a turn {{process.bore_open_mm:in.3dot}} larger on the diameter and a spring turn; gauge again. Over the smaller column reading plus {{cad.bore_clearance_max_in:.3dot}} either way, or still under after CB10: stop and tell the owner."
rpm = 2650
feed = "{{process.bore_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "bore open", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = "{{process.bore_open_radial_mm}}", rpm = 2650, feed_mm_min = "{{process.bore_feed_per_min_mm}}", stations_mm = "{{cad.bore_location_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp (the pair still bolted) and gauge the bore again the same two ways: the vise's squeeze may have held it round or oval."
inspection = "Bore Ø unclamped, across the split line and along it: at least {{cad.bore_clearance_min_in:.3dot}} over the larger column reading and at most {{cad.bore_clearance_max_in:.3dot}} over the smaller. Outside it only now: stop and tell the owner (the vise sprang the pair; do not re-clamp to open it). In band: scribe the pair number on both halves' N ends and record both bore readings, labelled across and along the split line, and both column readings for the pair."
gauge_checks = [{ gauge = "telescoping-gauges-starrett-s579gz", band_mm = "{{cad.bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "Unbolt the pair; keep the screws with it. The back goes to Setup 10; the front waits for it at Setup 11."
feed = "hand"

[[setups]]
machine_kind = "other"
part = "back"
title = "Backs: face the grip offset off the mating face"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The back alone, on the stacks: the outside face down, B against the FIXED jaw, gripped on B and the top, centred; the mating face up, the half bore open upward. Snug: the wall behind the bore is thin. Tap it down onto both stacks while closing the vise."
