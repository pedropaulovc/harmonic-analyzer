title = "Saw the blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 in square bar with blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end, a saw kerf between each." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.blank_count:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/4 in square 1018 bar, the bar flat in the saw's vise: {{process.quantity:d}} for the fronts and {{process.quantity:d}} for the backs, about {{process.sawn_bar_length_in:.1f}} in of bar with the kerfs."
feed = "hand"
inspection = "Each blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Shorter: scrap it. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] }]
table = { columns = ["Finished size", "Front {{cad.front.drawing_number}}", "Back {{cad.back.drawing_number}}"], rows = [
  ["Width, N to the far end", "{{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}", "{{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}"],
  ["Height, B to the top", "{{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}", "{{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}"],
  ["Depth, mating face to outside face", "{{cad.front.depth_min_in:.3dot}}–{{cad.front.depth_max_in:.3dot}}", "{{cad.back.depth_min_in:.3dot}}–{{cad.back.depth_max_in:.3dot}} ({{cad.back.pre_face_depth_min_in:.3dot}}–{{cad.back.pre_face_depth_max_in:.3dot}} until Setup 10's face-off)"],
  ["Ear holes, both", "#9 drill through, Ø{{cad.front.ear_dia_min_in:.3dot}}–{{cad.front.ear_dia_max_in:.3dot}}", "{{cad.back.ear_thread}} through, #29 tap drill"],
