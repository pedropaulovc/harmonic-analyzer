indexing = "none"
envelope = "other"
vise_hold = "other"
diagram = { file = "diagrams/pivot-block/saw.svg", alt = "A 1.70 strip from the 1187 bar end, then the strip cut across to a 1.70 square blank" }
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "From the 1187 bar end: one {{process.blank_length_in:.2f}} strip, waste side of the line; ≥{{process.blank_min_length_in:.2f}}."
instruction_detailed = "Square the 1187 bar end first if it is rough. Mark {{process.blank_length_in:.2f}} from the end and saw on the waste side of the line (~{{process.kerf_in:fraction}} kerf); the strip must be at least {{process.blank_min_length_in:.2f}} long. The rest of the bar goes to TL-32."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Cut the strip across to {{process.blank_width_in:.2f}}, waste side of the line; ≥{{process.blank_min_width_in:.2f}}."
instruction_detailed = "Clamp the {{process.bar_width_in:fraction}} in strip in the saw vise with the short offcut on the free side, mark {{process.blank_width_in:.2f}} from one as-bought edge and saw on the waste side of the line; the blank must be at least {{process.blank_min_width_in:.2f}} across."
feed = "hand"

