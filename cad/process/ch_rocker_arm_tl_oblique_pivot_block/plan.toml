# Source: the v50 MHA-CH-06-TL-22 sheet through its feature manifest (sizes,
# stations, rows, limits, the counterbored .375 seat and its 5/16-18 tap). No
# hand traveler exists for this block. Route, tools, speeds, workholding and
# datums are authored here: one blank from the OnlineMetals 1187 1 x 3 in bar
# (cad/config/shop-equipment.toml [[stock]]; the sheet's material block names
# it, coordinator 2026-11-14), sawn twice to 1.70 x 1.70 so every face is a
# clean-up and a cut to size (blind review 2026-11-14 X1). Both faces faced,
# the four sides faced on end, then every hole from TOP in one hold. The seat
# takes the title block's DRILLED HOLES band, .375-.379 (owner ruling
# 2026-11-13): a plunged 3/8 end mill (LMS 6784 set), miked at .375 or over,
# cuts it and squares its floor; the owned pin-gauge set checks it.
# Speeds: the jig sheets' LittleMachineShop 6061-T6 row, 165 ft/min:
# rpm = 12 × 165 / (π × D in), rounded down to 50, capped at the PM-30MV's
# 3000 (#15 3501 → 3000; F 2452 → 2450; 5/16 2017 → 2000; 3/8 1680 → 1650).
# The 1/2 in end mill faces at block-em-half-6061-t6511 (1800 rpm, 8 in/min,
# .0022 in/tooth). Every speed lies in the high belt range (1400-3000), so
# the belt never moves.
title = "Oblique trammel pivot block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{process.blank_thickness_in:fraction}} × {{process.bar_width_in:fraction}} × 12 in bar (OnlineMetals 1187, shared with TL-32); {{process.quantity:d}} blank {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:.2f}} × {{process.blank_length_in:.2f}} in (two saw cuts)."
note = "Inches. Every face machined; all holes from TOP in one hold."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_pivot_block/features.toml"
adapter = "harmonic_pivot_block"

[parameters]
bar_width_in = 3.0               # 1187 bar width.
blank_length_in = 1.70           # Along the bar: Y 1.58 + two clean-ups + saw allowance.
blank_min_length_in = 1.66
blank_width_in = 1.70            # Second cut across the bar: X 1.64 + clean-up + allowance.
blank_min_width_in = 1.67
blank_thickness_in = 1.0         # 1187 bar thickness; faces to .96.
quantity = 1
kerf_in = 0.125                  # As the jig sheets: about 1/8 in per cut.
cleanup_in = 0.02                # First face of each pair: just clean.
layer_in = 0.05                  # Facing layers down to size, the last .005-.010.
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). Archive values are
# archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
face_parallel_height_mm = 25.4   # 1 in parallels (shop-equipment parallels-lms-6745).
edge_parallel_height_mm = 12.7   # 1/2 in parallels, same set.
face_cutter_dia_mm = 12.7        # 1/2 in end mill (LMS 6784 set).
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# Archive LMS 6784 projections from the R8 collet: 1/4 in 25, 7/16 in 41,
# 11/16 in 50; the 1/2 and 5/16 in cutters have no member record, so their
# neighbours bound them.
face_mill_projection_min_mm = 41.0
face_mill_projection_max_mm = 50.0
small_mill_projection_min_mm = 25.0
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Archive drill-index-115 13/32 in member, 112.8 out of drill-chuck-r8: a
# recorded jobber above every drill here, so it bounds the longest drill.
drill_projection_max_mm = 112.8
# A plug tap runs its 3-5 chamfered threads (5 × 1.411 mm pitch) and a little
# more past SEAT before full thread reaches it; the parallels leave the gap.
tap_tip_z_mm = -8.0
# Milling deflection (prechips milling_deflection). A part standing in the
# vise on the 1/2 in parallels is gripped only up to the jaw tops:
# jaw_grip_mm = vise_jaw_height_mm − edge_parallel_height_mm (44.9453 − 12.7).
# The 1/2 in cutter faces at block-em-half-6061-t6511 (1800 rpm, 8 in/min =
# 203.2 mm/min) in .40 in (10.16 mm) steps across a face, a full 12.7 mm
# width across a .96 end or edge. Hand-fed drills and plunges are declared
# at .001 in/tooth (.002 in/rev).
jaw_grip_mm = 32.2453

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
