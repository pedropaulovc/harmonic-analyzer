# Pinion pivot block MHA-DT-18 (qty 2), routed for the CNC mill for speed
# (owner ruling 2026-11-21: the agent chooses the route, the owner corrects
# it afterwards). Each block from one blank sawn 1.05-1.15 long off the
# 1/2 x 2-1/4 in 1018 cold-finished flat bought for it: the bar's 2-1/4
# width becomes the block's 1.57 width (X), its waste (~.34 a side) left on
# the ends to be gripped while the other faces are cut; the sawn length
# becomes the .99 height (Y); the bar's 1/2 thickness the .44 depth (Z), the
# as-bought face kept as the back face and the front face faced to depth.
#
# Route: saw; Setup 2 on edge on the 1 in parallels, the back face against
# the FIXED jaw, gripped on the bar's two cold-finished faces: skim a sawn
# face to the bottom face B, square to the back face (PB01); Setup 3 on edge,
# B down on the 1 in parallels, gripped on the bar's two edges (the end
# waste): face the top to the height, spot and drill both #9 hold-down holes
# through between the parallels, their stations from the east bar edge E
# (PB02); Setups 4-5 upright on the 1/2 in parallels, gripped on B and the
# top: skim E .100 to the east end (PB03), turn over, face the west end to
# the width (PB04), which puts the hold-downs at their stations from the
# finished ends; Setup 6 lying on the 1-1/2 in parallel stacks, gripped on
# the two ends, the west end against the fixed jaw: face the front face to
# the depth, spot both bores, drill the pivot bore C and ream it .2510, drill
# the lift bore F, all through from one zero
# (PB05: X from the west end, Y from B); bench deburr and inspect. Finish:
# black oxide, in the shop. Owner (Pedro), answered in person 2026-11-21:
# "Black oxide: cold blackening in the shop with Presto Black PC9 is
# acceptable as the drawing's black oxide." The last setup blackens the
# block with Birchwood Presto Black Steel PC9 by the maker's instructions
# (Presto Black Steel PC9 Instructions, steps 1 prepare, 2b brush-on, 3
# stop, 4 dry, 6 seal; cad/config/shop-equipment/
# consumables.presto-black-steel-pc9, which cites them); the PC9 and the
# gloves and glasses (consumables.chemical-gloves-eye-protection) are to buy
# (to_order).
#
# Why this order: a face can only be faced across the jaws when it is up, and
# side-milled faces would leave sawn lips at the gripped ends. Each face is
# therefore faced up while the jaws hold faces still to be cut or as-bought
# faces. The hold-downs, centred in the .44 depth and .22 from the east end,
# would each reach a 1/8 in parallel if drilled with the jaws on two finished
# faces; they are drilled through clear of the parallels while the jaws grip
# the end waste, so the bar edge E is their station datum and PB03 takes
# exactly .100 off it.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero the end mill on a
# .002 feeler leaf, as the column clamp plans do.
#
# NC (cam:dt_pinion_pivot_block, cad/process/dt_pinion_pivot_block/cam.py):
# PB01_bottom, PB02_top_holds, PB03_east_end, PB04_width, PB05_front_bores.
# Program names, the [parameters] and the milling_cuts names are a contract
# with that recipe. Tool numbers are the places in the tools list among the
# mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #9, T4 C drill,
# T5 F drill, T6 .2510 reamer.
#
# Bores (owner ruling 2026-11-24, fit audit question 12; fit audit F26): the
# pivot bore is reamed .2510 with no band, the MHA-DT-19 shaft its gauge (it
# enters and turns by hand); the lift bore is F drilled, MHA-DT-17 turning
# freely in it. No gauge pins on either. To buy before Setup 6 (status
# to_order in cad/config/shop-equipment/): the .2510 reamer
# (tools.reamer-2510). Setup 7 reads the bore positions over pins from the
# owned pin-gauge set, .250 in the pivot bore and .257 in the lift bore, each
# miked first.
title = "Pinion pivot block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/2 × 2-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "1/2 × 2-1/4 in flat bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks."
shop = "../shop"
stock_refs = ["1018-flat-1-2x2-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

standing = true

[[notes]]
title = "This job"
rows = [
  ["Finished", "Finished {{cad.east_end_width_min_in:.3dot}}–{{cad.east_end_width_max_in:.3dot}} wide (west end W to east end E), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (bottom face B to the top), {{cad.front_face_depth_min_in:.3dot}}–{{cad.front_face_depth_max_in:.3dot}} deep (back face K, left as bought, to the front face)."],
  ["Marks", "K the back face, E the east bar edge (later the east end), B the bottom face; keep them readable until Setup 7."],
  ["To buy", "The .2510 reamer (Setup 6 waits for it); the Presto Black Steel PC9, gloves and safety glasses (Setup 8 waits for them)."],
]

