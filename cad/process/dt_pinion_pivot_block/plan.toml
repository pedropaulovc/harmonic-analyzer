[[setups.operations]]
instruction = "Bore positions, one bore at a time, a pin from the pin-gauge set in the bore: the .250 in the pivot bore, the .257 in the lift bore, each miked first (P). Each reading the calipers' outside jaws from the face to the far side of the pin, less P/2. Pivot bore from W and from B; lift bore from W."
inspection = "Pivot bore from W {{cad.pivot_bore_x_from_west_min_in:.3dot}}–{{cad.pivot_bore_x_from_west_max_in:.3dot}} and from B {{cad.pivot_bore_height_min_in:.3dot}}–{{cad.pivot_bore_height_max_in:.3dot}}. Spacing along the width, the pivot bore's reading from W less the lift bore's: {{cad.lift_bore_spacing_min_in:.3dot}}–{{cad.lift_bore_spacing_max_in:.3dot}}. The pivot bore as left by the reamer, the lift bore by the F drill (the drawing's Ra): no tears or chatter marks. Outside any: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.pivot_bore_x_from_west_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.pivot_bore_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.lift_bore_spacing_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "Rise of the lift bore over the pivot bore: the block on B on the surface plate, the height gauge on top of each bore's pin in turn, less half that pin's reading; the lift bore's reading less the pivot bore's."
inspection = "Rise {{cad.lift_bore_rise_min_in:.3dot}}–{{cad.lift_bore_rise_max_in:.3dot}}. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.lift_bore_rise_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Every block: hold-downs from the front face, on the top; the #9 drill's shank (miked) in each hole as the pin, the calipers from the front face over the shank, less half its Ø."
inspection = "Each hold-down {{cad.west_hold_down_z_from_front_min_in:.3dot}}–{{cad.west_hold_down_z_from_front_max_in:.3dot}} from the front face. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.west_hold_down_z_from_front_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Fit, if the MHA-DT-17 pinion lift rod is at hand: it slides and turns freely in the lift bore. Tight: stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "In band: go on to the blackening. If it must wait, oil each block lightly against rust with the stone lubricant (a light honing oil, on the shelf) and bag it with its number; the next setup washes the oil off."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blacken with Presto Black Steel PC9 (the drawing's black oxide)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/blacken.svg", alt = "The finished block, every surface to be blackened: the six faces, both bores and both hold-down holes." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the block with soap and water to take off the oil; rinse and dry it. Hold it by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff the outside faces lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping the faces flat. Not in the bores or the holes. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface with even, light strokes, into both bores and both hold-down holes; re-wet the brush and go over the edges, the holes and any light spot until the block is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over, no bare spot and no wiping-off coating. Fits after blackening: MHA-DT-19 still enters the pivot bore and turns by hand. Tight: stop and tell the owner; do not re-ream."
gauge_checks = "other"
