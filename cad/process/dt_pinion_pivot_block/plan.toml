[parameters]
quantity = 2
# The bar (stock.1018-flat-1-2x2-1-4, 19 in on hand) and the blank the
# programs are posted for. Width and thickness bands: the author's, a mike
# check of the bar before sawing (outside them the programs' stock tops and
# clearances are not proved). Sawn length: 1.10 ±.05 for the saw.
blank_width_min_in = 2.245
blank_width_max_in = 2.255
blank_width_min_mm = 57.023
blank_width_max_mm = 57.277
blank_thickness_min_in = 0.495
blank_thickness_max_in = 0.505
blank_thickness_min_mm = 12.573
blank_thickness_max_mm = 12.827
blank_length_min_in = 1.05
blank_length_max_in = 1.15
blank_length_min_mm = 26.67
blank_length_max_mm = 29.21
# The smallest blank along each model axis, for stock_fit: X the bar's width,
# Y the sawn length, Z the bar's thickness.
blank_x_in = 2.245
blank_y_in = 1.05
blank_z_in = 0.495
# Skims (author's choice): .040 off the sawn face that becomes B (enough to
# clean a sawn face's waviness and its tilt over the .5 thickness); .100 off
# the east bar edge, which puts the east hold-down's #9 2.46 mm clear of the
# fixed-jaw parallel in PB02. The top, the west end and the front face are
# faced to size from them in equal levels no deeper than face_step_max_mm.
bottom_skim_mm = 1.016
east_skim_mm = 2.54
face_step_max_mm = 1.27
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) at the
# measured setting em-half-carbide-1018-3439-face (shop common.toml; cad/
# config/shop-equipment/measured-cuts.toml, #3439: stable to 1.27 mm deep and
# 6.4 mm wide, conventional, 2420-2490 rpm in the cut), equal passes across
# the face no wider than .250 in (half the cutter, inside its 6.4 mm), the
# first engaging one stepover and the last overhanging the far edge; the
# zigzag climbs on every other pass, which the session did not measure.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
# Stock tops the programs start from (cam.py checks them): PB02 the longest
# blank less the B skim; PB04 the widest bar less the E skim; PB05 the
# thickest bar.
edge_top_max_mm = 28.194
upright_top_max_mm = 54.737
front_top_max_mm = 12.827
# Holes: spot Ø.150 with the #2 centre drill, under the #9, the C and the F
# (no chamfer at the mouth); each drill's full diameter 1.0 mm past the far
# face into the gap between the parallels. The #9 hold-downs (.99 deep, L/D
# 5.1) pecked .180 (under one diameter) with full retracts; the C and F
# drills (.44 deep, L/D 1.8 and 1.7) in one feed. The reamer's tip 1.778
# below the back face: its 45° lead (about .02 on a 1/4 chucking reamer) is
# past the back face, its tip above the C drill's.
spot_dia_mm = 3.81
peck_mm = 4.572
drill_past_mm = 1.0
hold_tip_height_mm = -2.496      # 1.0 + the #9's 118° point (1.496); cam.py checks it.
bore_tip_height_mm = -2.847      # 1.0 + the C drill's 118° point (1.847); cam.py checks it.
lift_tip_height_mm = -2.961      # 1.0 + the F drill's 118° point (1.961); cam.py checks it.
ream_tip_height_mm = -1.778
ream_r_plane_mm = 12.176        # The R plane: the depth plus 1.0 (cam.py SAFE_MM); cam.py checks it.
ream_clear_mm = 16.176          # The program's clearance: the depth plus 5.0 (cam.py CLEAR_MM); cam.py checks it.
# The hold-downs' stations in PB02 from the east bar edge E against the fixed
# jaw (the drawing's stations from the east end plus east_skim_mm); cam.py
# checks them.
hold_west_y_mm = -24.892
hold_east_y_mm = -8.128
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min, reaming 40-65 ft/min; AutoDrill
# "Suggested drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/16 in
# .001, 1/8 in .003 in/rev, a size between two columns taking the lower
# one's feed. Centre drill: 1800 rpm × .001 = 1.8 in/min (the column clamp's
# spot). #9 (.196): 1200 rpm (62 ft/min) × .003 = 3.6 in/min. C (.242) and
# F (.257): 1000 rpm (63 and 67 ft/min) × .003 = 3.0 in/min. .2510 reamer: 650 rpm
# (43 ft/min) × .005 in/rev (author's choice, no source) = 3.25 in/min, in and
# out. cam.py posts these.
spot_feed_per_min_mm = 45.72
hold_feed_per_min_mm = 91.44
bore_feed_per_min_mm = 76.2
lift_feed_per_min_mm = 76.2
ream_feed_per_min_mm = 82.55
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): on edge a 1 in parallel against each jaw; upright a 1/2 in
# parallel against each jaw; lying the 1 in and 1/2 in parallels stacked
# against each jaw (1.5 in), so every faced face stands above the jaw tops.
parallel_height_mm = 25.4
short_parallel_height_mm = 12.7
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels under the part.
edge_grip_mm = 19.5453
upright_grip_mm = 32.2453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides: Setup 2 the bar width, Setups 3-5 the bar
# thickness, Setup 6 the height.
vise_bar_inset_mm = -50.76
vise_thick_inset_mm = -72.99
vise_lying_inset_mm = -66.76
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out its
# measured setting allows (cad/config/shop-equipment/measured-cuts.toml:
# 27.94 to 28.45 mm).
half_mill_projection_mm = 28.45
# ASME B94.11M jobber lengths, overall: #9 3-1/2 in, C 3-7/8 in; the #2
# combined drill and countersink 1-7/8 in; ANSI B94.2 1/4 in chucking reamer
# 6 in. Bounded by their whole length below the chuck.
drill_9_oal_mm = 88.9
drill_c_oal_mm = 98.425
centre_drill_oal_mm = 47.625
reamer_oal_mm = 152.4

