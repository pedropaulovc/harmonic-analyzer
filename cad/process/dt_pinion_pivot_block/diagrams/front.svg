<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- Plan 6 px/mm, fixed jaw at the top (+X right, +Y up). Section across the jaws 4 px/mm seen from the top face's side (+X out of the page), +Y (W, the fixed jaw) right. The 1/2 in end mill (76.2 px in the plan, 50.8 px in the section, 113.8 px out of the collet, 12 % end arc) on PB05's first level, Z 12.002 (0.825 under front_top_max_mm 12.827), pass Y -22.491 (wholly over the block), entering at B (X0), +X (NC line 35). Each stack is the 1 in and the 1/2 in parallel. The bores are drilled and reamed in Ops 340-360 (their own pictures). -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 6 (PB05): lying on the 1-1/2 in stacks, jaws on the two ends; face the front face</text>
  <text class="title" x="40" y="48">Plan, 6 px/mm (fixed jaw at the top)</text>
  <text class="title" x="400" y="48">Across the jaws, 4 px/mm, from the top face (+X toward you)</text>
  <rect class="clamp" x="40" y="60" width="270" height="30"/>
  <rect class="clamp" x="40" y="329.3" width="270" height="30"/>
  <rect class="part-kept" x="100" y="90" width="150.9" height="239.3"/>
