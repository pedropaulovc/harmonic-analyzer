<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 1, plan of the bar (4 px/mm): two blanks sawn square across the 2-1/4 width</text>
  <!-- The bar, 57.15 mm wide; two 27.9 mm blanks off its end, a 1/8 in kerf before each. -->
  <rect class="fixture-table" x="20" y="60" width="720" height="290"/>
  <rect class="part-rest" x="40" y="100" width="411" height="228.6"/>
  <rect class="part-removed" x="451" y="100" width="12.7" height="228.6"/>
  <rect class="part-kept" x="463.7" y="100" width="111.8" height="228.6"/>
  <rect class="part-removed" x="575.5" y="100" width="12.7" height="228.6"/>
  <rect class="part-kept" x="588.2" y="100" width="111.8" height="228.6"/>
  <text class="label-halo" x="245" y="218" text-anchor="middle">1/2 × 2-1/4 in 1018 CF flat (rest of the bar)</text>
  <text class="label-halo" x="519.6" y="210" text-anchor="middle">blank 2</text>
  <text class="label-halo" x="644.1" y="210" text-anchor="middle">blank 1</text>
  <text class="label-halo" x="519.6" y="228" text-anchor="middle">1.05–1.15</text>
  <text class="label-halo" x="644.1" y="228" text-anchor="middle">1.05–1.15</text>
  <line class="leader" x1="457" y1="340" x2="457" y2="330"/>
  <line class="leader" x1="582" y1="340" x2="582" y2="330"/>
  <text class="label" x="519.6" y="358" text-anchor="middle">saw kerfs, 1/8 in</text>
  <!-- Sawn length dimension of blank 1. -->
  <line class="dims" x1="588.2" y1="84" x2="700" y2="84"/>
  <line class="dims" x1="588.2" y1="78" x2="588.2" y2="100"/>
  <line class="dims" x1="700" y1="78" x2="700" y2="100"/>
  <text class="label" x="644.1" y="76" text-anchor="middle">sawn length</text>
  <!-- The bar's width becomes the block's width; the sawn length its height. -->
  <line class="dims" x1="710" y1="100" x2="710" y2="328.6"/>
  <text class="label-halo" x="714" y="218">2-1/4</text>
</svg>
