  <text class="label-halo" x="556" y="300" text-anchor="end">K</text>
  <text class="label-halo" x="616" y="210">front</text>
  <text class="label-halo" x="616" y="344">west waste</text>
  <text class="label-on-clamp" x="585" y="132" text-anchor="middle">fixed jaw (E)</text>
