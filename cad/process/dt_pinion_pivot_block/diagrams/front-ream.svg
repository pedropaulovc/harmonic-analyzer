<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- As Setup 6's picture. The .2510 reamer, cutter_dia_mm 6.3754 (25.5 px in the section, 38.3 px in the plan), in the pivot bore (NC line 129) at the bottom of its feed: its end at Z -1.778 (ream_tip_height_mm), then fed back out to Z 12.176 spindle running. Its 45 deg lead is not on record: drawn schematic (0.1 x its diameter). Drawn short to a break; the drill chuck is not drawn. Both bores drilled. -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Op 410, .2510 reamer (PB05 T6): the pivot bore, fed in and fed out</text>
  <text class="title" x="40" y="48">Plan, 6 px/mm (fixed jaw at the top)</text>
  <text class="title" x="400" y="48">Across the jaws, 4 px/mm, from the top face (+X toward you)</text>
  <rect class="clamp" x="40" y="60" width="270" height="30"/>
  <rect class="clamp" x="40" y="329.3" width="270" height="30"/>
  <rect class="part-kept" x="100" y="90" width="150.9" height="239.3"/>
  <rect class="hidden" x="100" y="90" width="150.9" height="19.1"/>
  <rect class="hidden" x="100" y="310.2" width="150.9" height="19.1"/>
  <line class="centre-line" x1="170" y1="245.4" x2="232" y2="245.4"/>
  <line class="centre-line" x1="200.4" y1="214" x2="200.4" y2="277"/>
  <line class="centre-line" x1="183" y1="134.4" x2="244" y2="134.4"/>
  <line class="centre-line" x1="213.4" y1="103" x2="213.4" y2="166"/>
  <line class="datum" x1="86" y1="90" x2="114" y2="90"/>
  <line class="datum" x1="100" y1="76" x2="100" y2="104"/>
  <text class="datum-label" x="104" y="104">X0 Y0</text>
  <text class="label-on-clamp" x="175" y="80" text-anchor="middle">fixed jaw: west end W</text>
  <text class="label-on-clamp" x="175" y="349" text-anchor="middle">moving jaw: east end E</text>
  <text class="label-halo" x="94" y="178" text-anchor="end">B</text>
  <text class="label-halo" x="256" y="220">top</text>
  <text class="label-halo" x="236" y="128">lift bore</text>
  <text class="label-halo" x="224" y="268">pivot bore</text>
  <circle class="holes" cx="213.4" cy="134.4" r="19.1"/>
  <rect class="fixture-vise" x="400" y="420" width="300" height="14"/>
  <rect class="clamp" x="420" y="240.2" width="50" height="179.8"/>
  <rect class="clamp" x="629.5" y="240.2" width="50" height="179.8"/>
  <rect class="fixture-support" x="470" y="267.6" width="12.7" height="101.6"/>
  <rect class="fixture-support" x="470" y="369.2" width="12.7" height="50.8"/>
  <rect class="fixture-support" x="616.8" y="267.6" width="12.7" height="101.6"/>
  <rect class="fixture-support" x="616.8" y="369.2" width="12.7" height="50.8"/>
  <line class="datum" x1="500" y1="267.6" x2="600" y2="267.6"/>
  <text class="datum-label" x="550" y="290" text-anchor="middle">Z0 = K</text>
  <text class="label-on-clamp" x="654.5" y="410" text-anchor="middle">W</text>
  <text class="label-on-clamp" x="445" y="410" text-anchor="middle">E</text>
  <line class="leader" x1="684" y1="330" x2="626" y2="330"/>
  <text class="label-halo" x="686" y="326">1 in + 1/2 in</text>
  <text class="label-halo" x="686" y="342">stacks</text>
  <rect class="part-kept" x="470" y="222.9" width="159.5" height="44.7"/>
  <rect class="holes" x="587.15" y="222.9" width="25.5" height="44.7"/>
  <path class="cutter" d="M538.65 120L538.65 272.16L536.1 274.71L515.7 274.71L513.15 272.16L513.15 120L521.65 117L530.15 120Z"/>
  <circle class="cutter" cx="200.4" cy="245.4" r="19.13"/>
  <line class="arrow" x1="495.9" y1="130" x2="495.9" y2="170"/>
  <text class="label" x="40" y="382">.2510 reamer, its end at Z {{process.ream_tip_height_mm:.3f}} mm (lead schematic),</text>
  <text class="label" x="40" y="398">fed in, then fed out with the spindle running;</text>
  <text class="label" x="40" y="414">no rapid leaves the bore</text>
  <text class="label" x="40" y="430">Stacks under W and E (dashed): the bore falls between them.</text>
  <line class="leader" x1="380" y1="378" x2="522.9" y2="200"/>
  <circle class="leader-dot" cx="522.9" cy="200" r="2"/>
</svg>
