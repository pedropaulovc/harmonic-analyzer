<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- 4 px/mm. Across the jaws seen from the right end, the block's front face (+X): +Y (toward the fixed jaw, E) right, +X out of the page. The 1/2 in end mill (50.8 px, 113.8 px out of the collet, 12 % end arc) on PB02's first level, Z 27.178 (1.016 under the longest blank's top, edge_top_max_mm 28.194), on the pass at Y -22.538 (wholly over the blank, clear of both jaws), entering at K (X0), +X (NC line 33). The hold-down holes are drilled in Op 180 (its own picture); centre lines only here. -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 3 (PB02), 4 px/mm: on edge, B down, jaws on the bar edges; face the top to the height</text>
  <text class="title" x="40" y="50">Across the jaws, from the right end, the front face (+X toward you)</text>
  <text class="title" x="520" y="50">Plan</text>
  <rect class="fixture-vise" x="70" y="400" width="370" height="16"/>
  <rect class="clamp" x="90" y="220.2" width="50" height="179.8"/>
