  <text class="label" x="20" y="90">(Z 27.178 mm), pass Y -22.538:</text>
  <text class="label" x="20" y="106">+X, out of the page; levels</text>
  <text class="label" x="20" y="122">down to the height</text>
  <line class="leader" x1="200" y1="130" x2="252.45" y2="150"/>
  <circle class="leader-dot" cx="252.45" cy="150" r="2"/>
