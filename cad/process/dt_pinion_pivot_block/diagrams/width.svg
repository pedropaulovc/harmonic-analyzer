<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- 4 px/mm. Across the jaws seen from the right end, the block's front face (+X): +Y (toward the fixed jaw, the top face) right, +X out of the page, K behind. The 1/2 in end mill (50.8 px; drawn short to a break, its 28.45 out of the collet does not fit; 12 % end arc) on PB04's first level, Z 53.499 (1.238 under upright_top_max_mm 54.737), pass Y -9.038 (wholly over the block), entering at K, +X (NC line 33). The 1-2-3 block of Ops 250-260 is lifted out before the block goes in: a callout, not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 5 (PB04), 4 px/mm: turned over, the east end down; face the west end to the width</text>
  <text class="title" x="40" y="50">Across the jaws, from the right end, the front face (+X toward you; K behind)</text>
  <rect class="fixture-vise" x="110" y="410" width="240" height="16"/>
  <rect class="clamp" x="130" y="230.2" width="50" height="179.8"/>
  <rect class="clamp" x="280.6" y="230.2" width="50" height="179.8"/>
  <rect class="fixture-support" x="180" y="359.2" width="12.7" height="50.8"/>
  <rect class="fixture-support" x="267.9" y="359.2" width="12.7" height="50.8"/>
  <text class="label-on-clamp" x="305.6" y="400" text-anchor="middle">fixed</text>
  <text class="label-on-clamp" x="155" y="400" text-anchor="middle">moving</text>
  <rect class="part-kept" x="180" y="199.7" width="100.6" height="159.5"/>
  <rect class="part-removed" x="180" y="140.3" width="100.6" height="59.4"/>
  <rect class="hidden" x="180" y="259.9" width="100.6" height="19.9"/>
  <rect class="hidden" x="180" y="326.9" width="100.6" height="19.9"/>
  <line class="datum" x1="160" y1="359.2" x2="178" y2="359.2"/>
  <text class="datum-label" x="156" y="363" text-anchor="end">Z0</text>
  <line class="datum" x1="280.6" y1="160" x2="280.6" y2="190"/>
  <text class="datum-label" x="285" y="186">Y0 (top face)</text>
  <line class="dims" x1="120" y1="199.7" x2="120" y2="359.2"/>
  <line class="dims" x1="114" y1="199.7" x2="180" y2="199.7"/>
  <text class="label-halo" x="116" y="284" text-anchor="end">width</text>
  <text class="label-halo" x="230.3" y="236" text-anchor="middle">block</text>
  <text class="label-halo" x="230.3" y="190" text-anchor="middle">west waste</text>
  <text class="label-halo" x="230.3" y="352" text-anchor="middle">E down</text>
  <path class="cutter" d="M269.85 139.11L269.85 66L262.59 63L255.33 66L248.08 63L240.82 66L233.56 63L226.31 66L219.05 66L219.05 139.11A25.4 6.1 0 0 0 269.85 139.11Z"/>
  <text class="label" x="364" y="70">1/2 in end mill, level 1 (Z 53.499 mm), pass</text>
  <text class="label" x="364" y="86">Y -9.038: +X, out of the page; equal levels,</text>
  <text class="label" x="364" y="102">each {{process.face_step_max_mm:in.3dot}} max, down to the width</text>
  <line class="leader" x1="360" y1="80" x2="270" y2="80"/>
  <circle class="leader-dot" cx="270" cy="80" r="2"/>
  <text class="label" x="364" y="240">B against the moving jaw, the top against the fixed</text>
  <text class="label" x="364" y="256">jaw (Y0); K at the left (X0). Check the width with</text>
  <text class="label" x="364" y="272">the calipers' depth rod to the parallel, still clamped.</text>
  <text class="label" x="364" y="304">1-2-3 block (Ops 220-230): laid flat across the</text>
  <text class="label" x="364" y="320">parallels, 1 in up, for the Z0 touch; lifted out</text>
  <text class="label" x="364" y="336">before the block goes in (not drawn)</text>
  <line class="leader" x1="360" y1="380" x2="282" y2="380"/>
  <circle class="leader-dot" cx="282" cy="380" r="2"/>
  <text class="label" x="364" y="384">1/2 in parallels; Z0 their top (the east end)</text>
</svg>
