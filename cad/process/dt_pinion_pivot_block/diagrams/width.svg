<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 5 (PB04), 4 px/mm: turned over, the east end down; face the west end to the width</text>
  <text class="title" x="40" y="50">Across the jaws, looking at the front face (K behind)</text>
  <rect class="fixture-vise" x="110" y="410" width="240" height="16"/>
  <rect class="clamp" x="130" y="230.2" width="50" height="179.8"/>
  <rect class="clamp" x="280.6" y="230.2" width="50" height="179.8"/>
  <rect class="fixture-support" x="180" y="359.2" width="12.7" height="50.8"/>
  <rect class="fixture-support" x="267.9" y="359.2" width="12.7" height="50.8"/>
  <rect class="part-kept" x="180" y="199.7" width="100.6" height="159.5"/>
  <rect class="part-removed" x="180" y="140.3" width="100.6" height="59.4"/>
  <rect class="hidden" x="180" y="259.9" width="100.6" height="19.9"/>
  <rect class="hidden" x="180" y="326.9" width="100.6" height="19.9"/>
  <rect class="cutter" x="205" y="98" width="50.8" height="38"/>
  <line class="arrow" x1="350" y1="146" x2="350" y2="196"/>
  <text class="label" x="356" y="166">equal levels, each .050 max,</text>
  <text class="label" x="356" y="182">down to the width</text>
  <line class="datum" x1="160" y1="359.2" x2="180" y2="359.2"/>
  <text class="datum-label" x="156" y="363" text-anchor="end">Z0</text>
  <line class="datum" x1="280.6" y1="120" x2="280.6" y2="150"/>
  <text class="datum-label" x="285" y="116">Y0 (top face)</text>
  <line class="dims" x1="120" y1="199.7" x2="120" y2="359.2"/>
  <line class="dims" x1="114" y1="199.7" x2="180" y2="199.7"/>
  <text class="label-halo" x="116" y="284" text-anchor="end">width</text>
  <text class="label-on-clamp" x="305.6" y="400" text-anchor="middle">fixed</text>
  <text class="label-on-clamp" x="155" y="400" text-anchor="middle">moving</text>
  <text class="label-halo" x="230.3" y="236" text-anchor="middle">block</text>
  <text class="label-halo" x="230.3" y="174" text-anchor="middle">west waste</text>
  <text class="label-halo" x="230.3" y="352" text-anchor="middle">E down</text>
  <text class="label" x="364" y="240">B against the moving jaw, the top against the fixed</text>
  <text class="label" x="364" y="256">jaw (Y0); K at the left (X0). Check the width with</text>
  <text class="label" x="364" y="272">the calipers' depth rod to the parallel, still clamped.</text>
  <line class="leader" x1="360" y1="380" x2="282" y2="380"/>
  <text class="label" x="364" y="384">1/2 in parallels; Z0 their top (the east end)</text>
</svg>
