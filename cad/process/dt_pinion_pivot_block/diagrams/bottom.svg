<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- 4 px/mm. Across the jaws seen from the RIGHT (west) end: +Y (toward the fixed jaw) right, +X out of the page. The 1/2 in end mill (12.7 = 50.8 px, 28.45 out of the collet = 113.8 px, square end drawn as the near half of its end face, 12 % deep) on PB01's last pass, Y -6.977 (the pass least past the blank: 0.6 mm past its front face, over the moving jaw's side; the other two stand 3.8 and 8.3 mm over the fixed jaw), tip at Z0, entering the blank's left end (X0) on its first run along it, +X (NC line 33). The collet is not drawn (not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 2 (PB01), 4 px/mm: on edge on 1 in parallels, back face K at the fixed jaw; skim B</text>
  <text class="title" x="40" y="50">Across the jaws, from the right (west) end</text>
  <text class="title" x="380" y="50">From the moving-jaw side (jaw in front)</text>
  <rect class="fixture-vise" x="60" y="400" width="240" height="16"/>
  <rect class="clamp" x="100" y="220.2" width="50" height="179.8"/>
  <rect class="clamp" x="200.8" y="220.2" width="50" height="179.8"/>
  <rect class="fixture-support" x="150" y="298.4" width="12.7" height="101.6"/>
  <rect class="fixture-support" x="188.1" y="298.4" width="12.7" height="101.6"/>
  <rect class="part-kept" x="150" y="189.7" width="50.8" height="108.7"/>
  <rect class="part-removed" x="150" y="185.6" width="50.8" height="4.1"/>
  <text class="label-on-clamp" x="125" y="390" text-anchor="middle">moving</text>
  <text class="label-on-clamp" x="226" y="390" text-anchor="middle">fixed</text>
  <line class="datum" x1="104" y1="189.7" x2="146" y2="189.7"/>
  <text class="datum-label" x="100" y="194" text-anchor="end">Z0 = B</text>
  <line class="datum" x1="200.8" y1="196" x2="200.8" y2="216"/>
  <text class="datum-label" x="206" y="214">Y0</text>
  <text class="label-halo" x="196" y="250" text-anchor="end">K</text>
  <line class="leader" x1="194" y1="350" x2="270" y2="350"/>
  <text class="label-halo" x="272" y="354">1 in parallels</text>
  <path class="cutter" d="M198.29 183.6L198.29 75.9L147.49 75.9L147.49 183.6A25.4 6.1 0 0 0 198.29 183.6Z"/>
  <text class="label" x="14" y="76">1/2 in end mill,</text>
  <text class="label" x="14" y="92">pass Y -6.977,</text>
  <text class="label" x="14" y="108">tip at Z0;</text>
  <text class="label" x="14" y="124">+X: out of</text>
  <text class="label" x="14" y="140">the page</text>
  <line class="leader" x1="96" y1="132" x2="149" y2="150"/>
  <circle class="leader-dot" cx="149" cy="150" r="2"/>
  <text class="label" x="262" y="120">skim {{process.bottom_skim_mm:in.3dot}}:</text>
  <text class="label" x="262" y="136">sawn face → B</text>
  <line class="leader" x1="262" y1="136" x2="201" y2="187"/>
  <circle class="leader-dot" cx="201" cy="187" r="2"/>
  <rect class="part-kept" x="420" y="189.7" width="228.6" height="108.7"/>
  <rect class="part-removed" x="420" y="185.6" width="228.6" height="4.1"/>
  <rect class="clamp" x="380" y="220.2" width="330" height="179.8"/>
  <rect class="hidden" x="420" y="220.2" width="228.6" height="78.2"/>
  <line class="hidden" x1="380" y1="298.4" x2="710" y2="298.4"/>
  <rect class="fixture-vise" x="370" y="400" width="350" height="16"/>
  <line class="datum" x1="420" y1="196" x2="420" y2="216"/>
  <text class="datum-label" x="400" y="214" text-anchor="end">X0</text>
  <text class="label-halo" x="416" y="250" text-anchor="end">E</text>
  <line class="leader" x1="660" y1="200" x2="648.6" y2="210"/>
  <text class="label-halo" x="662" y="198">west edge</text>
  <text class="label-on-clamp" x="545" y="360" text-anchor="middle">moving jaw (blank's lower part and parallels behind it)</text>
  <path class="cutter" d="M445.4 183.6L445.4 75.9L394.6 75.9L394.6 183.6A25.4 6.1 0 0 0 445.4 183.6Z"/>
  <line class="arrow" x1="460" y1="120" x2="560" y2="120"/>
  <text class="label" x="566" y="124">+X along the bar,</text>
  <text class="label" x="566" y="140">zigzag passes</text>
</svg>
