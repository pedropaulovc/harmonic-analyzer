<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left: a section across the jaws, from the RIGHT end, 4.5 px/mm (the fixed jaw on the right): the two 1 in parallels against the jaws (1/8 thick, as the other PD plans' parallel_thickness_mm; the parallels' and jaws' length and the jaws' thickness are not on record), the 6061 spoil block 3 x 1 in (spoil_width_mm, spoil_height_mm) on them, its top 5.85 mm over the jaw tops (spoil_over_jaws_mm), the tape stack .28 mm (tape_stack_mm), the blank 1.5 in wide (C edge flush with the block's fixed-jaw edge) and 6.3 mm thick (the bar as supplied); the jaws, parallels and block drawn short to a break line toward the bed. The 1-2-3 block that set the C edge is taken away before any cut and is not drawn. From above, the block's tape is drawn as the tape op lays it: two 1.41 in strips about 3 in long from 1/4 in in from the block's right end, the first knifed flush with the fixed-jaw edge, 2.07 in across in all; 1/4 in past the blank's R end. Holes already cut are drawn as holes, the rest dashed. The .4385 reamer to scale (shop reamer-4385, cutter_dia_mm 11.1379 = 50.1 px), its end 1.0 mm under face A (ream_past_mm; ream_tip_mm, posted), its 45 deg lead chamfer schematic; drawn short to a break line. The 27/64 hole under it (white). -->
