]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bonded on the spoil block: thickness, holes, countersinks, outline"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the bed of the 6 in PM vise (shop vise-pm-6), one against each jaw. The spoil block on them, its 3 in width across the jaws (its as-bought 1 in edges in the jaws), centred along the jaws; tap it down and tighten: its top stands {{process.spoil_over_jaws_mm:in.3dot}} over the jaw tops. The blank bonded on its top face A down (rear face up): ScotchBlue 2090 blue painter's tape on the block and on face A, GH1200 thick CA glue between, the stack {{process.tape_stack_mm:in.3dot}} thick; its C edge flush with the block's edge at the FIXED jaw, its R end to the RIGHT, {{process.spoil_end_margin_mm:in.2dot}} in from the block's right end. Nothing else holds it. Cut dry or with a light air blast: no flood or mist coolant and no water (the paper tape soaks and lets go); oil only where an op says, a drop on the tool, never poured on the work. CA softens with heat: if the blank is too warm to hold a finger on, stop and let it cool."
datum = "Programs AP01_holes (T1–T5), AP02_sink (T6), AP03_outline (T1). G54: X0 Y0 the press hole K's axis, the plate's length along −X (the end round at +X, the top edge at −X), +Y toward the fixed jaw (the C edge at Y {{cad.outline_edge_right_x_in:.3dot}}); Z0 face A (the blank's underside, {{process.tape_stack_mm:in.3dot}} above the block's top on the tape stack), set from T1 on the blank's top less its miked thickness, so the stack moves no depth on the plate. Tool lengths from the tool setter at each M6. After a controller reset, a stall or an E-stop: home ($H), which brings the stored G54 back, and run the interrupted program from its start (every cut done is then cut in air)."
diagram = { file = "diagrams/bond.svg", alt = "Plan and section: the spoil block across the vise jaws on two parallels, its top over the jaw tops; the blank on blue tape, CA glue, blue tape on it (two strips on each face), its C edge flush with the block's fixed-jaw edge, R end to the right; the plate's outline inside it with K, the two screw holes, the end round at +X; X0 Y0 at K." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", 9.525, 9.525, 5.08], y_span_mm = ["{{process.spoil_width_mm}}", 9.525], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.spoil_height_mm}}", "{{process.tape_stack_max_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.spoil_height_mm}}", "{{process.tape_stack_min_mm}}", "{{process.drill_2764_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.spoil_width_mm}}", along_jaws_mm = "{{process.spoil_length_mm}}", part_height_mm = "{{process.spoil_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-34.887, "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [-48.514, 14.986], seat = "6061 spoil block", seat_mm = [-61.214, 27.686], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "plate", kind = "part", area_mm2 = "{{process.bond_area_mm2}}", width_mm = "{{cad.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Home the mill ($H). Brush the spoil block's top clean. Degrease its top and the blank's face A with isopropyl alcohol; wipe both dry."
feed = "hand"

[[setups.operations]]
instruction = "Tape the block's top: two strips of ScotchBlue 2090 (1.41 in wide) along X, each about 3 in long from 1/4 in in from the block's right end. The first hangs about 3/4 in over the fixed-jaw edge: knife it off flush with that edge. The second butts against it: edges never overlapped (an overlap rocks the blank), no gap over 1/32. Pencil a line across the tape {{process.spoil_end_margin_mm:in.2dot}} in from the block's right end: the R end's place."
feed = "hand"

[[setups.operations]]
instruction = "Tape face A: two strips along the blank's length, edges butted, never overlapped: the first with its edge on the C edge, the second beside it over the front edge. Knife both off flush with the blank's edges and ends. Face A's seam lies 1.41 in from the C edge, the block's about .70: the seams are about .71 (half a strip) apart."
feed = "hand"

[[setups.operations]]
instruction = "Burnish both tapes down hard with the round back of a screwdriver handle, every strip, edges included: no bubble or lifted edge."
feed = "hand"

[[setups.operations]]
instruction = "Stand a 1-2-3 block on the fixed jaw's top, its 3 in face against the spoil block's edge. GH1200 thick (1500 cps) CA on the block's tape: a zigzag bead about 1/16 in wide, its lines about 3/4 in apart, kept 1/4 in inside where the blank goes (about 1 x 2 in, about 4 in of bead). Then mist Starbond accelerator, two or three sprays, on face A's tape. No glue on bare metal."
feed = "hand"

[[setups.operations]]
instruction = "Within about 10 seconds of the spray, lower the blank onto the glue, face A down, its C edge against the 1-2-3 block, its R end on the pencil line: the glue grabs at once and the blank cannot be slid afterwards. Press it down by hand over its whole face for 1 minute. Take the 1-2-3 block away."
feed = "hand"

[[setups.operations]]
instruction = "Wait 5 minutes before touching the blank (the maker's glue cures in seconds with the accelerator; 1 minute pressed and 5 minutes waited is the shop's margin)."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (3/8 in end mill, at least 1.00 in out of its collet). Spindle stopped, its end just dragging a .002 feeler leaf, note the machine Z (MPos, mm) on the blank's top 1/2 in in from the R end and from the front edge, then on the bare block 1 in in front of the blank at the same X. The same at the far end."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Each end's tape stack: its blank reading less its block reading less that end's written thickness (in × 25.4)." },
  { kind = "check", text = "Both stacks {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}} ({{process.tape_stack_min_mm:.2f}}–{{process.tape_stack_max_mm:.2f}} mm), and within .002 (0.05 mm) of each other." },
  { kind = "stop", text = "Outside, or the ends differ more: peel the blank off as Setup 3 frees the plate, clean both faces, and tape and bond again from this setup's first op." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Push the blank hard sideways with the heel of the hand, along X and across it; try to lift each corner with a thumbnail." },
  { kind = "check", text = "No movement, no creak, no lifted corner: the owner's acceptance of the hold (there is no pull test)." },
  { kind = "stop", text = "Any movement: peel the blank off as Setup 3 frees the plate, clean both faces, and tape and bond again from this setup's first op." },
]
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 and Y0 at K with the edge finder (900 rpm): from +X on the R end, from +Y on the C edge."
instruction_detailed = "Edge finder (900 rpm, in place of T1) on the blank's R end from +X, at mid-width: G10 L20 P1 X{{process.x_set_mm:.3f}}. On the C edge from +Y, 1/2 in in from the R end: G10 L20 P1 Y{{process.y_set_mm:.3f}}. Back off .10 in +Y; MDI G0 X−33 (1/2 in in from the far end of the shortest blank), touch the C edge again from +Y and read the work Y."
inspection = "The second C-edge reading within .002 of the first (the blank lies along X)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "More: peel the blank off as Setup 3 frees the plate, clean both faces, and tape and bond again from this setup's first op." },
]
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: face A, from the thickness written on the blank and T1 touched on its top over the miked spot."
instruction_detailed = "Console M6 T1 (3/8 in end mill, at least 1.00 in out of its collet; the tool setter measures it); MDI G0 X{{process.z_touch_x_mm:.3f}} Y{{process.z_touch_y_mm:.3f}} (the blank's middle, 1/2 in in from its front edge). Spindle stopped, its end just dragging a .002 feeler leaf on the blank: G10 L20 P1 Z(the written thickness in mm + {{process.z_leaf_mm:.3f}})."
feed = "hand"

[[setups.operations]]
instruction = "Prove AP01_holes, AP02_sink and AP03_outline in air, Z0 raised 1.000 in: every move stays over the spoil block or the fixed jaw's side, clear of the vise. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run AP01_holes through every M6, then AP02_sink and AP03_outline, watching every move. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

