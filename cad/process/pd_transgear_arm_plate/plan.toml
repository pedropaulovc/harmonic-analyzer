[[setups]]
machine_kind = "other"
title = "Saw the blank and the spoil block"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 12 in length of the 1/4 x 1-1/2 in flat with one 2.45 in blank marked off at its end; the 1 x 3 in 6061 bar with a 3.5 in spoil block marked off." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} long, aiming at {{process.blank_length_in:.2f}}, off the 1/4 x 1-1/2 in bar, marked off with the steel rule. Saw one spoil block about 3.5 long off the 1 x 3 in 6061 bar. File the burrs off every sawn end."
feed = "hand"
inspection = "Blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} long (steel rule): the 2.16 plate with .10 at the round's end and .14–.24 at the top. Shorter: saw another; longer: saw it back."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
instruction = "Pick the straighter long edge as the C edge (datum C) and mark it C; mark one sawn end R (the round's end). Lay the blank with C away from you and R to the right: the face down is face A, the face up the rear face."
feed = "hand"

[[setups.operations]]
instruction = "Mic the blank's thickness at its middle and 1/2 in in from each end, 1/2 in in from its front edge, and its width at both ends. Write the middle thickness on the rear face with marking fluid (face A is degreased and bonded): Setup 2 sets Z0 from it."
inspection = "Every thickness reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}} and the width {{process.blank_width_min_mm:in.4dot}}–{{process.blank_width_max_mm:in.4dot}}: the bar as supplied, this traveler's incoming-stock gate (the width sets the side edges). Outside either: set the blank aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.blank_width_min_mm}}", "{{process.blank_width_max_mm}}"] },
]

[[setups]]
machine_kind = "other"
title = "Bonded on the spoil block: thickness, holes, countersinks, outline"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the bed of the 6 in PM vise (shop vise-pm-6), one against each jaw. The spoil block on them, its 3 in width across the jaws (its as-bought 1 in edges in the jaws), centred along the jaws; tap it down and tighten: its top stands {{process.spoil_over_jaws_mm:in.3dot}} over the jaw tops. The blank bonded on its top with 3M VHB 5906 tape ({{process.tape_thickness_mm:in.3dot}} thick), face A down (rear face up), its C edge flush with the block's edge at the FIXED jaw, its R end to the RIGHT, {{process.spoil_end_margin_mm:in.2f}} in from the block's right end. Nothing else holds it."
datum = "Programs AP01_holes (T1–T5), AP02_sink (T6), AP03_outline (T1). G54: X0 Y0 the press hole K's axis, the plate's length along −X (the end round at +X, the top edge at −X), +Y toward the fixed jaw (the C edge at Y {{cad.outline_edge_right_x_in:.3dot}}); Z0 face A (the blank's underside, on the tape), set from the miked thickness. Tool lengths from the tool setter at each M6. After a controller reset, a stall or an E-stop: home ($H), which brings the stored G54 back, and run the interrupted program from its start (every cut done is then cut in air)."
diagram = { file = "diagrams/bond.svg", alt = "Plan and section: the spoil block across the vise jaws on two parallels, its top over the jaw tops; the blank on two strips of tape on it, its C edge flush with the block's fixed-jaw edge, R end to the right; the plate's outline inside it with K, the two screw holes, the end round at +X; X0 Y0 at K." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", 9.525, 9.525, 5.08], y_span_mm = ["{{process.spoil_width_mm}}", 9.525], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.spoil_height_mm}}", "{{process.tape_thickness_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.spoil_height_mm}}", "{{process.tape_thickness_mm}}", "{{process.drill_2764_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.spoil_width_mm}}", along_jaws_mm = "{{process.spoil_length_mm}}", part_height_mm = "{{process.spoil_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-34.887, "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [-48.514, 14.986], seat = "6061 spoil block", seat_mm = [-61.214, 27.686], bond = { shear_mpa = "{{process.tape_shear_mpa}}", tensile_mpa = "{{process.tape_tensile_mpa}}", derating = "{{process.bond_derating}}", pieces = [{ name = "plate", kind = "part", area_mm2 = "{{process.bond_area_mm2}}", width_mm = "{{cad.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Home the mill ($H). Brush the spoil block's top clean. Degrease it and the blank's face A with isopropyl alcohol and water, half and half; wipe both dry."
feed = "hand"

[[setups.operations]]
instruction = "Lay two strips of the 3/4 in tape along X on the block's top, edge to edge, each the blank's length, starting {{process.spoil_end_margin_mm:in.2f}} in from the block's right end (where the blank's R end goes): the first with its edge on the block's fixed-jaw edge. Rub each down; peel the liners."
feed = "hand"

[[setups.operations]]
instruction = "Stand a 1-2-3 block on the fixed jaw's top, its 3 in face against the spoil block's edge. Lower the blank onto the tape, face A down, its C edge against the 1-2-3 block, R end to the right {{process.spoil_end_margin_mm:in.2f}} in from the spoil block's right end (steel rule). It cannot be moved once down. Lean on it with the heel of the hand, about 25 lb (the tape wants about 15 psi). Take the 1-2-3 block away."
feed = "hand"

[[setups.operations]]
instruction = "Wait 20 minutes: the tape is taken at half strength, which it reaches by then."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 and Y0 at K with the edge finder (900 rpm): from +X on the R end, from +Y on the C edge."
instruction_detailed = "Edge finder (900 rpm) on the blank's R end from +X, at mid-width: G10 L20 P1 X{{process.x_set_mm:.3f}}. On the C edge from +Y, 1/2 in in from the R end: G10 L20 P1 Y{{process.y_set_mm:.3f}}. MDI G0 X−33 (1/2 in in from the far end of the shortest blank), touch the C edge again from +Y and read the work Y."
inspection = "The second C-edge reading within .002 of the first (the blank lies along X). More: free the blank (Setup 3's first op) and bond it again."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: face A, from the thickness written on the blank and T1 touched on its top over the miked spot."
instruction_detailed = "Console M6 T1 (3/8 in end mill, at least 1.00 in out of its collet; the tool setter measures it); MDI G0 X{{process.z_touch_x_mm:.3f}} Y{{process.z_touch_y_mm:.3f}} (the blank's middle, 1/2 in in from its front edge). Spindle stopped, its end just dragging a .002 feeler leaf on the blank: G10 L20 P1 Z(the written thickness in mm + {{process.z_leaf_mm:.3f}})."
feed = "hand"

[[setups.operations]]
instruction = "Prove AP01_holes, AP02_sink and AP03_outline in air, Z0 raised 1.000 in: every move stays over the spoil block or the fixed jaw's side, clear of the vise. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run AP01_holes through every M6, then AP02_sink and AP03_outline, watching every move. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

