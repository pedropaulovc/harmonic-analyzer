[[setups]]
machine_kind = "other"
title = "Saw the blank and the spoil block"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 12 in length of the 1/4 x 1-1/2 in flat with one 2.45 in blank marked off at its end; the 1 x 3 in 6061 bar with a 3.5 in spoil block marked off." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} long, aiming at {{process.blank_length_in:.2f}}, off the 1/4 x 1-1/2 in bar, marked off with the steel rule. Saw one spoil block about 3.5 long off the 1 x 3 in 6061 bar. File the burrs off every sawn end."
feed = "hand"
inspection = "Blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} long (steel rule): the 2.16 plate with .10 at the round's end and .14–.24 at the top."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
steps = [
  { kind = "stop", text = "A blank shorter: saw another. Longer: saw it back to length." },
]
feed = "hand"

[[setups.operations]]
instruction = "Pick the straighter long edge as the C edge (datum C) and mark it C; mark one sawn end R (the round's end). Lay the blank with C away from you and R to the right: the face down is face A, the face up the rear face."
feed = "hand"

[[setups.operations]]
instruction = "Mic the blank's thickness at its middle and 1/2 in in from each end, 1/2 in in from its front edge, and its width at both ends. Write each thickness on the rear face over its spot with marking fluid (face A is degreased and bonded): Setup 2 checks the tape stack from the end ones and sets Z0 from the middle one."
inspection = "Every thickness reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}} and the width {{process.blank_width_min_mm:in.4dot}}–{{process.blank_width_max_mm:in.4dot}}: the bar as supplied, this traveler's incoming-stock gate (the width sets the side edges)."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.blank_width_min_mm}}", "{{process.blank_width_max_mm}}"] },
]

[[setups.operations]]
steps = [
  { kind = "stop", text = "A thickness or the width outside: set the blank aside and tell the owner." },
]
feed = "hand"

[[setups.operations]]
instruction = "Before Setup 2 reams K: on the .0001 micrometer, mike the .4375 plus GO pin, the .4380 plus NO-GO pin and the .4375 reamer (across two opposite margins at its front); each reading is good to ±.00005. Write the three on this sheet and each pin's on its tag."
inspection = "GO pin {{cad.press_hole_dia_min_in:.4dot}}–{{process.k_go_pin_max_mm:in.4dot}}, NO-GO pin {{process.k_nogo_pin_min_mm:in.4dot}}–{{cad.press_hole_dia_max_in:.4dot}}. Accept a K from the GO pin's reading to under the NO-GO's. Owner ruling 2026-11-23: 'Accept that good holes near a limit may be refused' (sure to pass: {{process.k_go_pin_max_mm:in.4dot}}–{{process.k_nogo_pin_min_mm:in.4dot}} only)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.press_hole_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "A pin outside its band is not used: stop and tell the owner." },
]
feed = "hand"

[[setups.operations]]
instruction = "Only if the reamer read under the GO pin, before Setup 2: drill and ream a trial hole through an offcut of the bar on the mill, by MDI, with T4 and T5; gauge it with the two pins."
instruction_detailed = "Only if the reamer read under the GO pin: an offcut of the 1/4 x 1-1/2 bar flat on the two 1 in parallels in the vise (one at each jaw), its middle over the gap. Console M6 T4 (27/64); its point on the middle, spindle stopped: G10 L20 P1 X0 Y0 Z0. MDI M3 S600, G1 Z-10 F{{process.drill_2764_feed_per_min_mm:.1f}}, G0 Z5; M6 T5 (.4375 reamer), M3 S400, G1 Z-10 F{{process.ream_feed_per_min_mm:.1f}}, G1 Z5, M5."
inspection = "The GO pin enters the trial hole and the NO-GO does not."
gauge_checks = [{ gauge = "zz-pins-4375-4382", band_mm = "{{cad.press_hole_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
steps = [
