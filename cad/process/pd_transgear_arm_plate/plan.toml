[[setups.operations]]
instruction = "Still bonded: the .250 pin standing in each countersink, the calipers' depth rod from the rear face beside it to the pin's top, less the pin's miked length, is where the pin's end sits."
inspection = "The pin's end {{process.sink_pin_depth_min_mm:in.4dot}}–{{process.sink_pin_depth_max_mm:in.4dot}} below the rear face (rim Ø{{cad.screw_hole_1_csk_dia_min_in:.3dot}}–{{cad.screw_hole_1_csk_dia_max_in:.3dot}})."
