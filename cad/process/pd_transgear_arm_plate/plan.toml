]
feed = "hand"

[[setups.operations]]
instruction = "Only if a rim is small: lower Z0 by the shortfall, run AP02_sink again, put Z0 back, then repeat the .250 pin check."
instruction_detailed = "The shortfall: {{process.sink_pin_depth_mid_mm:in.4dot}} less the shallower pin end's depth below the rear face. Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z − the shortfall in mm). Run AP02_sink. G10 L2 P1 Z(the noted Z) puts Z0 back before AP03_outline."
inspection = "The pin's end {{process.sink_pin_depth_min_mm:in.4dot}}–{{process.sink_pin_depth_max_mm:in.4dot}} below the rear face, both countersinks."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.sink_pin_depth_min_mm}}", "{{process.sink_pin_depth_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Both in band: go on. Still higher: the previous op again. Lower: stop and tell the owner." },
]
feed = "hand"

