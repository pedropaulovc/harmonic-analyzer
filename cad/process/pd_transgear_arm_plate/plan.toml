# Transgear arm plate MHA-PD-19 (qty 1), routed for the CNC mill (owner
# ruling 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). The plate is
# the bought 1/4 x 1-1/2 in 1018 CF flat (stock.1018-flat-1-4x1-1-2, to buy):
# its two long edges as supplied (the sheet's side edges, .75 each side of
# K), faced to .197 on the rear face, its holes and its outline milled from
# one zero (#2425, owner ruling 2026-11-20).
#
# Route: Setup 1 saws one 2.40-2.50 in blank off the 12 in bar and a 3.5 in
# spoil block off the owned 1 x 3 in 6061 bar (stock.6061-flat-1x3), and
# gates the blank. Setup 2: the spoil block in the vise on the 1 in
# parallels, its top over the jaw tops; the blank bonded face A down on it
# with blue painter's tape on both faces and CA glue between, its datum-C
# edge flush with the block's edge at the
# fixed jaw. AP01_holes faces the rear face to the thickness, spots, drills
# #1 through at K and at both screw holes, opens K with the 27/64 drill and
# reams it .4375; AP02_sink countersinks the two screw holes 82° on the rear
# face (checked, and run again lower if small); AP03_outline mills the end
# round, the two tapers and the top edge with the 3/8 in end mill's side,
# through into the spoil block: the whole waste goes to chips, the side edges
# stay as supplied. Setup 3, bench: free the plate from the tape, then
# chamfer K's face-A mouth .015 x 45° by hand with the owned deburring set's
# RD16.5 RotoDrive 90° countersink, checked with the .450 pin (delegated
# ruling 2026-11-22, Main, owner review #2144: option C; the owner may
# overrule to re-bonding face A up on the spoil block). Setup 4, bench:
# deburr, inspect, oil.
#
# The countersink (owner 2026-11-23, tool audit Q12: "the mcmaster kit sold
# is actually noga sp1007"; "check Noga SP1007"): the owned McMaster-Carr
# 4289A78 set is Noga's SP1007, which carries the RD16.5 RotoDrive
# countersink (Noga_Deburring-2017.pdf, noga.com: p.27 blade table, RD16.5 /
# BC1651, range 1-16.5 mm, angle 90°; p.53 lists RD16.5 in SP1007). Its
# 1-16.5 mm (.039-.650) range spans K's .4375-.4382 mouth and the chamfer's
# Ø.4575-.4775 rim; 90° is the chamfer's 45° each side. Nothing to buy.
#
# Not made here (the feature export's made_at, MHA-PD-00): the two Ø.0945
# locating holes are match-drilled with MHA-PD-18 and reamed at assembly
# (steps 13A and 13E), so the placeholder plan's tools.reamer-0945 and the #44
# drill belong to the assembly's process; the MHA-PD-28 bush is pressed into
# K (step 11C) and its bore reamed after the press (step 11H). The plate
# leaves with K reamed and chamfered for the press.
#
# Workholding: bonded, blue painter's tape on both faces and CA glue between
# (owner 2026-11-23, R1: "for tape isnt it possible to use blue painters tape
# on both sides and ca glue between them"; consumables.hold-painters-tape-ca:
# ScotchBlue 2090, GH1200 thick CA, Starbond accelerator, all on hand): a
# 1/4 in blank faced to .197 in the vise would leave less than
# limits.vise_grip_min_mm of grip under a facing cut, and the outline's
# tapers and end round leave no parallel faces to grip. The blank's faces are
# 1-1/2 x 2.45 in: two strips of the 1.41 in tape side by side on each face.
# The bond is the accepted one (owner 2026-11-23, R2: "it is widely used in
# industry with much heavier requirements; take it as given it will work"):
# prechips' bond check runs at the stresses the owner accepts, used as
# written, over the finished plate's own area less its three holes (cam.py
# computes it), the least the bond holds once the outline is cut. The
# operator proves each bond by Setup 2's stack check and push test. The
# drills and the reamer run before the outline, with the whole blank still
# bonded.
#
# One-sided facing: the rear face only (face A, datum A, stays as supplied).
# A cold-finished bar can bow when one skin is cut off: Setup 3 checks face A
# on the surface plate once freed and straightens a bowed plate in the bench
# vise (traveler review 2026-11-23: one-sided removal needs a release or a
# straightening step); the final inspection checks the thickness's Rule #1
# envelope (perfect form at .202) on the surface plate, as the platen's does.
# An owner-correctable choice, stated in the PR.
#
# FLAGGED: to buy: the stock (stock.1018-flat-1-4x1-1-2), the .4375 reamer
# (tools.reamer-4375), the 3/8 in 82° countersink (tools.riser-countersink),
# the Class ZZ pins .4375 plus (GO) and .4380 plus (NO-GO) for K
# (tools.zz-pins-4375-4382) and
# a .250 Class ZZ pin gauge (gauges.pin-gauges) for the countersinks.
#
# Owner ruling 2026-11-23 (tool audit Q1, re-answered), verbatim: "ZZ singles
# per the record: 29 pins (17 plus GO, 12 minus NO-GO), about $130. Accept
# that good holes near a limit may be refused; the traveler mikes each pin so
# the real window is known per pin." K's .4375-.4382 band takes a .4380 plus
# NO-GO (.4380-.4382, at or under the top limit; tool audit row
# plug-gauges-4375-4382): no minus pin from the box lies in .4380-.4382.
#
# NC (cam:pd_transgear_arm_plate, cad/process/pd_transgear_arm_plate/cam.py):
# AP01_holes, AP02_sink, AP03_outline. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the places in the tools list among the mill's tools: T1
# 3/8 in end mill, T2 #1 centre drill, T3 #1 drill, T4 27/64 drill, T5 .4375
# reamer, T6 82° countersink, T7 chamfer mill.
title = "Transgear arm plate"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/4 x 1-1/2 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:fraction}} in flat bar, the 12 in length: one {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} in blank. Spoil block: a 3.5 in length of the 1 x 3 in 6061 bar."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). The two long edges are the bar's, as supplied: no cut touches them. Mill speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) at the start of every mill setup; after any E-stop, alarm, stall or controller reset, home again and do what that setup's Datum says before resuming. The two Ø.0945 locating holes, the bush press and its ream are the assembly's (MHA-PD-00 steps 13A, 13E, 11C, 11H). To buy before starting: the bar, the .4375 reamer, the 3/8 in 82° countersink, the Class ZZ pins .4375 plus (GO) and .4380 plus (NO-GO, reads .4380–.4382) and the .250 and .450 pin gauges (Setup 2 checks K and the countersinks while the blank is still bonded). Finish: {{cad.finish}}."
shop = "../shop"
stock_refs = ["1018-flat-1-4x1-1-2", "6061-flat-1x3"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_arm_plate/features.toml"
adapter = "flat_bar"
part = "pd-transgear-arm-plate"

[parameters]
quantity = 1
# The adapter's axes: the plate's length (K to the top edge) along model Y,
# its thickness (face A to the rear face) along model Z.
blank_length_axis = 1
blank_thickness_axis = 2
# The blank: the 2.16 in plate (end round to top-left corner) with .100 at
# the round's end (round_waste_mm) and .14-.24 at the top, sawn 2.40-2.50.
blank_length_in = 2.45
blank_length_min_mm = 60.96
blank_length_max_mm = 63.5
blank_width_in = 1.5
blank_thickness_in = 0.25
# Setup 1's gate. ASTM A108 cold-drawn flat as the crank arm's: thickness
# +.000/-.004, width ±.004. The width leaves each side edge .746-.754 from K
# (Y0 on the datum-C edge, K .750 in from it), inside the sheet's .74-.76.
blank_thickness_min_mm = 6.2484
blank_thickness_max_mm = 6.35
blank_width_min_mm = 37.9984
blank_width_max_mm = 38.2016
round_waste_mm = 2.54
# The spoil block (stock.6061-flat-1x3; the process test checks its section
# against that record): 3.5 in sawn off the bar, gripped across its 3 in
# width on its as-bought 1 in edges, on the two 1 in parallels: its top
# stands spoil_over_jaws_mm over the jaw tops. The blank lies on it, its
# round end spoil_end_margin_mm in from the block's right end.
spoil_length_mm = 88.9
spoil_width_mm = 76.2
spoil_height_mm = 25.4
spoil_end_margin_mm = 12.7
spoil_over_jaws_mm = 5.8547
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_height_mm = 25.4
# The hold (consumables.hold-painters-tape-ca): ScotchBlue 2090 on the block
# and on face A, GH1200 thick CA between. tape_stack_mm the stack's nominal,
# tape_stack_min_mm-tape_stack_max_mm the band Setup 2's stack check accepts
# (both from the record). Z0 is face A, set from T1 on the blank's top less
# its miked thickness (a touch-off from the top), so the stack moves no
# depth on the plate (the thickness, the countersinks): it sets only how far
# a cut under face A reaches into the spoil block (cam.py checks each claim
# at both ends of the band). bond_accepted_shear_mpa and
# bond_accepted_tensile_mpa: the record's accepted figure (.6 MPa, set by
# the planner under the owner's delegation, R2/R3, header), used as written
# and a cap: a cut asking more in prechips' model takes more levels;
# bond_area_mm2: the finished plate's area less its three holes (cam.py).
tape_stack_mm = 0.28
tape_stack_min_mm = 0.23
tape_stack_max_mm = 0.33
bond_accepted_shear_mpa = 0.6
bond_accepted_tensile_mpa = 0.6
bond_area_mm2 = 1629.15
# Work frame (Setups 2 and 4): K at X0 Y0, the plate's length along -X (the
# end round at +X, the top edge at -X), the datum-C edge at +Y against the
# fixed jaw; Z0 face A. x_set_mm and y_set_mm are the edge finder's entries
# (its .100 radius) on the blank's round end and its datum-C edge;
# z_touch_x_mm, z_touch_y_mm the miked spot (the blank's middle, 1/2 in in
# from its front edge) where T1 sets Z0 on the raw top; z_leaf_mm the .002
# feeler leaf. cam.py checks them.
x_set_mm = 17.526
y_set_mm = 21.59
z_touch_x_mm = -16.129
z_touch_y_mm = -6.35
z_leaf_mm = 0.0508
# Facing the rear face: the 3/8 in end mill, two levels, the first at
# face_rough_z_mm, the second at the thickness target; passes along X no
# wider than face_stepover_mm (under half the cutter).
thickness_target_mm = 5.0038
face_rough_z_mm = 5.69
face_stepover_mm = 4.4
# The outline: the cutter's centre at its radius outside the round, the two
# tapers and the top edge, outline_levels levels of outline_level_mm from the
# rear face to outline_bottom_mm under face A, each pass entered and left
# outline_lead_mm clear of the side edges on the edges' extensions; the end
# round's corners first cleared by a half circle of rough_arc_radius_mm about
# K at every level. The bottom, .020 under face A, is through both tapes and
# the glue into the spoil block at the thickest stack (.007 into it) and at
# most .011 into it at the thinnest (cam.py).
# Six levels (owner 2026-11-23, R3: "no need to bring to me ; make coarser as
# you see fit"). The bond no longer binds (it set eleven levels of .019); the
# binding limit is the deepest level the same cutter runs in a reviewed
# traveler: this 3/8 in carbide 3-flute end mill is not in measured-cuts.toml,
# and its deepest full-width slot level in 1018 at this setting (2800 rpm,
# .0025 in/tooth) on main is dt_crank_arm's 1.0239 mm (CA01_hub_end "boss
# round" and CA03_handle_end "handle round"). Five levels would be 1.1024,
# over it; six are .9186 (.036). Feed and speed unchanged. The bond cap
# (.6 MPa) does not bind: in prechips' model six levels ask .15 MPa in shear
# and .28 in tension (the corner clear's full-width slot lifting the plate's
# edge), five would ask .34 in tension.
outline_levels = 6
outline_level_mm = 0.9186
outline_bottom_mm = -0.508
outline_lead_mm = 1.5
rough_arc_radius_mm = 24.5
# Holes. Spot K and the two screw holes Ø.120 with the #1 carbide 60° centre
# drill (on its countersink, under the #1). The #1 (.228) through all three,
# one plunge each (L/D under 1); the 27/64 (.4219) opens K; the .4375 reamer
# through K, fed in and
# out. Every tip drill_past_mm full diameter under face A, into the spoil
# block; the reamer ream_past_mm (its bevel lead allowed for). Both clear the
# stack at its thickest (tape_stack_max_mm). cam.py checks the tips.
spot_dia_mm = 3.048
drill_past_mm = 0.5
ream_past_mm = 1.0
drill_1_tip_mm = -2.2399
drill_2764_tip_mm = -3.7193
ream_tip_mm = -1.0
# The countersinks: the 82° countersink's point on each screw hole's axis
# sink_tip_mm above face A, its cone reaching Ø.312 (sink_dia_mm) at the
# faced rear face (cam.py).
sink_dia_mm = 7.9248
sink_tip_mm = 0.4456
# The press hole's chamfer (Setup 3, by hand at the bench): .015 x 45°, rim
# Ø.4675 (chamfer_rim_dia_mm, cam.py).
chamfer_rim_dia_mm = 11.8745
# Speeds and feeds. The 3/8 in end mill: shop
# settings.endmill-carbide-3fl-3-8-1018-cf, 2800 rpm, .0025 in/tooth x 3 =
# 21.0 in/min (cam.py recomputes both). Holes: LittleMachineShop "Cutting
# Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20, as the channel lever's): drilling 60-100 ft/min, reaming 40-65.
# #1 (.228) at 1100 rpm (66 ft/min), 27/64 (.4219) at 600 (66 ft/min), the
# .4375 reamer at 400 (46 ft/min), the countersink at 420 (41 ft/min, the
# reaming row: a countersink cuts like a reamer, the author's choice). Feeds
# per rev, the author's choice, no source, as the channel lever's: the #1
# .002 (2.2 in/min), the 27/64 .003 (1.8), the reamer .004 (1.6), the
# countersink .002 (0.84); the #1 centre drill at 2800, .0005 in/rev (1.4
# in/min).
em_rpm = 2800
em_feed_per_min_mm = 533.4
spot_rpm = 2800
spot_feed_per_min_mm = 35.56
drill_1_rpm = 1100
drill_1_feed_per_min_mm = 55.88
drill_2764_rpm = 600
drill_2764_feed_per_min_mm = 45.72
ream_rpm = 400
ream_feed_per_min_mm = 40.64
sink_rpm = 420
sink_feed_per_min_mm = 21.336
# Holders and reach: HA holders.r8-collets-lms-4860.gauge_len_mm; archive
# holders.drill-chuck-r8.gauge_len_mm. The longest tool: the .4375 chucking
# reamer in the drill chuck, 7 in overall (ASME B94.2 straight-shank chucking
# reamers, 7/16 in). The end mill at least 1.00 in out of its collet.
r8_collet_gauge_mm = 6.3
drill_chuck_gauge_mm = 95.0
reamer_oal_mm = 177.8
em_projection_min_mm = 25.4
# Inspection, from K (the .4375 GO pin standing in it, .21875 radius): the
# calipers over the pin and an edge read the edge's distance from K plus the
# pin's radius (cam.py computes each band from the export). The Class ZZ GO
# pin reads at most .0002 over .4375, so it moves an over-pin reading at most
# .0001, a fifth of the calipers' .0005 step: the bands stand on .21875.
# The screw holes
# with a #1 drill's shank in each: each hole from K over the GO pin and the
# shank less both radii. The countersinks with the .250 pin standing in each: its end
# sink_pin_depth_min_mm-sink_pin_depth_max_mm below the rear face for a rim
# in the sheet's band.
plug_radius_mm = 5.55625
side_over_plug_min_mm = 24.3522
side_over_plug_max_mm = 24.8602
round_over_plug_min_mm = 17.7482
round_over_plug_max_mm = 18.2562
screw_1_from_k_min_mm = 32.4175
screw_1_from_k_max_mm = 32.7731
screw_2_from_k_min_mm = 30.8255
screw_2_from_k_max_mm = 31.1811
sink_pin_dia_mm = 6.35
sink_pin_depth_min_mm = 0.8328
sink_pin_depth_max_mm = 0.9788
sink_pin_depth_mid_mm = 0.9058
# K's chamfer rim: Ø.4375 plus twice the leg's band. The check: a .450 pin
# (over K's .4382 top limit, under the smallest rim) stands in the chamfer;
# its end sits half the rim less the pin below face A. Its band holds for any
# K in .4375-.4382: from K's top limit and the shortest leg (.0041) to K's
# low limit and the longest (.01375), so no reading passes a leg outside
# .010-.020.
chamfer_rim_min_mm = 11.6205
chamfer_rim_max_mm = 12.1285
chamfer_pin_dia_mm = 11.43
chamfer_pin_depth_min_mm = 0.10414
chamfer_pin_depth_max_mm = 0.34925
# K's Class ZZ pins (header): GO .4375 plus, true size .4375-.4377; NO-GO
# .4380 plus, .4380-.4382. The most a usable GO pin reads and the least a
# usable NO-GO does: with both there, only .4377-.4380 is sure to pass.
k_go_pin_max_mm = 11.11758
k_nogo_pin_min_mm = 11.1252

