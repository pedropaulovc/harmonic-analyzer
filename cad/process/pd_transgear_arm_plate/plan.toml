feed = "hand"
inspection = "Face A lies on the surface plate without rocking on a burr."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Chamfer the press hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels on the vise bed, one against each jaw. The plate on them face A up, gripped on its two side edges (between the kinks and the top edge), K between the parallels, the end round to the right; tap it down and tighten lightly. The jaws stand {{process.jaw_top_mm:in.3dot}} above face A."
datum = "Program AP04_chamfer (T7). G54: X0 Y0 K's axis, picked up on the .4375 GO plug standing in K; Z0 face A, set with T1. The circle is about K, so the plate's turn in the vise does not matter. After a controller reset, a stall or an E-stop: home ($H), which brings the stored G54 back, and run AP04_chamfer from its start."
diagram = { file = "diagrams/chamfer.svg", alt = "The plate face A up in the vise on two parallels; the chamfer mill's point down in K, its centre on a circle about K's axis cutting the .015 x 45° chamfer at the mouth." }
envelope = { x_span_mm = [54.8924, 9.525, 5.08], y_span_mm = ["{{cad.blank_width_mm}}", 9.525], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.thickness_target_mm}}", "{{process.chamfer_tip_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_min_mm}}", 76.2], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.chamfer_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.blank_width_mm}}", along_jaws_mm = 54.8924, part_height_mm = "{{process.plate_thickness_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-51.891, "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
# The plate lies wholly between the jaws (prechips' hold); they bear on the
# side edges' straight run, kink to top corner, and K's chamfer is a light
# finishing cut .7 mm deep, its load straight down into the parallels. At
# .197 thick the grip is under the house limits.vise_grip_min_mm, the reason
# Setup 2 bonds the blank for the facing and outline cuts; this light hold
# is the author's choice, flagged for an owner ruling in the PR.
beam = { axis = "x", hold = "cantilever", extent_mm = [-42.4464, 12.446], clamp_mm = [-42.4464, 12.446], section_mm = { y = "{{cad.blank_width_mm}}", z = 4.8768 }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill ($H). Stand the .4375 GO plug in K, its handle up. Edge finder (900 rpm) on the plug's member below the handle, from −X and +X, then, at the X centre, from −Y and +Y: G54 X0 Y0 the plug's centre. Take the plug out."
instruction_detailed = "Edge finder (900 rpm), its tip on the plug's member just above face A. From −X: note the machine X; from +X: note it; MDI G53 G0 X(the mean) then G10 L20 P1 X0. Same from −Y and +Y at X0: G10 L20 P1 Y0. Lift clear and take the plug out."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: face A, T1 on a .002 leaf."
instruction_detailed = "Console M6 T1 (3/8 in end mill; the tool setter measures it); MDI G0 X−20 Y0 (solid face A between K and the screw holes). Spindle stopped, its end just dragging a .002 feeler leaf on face A: G10 L20 P1 Z{{process.z_leaf_mm:.3f}}."
feed = "hand"

[[setups.operations]]
instruction = "Prove AP04_chamfer in air, Z0 raised 1.000 in. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400). Run AP04_chamfer, watching the point stay inside K's circle. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

