  "Form, the thickness's envelope (Rule #1, perfect form at {{cad.rear_face_thickness_max_in:.3dot}}): the plate free on the surface plate, each face down in turn; the largest thickness reading plus the thickest feeler leaf that enters under it anywhere, at most {{cad.rear_face_thickness_max_in:.3dot}}. Over: stop and tell the owner.",
  "K Ø{{cad.press_hole_dia_min_in:.4dot}}–{{cad.press_hole_dia_max_in:.4dot}}: GO enters from either face, NO-GO enters from neither (the pins miked before Setup 2). GO refused: stop and tell the owner (do not re-ream). NO-GO enters: scrap. MHA-PD-28's traveler turns the bush to this hole.",
  "K's chamfer: accepted in Setup 3 (the .450 pin check that guides the hand cut).",
  "Side edges {{cad.outline_edge_right_x_min_in:.3dot}}–{{cad.outline_edge_right_x_max_in:.3dot}} from K: the GO pin in K, the calipers over the pin and each side edge at the kink and at the top, {{process.side_over_plug_min_mm:in.3dot}}–{{process.side_over_plug_max_mm:in.3dot}}. End round R{{cad.outline_end_r_min_in:.3dot}}–{{cad.outline_end_r_max_in:.3dot}}: over the pin and the round's far point on the centre line, {{process.round_over_plug_min_mm:in.3dot}}–{{process.round_over_plug_max_mm:in.3dot}}. The top edge's corners ({{cad.outline_top_left_y_min_in:.2dot}}–{{cad.outline_top_left_y_max_in:.2dot}} and {{cad.outline_top_right_y_min_in:.2dot}}–{{cad.outline_top_right_y_max_in:.2dot}} from K), the tapers and the kinks are the program's from the same zero as the round, not gauged. Outside: stop and tell the owner.",
  "Screw holes Ø{{cad.screw_hole_1_dia_min_in:.3dot}}–{{cad.screw_hole_1_dia_max_in:.3dot}}: as drilled. Positions (BASIC, Ø{{cad.screw_hole_1_position_dia_in:.3dot}} zone): a #1 drill's shank in each hole; the calipers over the GO pin in K and each shank, less half the shank's miked Ø and half the GO pin's written reading, {{process.screw_1_from_k_min_mm:in.3dot}}–{{process.screw_1_from_k_max_mm:in.3dot}} (the hole farther from the C edge) and {{process.screw_2_from_k_min_mm:in.3dot}}–{{process.screw_2_from_k_max_mm:in.3dot}} (the nearer). Each hole's place round K is the program's, from Setup 2's alignment check on the C edge (process-held). Outside: stop and tell the owner.",
]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.rear_face_thickness_band_mm}}" },
  { gauge = "zz-pins-4375-4382", band_mm = "{{cad.press_hole_dia_band_mm}}" },
  { gauge = "calipers", band_mm = ["{{process.side_over_plug_min_mm}}", "{{process.side_over_plug_max_mm}}"] },
  { gauge = "calipers", band_mm = ["{{process.round_over_plug_min_mm}}", "{{process.round_over_plug_max_mm}}"] },
  { gauge = "calipers", band_mm = ["{{process.screw_1_from_k_min_mm}}", "{{process.screw_1_from_k_max_mm}}"] },
  { gauge = "calipers", band_mm = ["{{process.screw_2_from_k_min_mm}}", "{{process.screw_2_from_k_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break every outside edge of the outline on both faces to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max (deburring scraper and smooth file); deburr the screw holes' face-A mouths and K's rear-face mouth flush (not K's chamfer, not the countersinks). Wash off the chips."
feed = "hand"
inspection = "No sharp edge or burr anywhere."
gauge_checks = "other"

[[setups.operations]]
instruction = "The plate leaves without the two Ø.0945 locating holes: MHA-PD-00 step 13A match-drills them with MHA-PD-18 and step 13E reams them; step 11C presses the MHA-PD-28 bush into K and step 11H reams its bore. Wipe on ISO VG 32 oil all over and into K ({{cad.finish}}); bag the plate."
feed = "hand"
