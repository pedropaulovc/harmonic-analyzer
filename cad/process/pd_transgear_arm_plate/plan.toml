[[setups]]
machine_kind = "other"
title = "Deburr, inspect, oil"
machine = "Bench, surface plate"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished plate face A up: K with its chamfer, the two screw holes (countersunk on the far face), the end round, the tapers, the top edge; the side-edge and round distances from the GO plug in K; the screw holes' distances from K." }
envelope = "other"
