  { gauge = "pin-gauges", band_mm = "{{cad.screw_hole_1_csk_dia_band_mm}}" },
  { gauge = "calipers", band_mm = ["{{process.sink_pin_depth_min_mm}}", "{{process.sink_pin_depth_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
steps = [
