[[setups.operations]]
instruction = "Unclamp the spoil block, plate still on it. Wet the tape round the plate with isopropyl alcohol, wait 2 minutes, then work a thin blade under the plate from its C edge along the tape. Never lever it up by the round or a corner: it must stay flat. Roll the tape off the plate and the block with a thumb; clean both with isopropyl alcohol."
feed = "hand"

