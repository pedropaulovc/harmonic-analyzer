[[setups.operations]]
instruction = "The plate leaves without the two Ø.0945 locating holes: MHA-PD-00 step 13A match-drills them with MHA-PD-18 and step 13E reams them; step 11C presses the MHA-PD-28 bush into K and step 11H reams its bore. Wipe on ISO VG 32 oil all over and into K ({{cad.finish}}); bag the plate."
feed = "hand"
