[[setups]]
machine_kind = "other"
title = "Free the plate"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/free.svg", alt = "The plate on the spoil block after AP03: its outline cut through into the block, the waste gone; a thin blade worked under the block's tape from the C edge along the plate's length." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Unclamp the spoil block and lift it out of the vise, plate still on it; brush the chips off. AP03 turned the whole waste to chips: there is no waste piece to free."
feed = "hand"

[[setups.operations]]
instruction = "Slide a single-edge razor blade flat under the block's tape at the C edge (the block's fixed-jaw edge) and work it along the plate's whole length a little at a time, so the tape bends, not the plate. Never lever the plate up from one end, the round or a corner, and never lift it by an edge while any tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Lay the plate tape up on the surface plate. Hold it down flat with the other hand close to the peel line and peel its tape (both layers and the glue between) back on itself, low and slow, along its length. No soaking."
feed = "hand"

[[setups.operations]]
instruction = "Any CA spot on the plate or the block: acetone on a rag (acetone softens CA). A film of tape adhesive: isopropyl alcohol. Peel the rest of the block's tape and wipe the block before the next blank."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File flush any fin the tape left at the bottom of the outline and scrape the drill and reamer burrs off K's and the screw holes' face-A mouths (deburring scraper, flush, no chamfer: K's chamfer is the hand countersink op's), so face A seats flat."
feed = "hand"
inspection = "Face A lies on the surface plate without rocking."
gauge_checks = "other"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Still rocks with the face-A burrs off: the facing's released stress bowed the plate; the next op straightens it. Lies flat: skip the next op." },
]
feed = "hand"

[[setups.operations]]
instruction = "Only if face A rocks: soft jaws in the bench vise; the plate standing on a side edge between them, two 1/8 in drill shanks across it near its ends on the hollow face, one across its middle on the crowned face. Close the vise a little, open it, lay the plate on the surface plate again; repeat in small steps."
inspection = "Face A lies on the surface plate without rocking."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Still rocks after three tries, or the drill shanks marked the plate: stop and tell the owner." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "hand-countersink"
drilling = "none"
sizing = "other"
instruction = "Chamfer K's face-A mouth by hand: the plate face A up on the bench, the RD16.5 RotoDrive countersink (deburring set) square in K, a few light turns clockwise with even pressure; blow out, stand the .450 pin in K and check. Repeat in light turns until in band."
instruction_detailed = "Turn the RD16.5 RotoDrive 90° countersink in K's face-A mouth, aiming at .015 x 45°. Then the .450 pin standing in K, its end on the chamfer: the calipers' depth rod from face A beside it to the pin's top, less the pin's miked length, is where its end sits."
feed = "hand"
inspection = "The pin's end {{process.chamfer_pin_depth_min_mm:in.4dot}}–{{process.chamfer_pin_depth_max_mm:in.4dot}} below face A (chamfer {{cad.press_hole_chamfer_leg_min_in:.3dot}}–{{cad.press_hole_chamfer_leg_max_in:.3dot}} x 45° for any K in its band)."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.chamfer_pin_depth_min_mm}}", "{{process.chamfer_pin_depth_max_mm}}"] }]

[[setups.operations]]
steps = [
  { kind = "stop", text = "The pin's end higher: more light turns, then the pin check again. Lower: stop and tell the owner." },
]
feed = "hand"

