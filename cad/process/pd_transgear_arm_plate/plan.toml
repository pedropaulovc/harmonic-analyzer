[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break every outside edge of the outline on both faces to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max (deburring scraper and smooth file); deburr the screw holes' face-A mouths and K's rear-face mouth flush (not K's chamfer, not the countersinks). Wash off the chips."
feed = "hand"
inspection = "No sharp edge or burr anywhere."
gauge_checks = "other"

[[setups.operations]]
instruction = "The plate leaves without the two Ø.1260 locating holes: MHA-PD-00 step 13A match-drills them with MHA-PD-18 and step 13E reams them; step 11K presses the MHA-PD-28 bush into K and step 11Q reams its bore. Wipe on ISO VG 32 oil all over and into K ({{cad.finish}}); bag the plate."
feed = "hand"
