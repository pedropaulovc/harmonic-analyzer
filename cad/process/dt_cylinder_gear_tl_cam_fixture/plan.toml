# Cylinder gear cam turning fixture body MHA-DT-12-TL-01 (qty 1), from the
# 4 in round 1018 CF piece on hand. Route, chosen for speed (owner ruling
# 2026-11-21: the agent picks the faster route and says why; the owner
# corrects afterwards):
# - Setup 1, PM-1127VF-LB lathe, 6 in 3-jaw, manual (turned setups get no NC,
#   owner 2026-11-21): one chucking, as the registry's process row says.
#   Face face F (the front face, which seats the gear), turn the Ø3.25
#   register 1.15 long, break the edge, part off 1.00 from F on the P1 blade:
#   the parted face is the back face, so the register and face F are square
#   to each other from one cut and no second chucking bruises the register
#   TL-00 indicates. The stock is the on-hand 4 in round x 3 in piece
#   (stock.1018-round-4, freed when MHA-MG-05 became a casting): nothing to
#   order, and its rest makes a second disc if the first is scrapped. The
#   3-1/2 in round the registry names is not on hand.
# - Setup 2, PM-30MV CNC, vise: the disc back face down on 1 in parallels,
#   gripped across the register. X0 is edge-found on both sides of the
#   register (no diameter in it), Y0 from the fixed jaw by half the
#   calipered register; the throw line runs along X so the two long
#   stations (.3402 and .9246) ride on the both-sides pick-up. CF01 spots,
#   drills 23/64 and reams .3740 through for the stub; CF02 spots, drills #65
#   and reams .0365 .20 deep for the clock pin. The touch probe is not
#   wired, so the edge finder picks up the register.
# - Setup 3, bench: deburr, oil. The stub and clock pin are pressed at
#   MHA-DT-12-TL-00, not here.
# To order before Setup 2 runs: the .3740 reamer (tools.reamer-3740,
# McMaster 3087A55), the #65 drill (tools.drill-65), the .0365 reamer
# (tools.reamer-0365, KBC 5-018-0365), and the two pressed parts tried at
# the holes: the stub dowel MHA-DT-12-TL-VN-50 and the clock pin
# MHA-DT-12-TL-VN-51.
# Fits (owner 2026-11-23/24; fit audit fit-audit-2026-11-23 README, "the
# fixture's stub and clock-pin holes are presses, and the press is the
# check"; policy PR #3513, tracking issue #3511): no plug gauge pair is
# bought. Each hole is reamed with its reamer and tried with its own pin,
# which must not enter by hand. The sheet prints the same, each reamer's
# size and no band (#3524): PRESS FIT ON TL-VN-50, DOES NOT TURN BY HAND and
# PRESS FIT ON TL-VN-51, PERMANENT PAIR. Those are read after the press, at
# MHA-DT-12-TL-00; here each hole is proved a press before the disc leaves
# the vise. cad.stub_hole_dia_* and cad.pin_hole_dia_* are the spec's
# analysis bands (what each reamer cuts).
# Mill speeds are the spindle's stops, 107.7 rpm apart (#3439): 1831, 646,
# 323, 2800, 1400 and, for the edge finder, 969.
#
# NC (cam:dt_cylinder_gear_tl_cam_fixture, cad/process/
# dt_cylinder_gear_tl_cam_fixture/cam.py): CF01_stub_hole, CF02_pin_hole.
# Program names, the [parameters] and the milling_cuts names are a contract
# with that recipe. Tool numbers are the places in the tools list among the
# mill's tools: T1 centre drill, T2 23/64 drill, T3 .3740 reamer, T4 #65
# drill, T5 .0365 reamer.
title = "Cylinder gear cam turning fixture body"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 4 in round (drawing: {{cad.material_name}})"
stock = "{{process.bar_dia_in:.2f}} in round 1018 CF, the {{process.bar_length_in:.2f}} in piece on hand: one disc ({{process.quantity:d}} off) from one chucking; the rest is kept for a remake."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished Ø{{cad.register_dia_min_in:.3dot}}–{{cad.register_dia_max_in:.3dot}} × {{cad.register_length_min_in:.3dot}}–{{cad.register_length_max_in:.3dot}} thick; the stub hole Ø{{cad.stub_hole_dia_min_in:.4dot}} reamed through (press fit on the stub dowel), the clock-pin hole Ø{{cad.pin_hole_dia_min_in:.4dot}} reamed (press fit on the clock pin) × {{cad.pin_hole_depth_min_in:.3dot}}–{{cad.pin_hole_depth_max_in:.3dot}} deep, both from face F. Lathe on its low range (70–380 rpm); mill speeds on the PM-30MV low belt (100–2800 rpm). Home the mill ($H) and touch off G54 at the start of the mill setup; after any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every file is proved in air first. Cutting oil on the steel. Edges: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
shop = "../shop"
stock_refs = ["1018-round-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_cylinder_gear_tl_cam_fixture/features.toml"
adapter = "drilled_block"
part = "dt-cylinder-gear-tl-cam-fixture"

[parameters]
quantity = 1
bar_dia_in = 4.0
bar_length_in = 3.0
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in),
# and the kerf it cuts, a little over it for wander.
blade_width_in = 0.0625
part_kerf_in = 0.075
# The 3-jaw grips 1.00 of the 3.00 piece: 2.00 out. The register is turned
# 1.15 from face F (the 1.00 disc, the P1 kerf and room past it), so the Ø4
# shoulder behind it stays .85 clear of the jaw fronts.
stickout_mm = 50.8
grip_in = 1.0
turn_length_in = 1.15
# The blank a disc is cut from (stock_fit: envelope X, Y, Z): the bar's
# diameter, and face F's .030 clean-up, the 1.00 disc and the kerf.
blank_x_in = 4.0
blank_y_in = 4.0
blank_z_in = 1.11
# Turning (A R Warner AR holder, TCMT insert, carbide): LittleMachineShop
# "Cutting Speeds" (read 2026-11-20), plain carbon steels with carbide well
# over 300 ft/min; 200 rpm on the Ø4 bar is 209 ft/min, the author's choice
# for a hobby lathe on an interrupted sawn end. Parting at 80 rpm: 68 ft/min
# at Ø3.25, HSS's low end (the same table), falling toward the axis.
turn_rpm = 200
part_rpm = 80
# The P1 blade stands out of the No. 7 holder 1.75 in: the Ø3.25 radius
# (1.625) and .125 to spare.
blade_out_in = 1.75
# CF01/CF02: the disc back face down on the 1 in parallels, 1/8 in thick,
# one against each jaw; the jaws grip the register over the jaw height less
# the parallels, and face F stands above the jaw tops.
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
grip_mm = 19.5453
jaw_top_below_z0_mm = 5.8547
# Gap between the parallels under the disc (register less two parallels):
# the stub drill and reamer run out into it.
parallel_gap_mm = 76.2
# The stub hole: spot Ø.160 with the #2 centre drill (under the 23/64, no
# chamfer at the press mouth), 23/64 (.3594) through in one feed (L/D 2.8,
# under prechips' chip-break L/D 3), its full diameter 1.0 mm past the back face; then
# the .3740 reamer through, 1.5 mm past it, fed in and fed out with the
# spindle running. Tips below face F (Z0): the drill 25.4 + 1.0 + its 118°
# point 2.742; the reamer 25.4 + 1.5. cam.py checks both.
stub_spot_dia_mm = 4.064
drill_past_mm = 1.0
ream_past_mm = 1.5
stub_drill_tip_mm = -29.142
stub_ream_tip_mm = -26.9
# The clock-pin hole: spot Ø.030 with the centre drill's pilot point only
# (under the #65's .0350), #65 in pecks of .020 with full retracts, its full
# diameter to .230 below face F (.025 under the reamer's end); then the
# .0365 reamer, its end at .205, so its full diameter passes .200 whatever
# its short 45° lead. cam.py checks both against the depth band.
pin_spot_dia_mm = 0.762
pin_peck_mm = 0.508
pin_drill_full_mm = 5.842
pin_drill_tip_mm = -6.109
pin_ream_tip_mm = -5.207
# Speeds and feeds, authored in the operations: LittleMachineShop "Cutting
# Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 3/8 in .006 in/rev.
# Centre drill 1831 rpm × .001 = 1.8 in/min (the pinion cam's spot); 23/64 at
# 646 rpm (61 ft/min) × .0043 = 2.8 in/min; the .3740 reamer at 323 rpm
# (32 ft/min, half the drilling speed) × .0056 = 1.8 in/min. The #65
# (.035) at the spindle's 2800 (26 ft/min, the most the mill turns) × .0005
# = 1.4 in/min, under the 1/16 column; the pilot spot the same; the .0365
# reamer at 1400 rpm × .0005 = .7 in/min.
stub_spot_feed_per_min_mm = 45.72
drill_23_64_feed_per_min_mm = 71.12
ream_3740_feed_per_min_mm = 45.72
pin_spot_feed_per_min_mm = 35.56
drill_65_feed_per_min_mm = 35.56
ream_0365_feed_per_min_mm = 17.78
# The pick-up check: the edge finder read back on both of the register's
# sides at Y0 must give equal and opposite X readings; their sum is twice the
# centre's error, held to .0005 in (a centre off by .00025, an eighth of the
# stations' ±.002).
pickup_check_mm = 0.0127
# The air prove-out lifts Z0 1.50 in: the deepest tip (the 23/64's, 1.147 in
# below face F) then stops .353 above it. cam.py checks it.
prove_raise_mm = 38.1

