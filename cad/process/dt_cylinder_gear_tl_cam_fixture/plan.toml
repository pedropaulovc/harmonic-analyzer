[[setups]]
machine_kind = "lathe"
title = "Turn the register, face F and part off"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The 4 in bar in the 3-jaw, gripped {{process.grip_in:.2f}} in, {{process.stickout_mm:in.2f}} in out of the jaw fronts, its sawn end out. The disc comes from this one chucking."
datum = "Z0 (carriage DRO) the bar end faced in Op 10: face F, the FRONT face (it seats the gear; both holes enter it)."
diagram = { file = "diagrams/lathe.svg", alt = "The 4 in bar in the 3-jaw: face F faced, the register turned to Ø3.25 for 1.15 in, the disc parted off 1.00 from F; the Ø4 rest stays in the jaws." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = 101.6, stock_diameter_mm = 101.6, stickout_mm = "{{process.stickout_mm}}", minimum_diameter_mm = "{{cad.register_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "turn"
drilling = "none"
sizing = "other"
instruction = "Face the sawn end clean, about .030 off; {{process.turn_rpm:d}} rpm, cutting oil. Touch the tool on the faced end and set DRO Z0 there. Mark it F with a marker dot near its centre: it is the FRONT face."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "turn"
drilling = "none"
sizing = "other"
instruction = "Turn the O.D. from F to DRO Z-{{process.turn_length_in:.2f}}: rough at .040 a side to Ø3.270, then one finish pass at .003 in/rev power feed to Ø{{cad.register_dia_min_in:.3dot}}–{{cad.register_dia_max_in:.3dot}} (aim {{cad.register_dia_in:.3dot}}); {{process.turn_rpm:d}} rpm, cutting oil. This O.D. is the register."
rpm = 200
feed = "0.003 in/rev"
inspection = "Register Ø{{cad.register_dia_min_in:.3dot}}–{{cad.register_dia_max_in:.3dot}}, calipers, at both ends of the turned length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.register_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break the F-to-register edge with a smooth file held flat, {{cad.chamfer_max_in:.3dot}} max; 70 rpm."
rpm = 70
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "P1 blade in the No. 7 holder, {{process.blade_out_in:.2f}} in out (it reaches the axis with .125 to spare), square to the axis, its edge on centre. Bring the blade's chuck-side face onto face F and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Part off with that face at Z-{{cad.register_length_in:.3dot}}; {{process.part_rpm:d}} rpm, cutting oil, a steady hand feed that never stops in the cut. Hands clear: let the disc fall; pick it up from the bed or the chip tray only after the spindle has stopped. The parted face is the BACK face."
rpm = 80
feed = "hand"
inspection = "Thickness {{cad.register_length_min_in:.3dot}}–{{cad.register_length_max_in:.3dot}}, calipers, at three places round the rim."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.register_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Register or thickness out of band: the disc is scrap, not reworked. Make another by repeating Setup 1 on the rest of the bar (about 1.9 in), gripped .60 in, 1.30 in out."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Drill and ream the stub and clock-pin holes"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2f}} tall above its seat; check with the calipers). A 1 in parallel, 1/8 in thick, against each jaw. The disc on both, BACK face down, face F up, gripped across the register, centred on the jaws, at any turn about its axis (nothing on it locates it yet): its lower {{process.grip_mm:in.3dot}} is in the jaws, face F {{process.jaw_top_below_z0_mm:in.3dot}} above the jaw tops. Tap it down onto both parallels while closing the vise. Both holes lie in the {{process.parallel_gap_mm:in.2f}} gap between the parallels."
datum = "Programs CF01_stub_hole and CF02_pin_hole (cam:dt_cylinder_gear_tl_cam_fixture). G54: X0 Y0 the register axis, Z0 face F; +X along the jaws, +Y toward the fixed jaw. The stub hole at X-{{cad.stub_hole_station_y_mm:.3f}} Y0, the clock-pin hole at X{{cad.pin_hole_station_y_mm:.3f}} Y{{cad.pin_hole_station_x_mm:.3f}} (mm). Tool lengths from the tool setter at each M6."
diagram = { file = "diagrams/mill.svg", alt = "The disc face F up in the vise on two parallels, gripped across its register; the stub hole {{cad.stub_hole_station_y_in:.4dot}} one way along the jaws from the register axis, the clock-pin hole {{cad.pin_hole_station_y_in:.4dot}} the other way and {{cad.pin_hole_station_x_in:.4dot}} toward the fixed jaw." }
envelope = "other"
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.register_dia_mm}}", along_jaws_mm = "{{cad.register_dia_mm}}", part_height_mm = "{{cad.envelope_z_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [-38.0619, "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "rod" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.envelope_z_mm}}"], clamp_mm = [0, "{{process.grip_mm}}"], section_mm = { diameter = "{{cad.register_dia_mm}}" }, vise_left = "other" }

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Before loading, at the bench vise (soft jaws): file the parting pip on the back face flush and break the back edge, {{cad.chamfer_max_in:.3dot}} max, so the back face sits flat on the parallels."
feed = "hand"

[[setups.operations]]
instruction = "Start only with the .3740 and .0365 reamers, the #65 drill, the stub dowel MHA-DT-12-TL-VN-50 and the clock pin MHA-DT-12-TL-VN-51 in hand (all to order). Caliper the register across three diameters and write the mean on a tag."
feed = "hand"

[[setups.operations]]
instruction = "Home the mill ($H) if it has not been homed this session. G54 Y0: the register axis, half the tagged register from the fixed jaw."
instruction_detailed = "Home the mill ($H) if it has not been homed this session. Edge finder (set 969) on the fixed jaw's face beside the disc: G10 L20 P1 Y(half the tagged register in mm − 2.540); for 3.250, Y38.735. MDI G0 Y0."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0: the register axis, midway between its left and right sides at Y0."
instruction_detailed = "Edge finder down beside the register at Y0, on its LEFT side from the left: G10 L20 P1 X0. On its RIGHT side from the right: G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "Check the pick-up: at Y0 edge-find the register's left side from the left, then its right side from the right, and add the two DRO X readings."
feed = "hand"
inspection = "The sum within {{process.pickup_check_mm:.4f}} mm ({{process.pickup_check_mm:in.4dot}} in) of 0."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = [0.0, "{{process.pickup_check_mm}}"] }]

[[setups.operations]]
instruction = "Sum off by more: repeat Op 100 and this check. The hole stations are not gauged after cutting: they are the programs' coordinates from this pick-up."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: face F, the centre drill's point on a .002 feeler leaf at X0 Y-20.000; Z set before any Z move."
instruction_detailed = "Console M6 T1 (#2 centre drill; the tool setter measures it). MDI G0 X0 Y-20.000 (X and Y only, at the homed Z; on face F, clear of both holes). Spindle stopped, jog Z down until its point just drags a .002 leaf there: G10 L20 P1 Z0.051. Only then MDI G0 Z5."
feed = "hand"

[[setups.operations]]
instruction = "Prove CF01_stub_hole and CF02_pin_hole in air with Z0 raised {{process.prove_raise_mm:in.2f}} in, more than the deepest tip (the 23/64's, Z{{process.stub_drill_tip_mm:.3f}} mm), watching each move clear the jaws. Then put Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + {{process.prove_raise_mm:.3f}}): the deepest tip, the 23/64's Z{{process.stub_drill_tip_mm:.3f}}, then stops above face F. Run each file through every M6. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CF01_stub_hole (M6 T1, centre drill; set 1831): spot Ø{{process.stub_spot_dia_mm:in.3dot}} at X-{{cad.stub_hole_station_y_mm:.3f}} Y0, under the 23/64 drill."
rpm = 1831
feed = "{{process.stub_spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "stub spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.stub_spot_dia_mm}}", flutes = 2, rpm = 1831, feed_mm_min = "{{process.stub_spot_feed_per_min_mm}}", stations_mm = "{{cad.envelope_z_mm}}" },
]

[[setups.operations]]
