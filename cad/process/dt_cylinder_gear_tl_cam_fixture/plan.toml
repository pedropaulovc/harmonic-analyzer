]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-3740"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.stub_hole_dia_band_mm}}" }
instruction = "Same file, M6 T3 (set 323): .3740 reamer through, {{process.ream_past_mm:in.3dot}} past the back face, fed in and fed back out with the spindle running: no rapid leaves the hole. Plenty of cutting oil."
rpm = 323
feed = "{{process.ream_3740_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "stub ream", kind = "drill", phase = "finish", cutter_dia_mm = 9.4996, flutes = 6, rpm = 323, feed_mm_min = "{{process.ream_3740_feed_per_min_mm}}", stations_mm = "{{cad.envelope_z_mm}}" },
]
inspection = "Stub hole, before unclamping: reamed clean through (visual), and the stub dowel MHA-DT-12-TL-VN-50, offered to the hole's mouth by hand, does not enter (it is pressed in at MHA-DT-12-TL-00; pressed home there, it does not turn by hand)."
gauge_checks = "other"

[[setups.operations]]
instruction = "The stub dowel enters by hand: the hole is oversize and the disc is scrap; make another from Setup 1."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run CF02_pin_hole (M6 T1, centre drill; set 2800): spot Ø{{process.pin_spot_dia_mm:in.3dot}} with the pilot's point only at X{{cad.pin_hole_station_y_mm:.3f}} Y{{cad.pin_hole_station_x_mm:.3f}}, under the #65."
rpm = 2800
feed = "{{process.pin_spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.pin_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.pin_spot_feed_per_min_mm}}", stations_mm = "{{cad.envelope_z_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-65"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4 (set 2800): #65 drill in pecks of {{process.pin_peck_mm:in.3dot}} with full retracts, its full diameter {{process.pin_drill_full_mm:in.3dot}} below face F. Cutting oil; a #65 breaks easily: stop at any squeal."
rpm = 2800
feed = "{{process.drill_65_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{process.pin_drill_full_mm}}"
peck = { step_mm = 0.508, retract = "full" }
milling_cuts = [
  { name = "pin drill", kind = "drill", phase = "rough", cutter_dia_mm = 0.889, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_65_feed_per_min_mm}}", stations_mm = "{{cad.envelope_z_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer-0365"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.pin_hole_dia_band_mm}}" }
instruction = "Same file, M6 T5 (set 1400): .0365 reamer down to Z{{process.pin_ream_tip_mm:.3f}} (its end), fed in and fed back out with the spindle running. Cutting oil."
rpm = 1400
feed = "{{process.ream_0365_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "pin ream", kind = "drill", phase = "finish", cutter_dia_mm = 0.9271, flutes = 4, rpm = 1400, feed_mm_min = "{{process.ream_0365_feed_per_min_mm}}", stations_mm = "{{cad.envelope_z_mm}}" },
]
inspection = "Pin hole, before unclamping: the clock pin MHA-DT-12-TL-VN-51, offered to the hole's mouth by hand, does not enter (it is pressed in for good at MHA-DT-12-TL-00). Reamed depth {{cad.pin_hole_depth_min_in:.3dot}}–{{cad.pin_hole_depth_max_in:.3dot}}: take the .0365 reamer out of its holder, mike its length, stand it flutes down in the hole by finger until it stops on the end of its own bore (the #65 hole below is too small for it), and caliper its stand-out above face F; the length less the stand-out is the depth."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pin_hole_depth_band_mm}}" }]

[[setups.operations]]
instruction = "The clock pin enters by hand, or the depth is out: the disc is scrap; make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and oil"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished disc, face F up: the stub hole through on one side of the register axis, the clock-pin hole on the other; every edge broken." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Take the burr off both stub-hole mouths and the clock-pin hole's mouth with the scraper, a light turn only: no chamfer over {{cad.chamfer_max_in:.3dot}}. Blow the chips out of both holes."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Check every edge of the register and both faces is broken, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; touch up with the smooth file."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on ISO VG 32 oil. The disc leaves bare: the stub (TL-VN-50) and the clock pin (TL-VN-51) are pressed at MHA-DT-12-TL-00, not here."
feed = "hand"
