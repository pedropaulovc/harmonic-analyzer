[[setups.operations]]
instruction = "No 4-40 bottoming tap in hand (it is to buy): do the stop check, the tap file, the plug tap's depth reference, the plug tap and the scrape now; skip the bottoming tap's depth reference, the bottoming tap and the thread-depth check. Tag the block AWAITING 4-40 BOTTOMING TAP and go on to Setup 6. This setup's last op is the way back."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the tap file: measure each 4-40 tap (plug and bottoming) in its T-handle wrench from its point to the wrench's centre hole. At most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the parallels, the block, the collet, the tap guide's 3-1/8 in and 1 in to bring the point down). Over: stop; do not tap on this setup."
feed = "hand"

