[[setups.operations]]
instruction = "G54 Z0: spindle stopped, turn the saw by hand until the tooth marked LOW is the one over W. Jog Z only, down in CNCjs (0.01 mm steps near the leaf), until a .002 leaf just drags under that tooth on W; G10 L20 P1 Z(the E-to-W reading taken before clamping, in mm, + 0.051). DT11 loads no tool."
feed = "hand"

[[setups.operations]]
instruction = "Prove DT11_slit in air, Z0 raised {{process.saw_proof_raise_mm:in.3f}} in (send $#, then G10 L2 P1 Z(the G54 line's Z + {{process.saw_proof_raise_mm:.3f}})): it rises straight to its clear height before any X or Y move; the saw, the arbor's body, its cap and the screw clear the block, the jaws and the stacks; it stops once after its first pass, spindle stopped (Cycle Start). Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "slit-saw"
drilling = "none"
sizing = "other"
instruction = "Run DT11_slit (the saw; set 100, in the L range): one light pass along +Y across the block's depth, {{process.slit_first_pass_mm:in.3dot}} into TOP. Conventional: the saw turns clockwise right of TOP, so at the block its teeth run +Y, the way it is fed, and the cut pushes back against the feed (fed −Y it would grab and turn on the arbor). The file then lifts the saw clear and stops the spindle (M0). Cutting oil on the saw."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "slit first", kind = "side", phase = "rough", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.slit_first_pass_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "At the M0, the spindle stopped and the saw clear of the block: look at the two marker lines."
inspection = "Both lines unbroken across the cap, the saw and the arbor's body: Cycle Start. A line broken (the saw has slipped on the arbor): stop the file and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "slit-saw"
drilling = "none"
sizing = "other"
instruction = "Same file after Cycle Start (the saw; still 100): three more passes along +Y, each {{process.slit_step_mm:in.3dot}} deeper into TOP, to {{process.slit_depth_mm:in.3dot}} REF: into the adjuster. Cutting oil on the saw."
rpm = 100
feed = "{{process.saw_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "slit", kind = "side", phase = "finish", cutter_dia_mm = "{{process.saw_dia_mm}}", flutes = 72, rpm = 100, feed_mm_min = "{{process.saw_feed_per_min_mm}}", axial_doc_mm = "{{process.saw_thickness_mm}}", radial_woc_mm = "{{process.slit_step_max_mm}}", stations_mm = 0 },
]

[[setups.operations]]
instruction = "DT11 has ended with the spindle stopped (M5) and the saw raised clear past TOP; confirm it has stopped. Still clamped: the slit's width with the feeler leaves, at TOP and at the adjuster."
inspection = "Leaves stacked to {{cad.slit_width_min_in:.3dot}} enter the slit to the adjuster; leaves stacked to {{cad.slit_width_max_in:.3dot}} do not. The slit opens into the adjuster's thread, and W's #30 opens full round into the slit. Outside: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "MDI G53 G0 Z0: Z only, to the machine top; X and Y stay. The arbor's shank drops out downward, and it has that room only up there, the saw and its cap clear above the vise. Then unclamp, take the arbor out of the spindle and the saw off it at the bench; put the collet back."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished block: SEAT down, the slit from TOP into the adjuster with its two countersinks, the pinch hole through both halves, the foot hole in SEAT; the adjuster's height from SEAT read with the height gauge over a 1/4-28 screw." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Hold: a block tagged AWAITING 4-40 BOTTOMING TAP goes back to Setup 5 (its last op) for the bottoming tap and the thread-depth check before anything here."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-1-4-28"
drilling = "none"
sizing = "other"
instruction = "Chase the adjuster: run the 1/4-28 plug tap through it by hand from N, following the thread, to clear the slit's burr; blow it out."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file; the slit's edges with a fine needle file stroke along them. SEAT's edges only, never across SEAT (Ra {{cad.seat_finish_callout}}). Wash off the oil."
feed = "hand"
inspection = "No burr stands proud of any face, in the slit or at a hole; SEAT still flat and even."
gauge_checks = "other"

[[setups.operations]]
instruction = "The adjuster's height: SEAT down on the surface plate, a 1/4-28 screw through the adjuster. Height gauge over the screw's thread crest twice: resting down, then lifted by hand against the upper flanks. The mean, less half its miked major diameter, is the axis height (the screw's thread play cancels)."
inspection = "H ±{{cad.adjuster_height_match_max_in:.3dot}} (Setup 8's H), and {{cad.adjuster_height_min_in:.3dot}}–{{cad.adjuster_height_max_in:.3dot}}. Outside: stop and tell the owner with the reading."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.adjuster_height_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Fits: a 4-40 screw runs in from W through the #30, across the slit into the E half's thread, and draws the two halves together; a 1/4-28 screw runs through the adjuster; the foot hole takes its 4-40 screw to the Setup 5 depth."
inspection = "Each runs in by hand and seats. Any failure: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Black oxide + oil: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/finish.svg", alt = "The finished block, every face, the slit and the three tapped holes brushed black with the Presto Black Steel PC9, then sealed with oil." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the block with soap and water, into the slit and the holes, to take off the oil; rinse and dry it. Hold it by its ends from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff every face except SEAT lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping the faces flat; SEAT only wiped clean. Not in the holes or the slit. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every face, into the slit and the holes with even, light strokes; go over the edges and any light spot until the block is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction; dry with compressed air, blowing out the slit and the holes, or a lint-free cloth. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal (the oil): wipe the stone lubricant (a light oil) over every face, into the slit and the holes (the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "An even black on every face, no bare or rusty patch (else wash, brush again, rinse, dry and seal); the three screws still run in by hand."
gauge_checks = "other"
