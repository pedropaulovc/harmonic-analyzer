speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run DT09_adjuster_tap: M6 T7, the tap guide in the 1/2 in collet (the tool setter measures it), spindle off; the file ends Idle at the machine top over the adjuster."
diagram = { file = "diagrams/adjuster-tap.svg", alt = "The block lying N up; the 1/4-28 tap in the T-handle wrench in the adjuster, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to stop {{process.adjuster_tap_reach_mm:in.3dot}} below N, through S between the stacks." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the 1/4-28 tap's point standing on N beside the hole and the guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 X7.620, G90 (beside the hole, on N), then G20. Stand the tap, in its wrench, on its point on N; jog Z down until the guide's point is in the centre hole and pushed fully home. Note the DRO Z. Jog Z up clear; G21, MDI G91 G0 X-7.620, G90 (back over the hole), G20."
feed = "hand"

[[setups.operations]]
