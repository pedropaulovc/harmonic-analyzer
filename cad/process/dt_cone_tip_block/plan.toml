inspection = "The combination square's blade on edge across the cap's face: the screw's head under it or flush; proud, at most {{process.saw_screw_stand_max_mm:in.2dot}} by the calipers' depth rod. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = [0, "{{process.saw_screw_stand_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
