tool = "tap-1-4-28"
drilling = "none"
sizing = "other"
instruction = "Tap {{cad.adjuster_thread}} by hand under the tap guide, spindle off, cutting oil, a half turn back each turn. Read with the point pushed fully home: stop at the noted Z − {{process.adjuster_tap_reach_mm:in.3dot}}: the full thread is then through S. Jog Z up clear, G21; back the tap out; blow the hole out."
feed = "hand"

[[setups.operations]]
instruction = "A 1/4-28 screw runs through the adjuster by hand from N."
inspection = "It runs through without binding. Binds: send G20 and run the tap again to the same DRO Z, then send G21; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
