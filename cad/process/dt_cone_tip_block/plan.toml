[[setups.operations]]
instruction = "Input H: the MHA-DT-05 journal axis height above MHA-DT-20, as measured for MHA-DT-00 (drawing NOTE 2), to .0001 in. Not yet measured (MHA-DT-05 waits for the foundry quotes): tag the block AWAITING DT-05 HEIGHT and stop here."
