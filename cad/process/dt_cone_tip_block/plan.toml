[[setups]]
machine_kind = "other"
title = "Saw the strip"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 × 2-1/4 in flat bar lying on a wide face in the saw; one strip about .80 in wide marked off its end, the cut across the bar's 2-1/4 width." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar's thickness and its width near the end, at both edges."
inspection = "Thickness {{process.bar_thickness_min_mm:in.3dot}}–{{process.bar_thickness_max_mm:in.3dot}}, width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}. Outside: stop, the programs assume this section."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.bar_thickness_min_mm}}", "{{process.bar_thickness_max_mm}}"] }, { gauge = "micrometers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw two strips, each marked .80 wide, off the end of the 1/2 × 2-1/4 in 1018 bar, the bar lying on a wide face in the saw's vise, each cut across its full 2-1/4 width. One becomes the part, the other the vise spacer for Setup 10 (Setup 2 decides which). The rest of the bar stays for MHA-DT-18, MHA-DT-16 and MHA-MG-01."
feed = "hand"
inspection = "Each strip {{process.strip_min_mm:in.2dot}}–{{process.strip_max_mm:in.2dot}} wide at both ends, calipers. Narrower: scrap it and saw another. Wider: file the sawn face until it is, then recheck."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.strip_min_mm}}", "{{process.strip_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the burr off both sawn faces and the edges of each strip so it seats flat on the parallels. With marking fluid, on each: one bar face N, one sawn face E, one bar edge SEAT (the drawing names none; this traveler does, and the marks go back on after each cut)."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "S to the depth"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and 1/2 in parallels of the set stacked against each jaw (1.5 in). The strip lying flat on them, N down, its 2-1/4 length across the jaws: gripped on the bar's two cold-finished edges, SEAT against the FIXED jaw; E to the LEFT, centred along the jaws. Tap it down onto both stacks while closing the vise; the lower {{process.lying_grip_mm:in.3dot}} of it is in the jaws."
datum = "Program DT01_depth. G54: X0 face E (left), Y0 the fixed jaw's face (SEAT), Z0 the stacks' top (N), set from the miked thickness; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/depth.svg", alt = "The strip lying N down on stacked parallels, gripped on the bar's edges across the jaws; the 1/2 in end mill faces the face up down to the depth in levels: it becomes S." }
envelope = { x_span_mm = ["{{process.strip_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.bar_width_max_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.bar_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.depth_target_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.bar_width_max_mm}}", along_jaws_mm = "{{process.strip_max_mm}}", part_height_mm = "{{process.bar_thickness_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_strip_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.strip_max_mm}}"], clamp_mm = [0, "{{process.strip_max_mm}}"], section_mm = { y = "{{process.bar_width_max_mm}}", z = "{{process.bar_thickness_max_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before clamping: mic N to the face up at the strip's middle and write it down (mm = in × 25.4). Clamp it as Holding says. Home the mill ($H) if it has not been homed this session."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 face E (left), Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the strip, G10 L20 P1 Y-2.540; on face E from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, from that reading and the end mill touched on the face up at the strip's middle."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it). MDI G0 X10.541 Y-28.639 (the strip's middle). Spindle stopped, its tip just dragging a .002 feeler leaf on the face up: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove DT01_depth in air: Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Prove DT01_depth in air: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run DT01_depth, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run DT01_depth (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): face the face up down to Z {{process.depth_target_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.bar_thickness_max_mm:in.3dot}} (the thickest bar: a thinner one cuts air first). Unclamp; file the burr off the cut face's edges; mark this face S; mic N to S."
settings = "em-half-carbide-1018-3439-face"
inspection = "Depth {{cad.south_face_depth_min_in:.3dot}}–{{cad.south_face_depth_max_in:.3dot}}, N to S, miked at all four corners."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.south_face_depth_band_mm}}" }]
milling_cuts = [
  { name = "depth face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.strip_max_mm}}"] },
]

[[setups.operations]]
instruction = "Over {{cad.south_face_depth_max_in:.3dot}}: wipe N and the stacks clean (a chip under it is the usual cause), then repeat this setup from its first op with the new reading and run DT01_depth again; it faces only what stands above Z {{process.depth_target_mm:in.4dot}}. Under {{cad.south_face_depth_min_in:.3dot}}: the strip is scrap."
feed = "hand"

[[setups.operations]]
instruction = "The second strip: this setup's ops again, from the first (mic, clamp, edge finder, Z0, DT01_depth), to the same depth check."
feed = "hand"

[[setups.operations]]
instruction = "Mic both strips N to S at the middle and write both down. The thicker one is the block from here on; the other is Setup 10's vise spacer, and nothing else is done to it. (A spacer thicker than the block would take the jaws' grip off the block under the saw.)"
inspection = "The spacer no thicker than the block and at most {{process.spacer_under_max_mm:in.3dot}} thinner. Thinner by more: write the difference on it; Setup 10 makes it up with feeler leaves."
gauge_checks = "other"
feed = "hand"

