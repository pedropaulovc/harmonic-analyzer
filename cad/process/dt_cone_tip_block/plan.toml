feed = "hand"

[[setups.operations]]
instruction = "Every time the block is clamped, before the arbor goes in: hold the combination square's blade flat against the jaws' right side, across the right ends of both stacks of parallels, under the block's overhanging end."
inspection = "The blade touches no parallel: both stacks end at or inside the jaws' right side. Right of TOP the arbor's cap and its screw pass down to {{process.saw_below_stack_top_mm:in.2dot}} below the stacks' top. A parallel out: unclamp, slide it in and clamp again as Holding says."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 TOP (right), Y0 the fixed jaw's face: edge finder (900 rpm); then Z fully up."
instruction_detailed = "Edge finder (900 rpm), in the collet: on the fixed jaw's face beside the block, G10 L20 P1 Y-2.540; on TOP from the right, G10 L20 P1 X2.540 (plus: the finder's centre is right of TOP). Then MDI G53 G0 Z0: Z goes to the machine top."
feed = "hand"

[[setups.operations]]
instruction = "Spindle stopped (M5). Take out the collet. Wipe the arbor's shank and the spindle's taper clean; the arbor with its saw into the spindle, cap down, drawbar tight. Calipers' depth rod: the arbor's body from the saw's upper face up to the first thing wider than it (the arbor's flange or the spindle nose)."
