feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
instruction = "Side runout, at every mounting of the arbor in the spindle (the taper never seats it quite the same twice), spindle stopped: the lever indicator's magnetic base on the mill's head, its stylus on the saw's upper face 1/8 in in from the teeth. One full turn by hand, backward (anticlockwise seen from above)."
inspection = "The needle's swing plus the saw's thickness written down: at most {{process.kerf_max_mm:in.3dot}} ({{process.saw_side_tir_nominal_mm:in.3dot}}, 0.10 mm, of swing for a .064 saw). Over: take the arbor out, wipe its shank and the taper, mount it and read again. Still over: at the bench, loosen the screw, wipe, turn the saw a quarter turn round on the pilot and tighten to {{process.saw_clamp_torque_nm:g}} N·m; then both runouts again. Over after two such tries: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
