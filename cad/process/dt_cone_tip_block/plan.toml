# Cone tip block MHA-DT-21 (qty 1), routed for the CNC mill (agent's choice
# for speed, owner ruling 2026-11-21: the owner corrects the route
# afterwards). One strip about .80 wide sawn off the end of the owned
# 1/2 x 2-1/4 in 1018 cold-finished flat (stock.1018-flat-1-2x2-1-4, the bar
# MHA-DT-18, MHA-DT-16 and MHA-MG-01 also draw on): the bar's 2-1/4 width
# becomes the 2.07 height (seat to top), its 1/2 thickness the .44 depth (N
# kept as bought, S faced), the sawn strip the .67 width (E skimmed, W faced).
#
# Faces (the drawing names none; this traveler names them and marks them):
# N and S the .44 depth's faces (N the bar's cold-finished face kept); E and
# W the .67 width's faces (E the jaw the drawing's VIEW B shows, tapped 4-40
# to the slot; the foot hole is .30 from it); SEAT (Ra 125, the foot hole's
# face) and TOP (the slit's end).
#
# Route: saw (Setup 1); lying N down, gripped on the bar's edges: S to the
# depth (DT01); on edge: skim E (DT02); upright: skim TOP (DT03); upright,
# TOP down: SEAT to the height, spot and drill the #43 foot hole (DT04), tap
# it plug then bottoming under the tap guide (DT05); on edge, E down: W to
# the width, the #43 pinch hole through both halves and the W half opened #30 to
# the slot (DT06); W down: tap the pinch hole from E (DT07); lying N up:
# spot, drill #3 through and countersink the 1/4-28 adjuster, its height the
# measured MHA-DT-05 axis height H (DT08), tap it (DT09); S up: countersink
# its other end (DT10); on edge, E down, TOP .75 past the right jaw side:
# saw the slit into the adjuster (DT11); deburr, inspect; black oxide + oil,
# Presto Black Steel PC9 (owner ruling 2026-11-21).
#
# The adjuster's height (drawing NOTE 2): its axis is made to the measured
# MHA-DT-05 journal axis height above MHA-DT-20, H, within ±.003 (and inside
# the printed 1.49-1.51). MHA-DT-05 is on hold for the foundry quotes (owner
# ruling 2026-11-22), so Setup 8 takes H as an input: the block waits there,
# tagged, until H is measured. The programs are posted for H = 1.500; the
# traveler shifts G54 X by (H - 1.500) at the SEAT touch-off.
#
# The slit (.050-.070 wide: owner tool-audit ruling Q10, 2026-11-23, "Print
# .06 (.050-.070) and use the owned 2-3/4 x .064 saw on the 1 in arbor, IF
# the owned saw's hole is 1 in", the condition met 2026-11-24; 15.13 mm REF
# into the adjuster): the owned 2-3/4 in x .064 HSS slitting saw (McMaster
# 3062A21, inventory tools.slitting-saw-2-75-064, 1 in hole) on the owned R8
# stepped saw arbor (inventory tools.saw-arbor-r8-stepped, owner facts
# 2026-11-24), horizontal on the vertical spindle. The saw centres on the
# arbor's spring-loaded 1 in pilot step, seats against the arbor body's
# shoulder on its upper (spindle) side and is clamped from below by the cap
# and its M8 x 1.25 countersunk hex socket screw (record screw_thread: the
# owner gauged the pitch; 5 mm key, screw_key_mm_inferred), torqued to the
# record's clamp_torque_nm, 20 N·m. The owner counted 8 turns from first bite
# to seated with no saw fitted (screw_engagement_no_saw_mm, 10 mm); the saw
# takes its own thickness off that. The arbor is not keyed: the cap's
# friction drives the saw. So the passes run conventional (a climb cut would
# let the teeth grab and slip it), a marker line is drawn across cap, saw and
# shoulder before the first pass, and that pass is a light one (half a step)
# with a stop after it to read the line.
#
# Where everything stands in Setup 10: the block lies E down, gripped on N
# and S, TOP .75 in past the right jaw side; the saw's axis is right of TOP.
# The arbor's body (1.25 across) passes above the saw and its cap (1.25
# across, .50 thick) with the screw below it, both beside the TOP end and
# right of the jaw sides: 3.92 mm clear of TOP at the slit's full depth. The
# reach past the arbor is (2.750 - 1.250)/2 less 1.0 mm = 18.05 mm (.711 in)
# on both sides of the saw, against the slit's 15.128. The jaws' tops are
# under the saw and left of it by the overhang. The saw cuts the slit's
# width in one pass: its thickness is miked and its side runout read at
# every mounting (the pilot is a sliding fit), the two together at most
# .068, the slit's .070 less .002. Two sizes the arbor's record does not
# carry are bounds of this plan, which cam.py checks every clearance at and
# Setup 10 measures before the spindle starts: the screw head's stand past
# the cap's face (at most .25 in) and the spindle nose's height above the
# saw (at least .43 in; the record's 1.4 in less the .50 cap gives about
# .90). The saw's Z is set by touching the saw itself off on W, never from
# the arbor's recorded length.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher): its
# spring-loaded point seats in the T-handle wrench's centre hole and follows
# the tap down 1/2 in, spindle off; the operator jogs Z only to push the
# point home again and to read the depth. FluidNC refuses jogs in the Hold an
# M0 leaves (wiki.fluidnc.com/en/features/single_block_mode), so each tap
# stop is its own file ending M30 over its hole (DT05, DT07, DT09).
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero a cutter on a
# .002 feeler leaf, as the column clamp and platen guide plans do.
#
# Flagged, not owned: the #4-40 bottoming tap (tools.tap-4-40-bottoming, to
# order); the PC9 and its gloves and glasses
# (consumables.presto-black-steel-pc9 and chemical-gloves-eye-protection, to
# order). The .062 dowel ream (drawing NOTE 1) is match-drilled at MHA-DT-00
# step 2, not here. For Setup 10: the owner's torque wrench covering 15 ft·lb
# (tools.torque-wrench, to be identified: "tbd tomorrow", owner 2026-11-24)
# with a 5 mm hex bit or socket (tools.hex-bit-5mm, to be confirmed), and the
# owned 12 in combination square whose blade is the setup's rule and
# straightedge. Without the wrench and bit the setup stops before the saw runs.
#
# NC (cam:dt_cone_tip_block, cad/process/dt_cone_tip_block/cam.py):
# DT01_depth, DT02_east, DT03_top, DT04_seat, DT05_foot_tap, DT06_west,
# DT07_pinch_tap, DT08_adjuster, DT09_adjuster_tap, DT10_south_csk,
# DT11_slit. Program names, the [parameters] and the milling_cuts names are a
# contract with that recipe. Tool numbers are the places in the tools list
# among the mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #43, T4
# #30, T5 #3, T6 chamfer mill, T7 the tap guide (the taps are turned by
# hand), T8 the slitting saw (no tool-setter length; DT11 loads no tool).
title = "Cone tip block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/2 × 2-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.bar_thickness_in:fraction}} × {{process.blank_y_in:fraction}} in flat bar; two strips {{process.strip_min_mm:in.2dot}}–{{process.strip_max_mm:in.2dot}} in wide sawn off its end: {{process.quantity:d}} part and the Setup 10 vise spacer."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.top_face_height_min_in:.2dot}}–{{cad.top_face_height_max_in:.2dot}} high (SEAT to TOP), {{cad.west_face_width_min_in:.2dot}}–{{cad.west_face_width_max_in:.2dot}} wide (E to W), {{cad.south_face_depth_min_in:.2dot}}–{{cad.south_face_depth_max_in:.2dot}} deep (N to S). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once a session, not at every setup; each mill setup touches off its own G54. A Reset after a Feed Hold keeps G54: no homing, no new zero. After any other controller reset (it restarted by itself in a pass once, and lost home: logbook 2026-11-06), an alarm, a stall or an E-stop: home and touch off again before Cycle Start. Every cutting file is proved in air first. At every M6 stop the file has stopped the spindle and lifted the tool clear. The slit (Setup 10) splits the TOP end into the E half and the W half; the pinch hole runs through both. The Ø.0620 dowel ream (drawing NOTE 1) is done at assembly (MHA-DT-00), not here. Setup 8 waits for H, the measured MHA-DT-05 axis height. To buy: the 4-40 bottoming tap, the PC9."
shop = "../shop"
stock_refs = ["1018-flat-1-2x2-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_cone_tip_block/features.toml"
adapter = "drilled_block"
part = "dt-cone-tip-block"

[parameters]
quantity = 1
# The blank the programs are posted for (stock.1018-flat-1-2x2-1-4, a 19 in
# bar on hand): the strip's width along the block's X, the bar's width along
# Y (the height), its thickness along Z (the depth); stock_fit reads
# blank_<axis>_in. The strip is sawn .77-.83 wide (mark .80, the saw's ±.03).
blank_x_in = 0.8
blank_y_in = 2.25
blank_z_in = 0.5
bar_thickness_in = 0.5
strip_min_mm = 19.558
strip_max_mm = 21.082
# The incoming bar gate (.498-.502 thick, 2.245-2.255 wide; the programs
# start their to-size faces from the thickest and widest).
bar_thickness_min_mm = 12.6492
bar_thickness_max_mm = 12.7508
bar_width_min_mm = 57.023
bar_width_max_mm = 57.277
# Targets, the middle of each band (cam.py checks them against the export):
# height 2.070 (2.06-2.08), width .670 (.66-.68), depth .440 (.43-.45).
length_target_mm = 52.578
width_target_mm = 17.018
depth_target_mm = 11.176
# Skims (author's choice): E .030 (a sawn face), TOP .090 (the bar's edge,
# half of what the bar's width gives up); W and SEAT faced to size from
# them, S to the depth from N. The raw W and SEAT from E's and TOP's skims
# (the narrowest and the widest strip or bar; cam.py checks them), each to
# leave at least face_cut_min_mm (.010) to clean up.
east_skim_mm = 0.762
top_skim_mm = 2.286
west_raw_min_mm = 18.796
west_raw_max_mm = 20.32
seat_raw_min_mm = 54.737
seat_raw_max_mm = 54.991
face_cut_min_mm = 0.254
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) at the
# measured setting em-half-carbide-1018-3439-face (shop common.toml; cad/
# config/shop-equipment/measured-cuts.toml, #3439: stable to 1.27 mm deep and
# 6.4 mm wide, conventional, 2420-2490 rpm in the cut), passes no wider than
# .250 in (half the cutter, inside its 6.4 mm), equally spaced, the first
# engaging one stepover and the last overhanging the far edge; the zigzag
# climbs on every other pass, which the session did not measure. Equal levels no deeper than .030 (the
# author's choice for a 1/2 in end mill in 1018).
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
face_step_max_mm = 0.762
# Holes: spot Ø.080 with the #2 centre drill, under the #43 (no chamfer at a
# tap's mouth), then the drills pecked with full retracts: the #43 .080
# deep, the #30 and the #3 .100, each under one diameter. Through holes run
# their full diameter drill_past_mm past the far face, into the air between
# the stacks. Heights (each program's Z) cam.py recomputes: the foot hole's
# #43 point (.440 full diameter below SEAT, from the parallels' top), the
# pinch hole's #43 point below E, the #30's depth from W (.330, the band's
# middle, full diameter: its shoulder inside the slit) and its point, the
# #3's point below S.
spot_dia_mm = 2.032
peck_43_mm = 2.032
peck_mm = 2.54
drill_past_mm = 1.0
foot_tip_height_mm = 40.7228
pinch_tip_height_mm = -1.6792
clearance_depth_mm = 8.38
clearance_tip_height_mm = 7.6574
adjuster_tip_height_mm = -2.6254
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003
# in/rev, a size between two columns taking the lower one's feed. Centre
# drill 1800 rpm × .001 = 1.8 in/min (the platen guide's spot); #43 2800 rpm
# (65 ft/min) × .001 = 2.8 in/min; #30 1800 rpm (61 ft/min) × .003 = 5.4
# in/min; #3 1200 rpm (67 ft/min) × .003 = 3.6 in/min.
spot_feed_per_min_mm = 45.72
drill_43_feed_per_min_mm = 71.12
drill_30_feed_per_min_mm = 137.16
drill_3_feed_per_min_mm = 91.44
# Countersinks (.252-.262 × 90°, both ends): the 1/4 in 90° chamfer mill
# (shop chamfer-mill-carbide-1-4-90, its flutes .125 long) circles inside the
# #3 hole, its point csk_tip_depth_mm (.102) below the face and csk_orbit_mm
# off the axis: the rim at the band's middle, .257. Its cone at the face is
# then .102 in radius, inside the .107 hole on the way down. 1400 rpm (92
# ft/min) × .001 in/tooth × 2 = 2.8 in/min: the author's choice, slow for
# carbide, the bottom of prechips' feed table per tooth, for a light .102
# deep cut with a 1/4 in point.
csk_dia_aim_mm = 6.5278
csk_tip_depth_mm = 2.6
csk_orbit_mm = 0.6639
# The countersink point's height in DT08/DT10, the nominal depth less the
# point's depth: those setups set Z0 the nominal depth below the face they
# cut, so the rim is cut from the face whatever the block's depth.
csk_tip_height_mm = 8.576
chamfer_feed_per_min_mm = 71.12
# Tap reaches below the face each tap enters, read on the DRO: the foot
# hole's 4-40 plug tap .410 (short of the .43 drilled depth), its bottoming
# tap .370 (its full thread then ends .320-.345 down for a 2-1 thread
# chamfer, .333 for 1.5, inside .33-.35; the marked screw decides, and a
# short thread is tapped deeper); the pinch tap from E .450 (the full thread past the
# slit's E-side face, the point inside W's #30 and short of W); the 1/4-28
# plug tap .650 (the full thread through S).
foot_plug_reach_mm = 10.414
foot_bottoming_reach_mm = 9.398
pinch_tap_reach_mm = 11.43
adjuster_tap_reach_mm = 16.51
# The slit: the owned 2-3/4 in x .064 HSS slitting saw (shop
# slitting-saw-2-75-064; inventory tools.slitting-saw-2-75-064: dia_in 2.75,
# thickness_in .064, teeth 72, bore_in 1.0; test_dt_cone_tip_block_process.py
# holds the four numbers below to that record) at 100 rpm, the mill's
# slowest by the shop record (100-2800) and inside the L range on the
# mill's plate (50-1500): 72 ft/min at its rim. LittleMachineShop "Cutting
# Speeds", Milling, Plain carbon steels 1006-1026, HSS, gives 80-110 ft/min,
# which is 111-153 rpm for this saw. 100 is kept under that on purpose, as
# the CH-01 and CH-03 plans run this saw: slower is the safe side for an HSS
# saw deep in a slit, and at a fixed feed per tooth the pass's torque, which
# the friction drive is checked against, does not change with the speed.
# .001 in/tooth (the bottom of prechips' feed table) × 72 × 100 = 7.2 in/min
# (182.88 mm/min). Into the TOP end in four passes:
# the first slit_first_pass_mm (.085, half a step: the light cut that proves
# the arbor's friction drive), then three of slit_step_mm (.170), each no
# deeper than slit_step_max_mm (.200), to the slit's 15.128 mm REF depth
# (cam.py recomputes the two steps). The saw's lower face at saw_cut_z_mm
# above E: the slit's middle at the adjuster's .340 from E, for the
# catalogue .064.
saw_dia_mm = 69.85
saw_thickness_mm = 1.6256
saw_teeth = 72
saw_bore_mm = 25.4
saw_rpm = 100
saw_feed_per_min_mm = 182.88
slit_depth_mm = 15.128
slit_step_max_mm = 5.08
slit_first_pass_mm = 2.1611
slit_step_mm = 4.3223
saw_cut_z_mm = 7.8232
# The kerf, read at every mounting (the pilot is a sliding fit): the blade
# miked at least the slit's .050 (blade_min_mm); miked plus its side runout
# (the lever indicator on the saw's side face 1/8 in in from the teeth, one
# hand revolution) at most kerf_max_mm, the slit's .070 less .002: .004 of
# runout for a blade that mikes .064 (saw_side_tir_nominal_mm; cam.py checks
# all three).
blade_min_mm = 1.27
kerf_max_mm = 1.7272
saw_side_tir_nominal_mm = 0.1016
# The slit's depth is cut from X0 on TOP with the saw's centre its recorded
# radius less the depth past it, so the tips' radial runout deepens the
# floor, and a saw off its recorded diameter moves it by half the error.
# Both are read: the diameter over two opposite tips by calipers before the
# saw is clamped, within saw_dia_tol_mm (.050) of the record
# (saw_dia_min_mm to saw_dia_max_mm); the runout at every clamping (the dial
# indicator on the tips, the saw turned backward by hand), at most .020 in.
# At both limits together the floor stays inside the adjuster's tap drill at
# both ends of the height band and of H's band (cam.py: .016 in of room
# left), and no tooth takes more than twice its .001 feed (cam.py).
saw_tip_tir_max_mm = 0.508
saw_dia_tol_mm = 1.27
saw_dia_min_mm = 68.58
saw_dia_max_mm = 71.12
# The owned R8 stepped saw arbor, its sizes repeated from its record
# (cad/config/shop-equipment/ tools.saw-arbor-r8-stepped, measured by the
# owner 2026-11-24; test_dt_cone_tip_block_process.py holds these to the
# record): the body above the saw 1.25 in across (body_dia_above_saw_in);
# the cap below it 1.25 across and .50 thick (cap_dia_in, cap_thickness_in);
# its countersunk screw's head .623 across (screw_head_dia_in); the spindle
# nose to the cap's lower face 1.4 in with no saw fitted
# (below_spindle_nose_in).
saw_arbor_body_dia_mm = 31.75
saw_arbor_cap_dia_mm = 31.75
saw_arbor_cap_thickness_mm = 12.7
saw_arbor_screw_head_dia_mm = 15.8242
saw_arbor_nose_to_cap_mm = 35.56
# The drive (record keyed = false): the cap's screw at saw_clamp_torque_nm
# (the record's clamp_torque_nm) clamps the saw between the shoulder and the
# cap with about 11 kN (the record's cited table: 13.2 kN at 23 N·m,
# friction .14). One face's friction on the ring between the 1 in pilot and
# the 1.25 cap (mean radius 14.35 mm) carries .14 × 11 kN × 14.35 mm = 22.1
# N·m (saw_drive_torque_max_nm); the other face and the screw are the
# reserve. The heaviest pass here, .170 into TOP at the kerf's .068 ceiling,
# takes 8.1 N·m by the handbook's milling power, and the light first pass 4.1
# N·m (cam.py checks the heaviest against the drive). The thread carries that
# torque: the record's engagement with no saw fitted
# (saw_screw_engagement_no_saw_mm, 10 mm, the owner's 8 turns) less the
# thickest blade the plan accepts (kerf_max_mm) is 8.27 mm, over one
# saw_screw_dia_mm (cam.py); with the .064 saw, 8.4 mm, 1.05 D.
saw_clamp_torque_nm = 20.0
saw_screw_dia_mm = 8.0
saw_screw_engagement_no_saw_mm = 10.0
saw_clamp_preload_kn = 11.0
saw_drive_friction = 0.14
saw_drive_torque_max_nm = 22.1
# Two sizes that record does not carry (screw_head_past_cap_in is
# "to_measure"; the nose's height above the saw follows from the 1.4 only
# if the cap seats on the shoulder with no saw, unverified). Each is a
# bound of this plan, not a measurement: cam.py checks every clearance at
# the bound, and Setup 10 measures the real size before the spindle starts
# and stops outside it. The screw head stands at most .25 in past the cap's
# face (a countersunk head sits flush or under; no cut or move of this setup
# brings the cap over the block, the jaws or the stacks, so the bound only
# sets the clear height and the length below). The spindle nose, or anything
# wider than the body, stands at least .43 in above the saw's upper face:
# then it passes 1 mm or more over the spacer strip's top and over W at the
# cut. The record gives about .90 (1.4 less the .50 cap).
saw_screw_stand_max_mm = 6.35
saw_nose_above_min_mm = 10.922
# From those (cam.py recomputes all three): the reach past the arbor, (saw −
# body or cap)/2 − 1.0 mm clear of the TOP end, 18.05 mm on both sides of
# the saw (the slit is 15.128 deep: body and cap pass 3.92 mm right of TOP
# at full depth); the stack below the saw's lower face, the cap plus the
# screw head's bound. The arbor's lowest point from the spindle nose
# (saw_arbor_length_mm, with the machine-capacity inputs below): the
# record's 1.4 in plus the saw, rounded up to 1.5 in, plus the screw head's
# bound.
saw_reach_max_mm = 18.05
saw_below_max_mm = 19.05
# At the cut that stack hangs saw_below_stack_top_mm (.44) below the stacks'
# top (saw_below_max_mm less saw_cut_z_mm), right of TOP. cam.py's keep-outs
# end the stacks at the jaws' right side, so Setup 10 checks at every
# clamping that no parallel stands past it.
saw_below_stack_top_mm = 11.2268
# The saw moves between passes with the arbor's lowest point 5 mm over W's
# highest (cam.py checks it). It is touched off with its rim 3 mm in over
# the TOP end, over the block's middle; the cap then hangs past the end.
# Its air proof raises Z0 1.000 in, as every other file's.
saw_clear_z_mm = 41.322
saw_touch_x_mm = 31.925
saw_touch_y_mm = -5.588
saw_proof_raise_mm = 25.4
# The TOP end stands .75 in past the right jaw side in Setup 10, past the
# slit's depth: the saw never reaches the jaws (cam.py checks it).
slit_overhang_mm = 19.05
# The Setup 10 vise spacer (the second strip) against the block, N to S:
# never thicker (the jaws would close on it and leave the block loose under
# the saw); at most spacer_under_max_mm (.002) thinner: the moving jaw then
# tilts .002 over the 5 in between the two, a quarter of it, .0005, across
# the block's 1.3 in grip. Setup 2 takes the thicker strip as the block; a
# larger difference is made up in Setup 10 with feeler leaves (cam.py: the
# allowance is no finer than the set's thinnest leaf, shop
# gauges.feeler-gauges, so leaves can always land inside it).
spacer_under_max_mm = 0.0508
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick, 4 in long, 1/2-1 in by 1/16): lying, the set's 1 in and 1/2 in
# parallels stacked against each jaw (1.5 in); the strip on edge for E's skim
# on the 5/8 in and 1/2 in stacked (1-1/8 in: about four fifths of the
# strip's width in the jaws, E 3-5 mm above them); upright, the 1/2 in pair.
riser_height_mm = 38.1
east_riser_height_mm = 28.575
parallel_height_mm = 12.7
parallel_thickness_mm = 3.175
# The least gap between a through hole's edge (its tap's basic major) and a
# stack's inner face, the hole anywhere in its drawing band and the block at
# its least size across the jaws: the pinch hole in Setup 6 (.019), the
# adjuster in Setup 8 (.060). cam.py recomputes both; the two Holding texts
# print them.
pinch_stack_clear_min_mm = 0.4826
adjuster_stack_clear_min_mm = 1.524
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
lying_grip_mm = 6.8453
east_grip_mm = 16.3703
upright_grip_mm = 32.2453
# Every face's last level clears its jaw tops by at least this (cam.py).
jaw_clear_min_mm = 0.5
# The part centred on the jaws: its left end (jaw width − its length along
# the jaws)/2 in from the left jaw side: the strip (Setup 2), the bar's
# width (Setup 3), the raw width (Setups 4-5), the height (Setups 6-9). In
# Setup 10 the TOP end stands slit_overhang_mm past the right jaw side.
vise_strip_inset_mm = -68.7959
vise_bar_inset_mm = -50.6984
vise_upright_inset_mm = -69.1769
vise_length_inset_mm = -53.0479
vise_slit_inset_mm = -125.1458
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# the spindle nose to the tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out its
# measured setting allows (cad/config/shop-equipment/measured-cuts.toml:
# 27.94 to 28.45 mm).
half_mill_projection_mm = 28.45
chamfer_projection_min_mm = 12.7
# Overall lengths: the #2 combined drill and countersink 1-7/8 in; the #30
# jobber drill 2-3/4 in (ASME B94.11M), the longest drill under the chuck.
centre_drill_oal_mm = 47.625
drill_30_oal_mm = 69.85
# The saw arbor's lowest point from the spindle nose, 1.75 in: the record's
# 1.4 in to the cap's face plus the saw, taken as 1.5 in, plus the screw
# head's .25 bound (the slit's parameters above; cam.py recomputes it).
saw_arbor_length_mm = 44.45
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench, the vise bed, the 1/2 in
# parallels, the tallest tapping setup (Setup 5, the block upright before
# SEAT is faced, 2.165) and the collet gauge, rounded down to .01 in (cam.py
# recomputes it). The guide is 3-1/8 in overall; the traveler stops before
# the first tap file unless the tap, point to the wrench's centre hole, is
# at most tap_wrench_reach_max_mm.
tap_stack_max_mm = 259.334
tap_wrench_reach_max_mm = 179.832
# DT09's 1/4-28 tap, the block lying on the 1.5 in stacks: the same sum with
# the deepest block, .45, in place of the upright one (cam.py recomputes it).
adjuster_wrench_reach_max_mm = 198.12

