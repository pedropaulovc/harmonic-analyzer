inspection = "Highest to lowest at most {{process.saw_tip_tir_max_mm:in.3dot}}. Over: at the bench, loosen the screw, wipe, turn the saw a quarter turn round on the pilot and tighten to {{process.saw_clamp_torque_nm:g}} N·m; then both runouts again. Over after two such tries: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Both runouts accepted: wipe off any old marker lines, then with a marker draw one line down the cap's rim and out across the saw's lower face; a second, in line with it, down the arbor's body and out across the saw's upper face. The cap's friction alone drives the saw: the lines show if it slips."
feed = "hand"

[[setups.operations]]
instruction = "Confirm Z is at the machine top (no move since the G53 G0 Z0), then MDI G0 X{{process.saw_touch_x_mm:.3f}} Y{{process.saw_touch_y_mm:.3f}} (X and Y only): the saw's rim 3 mm in over TOP, the arbor's cap past the end."
