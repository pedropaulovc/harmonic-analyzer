diagram = { file = "diagrams/foot-tap.svg", alt = "The block upright, SEAT up; the 4-40 tap in the T-handle wrench in the foot hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the plug tap's point to stop {{process.foot_plug_reach_mm:in.3dot}} below SEAT, the bottoming tap's {{process.foot_bottoming_reach_mm:in.3dot}}." }

[[setups.operations]]
instruction = "Plug tap's depth reference: the DRO's work Z, in inches, with the plug tap's point standing on SEAT beside the hole and the guide's point pushed fully home in the wrench."
instruction_detailed = "Plug tap's depth reference: MDI G91 G0 X5.080, G90 (beside the hole, on SEAT), then G20. Stand the plug tap, in its wrench, on its point on SEAT; jog Z down until the guide's point is in the centre hole and pushed fully home. Note the DRO Z. Jog Z up clear; G21, MDI G91 G0 X-5.080, G90 (back over the hole), G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Plug tap: tap by hand under the tap guide, spindle off, cutting oil, a half turn back each turn: the spring keeps the point in the wrench. Read with the point pushed fully home: stop when the DRO Z reads the noted Z − {{process.foot_plug_reach_mm:in.3dot}}. Jog Z up clear, send G21; back the tap out; blow the hole out."
feed = "hand"

[[setups.operations]]
instruction = "Bottoming tap's depth reference (when in hand), as the plug tap's: its own DRO Z, in inches, with its point standing on SEAT beside the hole and the guide's point pushed fully home."
instruction_detailed = "Bottoming tap's depth reference: MDI G91 G0 X5.080, G90 (beside the hole, on SEAT), then G20. Stand the bottoming tap, in its wrench, on its point on SEAT; jog Z down until the guide's point is pushed fully home. Note its DRO Z. Jog Z up clear; G21, MDI G91 G0 X-5.080, G90 (back over the hole), G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40-bottoming"
drilling = "none"
sizing = "other"
instruction = "Bottoming tap: start it by hand in the plug tap's thread, push the guide's point home, tap to its noted Z − {{process.foot_bottoming_reach_mm:in.3dot}}, read with the point pushed home; never past it except as the thread-depth check directs. Jog Z up clear, send G21, back the tap out, blow the hole out."
feed = "hand"

[[setups.operations]]
instruction = "Thread depth: a 4-40 screw at least 1/2 under the head run in by hand to its stop; mark it at SEAT; out, the calipers from the mark to its end."
inspection = "{{cad.foot_tap_thread_depth_min_in:.3dot}}–{{cad.foot_tap_thread_depth_max_in:.3dot}} (it sets MHA-DT-39's reach). Under: blow the hole out; send G20, run the bottoming tap .005 deeper, never past its noted Z − .375 (a 1-thread chamfer's thread then ends at .350), then send G21. Over: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.foot_tap_thread_depth_band_mm}}" }]
feed = "hand"

