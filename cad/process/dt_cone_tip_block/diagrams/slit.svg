<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- From the front (+X right, +Z up, +Y into the page), 2.6 px/mm. X0 TOP (right, the block to -X), Z0 the stacks' top (E). The jaws (the moving jaw in front, outline) 158.67 wide, their right side slit_overhang_mm 19.05 left of TOP; the 1 in + 1/2 in stacks (38.1) ending at the jaws' right side; the block on edge, E down, W up (17.018). The spacer strip on end on the bed at the jaws' left end (57.15 tall, .80 along the jaws). The 2-3/4 x .064 saw (Ø69.85 x 1.6256, saw_dia_mm, saw_thickness_mm) on the stepped arbor, its lower face at Z7.823 (saw_cut_z_mm), centre X32.764 on DT11's first pass (L19-L20: rim 2.161 into TOP), fed +Y (into the page) across the block's depth; the arbor's body Ø31.75 above the saw (to a break at the spindle), its cap Ø31.75 x 12.7 and the screw below it, all past TOP. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 10 (DT11): the slitting saw's first pass, {{process.slit_first_pass_mm:in.3dot}} into TOP, from the front (2.6 px/mm)</text>
