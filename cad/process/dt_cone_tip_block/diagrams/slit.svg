  <text class="label" x="20" y="60">slitting saw 2-3/4 × {{process.saw_thickness_mm:in.3dot}}, horizontal on the stepped arbor, its lower face at Z{{process.saw_cut_z_mm:.3f}} mm;</text>
  <text class="label" x="20" y="76">first pass {{process.slit_first_pass_mm:in.3dot}} into TOP, fed +Y (into the page) across the block's depth; then</text>
  <text class="label" x="20" y="92">three passes {{process.slit_step_mm:in.3dot}} deeper each, to {{process.slit_depth_mm:in.3dot}} REF, into the adjuster</text>
  <line class="leader" x1="300" y1="108" x2="557.4" y2="227.64"/>
  <circle class="leader-dot" cx="557.4" cy="227.64" r="2"/>
  <text class="label" x="560" y="126">arbor body Ø{{process.saw_arbor_body_dia_mm:in.2f}}</text>
  <line class="leader" x1="640" y1="132" x2="646" y2="165"/>
  <circle class="leader-dot" cx="646" cy="165" r="2"/>
  <text class="label" x="620" y="320">cap Ø{{process.saw_arbor_cap_dia_mm:in.2f}} × .50</text>
