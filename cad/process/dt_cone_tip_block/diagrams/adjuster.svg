<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="sans-serif" font-size="13">
  <!-- Across the jaws from the right end (+X toward you): +Y (toward the fixed jaw) right, +Z up (the right end is TOP), 5 px/mm. The block lying N up, S down on the 1 in + 1/2 in stacks, E on the fixed jaw (E-W 17.018 across); Z0 .4400 below N (the stacks' top for a .4400 block). The centre drill spots first (not drawn). The #3 (5.4102 = 27 px) at Y-8.636 (X38.100 = H from SEAT), at its last peck (L56): its point at Z-2.625 (adjuster_tip_height_mm), full diameter 1.0 past S, in the gap between the stacks (2.75 and 2.50 mm clear of each). -->
  <rect class="paper" x="0" y="0" width="760" height="440"/>
  <text class="title" x="20" y="22">Setup 8 (DT08, T5): the #3 drills the adjuster through, N up (5 px/mm)</text>
  <rect class="fixture-vise" x="284.91" y="406" width="225.09" height="14"/>
  <rect class="clamp" x="304.91" y="181.27" width="50" height="224.73"/>
  <rect class="clamp" x="440" y="181.27" width="50" height="224.73"/>
  <rect class="fixture-support" x="354.91" y="279" width="15.88" height="127"/>
  <rect class="fixture-support" x="424.12" y="279" width="15.88" height="127"/>
  <rect class="fixture-support" x="354.91" y="215.5" width="15.88" height="63.5"/>
  <rect class="fixture-support" x="424.12" y="215.5" width="15.88" height="63.5"/>
  <text class="label-on-clamp" x="329.91" y="396" text-anchor="middle">moving</text>
  <text class="label-on-clamp" x="465" y="396" text-anchor="middle">fixed</text>
  <rect class="part-kept" x="354.91" y="159.62" width="85.09" height="55.88"/>
  <rect class="holes" x="383.29" y="159.62" width="27.05" height="60.88"/>
  <path class="cutter" d="M410.35 60L410.35 220.5L396.82 228.63L383.29 220.5L383.29 60L392.31 57L401.33 60Z"/>
  <line class="datum" x1="492" y1="215.5" x2="512" y2="215.5"/>
  <text class="datum-label" x="516" y="219.5">Z0 {{process.depth_target_mm:in.4dot}} below N</text>
  <text class="label" x="470" y="60">#3 through, pecks of {{process.peck_mm:in.3dot}}: full diameter</text>
  <text class="label" x="470" y="76">{{process.drill_past_mm:in.3dot}} past S, between the stacks</text>
  <line class="leader" x1="466" y1="76" x2="412.82" y2="90.5"/>
  <circle class="leader-dot" cx="412.82" cy="90.5" r="2"/>
  <text class="label" x="560" y="250">E (fixed jaw)</text>
  <line class="leader" x1="556" y1="246" x2="438" y2="185.5"/>
  <circle class="leader-dot" cx="438" cy="185.5" r="2"/>
  <text class="label" x="20" y="250">W (moving jaw)</text>
  <line class="leader" x1="126" y1="246" x2="356.91" y2="185.5"/>
  <circle class="leader-dot" cx="356.91" cy="185.5" r="2"/>
  <text class="label" x="20" y="140">N up</text>
  <line class="leader" x1="56" y1="144" x2="365" y2="159.62"/>
  <circle class="leader-dot" cx="365" cy="159.62" r="2"/>
</svg>
