[[setups]]
machine_kind = "other"
title = "Side B: slant, pocket, outline, chamfers; the cavity through"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Nuts off; lift the part off the studs, blow the chips off, take the end blocks away; unscrew both studs from their T-nuts and lift them out (the T-nuts stay under the holes). Turn the part end over end (FOOT edge still toward you) and set it on the two middle blocks, the stud holes over the T-nuts. Four jack screws (jack screw set, 2-1/4 to 3-3/8 in) under the end posts' slant faces, two per post at Y ±2.5 in, run up to touch, then a quarter turn. Indicate the FOOT bar edge along X to .001 over 6 in. The studs go back after the zero op. Before FR08: two step clamps (1268 kit) along X from studs in the middle T-slot beyond the ends, each toe on its post at Y 0, midway between the post's two jacks (paper under each toe), heels on step blocks level with the toe."
datum = "Programs FR05_b_mill, FR06_b_walls, FR07_b_outline and FR08_cavity: X0 midway between the stud holes, Y0 midway between the bar edges, +Y away from the FOOT edge; Z0 the mid-plane, half T below side B. X here runs opposite to Setup 2's (the part is symmetric in X). Tool lengths from the tool setter at every M6."
diagram = { file = "diagrams/side_b.svg", alt = "Section of the part turned over: the boss on the two middle blocks, the studs through it, screw jacks under the end posts; side B milled like side A; FR08's straps on the posts and the cavity cut through the web round the boss." }
