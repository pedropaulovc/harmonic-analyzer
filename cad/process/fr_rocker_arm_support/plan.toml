instruction = "+X hole's centre off: G10 L20 P1 X0 midway between the two holes' centres instead."
feed = "hand"

[[setups.operations]]
instruction = "X0 and Y0 final: touch the −X sawn end and the FOOT bar edge, note both. Drop each stud through its hole into its T-nut, a flange nut on each on side B's boss face, tight; each stud's end at most {{process.stud_above_seat_mm:in.2f}} above side B, the nut on full thread (the kit's stud length that does both). Touch the −X sawn end and the FOOT bar edge again."
feed = "hand"
inspection = "Each reads within 0.03 mm of its noted value."
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = [0.0, 0.03] },
  { gauge = "mill-y-dro", band_mm = [0.0, 0.03] },
]

[[setups.operations]]
