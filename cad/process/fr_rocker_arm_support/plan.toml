instruction = "Home ($H). Edge finder (900 rpm) in each empty stud hole: touch its −X and +X walls, the hole's centre the mean. At the −X hole's centre: G10 L20 P1 X-31.750; read the +X hole's centre. Finder on the FOOT and far bar edges: G10 L20 P1 Y0 at the mean."
