  <rect class="hidden" x="68.57" y="68.57" width="247.65" height="247.65" rx="9.53"/>
  <rect class="hidden" x="97.15" y="97.15" width="190.5" height="190.5" rx="19.05"/>
  <circle class="hidden" cx="144.77" cy="192.4" r="7.74"/>
  <circle class="hidden" cx="240.02" cy="192.4" r="7.74"/>
  <line class="datum" x1="192.4" y1="182" x2="192.4" y2="202"/>
