<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="640" height="400"/>
  <text class="title" x="20" y="18">Bench: the 3 x 8 x 8 slab, side A up (1 px = 1/1.5 mm)</text>
