<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="18">Finished support: front (left) and end (right) views, 1 px = 1/1.4 mm</text>
  <!-- Front view, foot at the bottom: outline, pocket, cavity, foot holes. -->
  <rect class="part-kept" x="40" y="60" width="268.8" height="248.9"/>
  <rect class="part-kept" x="58.8" y="68.9" width="231.2" height="231.1" rx="8.9"/>
  <rect class="holes" x="85.5" y="95.6" width="177.8" height="177.8" rx="17.8"/>
  <line class="hidden" x1="90" y1="308.9" x2="90" y2="300"/>
  <line class="hidden" x1="258.8" y1="308.9" x2="258.8" y2="300"/>
  <line class="arrow" x1="40" y1="48" x2="308.8" y2="48"/>
  <text class="label" x="110" y="42">length 7.56 (end to end)</text>
  <line class="arrow" x1="325" y1="308.9" x2="325" y2="60"/>
  <text class="label" x="330" y="190">7.00</text>
  <text class="label-halo" x="110" y="190">cavity 5.00 SQ thru</text>
  <text class="label-halo" x="70" y="88">pocket 6.50 SQ both sides</text>
  <text class="label" x="60" y="380">foot holes A1-A4, Ø5/16, up through the foot</text>
  <line class="leader" x1="90" y1="368" x2="90" y2="310"/>
  <circle class="leader-dot" cx="90" cy="310" r="2"/>
  <line class="leader" x1="258.8" y1="368" x2="258.8" y2="310"/>
  <circle class="leader-dot" cx="258.8" cy="310" r="2"/>
  <!-- End view: the trapezoid, 2.50 at the foot, .66 at the top, web .50. -->
  <polygon class="part-kept" points="520,308.9 609,308.9 576.2,60 552.8,60"/>
  <!-- The pockets, behind the slant faces: hidden edges, the web between. -->
  <line class="hidden" x1="558.55" y1="68.9" x2="558.55" y2="300"/>
  <line class="hidden" x1="573.2" y1="68.9" x2="573.2" y2="300"/>
  <line class="hidden" x1="548" y1="300" x2="582" y2="300"/>
  <line class="hidden" x1="553" y1="68.9" x2="577" y2="68.9"/>
  <line class="arrow" x1="520" y1="330" x2="609" y2="330"/>
  <text class="label" x="530" y="348">2.50 at the foot</text>
  <line class="leader" x1="620" y1="66" x2="574" y2="61"/>
  <circle class="leader-dot" cx="574" cy="61" r="2"/>
  <text class="label" x="624" y="70">.66 at the top face</text>
  <line class="leader" x1="620" y1="186" x2="566" y2="190"/>
  <circle class="leader-dot" cx="566" cy="190" r="2"/>
  <text class="label" x="624" y="190">web .50 between</text>
  <text class="label" x="624" y="208">the two pockets</text>
  <line class="leader" x1="620" y1="296" x2="590" y2="305"/>
  <circle class="leader-dot" cx="590" cy="305" r="2"/>
  <text class="label" x="624" y="300">foot .25 thick</text>
</svg>
