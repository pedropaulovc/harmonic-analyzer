<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif" font-size="13">
  <!-- Hand picture, plan, to scale at 40 px/in (1.575 px/mm) from the bar's 18 x 6 in (bar_length_mm, bar_width_mm). 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), seen from above. Drawn on PL01_bar_skim's pass Y-64.395 (+X), a middle pass, at X136; hatched: the swept patch, the pass centres X-15.938 to 288.226 and Y8.997 to -137.787 plus the cutter's radius. The four relief pockets (PL02_bar_relief, the same end mill, next) drawn white, Ø.500 at X4.318 and 265.322, Y-58.442 and -127.632. The edge finder (a touch-off tool) is not drawn: the edges it touches are marked. The screw jacks' and the step clamps' sizes are not on record: schematic. The 1-2-3 blocks are 1 x 2 x 3 in, lying flat (block_height_mm 25.4), 2 in along X. -->
  <rect class="paper" x="0" y="0" width="900" height="480"/>
  <text class="title" x="20" y="24">PL01: the fixture bar on the table, its top skimmed where the blank goes (to scale, 1 in = 40 px)</text>
  <rect class="fixture-plate" x="50" y="80" width="720" height="240"/>
  <rect class="part-removed" x="162.5" y="80" width="499" height="240"/>
  <rect class="fixture-support" x="70" y="140" width="80" height="120"/>
  <rect class="fixture-support" x="670" y="140" width="80" height="120"/>
  <circle class="fixture-support" cx="410" cy="280" r="12"/>
  <circle class="fixture-support" cx="410" cy="120" r="12"/>
  <rect class="clamp" x="20" y="150.63" width="110" height="20"/>
  <rect class="clamp" x="690" y="150.63" width="110" height="20"/>
  <rect class="clamp" x="20" y="229.37" width="110" height="20"/>
  <rect class="clamp" x="690" y="229.37" width="110" height="20"/>
  <circle class="holes" cx="204.4" cy="185.83" r="10"/>
  <circle class="holes" cx="204.4" cy="294.8" r="10"/>
  <circle class="holes" cx="615.43" cy="185.83" r="10"/>
  <circle class="holes" cx="615.43" cy="294.8" r="10"/>
  <line class="datum" x1="190" y1="72" x2="190" y2="328"/>
  <line class="datum" x1="197.6" y1="66" x2="197.6" y2="324"/>
  <text class="datum-label" x="202.6" y="76">X0</text>
  <line class="datum" x1="40.55" y1="93.8" x2="776" y2="93.8"/>
  <text class="datum-label" x="780" y="97.8">Y0</text>
  <circle class="cutter" cx="411.77" cy="195.21" r="10"/>
  <line class="arrow" x1="425.77" y1="195.21" x2="471.77" y2="195.21"/>
  <text class="label-halo" x="371.77" y="221.21">1/2 in end mill, PL01's pass Y-64.395, +X</text>
  <text class="label-halo" x="411.77" y="267.03" text-anchor="middle">skimmed {{process.bar_skim_mm:in.3dot}} here (hatched)</text>
  <line class="dims" x1="50" y1="342" x2="197.6" y2="342"/>
  <line class="dims" x1="50" y1="320" x2="50" y2="348"/>
  <line class="dims" x1="197.6" y1="320" x2="197.6" y2="348"/>
  <text class="label" x="123.8" y="360" text-anchor="middle">X0 {{process.x0_from_bar_left_mm:in.3f}}</text>
  <line class="leader" x1="220" y1="368" x2="190" y2="316"/>
  <circle class="leader-dot" cx="190" cy="316" r="2"/>
  <text class="label" x="224" y="376">scribed line {{process.blank_left_mm:in.2f}} from the left end</text>
  <line class="dims" x1="814" y1="93.8" x2="814" y2="320"/>
  <line class="dims" x1="806" y1="320" x2="822" y2="320"/>
  <line class="dims" x1="806" y1="93.8" x2="822" y2="93.8"/>
  <text class="label" x="826" y="206.9">Y0 {{process.y0_from_bar_front_mm:in.3f}}</text>
  <text class="label" x="826" y="222.9">behind the</text>
  <text class="label" x="826" y="238.9">front edge</text>
  <text class="label" x="10" y="40">1-2-3 block under each end, lying flat</text>
  <line class="leader" x1="60" y1="44" x2="109.84" y2="146"/>
  <circle class="leader-dot" cx="109.84" cy="146" r="2"/>
  <text class="label" x="380" y="40">screw jacks under the middle (schematic)</text>
  <line class="leader" x1="400" y1="44" x2="410" y2="108"/>
  <circle class="leader-dot" cx="410" cy="108" r="2"/>
  <text class="label" x="700" y="40">step clamps on studs (schematic)</text>
  <line class="leader" x1="740" y1="44" x2="740" y2="160.63"/>
  <circle class="leader-dot" cx="740" cy="160.63" r="2"/>
  <text class="label" x="890" y="404" text-anchor="end">4 relief pockets, Ø.500 × {{process.relief_depth_mm:in.3dot}} deep (PL02, next)</text>
  <line class="leader" x1="800" y1="392" x2="619.43" y2="300.8"/>
  <circle class="leader-dot" cx="619.43" cy="300.8" r="2"/>
  <text class="label" x="50" y="432">fixture bar 1/2 × 6 × 18 6061 on the table, vise off; X0 and Y0 with the edge finder on its</text>
  <text class="label" x="50" y="448">left end (between the clamps) and its front edge. Front of the table (operator) here.</text>
</svg>
