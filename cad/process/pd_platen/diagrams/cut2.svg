<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332.4" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="900" height="332.4"/>
  <text class="title" x="20" y="20">Section through the blank as it lies, face P up (thickness drawn 40 times larger than the width)</text>
  <rect class="part-removed" x="150" y="62" width="420" height="19.6"/>
  <line class="leader" x1="570" y1="71.8" x2="600" y2="71.8"/>
  <text class="label" x="604" y="75.8">2  this setup: {{process.face_cut_mm:in.4dot}} off P</text>
  <rect class="part-kept" x="150" y="81.6" width="420" height="19.6"/>
  <line class="leader" x1="570" y1="91.4" x2="600" y2="91.4"/>
  <text class="label" x="604" y="95.4">4  Setup 6: the rest off P, to thickness</text>
  <line class="dims" x1="150" y1="101.2" x2="570" y2="101.2"/>
  <rect class="part-kept" x="150" y="101.2" width="420" height="121.6"/>
  <line class="leader" x1="570" y1="162" x2="600" y2="162"/>
  <text class="label" x="604" y="166">the platen, {{cad.back_face_thickness_min_in:.3dot}}–{{cad.back_face_thickness_max_in:.3dot}} thick</text>
  <line class="dims" x1="150" y1="222.8" x2="570" y2="222.8"/>
  <rect class="part-kept" x="150" y="222.8" width="420" height="19.6"/>
  <line class="leader" x1="570" y1="232.6" x2="600" y2="232.6"/>
  <text class="label" x="604" y="236.6">3  Setup 5: {{process.face_cut_mm:in.4dot}} off B</text>
  <rect class="bond" x="150" y="242.4" width="420" height="4"/>
  <rect class="fixture-plate" x="120" y="246.4" width="480" height="26"/>
  <line class="leader" x1="570" y1="244.4" x2="600" y2="252.4"/>
  <text class="label" x="604" y="256.4">fresh blue tape, CA glue, blue tape</text>
  <line class="leader" x1="600" y1="264.4" x2="620" y2="272.4"/>
  <text class="label" x="624" y="276.4">fixture bar</text>
  <text class="label" x="140" y="76" text-anchor="end">face P</text>
  <text class="label" x="140" y="238.4" text-anchor="end">face B</text>
  <text class="label" x="120" y="296.4">Face B, cut in Setup 3, lies down on the tape; the blank was turned over end for end, FRONT still at the front.</text>
  <text class="label" x="120" y="314.4">Thin lines: the levels of the cuts still to come.</text>
</svg>
