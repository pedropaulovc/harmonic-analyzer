<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="440"/>
  <text class="title" x="20" y="20">The blank as bought, face B up (1 in = 50 px)</text>
  <rect class="part-kept" x="60" y="70" width="550" height="300"/>
  <rect class="dims" x="69.5" y="87.3" width="531" height="265.5" fill="none"/>
  <line class="dims" x1="60" y1="400" x2="610" y2="400"/>
  <line class="dims" x1="60" y1="370" x2="60" y2="405"/>
  <line class="dims" x1="610" y1="370" x2="610" y2="405"/>
  <text class="label" x="335" y="418" text-anchor="middle">blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} long</text>
  <line class="dims" x1="640" y1="70" x2="640" y2="370"/>
  <line class="dims" x1="610" y1="70" x2="645" y2="70"/>
  <line class="dims" x1="610" y1="370" x2="645" y2="370"/>
  <text class="label" x="646" y="224" text-anchor="start">{{process.blank_width_min_mm:in.2f}}–{{process.blank_width_max_mm:in.2f}} wide</text>
  <text class="label-halo" x="335" y="200" text-anchor="middle">B on this face, P on the other</text>
  <text class="label-halo" x="335" y="222" text-anchor="middle">{{process.blank_thickness_min_mm:in.3dot}}–{{process.blank_thickness_max_mm:in.3dot}} thick</text>
  <line class="leader" x1="200" y1="370" x2="200" y2="326"/>
  <text class="label-halo" x="206" y="322">this long edge marked FRONT, its arrow pointing to face B</text>
  <line class="leader" x1="129.5" y1="87.3" x2="170" y2="52"/>
  <text class="label" x="174" y="56">thin line: the platen's outline, {{cad.right_edge_width_in:.2f}} × {{cad.top_edge_height_in:.2f}}, centred in the blank; cut in Setup 6</text>
</svg>
