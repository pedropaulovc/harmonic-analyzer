<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale: the plan at 34 px/in (1.339 px/mm), the section at 44 px/in (1.732 px/mm), from the bar's 18 x 6 x 1/2 in and the blank's 11 x 6 x 1/4 in; the tape stack drawn thicker. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 1 in out (half_mill_projection_min_mm 25.4, a least stick-out) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on PL03_face's pass Y-63.849 (+X), a middle pass, at X136, the same place in both views; the cut face_cut_mm .0245 deep. The tape: five 1.41 in strips each on the bar and the blank (tape_strip_width_mm), the blank's seams half a strip off the bar's. The step clamps are not in the section (see the plan). The screw jacks' and the step clamps' sizes are not on record: schematic. The 1-2-3 blocks are 1 x 2 x 3 in, lying flat (block_height_mm 25.4), 2 in along X. -->
