[[setups]]
machine_kind = "other"
title = "Check the blank"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "The 1/4 × 6 × 11 in brass blank, {{process.blank_length_in:g}} by {{process.blank_width_in:g}} in: one long edge marked FRONT with an arrow to face B; the platen's outline, cut in Setup 6, as a thin line centred in it." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the blank's thickness at the middle of each long edge and of each end."
inspection = "Every reading {{process.blank_thickness_min_mm:in.3dot}}–{{process.blank_thickness_max_mm:in.3dot}}. Outside: stop and tell the owner; the programs are posted for this plate."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Measure the blank's length and width with the combination square's 12 in blade."
inspection = "Length {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}}, width {{process.blank_width_min_mm:in.2f}}–{{process.blank_width_max_mm:in.2f}}. Outside: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the burr off all eight edges so the blank lies flat. With marking fluid mark one long edge FRONT, on the edge itself, with an arrow pointing to the face called B (the back face); the other face is P (the paper face). No cut takes that mark off before Setup 6."
feed = "hand"
inspection = "The blank lies on the surface plate, each face down in turn, without rocking on a burr. Rocks on a bow, not a burr: go on; the finished plate's form is checked at the final inspection."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Fixture bar on the table"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off the table. The 1/2 × 6 × 18 in 6061 bar on the two 1-2-3 blocks lying flat (1 in up), one crosswise under each end, 1/2 in in from the end; the two screw jacks under its middle, one near each long edge, run up finger-tight. Two step clamps (LMS 1268 kit) on each end from studs beyond the ends, bearing over the block; no clamp, stud or nut more than 2 in in from an end. Long edges along X by eye, within 1/16 in over the bar. The bar stays clamped until Setup 6 is done."
datum = "Programs PL01_bar_skim and PL02_bar_relief. G54 X and Y, set here once for every program of this traveler: X0 {{process.x0_from_bar_left_mm:in.3f}} right of the bar's left end, Y0 {{process.y0_from_bar_front_mm:in.3f}} behind its front edge (where the platen's left and bottom edges will be); +Y toward the back of the table. Z0 here: the skimmed bar top, its high point less {{process.bar_skim_mm:in.3dot}}. After a controller reset, a stall or an E-stop: home ($H) and repeat this setup's first two operations."
diagram = { file = "diagrams/bar.svg", alt = "Plan of the fixture bar on the table: a 1-2-3 block and two step clamps at each end, two screw jacks under the middle; the skimmed patch where the blank goes, the four relief pockets, X0 and Y0 from the bar's left end and front edge." }
envelope = { x_span_mm = ["{{process.x0_from_bar_left_mm}}", "{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.bar_skim_margin_mm}}", 5.08], y_span_mm = ["{{process.blank_width_max_mm}}", "{{process.face_cutter_dia_mm}}", 7.62], work_top_mm = ["{{process.block_height_mm}}", "{{process.bar_top_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.bar_top_min_mm}}", -3.81], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
# The bar between its two blocks: under a push between them it bears on
# their inner edges (each block 2 in along X, 1/2 in in from a bar end). The
# jacks under the middle are given no credit.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{process.bar_length_mm}}"], supports_mm = [63.5, 393.7], section_mm = { y = "{{process.bar_width_mm}}", z = "{{process.bar_top_min_mm}}" } }

[[setups.operations]]
instruction = "Home the mill ($H). G54 X0 and Y0 from the bar's left end and front edge with the edge finder (900 rpm)."
instruction_detailed = "Home the mill ($H). Edge finder (900 rpm): on the bar's left end, between the two clamps, G10 L20 P1 X{{process.x_set_mm:.3f}}; on its front edge at mid-length, G10 L20 P1 Y{{process.y_set_mm:.3f}} (each entry allows for the finder's .100 radius)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the bar top's high point less the {{process.bar_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the bar top at mid-length and 5 in either side of it; at the highest of the three: G10 L20 P1 Z{{process.bar_z_set_mm:.3f}} (the skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL01_bar_skim and PL02_bar_relief in air: Z0 raised 1.000 in; every move stays 1/2 in or more clear of the step clamps. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PL01_bar_skim, then PL02_bar_relief, watching each move clear the clamps. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
