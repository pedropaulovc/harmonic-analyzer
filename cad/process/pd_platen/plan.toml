drilling = "none"
sizing = "other"
instruction = "Same file, M6 T5 (1/4 in end mill, 7/8 to 1 in out of the collet; set 2800): counterbore the ten guide holes from P. First the plunge down each drilled hole to the floor, {{cad.guide_b1_cbore_depth_in:.3dot}} below P."
rpm = 2800
feed = "{{process.plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "counterbore plunge", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.cbore_cutter_dia_mm}}", flutes = 3, rpm = 2800, feed_mm_min = "{{process.plunge_feed_per_min_mm}}", stations_mm = ["{{cad.guide_b1_station_mm}}", "{{cad.guide_b3_station_mm}}", "{{cad.guide_b5_station_mm}}", "{{cad.guide_b7_station_mm}}", "{{cad.guide_b9_station_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-quarter"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop, at each floor: one circle {{process.cbore_orbit_mm:in.3dot}} off centre, clockwise (conventional), opens the counterbore to Ø{{cad.guide_b1_cbore_dia_in:.3dot}}."
settings = "platen-em-quarter-c360"
inspection = "Still bonded, holes B1 and B10: counterbore depth {{cad.guide_b1_cbore_depth_min_in:.3dot}}–{{cad.guide_b1_cbore_depth_max_in:.3dot}} from P, the calipers' depth rod on the floor. Outside: stop and tell the owner; the taps wait."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.guide_b1_cbore_depth_band_mm}}" }]
milling_cuts = [
  { name = "counterbore wall", kind = "side", phase = "finish", cutter_dia_mm = "{{process.cbore_cutter_dia_mm}}", axial_doc_mm = "{{cad.guide_b1_cbore_depth_mm}}", radial_woc_mm = "{{process.cbore_orbit_mm}}", stations_mm = ["{{cad.guide_b1_station_mm}}", "{{cad.guide_b3_station_mm}}", "{{cad.guide_b5_station_mm}}", "{{cad.guide_b7_station_mm}}", "{{cad.guide_b9_station_mm}}"] },
]

[[setups.operations]]
instruction = "File done, still bonded: the length and the height on the DRO, before tapping."
instruction_detailed = "Send G20 (the DRO reads inches). Edge finder (900 rpm, console), its tip beside the plate's edge and clear of the bar: note the work X DRO on the left edge and on the right edge, then the work Y DRO on the back edge and on the front edge. Send G21."
inspection = "Right X − left X − .200 is the length: {{cad.right_edge_width_min_in:.3dot}}–{{cad.right_edge_width_max_in:.3dot}}. Back Y − front Y − .200 is the height: {{cad.top_edge_height_min_in:.3dot}}–{{cad.top_edge_height_max_in:.3dot}}. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.right_edge_width_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.top_edge_height_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "The #2-56 plug tap goes in the T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole. Measure it, the tap's point to the wrench's centre hole: at most {{process.tap_wrench_reach_max_mm:in.1f}} in. Longer: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PL05_tap_1: M6 T6, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over socket A1."
diagram = { file = "diagrams/tap.svg", alt = "Section through a socket: the plate on its tape over a relief pocket in the bar, the #2-56 tap in the T-handle wrench in the hole, the tap guide in the spindle with its spring point in the wrench's centre hole; the tap's point to go {{process.tap_point_depth_mm:in.3dot}} below P, into the pocket." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on P beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 Y-3.810 (beside the hole, on P), G90, then send G20: the DRO reads inches. Stand the tap, in its wrench, on its point on P; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21 and MDI G91 G0 Y3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-2-56"
drilling = "none"
sizing = "other"
instruction = "Send G20. Tap {{cad.socket_a1_thread}} through by hand under the tap guide, spindle off, dry: half a turn on, a quarter back. Read the depth with the guide's point pushed fully home, as the reference: stop when the DRO Z reads the noted Z − {{process.tap_point_depth_mm:in.3dot}}, the full thread through the plate and the point in the relief pocket."
instruction_detailed = "Send G20, as when the depth was noted. Tap's point in the hole; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench gently, half a turn on and a quarter back to break the chip (a #2 tap snaps if forced). To read, push the point fully home: stop at the noted Z − {{process.tap_point_depth_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
inspection = "A #2-56 screw runs through the thread by hand. Binds: run the tap through again under the tap guide; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PL06_tap_2, then PL07_tap_3 and PL08_tap_4 (the tap guide still in, spindle off; each ends Idle over its socket: A2, A3, A4). Tap each the same way: G20, depth reference beside it, tap through to the same depth under the tap guide, G21, back out, blow out, screw check."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Free, deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished platen seen on its back face, as drawn: sockets A1–A4, guide holes B1–B10 with their counterbores on the far side; the length, the height, B1's station and height from the left and bottom edges." }
envelope = "other"
vise_hold = "other"
beam = "other"
inspection = [
  "Thickness {{cad.back_face_thickness_min_in:.3dot}}–{{cad.back_face_thickness_max_in:.3dot}}, micrometer, at the middle of each long edge and of each end (it sets the clearance to the MHA-PD-06 disc). Over: stop and tell the owner (a re-bond and a skim of B is his call). Under: scrap.",
  "Form, the thickness's envelope (the drawing is to ASME Y14.5: perfect form at {{cad.back_face_thickness_max_in:.3dot}}): the platen free on the surface plate, each face down in turn; the largest thickness reading plus the thickest feeler leaf that enters under it anywhere, at most {{cad.back_face_thickness_max_in:.3dot}}. Over: stop and tell the owner; he rules on straightening.",
  "Hole B1 from the left edge {{cad.guide_b1_station_min_in:.3dot}}–{{cad.guide_b1_station_max_in:.3dot}} and from the bottom edge {{cad.guide_b1_height_min_in:.3dot}}–{{cad.guide_b1_height_max_in:.3dot}}: the #27 drill's shank in the hole, the calipers from the edge over the shank, less half its miked Ø. The other holes are the program's from the same zero, not gauged. Outside: stop and tell the owner.",
  "Counterbore Ø{{cad.guide_b1_cbore_dia_min_in:.2dot}}–{{cad.guide_b1_cbore_dia_max_in:.2dot}} at B1 and B10, the calipers' inside jaws. Outside: stop and tell the owner.",
  "Guide holes Ø{{cad.guide_b1_dia_min_in:.3dot}}–{{cad.guide_b1_dia_max_in:.3dot}}: the {{cad.guide_b1_dia_min_in:.3dot}} plus pin enters every hole (GO), the {{cad.guide_b1_dia_max_in:.3dot}} minus pin enters none (NO-GO); Class ZZ pin gauges, to buy. GO refused: run the #27 drill through by hand. NO-GO enters: stop and tell the owner.",
]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.back_face_thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.guide_b1_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.guide_b1_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.guide_b1_cbore_dia_band_mm}}" },
  { gauge = "pin-gauges", band_mm = "{{cad.guide_b1_dia_band_mm}}" },
]

[[setups.operations]]
instruction = "Unclamp nothing yet. Free the platen: wet the tape along every gap with isopropyl alcohol, wait 2 minutes, then work a thin blade under it along each strip from the front edge. Never lever it up by an end or a corner. Roll the tape off; clean the platen with isopropyl alcohol."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburring-set"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the fourteen holes and the ten counterbore rims flush with a scraper from the deburring set (no countersink at the sockets)."
feed = "hand"
inspection = "No burr stands proud of either face at a hole; a #2-56 screw still runs through each socket by hand. Binds: run the tap through by hand."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break all twelve outside edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file: the eight round the two faces and the four at the corners. File off any fin the tape left at the bottom of an edge."
feed = "hand"
inspection = "No sharp edge or corner; no burr proud of any face or edge. One left: file it off."
gauge_checks = "other"

[[setups.operations]]
instruction = "Unclamp the fixture bar; put the blocks, jacks and clamps away. The bar keeps its skim and pockets for the next platen."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blacken (once the Brass Black is bought)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/finish.svg", alt = "The finished platen, every surface to be blackened: both faces, the four edges, the fourteen holes and the ten counterbores." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}. Start only with Birchwood Casey Brass Black, Birchwood Casey Cleaner-Degreaser and Barricade oil, chemical-resistant gloves and safety glasses in hand: all to buy, none on record. Until then the platen stays bare, tagged AWAITING BRASS BLACK."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the label: severe skin burns and eye damage). Clean the platen with the Cleaner-Degreaser."
feed = "hand"

[[setups.operations]]
instruction = "Scuff both faces and the four edges lightly with the 220 sanding roll for soft metals (the maker: 00 steel wool or abrasive paper). Not in the holes or the counterbores."
feed = "hand"

[[setups.operations]]
instruction = "Degrease again with the Cleaner-Degreaser and rinse with clear water. Hold the platen by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Swab or brush the Brass Black on every surface, into the holes and the counterbores; let it act about one minute (the maker's time). Rinse in cold water; pat dry."
feed = "hand"

[[setups.operations]]
instruction = "One coat is this traveler's finish: the maker's darker repeat needs 0000 steel wool, not on record. Solution and rinse waste to local rules, not down the drain (label: very toxic to aquatic life)."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on Barricade oil; leave it overnight, then wipe off the excess (the maker's step)."
feed = "hand"
inspection = "An even black on both faces and every edge, no bare patch (else degrease, apply again, rinse, dry and oil); a #2-56 screw runs through each socket by hand. Tight: stop and tell the owner; do not re-tap."
gauge_checks = "other"
