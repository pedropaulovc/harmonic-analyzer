machine_kind = "other"
title = "Bond P up; thickness, edges, holes, counterbores, taps"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 3 with the blank turned over end for end: fresh tape on the bar and on face B, glue between; B down, P up (the arrow pointing down), the FRONT edge flush with the bar's front edge, the other end on the scribed line, both within 1/16 in; the bar's tape cut away over the four relief pockets. The plate lies mirrored against the drawing's view, its bottom edge at the back."
datum = "Program PL04_platen. G54 X and Y as set in Setup 2: X0 the left edge, Y0 the bottom edge as drawn, at the back; work X is the hole table's X LOC, work Y minus its Y LOC (hole B1 at X {{cad.guide_b1_station_in:.3f}}, Y −{{cad.guide_b1_height_in:.3f}}). Z0 the plate's underside (B, on the tape stack), set from P's top less the miked thickness, so the stack under it does not enter; elsewhere it differs by at most the stack check's .002. At every M6 stop the file has stopped the spindle and lifted the tool above the plate. A Reset after a Feed Hold keeps G54: no homing, no new zero. After homing again (the note says when): check that the plate has not moved on its bond and G54 X and Y on the fixture bar, as Setup 3's Datum says (one off or out of reach, or the plate moved: stop and tell the owner); then Z: console M6 T1, its tip on the .002 leaf on a faced part of P, G10 L20 P1 Z{{process.faced_z_set_mm:.3f}} (nothing faced yet: the Z0 operation again). Once the four edges are cut, X and Y too, with the edge finder: on the plate's left edge G10 L20 P1 X{{process.edge_x_set_mm:.3f}}, on its back edge G10 L20 P1 Y{{process.edge_y_set_mm:.3f}}. Then run the file from its start: cuts already made cut air."
diagram = { file = "diagrams/platen.svg", alt = "Plan of the blank on the bar, P up: the platen's outline inside the blank's margin, the 1/2 in end mill's passes round the four edges with the plate on the cutter's left, the four sockets over their relief pockets, the ten guide holes with their counterbores; X0 at the left edge, Y0 at the back edge." }
envelope = { x_span_mm = ["{{process.x0_from_bar_left_mm}}", "{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_width_max_mm}}", "{{process.face_cutter_dia_mm}}", 7.62], work_top_mm = ["{{process.block_height_mm}}", "{{process.bar_top_max_mm}}", "{{process.tape_stack_max_mm}}", "{{process.third_cut_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.bar_top_min_mm}}", "{{process.guide_tip_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.quarter_mill_projection_min_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.length_target_mm}}"], seat = "skimmed fixture bar", seat_mm = ["{{process.seat_left_mm}}", "{{process.seat_right_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "platen", kind = "part", area_mm2 = "{{process.bond_patch_area_mm2}}", width_mm = "{{process.height_target_mm}}" }] } }

[[setups.operations]]
instruction = "Prepare as Setup 3, from its mic of the blank to its burnish: mic the blank at the three stations; degrease the bar and face B; five fresh 11 3/4 in strips on the bar and five 11 1/4 in on face B, trimmed flush, the first centred on the FRONT edge; burnish both."
feed = "hand"

[[setups.operations]]
instruction = "Cut the bar's tape away over the four relief pockets: a knife point round each pocket's rim, the disc lifted out, so the #50 and the tap come out into the pocket."
feed = "hand"

[[setups.operations]]
tool = "ca-glue"
speed_kind = "other"
drilling = "none"
sizing = "other"
instruction = "Glue as Setup 3, the bead also kept 1/4 in clear of each pocket; mist the accelerator on face B's tape. Within about 10 seconds lower the blank P up, an end on the scribed line, FRONT edge against the combination square's blade. Press it down all over with both hands for 1 minute; then wait 5 minutes."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Stack at the three marked stations, as Setup 3: {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}, the three within .002 (Z0 below rests on it). Push test, as Setup 3: no movement, no creak, no corner lifts." },
  { kind = "stop", text = "Either fails: free the blank as Setup 3's last three operations, then tape and bond it again." },
]
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the plate's underside, from Setup 5's reading and the end mill touched on P over the miked spot."
instruction_detailed = "Console M6 T1 (the tool setter measures it); MDI G0 X{{process.z_touch_x_mm:.3f}} Y{{process.z_touch_y_mm:.3f}} (the miked spot: the middle of the FRONT edge, {{process.z_touch_inset_in:fraction}} in in). Spindle stopped, its tip just dragging a .002 feeler leaf on P: G10 L20 P1 Z(the reading in mm + {{process.z_leaf_mm:.3f}})."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL04_platen in air, Z0 raised 1.000 in; every move stays clear of the step clamps, through every M6. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PL04_platen through its five tools, watching each move clear the clamps. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PL04_platen (M6 T1, 1/2 in end mill; set 2800), dry: face P down to {{process.thickness_target_mm:in.3dot}} in above the underside (Z0), one level, passes along X no wider than {{process.face_stepover_max_mm:in.3dot}}."
settings = "platen-em-half-c360"
milling_cuts = [
  { name = "thickness", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.final_face_doc_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop: the four edges to size with the cutter's side, left, right, front, back; one-way passes with the plate on the cutter's left (conventional with M3), steps no deeper than {{process.outline_step_max_mm:in.3dot}}, the last {{process.outline_finish_mm:in.3dot}}, down to {{process.outline_breakthrough_mm:in.3dot}} under Z0, into the tape stack and short of the bar. The whole margin goes to chips."
settings = "platen-em-half-c360"
milling_cuts = [
  { name = "edge rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_axial_doc_mm}}", radial_woc_mm = "{{process.outline_step_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
  { name = "edge finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_axial_doc_mm}}", radial_woc_mm = "{{process.outline_finish_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

