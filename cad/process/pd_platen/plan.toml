# Platen MHA-PD-02 (qty 1), routed for the CNC mill (agent's choice for
# speed, owner ruling 2026-11-21: the owner corrects the route afterwards).
# One C360 flat, 1/4 × 6 × 11 in as bought (stock.c360-flat-1-4x6, not yet
# received), milled to the .152 thickness in four cuts, two off each face
# and turned over after each (the registry's process note: equal cuts from
# both sides, so the bar's skin comes off both faces and the plate stays
# flat), then its outline, the fourteen holes and the ten counterbores from
# one zero, the four #2-56 sockets tapped by hand under the spring tap guide.
#
# No vise: the 6 in blank is wider than the PM vise opens (shop
# workholding.vise-pm-6 opening_mm, 146.05), and a 1/4 in plate standing
# over the jaws has no limits.vise_grip_min_mm of grip. The plate is bonded,
# every cut, to a fixture bar on the table: the freed 1/2 × 6 × 18 in 6061
# bar (stock.6061-flat-1-2x6-18in) on the owner's two 1-2-3 blocks lying
# flat (1 in up: on the table itself the short end mills could not reach it,
# shop machines.pm-30mv spindle_to_table_mm; cam.py checks it), the two
# screw jacks under its middle, four step clamps (LMS 1268 kit) on its ends,
# the vise off. PL01 skims the bar's top where the blank goes; PL02 plunges
# four relief pockets under the socket stations, so the #50 drill and the
# tap exit into the air. The bar keeps the skim and the pockets.
#
# Bond: 3M VHB 5906 tape, .006 in (cad/config/shop-equipment/
# consumables.tape-3m-vhb-5906, to buy; the strap's tape, owner-approved
# for MHA-CH-13), eleven 3/4 in strips across the bar at 1 in pitch under
# the blank's whole length. The 1/4 in gaps let isopropyl alcohol reach the
# tape at release; the plate bridges them (cam.py bounds the gap). prechips
# compares each cut with the tape's derated strengths; the bond it is told
# is the least tape under any square patch as long as the plate is high
# ([parameters] bond_patch_area_mm2, cam.py checks it). Painter's tape and
# cyanoacrylate would release more easily but have no strength on record:
# an owner-correctable choice, stated in the PR.
#
# Route: Setup 1 gate the blank; Setup 2 fixture bar on the table, one G54
# X/Y for every program (edge finder on the bar), PL01_bar_skim and
# PL02_bar_relief; Setups 3-5 bond B up, P up, B up, PL03_face each time
# (one file, Z0 the top's high point less the cut), the blank turned over
# end for end between cuts so the long edge marked FRONT stays at the bar's
# front edge (the mark, on the edge, outlives the face cuts); Setup 6 bond P
# up, Z0 the underside from the miked thickness, PL04_platen: face P to the
# thickness, mill the four edges to size with the cutter's side (the whole
# margin goes to chips: no rim, no tabs), spot, #50 and #27 through,
# counterbore; PL05_tap_1 to PL08_tap_4 bring the tap guide over each
# socket; Setup 7 free, deburr, inspect; Setup 8 blacken with Birchwood
# Casey Brass Black (the drawing's finish; the solution and its supplies are
# to buy, so the plate may stop bare, tagged).
#
# Frames: the drawing's view shows the back face (the counterbores are on
# the far side). In Setup 6 the paper face is up, so the plate lies mirrored
# top to bottom: work X is the hole table's X LOC, work Y is minus its
# Y LOC (the drawing's bottom edge is at the back, Y0).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner,
# Pedro, answered in person 2026-11-21, cnc rulings record;
# cad/config/shop-equipment/ tools.tap-guide-fisher, to buy, owner ruling
# 2026-11-22), spindle off; FluidNC refuses jogs while an M0 holds the program,
# so each tap stop is a file of its own that ends with M30 over its hole.
#
# Zeroing: the touch probe has no holder (cad/config/shop-equipment/
# gauges.touch-probe-diy0-tp05), so X/Y are the owned .200 in edge finder at
# 900 rpm (tools.edge-finder) and every Z the end mill on a .002 feeler leaf.
#
# Guide holes: accepted with Class ZZ pin gauges, the band's low limit as a
# plus pin (GO) and its high limit as a minus pin (NO-GO)
# (cad/config/shop-equipment/ gauges.pin-gauges, to buy; owner ruling
# 2026-11-21: "ill buy pin gauges").
#
# Form: the drawing carries no flatness frame (#2411); the thickness is a
# feature of size, so its ASME Y14.5 Rule #1 envelope, perfect form at the
# .157 maximum, bounds any bow (pd_platen_spec.py). The plate is freed from
# tape with a blade, so the final inspection checks that envelope: the
# largest miked thickness plus the thickest feeler leaf that enters under
# the plate on the surface plate. A bowed blank is not gated in Setup 1: the
# tape holds it flat for each cut and the envelope check is the acceptance.
#
# NC (cam:pd_platen, cad/process/pd_platen/cam.py): PL01_bar_skim,
# PL02_bar_relief, PL03_face, PL04_platen, PL05_tap_1 to PL08_tap_4.
# Program names, the [parameters] and the milling_cuts names are a contract
# with that recipe. Tool numbers are the places in the tools list among the
# mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #50, T4 #27, T5 1/4
# in end mill, T6 the tap guide.
title = "Platen"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass flat bar, 1/4 × 6 in, temper as Metal Supermarkets supplied it (invoice EC234347 names none; the bar is not yet received). The part's spec: {{cad.material_spec}}"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:g}} in flat bar; {{process.quantity:d}} × {{process.blank_length_in:g}} in piece, as bought. Fixture: the 1/2 × 6 × 18 in 6061 bar."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.right_edge_width_min_in:.2f}}–{{cad.right_edge_width_max_in:.2f}} long, {{cad.top_edge_height_min_in:.2f}}–{{cad.top_edge_height_max_in:.2f}} high, {{cad.back_face_thickness_min_in:.3dot}}–{{cad.back_face_thickness_max_in:.3dot}} thick. Brass is cut dry here: no oil reaches the tape. To buy: 3M VHB 5906 tape, 3/4 in wide, two 5 yd rolls, before starting; the two pin gauges before the final inspection; the Brass Black kit before Setup 8."
shop = "../shop"
stock_refs = ["c360-flat-1-4x6", "6061-flat-1-2x6-18in"]
material_key = "platen-c360"
milling_material = "brass"

[cad]
file = "../../out/features/pd_platen/features.toml"
adapter = "flat_bar"
part = "pd-platen"

[parameters]
quantity = 1
# The blank (stock.c360-flat-1-4x6): model X its length, Y its width, Z its
# thickness; stock_fit reads blank_<role>_in on those axes.
blank_length_axis = 0
blank_thickness_axis = 2
blank_length_in = 11.0
blank_width_in = 6.0
blank_thickness_in = 0.25
# Setup 1's gate (author's bands round the invoice's nominals: the bar is not
# received): .244-.256 thick, 5.95-6.05 wide, 10.95-11.10 long. The programs
# are posted for the largest; cam.py checks the smallest still cleans up.
blank_thickness_min_mm = 6.1976
blank_thickness_max_mm = 6.5024
blank_width_min_mm = 151.13
blank_width_max_mm = 153.67
blank_length_min_mm = 278.13
blank_length_max_mm = 281.94
# Targets, the middle of each band (cam.py checks them against the export):
# length 10.62 (10.61-10.63), height 5.31 (5.30-5.32), thickness .152
# (.147-.157).
length_target_mm = 269.748
height_target_mm = 134.874
thickness_target_mm = 3.8608
# The fixture bar (cad/config/shop-equipment/ stock.6061-flat-1-2x6-18in;
# the process test checks the three sizes against that record). Its top
# stands between bar_top_min_mm (a .490 bar less two .010 skims) and
# bar_top_max_mm (a .505 bar) above the blocks.
bar_length_mm = 457.2
bar_width_mm = 152.4
bar_thickness_mm = 12.7
bar_top_min_mm = 11.938
bar_top_max_mm = 12.827
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in up.
# Nothing of a step clamp, stud or nut farther than this in from a bar end
# (Setup 2's Holding says 2 in; cam.py keeps every move clear of 2.5 in).
clamp_zone_mm = 63.5
# Where the blank goes: its left end blank_left_mm (3.50 in) from the bar's
# left end, its front edge flush with the bar's front edge, each within
# placement_tol_mm (1/16 in). G54 X0/Y0 are then the platen's left and
# bottom edges, centred in the nominal blank: X0 3.690 in from the bar's
# left end, Y0 5.655 in behind its front edge. x_set_mm and y_set_mm are the
# edge finder's entries on those two faces (its .100 radius more). cam.py
# checks all four.
blank_left_mm = 88.9
placement_tol_mm = 1.5875
x0_from_bar_left_mm = 93.726
y0_from_bar_front_mm = 143.637
x_set_mm = -96.266
y_set_mm = -146.177
# Setup 6's Z0 is touched over the spot Setup 5 mics: the middle of the
# blank's FRONT edge, z_touch_inset_in (1/2 in) in from it (z_touch_x_mm,
# z_touch_y_mm in the work frame); the entry is the miked thickness plus the
# feeler leaf, z_leaf_mm. After a reset once P is faced, the same touch on
# the faced P enters faced_z_set_mm (the thickness target plus the leaf);
# once the edges are cut, X and Y are picked on the plate's own left and
# back edges, edge_x_set_mm and edge_y_set_mm (the finder's radius). cam.py
# checks them all.
z_touch_inset_in = 0.5
z_touch_x_mm = 134.874
z_touch_y_mm = -130.937
z_leaf_mm = 0.0508
faced_z_set_mm = 3.9116
edge_x_set_mm = -2.54
edge_y_set_mm = 2.54
# PL01, PL02: the bar's top skimmed .010 under its high point over the blank's
# place and bar_skim_margin_mm round it (bar_skim_left_mm to
# bar_skim_right_mm from the bar's left end; seat_left_mm to seat_right_mm
# from X0); four relief pockets, the 1/2 in end mill plunged relief_depth_mm
# at the socket stations (bar_relief_left_mm and bar_relief_right_mm from
# the bar's left end). bar_z_set_mm is the Z entry on the .002 feeler.
bar_skim_mm = 0.254
bar_skim_margin_mm = 6.35
bar_z_set_mm = 0.3048
bar_skim_left_mm = 80.9625
bar_skim_right_mm = 378.7775
seat_left_mm = -12.7635
seat_right_mm = 285.0515
relief_depth_mm = 3.81
bar_relief_left_mm = 98.044
bar_relief_right_mm = 359.048
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2), passes
# along X no wider than .250 (half the cutter: the 6G chip-load factor 1.0
# holds to 50 % engagement, shop settings.platen-em-half-c360). Three equal
# cuts of .0245 (face_cut_mm), each from the face's high point
# (face_z_set_mm is the Z entry on the .002 feeler), leave .1705-.1825
# (third_cut_min_mm to third_cut_max_mm); the fourth takes P to the
# thickness, at most final_face_doc_max_mm. cam.py checks them.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
face_cut_mm = 0.6223
face_z_set_mm = 0.6731
third_cut_min_mm = 4.3307
third_cut_max_mm = 4.6355
final_face_doc_max_mm = 0.7747
# Tape: 3M VHB 5906, .006 in (cad/config/shop-equipment/
# consumables.tape-3m-vhb-5906). 3M "VHB Tapes Technical Data" (November
# 2015), Typical Performance Characteristics, 5906, 72 h dwell at room
# temperature: normal tensile (ASTM D-897, to aluminium) 100 lb/in² =
# 690 kPa; dynamic overlap shear (ASTM D-1002, to stainless steel)
# 100 lb/in² = 690 kPa.
tape_thickness_mm = 0.15
tape_shear_mpa = 0.69
tape_tensile_mpa = 0.69
# Derating of both strengths, as the strap's plan (ch_rocker_strap): 0.5 for
# the dwell (same data sheet, Application Techniques: "approximately 50% of
# ultimate bond strength will be achieved after 20 minutes", so the plan
# waits 20 minutes) × 0.5, the author's allowance for a warm cut, no source.
bond_derating = 0.25
# Eleven 3/4 in strips at 1 in pitch, the first's left edge 1/8 in right of
# the blank's left end. The bond prechips is told: the least tape under any
# square patch as long as the plate is high (its lowest height, 5.30: five
# strips and .050 of a sixth), less two relief pockets' cut-outs.
tape_strip_width_mm = 19.05
tape_strip_pitch_mm = 25.4
tape_strip_count = 11
tape_first_edge_mm = 3.175
bond_patch_area_mm2 = 12740.17
# Edges: the 1/2 in end mill's side, one level from P to
# outline_breakthrough_mm under the plate (into the tape, short of the bar:
# under the tape's least thickness, .006 in −15 %), one-way passes with the
# plate on the cutter's left (conventional with M3), in equal steps no
# deeper than .100 from the largest margin a gated blank can leave, the last
# .010. outline_axial_doc_mm is the thickness target plus the breakthrough.
outline_step_max_mm = 2.54
outline_finish_mm = 0.254
outline_breakthrough_mm = 0.08
outline_axial_doc_mm = 3.9408
# Holes. Spot all fourteen Ø.065 with the #1 carbide 60° centre drill (shop
# centre-drills-carbide-60: 3/64 pilot, 1/8 body), under the #50, so no
# chamfer is left at a socket's mouth. #50 (the sockets' Ø.070 tap drill)
# and #27 (the guides' Ø.144) through in one plunge each (L/D 2.2 and 1.1),
# their full diameter drill_past_mm under the plate: the #50 into its relief
# pocket, the #27 through the tape into the bar (a backed exit). cam.py
# checks both tips.
spot_dia_mm = 1.651
drill_past_mm = 0.5
socket_tip_height_mm = -1.034
guide_tip_height_mm = -1.599
# Counterbores Ø.260 × .115 from P: the 1/4 in carbide end mill (shop
# endmill-carbide-3fl-1-4) plunged down the drilled hole to the floor, then
# one circle .005 off centre (cbore_orbit_mm; clockwise, conventional).
# cbore_floor_height_mm is the floor above the underside, the thickness
# target less the depth's middle; cam.py checks both.
cbore_cutter_dia_mm = 6.35
cbore_orbit_mm = 0.127
cbore_floor_height_mm = 0.9398
# Speeds and feeds authored in the operations, all at the spindle's 2800 rpm
# (shop machines.pm-30mv). Holes: LittleMachineShop "Cutting Speeds",
# Drilling & Reaming, row Brass (C35600, C37700, C36000, ...): 160-175
# ft/min (read 2026-11-22), over 2800 rpm on every tool here; AutoDrill
# "Suggested drilling feed rates" (read 2026-11-22), row Brass: 1/16 in
# .001, 1/8 in .003, 1/4 in .004 in/rev, a size between two columns taking
# the lower one's feed: centre drill (3/64 pilot) and #50 (.070) .001 in/rev
# = 2.8 in/min; #27 (.144) .003 in/rev = 8.4 in/min. The bar's skim: the
# 6G table shop/pd.toml cites, row Non-Ferrous N, Al/Al Alloys, 500 SFM
# (3820 rpm, so 2800), 1/2 in .0042 in/tooth = 35.3 in/min. End-mill
# plunges into metal (the relief pockets, the counterbores): .00025
# in/tooth, 2.1 in/min, the author's choice, no source.
spot_feed_per_min_mm = 71.12
socket_drill_feed_per_min_mm = 71.12
guide_drill_feed_per_min_mm = 213.36
bar_skim_feed_per_min_mm = 896.112
plunge_feed_per_min_mm = 53.34
# Tapping #2-56 through: the tap's point stops this far below P (.257): the
# thickest plate (.157) plus .100, past a plug chamfer of at most five
# threads (.089), inside the relief pocket (cam.py checks the pocket's
# depth).
tap_point_depth_mm = 6.5278
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# The drill chuck and its longest drill: cam.py checks that together they
# stand no longer than the tap stack the envelopes allow for.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
drill_projection_max_mm = 112.8  # Archive 13/32 jobber, bounds the drills.
# 1/2 in end mill at least 1 in out of its collet; 1/4 in end mill at least
# 7/8 in out.
half_mill_projection_min_mm = 25.4
quarter_mill_projection_min_mm = 22.225
# Tapping under the spring tap guide (tools.tap-guide-fisher, 3 1/8 in
# overall): the guide and the tap in its wrench reach tap_stack_max_mm below
# the collet face when the tap, point to the wrench's centre hole, is at
# most tap_wrench_reach_max_mm (6 in; Setup 6 has the operator check it).
# cam.py checks the stack against the spindle-to-table maximum less the
# shop's tool-change clearance, the blocks, the bar, the tape and the plate.
tap_wrench_reach_max_mm = 152.4
tap_stack_max_mm = 231.775

