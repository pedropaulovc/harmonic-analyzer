[[setups]]
machine_kind = "other"
title = "Check the blank"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "The 1/4 × 6 × 11 in brass blank, {{process.blank_length_in:g}} by {{process.blank_width_in:g}} in: one long edge marked FRONT with an arrow to face B; the platen's outline, cut in Setup 6, as a thin line centred in it." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the blank's thickness at the middle of each long edge and of each end."
inspection = "Every reading {{process.blank_thickness_min_mm:in.3dot}}–{{process.blank_thickness_max_mm:in.3dot}}. Outside: stop and tell the owner; the programs are posted for this plate."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Measure the blank's length and width with the combination square's 12 in blade."
inspection = "Length {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}}, width {{process.blank_width_min_mm:in.2f}}–{{process.blank_width_max_mm:in.2f}}. Outside: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the burr off all eight edges so the blank lies flat. With marking fluid mark one long edge FRONT, on the edge itself, with an arrow pointing to the face called B (the back face); the other face is P (the paper face). No cut takes that mark off before Setup 6."
feed = "hand"
inspection = "The blank lies on the surface plate, each face down in turn, without rocking on a burr. Rocks on a bow, not a burr: go on; the finished plate's form is checked at the final inspection."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Fixture bar on the table"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off the table. The 1/2 × 6 × 18 in 6061 bar on the two 1-2-3 blocks lying flat (1 in up), one crosswise under each end, 1/2 in in from the end; the two screw jacks under its middle, one near each long edge, run up finger-tight. Two step clamps (LMS 1268 kit) on each end from studs beyond the ends, bearing over the block; no clamp, stud or nut more than 2 in in from an end. Long edges along X by eye, within 1/16 in over the bar. The bar stays clamped until Setup 6 is done."
datum = "Programs PL01_bar_skim and PL02_bar_relief. G54 X and Y, set here once for every program of this traveler: X0 {{process.x0_from_bar_left_mm:in.3f}} right of the bar's left end, Y0 {{process.y0_from_bar_front_mm:in.3f}} behind its front edge (where the platen's left and bottom edges will be); +Y toward the back of the table. Z0 here: the skimmed bar top, its high point less {{process.bar_skim_mm:in.3dot}}. A Reset after a Feed Hold keeps G54: no homing, no new zero. After homing again (the note says when): repeat this setup's first two operations."
diagram = { file = "diagrams/bar.svg", alt = "Plan of the fixture bar on the table: a 1-2-3 block and two step clamps at each end, two screw jacks under the middle; the skimmed patch where the blank goes, the four relief pockets, X0 and Y0 from the bar's left end and front edge." }
envelope = { x_span_mm = ["{{process.x0_from_bar_left_mm}}", "{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.bar_skim_margin_mm}}", 5.08], y_span_mm = ["{{process.blank_width_max_mm}}", "{{process.face_cutter_dia_mm}}", 7.62], work_top_mm = ["{{process.block_height_mm}}", "{{process.bar_top_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.bar_top_min_mm}}", -3.81], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
# The bar between its two blocks: under a push between them it bears on
# their inner edges (each block 2 in along X, 1/2 in in from a bar end). The
# jacks under the middle are given no credit.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{process.bar_length_mm}}"], supports_mm = [63.5, 393.7], section_mm = { y = "{{process.bar_width_mm}}", z = "{{process.bar_top_min_mm}}" } }

[[setups.operations]]
instruction = "G54 X0 and Y0 from the bar's left end and front edge with the edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the bar's left end, between the two clamps, G10 L20 P1 X{{process.x_set_mm:.3f}}; on its front edge at mid-length, G10 L20 P1 Y{{process.y_set_mm:.3f}} (each entry allows for the finder's .100 radius)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the bar top's high point less the {{process.bar_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the bar top at mid-length and 5 in either side of it; at the highest of the three: G10 L20 P1 Z{{process.bar_z_set_mm:.3f}} (the skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL01_bar_skim and PL02_bar_relief in air: Z0 raised 1.000 in; every move stays 1/2 in or more clear of the step clamps. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PL01_bar_skim, then PL02_bar_relief, watching each move clear the clamps. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PL01_bar_skim (M6 T1, 1/2 in end mill; set 2800): skim the bar top at Z0 where the blank goes, passes along X no wider than {{process.face_stepover_max_mm:in.3dot}}."
rpm = 2800
feed = "{{process.bar_skim_feed_per_min_mm:in.1f}} in/min"
inspection = "The whole patch is freshly cut. A dull island left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run PL01_bar_skim again."
gauge_checks = "other"
milling_cuts = [
  { name = "bar skim", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = "{{process.bar_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", rpm = 2800, feed_mm_min = "{{process.bar_skim_feed_per_min_mm}}", traverse_mm = ["{{process.bar_skim_left_mm}}", "{{process.bar_skim_right_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PL02_bar_relief (M6 T1, the same end mill; set 2800): four relief pockets, the end mill plunged {{process.relief_depth_mm:in.3dot}} into the bar under the four socket stations, so the #50 drill and the tap come out into the air."
rpm = 2800
feed = "{{process.plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "tap relief", kind = "plunge", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, rpm = 2800, feed_mm_min = "{{process.plunge_feed_per_min_mm}}", stations_mm = ["{{process.bar_relief_left_mm}}", "{{process.bar_relief_right_mm}}"] },
]

[[setups.operations]]
instruction = "Brush the chips off. Scribe a line across the bar top {{process.blank_left_mm:in.2f}} in from its left end, with the combination square against the bar's front edge: the blank's left end goes on it."
feed = "hand"

[[setups.operations]]
instruction = "Mark three stations on the bar's front face: 1 in, 7 in (clear of the front screw jack) and 10 in right of the scribed line. Mic the bar's thickness at each, 3/8 in in from its front edge, and write the three readings down: every bond's stack check uses them."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bond B up; first cut"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Blank bonded to the bar's skimmed top: ScotchBlue 2090 blue painter's tape on the bar and on face P, GH1200 thick CA glue between, the stack {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}} (miked); five 1.41 in strips on each, along X, butted, the blank's seams half a strip off the bar's. Face P down, B up, its left end on the scribed line, its FRONT edge flush with the bar's front edge, both within 1/16 in. Nothing else holds it. Bar, blocks, jacks and clamps as Setup 2, untouched."
datum = "Program PL03_face. G54 X and Y as set in Setup 2 (not touched). Z0: the cut face, the top's high point less {{process.face_cut_mm:in.4dot}}, touched on the blank, so the tape stack under it does not enter. A Reset after a Feed Hold keeps G54: no homing, no new zero. After homing again (the note says when): check that the blank has not moved on its bond, then G54 X and Y on the fixture bar with the edge finder, as Setup 2 set them: its left end between the two clamps reads X {{process.x_set_mm:.3f}}, its front edge at mid-length reads Y {{process.y_set_mm:.3f}}, each within 0.025 mm. One off or out of reach, or the blank moved: stop and tell the owner. Then set Z0 again as this setup does, on a part of the face not yet cut, and run the file from its start."
diagram = { file = "diagrams/bond.svg", alt = "Plan and section of the blank on the bar: five blue tape strips along X on the bar, butted, from 1/4 in left of the scribed line to past the blank's right end; the blank's own five strips, their seams dashed, half a strip off the bar's; its left end on the scribed line and its FRONT edge flush with the bar's front edge. Section: blue tape, CA glue, blue tape between bar and blank; the 1/2 in end mill faces the top in passes along X." }
envelope = { x_span_mm = ["{{process.x0_from_bar_left_mm}}", "{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_width_max_mm}}", "{{process.face_cutter_dia_mm}}", 7.62], work_top_mm = ["{{process.block_height_mm}}", "{{process.bar_top_max_mm}}", "{{process.tape_stack_max_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.bar_top_min_mm}}", "{{process.third_cut_min_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.length_target_mm}}"], seat = "skimmed fixture bar", seat_mm = ["{{process.seat_left_mm}}", "{{process.seat_right_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{process.bond_patch_area_mm2}}", width_mm = "{{process.height_target_mm}}" }] } }

[[setups.operations]]
instruction = "Mic the blank 3/8 in in from its FRONT edge at the three stations it will sit over: 1 in, 7 in and 10 in from the end that goes on the scribed line. Write the readings down by station."
feed = "hand"

[[setups.operations]]
instruction = "Degrease the bar's skimmed patch and the blank's face P with isopropyl alcohol; wipe both dry."
feed = "hand"

[[setups.operations]]
tool = "tape"
speed_kind = "other"
drilling = "none"
sizing = "other"
instruction = "Tape the bar: five 11 3/4 in strips of the 1.41 in tape along X, from 1/4 in left of the scribed line; the first flush with the bar's front edge, the others behind it, edges butted. Never overlap two strips (that doubles the stack and rocks the blank); no gap over 1/32. Knife-trim the fifth flush with the bar's back edge."
feed = "hand"

[[setups.operations]]
tool = "tape"
speed_kind = "other"
drilling = "none"
sizing = "other"
instruction = "Tape face P: five 11 1/4 in strips along the blank's length, the first centred on the FRONT edge (half its width over the edge), the others butted behind it, no overlap, no gap over 1/32. Its seams then sit about .70 in, half a strip, off the bar's. Knife-trim every strip flush with the blank's edges and ends."
feed = "hand"

[[setups.operations]]
instruction = "Burnish both tapes down hard with the round back of a screwdriver handle: every strip, its edges and the seams. No bubble, no lifted edge."
feed = "hand"

[[setups.operations]]
tool = "ca-glue"
speed_kind = "other"
drilling = "none"
sizing = "other"
instruction = "GH1200 thick (1500 cps) CA on the bar's tape: a zigzag bead about 1/16 in wide, its lines across the bar about 3/4 in apart, kept 1/4 in inside where the blank goes: about fifteen lines, 80 in of bead. Mist the Starbond accelerator on face P's tape, two or three sprays. No glue on bare metal."
feed = "hand"

[[setups.operations]]
instruction = "Within about 10 seconds of the spray, lower the blank, B up (the FRONT edge's arrow pointing up), left end on the scribed line, FRONT edge against the combination square's blade held on the bar's front edge. The glue grabs at once: it cannot be slid after. Press it down all over with both hands for 1 minute; then wait 5 minutes."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Stack: mic over the bar and the blank together at the three marked stations, 3/8 in in from the FRONT edge. Each reading less the bar's and the blank's readings there is the stack: {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}, the three within .002 of each other." },
  { kind = "stop", text = "Outside, or more than .002 apart: free the blank as this setup's last three operations, then tape and bond it again." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Push test: with the heel of the hand push the blank hard along X and across, then try to lift each corner with a thumbnail. No movement, no creak, no corner lifts." },
  { kind = "stop", text = "Any movement: free the blank as this setup's last three operations, then tape and bond it again." },
]
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top's high point less the {{process.face_cut_mm:in.4dot}} cut."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the blank at its middle and 1 in in from each end; at the highest of the three: G10 L20 P1 Z{{process.face_z_set_mm:.3f}} (the cut plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "First time only: prove PL03_face in air, Z0 raised 1.000 in; every move stays clear of the step clamps. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PL03_face, watching each move clear the clamps. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PL03_face (M6 T1; set 2800), dry: one level at Z0 over the whole blank, passes along X no wider than {{process.face_stepover_max_mm:in.3dot}}. The blank shifts or lifts: Feed Hold, then Reset (the spindle stops; G54 X and Y stand); jog Z up 1 in clear of the blank. Then free it as below, bond it again and set Z0 again as above."
settings = "platen-em-half-c360"
milling_cuts = [
  { name = "face", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_cut_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

[[setups.operations]]
instruction = "Free the blank by peeling, no solvent soak: slide a single-edge razor blade flat under the bar's tape at the FRONT edge and work it along the whole 11 in a little at a time, then farther in, until the blank comes away with both tapes on it. The tape bends, not the blank: never lever it up by an end, an edge or a corner."
feed = "hand"

[[setups.operations]]
instruction = "Lay the blank tape up on the surface plate. Hold it down flat with one hand close to the peel line and peel the tape back on itself, low and slow, one strip at a time along the length. Never lift the blank by an edge while any tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Clean both: a CA spot on the blank or the bar, acetone on a rag; a tape adhesive film, isopropyl alcohol. Peel any tape left on the bar and wipe it. No tape, glue or chip left on either."
feed = "hand"

