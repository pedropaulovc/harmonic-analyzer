[[setups.operations]]
instruction = "Degrease the bar's skimmed patch and the blank's face P with isopropyl alcohol and water, half and half; wipe both dry."
feed = "hand"

[[setups.operations]]
instruction = "Lay eleven 6 in strips of the tape across the bar, edge to edge: the first with its left edge 1/8 in right of the scribed line, the others at 1 in pitch to its right (1/4 in gaps). Rub each strip down; peel the liners."
feed = "hand"

[[setups.operations]]
instruction = "Lower the blank onto the tape, B up (the FRONT edge's arrow pointing up), left end on the scribed line, FRONT edge against the combination square's blade held on the bar's front edge. It cannot be moved once down. Lean on it over each strip in turn with the heel of the hand, about 70 lb (the tape wants about 15 psi)."
feed = "hand"

[[setups.operations]]
instruction = "Wait 20 minutes: the tape is taken at half strength, which it reaches by then."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top's high point less the {{process.face_cut_mm:in.4dot}} cut."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the blank at its middle and 1 in in from each end; at the highest of the three: G10 L20 P1 Z{{process.face_z_set_mm:.3f}} (the cut plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "First time only: prove PL03_face in air, Z0 raised 1.000 in; every move stays clear of the step clamps. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PL03_face, watching each move clear the clamps. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PL03_face (M6 T1; set 2800), dry: one level at Z0 over the whole blank, passes along X no wider than {{process.face_stepover_max_mm:in.3dot}}. The blank shifts or lifts: stop; free it, clean off the tape and bond it again."
settings = "platen-em-half-c360"
milling_cuts = [
  { name = "face", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_cut_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

[[setups.operations]]
instruction = "Free the blank: wet the tape along every gap with isopropyl alcohol, wait 2 minutes, then work a thin blade under the blank along each strip from the front edge. Never lever it up by an end or a corner: it must stay flat."
feed = "hand"

[[setups.operations]]
instruction = "Roll the tape off the blank and the bar with a thumb; clean both with isopropyl alcohol. No tape or chip left on either."
feed = "hand"

