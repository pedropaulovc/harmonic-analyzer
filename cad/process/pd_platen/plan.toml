[[setups.operations]]
instruction = "Unclamp nothing yet; there is no waste piece (the margin went to chips). Free the platen by peeling, no solvent soak: slide a single-edge razor blade flat under the bar's tape at the FRONT edge and work it along the whole length a little at a time, then farther in, until the platen comes away with both tapes on it. The tape bends, not the platen."
feed = "hand"

[[setups.operations]]
instruction = "Lay the platen tape up on the surface plate. Hold it down flat with one hand close to the peel line and peel the tape back on itself, low and slow, one strip at a time along the length. The platen is never lifted by an edge while any tape still holds it: a .152 plate bends."
feed = "hand"

[[setups.operations]]
instruction = "Clean the platen: a CA spot, acetone on a rag; a tape adhesive film, isopropyl alcohol. Pick any tape out of the fourteen holes."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburring-set"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends of the fourteen holes and the ten counterbore rims flush with a scraper from the deburring set (no countersink at the sockets)."
feed = "hand"
inspection = "No burr stands proud of either face at a hole; a #2-56 screw still runs through each socket by hand. Binds: run the tap through by hand."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break all twelve outside edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file: the eight round the two faces and the four at the corners. File off any fin the tape left at the bottom of an edge."
feed = "hand"
inspection = "No sharp edge or corner; no burr proud of any face or edge. One left: file it off."
gauge_checks = "other"

[[setups.operations]]
instruction = "Peel the bar's tape and wipe the bar (acetone for CA spots). Unclamp the fixture bar; put the blocks, jacks and clamps away. The bar keeps its skim and pockets for the next platen."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blacken (once the Brass Black is bought)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/finish.svg", alt = "The finished platen, every surface to be blackened: both faces, the four edges, the fourteen holes and the ten counterbores." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}. Start only with Birchwood Casey Brass Black, Birchwood Casey Cleaner-Degreaser and Barricade oil, chemical-resistant gloves and safety glasses in hand: all to buy, none on record. Until then the platen stays bare, tagged AWAITING BRASS BLACK."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the label: severe skin burns and eye damage). Clean the platen with the Cleaner-Degreaser."
feed = "hand"

[[setups.operations]]
instruction = "Scuff both faces and the four edges lightly with the 220 sanding roll for soft metals (the maker: 00 steel wool or abrasive paper). Not in the holes or the counterbores."
feed = "hand"

[[setups.operations]]
instruction = "Degrease again with the Cleaner-Degreaser and rinse with clear water. Hold the platen by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Swab or brush the Brass Black on every surface, into the holes and the counterbores; let it act about one minute (the maker's time). Rinse in cold water; pat dry."
feed = "hand"

[[setups.operations]]
instruction = "One coat is this traveler's finish: the maker's darker repeat needs 0000 steel wool, not on record. Solution and rinse waste to local rules, not down the drain (label: very toxic to aquatic life)."
feed = "hand"

[[setups.operations]]
instruction = "Wipe on Barricade oil; leave it overnight, then wipe off the excess (the maker's step)."
feed = "hand"
inspection = "An even black on both faces and every edge, no bare patch (else degrease, apply again, rinse, dry and oil); a #2-56 screw runs through each socket by hand. Tight: stop and tell the owner; do not re-tap."
gauge_checks = "other"
