# HELD PREVIEW ROUTE: not enrolled in _process_plans.TRAVELER_STEMS and not qualified
# machining instructions. Shared shop values include unmeasured #1413 placeholders, so any
# traveler from this plan is PROVISIONAL and is not approval to machine.
#
# ch_rocker_arm_tl_oblique_base_bar (MHA-CH-06-TL-20 v47): two identical bars, the second
# turned over in the jig. Process intent from the owner's hand-written 2026-10-30 traveler
# (not prechips output) and the v47 drawing (farm run 20261030T220540504Z, machinist SHIP).
# Stock follows the owner ruling in harmonic-analyzer issue #2083: the owned OnlineMetals
# 1173 1/2 x 6 bar is milled to width on edge in the vise, not ripped. The #290 inch drawing
# prints the width as a machined 5.50 (139.7) at the title block's .XX band (+/-0.25).
# Model frame (features.toml): X0 the spindle-end face, Y0 the rail axis (low side -88.9,
# high side +50.8), Z0 the underside seat, Z11.938 the top seat (.47). Face references are bare HAF
# labels; _process_plans.bind_plan binds them to the exported STEP.
part = "ch-rocker-arm-tl-oblique-base-bar"
features = "../../out/features/ch_rocker_arm_tl_oblique_base_bar/features.toml"
construction = "one_piece"
quantity = 2
quantity_cite = ["harmonic-analyzer/cad/config/parts/ch-rocker-arm-tl-oblique-base-bar.yaml:quantity", "AUTHOR'S CHOICE: both bars follow this same route; do not mirror the second"]

[drawing]
number = "MHA-CH-06-TL-20"
revision = "v47"
cite = ["harmonic-analyzer/cad/config/parts/ch-rocker-arm-tl-oblique-base-bar.yaml:ch-rocker-arm-tl-oblique-base-bar.number", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"

[dro.direction]
x = "right"
y = "away"
z = "up"

# One 443 mm blank per bar from the owned 1/2 x 6 bar (#2083): about 1.5 over the 439.928 length at
# each end, the zero edge about 1.0 proud of the finished -Y side, about 0.35 on each big
# face. These placements are the author's route choice, not measurements of a sawn blank.
[stock]
form = "flat_bar"
form_verify = false
material = "6061-T6511 aluminium"
drawing_material = "ALUMINUM FLAT BAR 1/2 x 6 in"
material_verify = false
material_cite = [
  "harmonic-analyzer/cad/config/parts/ch-rocker-arm-tl-oblique-base-bar.yaml:ch-rocker-arm-tl-oblique-base-bar.material_specification",
  "https://github.com/pedropaulovc/harmonic-analyzer/issues/2083 (owner decision 2026-10-30: mill the owned OnlineMetals 1173 1/2 x 6 x 72 in 6061-T6511 bar to width; no bandsaw rip)",
]
on_hand = true
prerequisite = "Saw two 443 mm blanks from the owned 1/2 x 6 bar (miter saw or bandsaw), supporting the long end so it does not drop as the cut finishes; file off the saw burrs. Bar 1 was sawn on 2026-10-29 without a recorded length: measure it. This route's coordinates need a blank at least 443 long; a shorter blank is on HOLD until the route is adjusted for it."
# Catalogue nominal section of OnlineMetals 1173, 6 x 1/2 in = [152.4, 12.7] mm; not a receipt measurement.
section_mm = [152.4, 12.7]
length_mm = 443.0
origin_mm = [-1.5, -89.9, -0.35]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
as_is_faces = []
cite = [
  "https://github.com/pedropaulovc/harmonic-analyzer/issues/2083",
  "Desktop traveler 2026-10-30 Op 10 (hand-written, not prechips): two 443 mm blanks, 1.5 mm to clean up at each end",
  "AUTHOR'S CHOICE: zero edge 1.0 proud (Op 20 'take as little as you can, usually about 1 mm'); 0.35 a face (about 0.35 per side)",
]

[frames.edge-low-up]
origin = [0.0, -88.9, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bar on edge in the vise, zero edge (the -Y side) up; Z0 on the finished zero edge"
cite = ["AUTHOR'S CHOICE", "features.toml bar_low_side.plane y -88.9"]

[frames.edge-high-up]
origin = [0.0, -88.9, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bar on edge, zero edge down on the vise floor; Z0 on the zero edge, so Z reads the width"
cite = ["AUTHOR'S CHOICE", "features.toml bar_low_side.plane y -88.9"]

[frames.table-first]
origin = [0.0, -88.9, 12.35]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: flat on the mill table, the underside seat up, zero edge toward the column; Z0 on the table"
cite = ["AUTHOR'S CHOICE", "plan stock origin_mm z -0.35 + 12.7"]

[frames.table-second]
origin = [439.928, -88.9, 0.0]
x = [-1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: turned end for end onto the faced underside, zero edge still toward the column; Z0 on the table, so Z reads the thickness"
cite = ["AUTHOR'S CHOICE", "features.toml underside_seat.plane z 0"]

[frames.vise-cbore-up]
origin = [0.0, -88.9, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: underside seat (the counterbore side) up in the vise, zero edge on the fixed jaw, zero end on the left; X0 Y0 the back-left corner, Z0 on top. Y reads negative toward you."
cite = ["AUTHOR'S CHOICE", "features.toml bar_spindle_end.plane x 0, bar_low_side.plane y -88.9, underside_seat.plane z 0"]

[frames.bench]
origin = [0.0, -88.9, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bench frame, top seat up"
cite = ["AUTHOR'S CHOICE"]

# ---------------------------------------------------------------------------------------
# E1: 6 in vise, bar on edge gripped across its 12.7 thickness on the vise floor (the setup
# the owner used on 2026-10-29). Mill the first long edge clean: this is the ZERO EDGE.
[[setups]]
id = "E1"
machine = "PM-30MV"
frame = "edge-low-up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "stock"
note = "Provisional: shared shop values include unmeasured #1413 placeholders; not approval to machine. Bar on edge, about 140 mm out each side of the vise. The edge you mill here is the ZERO EDGE: every Y on later sheets is measured from it. Write ZERO EDGE on both faces next to it as soon as it is cut. If it sings, take lighter passes."

[setups.stock_state]
top_z = 1.0
bottom_z = -151.4

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "none"
jaw_center_along_mm = 220.0
grip_mm = 44.945
jaw_above_parallels_mm = 44.945
stop = "none; bar centred along X by eye"
clamp = "grip across the 12.7 thickness, the long raw edge down on the vise floor; tap down with the dead-blow hammer, re-tighten"
align = { indicator = "dti", face = "fixed jaw", over_mm = 100.0, limit_mm = 0.02, cite = "Desktop traveler 2026-10-30: indicate the fixed jaw under 0.02 mm along X, as on 2026-10-29" }

[setups.zero.x]
edge = "left sawn blank end"
edge_mm = -1.5
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.y]
edge = "fixed jaw"
edge_mm = 12.35
from = "+y"
method = "Pick the exposed fixed-jaw face beside the bar before loading."
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "raw top edge over the vise, mid-thickness, at X+220.0 Y+6.0"
method = "paper"
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "bar_low_side"
faces = ["HAF_BAR_LOW_SIDE__P01"]
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
direction = "conventional"
to_z = 0.0
doc_mm = 0.5
rpm = 1250.0
feed_mm_min = 75.0
approach_mm = 5.0
stock_removal_bounds = { x = [-1.5, 441.5], y = [-0.35, 12.35], z = [0.0, 1.0] }
contour = { method = "linear_table", step_mm = 6.0, sweep_frame = "model", sweep_bounds = { x = [-1.5, 441.5], y = [-89.9, -88.9], z = [-0.35, 12.35] } }
note = "Face with the bottom of the cutter until the whole edge is clean; take as little as you can. Feed 75 mm/min."
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 Op 20 step 2"]

# ---------------------------------------------------------------------------------------
