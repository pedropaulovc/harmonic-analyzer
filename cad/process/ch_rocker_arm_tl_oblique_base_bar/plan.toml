# B: bench. Deburr, then check the part and record both bars.
[[setups]]
id = "B"
machine = "finishing-bench"
frame = "bench"
coolant = "none"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "A"
note = "Provisional (#1413 shop placeholders): these checks do not approve the bar for use. Outside a range, don't use the bar until someone has looked at it. Then make the second bar exactly the same way. Don't mirror it: in the jig bar 2 is simply turned over."

[setups.stock_state]
top_z = 11.938
bottom_z = 0.0

[setups.hold]
fixture = "finishing-rest-plate"
pose = { origin_mm = [220.0, -69.85, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "none"

[[setups.ops]]
op = 10
do = "deburr"
feature = "top_seat"
tool = "deburring-tool-noga-ng8150"
note = "Run the deburring tool lightly round every edge, one or two passes, 0.25 mm max; don't scratch the faced seats. Run an 8-32 screw through each rail hole."

[[setups.ops]]
op = 20
do = "inspect"
feature = ["top_seat", "underside_seat"]
checks = { height = "micrometers/0-1in", finish_ra = "roughness-comparator" }
inspection_methods.height = "Micrometer at the four corners and the middle."
inspection_methods.finish_ra = "Both faces: an even swirl, no chatter or tearing, and a fingernail slides across without catching. On the mill table, press each corner: the bar must not rock."

[[setups.ops]]
op = 30
do = "inspect"
feature = "bar_far_end"
checks = { length = "calipers-18in" }

[[setups.ops]]
op = 40
do = "inspect"
feature = ["rail_hole_1", "rail_hole_2", "rail_hole_3", "rail_hole_4", "rail_hole_5", "rail_hole_6", "rail_hole_7"]
checks = { dia = "pin-gauges", thru = "pin-gauges", station = "calipers-18in", height = "calipers-18in", thread = "unknown", note = "unknown" }
inspection_methods.height = "On the top face (no counterbores): put the largest plain pin gauge that enters the hole, diameter D; calipers from the zero edge to the near side of the pin, plus D/2."
inspection_methods.station = "On the top face: largest pin gauge that enters, diameter D; calipers from the zero end to the near side of the pin, plus D/2, for each hole."
inspection_methods.thread = "An 8-32 screw turns in all the way with your fingers."
inspection_methods.note = "The real test: lay the HGR15R rail on the un-marked face, ends flush; all seven #8-32 x 3/4 socket screws start by hand without pushing the rail sideways."

[[setups.ops]]
op = 50
do = "inspect"
feature = ["bracket_hole_1", "bracket_hole_2", "bracket_hole_3", "bracket_hole_4", "bracket_hole_5", "bracket_hole_6", "bracket_hole_7", "bracket_hole_8"]
checks = { dia = "pin-gauges", thru = "pin-gauges", station = "calipers-18in", height = "calipers-18in", note = "unknown" }
inspection_methods.station = "On the top face, the side without the counterbores (there the hole is its 4.98-5.08 drilled size): largest pin gauge that enters, diameter D; calipers from the zero end to the near side of the pin, plus D/2."
inspection_methods.height = "On the top face, the side without the counterbores: largest pin gauge that enters, diameter D; calipers from the zero edge to the near side of the pin, plus D/2."
inspection_methods.note = "A #8 socket screw drops through each hole freely and its head sits below the counterbore face."

[[setups.ops]]
op = 60
do = "inspect"
feature = ["bracket_hole_1_counterbore", "bracket_hole_2_counterbore", "bracket_hole_3_counterbore", "bracket_hole_4_counterbore", "bracket_hole_5_counterbore", "bracket_hole_6_counterbore", "bracket_hole_7_counterbore", "bracket_hole_8_counterbore"]
checks = { dia = "calipers", depth = "calipers" }

[[setups.ops]]
op = 70
do = "inspect"
feature = ["near_slot", "far_slot"]
checks = { width = "calipers", separation = "calipers", station = "calipers-18in", height = "calipers", thru = "unknown" }
inspection_methods.separation = "Slot length minus slot width (about 17.53 - 13.46)."
inspection_methods.height = "Calipers from the zero edge to the near end of the slot, plus half the slot width W you measured."
inspection_methods.thru = "A 1/2-13 T-slot stud slides end to end in each slot. Far slot: at least 1.5 of wall to the far edge."
