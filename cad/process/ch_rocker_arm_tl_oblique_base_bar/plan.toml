  { gauge = "calipers", band_mm = "{{cad.slot1_y_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.slot2_y_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bracket_y1_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bracket_y2_band_mm}}" },
]

[[setups.operations]]
instruction = "Edges R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; clear threads; trial-fit."
instruction_detailed = "Edges R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; clear threads; fit rail/screws and slot stud. Slot near arc centre from ZERO EDGE = near slot end + half the slot width."
feed = "hand"

[setups.operations.table]
columns = ["Inspect", "Requirement"]
rows = [
  ["Overall size", "{{cad.size_summary}} at ends/mid; ends square to ZERO EDGE and faces ±{{cad.angular_tol_deg:g}}°"],
  ["Seats", "No rock on table (bar 1 on C'BORE SIDE, bar 2 opposite RAIL SIDE); no chatter; Ra {{cad.finish_ra_uin:d}} µin"],
  ["Bracket holes", "Bar 1: Ø{{cad.bracket_dia_min_in:.3f}}–{{cad.bracket_dia_max_in:.3f}}; c'bores Ø{{cad.counterbore_dia_min_in:.3f}}–{{cad.counterbore_dia_max_in:.3f}} × {{cad.counterbore_depth_min_in:.3f}}–{{cad.counterbore_depth_max_in:.3f}} deep; #8-32 × 5/8 head recessed"],
  ["Rail fit", "Own HGR15 rail, untrimmed: {{cad.rail_count:d}}× #8-32 × 3/4 enter free; no tip proud of seat. Ends trimmed flush after the fit (TL-00 1D–1F)"],
  ["Slots", "Width {{cad.slot_width_min_in:.2f}}–{{cad.slot_width_max_in:.2f}}; length − width {{cad.slot_spacing_min_in:.2f}}–{{cad.slot_spacing_max_in:.2f}}; 1/2-13 stud slides end-to-end"],
]
