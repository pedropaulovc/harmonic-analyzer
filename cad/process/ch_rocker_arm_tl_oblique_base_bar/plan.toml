# Slots: a 1/2 in (12.7) cutter is smaller than the 13.462 (.53) slot, so its R6.35 cannot
# make the R6.731 ends in one pass, and a single-axis move cannot cut an arc. The 2026-10-30
# traveler's rectangular lap (corners at end centre +/-0.4 in X and Y together) overcuts
# about 0.18 outside the R6.731 at 45 degrees. These ops instead keep every cutter-centre
# point inside the end centres' 0.381 reach along one axis (walls at X +/-0.381, ends at
# Y +/-0.381 on the slot axis), so no point cuts outside the drawn slot. The ends stay at
# least R6.614 from their centres (0.117 under R6.731 at 45 degrees); the print dimensions
# only the .53 +/-.01 (13.46 +/-0.25) width and .16 +/-.01 (4.06 +/-0.25) run, so the end
# form stays a hold for review, not an acceptance.
# No prechips generator prints a closed-slot path (linear_table rasters need an open side,
# a linear profile runs outside its outline), so these ops carry no contour: the sheet leaves
# the cutter path unresolved and the notes give the manual moves. The rough box is the
# slot's box; with the 0.381 leave the kernel removes only the 12.7 cutter's R6.35 sweep.
[[setups.ops]]
op = 510
do = "rough_pocket"
feature = "near_slot"
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
direction = "conventional"
to_z = -12.5
rough_allowance_mm = 0.381
doc_mm = 3.0
rpm = 1250.0
feed_mm_min = 75.0
approach_mm = 5.0
stock_removal_bounds = { x = [15.353, 28.815], y = [-60.071, -42.545], z = [-12.5, 0.0] } # the slot's box; the 0.381 leave keeps the removal to the cutter's R6.35 sweep
note = "First spot (#2 centre drill) and drill a 9.5 starter hole through at the end centre X 22.08 Y -49.28, then from that hole: go 3 mm deep and move Y from end centre -49.28 to -53.34 and back; repeat at 6, 9, 12 and 12.5 (0.56 below the bar)."
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 A12"]

[[setups.ops]]
op = 520
do = "finish_pocket"
feature = "near_slot"
faces = ["HAF_NEAR_SLOT__P01", "HAF_NEAR_SLOT__P02", "HAF_NEAR_SLOT__P03", "HAF_NEAR_SLOT__P04"]
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
direction = "climb"
to_z = -12.5
doc_mm = 12.5
ae_mm = 0.381
rpm = 1250.0
feed_mm_min = 75.0
approach_mm = 5.0
note = "Finishing passes at full depth, one handwheel at a time, cutter centre only: Y from -49.28 to -53.34 at X 21.71 and at X 22.46 (the walls); X from 21.71 to 22.46 at Y -49.28 and at Y -53.34; then at X 22.08, Y out to -48.90 and to -53.72 and back (the end apexes). Never go past these points: a corner move beyond them cuts outside the R6.731 ends. This leaves up to 0.12 on each end at 45 degrees (the ends are R6.61 to R6.73 from their centres, not a true R6.73); the print gives no separate end radius, so the end form is held for review and the width check alone does not accept it. Figures for D 12.70. For another D, let d = (13.46 - D)/2 and REPLACE every listed 0.38 offset from the slot centreline and end centres with d; do not add d to the listed numbers. Width 13.21 to 13.72."
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 A12"]

