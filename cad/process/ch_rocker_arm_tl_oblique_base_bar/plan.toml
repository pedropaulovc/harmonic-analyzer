[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "{{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks marked on the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; bar supported level on saw bed and stands at the cutline." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks from {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar, bar flat on the saw bed."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Mill both long edges"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off; three 1-2-3 blocks flat (1 in up, 3 in across) inboard, near each end and mid-length; long edges overhang ~1.5 in. One strap at mid-width ~1 in in from each end."
datum = "Program BB01 (cam:ch_rocker_arm_tl_oblique_base_bar). X0 = the blank's left end; Y0 = the finished front edge (ZERO EDGE), ({{process.blank_width_in:.3f}} − {{cad.width_in:.3f}})/2 inside the as-bought front edge; Z0 = blank top. X along length; +X cutter right, +Y away; X travel ~18.5 in."
diagram = { file = "diagrams/width.svg", alt = "Blank on three inboard 1-2-3 blocks, near each end and at mid-length, with straps at mid-width of each end; both long edges exposed. Program BB01 alternates the edges pass by pass without moving the bar: front edge with the cutter moving +X (makes ZERO EDGE), opposite edge with the cutter moving −X, both conventional." }
envelope = { x_span_mm = "{{process.edge_x_travel_mm}}", y_span_mm = ["{{cad.blank_width_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.edge_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
# The blocks only push up; the two end straps hold the bar both ways.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_left_x_mm}}", "{{process.strap_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.blank_thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Run BB01: 1/2 in end mill out 1.92 in (48.8 mm) from the collet, as measured (dechatter v11). BB01 alternates the edges pass by pass, both conventional: front edge table −X (cutter +X), opposite edge table +X (cutter −X). Rough ≤ .100 radial, finish .010, two equal depth levels (≤ .30 each), cutter .04–.08 below. No stop between passes. Mark the front edge ZERO EDGE."
instruction_detailed = "Run BB01 (cam:ch_rocker_arm_tl_oblique_base_bar). Set X0 on the blank's left end itself, Y0 on the finished front edge (({{process.blank_width_in:.3f}} − {{cad.width_in:.3f}})/2 inside the as-bought front edge) and Z0 on the blank top. BB01 assumes a {{process.blank_width_in:.3f}} wide bar: the front edge always loses that half-excess, and the opposite edge's first rough pass takes its .100 plus any width over {{process.blank_width_in:.3f}}. Caliper the blank first; more than .020 over, take the excess off the opposite edge by hand before BB01. BB01 alternates the edges pass by pass, both conventional: front edge with the table moving −X (cutter +X), opposite edge with the table moving +X (cutter −X), so no pass returns through the air. Rough passes ≤ .100 radial, then the .010 finish, at two equal depth levels (≤ .30 each) with the cutter .04–.08 below the underside. Every pass plunges to full depth beside a blank end at the edge feed: front-edge passes .10 clear of the left end, opposite-edge passes .25 clear of the right end. Check X0 and that the sawn length is no more than .15 over {{process.blank_length_in:fraction}} before the first pass: a blank end inside those clearances takes a full-depth plunge at cutting feed. Mark the front edge ZERO EDGE."
settings = "em-half-hss-6061-v11-wide"
milling_cuts = [
  { name = "front edge rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 2.54, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "front edge finish", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Opposite edge: in the same BB01 run, no caliper stop. BB01 posts for a .500 cutter: a cutter of Ø D cuts the width D − .500 narrower than {{cad.width_in:.3f}}. Caliper after the program."
instruction_detailed = "Opposite edge: cut in the same BB01 run (above), passes alternating with the front edge, conventional with the table moving +X (cutter −X). The program has no caliper stop: measure the cutter Ø D before running, since BB01 posts for a .500 cutter and a cutter D cuts the width D − .500 narrower than {{cad.width_in:.3f}}. Caliper the width at both ends and the middle after the program."
settings = "em-half-hss-6061-v11-wide"
inspection = "Width at ends/middle."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]
milling_cuts = [
  { name = "opposite edge rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 2.54, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "opposite edge finish", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

# One clamping per bar from the side-2 face to the counterbores (owner ruling
# 2026-11-16, "merge"): the holes keep the ZERO END squared here, with no
# re-clamp between them. NC (cam:ch_rocker_arm_tl_oblique_base_bar): one file
# per bar, BB02 bar 1 and BB03 bar 2, from the side-1 face through the flip
# stop, the side-2 face and the probe's X0 to the last hole, M6 tool changes
# expanded by CNCjs (Main relaying the owner, 2026-11-16). Controller, tool
# setter and touch probe: cad/config/shop-equipment.toml
# cnc.pm-30mv-controller, fixtures.tool-setter-ets and
# gauges.touch-probe-diy0-tp05.
[[setups]]
machine_kind = "other"
title = "Face (Tri Fly), square ends, slots, drill / tap / counterbore in vise"
# The PM-30MV is CNC-converted (GRBL, X/Y ballscrews, ±0.02 mm repeatability:
# cad/config/shop-equipment.toml cnc.pm-30mv); its DRO still reads back.
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter and the 3D touch probe) / vise, swivel off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise indicated <.001 along X. On 1-3/8 in parallels inside the jaw ends; blank centred on the jaw-centre mark by eye (±10 mm), ZERO EDGE at fixed (back) jaw; top {{cad.jaw_standout_in:.2dot}}–{{cad.jaw_standout_blank_in:.2dot}} above jaws. Jacks, touch only: X {{process.jack_left_x_in:.1f}} Y {{process.jack_left_y_in:.1f}}; X {{process.jack_right_x_in:.1f}} Y {{process.jack_right_y_in:.1f}} (X from ZERO END), kept as set through the holes. After the flip, do not unclamp until the counterbores are done."
datum = "One G54 for both bars while the vise and parallels stay put. Z0 = the parallels' top, set once per vise setup (first operation); the faced top is then Z {{cad.thickness_in:.4f}} with no top-face touch-off: the side-2 face makes it so. Y0 = the fixed jaw face (ZERO EDGE), edge-found once per vise setup. X: set roughly once per vise setup from the fixed jaw's left end; after the flip the file's touch probe finds the bar's left end and sets X0 ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside it, where the file squares ZERO END. Drawing Y becomes −Y."
diagram = { file = "diagrams/face.svg", alt = "Bar in vise on 1-3/8 in parallels, ZERO EDGE at fixed jaw, top just above the jaws, jacks touching under both overhangs; the 2 in Tri Fly faces the full length, side 1 then side 2 after an end-for-end flip, Z0 on the parallels' top. Then, without unclamping, the touch probe finds the left end, the 1/2 in end mill squares it (ZERO END) and the right end to length, the upper face is marked (bar 1 C'BORE SIDE, bar 2 RAIL SIDE), the slots are milled and the holes are spotted, drilled, tapped and counterbored." }
# The face cutter runs past both ends; the end cutter centre runs D/2 past
# each end, .04 in below the bar. Deepest: the drill tips; longest tool: a
# drill in the drill chuck; shortest: the 5/16 in counterbore in an R8 collet.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
# Both long edges were milled in Setup 2; ZERO EDGE seats on the fixed jaw.
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.face_jaw_left_x_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# The jacks only push up; the jaws alone hold against the end mills' lift.
# Section at the faced .47 in (side 2 and the ends; side 1 is thicker). The
# slots and holes, cut after the ends, carry the finished-bar beams below.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = ["{{process.face_jaw_left_x_mm}}", "{{process.face_jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
inspection = ["Before unclamping, DRO X from ZERO END: {{cad.rail_range}} at the hole table's X ±{{cad.rail_station_tol_in:.4f}} ({{cad.rail_first_mm:.3f}} + n × {{cad.rail_pitch_mm:.3f}} mm ±{{cad.rail_station_tol_mm:.3f}} mm); bar 1 B1–B2 {{cad.bracket_x1_min_in:.4f}}–{{cad.bracket_x1_max_in:.4f}}, B3–B4 {{cad.bracket_x2_min_in:.4f}}–{{cad.bracket_x2_max_in:.4f}}."]
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.rail_first_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.rail_last_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x1_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x2_band_mm}}" },
]

# Tool lengths (Main relaying the owner, 2026-11-16): there is no touch plate,
# so Z0 is the parallels' top, set with the reference tool (T1) and a gauge
# block, and every tool's length is a CNCjs-made G43.1 offset. The offset is
# the tool's machine Z at the tool setter's trigger (mposz, verified in the
# CNCjs 1.11.5 GrblController tool:change source), so it carries no reference
# value to record and does not depend on Z0, G92 or the previous offset;
# CNCjs' own TLO policy computes from posz, which includes the active offset
# (and FluidNC 3.7.8 reports a changed offset only with its next periodic
# WCO). Touch Plate Height stays free for the WHB04B pendant's Probe-Z. The
# Tri Fly cannot sit on the 20 mm setter plate: a macro sets its offset from a
# gauge-block touch on the fixed jaw top, referenced to T1's at the same touch
# (CNCjs %global variables, kept for the CNCjs session). Z0 stays a T1 touch,
# not a probe touch: the probe's length comes off the tool setter with its
# own or the setter's trigger travel, so a probed Z0 would sit that travel off
# the cutting tools' Z0 until calibrated against a T1 touch.
[[setups.operations]]
instruction = "Once per vise setup, no bar in (detailed sheet for the once-only probe wiring and calibration): CNCjs settings and macros as in the table. T1 (1/2 in end mill) in: console M6 T1. 0.200 in gauge block on a parallel, T1 just dragging on it: G10 L20 P1 Z{{process.touch_block_mm:.3f}}. Block on the fixed jaw top, T1 dragging: macro Record jaw. Edge-find the fixed jaw face: Y0; its left end: X {{cad.vise_centred_overhang_mm:.3f}} − 2.540 mm. Scribe the jaw centre. Then the dry run in air."
instruction_detailed = "Once only, before the first probe use: 1) 6 mm R8 collet in hand (to buy, owner 2026-11-16); the probe is not held any other way. 2) Wiring: the probe's cable red to +5 V (not more: its idle signal sits at the supply), black to GND, yellow to the controller's probe input gpio.5 through a Schottky diode, cathode at the probe signal, anode at gpio.5; the owner changes the FluidNC config's probe pin from gpio.5:high:pd to gpio.5:low:pu. Never wire the signal straight to gpio.5. 3) Calibration, probe in the 6 mm collet, spindle never run: indicate the ball turning the spindle by hand, under 0.01 mm TIR (the probe's four side screws adjust it); ten G38.2 touches on one face of a gauge block, backing off between, trigger positions within 0.01 mm; touch a 1.000 in block from both sides in X: effective ball radius = (right touch X − left touch X − 25.4)/2, within 0.05 mm of process.probe_ball_radius_mm ({{process.probe_ball_radius_mm:.3f}}), else set it there and re-post. Once per vise setup (vise indicated, parallels in, no bar), and again after any change to the CNCjs tool settings: 4) Tool setter (Tormach-style, normally open, 20 mm plate) bolted to the table right of the vise, at least 1 in past the finished bar's right end, its top below the parallels' top ({{process.vise_bed_height_mm:.1f}} + {{process.parallel_height_mm:.3f}} mm above the table): only the end cutter and the drill tips go below that, and only at the bar. 5) CNCjs Tool widget: the settings in the table, Tool Change Policy Manual Tool Change (Custom Probing), the custom commands exactly as in the table; Touch Plate Height stays the pendant's plate (the commands do not read it). 6) T1, the 1/2 in end mill out 1.92 in (48.8 mm): type M6 T1 in the console, follow its two stops (spindle off). 7) Z0: the 0.200 in gauge block on a parallel, lower T1 in .001 steps until the block just drags under it, send G10 L20 P1 Z{{process.touch_block_mm:.3f}}. 8) Jaw reference: block on the fixed jaw top, T1 just dragging, run macro Record jaw (CNCjs keeps it until CNCjs restarts; after a restart, put T1 in, M6 T1, record it again). 9) Edge-find the fixed jaw face: Y0. Edge-find the fixed jaw's left end: set X {{cad.vise_centred_overhang_mm:.3f}} − 2.540 mm (a centred bar's ZERO END, near enough to face by; the file's probe sets the true X0). Scribe the jaw centre on the fixed jaw's top. 10) Dry run in air, the positive control, before the first bar: M6 T1, M6 T3 (#2 centre drill), M6 T1 again, from the console; $# after each: T1's TLO the second time within .0005 in (0.013 mm) of the first, T3's minus T1's equal to their length difference (calipers, collet face to tip) within 0.1 mm, and T1 on the block on the parallel reads Z {{process.touch_block_mm:.3f}} ±.0005. Any miss: stop, recheck the setter's cable and the custom commands."
feed = "hand"

[setups.operations.table]
columns = ["CNCjs", "Set to"]
rows = [
  ["Tool Change Policy", "Manual Tool Change (Custom Probing)"],
  ["Tool Change X/Y/Z", "Jog to a spot clear of the vise where the spindle is easy to reach, Z near its top; Get Position"],
  ["Tool Probe X/Y", "Over the tool setter's plate centre; Get Position"],
  ["Tool Probe Z", "With the longest tool in (the #29 drill in the drill chuck, or the tap in its guide if longer), 5 mm above the plate; Get Position"],
  ["Tool Probe Distance", "Tool Probe Z down to 5 mm below the shortest tool's (5/16 in end mill) trigger, measured by jogging"],
  ["Tool Probe Feedrate", "300 mm/min (the fast seek; the commands re-probe at 20)"],
  ["Custom probe commands", "G91 [tool_probe_command] F[tool_probe_feedrate] Z[tool_probe_z - mposz - tool_probe_distance] | G0 Z2 | G38.2 F20 Z-4 | %wait 1 | %global.tlo = mposz | G43.1 Z[global.tlo]   (one per line, in that order)"],
  ["Macro Record jaw", "%wait | %global.jaw = mposz - global.tlo   (T1, after its M6, on the block on the fixed jaw top)"],
  ["Macro Tri Fly TLO", "%wait | G49 | %global.tlo = mposz - global.jaw | G43.1 Z[global.tlo]   (Tri Fly on the same block on the fixed jaw top)"],
]

[[setups.operations]]
speed_kind = "spindle"
tool = "face-mill"
sizing = "other"
instruction = "Per bar: mic the blank at both ends and mid-length, {{process.blank_thickness_min_in:.3f}}–{{process.blank_thickness_max_in:.3f}}, else stop. Clamp it centred on the jaw mark. Tri Fly in; 0.200 block on the fixed jaw top, an insert just dragging: macro Tri Fly TLO. Run BB02 (bar 1) or BB03 (bar 2): side 1, zigzag along X (ball screws, owner ruling 2026-11-16). At its stop: unclamp, flip end-for-end, side 1 down, ZERO EDGE at the fixed jaw, centred, re-clamp, Cycle Start: side 2 to Z {{cad.thickness_in:.4f}}."
instruction_detailed = "Per bar. Mic the blank at both ends and mid-length: every reading {{process.blank_thickness_min_in:.3f}}–{{process.blank_thickness_max_in:.3f}}, else stop: the file faces side 1 at a fixed Z, half the nominal allowance off, which cleans up only that band. Clamp the blank centred on the jaw mark by eye. Tri Fly (2 in, three TCGT inserts) in the 3/4 in collet, out {{process.face_mill_projection_mm:.1f}} mm. Its length cannot be set on the tool setter: lay the 0.200 in block on the fixed jaw top beside the bar, turn the spindle by hand so one insert is over the block, lower until the insert just drags on it, run macro Tri Fly TLO; the Tri Fly then reads Z as T1 did on the block there. Take the block off the jaw: the first pass of each side runs partly over the fixed jaw. Run BB02 (bar 1) or BB03 (bar 2): side 1, one level, zigzag passes along X (climb on alternate passes: ball screws, owner ruling 2026-11-16), five passes, each taking 1.12 in of the width, the first from the fixed-jaw side. The file then lifts the Tri Fly, stops the spindle and pauses: unclamp, flip end-for-end, side 1 down on the parallels, ZERO EDGE at the fixed jaw, centred on the mark, re-clamp, jacks touching, Cycle Start. Side 2, one level to Z {{cad.thickness_in:.4f}}, the finished top, four passes of 1.38 in. From here the top is at that Z: every later depth is posted from the parallels' top, so do not unclamp."
# Tri Fly at 2500 rpm, .004 in/tooth (owner, 2026-11-16); #2850 keeps the
# dechatter sweep open. Side 1 cuts at most blank max − (blank + finished)/2
# (0.508 mm), side 2 the other half of the nominal allowance (0.381 mm).
# radial_woc_mm is what each posted pass takes of uncut width, the first pass
# included (the recipe's _face_layout; the NC check measures it). Side 1 at
# four passes (34.925 mm) failed prechips milling_deflection: 0.0288 mm at the
# bar end on the 142 mm cantilever past the jaws, over the 0.025 mm finish
# limit, from prechips' axial-force assumption (prechips#429). Five passes of
# 28.448 mm bring it to ~0.0235 mm (force scales with the radial width); side
# 2 keeps four, 35.052 mm (~0.0217 mm). Main, 2026-11-16: neither the jacks
# (they take a push, not lift) nor a narrower blank band is credited instead.
settings = "basebar-trifly-6061-t6511"
milling_cuts = [
  { name = "side 1 face", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = 0.508, radial_woc_mm = 28.448, rpm = 2500, feed_mm_min = 762.0, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "side 2 face", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 3, axial_doc_mm = 0.381, radial_woc_mm = 35.052, rpm = 2500, feed_mm_min = 762.0, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "probe"
sizing = "other"
instruction = "Same file, M6 T8 (SPINDLE OFF - PROBE IN): the 3D touch probe in the 6 mm collet; CNCjs measures it on the tool setter. The file probes the bar's left end at mid-thickness (seek, back off, slow touch) and sets X0 ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside it. Never start the spindle with the probe in."
instruction_detailed = "Same file, M6 T8: CNCjs stops at the tool-change position with the spindle off; put in the 3D touch probe, cable plugged, in the 6 mm R8 collet, Cycle Start; CNCjs probes its ball on the tool setter. The file then moves the probe beside the bar's left end, lowers it to mid-thickness by G38.3 (a bar that is not where expected stops it there, and the next probe move alarms), seeks the end in +X, backs off, touches it again slowly and sets X0 ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside it with G10 L20 P1, allowing the ball's radius ({{process.probe_ball_radius_mm:.3f}} mm). The left end must be within 20 mm of where the vise-setup X puts it. A probe alarm stops the file with both sides faced and nothing else cut: re-centre the bar on its jaw mark, then run the rest of the file from its M6 T8 line (a copy cut there). Never start the spindle with the probe in."
feed = "BB02/BB03 program"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Ends in the same file: at M6 T1 put in the 1/2 in end mill out 1.92 in (48.8 mm), as measured; CNCjs probes it, then set 2250. Cutter .04 below bar, two equal depth levels. Left end conventional (cutter −Y), .020 passes to X0 (ZERO END); right end conventional (cutter +Y), .010 passes to {{cad.length_in:.4f}}. At the next M0: mark ZERO END; mark top: bar 1 C'BORE SIDE, bar 2 RAIL SIDE; caliper the thickness."
instruction_detailed = "Ends in the same BB02/BB03 run. At M6 T1 CNCjs stops at the tool-change position: put in the 1/2 in end mill out 1.92 in (48.8 mm), as measured (dechatter v11), Cycle Start; it probes the tool setter and stops again: set the spindle to 2250, Cycle Start. Measure the blank length before the file: it assumes {{process.blank_length_in:fraction}}, and the first right-end pass takes its .010 plus any excess. More than .013 over (the .6 mm width the narrow setting was measured to), take the excess off by hand first, from the end that is left before the flip (it is the right end after it). The cutter runs .04 below the bar, just past each end, clear of parallels and jacks, at two equal depth levels, ≤ .30 each. Left end: conventional, table moving away from you (cutter −Y), .020 passes to X0. Right end: conventional, table moving toward you (cutter +Y), .010 passes to cutter-centre X = {{cad.length_in:.4f}} + .250. The file then stops at M0 for the slots' spindle speed: there, mark ZERO END on both faces and, with ZERO END left and ZERO EDGE at the back jaw, mark the upper face: bar 1 C'BORE SIDE, bar 2 RAIL SIDE; and caliper the thickness at both ends (inspection): the slots, holes and counterbores are posted for a top at Z {{cad.thickness_in:.4f}}."
settings = "em-half-hss-6061-v11-narrow"
inspection = "At the M0 before the slots: thickness {{cad.thickness_min_in:.4f}}–{{cad.thickness_max_in:.4f}} at both ends (out: stop); DRO X, before unclamping: right end {{cad.length_min_in:.2f}}–{{cad.length_max_in:.2f}} at both edges."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.length_band_mm}}" },
]
milling_cuts = [
  { name = "left end to ZERO END", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 6.477, radial_woc_mm = 0.508, rpm = 2250, feed_mm_min = 400.05, stations_mm = 0 },
  { name = "right end to length", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 6.477, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, stations_mm = "{{cad.blank_length_mm}}" },
]

# Each depth step starts with a slow plunge at the cutter-centre rectangle's
# corner nearest that slot's jack (largest X; S1 .885 in, S2 15.365 in). The
# plunge pushes down, so the jacks carry it: the beam spans jack to jack,
# leaving out the vise between them, which only stiffens it. The traverse
# lifts, so only the jaws hold it (the slot operation's beam).
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "S1–S2 in the same file: at its M0 stop set the spindle to 1250, then cycle start. Each step plunges at the cutter-centre corner nearest that slot's jack."
rpm = 1250
feed = "slow hand plunge"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = ["{{process.jack_left_x_mm}}", "{{process.jack_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 corner plunges", kind = "plunge", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = [22.479, 390.271] },
]

# One cutter makes each slot: the adapter offsets the cutter-centre rectangle
# e = (slot width − process.half_cutter_dia_mm)/2 from the drawing's arc-centre
# line. The cutter actually used cuts its Ø + 2e, so its shop diameter must lie
# in the drawing's width band less 2e.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, ±{{cad.slot_position_tol_in:.2f}}: after each entry, traverse the cutter-centre rectangle; {{process.slot_step_in:.2dot}} steps to {{cad.slot_depth_in:.2f}} deep; {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} arc centres."
instruction_detailed = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, positions ±{{cad.slot_position_tol_in:.2f}}: after each entry plunge (op above), traverse the cutter-centre rectangle at each depth {{cad.slot_depths_in}} below top (light steps: the jacks only push up, so the jaws alone hold the bar down against the end mill's lift). Makes {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} between arc centres."
settings = "basebar-slot-rough-6061-t6511"
inspection = "DRO X: slot centres S1 {{cad.slot1_x_min_in:.2f}}–{{cad.slot1_x_max_in:.2f}}, S2 {{cad.slot2_x_min_in:.2f}}–{{cad.slot2_x_max_in:.2f}}."
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.slot1_x_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.slot2_x_band_mm}}" },
]
# The bar is squared to length here: slot stations sit in the finished frame.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{process.jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 depth steps", kind = "slot", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.slot_step_mm}}", radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1250, feed_mm_min = 127.0, stations_mm = [22.098, 389.89] },
]

