# edge down to 139.7 wide (about 11.7 off).
[[setups]]
id = "E2"
machine = "PM-30MV"
frame = "edge-high-up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "E1"
note = "Width 139.7 (5.50, 139.45 to 139.95) follows the owner's #2083 ruling to mill the owned 1/2 x 6 bar to width on edge, no bandsaw rip. Do both bars before you go on."

[setups.stock_state]
top_z = 151.4
bottom_z = 0.0
bottom_feature = "bar_low_side"

[setups.hold]
fixture = "vise-pm-6"
jaws_along = "x"
fixed_jaw = "rear"
parallels = "none"
jaw_center_along_mm = 220.0
grip_mm = 44.945
jaw_above_parallels_mm = 44.945
stop = "none; bar centred along X by eye"
clamp = "grip across the 12.7 thickness, the zero edge down on the wiped vise floor; tap down with the dead-blow hammer, re-tighten"

[setups.zero.x]
edge = "left sawn blank end"
edge_mm = -1.5
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.y]
edge = "fixed jaw"
edge_mm = 0.35
from = "+y"
method = "Pick the exposed fixed-jaw face beside the bar before loading."
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "calipers-18in"
measure = "bar width, zero edge to the raw top edge"
measure_before_hold = true
offset_mm = 0.0
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "bar_high_side"
faces = ["HAF_BAR_HIGH_SIDE__P01"]
tool = "endmills-tin-10pc/1-2in-2fl"
holder = "r8-collets-lms-4860/1-2in"
direction = "conventional"
to_z = 139.7
doc_mm = 1.0
rpm = 1250.0
feed_mm_min = 75.0
approach_mm = 5.0
stock_removal_bounds = { x = [-1.5, 441.5], y = [-12.35, 0.35], z = [139.7, 151.4] }
contour = { method = "linear_table", step_mm = 6.0, sweep_frame = "model", sweep_bounds = { x = [-1.5, 441.5], y = [50.8, 62.5], z = [-0.35, 12.35] } }
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 Op 20 step 4"]

[[setups.ops]]
op = 20
do = "inspect"
feature = "bar_high_side"
checks = { width = "calipers-18in" }
inspection_methods.width = "Calipers across the two long edges at both ends and in the middle; 139.45 to 139.95 (5.50 +/-.01)."

# ---------------------------------------------------------------------------------------
# T1a/T1b: PM-30MV table, vise off (in the vise the bar top would sit below the jaw tops and
# a facing cutter would hit them). T1a: one strap on each bar end, face the middle. T1b: two
# straps on the faced middle from the front T-slot, end straps off, face both ends.
[[setups]]
id = "T1a"
machine = "PM-30MV"
frame = "table-first"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "E2"
note = "Take the vise off and wipe the table; stone burrs off the table and the bar. One chip under the bar ruins the face. If the bar rocks, slip paper under the low corner; never clamp it flat over a gap: it springs back after the cut. Optional: the same zig-zag can run as a CNCjs facing program with the same depths and feeds."

[setups.stock_state]
top_feature = "underside_seat"
top_z = 12.7
bottom_z = 0.0

[setups.hold]
fixture = "pm30mv-table"
pose = { origin_mm = [220.0, -88.2, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-table", restraint = "press", pose = { origin_mm = [1.0, -88.2, 12.7], x = [-1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "left bar end, toe about 15 mm in; stud in the centre T-slot beyond the end, step block a little higher than the bar" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-table", restraint = "press", pose = { origin_mm = [439.0, -88.2, 12.7], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "right bar end, set like C1" },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
# Desktop traveler 2026-10-30 Op 30: a strap toe on each bar end.
clamp = "AUTHOR'S CHOICE: the bar flat on the table along X, zero edge toward the column, a strap toe on each bar end"

[setups.zero.x]
edge = "left sawn blank end"
edge_mm = -1.5
from = "-x"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.y]
edge = "zero edge (column side)"
edge_mm = 0.0
from = "+y"
tool = "edge-finder"
holder = "r8-collets-lms-4860/3-8in"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "bar thickness at the marked spot: the middle of the bar, X 220, 15 mm in from the zero edge"
edge = "the marked spot, flat on the table (not over any paper), at X+220.0 Y-15.0"
measure_before_hold = true
offset_mm = 0.0
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "rough_face"
feature = "underside_seat"
faces = ["HAF_UNDERSIDE_SEAT__P01"]
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
direction = "conventional"
to_z = 12.45
rough_allowance_mm = 0.1
doc_mm = 0.25
rpm = 840.0
feed_mm_min = 85.0
approach_mm = 5.0
stock_removal_bounds = { x = [15.5, 424.5], y = [-139.7, 0.0], z = [12.35, 12.7] }
contour = { method = "linear_table", step_mm = 15.0, sweep_frame = "model", sweep_bounds = { x = [34.53, 405.47], y = [-88.9, 50.8], z = [-0.35, 0.0] } }
note = "Stay between the listed X ends: the end straps reach in to X 13.7 and from X 426.3. The ends are faced in the next setup."
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 Op 30 step 6 (feeds are the author's choice, not chart values)"]

[[setups.ops]]
op = 20
do = "finish_face"
feature = "underside_seat"
faces = ["HAF_UNDERSIDE_SEAT__P01"]
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
direction = "conventional"
to_z = 12.35
doc_mm = 0.1
rpm = 840.0
feed_mm_min = 60.0
approach_mm = 5.0
stock_removal_bounds = { x = [15.5, 424.5], y = [-139.7, 0.0], z = [12.35, 12.45] }
contour = { method = "linear_table", step_mm = 15.0, sweep_frame = "model", sweep_bounds = { x = [34.53, 405.47], y = [-88.9, 50.8], z = [-0.35, 0.0] } }
note = "Finish pass 0.10 over the clamped middle at 60 mm/min. Stop if you see chatter marks."
note_cite = ["Desktop traveler 2026-10-30 (hand-written, not prechips): LittleMachineShop cutting-speed chart row Wrought aluminum 6061-T6, https://littlemachineshop.com/pages/cutting-speeds; PM-30MV tops out at 3000 rpm", "Desktop traveler 2026-10-30 Op 30 step 8"]

[[setups]]
id = "T1b"
machine = "PM-30MV"
frame = "table-first"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "T1a"
note = "Do not move the bar, the knee or the quill lock. Put the two front straps on the faced middle, then take the end straps off. Check Z on the faced middle (it must read its faced height) and face both ends to the same Z."

[setups.stock_state]
top_feature = "underside_seat"
top_z = 12.7
bottom_z = 0.0

[setups.hold]
fixture = "pm30mv-table"
pose = { origin_mm = [220.0, -88.2, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-table", restraint = "press", pose = { origin_mm = [150.0, -113.6, 12.35], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "toe on the faced middle at X 150, Y -113.6 (26 mm in from the front edge), paper under the toe; stud in the front T-slot at Y -151.7" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-table", restraint = "press", pose = { origin_mm = [290.0, -113.6, 12.35], x = [0.0, -1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "the same as C1, at X 290" },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "AUTHOR'S CHOICE: two straps from the front T-slot on the faced middle; the end passes keep clear of them (72 mm keep-out circles round each strap toe and nut)"

[setups.zero.x]
edge = "left sawn blank end"
