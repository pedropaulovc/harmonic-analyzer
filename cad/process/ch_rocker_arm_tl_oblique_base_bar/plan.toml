# Source: Pedro's 2026-11-05 hand traveler
# ch-rocker-arm-tl-oblique-base-bar-traveler-2026-11-05.html (open PR #2218,
# branch process/basebar-traveler-logbook-advice; drawing v47), including its
# vise workholding: 1-3/8 in parallels and the HHIP 3901-0079 jack, recorded in
# cad/config/shop-equipment.toml with that sheet's ownership status.
# Both ends are squared in the facing clamping (2026-11-14 blind traveler
# review, item 1, and the milling_deflection check): the former table-strapped
# squaring left the ends on a 221 mm cantilever (0.057 mm, refused).
# v48/v49 drawing: bar 1 alone carries the four #12 bracket holes. Owner
# rulings 2026-11-16: the rail holes are drilled at their printed stations
# (±0.05 mm from ZERO END) on the CNC, "Rail holes CNC at ±0.05 mm OK" (the
# part yaml's RV-04): Setup 3 spots and drills R1–R8 from programs BB05 and
# BB07 of cam:ch_rocker_arm_tl_oblique_base_bar, whose posted cutter
# positions are the stations. "merge": the facing, ends, slots and holes are
# one clamping per bar (Setup 3), so the holes keep the ZERO END and ZERO EDGE
# they were squared and edge-found in. Each bar's untrimmed rail is fitted to
# it, then trimmed flush with both ends (MHA-CH-06-TL-00 steps 1D–1F). Bar 2
# (drawing sheet 2) swaps the seats: its rail seats on the face that is far in
# the front view (up in Setup 3 after the side-2 face) and its near face seats
# on the mill table. The manifest describes bar 1 only, so the per-bar face
# text below is authored from the two drawing sheets, not bound.
title = "Oblique trammel base bar — bar 1 and bar 2"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium (shop's pick; the sheet says aluminum flat bar)"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks."
note = "Inches unless mm. Finished {{cad.size_summary}}. Bar 2: no bracket holes; rail/table faces swapped. Run both bars through Setup 2, then each bar through Setup 3, one vise clamping from the side-2 face on. All spindle work is on the PM-30MV low belt (100–2800 rpm): no belt change."
shop = "../shop.toml"
material_key = "6061-t6511"
milling_material = "aluminum_6061"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_base_bar/features.toml"
adapter = "harmonic_base_bar"

[parameters]
# drill_pecking: BB07 posts G83 full-retract pecks of one #29 Ø (.136 in).
rail_peck_mm = 3.4544
blank_length_in = 17.4375
blank_width_in = 6.0
blank_thickness_in = 0.5
quantity = 2
width_rough_allowance_in = 0.015
slot_breakthrough_in = 0.02
# Slot depth step: the slots sit on the jaws' 4.7 in cantilever with nothing
# holding the bar down against the end mill's lift, so steps stay light
# (milling_deflection: .13 steps, 0.059 mm at S1, refused; .05 steps pass).
slot_step_in = 0.05
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). The archived
# inventory is archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
edge_x_travel_mm = 469.9         # Edge setup datum: required X travel ~18.5 in.
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in face up.
parallel_height_mm = 34.925      # 1-3/8 in parallels (vise setups).
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Vise holds centre the bar on the jaws, both ends out over jacks: the adapter
# binds cad.vise_centred_overhang_mm = (finished length − jaw width)/2.
# Jack centres (DRO X/Y), set in Setup 3 under the slot entries and the end
# holes. Left jack centre to feature edge 1.21 in (R1), 2.07
# (S1), 2.15 (B2 counterbore), 1.10 (front edge); right jack 0.95 (B4
# counterbore), 1.52 (right end). The adapter refuses a jack centre off the
# bar or inside a hole, counterbore or slot.
jack_left_x_in = 1.3
jack_left_y_in = -4.4
jack_right_x_in = 15.8
jack_right_y_in = -1.8
edge_cut_tip_z_mm = -2.032       # Edge cutter .04–.08 in below the underside.
end_cut_tip_z_mm = -1.016        # End cutter .04 in below the bar.
# Deepest side-milling level the 1/2 in end mill's settings were measured at
# (shop.toml settings.em-half-hss-6061-v11-*, dechatter v11). Edges and ends
# go down in equal levels no deeper than this: edges 2 x 7.366 mm
# ((blank thickness + .08 in)/2), ends 2 x 6.477 mm ((thickness + .04 in)/2).
# Edge roughing width is 4.1 mm (.161 in), the low end of dechatter's stable
# 4.1-4.7 at 2250 rpm (owner ruling 2026-11-16 on prechips#430). The edge
# roughs declare their finish pass and its stock: Y is judged against the
# .010 finish stock, and Z is skipped because the cutter passes below the
# underside (edge_cut_tip_z_mm). Without that declaration 4.1 reads 0.127 mm
# along Z against the 0.1 mm rough limit (prechips 0.11.3, 170 N).
side_max_stepdown_mm = 7.62
drill_tip_z_mm = -3.175          # Drill tips .125 in past the underside.
half_cutter_dia_mm = 12.7        # 1/2 in end mill; also cuts the slots.
face_cutter_dia_mm = 19.05       # 3/4 in end mill.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Archive LMS 6784 set projections from the R8 collet grow with size: 3/16 and
# 1/4 in 25, 3/8 in 38, 7/16 in 41, 11/16 in 50, 3/4 in 57. The 1/2 and 5/16 in
# cutters have no member record, so they are bounded by their neighbours.
half_mill_projection_min_mm = 41.0
half_mill_projection_max_mm = 50.0
face_mill_projection_mm = 57.0
small_mill_projection_min_mm = 25.0
# Archive drill-index-115 13/32 in member, 112.8 out of drill-chuck-r8: a
# recorded jobber above both drills here, so it bounds the longest drill.
drill_projection_max_mm = 112.8
# Milling-deflection stations, mm from ZERO END, all bound by the adapter:
# Setup 2's straps cad.strap_left_x_mm/strap_right_x_mm (strap_inset_mm in
# from each blank end); Setup 3's jaws on the centred blank
# (cad.blank_centred_overhang_mm/blank_centred_jaw_right_mm) and, after the
# ends, on the finished bar that equal trims leave centred in the same
# clamping (cad.vise_centred_overhang_mm/vise_centred_jaw_right_mm); the
# jacks (cad.jack_left_x_mm/jack_right_x_mm); rail stations by end
# (cad.rail_left_x_mm/rail_right_x_mm), bracket columns
# (cad.bracket_x1_mm/bracket_x2_mm), slot centres (cad.slot_x_mm) and slot
# entry corners (cad.slot_entry_x_mm).
strap_inset_mm = 25.4            # One strap at mid-width ~1 in in from each end.

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "em-half"
name = "1/2 in end mill"
ref = "basebar-em-half"
[[tools]]
id = "em-face"
name = "3/4 in end mill"
ref = "basebar-em-face"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "basebar-spot"
[[tools]]
id = "rail-drill"
name = "#29 drill"
ref = "basebar-rail-drill"
[[tools]]
id = "bracket-drill"
name = "#12 drill"
ref = "basebar-bracket-drill"
[[tools]]
id = "tap"
name = "8-32 tap"
ref = "basebar-tap"
[[tools]]
id = "counterbore"
name = "5/16 in end mill"
ref = "basebar-counterbore"

[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "{{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks marked on the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; bar supported level on saw bed and stands at the cutline." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks from {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar, bar flat on the saw bed."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Mill both long edges"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off; three 1-2-3 blocks flat (1 in up, 3 in across) inboard, near each end and mid-length; long edges overhang ~1.5 in. One strap at mid-width ~1 in in from each end."
datum = "Program BB01 (cam:ch_rocker_arm_tl_oblique_base_bar). X0 = the blank's left end; Y0 = the finished front edge (ZERO EDGE), ({{process.blank_width_in:.3f}} − {{cad.width_in:.3f}})/2 inside the as-bought front edge; Z0 = blank top. X along length; +X cutter right, +Y away; X travel ~18.5 in."
diagram = { file = "diagrams/width.svg", alt = "Blank on three inboard 1-2-3 blocks, near each end and at mid-length, with straps at mid-width of each end; both long edges exposed. Program BB01 alternates the edges pass by pass without moving the bar: front edge with the cutter moving +X (makes ZERO EDGE), opposite edge with the cutter moving −X, both conventional." }
envelope = { x_span_mm = "{{process.edge_x_travel_mm}}", y_span_mm = ["{{cad.blank_width_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.edge_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
# The blocks only push up; the two end straps hold the bar both ways.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{cad.strap_left_x_mm}}", "{{cad.strap_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.blank_thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run BB01: 1/2 in end mill out 1.92 in (48.8 mm) from the collet, as measured (dechatter v11). BB01 alternates the edges pass by pass, both conventional: front edge table −X (cutter +X), opposite edge table +X (cutter −X). Rough ≤ .161 radial, finish .010, two equal depth levels (≤ .30 each), cutter .04–.08 below. No stop between passes. Mark the front edge ZERO EDGE."
instruction_detailed = "Run BB01 (cam:ch_rocker_arm_tl_oblique_base_bar). Set X0 on the blank's left end itself, Y0 on the finished front edge (({{process.blank_width_in:.3f}} − {{cad.width_in:.3f}})/2 inside the as-bought front edge) and Z0 on the blank top. BB01 assumes a {{process.blank_width_in:.3f}} wide bar: the front edge always loses that half-excess, and the opposite edge's first rough pass takes its .161 plus any width over {{process.blank_width_in:.3f}}. Caliper the blank first; more than .020 over, take the excess off the opposite edge by hand before BB01. BB01 alternates the edges pass by pass, both conventional: front edge with the table moving −X (cutter +X), opposite edge with the table moving +X (cutter −X), so no pass returns through the air. Rough passes ≤ .161 radial, then the .010 finish, at two equal depth levels (≤ .30 each) with the cutter .04–.08 below the underside. Every pass plunges to full depth beside a blank end at the edge feed: front-edge passes .10 clear of the left end, opposite-edge passes .25 clear of the right end. Check X0 and that the sawn length is no more than .15 over {{process.blank_length_in:fraction}} before the first pass: a blank end inside those clearances takes a full-depth plunge at cutting feed. Mark the front edge ZERO EDGE."
settings = "em-half-hss-6061-v11-wide"
milling_cuts = [
  { name = "front edge rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 4.1, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"], finish_cut = "front edge finish", finish_stock_mm = { y = 0.254, z = "through" } },
  { name = "front edge finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Opposite edge: in the same BB01 run, no caliper stop. BB01 posts for a .500 cutter: a cutter of Ø D cuts the width D − .500 narrower than {{cad.width_in:.3f}}. Caliper after the program."
instruction_detailed = "Opposite edge: cut in the same BB01 run (above), passes alternating with the front edge, conventional with the table moving +X (cutter −X). The program has no caliper stop: measure the cutter Ø D before running, since BB01 posts for a .500 cutter and a cutter D cuts the width D − .500 narrower than {{cad.width_in:.3f}}. Caliper the width at both ends and the middle after the program."
settings = "em-half-hss-6061-v11-wide"
inspection = "Width at ends/middle."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]
milling_cuts = [
  { name = "opposite edge rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 4.1, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"], finish_cut = "opposite edge finish", finish_stock_mm = { y = 0.254, z = "through" } },
  { name = "opposite edge finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 7.366, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

# One clamping per bar from the side-2 face to the counterbores (owner ruling
# 2026-11-16, "merge"): the holes keep the ZERO END squared and the ZERO EDGE
# edge-found here, with no re-clamp or second edge-find between them.
[[setups]]
machine_kind = "other"
title = "Face, square ends, slots, drill / tap / counterbore in vise"
# The PM-30MV is CNC-converted (GRBL, X/Y ballscrews, ±0.02 mm repeatability:
# cad/config/shop-equipment.toml cnc.pm-30mv); its DRO still reads back.
machine = "PM-30MV CNC (GRBL) / vise, swivel off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise indicated <.001 along X. On 1-3/8 in parallels inside the jaw ends; blank centred, ZERO EDGE at fixed (back) jaw; top {{cad.jaw_standout_in:.2dot}}–{{cad.jaw_standout_blank_in:.2dot}} above jaws. Jacks, touch only: X {{process.jack_left_x_in:.1f}} Y {{process.jack_left_y_in:.1f}}; X {{process.jack_right_x_in:.1f}} Y {{process.jack_right_y_in:.1f}} (X from ZERO END), kept as set through the holes. After the side-2 face, do not unclamp until the counterbores are done."
datum = "Facing: Z0 underside from measured thickness. Y0: edge-find ZERO EDGE once at the fixed jaw; it stays there through the flip. After the side-2 face, for the ends, slots and holes: X0 = ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside the faced blank's left end, which BB04 squares to ZERO END; Z0 = top face; drawing Y becomes −Y."
diagram = { file = "diagrams/face.svg", alt = "Bar in vise on 1-3/8 in parallels, ZERO EDGE at fixed jaw, top just above the jaws, jacks touching under both overhangs; 3/4 in end mill faces the full length, side 1 then side 2 after an end-for-end flip. Then, without unclamping, the 1/2 in end mill squares the left end (ZERO END) and the right end to length, the upper face is marked (bar 1 C'BORE SIDE, bar 2 RAIL SIDE), the slots are milled and the holes are spotted, drilled, tapped and counterbored." }
# The face cutter runs past both ends; the end cutter centre runs D/2 past
# each end, .04 in below the bar. Deepest: the drill tips; longest tool: a
# drill in the drill chuck; shortest: the 5/16 in counterbore in an R8 collet.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
# Both long edges were milled in Setup 2; ZERO EDGE seats on the fixed jaw.
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.blank_centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# The jacks only push up; the jaws alone hold against the end mills' lift.
# Section at the faced .47 in (side 2 and the ends; side 1 is thicker). The
# slots and holes, cut after the ends, carry the finished-bar beams below.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = ["{{cad.blank_centred_overhang_mm}}", "{{cad.blank_centred_jaw_right_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" }, vise_left = "start" }
inspection = ["Before unclamping, DRO X from ZERO END: {{cad.rail_range}} at the hole table's X ±{{cad.rail_station_tol_in:.4f}} ({{cad.rail_first_mm:.3f}} + n × {{cad.rail_pitch_mm:.3f}} mm ±{{cad.rail_station_tol_mm:.3f}} mm); bar 1 B1–B2 {{cad.bracket_x1_min_in:.4f}}–{{cad.bracket_x1_max_in:.4f}}, B3–B4 {{cad.bracket_x2_min_in:.4f}}–{{cad.bracket_x2_max_in:.4f}}."]
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.rail_first_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.rail_last_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x1_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x2_band_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
drilling = "none"
sizing = "other"
instruction = "Face full length by programs BB02/BB03: zigzag passes along X (climb on alternate passes: ball screws, owner ruling 2026-11-16), .60 stepover, .02 past each edge. Side 1: one level, ~half the allowance. Flip end-for-end, ZERO EDGE at fixed jaw; side 2: one level to {{cad.thickness_in:.4f}}."
# TODO(#2850): facing is ~107 min of the two bars' cutting at these chart
# speeds (850 rpm, .002 in/tooth); measure the 3/4 in face mill with dechatter
# and move to a measured record as the edges did (#2846).
settings = "basebar-face-6061-t6511"
milling_cuts = [
  { name = "side 1 face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.381, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "side 2 face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.381, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Ends by program BB04 (spindle 2250), 1/2 in end mill out 1.92 in (48.8 mm), as measured. X0 = ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside the faced blank's left end. Cutter .04 below bar, two equal depth levels. Left end conventional (cutter −Y), .020 passes to X0 (ZERO END); right end conventional (cutter +Y), .010 passes to {{cad.length_in:.4f}}. At BB04's M0 stop: mark ZERO END; mark top: bar 1 C'BORE SIDE, bar 2 RAIL SIDE."
instruction_detailed = "Ends by program BB04 (spindle 2250). Edge-find the faced blank's left end and set X0 ({{process.blank_length_in:.4f}} − {{cad.length_in:.4f}})/2 inside it: BB04 squares that end to X0, which becomes ZERO END. Measure the blank length first: BB04 assumes {{process.blank_length_in:fraction}}, and its first right-end pass takes its .010 plus any excess. More than .013 over (the .6 mm width the narrow setting was measured to), take the excess off the right end by hand first. The cutter runs .04 below the bar, just past each end, clear of parallels and jacks, at two equal depth levels, ≤ .30 each. Left end: conventional, table moving away from you (cutter −Y), .020 passes to X0. Right end: conventional, table moving toward you (cutter +Y), .010 passes to cutter-centre X = {{cad.length_in:.4f}} + .250. BB04 then stops at M0 for the slots' spindle speed: there, mark ZERO END on both faces and, with ZERO END left and ZERO EDGE at the back jaw, mark the upper face: bar 1 C'BORE SIDE, bar 2 RAIL SIDE."
settings = "em-half-hss-6061-v11-narrow"
inspection = "DRO X, before unclamping: right end {{cad.length_min_in:.2f}}–{{cad.length_max_in:.2f}} at both edges."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.length_band_mm}}" }]
milling_cuts = [
  { name = "left end to ZERO END", kind = "side", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 6.477, radial_woc_mm = 0.508, rpm = 2250, feed_mm_min = 400.05, stations_mm = 0 },
  { name = "right end to length", kind = "side", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 6.477, radial_woc_mm = 0.254, rpm = 2250, feed_mm_min = 400.05, stations_mm = "{{cad.blank_length_mm}}" },
]

# Each depth step starts with a slow plunge at the cutter-centre rectangle's
# corner nearest that slot's jack (cad.slot_entry_x_mm). The
# plunge pushes down, so the jacks carry it: the beam spans jack to jack,
# leaving out the vise between them, which only stiffens it. The traverse
# lifts, so only the jaws hold it (the slot operation's beam).
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "S1–S2 in the same BB04 run: at its M0 stop set the spindle to 1250, then cycle start. Each step plunges at the cutter-centre corner nearest that slot's jack."
rpm = 1250
feed = "slow hand plunge"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = ["{{cad.jack_left_x_mm}}", "{{cad.jack_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 corner plunges", kind = "plunge", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = "{{cad.slot_entry_x_mm}}" },
]

# One cutter makes each slot: the adapter offsets the cutter-centre rectangle
# e = (slot width − process.half_cutter_dia_mm)/2 from the drawing's arc-centre
# line. The cutter actually used cuts its Ø + 2e, so its shop diameter must lie
# in the drawing's width band less 2e.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, ±{{cad.slot_position_tol_in:.2f}}: after each entry, traverse the cutter-centre rectangle; {{process.slot_step_in:.2dot}} steps to {{cad.slot_depth_in:.2f}} deep; {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} arc centres."
instruction_detailed = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, positions ±{{cad.slot_position_tol_in:.2f}}: after each entry plunge (op above), traverse the cutter-centre rectangle at each depth {{cad.slot_depths_in}} below top (light steps: the jacks only push up, so the jaws alone hold the bar down against the end mill's lift). Makes {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} between arc centres."
settings = "basebar-slot-rough-6061-t6511"
inspection = "DRO X: slot centres S1 {{cad.slot1_x_min_in:.2f}}–{{cad.slot1_x_max_in:.2f}}, S2 {{cad.slot2_x_min_in:.2f}}–{{cad.slot2_x_max_in:.2f}}."
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.slot1_x_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.slot2_x_band_mm}}" },
]
# The bar is squared to length here: slot stations sit in the finished frame.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{cad.vise_centred_jaw_right_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 depth steps", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.slot_step_mm}}", radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1250, feed_mm_min = 127.0, stations_mm = "{{cad.slot_x_mm}}" },
]

[setups.operations.table]
columns = ["Slot", "X", "Arc-centre Y", "Cutter-centre X", "Cutter-centre Y"]
rows = "{{cad.slot_rows}}"

# Holes, same clamping. End mills lift: only the jaws hold them. Drills and
# the counterbore plunge push down, so each end's jack carries that end's
# hole thrust (operation beams).
[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Spot all holes Ø.125: R1–R8 on the CNC by program BB05 (cam:ch_rocker_arm_tl_oblique_base_bar), rail X ±{{cad.rail_station_tol_in:.4f}} as posted; {{cad.bracket_range}} bar 1 only by DRO, X/Y ±{{cad.bracket_position_tol_in:.3f}}. Drill tips .125 past underside. Rail row ±{{cad.rail_row_tol_in:.2f}}."
rpm = 2800
feed = "BB05 program (R1–R8); hand (B1–B4)"
# Spotting cones are drilled away later; the jaws alone carry them.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{cad.vise_centred_jaw_right_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "spot R1–R4", kind = "drill", phase = "rough", cutter_dia_mm = 3.175, flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = "{{cad.rail_left_x_mm}}" },
  { name = "spot B1–B2", kind = "drill", phase = "rough", cutter_dia_mm = 3.175, flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = "{{cad.bracket_x1_mm}}" },
  { name = "spot R5–R8", kind = "drill", phase = "rough", cutter_dia_mm = 3.175, flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = "{{cad.rail_right_x_mm}}" },
  { name = "spot B3–B4", kind = "drill", phase = "rough", cutter_dia_mm = 3.175, flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = "{{cad.bracket_x2_mm}}" },
]

[setups.operations.table]
columns = ["Holes", "X", "Y"]
rows = "{{cad.hole_rows}}"

