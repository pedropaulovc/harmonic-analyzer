# Source: Pedro's 2026-11-05 hand traveler
# ch-rocker-arm-tl-oblique-base-bar-traveler-2026-11-05.html (open PR #2218,
# branch process/basebar-traveler-logbook-advice; drawing v47), including its
# vise workholding: 1-3/8 in parallels and the HHIP 3901-0079 jack, recorded in
# cad/config/shop-equipment.toml with that sheet's ownership status.
# Both ends are squared in the facing clamping (2026-11-14 blind traveler
# review, item 1, and the milling_deflection check): the former table-strapped
# squaring left the ends on a 221 mm cantilever (0.057 mm, refused).
# v48/v49 drawing: bar 1 alone carries the four #12 bracket holes; rail
# stations are REF, transferred from each bar's own trimmed rail (flush both
# ends, MHA-CH-06-TL-00 steps 1D-1G). Bar 2 (drawing sheet 2) swaps the seats:
# its rail seats on the face that is far in the front view (up in Setup 4) and
# its near face seats on the mill table. The manifest describes bar 1 only, so
# the per-bar face text below is authored from the two drawing sheets, not
# bound.
title = "Oblique trammel base bar — bar 1 and bar 2"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium (shop's pick; the sheet says aluminum flat bar)"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks."
note = "Inches unless mm. Finished {{cad.size_summary}}. Bar 2: no bracket holes; rail/table faces swapped. Run both bars through Setups 2–3 (low belt range), then Setup 4 (high range): one belt change."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_base_bar/features.toml"
adapter = "harmonic_base_bar"

[parameters]
blank_length_in = 17.4375
blank_width_in = 6.0
blank_thickness_in = 0.5
quantity = 2
width_rough_allowance_in = 0.015
slot_breakthrough_in = 0.02
# Slot depth step: the slots sit on the jaws' 4.7 in cantilever with nothing
# holding the bar down against the end mill's lift, so steps stay light
# (milling_deflection: .13 steps, 0.059 mm at S1, refused; .05 steps pass).
slot_step_in = 0.05
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). The archived
# inventory is archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
edge_x_travel_mm = 469.9         # Edge setup datum: required X travel ~18.5 in.
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in face up.
parallel_height_mm = 34.925      # 1-3/8 in parallels (vise setups).
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Vise holds centre the bar on the jaws, both ends out over jacks: the adapter
# binds cad.vise_centred_overhang_mm = (finished length − jaw width)/2.
# Jack centres (DRO X/Y), set in Setup 3 under the slot entries and kept for
# Setup 4's end holes. Left jack centre to feature edge 1.21 in (R1), 2.07
# (S1), 2.15 (B2 counterbore), 1.10 (front edge); right jack 0.95 (B4
# counterbore), 1.52 (right end). The adapter refuses a jack centre off the
# bar or inside a hole, counterbore or slot.
jack_left_x_in = 1.3
jack_left_y_in = -4.4
jack_right_x_in = 15.8
jack_right_y_in = -1.8
edge_cut_tip_z_mm = -2.032       # Edge cutter .04–.08 in below the underside.
end_cut_tip_z_mm = -1.016        # End cutter .04 in below the bar.
drill_tip_z_mm = -3.175          # Drill tips .125 in past the underside.
half_cutter_dia_mm = 12.7        # 1/2 in end mill; also cuts the slots.
face_cutter_dia_mm = 19.05       # 3/4 in end mill.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Archive LMS 6784 set projections from the R8 collet grow with size: 3/16 and
# 1/4 in 25, 3/8 in 38, 7/16 in 41, 11/16 in 50, 3/4 in 57. The 1/2 and 5/16 in
# cutters have no member record, so they are bounded by their neighbours.
half_mill_projection_min_mm = 41.0
half_mill_projection_max_mm = 50.0
face_mill_projection_mm = 57.0
small_mill_projection_min_mm = 25.0
# Archive drill-index-115 13/32 in member, 112.8 out of drill-chuck-r8: a
# recorded jobber above both drills here, so it bounds the longest drill.
drill_projection_max_mm = 112.8
# Milling-deflection stations, mm along X (bindings cannot do arithmetic).
# Setup 2: one strap at mid-width ~1 in in from each blank end.
strap_left_x_mm = 25.4           # 1 in.
strap_right_x_mm = 417.5125      # 17.4375 in blank (442.9125) − 25.4.
# Setup 3: the blank centred in the 6.247 in jaws.
face_jaw_left_x_mm = 142.11935   # (442.9125 blank − 158.6738 jaw)/2.
face_jaw_right_x_mm = 300.79315  # face_jaw_left_x_mm + 158.6738.
# Setup 4: the finished bar centred (cad.vise_centred_overhang_mm 140.6271).
jaw_right_x_mm = 299.3009        # 140.6271 + 158.6738 jaw width.
jack_left_x_mm = 33.02           # jack_left_x_in 1.3 × 25.4.
jack_right_x_mm = 401.32         # jack_right_x_in 15.8 × 25.4.
# Hole and slot centres from ZERO END, written inline in the cuts below
# (parameters are scalars): rail REF stations R1–R8 = 9.964 + 60 n
# (cad.rail_x_mm), bracket stations 47.484 (B1–B2) and 428.0 (B3–B4), slots
# S1 .87 in = 22.098 and S2 15.35 in = 389.89.

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "em-half"
name = "1/2 in end mill"
ref = "basebar-em-half"
[[tools]]
id = "em-face"
name = "3/4 in end mill"
ref = "basebar-em-face"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "basebar-spot"
[[tools]]
id = "rail-drill"
name = "#29 drill"
ref = "basebar-rail-drill"
[[tools]]
id = "bracket-drill"
name = "#12 drill"
ref = "basebar-bracket-drill"
[[tools]]
id = "tap"
name = "8-32 tap"
ref = "basebar-tap"
[[tools]]
id = "counterbore"
name = "5/16 in end mill"
ref = "basebar-counterbore"

[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "{{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks marked on the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; bar supported level on saw bed and stands at the cutline." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:fraction}} in blanks from {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar, bar flat on the saw bed."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Mill both long edges"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off; three 1-2-3 blocks flat (1 in up, 3 in across) inboard, near each end and mid-length; long edges overhang ~1.5 in. One strap at mid-width ~1 in in from each end."
datum = "Front edge becomes ZERO EDGE. X along length; +X cutter right, +Y away; X travel ~18.5 in."
diagram = { file = "diagrams/width.svg", alt = "Blank on three inboard 1-2-3 blocks, near each end and at mid-length, with straps at mid-width of each end; both long edges exposed. Front edge cut with the cutter moving +X makes ZERO EDGE; the opposite edge, cutter moving −X, finishes width without moving the bar." }
envelope = { x_span_mm = "{{process.edge_x_travel_mm}}", y_span_mm = ["{{cad.blank_width_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.edge_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"
# The blocks only push up; the two end straps hold the bar both ways.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_left_x_mm}}", "{{process.strap_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.blank_thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04–.08 below. Front edge, conventional, table −X (cutter +X): rough .050–.080 radial, finish .005–.010; note finish-pass Y; mark ZERO EDGE."
settings = "basebar-edge-6061-t6511"
milling_cuts = [
  { name = "front edge rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.032, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "front edge finish", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Opposite edge, conventional, table +X (cutter −X); D = measured cutter Ø. Rough to cutter-centre Y = front-pass Y + {{cad.width_rough_in:.3f}} + D; finish at front-pass Y + {{cad.width_in:.3f}} + D."
instruction_detailed = "Opposite edge, conventional: table moves +X (cutter −X). Measure the cutter: D. The front-pass Y is the cutter centre, D/2 outside ZERO EDGE, so this edge's cutter centre sits the width plus D beyond it. Rough .050–.080 radial passes down to cutter-centre Y = front-pass Y + {{cad.width_rough_in:.3f}} + D; caliper the width at both ends; finish in one pass at front-pass Y + {{cad.width_in:.3f}} + D. Never set the DRO to {{cad.width_in:.3f}} alone: that cuts the bar a cutter diameter narrow."
settings = "basebar-edge-6061-t6511"
inspection = "Width at ends/middle."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]
milling_cuts = [
  { name = "opposite edge rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.032, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "opposite edge finish", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups]]
machine_kind = "other"
title = "Face, square ends, mill slots in vise"
machine = "PM-30MV / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise indicated <.001 along X. On 1-3/8 in parallels inside the jaw ends; blank centred, ZERO EDGE at fixed (back) jaw; top {{cad.jaw_standout_in:.2dot}}–{{cad.jaw_standout_blank_in:.2dot}} above jaws. Jacks, touch only: X {{process.jack_left_x_in:.1f}} Y {{process.jack_left_y_in:.1f}}; X {{process.jack_right_x_in:.1f}} Y {{process.jack_right_y_in:.1f}} (X from ZERO END); kept for Setup 4."
datum = "Z0 underside from measured thickness (slots: top face). X0 = left end squared here (ZERO END). Y0 (slots): edge-find ZERO EDGE; drawing Y becomes −Y."
diagram = { file = "diagrams/face.svg", alt = "Bar in vise on 1-3/8 in parallels, ZERO EDGE at fixed jaw, top just above the jaws, jacks touching under both overhangs; 3/4 in end mill faces the full length, side 1 then side 2 after an end-for-end flip. Then the 1/2 in end mill squares the left end (ZERO END) and the right end to length in the same clamping, and the upper face is marked: bar 1 C'BORE SIDE, bar 2 RAIL SIDE." }
# The face cutter runs past both ends; the end cutter centre runs D/2 past
# each end, .04 in below the bar.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.end_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
# Both long edges were milled in Setup 2; ZERO EDGE seats on the fixed jaw.
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.face_jaw_left_x_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# The jacks only push up; the jaws alone hold against the end mills' lift.
# Section at the faced .47 in (side 2 and the ends; side 1 is thicker).
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = ["{{process.face_jaw_left_x_mm}}", "{{process.face_jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face full length, +X passes, .60 stepover. Side 1: one pass, ~half the allowance. Flip end-for-end, ZERO EDGE at fixed jaw; side 2: one pass to {{cad.thickness_in:.4f}}."
settings = "basebar-face-6061-t6511"
milling_cuts = [
  { name = "side 1 face", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.381, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "side 2 face", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.381, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04 below bar. Left end, conventional (table away, cutter −Y), .020 passes: X0 here; mark ZERO END. Right end, conventional (table toward you, cutter +Y), .010 passes to cutter-centre X = {{cad.length_in:.4f}} + D/2. Mark top: bar 1 C'BORE SIDE, bar 2 RAIL SIDE."
instruction_detailed = "Measure cutter D. Cutter .04 below bar; it runs just past the end, clear of parallels and jacks. Left end: conventional, table moving away from you (cutter −Y), .020 passes until clean; mark ZERO END both faces; cutter still touching that end, set DRO X = −D/2 (X0 = end face). Right end: conventional, table moving toward you (cutter +Y), .010 passes; read length on DRO before the last pass; final cutter-centre X = {{cad.length_in:.4f}} + D/2. With ZERO END left and ZERO EDGE at the back jaw, mark the upper face: bar 1 C'BORE SIDE, bar 2 RAIL SIDE."
settings = "basebar-edge-6061-t6511"
inspection = "DRO X, before unclamping: right end {{cad.length_min_in:.2f}}–{{cad.length_max_in:.2f}} at both edges."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.length_band_mm}}" }]
milling_cuts = [
  { name = "left end to ZERO END", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.thickness_mm}}", radial_woc_mm = 0.508, rpm = 1250, feed_mm_min = 152.4, stations_mm = 0 },
  { name = "right end to length", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, stations_mm = "{{cad.blank_length_mm}}" },
]

# Each depth step starts with a slow plunge at the cutter-centre rectangle's
# corner nearest that slot's jack (largest X; S1 .885 in, S2 15.365 in). The
# plunge pushes down, so the jacks carry it: the beam spans jack to jack,
# leaving out the vise between them, which only stiffens it. The traverse
# lifts, so only the jaws hold it (the slot operation's beam).
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "S1–S2 entries: each step, plunge at the cutter-centre corner nearest that slot's jack."
rpm = 1250
feed = "slow hand plunge"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = ["{{process.jack_left_x_mm}}", "{{process.jack_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 corner plunges", kind = "plunge", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, feed_per_tooth_mm = 0.0254, stations_mm = [22.479, 390.271] },
]

# One cutter makes each slot: the adapter offsets the cutter-centre rectangle
# e = (slot width − process.half_cutter_dia_mm)/2 from the drawing's arc-centre
# line. The cutter actually used cuts its Ø + 2e, so its shop diameter must lie
# in the drawing's width band less 2e.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = { kind = "band", band_mm = "{{cad.slot_cutter_band_mm}}" }
instruction = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, ±{{cad.slot_position_tol_in:.2f}}: after each entry, traverse the cutter-centre rectangle; {{process.slot_step_in:.2dot}} steps to {{cad.slot_depth_in:.2f}} deep; {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} arc centres."
instruction_detailed = "{{cad.slot_range}}, {{cad.slot_cutter_in:.3dot}} cutter only, positions ±{{cad.slot_position_tol_in:.2f}}: after each entry plunge (op above), traverse the cutter-centre rectangle at each depth {{cad.slot_depths_in}} below top (light steps: the jacks only push up, so the jaws alone hold the bar down against the end mill's lift). Makes {{cad.slot_width_in:.3f}} wide, {{cad.slot_spacing_in:.3f}} between arc centres."
settings = "basebar-slot-rough-6061-t6511"
inspection = "DRO X: slot centres S1 {{cad.slot1_x_min_in:.2f}}–{{cad.slot1_x_max_in:.2f}}, S2 {{cad.slot2_x_min_in:.2f}}–{{cad.slot2_x_max_in:.2f}}."
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.slot1_x_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.slot2_x_band_mm}}" },
]
# The bar is squared to length here: slot stations sit in the finished frame.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{process.jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "S1–S2 depth steps", kind = "slot", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.slot_step_mm}}", radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1250, feed_mm_min = 127.0, stations_mm = [22.098, 389.89] },
]

[setups.operations.table]
columns = ["Slot", "X", "Arc-centre Y", "Cutter-centre X", "Cutter-centre Y"]
rows = "{{cad.slot_rows}}"

[[setups]]
machine_kind = "other"
title = "Drill / tap / counterbore"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 3 (re-clamp alike), jacks as set; bar 1 C'BORE SIDE up, bar 2 RAIL SIDE up."
datum = "X0 ZERO END, re-found (rail op). Y0: edge-find ZERO EDGE; drawing Y becomes −Y. Z0 = top face."
diagram = { file = "diagrams/holes.svg", alt = "Finished {{cad.length_in:.2f}} in bar in vise: bar 1 C'BORE SIDE up, bar 2 RAIL SIDE up, ZERO EDGE at back fixed jaw, ZERO END left, X0 Y0 back-left; rail holes {{cad.rail_range}}, counterbored {{cad.bracket_range}} (bar 1 only), slots {{cad.slot_range}} and one jack under each overhang's holes." }
# Hole and slot centres lie inside the finished bar. Longest: a drill in the
# drill chuck; shortest: the 5/16 in counterbore cutter in an R8 collet.
envelope = { x_span_mm = "{{cad.length_mm}}", y_span_mm = "{{cad.width_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
# Re-grip: bar 1 is clamped C'BORE SIDE down to measure its rail holes, then
# rolled back C'BORE SIDE up to drill; both holds seat machined edges, centred.
vise_hold = [
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.vise_centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.vise_centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
]
# End mills lift: only the jaws hold them. Drills and the counterbore plunge
# push down, so each end's jack carries that end's hole thrust (operation beams).
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{process.jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
inspection = ["Before unclamping, DRO X from ZERO END: bar 1 B1–B2 {{cad.bracket_x1_min_in:.4f}}–{{cad.bracket_x1_max_in:.4f}}, B3–B4 {{cad.bracket_x2_min_in:.4f}}–{{cad.bracket_x2_max_in:.4f}}."]
gauge_checks = [
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x1_band_mm}}" },
  { gauge = "mill-x-dro", band_mm = "{{cad.bracket_x2_band_mm}}" },
]

[[setups.operations]]
instruction = "Own HGR15 rail trimmed flush, angle grinder (TL-00 1D–1G). Bar 1 rolled C'BORE SIDE down; rail face up, flush at ZERO END, clamped near each end. Record {{cad.rail_range}} X (counterbore two-side midpoints). Remove rail; bar 1 back C'BORE SIDE up, ZERO EDGE at back jaw; re-find X0."
instruction_detailed = "(a) Rail first (TL-00 steps 1D–1G): this bar's own HGR15 rail, trimmed with the angle grinder the same amount off each end, cut-off wheel about .06 long, then the grinding wheel square until flush with this bar's ends. (b) Bar rail face up: roll bar 1 about its length, C'BORE SIDE down, so ZERO END stays left and ZERO EDGE comes to the front jaw; bar 2 is already RAIL SIDE up. (c) Lay the rail on its seat along the rail row, end flush with ZERO END; clamp it to the bar with two small clamps on the rail between holes, one near each end, every counterbore open. (d) Edge finder in the spindle on its small tip: touch ZERO END and set X0 (DRO X = −tip radius). (e) For each of the {{cad.rail_count:d}} holes, drop the tip into the counterbore, touch its left side and read X, touch its right side and read X; the centre is the midpoint. Write all {{cad.rail_count:d}} on the sheet. The REF {{cad.rail_first_mm:.3f}} mm start and {{cad.rail_pitch_mm:.3f}} mm pitch only help find them; never drill at REF. (f) Remove the rail; keep it paired and oriented to its own bar. Bar 1: roll it back C'BORE SIDE up, ZERO EDGE at the back jaw, as held above. Re-find X0 on ZERO END; drill {{cad.rail_range}} at the recorded X."

