speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Same file, M6 T3: spot all holes Ø.125, R1–R8 and (bar 1) {{cad.bracket_range}}, at the posted stations: rail X ±{{cad.rail_station_tol_in:.4f}}, bracket X/Y ±{{cad.bracket_position_tol_in:.3f}}, rail row ±{{cad.rail_row_tol_in:.2f}}. Drill tips .125 past underside."
rpm = 2800
feed = "BB02/BB03 program"
# Spotting cones are drilled away later; the jaws alone carry them.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{cad.vise_centred_overhang_mm}}", "{{process.jaw_right_x_mm}}"], section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
