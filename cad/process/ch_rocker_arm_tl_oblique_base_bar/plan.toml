note = "Finishing passes at full depth, one handwheel at a time, cutter centre only: Y from -124.46 to -128.52 at X 389.51 and at X 390.27 (the walls); X from 389.51 to 390.27 at Y -124.46 and at Y -128.52; then at X 389.89, Y out to -124.08 and to -128.90 and back (the end apexes). Never go past these points: a corner move beyond them cuts outside the R6.731 ends. This leaves up to 0.12 on each end at 45 degrees (the ends are R6.61 to R6.73 from their centres, not a true R6.73); the print gives no separate end radius, so the end form is held for review and the width check alone does not accept it. Figures for D 12.70. For another D, let d = (13.46 - D)/2 and REPLACE every listed 0.38 offset from the slot centreline and end centres with d; do not add d to the listed numbers. Width 13.21 to 13.72. The far slot leaves a 4.45 wall to the far edge: do not open it up more than you have to."
