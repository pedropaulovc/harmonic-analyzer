<?xml version="1.0" encoding="UTF-8"?>
<!-- Styles: prechips.palette roles (class); the traveler prints the legend once. -->
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="inspect" data-rail-width-mm="15" data-rail-height-mm="15" data-screw-dia-mm="4.17" data-screw-length-mm="15.875" data-screw-head-dia-mm="6.86" data-screw-head-height-mm="4.17" viewBox="0 0 720 330" width="720" height="330" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <!-- Authored hardware on the root: HGR15 rail section; #8-32 × 5/8 socket screw. -->
  <rect class="paper" width="720" height="330"/>

  <!-- Plan: CAD finished bar 1 seen from C'BORE SIDE -->
  <rect id="bar" class="part-kept" x="{{view.x0}}" y="{{view.top}}" width="{{view.plan_w}}" height="{{view.plan_h}}" stroke-width="1.5"/>
  <!-- bar 1 rail on the opposite face: hidden under bar, trimmed flush with both ends -->
  <g id="rail-hidden" data-cad-group="rail-hidden" class="hidden"/>

  <g id="rail-holes" data-cad-group="rail-holes" class="holes" stroke-width="1.1"/>
  <g id="bracket-holes" data-cad-group="bracket-holes" class="holes" stroke-width="1.1"/>
  <g id="slots" data-cad-group="slots" class="holes" stroke-width="1.1"/>

  <!-- section line A-A through the last bracket column, viewed toward ZERO END -->
  <line class="dims" x1="{{view.section_x}}" y1="{{view.section_top}}" x2="{{view.section_x}}" y2="{{view.section_bottom}}" stroke-dasharray="10 3 2 3"/>
  <g class="arrow">
    <line x1="{{view.section_x}}" y1="{{view.section_top}}" x2="{{view.section_arrow_x}}" y2="{{view.section_top}}"/>
    <line x1="{{view.section_x}}" y1="{{view.section_bottom}}" x2="{{view.section_arrow_x}}" y2="{{view.section_bottom}}"/>
  </g>

  <text x="4" y="46">ZERO END</text>
  <line class="leader" x1="40" y1="50" x2="31" y2="60"/>
  <text x="170" y="46">ZERO EDGE</text>
  <line class="leader" x1="205" y1="50" x2="210" y2="60"/>
  <text x="130" y="{{view.cbore_label_y}}">bar 1 viewed from C'BORE SIDE</text>
  <text x="120" y="{{view.rail_label_y}}">{{cad.rail_range}} 8-32 (rail screws)</text>
  <text x="365" y="{{view.stud_label_y}}" text-anchor="end">1/2-13 stud slides end-to-end in S1 and S2</text>
  <line class="leader" x1="368" y1="{{view.stud_leader_y}}" x2="{{view.stud_x}}" y2="{{view.stud_y}}"/>
  <text x="30" y="{{view.rail_note_y}}">Bar 1: HGR15 rail under (dashed), flush both ends</text>
  <line class="leader" x1="62" y1="{{view.rail_leader_y1}}" x2="{{view.rail_leader_x2}}" y2="{{view.rail_leader_y2}}"/>

  <!-- Bar 1 as used on the table: section A-A turned over, ZERO EDGE left -->
  <g id="labels" data-cad-group="labels"/>
  <rect class="part-kept" x="{{view.sxl}}" y="{{view.stop}}" width="{{view.sw}}" height="{{view.st}}" stroke-width="1.5"/>
  <g id="section-cuts" data-cad-group="section-cuts" class="paper"/>
  <g id="section-outlines" data-cad-group="section-outlines" class="dims" stroke-width="1.2"/>
  <!-- socket screw recessed in the counterbore from below -->
  <g id="screw" data-cad-group="screw" class="part-rest"/>
  <!-- rail on top -->
  <g id="rail-section" data-cad-group="rail-section" class="part-rest"/>

  <text x="{{view.rail1_label_x}}" y="{{view.rail1_label_y}}">HGR15 rail</text>
  <text x="430" y="{{view.row1_label_y}}">ZERO EDGE</text>
  <line class="leader" x1="442" y1="{{view.row1_leader_y}}" x2="{{view.sxl}}" y2="{{view.sbottom}}"/>
  <text x="716" y="{{view.row1_label_y}}" text-anchor="end">#8-32 head recessed</text>
  <line class="leader" x1="574" y1="{{view.row1_leader_y}}" x2="{{view.head_leader_x}}" y2="{{view.head_leader_y}}"/>
  <text x="430" y="{{view.row2_label_y}}">C'BORE SIDE down = table seat</text>

  <!-- Bar 2 as used (drawing sheet 2): rail on the marked RAIL SIDE, table seat opposite -->
  <text x="430" y="{{view.bar2_title_y}}">Bar 2: rail on marked RAIL SIDE</text>
  <rect class="part-kept" x="{{view.sxl}}" y="{{view.stop2}}" width="{{view.sw}}" height="{{view.st}}" stroke-width="1.5"/>
  <rect class="part-rest" x="{{view.rail2_x}}" y="{{view.rail2_y}}" width="{{view.rail_w}}" height="{{view.rail_h}}"/>
  <text x="{{view.rail2_label_x}}" y="{{view.rail2_label_y}}">HGR15 rail</text>
  <text x="430" y="{{view.seat2_label_y}}">table seat: opposite face</text>
  <line class="leader" x1="470" y1="{{view.seat2_leader_y}}" x2="476" y2="{{view.sbottom2}}"/>
  <text x="716" y="{{view.seat2_label_y}}" text-anchor="end">ZERO EDGE</text>
  <line class="leader" x1="680" y1="{{view.edge2_leader_y}}" x2="{{view.sxr}}" y2="{{view.sbottom2}}"/>
</svg>
