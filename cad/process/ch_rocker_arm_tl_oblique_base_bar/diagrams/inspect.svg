<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="inspect" data-rail-width-mm="15" data-rail-height-mm="15" data-screw-dia-mm="4.17" data-screw-length-mm="15.875" data-screw-head-dia-mm="6.86" data-screw-head-height-mm="4.17" viewBox="0 0 720 330" width="720" height="330" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <!-- Authored hardware on the root: HGR15 rail section; #8-32 × 5/8 socket screw. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
    <pattern id="sec" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#dfe6ee"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="330" fill="#fff"/>

  <!-- Plan: CAD finished bar 1 seen from C'BORE SIDE -->
  <rect id="bar" x="{{view.x0}}" y="{{view.top}}" width="{{view.plan_w}}" height="{{view.plan_h}}" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <!-- bar 1 rail on the opposite face: hidden under bar, trimmed flush with both ends -->
  <g id="rail-hidden" data-cad-group="rail-hidden" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="5 3"/>

  <g id="rail-holes" data-cad-group="rail-holes" fill="#fff" stroke="#111" stroke-width="1.1"/>
  <g id="bracket-holes" data-cad-group="bracket-holes" fill="#fff" stroke="#111" stroke-width="1.1"/>
  <g id="slots" data-cad-group="slots" fill="#fff" stroke="#111" stroke-width="1.1"/>

  <!-- section line A-A through the last bracket column, viewed toward ZERO END -->
  <line x1="{{view.section_x}}" y1="{{view.section_top}}" x2="{{view.section_x}}" y2="{{view.section_bottom}}" stroke="#111" stroke-width="1" stroke-dasharray="10 3 2 3"/>
  <g stroke="#111" stroke-width="1.5">
    <line x1="{{view.section_x}}" y1="{{view.section_top}}" x2="{{view.section_arrow_x}}" y2="{{view.section_top}}" marker-end="url(#arr)"/>
    <line x1="{{view.section_x}}" y1="{{view.section_bottom}}" x2="{{view.section_arrow_x}}" y2="{{view.section_bottom}}" marker-end="url(#arr)"/>
  </g>

  <text x="4" y="46">ZERO END</text>
  <line x1="40" y1="50" x2="31" y2="60" stroke="#111" stroke-width="1"/>
  <text x="170" y="46">ZERO EDGE</text>
  <line x1="205" y1="50" x2="210" y2="60" stroke="#111" stroke-width="1"/>
  <text x="130" y="{{view.cbore_label_y}}">bar 1 viewed from C'BORE SIDE</text>
  <text x="120" y="{{view.rail_label_y}}">{{cad.rail_range}} 8-32 (rail screws)</text>
  <text x="365" y="{{view.stud_label_y}}" text-anchor="end">1/2-13 stud slides end-to-end in S1 and S2</text>
  <line x1="368" y1="{{view.stud_leader_y}}" x2="{{view.stud_x}}" y2="{{view.stud_y}}" stroke="#111" stroke-width="1"/>
  <text x="30" y="{{view.rail_note_y}}">Bar 1: HGR15 rail under (dashed), flush both ends</text>
  <line x1="62" y1="{{view.rail_leader_y1}}" x2="{{view.rail_leader_x2}}" y2="{{view.rail_leader_y2}}" stroke="#111" stroke-width="1"/>

  <!-- Bar 1 as used on the table: section A-A turned over, ZERO EDGE left -->
  <g id="labels" data-cad-group="labels"/>
  <rect x="{{view.sxl}}" y="{{view.stop}}" width="{{view.sw}}" height="{{view.st}}" fill="url(#sec)" stroke="#111" stroke-width="1.5"/>
  <g id="section-cuts" data-cad-group="section-cuts" fill="#fff"/>
  <g id="section-outlines" data-cad-group="section-outlines" fill="none" stroke="#111" stroke-width="1.2"/>
  <!-- socket screw recessed in the counterbore from below -->
  <g id="screw" data-cad-group="screw" stroke="#111"/>
  <!-- rail on top -->
  <g id="rail-section" data-cad-group="rail-section" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>

  <text x="{{view.rail1_label_x}}" y="{{view.rail1_label_y}}">HGR15 rail</text>
  <text x="430" y="{{view.row1_label_y}}">ZERO EDGE</text>
  <line x1="442" y1="{{view.row1_leader_y}}" x2="{{view.sxl}}" y2="{{view.sbottom}}" stroke="#111" stroke-width="1"/>
  <text x="716" y="{{view.row1_label_y}}" text-anchor="end">#8-32 head recessed</text>
  <line x1="574" y1="{{view.row1_leader_y}}" x2="{{view.head_leader_x}}" y2="{{view.head_leader_y}}" stroke="#111" stroke-width="1"/>
  <text x="430" y="{{view.row2_label_y}}">C'BORE SIDE down = table seat</text>

  <!-- Bar 2 as used (drawing sheet 2): rail on the marked RAIL SIDE, table seat opposite -->
  <text x="430" y="{{view.bar2_title_y}}">Bar 2: rail on marked RAIL SIDE</text>
  <rect x="{{view.sxl}}" y="{{view.stop2}}" width="{{view.sw}}" height="{{view.st}}" fill="url(#sec)" stroke="#111" stroke-width="1.5"/>
  <rect x="{{view.rail2_x}}" y="{{view.rail2_y}}" width="{{view.rail_w}}" height="{{view.rail_h}}" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>
  <text x="{{view.rail2_label_x}}" y="{{view.rail2_label_y}}">HGR15 rail</text>
  <text x="430" y="{{view.seat2_label_y}}">table seat: opposite face</text>
  <line x1="470" y1="{{view.seat2_leader_y}}" x2="476" y2="{{view.sbottom2}}" stroke="#111" stroke-width="1"/>
  <text x="716" y="{{view.seat2_label_y}}" text-anchor="end">ZERO EDGE</text>
  <line x1="680" y1="{{view.edge2_leader_y}}" x2="{{view.sxr}}" y2="{{view.sbottom2}}" stroke="#111" stroke-width="1"/>
</svg>
