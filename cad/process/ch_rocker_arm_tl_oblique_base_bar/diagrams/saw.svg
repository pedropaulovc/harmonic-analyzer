<?xml version="1.0" encoding="UTF-8"?>
<!-- Styles: prechips.palette roles (class); the traveler prints the legend once. -->
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="saw" viewBox="0 0 720 {{view.height}}" width="720" height="{{view.height}}" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect class="paper" width="720" height="{{view.height}}"/>

  <!-- Top view: authored blanks marked on the bar -->
  <text class="title" x="40" y="20">Top view</text>
  <g id="blanks" data-cad-group="blanks" class="part-kept" stroke-width="1.5"/>
  <g id="stock-rest" data-cad-group="stock-rest" class="part-rest" stroke-width="1.5"/>
  <g id="cutlines" data-cad-group="cutlines" class="active-face" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g id="blank-labels" data-cad-group="blank-labels"/>
  <text x="{{view.rest_label_x}}" y="{{view.label_y}}" text-anchor="middle">{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} bar</text>

  <!-- length dimensions -->
  <g id="length-dims" data-cad-group="length-dims" class="dims"/>

  <!-- width dimension -->
  <g class="dims">
    <line x1="{{view.width_ext_x}}" y1="{{view.top}}" x2="20" y2="{{view.top}}"/>
    <line x1="{{view.width_ext_x}}" y1="{{view.bottom}}" x2="20" y2="{{view.bottom}}"/>
    <line x1="26" y1="{{view.width_dim_top}}" x2="26" y2="{{view.width_dim_bottom}}" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text transform="translate(17 {{view.mid}}) rotate(-90)" text-anchor="middle">{{process.blank_width_in:fraction}} in</text>

  <!-- cutline label -->
  <g id="cut-leaders" data-cad-group="cut-leaders" class="leader"/>

  <!-- Side view: bar on saw bed with supports (thickness drawn 2x) -->
  <text class="title" x="40" y="196">Side view</text>
  <g id="side-bar" data-cad-group="side-bar" class="part-kept" stroke-width="1.5"/>
  <line class="active-face" x1="{{view.cut}}" y1="212" x2="{{view.cut}}" y2="{{view.side_cut_bottom}}" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect class="cutter" x="{{view.blade_x}}" y="176" width="6" height="42"/>
  <line class="arrow" x1="{{view.push_x}}" y1="198" x2="{{view.push_x}}" y2="216"/>
  <text x="{{view.blade_text_x}}" y="190">saw blade</text>
  <line class="leader" x1="{{view.blade_leader_x1}}" y1="185" x2="{{view.blade_leader_x2}}" y2="185"/>

  <rect class="fixture-table" x="{{view.bed_x}}" y="{{view.side_bottom}}" width="120" height="50" stroke-width="1.5"/>
  <path class="holes" d="M{{view.notch_x1}} {{view.notch_top}}V{{view.notch_bottom}}H{{view.notch_x2}}V{{view.notch_top}}"/>
  <text x="{{view.bed_label_x}}" y="{{view.bed_label_y}}" text-anchor="middle">saw bed</text>

  <g class="fixture-support">
    <g transform="translate({{view.support_left}} {{view.side_bottom}})">
      <rect x="-20" y="0" width="40" height="4"/>
      <rect x="-3" y="4" width="6" height="44"/>
      <rect x="-16" y="48" width="32" height="4"/>
    </g>
    <g transform="translate({{view.support_right}} {{view.side_bottom}})">
      <rect x="-20" y="0" width="40" height="4"/>
      <rect x="-3" y="4" width="6" height="44"/>
      <rect x="-16" y="48" width="32" height="4"/>
    </g>
  </g>
  <text x="{{view.support_label_left}}" y="{{view.bed_label_y}}">support</text>
  <text x="{{view.support_label_right}}" y="{{view.bed_label_y}}">support</text>
  <line class="fixture-table" x1="30" y1="{{view.floor_y}}" x2="640" y2="{{view.floor_y}}" stroke-width="1.5"/>
  <text x="335" y="{{view.caption_y}}" text-anchor="middle">bar level across saw bed and both supports</text>
</svg>
