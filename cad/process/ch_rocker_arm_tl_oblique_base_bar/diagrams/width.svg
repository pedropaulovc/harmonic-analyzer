<?xml version="1.0" encoding="UTF-8"?>
<!-- Styles: prechips.palette roles (class); the traveler prints the legend once. Arrows show the cutter's path over the bar. -->
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="width" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect class="paper" width="720" height="340"/>

  <!-- mill table, top view, with two T-slots -->
  <rect class="fixture-table" x="10" y="60" width="640" height="226"/>
  <g class="fixture-table">
    <rect x="10" y="114" width="640" height="8"/>
    <rect x="10" y="224" width="640" height="8"/>
  </g>

  <!-- authored blank; stock beyond CAD width (hatched) and front cleanup -->
  <rect id="bar" class="part-kept" x="{{view.x0}}" y="{{view.top}}" width="{{view.lpx}}" height="{{view.hpx}}" stroke-width="1.5"/>
  <rect class="part-removed" x="{{view.x0}}" y="{{view.top}}" width="{{view.lpx}}" height="{{view.top_stock}}"/>
  <line class="active-face" x1="{{view.x0}}" y1="{{view.finish}}" x2="{{view.x1}}" y2="{{view.finish}}" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect class="part-removed" x="{{view.x0}}" y="{{view.front}}" width="{{view.lpx}}" height="{{view.cleanup}}"/>
  <line class="datum" x1="{{view.x0}}" y1="{{view.front}}" x2="{{view.x1}}" y2="{{view.front}}" stroke-width="3"/>

  <!-- three inboard 1-2-3 blocks (1 in up, 3 in across the width) and an end strap at mid-width of each end -->
  <g class="fixture-support">
    <rect x="{{view.block1_x}}" y="{{view.block_y}}" width="{{view.block_w}}" height="{{view.block_h}}"/>
    <rect x="{{view.block2_x}}" y="{{view.block_y}}" width="{{view.block_w}}" height="{{view.block_h}}"/>
    <rect x="{{view.block3_x}}" y="{{view.block_y}}" width="{{view.block_w}}" height="{{view.block_h}}"/>
  </g>
  <g transform="translate({{view.x0}} {{view.cy}})">
    <rect class="fixture-support" x="-54" y="-15" width="16" height="30"/>
    <rect class="clamp" x="-46" y="-11" width="104" height="22"/>
    <circle class="holes" cx="-14" cy="0" r="6"/>
  </g>
  <g transform="translate({{view.x1}} {{view.cy}})">
    <rect class="fixture-support" x="38" y="-15" width="16" height="30"/>
    <rect class="clamp" x="-58" y="-11" width="104" height="22"/>
    <circle class="holes" cx="14" cy="0" r="6"/>
  </g>

  <!-- pass 1: front edge, cutter path +X -->
  <circle class="cutter" cx="{{view.cutter1_x}}" cy="{{view.cutter1_y}}" r="7"/>
  <line class="arrow" x1="{{view.pass1_x1}}" y1="{{view.pass1_y}}" x2="{{view.pass1_x2}}" y2="{{view.pass1_y}}"/>
  <text x="{{view.pass1_label_x}}" y="{{view.pass1_label_y}}">cutter path +X</text>
  <text x="20" y="{{view.step1_y}}">1  Front edge, cutter +X: finish .005–.010 → A / ZERO EDGE</text>

  <!-- pass 2: opposite edge, cutter path -X -->
  <circle class="cutter" cx="{{view.cutter2_x}}" cy="{{view.cutter2_y}}" r="7"/>
  <line class="arrow" x1="{{view.pass2_x1}}" y1="{{view.pass2_y}}" x2="{{view.pass2_x2}}" y2="{{view.pass2_y}}"/>
  <text x="{{view.pass2_label_x}}" y="{{view.pass2_label_y}}" text-anchor="end">cutter path −X</text>
  <text x="20" y="40">2  Opposite edge, cutter −X: rough {{cad.width_rough_in:.3f}}, finish {{cad.width_in:.3f}}</text>

  <!-- CAD width from ZERO EDGE -->
  <g class="dims">
    <line x1="88" y1="{{view.finish}}" x2="22" y2="{{view.finish}}"/>
    <line x1="88" y1="{{view.front}}" x2="22" y2="{{view.front}}"/>
    <line x1="28" y1="{{view.dim_top}}" x2="28" y2="{{view.dim_bottom}}" marker-start="url(#prechips-arr)" marker-end="url(#prechips-arr)"/>
  </g>
  <text transform="translate(22 {{view.dim_mid}}) rotate(-90)" text-anchor="middle">{{cad.width_in:.2f}} finished</text>

  <!-- in-figure labels -->
  <g text-anchor="middle">
    <text x="{{view.gap_left_x}}" y="{{view.label1_y}}">flat on 3</text>
    <text x="{{view.gap_left_x}}" y="{{view.label2_y}}">inboard</text>
    <text x="{{view.gap_left_x}}" y="{{view.label3_y}}">1-2-3 blocks</text>
    <text x="{{view.gap_right_x}}" y="{{view.label1_y}}">end straps</text>
    <text x="{{view.gap_right_x}}" y="{{view.label2_y}}">at mid-width;</text>
    <text x="{{view.gap_right_x}}" y="{{view.label3_y}}">edges clear</text>
  </g>
  <text x="{{view.x1}}" y="{{view.datum_label_y}}" text-anchor="end">A / ZERO EDGE</text>
  <line class="leader" x1="{{view.datum_leader_x1}}" y1="{{view.datum_leader_y1}}" x2="{{view.datum_leader_x2}}" y2="{{view.datum_leader_y2}}"/>

  <!-- axes -->
  <g class="axis">
    <line x1="610" y1="325" x2="655" y2="325"/>
    <line x1="610" y1="325" x2="610" y2="290"/>
  </g>
  <text x="660" y="330">+X</text>
  <text x="618" y="300">+Y</text>
</svg>
