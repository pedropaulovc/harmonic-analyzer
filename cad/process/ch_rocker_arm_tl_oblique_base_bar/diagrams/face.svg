<?xml version="1.0" encoding="UTF-8"?>
<!-- Styles: prechips.palette roles (class); the traveler prints the legend once. Arrows show the cutter's path over the bar. -->
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="face" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect class="paper" width="720" height="340"/>

  <!-- Front view (from operator side) -->
  <text class="title" x="10" y="22">Front view</text>
  <rect class="fixture-table" x="20" y="200" width="680" height="16"/>
  <text x="30" y="213" font-size="14">mill table</text>
  <rect class="fixture-vise" x="239" y="172" width="188" height="28"/>

  <!-- CAD finished length at authored blank thickness, ends overhanging -->
  <rect id="bar" class="part-kept" x="{{view.fx0}}" y="120" width="{{view.flen}}" height="{{view.fthick}}" stroke-width="1.5"/>
  <!-- front jaw with parallels hidden behind -->
  <rect class="clamp" x="249" y="{{view.jaw_top}}" width="168" height="{{view.jaw_h}}"/>
  <rect class="fixture-support" x="255" y="{{view.fbottom}}" width="156" height="{{view.parallel_h}}" fill="none"/>
  <text x="333" y="148" text-anchor="middle">front jaw</text>
  <text x="333" y="165" text-anchor="middle" font-size="14">1-3/8 parallels behind</text>

  <!-- screw jacks under both ends -->
  <g transform="translate({{view.fx0}} 0)">
    <g class="fixture-support">
      <rect x="67" y="{{view.fbottom}}" width="6" height="{{view.jack_shaft_h}}"/>
      <rect x="58" y="158" width="24" height="42"/>
    </g>
    <text x="52" y="186" text-anchor="end">jack: touch only</text>
  </g>
  <g transform="translate({{view.fx1}} 0)">
    <g class="fixture-support">
      <rect x="-73" y="{{view.fbottom}}" width="6" height="{{view.jack_shaft_h}}"/>
      <rect x="-82" y="158" width="24" height="42"/>
    </g>
    <text x="-50" y="186">jack: touch only</text>
  </g>

  <!-- 3/4 end mill facing the top; its path over the bar -->
  <rect class="cutter" x="345" y="34" width="31" height="26"/>
  <rect class="cutter" x="350" y="60" width="21" height="28"/>
  <text x="384" y="56">3/4 in end mill faces full length</text>
  <line class="arrow" x1="384" y1="74" x2="472" y2="74"/>
  <text x="478" y="79">cutter path +X</text>

  <!-- Top view: final orientation for marking, CAD length × width -->
  <text class="title" x="10" y="240">Top view</text>
  <rect class="clamp" x="159.5" y="240" width="84" height="10"/>
  <rect class="part-kept" x="{{view.tx0}}" y="250" width="{{view.tlen}}" height="{{view.twidth}}" stroke-width="1.5"/>
  <line class="datum" x1="{{view.tx0}}" y1="251" x2="{{view.tx1}}" y2="251" stroke-width="3"/>
  <line class="datum" x1="{{view.zero_end_x}}" y1="250" x2="{{view.zero_end_x}}" y2="{{view.tbottom}}" stroke-width="3"/>
  <rect class="clamp" x="159.5" y="{{view.tbottom}}" width="84" height="10"/>
  <text x="201.5" y="{{view.mark1_y}}" text-anchor="middle">mark top: bar 1 C'BORE SIDE,</text>
  <text x="201.5" y="{{view.mark2_y}}" text-anchor="middle">bar 2 RAIL SIDE</text>
  <text x="{{view.zero_end_label_x}}" y="{{view.zero_end_y}}" text-anchor="end" font-size="13">ZERO END</text>

  <text x="340" y="250">fixed jaw: ZERO EDGE against it</text>
  <line class="leader" x1="336" y1="246" x2="245" y2="245"/>
  <text x="340" y="276">side 2: flip end-for-end, ZERO EDGE stays at</text>
  <text x="340" y="294">fixed jaw. Then, without unclamping: square left</text>
  <text x="340" y="312">end (ZERO END), right end to length, mark top;</text>
  <text x="340" y="330">slots S1–S2; spot, drill, tap, counterbore.</text>
</svg>
