<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="face" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fff"/>

  <!-- Front view (from operator side) -->
  <text x="10" y="22" fill="#555" font-style="italic">Front view</text>
  <rect x="20" y="200" width="680" height="16" fill="#6b7178"/>
  <text x="30" y="213" fill="#fff" font-size="14">mill table</text>
  <rect x="239" y="172" width="188" height="28" fill="#8a9099" stroke="#111" stroke-width="1.2"/>

  <!-- CAD finished length at authored blank thickness, ends overhanging -->
  <rect id="bar" x="{{view.fx0}}" y="120" width="{{view.flen}}" height="{{view.fthick}}" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <!-- front jaw with parallels hidden behind -->
  <rect x="249" y="126" width="168" height="46" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>
  <rect x="255" y="{{view.fbottom}}" width="156" height="{{view.parallel_h}}" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="333" y="148" text-anchor="middle">front jaw</text>
  <text x="333" y="165" text-anchor="middle" font-size="14">1-3/8 parallels behind</text>

  <!-- screw jacks under both ends -->
  <g transform="translate({{view.fx0}} 0)">
    <g fill="#8a9099" stroke="#111" stroke-width="1.2">
      <rect x="67" y="{{view.fbottom}}" width="6" height="{{view.jack_shaft_h}}"/>
      <rect x="58" y="158" width="24" height="42"/>
    </g>
    <text x="52" y="186" text-anchor="end">screw jack</text>
  </g>
  <g transform="translate({{view.fx1}} 0)">
    <g fill="#8a9099" stroke="#111" stroke-width="1.2">
      <rect x="-73" y="{{view.fbottom}}" width="6" height="{{view.jack_shaft_h}}"/>
      <rect x="-82" y="158" width="24" height="42"/>
    </g>
    <text x="-50" y="186">screw jack</text>
  </g>

  <!-- left and right halves of the face -->
  <g stroke="#111" stroke-width="1">
    <line x1="{{view.fx0}}" y1="116" x2="{{view.fx0}}" y2="104"/>
    <line x1="333" y1="116" x2="333" y2="104"/>
    <line x1="{{view.fx1}}" y1="116" x2="{{view.fx1}}" y2="104"/>
    <line x1="{{view.dim_left1}}" y1="110" x2="{{view.dim_left2}}" y2="110" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="{{view.dim_right1}}" y1="110" x2="{{view.dim_right2}}" y2="110" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="{{view.half_left_x}}" y="100" text-anchor="middle">left half</text>
  <text x="{{view.half_right_x}}" y="100" text-anchor="middle">right half</text>

  <!-- 3/4 end mill facing the top (shown dashed) -->
  <rect x="345" y="34" width="31" height="26" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 3"/>
  <rect x="350" y="60" width="21" height="28" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="384" y="56">3/4 in end mill faces top</text>
  <line x1="384" y1="74" x2="472" y2="74" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="478" y="79">+X</text>

  <!-- Top view: final orientation for marking, CAD length × width -->
  <text x="10" y="240" fill="#555" font-style="italic">Top view</text>
  <rect x="159.5" y="240" width="84" height="10" fill="#8a9099" stroke="#111" stroke-width="1.2"/>
  <rect x="{{view.tx0}}" y="250" width="{{view.tlen}}" height="{{view.twidth}}" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <line x1="{{view.tx0}}" y1="251" x2="{{view.tx1}}" y2="251" stroke="#a33" stroke-width="3"/>
  <line x1="{{view.zero_end_x}}" y1="250" x2="{{view.zero_end_x}}" y2="{{view.tbottom}}" stroke="#a33" stroke-width="3"/>
  <rect x="159.5" y="{{view.tbottom}}" width="84" height="10" fill="#b5b9bf" stroke="#111" stroke-width="1.2"/>
  <text x="201.5" y="{{view.mark_y}}" text-anchor="middle">mark top: C'BORE SIDE</text>
  <text x="{{view.zero_end_label_x}}" y="{{view.mark_y}}" text-anchor="end">ZERO END</text>

  <text x="340" y="250">fixed jaw: ZERO EDGE against it</text>
  <line x1="336" y1="246" x2="245" y2="245" stroke="#111" stroke-width="1"/>
  <text x="340" y="276">side 2: flip end-for-end,</text>
  <text x="340" y="294">ZERO EDGE stays at fixed jaw.</text>
  <text x="340" y="312">After both faces: ZERO END left,</text>
  <text x="340" y="330">ZERO EDGE back, then mark top.</text>
</svg>
