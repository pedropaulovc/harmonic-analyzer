<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="ends" viewBox="0 0 720 350" width="720" height="350" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
    <pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a33" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="720" height="350" fill="#fff"/>

  <!-- transfer sequence -->
  <text x="20" y="20">1  Add 2 long-edge straps near mid-length</text>
  <text x="20" y="40">2  Then remove end straps (dashed); part stays put</text>

  <!-- mill table, top view -->
  <rect x="10" y="48" width="640" height="262" fill="#f1f2f3" stroke="#999"/>
  <g fill="#d6d8db">
    <rect x="10" y="132" width="640" height="8"/>
    <rect x="10" y="212" width="640" height="8"/>
  </g>

  <!-- bar at CAD width, both long edges finished; end stock beyond CAD length hatched -->
  <rect id="bar" x="{{view.x0}}" y="{{view.top}}" width="{{view.bar_w}}" height="{{view.hpx}}" fill="#dfe6ee" stroke="#111" stroke-width="1.5"/>
  <rect x="{{view.x0}}" y="{{view.top}}" width="{{view.trim}}" height="{{view.hpx}}" fill="url(#cut)"/>
  <rect x="{{view.far}}" y="{{view.top}}" width="{{view.trim}}" height="{{view.hpx}}" fill="url(#cut)"/>
  <line x1="{{view.zero}}" y1="{{view.top}}" x2="{{view.zero}}" y2="{{view.bottom}}" stroke="#a33" stroke-width="3"/>
  <line x1="{{view.far}}" y1="{{view.top}}" x2="{{view.far}}" y2="{{view.bottom}}" stroke="#a33" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- same two 1-2-3 blocks inboard of both end cuts; old end straps removed after transfer -->
  <g transform="translate({{view.x0}} {{view.cy}})">
    <rect x="35" y="-39" width="27" height="78" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3"/>
    <g fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4">
      <rect x="-54" y="-15" width="16" height="30"/>
      <rect x="-46" y="-11" width="104" height="22"/>
    </g>
  </g>
  <g transform="translate({{view.x1}} {{view.cy}})">
    <rect x="-62" y="-39" width="27" height="78" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4 3"/>
    <g fill="none" stroke="#666" stroke-width="1.3" stroke-dasharray="5 4">
      <rect x="38" y="-15" width="16" height="30"/>
      <rect x="-58" y="-11" width="104" height="22"/>
    </g>
  </g>

  <!-- new long-edge straps near mid-length -->
  <g transform="translate({{view.mid}} {{view.top}})">
    <rect x="-16" y="-48" width="32" height="14" fill="#8a9099" stroke="#111" stroke-width="1.2"/>
    <rect x="-11" y="-42" width="22" height="70" fill="#6b7178" stroke="#111" stroke-width="1.2"/>
    <circle cx="0" cy="-18" r="6" fill="#ddd" stroke="#111"/>
  </g>
  <g transform="translate({{view.mid}} {{view.bottom}})">
    <rect x="-16" y="34" width="32" height="14" fill="#8a9099" stroke="#111" stroke-width="1.2"/>
    <rect x="-11" y="-28" width="22" height="70" fill="#6b7178" stroke="#111" stroke-width="1.2"/>
    <circle cx="0" cy="18" r="6" fill="#ddd" stroke="#111"/>
  </g>

  <!-- end cuts by Y travel -->
  <circle cx="{{view.cutter1_x}}" cy="{{view.cutter1_y}}" r="7" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <line x1="24" y1="{{view.cutter1_y}}" x2="24" y2="{{view.cutter2_y}}" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="16" y="{{view.minus_y_label}}">−Y</text>
  <circle cx="{{view.cutter2_x}}" cy="{{view.cutter2_y}}" r="7" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <line x1="630" y1="{{view.cutter2_y}}" x2="630" y2="{{view.cutter1_y}}" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="621" y="{{view.top}}">+Y</text>

  <!-- in-figure labels -->
  <text x="{{view.mid}}" y="{{view.label1_y}}" text-anchor="middle">blocks clear both end cuts</text>
  <text x="{{view.mid}}" y="{{view.label2_y}}" text-anchor="middle">A / ZERO EDGE front</text>
  <text x="{{view.step3_x}}" y="{{view.step_y}}">3  First end: ZERO END, X0</text>
  <text x="{{view.step4_x}}" y="{{view.step_y}}" text-anchor="end">4  Second end: {{cad.length_in:.2f}}</text>

  <!-- CAD length from ZERO END -->
  <g stroke="#111" stroke-width="1">
    <line x1="{{view.zero}}" y1="{{view.ext_top}}" x2="{{view.zero}}" y2="{{view.ext_bottom}}"/>
    <line x1="{{view.far}}" y1="{{view.far_ext1_top}}" x2="{{view.far}}" y2="{{view.far_ext1_bottom}}"/>
    <line x1="{{view.far}}" y1="{{view.far_ext2_top}}" x2="{{view.far}}" y2="{{view.ext_bottom}}"/>
    <line x1="{{view.dim_x1}}" y1="{{view.dim_y}}" x2="{{view.dim_x2}}" y2="{{view.dim_y}}" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <text x="{{view.dim_label_x}}" y="{{view.dim_label_y}}" text-anchor="middle">{{cad.length_in:.2f}}</text>

  <!-- axes -->
  <g stroke="#111" stroke-width="1.5">
    <line x1="610" y1="335" x2="655" y2="335" marker-end="url(#arr)"/>
    <line x1="610" y1="335" x2="610" y2="300" marker-end="url(#arr)"/>
  </g>
  <text x="660" y="340">+X</text>
  <text x="618" y="310">+Y</text>
</svg>
