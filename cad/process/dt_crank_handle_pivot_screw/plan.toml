# Crank handle pivot screw MHA-DT-32, one off, on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC), from
# the owned 1/4 in 1018 rod. Order of manufacture: the MHA-DT-35 butt cup
# (bonded into the handle) first, this screw last. Owner ruling 2026-11-24,
# fit audit question 15 (no matching): the head is turned to its own
# Ø.231-.241 and clears any pocket the cup's 1/4 end mill cuts (.248-.257);
# nothing is read off the cup. The shoulder is turned to its own drawn
# .1535-.1585 (owner ruling 2026-11-24, fit audit question 14: "limits
# .1535-.1585"); MHA-DT-08's bore is a plain #20 drilled hole, .1610-.1650
# (D26), so the largest shoulder still clears the smallest bore by .0025
# (delegated ruling 2026-11-25 (Main)): nothing is read off the handle.
#
# - Bench: measure the bonded handle (MHA-DT-08 with MHA-DT-34 and -35) for
#   the shoulder's length (drawing note 1: the measured stack plus .010-.040
#   end play).
# - Saw a blank. Lathe, 3-jaw, the tip end out on the tailstock dead centre
#   ("CENTRE OK" at the tip): turn the head's diameter over the whole length
#   out of the jaws; the shoulder to the under-head station, roughed to
#   Ø.1654, then finished to the drawn .1535-.1585; the #4-40 blank to
#   the seat; the 1/16 P1 blade squares the under-head corner sharp (R.004
#   MAX; the AR insert's R0.4 nose cannot). Chamfer the head, withdraw the
#   centre, run the die to the seat, plunge the relief at the seat with the
#   blade and cut its 45° lead with the blade's corner on the compound; part
#   off at the head's length.
# - Bench: file the part-off pip, saw the screwdriver slot with the 32 TPI
#   junior hacksaw to a scribed depth, deburr, oil (FINISH: bright turned,
#   oiled).
#
# Flagged: the junior hacksaw (tools-hand.toml junior-hacksaw) and the pin
# gauges (gauges.pin-gauges, the slot's two pins) are to order. The owned
# 1 in x .032 slitting saw
# the placeholder named would need a 3/8 in arbor not on record and an NC slot
# file on the mill; the bench saw needs neither. No #4-40 ring gauge is on
# record: the thread is accepted on a #4-40 nut (the MHA-MG-VN-52 hex nut,
# McMaster 92671A005), as MHA-MG-04's.
title = "Crank Handle Pivot Screw"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} 1018 cold-finished rod, the bar on hand; one blank B = P + {{process.blank_over_p_in:.2dot}} long (Setup 1), {{process.blank_min_in:.2dot}}–{{process.blank_max_in:.2dot}} over the accepted stack."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); steel cut with cutting oil. The shoulder's length is fitted to the bonded handle (Setup 1): write the measured stack and the stations derived from it on this sheet before Setup 3."
shop = "../shop"
stock_refs = ["1018-round-1-4"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/dt_crank_handle_pivot_screw/features.toml"
adapter = "drilled_block"
part = "dt-crank-handle-pivot-screw"

[parameters]
quantity = 1
stock_dia_in = 0.25
stock_dia_mm = 6.35
# The 1/4 in rod as the stock fit reads it (the export's envelope).
blank_x_in = 0.25
blank_y_in = 0.25
# The blank and the stickout follow the part-off station P (Setup 1, from the
# measured stack M): out of the jaw fronts S = P + .33 as chucked (.03 faced
# off the tip leaves P + .30: the head turn's end at P + .10 then stands .20
# clear of the jaws), and about .57 in the jaws, so B = P + .90. Over the
# accepted stack M 1.97-2.20 (P = M + .562: 2.53-2.77) B is 3.43-3.67; the
# blank envelope and the hold below are the longest case.
blank_over_p_in = 0.90
stickout_over_p_in = 0.33
blank_min_in = 3.43
blank_max_in = 3.67
blank_z_in = 3.67
stickout_mm = 77.9
jaw_front_z_mm = -77.9
m_min_in = 1.97
m_max_in = 2.20
# Note 1's end play over the measured stack (cad.under_head_face_end_play,
# .010-.040): the shoulder is cut to the stack plus its middle.
end_play_min_in = 0.010
end_play_max_in = 0.040
end_play_aim_in = 0.025
# The seat's DRO station: the middle of the drawing's .37-.39 from the tip.
seat_z_in = 0.380
# Turning on the dead centre: the passes start at the tip face (the centre's
# point is inside the countersink there, under the thread blank's Ø), light
# passes at the centre setting's .002 in/rev (shop/dt.toml
# dt-lathe-ar-1018-centre).
turn_start_z_mm = 0.0
# Rough passes .004 in deep on the radius: the slender 1018 between the
# centres bends under more (prechips turning_deflection).
rough_radial_doc_mm = 0.1
# Finish passes .0005 in deep at .001 in/rev: the shoulder's Ø.155 between
# the centres, at the longest stickout (the stack's top), springs under
# .0002 (prechips turning_deflection's finish limit, .005 mm).
finish_radial_doc_mm = 0.012
finish_feed_mm_rev = 0.0254
turn_feed_mm_rev = 0.0508
# The head's diameter turned over the whole stickout, to the part-off and
# .8 mm past the blade: Z of its end (the drawn screw).
head_turn_end_z_mm = -69.0
# Aims, mm: the head at the middle of its drawn Ø.231-.241 (.236; owner
# ruling 2026-11-24, fit audit question 15: nothing is read off the cup);
# the shoulder roughed to .1654 and finished at the middle of its drawn
# .1535-.1585 (owner ruling 2026-11-24, fit audit question 14: "limits
# .1535-.1585"); the thread blank at .1085, inside
# cad.thread_dia (the #4-40 UNC-2A major .1061-.1112, the title block's
# CLASS 2A).
head_aim_dia_mm = 5.9944
shoulder_rough_dia_mm = 4.2
shoulder_aim_dia_mm = 3.9624
thread_rough_dia_mm = 2.957
thread_aim_dia_mm = 2.7559
# The bands' low ends, mm (cad.head_dia, cad.shoulder_dia, cad.thread_dia):
# no pass goes under them.
head_dia_min_mm = 5.8674
shoulder_dia_min_mm = 3.8989
thread_dia_min_mm = 2.69494
# The drawn under-head and seat stations from the tip (Z0), mm: the
# shoulder's turning runs to the under-head station less .25 mm before the
# blade squares the corner (Op 120).
seat_z_mm = -9.652
under_head_z_mm = -62.5602
shoulder_rough_end_z_mm = -62.31
# The head's kept span (the under-head face to the drawn part-off), for the
# turning-deflection check; the tip's Z0 for the thread's.
part_off_z_mm = -66.548
tip_z_mm = 0.0
# The 1/16 P1 cutoff blade (tools-cutting.toml cutoff-blade-p1 width_in).
blade_width_in = 0.0625
# The relief: the blade's chuck-side face on the seat (first plunge, to the
# lead's outer Ø), then moved toward the tip by the relief's middle width
# less the blade (.090 - .0625) for the second plunge to the floor; the lead
# cut by the blade's chuck-side corner along the compound at 45°, .012 in Z
# (the compound's dial reads .017 along its slide).
relief_step_in = 0.0275
relief_aim_dia_in = 0.070
lead_outer_dia_in = 0.094
lead_axial_in = 0.012
lead_compound_in = 0.017
# The head's chamfer (.005-.010 X 45°) aimed at its middle.
head_chamfer_aim_in = 0.0075
# The tip's thread-start chamfer (the drawing's .015 MAX) is filed at the
# bench after the part-off (Setup 4): no lathe cut at the unsupported tip.

