<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 200 px/in along and across the axis: the Ø1/4 rod (process.stock_dia_in) 3.067 out of the jaw fronts (process.stickout_mm: S = P + .33 for the drawn M), Z0 the tip; the head Ø.236 (process.head_aim_dia_mm), the shoulder Ø.156 (process.shoulder_aim_dia_mm) to the under-head face at Z-2.463 (process.under_head_z_mm, U for the drawn M), the #4-40 blank Ø.1085 (process.thread_aim_dia_mm) to the seat at Z-.380 (process.seat_z_in), the part-off at Z-2.620 (process.part_off_z_mm, P). The 3-jaw's body and jaws are schematic (their sizes are not on record). The MT3 dead centre is schematic (its sizes are not on record). The thread cut (Ops 210–220); the first plunge (Op 230) made with the blade's chuck-side face on the seat face, to Ø.094 (process.lead_outer_dia_in). The P1 blade to scale across (1/16 = 12.5 px), its chuck-side face .0275 (process.relief_step_in) toward the tip from the seat face, plunged to Ø.070 (process.relief_aim_dia_in). The dead centre back in. -->
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 3, Op 240: the blade's second plunge, .0275 toward the tip, to the Ø.070 relief floor (to scale, 200 px/in)</text>
