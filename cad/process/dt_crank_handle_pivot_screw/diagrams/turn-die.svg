  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 200 px/in along and across the axis: the Ø1/4 rod (process.stock_dia_in) 3.067 out of the jaw fronts (process.stickout_mm: S = P + .33 for the drawn M), Z0 the tip; the head Ø.236 (process.head_aim_dia_mm), the shoulder Ø.156 (process.shoulder_aim_dia_mm) to the under-head face at Z-2.463 (process.under_head_z_mm, U for the drawn M), the #4-40 blank Ø.1085 (process.thread_aim_dia_mm) to the seat at Z-.380 (process.seat_z_in), the part-off at Z-2.620 (process.part_off_z_mm, P). The 3-jaw's body and jaws are schematic (their sizes are not on record). The MT3 dead centre is schematic (its sizes are not on record). The thread blank finished Ø.1085 (process.thread_aim_dia_mm); the dead centre out. The round die to scale across its 13/16 OD (tools.dies-zoro-wb7365521946); its thickness and the die stock's body and handles are not on record: drawn schematic, the handles to break lines. The die, the die stock and the quill's face behind it travel with the tool. Drawn near the seat, the thread cut behind it. Dashed: the screw's end, out to the tip (Z0), inside the hollow quill (its bore not on record). -->
