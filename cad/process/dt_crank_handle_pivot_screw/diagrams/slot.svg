<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the bench vise from the front, to scale at 300 px/in: the screw upright, head up: the head Ø.262 x .157 (cad.head_dia_in, cad.head_length_in) with its .021 x 45° under-head chamfer just clear of the soft jaws (drawn .03 above them), the shoulder Ø.156 (cad.shoulder_dia_in) gripped over a paper wrap (its thickness not drawn), running down to a break line. The soft jaws are schematic (their size is not on record). The smooth file schematic (its width and thickness are not on record), coming across from the right. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 4, Op 290: the part-off pip filed flat, the file flat across the head face (to scale, 300 px/in)</text>
  <rect class="clamp" x="236.6" y="230" width="120" height="115"/>
  <rect class="clamp" x="403.4" y="230" width="120" height="115"/>
  <text class="label-on-clamp" x="246.6" y="252">soft jaw</text>
  <text class="label-on-clamp" x="413.4" y="252">soft jaw</text>
  <path class="part-kept" d="M356.6 352L356.6 221L403.4 221L403.4 352L395.6 349L387.8 352L380 349L372.2 352L364.4 349Z"/>
  <path class="part-kept" d="M340.7 173.9L419.3 173.9L419.3 214.7L413 221L347 221L340.7 214.7Z"/>
  <rect class="cutter" x="419.3" y="164.9" width="280.7" height="9"/>
  <line class="arrow" x1="550" y1="143.9" x2="470" y2="143.9"/>
  <text class="label" x="470" y="127.9">smooth file, flat across the head face</text>
  <text class="label" x="30" y="80">the part-off pip filed flat; then the head's length</text>
  <text class="label" x="30" y="96">read with the calipers, {{cad.head_length_min_in:.3dot}}–{{cad.head_length_max_in:.3dot}}</text>
  <line class="leader" x1="250" y1="96" x2="376" y2="173.9"/>
  <circle class="leader-dot" cx="376" cy="173.9" r="2"/>
  <text class="label" x="543.4" y="300">soft jaws on the shoulder,</text>
  <text class="label" x="543.4" y="316">over a paper wrap</text>
</svg>
