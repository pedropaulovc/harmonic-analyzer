<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 200 px/in along and across the axis: the Ø3/8 rod (process.stock_dia_in) 3.067 out of the jaw fronts (process.stickout_mm: S = P + .33 for the drawn M), Z0 the tip; the head Ø.262 (process.head_aim_dia_mm), the shoulder Ø.156 (process.shoulder_aim_dia_mm) to the under-head face at Z-2.463 (process.under_head_z_mm, U for the drawn M), the #4-40 blank Ø.1085 (process.thread_aim_dia_mm) to the seat at Z-.380 (process.seat_z_in), the part-off at Z-2.620 (process.part_off_z_mm, P). The 3-jaw's body and jaws are schematic (their sizes are not on record). The MT3 dead centre is schematic (its sizes are not on record). The AR tool schematic (not on record). Hatched: the about .03 faced off; dashed: this setup's turned outline. The dead centre goes in from Op 60 (after the centre drill): not drawn here. -->
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 3, Op 40: the AR tool faces the tip square, about .03 off: Z0 (to scale, 200 px/in)</text>
  <rect class="fixture-vise" x="-19.39" y="110.5" width="56" height="159"/>
  <path class="part-kept" d="M40 152.5L690 152.5L690 227.5L40 227.5L37 216.79L40 206.07L37 195.36L40 184.64L37 173.93L40 163.21Z"/>
  <rect class="clamp" x="36.61" y="122.5" width="40" height="30"/>
  <rect class="clamp" x="36.61" y="227.5" width="40" height="30"/>
  <line class="centre-line" x1="20" y1="190" x2="740" y2="190"/>
  <rect class="part-removed" x="690" y="152.5" width="6" height="75"/>
  <path class="hidden" d="M146.69 163.8L197.4 163.8L197.4 174.4L614 174.4L614 179.13L690 179.13"/>
  <line class="hidden" x1="166" y1="163.8" x2="166" y2="216.2"/>
  <path class="cutter" d="M690 198L720 214L720 298L712 295L704 298L696 298L696 230Z"/>
