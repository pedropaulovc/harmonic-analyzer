  <line class="centre-line" x1="20" y1="190" x2="740" y2="190"/>
  <rect class="part-removed" x="690" y="165" width="6" height="50"/>
  <path class="hidden" d="M146.69 166.4L197.4 166.4L197.4 174.4L614 174.4L614 179.13L690 179.13"/>
  <line class="hidden" x1="166" y1="166.4" x2="166" y2="213.6"/>
