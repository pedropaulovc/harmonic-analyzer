<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above (the cross-slide at the bottom), to scale at 200 px/in along and across the axis: the Ø1/4 rod (process.stock_dia_in) 3.067 out of the jaw fronts (process.stickout_mm: S = P + .33 for the drawn M), Z0 the tip; the head Ø.236 (process.head_aim_dia_mm), the shoulder Ø.156 (process.shoulder_aim_dia_mm) to the under-head face at Z-2.463 (process.under_head_z_mm, U for the drawn M), the #4-40 blank Ø.1085 (process.thread_aim_dia_mm) to the seat at Z-.380 (process.seat_z_in), the part-off at Z-2.620 (process.part_off_z_mm, P). The 3-jaw's body and jaws are schematic (their sizes are not on record). The MT3 dead centre is schematic (its sizes are not on record). The AR tool schematic (not on record). Hatched: the about .03 faced off; dashed: this setup's turned outline. The dead centre goes in from Op 60 (after the centre drill): not drawn here. -->
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 3, Op 40: the AR tool faces the tip square, about .03 off: Z0 (to scale, 200 px/in)</text>
  <rect class="fixture-vise" x="-19.39" y="123" width="56" height="134"/>
  <path class="part-kept" d="M40 165L690 165L690 215L40 215L37 207.86L40 200.71L37 193.57L40 186.43L37 179.29L40 172.14Z"/>
  <rect class="clamp" x="36.61" y="135" width="40" height="30"/>
