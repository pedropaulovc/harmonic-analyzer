  <circle class="leader-dot" cx="708" cy="278" r="2"/>
  <text class="label" x="100" y="102">dashed: the head Ø{{cad.head_dia_min_in:.3dot}}–{{cad.head_dia_max_in:.3dot}}, the shoulder, the #4-40</text>
  <text class="label" x="100" y="118">blank to the seat at Z-{{process.seat_z_in:.3dot}}; the part-off at Z−P</text>
  <line class="leader" x1="408" y1="124" x2="410" y2="170.4"/>
  <circle class="leader-dot" cx="410" cy="170.4" r="2"/>
