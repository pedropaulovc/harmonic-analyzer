<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the bench vise from the front, to scale at 300 px/in: the screw upright, head up: the head Ø.236 x .157 (cad.head_dia_in, cad.head_length_in) just clear of the soft jaws (drawn .03 above them), the shoulder Ø.156 (cad.shoulder_dia_in) gripped over a paper wrap (its thickness not drawn), running down to a break line. The soft jaws are schematic (their size is not on record). The slot .04 wide (cad.slot_width_in) shown sawn to .04 deep (cad.slot_depth_in), between the lines scribed .030 and .050 below the head face (cad.slot_depth_min_in, cad.slot_depth_max_in). The hacksaw's blade is schematic (its thickness and depth are not on record), seen edge-on in the kerf. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 4, Op 330: the hacksaw cuts the slot through the head's centre (to scale, 300 px/in)</text>
  <rect class="clamp" x="236.6" y="230" width="120" height="115"/>
  <rect class="clamp" x="403.4" y="230" width="120" height="115"/>
  <text class="label-on-clamp" x="246.6" y="252">soft jaw</text>
  <text class="label-on-clamp" x="413.4" y="252">soft jaw</text>
  <path class="part-kept" d="M356.6 352L356.6 221L403.4 221L403.4 352L395.6 349L387.8 352L380 349L372.2 352L364.4 349Z"/>
  <rect class="part-kept" x="344.6" y="173.9" width="70.8" height="47.1"/>
  <rect class="holes" x="374" y="173.9" width="12" height="12"/>
  <line class="datum" x1="294.6" y1="182.9" x2="342.6" y2="182.9"/>
  <line class="datum" x1="294.6" y1="188.9" x2="342.6" y2="188.9"/>
  <text class="datum-label" x="288.6" y="184.9" text-anchor="end">scribed {{cad.slot_depth_min_in:.3dot}} below the head face</text>
  <text class="datum-label" x="288.6" y="204.9" text-anchor="end">scribed {{cad.slot_depth_max_in:.3dot}} below it</text>
  <path class="cutter" d="M375 185.9L385 185.9L385 40L380 37L375 40Z"/>
  <text class="label" x="410" y="70">hacksaw blade through the head's centre, square to</text>
  <text class="label" x="410" y="86">the face; the floor between the lines on both sides</text>
  <line class="leader" x1="408" y1="66" x2="386" y2="90"/>
  <circle class="leader-dot" cx="386" cy="90" r="2"/>
  <text class="label" x="543.4" y="300">soft jaws on the shoulder,</text>
  <text class="label" x="543.4" y="316">over a paper wrap</text>
</svg>
