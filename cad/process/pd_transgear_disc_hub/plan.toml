# Transgear disc hub MHA-PD-17, one off, from the 1-1/8 in C36000 bar bought
# for it (cad/config/shop-equipment/stock-bought.toml c360-round-1-1-8, one
# 3 in piece). Turned on the manual PM-1127VF-LB (owner ruling 2026-11-21:
# turned parts get lathe travelers, no NC); the flange holes and the key
# pin's chord hole drilled and reamed on the PM-30MV CNC (CM01-CM03).
# Route, chosen for speed (owner ruling 2026-11-21: the agent picks):
# - Setup 1, lathe, the bar in the 3-jaw, Z0 the faced hub front face: turn
#   the flange Ø1.05 back past the parting line, the hub body Ø.540 back to
#   the flange's front face (both steps face the tailstock, so the AR turns
#   them), part off .02 long.
# - Setup 2, lathe: first a brass trial piece, drilled N and reamed by hand,
#   proves the adjustable reamer's setting (Ops 60-100). Then the hub turned
#   round, its body in the 3-jaw over a shim wrap, the flange's front face
#   seated on the jaw fronts: face the spigot end to the overall from the
#   miked length (Z0), turn the spigot to the MHA-PD-06 disc's reamed bore
#   (Ø.498 REF) and face the flange's rear face with the sharp-nose tool (the
#   root R.004 MAX), then centre, drill N and ream .3135 through by hand at
#   the proved setting: the bore, the
#   flange's rear face and the spigot's end are cut in one chucking, so both
#   faces run square to the bore (datum A), checked there with the DTI.
# - Setup 3, PM-30MV, vise: the hub upright, the flange's front face on two
#   stacked parallels, the body hanging between them, gripped on the flange;
#   X0 Y0 the bore swept with the DTI. CM01 spots and drills the three #51
#   holes through the flange on the Ø.75 circle. Their clocking is free: the
#   sheet relates them to nothing.
# - Setup 4, PM-30MV, vise: the hub lying, gripped end to end (the hub front
#   face on the fixed jaw, the spigot end on the moving jaw), its body on a
#   1 in parallel. CM02 plunges a flat with the 1/16 end mill on the sloping
#   O.D. (the chord meets it 40° off square), drills the #56 knockout
#   through and the #53 to the stop; CM03 reams .0615 to the stop. The stop
#   (the title block's ±.005) is measured with the set's .061 pin standing in the ream and
#   CM03 is run again deeper by the shortfall: a chucking reamer's bevel
#   leaves its full diameter short of its tip by an unknown .000-.010.
#   That rerun may end-cut up to .010 into the #53's 118° point cone below
#   the stop, by design (Codjiflo #3407 P2): the cone is the VN-69 pin's
#   firm seat, so the #53 is not drilled deeper to make room. The reamer
#   end-cuts free-machining C360 lightly and only once, by the measured
#   shortfall (ops 370-380). cam.py repeats this rationale beside the stop.
# - Setup 5, bench: deburr, clear the bore, try the pin's ream, oil.
# Left to MHA-PD-00 (final op): the MHA-PD-VN-69 pin pressed into the ream
# (step 8A), the disc spotted through the three flange holes (9G), the
# Ø.043 oil hole match-drilled with MHA-PD-10 (17).
#
# Not on hand (to order): the .0615 chucking reamer
# (cad/config/shop-equipment/tools-reamers-taps.toml reamer-0615), the
# sharp-nose lathe tool for the spigot's R.004 MAX root
# (tools-special-cutters.toml lathe-tool-sharp-nose) and the 1/16 long-reach
# end mill, Harvey Tool 34662, bought for MHA-MS-02 too
# (endmill-carbide-3fl-1-16-reach-1-2).
# The bore's GO, the Class ZZ .3135 plus pin (gauges.toml zz-pins-3135-3140,
# MSC 88931357), is on the buy list for MHA-DT-14 too.
#
# The bore is reamed by hand with the owned adjustable set
# (tools-reamers-taps.toml reamers-adjustable-lms-5948): delegated ruling
# 2026-11-25 (Main), no precedent; owner review
# https://github.com/pedropaulovc/harmonic-analyzer/issues/2144 (D19 as
# amended). It departs from the owner's fixed reamer for each running or
# press fit (2026-11-20, #3073) for this bore because the bore is made to
# fit: the sheet prints Ø.3135 REAM THRU with no band, and the MHA-PD-10
# sleeve's boss is turned last to this bore until the hub slides on by hand
# with no rock. The bore's size still bounds two walls, so it is gauged to
# the printed size: under .3140 for WALL .071 MIN over the spigot, figured
# there with no margin (pd_transgear_disc_hub_spec SPIGOT_WALL_WORST,
# BORE_WALLS_FINISHED), and .3135 or over so the boss turned to it (.0000-
# .0010 clear) stays at .3130 or over, where MHA-PD-10 RV-04 figures its
# .0730 wall. GO: the Class ZZ .3135 plus pin; NO-GO: the set's .314 minus
# (owner ruling 2026-11-26, Pedro: "1: ZZ .3135 plus pin as GO (already on
# the buy list), set's .314 minus pin as NO-GO (recommended)"). The reamer
# is set over its blades by micrometer and proved in a brass trial piece
# until the trial hole takes the GO and refuses the NO-GO; the bore is then
# accepted the same way.
#
# Rule 4, form 2 for the bore, form 3 for the chord ream (the owner, 2026-11-23:
# "why do we need single micron level tolerance x class plug gauges for a
# hobby machining project"): both reamed holes print their reamers' sizes
# and no band. The chord ream takes no Class ZZ pin (zz-pins-0615-0620 is
# not used); the bore is the one exception, by the 2026-11-26 ruling above.
# The chord ream is accepted by its mate (traveler-guidelines T0): the
# MHA-PD-VN-69 dowel does not enter by hand. The set's .061 pin (it enters
# the ream) stands in it for the stop and the station; cad.bore_dia_band_mm
# and cad.pin_ream_dia_band_mm are the spec's analysis bands, bound only
# where a ream's sizing or gauge needs one.
#
# Tool audit 2026-11-23 (row endmill-carbide-3-64): the flat is plunged with
# the 34662 (.0620, centre cutting, "optimized for plunging") instead of a
# 3/64. Its .062 pocket lies inside the .0615-.0620 ream that follows on the
# same axis (any ring left is under .0005 radial, taken by the reamer), and
# its outer edge meets the O.D. lower, so the flat goes one peck deeper.
#
# NC (cad/process/pd_transgear_disc_hub/cam.py): CM01_flange_holes,
# CM02_pin_hole, CM03_pin_ream. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 #2 centre drill, T2
# #51, T3 1/16 end mill, T4 #56, T5 #53, T6 .0615 reamer.
title = "Transgear Disc Hub"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass, 360-H02 half-hard, 1-1/8 in round (drawing: {{cad.material_name}})"
stock = "Lot: {{process.quantity:d}} hub. Ø{{process.bar_dia_in:.3dot}} bar, on hand (one 3 in piece); Setup 1 takes about {{process.bar_use_in:.2dot}} in of it. Chuck it with at least 1.5 in in the jaws."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); mill PM-30MV low belt (100–2800 rpm). Brass cut dry. Home the mill ($H) and touch off G54 at the start of each mill setup; prove each file in air before it cuts. To order (not on hand): the .0615 reamer, the pin-gauge set and .3135 GO pin, the sharp-nose lathe tool and the 1/16 carbide end mill (Harvey Tool 34662). The MHA-PD-VN-69 dowel tries the chord ream."
shop = "../shop"
stock_refs = ["c360-round-1-1-8"]
material_key = "lathe-c360"
milling_material = "brass"
turning_material = "brass"

[cad]
file = "../../out/features/pd_transgear_disc_hub/features.toml"
adapter = "drilled_block"
part = "pd-transgear-disc-hub"

[parameters]
quantity = 1
bar_dia_in = 1.125
# Setup 1: .02 faced, the hub's .559 parted length and its kerf.
bar_use_in = 0.66
# The blank a hub is cut from (stock_fit: envelope X, Y, Z): the 1-1/8 bar,
# the parted length plus the facing allowance.
blank_x_in = 1.125
blank_y_in = 1.125
blank_z_in = 0.579
# Setup 1: out of the jaw fronts, the facing, the .559 parted length, its
# kerf and room for the blade and the AR to clear the jaws.
stickout_mm = 20.32
face_allowance_in = 0.02
# Setup 1 turns the flange this far back from Z0, past the parting line.
flange_run_in = 0.66
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
# Parting kerf: the blade's width plus .0125 (authored).
part_kerf_in = 0.075
# Setup 1 parts the hub off .02 over its .539 overall.
regrip_allowance_in = 0.02
part_off_in = 0.559
# Setup 2: the body in the jaws, the flange's front face on the jaw fronts;
# out of them the flange and the parted end: .559 less the .301 body.
regrip_out_mm = 6.5532
# The overall Setup 2 faces to: the middle of the .538–.540 band.
length_target_in = 0.539
# The spigot's rough diameter and length before the sharp-nose tool
# finishes it and the flange's rear face.
spigot_rough_dia_in = 0.51
spigot_rough_length_in = 0.14
# The spigot's finish (Op 150): the sharp-nose tool's nose R.003-.004 (the
# root's R.004 MAX), turned at the lathe's finest longitudinal power feed,
# .0025 in/rev (the maker's page: longitudinal feeds .0025-.012 IPR, cross
# feeds .001-.0056 IPR). Its cusp is f^2/(8r): at R.003, .0025^2/.024 =
# .00026 radial. Rule 4, form 2 (drawing-guidelines): the
# spigot is made to fit. The sheet prints its size REF and the requirement
# is its diametral clearance in the MHA-PD-06 disc's reamed bore (note 4),
# so the disc's bore is reamed before this operation and the acceptance is
# the trial of that disc on the spigot, its shake read on the DTI; no size
# band is gauged. The cuts are steered by the mate too (traveler review
# 2026-11-24, three runs: a fixed aim scrapped spigots under a large bore):
# the micrometer (it reads the two-point size across the crests, which is
# what enters the disc) takes the spigot to a first size the .501 reamer's
# hole accepts with shake still under the clearance, the disc is tried and
# its shake S read, and the last cut takes half of (the aimed shake, the
# middle of the clearance, less S), then a spring pass at the same setting.
# The flange's rear face takes the .001 in/rev cross feed: its cusp .00004.
# Op 150 faces it at Z-F, F = T (Op 120's miked flange-front-face to
# spigot-end length) less the flange's .094: the flange's need, an
# in-process target the drawing does not print. T is the overall .538-.540
# less the Op 30 step .299-.303, .235-.241, so F runs .141-.147, inside the
# spigot's printed .139-.149; a fixed Z-.144 left the flange .086-.102
# against its .089-.099 (Codjiflo #3592 r1).
spigot_first_dia_in = 0.5
spigot_aim_shake_in = 0.004
# Setup 2 drills through from the spigot end: the quill reading past the
# hub front face (inside the chuck's bore).
drill_run_in = 0.75
# The bore's hand ream (Ops 90 and 190). The N drill (.302) leaves .0115 on
# the diameter; a hand reamer takes .003-.005 at .250 and .004-.008 at .500
# (Yankee Reamer, "Drilling the Right Diameter Before Reaming"), and no
# owned drill lies between N and 5/16 (the 115-piece index), so the
# adjustable reamer takes it in two settings over its blades: about half,
# then .3135, opened from there in .0001 steps until the trial hole takes
# the GO (.3135 plus) and refuses the NO-GO (.314 minus).
ream_first_set_in = 0.308
ream_second_set_in = 0.3135
ream_open_step_in = 0.0001
# A setting that lets the NO-GO in (the first .3135 pass included) restarts
# on a new offcut this much under it, then opens in the steps above.
ream_back_off_in = 0.0003
# The bore's pins, each miked before use (Op 60): the GO, a Class ZZ plus
# pin, .3135-.3137; the NO-GO, the set's Class ZZ minus, .3138-.3140.
go_pin_min_mm = 7.9629
go_pin_max_mm = 7.96798
nogo_pin_min_mm = 7.97052
nogo_pin_max_mm = 7.9756
# Mill (shop records, as pd_transgear_drive_collar): the PM 6 in vise.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
# Setup 3 (CM01): against each jaw a stack of the set's 1 in and 1/2 in
# parallels, 1/8 in thick (fixtures.parallels-lms-6745), the flange's front
# face on their tops, the body hanging in the gap between them; the jaw
# tops above Z0 (the flange's rear face). cam.py recomputes both.
parallel_stack_mm = 38.1
parallel_thickness_mm = 3.175
flange_parallel_gap_mm = 20.32
flange_jaw_top_mm = 4.4577
# Spots with the #2 centre drill on its pilot's point, Ø.050 under the #51
# (.067); the #51's full diameter 1.0 mm past the flange's front face into
# the gap, its point there (cam.py checks the tip).
flange_spot_dia_mm = 1.27
flange_drill_past_mm = 1.0
flange_drill_tip_mm = -3.8989
# Every CM01 tool at least this far out of the chuck: the deepest tip below
# the jaw tops plus 5 mm (cam.py checks it).
flange_tool_out_min_in = 0.55
# Setup 4 (CM02, CM03): a 1 in parallel, 1/8 in thick, against the fixed
# jaw under the body; the jaw tops and the flange's top above Z0 (the hub's
# axis). cam.py recomputes both.
pin_parallel_height_mm = 25.4
pin_jaw_top_mm = 12.6873
pin_flange_top_mm = 13.335
# The 1/16 end mill plunges a flat 0.2 mm under the O.D. at its outer edge
# (the chord meets the O.D. 40° off square: a drill would walk), in pecks;
# its reach (34662: .500 behind the flutes) takes it past the O.D. under its
# shank (cam.py checks both).
pin_flat_bottom_mm = 4.2631
pin_flat_peck_mm = 0.4
endmill_reach_min_in = 0.1
# The #56 knockout through, its full diameter 0.3 mm past the O.D. at the
# hole's inner edge, the point then 0.5 mm over the parallel; the #53 to
# the stop at its full diameter; the reamer's end at the stop (its bevel
# leaves it short, measured and taken up in Ops 370–380). The stop's band
# (the title block's ±.005 on .160)
# as the console reads it (Z below the axis, mm); cam.py checks both.
stop_shallow_mm = -3.937
stop_deep_mm = -4.191
knockout_past_mm = 0.3
knockout_tip_mm = -6.3444
pilot_tip_mm = -4.518
ream_tip_mm = -4.064
peck_56_mm = 1.0
peck_53_mm = 1.2
# Every CM02/CM03 tool at least this far out of the chuck: the deepest tip
# below the flange's top plus 5 mm (cam.py checks it).
pin_tool_out_min_in = 1.0
# Speeds and feeds: the shop settings (cad/process/shop/pd.toml, the
# MHA-PD-22 and MHA-PD-17 blocks, sourced there): the spot and the drills
# 2800 rpm × .001 in/rev = 2.8 in/min; the end mill's plunge and the reamer
# 1400 in/min at 2800 and 1400 rpm. cam.py refuses a feed that is not its
# setting's.
spot_feed_per_min_mm = 71.12
drill_feed_per_min_mm = 71.12
plunge_feed_per_min_mm = 35.56
ream_feed_per_min_mm = 35.56

