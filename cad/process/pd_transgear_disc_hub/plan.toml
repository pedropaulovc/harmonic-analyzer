peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "reamers-adjustable-lms-5948"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped. Set the reamer to {{process.ream_first_set_in:.3dot}} with the micrometer over two opposite blades, each setting on the set's piece whose range covers it. Its centre on the tailstock centre, a tap wrench on its square: turn it clockwise seen from the tailstock (its cutting direction) only, winding the tailstock in to keep the centre seated, through the trial hole until the blades' back ends reach the face; draw it out still turning clockwise. Open it to {{process.ream_second_set_in:.4dot}} and ream again the same way."
inspection = "Trial hole: the GO passes through, the NO-GO does not enter. Write the reamer's setting, miked over its blades, here as R."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "The GO refused in Op 90: open the reamer {{process.ream_open_step_in:.4dot}} by the micrometer, ream the trial hole again and try both pins again. The NO-GO entering, at the first {{process.ream_second_set_in:.4dot}} setting or later: chuck a new offcut, repeat Ops 60–90 (the pins need no second miking) with the second setting {{process.ream_back_off_in:.4dot}} under the one that let it in, then open it {{process.ream_open_step_in:.4dot}} at a time as above."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Mike the hub's length across the rims, from the hub front face to the parted end, clear of the parting pip: L0 (about {{process.part_off_in:.3dot}}). Mike the flange end at its rim, from the flange's front face to the parted end: T0. Write both down. Chuck it; spindle running, touch the AR lightly on the parted end's rim and set DRO Z to L0 less {{process.length_target_in:.3dot}}. Face in light skims to Z0: the spigot's end."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.flange_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: between two jaws, mike the flange end at its rim again, from the flange's front face to the faced end: T. The overall is T plus (L0 less T0); the hub front face is inside the chuck."
inspection = "Overall (T plus L0 less T0) {{cad.spigot_end_length_min_in:.3dot}}–{{cad.spigot_end_length_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.spigot_end_length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Overall over {{cad.spigot_end_length_max_in:.3dot}} in Op 120: spindle running, touch the AR lightly on the spigot end's rim; set DRO Z to the excess (the Op 120 overall less {{process.length_target_in:.3dot}}); face in light skims to Z0; mike T again. Under {{cad.spigot_end_length_min_in:.3dot}}: scrapped, not reworked; make another from Setup 1 (the bar holds a second)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the spigot from Z0 back to Z-{{process.spigot_rough_length_in:.3dot}} by the DRO, to Ø{{process.spigot_rough_dia_in:.3dot}}: the sharp-nose tool finishes it and the flange's face in Op 150."
settings = "lathe-ar-c360"
cut_diameter_mm = 12.954

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Write F = T (Op 120) less {{cad.flange_front_face_thickness_mm:in.3dot}}, the flange's thickness. Sharp-nose tool, on centre: turn the spigot from Z0 to Z-F at the .0025 in/rev power feed to Ø{{process.spigot_first_dia_in:.3dot}}, miked. Spindle stopped, try the reamed MHA-PD-06 disc on it and read its shake S as in the Check. S under {{cad.spigot_diametral_clearance_min_in:.3dot}}: take the last cut at half of ({{process.spigot_aim_shake_in:.3dot}} less S), then a spring pass. Then face the flange's rear face out to the rim at Z-F on the .001 in/rev cross feed, the root left sharp (R{{cad.spigot_root_radius_max_mm:in.3dot}} MAX)."
settings = "lathe-sharp-nose-c360"
cut_diameter_mm = "{{cad.spigot_dia_ref_mm}}"
inspection = "The spigot is accepted by its mate: spindle stopped, slip the reamed MHA-PD-06 disc over the spigot up to the flange, the DTI on the carriage with its tip on the top of one of the disc's teeth; push the disc toward the DTI and pull it away, the hub not moving: the reading changes by {{cad.spigot_diametral_clearance_min_in:.3dot}}–{{cad.spigot_diametral_clearance_max_in:.3dot}}. The flange's face at Z-{{cad.spigot_length_min_in:.3dot}} to Z-{{cad.spigot_length_max_in:.3dot}}, the tool's point touched on it; the flange {{cad.flange_front_face_thickness_min_in:.3dot}}–{{cad.flange_front_face_thickness_max_in:.3dot}} thick at the rim, micrometer."
gauge_checks = [{ gauge = "dti", band_mm = "{{cad.spigot_diametral_clearance_band_mm}}" }, { gauge = "micrometers", band_mm = "{{cad.flange_front_face_thickness_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "In Op 150, the disc not going on: feed in .0005 (.001 off the diameter), a spring pass, try again. Its shake S under {{cad.spigot_diametral_clearance_min_in:.3dot}}: feed in half of ({{process.spigot_aim_shake_in:.3dot}} less S), a spring pass, try again. The face short of Z-{{cad.spigot_length_min_in:.3dot}} or the flange over {{cad.flange_front_face_thickness_max_in:.3dot}}: face on until the flange mikes {{cad.flange_front_face_thickness_mm:in.3dot}}, never past Z-{{cad.spigot_length_max_in:.3dot}}. Scrapped, not reworked (make another from Setup 1): the shake over {{cad.spigot_diametral_clearance_max_in:.3dot}}, the face past Z-{{cad.spigot_length_max_in:.3dot}}, the flange under {{cad.flange_front_face_thickness_min_in:.3dot}}, or still over {{cad.flange_front_face_thickness_max_in:.3dot}} with the face at Z-{{cad.spigot_length_max_in:.3dot}}."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 3 centre drill, about Ø.20 across: under the N drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 5.08

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-n"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the N drill in until its lips touch the spot's rim; zero the tailstock quill scale. Drill through in one steady feed until it reads {{process.drill_run_in:.2dot}} (the hole is under two diameters deep; brass clears its chips): the point breaks out of the hub front face inside the jaws; ease off as it does. It leaves the reamer about .006 a side, taken in two settings in Op 190."
settings = "lathe-drill-n-c360"
cut_diameter_mm = 7.6708
hole_depth_mm = "{{cad.spigot_end_length_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "reamers-adjustable-lms-5948"
drilling = "none"
sizing = "other"
instruction = "In this chucking (the bore, the flange's rear face and the spigot's end cut in one: datum A), ream the bore by hand as Op 90: spindle stopped, the reamer set to {{process.ream_first_set_in:.3dot}}, through until the blades' back ends reach the spigot's end. Set it back to R, the Op 90 setting, by the micrometer and ream again. Leave it set: Op 420 uses it."
inspection = "From the spigot's end: the GO passes through, the NO-GO does not enter: bore Ø{{cad.bore_dia_min_in:.4dot}} to under {{cad.bore_dia_max_in:.4dot}} (under it the spigot keeps its WALL {{cad.bore_wall_min_mm:in.3dot}} MIN; at the GO the MHA-PD-10 boss, turned last to the bore, keeps its wall)."
