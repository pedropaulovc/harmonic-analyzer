[[setups]]
machine_kind = "lathe"
title = "Bar: turn the flange and the hub body, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.bar_dia_in:.3dot}} bar, {{process.stickout_mm:in.2dot}} in out of the jaw fronts (rule)."
datum = "Z0 (carriage DRO): the bar end faced in Op 10, the hub's front face."
diagram = { file = "diagrams/bar.svg", alt = "The 1-1/8 in bar in the 3-jaw: the end faced (Z0, the hub front face), the hub body Ø.540 turned back .301 to the flange, the flange Ø1.05 turned back past the parting line; the hub parted off .559 from Z0." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = 28.575, stock_diameter_mm = 28.575, stickout_mm = "{{process.stickout_mm}}", minimum_diameter_mm = "{{cad.hub_body_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, about {{process.face_allowance_in:.2dot}} off; set DRO Z0 on it. This is the hub's front face."
settings = "lathe-ar-c360"
cut_diameter_mm = 28.575

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the flange from Z0 back to Z-{{process.flange_run_in:.2dot}}, past the parting line: rough to Ø1.06, then finish in light passes, miking between them, to Ø{{cad.flange_dia_in:.3dot}} (the band's middle)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.flange_dia_mm}}"
inspection = "Flange Ø{{cad.flange_dia_min_in:.3dot}}–{{cad.flange_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.flange_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the hub body from Z0 back to Z-{{cad.hub_body_length_mm:in.3dot}} by the DRO: rough to Ø.550, then finish in light passes, miking between them, to Ø{{cad.hub_body_dia_in:.3dot}}. Face the step square out to the flange at Z-{{cad.hub_body_length_mm:in.3dot}}: this is the flange's front face."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.hub_body_dia_mm}}"
inspection = "Hub body Ø{{cad.hub_body_dia_min_in:.3dot}}–{{cad.hub_body_dia_max_in:.3dot}}, micrometer; the step (an in-process target, not on the drawing) at {{cad.hub_body_length_mm:in.3dot}} ±.002 from Z0, the AR touched on it reading the DRO: held there, Op 150 can face the flange to {{cad.flange_front_face_thickness_mm:in.3dot}} with the spigot inside its band."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.hub_body_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Flange or hub body over its band in Op 20 or Op 30: another finish pass, mike again; the step short: face on to Z-{{cad.hub_body_length_mm:in.3dot}}. A diameter under its band, or the step past Z-.303: part the turned length off as scrap and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{process.part_off_in:.3dot}}: {{process.regrip_allowance_in:.2dot}} over the overall, for Setup 2. Hands clear: let the hub fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.flange_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face to length, turn the spigot, face the flange, ream the bore"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Ops 60–100 hold a brass trial piece first (Op 60); it comes out, kept for Op 200, once it passes. Then the hub: 3-jaw over a shim wrap of brass shim on the hub body, the flange's front face pushed flat against the jaw fronts while tightening (the body .30 long, all of it in the jaws); the parted end {{process.regrip_out_mm:in.3dot}} in out. Snug the jaws, put the DTI on the flange's rim, turn the chuck by hand and tap the flange until it runs within .001 TIR, then tighten: the bore reamed here then runs true to the body, which Setup 4 picks X0 from."
datum = "Z0: the spigot's end, faced in Op 110 to {{process.length_target_in:.3dot}} from the hub front face, preset from the length miked there."
diagram = { file = "diagrams/regrip.svg", alt = "The hub turned round, its body in the jaws over a shim wrap, the flange's front face on the jaw fronts, the parted end out: faced to length, the spigot turned to the flange's rear face, the bore drilled through from the tailstock and reamed through by hand, the reamer's centre on the tailstock centre." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.hub_body_dia_mm}}", stock_diameter_mm = "{{cad.flange_dia_mm}}", stickout_mm = "{{process.regrip_out_mm}}", minimum_diameter_mm = "{{cad.spigot_dia_ref_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "On the bench first: the Class ZZ .3135 plus GO pin (to buy) and the set's .314 minus NO-GO must be in hand; without them stop here, the bore cannot be accepted. Mike both on the .0001 micrometer and write them: GO ____, NO-GO ____. Then the reamer's trial piece: chuck a C360 brass offcut, .6–1.0 in round and about .55 long, .30 of it in the jaws as the hub will be. Face its end square with the AR."
settings = "lathe-ar-c360"
cut_diameter_mm = 25.4
inspection = "GO pin {{process.go_pin_min_mm:in.4dot}}–{{process.go_pin_max_mm:in.4dot}}, NO-GO pin {{process.nogo_pin_min_mm:in.4dot}}–{{process.nogo_pin_max_mm:in.4dot}}, micrometer: a pin outside its range is not used; get another."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.go_pin_min_mm}}", "{{process.go_pin_max_mm}}"] }, { gauge = "micrometers", band_mm = ["{{process.nogo_pin_min_mm}}", "{{process.nogo_pin_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the trial piece's centre from the tailstock with the No. 3 centre drill, about Ø.20 across, as Op 170 will spot the hub."
settings = "lathe-centre-c360"
