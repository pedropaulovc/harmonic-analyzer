instruction = "The stop: mike the .061 pin's length as P (in mm). Drop it into the ream to the stop. Jog the reamer's end (spindle stopped) down onto a .002 leaf on the pin's top end; the DRO Z, less 0.051 and less P, is the stop S (a negative Z, mm)."
inspection = "Stop {{cad.pin_ream_stop_min_in:.3dot}}–{{cad.pin_ream_stop_max_in:.3dot}} below the axis: S from Z{{process.stop_shallow_mm:.3f}} to Z{{process.stop_deep_mm:.3f}}."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "S above Z{{process.stop_shallow_mm:.3f}} in Op 370 (the reamer's bevel left the full size short): lift the pin out, lower Z0 by the shortfall, S + {{cad.pin_ream_stop_mm:.3f}}, rerun CM03_pin_ream, put Z0 back and measure again (Op 370, the pin dropped back in)."
instruction_detailed = "S above Z{{process.stop_shallow_mm:.3f}} in Op 370: spindle stopped, lift the pin out of the ream. Send $# and note the G54 line's Z as N. G10 L2 P1 Z(N − (S + {{cad.pin_ream_stop_mm:.3f}})). Run CM03_pin_ream. G10 L2 P1 Z(N). Repeat Op 370, the pin dropped back in. S below Z{{process.stop_deep_mm:.3f}}: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "The pin still in the ream: edge finder (900 rpm) on its left side from the left, then on its right side from the right, its tip about .10 above the body; the DRO midpoint is the hole's centre. (Its station from the hub front face is checked at the bench, Op 440.)"
inspection = "Hole centre X {{cad.pin_ream_chord_min_in:.3dot}}–{{cad.pin_ream_chord_max_in:.3dot}} from the axis, the DRO."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.pin_ream_chord_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "The .061 pin not entering to the stop in Op 360: lift it out, blow out the chips, oil the reamer, run CM03_pin_ream once more, G54 unchanged; try it again. It now enters: Ops 370–390. Still refused: scrapped. The dowel entering by hand (the ream is too large for the press; no cut remedies it), or the centre outside its band in Op 390: scrapped. Either way make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, clear the bore, try the pin's ream, oil"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished hub: the reamed bore through, the spigot, the flange with its three #51 holes on the Ø.75 circle, the hub body with the chord ream from +X to its stop .160 past the axis and the #56 knockout on through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr: break the outside edges, the bore's mouths, the flange holes' mouths and the chord hole's mouths, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Leave the spigot's root corner as turned (sharp) and the flange's rear face and the spigot's end flat."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "reamers-adjustable-lms-5948"
drilling = "none"
sizing = "other"
instruction = "Clear the chord hole's breakthrough slivers inside the bore: grip the adjustable reamer's shank upright in the bench vise between soft jaws, still set as it last reamed the bore, and lower the hub's bore over it by hand, turning the hub clockwise as seen from above, never backwards, through the full length; lift it off still turning clockwise. Blow out the bore and the chord hole."
feed = "hand"

[[setups.operations]]
instruction = "The chord ream after deburring: try the .061 pin in it, then offer the MHA-PD-VN-69 dowel to its mouth by hand (it is pressed at MHA-PD-00, step 8A)."
inspection = "The .061 pin enters to the stop; the MHA-PD-VN-69 dowel does not enter by hand."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "The .061 pin standing in the ream: calipers from the hub front face to the pin's far side; the station is the reading less half the pin's size (.0305)."
inspection = "Station {{cad.pin_ream_station_min_in:.2dot}}–{{cad.pin_ream_station_max_in:.2dot}} from the hub front face (calipers read .171–.190)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.pin_ream_station_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Station outside its band in Op 440, or the dowel entering by hand in Op 430: scrapped (the hole is reamed and cannot move or close); make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: {{cad.finish}}): wipe the hub clean and give it a light coat of light machine oil; wipe the ream dry for the pin's press."
feed = "hand"

[[setups.operations]]
instruction = "Left to MHA-PD-00, not done here: the MHA-PD-VN-69 pin pressed into the ream to its stop (step 8A), the disc spot-drilled through the three flange holes (9G), and the Ø{{cad.oil_hole_dia_min_in:.3dot}} oil hole match-drilled with MHA-PD-10 into the bore (17)."
feed = "hand"
