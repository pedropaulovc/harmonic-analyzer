instruction = "Still chucked, the DTI on the carriage, its tip on the flange's rear face .05 in from the rim; turn the chuck one turn by hand and read the swing. Then the same on the spigot's end, .03 in from its rim."
inspection = "Flange rear face and spigot end each swing {{cad.flange_rear_face_perpendicularity_max_mm:in.3dot}} TIR max (square to the bore within {{cad.spigot_end_perpendicularity_max_mm:in.3dot}}, datum {{cad.bore_datum}})."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{cad.flange_rear_face_perpendicularity_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
