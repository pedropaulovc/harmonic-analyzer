feed = "hand"

[[setups.operations]]
instruction = "Prove CM01_flange_holes in air, Z0 raised 1.000 in. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400). Run CM01_flange_holes to its end in air, through the tool change (T1, then T2), watching each move clear the spigot and the jaw tops. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

