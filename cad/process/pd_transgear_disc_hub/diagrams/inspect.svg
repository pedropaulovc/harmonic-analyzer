<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 5, the finished hub in section through the axis, 300 px to the inch: the hub front face at x 520, the spigot's end at x 358.3, the axis at y 200; the chord ream's mouth on the body .15 from the front face. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 5: the finished hub; break the edges, try the ream with its pin, oil</text>
  <polygon class="part-kept" points="358.3,125.3 401.5,125.3 401.5,42.5 429.7,42.5 429.7,119 520,119 520,281 429.7,281 429.7,357.5 401.5,357.5 401.5,274.7 358.3,274.7"/>
  <rect class="holes" x="358.3" y="153" width="161.7" height="94"/>
  <rect class="holes" x="401.5" y="77.45" width="28.2" height="20.1"/>
  <circle class="holes" cx="475" cy="147.8" r="9.2"/>
  <line class="centre-line" x1="330" y1="200" x2="600" y2="200"/>
  <line class="leader" x1="380" y1="125.3" x2="300" y2="90"/>
  <text class="label" x="60" y="86">spigot Ø{{cad.spigot_dia_ref_mm:in.3dot}} REF, to MHA-PD-06</text>
  <line class="leader" x1="420" y1="91" x2="560" y2="60"/>
  <text class="label" x="564" y="56">#51 thru, 3X on Ø.75</text>
  <line class="leader" x1="475" y1="147.8" x2="560" y2="110"/>
  <text class="label" x="564" y="106">.0615 ream, #56 on</text>
  <line class="leader" x1="500" y1="220" x2="560" y2="260"/>
  <text class="label" x="564" y="264">bore .3135 reamed thru</text>
  <line class="leader" x1="520" y1="270" x2="560" y2="320"/>
  <text class="label" x="564" y="324">overall {{cad.spigot_end_length_min_in:.3dot}}–{{cad.spigot_end_length_max_in:.3dot}}</text>
</svg>
