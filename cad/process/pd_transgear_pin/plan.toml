[[setups]]
machine_kind = "lathe"
title = "Bar: tip end out on the centre; turn, groove, part off"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The {{process.bar_length_in:g}} in blank, sawn off the bar with the metal-cutting saw, in the 3-jaw {{cad.stickout_in:.2dot}} in out of the jaw fronts (the pin, its kerf, the jaws' clearance and the {{process.centre_stub_in:.2dot}} in stub), the rest inside the chuck: nothing projects past the spindle's rear end. A restart pulls what is left out to {{cad.stickout_in:.2dot}} again; with under {{process.chuck_grip_in:.2dot}} + {{cad.stickout_in:.2dot}} in left a new blank is sawn. The tailstock dead centre, greased, in the stub's centre hole from Op 60 until the stub is cut off in Op 180."
datum = "Z0 (carriage DRO) the tip plane, {{process.centre_stub_in:.3dot}} in back from the bar end faced in Op 40; the sharp-nose tool is set on that faced end (Op 100); the grooving tool and the blade are set on the seat or the cut tip end as their ops say."
diagram = { file = "diagrams/bar.svg", alt = "The 1/4 in bar in the 3-jaw, the tip end out: the one-diameter shank and the head turned, the ring groove cut, the pin parted off at the head." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.groove_dia_min_mm}}", support = "tailstock" }
turning_support = { kind = "tailstock", chuck_z_mm = "{{cad.jaw_z_mm}}", centre_z_mm = "{{process.centre_stub_mm}}" }

[[setups.operations]]
cut_kind = "other"
instruction = "Before turning, have at the lathe the reamed MHA-PD-18 arm, the reamed {{cad.outer_mates}} and one MHA-PD-VN-68 shim, their bores wiped clean: the shank is fitted to them in Op 190."

[[setups.operations]]
cut_kind = "other"
instruction = "Try the pin-gauge set's .126 pin, then its .127 pin, in the MHA-PD-18 pin bore from each face, by hand and clean, never forced."
inspection = "Drawing note 1, the bond's clearance in MHA-PD-18 (.0010-.0025) on a journal polished to .1250 or just under (Op 130): the .126 pin enters and the .127 pin does not enter the pin bore."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The .126 pin does not enter the MHA-PD-18 pin bore, or the .127 pin does: the bore is outside the bond's clearance. Stop: make no pin for that arm and tell the owner."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, about .02 off, to the centre with no pip. Set the DRO Z to +{{process.centre_stub_in:.3dot}} on it: Z0 is the tip plane, the {{process.centre_stub_in:.2dot}} in beyond it a stub for the centre."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the faced end with the size 1 centre drill from the tailstock chuck, to about Ø.08 at the countersink: the hole stays inside the stub."
settings = "lathe-centre-1018"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
instruction = "Swap the drill chuck for the dead centre, a dab of grease on its point; bring it into the centre hole just snug and lock the tailstock and quill. Recheck it snug before each pass: the bar lengthens as it warms."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Journal rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{process.seat_rough_z_mm}}", kept_start_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_end_z_mm = "{{process.seat_rough_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough in passes of .0038 in on the radius, the tool clear of the centre at the start of each, each pass starting at Z+{{process.turn_start_z_mm:in.3dot}} in the stub (the journal runs on into it, so the tip cut in Op 180 leaves no collar): from there to Z{{process.seat_rough_z_mm:in.3dot}} (.005 short of the seat) to Ø{{cad.outer_rough_dia_mm:in.4dot}}."
settings = "lathe-ar-light-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
