[[setups.operations]]
cut_kind = "other"
instruction = "A station under {{cad.outer_dia_min_in:.4dot}}: cut the piece off, scrap it, and start again from Op 40. Over {{cad.outer_dia_max_in:.4dot}} at one station only: polish there alone."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Grooving tool, its width miked: with its tip clear of the land, bring its chuck-side edge onto the seat face until it just traps a cigarette paper (.001); set DRO Z there to its width + .001. The DRO then reads its tailstock-side edge: move that edge to Z+{{cad.groove_station_in:.3dot}}, the load wall. Zero the cross-slide on the journal and plunge (the miked Ø − .096)/2 on the radius."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "A tool under {{cad.groove_width_min_in:.3dot}} wide: move toward the chuck by .021 less its width and plunge again to the same dial, widening the groove away from the load wall. Read the root with the caliper jaw tips and touch the tool's tailstock-side edge on the load wall to read its station."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Groove Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide (the tool's width and the DRO moves); load wall at Z+{{cad.groove_station_min_in:.3dot}}–{{cad.groove_station_max_in:.3dot}} from the seat."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.groove_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Root over {{cad.groove_dia_max_in:.3dot}}: plunge again. Root under {{cad.groove_dia_min_in:.3dot}}, or the load wall outside its station: cut the piece off, scrap it, and start again from Op 40."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Lower the blade to about Ø.16, clear of the land; bring the blade's chuck-side face onto the seat face and set DRO Z there to 0: the DRO then reads the blade's chuck-side face. Cut in with that face at Z+{{process.tip_cut_in:.3dot}} to about Ø.04, the centre still in; withdraw the tailstock and finish the cut. The stub drops off; Setup 3 faces the tip to its station."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the cut tip end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with the blade's tailstock-side face at Z-{{cad.part_off_in:.3dot}}: the head end about .005 over the head's length, left for facing in Op 200. Catch the pin in a rag."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"

