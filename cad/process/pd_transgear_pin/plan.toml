[[setups.operations]]
cut_kind = "other"
instruction = "Polish the journal to Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}} (Ra 63 or finer): spindle about 600 rpm, 400-grit abrasive cloth backed by a flat file, stroked steadily along the journal, never wrapped round the work; keep it off the land, the seat and the stub. Every few strokes mike it at three stations: by the land, the middle and by the tip."
inspection = "Journal Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}} at all three stations ({{cad.outer_clearance_min_in:.4dot}}–{{cad.outer_clearance_max_in:.4dot}} running clearance in the reams of {{cad.outer_mates}})."
