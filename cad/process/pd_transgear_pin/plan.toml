  { name = "Land rough", phase = "rough", start_z_mm = "{{cad.step_land_far_out_near_z_mm}}", end_z_mm = "{{process.seat_rough_z_mm}}", kept_start_z_mm = "{{cad.step_land_far_out_near_z_mm}}", kept_end_z_mm = "{{process.seat_rough_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.step_land_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_land_rough_dia_mm}}" },
]
