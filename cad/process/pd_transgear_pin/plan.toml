# Transgear pin MHA-PD-23, one off, on the manual PM-1127VF-LB (owner ruling
# 2026-11-21: turned parts get lathe travelers, no NC). The drawing's matched
# press governs the land (note 1: TURNED TO THE MEASURED REAM, INTERFERENCE
# .0002-.0005 in MHA-PD-18): Op 10 reads the arm's Ø.1260-.1265 ream with the
# six Class X pins .1260-.1265 by .0001 (the .1260/.1265 pair,
# plug-gauges-1260-1265, plus the steps plug-gauges-1261-1264; all to buy);
# the largest that enters is its reading R, the ream lies in R to R + .0001,
# so the land is turned to R + .0003 to R + .0005.
#
# Route: from the 1/4 in 1018 bar (on hand), the tip end out, a .20 in stub
# beyond the tip plane carrying the tailstock dead centre while the slender
# Ø.1248-.1250 journal is turned (about 2.1 in between chuck and centre;
# turning_deflection's screens set its light passes). Rough journal and land
# with the AR, turn the head Ø.20 past the part-off line, finish the seat and
# land (to the reading) and the journal with the sharp-nose tool, polish the
# journal into its .0002 band with abrasive cloth on a file, groove the ring
# groove by the DRO zeroed on the seat (its load wall 1.923 ±.001 from the
# seat), cut the stub off .005 beyond the tip plane and part the pin off .010
# long at the head (the blade's faces per #3312, test_part_off_datum). Turned
# round twice over a shim wrap on the journal, the pin running on through the
# jaws (prechips turned_shaft regrip_stickout_*): face the head to its
# thickness and form the R.18 dome; face the tip to its station and form the
# R.07 dome. Bench: deburr, look over, oil, tag with its arm.
#
# Flagged (to order): the R.180 and R.070 form tools, the .020 grooving tool
# and the sharp-nose turning tool (cad/config/shop-equipment/
# tools-special-cutters.toml), and the six Class X plug gauges
# (gauges.plug-gauges-1260-1265 and -1261-1264). The arm MHA-PD-18 must be
# made and reamed before this pin.
title = "Transgear Pin"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished round, 1/4 in"
stock = "Ø{{process.stock_dia_in:.4dot}} × {{process.bar_length_in:g}} in 1018 bar, on hand; the pin takes {{cad.pitch_in:.2dot}} in of it."
note = "Inches. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. One pin, turned to the MHA-PD-18 arm it presses into: make and ream that arm first, and read its ream in Op 10."
shop = "../shop"
stock_refs = ["1018-round-1-4"]
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_pin/features.toml"
adapter = "turned_shaft"
part = "pd-transgear-pin"

[parameters]
quantity = 1
stock_dia_in = 0.25
bar_length_in = 72.0
chuck_grip_in = 0.75
# The land's least excess over the ream's reading R: the drawing's least
# interference (.0002) plus the pins' .0001 step, since the ream may lie up to
# one step over R; its most is the drawing's .0005 (the ream at least R).
land_over_reading_min_in = 0.0003
# A .20 in stub beyond the tip plane for the tailstock centre, and .02 faced
# off the bar end.
face_allowance_in = 0.22
centre_stub_in = 0.2
centre_stub_mm = 5.08
# The head is parted .010 long and faced to its thickness in Setup 2.
regrip_allowance_in = 0.01
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# The stub is cut .005 beyond the tip's station from the seat; Setup 3 faces
# the tip back to the station.
tip_cut_in = 2.085
# Turned round, the pin stands this far out of the jaw fronts, the rest on
# through them, each within the shop's 3 × Ø unsupported stickout
# (lathe_holding): head out, the jaws over the shim wrap on the press land
# (the journal, .0017 under it, floats), .20 out against 3 × Ø.1266 = .38;
# tip out, the jaws on the journal past the groove, .25 out against 3 × the
# groove's Ø.095 = .285.
regrip_stickout_datum_in = 0.2
regrip_stickout_far_in = 0.25
# Each dome is cut full by its own form tool: the head's on the head's own Ø
# anywhere in its .19-.21 band (cad.dome_datum_form_height_min/_max, .0271
# at Ø.19 to .0338 at Ø.21), the tip's on the journal.
dome_datum_form_radius_in = 0.18
dome_datum_form_dia_min_in = 0.19
dome_datum_form_dia_max_in = 0.21
dome_far_form_radius_in = 0.07
# The head's thickness, seat face to faced end, before its dome is formed:
# the .08-.10 head land plus the dome's height. The window holds the land
# for any head Ø in its band: .08 + .0338 to .10 + .0271, rounded inward.
head_face_min_in = 0.114
head_face_max_in = 0.127
head_face_min_mm = 2.8956
head_face_max_mm = 3.2258
# Left a side over the finished size by the rough passes.
finish_allowance_in = 0.002
# The journal is finish-turned to .1252-.1254 and polished into its
# .1248-.1250 band.
polish_dia_min_in = 0.1252
polish_dia_max_in = 0.1254
polish_dia_min_mm = 3.18008
polish_dia_max_mm = 3.18516
# Passes in turning_deflection's screens (0.10 mm rough, 0.005 mm finish) on
# the journal between chuck and centre: .004 in a side at .002 in/rev, and
# .0003 in a side at .001 in/rev.
rough_radial_doc_mm = 0.1
finish_radial_doc_mm = 0.0076
turn_feed_mm_rev = 0.0508
finish_feed_mm_rev = 0.0254
# The turning passes start in the stub, short of the centre's point.
turn_start_z_mm = 2.54
# The land is roughed to .005 short of the seat; the sharp-nose tool
# finishes the seat face.
seat_rough_z_mm = -52.705
# The head is turned from the seat back past the part-off kerf.
head_turn_end_z_mm = -58.166

