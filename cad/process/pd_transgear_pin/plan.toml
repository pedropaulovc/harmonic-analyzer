# Transgear pin MHA-PD-23, one off, on the manual PM-1127VF-LB (owner ruling
# 2026-11-21: turned parts get lathe travelers, no NC). The pin is ONE
# diameter under its head (owner ruling 2026-11-24, fit audit question 4;
# it replaces the #2415 press land and its six Class X plugs): a slip fit
# bonded in the MHA-PD-18 arm's reamed bore with LOCTITE 638 at assembly
# (MHA-PD-00), drawing note 1: CLEARANCE .0010-.0025, SLIDES IN BY HAND.
# Nothing is turned to a reading. Op 20 tries the pin-gauge set's .127 pin
# in the arm's bore (the clearance's upper end on the smallest shank: it
# must not enter); Op 190 tries the arm on the shank with the three running
# mates.
#
# The journal is made to fit (fit audit 2026-11-23, pending owner
# confirmation): the drawing prints its Ø as a reference and note 1's
# acceptance by feel, the journal turned last to the reamed bores of its
# three mates (MHA-PD-10, MHA-PD-24, MHA-PD-25) and tried in them. The mates
# and a MHA-PD-VN-68 shim must be at the lathe: they are tried on the journal
# once the stub is cut off (Op 190), the pin still on the bar. The
# micrometer only steers the polish (process.polish_stop_in, the shims' bore:
# never over it); no reading accepts the journal. cad.outer_dia_* and
# cad.outer_clearance_* are the drawing module's ANALYSIS numbers, bound
# because the turned_shaft adapter sizes its cuts and diagrams from a band;
# no step quotes them.
#
# Route: from the 1/4 in 1018 bar (on hand), the tip end out, a .20 in stub
# beyond the tip plane carrying the tailstock dead centre while the slender
# Ø.125 journal is turned (about 2.1 in between chuck and centre;
# turning_deflection's screens set its light passes). Rough the journal
# with the AR, turn the head Ø.20 past the part-off line, finish the seat
# and the journal with the sharp-nose tool, polish the
# journal down to the micrometer's .1250 with abrasive cloth on a file, groove the ring
# groove by the DRO zeroed on the seat (its load wall 1.923 ±.001 from the
# seat), cut the stub off .005 beyond the tip plane and part the pin off .010
# long at the head (the blade's faces per #3312, test_part_off_datum). The
# 3-jaw closes no smaller than Ø.175 (owner's measurement 2026-11-24, #3489)
# and the 4-jaw only to .2865 (#3495), so the Ø.125 shank is never gripped in
# the jaws (#3500): Setup 2 makes a split bush from the 1/2 in brass bar on
# hand, drilled and reamed .1260 in the 3-jaw and slit, a nick on its rim
# against jaw 1; the jaws grip the bush's Ø.50 and the bush closes on the
# shank, brass on the polished steel. Turned round twice in it (prechips
# turned_shaft regrip_stickout_*, here read from the bush's front face):
# head out, face the head to its thickness, step its R.18 dome from a Z/Ø
# table and file it; tip out (the pin threaded through the bush from behind,
# its head will not pass), face the tip to its station, step its R.07 dome
# and file it. Finishing both ends on the bar (#3500's first alternative)
# was weighed and left: the tip would be domed on 2.1 in of Ø.125 with the
# centre gone, and the head faces the chuck. Bench: deburr, look over, oil,
# tag with its arm.
#
# The domes (owner ruling 2026-11-23, tool audit Q5, option D: "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569, $124.95;
# convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file is the
# fallback for any dome it cannot reach. Confirm each dome is convex and
# reachable before buying."). Reach test, from the spec (dome-pattern,
# 2026-11-23): both convex, ball Ø.36 and Ø.14 under the tool's .75, each cut
# on a free end. The frame's arms reach .19 either side of the pivot along Z,
# so a dome's centre must stand .25 out of the jaws: stick-out R + .25.
# - Head R.18 (.XX, R.17-.19) on the Ø.19-.21 head: R + .25 = .43 out, which
#   is over 3 × Ø.125 = .375 on the shank (lathe_holding, no centre).
#   The head can only be domed head out after the part-off
#   (on the bar it faces the chuck). Not reachable.
# - Tip R.07 (.XX, R.06-.08) on the Ø.125 journal: R + .25 = .32 out, which
#   takes in the ring groove (its load wall .157 from the tip: 2.08 - 1.923),
#   over 3 × Ø.095 = .285. Grooving after the dome would set the load wall
#   (1.923 ±.001 from the seat) from the tip end, out of reach of its band.
#   Not reachable.
# Step-and-file, the pattern's fallback (precedent dt_pinion_arbor's crowns):
# each dome faced in steps from the turned_shaft table (process.dome_steps)
# at the regrip stick-outs the plan already holds, filed with the smooth
# file and screened with the radius gauges' leaves that bracket its band
# (the head 11/64 and 3/16, the tip 1/16 and 5/64). They replace the R.180
# and R.070 form tools (form-tool-r180, form-tool-r070).
#
# Flagged (to order): the .020 grooving tool, the sharp-nose turning tool
# (cad/config/shop-equipment/tools-special-cutters.toml), the radius gauge
# set (radius-gauges, Starrett S167AZ), the pin-gauge set (pin-gauges), the
# .1260 reamer (the arm's and the bushings' own) and the junior hacksaw that
# slits the bush.
# The arm MHA-PD-18, the sleeve MHA-PD-10 and both bushings MHA-PD-24 and
# MHA-PD-25 must be made and reamed before this pin: the shank is fitted to
# them.
title = "Transgear Pin"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished round, 1/4 in (drawing: Plain Carbon Steel)"
stock = "Ø{{process.stock_dia_in:.4dot}} × {{process.bar_length_in:g}} in blank sawn off the 72 in 1018 bar on hand; the pin takes {{cad.pitch_in:.2dot}} in of it. For the split bush that holds it: a {{process.bush_length_in:.2dot}} in piece of the Ø{{process.bush_dia_in:.2dot}} C360 brass bar on hand."
note = "Inches. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. One pin, fitted to the reamed MHA-PD-18 arm and to MHA-PD-10, MHA-PD-24 and MHA-PD-25: make and ream them first and have them at the lathe."
shop = "../shop"
stock_refs = ["1018-round-1-4", "c360-round-1-2"]  # owner 2026-11-19: the owned 1018 bar (registry alloy text: #3124); the brass is the split bush's (#3500)
material_key = "lathe-1018-cold-finished"
turning_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_pin/features.toml"
adapter = "turned_shaft"
part = "pd-transgear-pin"

[parameters]
quantity = 1
stock_dia_in = 0.25
# An 8 in blank sawn off the 72 in bar on hand (authored; fleet rule, Main
# 2026-11-22: no bar past the rear of the spindle). Chucked 2.61 out, 5.39 in
# of it lies behind the jaw fronts, grip included, inside the working limit
# (harmonic-analyzer #3426) cad/config/shop-equipment/machines.toml machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in (the owner's measured 17 in jaw fronts to
# spindle rear, less its margin; test_lathe_bar_length). Yield:
# the pin and one restart from Op 40 (each takes about 2.4 in).
bar_length_in = 8.0
chuck_grip_in = 0.75
# A .20 in stub beyond the tip plane for the tailstock centre, and .02 faced
# off the bar end.
face_allowance_in = 0.22
centre_stub_in = 0.2
centre_stub_mm = 5.08
# The head is parted .010 long and faced to its thickness in Setup 3.
regrip_allowance_in = 0.01
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# The stub is cut .005 beyond the tip's station from the seat; Setup 4 faces
# the tip back to the station.
tip_cut_in = 2.085
# Turned round in the split bush, the pin stands this far out of the bush's
# front face, each within the shop's 3 × Ø unsupported stickout
# (lathe_holding): head out, the bush on the shank under the head, .20 out
# against 3 × Ø.125 = .375; tip out, the bush on the journal past the
# groove, .25 out against 3 × the groove's Ø.095 = .285.
regrip_stickout_datum_in = 0.2
regrip_stickout_far_in = 0.25
# The split bush (#3500): a piece of the 1/2 in C360 bar on hand, held on
# bush_grip_in with the rest out of the jaws, drilled #31 and reamed .1260
# through, then slit along one side. The 3-jaw grips its Ø.50, inside the
# chuck's measured range.
bush_dia_in = 0.5
bush_dia_mm = 12.7
bush_length_in = 0.75
bush_length_mm = 19.05
bush_grip_in = 0.5
bush_stickout_mm = 6.35
# Each dome is stepped from the turned_shaft table (its height in
# dome_steps + 1 equal Z steps, each step's corner on the drawn sphere
# through the apex: cad.dome_datum_step_k_* / cad.dome_far_step_k_*), then
# filed: three steps leave a face about Ø.10 (head) and Ø.07 (tip) at the
# apex and step corners a file takes off.
dome_steps = 3
# The radius gauges' leaves that screen each filed dome (Starrett S167AZ):
# the lesser rests on the rim, the greater touches at the apex, so the dome
# lies between them, inside the drawn band. Head R.17-.19: 11/64 (R.1719)
# and 3/16 (R.1875); tip R.06-.08: 1/16 (R.0625) and 5/64 (R.0781).
dome_datum_leaf_radius_min_in = 0.171875
dome_datum_leaf_radius_max_in = 0.1875
dome_far_leaf_radius_min_in = 0.0625
dome_far_leaf_radius_max_in = 0.078125
# The head's thickness, seat face to faced end, before its dome is stepped:
# the .08-.10 head land plus the dome's height. That height is
# R - √(R² - (Ø/2)²) for whatever radius the leaves pass (11/64 to 3/16) on
# whatever head Op 80 read (Ø.19-.21): at most .0358 (R.1719 on Ø.21), at
# least .0258 (R.1875 on Ø.19). The window that holds the land for all of
# them is .08 + .0358 to .10 + .0258, rounded inward.
head_face_min_in = 0.116
head_face_max_in = 0.125
head_face_min_mm = 2.9464
head_face_max_mm = 3.175
# Left a side over the finished size by the rough passes.
finish_allowance_in = 0.002
# The journal is finish-turned to .1252-.1254 and polished until the
# micrometer first reads polish_stop_in or just under at every station: a
# process aim, not an acceptance (the acceptance is the mates tried in
# Op 190). Never over it: .1250 is the bought MHA-PD-VN-68 shims' bore.
polish_dia_min_in = 0.1252
polish_dia_max_in = 0.1254
polish_dia_min_mm = 3.18008
polish_dia_max_mm = 3.18516
polish_stop_in = 0.125
# Passes in turning_deflection's screens (0.10 mm rough, 0.005 mm finish) on
# the journal between chuck and centre: .0038 in a side at .002 in/rev, and
# .0003 in a side at .001 in/rev. (.004 bent the one-diameter shank roughed
# to Ø.1285, its Q5 band's floor plus allowance, 0.1007 mm: over the screen.)
rough_radial_doc_mm = 0.09652
finish_radial_doc_mm = 0.0076
turn_feed_mm_rev = 0.0508
finish_feed_mm_rev = 0.0254
# The turning passes start in the stub, short of the centre's point.
turn_start_z_mm = 2.54
# The journal is roughed to .005 short of the seat; the sharp-nose tool
# finishes the seat face.
seat_rough_z_mm = -52.705
# The head is turned from the seat back past the part-off kerf.
head_turn_end_z_mm = -58.166

