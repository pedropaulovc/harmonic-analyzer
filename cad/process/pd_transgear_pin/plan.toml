[[setups]]
machine_kind = "lathe"
title = "Bar: tip end out on the centre; turn, groove, part off"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the bar, {{cad.stickout_in:.2dot}} in out of the jaw fronts (the pin, its kerf, the jaws' clearance and the {{process.centre_stub_in:.2dot}} in stub). The tailstock dead centre, greased, in the stub's centre hole from Op 60 until the stub is cut off in Op 180."
datum = "Z0 (carriage DRO) the tip plane, {{process.centre_stub_in:.3dot}} in back from the bar end faced in Op 40; the sharp-nose tool is set on that faced end (Op 100); the grooving tool and the blade are set on the seat or the cut tip end as their ops say."
diagram = { file = "diagrams/bar.svg", alt = "The 1/4 in bar in the 3-jaw, the tip end out: the journal, the press land and the head turned, the ring groove cut, the pin parted off at the head." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.groove_dia_min_mm}}", support = "tailstock" }
turning_support = { kind = "tailstock", chuck_z_mm = "{{cad.jaw_z_mm}}", centre_z_mm = "{{process.centre_stub_mm}}" }

[[setups.operations]]
cut_kind = "other"
instruction = "Before turning, read the {{cad.step_land_mate}} ream the land presses into (Ø{{cad.step_land_mate_dia_min_in:.4dot}}–{{cad.step_land_mate_dia_max_in:.4dot}}): try the six plug gauges .1260–.1265 in it, smallest first, by hand and clean, never forced. The largest that enters is its reading R: write R on this sheet. Then try the .1260 and .1265 in the reams of {{cad.outer_mates}} that the journal runs in."
inspection = "Each ream: .1260 enters, .1265 does not."
# The pair at the ream's band; the four steps between them read it to .0001
# (their own span, .1261-.1264).
gauge_checks = [{ gauge = "plug-gauges-1260-1265", band_mm = "{{cad.step_land_mate_dia_band_mm}}" }, { gauge = "plug-gauges-1261-1264", band_mm = [3.20294, 3.21056] }]

[[setups.operations]]
cut_kind = "other"
instruction = "In any ream the .1260 does not enter, or the .1265 enters: that ream is outside its drawing's band. Stop: make no pin for that arm and tell the owner."

[[setups.operations]]
cut_kind = "other"
instruction = "Work out the land's window and write it on this sheet: Ø(R + {{process.land_over_reading_min_in:.4dot}}) to Ø(R + {{cad.step_land_interference_max_in:.4dot}}). The ream may lie up to .0001 over R, so the land then presses in with the drawing's {{cad.step_land_interference_min_in:.4dot}}–{{cad.step_land_interference_max_in:.4dot}} interference."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, about .02 off, to the centre with no pip. Set the DRO Z to +{{process.centre_stub_in:.3dot}} on it: Z0 is the tip plane, the {{process.centre_stub_in:.2dot}} in beyond it a stub for the centre."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the faced end with the size 1 centre drill from the tailstock chuck, to about Ø.08 at the countersink: the hole stays inside the stub."
settings = "lathe-centre-1018"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
instruction = "Swap the drill chuck for the dead centre, a dab of grease on its point; bring it into the centre hole just snug and lock the tailstock and quill. Recheck it snug before each pass: the bar lengthens as it warms."

