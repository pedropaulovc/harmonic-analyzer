[[setups]]
machine_kind = "lathe"
title = "Bar: tip end out on the centre; turn, groove, part off"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The {{process.bar_length_in:g}} in blank, sawn off the bar with the metal-cutting saw, in the 3-jaw {{cad.stickout_in:.2dot}} in out of the jaw fronts (the pin, its kerf, the jaws' clearance and the {{process.centre_stub_in:.2dot}} in stub), the rest inside the chuck: nothing projects past the spindle's rear end. A restart pulls what is left out to {{cad.stickout_in:.2dot}} again; with under {{process.chuck_grip_in:.2dot}} + {{cad.stickout_in:.2dot}} in left a new blank is sawn. The tailstock dead centre, greased, in the stub's centre hole from Op 60 until the stub is cut off in Op 180."
datum = "Z0 (carriage DRO) the tip plane, {{process.centre_stub_in:.3dot}} in back from the bar end faced in Op 40; the sharp-nose tool is set on that faced end (Op 100); the grooving tool and the blade are set on the seat or the cut tip end as their ops say."
diagram = { file = "diagrams/bar.svg", alt = "The 1/4 in bar in the 3-jaw, the tip end out: the one-diameter shank and the head turned, the ring groove cut, the pin parted off at the head." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.groove_dia_min_mm}}", support = "tailstock" }
turning_support = { kind = "tailstock", chuck_z_mm = "{{cad.jaw_z_mm}}", centre_z_mm = "{{process.centre_stub_mm}}" }

[[setups.operations]]
cut_kind = "other"
instruction = "Before turning, have at the lathe the reamed MHA-PD-18 arm, the reamed {{cad.outer_mates}} and one MHA-PD-VN-68 shim, their bores wiped clean: the shank is fitted to them in Op 190."

[[setups.operations]]
cut_kind = "other"
instruction = "Try the pin-gauge set's .127 pin in the arm's pin bore from each face, by hand and clean, never forced."
inspection = "MHA-PD-18's drawing: the .127 pin does not enter the pin bore."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The .127 pin enters the arm's pin bore: that bore is over its drawing's limit and the bonded pin would lean in it. Stop: make no pin for that arm and tell the owner."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, about .02 off, to the centre with no pip. Set the DRO Z to +{{process.centre_stub_in:.3dot}} on it: Z0 is the tip plane, the {{process.centre_stub_in:.2dot}} in beyond it a stub for the centre."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the faced end with the size 1 centre drill from the tailstock chuck, to about Ø.08 at the countersink: the hole stays inside the stub."
settings = "lathe-centre-1018"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
instruction = "Swap the drill chuck for the dead centre, a dab of grease on its point; bring it into the centre hole just snug and lock the tailstock and quill. Recheck it snug before each pass: the bar lengthens as it warms."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Journal rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{process.seat_rough_z_mm}}", kept_start_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_end_z_mm = "{{process.seat_rough_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough in passes of .004 in on the radius, the tool clear of the centre at the start of each, each pass starting at Z+{{process.turn_start_z_mm:in.3dot}} in the stub (the journal runs on into it, so the tip cut in Op 180 leaves no collar): from there to Z{{process.seat_rough_z_mm:in.3dot}} (.005 short of the seat) to Ø{{cad.outer_rough_dia_mm:in.4dot}}."
settings = "lathe-ar-light-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Head", phase = "rough", start_z_mm = "{{process.seat_rough_z_mm}}", end_z_mm = "{{process.head_turn_end_z_mm}}", kept_start_z_mm = "{{cad.step_head_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_head_far_out_far_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.step_head_turn_min_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_head_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the head from the seat back to Z{{process.head_turn_end_z_mm:in.3dot}}, past the part-off kerf, in the same passes to Ø{{cad.step_head_dia_min_in:.3dot}}–{{cad.step_head_dia_max_in:.3dot}} (aim at .200)."
settings = "lathe-ar-light-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "Head Ø{{cad.step_head_dia_min_in:.3dot}}–{{cad.step_head_dia_max_in:.3dot}}, calipers, spindle stopped."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.step_head_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Head under {{cad.step_head_dia_min_in:.3dot}}: cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding. Over {{cad.step_head_dia_max_in:.3dot}}: another pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Sharp-nose tool: touch it on the stub's faced end and set DRO Z to +{{process.centre_stub_in:.3dot}}. Face the seat square at Z{{cad.outer_far_out_far_z_mm:in.3dot}} from the journal's rough size out to the head, in skims of .002 or less, its corner R{{cad.fillet_seat_radius_max_in:.3dot}} max (the tool's nose)."
settings = "lathe-sharp-nose-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "The seat faced clean out to the head's rim, by eye: no step, the corner sharp to the tool's nose."

[[setups.operations]]
cut_kind = "other"
instruction = "A step or an unfaced ring left on the seat: another skim of .002 or less. The seat is the pin's stop on the arm's rear face and the origin of the groove's station."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Journal finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.outer_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.outer_far_out_far_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{process.polish_dia_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.finish_feed_mm_rev}}", minimum_diameter_mm = "{{process.polish_dia_min_mm}}" },
]
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Finish the journal from Z+{{process.turn_start_z_mm:in.3dot}} in the stub to the seat to Ø{{process.polish_dia_min_in:.4dot}}–{{process.polish_dia_max_in:.4dot}}, miking at both ends and the middle between passes (spindle stopped), in passes of {{process.finish_radial_doc_mm:in.4dot}} or less on the radius, the last no deeper than half of (the miked Ø less the middle of that band); spring passes allowed: what is left over {{process.polish_stop_in:.4dot}} is for polishing."
settings = "lathe-sharp-nose-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Journal Ø{{process.polish_dia_min_in:.4dot}}–{{process.polish_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.polish_dia_min_mm}}", "{{process.polish_dia_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Polish the journal (Ra 63 or finer): spindle about 600 rpm, 400-grit abrasive cloth backed by a flat file, stroked steadily along the journal from the seat to the stub, never wrapped round the work; keep it off the seat's face. Every few strokes stop the spindle and mike it at three stations: by the seat, the middle and by the tip. Stop when every station first reads {{process.polish_stop_in:.4dot}} or just under: the mates are tried in Op 190."
inspection = "No station reads over {{process.polish_stop_in:.4dot}} (the MHA-PD-VN-68 shims' bore); the three stations read alike, no taper you can mike. The fit itself is accepted in Op 190, on the mates."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A station still over {{process.polish_stop_in:.4dot}}: polish there alone. Do not polish on past the first reading at or under it: a journal polished small shakes in its mates in Op 190 and is scrap."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Grooving tool, its width miked: with its tip clear of the journal, spindle stopped, bring its chuck-side edge onto the seat face until it just traps a cigarette paper (.001); set DRO Z there to its width + .001. The DRO then reads its tailstock-side edge: move that edge to Z+{{cad.groove_station_in:.3dot}}, the load wall. Zero the cross-slide on the journal and plunge (the miked Ø − .096)/2 on the radius."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "A tool under {{cad.groove_width_min_in:.3dot}} wide: move toward the chuck by .021 less its width and plunge again to the same dial, widening the groove away from the load wall. Spindle stopped, read the root with the caliper jaw tips and touch the tool's tailstock-side edge on the load wall to read its station."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Groove Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide (the .020 feeler leaf enters the groove, the .022 does not); load wall at Z+{{cad.groove_station_min_in:.3dot}}–{{cad.groove_station_max_in:.3dot}} from the seat."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }, { gauge = "feeler-gauges", band_mm = "{{cad.groove_width_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.groove_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Root over {{cad.groove_dia_max_in:.3dot}}: plunge a further (the root reading less .096)/2 on the radius and read it again. The .020 leaf not entering: widen as above. Root under {{cad.groove_dia_min_in:.3dot}}, the .022 leaf entering, or the load wall outside its station: cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Lower the blade to about Ø.16, clear of the journal; bring the blade's chuck-side face onto the seat face and set DRO Z there to 0: the DRO then reads the blade's chuck-side face. Cut in with that face at Z+{{process.tip_cut_in:.3dot}} to about Ø.04, the centre still in; withdraw the tailstock and finish the cut. The stub drops off; Setup 3 faces the tip to its station. Spindle stopped, stone the burr off the cut end and the groove's two edges."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the pin still on the bar: wipe the journal and the bores of {{cad.outer_mates}} and the MHA-PD-18 arm clean, a drop of oil on the journal. Slide each of {{cad.outer_mates}} in turn onto the journal by hand, up to the seat, never forced, and turn it; rock it across the pin at both ends of the journal. Then slide one MHA-PD-VN-68 shim on to the seat. Then slide the arm's pin bore over the journal up to the seat. Wipe the oil off the pin and out of the arm's bore afterwards: it is bonded there."
inspection = "Drawing note 1: each mate enters by hand, turns free along the whole journal, and has no shake you can feel when rocked; the shim slides on; the arm slides on by hand up to the seat. No reading accepts the journal: the mates do."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A mate, the shim or the arm that will not enter, or binds along the journal: spindle at 600 rpm, a few light strokes of the 400-grit cloth on the file where it binds, the lightest pressure (the centre is gone), and try all of them again. A mate that shakes: cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Set a tray on the ways under the cut, clear of the chuck and saddle. Touch the blade's chuck-side face on the cut tip end and set DRO Z to the blade's width (miked, {{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: the head about .005 long, faced in Op 220. Pick the pin out of the tray with the spindle stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round, head out: face the head, step and file its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the shank under the head, the head out {{cad.outer_stickout_datum_mm:in.2dot}} in from the jaw fronts; the rest of the pin on through the jaws into the chuck."
datum = "DRO Z0 the head's faced end (Op 220, the AR tool); the dome's steps (Op 240) are read from it."
diagram = { file = "diagrams/head.svg", alt = "The pin turned round, the shank in the jaws over a shim wrap, the head out: the head faced and its R.18 dome stepped from the table and filed." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_datum_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the head's parted end square in light skims, to the centre with no pip, about .005 off. Between skims, spindle stopped, read the head with the calipers from the seat face (one jaw beside the shank) to the faced end. Set DRO Z0 on the faced end."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "Head {{process.head_face_min_in:.3dot}}–{{process.head_face_max_in:.3dot}} thick, seat face to faced end: the dome then leaves the {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}} head land for any head Ø in {{cad.step_head_dia_min_in:.2dot}}–{{cad.step_head_dia_max_in:.2dot}} and any dome Op 260 passes."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.head_face_min_mm}}", "{{process.head_face_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Head under {{process.head_face_min_in:.3dot}}: scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Step the R.18 dome with the AR tool, Z0 the faced head end: at each line, carriage at the Z, face from the Ø out to the head's O.D.: Z{{cad.dome_datum_step_3_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_3_dia_in:.3dot}}; Z{{cad.dome_datum_step_2_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_2_dia_in:.3dot}}; Z{{cad.dome_datum_step_1_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_1_dia_in:.3dot}}. The dome meets the O.D. about Z−{{cad.dome_datum_height_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the steps off the dome with the smooth file, stroking from the apex out to the rim, blending the Ø{{cad.dome_datum_step_3_dia_in:.2dot}} face left at the apex into the dome, until the step corners are just gone."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "radius"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped. Screen the dome with the radius gauges' concave leaves held across it through the axis: the {{process.dome_datum_leaf_radius_min_in:fraction}} leaf rests on the rim with light at the apex, and the {{process.dome_datum_leaf_radius_max_in:fraction}} leaf touches at the apex with light at the rim; no flat at the apex, no step left."
inspection = "Dome R{{cad.dome_datum_radius_min_in:.2dot}}–{{cad.dome_datum_radius_max_in:.2dot}}: between the {{process.dome_datum_leaf_radius_min_in:fraction}} (R{{process.dome_datum_leaf_radius_min_in:.4dot}}) and {{process.dome_datum_leaf_radius_max_in:fraction}} (R{{process.dome_datum_leaf_radius_max_in:.4dot}}) leaves; no flat, no step."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The {{process.dome_datum_leaf_radius_max_in:fraction}} leaf showing light at the apex, a flat or a step (the rim still full): file again from the rim inward and screen again. The {{process.dome_datum_leaf_radius_min_in:fraction}} leaf touching at the apex (filed too far at the rim): scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

