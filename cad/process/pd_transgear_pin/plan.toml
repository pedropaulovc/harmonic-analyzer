instruction = "Head under {{cad.step_head_dia_min_in:.3dot}}: cut the piece off, scrap it, and start again from Op 40 (R stands). Over {{cad.step_head_dia_max_in:.3dot}}: another pass."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Land finish", phase = "finish", start_z_mm = "{{cad.step_land_far_out_near_z_mm}}", end_z_mm = "{{cad.step_land_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_land_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_land_far_out_far_z_mm}}", start_diameter_mm = "{{cad.step_land_rough_dia_mm}}", end_diameter_mm = "{{cad.step_land_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.finish_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_land_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Sharp-nose tool: touch it on the stub's faced end and set DRO Z to +{{process.centre_stub_in:.3dot}}. Face the seat square at Z{{cad.step_land_far_out_far_z_mm:in.3dot}} out to the head, its corner R{{cad.fillet_seat_radius_max_in:.3dot}} max (the tool's nose). Finish the land from the seat to Z{{cad.step_land_far_out_near_z_mm:in.3dot}} ({{cad.step_land_length_in:.2dot}} long) to the Op 30 window, miking between passes: no pass deeper than half of (the miked Ø less the window's middle) on the radius, spring passes allowed."
