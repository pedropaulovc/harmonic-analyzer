]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the head from the seat back to Z{{process.head_turn_end_z_mm:in.3dot}}, past the part-off kerf, in the same passes to Ø{{cad.step_head_dia_min_in:.3dot}}–{{cad.step_head_dia_max_in:.3dot}} (aim at .200). Write the head's reading on this sheet: Op 220 forms its dome by it."
