instruction = "Finish the journal from the stub to the land's end to Ø{{process.polish_dia_min_in:.4dot}}–{{process.polish_dia_max_in:.4dot}}, miking at both ends between passes, no pass deeper than half of (the miked Ø less the window's middle) on the radius, spring passes allowed: the .0002–.0006 over its Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}} is left for polishing."
settings = "lathe-sharp-nose-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Journal Ø{{process.polish_dia_min_in:.4dot}}–{{process.polish_dia_max_in:.4dot}}."
