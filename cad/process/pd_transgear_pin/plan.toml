[[setups]]
machine_kind = "other"
title = "Bench: deburr, look over, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pin: the R.18 head dome, the Ø.20 head, the one-diameter (Ø.125) shank made to fit its mates, the ring groove and the R.07 tip dome." }

[[setups.operations]]
instruction = "With a fine stone, break the head's two outer edges and the tip dome's root edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Stone only the burr off the groove's two edges, the load wall's edge left square; leave the seat's inside corner and the shank untouched."

[[setups.operations]]
instruction = "Look over the shank where the jaws held it, then try {{cad.outer_mates}} and the MHA-PD-18 arm on it once more, as in Op 190."
inspection = "No mark or nick you can feel; each mate still enters, turns free and has no shake; the arm slides on by hand up to the seat."
gauge_checks = "other"

[[setups.operations]]
instruction = "A mark you can feel, or a mate that binds or shakes: scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
instruction = "Wipe the pin with machine oil (FINISH: oiled; MHA-PD-00 degreases it before the bond). Keep it with the MHA-PD-18 arm, the sleeve and both bushings it was fitted to."
