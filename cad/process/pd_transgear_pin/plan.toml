settings = "lathe-ar-light-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "Head Ø{{cad.step_head_dia_min_in:.3dot}}–{{cad.step_head_dia_max_in:.3dot}}, calipers, spindle stopped."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.step_head_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Head under {{cad.step_head_dia_min_in:.3dot}}: cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding. Over {{cad.step_head_dia_max_in:.3dot}}: another pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Sharp-nose tool: touch it on the stub's faced end and set DRO Z to +{{process.centre_stub_in:.3dot}}. Face the seat square at Z{{cad.outer_far_out_far_z_mm:in.3dot}} from the journal's rough size out to the head, in skims of .002 or less, its corner R{{cad.fillet_seat_radius_max_in:.3dot}} max (the tool's nose)."
settings = "lathe-sharp-nose-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "The seat faced clean out to the head's rim, by eye: no step, the corner sharp to the tool's nose."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A step or an unfaced ring left on the seat: another skim of .002 or less. The seat is the pin's stop on the arm's rear face and the origin of the groove's station."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Journal finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.outer_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.outer_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.outer_far_out_far_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{process.polish_dia_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.finish_feed_mm_rev}}", minimum_diameter_mm = "{{process.polish_dia_min_mm}}" },
]
speed_kind = "spindle"
tool = "sharp"
drilling = "none"
sizing = "other"
instruction = "Finish the journal from Z+{{process.turn_start_z_mm:in.3dot}} in the stub to the seat, leaving stock for polishing: stop at Ø{{process.polish_dia_max_in:.4dot}} or just under, miking at both ends and the middle between passes (spindle stopped), in passes of {{process.finish_radial_doc_mm:in.4dot}} or less on the radius, the last no deeper than half of what the mike reads over {{process.polish_dia_min_in:.4dot}}; spring passes allowed."
settings = "lathe-sharp-nose-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Stock left for polishing, not an acceptance. A station over {{process.polish_dia_max_in:.4dot}}: one more light pass. Every station {{process.polish_stop_in:.4dot}} to {{process.polish_dia_max_in:.4dot}}: go on to Op 130. A station already .1245 to {{process.polish_stop_in:.4dot}}: do not polish there in Op 130. A station under .1245: scrap, start again from Op 40."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Polish the journal (Ra 63 or finer): spindle about 600 rpm, 400-grit abrasive cloth backed by a flat file, stroked steadily along the journal from the seat to the stub, never wrapped round the work; keep it off the seat's face. Every few strokes stop the spindle and mike it at three stations: by the seat, the middle and by the tip. Stop when every station first reads {{process.polish_stop_in:.4dot}} or just under: the mates are tried in Op 190."
inspection = "No station reads over {{process.polish_stop_in:.4dot}} (the MHA-PD-VN-68 shims' bore) or under .1245 (drawing note 1: the bond's clearance in MHA-PD-18 stays at or under .0025 in a bore the .127 pin does not enter); the three stations read alike, no taper you can mike. The running fit itself is accepted in Op 190, on the mates."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A station still over {{process.polish_stop_in:.4dot}}: polish there alone. Do not polish on past the first reading at or under it. A station under .1245: the journal is scrap; start again from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Grooving tool, its width miked: with its tip clear of the journal, spindle stopped, bring its chuck-side edge onto the seat face until it just traps a cigarette paper (.001); set DRO Z there to its width + .001. The DRO then reads its tailstock-side edge: move that edge to Z+{{cad.groove_station_in:.3dot}}, the load wall. Zero the cross-slide on the journal and plunge (the miked Ø − .096)/2 on the radius."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "A tool under {{cad.groove_width_min_in:.3dot}} wide: move toward the chuck by .021 less its width and plunge again to the same dial, widening the groove away from the load wall. Spindle stopped, read the root with the caliper jaw tips and touch the tool's tailstock-side edge on the load wall to read its station."
settings = "lathe-groove-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Groove Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide (the .020 feeler leaf enters the groove, the .022 does not); load wall at Z+{{cad.groove_station_min_in:.3dot}}–{{cad.groove_station_max_in:.3dot}} from the seat."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }, { gauge = "feeler-gauges", band_mm = "{{cad.groove_width_band_mm}}" }, { gauge = "lathe-z-dro", band_mm = "{{cad.groove_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Root over {{cad.groove_dia_max_in:.3dot}}: plunge a further (the root reading less .096)/2 on the radius and read it again. The .020 leaf not entering: widen as above. Root under {{cad.groove_dia_min_in:.3dot}}, the .022 leaf entering, or the load wall outside its station: cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Lower the blade to about Ø.16, clear of the journal; bring the blade's chuck-side face onto the seat face and set DRO Z there to 0: the DRO then reads the blade's chuck-side face. Cut in with that face at Z+{{process.tip_cut_in:.3dot}} to about Ø.04, the centre still in; withdraw the tailstock and finish the cut. The stub drops off; Setup 4 faces the tip to its station. Spindle stopped, stone the burr off the cut end and the groove's two edges."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the pin still on the bar. Wipe the journal and the bores clean; a drop of oil on the journal. By hand, never forced, slide on up to the seat, one at a time: each of {{cad.outer_mates}} (turn it, and rock it at both ends of the journal), one MHA-PD-VN-68 shim, then the MHA-PD-18 pin bore. Wipe the oil off the pin and out of the MHA-PD-18 bore: it is bonded there."
inspection = "Drawing note 1: each mate enters by hand, turns free along the whole journal, and has no shake you can feel when rocked; the shim slides on; the arm slides on by hand up to the seat. No reading accepts the journal: the mates do."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Only if a mate, the shim or MHA-PD-18 will not enter, or binds along the journal in Op 190: spindle at 600 rpm, a few light strokes of the 400-grit cloth on the file where it binds, the lightest pressure (the centre is gone). Then Op 210."

[[setups.operations]]
cut_kind = "other"
instruction = "After any strokes in Op 200: spindle stopped, mike the journal at both ends and the middle, then turn the chuck by hand and watch the tip against the tool's point."
inspection = "No station reads under .1245, the three read within .0003 of each other, and the tip does not wobble to the eye: repeat Op 190. Otherwise Op 220."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Op 210 fails (the journal is tapered or bent), or every mate shakes in Op 190 (the journal is small): cut the piece off, scrap it, and start again from Op 40, the blank rechucked as in Setup 1's Holding. One mate alone shakes while the others turn free: its bore is the odd one; set that mate aside, tell the owner, and go on."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "blade"
drilling = "none"
sizing = "other"
instruction = "Set a tray on the ways under the cut, clear of the chuck and saddle. Touch the blade's chuck-side face on the cut tip end and set DRO Z to the blade's width (miked, {{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: the head about .005 long, faced in Op 290. Pick the pin out of the tray with the spindle stopped."
settings = "lathe-part-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Split bush: face, drill, ream, slit"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "A {{process.bush_length_in:.2dot}} in piece sawn off the Ø{{process.bush_dia_in:.2dot}} brass bar with the metal-cutting saw, in the 3-jaw on {{process.bush_grip_in:.2dot}} in, the rest out of the jaw fronts. The pin's Ø.125 shank is under the 3-jaw's least grip (Ø.175): this bush holds it in Setups 3 and 4."
datum = "None read: the hole is drilled and reamed from the tailstock, on the spindle's axis, right through the piece."
diagram = { file = "diagrams/bush.svg", alt = "The 1/2 in brass piece in the 3-jaw, a nick on its rim against jaw 1: faced, drilled and reamed .1260 through, then slit along one side into the hole." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bush_dia_mm}}", stock_diameter_mm = "{{process.bush_dia_mm}}", stickout_mm = "{{process.bush_stickout_mm}}", minimum_diameter_mm = "{{process.bush_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the piece's end square in a light skim. Spindle stopped, file a nick on its rim in line with jaw 1: the bush goes back into the chuck with the nick at jaw 1 every time."
rpm = 1200
feed = "by hand, a light skim, dry"
cut_diameter_mm = "{{process.bush_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the size 1 centre drill, only the point's cone, about Ø.08 across: under the #31 drill, so the drill removes it."
rpm = 2000
feed = "tailstock quill by hand"
cut_diameter_mm = 2.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-31"
drilling = "twist_drill"
sizing = "other"
instruction = "Drill #31 right through the piece from the tailstock, pecking: about .12 a peck, the drill drawn clear of the hole each time to shed its chips."
rpm = 2000
feed = "tailstock quill by hand, light and steady, dry"
cut_diameter_mm = 3.048
hole_depth_mm = "{{process.bush_length_mm}}"
peck = { step_mm = 3.048, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = "other"
instruction = "Ream .1260 right through from the tailstock, spindle running, in one slow feed; withdraw with the spindle still running."
rpm = 600
feed = "tailstock quill by hand, slow and light, dry; withdraw with the spindle running"
cut_diameter_mm = 3.2004

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "hacksaw"
drilling = "none"
sizing = "other"
instruction = "Take the piece out. In the bench vise, saw one slit along its whole length with the junior hacksaw, through one wall into the hole, directly opposite the nick (midway between the other two jaws when the nick is at jaw 1). Break the slit's edges with the smooth file and push the reamer through the hole by hand to clear the burr. Wipe the hole clean."
inspection = "The pin's journal slides through the bush by hand, tip first, with no burr dragging on it."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Turned round in the bush, head out: face the head, step and file its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The pin's shank in the split bush, the head out {{cad.outer_stickout_datum_mm:in.2dot}} in from the bush's front face; the bush in the 3-jaw on {{process.bush_grip_in:.2dot}} in, its nick at jaw 1, the jaws closed until the pin cannot be turned by hand. The rest of the pin runs on through the bush into the chuck. The jaws never touch the pin."
datum = "DRO Z0 the head's faced end (Op 290, the AR tool); the dome's steps (Op 310) are read from it."
diagram = { file = "diagrams/head.svg", alt = "The pin turned round, its shank held in the split bush in the jaws, the head out: the head faced and its R.18 dome stepped from the table and filed." }
# The jaws hold the bush (grip and stock its Ø.50); the pin's shank is the
# least diameter the stick-out is screened on.
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bush_dia_mm}}", stock_diameter_mm = "{{process.bush_dia_mm}}", stickout_mm = "{{cad.outer_stickout_datum_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the head's parted end square in light skims, to the centre with no pip, about .005 off. Between skims, spindle stopped, read the head with the calipers from the seat face (one jaw beside the shank) to the faced end. Set DRO Z0 on the faced end."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"
inspection = "Head {{process.head_face_min_in:.3dot}}–{{process.head_face_max_in:.3dot}} thick, seat face to faced end: the dome then leaves the {{cad.shoulder_min_in:.2dot}}–{{cad.shoulder_max_in:.2dot}} head land for any head Ø in {{cad.step_head_dia_min_in:.2dot}}–{{cad.step_head_dia_max_in:.2dot}} and any dome Op 330 passes."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.head_face_min_mm}}", "{{process.head_face_max_mm}}"] }]

[[setups.operations]]
cut_kind = "other"
instruction = "Head under {{process.head_face_min_in:.3dot}}: scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Step the R.18 dome with the AR tool, Z0 the faced head end: at each line, carriage at the Z, face from the Ø out to the head's O.D.: Z{{cad.dome_datum_step_3_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_3_dia_in:.3dot}}; Z{{cad.dome_datum_step_2_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_2_dia_in:.3dot}}; Z{{cad.dome_datum_step_1_end_z_mm:in.4dot}} from Ø{{cad.dome_datum_step_1_dia_in:.3dot}}. The dome meets the O.D. about Z−{{cad.dome_datum_height_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.step_head_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the steps off the dome with the smooth file, stroking from the apex out to the rim, blending the Ø{{cad.dome_datum_step_3_dia_in:.2dot}} face left at the apex into the dome, until the step corners are just gone."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "radius"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped. Screen the dome with the radius gauges' concave leaves held across it through the axis: the {{process.dome_datum_leaf_radius_min_in:fraction}} leaf rests on the rim with light at the apex, and the {{process.dome_datum_leaf_radius_max_in:fraction}} leaf touches at the apex with light at the rim; no flat at the apex, no step left."
inspection = "Dome R{{cad.dome_datum_radius_min_in:.2dot}}–{{cad.dome_datum_radius_max_in:.2dot}}: between the {{process.dome_datum_leaf_radius_min_in:fraction}} (R{{process.dome_datum_leaf_radius_min_in:.4dot}}) and {{process.dome_datum_leaf_radius_max_in:fraction}} (R{{process.dome_datum_leaf_radius_max_in:.4dot}}) leaves; no flat, no step."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The {{process.dome_datum_leaf_radius_max_in:fraction}} leaf showing light at the apex, a flat or a step (the rim still full): file again from the rim inward and screen again. The {{process.dome_datum_leaf_radius_min_in:fraction}} leaf touching at the apex (filed too far at the rim): scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups]]
machine_kind = "lathe"
title = "Turned round, tip out: face the tip, step and file its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Take the bush out and the pin out of it; thread the pin tip first through the bush from behind (the head will not pass through it), the tip out {{cad.outer_stickout_far_mm:in.2dot}} in from the bush's front face, the groove clear of the bush. The bush back in the 3-jaw on {{process.bush_grip_in:.2dot}} in, its nick at jaw 1, the jaws closed until the pin cannot be turned by hand; the head hangs behind the bush inside the chuck. The jaws never touch the pin."
datum = "DRO Z0 the tip's faced end (Op 350, the AR tool); the dome's steps (Op 370) are read from it."
diagram = { file = "diagrams/tip.svg", alt = "The pin turned round again, its journal held in the split bush in the jaws, the tip out: the tip faced and its R.07 dome stepped from the table and filed." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bush_dia_mm}}", stock_diameter_mm = "{{process.bush_dia_mm}}", stickout_mm = "{{cad.outer_stickout_far_mm}}", minimum_diameter_mm = "{{cad.groove_dia_min_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the tip end square in light skims, to the centre with no pip, about .005 off. Between skims take the bush out with the pin in it and read the pin with the calipers from the seat face (one jaw beside the shank) to the faced tip end; chuck the bush again, its nick at jaw 1. Set DRO Z0 on the faced end."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Seat face to tip end {{cad.far_end_station_min_in:.3dot}}–{{cad.far_end_station_max_in:.3dot}} (the dome's apex stays on the faced end)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.far_end_station_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Seat to tip under {{cad.far_end_station_min_in:.3dot}}: scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Step the R.07 dome with the AR tool, Z0 the faced tip: at each line, carriage at the Z, face from the Ø out to the journal's O.D.: Z{{cad.dome_far_step_3_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_3_dia_in:.3dot}}; Z{{cad.dome_far_step_2_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_2_dia_in:.3dot}}; Z{{cad.dome_far_step_1_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_1_dia_in:.3dot}}. The dome meets the O.D. about Z−{{cad.dome_far_height_in:.3dot}}."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the steps off the dome with the smooth file, stroking from the apex out to the rim, blending the Ø{{cad.dome_far_step_3_dia_in:.2dot}} face left at the apex into the dome, until the step corners are just gone. Keep the file off the journal."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "radius"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped. Screen the dome with the radius gauges' concave leaves held across it through the axis: the {{process.dome_far_leaf_radius_min_in:fraction}} leaf rests on the rim with light at the apex, and the {{process.dome_far_leaf_radius_max_in:fraction}} leaf touches at the apex with light at the rim; no flat at the apex, no step left."
inspection = "Dome R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}}: between the {{process.dome_far_leaf_radius_min_in:fraction}} (R{{process.dome_far_leaf_radius_min_in:.4dot}}) and {{process.dome_far_leaf_radius_max_in:fraction}} (R{{process.dome_far_leaf_radius_max_in:.4dot}}) leaves; no flat, no step."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The {{process.dome_far_leaf_radius_max_in:fraction}} leaf showing light at the apex, a flat or a step (the rim still full): file again from the rim inward and screen again. The {{process.dome_far_leaf_radius_min_in:fraction}} leaf touching at the apex (filed too far at the rim): scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, look over, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pin: the R.18 head dome, the Ø.20 head, the one-diameter (Ø.125) shank made to fit its mates, the ring groove and the R.07 tip dome." }

[[setups.operations]]
instruction = "With a fine stone, break the head's two outer edges and the tip dome's root edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Stone only the burr off the groove's two edges, the load wall's edge left square; leave the seat's inside corner and the shank untouched."

[[setups.operations]]
instruction = "Look over the shank where the bush held it, then try on it once more, as in Op 190, each of {{cad.outer_mates}} that was not set aside in Op 220, and MHA-PD-18."
inspection = "No mark or nick you can feel; each mate tried still enters, turns free and has no shake; the arm slides on by hand up to the seat."
gauge_checks = "other"

[[setups.operations]]
instruction = "A mark you can feel, or a mate tried in Op 420 that binds or shakes: scrap the pin and make another from Op 40, the blank rechucked as in Setup 1's Holding."

[[setups.operations]]
instruction = "Wipe the pin with machine oil (FINISH: oiled; MHA-PD-00 degreases it before the bond). Keep it with MHA-PD-18, MHA-PD-10, MHA-PD-24 and MHA-PD-25, the parts it was fitted to."
