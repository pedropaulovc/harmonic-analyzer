<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 220 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.250 bar (cad.stock_dia_mm), the jaw fronts 2.385 behind Z0, the tip plane (cad.jaw_z_mm); the sawn end .22 out (cad.face_allowance_mm), faced to the .20 stub's end (centre_stub_in); the journal Ø.125 (cad.outer_dia_mm) from Z+.10 (turn_start_z_mm) to the seat at Z-2.08 (cad.outer_far_out_far_z_mm), the head Ø.20 (cad.step_head_dia_mm) back to Z-2.29 (head_turn_end_z_mm), the groove Ø.096 x .021 .157 from the tip plane (cad.groove_far_out_*). The 3-jaw's body and jaws are schematic (their sizes are not on record); the MT3 dead centre is schematic (its sizes are not on record), the bar's rest runs on into the chuck. The AR tool schematic (not on record), its point on the faced end. The dead centre drawn backed off: it comes up in Op 60, after the centre drill. Hatched: this setup's removal; dotted: the stub, cut off in Op 180 (waste). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1, Op 40: the AR tool faces the bar end square, .02 off (to scale, 220 px/in)</text>
  <rect class="fixture-vise" x="34" y="130.5" width="56" height="139"/>
  <path class="part-rest" d="M20 172.5L155.78 172.5L155.78 227.5L20 227.5L17 219.64L20 211.79L17 203.93L20 196.07L17 188.21L20 180.36Z"/>
  <rect class="part-kept" x="169.53" y="178" width="27.57" height="44"/>
  <rect class="part-kept" x="197.1" y="186.25" width="458.7" height="27.5"/>
  <rect class="part-waste" x="669.55" y="186.25" width="7.15" height="27.5"/>
  <rect class="part-waste" x="676.7" y="172.5" width="22" height="55"/>
  <rect class="part-removed" x="698.7" y="172.5" width="4.4" height="55"/>
  <rect class="part-removed" x="197.1" y="172.5" width="479.6" height="13.75"/>
  <rect class="part-removed" x="197.1" y="213.75" width="479.6" height="13.75"/>
  <rect class="part-removed" x="150.9" y="172.5" width="46.2" height="5.5"/>
  <rect class="part-removed" x="150.9" y="222" width="46.2" height="5.5"/>
  <rect class="part-removed" x="155.78" y="178" width="13.75" height="44"/>
  <rect class="part-removed" x="655.8" y="186.25" width="13.75" height="27.5"/>
  <rect class="part-removed" x="615.54" y="186.25" width="4.62" height="3.19"/>
  <rect class="part-removed" x="615.54" y="210.56" width="4.62" height="3.19"/>
  <rect class="clamp" x="90" y="142.5" width="40" height="30"/>
  <rect class="clamp" x="90" y="227.5" width="40" height="30"/>
  <line class="centre-line" x1="20" y1="200" x2="740" y2="200"/>
  <path class="clamp" d="M729.1 200L786.26 167L760 167L760 233L786.26 233Z"/>
  <path class="cutter" d="M698.7 213.2L728.7 225.2L728.7 323.2L720.7 320.2L712.7 323.2L704.7 323.2L704.7 237.2Z"/>
  <line class="arrow" x1="738.7" y1="273.2" x2="738.7" y2="227.2"/>
  <line class="datum" x1="654.7" y1="50" x2="654.7" y2="92"/>
  <text class="datum-label" x="648.7" y="60" text-anchor="end">Z0 the tip plane</text>
  <text class="label" x="500" y="372" text-anchor="end">AR facing the sawn end .02 off:</text>
  <text class="label" x="500" y="388" text-anchor="end">the stub's end, Z+{{process.centre_stub_in:.2dot}}</text>
  <line class="leader" x1="502" y1="368" x2="708.7" y2="330"/>
  <circle class="leader-dot" cx="708.7" cy="330" r="2"/>
  <text class="label" x="560" y="110">dead centre, backed off:</text>
  <text class="label" x="560" y="126">in the stub from Op 60</text>
  <text class="label" x="560" y="142">until Op 180 cuts it off</text>
  <line class="leader" x1="712" y1="136" x2="724" y2="173"/>
  <circle class="leader-dot" cx="724" cy="173" r="2"/>
  <text class="label" x="20" y="384">3-jaw on the Ø{{cad.stock_dia_mm:in.3dot}} bar, {{cad.stickout_in:.2dot}} out</text>
  <line class="leader" x1="110" y1="372" x2="110" y2="247.5"/>
  <circle class="leader-dot" cx="110" cy="247.5" r="2"/>
  <text class="label" x="160" y="60">hatched: the rest of this setup's removal: the Ø{{cad.outer_dia_in:.3dot}} journal,</text>
  <text class="label" x="160" y="76">the Ø{{cad.step_head_dia_in:.2dot}} head, the groove, the tip cut and the part-off</text>
  <line class="leader" x1="300" y1="74" x2="390.7" y2="178.5"/>
  <circle class="leader-dot" cx="390.7" cy="178.5" r="2"/>
  <text class="label" x="150" y="300">the pin, head at the chuck end</text>
  <line class="leader" x1="260" y1="288" x2="302.7" y2="209.75"/>
  <circle class="leader-dot" cx="302.7" cy="209.75" r="2"/>
