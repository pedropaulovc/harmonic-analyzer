<!-- The 1/4 in bar in the 3-jaw, the tip end out on the tailstock centre: head and journal turned, the ring groove cut, the stub cut off and the pin parted off. Drawn once by prechips.shaft_diagrams and kept as a picture: the template labels the journal with its analysis band, and the drawing prints (Ø.125) REF, made to fit its mates (fit audit 2026-11-23). Not to scale after a model change; its sizes are bound. -->
