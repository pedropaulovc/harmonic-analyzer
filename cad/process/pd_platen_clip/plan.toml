# Platen clip MHA-PD-03, two off (pd-platen-clip.yaml process: "one-piece .032
# in sheet brass; opposed open-ended slits with rounded ends leave a
# center-bridged spring rail, formed in smooth tangent bends").
#
# Route chosen for speed: the clip's slits (.04 with full R ends), the R.03
# and R.10 corners, the full R finger tips and the two Ø.116 holes at .XXX
# stations are what a CNC holds in one pass and a hand-cut strip takes hours
# to reach; the six bows are pressed in one squeeze per clip between matched
# dies, the bow former, which the same file cuts from the same strip.
#
# Setup 1 at the bench: mike the C26000 H02 strip, saw two 3.60 in blanks
# (A and B) off its end with the junior hacksaw, the strip sandwiched
# between scrap wood blocks in the bench vise, file their burrs. Setup 2 on the
# PM-30MV: the spoil plate (fixtures.sheet-spoil-plate, 6 x 5 x 1/2 6061)
# on 1 in parallels across the vise jaws, its back edge on the fixed jaw;
# both blanks bonded to its top on blue painter's tape on the plate and on
# each blank with CA glue between (owner 2026-11-23), their left ends flush
# with the plate's left end, blank A's back edge on a strip of the tape on
# the fixed jaw's face and blank B's on blank A's front edge. G54: X0 the plate's left end, Y0 the
# fixed jaw's face, Z0 the plate top. PC01_sheet (cam:pd_platen_clip,
# cad/process/pd_platen_clip/cam.py) runs the 1/32 downcut end mill (T1) in
# four equal levels, the last .004 into the spoil plate: each Ø.116 hole
# plunged near its centre and opened by two circles to the drilled band's
# middle; each clip's flat outline at its developed length (the fingers'
# tips stand .008 past the rail ends until the bows draw them back); then
# four die laminations (blank A's last part and blank B's three), each cut
# round and split along the bow profile by one pass into a male and a female
# half. Setup 3 at the bench frees the parts, deburrs them and checks the
# first clip. Setup 4 presses each clip's bows in the vise: the four male
# halves stacked on one parallel, the four female halves on the other, the
# finger on edge between them, and checks every clip's bows and length.
#
# The former's die radius springs back to the drawing's .06 rise: Ri/Rf =
# 4x^3 - 3x + 1, x = Ri Y/(E t) (the springback relation the latch hook's
# former record uses, fixtures.pd-latch-hook-former), E 16,000 ksi
# (McMaster-Carr 8859K86), Y 290-359 MPa (the same record's range; Copper
# Development Association, C26000 flat products, H02: 52 ksi = 359 MPa
# typical), at the middle yield and the nominal strip; the recipe solves
# the radius and checks that every corner of the yield range and the
# strip's ±.002 lands inside the .05-.07 rise.
#
# To order: the strip (stock-to-order.toml c260-h02-strip-032x2, McMaster
# 8859K86; its rest goes to MHA-PD-14), the 1/32 downcut end mill
# (tools-special-cutters.toml endmill-carbide-3fl-1-32-downcut, Harvey Tool
# 896231), the junior hacksaw
# (tools-hand.toml junior-hacksaw, bought for the DT pins anyway) and the pin
# gauges (gauges.pin-gauges). The spoil plate is to make from owned stock.
# On hand: the blue tape, the CA glue and its accelerator (consumables.toml
# hold-painters-tape-ca).
#
# Tool audit 2026-11-23 (row aviation-snips-straight): the two 2 in
# cross-cuts are sawn with the junior hacksaw (32 TPI, pitch .031), not
# snipped. Fewer than two teeth would bear on the bare .032 sheet, so the
# strip is sawn sandwiched between two wood blocks, which carry the teeth;
# nothing curls, so no flattening step. Row india-stone-ib8: the burr is
# rubbed off on the owned two-grit stone's 320 face (aluminium oxide, as an
# India stone; McMaster-Carr 4506A2), as ch_rocker_strap words it.
title = "Platen Clip"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
material_key = "c260-h02"
milling_material = "brass"
stock = "Qty {{process.quantity:g}}. C26000 H02 brass strip, .032 x 2 x 12 in (McMaster-Carr 8859K86, two strips to order, not on hand): two {{process.blank_length_in:.2dot}} in blanks sawn off one end of the first strip; the rest of it (over 4.7 in after the two saw cuts) is MHA-PD-14's, whose blank is 4.08 in. The second strip is the spare: any new blank for this part comes from it."
shop = "../shop"
stock_refs = ["c260-h02-strip-032x2"]

# The shop's standing page carries what every traveler shares (units,
# homing, Feed Hold, tool changes, proving a file); the finish prints at the
# bagging op.
standing = true

[cad]
file = "../../out/features/pd_platen_clip/features.toml"
adapter = "formed_blank"
part = "pd-platen-clip"

[parameters]
quantity = 2
# The blanks: sawn 3.60 in off the 2 in strip (its own width, as
# supplied), each holding parts the recipe lays out; .032 as bought.
blank_length_in = 3.6
blank_width_in = 2.0
blank_thickness_in = 0.032
blank_length_mm = 91.44
blank_width_mm = 50.8
# The strip's thickness as bought: McMaster-Carr 8859K86, .032 -.002/+.002
# (stock-to-order.toml c260-h02-strip-032x2).
strip_thickness_min_in = 0.030
strip_thickness_max_in = 0.034
strip_thickness_min_mm = 0.762
strip_thickness_max_mm = 0.8636
# Its modulus and yield, for the former's springback (header): E 16,000
# ksi; Y 290-359 MPa.
strip_modulus_mpa = 110316.1
strip_yield_min_mpa = 290.0
strip_yield_max_mpa = 359.0
# --- Layout on the spoil plate (work X/Y) ---
# Both blanks' left ends flush with the plate's left end (X0), so each
# clip's rail near end, and each lamination's left end, stands this far in.
part_left_x_mm = 4.064
# From Y0 (the fixed jaw's face; blank A's back edge sits .005 off it, on
# the jaw's tape strip) to the first clip's
# spring edge, and between parts down each blank.
part_margin_y_mm = 2.54
part_gap_mm = 2.032
clip_spring_edge_y_mm = -2.54
# What is left of each blank in front of its last part, and right of the
# far finger tip's path. The saw cut, on a line squared by hand, may wander
# this far (the author's 1/16 in, no source).
blank_a_front_margin_mm = 7.62
blank_b_front_margin_mm = 6.096
blank_right_margin_mm = 3.596
saw_error_mm = 1.5875
# The spoil plate (fixtures.sheet-spoil-plate): the 1/2 x 6 in bar's 6 in
# width along the jaws, its sawn 5 in length across them.
plate_length_mm = 152.4
plate_width_mm = 127.0
plate_thickness_mm = 12.7
# The blanks along the plate (the beam checks), in X from the plate's left
# end: the cut runs from the first finger tip's path to the last's.
sheet_from_x_mm = 3.454
sheet_to_x_mm = 88.238
plate_from_x_mm = 0.0
plate_to_x_mm = 152.4
# The cutter's way in from beyond the plate's left end (machine capacity).
entry_overhang_mm = 1.787
# The hold (owner 2026-11-23, R1: "for tape isnt it possible to use blue
# painters tape on both sides and ca glue between them"): ScotchBlue 2090
# blue painter's tape on the plate and on each blank's underside, GH1200
# thick CA glue between. The stack and its band are the shop record's
# (consumables.hold-painters-tape-ca: .011 nominal, .009-.013).
tape_stack_mm = 0.28
tape_stack_min_mm = 0.23
tape_stack_max_mm = 0.33
# Its strengths are the stresses accepted for the hold, used as written (R2:
# "it is widely used in industry with much heavier requirements; take it as
# given it will work"; the figure set by the planner as the owner delegated,
# the same record's accepted_shear_kpa and accepted_tensile_kpa: 0.6 MPa, a
# cap as well as an envelope). The operator proves each bond by a push test.
bond_accepted_shear_mpa = 0.6
bond_accepted_tensile_mpa = 0.6
# The pieces the cut leaves on the tape (the recipe recomputes each): a
# clip, its finger the narrowest width; a male and a female die half, each
# at its narrowest; and the rest of each blank.
clip_bond_area_mm2 = 905.456
clip_finger_width_mm = 3.302
male_bond_area_mm2 = 484.115
female_bond_area_mm2 = 508.608
female_least_width_mm = 4.7324
waste_a_bond_area_mm2 = 1841.517
waste_b_bond_area_mm2 = 1666.985
blank_area_mm2 = 4645.152
# The cutter's tip .004 in into the spoil plate (Z0 its top beside the
# blanks), as the comb's plan: the tip goes past the tape stack whatever the
# stack's and the plate top's variation; at least through_margin_min_mm
# below the thinnest strip's underside on the thinnest stack (.009), and no
# deeper into the plate than spoil_cut_max_mm on any stack (Z0 is the plate
# top). The depth runs from the thickest strip's top on the thickest stack
# (.013 + .034) to the tip, in level_count equal levels, each at most
# level_depth_max_fraction of the cutter's diameter.
# Levels (R3: "no need to bring to me ; make coarser as you see fit"): the
# bond never set this count; the binding limit is the maker's, Harvey Tool's
# slotting depth for the series (SF_896200, read 2026-11-22: axial .5 x D,
# .0155 a level), the depth that goes with the slotting chip load the feed
# is held to (delegated ruling 2026-11-22: never above the maker's
# published chip load). Precedents for this cutter in brass, both
# shallower than the maker's limit: the .006-tape version of this plan ran
# three levels of .0146; dt_cone_gear_tl_phasing_comb's outline runs three
# of .0123 (.3135 mm). The thicker stack adds .007 to the cut, so four
# levels of .0127 here, no deeper than the .006-tape version's .0146. The
# 0.6 MPa bond cap does
# not bind: the cut asks 0.056 MPa in shear of the smallest piece (a male
# die half) and no tension (a downcut).
sheet_tip_z_mm = -0.1016
sheet_tip_into_plate_mm = 0.1016
through_margin_min_mm = 0.2
spoil_cut_max_mm = 0.254
sheet_depth_mm = 1.2952
level_depth_max_fraction = 0.5
level_count = 4
level_depth_mm = 0.3238
# The 1/32 end mill (shop tools.endmill-carbide-3fl-1-32-downcut
# diameter_mm; the recipe checks it): its runs down each slit's two sides
# leave this much of the .040 slit between them.
sheet_cutter_dia_mm = 0.7874
slit_cutter_clearance_mm = 0.2286
# The title block's INSIDE CORNERS R.040 MAX (cad/config/title_block.yaml
# in.inside_corner.radius_in): the cutter's radius must not exceed it.
inside_corner_max_mm = 1.016
# The holes' finish circle cuts the middle of the drilled band, Ø.116
# +.004/0.
hole_dia_target_mm = 2.9968
# Plunges into the strip near each hole's centre at a quarter of the cutting
# feed (the author's, no source; the gooseneck's ball plunges at half).
plunge_feed_fraction = 0.25
plunge_feed_mm_min = 17.145
# --- The bow former: four laminations of the strip ---
# Each as long as the rail; its male half's flats this far above its back
# edge, the whole lamination this high; each half at least
# lamination_body_min_mm through (the author's, no source).
lamination_count = 4
lamination_height_mm = 12.7
lamination_flat_mm = 5.08
lamination_body_min_mm = 3.175
die_stack_mm = 3.2512
# Recomputed by the recipe: the die's mid-surface radius and rise, and the
# formed bow's rise over the yield and thickness corners.
die_bow_radius_mm = 25.6424
die_bow_rise_mm = 2.0748
formed_rise_min_mm = 1.4256
formed_rise_max_mm = 1.6115
# Machine-capacity inputs (mm): heights above the mill table, tool lengths
# from spindle nose to tip.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
parallel_height_mm = 25.4        # 1 in parallels (shop-equipment fixtures.parallels-lms-6745).
# The jaw tops above the plate top: jaw height − parallels − plate (recomputed).
jaw_top_over_plate_mm = 6.8453
# The collet's nose over the jaw tops with the tip at the cut, at the least
# stickout: stickout + tip height − jaw top (recomputed).
collet_over_jaw_mm = 12.1031
# The plate's ends inside the jaws' width, centred: no overhang either side.
plate_overhang_mm = 0.0
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm (as the base-bar plan).
# The 1/32 end mill on its 1/8 shank, 1-1/2 in overall: 3/4 to 1 in out of
# the 1/8 collet, so the collet's nose stays above the jaw tops at the cut
# (the recipe checks the least), at least 1/2 in of shank held.
em_projection_min_mm = 19.05
em_projection_max_mm = 25.4

[[tools]]
id = "saw"
name = "Junior hacksaw, 32 TPI; two scrap wood blocks"
ref = "junior-hacksaw"

[[tools]]
id = "file"
name = "8 in smooth file"
ref = "jig-files"

[[tools]]
id = "plate"
name = "Spoil plate"
ref = "sheet-spoil-plate"
description = "Spoil plate 6 x 5 x 1/2 in 6061, made beforehand: a 5 in length sawn off the owned 1/2 x 6 in bar, sawn ends deburred, top as supplied"

[[tools]]
id = "tape"
name = "Blue painter's tape"
ref = "tape-scotchblue-2090"
description = "ScotchBlue Original Multi-Surface 2090 painter's tape, 1.41 in wide: on the plate and on each blank's underside"

[[tools]]
id = "glue"
name = "CA glue, thick"
ref = "ca-glue-gh1200"
description = "GH1200 CA super glue, the 1500 cps thick bottle: the bead between the plate's tape and the blank's tape"

[[tools]]
id = "accelerator"
name = "CA accelerator"
ref = "ca-accelerator-starbond"
description = "Starbond CA glue accelerator spray: misted on the blank's tape so the glue sets at once"

[[tools]]
id = "em-thirty-second"
name = "1/32 in carbide downcut end mill"
ref = "endmill-carbide-3fl-1-32-downcut"
# Harvey Tool 896231: 3 left-hand spiral, right-hand cut flutes, "prevents
# lifting of workpiece" (harveytool.com family page, read 2026-11-22): its
# helix pushes the clip's narrow finger onto the tape.
axial_direction = "down"

[[tools]]
id = "stone"
name = "Two-grit sharpening stone (320 face)"
ref = "sharpening-stone-two-grit"

[[tools]]
id = "deburr"
name = "Deburring set"
ref = "deburring-set"

[[tools]]
id = "former"
name = "Bow former (the four die laminations)"
ref = "pd-platen-clip-bow-former"
description = "The four male and four female die halves cut in Setup 2, stacked in the vise on two 1/2 in parallels"

[[setups]]
machine_kind = "other"
title = "Bench: check the strip, saw two blanks"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "To scale: the 2 x 12 in strip laid out, blank A off its bought end, blank B next, each {{process.blank_length_in:.2dot}} in long and the strip's full 2 in wide, the rest kept for MHA-PD-14. Below, from above, the strip on edge between two wood blocks in the bench vise, the hacksaw blade on the line {{process.blank_length_in:.2dot}} in from the flush end, its kerf away from it (kerf and vise drawn schematic)." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the strip as it arrives, 1 in in from each end."
inspection = "Both readings {{process.strip_thickness_min_in:.3dot}}–{{process.strip_thickness_max_in:.3dot}}, else stop: it is not the .032 strip."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.strip_thickness_min_mm}}", "{{process.strip_thickness_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Take two scrap wood blocks, each about 3/4 in thick, 3 in wide and 9 in long. Lay the strip on one, the other on top, the strip's bought end flush with both blocks' ends." },
  { kind = "action", text = "Square a line across the top block {{process.blank_length_in:.2dot}} in from that flush end (rule and square). Clamp the stack in the bench vise, the line 1/2 in out past the jaws." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Saw straight down through block, strip and block, the blade upright and its kerf on the line's side away from the flush end; light, full-length strokes. The piece off: blank A." },
  { kind = "action", text = "Blank B: the same, the blocks turned end for end so their uncut ends lie flush with the strip's sawn end. Keep the rest of the strip for MHA-PD-14." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Lay each blank on the spoil plate and file the saw burr off every sawn end, the file flat on the plate's top. Mark the blanks A and B with a marker." },
  { kind = "check", text = "Each blank lies flat on the plate: no end rocks or stands up when pressed." },
  { kind = "stop", text = "An end still stands up: saw a new blank off the spare strip the same way and try again." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "CNC mill: bond the blanks to the spoil plate; cut the clips and the former"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Spoil plate on 1 in parallels across the vise jaws, its back edge on the fixed jaw, centred along the jaws: the jaw tops stand {{process.jaw_top_over_plate_mm:in.3dot}} above the plate top, room for the edge finder's touch and blank A's edge, and at the least stickout the collet's nose passes {{process.collet_over_jaw_mm:in.2dot}} over them at the cut. Blanks A and B bonded to its top: blue tape under their whole faces, on the plate and on each blank, and a zigzag CA bead between that runs under every part (stack {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}); both left ends flush with the plate's left end, A's back edge against a 1/8 in strip of the tape on the fixed jaw's face (so no glue reaches the jaw) and B's against A's front edge."
datum = "Program PC01_sheet. G54: X0 the plate's left end, Y0 the fixed jaw's bare face (the plate's back edge; blank A's stands .005 off it on the jaw's tape strip, which the program does not need: it cuts from G54), Z0 the plate top, bare right of the tape; the file works {{process.tape_stack_mm:in.3dot}} above it for the tape stack, starting each cut over the thickest stack ({{process.tape_stack_max_mm:in.3dot}}) and ending {{process.sheet_tip_into_plate_mm:in.3dot}} into the plate; +Y toward the fixed jaw. Each clip's rail near end stands at X {{process.part_left_x_mm:in.3dot}}, the first clip's spring edge at Y {{process.clip_spring_edge_y_mm:in.3dot}}. After homing again (the standing page says when): check that neither blank has moved or lifted on its bond. One off, a blank moved, or the plate moved in the vise: stop and tell the owner."
diagram = { file = "diagrams/sheet.svg", alt = "Plan of the spoil plate in the vise, to scale: the plate's blue tape, four strips along X from its left end to 4 in, and blank A against the fixed jaw and blank B in front of it on it, both flush with the plate's left end; dashed, the tape seams along X; on A the two clips, rails toward the moving jaw, and the first lamination; on B the other three; each lamination split along its bow profile into a male half and a female half. The 1/32 in end mill at PC01's first plunge, in clip 1's left hole, with a detail of the two clockwise circles that open it. A section across the jaws: the plate on a 1 in parallel at each jaw, its back edge on the fixed jaw, the blanks on their tape stack on top, the jaw tops {{process.jaw_top_over_plate_mm:in.3dot}} above the plate." }
# Top: the thickest strip on the thickest tape stack; deepest: the cutter's
# tip, .004 into the spoil plate. Across the jaws, the two blanks; along
# them, blank A and the cutter's way in beyond the plate's left end.
envelope = { x_span_mm = ["{{process.blank_length_mm}}", "{{process.entry_overhang_mm}}"], y_span_mm = ["{{process.blank_width_mm}}", "{{process.blank_width_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.tape_stack_max_mm}}", "{{process.strip_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.sheet_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{process.blank_area_mm2}}", width_mm = "{{process.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Spoil plate on the 1 in parallels across the jaws, its back edge on the fixed jaw, centred along the jaws; close the vise and tap the plate down onto the parallels."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the plate's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face from the plate's side (−Y), G10 L20 P1 Y-2.540. X: its tip .10 below the plate top, on the plate's left end from the left, G10 L20 P1 X-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "Mike each blank 1/2 in in from each end and write the four readings down in mm (in × 25.4): op 180 subtracts them from its Z readings to find the tape stack."
feed = "hand"

[[setups.operations]]
instruction = "Clean: degrease the plate top and both blanks' undersides with isopropyl alcohol on a clean rag; wipe each dry with a fresh rag."
feed = "hand"

# R1 (the hold): seams along the long cuts (X), the blanks' seams offset
# from the plate's so no cut line or narrow piece rides on a seam of both.
[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
instruction = "Tape the plate: four strips of the blue tape (1.41 in wide) along the jaws, each from the plate's left end (trimmed flush) to 4 in (.40 past the blanks' 3.60), the first against the fixed jaw, edges butted, never overlapped, no gap over 1/32; trim the fourth at the moving jaw. Seams 1.41, 2.82 and 4.23 in from the fixed jaw. The plate right of the tape stays bare."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
instruction = "Tape each blank's whole underside: two strips along its length, butted, trimmed flush with its edges and ends with a knife. Blank A: the first strip flush with its front edge (seam .59 from its back edge, .82 off the plate's at 1.41). Blank B: the first flush with its back edge (seam 3.41 from the fixed jaw, .59 and .82 off the plate's)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Burnish both tapes down hard with the round back of a screwdriver handle: every strip, edges included. No bubble or lifted edge." },
  { kind = "action", text = "With a marker and a steel rule, mark on the plate's tape the blanks' right ends, 3.60 in from the plate's left end, and the line between them, 2.00 in from the fixed jaw." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
instruction = "Tape the fixed jaw: knife a 1/8 in strip off the blue tape against a steel rule and lay it along the jaw's face over the plate's length, its lower edge down on the plate's tape. Glue squeezed out at blank A's back edge lands on it, not on jaw steel. It stays below the edge finder's touch (.10 below the jaw top) and above the plate's seat."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Glue, blank A: thick CA on the plate's tape in A's place (against the jaw's tape strip), a zigzag bead about 1/16 wide, lines about 3/4 in apart, from 1/16 in off the jaw's strip (under clip 1's finger) to 1/4 in inside A's front edge and ends: about 8 in of bead, .5 sq in. No glue on bare metal." },
  { kind = "action", text = "Mist the accelerator on blank A's tape, two or three sprays." },
]
feed = "hand"

[[setups.operations]]
instruction = "Press, within about 10 seconds of the spray (the glue grabs at once; the blank cannot be slid after): lower blank A, its back edge against the jaw's tape strip and its left end against a steel rule held on the plate's left end. Press it down over its whole face with a flat block for 1 minute. Squeeze-out at the back edge lands on the tape strip: leave it."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Glue, blank B: the same bead in B's place, in front of blank A, from 1/16 in off A's front edge (under lamination 2's female half) to 1/4 in inside B's front edge and ends (about 8 in, .5 sq in)." },
  { kind = "action", text = "Mist the accelerator on blank B's tape, two or three sprays." },
]
feed = "hand"

[[setups.operations]]
instruction = "Press, within about 10 seconds of the spray: lower blank B, its back edge against blank A's front edge and its left end against the steel rule on the plate's left end. Press it down over its whole face with the flat block for 1 minute. Then wait 5 minutes."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/32 in end mill, {{process.em_projection_min_mm:in.2dot}}–{{process.em_projection_max_mm:in.2dot}} out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the bare plate top right of the tape: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Check, stack (spindle stopped): drag the same leaf under the tip on each blank's top 1/2 in in from each end; read Z (mm). Stack = reading − 0.051 (the leaf) − that end's op 70 thickness." },
  { kind = "check", text = "Every stack {{process.tape_stack_min_mm:.2f}}–{{process.tape_stack_max_mm:.2f}} mm ({{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}); each blank's two ends within 0.05 mm (.002) of each other." },
  { kind = "stop", text = "Out of band or ends apart by more: op 200, then this op again." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Check, push test: jog Z up clear. With the heel of the hand push each blank hard along and across; try to lift each corner with a thumbnail." },
  { kind = "check", text = "No movement, no creak, no lifted corner." },
  { kind = "stop", text = "Any movement: op 200, then ops 180 and 190 again." },
]
feed = "hand"

[[setups.operations]]
instruction = "Only after a Stop at op 180 or 190: jog Z up clear; the plate stays in the vise. Free both blanks with the blade under the plate's tape and peel them as ops 240–250 do, peel all the tape, then repeat ops 80–170."
feed = "hand"

# Four equal levels, each piece's last with the tip into the spoil plate:
# the holes plunged near their centres, every outline entered from the air
# beyond the plate's left end. The last level cuts through both tapes and
# the glue, so every piece and both wastes stay on their own island of tape.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-thirty-second"
drilling = "none"
sizing = "other"
instruction = "Run PC01_sheet (M6 T1: set 2800, then Cycle Start; about 114 min). Each hole is plunged near its centre at a quarter of the feed and opened by two circles; then each clip is cut round; then each lamination round and split along its bow profile. Four levels each, the last {{process.sheet_tip_into_plate_mm:in.3dot}} into the spoil plate."
settings = "endmill-carbide-3fl-1-32-downcut-c260"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "clip", kind = "part", area_mm2 = "{{process.clip_bond_area_mm2}}", width_mm = "{{process.clip_finger_width_mm}}" }, { name = "male die half", kind = "part", area_mm2 = "{{process.male_bond_area_mm2}}", width_mm = "{{process.lamination_flat_mm}}" }, { name = "female die half", kind = "part", area_mm2 = "{{process.female_bond_area_mm2}}", width_mm = "{{process.female_least_width_mm}}" }, { name = "waste A", kind = "waste", area_mm2 = "{{process.waste_a_bond_area_mm2}}" }, { name = "waste B", kind = "waste", area_mm2 = "{{process.waste_b_bond_area_mm2}}" }] } }
milling_cuts = [
  { name = "sheet", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.sheet_cutter_dia_mm}}", axial_doc_mm = "{{process.level_depth_mm}}", radial_woc_mm = "{{process.sheet_cutter_dia_mm}}", traverse_mm = ["{{process.sheet_from_x_mm}}", "{{process.sheet_to_x_mm}}"] },
]

[[setups.operations]]
steps = [
  { kind = "action", text = "While PC01_sheet runs, dry: air blast the chips off as it goes; no flood or mist coolant and no water (the paper tape soaks and lets go)." },
  { kind = "stop", text = "The cut smokes or smells hot (CA softens with heat): Feed Hold, then Reset (the spindle stops); jog Z up clear and wait until the blank is cool to a finger." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: free the parts, deburr, check the first clip"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The first clip, flat, to scale: its length over the rail ends (the calipers' jaws on the rail), the rail's width, the overall width from the rail edge to the spring edge, and its two holes, with the pins each takes: the .116 pin goes in, the .120 pin does not." }
envelope = "other"
vise_hold = "other"
beam = "other"
# First clip only: the CNC holds these, the second clip runs the same path.
# The slits, the bridge stations, the corners and the hole stations are held
# by the program (cam:pd_platen_clip checks the posted path against the
# drawing's bands) and are not gauged.
inspection = [
  "First clip only. Length over the rail ends {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}, the jaws on the rail below the slits (the flat finger's tips stand a little past them); rail width {{cad.rail_edge_width_min_in:.2dot}}–{{cad.rail_edge_width_max_in:.2dot}}, the rail edge to the slits; overall width {{cad.spring_edge_width_min_in:.2dot}}–{{cad.spring_edge_width_max_in:.2dot}}, the rail edge to the spring edge.",
  "First clip only. Each hole: the {{cad.screw_holes_dia_min_in:.3dot}} pin goes in, the {{cad.screw_holes_dia_max_in:.3dot}} pin does not.",
  "First clip only, by eye against the drawing: the finger's ends full R and convex, the rail's R.10 and R.03 corners convex, each slit's inner end a full R.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.rail_edge_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.spring_edge_width_band_mm}}" },
  { gauge = "pin-gauges", band_mm = "{{cad.screw_holes_dia_band_mm}}" },
]

[[setups.operations]]
instruction = "Peel the tape strip off the fixed jaw's face; where squeeze-out holds it to blank A's edge, leave it on the blank. Plate out of the vise, on the bench. No solvent soak: the parts come off by peeling. Wastes first: slide a thin blade (single-edge razor or .010 feeler) flat under the plate's tape at a waste's outer edge, work it along, and peel the waste off with its tape."
feed = "hand"

[[setups.operations]]
instruction = "Each part: slide the blade flat under the plate's tape at its long edge (a clip's rail, a die half's back edge) and work it along the whole length a little at a time, so the tape, not the part, bends. Never lever a part up from one end; never lift a part by an edge, or a clip by its finger, while any tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Lay each part tape-up on the spoil plate, hold it down flat with the other hand close to the peel line, and peel its tape back on itself, low and slow, along its length."
feed = "hand"

[[setups.operations]]
instruction = "Any CA spot on a part or the plate: acetone on a rag (acetone softens CA). Tape adhesive film: isopropyl alcohol. Peel the plate's tape and wipe the plate. Mark the clips 1 and 2 on their rails."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "stone"
drilling = "none"
sizing = "other"
instruction = "Rub each face of every part flat on the 320-grit face of the two-grit sharpening stone to take the cut's burr off. Break each clip's edges on both faces, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max: the outside edges with the smooth file; each slit's two edges and its full-R ends with the deburring set's scraper, one light stroke along the edge and round each end. Leave the die halves' profile edges sharp."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break each hole's edge on both faces with the set's countersink, turned by hand a turn or two: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, no more."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Each clip lies flat on the plate: no finger rocks or stands up when pressed." },
  { kind = "stop", text = "A finger stands up: press it flat between thumb and plate and check again before forming." },
]
feed = "hand"

[[setups.operations]]
instruction = "Measure the first clip with calipers and the pins, and look over its outline: the setup's inspection lines."
feed = "hand"

[[setups.operations]]
instruction = "Any size out of its band: scrap both clips (no rework on a cut sheet part, and the second clip ran the same path) and stop. Find the cause (cutter, G54, the blank's seat), then repeat Setups 1 to 3 with two blanks off the spare strip."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Vise, spindle off: press the bows; check each clip"
machine = "PM-30MV vise, spindle off"
indexing = "none"
diagram = { file = "diagrams/form.svg", alt = "End view in the vise: a 1/2 in parallel stood against each jaw on the bed; the four male die halves stacked flat on the moving jaw's parallel, the four female halves on the fixed jaw's, profiles facing; the clip on edge between them, its finger level with the stacks and its rail hanging down between the parallels. Below, the calipers across one bow: one jaw on the crest, the other across the flats either side." }
envelope = "other"
vise_hold = "other"
beam = "other"
# Every clip: the bows are formed one clip at a time.
inspection = [
  "Every clip, each of its two bows: the calipers' reading less the finger's thickness miked on the flat beside that bow, {{cad.bows_rise_min_in:.3dot}}–{{cad.bows_rise_max_in:.3dot}} (the bow's rise).",
  "Every clip: length over the spring tips {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}, tips flush with the rail ends.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.bows_rise_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" },
]

[[setups.operations]]
instruction = "Vise empty and open about 1 in. Stand a 1/2 in parallel on the bed against each jaw. Stack the four male die halves flat on the moving jaw's parallel, back edges against the jaw, profiles facing the fixed jaw, ends flush; stack the four female halves the same on the fixed jaw's parallel."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "former"
drilling = "none"
sizing = "other"
instruction = "Stand a clip on edge between the stacks, rail down, hanging between the parallels: the finger's spring edge flush with the stacks' tops, its rail ends flush with the stacks' ends. Close the vise by hand, firmly, until both stacks bear on the finger along its whole length; open it and lift the clip out."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Each bow: mike the finger's flat beside it, then calipers with one jaw across the two flats either side of the bow on its hollow side, the other on the crest. Then the length over the spring tips." },
  { kind = "check", text = "The readings are in the setup's inspection lines." },
  { kind = "stop", text = "A bow out of band: the next two ops; press no other clip until it is in band. Bows in band but the tip length out: stop, keep the clip for the owner and press no other." },
]
feed = "hand"

[[setups.operations]]
instruction = "A bow high only: lay the clip bow up on the spoil plate, press the crest down a little with a thumb, and measure it again."
feed = "hand"

[[setups.operations]]
instruction = "A bow low only: squeeze the clip again in the former, harder, and measure it again. Still low: stop and keep the clip for the owner, who deepens the former's bow, re-posts PC01_sheet and has four new laminations cut from the spare strip."
feed = "hand"

[[setups.operations]]
instruction = "Press and check the second clip the same. Bag each clip with its number (FINISH: {{cad.finish}}). Keep the stacked die halves taped together with the clips' traveler: they are the bow former."
feed = "hand"
