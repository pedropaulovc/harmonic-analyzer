# Platen clip MHA-PD-03, two off (pd-platen-clip.yaml process: "one-piece .032
# in sheet brass; opposed open-ended slits with rounded ends leave a
# center-bridged spring rail, formed in smooth tangent bends").
#
# Route chosen for speed: the clip's slits (.04 with full R ends), the R.03
# and R.10 corners, the full R finger tips and the two Ø.116 holes at .XXX
# stations are what a CNC holds in one pass and a hand-cut strip takes hours
# to reach; the six bows are pressed in one squeeze per clip between matched
# dies, the bow former, which the same file cuts from the same strip.
#
# Setup 1 at the bench: mike the C26000 H02 strip, snip two 3.60 in blanks
# (A and B) off a filed-square end, file their burrs. Setup 2 on the
# PM-30MV: the spoil plate (fixtures.sheet-spoil-plate, 6 x 5 x 1/2 6061)
# on 1 in parallels across the vise jaws, its back edge on the fixed jaw;
# both blanks bonded to its top on 3M VHB 5906 tape, their left ends flush
# with the plate's left end, blank A's back edge on the fixed jaw's face and
# blank B's on blank A's front edge. G54: X0 the plate's left end, Y0 the
# fixed jaw's face, Z0 the plate top. PC01_sheet (cam:pd_platen_clip,
# cad/process/pd_platen_clip/cam.py) runs the 1/32 downcut end mill (T1) in
# three equal levels, the last .004 into the spoil plate: each Ø.116 hole
# plunged near its centre and opened by two circles to the drilled band's
# middle; each clip's flat outline at its developed length (the fingers'
# tips stand .008 past the rail ends until the bows draw them back); then
# four die laminations (blank A's last part and blank B's three), each cut
# round and split along the bow profile by one pass into a male and a female
# half. Setup 3 at the bench frees the parts, deburrs them and checks the
# first clip. Setup 4 presses each clip's bows in the vise: the four male
# halves stacked on one parallel, the four female halves on the other, the
# finger on edge between them, and checks every clip's bows and length.
#
# The former's die radius springs back to the drawing's .06 rise: Ri/Rf =
# 4x^3 - 3x + 1, x = Ri Y/(E t) (the springback relation the latch hook's
# former record uses, fixtures.pd-latch-hook-former), E 16,000 ksi
# (McMaster-Carr 8859K86), Y 290-359 MPa (the same record's range; Copper
# Development Association, C26000 flat products, H02: 52 ksi = 359 MPa
# typical), at the middle yield and the nominal strip; the recipe solves
# the radius and checks that every corner of the yield range and the
# strip's ±.002 lands inside the .05-.07 rise.
#
# To order: the strip (stock-to-order.toml c260-h02-strip-032x2, McMaster
# 8859K86; its rest goes to MHA-PD-14), the 1/32 downcut end mill
# (tools-special-cutters.toml endmill-carbide-3fl-1-32-downcut, Harvey Tool
# 896231), the tape (consumables.toml tape-3m-vhb-5906), straight-cut
# aviation snips (tools-hand.toml aviation-snips-straight), the India stone
# (india-stone-ib8) and the pin gauges (gauges.pin-gauges). The spoil plate
# is to make from owned stock.
title = "Platen Clip"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
material_key = "c260-h02"
milling_material = "brass"
stock = "Qty {{process.quantity:g}}. C26000 H02 brass strip, .032 x 2 x 12 in (McMaster-Carr 8859K86, two strips to order, not on hand): two {{process.blank_length_in:.2dot}} in blanks snipped off one end of the first strip; the rest of it (4.80 in) is MHA-PD-14's, whose blank is 4.08 in. The second strip is the spare: any new blank for this part comes from it."
note = "Inches unless mm; G-code and console entries in mm (the file and the controller run G21). Bench, the CNC mill (one NC file, proved once in air with Z0 raised 1.000 in before it cuts), the bench, the vise (spindle off). Dry: no coolant on the tape. After any controller reset, stall or E-stop, home ($H) and set G54 again. Finish: {{cad.finish}}."
shop = "../shop"
stock_refs = ["c260-h02-strip-032x2"]

[cad]
file = "../../out/features/pd_platen_clip/features.toml"
adapter = "formed_blank"
part = "pd-platen-clip"

[parameters]
quantity = 2
# The blanks: snipped 3.60 in off the 2 in strip (its own width, as
# supplied), each holding parts the recipe lays out; .032 as bought.
blank_length_in = 3.6
blank_width_in = 2.0
blank_thickness_in = 0.032
blank_length_mm = 91.44
blank_width_mm = 50.8
# The strip's thickness as bought: McMaster-Carr 8859K86, .032 -.002/+.002
# (stock-to-order.toml c260-h02-strip-032x2).
strip_thickness_min_in = 0.030
strip_thickness_max_in = 0.034
strip_thickness_min_mm = 0.762
strip_thickness_max_mm = 0.8636
# Its modulus and yield, for the former's springback (header): E 16,000
# ksi; Y 290-359 MPa.
strip_modulus_mpa = 110316.1
strip_yield_min_mpa = 290.0
strip_yield_max_mpa = 359.0
# --- Layout on the spoil plate (work X/Y) ---
# Both blanks' left ends flush with the plate's left end (X0), so each
# clip's rail near end, and each lamination's left end, stands this far in.
part_left_x_mm = 4.064
# From blank A's back edge (on the fixed jaw, Y0) to the first clip's
# spring edge, and between parts down each blank.
part_margin_y_mm = 2.54
part_gap_mm = 2.032
clip_spring_edge_y_mm = -2.54
# What is left of each blank in front of its last part, and right of the
# far finger tip's path. The snip line, scribed and cut by hand, may wander
# this far (the author's 1/16 in, no source).
blank_a_front_margin_mm = 7.62
blank_b_front_margin_mm = 6.096
blank_right_margin_mm = 3.596
snip_error_mm = 1.5875
# The spoil plate (fixtures.sheet-spoil-plate): the 1/2 x 6 in bar's 6 in
# width along the jaws, its sawn 5 in length across them.
plate_length_mm = 152.4
plate_width_mm = 127.0
plate_thickness_mm = 12.7
# The blanks along the plate (the beam checks), in X from the plate's left
# end: the cut runs from the first finger tip's path to the last's.
sheet_from_x_mm = 3.454
sheet_to_x_mm = 88.238
plate_from_x_mm = 0.0
plate_to_x_mm = 152.4
# The cutter's way in from beyond the plate's left end (machine capacity).
entry_overhang_mm = 1.787
# Tape: 3M VHB 5906, .006 in (shop-equipment consumables.tape-3m-vhb-5906).
# 3M "VHB Tapes Technical Data" (November 2015), Typical Performance
# Characteristics, 5906, 72 h dwell at room temperature: normal tensile
# (ASTM D-897, to aluminium) 100 lb/in² = 690 kPa; dynamic overlap shear
# (ASTM D-1002, to stainless steel) 100 lb/in² = 690 kPa.
tape_thickness_mm = 0.15
tape_shear_mpa = 0.69
tape_tensile_mpa = 0.69
# Derating of both strengths: 0.5 for the dwell (same data sheet, Application
# Techniques: about 50% of ultimate bond strength after 20 minutes, so the
# plan waits 20 minutes) × 0.5, the author's allowance for a warm dry cut, no
# source (as the MHA-CH-13 strap's and MHA-DT-03-TL-02 comb's plans).
bond_derating = 0.25
# The pieces the cut leaves on the tape (the recipe recomputes each): a
# clip, its finger the narrowest width; a male and a female die half, each
# at its narrowest; and the rest of each blank.
clip_bond_area_mm2 = 905.456
clip_finger_width_mm = 3.302
male_bond_area_mm2 = 484.115
female_bond_area_mm2 = 508.608
female_least_width_mm = 4.7324
waste_a_bond_area_mm2 = 1841.517
waste_b_bond_area_mm2 = 1666.985
blank_area_mm2 = 4645.152
# The cutter's tip .004 in into the spoil plate (Z0 its top beside the
# blanks), as the comb's plan: the tip goes past the tape whatever the tape's
# and the plate top's variation; at least through_margin_min_mm below the
# thinnest strip's underside on the thinnest tape (.006 in −15 %), no deeper
# into the plate than spoil_cut_max_mm. The depth runs from the thickest
# strip's top (tape + .034) to the tip, in level_count equal levels, each
# at most level_depth_max_fraction of the cutter's diameter: Harvey Tool's
# slotting depth for the series (SF_896200, read 2026-11-22: axial .5 x D).
sheet_tip_z_mm = -0.1016
sheet_tip_into_plate_mm = 0.1016
tape_thickness_min_mm = 0.1295
through_margin_min_mm = 0.2
spoil_cut_max_mm = 0.254
sheet_depth_mm = 1.1152
level_depth_max_fraction = 0.5
level_count = 3
level_depth_mm = 0.37174
# The 1/32 end mill (shop tools.endmill-carbide-3fl-1-32-downcut
# diameter_mm; the recipe checks it): its runs down each slit's two sides
# leave this much of the .040 slit between them.
sheet_cutter_dia_mm = 0.7874
slit_cutter_clearance_mm = 0.2286
# The title block's INSIDE CORNERS R.040 MAX (cad/config/title_block.yaml
# in.inside_corner.radius_in): the cutter's radius must not exceed it.
inside_corner_max_mm = 1.016
# The holes' finish circle cuts the middle of the drilled band, Ø.116
# +.004/0.
hole_dia_target_mm = 2.9968
# Plunges into the strip near each hole's centre at a quarter of the cutting
# feed (the author's, no source; the gooseneck's ball plunges at half).
plunge_feed_fraction = 0.25
plunge_feed_mm_min = 17.145
# --- The bow former: four laminations of the strip ---
# Each as long as the rail; its male half's flats this far above its back
# edge, the whole lamination this high; each half at least
# lamination_body_min_mm through (the author's, no source).
lamination_count = 4
lamination_height_mm = 12.7
lamination_flat_mm = 5.08
lamination_body_min_mm = 3.175
die_stack_mm = 3.2512
# Recomputed by the recipe: the die's mid-surface radius and rise, and the
# formed bow's rise over the yield and thickness corners.
die_bow_radius_mm = 25.6424
die_bow_rise_mm = 2.0748
formed_rise_min_mm = 1.4256
formed_rise_max_mm = 1.6115
# Machine-capacity inputs (mm): heights above the mill table, tool lengths
# from spindle nose to tip.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
parallel_height_mm = 25.4        # 1 in parallels (shop-equipment fixtures.parallels-lms-6745).
# The jaw tops above the plate top: jaw height − parallels − plate (recomputed).
jaw_top_over_plate_mm = 6.8453
# The collet's nose over the jaw tops with the tip at the cut, at the least
# stickout: stickout + tip height − jaw top (recomputed).
collet_over_jaw_mm = 12.1031
# The plate's ends inside the jaws' width, centred: no overhang either side.
plate_overhang_mm = 0.0
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm (as the base-bar plan).
# The 1/32 end mill on its 1/8 shank, 1-1/2 in overall: 3/4 to 1 in out of
# the 1/8 collet, so the collet's nose stays above the jaw tops at the cut
# (the recipe checks the least), at least 1/2 in of shank held.
em_projection_min_mm = 19.05
em_projection_max_mm = 25.4

[[tools]]
id = "snips"
name = "Aviation snips, straight cut"
ref = "aviation-snips-straight"

[[tools]]
id = "file"
name = "8 in smooth file"
ref = "jig-files"

[[tools]]
id = "plate"
name = "Spoil plate"
ref = "sheet-spoil-plate"
description = "Spoil plate 6 x 5 x 1/2 in 6061, made beforehand: a 5 in length sawn off the owned 1/2 x 6 in bar, sawn ends deburred, top as supplied"

[[tools]]
id = "tape"
name = "3M VHB 5906 tape"
ref = "tape-3m-vhb-5906"
description = "3M VHB 5906 double-sided tape, .006 in, 1-1/2 in wide"

[[tools]]
id = "em-thirty-second"
name = "1/32 in carbide downcut end mill"
ref = "endmill-carbide-3fl-1-32-downcut"
# Harvey Tool 896231: 3 left-hand spiral, right-hand cut flutes, "prevents
# lifting of workpiece" (harveytool.com family page, read 2026-11-22): its
# helix pushes the clip's narrow finger onto the tape.
axial_direction = "down"

[[tools]]
id = "stone"
name = "India stone"
ref = "india-stone-ib8"

[[tools]]
id = "deburr"
name = "Deburring set"
ref = "deburring-set"

[[tools]]
id = "former"
name = "Bow former (the four die laminations)"
ref = "pd-platen-clip-bow-former"
description = "The four male and four female die halves cut in Setup 2, stacked in the vise on two 1/2 in parallels"

[[setups]]
machine_kind = "other"
title = "Bench: check the strip, snip two blanks"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "The 2 x 12 in strip: blank A snipped off its bought end, blank B off the new end, each 3.60 in long and the strip's full 2 in wide; the rest of the strip kept for MHA-PD-14." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the strip as it arrives, 1 in in from each end."
inspection = "Both readings {{process.strip_thickness_min_in:.3dot}}–{{process.strip_thickness_max_in:.3dot}}, else stop: it is not the .032 strip."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.strip_thickness_min_mm}}", "{{process.strip_thickness_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "snips"
drilling = "none"
sizing = "other"
instruction = "Mark {{process.blank_length_in:.2dot}} in from the strip's bought end with a scriber and square, and snip on the line, the snips' flat blade on the blank's side so the curl goes into the strip: blank A. Mark and snip blank B the same from the new end. Keep the rest (4.80 in) for MHA-PD-14."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Lay each blank on the spoil plate: press any curl at the snipped ends flat with a thumb, then file the burr off every snipped end, the file flat on the plate's top. Mark the blanks A and B with a marker." },
  { kind = "check", text = "Each blank lies flat on the plate: no end rocks or stands up when pressed." },
  { kind = "stop", text = "An end still stands up: snip a new blank off the spare strip the same way and try again." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "CNC mill: bond the blanks to the spoil plate; cut the clips and the former"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Spoil plate on 1 in parallels across the vise jaws, its back edge on the fixed jaw, centred along the jaws: the jaw tops stand {{process.jaw_top_over_plate_mm:in.3dot}} above the plate top, room for the edge finder's touch and blank A's edge, and at the least stickout the collet's nose passes {{process.collet_over_jaw_mm:in.2dot}} over them at the cut. Blanks A and B bonded to its top on 3M VHB 5906 tape ({{process.tape_thickness_mm:in.3dot}}) under their whole faces, both left ends flush with the plate's left end, A's back edge against the fixed jaw and B's against A's front edge."
datum = "Program PC01_sheet. G54: X0 the plate's left end, Y0 the fixed jaw's face (the plate's back edge and blank A's), Z0 the plate top; +Y toward the fixed jaw. Each clip's rail near end stands at X {{process.part_left_x_mm:in.3dot}}, the first clip's spring edge at Y {{process.clip_spring_edge_y_mm:in.3dot}}. Set X, Y and Z again after a reset, a stall, an E-stop or any move of the plate."
diagram = { file = "diagrams/sheet.svg", alt = "Plan of the spoil plate in the vise: blank A against the fixed jaw and blank B in front of it, both flush with the plate's left end; on A the two clips, rails toward the moving jaw, and the first lamination; on B the other three; each lamination split along its bow profile into a male half (toward the moving jaw) and a female half. The 1/32 end mill enters every outline from beyond the plate's left end." }
# Top: the thickest strip on its tape; deepest: the cutter's tip, .004 into
# the spoil plate. Across the jaws, the two blanks; along them, blank A and
# the cutter's way in beyond the plate's left end.
envelope = { x_span_mm = ["{{process.blank_length_mm}}", "{{process.entry_overhang_mm}}"], y_span_mm = ["{{process.blank_width_mm}}", "{{process.blank_width_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.tape_thickness_mm}}", "{{process.strip_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.sheet_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.tape_shear_mpa}}", tensile_mpa = "{{process.tape_tensile_mpa}}", derating = "{{process.bond_derating}}", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{process.blank_area_mm2}}", width_mm = "{{process.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Home the mill first ($H). Spoil plate on the 1 in parallels across the jaws, its back edge on the fixed jaw, centred along the jaws; close the vise and tap the plate down onto the parallels."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the plate's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face from the plate's side (−Y), G10 L20 P1 Y-2.540. X: its tip .10 below the plate top, on the plate's left end from the left, G10 L20 P1 X-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "Degrease the plate top and both blanks' undersides with isopropyl alcohol and water. Lay the tape where the blanks go, from the plate's left end and the fixed jaw: three strips side by side along the jaws, butted, each a little longer than a blank (4.5 in of tape under the blanks' 4.0 in). Leave the plate top in front of them bare."
feed = "hand"

[[setups.operations]]
instruction = "Lower blank A onto the tape, its back edge against the fixed jaw and its left end flush with the plate's left end (a steel rule held across both); then blank B, its back edge against A's front edge, its left end flush the same. Press both down over their whole faces with a thumb (the tape wants about 15 psi); trim the tape flush. Wait 20 minutes: the tape is taken at half strength, which it reaches by then."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/32 in end mill, {{process.em_projection_min_mm:in.2dot}}–{{process.em_projection_max_mm:in.2dot}} out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the plate top in front of blank B: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Prove PC01_sheet in air: on the same leaf, G10 L20 P1 Z-25.349 (Z0 1.000 in high). Run it single block through the first hole and the first clip's feed in, then let it run to the end." },
  { kind = "check", text = "Each hole comes down near its centre; each outline comes down beyond the plate's left end and feeds in through the blank's margin. Apart from those lead-ins no path leaves the blanks, and none comes near a jaw." },
  { kind = "stop", text = "A path off a blank or toward a jaw: feed hold, then the next op." },
]
feed = "hand"

[[setups.operations]]
instruction = "Only after a feed hold in the prove-out: stop the program, spindle off, jog Z up clear. Re-check the plate's seat and the blanks' places (op 70); home ($H) and set G54 again (ops 50 and 80, then this Z0 1.000 in high); prove again from the start."
feed = "hand"

[[setups.operations]]
instruction = "Z0 back to the plate top: the tip dragging the same leaf, G10 L20 P1 Z0.051."
feed = "hand"

# Three equal levels, each piece's last with the tip into the spoil plate:
# the holes plunged near their centres, every outline entered from the air
# beyond the plate's left end. Every piece and both wastes stay on their own
# tape once cut.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-thirty-second"
drilling = "none"
sizing = "other"
instruction = "Run PC01_sheet (M6 T1, spindle off: set 2800; about 85 min). Each hole is plunged near its centre at a quarter of the feed and opened by two circles; then each clip is cut round; then each lamination round and split along its bow profile. Three levels each, the last {{process.sheet_tip_into_plate_mm:in.3dot}} into the spoil plate. Air blast the chips off as it goes; no coolant."
settings = "endmill-carbide-3fl-1-32-downcut-c260"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.tape_shear_mpa}}", tensile_mpa = "{{process.tape_tensile_mpa}}", derating = "{{process.bond_derating}}", pieces = [{ name = "clip", kind = "part", area_mm2 = "{{process.clip_bond_area_mm2}}", width_mm = "{{process.clip_finger_width_mm}}" }, { name = "male die half", kind = "part", area_mm2 = "{{process.male_bond_area_mm2}}", width_mm = "{{process.lamination_flat_mm}}" }, { name = "female die half", kind = "part", area_mm2 = "{{process.female_bond_area_mm2}}", width_mm = "{{process.female_least_width_mm}}" }, { name = "waste A", kind = "waste", area_mm2 = "{{process.waste_a_bond_area_mm2}}" }, { name = "waste B", kind = "waste", area_mm2 = "{{process.waste_b_bond_area_mm2}}" }] } }
milling_cuts = [
  { name = "sheet", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.sheet_cutter_dia_mm}}", axial_doc_mm = "{{process.level_depth_mm}}", radial_woc_mm = "{{process.sheet_cutter_dia_mm}}", traverse_mm = ["{{process.sheet_from_x_mm}}", "{{process.sheet_to_x_mm}}"] },
]

[[setups]]
machine_kind = "other"
title = "Bench: free the parts, deburr, check the first clip"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The first clip, flat, to scale: its length over the rail ends (the calipers' jaws on the rail), the rail's width, the overall width from the rail edge to the spring edge, and its two holes, with the pins each takes: the .116 pin goes in, the .120 pin does not." }
envelope = "other"
vise_hold = "other"
beam = "other"
# First clip only: the CNC holds these, the second clip runs the same path.
# The slits, the bridge stations, the corners and the hole stations are held
# by the program (cam:pd_platen_clip checks the posted path against the
# drawing's bands) and are not gauged.
inspection = [
  "First clip only. Length over the rail ends {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}, the jaws on the rail below the slits (the flat finger's tips stand a little past them); rail width {{cad.rail_edge_width_min_in:.2dot}}–{{cad.rail_edge_width_max_in:.2dot}}, the rail edge to the slits; overall width {{cad.spring_edge_width_min_in:.2dot}}–{{cad.spring_edge_width_max_in:.2dot}}, the rail edge to the spring edge.",
  "First clip only. Each hole: the {{cad.screw_holes_dia_min_in:.3dot}} pin goes in, the {{cad.screw_holes_dia_max_in:.3dot}} pin does not.",
  "First clip only, by eye against the drawing: the finger's ends full R and convex, the rail's R.10 and R.03 corners convex, each slit's inner end a full R.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.rail_edge_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.spring_edge_width_band_mm}}" },
  { gauge = "pin-gauges", band_mm = "{{cad.screw_holes_dia_band_mm}}" },
]

[[setups.operations]]
instruction = "Plate out of the vise. Peel both wastes off the tape. Free each part with a thin blade slid flat on the plate under it: a clip from its rail, never lifting the finger by its tip; a die half from its back edge. Clean the tape off the parts and the plate with isopropyl alcohol. Mark the clips 1 and 2 on their rails."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "stone"
drilling = "none"
sizing = "other"
instruction = "Rub each face of every part flat on the India stone to take the cut's burr off. Break the clips' outside edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file; leave the die halves' profile edges sharp."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break each hole's edge on both faces with the set's countersink, turned by hand a turn or two: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, no more."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Each clip lies flat on the plate: no finger rocks or stands up when pressed." },
  { kind = "stop", text = "A finger stands up: press it flat between thumb and plate and check again before forming." },
]
feed = "hand"

[[setups.operations]]
instruction = "Measure the first clip with calipers and the pins, and look over its outline: the setup's inspection lines."
feed = "hand"

[[setups.operations]]
instruction = "Any size out of its band: scrap both clips (no rework on a cut sheet part, and the second clip ran the same path) and stop. Find the cause (cutter, G54, the blank's seat), then repeat Setups 1 to 3 with two blanks off the spare strip."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Vise, spindle off: press the bows; check each clip"
machine = "PM-30MV vise, spindle off"
indexing = "none"
diagram = { file = "diagrams/form.svg", alt = "End view in the vise: a 1/2 in parallel stood against each jaw on the bed; the four male die halves stacked flat on the moving jaw's parallel, the four female halves on the fixed jaw's, profiles facing; the clip on edge between them, its finger level with the stacks and its rail hanging down between the parallels. Below, the calipers across one bow: one jaw on the crest, the other across the flats either side." }
envelope = "other"
vise_hold = "other"
beam = "other"
# Every clip: the bows are formed one clip at a time.
inspection = [
  "Every clip, each of its two bows: the calipers' reading less the finger's thickness miked on the flat beside that bow, {{cad.bows_rise_min_in:.3dot}}–{{cad.bows_rise_max_in:.3dot}} (the bow's rise).",
  "Every clip: length over the spring tips {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}, tips flush with the rail ends.",
]
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.bows_rise_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" },
]

[[setups.operations]]
instruction = "Vise empty and open about 1 in. Stand a 1/2 in parallel on the bed against each jaw. Stack the four male die halves flat on the moving jaw's parallel, back edges against the jaw, profiles facing the fixed jaw, ends flush; stack the four female halves the same on the fixed jaw's parallel."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "former"
drilling = "none"
sizing = "other"
instruction = "Stand a clip on edge between the stacks, rail down, hanging between the parallels: the finger's spring edge flush with the stacks' tops, its rail ends flush with the stacks' ends. Close the vise by hand, firmly, until both stacks bear on the finger along its whole length; open it and lift the clip out."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Each bow: mike the finger's flat beside it, then calipers with one jaw across the two flats either side of the bow on its hollow side, the other on the crest. Then the length over the spring tips." },
  { kind = "check", text = "The readings are in the setup's inspection lines." },
  { kind = "stop", text = "A bow out of band: the next two ops; press no other clip until it is in band. Bows in band but the tip length out: stop, keep the clip for the owner and press no other." },
]
feed = "hand"

[[setups.operations]]
instruction = "A bow high only: lay the clip bow up on the spoil plate, press the crest down a little with a thumb, and measure it again."
feed = "hand"

[[setups.operations]]
instruction = "A bow low only: squeeze the clip again in the former, harder, and measure it again. Still low: stop and keep the clip for the owner, who deepens the former's bow, re-posts PC01_sheet and has four new laminations cut from the spare strip."
feed = "hand"

[[setups.operations]]
instruction = "Press and check the second clip the same. Bag each clip with its number (FINISH: {{cad.finish}}). Keep the stacked die halves taped together with the clips' traveler: they are the bow former."
feed = "hand"
