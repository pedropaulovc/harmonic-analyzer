  <!-- Hand picture. The plan to scale at 4 px/mm (main's drawing: the spoil plate 152.4 x 127 mm, plate_length_mm and plate_width_mm, the blanks 91.44 x 50.8 mm and the part outlines from the feature bundle). PC01_sheet's first cut drawn: the 1/32 in downcut end mill Ø0.7874 mm (sheet_cutter_dia_mm) at its first plunge, X11.606 Y-10.795 (posted NC), in clip 1's left hole (centre X11.252), which it then opens by two clockwise circles; the detail at 20 px/mm. The section across the jaws at 2 px/mm, seen from the plate's right end, the fixed jaw on the right: the 1 in parallels (parallel_height_mm 25.4, 1/8 in thick, parallel_thickness 3.175), the 1/2 in plate (plate_thickness_mm 12.7), the jaw tops 6.845 mm above it (jaw_top_over_plate_mm); the tape stack .23-.33 mm and the .81 mm blanks are under 1 px apart at this scale, drawn as one line and named. The vise jaws' thickness is not on record: schematic. In the section the same end mill at the same plunge, Y-10.795, its end at the first level, Z0.870 (posted NC; Z0 the plate's top): its Ø0.7874 cutting end and its 1/8 in (3.175 mm) shank; the flute length is not on record, drawn 3 mm (schematic), and the shank broken off. -->
