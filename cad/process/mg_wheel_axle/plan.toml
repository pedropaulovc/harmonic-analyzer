# Wheel axle MHA-MG-07, one off, on the manual PM-1127VF-LB (owner ruling
# 2026-11-21: turned parts get lathe travelers, no NC). Route chosen for
# speed, the registry's order (thread blank and domed tip turned; die-cut
# #4-40; thread relief turned after the thread): the shank is the 3/16 drill
# rod as supplied (its Ø3/16 REF; the press and running fits come off the
# rod's own limits). Saw a blank a little long, with a .10 in centre stub
# beyond the tip; in the 3-jaw over a shim wrap, the tip end out: face it,
# centre-drill the stub and turn the #4-40 blank on the tailstock dead centre
# (the .35 in of Ø.11 is over 3 × Ø out of the jaws, so it is not turned
# from the chuck alone); withdraw the centre, face the stub off to the tip,
# step the R.07 dome from a Z/Ø table and file it, run the die on to the
# shoulder by hand, groove the relief at the shoulder (these run without the
# centre, as the form tool's plunge did before: the stub facing and the die
# load the end along its axis, the dome's steps are three light cuts .007
# long at the tip, the file is hand pressure only, and the relief sits at
# the shoulder, the jaws' end of the Ø.11); turn it round, the shank in the jaws: face the back
# end to the 1.85 shank length. Pressed into MHA-MG-08 at assembly
# (MHA-MG-00).
#
# The dome (owner ruling 2026-11-23, tool audit Q5, option D: "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569, $124.95;
# convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file is the
# fallback for any dome it cannot reach. Confirm each dome is convex and
# reachable before buying."). Reach test, from the spec (dome-pattern,
# 2026-11-23): convex, R.07 (.XX, R.06-.08) through the #4-40 blank's
# Ø.1061-.1112 major edge, ball Ø.14 under the tool's .75; but the die starts
# on the dome, so the dome is cut before the thread and the relief, with no
# centre (the dome end is never on a centre), on the slender end: the
# Ø.11 blank stands .352 out of the Ø.1875 shoulder (.324 thread + .028
# dome) even with the shoulder at the jaw fronts, over the shop's 3 × Ø
# unsupported rule (lathe_holding) on its least Ø, 3 × .1061 = .318, which
# the dome pattern (tool-travelers, 2026-11-23) makes part of the ball
# turner's reach test. Not reachable by that test: step-and-file, as the pattern's
# fallback (precedent dt_pinion_arbor's crowns), from the turned_shaft
# stepped-turning table (process.dome_steps), filed with the smooth file and
# screened with the radius gauges' 1/16 and 5/64 leaves, which bracket the
# drawn R.06-.08 (pd_guide_lock's corner screen). It replaces the R.070 form
# tool (form-tool-r070).
#
# Stock: the 3/16 O1 drill rod is on hand (stock.o1-drill-rod-3-16, McMaster
# 8893K178, PO 1103PCAMPOS). Flagged: the .020 grooving tool (grooving-tool-020) and the radius gauge
# set (radius-gauges, Starrett S167AZ) are to order (cad/config/
# shop-equipment/); the lathe's tailstock dead centre is not in
# the shop records (Precision Matthews ships dead centres with the lathe;
# confirm it). The #4-40 die, the 13/16 die stock and the size 1 centre
# drill are on hand. No thread gauge is on record: the thread is accepted on
# the MHA-MG-00 #4-40 nut.
title = "Wheel Axle"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI O1 or W1 drill rod, 3/16 in, ground, annealed as supplied"
stock = "Ø{{process.stock_dia_in:.4dot}} drill rod (McMaster 8893K178, on hand); one blank {{process.blank_length_in:.2dot}} in long."
stock_refs = ["o1-drill-rod-3-16"]
note = "Inches. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. The shank is the drill rod as supplied: grip it over a brass shim wrap and never cut it."
shop = "../shop"
material_key = "lathe-o1-drill-rod"
turning_material = "steel_o1"

[cad]
file = "../../out/features/mg_wheel_axle/features.toml"
adapter = "turned_shaft"
part = "mg-wheel-axle"

[parameters]
quantity = 1
stock_dia_in = 0.1875
# The rod's upper limit behind the printed fits (mg_wheel_axle_callouts
# PIN_LIMITS[1]; the feature export carries only the lower,
# cad.outer_stock_dia_min); test_turned_shaft_process.py checks it.
stock_dia_max_in = 0.1877
stock_dia_max_mm = 4.76758
# Sawn over the 2.20 REF: about .03 in to face off each end plus the
# .10 in centre stub beyond the tip.
blank_length_in = 2.36
# The tip's finished plane out of the jaw fronts while the tip end is worked:
# the .35 in threaded end plus about .15 in clear of the jaws for the
# grooving tool.
end_stickout_in = 0.5
# Beyond the tip while the blank is turned: a stub for the tailstock centre,
# faced off before the dome is formed (authored).
tip_stub_in = 0.1
tip_stub_mm = 2.54
# Pulled out of the jaw fronts: end_stickout_in + tip_stub_in.
tip_pull_in = 0.6
tip_pull_mm = 15.24
# Left on the thread blank's diameter by the rough pass, per side.
finish_allowance_in = 0.001
# The turning passes start just short of the centre's point, in the stub.
turn_start_z_mm = 2.3
# Light passes on the Ø.11 blank (turning_deflection), at the settings'
# .004 in/rev feed.
rough_radial_doc_mm = 0.15
finish_radial_doc_mm = 0.03
turn_feed_mm_rev = 0.1016
# The dome is stepped from the turned_shaft table: its height cut into
# dome_steps + 1 equal Z steps, each step's corner on the R.07 sphere through
# the apex (cad.dome_far_step_k_z / _dia), then filed. Three steps on a .026
# high dome leave a Ø.06 face at the apex and corners under .004 deep, a
# file's work (dt_pinion_arbor's precedent steps at .05 Ø).
dome_steps = 3
# The radius gauges' leaves that screen the filed dome: the 1/16 (R.0625)
# rests on its ends and the 5/64 (R.0781) on its middle, so the dome lies
# between them, inside the drawn R.06-.08.
leaf_radius_min_in = 0.0625
leaf_radius_max_in = 0.078125
# The thread read from the shoulder face to the dome's apex (the dome's root
# is an edge on the thread; the calipers' beam end seats on the apex): the
# thread is .314-.334 from the dome's tangent, which lies one dome height
# below the apex. That height is R - √(R² - (Ø/2)²) for whatever radius the
# leaves pass on whatever blank Op 80 read: at most .0340 (R.0625 on Ø.1112),
# at least .0208 (R.0781 on Ø.1061). The window that holds the thread for
# all of them is .314 + .0340 to .334 + .0208, rounded inward.
thread_apex_min_in = 0.348
thread_apex_max_in = 0.3547
thread_apex_min_mm = 8.8392
thread_apex_max_mm = 9.00938

