# Wheel axle MHA-MG-07, one off, on the manual PM-1127VF-LB (owner ruling
# 2026-11-21: turned parts get lathe travelers, no NC). Route chosen for
# speed, the registry's order (thread blank and domed tip turned; die-cut
# #4-40; thread relief turned after the thread): the shank is the 3/16 drill
# rod as supplied (its Ø3/16 REF; the press and running fits come off the
# rod's own limits). Saw a blank a little long, with a .10 in centre stub
# beyond the tip; in the 3-jaw over a shim wrap, the tip end out: face it,
# centre-drill the stub and turn the #4-40 blank on the tailstock dead centre
# (the .35 in of Ø.11 is over 3 × Ø out of the jaws, so it is not turned
# from the chuck alone); withdraw the centre, face the stub off to the tip,
# form the R.07 dome, run the die on to the shoulder by hand, groove the
# relief at the shoulder; turn it round, the shank in the jaws: face the back
# end to the 1.85 shank length. Pressed into MHA-MG-08 at assembly
# (MHA-MG-00).
#
# Flagged: 3/16 O1/W1 drill rod has no stock record and is not on hand (to
# order); the R.070 form tool (form-tool-r070) and the .020 grooving tool
# (grooving-tool-020) are to order (cad/config/shop-equipment/
# tools-special-cutters.toml); the lathe's tailstock dead centre is not in
# the shop records (Precision Matthews ships dead centres with the lathe;
# confirm it). The #4-40 die, the 13/16 die stock and the size 1 centre
# drill are on hand. No thread gauge is on record: the thread is accepted on
# the MHA-MG-00 #4-40 nut.
title = "Wheel Axle"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI O1 or W1 drill rod, 3/16 in, ground, annealed as supplied"
stock = "Ø{{process.stock_dia_in:.4dot}} drill rod (no stock record; to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long."
note = "Inches. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. The shank is the drill rod as supplied: grip it over a brass shim wrap and never cut it."
shop = "../shop"
material_key = "lathe-o1-annealed"
turning_material = "steel_o1"

[cad]
file = "../../out/features/mg_wheel_axle/features.toml"
adapter = "turned_shaft"
part = "mg-wheel-axle"

[parameters]
quantity = 1
stock_dia_in = 0.1875
# Sawn over the 2.20 REF: about .03 in to face off each end plus the
# .10 in centre stub beyond the tip.
blank_length_in = 2.36
# The tip's finished plane out of the jaw fronts while the tip end is worked:
# the .35 in threaded end plus about .15 in clear of the jaws for the
# grooving tool.
end_stickout_in = 0.5
# Beyond the tip while the blank is turned: a stub for the tailstock centre,
# faced off before the dome is formed (authored).
centre_stub_in = 0.1
centre_stub_mm = 2.54
# Pulled out of the jaw fronts: end_stickout_in + centre_stub_in.
tip_pull_in = 0.6
tip_pull_mm = 15.24
# Left on the thread blank's diameter by the rough pass, per side.
finish_allowance_in = 0.001
# The turning passes start just short of the centre's point, in the stub.
turn_start_z_mm = 2.3
# Light passes on the Ø.11 blank (turning_deflection), at the settings'
# .004 in/rev feed.
rough_radial_doc_mm = 0.15
finish_radial_doc_mm = 0.03
turn_feed_mm_rev = 0.1016
# The R.070 form tool's radius: the dome is cut full (to the centre) on the
# Ø.1112 #4-40 basic major, .070 − √(.070² − .0556²) = .0275 high
# (cad.dome_far_form_height).
dome_form_radius_in = 0.07
# The thread length read from the shoulder face to the dome's apex (the dome
# root is an edge on the thread; the calipers' beam end seats on the apex):
# the .314–.334 thread plus the dome's height for the blank's miked Ø, .0243
# (Ø.1061) to .0275 (Ø.1112). The gauge band is the widest, .314 + .0243 to
# .334 + .0275; the op prints the per-blank rule.
thread_apex_min_in = 0.3383
thread_apex_max_in = 0.3615
thread_apex_min_mm = 8.5936
thread_apex_max_mm = 9.1821

[[tools]]
id = "saw"
name = "Metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre-drill"
name = "Centre drill, carbide 60°, size 1"
ref = "centre-drills-carbide-60"

[[tools]]
id = "form"
name = "R.070 form tool"
ref = "form-tool-r070"
status = "to_order"

[[tools]]
id = "die"
name = "#4-40 UNC round die in the 13/16 die stock"
ref = "dies-zoro-wb7365521946"

[[tools]]
id = "die-stock"
name = "Die stock, 13/16 in"
ref = "die-stock-13-16"

[[tools]]
id = "groove"
name = "Grooving tool, .020 wide"
ref = "grooving-tool-020"
status = "to_order"

[[tools]]
id = "file"
name = "Files (10 in mill second-cut, 8 in smooth)"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 3/16 in drill rod on the saw: one blank sawn a little over the axle's length." }

[[setups.operations]]
instruction = "Mike the rod over the length you will cut: every reading {{cad.outer_stock_dia_min_in:.4dot}} or over (the shank is left as supplied; its fits come off the rod's own limits)."
inspection = "Rod Ø{{cad.outer_stock_dia_min_in:.4dot}} min."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{cad.outer_stock_dia_min_mm}}", "{{cad.stock_dia_mm}}"] }]

[[setups.operations]]
instruction = "A reading under {{cad.outer_stock_dia_min_in:.4dot}}: mark that length scrap and mike the next length of the rod."

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the rod end and saw on the waste side of the scribe. Deburr both sawn ends with the file."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Tip end: thread blank on the centre, dome, thread, relief"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the rod, the tip end out {{process.tip_pull_in:.2dot}} in from the jaw fronts (the tip {{process.end_stickout_in:.2dot}} in out plus the {{process.centre_stub_in:.2dot}} in centre stub); the rest of the blank back in the jaws. The tailstock dead centre, greased, in the stub's centre hole for Ops 60–80; the tailstock backed off for Ops 100–110 and brought up again, its centre out, to square the die in Op 120."
datum = "Z0 (carriage DRO) the tip's finished plane: set {{process.centre_stub_in:.3dot}} in back from the stub's faced end in Op 40, faced to in Op 100."
diagram = { file = "diagrams/tip.svg", alt = "The blank in the 3-jaw, the tip end out: the #4-40 blank turned on the tailstock centre in a stub beyond the tip; the stub faced off, the R.07 dome formed, the thread die-cut and the relief grooved at the shoulder." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{process.tip_pull_mm}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}", support = "tailstock" }
turning_support = { kind = "tailstock", chuck_z_mm = "{{cad.end_jaw_z_mm}}", centre_z_mm = "{{process.centre_stub_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the tip end square, about .03 in off, to the centre with no pip. Set the DRO Z to +{{process.centre_stub_in:.3dot}} on it: Z0 is the tip's finished plane, the {{process.centre_stub_in:.2dot}} in beyond it a stub for the centre."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the stub's end with the size 1 centre drill from the tailstock chuck, to about Ø.08 at the countersink: the hole stays inside the stub."
settings = "lathe-centre-o1"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
instruction = "Swap the drill chuck for the dead centre, a dab of grease on its point; bring it into the centre hole just snug and lock the tailstock and quill. Recheck it snug before each pass: the rod lengthens as it warms."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Thread blank rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.step_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the thread blank from the stub's end to the shoulder at Z{{cad.step_far_out_far_z_mm:in.3dot}} to Ø{{cad.step_rough_dia_mm:in.4dot}}, square shoulder, the tool clear of the centre at the start of each pass."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Thread blank finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.step_rough_dia_mm}}", end_diameter_mm = "{{cad.step_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the blank over the same length to Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} (the #4-40 UNC-2A major), miking between light passes between Z0 and the shoulder; the shoulder at Z{{cad.step_far_out_far_z_mm:in.3dot}} square."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Blank Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Blank under {{cad.step_dia_min_in:.4dot}}: scrap the blank and make another from Setup 1. Over {{cad.step_dia_max_in:.4dot}}: another light pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Withdraw the tailstock. Face the stub off in light skims, from the O.D. to the centre, down to Z0: the centre hole goes with it."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Form the R.07 dome: the form tool on centre height, square to the axis, its arc spanning the whole end; bring its tips up to the faced tip and set the cross-slide so both touch the blank's O.D. corner together (an even light gap either side): the arc is then centred. Zero the DRO Z there; feed along Z to Z−{{cad.dome_far_form_height_in:.4dot}} (the dome's height): the form then reaches the centre, no flat left at the tip."
settings = "lathe-form-r070-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, in low range: take the dead centre out of the quill and bring the tailstock up. The #4-40 die in the die stock, lettered face toward the tip, its back squared against the quill's face. Start it on the dome, turning the die stock by hand with cutting oil, a half turn forward and a quarter back, the quill following; run it on until it stops at the shoulder. Back it off and back the tailstock away."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Relief, with the .020 grooving tool (mike its width): find the shoulder by touch, the tool's chuck-side edge just touching the shoulder face (the DRO Z was zeroed on the form tool, so its readings do not apply), and zero the DRO Z there. Zero the cross-slide dial with its tip touching the thread blank's O.D. Plunge (the miked blank − {{cad.groove_dia_in:.3dot}})/2 in on the radius, to Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}."
settings = "lathe-groove-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Move out toward the tip by .035 less the tool's width (.015 for .020) on the carriage DRO and plunge again to the same dial: the relief .035 wide, inside {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}}, the tool's R.008 max corners in the roots."
settings = "lathe-groove-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Read the relief's root with the caliper jaw tips and its width from the carriage DRO moves; run a MHA-MG-VN-52 #4-40 nut (McMaster 92671A005) on by hand to the relief."
inspection = "Relief Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide; the nut runs on by hand to the relief."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Relief root over {{cad.groove_dia_max_in:.3dot}}: plunge again. Root under {{cad.groove_dia_min_in:.3dot}}: scrap the blank and make another from Setup 1. A nut that binds: close the split die a little with its adjusting screw and run it over once more as Op 120; still binding: scrap the blank."

[[setups]]
machine_kind = "lathe"
title = "Back end: face to the shank length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap on the shank, the threaded end back in the jaws clear of them, the back end {{process.end_stickout_in:.2dot}} in out."
datum = "The shoulder face, from Setup 2: the shank length is read from it, the axle out of the chuck; DRO Z0 the back end, touched again with the facing tool each time the axle is chucked."
diagram = { file = "diagrams/back.svg", alt = "The axle turned round, the shank in the jaws over a shim wrap: the back end faced to the 1.85 shank length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the back end square in light skims, to the centre with no pip, reading the shank length (Op 180) between them, to {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}}."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the axle out and read the shank from the back end to the shoulder face with the calipers: one jaw on the back end, the other over the thread against the shoulder face. Chuck it again as before and touch the facing tool on the back end before the next skim."
inspection = "Shank length {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.shoulder_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Shank under {{cad.shoulder_min_in:.3dot}}: scrap the axle and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished axle: the 1.85 shank, the .324 #4-40 thread, the relief and the R.07 dome." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the back end's edge and the shoulder's outer edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the shank's O.D. and the dome untouched."
feed = "hand"

[[setups.operations]]
instruction = "Read the thread from the shoulder face to the dome's apex with the calipers' depth rod: the beam's end on the apex, the rod down beside the thread onto the shoulder face. Add the dome's height for the blank's Op 80 reading to the {{cad.thread_length_min_in:.3dot}}–{{cad.thread_length_max_in:.3dot}} thread: .0243 at Ø.1061, .0258 at Ø.1086, .0275 at Ø.1112. Mike the shank at both ends."
inspection = "Shoulder to apex {{cad.thread_length_min_in:.3dot}} + the dome's height to {{cad.thread_length_max_in:.3dot}} + the dome's height, for this blank's Ø (gauge range {{process.thread_apex_min_in:.4dot}}–{{process.thread_apex_max_in:.4dot}}); shank Ø{{cad.outer_stock_dia_min_in:.4dot}} min, no mark you can feel."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.thread_apex_min_mm}}", "{{process.thread_apex_max_mm}}"] }, { gauge = "micrometers", band_mm = ["{{cad.outer_stock_dia_min_mm}}", "{{cad.stock_dia_mm}}"] }]

[[setups.operations]]
instruction = "Shoulder to apex out of its band, or the shank marked under {{cad.outer_stock_dia_min_in:.4dot}}: scrap the axle and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the axle with machine oil (FINISH: bright, oiled). MHA-MG-00 presses it into MHA-MG-08 to its gauge."
