[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 3/16 in drill rod on the saw: one blank sawn a little over the axle's length." }

[[setups.operations]]
instruction = "Mike the rod over the length you will cut: every reading {{cad.outer_stock_dia_min_in:.4dot}}–{{process.stock_dia_max_in:.4dot}} (the shank is left as supplied; its fits come off the rod's own limits)."
inspection = "Rod Ø{{cad.outer_stock_dia_min_in:.4dot}}–{{process.stock_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{cad.outer_stock_dia_min_mm}}", "{{process.stock_dia_max_mm}}"] }]

[[setups.operations]]
instruction = "A reading outside {{cad.outer_stock_dia_min_in:.4dot}}–{{process.stock_dia_max_in:.4dot}}: mark that length scrap and mike the next length of the rod."

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the rod end and saw on the waste side of the scribe. Deburr both sawn ends with the file."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Tip end: thread blank on the centre, dome, thread, relief"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the rod, the tip end out {{process.tip_pull_in:.2dot}} in from the jaw fronts (the tip {{process.end_stickout_in:.2dot}} in out plus the {{process.tip_stub_in:.2dot}} in centre stub); the rest of the blank back in the jaws. The tailstock dead centre, greased, in the stub's centre hole for Ops 60–80; the tailstock backed off for Ops 100–140 and brought up again, its centre out, to square the die in Op 150."
datum = "Z0 (carriage DRO) the tip's finished plane: set {{process.tip_stub_in:.3dot}} in back from the stub's faced end in Op 40, faced to in Op 100; the dome's steps (Op 110) are read from it."
diagram = { file = "diagrams/tip.svg", alt = "The blank in the 3-jaw, the tip end out: the #4-40 blank turned on the tailstock centre in a stub beyond the tip; the stub faced off, the R.07 dome stepped and filed, the thread die-cut and the relief grooved at the shoulder." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{process.tip_pull_mm}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}", support = "tailstock" }
turning_support = { kind = "tailstock", chuck_z_mm = "{{cad.end_jaw_z_mm}}", centre_z_mm = "{{process.tip_stub_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the tip end square, about .03 in off, to the centre with no pip. Set the DRO Z to +{{process.tip_stub_in:.3dot}} on it: Z0 is the tip's finished plane, the {{process.tip_stub_in:.2dot}} in beyond it a stub for the centre."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre-drill"
drilling = "none"
sizing = "other"
instruction = "Centre-drill the stub's end with the size 1 centre drill from the tailstock chuck, to about Ø.08 at the countersink: the hole stays inside the stub."
settings = "lathe-centre-o1"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
instruction = "Swap the drill chuck for the dead centre, a dab of grease on its point; bring it into the centre hole just snug and lock the tailstock and quill. Recheck it snug before each pass: the rod lengthens as it warms."

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Thread blank rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.step_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_rough_dia_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Rough the thread blank from the stub's end to the shoulder at Z{{cad.step_far_out_far_z_mm:in.3dot}} to Ø{{cad.step_rough_dia_mm:in.4dot}}, square shoulder, the tool clear of the centre at the start of each pass."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Thread blank finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.step_far_out_far_z_mm}}", kept_start_z_mm = "{{cad.step_far_out_near_z_mm}}", kept_end_z_mm = "{{cad.step_far_out_far_z_mm}}", start_diameter_mm = "{{cad.step_rough_dia_mm}}", end_diameter_mm = "{{cad.step_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.step_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Finish the blank over the same length to Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}} (the #4-40 UNC-2A major), miking between light passes between Z0 and the shoulder; the shoulder at Z{{cad.step_far_out_far_z_mm:in.3dot}} square."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"
inspection = "Blank Ø{{cad.step_dia_min_in:.4dot}}–{{cad.step_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.step_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Blank under {{cad.step_dia_min_in:.4dot}}: scrap the blank and make another from Setup 1. Over {{cad.step_dia_max_in:.4dot}}: another light pass."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Withdraw the tailstock. Face the stub off in light skims, from the O.D. to the centre, down to Z0: the centre hole goes with it."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Step the R.07 dome with the AR tool, Z0 the faced tip: at each line, carriage at the Z, face from the Ø out to the blank's O.D.: Z{{cad.dome_far_step_3_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_3_dia_in:.3dot}}; Z{{cad.dome_far_step_2_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_2_dia_in:.3dot}}; Z{{cad.dome_far_step_1_end_z_mm:in.4dot}} from Ø{{cad.dome_far_step_1_dia_in:.3dot}}. The dome meets the O.D. about Z−{{cad.dome_far_height_in:.3dot}}."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Spindle at the low range: file the steps off the dome with the smooth file, stroking from the apex out to the rim, blending the Ø{{cad.dome_far_step_3_dia_in:.2dot}} face left at the apex into the dome, until the step corners are just gone. Light strokes: the end has no centre."
rpm = 200
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "radius"
drilling = "none"
sizing = "other"
feed = "hand"
instruction = "Spindle stopped. Screen the dome with the radius gauges' concave leaves held across it through the axis: the {{process.leaf_radius_min_in:fraction}} leaf rests on the rim with light at the apex, and the {{process.leaf_radius_max_in:fraction}} leaf touches at the apex with light at the rim; no flat at the apex, no step left."
inspection = "Dome R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}}: between the {{process.leaf_radius_min_in:fraction}} (R{{process.leaf_radius_min_in:.4dot}}) and {{process.leaf_radius_max_in:fraction}} (R{{process.leaf_radius_max_in:.4dot}}) leaves; no flat, no step."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "The {{process.leaf_radius_max_in:fraction}} leaf showing light at the apex, a flat or a step (the rim still full): file again from the rim inward and screen again. The {{process.leaf_radius_min_in:fraction}} leaf touching at the apex (filed too far at the rim): scrap the blank and make another from Setup 1."

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "die"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped, in low range: take the dead centre out of the quill and bring the tailstock up. The #4-40 die in the die stock, lettered face toward the tip, its back squared against the quill's face. Start it on the filed dome, turning the die stock by hand with cutting oil, a half turn forward and a quarter back, the quill following; run it on until it stops at the shoulder. Back it off and back the tailstock away."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Relief, with the .020 grooving tool (mike its width): find the shoulder by touch, the tool's chuck-side edge just touching the shoulder face (a new tool: its edge is found by touch, not by the DRO), and zero the DRO Z there. Zero the cross-slide dial with its tip touching the thread blank's O.D. Plunge (the miked blank − {{cad.groove_dia_in:.3dot}})/2 in on the radius, to Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}."
settings = "lathe-groove-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "groove"
drilling = "none"
sizing = "other"
instruction = "Move out toward the tip by .035 less the tool's width (.015 for .020) on the carriage DRO and plunge again to the same dial; a tool under .018 wide leaves a land between the two plunges: plunge once more midway. The relief .035 wide, inside {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}}, the tool's R.008 max corners in the roots."
settings = "lathe-groove-o1"
cut_diameter_mm = "{{cad.step_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Read the relief's root with the caliper jaw tips and its width from the carriage DRO moves; run a MHA-MG-VN-52 #4-40 nut (McMaster 92671A005) on by hand to the relief."
inspection = "Relief Ø{{cad.groove_dia_min_in:.3dot}}–{{cad.groove_dia_max_in:.3dot}}, {{cad.groove_width_min_in:.3dot}}–{{cad.groove_width_max_in:.3dot}} wide; the nut runs on by hand to the relief."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.groove_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Relief root over {{cad.groove_dia_max_in:.3dot}}: plunge again. Root under {{cad.groove_dia_min_in:.3dot}}: scrap the blank and make another from Setup 1. A nut that binds: close the split die a little with its adjusting screw and run it over once more as Op 150; still binding: scrap the blank."

[[setups]]
machine_kind = "lathe"
title = "Back end: face to the shank length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap on the shank, the threaded end back in the jaws clear of them, the back end {{process.end_stickout_in:.2dot}} in out."
datum = "DRO Z0 the back end (the drawing's datum end), touched again with the facing tool each time the axle is chucked; the shank length is read to the shoulder face from Setup 2, the axle out of the chuck."
diagram = { file = "diagrams/back.svg", alt = "The axle turned round, the shank in the jaws over a shim wrap: the back end faced to the 1.85 shank length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the back end square in light skims, to the centre with no pip, reading the shank length (Op 210) between them, to {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}}."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the axle out and read the shank from the back end to the shoulder face with the calipers: one jaw on the back end, the other over the thread against the shoulder face. Chuck it again as before and touch the facing tool on the back end before the next skim."
inspection = "Shank length {{cad.shoulder_min_in:.3dot}}–{{cad.shoulder_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.shoulder_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Shank under {{cad.shoulder_min_in:.3dot}}: scrap the axle and make another from Setup 1."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished axle: the 1.85 shank, the .324 #4-40 thread, the relief and the R.07 dome." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the back end's edge and the shoulder's outer edge R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the shank's O.D. and the dome untouched."
feed = "hand"

[[setups.operations]]
instruction = "Read the thread from the shoulder face to the dome's apex with the calipers' depth rod: the beam's end on the apex, the rod down beside the thread onto the shoulder face. Look over the shank where the jaws held it."
inspection = "Shoulder to apex {{process.thread_apex_min_in:.4dot}}–{{process.thread_apex_max_in:.4dot}}: the thread is then {{cad.thread_length_min_in:.3dot}}–{{cad.thread_length_max_in:.3dot}} to the dome's tangent for any blank and any dome the leaves passed; shank: no mark you can feel."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.thread_apex_min_mm}}", "{{process.thread_apex_max_mm}}"] }]

[[setups.operations]]
instruction = "Shoulder to apex out of its band, or a mark on the shank you can feel: scrap the axle and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the axle with machine oil (FINISH: bright, oiled). MHA-MG-00 presses it into MHA-MG-08 to its gauge."
