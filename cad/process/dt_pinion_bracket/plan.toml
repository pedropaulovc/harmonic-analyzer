[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/8 x 1-1/4 in flat bar with one blank marked off its end, long enough for two straps end to end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/8 x 1-1/4 in 1018 flat, the bar flat in the saw's vise: it makes both straps (the second strap's saw line needs the length; face B's passes cover up to the longest)."
feed = "hand"
inspection = "Blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers; shorter: saw another; longer: saw it again."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the burr off both ends and the four long edges so the blank seats flat on the parallels. Mark face A (either broad face, left as bought) with marking fluid and an A; keep it free of dings: it is the strap's face A. Mic the thickness at both ends; mark one end L on face B and write its reading beside the L (Setup 2 loads that end at the LEFT and sets Z0 from it)."
feed = "hand"
inspection = "Thickness at both ends {{process.blank_z_min_in:.3dot}}–{{process.blank_z_max_in:.3dot}}, micrometers (face B's one level at .360 then takes .010–.020 off it). Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_z_min_mm}}", "{{process.blank_z_max_mm}}"] },
]

[[setups.operations]]
instruction = "On the 0–1 in micrometer (reads .0001; trust a reading to ±.00005), mike the seat's two Class ZZ pins: {{cad.follower_seat_dia_min_in:.3dot}} plus and {{cad.follower_seat_dia_max_in:.3dot}} minus. Write each reading here and on its tag."
inspection = "GO pin reads {{cad.follower_seat_dia_min_in:.4dot}}–{{process.seat_go_pin_max_in:.4dot}}; NO-GO pin {{process.seat_nogo_pin_min_in:.4dot}}–{{cad.follower_seat_dia_max_in:.4dot}}. A pin outside: replace it before Setup 2."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.follower_seat_dia_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "This sheet accepts a seat its GO pin enters and its NO-GO pin does not: GO reading ≤ seat < NO-GO reading. With the pins at their size limits only {{process.seat_go_pin_max_in:.4dot}}–{{process.seat_nogo_pin_min_in:.4dot}} is sure to pass; a good seat within .0002 of a band limit may be refused (owner ruling 2026-11-23)."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Face B, both straps' bores and outlines"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the 4 in long, 1/8 in thick parallel set (LMS 6745) stacked against each jaw (1.5 in), both stacks centred along the jaws (their ends level with each other). The blank lying flat on them along the jaws, face A down, gripped across the bar's two 1-1/4 in edges, centred on the jaws over the stacks, the end marked L at the LEFT: check with the rule that it overhangs the stacks' ends equally, at least {{process.overhang_min_mm:in.3dot}} each end, so the micrometer's .250 anvil reaches under each end for the thickness check. Tap it down onto both stacks while closing the vise. Face B stands {{process.blank_top_mm:in.3dot}} above the stacks, the lower {{process.grip_mm:in.3dot}} of it in the jaws."
datum = "Program PB02_flat (cam:dt_pinion_bracket). G54: X0 the blank's LEFT end, Y0 the fixed jaw's face, Z0 face A on the stacks' top, set from face B and the blank's thickness; +Y toward the fixed jaw. Pivot bores at X {{process.pivot_1_x_mm:in.3f}} and {{process.pivot_2_x_mm:in.3f}} in, arbor bores at X {{process.arbor_1_x_mm:in.3f}} and {{process.arbor_2_x_mm:in.3f}} in, all on the blank's centre line. Tool lengths from the tool setter at each M6; at every M6 stop the file has stopped the spindle and lifted the tool above the part."
diagram = { file = "diagrams/flat.svg", alt = "The blank lying on stacked parallels in the vise; two straps end to end along it: both bores of each drilled and reamed, then the 1/8 in end mill cuts round each strap through into the gap between the parallels, leaving a bridge at each arbor end." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.blank_x_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_top_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.arbor_drill_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_long_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.blank_x_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.blank_top_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_blank_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = [0, "{{process.blank_length_max_mm}}"], section_mm = { y = "{{cad.blank_x_mm}}", z = "{{cad.broad_face_b_thickness_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 X0 the blank's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm), its tip {{process.finder_tip_depth_mm:in.3dot}} below the blank's top (below the jaw tops): on the fixed jaw's face beside the blank, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: face A on the stacks, set by touching face B near the blank's left end with the 1/2 in end mill, less the thickness written beside the L."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it). MDI G0 X{{process.z_touch_x_mm:.3f}} Y{{process.z_touch_y_mm:.3f}}: the cutter wholly on the blank near its left end. Spindle stopped, its tip just dragging a .002 feeler leaf on face B: G10 L20 P1 Z(the reading beside the L × 25.4 + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PB02_flat in air, Z0 raised 1.000 in; every move clears the jaws, through every M6. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PB02_flat, watching each move clear the jaws and each tool change stop with the spindle off. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PB02_flat (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): face B down to Z {{cad.broad_face_b_thickness_mm:in.4dot}} in one level ({{process.face_b_skim_mm:in.3dot}} off the 3/8 in bar), in passes across the blank no wider than {{process.face_stepover_max_mm:in.3dot}}. At the M6 T2 stop, still clamped: check the thickness."
settings = "em-half-carbide-1018-3439-face"
inspection = "Thickness {{cad.broad_face_b_thickness_min_in:.3dot}}–{{cad.broad_face_b_thickness_max_in:.3dot}} at the M6 T2 stop: the 0–1 in micrometer at each end, between the jaws, its anvil under the blank where it overhangs the parallels."
