instruction = "Wipe every face and bore with a film of ISO VG 32 machine oil (finish: {{cad.finish}}). Bag the two straps together, tagged {{cad.drawing_number}} NO CROSS HOLE: the drawing's 1/16 cross hole is match-drilled through each strap and the MHA-DT-19 shaft together at assembly, MHA-DT-00 STEP 16 (owner ruling 2026-11-21); this traveler does not drill it."
