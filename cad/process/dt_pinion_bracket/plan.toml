machine_ref = "pm-30mv"
holding = "The same stacks. One strap on edge, its far flank down on both stacks, the seat flank up, face A against the FIXED jaw, gripped across faces A and B, its pivot end at the LEFT, centred on the jaws. Tap it down onto both stacks while closing the vise. The lower {{process.grip_mm:in.3dot}} of its width is in the jaws; both round ends' apexes stand above the jaw tops."
datum = "Program PB04_edge. G54: X0 the pivot bore's axis, Y0 the fixed jaw's face (face A), +Y toward it; Z0 the seat flank. Seat at X {{cad.follower_seat_height_in:.3f}}, Y −{{cad.follower_seat_station_in:.3f}} in. Tool lengths from the tool setter at each M6; at every M6 stop the file has stopped the spindle and lifted the tool above the part."
diagram = { file = "diagrams/edge.svg", alt = "The strap on edge on stacked parallels, seat flank up, face A at the fixed jaw, pivot end at the left: the centre drill, the #26 and the 1/8 in end mill make the follower seat." }
