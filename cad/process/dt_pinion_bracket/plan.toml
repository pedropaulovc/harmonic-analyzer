# Pinion bracket strap MHA-DT-14 (qty 2), routed for the CNC mill for speed
# (agent's choice under the owner ruling of 2026-11-21: where a part can be
# made either way, the agent chooses for speed and the owner corrects). Both
# straps from one sawn blank of the 3/8 x 1-1/4 in 1018 flat, end to end
# along it, the bar's cold-finished face down as face A (the face the seat's
# station counts from): face B to the thickness, both
# bores of each strap spotted and drilled from one zero (the pivot bores then
# reamed .2510, the arbor bores drilled 5/16 to size), and each
# outline cut through with the 1/8 in end mill all round but for a bridge at
# its arbor end's apex, which holds the strap in the blank. The saw cuts
# across each bridge; the stub is filed to the round. Then each strap on
# edge, seat flank up: the follower seat drilled #26, then the 1/8 in end
# mill plunges to its floor and interpolates it: one turn flattens the floor,
# one finishes the wall at the middle of the drawing's .157 +.003/.000. Owner
# ruling 2026-11-23 (tool audit Q8), verbatim: "Re-band to +.003/0, finish
# with the 1/8 end mill, check with .157/.160 pins". It replaces the .1570
# bottoming reamer (a quoted special): a plunged 1/8 cutter cuts .125, so the
# seat is interpolated; the band's .0015 either side of the finish circle is
# the mill's.
#
# Bores (owner ruling 2026-11-24, fit audit question 12; fit audit F16): the
# pivot bores are reamed .2510 with no band, the MHA-DT-19 shaft their
# gauge (it enters and turns by hand, Setup 2); the arbor bores are drilled
# 5/16 and the MHA-DT-22 journals are turned to them on that part's
# traveler. The follower seat keeps its Class ZZ pair (shop
# zz-pins-1570-1600; tool audit Q8). Owner ruling 2026-11-23 (tool audit Q1,
# re-answered on the corrected facts), verbatim: "ZZ singles per the record:
# 29 pins (17 plus GO, 12 minus NO-GO), about $130. Accept that good holes
# near a limit may be refused; the traveler mikes each pin so the real
# window is known per pin."
#
# The cross hole is not drilled here. Owner ruling 2026-11-21 (Pedro, asked
# in person): "Pinion bracket cross hole: match-drill at assembly". The
# strap leaves this traveler without it; the fitter drills it 1/16 through
# the strap and the MHA-DT-19 shaft together at MHA-DT-00 STEP 16 (SHAFT
# DRILL SET) and drives the MHA-DT-VN-63 pin there.
#
# Route: saw the blank; Setup 2 lying on the 1 in + 1/2 in parallels stacked
# under each jaw (PB02: face B, spot, drill C and 5/16, ream .2510,
# both outlines to their bridges); Setup 3 bench: saw each bridge, file the
# stub, deburr; Setup 4 on edge on the same stacks, face A at the fixed jaw
# (PB04: spot, drill #26, end-mill the seat's floor and wall); Setup 5
# bench: deburr, inspect, oil.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero an end mill on a
# .002 feeler leaf, as the column clamp plans do. PB04's X0 is the pivot
# bore's axis, found as the pivot end's apex plus the end's radius: PB02 cut
# that end round the reamed bore from the same zero.
#
# NC (cam:dt_pinion_bracket, cad/process/dt_pinion_bracket/cam.py): PB02_flat
# and PB04_edge. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 trade-size 1 centre
# drill, T3 C, T4 5/16, T5 .2510 reamer, T6 1/8 in end mill, T7 #26.
title = "Pinion bracket strap"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/8 x 1-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "3/8 x 1-1/4 in flat bar; one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long makes both straps."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.broad_face_b_thickness_min_in:.3dot}}–{{cad.broad_face_b_thickness_max_in:.3dot}} thick (face A to face B); face A is the bar's cold-finished face, left as bought. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Every file is proved in air before its first cut. Not on hand, to buy before the job: the .2510 reamer and the seat's two Class ZZ pins (.157 plus, .160 minus)."
shop = "../shop"
stock_refs = ["1018-flat-3-8x1-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_pinion_bracket/features.toml"
adapter = "drilled_block"
part = "dt-pinion-bracket"

[parameters]
quantity = 2
# The bar (stock.1018-flat-3-8x1-1-4, 3/8 x 1-1/4 in) and the blank cut from
# it: the bar's width across the straps (model X), its thickness through them
# (model Z), the blank's length along them (model Y) holding both, ±.05 for
# the saw.
blank_x_in = 1.25
blank_z_in = 0.375
blank_y_in = 4.55
blank_length_min_in = 4.55
blank_length_max_in = 4.65
blank_length_min_mm = 115.57
blank_length_max_mm = 118.11     # blank_length_max_in × 25.4; cam.py checks it.
# The bar's thickness accepted before PB02: face B's one level at the
# drawing's mid thickness takes .010-.020 off it (cleans up, stays a skim).
blank_z_min_in = 0.370
blank_z_max_in = 0.380
blank_z_min_mm = 9.398
blank_z_max_mm = 9.652
# Each strap's pivot bore along the blank from its left end, the second one
# pitch on (author's choice): the arbor bores the centre distance past them.
# The blank keeps at least end_web_min_mm of metal beyond each end's slot,
# the saw cut across each bridge (on a line saw_offset_mm past the arbor
# end's apex, inside the slot, a saw_kerf_mm kerf on the line's far side
# from the strap) stays saw_clear_min_mm off the next
# slot, and each outline slot clears the parallel under the bar's edge by
# parallel_clear_min_mm. cam.py checks them all.
first_pivot_mm = 17.0
part_pitch_mm = 53.0
pivot_1_x_mm = 17.0
arbor_1_x_mm = 45.0
pivot_2_x_mm = 70.0
arbor_2_x_mm = 98.0
end_web_min_mm = 6.0
saw_offset_mm = 1.5
saw_kerf_mm = 2.4
saw_clear_min_mm = 2.0
parallel_clear_min_mm = 1.0
# The bridge left at each arbor end's apex: 3 mm wide, the full thickness.
bridge_width_mm = 3.0
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) at the
# measured setting em-half-carbide-1018-3439-face (shop common.toml;
# cad/config/shop-equipment/measured-cuts.toml: dechatter session of
# 2026-11-23, #3439, stable to 1.27 mm deep and 6.4 mm wide at 2420-2490 rpm
# in the cut, conventional, half_mill_projection_mm out of the collet being
# the longer end of the stick-out it allows), equal passes no wider than its
# 6.4 mm, the first engaging one stepover and the last overhanging the far
# edge: six of 5.375 mm across the 1-1/4 in bar (five would need 6.45, over
# the limit); the zigzag climbs on every other pass, which the session did
# not measure. Face B comes down to the thickness from the bar's
# 3/8 in in one level (cam.py checks the skim).
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.4
face_b_skim_mm = 0.381
# Bores: spot Ø.118 with the trade-size 1 carbide centre drill (1/8 body),
# under the C and 5/16 drills (no chamfer at the mouth); each drill through, its
# full diameter 1.0 mm past face A into the gap between the stacks, no peck
# (L/D 1.5 and 1.2); its point (118°) below that. The reamer fed through to
# .100 below face A, in and out, spindle running.
bore_spot_dia_mm = 3.0
drill_past_mm = 1.0
pivot_drill_tip_mm = -2.847
arbor_drill_tip_mm = -3.385
ream_past_mm = 2.54
# A reamer takes at most this much on the diameter after its drill (.016 in).
ream_stock_max_mm = 0.4064
# The outline: the 1/8 in carbide end mill (shop endmill-carbide-3fl-1-8) at
# Tru-Edge's .001 in/tooth (shop settings.endmill-carbide-3fl-1-8-1018-cf-
# tru-edge: the 6G .0006 is under prechips' feed-factor table),
# a full-width slot round the strap, in equal levels no deeper than .035 in
# from face B through to .010 below face A, into the gap between the stacks;
# each level plunges at half the feed.
outline_step_max_mm = 0.889
outline_past_mm = 0.254
eighth_plunge_feed_per_min_mm = 106.68
# The seat (PB04, Z0 the seat flank): spot it Ø.065, under the #26; the
# #26 point .002 above the seat's floor; the 1/8 in end mill plunges to the
# floor, turns once at Ø.150 (it takes out the drill's wall and point cone
# and leaves a flat floor) and once at Ø.1585, the middle of the seat's
# .157 +.003/.000 (tool audit Q8). Both turns run on the floor, so the
# floor's corner is the square end mill's own, inside the drawing's R.008
# max corner. cam.py checks both.
edge_spot_dia_mm = 1.651
seat_floor_z_mm = -4.064
seat_drill_floor_gap_mm = 0.05
seat_floor_dia_mm = 3.81
seat_finish_dia_mm = 4.0259
# Speeds and feeds of the holes, authored in the operations. Drilling:
# LittleMachineShop "Cutting Speeds", Drilling & Reaming, Plain carbon steels
# 1006-1026 (read 2026-11-20): 60-100 ft/min, the low end taken; AutoDrill
# "Suggested drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/16
# in .001, 1/8 in .003 in/rev, a size between two columns taking the lower
# one's feed. C (.242): 950 rpm (60 ft/min) × .003 = 2.85 in/min. 5/16
# (.3125): 750 rpm (61 ft/min) × .003 = 2.25. #26 (.147): 1550 rpm × .003 =
# 4.65. The
# trade-size 1 carbide centre drill: 2800 rpm (92 ft/min on its 1/8 body) ×
# .0005 (half the 1/16 column, for its 3/64 pilot) = 1.4 in/min. Reaming
# (author's rule of thumb): half the drilling speed, 30 ft/min, .004 in/rev:
# .2510 at 450 rpm = 1.8 in/min.
spot_feed_per_min_mm = 35.56
drill_c_feed_per_min_mm = 72.39
drill_5_16_feed_per_min_mm = 57.15
drill_26_feed_per_min_mm = 118.11
ream_2510_feed_per_min_mm = 45.72
# The seat's Class ZZ pins (owner ruling 2026-11-23, tool audit Q1): the GO
# a plus pin at the band's low limit, true size the limit to .0002 over; the
# NO-GO a minus pin at the high limit, .0002 under to the limit (one pin's
# ZZ tolerance, the records' resolution_mm 0.00508). With both pins at those
# extremes a seat is sure to pass only between the largest GO and the
# smallest NO-GO below: .1572-.1598 of the seat's .003.
seat_go_pin_max_in = 0.1572
seat_nogo_pin_min_in = 0.1598
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): the set's 1 in and 1/2 in parallels stacked against each jaw (1.5
# in), as the column clamp plans stack them, so the blank's face B and, on
# edge, the strap's round ends stand above the jaw tops.
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
# Each end of the shortest blank beyond the 4 in stacks, both centred:
# (blank_length_min − 4 in) / 2 (cam.py recomputes it).
overhang_min_mm = 6.985
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The jaw height less the stacks: the lower .270 of the blank, or of the strap
# on edge, in the jaws.
grip_mm = 6.8453
# Each piece centred on the jaws: its ends (jaw width − its length)/2 in from
# the jaw sides, the longest blank and the strap's overall length.
vise_blank_inset_mm = -20.28
vise_strap_inset_mm = -57.84
# PB02's Z0 touch-off: the 1/2 in end mill on face B (as bought) on the
# blank's centre line near its left end, wholly on the blank; Z set to the
# micrometer's reading there (Op 20). cam.py checks it.
z_touch_x_mm = 10.0
z_touch_y_mm = -15.875
# PB02's edge-finder tip depth below the blank's top: below the jaw tops
# (blank_top_mm − grip_mm under it) and on the blank's end; cam.py checks it.
finder_tip_depth_mm = 3.81
# PB04's X0 from the pivot end's apex: the end's radius plus the edge
# finder's .100 radius, left of the pivot bore's axis; cam.py checks it.
pivot_apex_x_mm = -10.16
# Heights above the vise's bed for the capacity check.
blank_top_mm = 9.525
strap_width_mm = 15.0
# Machine-capacity inputs (mm): tool lengths from spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out its
# measured setting allows (cad/config/shop-equipment/measured-cuts.toml:
# 27.94 to 28.45 mm); the 1/8 in end mill, 1-1/2 in overall: at least 5/8 in
# out (its
# 1/2 in flutes clear).
half_mill_projection_mm = 28.45
eighth_mill_projection_min_mm = 15.875
# ANSI B94.2 straight-shank chucking reamer, 6 in overall at .2510; the #26
# jobber drill 2-7/8 in (ASME B94.11M), PB04's longest tool;
# bounded by their whole length below the chuck.
reamer_long_oal_mm = 152.4
drill_26_oal_mm = 73.025
# The trade-size 1 centre drill, 1-1/4 in overall.
centre_drill_oal_mm = 31.75

