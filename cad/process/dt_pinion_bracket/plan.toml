[[setups.operations]]
instruction = "Still clamped, chips cleared and the bores oiled: try the MHA-DT-19 shaft in each pivot bore (the reamed bores' gauge; fit audit F16). It enters and turns by hand in every one: unclamp."
inspection = "MHA-DT-19 enters each pivot bore and turns by hand. Arbor bores 5/16 drilled, bright, no tears or chatter (Ra {{cad.arbor_bore_finish_ra_printed}} µin); the MHA-DT-22 journals are turned to them."
gauge_checks = "other"

[[setups.operations]]
instruction = "The shaft refused: clear the chips and oil. Console M6 T5 (.2510, 450 rpm, F45.720), spindle on, then by MDI: G0 X<bore> Y-15.875, G0 Z10.144, G1 Z-2.540 F45.720, G1 Z10.144 F45.720, with X 17.000 or 70.000. Try the shaft again; it enters and turns now: unclamp."
feed = "hand"

[[setups.operations]]
instruction = "Still refused (a reamer cannot be made to cut larger): stop and tell the owner."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Saw each strap free; file the stubs"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/free.svg", alt = "The cut blank from above: a saw cut across it just past each arbor end, through the bridge; each strap comes free with a short stub on its arbor end, filed back to the round." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe a line across face B {{process.saw_offset_mm:in.3dot}} past each arbor end's apex, across the slot at the bridge. Clamp the blank flat in the saw's vise and saw across it on each line, the blade's near face on the line and the kerf on the line's far side from the strap: each strap drops free. Number the straps 1 and 2 on face B."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File each bridge's stub back to the arbor end's round, following the milled arc on either side of it; deburr the slot's exit edges on face A and the bores' mouths, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Keep the seat flank and the far flank free of dings: the far flank seats on the parallels in Setup 4 and the seat flank takes the seat."
feed = "hand"
inspection = "Each strap, the filed arbor end's radius {{cad.arbor_end_radius_min_in:.3dot}}–{{cad.arbor_end_radius_max_in:.3dot}}: the calipers' jaw tips closed on the wall between the arbor bore and the end's apex, plus half the bore (.3125). Over: file again. Under: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.arbor_end_radius_band_mm}}" },
]

[[setups.operations]]
instruction = "Each strap: measure the pivot end's radius and write it on the strap's face B to .001 (Setup 4 sets X0 and checks the seat from it)."
inspection = "Pivot end's radius {{cad.pivot_end_radius_min_in:.3dot}}–{{cad.pivot_end_radius_max_in:.3dot}}: the calipers' jaw tips closed on the wall between the pivot bore and the end's apex, plus half the bore (.2510). Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.pivot_end_radius_band_mm}}" },
]

[[setups.operations]]
instruction = "Strap 1 only (the program holds it on both): check the bore centres."
inspection = "Bore centres {{cad.arbor_bore_center_distance_min_in:.3dot}}–{{cad.arbor_bore_center_distance_max_in:.3dot}}: the calipers' inside jaws across both bores, far wall to far wall, less half of each. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.arbor_bore_center_distance_band_mm}}" },
]

[[setups]]
machine_kind = "other"
