  { gauge = "calipers", band_mm = "{{cad.follower_seat_depth_band_mm}}" },
]

[[setups.operations]]
instruction = "GO pin refused: clear the chips and gauge again; still refused, the NO-GO pin entering (no cut remedies it), or the depth outside: stop and tell the owner before the second strap."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp; repeat this setup for the other strap without the proving run: the same Y0 and Z0, X0 again from its own apex and the radius written on its face B."
feed = "hand"

