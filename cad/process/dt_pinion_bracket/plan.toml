[[setups.operations]]
instruction = "Still clamped, blow the seat clean and gauge it: the .157 GO pin enters to the floor, the .160 NO-GO pin does not; the calipers' depth rod from the flank to the floor."
inspection = "GO enters, NO-GO does not: seat Ø{{cad.follower_seat_dia_min_in:.3dot}}–{{cad.follower_seat_dia_max_in:.3dot}}. Depth {{cad.follower_seat_depth_min_in:.3dot}}–{{cad.follower_seat_depth_max_in:.3dot}}."
