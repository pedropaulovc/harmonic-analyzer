vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.broad_face_b_thickness_mm}}", along_jaws_mm = "{{cad.envelope_y_mm}}", part_height_mm = "{{process.strap_width_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_strap_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
