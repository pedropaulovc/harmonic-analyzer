  <!-- Hand picture, to scale at 8 px/mm: a section along the straps' centre line (Y-15.875) seen from the front (looking +Y, +X to the right), the first strap's half of the blank, X0 its left end; face B faced to Z 9.144; Z0 face A on the stacks. The fixed jaw and its 1 in + 1/2 in stack behind the cut (the moving jaw and its stack in front of it: not drawn); the bores run out into the 25.4 mm gap between the stacks. The blank, the jaw and the stack run on to break lines. The stack is dashed: it stands behind the cut plane, so the drills' and reamer's points, in the gap, pass in front of it. Both bores drilled. The .2510 reamer (dt reamer-2510, Ø6.375 mm) at X 17.000, its end at Z-2.540, PB02's posted depth, 2.54 mm (process.ream_past_mm) past face A; it repeats at X 70.000. Its 45° lead chamfer is not on record: drawn 1 mm, schematic. It runs up to a break line. -->
