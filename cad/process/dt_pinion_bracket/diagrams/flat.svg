<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw (at the top): the blank 4.60 long (drawn at the band's middle), 1.25 across the jaws, face B up; X0 its left end (marked L), Y0 the fixed jaw's face. The 1 in + 1/2 in parallel stacks, 1/8 thick, against each jaw, dashed under it (process.riser_height_mm, process.parallel_thickness_mm); the jaws run on past the picture. Bottom, 8 px/mm: a section across the jaws (at X 60 for the face pass, across strap 1's flanks at X 31 for the outline), seen from the right end looking −X, so +Y (the fixed jaw) is to the right and +X comes toward you; Z0 face A on the stacks, the jaw tops 6.845 mm over it (process.vise_jaw_height_mm less the 1.5 in stacks); the stacks run down to a break line. The 1/2 end mill (shop endmill 1/2, Ø12.7 mm) on PB02's fourth pass, Y-15.150, at its posted Z 9.144 (cad.broad_face_b_thickness_mm), travelling −X (PB02 passes at Y 0.975, -4.400, -9.775, -15.150, -20.525, -25.900, each from X-8.890 to X127.000 or back; the first runs +X). This pass stands past the blank only at its ends; the first pass also runs over the fixed jaw, its end 2.30 mm over the jaw top. Dashed in plan: the six pass lanes. In the section the end mill ends in its 12 % arc and runs up to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="540"/>
  <text class="title" x="20" y="22">Setup 2, PB02 T1: the 1/2 end mill faces B to Z 9.144, its fourth pass at Y-15.150 travelling −X (5 and 8 px/mm)</text>
