<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw (at the top): the blank 4.60 long (drawn at the band's middle), 1.25 across the jaws, face B up; X0 its left end (marked L), Y0 the fixed jaw's face. The 1 in + 1/2 in parallel stacks, 1/8 thick, against each jaw, dashed under it (process.riser_height_mm, process.parallel_thickness_mm); the jaws run on past the picture. Bottom, 8 px/mm: a section across the jaws (at X 60 for the face pass, across strap 1's flanks at X 31 for the outline), seen from the right end looking −X, so +Y (the fixed jaw) is to the right and +X comes toward you; Z0 face A on the stacks, the jaw tops 6.845 mm over it (process.vise_jaw_height_mm less the 1.5 in stacks); the stacks run down to a break line. The bores drilled and reamed. The 1/8 end mill (shop endmill-carbide-3fl-1-8, Ø3.175 mm) drawn on strap 1's seat flank (+Y) at X 31.000 Y-6.787, the section's station (the flank runs X 17.000–45.000 at Y-15.875 + R + the cutter's radius), travelling −X there (PB02 T6 runs anticlockwise from above: G3 arcs at the ends), at its last level, its end 0.254 below face A (process.outline_past_mm) in the gap between the stacks: its outer edge 2.03 mm inside the stacks' inner faces (the 25.4 gap less the strap's 15 and two cutter Ø). Strap 2's outline (dashed) is cut the same way. Each strap stays on its 3.0 mm bridge (process.bridge_width_mm) at the arbor end. In the section the end mill ends in its 12 % arc and runs up to a break line. -->
