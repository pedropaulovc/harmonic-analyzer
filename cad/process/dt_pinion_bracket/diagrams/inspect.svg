<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 8 px/mm. Left: face A, the pivot end left, the seat flank up: the reamed pivot bore Ø.2510 (cad.pivot_bore_dia_mm) and the drilled 5/16 arbor bore (cad.arbor_bore_dia_mm) 28 mm apart (cad.arbor_bore_center_distance_mm), the ends R7.5 (cad.pivot_end_radius_mm), 15 wide. Right: the seat flank, the pivot end left, face A at the bottom edge: the follower seat Ø.1585 (cad.follower_seat_dia_mm) at 7.0 mm from the pivot bore's axis (cad.follower_seat_height_mm), .18 from face A (cad.follower_seat_station_mm). No cross hole: it is match-drilled at assembly. -->
  <rect class="paper" x="0" y="0" width="760" height="380"/>
  <text class="title" x="20" y="22">Setup 5: the finished strap, face A view (left) and seat flank view (right) (to scale, 8 px/mm)</text>
  <path class="part-kept" d="M120.0 140.0L344.0 140.0A60.0 60.0 0 0 1 344.0 260.0L120.0 260.0A60.0 60.0 0 0 1 120.0 140.0Z"/>
  <circle class="holes" cx="120" cy="200" r="25.5"/>
  <circle class="holes" cx="344" cy="200" r="31.75"/>
  <circle class="hidden" cx="176" cy="156.26" r="2"/>
  <rect class="hidden" x="160.05" y="140" width="31.9" height="32.51"/>
  <text class="label" x="40" y="70">pivot bore Ø{{cad.pivot_bore_dia_min_in:.4dot}}–{{cad.pivot_bore_dia_max_in:.4dot}}, reamed</text>
  <line class="leader" x1="120" y1="76" x2="110" y2="180"/>
  <circle class="leader-dot" cx="110" cy="180" r="2"/>
  <text class="label" x="260" y="300">arbor bore Ø{{cad.arbor_bore_dia_min_in:.4dot}}–{{cad.arbor_bore_dia_max_in:.4dot}}, 5/16 drill</text>
  <line class="leader" x1="300" y1="288" x2="354" y2="226"/>
  <circle class="leader-dot" cx="354" cy="226" r="2"/>
  <text class="label" x="40" y="330">seat {{cad.follower_seat_height_in:.3dot}} from the pivot bore's axis</text>
  <text class="label" x="40" y="346">(dotted: the seat, into the seat flank)</text>
  <line class="leader" x1="140" y1="318" x2="176" y2="160"/>
  <circle class="leader-dot" cx="176" cy="160" r="2"/>
  <rect class="part-kept" x="410" y="146.85" width="344" height="73.15"/>
  <circle class="holes" cx="526" cy="183.42" r="15.95"/>
  <line class="hidden" x1="470" y1="136.85" x2="470" y2="230"/>
  <text class="label" x="410" y="246">face A (the bottom edge)</text>
  <text class="label" x="470" y="90">follower seat Ø{{cad.follower_seat_dia_min_in:.4dot}}–{{cad.follower_seat_dia_max_in:.4dot}}, {{cad.follower_seat_depth_in:.2dot}} deep</text>
  <line class="leader" x1="520" y1="96" x2="526" y2="175.42"/>
  <circle class="leader-dot" cx="526" cy="175.42" r="2"/>
  <text class="label" x="530" y="276">the pivot bore's axis (dashed)</text>
  <line class="leader" x1="528" y1="272" x2="470" y2="228"/>
  <circle class="leader-dot" cx="470" cy="228" r="2"/>
  <text class="label" x="470" y="340">no cross hole: it is match-drilled at assembly</text>
</svg>
