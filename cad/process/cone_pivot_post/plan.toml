check_jog_mm = 10.0
retouch_after = []
[[setups.ops]]
op = 10
do = "face"
feature = "foot_seat"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0
direction = "radially_inward"
doc_mm = 0.25 # AUTHOR'S CHOICE, not cutting-data proof
feed_mm_rev = 0.05 # AUTHOR'S CHOICE; RPM unknown
note = "AUTHOR'S CHOICE: remove6mm axial allowance in passes and establish datum B; reach/nose geometry and speed remain unresolved."
[setups.ops.checks]
finish_ra = "unknown"
[[setups.ops]]
op = 20
do = "rough_turn"
feature = "body"
tool = "turning-tools-warner-lms-4132/AR"
holder = "qctp-axa-lms-2280/1-turning-facing"
