# Copied from https://github.com/pedropaulovc/prechips/blob/55cae713860a491b8925aed1ad8a24fb30502fe0/examples/cone-pivot-post/plan.toml
# Inventory verification flags, author-choice process proposals and the
# plan-authored T1/M2/J3/C4 frames (origins, axes, binding, cites) are unchanged.
# Hand-authored M2 one-piece candidate; PLANNED, not a verified machining route.
# All blank allowances, grip, jogs, feeds and depths marked AUTHOR'S CHOICE.
# No speed, source material grade, available blank, tool reach or setup binding is invented.
part = "cone-pivot-post"
features = "../../out/features/cone_pivot_post/features.toml"
construction = "one_piece"
quantity = 1 # parts/cone-pivot-post.yaml:cone-pivot-post.quantity
quantity_cite = ["harmonic-analyzer/cad/config/parts/cone-pivot-post.yaml:cone-pivot-post.quantity"]

[drawing]
number = "MHA-016" # parts/cone-pivot-post.yaml:cone-pivot-post.number
revision = "unknown"

[paths]
inventory = "../shop/inventory.toml"
policy = "../shop/shop-policy.toml"
cutting_data = "../shop/cutting-data.toml"

[stock]
form = "round_bar"
material = "unknown" # source only pins ferrous_noncritical, not a purchased grade
on_hand = false # inventory stock=[]; this is a procurement candidate, not an inventory item
 dia_mm = 110.0 # AUTHOR'S CHOICE: radius55 covers hypot(50.6591,21.93/2)=51.8322
length_mm = 120.0 # AUTHOR'S CHOICE: body86 + foot allowance6 + sacrificial top grip28
north_allowance_mm = 6.0 # AUTHOR'S CHOICE: exposed foot-facing allowance
south_grip_mm = 28.0 # AUTHOR'S CHOICE: past the finished top at body Y86
note = "AUTHOR'S CHOICE: bar parallel model Y. The complete crank boss reach fits inside radius55; no Ø45 envelope is claimed. Keep both integral journal pads during roughing. Catalogue identity and material grade unknown; M4 swept-envelope/clearance proof not supplied."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,49-67"]

# Existing shaft convention: X diametric, Z toward the exposed end. The EL400
# is only a manual reference; its installation on this lathe remains unknown.
[dro]
controller = "unknown"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"
radius_mode = false # AUTHOR'S CHOICE: a physical10mm X jog displays20mm on the lathe
[dro.direction]
x = "away_from_spindle_axis" # AUTHOR'S CHOICE; verify each machine's positive sense
y = "away" # AUTHOR'S CHOICE: existing EL400 positive mill-Y convention
z = "toward_exposed_end"

# Plan-owned setup frames (PLAN.md §4.1; docs/plan.md "frames"). The exported
# manifest declares only `model` and an unknown `setup`; these restore the
# pre-export T1/M2/J3/C4 transforms and citations verbatim (3a561db
# examples/cone-pivot-post/features.toml). Origins and axes are model
# coordinates; every physical binding remains unknown.
[frames.T1]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, 1.0]
z = [0.0, -1.0, 0.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: foot-exposed frame (one-piece lathe S1, built-up mill S0); +Z toward the foot, +X radial withdrawal on the lathe."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,373-376"]

# Head top at Z86 = exported body height_nominal.
[frames.M2]
origin = [0.0, 0.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 0.0, -1.0]
z = [0.0, 1.0, 0.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: foot-down milling; Z0 at finished foot, head top at Z86."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:29-33,79-81,373-376"]

# Origin = exported journal_bore at; setup -Z = exported journal_bore axis.
[frames.J3]
origin = [0.0, 33.368, 0.0]
x = [0.9762272058393484, 0.0, -0.21674972336567902]
y = [0.0, -1.0, 0.0]
z = [-0.21674972336567902, 0.0, -0.9762272058393484]
binding = "unknown"
note = "AUTHOR'S CHOICE: spindle toward the north cone-boss face; trig basis derived from the 12.5182 degree horizontal plan angle, not a tilt."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:62-67,268-279"]

# Origin = exported crank_bore at Y72.7 and crank_boss_faces station_nominal 21.3753.
[frames.C4]
origin = [0.0, 72.7, -21.3753]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "unknown"
note = "AUTHOR'S CHOICE: crank boss north face Z0; depth goes into boss along negative setup Z."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/cone_pivot_post_spec.py:49-57"]

# S1 only turns BELOW the inclined pad (lowest pad Y33.368-17.2/2=24.768).
# Do not turn the full body/head and thereby remove either integral boss.
[[setups]]
id = "S1"
machine = "PM-1127VF-LB"
frame = "T1" # plan.frames.T1, AUTHOR'S CHOICE; exported `setup` and physical binding stay unknown
stock_in = "authored_round_blank"
coolant = "CRC cutting oil brushed on" # AUTHOR'S CHOICE; inventory consumable, not speed evidence
deburr_mm = 0.25 # title_block.yaml:edge_break.radius_mm, edge_break.chamfer_max_mm
deburr_cite = ["harmonic-analyzer/cad/config/title_block.yaml:edge_break.radius_mm", "harmonic-analyzer/cad/config/title_block.yaml:edge_break.chamfer_max_mm"]
[setups.stock_state]
od_mm = 110.0 # AUTHOR'S CHOICE: declared blank OD, not a measurement
north_end_z = 6.0 # AUTHOR'S CHOICE: foot allowance in T1
south_end_z = -114.0 # AUTHOR'S CHOICE: 86+28 behind the foot
note = "AUTHOR'S CHOICE: jaws end at model Y86/T1 Z-86; stock runs to Y114."
[setups.hold]
fixture = "chuck-4jaw-6-d1-4"
support = "none" # AUTHOR'S CHOICE: unsupported route; shop ratio remains unknown
 grip_on = "sacrificial upper28mm past the final head top"
grip_mm = 28.0
stickout_mm = 92.0 # AUTHOR'S CHOICE: exposed foot allowance6 + body86; L/D=92/110
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: jaw fronts at T1 Z-86; separately verify tool clearance"
clamp = "AUTHOR'S CHOICE: centre in four-jaw; tighten all jaws and remove key before cutting"
[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure" # EL4009.2.1 p62; measured diameter unavailable
 tool = "turning-tools-warner-lms-4132/AR"
gauge = "unknown" # no inventory outside micrometer spans the110mm trial-cut blank
check_jog_mm = 10.0 # AUTHOR'S CHOICE
[setups.zero.z]
face = "foot_seat"
edge_mm = 0.0
from = "+z"
method = "face_then_set"
after_op = 10
 tool = "turning-tools-warner-lms-4132/AR"
