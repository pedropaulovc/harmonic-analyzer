<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 1, Op 80: the #43 drill from the tailstock, to the bore's axis (to scale, 300 px/in)</text>
  <!-- To scale, 300 px/in along and across the axis: the hex across its
       corners (12.83 mm), the spigot Ø0.421 x .25, the FULL R groove
       (the R.024 groover, root Ø.327) .138 from the face, the #43 hole
       Ø.089 x .49. The 3-jaw's jaws and body are schematic (their sizes are
       not on record); the jaw fronts .95 behind the spigot face. The drill chuck is not drawn (its size is not on record). -->
  <rect class="fixture-vise" x="215.0" y="60" width="60" height="280"/>
  <rect class="clamp" x="275.0" y="84.2" width="40" height="40"/>
  <rect class="clamp" x="275.0" y="275.8" width="40" height="40"/>
  <rect class="part-rest" x="40" y="124.2" width="344.0" height="151.6"/>
  <rect class="part-kept" x="384.0" y="124.2" width="141.0" height="151.6"/>
  <rect class="part-kept" x="525.0" y="136.9" width="75" height="126.2"/>
  <path class="paper" d="M551.5 136.9L551.5 143.8A7.2 7.2 0 0 0 565.9 143.8L565.9 136.9Z"/>
  <path class="paper" d="M551.5 263.1L551.5 256.2A7.2 7.2 0 0 1 565.9 256.2L565.9 263.1Z"/>
  <path class="holes" d="M600.0 186.6L453.0 186.6L445.0 200.0L453.0 213.4L600.0 213.4Z"/>
  <line class="centre-line" x1="20" y1="200" x2="740" y2="200"/>
  <!-- The #43 drill to scale (cad tap_dia_mm 2.261 = 26.7 px), its full
       diameter to the tap axis depth .49 (12.446 mm, 147 px), its 118 deg
       point beyond; drawn short to a break line (its length out of the chuck
       is not on record). -->
  <path class="cutter" d="M720.0 186.6L453.0 186.6L445.0 200.0L453.0 213.4L720.0 213.4L717.0 208.9L720.0 204.5L717.0 200.0L720.0 195.5L717.0 191.1Z"/>
  <line class="arrow" x1="700" y1="160" x2="650" y2="160"/>
  <text class="label" x="620" y="148">feed, pecking every .06</text>
  <line class="datum" x1="600" y1="90" x2="600" y2="120"/>
  <text class="datum-label" x="560" y="84">Z0 spigot face</text>
  <line class="dims" x1="453.0" y1="320" x2="600" y2="320"/>
  <line class="dims" x1="453.0" y1="210" x2="453.0" y2="326"/>
  <line class="dims" x1="600" y1="270" x2="600" y2="326"/>
  <text class="label" x="420" y="342">full diameter {{cad.tap_axis_depth_in:.2dot}} deep (the quill scale),</text>
  <text class="label" x="420" y="358">to where the rod bore's axis will be</text>
  <text class="label-halo" x="60" y="240">hex 7/16 in the 3-jaw, spigot and groove done</text>
</svg>
