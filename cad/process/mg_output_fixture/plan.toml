[[setups]]
machine_kind = "lathe"
title = "Spigot end: face, turn, groove, drill and tap"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The 7/16 hex bar in the 3-jaw, a jaw on every other flat, {{process.stickout_in:.2f}} in out of the jaw fronts; the rest of the bar back in the spindle bore."
datum = "Z0 (carriage DRO) the spigot face, faced in Op 10."
diagram = { file = "diagrams/lathe.svg", alt = "To scale: the hex bar in the 3-jaw, .95 out; the AR tool (schematic) faces the end toward the centre, the spigot face; the spigot Ø.42 for .25, the FULL R groove .14 from the face and the #43 hole .49 deep it is cut to, each later tool in its own picture." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = 11.1125, stock_diameter_mm = 12.8316, stickout_mm = 24.13, minimum_diameter_mm = 8.2968, support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "turn"
drilling = "none"
sizing = "other"
instruction = "Face the end square, about .020 off, to the centre with no pip. Zero the carriage DRO Z on the faced end: Z0, the spigot face."
settings = "lathe-ar-c360"
cut_diameter_mm = 12.8316

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "turn"
drilling = "none"
sizing = "other"
instruction = "Turn the spigot to Z−{{cad.spigot_length_in:.3dot}}: rough to Ø.440 (the hex's corners first, an interrupted cut: light passes), then one finish pass to Ø{{cad.spigot_dia_min_in:.3dot}}–{{cad.spigot_dia_max_in:.3dot}} (aim {{cad.spigot_dia_in:.3dot}}), the tool's R.016 nose leaving the shoulder's inside corner (R.040 MAX, title block). Face the shoulder square out to the flats at Z−{{cad.spigot_length_in:.3dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.spigot_dia_mm}}"
inspection = "Spigot Ø{{cad.spigot_dia_min_in:.3dot}}–{{cad.spigot_dia_max_in:.3dot}} (micrometer, at both ends of it); its length, the spigot face to the shoulder, {{cad.spigot_length_min_in:.3dot}}–{{cad.spigot_length_max_in:.3dot}} (the calipers' depth rod from the face to the shoulder)."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.spigot_dia_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.spigot_length_band_mm}}" },
]

[[setups.operations]]
cut_kind = "other"
instruction = "Spigot over Ø{{cad.spigot_dia_max_in:.3dot}} or shoulder short of {{cad.spigot_length_min_in:.3dot}}: take another light pass and check again. Spigot under Ø{{cad.spigot_dia_min_in:.3dot}} or shoulder past {{cad.spigot_length_max_in:.3dot}}: face the end back past the spigot (it is the bar's end) and start Setup 1 again on the fresh end."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Mike the groover across its nose (about .048) and set it on centre height, square to the axis. Bring it past the spigot face, its chuck-side flank onto the face, and set the DRO Z there to half your reading (about {{process.form_half_width_in:.3dot}}): the DRO then reads the centre of its arc. Move to Z−{{cad.groove_station_in:.3dot}}, the groove's centre ({{cad.groove_station_min_in:.3dot}}–{{cad.groove_station_max_in:.3dot}} from the face)."
settings = "fixture-form-r024-c360"
cut_diameter_mm = "{{cad.spigot_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Touch the arc on the spigot's O.D. and zero the cross-slide dial there. Feed in slowly by half of (your Op 20 spigot reading − {{cad.groove_root_dia_in:.3dot}}), radially: the root is then Ø{{cad.groove_root_dia_in:.3dot}} ({{cad.groove_root_dia_min_in:.3dot}}–{{cad.groove_root_dia_max_in:.3dot}}) whatever the spigot came out at."
diagram = { file = "diagrams/lathe-groove.svg", alt = "To scale: the R.024 full-radius groover fed in from the front at the groove's station, .14 from the spigot face, its nose on the root Ø.327." }
settings = "fixture-form-r024-c360"
cut_diameter_mm = "{{cad.spigot_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Look at the groove: a clean round root, no step at either side, about as wide at the O.D. as the groover (.048). Its root Ø and station are the cross slide's and the DRO's, not gauged (no gauge in the shop enters a .048 groove)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.08 across the countersink: under the #43 drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 2.032

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-43"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-plug" }
instruction = "Drill #43 from the tailstock: feed it in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill, pecking every .06 to clear chips, until the scale reads {{cad.tap_axis_depth_in:.3dot}}: the full diameter is then {{cad.tap_axis_depth_min_in:.3dot}}–{{cad.tap_axis_depth_max_in:.3dot}} deep, to where the rod bore's axis will be. The depth is the quill scale's, not gauged."
diagram = { file = "diagrams/lathe-drill.svg", alt = "To scale: the #43 drill from the tailstock in the spigot end, its full diameter .49 deep, to where the rod bore's axis will be." }
settings = "fixture-drill-43-c360"
cut_diameter_mm = "{{cad.tap_dia_mm}}"
hole_depth_mm = "{{cad.tap_axis_depth_mm}}"
peck = { step_mm = 1.524, retract = "full" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "tap-plug"
drilling = "none"
sizing = "other"
instruction = "Spindle off, in neutral. Put the MT3 dead centre in the tailstock. Pencil-mark the plug tap .40 from its point and set it in the T-handle wrench. Put its point in the drilled hole, the dead centre's point in the wrench's centre hole to keep it on axis, the wrench's handle resting on the compound."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "tap-plug"
drilling = "none"
sizing = "other"
instruction = "Tap {{cad.tap_thread}}: turn the chuck by hand with one hand, winding the tailstock handwheel in with the other so the centre follows the tap (.025 a turn). Back off every half turn; stop when the mark reaches the spigot face: never bottom the tap in the .49 hole."
diagram = { file = "diagrams/lathe-tap.svg", alt = "To scale across: the 4-40 plug tap in the drilled hole, its pencil mark at the spigot face, its point .40 in; the T-handle wrench and the MT3 dead centre in its centre hole following it." }
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "tap-bottoming"
drilling = "none"
sizing = "other"
instruction = "Finish with the bottoming tap the same way, pencil-marked .46 from its point, until the mark reaches the spigot face: full thread to about .41 deep, past where the rod bore's near wall will be (.38 at the deepest, the bore's .50 station less its radius at the thread's crest), and .02 short of the drill's .48 least depth."
diagram = { file = "diagrams/lathe-tap-bottoming.svg", alt = "To scale across: the 4-40 bottoming tap in the hole, its mark at the spigot face, its point .46 in; the T-handle wrench and the MT3 dead centre following it." }
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break the spigot face's outer edge with the smooth file held flat, {{cad.chamfer_max_in:.3dot}} max; 200 rpm. Leave the groove's edges for the bench."
rpm = 200
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Cross bore through the corners, on the bar"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two 1 in parallels, 1/8 in thick, one against each jaw, their LEFT ends {{process.cross_parallel_start_mm:in.2f}} in right of where the spigot face will be. The bar lies along the jaws, a corner straight UP and one DOWN, the spigot end to the LEFT, {{process.jaw_side_from_face_mm:in.2f}} in out past the jaws' left side (the calipers' depth rod from the jaw side to the spigot face): its lower diagonal flats rest on the parallels' inner top edges, gripped on the two vertical flats. Tap it down onto both edges while closing the vise. Under the bore nothing but air: the parallels start right of it."
datum = "Program MO01_cross_bore (cam:mg_output_fixture). G54: X0 the spigot face, +X along the bar to the right; Y0 the spigot's axis, +Y toward the fixed jaw; Z0 the top corner."
diagram = { file = "diagrams/cross.svg", alt = "The bar lying along the jaws, corner up, the spigot end .50 out past the jaws' left side, its lower diagonal flats on the parallels' inner edges from .75 in; the F drill, to scale, through both corners .49 from the spigot face, its point in the air left of the parallels (the centre drill's spot under it not drawn)." }
envelope = { x_span_mm = ["{{cad.envelope_x_mm}}", 4.7625], y_span_mm = ["{{cad.hex_af_mm}}", 4.7625], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.cross_top_height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.cross_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_f_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.bar_length_min_mm}}"], clamp_mm = ["{{process.jaw_side_from_face_mm}}", "{{process.bar_length_min_mm}}"], section_mm = { diameter = "{{cad.hex_af_mm}}" } }

[[setups.operations]]
instruction = "Bore gauges, before the setup: mike the F drill's shank, .2570–.2575 makes it the GO; mike the G drill's shank, .2600–.2610 makes it the NO-GO (each sits inside the band, as fixed gauges do; no pin gauges of the size are owned). F under .2570: no GO; tag the bar BORE MIN NOT GAUGED now, and gauge with the NO-GO only."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0 the spigot's axis, between two touches on its sides; X0 the spigot face."
instruction_detailed = "Edge finder (900 rpm), its tip level with the spigot's middle. On the spigot's front side (toward the moving jaw), from the front: G10 L20 P1 Y0. On its back side, from the back: G10 L20 P1 Y(half the DRO Y reading). On the spigot face from the left, at Y0: G10 L20 P1 X-2.540 (minus: the edge finder's centre is left of the face)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top corner, touched with the centre drill at the bore's station."
instruction_detailed = "Console M6 T1 (#2 centre drill). MDI G0 X{{cad.rod_bore_face_station_mm:.3f}} Y0. Spindle stopped, its point just dragging a .002 feeler leaf on the top corner: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Run MO01_cross_bore (M6 T1, centre drill; set 2800): spot the top corner Ø{{process.corner_spot_dia_mm:in.3dot}} at X {{cad.rod_bore_face_station_mm:.3f}} mm, on the axis."
settings = "fixture-spot-c360"
milling_cuts = [
  { name = "corner spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.corner_spot_dia_mm}}", flutes = 2, rpm = 2800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = 12.446 },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-f"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.rod_bore_dia_band_mm}}" }
instruction = "Same file, M6 T2: F drill through both corners in one feed, its full diameter {{process.cross_drill_past_mm:in.3dot}} past the lower corner, into the air left of the parallels; set 2400. At least 1.10 out of its chuck: it reaches .94 below the jaw tops."
settings = "fixture-drill-f-c360"
hole_depth_mm = "{{cad.hex_ac_mm}}"
peck = "none"
milling_cuts = [
  { name = "cross drill", kind = "drill", phase = "rough", cutter_dia_mm = 6.5278, flutes = 2, rpm = 2400, feed_mm_min = "{{process.drill_f_feed_per_min_mm}}", stations_mm = 12.446 },
]
inspection = "Bore Ø{{cad.rod_bore_dia_min_in:.3dot}}–{{cad.rod_bore_dia_max_in:.3dot}}, before unclamping: the GO shank (if there is one) enters, the NO-GO shank does not."
gauge_checks = [{ gauge = "clamp-bore-drill-shanks", band_mm = "{{cad.rod_bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "The GO does not enter: run MO01_cross_bore again, still clamped (the F drill through again), and re-check. Still not, or the NO-GO enters: face the bar's end back past the bore and make another from Setup 1 on the fresh end."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Part off to length"
machine = "PM-1127VF-LB lathe / 6 in 3-jaw"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The bar back in the 3-jaw, a jaw on every other flat, the spigot end {{process.stickout_in:.2f}} in out of the jaw fronts."
datum = "DRO Z set with the blade on the spigot face in Op 190."
diagram = { file = "diagrams/part.svg", alt = "To scale: the bar in the 3-jaw, the fixture's spigot end out, the F bore through it; the P1 blade, its tailstock-side face at Z−.720, parting the fixture off .72 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = 11.1125, stock_diameter_mm = 12.8316, stickout_mm = 24.13, minimum_diameter_mm = 8.2968, support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the spigot face and set DRO Z to {{process.blade_width_in:.4dot}}, the blade's width miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z−{{cad.envelope_x_in:.3dot}}, the blade square to the axis on centre height. Hands clear: let the fixture fall; pick it up from the bed or the chip tray only after the spindle has stopped."
settings = "lathe-part-c360"
cut_diameter_mm = 12.8316

[[setups.operations]]
cut_kind = "other"
instruction = "The rod bore's two stations, the F drill's shank in the bore (the GO, or the undersize F if Op 130 found no GO): calipers from the free end over the shank's far side, less half the shank's miked Ø; then from the spigot face the same way."
inspection = "Free end to the bore's axis {{cad.rod_bore_station_min_in:.3dot}}–{{cad.rod_bore_station_max_in:.3dot}}; spigot face to it {{cad.rod_bore_face_station_min_in:.3dot}}–{{cad.rod_bore_face_station_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.rod_bore_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.rod_bore_face_station_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "A station out of its band: the fixture is scrap; make another from Setup 1 on the bar's parted end."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr, chase the thread, check"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished fixture: the hex .72 long, the F bore through the corners .23 from the free end, the spigot Ø.42 with its FULL R groove, the 4-40 tap from the spigot face into the bore." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the parting pip on the free end flat. Break every cut edge {{cad.edge_break_in:.3dot}} max: the free end's, the shoulder's outer edge at the hex, the bore's two mouths at the corners and the groove's lips (a light touch of the smooth file, never into the groove's round); the spigot face's edge was broken in Op 120."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-bottoming"
drilling = "none"
sizing = "other"
instruction = "Chase the thread: run the bottoming tap in by hand from the spigot face to its .46 mark, clearing the burr the F drill raised where it crossed the thread; blow out the hole and the bore."
feed = "hand"

[[setups.operations]]
instruction = "Run a 4-40 screw in by hand from the spigot face: it turns freely all the way into the bore, its end showing there."
inspection = "{{cad.tap_thread}} full to the rod bore: a 4-40 screw runs by hand from the spigot face into the bore."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "A screw that binds before the bore: chase again with the bottoming tap to its mark; still binding, the fixture is scrap (make another from Setup 1)."
feed = "hand"

[[setups.operations]]
instruction = "Wipe the fixture clean and dry; bag it, with its tag if Op 130 tagged it."
feed = "hand"
