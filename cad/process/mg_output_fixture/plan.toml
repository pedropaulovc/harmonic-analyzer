# Output fixture MHA-MG-06 (qty 1), from the 7/16 in C36000 hex bar on hand
# (stock.c360-hex-7-16, a 4 in piece bought for this part).
# Route, chosen for speed (owner ruling 2026-11-21: the agent picks the
# faster route and says why; the owner corrects afterwards):
# - Setup 1, PM-1127VF-LB lathe, 6 in 3-jaw on the hex, manual (turned setups
#   get no NC, owner 2026-11-21): on the end of the bar, face the spigot
#   face, turn the Ø.42 spigot, form the FULL R groove with the R.024
#   full-radius groover, centre-drill, drill #43 to the bore's axis and tap #4-40 from the
#   tailstock (plug, then bottoming), the tap wrench's shank centre on the
#   MT3 dead centre (sm_gooseneck_end_plug's way).
# - Setup 2, PM-30MV CNC, vise: the whole bar lying corner up along the jaws
#   on two 1 in parallels, the spigot end .50 out past the jaws' left side;
#   MO01 spots the top corner and drills F through both corners .49 from the
#   spigot face, into the air past the parallels' left ends. The cross bore
#   is drilled before parting off so the vise grips three inches of bar
#   rather than a .72 in part: a parted part lying corner up has no flat
#   left beside the bore to rest on the parallels (the clamp MHA-MG-02 rests
#   on .375 of its own length; this part has .23 on the free-end side).
# - Setup 3, lathe: the bar back in the 3-jaw, part the fixture off .72 long
#   (the P1 blade's touch rule, #3312).
# - Setup 4, bench: file the parting pip, break edges, chase the thread with
#   the bottoming tap through the cross bore's burr, inspect.
# To order before Setup 1 runs: the R.024 full-radius groover
# (tools.form-tool-r024, the one groover MHA-MG-05's rim groove names) and
# the #4-40 bottoming tap (tools.tap-4-40-bottoming, Travers 12-111-086 per
# its record).
#
# The groove's tool (tool audit 2026-11-23, row form-tool-r047, level 1:
# "Do not buy a second grooving form tool: cut MG-06's FULL R groove with the
# one full-radius groover bought for MG-05 (R .020-.029, e.g. R.024), which
# lies inside MG-06's R.020-.047 limit"; Main's assignment 2026-11-23: "the
# wire grooves take one stock 3/64 groover per the audit"). Re-derived on
# the spec: the groove prints R .047/.020 LIMIT, FULL R
# (mg_output_fixture_spec.py GROOVE_RADIUS_MIN .020, the model's .047 the
# MAX), and MHA-MG-05 prints its rim groove R.024 at .XXX (±.005: R.019-.029);
# a 3/64 (.0469) full-radius nose is R.0234, the record's R.024 within .001
# of it, inside both. At R.024 the groove is 2R = .048 wide at any printed
# root and O.D. (FULL R: the shallowest printed groove, .035 deep, is deeper
# than R, so straight walls run from the arc to the O.D.), wider than the
# Ø.008 ±.001 lever wire, its floor's radius over the wire's .0045: the
# spec's own R MIN proofs, which a larger R than .020 only eases; its mouth
# stays .048 wide, so the shoulder-side clearance grows over the R.047's.
#
# NC (cam:mg_output_fixture, cad/process/mg_output_fixture/cam.py):
# MO01_cross_bore. Program name, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 #2 centre drill, T2 F drill.
title = "Output fixture"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-cutting brass, 7/16 in hex bar (drawing: {{cad.material_spec}})"
stock = "{{process.blank_af_in:fraction}} in hex bar, the {{process.blank_x_in:g}} in piece on hand (at least {{process.bar_length_min_in:.2f}} in): one fixture off its end."
shop = "../shop"
stock_refs = ["c360-hex-7-16"]
material_key = "lathe-c360"
milling_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant, homing, Feed Hold, tool changes, proving a file, burrs); This job
# says what only this fixture needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Finish", "As machined."],
]

[cad]
file = "../../out/features/mg_output_fixture/features.toml"
adapter = "drilled_block"
part = "mg-output-fixture"

[parameters]
quantity = 1
blank_af_in = 0.4375
# The blank the part is cut from (stock_fit: envelope X, Y, Z): the 4 in
# piece; across its corners and its flats.
blank_x_in = 4.0
blank_y_in = 0.5052
blank_z_in = 0.4375
# Setup 1 faces about .020 off; Setup 2 needs the bar on the parallels past
# the part: 4 in less the facing is plenty. The shortest bar the recipe
# accepts (cam.py: past the parallels' left ends by an inch).
bar_length_min_in = 3.9
bar_length_min_mm = 99.06
# Lathe stick-out, Setups 1 and 3: the spigot and the hex the tools reach,
# and in Setup 3 the .72 part, the P1 blade's width and .17 to the jaws;
# under 3 × the groove root's Ø.33 (prechips lathe_holding, unsupported).
stickout_in = 0.95
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in);
# the kerf the bar loses, with its wander.
blade_width_in = 0.0625
part_kerf_in = 0.075
# Turning: shop settings.lathe-ar-c360 (sourced there).
# The groove: the groover's half width, its record's R.024 nose (.048
# wide; a stock 3/64 nose is .0469). Op 40 mikes the tool and sets the DRO
# to half its reading with its chuck-side flank on the face, so the DRO
# reads its arc's centre; this is the figure the op quotes.
form_half_width_in = 0.024
# Setup 2, MO01 (cam.py recomputes the ones it can):
# Spot: the #2 centre drill to Ø.180 on the top corner, under the F drill
# and its 3/16 body (as the clamp's corner spot).
corner_spot_dia_mm = 4.572
# The F drill's full diameter this far past the lower corner, into air.
cross_drill_past_mm = 1.0
# Holding (shop workholding.vise-pm-6, fixtures.parallels-lms-6745): two 1
# in parallels, 1/8 in thick, one against each jaw; the bar's lower diagonal
# flats on their inner top edges, the gap between them 7/16 − 2 × 1/8.
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The spigot face .50 in out past the jaws' left side: the edge finder's
# Ø.200 tip and its Ø.500 shank clear the jaws on the spigot face and both
# sides of the spigot. The bore (.49 from the face) is then at the jaws'
# side, the bar gripped from there on.
jaw_side_from_face_mm = 12.7
# The parallels' left ends .75 in from the spigot face: 3.3 mm clear of the
# F drill's edge, so it exits into air.
cross_parallel_start_mm = 19.05
# The jaw tops above the parallels' tops (jaw height less the parallels);
# the jaw tops above the top corner (Z0); the F drill's point below the
# parallels' tops (the lower corner 1.375 below them, its 1.961 point and
# cross_drill_past_mm). cam.py checks each.
cross_grip_mm = 19.5453
cross_jaw_top_mm = 8.0885
cross_tip_height_mm = -4.336
# The part's length the recipe reads from the export (free end to spigot
# face): the part-off length.
part_length_mm = 18.288
# Machine-capacity inputs (mm): tool lengths from spindle nose to tip.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# ASME B94.11M jobber lengths, overall: F 4-1/8 in; the #2 combined drill
# and countersink 1-7/8 in.
drill_f_oal_mm = 104.775
centre_drill_oal_mm = 47.625
# The top corner above the parallels' tops (cam.py's corner_top).
cross_top_height_mm = 11.4568
# Feeds the program runs, the shop settings' (mg.toml settings.fixture-*):
# centre drill 2800 rpm × .001 in/rev = 2.8 in/min; F 2400 × .004 = 9.6 in/min.
spot_feed_per_min_mm = 71.12
drill_f_feed_per_min_mm = 243.84

