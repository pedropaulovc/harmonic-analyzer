<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 8, MB06: the #7 tap drill through the neck at the tap's centre. Looking at the moving jaw, 4 px/mm, as the tap's picture. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 8 (MB06_nose): the #7 tap drill through the neck, past O into air</text>
  <rect class="fixture-support" x="40" y="300" width="160" height="80"/>
  <!-- The jaws, in front of the part, as an outline: their tops
       upright_grip_mm 19.545 above the parallels' top. -->
  <line class="hidden" x1="40" y1="221.8" x2="200" y2="221.8"/>
  <text class="label" x="30" y="215">jaw tops (outline), {{process.upright_grip_mm:in.3dot}} grip</text>
  <line class="hidden" x1="200" y1="221.8" x2="200" y2="380"/>
  <line class="datum" x1="200" y1="240" x2="200" y2="392"/>
  <text class="label" x="206" y="392">jaws' right side</text>
  <line class="leader" x1="120" y1="340" x2="120" y2="345"/>
  <text class="label-halo" x="60" y="345">1 in parallels</text>
  <path class="part-kept" d="M40 250 H254.2 A22 22 0 0 1 254.2 300 H40 Z"/>
  <line class="centre-line" x1="254.2" y1="140" x2="254.2" y2="330"/>
  <!-- The #7 drill to scale (cutter_dia_mm 5.1054 = 20.4 px), its full
       diameter tap_drill_past_mm 1.0 below O, its 118 deg point at
       tap_tip_z_mm -2.534; drawn short to a break line (its length out of
       the chuck is not on record; drill_7_oal_mm 92.075 is its whole
       length). The centre drill's spot under it is not drawn. -->
  <path class="cutter" d="M264.4 150.0L264.4 304.0L254.2 310.1L244.0 304.0L244.0 150.0L247.4 147.0L250.8 150.0L254.2 147.0L257.6 150.0L261.0 147.0Z"/>
  <line class="arrow" x1="225" y1="160" x2="225" y2="195"/>
  <text class="label" x="290" y="200">#7 drill, to scale, one plunge through the neck:</text>
  <text class="label" x="290" y="216">its full diameter {{process.tap_drill_past_mm:in.3dot}} past O, nothing under the nose</text>
  <text class="label" x="290" y="232">X {{cad.lever_tap_height_mm:.3f}}, Y −{{cad.lever_tap_lateral_mm:.3f}} mm</text>
  <circle class="datum" cx="200" cy="300" r="3.5"/>
  <text class="datum-label" x="290" y="330">Z0 the parallels' top (O)</text>
</svg>
