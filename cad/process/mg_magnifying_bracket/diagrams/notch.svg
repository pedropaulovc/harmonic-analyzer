<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 4: lying across the jaws on the stacks, L down, the seat on the fixed jaw, a rod at the sawn end; MB03 faces H and mills the notch's upper half. Left: from above, 2.3 px/mm; right: a section through the notch, 4 px/mm. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 4 (MB03_notch): H, then the notch's upper half</text>
  <rect class="clamp" x="60" y="40" width="205" height="20"/>
  <text class="label-on-clamp" x="162.4" y="55" text-anchor="middle">fixed jaw</text>
  <rect class="part-kept" x="100" y="60" width="124.8" height="279.2"/>
  <rect class="part-removed" x="129.9" y="67.3" width="94.9" height="245.7"/>
  <rect class="holes" x="201.1" y="60" width="6" height="9.6"/>
  <rect class="holes" x="169.6" y="60" width="6" height="9.6"/>
  <circle class="part-rest" cx="162.4" cy="346.5" r="7.3"/>
  <rect class="clamp" x="60" y="353.8" width="205" height="20"/>
  <text class="label-on-clamp" x="162.4" y="368.8" text-anchor="middle">moving jaw</text>
  <circle class="datum" cx="100" cy="60" r="3.5"/>
  <text class="datum-label" x="20" y="80">X0 O, Y0</text>
  <text class="datum-label" x="20" y="96">the seat</text>
  <line class="leader" x1="160" y1="200" x2="280" y2="120"/>
  <circle class="leader-dot" cx="160" cy="200" r="2"/>
  <text class="label" x="280" y="116">the notch, open at F (right)</text>
  <line class="leader" x1="129.9" y1="250" x2="280" y2="250"/>
  <circle class="leader-dot" cx="129.9" cy="250" r="2"/>
  <text class="label" x="280" y="254">the neck's wall, {{process.neck_stock_mm:in.3dot}} full</text>
  <line class="leader" x1="190" y1="67.3" x2="280" y2="80"/>
  <circle class="leader-dot" cx="190" cy="67.3" r="2"/>
  <text class="label" x="280" y="84">foot's underside: last a climb pass</text>
  <line class="leader" x1="162.4" y1="346.5" x2="280" y2="346.5"/>
  <circle class="leader-dot" cx="162.4" cy="346.5" r="2"/>
  <text class="label" x="280" y="350.5">the rod, at the sawn end</text>
  <text class="label" x="470" y="230">Section through the notch:</text>
  <rect class="part-kept" x="470" y="279.2" width="217" height="50.8"/>
  <rect class="part-removed" x="470" y="279.2" width="217" height="3.2"/>
  <rect class="part-removed" x="522" y="282.4" width="165" height="22.6"/>
  <line class="active-face" x1="470" y1="282.4" x2="687" y2="282.4"/>
  <line class="hidden" x1="470" y1="330" x2="687" y2="330"/>
  <text class="label" x="470" y="350">O</text>
  <text class="label" x="680" y="350">F</text>
  <text class="label" x="470" y="270">H at Z {{process.high_level_mm:in.4dot}}</text>
  <text class="label" x="530" y="322">floor Z {{process.notch_split_mm:in.3dot}}</text>
  <text class="datum-label" x="470" y="380">Z0 the stacks' top (L)</text>
</svg>
