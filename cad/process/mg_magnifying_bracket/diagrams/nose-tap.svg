<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 8, MB07: the 1/4-20 tap in the T-handle wrench under the spring tap guide, spindle off. Looking at the moving jaw, 4 px/mm. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 8 (MB07_lever_tap): tap 1/4-20 by hand under the tap guide</text>
  <rect class="fixture-support" x="40" y="300" width="160" height="80"/>
  <line class="hidden" x1="40" y1="272.6" x2="200" y2="272.6"/>
  <text class="label" x="40" y="266">jaw tops</text>
  <line class="datum" x1="200" y1="240" x2="200" y2="390"/>
  <text class="label" x="206" y="390">jaws' right side</text>
  <path class="part-kept" d="M40 250 H254.2 A22 22 0 0 1 254.2 300 H40 Z"/>
