<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 7: on edge on the stacks, O down, the foot past the jaws' left side; MB05 faces the neck to its thickness and squares the inside corner under the foot. Looking at the moving jaw (H toward you), 2.5 px/mm. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 7 (MB05_neck): the neck to thickness; the square inside corner</text>
  <rect class="fixture-vise" x="112.9" y="395.3" width="396.7" height="4.7"/>
  <rect class="fixture-support" x="144.7" y="300" width="254" height="95.3"/>
  <line class="hidden" x1="112.9" y1="282.9" x2="509.6" y2="282.9"/>
  <line class="hidden" x1="112.9" y1="282.9" x2="112.9" y2="395.3"/>
  <text class="label" x="532" y="287">the jaws (outline, in front): their tops,</text>
  <text class="label" x="532" y="303">{{process.lying_grip_mm:in.3dot}} gripped; L at the fixed jaw</text>
  <line class="leader" x1="300" y1="360" x2="532" y2="370"/>
  <circle class="leader-dot" cx="300" cy="360" r="2"/>
  <text class="label" x="536" y="374">1 in + 1/2 in stacks against each jaw</text>
  <path class="part-kept" d="M100 164.4 H107.9 V268.75 H360.4 V300 H100 Z"/>
  <rect class="part-removed" x="107.9" y="267.5" width="252.5" height="1.25"/>
  <path class="part-removed" d="M107.9 251.6 V267.5 H123.8 A15.9 15.9 0 0 1 107.9 251.6 Z"/>
  <rect class="fixture-support" x="466.7" y="259.7" width="42.9" height="135.6"/>
  <line class="leader" x1="488" y1="336" x2="532" y2="336"/>
  <circle class="leader-dot" cx="488" cy="336" r="2"/>
  <text class="label" x="532" y="332">the offcut on the bed,</text>
  <text class="label" x="532" y="348">F to O up</text>
  <!-- The 1/2 in end mill to scale (face_cutter_dia_mm 12.7 = 31.75 px at
       2.5 px/mm), neck_mill_projection_min_mm 46.99 (117.5 px) out of the
       collet, on MB05's last level (the neck's face) at the end of a pass,
       X 9.525: its side on the foot's underside. Square end drawn as the
       near half of the end face, 12 % deep. The collet is yellow (it turns
       with the cutter) and schematic: its size is not on record. -->
  <path class="cutter" d="M139.7 264.9L139.7 151.2L107.9 151.2L107.9 264.9A15.9 3.8 0 0 0 139.7 264.9Z"/>
  <rect class="cutter" x="96" y="121" width="55.4" height="30.25"/>
  <line class="arrow" x1="180" y1="200" x2="145" y2="200"/>
  <line class="leader" x1="151.4" y1="128" x2="250" y2="114"/>
  <circle class="leader-dot" cx="151.4" cy="128" r="2"/>
  <text class="label" x="254" y="118">the collet: the end mill {{process.neck_mill_projection_min_mm:in.2dot}}–2.00 out, so it passes above the foot</text>
  <circle class="datum" cx="100" cy="300" r="3.5"/>
  <text class="datum-label" x="20" y="320">X0 the seat</text>
  <text class="datum-label" x="20" y="336">Z0 the stacks (O)</text>
  <line class="leader" x1="300" y1="268.75" x2="420" y2="230"/>
  <circle class="leader-dot" cx="300" cy="268.75" r="2"/>
  <text class="label" x="420" y="226">the neck's face: Z {{cad.neck_inner_face_thickness_mm:in.4dot}} ({{process.neck_level_mm:in.3dot}} levels)</text>
  <line class="leader" x1="112" y1="262" x2="200" y2="150"/>
  <circle class="leader-dot" cx="112" cy="262" r="2"/>
  <text class="label" x="200" y="146">MB03's R.25 off: the end mill's square corner</text>
  <text class="label" x="200" y="162">under the foot (R.040 max), a pass along it each level</text>
  <line class="leader" x1="102" y1="175" x2="60" y2="108"/>
  <circle class="leader-dot" cx="102" cy="175" r="2"/>
  <text class="label" x="20" y="86">the foot, past the jaws' left side,</text>
  <text class="label" x="20" y="102">its underside {{process.foot_jaw_clear_mm:in.3dot}} outside it</text>
</svg>
