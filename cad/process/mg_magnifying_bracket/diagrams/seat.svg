<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 3: upright on the vise bed, a sawn end up; MB02 faces the seat, spots and drills the two #37 holes down through the foot. Left: 2 px/mm looking along the jaws from the right end; right: the seat from above, 3 px/mm. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 3 (MB02_seat): the seat, then the two #37 holes down from it</text>
  <rect class="fixture-vise" x="40" y="385" width="200" height="12"/>
  <rect class="clamp" x="77" y="295.1" width="60" height="89.9"/>
  <rect class="clamp" x="162.4" y="295.1" width="60" height="89.9"/>
  <text class="label-on-clamp" x="107" y="312" text-anchor="middle">moving</text>
  <text class="label-on-clamp" x="192.4" y="312" text-anchor="middle">fixed</text>
  <rect class="part-arriving" x="137" y="141.2" width="25.4" height="243.8"/>
  <rect class="part-kept" x="137" y="144.2" width="25.4" height="240.8"/>
  <rect class="part-removed" x="137" y="141.2" width="25.4" height="3"/>
  <line class="active-face" x1="137" y1="144.2" x2="162.4" y2="144.2"/>
  <line class="hidden" x1="137" y1="150.5" x2="162.4" y2="150.5"/>
  <!-- The 1/2 in end mill to scale (face_cutter_dia_mm 12.7 = 25.4 px at
       2 px/mm), half_mill_projection_mm 28.45 (57 px) out of the collet, on
       MB02's seat skim (one level, Z0) on its pass at Y -6.977 (cutter
       centre), the pass least past the blank's sides. Square end drawn as
       the near half of the end face, 12 % deep. The collet is not drawn (its
       size is not on record). The #37 holes: their own op's picture. -->
  <path class="cutter" d="M161.1 141.2L161.1 87.3L135.7 87.3L135.7 141.2A12.7 3.0 0 0 0 161.1 141.2Z"/>
  <line class="leader" x1="148.4" y1="100" x2="250" y2="64"/>
  <circle class="leader-dot" cx="148.4" cy="100" r="2"/>
  <text class="label" x="250" y="60">1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} out of the collet</text>
  <line class="leader" x1="160" y1="144.2" x2="250" y2="100"/>
  <circle class="leader-dot" cx="160" cy="144.2" r="2"/>
  <text class="label" x="250" y="96">the seat: {{process.seat_skim_mm:in.3dot}} off the sawn end; Z0</text>
  <line class="leader" x1="160" y1="150.5" x2="250" y2="122"/>
  <circle class="leader-dot" cx="160" cy="150.5" r="2"/>
  <text class="label" x="250" y="126">the foot's underside {{cad.foot_underside_thickness_in:.3dot}} down; the #37</text>
  <text class="label" x="250" y="142">runs {{process.mount_drill_past_mm:in.3dot}} past it into the notch's waste</text>
  <text class="label" x="250" y="300">jaw tops: the lower {{process.vise_jaw_height_mm:in.2dot}} gripped</text>
  <text class="label" x="250" y="380">on the vise bed, no parallels</text>
  <text class="label" x="470" y="186">The seat from above:</text>
  <rect class="part-kept" x="470" y="210" width="162.8" height="38.1"/>
  <line class="datum" x1="632.8" y1="204" x2="632.8" y2="254.1"/>
  <text class="datum-label" x="638.8" y="252.1">X0: F</text>
  <line class="datum" x1="464" y1="210" x2="638.8" y2="210"/>
  <text class="datum-label" x="470" y="203">Y0: the fixed jaw (L)</text>
  <circle class="holes" cx="605.8" cy="229.9" r="4"/>
  <circle class="holes" cx="564.7" cy="229.9" r="4"/>
  <!-- The same end mill, the same place: mid-way along its pass (X -27),
       passing +X. -->
  <circle class="cutter" cx="551.8" cy="230.9" r="19.05"/>
  <line class="arrow" x1="574" y1="244" x2="598" y2="244"/>
  <text class="label" x="464" y="230" text-anchor="end">O</text>
  <text class="label" x="470" y="274">holes {{cad.mounting_hole_1_station_in:.3dot}} and {{cad.mounting_hole_2_station_in:.3dot}} from F,</text>
  <text class="label" x="470" y="290">{{cad.mounting_hole_1_lateral_in:.3dot}} from L once L is faced</text>
  <text class="label" x="470" y="330">Looking along the jaws from the right end:</text>
  <text class="label" x="470" y="346">L at the fixed jaw, on your right.</text>
</svg>
