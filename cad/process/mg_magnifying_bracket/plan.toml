[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 1/2 × 2-1/4 in flat bar flat in the saw's vise, its long end in the jaws, with one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end, the saw kerf beside it." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar's thickness at three places along the blank's length, and calipers across its width."
feed = "hand"
inspection = "Thickness {{process.bar_thickness_min_in:.3dot}}–{{process.bar_thickness_max_in:.3dot}} everywhere (micrometers); width {{process.bar_width_min_in:.3dot}}–{{process.bar_width_max_in:.3dot}} (calipers). Every program assumes this bar."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.bar_thickness_min_mm}}", "{{process.bar_thickness_max_mm}}"] },
  { gauge = "calipers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] },
]

[[setups.operations]]
steps = [
  { kind = "stop", text = "Thickness or width outside its band: stop and tell the owner." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the bar, square, the bar flat in the saw's vise. File the burr off both ends and the four long edges so the blank seats flat on the parallels. Mark one long edge O with marking fluid (the outer face: it is never cut, so keep it free of dings)."
feed = "hand"
inspection = "The blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers: MB01's passes and the offcut spacer of Setups 7 and 8 are laid out for it."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
instruction = "Shorter: saw another blank. Longer: saw it back into the band."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Free end F: the foot's length"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel against each jaw. The blank on edge on them along the jaws, O DOWN, gripped on its two flat faces, centred on the jaws; the edge up becomes the free end F. Tap it down onto both parallels while closing the vise. The lower {{process.upright_grip_mm:in.3dot}} of it is in the jaws."
datum = "Program MB01_width (cam:mg_magnifying_bracket). G54: X0 the blank's LEFT end, Y0 the fixed jaw's face, Z0 the parallels' top (O); +Y toward the fixed jaw. The file starts with an M6 for the end mill."
diagram = { file = "diagrams/width.svg", alt = "The blank on edge on a 1 in parallel against each jaw, O down; the 1/2 in end mill, to scale, on its first level and on the pass least past the blank's sides, faces the upper edge down to the foot's length in levels; it becomes F." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.bar_thickness_max_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.bar_width_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.outer_face_length_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.bar_thickness_max_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.bar_width_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_blank_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = [0, "{{process.blank_length_max_mm}}"], section_mm = { y = "{{process.bar_thickness_min_mm}}", z = "{{process.bar_width_min_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before loading the blank, G54 Z0: the parallels' top, touched with the end mill on the fixed-jaw parallel, the jaws open."
instruction_detailed = "Before loading the blank, the parallels in and the jaws open: console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet). Jog it over the fixed-jaw parallel, its edge clear of the jaw. Spindle stopped, its tip just dragging a .002 feeler leaf on the parallel: G10 L20 P1 Z0.051. Raise Z."
feed = "hand"

[[setups.operations]]
instruction = "Load and clamp the blank (Holding). G54 X0 the blank's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Load and clamp the blank (Holding). Edge finder (900 rpm): on the fixed jaw's face beside the blank, its tip .10 below the jaw top, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, its tip .10 below the blank's top, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MB01_width (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): face the top edge down to Z {{cad.outer_face_length_mm:in.4dot}} in equal levels of {{process.width_level_mm:in.3dot}}, in passes along the blank no wider than {{process.skim_stepover_max_mm:in.3dot}}. Unclamp; calipers across it. Mark this edge F."
settings = "em-half-carbide-1018-3439-face"
inspection = "Length {{cad.outer_face_length_min_in:.3dot}}–{{cad.outer_face_length_max_in:.3dot}}, O to F, calipers at both ends."
