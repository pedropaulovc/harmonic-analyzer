# Magnifying bracket MHA-MG-01 (qty 1), routed for the CNC mill (the agent's
# route for speed, owner order 2026-11-21: NC programs and travelers for every
# made part; the owner corrects it afterwards). One blank of 1/2 x 2-1/4 in
# 1018 cold-finished flat (stock.1018-flat-1-2x2-1-4, the 19 in bar it shares
# with three DT parts), sawn 4.75-4.80 long: the bar's length runs along the
# neck, its 2-1/4 width across the foot (the 2.14 length, free end F to the
# outer face O), its 1/2 thickness becomes the .43 width (low side L to high
# side H). One as-bought edge stays as O; the other is faced to F. L and H
# are both faced, so every long edge of the finished part is a milled one.
#
# Route: saw; Setup 2 on edge on the 1 in parallels, face the upper edge to
# the foot's length (F) (MB01); Setup 3 upright on the vise bed, face the
# seat and drill the two #37 mounting holes down from it, through the foot
# into the notch's waste (MB02); Setup 4 lying on the 1 in + 1/2 in stacks,
# gripped across its length (the seat on the fixed jaw, a rod on the sawn
# end): face H, then mill half the notch's depth between the foot and the
# neck, open at F, the neck's wall left .020 full (MB03); Setup 5 H down:
# face L to the width and mill the notch's other half through to MB03's,
# so no thin skin is ever cut (MB04); saw the nose waste off (the offcut is the spacer
# of the next two setups); Setup 7 on edge on the stacks, the foot past the
# jaws' left side: face the neck to its thickness and cut the inside
# corner under the foot (MB05: the title block's INSIDE CORNERS R.040 MAX;
# MB03's cutter left its R.25 there); Setup 8 on edge on the 1 in parallels,
# the nose past the jaws' right side: profile the nose R.217 and drill #7
# through (MB06), tap 1/4-20 by hand under the spring tap guide (MB07);
# bench deburr and inspect; blue with Oxpho-Blue.
#
# Finish: the drawing's "blued" is Brownells Oxpho-Blue, on hand
# (cad/config/shop-equipment/ consumables.oxpho-blue: owner 2026-11-17, "i
# have oxpho blue"), applied by its maker's instruction sheet 076-200-546
# ("To Re-Blue Entire Gun", steps 1-7); decision relayed by CncBlockD for
# slug block-d. Gloves and glasses are to buy
# (consumables.chemical-gloves-eye-protection, to_order), as are the #0
# steel wool, alcohol and cotton swabs the sheet names (none on record).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner,
# Pedro, answered in person 2026-11-21: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher): its
# spring-loaded point seats in the T-handle wrench's centre hole and follows
# the tap down, spindle off. FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (MB07).
#
# Zeroing: every X/Y zero the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), every Z zero a tool on a .002
# feeler leaf, as the pivot bracket's plan does.
#
# NC (cam:mg_magnifying_bracket, cad/process/mg_magnifying_bracket/cam.py):
# MB01_width, MB02_seat, MB03_notch, MB04_low, MB05_neck, MB06_nose,
# MB07_lever_tap. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #37,
# T4 #7, T5 the tap guide (the tap is turned by hand).
title = "Magnifying bracket"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/2 × 2-1/4 in flat (the drawing's MATERIAL: {{cad.material_name}}; the part's spec: {{cad.material_spec}})"
stock = "1/2 × 2-1/4 in flat bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank."
shop = "../shop"
stock_refs = ["1018-flat-1-2x2-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

# The shop's standing page carries what every traveler shares (units, speeds,
# homing, Feed Hold, tool changes, proving a file, burrs); This job says what
# only this bracket needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Finished", "{{cad.outer_face_length_min_in:.2dot}}–{{cad.outer_face_length_max_in:.2dot}} long (F to O), {{cad.high_side_width_min_in:.2dot}}–{{cad.high_side_width_max_in:.2dot}} wide (L to H); the neck {{cad.neck_inner_face_thickness_min_in:.2dot}}–{{cad.neck_inner_face_thickness_max_in:.2dot}} thick, the foot {{cad.foot_underside_thickness_min_in:.3dot}}–{{cad.foot_underside_thickness_max_in:.3dot}}."],
]

[cad]
file = "../../out/features/mg_magnifying_bracket/features.toml"
adapter = "drilled_block"
part = "mg-magnifying-bracket"

[parameters]
quantity = 1
# The bar (stock.1018-flat-1-2x2-1-4, 1/2 × 2-1/4 in cold-finished) and the
# blank the programs are posted for: 4.75-4.80 in sawn (the seat skim, the
# 3.92 part, the nose's saw allowance and kerf, the notch's end and at least
# waste_min_mm of waste for the jaws). Cold-finished flat is held to about
# ±.005 here: the saw setup gates the thickness and the width.
bar_thickness_min_in = 0.495
bar_thickness_max_in = 0.505
bar_thickness_min_mm = 12.573
bar_thickness_max_mm = 12.827
bar_width_min_in = 2.245
bar_width_max_in = 2.255
bar_width_min_mm = 57.023
bar_width_max_mm = 57.277
blank_length_min_in = 4.75
blank_length_max_in = 4.80
blank_length_min_mm = 120.65
blank_length_max_mm = 121.92
kerf_in = 0.125
waste_min_mm = 10.0
# stock_fit (prechips drilled_block): the blank along the model axes, X the
# foot's length (the bar's width), Y the width (the bar's thickness), Z the
# height (the blank's length, the shortest).
blank_x_in = 2.25
blank_y_in = 0.5
blank_z_in = 4.75
# Skims (author's choice): the seat .020 off the sawn end; L .035 off the bar
# face, H to high_level_mm above the stacks (L's skim plus the width), so H
# takes .027-.037. O is not cut.
seat_skim_mm = 0.508
low_skim_mm = 0.889
high_level_mm = 11.889
face_step_max_mm = 1.27
# F (MB01): faced from the widest bar to the foot's length in equal levels.
width_level_mm = 1.009
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2). F
# (MB01) and the seat (MB02) in equal passes no wider than
# skim_stepover_max_mm, 6.4 mm (.252 in), and levels no deeper than .050:
# the measured face envelope, shop settings.em-half-carbide-1018-3439-face
# (dechatter session of 2026-11-23, #3439: stable at 1.27 mm deep to 6.4 mm
# wide, 2420-2490 rpm in the cut, conventional; the zigzag's return passes
# climb, and that half is not measured); three passes of 4.44 mm across the
# 1/2 in bar (two would need 6.66, over the limit), and each level starts
# with the cutter over the edge, so no pass takes more than the stepover. H, L and the neck (MB03-MB05) keep passes no
# wider than .200 in, under half the cutter, on the chart setting
# (settings.endmill-carbide-3fl-1-2-1018-cf): those programs also cut the
# notch, whose stepovers run full width, and MB05 runs at a longer stick-out.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.08
skim_stepover_max_mm = 6.4
# The notch: half its depth from H (MB03, L down: down to notch_split_mm
# above the stacks), the other half from L once L is faced (MB04, H down:
# down to notch_through_mm, notch_past_mm through MB03's floor), so no thin
# skin is ever cut; each in equal levels no deeper than notch_level_max_mm
# (.10 in). Each level: one ramp along the first station (beside F) from the
# waste line down to the foot's line and back, then zigzag passes along the
# part at stations notch_step_mm apart stepping in to the neck's wall
# station (the neck left neck_stock_mm full for MB05), back along the waste
# line. The notch ends notch_end_mm from the seat (the waste the moving jaw
# grips lies beyond). The stepovers at the foot's line sweep it between
# alternate stations; the cusps between the others (at most
# foot_wall_woc_mm) come off in one full-depth climb pass along the foot's
# underside in each setup.
notch_past_mm = 0.254
notch_split_mm = 6.262
notch_through_mm = 5.373
notch_level_max_mm = 2.54
notch_level_mm = 1.876
neck_stock_mm = 0.5
notch_end_mm = 110.0
notch_step_mm = 4.583
foot_wall_woc_mm = 0.428
# The nose waste (bench saw): sawn nose_cut_in from the seat, ±
# nose_cut_tol_in, so the part is part_length_min_mm–part_length_max_mm long
# and its kerf stays short of the notch's end.
nose_cut_in = 4.04
nose_cut_tol_in = 0.06
part_length_min_mm = 101.092
part_length_max_mm = 104.14
# The neck (MB05): from MB03's corner radius top (the neck's stock plus the
# cutter's radius above the finished face) down to the neck in equal levels
# no deeper than neck_level_max_mm (.150), each in zigzag passes along the
# neck to the foot's station (the cutter's edge on the underside), entered
# from beside the part over the fixed jaw.
neck_level_max_mm = 3.81
neck_level_mm = 3.425
# The unloaded inside X-root under the foot: governed by the title block's
# INSIDE CORNERS R.040 MAX and modelled at 2x edge_break_r (.020 in = 0.508 mm,
# mg_magnifying_bracket_spec.py INSIDE_ROOT_R) so .015-.020 in corner-radius
# cutters cover every steel pass (#3742).
inside_root_model_r_mm = 0.508
# The nose (MB06): profiled round the R.217 with the end mill's side, climb
# (G2), through the neck and nose_past_mm below O: two rough levels .020 off
# the radius, then one finish pass at full depth. The rough pass's widest cut
# is the longest part's corner. The leads run nose_lead_mm along each side;
# the jaws' right side stands nose_jaw_back_mm back from the nose's centre,
# so the cutter keeps nose_jaw_clear_mm off it.
nose_past_mm = 1.0
nose_depth_mm = 13.5
nose_rough_level_mm = 6.75
nose_finish_stock_mm = 0.508
nose_rough_woc_mm = 5.478
nose_lead_mm = 1.0
nose_jaw_clear_mm = 2.0
nose_jaw_back_mm = 9.35
# The same jaw side measured from the seat (the part is placed before the
# nose's centre exists): lever_tap_height_mm − nose_jaw_back_mm.
nose_jaw_side_mm = 84.707
# Spots with the #2 centre drill, each under its drill (no chamfer at the
# mouth): Ø.090 under the #37, Ø.180 under the #7.
mount_spot_dia_mm = 2.286
tap_spot_dia_mm = 4.572
# Mounting holes (MB02): the #37 from the seat, one plunge (L/D 1.2), its
# full diameter mount_drill_past_mm past the foot's underside into the
# notch's waste; its point then at mount_tip_z_mm (Z0 the seat).
mount_drill_past_mm = 1.0
mount_tip_z_mm = -4.969
# MB02 posts the holes at Y −mount_y_mm: .226 from L plus the .035 Setup 5
# later faces off L.
mount_y_mm = 6.639
# Tap drill (MB06): the #7 through the neck from its inner face, one plunge
# (L/D 2.4), full diameter tap_drill_past_mm below O; its point at
# tap_tip_z_mm (Z0 the parallels, O).
tap_drill_past_mm = 1.0
tap_tip_z_mm = -2.534
# Hand tap (MB07): the plug tap's 5-thread lead (5 × .050) past O at the
# thread's major diameter; at most tap_overrun_max_mm (.50) past O (air: the
# nose stands past the jaws and the parallels). The tap's point to go
# tap_reach_min_mm–tap_reach_max_mm below the neck's face.
tap_overrun_max_mm = 12.7
tap_reach_min_mm = 18.85
tap_reach_max_mm = 25.2
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003
# in/rev, a size between two columns taking the lower one's feed. Centre
# drill 1800 rpm × .001 = 1.8 in/min (the pivot bracket's). #37 (.104): 2200
# rpm (60 ft/min) × .001 = 2.2 in/min. #7 (.201): 1150 rpm (61 ft/min) ×
# .003 = 3.45 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
mount_drill_feed_per_min_mm = 55.88
tap_drill_feed_per_min_mm = 87.63
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): on edge, a 1 in parallel against each jaw; lying, and on edge
# for the neck, the set's 1 in and 1/2 in parallels stacked against each
# jaw (1.5 in), as the column clamp plans stack them; upright, the vise bed.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (on edge) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Centred on the jaws: the ends (jaw width − the length along the jaws)/2 in
# from the jaw sides: the longest blank on edge (MB01), the foot's length
# upright and lying (MB02-MB04).
vise_blank_inset_mm = -18.38
vise_width_inset_mm = -52.21
# MB05: the seat foot_jaw_clear_mm past the underside's line beyond the
# jaws' left side, neck_overhang_mm in all; MB06: the longest part's sawn end
# nose_overhang_mm past the jaws' right side. Both hold the offcut spacer at
# the jaws' other end (it keeps the moving jaw square), standing on the bed,
# F to O up, beyond the supports' ends.
foot_jaw_clear_mm = 2.0
neck_overhang_mm = 5.175
nose_overhang_mm = 19.43
# The rod between the sawn end and the moving jaw (MB03-MB04): a 1/4 in
# round, the shank of the 1/4 in HSS end mill or any 1/4 pin.
rod_dia_mm = 6.35
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall (tools.endmill-carbide-3fl-1-2's
# description): set 1.12 in (28.45 mm) out of the collet (owner, Pedro,
# 2026-11-24: "28.45"), the longer end of the stick-out the measured face
# setting allows (cad/config/shop-equipment/measured-cuts.toml: 27.94 to
# 28.45 mm).
# cam.py checks the collet's nose clears the part and the jaws at each
# program's deepest end-mill cut. MB05 sets it longer (below).
half_mill_projection_mm = 28.45
half_mill_oal_mm = 76.2
# MB05: at the neck's last level the end mill stands beside the foot, which
# rises the part's width above O. Set it at least 1.85 in out, so the collet
# stays above the foot's top: width − neck + 5 mm = 46.75 mm, rounded up to
# .05 in; 1.15 in of the 3 in cutter is still in the collet.
neck_mill_projection_min_mm = 46.99
# Overall lengths: jobber #37 2-1/4 in, #7 3-5/8 in (ASME B94.11M); the #2
# combined drill and countersink 1-7/8 in. Bounded by their whole length
# below the chuck.
drill_37_oal_mm = 57.15
drill_7_oal_mm = 92.075
centre_drill_oal_mm = 47.625
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the 1 in parallels, the foot standing up (the
# foot's length) and the collet gauge: 247.546, rounded down to .01 in; it is
# also the guide-and-tap stack's declared reach in the setup's capacity
# check. The guide is 3 1/8 in (79.375) overall; the tap's reach in its
# wrench is not on record, so the traveler stops before the tap file unless
# the tap, point to the wrench's centre hole, is at most
# tap_wrench_reach_max_mm: 247.396 less 79.375, 168.021, rounded down to .01
# in.
tap_stack_max_mm = 247.396
tap_wrench_reach_max_mm = 167.89

