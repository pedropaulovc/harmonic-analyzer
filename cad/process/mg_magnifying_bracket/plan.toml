instruction = "Before loading the part, G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack, the jaws open. The end mill {{process.neck_mill_projection_min_mm:in.2dot}}–2.00 out of the collet: the collet must pass above the foot's top."
instruction_detailed = "Before loading the part, the stacks in and the jaws open: reset the 1/2 in end mill {{process.neck_mill_projection_min_mm:in.2dot}}–2.00 out of the collet (calipers; the collet then clears the foot's top beside the last pass). Console M6 T1. Jog it over the fixed-jaw stack, its edge clear of the jaw. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051. Raise Z."
feed = "hand"

[[setups.operations]]
instruction = "Load and clamp the part and the offcut (Holding). G54 X0 the seat, Y0 the fixed jaw's face (L): edge finder (900 rpm), on the seat above the foot's underside."
instruction_detailed = "Load and clamp the part and the offcut (Holding). Edge finder (900 rpm): on the fixed jaw's face beside the neck, its tip .10 below the jaw top, G10 L20 P1 Y-2.540; on the seat (the LEFT end) from the left, its tip .50 below the foot's top, G10 L20 P1 X-2.540."
feed = "hand"

# Not chatter-tested (#3428): .151 wide at .135 deep is wider than tested at
# that depth, and the end mill stands 1.85-2.00 out, longer than the 1.10-1.12
# it was tested at. Owner, Pedro, 2026-11-22: "same log new dechatter issues to
# try full radial depth but shallow axial".
[[setups.operations]]
instruction = "First part only: this cut at 2650 rpm, the end mill {{process.neck_mill_projection_min_mm:in.2dot}}–2.00 out, has not been chatter-tested on this end mill (owner's test list #3428): the neck {{process.neck_level_mm:in.3dot}} deep x .151 wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MB05_neck (M6 T1; set 2650): face the neck down to Z {{cad.neck_inner_face_thickness_mm:in.4dot}} in {{process.neck_level_mm:in.3dot}} levels, each in passes from the nose end to the foot's underside; the end mill's corner takes off MB03's R.25 there. Unclamp; mic the neck."
settings = "endmill-carbide-3fl-1-2-1018-cf"
inspection = "Neck {{cad.neck_inner_face_thickness_min_in:.3dot}}–{{cad.neck_inner_face_thickness_max_in:.3dot}} thick (O to the inner face), miked by the nose and by the foot. The inside corner R.040 max (no MB03 R.25 left)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.neck_inner_face_thickness_band_mm}}" }]
milling_cuts = [
  { name = "neck", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.neck_level_mm}}", radial_woc_mm = 3.833, traverse_mm = ["{{cad.foot_underside_thickness_mm}}", "{{process.part_length_max_mm}}"] },
]

[[setups.operations]]
instruction = "Over {{cad.neck_inner_face_thickness_max_in:.3dot}}: reclamp as before. Pick up X0 again, edge finder (900 rpm) on the seat (the LEFT end) from the left, its tip .50 below the foot's top: G10 L20 P1 X-2.540. Send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{cad.neck_inner_face_thickness_in:.3dot}}) × 25.4); run MB05_neck again. Under {{cad.neck_inner_face_thickness_min_in:.3dot}}: the part is scrap."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Nose R.217 and the tap drill; tap 1/4-20"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel (4 in long) against each jaw, their right ends at the jaws' right side. The part on edge on them, O DOWN, gripped on L (FIXED jaw) and H, the foot inside the jaws; the nose PAST the jaws' right side, the seat {{process.nose_jaw_side_mm:in.3dot}} from that side (steel rule). The offcut standing on the bed at the jaws' left end, F to O up, a sawn face flush with the jaws' left side, L and H in the jaws. The jaws grip the lower {{process.upright_grip_mm:in.3dot}} of the part."
datum = "Programs MB06_nose and MB07_lever_tap. G54: X0 the seat (the LEFT end), +X toward the nose; Y0 the fixed jaw's face (L), +Y toward it; Z0 the parallels' top (O). The tap at X {{cad.lever_tap_height_mm:.3f}}, Y −{{cad.lever_tap_lateral_mm:.3f}} mm. Every file starts with an M6 for its first tool."
diagram = { file = "diagrams/nose.svg", alt = "From above: the part on edge on two 1 in parallels, O down, the nose standing past the jaws' right side; the 1/2 in end mill, to scale, at the start of the R.217 nose profile round the tap's centre; the tap hole the #7 drills in its own picture." }
envelope = { x_span_mm = ["{{process.part_length_max_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.high_side_width_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 2.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.outer_face_length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.tap_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.high_side_width_mm}}", along_jaws_mm = "{{process.part_length_max_mm}}", part_height_mm = "{{cad.outer_face_length_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["rest", "{{process.nose_overhang_mm}}"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.part_length_max_mm}}"], clamp_mm = [0, 84.707], section_mm = { y = "{{cad.high_side_width_mm}}", z = "{{cad.neck_inner_face_thickness_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before loading the part, G54 Z0: the parallels' top (O), touched with the end mill on the fixed-jaw parallel, the jaws open."
instruction_detailed = "Before loading the part, the parallels in and the jaws open: console M6 T1. Jog it over the fixed-jaw parallel, its edge clear of the jaw. Spindle stopped, its tip just dragging a .002 feeler leaf on the parallel: G10 L20 P1 Z0.051. Raise Z."
feed = "hand"

[[setups.operations]]
instruction = "Load and clamp the part and the offcut (Holding). G54 X0 the seat, Y0 the fixed jaw's face (L): edge finder (900 rpm), on the seat above the jaws."
instruction_detailed = "Load and clamp the part and the offcut (Holding). Edge finder (900 rpm): on the fixed jaw's face beside the nose, its tip .10 below the jaw top, G10 L20 P1 Y-2.540; on the seat (the LEFT end) from the left, its tip .50 below the foot's top (above the jaws), G10 L20 P1 X-2.540."
feed = "hand"

# Not chatter-tested (#3427, #3428): the finish pass is deeper than tested
# and the rough pass wider; both climb. Owner, Pedro, 2026-11-22: "log new
# dechatter issues to try deep axial cuts but with shallow radial depth" and
# "same log new dechatter issues to try full radial depth but shallow
# axial".
[[setups.operations]]
instruction = "First part only: these cuts at 2650 rpm have not been chatter-tested on this end mill (owner's test list #3427, #3428): the nose rough {{process.nose_rough_level_mm:in.3dot}} deep x {{process.nose_rough_woc_mm:in.3dot}} wide, the nose finish {{process.nose_depth_mm:in.3dot}} deep x {{process.nose_finish_stock_mm:in.3dot}} wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run MB06_nose (M6 T1; set 2650): profile the nose R{{cad.nose_radius_in:.3dot}} round the tap's centre, climb: two levels {{process.nose_finish_stock_mm:in.3dot}} off the radius, then one full-depth finish pass on it, {{process.nose_past_mm:in.3dot}} below O."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "nose rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.nose_rough_level_mm}}", radial_woc_mm = "{{process.nose_rough_woc_mm}}", traverse_mm = [84.707, "{{process.part_length_max_mm}}"] },
  { name = "nose finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.nose_depth_mm}}", radial_woc_mm = "{{process.nose_finish_stock_mm}}", traverse_mm = [84.707, "{{cad.nose_overall_height_ref}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the tap Ø{{process.tap_spot_dia_mm:in.3dot}}, under the #7; set 1800."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "tap spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.tap_spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.lever_tap_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-7"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-1-4-20" }
instruction = "Same file, M6 T4: #7 drill down through the neck, one plunge, its full diameter {{process.tap_drill_past_mm:in.3dot}} below O (air: past the parallels); set 1150. Cutting oil. The part stays clamped for the check and the tap."
diagram = { file = "diagrams/nose-drill.svg", alt = "Looking at the moving jaw: the #7 drill, to scale, through the neck at the tap's centre, its full diameter .039 below O into the air past the jaws' right side and the parallels." }
rpm = 1150
feed = "{{process.tap_drill_feed_per_min_mm:in.1f}} in/min"
hole_depth_mm = "{{cad.neck_inner_face_thickness_mm}}"
peck = "none"
milling_cuts = [
  { name = "tap drill", kind = "drill", phase = "finish", cutter_dia_mm = 5.1054, flutes = 2, rpm = 1150, feed_mm_min = "{{process.tap_drill_feed_per_min_mm}}", stations_mm = "{{cad.lever_tap_height_mm}}" },
]

[[setups.operations]]
instruction = "Still clamped: the largest pin gauge that enters the hole, held standing up through it. Mic from the nose's tip over the pin, just above the face; calipers from the seat over it."
inspection = "The hole {{cad.lever_tap_from_tip_min_in:.3dot}}–{{cad.lever_tap_from_tip_max_in:.3dot}} from the tip: the mic reading less half the pin's Ø. The hole {{cad.lever_tap_height_min_in:.2dot}}–{{cad.lever_tap_height_max_in:.2dot}} from the seat: the calipers reading less half the pin's Ø. The nose's R and the hole from L: the program's, one zero."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.lever_tap_from_tip_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.lever_tap_height_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Either reading outside its band: stop and tell the owner with the reading; do not tap." },
]
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the tap file: the 1/4-20 tap in the T-handle wrench (centre hole in its top), point to the centre hole, at most {{process.tap_wrench_reach_max_mm:in.2f}} in (calipers or the 12 in rule)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Over: do not tap on this setup; tell the owner." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run MB07_lever_tap: M6 T5, the tap guide in the 1/2 in collet, pointed end out, spindle off; the file ends Idle at the machine top over the hole."
diagram = { file = "diagrams/nose-tap.svg", alt = "Looking at the moving jaw: the 1/4-20 tap, to scale across, in the nose hole, in the T-handle wrench; the Fisher tap guide's 1/2 in shank in the collet, its 3/16 spring point in the wrench's centre hole; the tap's point to go {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} below the neck's face." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z in inches, the tap's point on the neck's face beside the hole, the guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X80.000 (over the neck, left of the hole), send G20: the DRO reads inches. Stand the tap in its wrench on its point on the neck's face; jog Z down until the guide's point is pushed fully home in the wrench's centre hole. Note the DRO Z. Jog Z up clear, send G21, MDI G0 X94.057 (over the hole), send G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-1-4-20"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, Tapmatic Gold, a half turn back each turn. Read the depth with the guide's point pushed fully home: stop when the DRO Z reads the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}}: the full thread runs out through O."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring holds the tap square and follows it down. Turn the wrench, a half turn back each turn. To read, push the point fully home again: stop at the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}}, the tap's lead out past O."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand; blow the hole out. Unclamp."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bracket from the side and from below: the seat, the foot with its two mounting holes, the neck, the nose with the lever tap, and where each is measured from." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max: smooth file on the outside edges, the scraper from the deburring set on the holes' mouths (no countersink). Leave the inside corner under the foot as cut (R.040 max: the end mill's corner; do not file a radius into it). Stone the seat lightly on a flat stone. Wash off the oil."
feed = "hand"
inspection = "The seat on the surface plate: it does not rock. No burr stands proud, none in the thread's mouth."
gauge_checks = "other"

[[setups.operations]]
instruction = "Inspect the bracket; record the readings."
feed = "hand"
inspection = "Mounting holes: a {{cad.mounting_hole_1_dia_min_in:.3dot}} pin gauge enters each. From F {{cad.mounting_hole_1_station_min_in:.3dot}}–{{cad.mounting_hole_1_station_max_in:.3dot}} and {{cad.mounting_hole_2_station_min_in:.3dot}}–{{cad.mounting_hole_2_station_max_in:.3dot}}, from L {{cad.mounting_hole_1_lateral_min_in:.3dot}}–{{cad.mounting_hole_1_lateral_max_in:.3dot}}: calipers over the pin, less half its Ø (.051). Lever tap: a 1/4-20 screw runs through by hand."
gauge_checks = [
  { gauge = "pin-gauges", band_mm = "{{cad.mounting_hole_1_dia_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.mounting_hole_1_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.mounting_hole_2_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.mounting_hole_1_lateral_band_mm}}" },
]

[[setups.operations]]
steps = [
  { kind = "stop", text = "Any reading outside its band: stop and tell the owner with the reading." },
]
feed = "hand"

[[setups.operations]]
instruction = "In band: go on to the bluing. If it must wait, oil it lightly against rust (the stone lubricant) and bag it; the next setup cleans the oil off."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Blue with Oxpho-Blue (the drawing's blued)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/blue.svg", alt = "The finished bracket, every surface to be blued: the faces, the nose, the mounting holes and the lever tap." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done with Brownells Oxpho-Blue (on hand) by its maker's sheet 076-200-546, \"To Re-Blue Entire Gun\". To buy before this setup: chemical-resistant gloves and safety glasses (on order record), #0 steel wool, denatured alcohol and cotton swabs (none on record)."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and glasses on (the maker: phosphoric acid, cupric sulfate, selenious acid; ventilate). Brighten the faces with the 220 sanding roll, keeping the seat flat; then wipe the bracket clean with alcohol. Hold it by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Soak a thumb-sized cotton swab in Oxpho-Blue and cover the whole bracket, dipping at each pass, into the holes and the thread. A spot that will not darken: #0 steel wool, then the solution again."
feed = "hand"

[[setups.operations]]
instruction = "Let it work 60 seconds without drying, then wipe it nearly dry in one pass with a clean cloth. Fully dry: burnish with #0 steel wool."
feed = "hand"

[[setups.operations]]
instruction = "A thin darker coat: a small damp cotton pad of the solution over it, wipe dry, burnish with the steel wool. Repeat for a darker blue. Then a thin film of the stone lubricant (oil) against rust."
feed = "hand"
inspection = "An even blue all over, no bare spot. A 1/4-20 screw still runs through the tap by hand and the {{cad.mounting_hole_1_dia_min_in:.3dot}} pin into each mounting hole."
gauge_checks = "other"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Tight: stop and tell the owner; do not re-tap or re-drill." },
]
feed = "hand"
