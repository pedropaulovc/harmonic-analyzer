# Gooseneck MHA-SM-01, one off (the summing linkage's gooseneck: 4130-N tube
# bent 90° on an R3 centreline; sm-gooseneck.yaml process: "1/2 in tube bent by
# hand on a simple shop-made grooved form with a tail; then both ends sawn and
# faced, the arm end to the reach and the foot to the overall height").
#
# Route. Setup 1 checks the tube as it arrives and saws the blank, its length
# the developed length plus the ends' allowance (the formed_blank adapter
# binds both); the rest of the 48 in tube (owner ruling 2026-11-22, option A,
# https://github.com/pedropaulovc/harmonic-analyzer/issues/2401#issuecomment-7085840331) checks the form's groove
# and is then the trial bend. Setups 2 to 4 make the bend form
# (fixtures.sm-gooseneck-bend-form; owner ruling
# 2026-11-22, option A: two 6061 plates from the owned 1/2 x 6 in bar, the
# groove cut on the CNC with the owned 1/4 in ball end mill): each plate lies
# on three 1-2-3 blocks under three step clamps (LMS 1268), as the
# MHA-CH-13-TL-01 sub-plate's SP01 does, because the 6 in bar is wider than
# the PM vise opens. GF01_form_a and GF02_form_b (cam:sm_gooseneck,
# cad/process/sm_gooseneck/cam.py) each plunge the two stud holes and cut the
# arc out through the plate with the 1/2 in end mill (T1), then cut the
# groove with the ball end mill (T2): a closed half-round channel along the
# lead that holds the tube's tail, and a quarter cove round the arc's edge.
# Plate B's file is plate A's mirrored, so B turned over onto A closes the
# channel and the cove round the tube. Setup 5 bolts the form through its
# stud holes into a T-slot of the mill table (spindle off: the table is the
# heaviest flat thing in the shop). The trial piece is pulled round it by
# hand to 90° first: no kink, and its springback (90° less the angle read
# after release) is the blank's overbend. Then the blank is pulled to square
# plus that springback, checked off the form with the digital angle gauge
# and bent again until it holds 89–91°. Setup 6 accepts the bend (no kink).
# Setup 7 saws and files both ends to the reach and the height, deburrs,
# polishes and oils.
#
# The bend's acceptance. Springback: J D Squared, "Model 3 Bender
# Directions" (2009, https://support.jd2.com/MiscDown/dl/M3BDirections.pdf):
# "chromemoly tubing will springback roughly twice as far as the exact same
# size and wall thickness of welded seam mild steel tubing", and for mild
# steel "over bend a little ... 3 to 4 degrees should be sufficient": the
# plan allows up to springback_max_deg on the form; the trial bend measures
# it on this tube and this form, and the blank's first pull overbends by
# the trial's figure, then goes on in small steps. Ovality: ASME B31.3
# §332.2.1, the difference between the largest and least outside diameters
# at any section of a bend at most 8% of the nominal O.D. (internal
# pressure; this tube carries none). The sheet prints the O.D. as (Ø.500)
# REF and the bend NO KINKS, with no ovality limit, so the traveler reads
# ovality only as a diagnostic for a kink starting (machinist review r2: as
# acceptance it over-specified the sheet); NO KINKS, checked by eye, is the
# acceptance. A kinked or creased tube is scrap: the plan orders another
# 48 in. A kinked trial stops the bend until the groove and the pull are
# checked and a trial on the piece's other end bends clean.
#
# To order: the tube (stock-to-order.toml stock.4130n-tube-1-2x0065,
# OnlineMetals 7322), the junior hacksaw (tools-hand.toml junior-hacksaw),
# the 48 in steel rule (tools-hand.toml steel-rule-48) and the Barricade oil
# (consumables.toml barricade-birchwood-casey). The form is to make from
# owned bar.
title = "Gooseneck"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
# The only milled material is the bend form's 6061: the tube is bent and
# sawn by hand.
material_key = "6061-t6511"
milling_material = "aluminum_6061"
stock = "Qty {{process.quantity:d}}. 4130-N tube, 48 in (to order, not on hand): one {{process.blank_length_in:.1f}} in blank; the rest checks the bend form, then is the trial bend. The form: two {{process.plate_length_in:.1f}} in lengths of the owned 1/2 x 6 in 6061 bar."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Each CNC file is proved once in air, Z0 raised 1.000 in, before it cuts metal. Tool lengths from the tool setter at each M6; at every M6 stop the file has stopped the spindle and lifted the tool clear of the plate and straps: change the tool, set the speed, Cycle Start. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: do what that setup's Datum says for it; where the Datum says nothing, take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Finish: {{cad.finish}}."
shop = "../shop"
stock_refs = ["4130n-tube-1-2x0065", "6061-flat-1-2x6-54in"]

[cad]
file = "../../out/features/sm_gooseneck/features.toml"
adapter = "formed_blank"
part = "sm-gooseneck"

[parameters]
quantity = 1
# The blank: the developed length plus about 3 in for the ends (the
# adapter's length_allowance): the 2 in tail the form holds, sawn off the
# arm, and about 1 in off the foot.
blank_length_in = 24.6
stock_od_in = 0.5
stock_wall_in = 0.065
# The ends: each saw line stands this much over its end's largest size, for
# the file (the recipe recomputes both lines).
file_stock_mm = 0.508
arm_line_mm = 95.25
foot_line_mm = 502.158
# The bend's ovality limit, ASME B31.3 §332.2.1 (8% of the nominal O.D.; the
# recipe recomputes the limit from the export).
ovality_fraction_max = 0.08
ovality_max_mm = 1.016
# Springback of 4130 bent on the form: J D Squared Model 3 directions, twice
# mild steel's 3 to 4 degrees. The trial bend measures it; over
# springback_max_deg the blank stops: the form allows the bend's widest angle
# plus springback_max_deg.
springback_max_deg = 8.0
wrap_max_deg = 100.0
# --- The bend form (plate A's frame: X0 Y0 the arc's centre, Z0 its top) ---
# The tail the form holds (owner, the fixture record's "a tail"): 2 in.
tube_tail_mm = 50.8
# The plate past the channel's closed end: room for the left clamp.
stop_to_end_mm = 50.8
plate_length_in = 9.0
plate_length_mm = 228.6
plate_width_in = 6.0
plate_thickness_min_in = 0.495
plate_thickness_max_in = 0.505
plate_thickness_min_mm = 12.573
plate_top_max_mm = 12.827
# The groove: .260 radius, .007 over the largest tube's radius, at most .012
# over the least's (the author's snug fit, no source; the recipe checks both).
groove_radius_mm = 6.604
groove_snug_max_mm = 0.3048
# The ball's levels: its centre on a circle about the groove's centre line,
# one level every groove_step_deg round it.
groove_step_deg = 9.0
# The back edge (Y0, the bar's own edge) cuts the arc at this angle above
# its quarter point: the cove runs that far past the farthest departure
# (the recipe checks it against wrap_max_deg).
back_edge_angle_deg = 36.0
# Recomputed by the recipe from the export and the numbers above.
form_back_y_mm = 44.789
tube_stop_x_mm = -62.72
arc_from_end_mm = 113.52
form_section_y_mm = 120.989
# Work-zero entries: the .200 edge finder on plate A's left end and back
# edge; on plate B's right end (the recipe recomputes all three).
x_set_mm = -116.06
x_set_b_mm = 116.06
y_set_mm = 47.329
z_set_mm = 0.051
# The 1/2 in end mill: the arc through in equal levels no deeper than
# slot_step_mm, its tip cutter_tip_below_mm under the thickest plate.
half_cutter_dia_mm = 12.7
slot_step_mm = 3.5
cutter_tip_below_mm = 1.016
outline_level_mm = 3.461
tip_over_underside_mm = -1.27
tool_y_span_mm = 183.99
# Stud holes: two, on a line square to the lead (one T-slot takes both in
# Setup 5), plunged with the 1/2 in end mill in pecks.
stud_hole_x_mm = 44.45
stud_hole_1_y_mm = -25.4
stud_hole_2_y_mm = 19.05
hole_peck_mm = 3.5
# 1250 rpm × 2 × .001 in/tooth = 2.5 in/min, fed axially.
stud_plunge_feed_per_min_mm = 63.5
# The 1/4 in ball end mill: plunged at half the groove's chip load.
ball_cutter_dia_mm = 6.35
ball_plunge_feed_per_min_mm = 156.464
groove_depth_mm = 3.175
# Clamp points, from the plate's left end and back edge as it lies on the
# table (plate B: from its right end).
clamp_left_from_end_mm = 25.4
clamp_left_from_back_mm = 95.25
clamp_mid_from_end_mm = 114.3
clamp_mid_from_back_mm = 44.45
clamp_waste_from_end_mm = 215.9
clamp_waste_from_back_mm = 136.525
# Beam stations from each plate's left end on the table (recomputed).
a_outline_from_mm = 107.17
a_outline_to_mm = 196.07
a_groove_from_mm = 47.625
a_groove_to_mm = 192.895
a_hole_station_mm = 157.97
a_support_left_mm = 25.4
a_support_right_mm = 215.9
b_outline_from_mm = 32.53
b_outline_to_mm = 121.43
b_groove_from_mm = 35.705
b_groove_to_mm = 180.975
b_hole_station_mm = 70.63
b_support_left_mm = 12.7
b_support_right_mm = 203.2
# Machine-capacity inputs (mm): heights above the table, tool lengths from
# the spindle nose to the tip.
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in up.
r8_collet_gauge_mm = 6.3         # As the sub-plate plan (archived LMS 4860).
half_mill_projection_mm = 48.8   # As dechatter v11 measured it (sub-plate SP01).
# The ball 1-1/2 of its 2-1/2 in out (1 in of shank held): with T1's deepest
# cut on the blocks, a shorter ball would need the table above the spindle's
# closest approach (machine capacity pairs the two).
ball_projection_mm = 38.1

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "deburr"
name = "Deburring set"
ref = "deburring-set"

[[tools]]
id = "em-half"
name = "1/2 in HSS end mill"
ref = "basebar-em-half"

[[tools]]
id = "ball"
name = "1/4 in carbide ball end mill"
ref = "ball-endmill-carbide-2fl-1-4"

[[tools]]
id = "form"
name = "Gooseneck bend form"
ref = "sm-gooseneck-bend-form"

[[tools]]
id = "hacksaw"
name = "Junior hacksaw"
ref = "junior-hacksaw"

[[tools]]
id = "file"
name = "8 in smooth file"
ref = "jig-files"

[[tools]]
id = "sanding-roll"
name = "220 grit sanding roll"
ref = "sanding-roll-220"

[[tools]]
id = "oil"
name = "Barricade oil"
ref = "barricade-birchwood-casey"

[[tools]]
id = "digital-angle-gauge"
name = "Digital angle gauge"
ref = "digital-angle-gauge"

# --- Setup 1: the tube -------------------------------------------------------
[[setups]]
machine_kind = "other"
title = "Check the tube; saw the blank"
machine = "Bench / saw"
indexing = "none"
diagram = { file = "diagrams/tube.svg", alt = "The 48 in tube flat in the saw's vise, the blade at the cut: the 24.6 in blank off one end, the rest, about 23 in, kept for the groove checks and the trial bend; where the micrometer reads the O.D. near each end, and the calipers' jaw tips across the wall at one end. To scale along the tube; the vise and blade schematic." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the tube's O.D. 1 in from each end, two readings at each end, 90° apart."
inspection = "Every reading {{cad.blank_od_min_in:.3dot}}–{{cad.blank_od_max_in:.3dot}}, else stop: it is not the tube the sheet calls."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.blank_od_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Caliper the wall at one end: the jaw tips across the wall at four places round it."
inspection = "Every reading {{cad.blank_wall_min_in:.4dot}}–{{cad.blank_wall_max_in:.4dot}}, else stop: it is not the tube the sheet calls."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.blank_wall_band_mm}}" }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.blank_length_in:.1f}} in off one end of the tube (tape measure), the tube flat in the saw's vise. Keep the rest, the trial piece: it checks the form's grooves in Setups 3 and 4, then is the trial bend in Setup 5."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr all four ends (the blank's two and the trial piece's two) inside and out: the tube's ends must slide in the form's channel."
feed = "hand"

# --- Setup 2: the form's plates ----------------------------------------------
[[setups]]
machine_kind = "other"
title = "Saw the form's two plates"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/plates.svg", alt = "The 1/2 x 6 in bar flat on the saw bed, two 9.0 in plates sawn off its end and marked A and B on a broad face." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw two {{process.plate_length_in:.1f}} in lengths off the 1/2 x 6 in bar, flat on the saw bed (tape measure). Mark one A and one B on a broad face: that face goes up on the mill."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr every sawn edge of both plates: they lie flat on the blocks next."
feed = "hand"

[[setups.operations]]
instruction = "Mike each plate's thickness at both ends."
inspection = "Every reading {{process.plate_thickness_min_in:.3dot}}–{{process.plate_thickness_max_in:.3dot}}, else stop: the programs are posted for that band."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.plate_thickness_min_mm}}", "{{process.plate_top_max_mm}}"] }]
feed = "hand"

# --- Setup 3: plate A ---------------------------------------------------------
# One clamping. The form (left of the cut and inside the arc) sits on two
# blocks under two clamps; the waste (the front-right corner, outside the
# arc) on its own block under its own clamp, so both stay held once the arc
# is through. The straps run along X from studs beyond the plate's ends: no
# strap crosses a path the cutters run.
[[setups]]
machine_kind = "other"
title = "CNC mill: bend form plate A"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off. Plate A, its A face up and its back edge toward the column, on three 1-2-3 blocks lying flat (1 in up), one under each step clamp (LMS 1268): left {{process.clamp_left_from_end_mm:in.2f}} in from the left end and {{process.clamp_left_from_back_mm:in.2f}} in from the back edge (block 3 in along X); middle {{process.clamp_mid_from_end_mm:in.2f}} and {{process.clamp_mid_from_back_mm:in.2f}} (block 2 in along X); waste {{process.clamp_waste_from_end_mm:in.2f}} and {{process.clamp_waste_from_back_mm:in.3f}} (block 2 in along X, half under the plate). The left and middle straps from studs beyond the left end, the waste strap from a stud beyond the right end."
datum = "Program GF01_form_a (cam:sm_gooseneck). G54: X0 Y0 the arc's centre, {{process.arc_from_end_mm:in.3f}} in from the left end and {{process.form_back_y_mm:in.3f}} in in front of the back edge; Z0 the plate top. +Y toward the column. Tool lengths from the tool setter at each M6. After any move of the plate, or after homing again (the note says when): touch off X, Y and Z again as this setup's touch-off operation does; once the arc is cut through, the back edge is taken on the form, left of the arc."
diagram = { file = "diagrams/form_a.svg", alt = "Plan of plate A on the table, to scale (2.1 px/mm): three 1-2-3 blocks and three step clamps, two on the form from the left, one on the waste corner from the right; the left end and back edge touched off. The 1/2 in end mill pecking the first stud hole; the arc it cuts next, up the front at X0 and round to the back edge, arrowed; the groove dashed." }
envelope = { x_span_mm = ["{{process.plate_length_mm}}", "{{process.half_cutter_dia_mm}}"], y_span_mm = ["{{process.tool_y_span_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{process.plate_top_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.tip_over_underside_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.ball_projection_mm}}"] }
vise_hold = "other"
# The plate between its left and waste clamps (the blocks only push up), at
# the form's least section once the arc is through, the thinnest plate.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{process.plate_length_mm}}"], supports_mm = ["{{process.a_support_left_mm}}", "{{process.a_support_right_mm}}"], section_mm = { y = "{{process.form_section_y_mm}}", z = "{{process.plate_thickness_min_mm}}" } }

[[setups.operations]]
instruction = "Clamp plate A on its blocks as the setup's holding says, A face up, back edge toward the column; tighten each strap's nut."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} out of the collet). Its tip just dragging a .002 feeler leaf on the plate top: G10 L20 P1 Z{{process.z_set_mm:.3f}}. Edge finder on the left end: G10 L20 P1 X{{process.x_set_mm:.3f}}; on the back edge: G10 L20 P1 Y{{process.y_set_mm:.3f}}."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} out of the collet). Its tip just dragging a .002 feeler leaf on the plate top: G10 L20 P1 Z{{process.z_set_mm:.3f}}. Edge finder (900 rpm): on the left end from the left, 1/2 in behind the front edge, clear of the left block: G10 L20 P1 X{{process.x_set_mm:.3f}}; on the back edge from behind: G10 L20 P1 Y{{process.y_set_mm:.3f}} (entries allow for its .100 radius). Edge finder out."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Prove GF01_form_a in air: console M6 T1 (1/2 in end mill; the tool setter measures it), its tip on the same feeler leaf, G10 L20 P1 Z-25.349 (Z0 1.000 in high). Run the file through, both tools." },
  { kind = "check", text = "Every move clears the three straps; the end mill comes down in front of the plate and behind it, never over the plate but at the stud holes." },
  { kind = "action", text = "Then Z0 back: console M6 T1 (the tool setter measures it); its tip dragging the leaf on the plate top, G10 L20 P1 Z{{process.z_set_mm:.3f}}." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run GF01_form_a (M6 T1, 1/2 in end mill; set 1250). It pecks the two stud holes through first, {{process.hole_peck_mm:in.3dot}} a peck."
rpm = 1250
feed = "{{process.stud_plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "stud holes a", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, rpm = 1250, feed_mm_min = "{{process.stud_plunge_feed_per_min_mm}}", stations_mm = "{{process.a_hole_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop: the arc through, alternate directions, levels {{process.outline_level_mm:in.3dot}}, tip {{process.cutter_tip_below_mm:in.2dot}} under the plate: up the front at X0, round the arc and out past the back edge. The waste comes free on its own clamp after the last level."
settings = "basebar-slot-rough-6061-t6511"
milling_cuts = [
  { name = "form outline", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{process.outline_level_mm}}", radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1250, feed_mm_min = 127.0, traverse_mm = ["{{process.a_outline_from_mm}}", "{{process.a_outline_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Same file, at its M6 T2: the 1/4 in ball end mill, {{process.ball_projection_mm:in.2f}} out of the collet (the tool setter measures it); set 2800. The groove, {{process.groove_radius_mm:in.3dot}} radius: one pass centred on its centre line, then steps round that line: the channel from the tube stop to X0, then the cove round the arc's top edge."
settings = "ball-endmill-carbide-2fl-1-4-6061-t6511"
milling_cuts = [
  { name = "groove", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.ball_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{process.groove_depth_mm}}", radial_woc_mm = "{{process.ball_cutter_dia_mm}}", traverse_mm = ["{{process.a_groove_from_mm}}", "{{process.a_groove_to_mm}}"] },
]
diagram = { file = "diagrams/form_a-groove.svg", alt = "Plan of plate A, to scale: the 1/4 in ball end mill at its first plunge, past the back edge. Its first pass, centred on the groove's centre line, runs round the cove and down the channel to the tube stop; then it steps round that line, each step the other way, the form-side steps along the channel and round the cove, the outer-side steps along the channel only. The arc is through, the waste under its own clamp." }

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Unclamp. Waste aside. Deburr the cut edges and both stud holes; take only the burr off the groove's edges, so its half round meets the face sharp."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Lay the trial piece (Setup 1's rest) in A's channel, its end on the channel's closed end." },
  { kind = "check", text = "It lies down in the channel its full length and does not rock." },
  { kind = "stop", text = "It rides on a ridge or burr: stone the groove's edge and lay it in again. It will not go in at all: stop; the groove is undersize." },
]
feed = "hand"

# --- Setup 4: plate B (plate A mirrored) -------------------------------------
[[setups]]
machine_kind = "other"
title = "CNC mill: bend form plate B"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / table, vise off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As plate A, mirrored: plate B, its B face up and its back edge toward the column, on three 1-2-3 blocks under three step clamps (LMS 1268): the form's clamps {{process.clamp_left_from_end_mm:in.2f}} and {{process.clamp_mid_from_end_mm:in.2f}} in from the right end, from studs beyond the right end; the waste's {{process.clamp_waste_from_end_mm:in.2f}} in from the right end, from a stud beyond the left end. Distances from the back edge as plate A's."
datum = "Program GF02_form_b (cam:sm_gooseneck). G54: X0 Y0 the arc's centre, {{process.arc_from_end_mm:in.3f}} in from the right end and {{process.form_back_y_mm:in.3f}} in in front of the back edge; Z0 the plate top. +Y toward the column. Tool lengths from the tool setter at each M6. After any move of the plate, or after homing again (the note says when): touch off X, Y and Z again as this setup's touch-off operation does; once the arc is cut through, the back edge is taken on the form, right of the arc."
diagram = { file = "diagrams/form_b.svg", alt = "Plan of plate B on the table, to scale (2.1 px/mm), plate A mirrored: the form's two clamps from the right, the waste corner's from the left; the right end and back edge touched off. The 1/2 in end mill pecking the first stud hole; the arc it cuts next, up the front at X0 and round to the left to the back edge, arrowed; the groove dashed." }
envelope = { x_span_mm = ["{{process.plate_length_mm}}", "{{process.half_cutter_dia_mm}}"], y_span_mm = ["{{process.tool_y_span_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{process.plate_top_max_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.tip_over_underside_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.ball_projection_mm}}"] }
vise_hold = "other"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{process.plate_length_mm}}"], supports_mm = ["{{process.b_support_left_mm}}", "{{process.b_support_right_mm}}"], section_mm = { y = "{{process.form_section_y_mm}}", z = "{{process.plate_thickness_min_mm}}" } }

[[setups.operations]]
instruction = "Clamp plate B on its blocks as the setup's holding says, B face up, back edge toward the column; tighten each strap's nut."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} out of the collet). Its tip just dragging a .002 feeler leaf on the plate top: G10 L20 P1 Z{{process.z_set_mm:.3f}}. Edge finder on the right end: G10 L20 P1 X{{process.x_set_b_mm:.3f}}; on the back edge: G10 L20 P1 Y{{process.y_set_mm:.3f}}."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} out of the collet). Its tip just dragging a .002 feeler leaf on the plate top: G10 L20 P1 Z{{process.z_set_mm:.3f}}. Edge finder (900 rpm): on the right end from the right, 1/2 in behind the front edge, clear of the right block: G10 L20 P1 X{{process.x_set_b_mm:.3f}}; on the back edge from behind: G10 L20 P1 Y{{process.y_set_mm:.3f}} (entries allow for its .100 radius). Edge finder out."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Prove GF02_form_b in air: console M6 T1 (1/2 in end mill; the tool setter measures it), its tip on the same feeler leaf, G10 L20 P1 Z-25.349 (Z0 1.000 in high). Run the file through, both tools." },
  { kind = "check", text = "Every move clears the three straps; the end mill comes down in front of the plate and behind it, never over the plate but at the stud holes." },
  { kind = "action", text = "Then Z0 back: console M6 T1 (the tool setter measures it); its tip dragging the leaf on the plate top, G10 L20 P1 Z{{process.z_set_mm:.3f}}." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run GF02_form_b (M6 T1, 1/2 in end mill; set 1250). It pecks the two stud holes through first, {{process.hole_peck_mm:in.3dot}} a peck."
rpm = 1250
feed = "{{process.stud_plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "stud holes b", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, rpm = 1250, feed_mm_min = "{{process.stud_plunge_feed_per_min_mm}}", stations_mm = "{{process.b_hole_station_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop: the arc through, alternate directions, levels {{process.outline_level_mm:in.3dot}}, tip {{process.cutter_tip_below_mm:in.2dot}} under the plate: up the front at X0, round the arc to the left and out past the back edge. The waste comes free on its own clamp after the last level."
settings = "basebar-slot-rough-6061-t6511"
milling_cuts = [
  { name = "form outline b", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{process.outline_level_mm}}", radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1250, feed_mm_min = 127.0, traverse_mm = ["{{process.b_outline_from_mm}}", "{{process.b_outline_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Same file, at its M6 T2: the 1/4 in ball end mill, {{process.ball_projection_mm:in.2f}} out of the collet; set 2800. The groove as plate A's, mirrored: the channel from the tube stop at the right to X0, then the cove round the arc's top edge."
settings = "ball-endmill-carbide-2fl-1-4-6061-t6511"
milling_cuts = [
  { name = "groove b", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.ball_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{process.groove_depth_mm}}", radial_woc_mm = "{{process.ball_cutter_dia_mm}}", traverse_mm = ["{{process.b_groove_from_mm}}", "{{process.b_groove_to_mm}}"] },
]
diagram = { file = "diagrams/form_b-groove.svg", alt = "Plan of plate B, to scale: the 1/4 in ball end mill at its first plunge, past the back edge. Its first pass, centred on the groove's centre line, runs round the cove and down the channel to the tube stop at the right; then it steps round that line, each step the other way, the form-side steps along the channel and round the cove, the outer-side steps along the channel only. The arc is through, the waste under its own clamp." }

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Unclamp. Waste aside. Deburr the cut edges and both stud holes; take only the burr off the groove's edges, as plate A's."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Lay the trial piece in B's channel, its end on the channel's closed end." },
  { kind = "check", text = "It lies down in the channel its full length and does not rock." },
  { kind = "stop", text = "It rides on a ridge or burr: stone the groove's edge and lay it in again. It will not go in at all: stop; the groove is undersize." },
]
feed = "hand"

# --- Setup 5: the bend --------------------------------------------------------
[[setups]]
machine_kind = "other"
title = "Bend the tube on the form"
machine = "PM-30MV table, spindle off / bench"
indexing = "none"
holding = "Plate A groove face up on the clean table, its two stud holes over the front T-slot, the channel's closed end toward the column and the arc toward you. Two 3/8-16 studs in T-nuts (LMS 1268) up through both plates; plate B turned over onto A, groove to groove, the two back edges flush and B slid along them until its milled arc meets A's with no step; a flange nut on each stud."
datum = "The channel's closed end: the tube's end sits on it."
diagram = { file = "diagrams/bend.svg", alt = "Plan of the form on the mill table bolted through its stud holes into the front T-slot: the tube's tail in the closed channel, its end on the channel's end; the tube pulled round the arc from pointing at the operator to pointing right, a little past square to the channel." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Spindle off, Z raised to the top. Two T-nuts in the front T-slot under plate A's stud holes, a 3/8-16 stud in each up through A. A groove face up, the channel's closed end toward the column, the arc toward you."
feed = "hand"

[[setups.operations]]
instruction = "Lay the trial piece (Setup 1's rest) in A's channel, its end on the channel's closed end, the rest running out over the front of the table."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Plate B over, groove face down onto A over the tube, the studs through its holes; a flange nut on each, finger-tight." },
  { kind = "action", text = "Hold a 1-2-3 block across both back edges and tap B flush to it. Slide B along the back edges until its arc edge meets A's." },
  { kind = "check", text = "Run a fingernail across the joint round the arc: no step either way." },
  { kind = "action", text = "Tighten both nuts." },
]
feed = "hand"

[[setups.operations]]
instruction = "A step at the joint: loosen the nuts, tap B along the back edges and feel again. A step that will not tap out (one way at the front of the arc, the other at the top): stop; the plates do not match. Re-cut them (Setups 2 to 4)."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Trial bend: pull the trial piece round the arc on the form by hand, steadily, toward your right, until it stands square to the plates' long edges: 90° on the form. Let it go: it springs back."
feed = "hand"

[[setups.operations]]
instruction = "Both nuts off, plate B off. Lift the trial piece out of A's channel."
feed = "hand"

[[setups.operations]]
instruction = "Look along the trial's bend inside and out under a bright light."
inspection = "No crease, ripple or wrinkle on the inside of the bend, no flat on its outside."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "A kink in the trial: stop; the form or the pull is wrong. Feel the groove for a ridge or burr and check B's arc meets A's; pull steadily, the tube held down in the cove. Then trial-bend the piece's other end the same way. Bend the blank only after a trial with no kink."
feed = "hand"

[[setups.operations]]
instruction = "Zero the digital angle gauge on the table. Lay the trial's leg on the table, its outer side down, between two 1-2-3 blocks set against its sides, the arm up. Stand the gauge on the arm's top side, its face in the bend's plane; rock the arm a little either way and read it upright."
inspection = "Springback (90° less the reading) at most {{process.springback_max_deg:.0f}}°. Write it down: it is the blank's overbend."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Springback over {{process.springback_max_deg:.0f}}°: stop; the form wraps no farther than {{process.wrap_max_deg:.0f}}°, so it cannot overbend the blank that far."
feed = "hand"

[[setups.operations]]
instruction = "Lay the blank in A's channel as the trial piece. Plate B on as before: back edges flush, no step at the arc, nuts tight."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Pull the blank round the arc on the form as the trial, until it stands square to the plates' long edges and then the trial's springback more (each degree about 1/4 in at 15 in out). Let it go: it springs back."
feed = "hand"

[[setups.operations]]
instruction = "Both nuts off, plate B off. Lift the tube out of A's channel."
feed = "hand"

[[setups.operations]]
instruction = "Read the bend's angle with the digital angle gauge as the trial's: zeroed on the table, the leg between the two 1-2-3 blocks, the gauge on the arm's top side."
inspection = "Bend {{cad.bend_angle_min_deg:.0f}}–{{cad.bend_angle_max_deg:.0f}}° (digital angle gauge)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Bend out of its band: back in the form as before (blank in A's channel, plate B on, flush, nuts tight). Under: pull on 2° more. Over: push the leg back 1°. Then read it again as the op before."
feed = "hand"

# --- Setup 6: accept the bend -----------------------------------------------
[[setups]]
machine_kind = "other"
title = "Accept the bend"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/bend_check.svg", alt = "The bent tube: the micrometer across the middle of the bend, once in the bend's plane and once square to it; the inside of the bend free of ripples." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Look along the bend inside and out under a bright light."
inspection = "{{cad.bend_callout}}: no crease, ripple or wrinkle on the inside of the bend, no flat on its outside."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Diagnostic for a kink starting: mike the O.D. at the middle of the bend across the bend's plane and square to it. A round bend's difference stays within {{process.ovality_max_mm:in.3dot}} ({{process.ovality_fraction_max:.0%}} of the O.D., ASME B31.3 §332.2.1); over it, look again for a kink."
feed = "hand"

[[setups.operations]]
instruction = "A kink or a crease (the sheet's {{cad.bend_callout}}): scrap the tube. Order another 48 in of the tube (OnlineMetals 7322) and start again at Setup 1; the form is kept."
feed = "hand"

# --- Setup 7: the ends and the finish ---------------------------------------
[[setups]]
machine_kind = "other"
title = "Saw and file the ends; finish"
machine = "Bench / mill table"
indexing = "none"
holding = "Bench vise, soft jaws, for sawing and filing; the mill table as the flat for the height gauge."
datum = "The leg's outer side (the side away from the arm) for the reach; the arm's top for the overall height."
diagram = { file = "diagrams/ends.svg", alt = "To scale, from the front with the moving jaw taken away: the arm in the bench vise's soft jaws at their right end, turned so the bend lies in the jaws' plane and sweeps out past that end, clear of the screw and slide; a .500 packing of the trial tube at the jaws' left end; the jaw tops just below the scribed line; the junior hacksaw's blade square to the arm just outside the line, the 2 in tail coming off. A small view across the jaws: the .500 tube between them." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Lay the leg on the table, its outer side down, between two 1-2-3 blocks set against its sides, the arm up. Set the height gauge's scriber to {{process.arm_line_mm:in.3f}}; rock the arm through upright and scribe the line on its side at the top of the swing."
feed = "hand"
diagram = { file = "diagrams/ends-reach.svg", alt = "The gooseneck lying on its leg on the table, the arm up: the height gauge over the arm's end reads the reach from the leg's outer side; the two 1-2-3 blocks against the leg's sides not drawn." }

# Sawing the tail: D33 (delegated ruling 2026-11-25 (Main), no precedent,
# owner review #2144:
# https://github.com/pedropaulovc/harmonic-analyzer/issues/2144#issuecomment-7171811160).
# The arm is gripped with the bend lying in the plane between the jaws: across
# the jaws the tube is .500 all along a planar bend, so the jaws grip it over
# their whole depth and the jaw depth no longer matters (#3611; gripped the
# other way, only the arm's .500 of straight lies between the bend and the
# line, arm_line_mm less the bend's outside radius). The arm sits at one end
# of the jaws so the bend sweeps out past that end, clear of the screw and
# slide; a packing of the same tube at the other end keeps the jaws square.
[[setups.operations]]
speed_kind = "other"
tool = "hacksaw"
drilling = "none"
sizing = "other"
instruction = "Arm in the bench vise's soft jaws, turned so the bend lies between the jaws, in their plane: the arm at one end of the jaws, the bend sweeping out past that end, clear of the screw and slide below. A {{process.stock_od_in:.3dot}} packing (a piece of the trial tube) between the jaws at their other end keeps them square. The jaw tops just below the line. Saw the tail off just outside the line, square to the arm."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "File the arm's end flat and square to the arm, down to the line. Between strokes lay it back between the blocks as for the scribing; rock the arm through upright and take the highest height-gauge reading, until the reach is in its band."
inspection = "Reach {{cad.arm_end_reach_min_in:.2f}}–{{cad.arm_end_reach_max_in:.2f}} (height gauge)."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.arm_end_reach_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Lay the gooseneck flat on the table. Hold a 1-2-3 block square across the arm's top; lay the steel rule along the leg from the block's face. Mark the leg at {{process.foot_line_mm:in.2f}}."
feed = "hand"
diagram = { file = "diagrams/ends-height.svg", alt = "The gooseneck flat on the table: a 1-2-3 block across the arm's top, the steel rule along the leg to the foot for the overall height." }

[[setups.operations]]
speed_kind = "other"
tool = "hacksaw"
drilling = "none"
sizing = "other"
instruction = "Leg in the bench vise's soft jaws. Saw the foot's end off just outside the mark, square to the leg."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "File the foot flat and square to the leg. Between strokes lay it back on the table with the block and the rule as for the marking, until the height is in its band."
inspection = "Overall height {{cad.arm_height_min_in:.2f}}–{{cad.arm_height_max_in:.2f}} (steel rule)."
gauge_checks = [{ gauge = "steel-rule-48", band_mm = "{{cad.arm_height_band_mm}}" }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr both ends inside and out: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "sanding-roll"
drilling = "none"
sizing = "other"
instruction = "Polish the tube all over with the 220 grit roll, along its length, until it is bright and even; wipe it clean."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "oil"
drilling = "none"
sizing = "other"
instruction = "Wipe a thin film of Barricade oil over the whole tube; wipe off the excess. Bag the part with its number."
feed = "hand"
