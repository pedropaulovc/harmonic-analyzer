<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="580"/>
  <!-- Hand picture, plan view, to scale at 2.1 px/mm from the plate's 9.0 in
     (228.6 mm drawn 480.1 px) and its 6.0 in width (320 px). Plate, 1-2-3
     blocks (3 x 2 in), stud holes, arc and groove from [parameters] and
     the GF01/GF02 NC. The 1/4 in ball end mill (ball_cutter_dia_mm 6.35) is drawn 13.3 px across,
     at the groove's first plunge X-57.059 Y50.504 (past the back edge), the centred
     pass at Z-3.175 (cam.py groove: centred pass, then the steps alternating direction).
     The step clamps' straps and studs are not on record: drawn schematic.
     The edge finder is a touch-off tool and is not drawn; the two
     touch-off edges are marked as datums. -->
  <text class="title" x="20.0" y="18.0">Setup 4, M6 T2: the 1/4 in ball end mill cuts plate B's groove (plan view, 2.1 px/mm)</text>
