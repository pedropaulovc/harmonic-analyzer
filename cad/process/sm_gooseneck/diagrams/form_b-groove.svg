  <text class="label" x="20.0" y="530.0">GF02_form_b, T2: the first pass, centred on the groove's centre line, plunges past the back edge, runs round</text>
  <text class="label" x="20.0" y="548.0">the cove and down the channel to the tube stop (arrow). Then steps round that line, each the other way:</text>
  <text class="label" x="20.0" y="566.0">the form-side steps channel and cove, the outer-side steps the channel only. Waste under its own clamp. To scale.</text>
