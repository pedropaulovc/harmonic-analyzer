<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="sans-serif" font-size="13">
  <!-- Hand picture, side view, to scale at 3 px/mm from the tube's .500 O.D. (38.1 px)
     and its bend's 3.000 centreline radius (features.toml; 228.6 px). The scribed line
     at arm_line_mm 95.25 from the leg's outer side; the straight arm below it
     arm_straight_ref 11.92 mm; the tail 2 in beyond it (tube_tail_mm 50.8).
     Not on record, drawn schematic: the vise's jaw width and depth, the soft jaws,
     the junior hacksaw's blade and kerf. The jaws are drawn on the straight arm only;
     a deeper jaw meets the inside of the bend (a finding). -->
  <rect class="paper" x="0" y="0" width="760" height="560"/>
  <text class="title" x="20" y="24">Setup 7: the arm in the bench vise's soft jaws, the tail sawn off just outside the line (to scale, 3 px/mm)</text>
  <path class="part-kept" d="M40 519.05L171.4 519.05A247.65 247.65 0 0 0 419.05 271.4L419.05 233.3L380.95 233.3L380.95 271.4A209.55 209.55 0 0 1 171.4 480.95L40 480.95L43 484.76L40 488.57L43 492.38L40 496.19L43 500L40 503.81L43 507.62L40 511.43L43 515.24Z"/>
  <rect class="part-removed" x="380.95" y="80.9" width="38.1" height="152.4"/>
  <line class="datum" x1="350.95" y1="233.3" x2="449.05" y2="233.3"/>
  <text class="datum-label" x="543.05" y="237.3">the scribed line, 3.750 in</text>
  <text class="datum-label" x="543.05" y="253.3">above the leg's outer side</text>
  <path class="clamp" d="M380.95 234.3L380.95 271.4L310.95 271.4L307.95 267.69L310.95 263.98L307.95 260.27L310.95 256.56L307.95 252.85L310.95 249.14L307.95 245.43L310.95 241.72L307.95 238.01L310.95 234.3Z"/>
  <path class="clamp" d="M419.05 234.3L489.05 234.3L492.05 238.01L489.05 241.72L492.05 245.43L489.05 249.14L492.05 252.85L489.05 256.56L492.05 260.27L489.05 263.98L492.05 267.69L489.05 271.4L419.05 271.4Z"/>
  <text class="label" x="449.05" y="311.4">bench vise soft jaws on the arm's .47 in of</text>
  <text class="label" x="449.05" y="327.4">straight (arm_straight_ref 11.92 mm) between</text>
  <text class="label" x="449.05" y="343.4">the bend and the line</text>
  <line class="leader" x1="447.05" y1="307.4" x2="449.05" y2="265.4"/>
  <circle class="leader-dot" cx="449.05" cy="265.4" r="2"/>
  <path class="cutter" d="M529.05 224.8L529.05 228.8L270.95 228.8L267.95 227.8L270.95 226.8L267.95 225.8L270.95 224.8Z"/>
  <text class="label" x="270.95" y="204.8">junior hacksaw blade (schematic), cut square to the arm</text>
  <text class="label" x="433.05" y="110.9">tail, 2 in, off</text>
  <text class="label" x="60" y="466.95">leg</text>
  <text class="label" x="20" y="540">Then the foot: the leg in the same jaws, sawn just outside its mark. Each end then filed into its band.</text>
</svg>
