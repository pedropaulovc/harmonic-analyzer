<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 3 px/mm from the tube's .500 O.D. (stock_od_in; 38.1 px) and the bend's
     3.000 centreline radius (features.toml bend; 228.6 px). Hold C, ruling D33 (delegated,
     Main 2026-11-25): across the jaws the tube is .500 all along its planar bend, so the jaws
     grip it over their whole depth. The scribed line arm_line_mm 95.25 from the leg's outer
     side: 95.25 - (76.2 + 6.35) = 12.70 mm (.500) above the bend's tangent (the finished
     arm, filed to the reach, keeps arm_straight_ref 11.92); the tail 2 in (tube_tail_mm).
     Not on record, drawn schematic: the vise's jaw width (drawn 4 in) and depth (drawn 1 in),
     the jaw tops' 1 mm below the line, the screw and slide, the soft jaws' thickness, the
     junior hacksaw's blade and kerf, the packing's length. -->
  <rect class="paper" x="0" y="0" width="760" height="780"/>
  <text class="title" x="20" y="24">Setup 7: the arm in the soft jaws, the bend in their plane; the tail sawn off (to scale, 3 px/mm)</text>
  <rect class="clamp" x="67.6" y="212.9" width="304.8" height="76.2"/>
  <text class="label-on-clamp" x="190" y="230.9" text-anchor="middle">fixed jaw's face (soft jaw)</text>
  <text class="label-on-clamp" x="190" y="246.9" text-anchor="middle">the moving jaw taken away</text>
  <rect class="hidden" x="145" y="289.1" width="150" height="138.9"/>
  <text class="label" x="151" y="313.1">screw and slide</text>
  <text class="label" x="151" y="329.1">below the jaws</text>
  <text class="label" x="151" y="345.1">(schematic)</text>
  <rect class="fixture-support" x="67.6" y="212.9" width="38.1" height="76.2"/>
  <text class="label" x="40" y="452">packing: a {{process.stock_od_in:.3dot}} piece of the trial tube at the</text>
  <text class="label" x="40" y="468">jaws' left end, to keep them square</text>
  <line class="leader" x1="60" y1="440" x2="86.65" y2="283.1"/>
  <circle class="leader-dot" cx="86.65" cy="283.1" r="2"/>
  <path class="part-kept" d="M334.3 209.9L334.3 248A247.65 247.65 0 0 0 581.95 495.65L740 495.65L737 491.84L740 488.03L737 484.22L740 480.41L737 476.6L740 472.79L737 468.98L740 465.17L737 461.36L740 457.55L581.95 457.55A209.55 209.55 0 0 1 372.4 248L372.4 209.9Z"/>
  <rect class="part-removed" x="334.3" y="57.5" width="38.1" height="152.4"/>
  <text class="label" x="384.4" y="77.5">tail, {{process.tube_tail_mm:ind}} in, off</text>
  <line class="datum" x1="320.3" y1="209.9" x2="386.4" y2="209.9"/>
  <text class="datum-label" x="442.4" y="231.9">the scribed line, {{process.arm_line_mm:in.3f}} in above the</text>
  <text class="datum-label" x="442.4" y="247.9">leg's outer side; the jaw tops just below</text>
  <line class="leader" x1="440.4" y1="227.9" x2="388.4" y2="209.9"/>
  <circle class="leader-dot" cx="388.4" cy="209.9" r="2"/>
  <path class="cutter" d="M483.35 202.4L483.35 205.4L223.35 205.4L220.35 204.65L223.35 203.9L220.35 203.15L223.35 202.4Z"/>
  <text class="label" x="384.4" y="175.4">junior hacksaw blade (schematic): just</text>
  <text class="label" x="384.4" y="191.4">outside the line, square to the arm</text>
  <text class="label" x="521.95" y="521.65">the bend sweeps out past the jaws' right</text>
  <text class="label" x="521.95" y="537.65">end, clear of the screw and slide</text>
  <text class="title" x="40" y="505">Across the jaws (looking along them), 3 px/mm</text>
  <rect class="clamp" x="100.95" y="583" width="60" height="76.2"/>
  <rect class="clamp" x="199.05" y="583" width="60" height="76.2"/>
  <rect class="hidden" x="100.95" y="659.2" width="158.1" height="40"/>
  <path class="part-removed" d="M160.95 580L160.95 520L164.76 517L168.57 520L172.38 517L176.19 520L180 517L183.81 520L187.62 517L191.43 520L195.24 517L199.05 520L199.05 580Z"/>
  <path class="part-kept" d="M199.05 580L199.05 696.2L195.24 699.2L191.43 696.2L187.62 699.2L183.81 696.2L180 699.2L176.19 696.2L172.38 699.2L168.57 696.2L164.76 699.2L160.95 696.2L160.95 580Z"/>
  <path class="cutter" d="M249.05 572.5L249.05 575.5L110.95 575.5L107.95 574.75L110.95 574L107.95 573.25L110.95 572.5Z"/>
  <line class="datum" x1="146.95" y1="580" x2="213.05" y2="580"/>
  <text class="label" x="279.05" y="610">the {{process.stock_od_in:.3dot}} tube between the two soft jaws,</text>
  <text class="label" x="279.05" y="626">gripped over the jaws' whole depth:</text>
  <text class="label" x="279.05" y="642">the bend lies in the jaws' plane</text>
  <line class="leader" x1="277.05" y1="606" x2="195.05" y2="620"/>
  <circle class="leader-dot" cx="195.05" cy="620" r="2"/>
  <text class="label" x="100.95" y="717.2">moving jaw</text>
  <text class="label" x="100.95" y="733.2"></text>
  <text class="label" x="100.95" y="749.2"></text>
  <text class="label" x="259.05" y="717.2" text-anchor="end">fixed jaw</text>
  <text class="label" x="20" y="768">Then the foot: the leg in the same jaws, sawn just outside its mark. Each end then filed into its band.</text>
</svg>
