feed = "hand"

# FK05 stays on the chart setting, outside the measured envelope: the wall
# pass 8.382 deep x 0.263, the foot-end and step passes 3.6175 wide in the
# same operation at its 2650 rpm (the measured face record holds at
# 2420-2490). Owner (Pedro), 2026-11-22: deep walls, "log new
# dechatter issues to try deep axial cuts but with shallow radial depth"
# (#3427); full-width passes, "same log new dechatter issues to try full
# radial depth but shallow axial" (#3428). No re-cut: the first blank is
# listened to.
[[setups.operations]]
steps = [
  { kind = "stop", text = "First blank only: these FK05_step cuts at 2650 rpm have not been chatter-tested on this end mill (owner's test list #3427, #3428): the wall pass .330 deep × {{process.wall_finish_woc_mm:in.3dot}} wide, the foot-tip and step passes {{process.face_step_max_mm:in.3dot}} and {{process.step_level_mm:in.3dot}} deep × .142 wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run FK05_step (M6 T1; set 2650): face the foot tip down to Z {{cad.foot_tip_length_mm:in.4dot}} across the whole part in two {{process.face_step_max_mm:in.3dot}} levels, then the step down to Z {{cad.lug_outer_face_thickness_mm:in.4dot}} in {{process.step_level_mm:in.4dot}} levels, each in passes along the part from beside the crown end to the foot top and back; then one full-depth pass along the foot top, from F to N (climb), takes off the {{process.wall_finish_woc_mm:in.3dot}} scallops the stepovers left on it. The step cuts the waste under the bore and the foot hole away: both open."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "foot end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.step_stepover_max_mm}}", traverse_mm = [0, "{{process.blank_length_max_mm}}"] },
  { name = "step", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.step_level_mm}}", radial_woc_mm = "{{process.step_stepover_max_mm}}", traverse_mm = ["{{cad.foot_top_height_mm}}", "{{process.blank_length_max_mm}}"] },
  { name = "step wall", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = 8.382, radial_woc_mm = "{{process.wall_finish_woc_mm}}", traverse_mm = [0, "{{cad.far_side_width_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp. Mic the lug and the length; calipers across the foot."
inspection = "Lug {{cad.lug_outer_face_thickness_min_in:.3dot}}–{{cad.lug_outer_face_thickness_max_in:.3dot}} thick (I to its outer face O), miked at the crown and beside the foot. Length {{cad.foot_tip_length_min_in:.3dot}}–{{cad.foot_tip_length_max_in:.3dot}} (I to the foot tip), miked. Foot {{cad.foot_top_height_min_in:.3dot}}–{{cad.foot_top_height_max_in:.3dot}} high (the seat to the foot top), calipers across it beside the lug."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.lug_outer_face_thickness_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.foot_tip_length_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.foot_top_height_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "Any of the three under its band: the part is scrap. Foot over its band: stop and tell the owner (the X of the last pass sets it; a Z drop cannot). Lug over: the drop d = the lug reading − {{cad.lug_outer_face_thickness_mm:in.4dot}}; d shortens the length too (one Z0): if the length reading − d would fall under {{cad.foot_tip_length_min_in:.3dot}}, stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Only the length over: d = the length reading − {{cad.foot_tip_length_mm:in.3dot}}, but never more than the lug reading − {{cad.lug_outer_face_thickness_min_in:.4dot}} − .001 (the lug stays in its band). If that cap leaves the length over, stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Re-cut by d: reclamp as before; pick up X0 (the seat) and Y0 (the fixed jaw) again with the edge finder as at this setup's start (Z0 stays the stacks' top). Send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − d × 25.4). Run FK05_step again (its upper levels cut air) and check again: lug, length, foot."
feed = "hand"

