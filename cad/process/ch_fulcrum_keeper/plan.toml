# Fulcrum keeper MHA-CH-07 (qty 2), routed for the CNC mill (the agent's
# route for speed; the owner corrects it afterwards). The keeper is the pivot
# bracket's shape (cad/process/ch_pivot_bracket) turned a quarter about its
# height, and follows its route: each keeper from one sawn blank of 3/4 in
# square 1018, its length along the bar about 1.35, one blank per program
# run. The bar's cold-finished faces: one stays as the inner face I (the lug's
# inner face, the datum of the .32 lug, the .65 length and the crown hole's
# station), its opposite is faced to the .65 length; the two others are faced
# to the .55 width (the far side F first, then the near side N). Both milled
# sides remove the bar's four rounded corners, so every long edge is a milled
# one.
#
# Route: saw; Setup 2 lying on the 1 in + 1/2 in parallel stacks, I to the
# fixed jaw, skim F (FK01); Setup 3 F down, face N to the width (FK02);
# Setup 4 upright on the 1 in parallels, gripped on F and N: face the seat
# and drill the #41 foot hole from it, into the waste above the foot (FK03);
# Setup 5 lying, I up, the raw opposite face down: profile the full R.275
# crown through the lug and spot, drill (D) and open (F) the bore
# through the lug, both 1 mm into the waste the step removes; the jaws grip
# only that waste, below the cuts (FK04); Setup 6 I down: face the foot tip
# to the .65 length and mill the L step to the .32 lug, which opens the bore
# and the foot hole (FK05); Setup 7 upright on the seat: spot and drill 1/16
# through the crown into the bore, mill the foot hole's Ø.150 counterbore
# from the foot top with the long-reach 1/8 in end mill (FK06), tap #1-72 by
# hand under the spring tap guide in the spindle (FK07); bench deburr (the
# F drill by hand through the bore) and inspect. Finish: black oxide, in the
# shop. Owner (Pedro), answered in person 2026-11-21: "Black oxide: cold
# blackening in the shop with Presto Black PC9 is acceptable as the
# drawing's black oxide." The last setup blackens the keeper with Birchwood
# Presto Black Steel PC9 by the maker's instructions (Presto Black Steel PC9
# Instructions, steps 1 prepare, 2b brush-on, 3 stop, 4 dry, 6 seal;
# cad/config/shop-equipment/ consumables.presto-black-steel-pc9, which cites
# them); the PC9 and the gloves and glasses are to buy (to_order).
#
# The counterbore's centre sits .150 from the lug's outer face (its edge
# .075 from it), and the lug stands
# 0.96 in above the foot top: a 1/2 in end mill cannot reach it and a
# standard 1/8 in end mill's 1-1/2 in overall length leaves too little out
# of the collet to keep the collet nose over the crown. The Harvey 755708
# long-reach 1/8 in end mill (1-1/4 in reach, 2-1/2 in overall; shop
# tools.endmill-carbide-3fl-1-8-lr-755708, to_order) mills it by
# interpolation; cam.py checks the reach.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "remove mention of dead centre ; use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (FK07).
#
# Zeroing: every X/Y zero the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), every Z zero a tool on a .002
# feeler leaf, as the pivot bracket's plan does.
#
# NC (cam:ch_fulcrum_keeper, cad/process/ch_fulcrum_keeper/cam.py): FK01_far,
# FK02_width, FK03_seat, FK04_crown_bore, FK05_step, FK06_crown_cbore,
# FK07_crown_tap, FK08_cbore_recut (FK06's counterbore alone: the remedy for
# a shallow or undersize one). Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe (the recipe keeps the bracket's names for
# them: west = F, hold = the foot hole, arch = the crown, apex = the crown
# hole). Tool numbers are the places in the tools list among the mill's
# tools: T1 1/2 in end mill, T2 centre drill, T3 #41, T4 D, T5 F drill,
# T6 1/16 drill, T7 long-reach 1/8 in end mill, T8 the tap guide (the tap is turned
# by hand).
title = "Fulcrum keeper"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (the drawing's MATERIAL: {{cad.material_name}}; the part's spec: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.quantity:d}} blanks, each sawn about {{process.blank_length_nominal_in:.2f}} in long (at least {{process.blank_length_min_in:.2f}}, at most {{process.blank_length_max_in:.2f}}: Setup 1)."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.far_side_width_min_in:.3dot}}–{{cad.far_side_width_max_in:.3dot}} wide (F to N), {{cad.foot_tip_length_min_in:.3dot}}–{{cad.foot_tip_length_max_in:.3dot}} long (I to the foot tip); the lug {{cad.lug_outer_face_thickness_min_in:.3dot}}–{{cad.lug_outer_face_thickness_max_in:.3dot}} thick (I to its outer face O), the foot {{cad.foot_top_height_min_in:.3dot}}–{{cad.foot_top_height_max_in:.3dot}} high (the seat to the foot top). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home (logbook 2026-11-06). After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Each blank gets its own zeros (no vise stop): in every mill setup, repeat the edge-finder and Z touch-off ops for each blank clamped, before its run. Every cutting file is proved in air on the first blank; the tap file moves only at the machine top and over the hole, spindle off. To order: the .2560 reamer (Setup 5's reaming waits for it), the long-reach 1/8 in end mill (Setup 7's counterbore waits for it), the .2560 plus and .2570 minus Class ZZ pins (the bore checks wait for them), and the black-oxide solution with gloves and glasses (the last setup waits for them)."
shop = "../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_fulcrum_keeper/features.toml"
adapter = "drilled_block"
part = "ch-fulcrum-keeper"

[parameters]
quantity = 2
# The bore: owner ruling 2026-11-24, fit audit question 1 (approved as
# recommended): drilled F, .257 at the title block's DRILLED HOLES row, with
# the other bores on the two 1/4 in shafts; it reverses tool audit Q7's
# .2560 reamer and its Class ZZ pins (tools.zz-pins-2560-2570). Acceptance:
# a 1/4 in ground-bar offcut (stock 1018-ground-round-1-4, the MHA-CH-04
# shaft's bar) slides through the bore by hand.
# The bar (stock.1018-square-3-4) and the blank the programs are posted for:
# sawn about 1.35. At least 1.32: the seat skim (.020) and the 1.267 height
# leave .033 above the crown's apex. At most 1.38: FK04's rough crown pass
# is posted for the longest blank's corners (cam.py checks the cut).
blank_section_in = 0.75
blank_section_mm = 19.05         # blank_section_in × 25.4: the holds' and cam.py's section.
blank_length_nominal_in = 1.35
blank_length_min_in = 1.32
blank_length_max_in = 1.38
blank_length_min_mm = 33.528
blank_length_max_mm = 35.052
kerf_in = 0.125
# stock_fit (prechips drilled_block): the blank along the model axes, X the
# length, Y the height (the bar's length, the shortest blank), Z the width.
blank_x_in = 0.75
blank_y_in = 1.32
blank_z_in = 0.75
# Skims (author's choice): the seat .020 off the sawn end; F .050 off the
# bar face. N is faced to the width and the foot tip to the length in equal
# levels no deeper than face_step_max_mm (.050 in). I is not cut.
seat_skim_mm = 0.508
west_skim_mm = 1.27
face_step_max_mm = 1.27
# Facing F, N and the seat (FK01-FK03): the 1/2 in carbide end mill (shop
# endmill-carbide-3fl-1-2) on the measured face setting
# em-half-carbide-1018-3439-face, valid to 1.27 mm deep and 6.4 mm wide at
# 2420-2490 rpm in the cut (dechatter session of 2026-11-23, #3439;
# cad/config/shop-equipment/measured-cuts.toml): equal passes no wider
# than face_stepover_max_mm, its width limit. Each face cut declares its
# true stepover, the most any of its passes engages, the first and the last
# included (cam.py computes both and the post checks every pass): lying
# across the 3/4 section 4 passes of lying_stepover_mm (3 would need 6.52,
# over the limit), upright across the .55 width 3 of seat_stepover_mm (2
# would need 7.24). Every measured pass was conventional and the faces
# zigzag, so every other pass climbs, not measured.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.4
lying_stepover_mm = 4.8875
seat_stepover_mm = 4.8233
# FK05 (the foot tip, the step and its wall pass: one operation, on the
# chart setting endmill-carbide-3fl-1-2-1018-cf, whose wall pass is deeper
# than any measured cut): passes no wider than .150 in, under half the
# cutter (the 6G chip-load factor 1.0 holds to 50 % engagement); .150 also
# gives the step an even number of passes across the .55 width (cam.py).
step_stepover_max_mm = 3.81
# The step (FK05): equal levels from the faced foot tip down to the lug's
# outer face (7 × 1.1974), each a zigzag of X passes across the width (the
# facing stations, the last moved onto N's line) from beside the far end to
# the foot top's station (the cutter's edge on the foot top) and back; the
# stepovers at that end sweep the foot top from beyond F to N, and the
# scallops they leave between alternate pairs (at most wall_finish_woc_mm,
# from the 3.6175 stations) come off in one full-depth pass along the foot
# top at the end, from F to N (climb). cam.py computes and checks both, and
# simulates what that pass meets.
wall_finish_woc_mm = 0.263
step_level_mm = 1.1974
# The crown (FK04): profiled round the full R.275 with the end mill's side,
# climb (G2, the PM-30MV has ball screws), through the lug and arch_past_mm
# into the waste the step removes: two rough levels .020 off the radius,
# then one finish pass at full depth. The rough pass's widest cut is the
# longest blank's corner (cam.py checks it).
arch_past_mm = 1.0
arch_depth_mm = 9.128
arch_rough_level_mm = 4.564
arch_finish_stock_mm = 0.508
arch_rough_woc_mm = 4.173
# Each pass plunges beside a side, this far below the crown's tangent point.
arch_lead_mm = 1.0
# Spots with the #2 centre drill, each under its drill (no chamfer at the
# mouth): Ø.085 under the #41, Ø.180 under the D, and on the crown Ø.050
# under the 1/16, with the pilot's point only (cam.py's spot depths).
hold_spot_dia_mm = 2.159
bore_spot_dia_mm = 4.572
apex_spot_dia_mm = 1.27
# Foot hole (FK03): the #41 from the seat, pecked .080 with full retract
# (L/D 4), its full diameter hold_drill_past_mm past the foot top into the
# waste; its point then stands hold_tip_height_mm above the parallels in
# the shortest blank.
hold_peck_mm = 2.032
hold_drill_past_mm = 1.0
hold_tip_height_mm = 23.413
# The holes' setup coordinates: the foot hole's station from I (cad
# foot_hole x less inner_face x), and the width's middle from F (the bore,
# the crown hole and the foot hole all lie on it; cam.py checks both).
foot_hole_station_from_i_mm = 11.938
width_middle_mm = 6.985
# The bore's ±.012 off the width's centre, read by calipers from F over the
# F drill's shank: the width's middle ± .012 (6.985 ± 0.3048), on the nominal width.
bore_from_f_min_mm = 6.6802
bore_from_f_max_mm = 7.2898
# Bore (FK04): the D drill (.246, .011 under the F) one plunge (L/D 1.6),
# full diameter bore_drill_past_mm past the lug's outer face's plane; the F
# drill opens it the same way, its full diameter as far past. Tip heights
# above the stacks; cam.py checks them.
bore_drill_past_mm = 2.0
bore_tip_height_mm = 7.045
bore_open_tip_height_mm = 6.960
# Crown hole (FK06): the 1/16 drill (.0625), not the #1-72's usual #53
# (.0595): the drawing's Ø.060 with the title block's DRILLED HOLES +.004/0
# is .060-.064, and the #53 is under it; the 1/16 leaves about 58% thread
# (76.98 × 72 × (.073 − .0625)), enough for a set screw in steel. Pecked
# .040 with full retract (L/D 3), its full diameter apex_drill_past_mm past
# the bore's wall; its point then stands apex_tip_height_mm above the
# parallels.
apex_peck_mm = 1.016
apex_drill_past_mm = 0.5
apex_tip_height_mm = 27.389
# Hand tap (FK07): the plug tap's 5-thread lead (5 × 1/72) past the bore's
# wall at the thread's major diameter, and 1.0 short of the bore's far wall:
# the tap's point to go tap_reach_min_mm–tap_reach_max_mm below the apex.
plug_tap_lead_mm = 1.764
tap_reach_min_mm = 5.619
tap_reach_max_mm = 9.249
# Counterbore (FK06): the long-reach 1/8 in end mill's centre on a circle
# cbore_path_radius_mm round the foot hole's axis (Ø.152, the middle of the
# drawing's .150-.154 band, less the cutter), 17 helical turns of .0049 down
# to cbore_depth_mm (.083, the band's middle), then one flat turn on the
# floor. The band is the sheet's printed Ø.150 +.004/.000 x .083 +.005/-.005
# (owner ruling 2026-11-22, #3367; RV-04 in ch-fulcrum-keeper.yaml): it keeps
# the foot tip's .072 wall and clears the MHA-CH-VN-52's Ø.140 head. Its
# collet nose stays cbore_collet_clear_mm over the crown's apex with the
# cutter on the floor: at least cbore_projection_min_mm out of the collet,
# inside its 1-1/4 in reach (cam.py). Feed: the setting's chip load
# (endmill-carbide-3fl-1-8-lr-1018-cf, 2800 rpm × 3 × .001 = 8.4 in/min)
# holds at the cutter's edge, which on the helix runs (path radius + cutter
# radius)/path radius = 5.63× faster than its centre: the centre's F is
# 8.4 × .3429/1.9304 = 1.49 in/min (cam.py; sh_column_clamp_back's rule).
cbore_path_radius_mm = 0.3429
cbore_depth_mm = 2.1082
cbore_pitch_mm = 0.127
cbore_collet_clear_mm = 2.54
cbore_projection_min_mm = 28.959
cbore_feed_per_min_mm = 37.899
# The edge's feed, the setting's 8.4 in/min: the cut's feed (its chip load
# .001 in/tooth is what deflects the long-reach cutter).
cbore_edge_feed_per_min_mm = 213.36
# The end mill's 1-1/4 in reach (cad/config/shop-equipment/
# tools.endmill-carbide-3fl-1-8-lr-755708, its seller's page): its neck,
# under the cutter's Ø, runs that far from the tip.
long_reach_mm = 31.75
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested
# drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001,
# 1/8 in .003 in/rev, a size between two columns taking the lower one's
# feed. Centre drill 1800 rpm × .001 = 1.8 in/min (the column clamp's). #41
# (.096): 2600 rpm (65 ft/min) × .001 = 2.6 in/min. D (.246): 1000 rpm (64
# ft/min) × .003 = 3.0 in/min. 1/16 (.0625): 2800 rpm (the spindle's top, 46
# ft/min) × .001 = 2.8 in/min. F (.257): 969 rpm, the spindle's 9th stop
# (9 x 107.7, machines.pm-30mv; 65 ft/min) × .003 = 2.9 in/min. cam.py
# posts these.
spot_feed_per_min_mm = 45.72
hold_drill_feed_per_min_mm = 66.04
bore_drill_feed_per_min_mm = 76.2
bore_open_feed_per_min_mm = 73.66
apex_drill_feed_per_min_mm = 71.12
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): upright, a 1 in parallel against each jaw; lying, the set's 1 in
# and 1/2 in parallels stacked against each jaw (1.5 in), as the pivot
# bracket's plan stacks them.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides. Lying, the longest blank; upright in
# Setup 4 the bar's section, in Setup 7 the finished length.
vise_lying_inset_mm = -61.81
vise_upright_inset_mm = -69.81
vise_seat_inset_mm = -71.08
# Upright in Setup 4 the longest blank less the seat skim stands above the
# parallels once faced.
upright_top_max_mm = 34.544
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# The 1/2 in end mill, 3 in overall, 1.12 in (28.45 mm) out of the R8
# collet (owner, Pedro, 2026-11-24: "28.45"): the longer end of the
# stick-out the measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm).
# cam.py checks its
# collet nose clears the stock at every program's deepest cut.
half_mill_projection_mm = 28.45
# Overall lengths: jobber #41 2-1/8 in, D 4 in, F 4-1/8 in, 1/16 1-7/8 in
# (ASME B94.11M); the #2 combined drill and countersink 1-7/8 in; the
# long-reach 1/8 in end mill 2-1/2 in. Bounded by their whole length below
# the chuck or collet.
drill_41_oal_mm = 53.975
drill_d_oal_mm = 101.6
drill_1_16_oal_mm = 47.625
centre_drill_oal_mm = 47.625
drill_f_oal_mm = 104.775
long_reach_oal_mm = 63.5
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the 1 in parallels, the keeper's height and the
# collet gauge: 269.611, rounded down to .01 in; it is also the
# guide-and-tap stack's declared reach in the setup's capacity check. The
# guide is 3 1/8 in (79.375) overall, its sellers' size and the most it can
# stand below the collet face; the tap's reach in its wrench is not on
# record, so the traveler stops before the tap file unless the tap, point to
# the wrench's centre hole, is at most tap_wrench_reach_max_mm: 269.494 less
# 79.375, 190.119, rounded down to .01 in.
tap_stack_max_mm = 269.494
tap_wrench_reach_max_mm = 189.992

