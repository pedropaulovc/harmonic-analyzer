[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on the crown beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X-1.500 (over the crown between the hole and I), then send G20: the DRO reads inches. Stand the #1-72 plug tap, in its wrench, on its point on the crown; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21, MDI G0 X-{{cad.crown_tap_station_mm:.3f}} (over the hole), send G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-1-72"
drilling = "none"
sizing = "other"
instruction = "Tap by hand under the tap guide, spindle off, Tapmatic Gold: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}}: the full thread runs through into the bore, the point stops short of the bore's far wall."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn (a #1-72 tap breaks easily: no force). To read, push the point fully home again: stop at the noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}}, the lead through the bore's wall, the point short of the far wall."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand; blow the hole and the bore out."
feed = "hand"

