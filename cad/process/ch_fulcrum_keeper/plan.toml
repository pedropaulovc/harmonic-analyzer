[[setups]]
machine_kind = "other"
title = "Saw the blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 in square bar with {{process.quantity:d}} blanks about {{process.blank_length_nominal_in:.2f}} in long marked off its end, a saw kerf between them." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks about {{process.blank_length_nominal_in:.2f}} in long off the 3/4 in square 1018 bar, the bar flat in the saw's vise. File the burr off both ends and the four long edges so each blank seats flat on the parallels. On each, mark one cold-finished long face I with marking fluid (the inner face: it is never cut, so keep it free of dings) and the blank's number, 1 or 2, on it."
feed = "hand"
inspection = "Each blank's length, calipers: at least {{process.blank_length_min_in:.2f}} (the seat skim {{process.seat_skim_mm:in.3dot}} and the keeper's {{cad.crown_overall_height_ref:.3f}} mm height must fit in it) and at most {{process.blank_length_max_in:.2f}} (FK04's rough crown pass is posted for that blank's corners)."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
steps = [
  { kind = "stop", text = "A blank over its length: saw it again. Under its length: set it aside and saw a new blank." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Far side F"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The blank lying on them along the jaws, gripped on I (against the FIXED jaw) and its opposite, centred on the jaws; the face up becomes the far side F. Tap it down onto both stacks while closing the vise. Its top stands {{process.blank_section_in:.3dot}} above the stacks, the lower {{process.lying_grip_mm:in.3dot}} of it in the jaws."
datum = "Program FK01_far (cam:ch_fulcrum_keeper). G54: X0 the blank's LEFT end, Y0 the fixed jaw's face (I), Z0 the stacks' top; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
