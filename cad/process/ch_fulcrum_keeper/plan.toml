[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the keeper with soap and water to take off the oil; rinse and dry it. Hold it by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff the outside faces lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping I and O flat. Not in the bore or the holes. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface with even, light strokes, into the bore, the counterbore and the foot and crown holes; re-wet the brush and go over the edges, the holes and any light spot until the keeper is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over, no bare spot and no wiping-off coating. Fits after blackening: the 1/4 in ground bar offcut still slides through the bore and a #1-72 screw still runs into the crown hole by hand."
gauge_checks = "other"

[[setups.operations]]
steps = [
  { kind = "stop", text = "The offcut or the screw tight after blackening: stop and tell the owner; do not open the bore or re-tap." },
]
feed = "hand"
