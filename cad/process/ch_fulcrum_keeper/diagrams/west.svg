<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 2: lying on the stacks, I at the fixed jaw; FK01 skims the face up, F. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 2 (FK01_far): skim F</text>
  <rect class="fixture-vise" x="100" y="360" width="275.25" height="18"/>
  <rect class="clamp" x="130" y="135.27" width="60" height="224.73"/>
  <rect class="clamp" x="285.25" y="135.27" width="60" height="224.73"/>
  <rect class="fixture-support" x="190" y="169.5" width="15.88" height="190.5"/>
  <rect class="fixture-support" x="269.38" y="169.5" width="15.88" height="190.5"/>
  <text class="label-on-clamp" x="160" y="151.27" text-anchor="middle">moving</text>
  <text class="label-on-clamp" x="315.25" y="151.27" text-anchor="middle">fixed</text>
  <rect class="part-arriving" x="190" y="74.25" width="95.25" height="95.25"/>
  <rect class="part-kept" x="190" y="80.6" width="95.25" height="88.9"/>
  <rect class="part-removed" x="190" y="74.25" width="95.25" height="6.35"/>
  <line class="active-face" x1="190" y1="80.6" x2="285.25" y2="80.6"/>
  <rect class="cutter" x="205.88" y="16.25" width="63.5" height="48"/>
  <text class="label" x="197.62" y="40.25" text-anchor="end">1/2 in end mill</text>
  <line class="leader" x1="281.25" y1="77.43" x2="375.25" y2="65.25"/>
  <circle class="leader-dot" cx="281.25" cy="77.43" r="2"/>
  <text class="label" x="375.25" y="69.25">skim {{process.west_skim_mm:in.3dot}}</text>
  <line class="leader" x1="275.25" y1="94.6" x2="375.25" y2="106.6"/>
  <circle class="leader-dot" cx="275.25" cy="94.6" r="2"/>
  <text class="label" x="375.25" y="110.6">this face becomes F</text>
  <line class="leader" x1="275.25" y1="163.5" x2="375.25" y2="190.5"/>
  <circle class="leader-dot" cx="275.25" cy="163.5" r="2"/>
  <text class="label" x="375.25" y="194.5">the opposite face on the stacks</text>
  <text class="label" x="375.25" y="234.5">I against the fixed jaw (right)</text>
  <text class="label" x="375.25" y="254.5">jaw tops {{process.lying_grip_mm:in.3dot}} above the stacks</text>
  <text class="label" x="375.25" y="274.5">stacks: 1 in + 1/2 in parallels, one per jaw</text>
  <circle class="datum" cx="285.25" cy="169.5" r="3.5"/>
  <text class="datum-label" x="291.25" y="163.5"></text>
  <line class="leader" x1="285.25" y1="169.5" x2="375.25" y2="305.5"/>
  <circle class="leader-dot" cx="285.25" cy="169.5" r="2"/>
  <text class="datum-label" x="375.25" y="309.5">Y0 the fixed jaw; Z0 the stacks' top</text>
  <text class="label" x="20" y="392">Seen from the right end, looking −X: X0, the blank's left end, is the far end.</text>
</svg>
