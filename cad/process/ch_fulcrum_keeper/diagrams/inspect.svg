  <text class="label" x="226.9" y="138.7">crown R{{cad.crown_radius_in:.3dot}}; #1-72 into the bore</text>
  <text class="label" x="226.9" y="323.6">foot top (hidden)</text>
  <polygon class="part-kept" points="470,360 585.57,360 585.57,319.6 526.9,319.6 526.9,134.7 470,134.7"/>
