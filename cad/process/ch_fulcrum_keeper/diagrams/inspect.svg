  <text class="label" x="536.9" y="154.7">lug {{cad.lug_outer_face_thickness_min_in:.3dot}}–{{cad.lug_outer_face_thickness_max_in:.3dot}}</text>
  <text class="label" x="593.57" y="345">length {{cad.foot_tip_length_in:.2dot}}</text>
