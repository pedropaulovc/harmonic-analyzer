<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif" font-size="13">
  <!-- Scale 1 in = 800 px (key stock .0625 = 50 px). The mark stands 1/32 in (25 px) above the jaw tops; the piece blank_length_in .17 (136 px) above the mark. The junior hacksaw (tools-hand.toml junior-hacksaw: 6 in, 32 TPI) has no recorded blade thickness or depth: its blade is drawn schematic, end-on in the kerf just below the mark on the jaw (waste) side, broken both ends; its frame is not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="20" y="22">Op 30: saw the {{process.blank_length_in:.2dot}} piece off just below the mark, from the front (1 in = 800 px)</text>
  <path class="fixture-vise" d="M195 380L195 250L305 250L305 380L297.67 377L290.33 380L283 377L275.67 380L268.33 377L261 380L253.67 377L246.33 380L239 377L231.67 380L224.33 377L217 380L209.67 377L202.33 380Z"/>
  <path class="fixture-vise" d="M355 380L355 250L465 250L465 380L457.67 377L450.33 380L443 377L435.67 380L428.33 377L421 380L413.67 377L406.33 380L399 377L391.67 380L384.33 377L377 380L369.67 377L362.33 380Z"/>
  <text class="label-on-clamp" x="207" y="366">soft jaw</text>
  <text class="label-on-clamp" x="367" y="366">soft jaw</text>
  <path class="part-rest" d="M305 406L305 231L355 231L355 406L347.86 403L340.71 406L333.57 403L326.43 406L319.29 403L312.14 406Z"/>
  <rect class="part-kept" x="305" y="89" width="50" height="136"/>
