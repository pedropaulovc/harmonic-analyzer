# Keyed cutting arbor key MHA-DT-03-TL-06, one off (owner ruling 2026-11-21:
# bench and trivially cut parts get travelers too). Route chosen for speed:
# all at the bench, no machine. The section is the 1/16 undersized key
# stock's as supplied (the sheet's (1/16") REF and SECTION AS SUPPLIED),
# miked once on arrival. A 1/16 square is too slender for the 14 in saw's
# vise, so it is cut by hand: Setup 1 in the bench vise's soft jaws files the
# bar end square (the datum end), saws a .17 piece off it with a junior
# hacksaw and files the sawn end to the .14-.16 cut length, calipered between
# passes. Setup 2 at the bench breaks the cut ends and checks the length
# (FINISH: as supplied). The kit (MHA-DT-03-TL-05) bonds it in the arbor's
# keyseat.
#
# Stock: the 12 in bar of 1/16 undersized key stock (McMaster-Carr 98830A511,
# the MHA-DT-VN-71 bar; its offcut serves) is to order
# (cad/config/shop-equipment/stock-to-order.toml key-stock-1-16-undersized);
# the junior hacksaw is to order too (tools-hand.toml tools.junior-hacksaw).
title = "Keyed Cutting Arbor Key"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "Carbon steel key stock, 1/16 in square, undersized"
stock = "Qty {{process.quantity:g}}. 1/16 in square undersized carbon-steel key stock, the 12 in bar (to order, not on hand; the MHA-DT-VN-71 bar's offcut serves); the key takes {{process.blank_length_in:.2dot}} in of it."
shop = "../shop"
stock_refs = ["key-stock-1-16-undersized"]

# The shop's standing page carries the units; the setups print the bench
# route. This job keeps the dry filing (the key is bonded).
standing = true

[[notes]]
title = "This job"
rows = [
  ["Dry", "Hand tools on the key stock, dry."],
]

[cad]
file = "../../out/features/dt_cone_gear_tl_arbor_key/features.toml"
adapter = "flat_bar"
part = "dt-cone-gear-tl-arbor-key"

[parameters]
quantity = 1
# The key's length runs along model Z, its height along X (the stock's
# section is square, so width and thickness are the same size).
blank_length_axis = 2
blank_thickness_axis = 0
# Sawn off the filed end: the .15 key and the allowance left on the sawn end
# for filing it to length, which also takes up the saw's squareness.
blank_length_in = 0.17
blank_width_in = 0.0625
blank_thickness_in = 0.0625

[[tools]]
id = "file"
name = "8 in smooth file; bench vise with soft jaws"
ref = "jig-files"

[[tools]]
id = "saw"
name = "Junior hacksaw, 32 TPI blade"
ref = "junior-hacksaw"

# Owned two-grit stone in place of the India stone (tool audit 2026-11-23,
# level 0, india-stone-ib8: an India stone is aluminium oxide, as is the
# owned stone's fine face; deburring only, no grit or length asked).
[[tools]]
id = "stone"
name = "Two-grit sharpening stone (320 face)"
ref = "sharpening-stone-two-grit"

[[setups]]
machine_kind = "other"
title = "Bench vise: square the bar end, saw the piece, file it to length"
machine = "Bench vise with soft jaws"
holding = "The 1/16 square bar, then the sawn piece, upright in the bench vise's soft jaws, gripped on two opposite flats. Each op says how far it stands out: to file, no more than 1/32 in above the jaw tops (the short piece tips under the file)."
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/vise.svg", alt = "Three panels in the bench vise's soft jaws: Op 20 the bar end filed square 1/32 out; Op 30 the .17 piece standing above the jaws, sawn off at the mark; Op 40 the piece filed end down, its sawn end filed to the .15 cut length." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the bar as it arrives across both pairs of flats, 1 in from the end."
inspection = "Both readings {{cad.section_stock_min_in:.4dot}}–{{cad.section_stock_max_in:.4dot}}, else stop: the bar is not undersized 1/16 key stock."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.section_stock_band_mm}}" }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Clamp the bar with its end 1/32 in above the jaw tops. File the end square to the flats in light strokes, the least that cleans it up. This is the datum end the length runs from."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Mark the bar {{process.blank_length_in:.2dot}} in from the filed end with the calipers' jaw tips. Clamp it with the mark 1/32 in above the jaw tops, the piece standing above it. Saw just below the mark, on the jaw (waste) side, so the kerf comes out of the rod and the piece stays at least that long; light strokes, the piece held between finger and thumb so it does not fly."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Clamp the piece filed end down on two flats, its sawn end 1/32 in above the jaw tops. File the sawn end square toward the {{cad.far_end_length_nominal_in:.2dot}} length; between passes take it out and caliper it across both ends. Stop inside {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}; Op 60 is the acceptance."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: break the cut ends, check the length"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished key: its .15 cut length between the two filed ends, the 1/16 square section as supplied." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "stone"
drilling = "none"
sizing = "other"
instruction = "Stone the burr off both cut ends on the 320-grit face of the two-grit sharpening stone and break their edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the four long flats as supplied."
feed = "hand"

[[setups.operations]]
instruction = "Measure the length across the cut ends with calipers."
inspection = "Length {{cad.far_end_length_min_in:.2dot}}–{{cad.far_end_length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.far_end_length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Over {{cad.far_end_length_max_in:.2dot}}: file the sawn end again as in Op 40, then repeat Ops 50 and 60. Under {{cad.far_end_length_min_in:.2dot}}: scrap it, not reworked; make another by repeating Ops 20 to 60 on the rest of the bar."
feed = "hand"

[[setups.operations]]
instruction = "Bag the key with its number (FINISH: as supplied, no coating: it is bonded in the arbor's keyseat)."
feed = "hand"
