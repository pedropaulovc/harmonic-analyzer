[[setups.operations]]
instruction = "File done, still clamped: take the #43 drill out of the spindle (keep it for the next op) and fit the edge finder; then the length, before tapping."
instruction_detailed = "Take the #43 drill out of its collet and keep it for hole 1's station; fit the edge finder in the spindle. Send G20 (the DRO reads inches). Edge finder (900 rpm, console) on the right end from the right: the work X DRO reads the length + .100. Send G21."
inspection = "Length {{cad.right_end_length_min_in:.3dot}}–{{cad.right_end_length_max_in:.3dot}}: the DRO {{process.length_dro_min_mm:in.3dot}}–{{process.length_dro_max_mm:in.3dot}}. Outside: stop and tell the owner (both ends are the program's from one X0)."
