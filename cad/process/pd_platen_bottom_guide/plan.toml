[[setups.operations]]
instruction = "Still clamped: hole 1's station from the left end."
instruction_detailed = "The #43 drill taken out before the length check: mic its shank. Its shank in hole 1; the calipers from the left end over the shank, less half its miked Ø."
inspection = "Hole 1 {{cad.lock_tap_1_station_min_in:.3dot}}–{{cad.lock_tap_1_station_max_in:.3dot}} from the left end. The other holes: the program's stations from the same X0, not gauged. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.lock_tap_1_station_band_mm}}" }]

[[setups.operations]]
instruction = "No #4-40 spiral-point tap in hand (it is to buy): unclamp, tag the rail AWAITING 4-40 TAP and stop here. When it comes: clamp as this setup, home, edge finder Y0 as before and X0 on the milled left end (G10 L20 P1 X-2.540), then go on."
feed = "hand"

[[setups.operations]]
instruction = "The #4-40 spiral-point tap, its thread at least 9/16 long (a standard hand tap), goes in the T-handle tap wrench with the centre hole in its top (the one the shop's 4-40 plug tap uses): the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the first tap file: measure the tap in the T-handle wrench from its point to the wrench's centre hole. It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stacks, the rail, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench). Over: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PB06_tap_1: M6 T4, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over hole 1."
diagram = { file = "diagrams/tap.svg", alt = "The rail as before, rear face up; the 4-40 tap in the T-handle wrench in a lock hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_point_depth_mm:in.3dot}} below the rear face, through the front face." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on R beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G91 G0 X3.810 (beside the hole, on R), G90, then send G20: the DRO reads inches. Stand the tap, in its wrench, on its point on R; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21 and MDI G91 G0 X-3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Send G20. Tap {{cad.lock_tap_1_thread}} through by hand under the tap guide, spindle off, cutting oil: the spring keeps the point in the wrench as the tap feeds, up to 1/2 in. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z reads the noted Z − {{process.tap_point_depth_mm:in.3dot}}: the point through F, the full thread the whole depth."
instruction_detailed = "Send G20, as when the depth was noted. Tap's point in the hole, a drop of cutting oil; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench steadily (a spiral point pushes its chips ahead, through F); push the point home again before the tap has gone 1/2 in. To read, push it fully home: stop at the noted Z − {{process.tap_point_depth_mm:in.3dot}}."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, send G21, back the tap out by hand and blow the hole out."
inspection = "A #4-40 screw runs through the thread by hand. Binds: run the tap through again under the tap guide; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PB07_tap_2, then PB08_tap_3 and PB09_tap_4 (the tap guide still in, spindle off; each ends Idle over its hole). Tap each the same way: G20, depth reference beside it, tap through to the same depth under the tap guide, G21, back out, blow out, screw check."
feed = "hand"

