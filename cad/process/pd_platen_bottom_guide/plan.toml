# Platen bottom guide MHA-PD-27 (qty 1), routed for the CNC mill (agent's
# choice for speed, owner ruling 2026-11-21: the owner corrects the route
# afterwards). One sawn blank of 3/4 in square 1018 cold-finished bar about
# 10.8 long, every face milled lying along the vise jaws on the 1 in + 1/2 in
# parallel stacks (1.5 in), centred, both ends 2.3 in out past the jaws: the
# .624 height, the .390-.400 depth, the 10.62 length and the four #4-40
# lock-tap holes through from the rear face, all from one zero, then tapped
# by hand under the spring tap guide.
#
# Route: saw; Setup 2 gripped on two cold-finished faces, skim the underside
# (PB01); Setup 3 underside down, face the top to the height (PB02); Setup 4
# gripped on the underside and the top, take the front face down .175
# (PB03); Setup 5 front face down, face the rear to the depth (PB04); Setup
# 6, both stacks moved to the fixed jaw's side (the hole exits fall .158
# from the top face, over the moving jaw's side, clear of them): mill both
# ends to the length with the cutter's side, spot and drill the four #43
# holes through (PB05), tap each by hand (PB06-PB09); bench deburr and
# inspect; black oxide + oil, in the shop with Presto Black Steel PC9 (owner
# ruling 2026-11-21; the PC9 and supplies are to buy).
# The heavy depth removal (.355) is split .175 off the front and .180 off
# the rear, and the height's .126 .050/.076, so the cold-finished bar's skin
# comes off both sides of each pair and the rail stays straight.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21, cnc rulings record: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so each tap stop is its
# own file ending M30 over its hole (PB06-PB09).
#
# Not made here (one line on the sheet): the five #4-40 platen taps
# (transferred from MHA-PD-02) and the four Ø.067 rack-screw holes with
# their Ø.110 counterbores (struck from MHA-PD-26) are made at MHA-PD-00
# (made_at = "assembly" in the export); their tools (#51, #35, 3/32 end
# mill, transfer punches) are that sheet's.
#
# Stock (cad/config/shop-equipment/ stock.1018-square-3-4, on hand, one
# 36 in bar): its order note allocates it to MHA-CH-08, CH-07, SH-01 and
# SH-02. SH-01 and SH-02 saw 3 × 2.05 max + .125 kerf each (their plans):
# 13.05; CH-08 (1.38 tall) and CH-07 (1.27 tall) are placeholders, taken at
# 2 × 1.50 + kerf each: 6.50. That leaves 16.45 in, enough for this blank's
# 10.85 + .125 kerf (5.5 in over) [INFERENCE: CH-07/CH-08 blanks under 1.50].
#
# Flagged, not owned: the spiral-point #4-40 tap (owner ruling 2026-11-20,
# #2427; shop-equipment tools.tap-4-40-spiral-point, to_order); the black
# oxide's Presto Black Steel PC9 and gloves and glasses (shop-equipment
# consumables.presto-black-steel-pc9 and chemical-gloves-eye-protection,
# to_order). Owner (Pedro), answered in person 2026-11-21: "Black oxide:
# cold blackening in the shop with Presto Black PC9 is acceptable as the
# drawing's black oxide." Setup 8 follows the PC9 instructions (cited on
# that record: steps 1 prepare, 2b brush-on, 3 stop, 4 dry, 6 seal with
# oil, the drawing's "+ oil").
#
# Zeroing: the touch probe has no holder (its 6 mm R8 collet is off the buy
# list, cad/config/shop-equipment/ gauges.touch-probe-diy0-tp05), so every
# X/Y zero is the owned .200 in edge finder at 900 rpm (logbook 2026-11-04,
# tools.edge-finder) and every Z zero the end mill on a .002 feeler leaf. The
# 4 in stacks lie wholly under the 10.8 in rail, so no stack top shows
# beside it: a skim's Z0 is the face it cuts (the high point less the skim),
# a to-size face's Z0 the stacks' top set from the miked thickness.
#
# NC (cam:pd_platen_bottom_guide, cad/process/pd_platen_bottom_guide/cam.py):
# PB01_underside, PB02_height, PB03_front, PB04_depth, PB05_ends_drill,
# PB06_tap_1 to PB09_tap_4. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2
# centre drill, T3 #43, T4 the tap guide (the tap is turned by hand).
title = "Platen bottom guide"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square: a plain carbon steel (drawing: Plain Carbon Steel)"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.right_end_length_min_in:.2f}}–{{cad.right_end_length_max_in:.2f}} long (left end to right end), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (underside to top), {{cad.rear_face_depth_min_in:.3dot}}–{{cad.rear_face_depth_max_in:.3dot}} deep (front face to rear face). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home. After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every cutting file is proved in air before it cuts; the tap files move only at the machine top and over a hole, spindle off. The five platen taps (from MHA-PD-02) and the four rack-screw holes (from MHA-PD-26) are made at MHA-PD-00, not here."
shop = "../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pd_platen_bottom_guide/features.toml"
adapter = "drilled_block"
part = "pd-platen-bottom-guide"

[parameters]
quantity = 1
# The blank (stock.1018-square-3-4): the bar's section and the sawn length
# the programs are posted for; stock_fit reads blank_<axis>_in (model axes:
# X the length, Y the height, Z the depth).
blank_x_in = 10.75
blank_y_in = 0.75
blank_z_in = 0.75
blank_section_in = 0.75
blank_section_mm = 19.05         # blank_section_in × 25.4: the holds' and cam.py's section.
# The incoming bar gate (.745-.752 both ways); the programs start their
# to-size faces from the thickest.
blank_section_min_mm = 18.923
blank_section_max_mm = 19.1008
blank_length_min_in = 10.75
blank_length_max_in = 10.85
blank_length_min_mm = 273.05
blank_length_max_mm = 275.59
kerf_in = 0.125
# Targets, the middle of each band (cam.py checks them against the export):
# length 10.62 (10.61-10.63), height .624 (.619-.629), depth .395
# (.390-.400 LIMIT; the model sits on its .400 limit).
length_target_mm = 269.748
height_target_mm = 15.8496
depth_target_mm = 10.033
# Skims (author's choice): the underside .050 (one level), the front face
# .175 (about half of the .355 the depth removes, so both sides lose skin),
# the left end .060 (a sawn end's lean and burr). The top, the rear face and
# the right end are faced to size from them; the right end's raw station
# (the longest blank) to the length in equal steps.
underside_skim_mm = 1.27
front_skim_mm = 4.445
left_end_skim_mm = 1.524
# The right end's finished station from the sawn left end: the skim plus
# the length (the end cuts' beam station).
right_end_station_mm = 271.272
# Op 270's length window on the work X DRO: the length band plus the .200
# edge finder's radius (cam.py checks them).
length_dro_min_mm = 272.034
length_dro_max_mm = 272.542
# Raw tops the to-size faces start from: the thickest bar less the skim
# taken off its other side. cam.py checks them.
height_raw_max_mm = 17.8308
depth_raw_max_mm = 14.6558
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) at shop
# settings.em-half-carbide-1018-3439-face, measured stable on the PM-30MV
# at up to 1.27 mm (.050) deep and 6.4 mm wide, 2420-2490 rpm in the cut
# (dechatter session of 2026-11-23, #3439; cad/config/shop-equipment/
# measured-cuts.toml, which allows the 28.45 mm stick-out): equal levels no
# deeper than .050 and equal passes across the face no wider than .192. The
# deepest level any face takes is the underside's one .050; the widest pass
# the 3/4 in faces' (19.05 + the 0.5 overhang in four: 4.8875; three would
# need 6.517, over the limit). The rail's .624 faces take four too (15.85 +
# 0.5 in four: 4.088): three of 5.450 would run no shorter (an odd count
# returns along its last pass to start the next level) and put prechips'
# bending estimate of the rear face over the finish limit. cam.py checks
# both are the declared cut. The faces zigzag (owner ruling 2026-11-16), so
# every other pass climbs: that half is not what the dechatter cut measured.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 4.8875
face_step_max_mm = 1.27
# Ends: the same cutter's side, one level from the rear face to .020 under
# the front face (end_axial_doc_mm, cam.py checks it), in equal radial steps
# no deeper than .030, one-way conventional passes across the rail. They
# stay on the chart setting (shop settings.endmill-carbide-3fl-1-2-1018-cf):
# 10.541 deep is past the deepest measured cut, 6.6 (measured-cuts.toml).
end_step_max_mm = 0.762
end_past_mm = 0.508
end_axial_doc_mm = 10.541
# Lock-tap holes: spot Ø.080 with the #2 centre drill, under the #43 (no
# chamfer at the mouth; the tap's start is the drill's), then the #43
# through, pecked .080 (under one diameter) with full retracts (L/D 4.4),
# its full diameter 1.0 mm past the front face into the air beside the
# stacks.
spot_dia_mm = 2.032
peck_mm = 2.032
drill_past_mm = 1.0
# The #43's point 1.0 + its 118° point (0.679) below the stacks' top;
# cam.py checks it.
drill_tip_height_mm = -1.679
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003 in/rev,
# a size between two columns taking the lower one's feed. Centre drill:
# 1800 rpm (88 ft/min on its 3/16 body; MHA-SH-01's spot) × .001 (its 5/64
# pilot) = 1.8 in/min. #43 (.089): 2800 rpm (65 ft/min, the mill's top)
# × .001 = 2.8 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
drill_feed_per_min_mm = 71.12
# Tapping #4-40 through: the tap's point stops this far below the rear face
# (.550): with a spiral-point (plug) chamfer of at most .125 the full thread
# runs through the .400 deepest rail, and a standard #4 hand tap's 9/16
# thread keeps its shank out of the hole. The point then stands .150 under
# the front face, in the air beside the stacks.
tap_point_depth_mm = 13.97
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): the set's 1 in and 1/2 in parallels stacked (1.5 in), one stack
# against each jaw in Setups 2-5; in Setup 6 both stacks side by side
# against the fixed jaw, under the underside's .25 strip.
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grip: jaw height less the stacks.
lying_grip_mm = 6.8453
# The blank centred on the jaws, the longest one: each end (its length −
# the jaw width)/2 out past the jaw sides; the jaws grip it from there to
# vise_clamp_end_mm (the beams' clamp).
vise_overhang_mm = 58.46
vise_clamp_end_mm = 217.13
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# 1/2 in end mill, 3 in overall, set 1.12 in (28.45) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"): the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm).
half_mill_projection_mm = 28.45
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the stacks, the deepest rail (.400) and the
# collet gauge, rounded down to .01 in; cam.py checks it. It is also the
# guide-and-tap stack's declared reach in the capacity check. The guide is
# 3 1/8 in (79.375) overall, its sellers' size and the most it can stand
# below the collet face; the tap's reach in its wrench is not on record, so
# the traveler stops before the first tap file unless the tap, point to the
# wrench's centre hole, is at most tap_wrench_reach_max_mm: 278.892 less
# 79.375, 199.517, rounded down to .01 in (cam.py checks it).
tap_stack_max_mm = 278.892
tap_wrench_reach_max_mm = 199.39

