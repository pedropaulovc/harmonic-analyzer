<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the section to scale at 4 px/mm (101.6 px/in), the plan at 1 px/mm, from the rail's sizes: 15.8496 mm across the jaws, 10.0330 mm above the stacks after the cut. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 28.45 mm out (half_mill_projection_mm) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on PB04_depth's pass Y-5.912 (+X) at Z10.033, the same place in both views: its last level (four, Z13.500 to 10.033), from the thickest bar (depth_raw_max_mm 14.6558); the pass least past the rail's edges (.438 mm over the fixed jaw's face, 7.8 mm above its top); the last, Y-10.000, is .500 mm past the moving jaw's face, the first, Y2.263, 8.61 mm over the fixed jaw. Hatched: what the cut takes, from 14.6558 mm above the stacks. The section is seen from the RIGHT end, the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745), stacked 1 in + 1/2 in (riser_height_mm 38.1). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
