<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="430"/>
  <text class="title" x="20" y="20">Section across the jaws, from the LEFT end (1 in = 100 px)</text>
  <line class="fixture-table" x1="60" y1="400" x2="420" y2="400"/>
  <rect class="clamp" x="152.6" y="223" width="60" height="177"/>
  <rect class="clamp" x="275" y="223" width="60" height="177"/>
  <text class="label-on-clamp" x="158" y="390">moving</text>
  <text class="label-on-clamp" x="285" y="390">fixed</text>
  <rect class="fixture-support" x="212.6" y="250" width="12.5" height="150"/>
  <rect class="fixture-support" x="262.5" y="250" width="12.5" height="150"/>
  <rect class="part-kept" x="212.6" y="210.5" width="62.4" height="39.5"/>
  <rect class="part-removed" x="212.6" y="192.5" width="62.4" height="18"/>
  <rect class="cutter" x="232" y="132" width="50" height="60"/>
  <line class="arrow" x1="250" y1="122" x2="220" y2="122"/>
  <line class="datum" x1="80" y1="250" x2="150" y2="250"/>
  <text class="datum-label" x="30" y="246">Z0 (F)</text>
  <line class="datum" x1="275" y1="196" x2="275" y2="222"/>
  <text class="datum-label" x="300" y="214">Y0 (U)</text>
  <text class="label-halo" x="219" y="236">top</text>
  <text class="label-halo" x="258" y="236">U</text>
  <line class="leader" x1="280" y1="205" x2="340" y2="150"/>
  <text class="label" x="300" y="145">rear face R faced to Z {{process.depth_target_mm:in.4dot}} in levels</text>
  <line class="dims" x1="380" y1="210.5" x2="380" y2="250"/>
  <line class="dims" x1="370" y1="210.5" x2="390" y2="210.5"/>
  <line class="dims" x1="370" y1="250" x2="390" y2="250"/>
  <text class="label" x="395" y="234">depth {{cad.rear_face_depth_min_in:.3dot}}–{{cad.rear_face_depth_max_in:.3dot}}, miked</text>
  <text class="label" x="345" y="300">turned over about its length: F down,</text>
  <text class="label" x="345" y="318">U now at the fixed jaw, LEFT end still left</text>
</svg>
