  <line class="dims" x1="725.5" y1="160" x2="725.5" y2="275"/>
  <text class="label" x="560" y="288">length {{cad.right_end_length_in:.2f}}</text>
  <text class="label" x="430" y="320">4X #43 thru, stations {{cad.lock_tap_1_station_in:.3f}}, {{cad.lock_tap_2_station_in:.3f}},</text>
  <text class="label" x="430" y="338">{{cad.lock_tap_3_station_in:.3f}}, {{cad.lock_tap_4_station_in:.3f}} from the left end</text>
</svg>
