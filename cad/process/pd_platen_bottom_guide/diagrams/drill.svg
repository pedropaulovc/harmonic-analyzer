  <rect class="clamp" x="514.6" y="110" width="156.2" height="30"/>
  <rect class="clamp" x="514.6" y="155.6" width="156.2" height="30"/>
  <rect class="part-removed" x="458.5" y="140" width="1.5" height="15.6"/>
  <rect class="part-removed" x="725.5" y="140" width="4" height="15.6"/>
  <rect class="part-kept" x="460" y="140" width="265.5" height="15.6"/>
  <circle class="holes" cx="532.7" cy="151.65" r="1.6"/>
  <circle class="holes" cx="546.5" cy="151.65" r="1.6"/>
  <circle class="holes" cx="638.9" cy="151.65" r="1.6"/>
  <circle class="holes" cx="652.7" cy="151.65" r="1.6"/>
  <circle class="cutter" cx="451.75" cy="147.8" r="6.35"/>
  <circle class="cutter" cx="733.75" cy="147.8" r="6.35"/>
