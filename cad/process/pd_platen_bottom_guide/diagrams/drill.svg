<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm from the rail's sizes (the depth F to R 10.033 mm, 15.8496 mm across the jaws). #43 drill Ø2.2606 mm (milling_cuts cutter_dia_mm, shop jig-drill-43), 118° point, at the first hole's Y-11.836 (PB05_ends_drill), its full diameter drill_past_mm 1.0 past F, its point at drill_tip_height_mm -1.679 (Z0 the stacks' top, F); drawn short to a break line, the chuck not drawn (no size on record). The #2 centre drill's spot before it is not drawn (the drill stands for it). Section seen from the RIGHT end, the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745), stacked 1 in + 1/2 in (riser_height_mm 38.1). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">PB05_ends_drill: the #43 drill through a hole, across the jaws (to scale, 4 px/mm)</text>
  <rect class="fixture-vise" x="146.6" y="470" width="243.4" height="14"/>
  <rect class="clamp" x="146.6" y="290.22" width="90" height="179.78"/>
  <rect class="clamp" x="300" y="290.22" width="90" height="179.78"/>
  <rect class="fixture-support" x="274.6" y="317.6" width="12.7" height="152.4"/>
  <rect class="fixture-support" x="287.3" y="317.6" width="12.7" height="152.4"/>
  <rect class="part-kept" x="236.6" y="277.47" width="63.4" height="40.13"/>
  <text class="label-on-clamp" x="191.6" y="458" text-anchor="middle">moving jaw</text>
  <text class="label-on-clamp" x="345" y="458" text-anchor="middle">fixed jaw</text>
  <line class="datum" x1="300" y1="288.22" x2="300" y2="334.22"/>
  <text class="datum-label" x="396" y="304.22">Y0 the fixed</text>
  <text class="datum-label" x="396" y="320.22">jaw's face</text>
  <rect class="holes" x="248.13" y="277.47" width="9.04" height="40.13"/>
  <path class="cutter" d="M257.18 157.47L257.18 321.6L252.66 324.32L248.13 321.6L248.13 157.47L250.4 154.47L252.66 157.47L254.92 154.47Z"/>
  <line class="centre-line" x1="252.66" y1="145.47" x2="252.66" y2="410"/>
  <line class="arrow" x1="236.66" y1="167.47" x2="236.66" y2="207.47"/>
  <line class="datum" x1="110.6" y1="317.6" x2="142.6" y2="317.6"/>
  <text class="datum-label" x="106.6" y="322.6" text-anchor="end">Z0 the stacks'</text>
  <text class="datum-label" x="106.6" y="338.6" text-anchor="end">top (F)</text>
  <text class="label" x="440" y="120">#43 drill (Ø.089), pecked {{process.peck_mm:in.3dot}},</text>
  <text class="label" x="440" y="136">its full diameter {{process.drill_past_mm:in.3dot}} past F</text>
  <text class="label" x="440" y="152">(the centre drill's spot first, not drawn)</text>
  <line class="leader" x1="438" y1="132" x2="257.18" y2="217.47"/>
  <circle class="leader-dot" cx="257.18" cy="217.47" r="2"/>
  <text class="label" x="440" y="200">the hole {{cad.lock_tap_1_height_in:.3dot}} from U</text>
  <text class="label" x="440" y="230">the #43 comes out of F here, in the air,</text>
  <text class="label" x="440" y="246">clear of the stacks at the fixed jaw</text>
  <line class="leader" x1="438" y1="236" x2="254.66" y2="328.32"/>
  <circle class="leader-dot" cx="254.66" cy="328.32" r="2"/>
  <text class="label" x="440" y="360">F down on the stacks, U against the</text>
  <text class="label" x="440" y="376">FIXED jaw, R up, LEFT end to the left.</text>
  <text class="label" x="440" y="430">the stacks</text>
  <line class="leader" x1="438" y1="426" x2="280.95" y2="430"/>
  <circle class="leader-dot" cx="280.95" cy="430" r="2"/>
