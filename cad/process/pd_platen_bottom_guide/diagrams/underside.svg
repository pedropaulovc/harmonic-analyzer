<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="430"/>
  <text class="title" x="20" y="20">Section across the jaws, from the LEFT end (1 in = 100 px)</text>
  <line class="fixture-table" x1="60" y1="400" x2="420" y2="400"/>
  <rect class="clamp" x="140" y="223" width="60" height="177"/>
  <rect class="clamp" x="275" y="223" width="60" height="177"/>
  <text class="label-on-clamp" x="146" y="390">moving</text>
  <text class="label-on-clamp" x="285" y="390">fixed</text>
  <rect class="fixture-support" x="200" y="250" width="12.5" height="150"/>
  <rect class="fixture-support" x="262.5" y="250" width="12.5" height="150"/>
  <rect class="part-kept" x="200" y="180" width="75" height="70"/>
  <rect class="part-removed" x="200" y="175" width="75" height="5"/>
  <rect class="cutter" x="225" y="120" width="50" height="55"/>
  <line class="arrow" x1="240" y1="110" x2="210" y2="110"/>
  <line class="datum" x1="186" y1="180" x2="196" y2="180"/>
  <text class="datum-label" x="118" y="184">Z0</text>
  <line class="datum" x1="275" y1="196" x2="275" y2="222"/>
  <text class="datum-label" x="300" y="214">Y0</text>
  <line class="leader" x1="280" y1="177" x2="340" y2="140"/>
  <text class="label" x="300" y="135">skim {{process.underside_skim_mm:in.3dot}}: becomes U</text>
  <line class="leader" x1="270" y1="320" x2="345" y2="300"/>
  <text class="label" x="345" y="296">1 in + 1/2 in parallels, one stack at each jaw</text>
  <text class="label" x="345" y="252">{{process.lying_grip_mm:in.3dot}} in the jaws</text>
  <text class="label" x="205" y="230">CF</text>
  <!-- Plan, fixed jaw at the top. -->
  <text class="title" x="440" y="60">Plan (fixed jaw at the top, 1 in = 25 px)</text>
  <rect class="clamp" x="517.5" y="110" width="156" height="30"/>
  <rect class="clamp" x="517.5" y="159" width="156" height="30"/>
  <rect class="part-kept" x="460" y="140" width="271" height="19"/>
  <line class="arrow" x1="450" y1="205" x2="745" y2="205"/>
  <text class="label" x="470" y="225">zigzag passes along the rail, end to end</text>
  <line class="datum" x1="461.5" y1="126" x2="461.5" y2="172"/>
  <text class="datum-label" x="440" y="100">X0 {{process.left_end_skim_mm:in.3dot}} in from the LEFT end</text>
  <text class="label" x="560" y="260">both ends about 2.3 in past the jaws</text>
</svg>
