  <text class="label-halo" x="218" y="245">U</text>
  <line class="leader" x1="280" y1="190" x2="340" y2="150"/>
  <text class="label" x="300" y="145">top faced to Z {{process.height_target_mm:in.4dot}} in levels</text>
  <line class="dims" x1="380" y1="187.6" x2="380" y2="250"/>
  <line class="dims" x1="370" y1="187.6" x2="390" y2="187.6"/>
  <line class="dims" x1="370" y1="250" x2="390" y2="250"/>
  <text class="label" x="395" y="224">height {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}}, miked</text>
  <text class="label" x="345" y="300">same stacks, the blank turned over</text>
  <text class="label" x="345" y="318">about its length, LEFT end still left</text>
