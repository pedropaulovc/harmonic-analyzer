  <line class="datum" x1="80" y1="250" x2="150" y2="250"/>
  <text class="datum-label" x="30" y="246">Z0 (F)</text>
  <line class="leader" x1="240" y1="78" x2="320" y2="70"/>
  <text class="label" x="325" y="74">tap guide in the spindle, spindle OFF</text>
  <line class="leader" x1="290" y1="128" x2="320" y2="110"/>
  <text class="label" x="325" y="110">T-handle wrench, centre hole on the point</text>
  <line class="leader" x1="234" y1="230" x2="345" y2="200"/>
  <text class="label" x="350" y="200">{{cad.lock_tap_1_thread}} spiral-point tap, through</text>
  <line class="dims" x1="380" y1="210.5" x2="380" y2="276"/>
