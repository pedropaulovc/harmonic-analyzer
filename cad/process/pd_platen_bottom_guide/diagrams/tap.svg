<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the rail, the tap's diameter and the tap guide's body to scale at 4 px/mm (the depth F to R 10.033 mm). #4-40 tap Ø.112 (2.845 mm, the thread's major diameter), its point at tap_point_depth_mm 13.97 below R (3.937 mm below F), its end drawn as the near half of its end face (an arc 12 % of its diameter deep). Tap guide (tools.tap-guide-fisher): body Ø.5 (shank_dia_in) drawn to a break line, its point Ø.1875 (point_dia_in). The tap's length, the T-handle wrench and how far the point stands out are not on record: schematic. The wrench and the guide in the tool's colour: they turn or travel with the tap. Section seen from the RIGHT end, the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745), stacked 1 in + 1/2 in (riser_height_mm 38.1). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">PB06: the 4-40 tap by hand under the tap guide (rail to scale, 4 px/mm)</text>
