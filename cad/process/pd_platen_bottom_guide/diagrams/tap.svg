  <line class="fixture-table" x1="60" y1="400" x2="400" y2="400"/>
  <rect class="clamp" x="152.6" y="223" width="60" height="177"/>
  <rect class="clamp" x="275" y="223" width="60" height="177"/>
  <rect class="fixture-support" x="250" y="250" width="12.5" height="150"/>
  <rect class="fixture-support" x="262.5" y="250" width="12.5" height="150"/>
  <rect class="part-kept" x="212.6" y="210.5" width="62.4" height="39.5"/>
  <rect class="part-threads" x="222.8" y="210.5" width="11.2" height="39.5"/>
  <!-- The tap through the rail, its point .550 below R. -->
  <rect class="cutter" x="224" y="140" width="8.8" height="125.5"/>
  <polygon class="cutter" points="224,265.5 232.8,265.5 228.4,276"/>
