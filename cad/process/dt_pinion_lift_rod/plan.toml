diagram = { file = "diagrams/trial.svg", alt = "The trial offcut in the 3-jaw over the shim wrap, its end faced; the ball turner's pivot on the axis one radius behind the faced end, its bit swept from the apex toward you." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the offcut's end square, about .02 off, to the centre with no pip."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound swung to 45°: with the AR tool's point on the faced end's corner, feed the compound in to rough the corner off, a 45° chamfer {{process.dome_chamfer_in:.3dot}} along the face and along the O.D. It stays outside the crown (a {{cad.dome_far_form_chamfer_max_in:.3dot}} leg would touch it)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: clamp the ball turner's 3/8 shank in an AXA No. 1 holder, the inner frame swung parallel to the spindle axis. Set the bit's tip level with the tailstock dead centre's point. Take the centre out and run the tailstock back: nothing may stand within 4 in beyond the faced end."

[[setups.operations]]
cut_kind = "other"
instruction = "Set the bit to R{{cad.dome_far_form_radius_in:.4dot}}: lay a 1-2-3 block's ground edge across the inner frame's edges and read the bit's tip from it with the calipers' depth rod: {{process.ball_turner_rule_in:.4dot}} (the radius plus the maker's 3/16 from the frame's end to the pivot). Tighten the bit's set screw."

[[setups.operations]]
cut_kind = "other"
instruction = "Inner frame parallel to the axis: bring the carriage up until the bit's tip just touches the faced end; lock the carriage and zero the DRO Z. The pivot is now one radius behind the faced plane, so the apex stays on it. The carriage stays locked until the crown is done."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: run the cross slide out until the bit clears the end through the whole sweep. Swing the frame through the sweep and turn the chuck one full turn by hand: the jaws must miss the outer frame's arms (they reach .19 either side of the pivot)."

[[setups.operations]]
cut_kind = "other"
instruction = "An arm touches the jaws: unlock the carriage, chuck the offcut {{process.end_stickout_in:.2dot}} in out again over the shim wrap and repeat Ops 90–100."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ball"
drilling = "none"
sizing = "other"
instruction = "Spindle on. Cross slide in until the bit just touches the chamfer somewhere in the sweep. Sweep the frame from parallel to the axis round toward you to {{cad.dome_far_form_sweep_deg:.0f}}°, never toward the chuck; cross slide in .003 at most, sweep again. The last sweeps take .001."
settings = "lathe-ball-turner-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between the last sweeps, spindle stopped, look at the apex under a loupe. Stop feeding in when the flat left at the apex just vanishes: the pivot is then on the axis. Never further: past the axis the bit leaves a ring or a point."

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: hold the radius gauges' {{cad.dome_far_form_radius_in:fraction}} leaf (concave) square across the crown through the axis, at two places 90° apart, against a light."
inspection = "Crown R{{cad.dome_far_radius_min_in:.2dot}}–{{cad.dome_far_radius_max_in:.2dot}}: no light under the {{cad.dome_far_form_radius_in:fraction}} leaf; no pip, flat or ring at the apex."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Light at the leaf's ends (crown too round): reset the bit (Op 80) to a depth-rod reading .005 longer; light at its middle (too flat): .005 shorter. Face the crown off (Op 50), draw the offcut back out to {{process.end_stickout_in:.2dot}} in, and repeat Op 60, Ops 90–100 and Ops 120–140. Under .30 in left in the jaws: saw a new trial offcut. Once it passes, leave the bit's set screw alone until the rod's crown is cut."

