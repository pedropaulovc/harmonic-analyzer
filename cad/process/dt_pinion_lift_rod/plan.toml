# Pinion lift rod MHA-DT-17, one off. The ends are turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC); the two set-screw flats are milled on the CNC PM-30MV (NC: cam.py).
# Route chosen for speed: the O.D. is 1/4 ground stock as supplied (1/4
# GROUND ROD, AS SUPPLIED, printed REF; owner ruling 2026-11-20, #2346: a ground-stock shaft is
# cut to length, faced and has its features added, never turned on its
# fitted diameter). Saw a blank a little long; in the 3-jaw over a shim wrap,
# a short stick-out, the rest of the bar back in the spindle bore: face the
# front end; turn it round, face the far end to the faced length (the 8.15
# body plus the crown's height: the crown keeps its apex on the faced plane)
# and sweep the SR.19 crown with the LittleMachineShop 2569 ball turner set
# to R.1875 (3/16) on a trial offcut. Then on the mill: the
# rod lying along the vise jaws on one centred parallel, both flats in one
# clamping (LR01_flats, X0 on the crown's apex: the flats are stationed from
# the crown's root), so they face the same way. The Ø.064 cross hole is
# match-drilled at assembly through the MHA-DT-16 hub (MHA-DT-00).
#
# NC (cam:dt_pinion_lift_rod, cad/process/dt_pinion_lift_rod/cam.py):
# LR01_flats. Program name, the [parameters] and the milling_cuts names are a
# contract with that recipe. T1 is the 1/8 in end mill.
#
# The crown: owner ruling 2026-11-23 (tool audit Q5, option D): "buy the
# LittleMachineShop 'Ball and Radius Turning Tool, Small' (SKU 2569,
# $124.95; convex 0-.75 in dia, 3/8 shank) for all 14 domes; step-and-file
# is the fallback for any dome it cannot reach. Confirm each dome is convex
# and reachable before buying." Reach test: convex SR.19 crown (R.18-.20),
# ball Ø.375 under the tool's .75; the far end is free (no centre); the .50
# stickout holds the crown's centre .50 - .1875 = .31 out of the jaws (the
# frame's arms need .25: R.20 + .25 = .45 at the band's top) and stays under
# 3 x Ø.25 = .75; nothing over Ø.75 on the rod. Reachable. The radius is set
# to 3/16 (R.1875, inside the band; the R.180 form tool this replaces sat on
# its low limit) once on a trial offcut and checked with the radius gauges'
# 3/16 leaf, the one leaf inside R.18-.20. The corner is roughed off first
# with a 45° chamfer that stays outside the sphere.
#
# Flagged: the ball turner (shop/lathe.toml tools.ball-radius-turner-lms-2569)
# and the radius gauges (gauges.radius-gauges) are to order. 1/4 in 1018 ground
# round (stock-to-order.toml 1018-ground-round-1-4) is to order. Lengths over
# 6 in are read with the owned 0-12 in height gauge on the surface plate (the
# owned calipers stop at 6 in).
title = "Pinion Lift Rod"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel, precision-ground round, 1/4 in"
stock = "Ø{{process.stock_dia_in:.4dot}} ground bar (to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long and one {{process.trial_offcut_in:.2dot}} in trial offcut (allow two saw kerfs)."
shop = "../shop"
stock_refs = ["1018-ground-round-1-4"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

standing = true

[[notes]]
title = "This job"
rows = [
  ["O.D.", "The O.D. is left as supplied: grip it over a brass shim wrap (lathe) and never cut it."],
]

[cad]
file = "../../out/features/dt_pinion_lift_rod/features.toml"
adapter = "turned_shaft"
part = "dt-pinion-lift-rod"

[parameters]
quantity = 1
stock_dia_in = 0.25
# Sawn a little over the faced length: about .03 in to face off each end.
blank_length_in = 8.26
as_supplied_outer = 1
# Out of the jaw fronts while an end is faced and crowned: under 4 × Ø.
end_stickout_in = 0.5
# The radius the ball turner is set to (process key named for the form tool
# it replaces; the adapter binds the crown's height, the faced length and the
# sweep from it): the crown is swept full (to the centre, no flat at the
# apex) on the Ø.250, .1875 − √(.1875² − .125²) = .0477 high
# (cad.dome_far_form_height); the faced length is the body's 8.14–8.16 plus
# it (cad.faced_length_*), so holding it holds the body.
dome_form_radius_in = 0.1875
# The bit set by depth reading from a straightedge across the inner frame's
# edges: the radius plus the maker's 3/16 from the frame's end to the pivot
# (LittleMachineShop 2569 instructions): .1875 + .1875.
ball_turner_rule_in = 0.375
# A trial offcut of the same bar, sawn with the blank, for setting the
# radius: the .50 stickout plus about .5 in the jaws.
trial_offcut_in = 1.0
# The roughing chamfer's leg, ahead of the sweep: .9 × the .0439 cap height
# that limits it on the flattest crown the drawing's R.18-.20 band admits
# (R.20, whose sphere a 45° line first meets at the root), rounded down to
# .005; the R.1875 set here would allow .0474 on the least Ø.2492 bar
# (cad.dome_far_form_chamfer_max; the adapter refuses more).
dome_chamfer_in = 0.035
# The back flat read from the crown's apex: its .51–.53 station from the
# crown's root plus the .0477 crown the R.1875 sweep cuts on the Ø.250 bar.
flat_back_apex_min_in = 0.5577
flat_back_apex_max_in = 0.5777
flat_back_apex_min_mm = 14.1656
flat_back_apex_max_mm = 14.6736
# Mill (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): one 1 in parallel of the set standing on edge, centred between the
# jaws, 1/16 in clear of each (two parallels would fill the 1/4 in gap and
# take the grip off the rod); the rod lying on its top edge along the jaws,
# gripped on its O.D.; the cutter works down between the jaw faces.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The jaw tops over the O.D. top (Z0): jaw height less the parallel and the
# O.D.; cam.py checks it.
jaw_top_over_od_mm = 13.1953
# Centred: the rod past the left jaw side by (length − jaw width)/2 (the vise
# hold's left overhang), as far past the right; the right jaw side from the
# left end. cam.py checks them.
vise_jaw_from_x0_mm = 24.774
vise_jaw_to_x0_mm = 183.448
# The 1/8 in end mill's flats (shop endmill-carbide-3fl-1-8): its centre
# crosses each flat's width at X stations no more than half the cutter apart.
em_eighth_dia_mm = 3.175
flat_stepover_max_mm = 1.5875
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# 1/8 in end mill, 1-1/2 in overall: set at least .75 in out of the collet,
# so it reaches the flats .53 in down between the jaws with the collet nut
# above the jaw tops (cam.py checks it).
em_eighth_projection_min_mm = 19.05
# Each flat's depth below the O.D. top: the O.D. less the across, nominal
# (.2500 − .2380 = .0120 in); cam.py checks it against the export.
flat_depth_mm = 0.3048
# Each flat's ends from the crown's apex (X0) as the R.1875 sweep cuts it,
# .021 mm past the model's SR.19 apex; cam.py checks them.
flat_back_from_mm = 14.421
flat_back_to_mm = 22.041
flat_front_from_mm = 177.235
flat_front_to_mm = 184.855

