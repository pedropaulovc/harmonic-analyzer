[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis."
instruction_detailed = "Console M6 T1 (1/8 in end mill, at least {{process.em_eighth_projection_min_mm:in.2dot}} in out of the collet). MDI G0 X10.000 Y0.000: over the O.D. left of the jaws, past the crown. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run LR01_flats (M6 T1, 1/8 in end mill; set 2800): each flat ramped in across its width, then cut {{process.flat_depth_mm:in.3dot}} deep in passes across it, the back flat {{process.flat_back_from_mm:in.3dot}}–{{process.flat_back_to_mm:in.3dot}} and the front flat {{process.flat_front_from_mm:in.3dot}}–{{process.flat_front_to_mm:in.3dot}} from the crown's apex."
settings = "endmill-carbide-3fl-1-8-lathe-1018"
milling_cuts = [
  { name = "flat_back", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_back_from_mm}}", "{{process.flat_back_to_mm}}"] },
  { name = "flat_front", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_front_from_mm}}", "{{process.flat_front_to_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp and read each flat across to the O.D. under it with the calipers' outside jaws, the jaw tips on the flat (a micrometer's Ø.25 anvil is wider than the flat)."
inspection = "Each flat across {{cad.flat_back_across_min_in:.3dot}}–{{cad.flat_back_across_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_back_across_band_mm}}" }]

[[setups.operations]]
instruction = "A flat outside the band: the rod is scrap; make another from Setup 1 (once unclamped, the round rod will not seat again with its flats at the same angle, so a flat is not re-cut)."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished rod: the 8.15 body from the front face to the crown's root, the SR.19 crown, the two .238 flats on one side, the O.D. as supplied; the pin hole comes at assembly." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the front face's edge, the crown's rim and the flats' edges with the smooth file, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the O.D. and the crown's face untouched."
feed = "hand"

[[setups.operations]]
instruction = "Back flat: read with the calipers from the crown's apex to the flat's nearer end, and the flat's length. Front flat: read from the front face to the flat's nearer end and its length; its station from the crown's root is the Op 170 length less the crown's {{cad.dome_far_form_height_in:.4dot}}, that reading and its length."
inspection = "Back flat from the apex {{process.flat_back_apex_min_in:.4dot}}–{{process.flat_back_apex_max_in:.4dot}}, {{cad.flat_back_length_min_in:.2dot}}–{{cad.flat_back_length_max_in:.2dot}} long; front flat from the root {{cad.flat_front_station_min_in:.2dot}}–{{cad.flat_front_station_max_in:.2dot}}, {{cad.flat_front_length_min_in:.2dot}}–{{cad.flat_front_length_max_in:.2dot}} long."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.flat_back_apex_min_mm}}", "{{process.flat_back_apex_max_mm}}"] }, { gauge = "calipers", band_mm = "{{cad.flat_back_length_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.flat_front_length_band_mm}}" }]

[[setups.operations]]
instruction = "Mike the O.D. at both ends and the middle: the jaws must not have marked it."
inspection = "O.D. Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
instruction = "A flat out of station or length, or a jaw-marked O.D. under {{cad.outer_dia_min_in:.4dot}}: scrap the rod and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the rod with machine oil (FINISH: bright machined, ISO VG 32 machine-oil film). It leaves without its Ø{{cad.cross_hole_dia_min_in:.3dot}} pin hole: MHA-DT-00 match-drills it through the MHA-DT-16 hub at assembly."
