[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 x 1-1/4 in brass bar with one blank {{process.blank_x_in:.2f}}–{{process.blank_x_max_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one blank {{process.blank_x_in:.2f}}–{{process.blank_x_max_in:.2f}} in long off the 3/4 x 1-1/4 in C360 bar, the bar lying on its wide face in the saw's vise (the bar is shared with MHA-MS-02: leave its length). File the burr off both sawn ends and the four long edges so the blank seats flat on the parallels. Mark one wide face TOP and one narrow face BACK with marking fluid; the sawn ends are faced off."
feed = "hand"
inspection = "Blank {{process.blank_x_in:.2f}}–{{process.blank_x_max_in:.2f}} long, calipers. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = [27.94, 29.21] }]

[[setups.operations]]
instruction = "Blank shorter than {{process.blank_x_in:.2f}}: saw another. Longer than {{process.blank_x_max_in:.2f}}: saw it again."
feed = "hand"

[[setups.operations]]
instruction = "Mic the blank's thickness (across the wide faces) and width (across the narrow faces), each at both ends. Setups 4 and 6 skim the back face and B at a fixed height above the stacks: these windows give each skim {{process.bar_skim_min_mm:in.3dot}}–{{process.bar_skim_max_mm:in.3dot}}."
inspection = "Thickness {{process.bar_thick_min_mm:in.3dot}}–{{process.bar_thick_max_mm:in.3dot}} and width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}, micrometers."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.bar_thick_min_mm}}", "{{process.bar_thick_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] },
]

[[setups.operations]]
instruction = "Either reading outside its window: stop and tell the owner before Setup 2."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Paper end P"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel against each jaw. The blank upright on them, a sawn end up, gripped across its two wide faces (TOP to the fixed jaw), centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. The lower {{process.upright_grip_mm:in.2dot}} of it is in the jaws."
datum = "Program VB01_paper_end (cam:pn_pen_v_block). G54: X0 Y0 the blank's axis, Z0 the faced end; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/paper-end.svg", alt = "The blank upright on two 1 in parallels in the vise, a sawn end up; the 1/2 in end mill faces it in passes along the jaws." }
envelope = { x_span_mm = [31.75, "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = [19.05, "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", 29.21], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = 19.05, along_jaws_mm = 31.75, part_height_mm = 29.21, parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, 29.21], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = 31.75, y = 19.05 }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 Y0 the blank's axis: edge finder (900 rpm) on the left and right faces and on the fixed jaw."
instruction_detailed = "Home the mill first ($H). Mic the blank across its wide faces and note it. Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face beside the blank, G10 L20 P1 Y(half the miked thickness in mm − 2.540); for .750, Y6.985. X: its tip .10 below the sawn top, on the blank's LEFT narrow face from the left, G10 L20 P1 X0; on its RIGHT narrow face from the right, G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced end, the sawn top's high point less the {{process.end_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.end_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "Prove VB01_paper_end in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run VB01_paper_end, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run VB01_paper_end (M6 T1, 1/2 in end mill; set 2800): face the end at Z0, {{process.end_skim_mm:in.3dot}} off the high point, in passes no wider than {{process.face_stepover_max_mm:in.3dot}}. Still clamped, look at the end."
inspection = "No sawn patch left on the faced end."
gauge_checks = "other"
settings = "pn-em-half-c360"
milling_cuts = [
  { name = "paper end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.end_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "A sawn patch left: lower Z0 .010 and run VB01_paper_end again; look again."
instruction_detailed = "A sawn patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run VB01_paper_end again; look again."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp; scribe P on this end: it is the paper end, X0 of every setup after Setup 3."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Far end to the length"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 2, the blank turned over: P down on both parallels, the sawn end up, TOP to the fixed jaw."
datum = "Program VB02_length. G54: X0 Y0 the blank's axis, Z0 the parallels' top (P); +Y toward the fixed jaw."
