]

[[setups.operations]]
instruction = "Each 4-40 tap goes in the T-handle tap wrench with the centre hole in its top: the tap guide's point seats in that hole."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before the tap file: measure the longer of the two 4-40 taps in the T-handle wrench from its point to the wrench's centre hole (calipers, or the combination square's 12 in blade). It must be at most {{process.tap_wrench_reach_max_mm:in.2f}} in (the mill's 17 in opening less the vise, the stacks, this block, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench)."
feed = "hand"

[[setups.operations]]
instruction = "Over {{process.tap_wrench_reach_max_mm:in.2f}} in: stop; do not tap on this setup; tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run VB08_set_screw_tap: M6 T8, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the hole."
diagram = { file = "diagrams/tap.svg", alt = "The block lying front face up; a 4-40 tap in the T-handle wrench in the set-screw hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to go {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} below the front face, into the bore." }

[[setups.operations]]
instruction = "Plug tap depth reference, in inches: send G20, then note the DRO Z with the plug tap's point standing on the front face beside the hole and the tap guide's point pushed fully home in the wrench. Stay in G20 until both taps are out."
instruction_detailed = "Send G20: the DRO reads inches. MDI G0 X.709 (over the front face beside the hole). Stand the 4-40 plug tap, in its T-handle wrench, on its point on the front face; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear and MDI G0 X.490 (over the hole), still in G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Plug tap by hand under the tap guide, spindle off, Tapmatic Gold: the spring keeps the point in the wrench as the tap feeds. Read the depth with the point pushed fully home, as the reference: stop when the DRO Z (G20, inches) reads its noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}): its point is in the bore, short of the far wall."
instruction_detailed = "Plug tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn. To read, push the point fully home again: stop at the noted Z (G20) less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}); past {{process.tap_reach_max_mm:in.3dot}} the point reaches the bore's far wall."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear and back the plug tap out by hand, still in G20."
feed = "hand"

[[setups.operations]]
instruction = "Bottoming tap depth reference: note the DRO Z (G20) with the bottoming tap's point standing on the front face beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X.709 (over the front face beside the hole). Stand the 4-40 bottoming tap, in its T-handle wrench, on its point on the front face; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear and MDI G0 X.490 (over the hole)."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40-bottoming"
drilling = "none"
sizing = "other"
instruction = "Bottoming tap (to buy) in the plug tap's thread, under the tap guide the same way, until the DRO Z (G20), read with the point pushed fully home, reads its noted Z less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}): the thread is now full to the bore, where the set screw's cup must reach."
instruction_detailed = "Bottoming tap started by hand in the plug tap's thread, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home. Turn the wrench, a half turn back each turn; the spring follows the tap. To read, push the point fully home again: stop at the noted Z (G20) less {{process.tap_reach_min_mm:in.3dot}}–{{process.tap_reach_max_mm:in.3dot}} (aim {{process.tap_reach_mm:in.3dot}}); past {{process.tap_reach_max_mm:in.3dot}} the point reaches the bore's far wall."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, back the bottoming tap out by hand, then send G21 (the controller back in mm); blow the hole and the bore out."
feed = "hand"

