# Pen V block MHA-PN-05 (qty 1), routed for the CNC mill (owner ruling
# 2026-11-21: the agent chooses the route for speed, the owner corrects it
# afterwards). One blank of the 3/4 x 1-1/4 in C360 flat bar (stock
# c360-flat-3-4x1-1-4, on hand; shared with MHA-MS-02), about 1.1 long: the
# .71 height comes from the bar's 3/4 thickness, the .86 depth from its
# 1-1/4 width, the 1.03 length along the bar.
#
# Route: saw; Setups 2-3 upright on two 1 in parallels: face the paper end P
# (VB01), turn over, face the far end to the length (VB02). Setups 4-8 lying
# on a 1/2 in + 5/8 in parallel stack against each jaw (1-1/8 in, so the
# front neck step's floor stands above the jaw tops): skim the back face and
# cut the back neck step (VB03); back down, face the front to the depth and
# cut the front neck step (VB04); bottom up, skim the bottom face B, mill the
# relief slot with the 1/2 in end mill, cut the V with the owned 1/4 in 90°
# chamfer mill in stepped levels and sweep its flat with the chamfer mill's
# tip in fine passes, then take the slot's two step corners with the 1/8 in
# end mill (VB05); B down, face the top to the
# height, spot, drill #32, ream .1260 and chamfer the pivot bore down into
# the slot, then break the neck's two top edges .080 × 45° with the same
# chamfer mill (VB06); front up, spot and drill #43 into the bore (VB07) and tap
# 4-40 by hand under the spring tap guide (VB08), the plug tap first, then the
# bottoming tap to the same reach. Bench: clean the bore with the reamer by
# hand, deburr, inspect. Bright brass: machined, washed, no coating.
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (VB08).
#
# Not owned, to buy before this traveler runs (flagged; the traveler marks
# each): the .1260
# chucking reamer (reamer-1260), the .1260/.1265 plug gauge pair
# (plug-gauges-1260-1265: the pin-gauge sets step by .001 and hold no .1265)
# and the 4-40 bottoming tap (tap-4-40-bottoming: the owned plug tap's
# chamfer is not on record, and at B94.9's worst five threads it would leave
# the set screw's thread tapered short of the bore).
# The placeholder's 1/2 in 90° chamfer mill is not needed: the owned 1/4 in
# one cuts each flank in stepped levels; its pin gauges are replaced by the
# plug gauge pair. The owned protractor checks the flanks.
#
# Zeroing: the touch probe has no holder, so every X/Y zero is the owned
# .200 in edge finder at 900 rpm and every Z zero the end mill on a .002
# feeler leaf, as the column clamp and magnifying clamp plans do. X0 is the
# paper end P in every lying setup, the block to +X.
#
# NC (cam:pn_pen_v_block, cad/process/pn_pen_v_block/cam.py): VB01_paper_end,
# VB02_length, VB03_back, VB04_front, VB05_bottom, VB06_top_bore,
# VB07_set_screw, VB08_set_screw_tap. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2
# 1/4 in chamfer mill, T3 1/8 in end mill, T4 centre drill, T5 #32, T6
# .1260 reamer, T7 #43, T8 the tap guide (the tap is turned by hand).
title = "Pen V block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C360 free-machining brass, 3/4 x 1-1/4 in flat bar (drawing: {{cad.material_spec}})"
stock = "{{process.blank_y_in:fraction}} x {{process.blank_z_in:fraction}} in flat bar; {{process.quantity:d}} × {{process.blank_x_in:.2f}}–{{process.blank_x_max_in:.2f}} in blank."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.far_end_length_min_in:.3dot}}–{{cad.far_end_length_max_in:.3dot}} long (paper end P to the far end), {{cad.top_face_height_min_in:.3dot}}–{{cad.top_face_height_max_in:.3dot}} high (bottom face B to the top), {{cad.body_back_depth_min_in:.3dot}}–{{cad.body_back_depth_max_in:.3dot}} deep (front face to back face). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home (logbook 2026-11-06). After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every cutting file is proved in air (Z0 raised 1.000 in); the tap file moves only at the machine top and over the hole, spindle off. Finish {{cad.finish}}: machined and washed, no coating."
shop = "../shop"
stock_refs = ["c360-flat-3-4x1-1-4"]
material_key = "pn-c360-flat"
milling_material = "brass"

[cad]
file = "../../out/features/pn_pen_v_block/features.toml"
adapter = "drilled_block"
part = "pn-pen-v-block"

[parameters]
quantity = 1
# The bar (stock.c360-flat-3-4x1-1-4) and the blank the programs are posted
# for: model X along the bar (the sawn length, the author's 1.10-1.15 to
# clean both ends), Y its 3/4 thickness, Z its 1-1/4 width.
blank_x_in = 1.10
blank_x_max_in = 1.15
blank_y_in = 0.75
blank_z_in = 1.25
# Skims (author's choice, .020 in each, enough to clean a sawn end or the
# bar's extruded face): the paper end, the back face and the bottom face.
# The far end, the front face and the top are faced to size from them in
# equal levels no deeper than face_step_max_mm (.080 in, the author's choice
# for the 1/2 in carbide end mill in brass).
end_skim_mm = 0.508
back_skim_mm = 0.508
bottom_skim_mm = 0.508
face_step_max_mm = 2.032
# VB03 and VB05 skim the back face and B at a fixed height above the stacks
# (the nominal bar less the .020 skim): the bar is miked before Setup 2 and
# must give each skim at least bar_skim_min_mm (.005 in, the least that
# cleans the extruded skin) and at most bar_skim_max_mm (.030 in, one light
# pass). cam.py checks the windows.
bar_skim_min_mm = 0.127
bar_skim_max_mm = 0.762
bar_thick_min_mm = 18.669
bar_thick_max_mm = 19.304
bar_width_min_mm = 31.369
bar_width_max_mm = 32.004
# The back neck step's depth below the back face (VB03); cam.py checks it
# against the model.
back_step_depth_mm = 2.032
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2), equal
# passes no wider than half the cutter (6G's chip-load factor 1.0 holds to
# 50 % engagement, shop settings.pn-em-half-c360).
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
# Relief slot, the 1/2 in end mill: levels of .065 in (its first pass a full
# slot). Its two corners at the step print R.065 (.060-.070) (owner ruling
# 2026-11-23, tool audit Q9: "cut with the 1/8 end mill; no 5/64 cutter"):
# the owned 1/8 in end mill (shop endmill-carbide-3fl-1-8) takes them to its
# own R.0625 in levels of its slotting limit, .35 × its diameter (Harvey
# Tool miniature square end mills, series 720xx, Brass row; buried at the
# step it slots), at least 5/8 in out of its collet (the collet then stands
# .37 above B at the corners' floor). cam.py checks the radius against the
# printed band, the level and the flutes' reach.
relief_step_max_mm = 1.651
corner_cutter_dia_mm = 3.175
corner_step_max_mm = 1.11125
eighth_mill_projection_min_mm = 15.875
# The V, the 1/4 in chamfer mill: tip levels of at most 1.0 mm, passes 1.0
# mm apart across each level (the cone then engages under 1/8 in, shop
# settings.pn-chamfer-1-4-c360). Five levels: .9968 mm each.
v_step_max_mm = 1.0
v_stepover_max_mm = 1.0
v_level_mm = 0.9968
# The V's flat, swept again at the last level by the chamfer mill's pointed
# tip in passes .002 in apart, its outer passes on the flat's edges: a 90°
# cone's neighbouring passes leave a ridge half their spacing high, .001 in
# at most (cam.py V_FLAT_RIDGE_MAX_MM). cam.py computes the spacing.
v_flat_stepover_mm = 0.0508
# The neck's two top edges (owner seat ruling 2026-11-23: .080 × 45°, .075
# to .085, with the 1/4 in chamfer mill), VB06: the chamfer mill's point
# along each neck face in levels no deeper than the V's, equal: three of
# .6773 mm to the .080 leg, from P to the breaks' full end .33 (the drawing's
# neck_edge_breaks.full_to_x). cam.py checks both.
break_level_mm = 0.677333
break_full_to_mm = 8.382
# Spots, the #2 centre drill (60°): Ø.100 on the pivot bore, under the #32;
# Ø.080 on the set-screw hole, under the #43, so neither leaves a chamfer.
spot_bore_dia_mm = 2.54
spot_tap_dia_mm = 2.032
# Pecks with full retract, under one diameter each: #32 .100 in, #43 .080 in.
peck_32_mm = 2.54
peck_43_mm = 2.032
# The #32's full diameter runs this far past the relief slot's roof; the
# reamer's end runs ream_past_mm past it (its full diameter past the roof
# with the 45° bevel lead).
drill_past_mm = 1.0
ream_past_mm = 1.5
# Feeds each program runs and the sheet prints (mm/min), the shop settings'
# (cad/process/shop/pn.toml, sourced there): centre drill, #32 and #43 2800
# rpm × .001 in/rev = 2.8 in/min; reamer 1400 × .003 = 4.2 in/min. cam.py
# refuses a feed that is not its setting's.
spot_feed_per_min_mm = 71.12
drill_32_feed_per_min_mm = 71.12
ream_feed_per_min_mm = 106.68
drill_43_feed_per_min_mm = 71.12
# Tapping: the taps' point below the front face, both the plug tap and the
# bottoming tap that finishes after it: from the bore's near wall at its
# smallest (the wall farthest from the front face) plus the bottoming tap's
# worst chamfer (two threads, ASME B94.9) to .010 short of the far wall at
# its smallest. cam.py checks both.
tap_reach_min_mm = 11.43
tap_reach_max_mm = 12.192
tap_reach_mm = 11.811
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick, 1/2 to 1 in by 1/16): upright, a 1 in parallel against each jaw;
# lying, the set's 1/2 in and 5/8 in parallels stacked against each jaw
# (1-1/8 in).
parallel_height_mm = 25.4
stack_height_mm = 28.575
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 16.3703
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides: upright the bar's width, lying the length.
vise_upright_inset_mm = -63.46
vise_lying_inset_mm = -66.26
# Upright, the longest blank less the paper-end skim stands above the
# parallels in VB02; cam.py checks it.
upright_top_max_mm = 28.702
# Deepest tips above the stacks: VB06, the #32's point (the slot roof less
# drill_past_mm and its 118° point .885) and the reamer's end; VB07, the
# #43's point past the bore's axis (its full diameter to the axis, 10.922
# above the back face, less its .679 point). cam.py checks each.
bore_tip_height_mm = 4.719
ream_tip_height_mm = 5.104
tap_tip_height_mm = 10.243
# Full-diameter hole depths the traveler prints, the ones the files drill:
# the #32 the slot roof's depth below the top plus drill_past_mm; the #43 to
# the bore's axis below the front face. cam.py checks both.
bore_drill_depth_mm = 12.396
tap_drill_depth_mm = 10.922
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set at least 1 in out of the collet.
half_mill_projection_min_mm = 25.4
# ASME B94.11M jobber length, overall: #32 2-1/4 in; the #2 combined drill
# and countersink 1-7/8 in. The .1260 reamer to buy has no length on record:
# bounded by 3-1/2 in, longer than a straight-shank chucking reamer of the
# size. Bounded by their whole length below the chuck.
drill_32_oal_mm = 57.15
reamer_oal_max_mm = 88.9
centre_drill_oal_mm = 47.625
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the stacks, the block's depth and the collet
# gauge: 276.777, rounded down to .01 in (cam.py checks it); it is also the
# guide-and-tap stack's declared reach in the setups' capacity check. The
# guide is 3 1/8 in (79.375) overall, its sellers' size and the most it can
# stand below the collet face; the taps' reach in their wrench is not on
# record, so the traveler stops before the tap file unless the longer tap,
# point to the wrench's centre hole, is at most tap_wrench_reach_max_mm:
# 276.606 less 79.375, 197.231, rounded down to .01 in.
tap_stack_max_mm = 276.606
tap_wrench_reach_max_mm = 197.10

