<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale: the plan at 7 px/mm, the section at 5 px/mm, from the block's length (1.030). 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out (half_mill_projection_min_mm, a least stick-out) to a break line; the collet not drawn. Shown on its skim of B at Z18.542, the pass at Y-10.408 over the block (the first, Y0.764, hangs over the fixed jaw), at X13, the same place in both views. Hatched: the relief slot it mills next, .260 (6.604 mm) deep, from the steps (.350) to the far end, between .120 and .740 from the front (the drawing); in the plan also the V along the neck that the chamfer mill cuts after (its own picture). Stacks 1/2 + 5/8 in (stack_height_mm). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
