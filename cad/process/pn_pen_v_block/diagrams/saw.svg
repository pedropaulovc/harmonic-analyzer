<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm from the bar's 1-1/4 in width. The saw's vise jaws' size is not on record: schematic; the blade drawn in the cut, short to break lines (its kerf is not on record: schematic). -->
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="24">Saw: one blank off the 3/4 x 1-1/4 in C360 bar (plan, 4 px/mm)</text>
  <rect class="part-arriving" x="40" y="88" width="558" height="127"/>
  <rect class="part-kept" x="598" y="88" width="116.84" height="127"/>
  <rect class="clamp" x="150" y="66" width="300" height="22"/>
  <rect class="clamp" x="150" y="215" width="300" height="22"/>
  <text class="label-on-clamp" x="300" y="82" text-anchor="middle">saw's vise jaw</text>
  <text class="label-on-clamp" x="300" y="231" text-anchor="middle">saw's vise jaw</text>
  <path class="cutter" d="M594 60L596 57L598 60L600 57L602 60L602 240L600 243L598 240L596 243L594 240Z"/>
  <text class="label" x="230" y="156.5" text-anchor="middle">bar stays in stock (shared with MHA-MS-02)</text>
  <text class="label" x="654" y="147.5" text-anchor="middle">blank</text>
  <text class="label" x="654" y="163.5" text-anchor="middle">3/4 thick</text>
  <line class="dims" x1="598" y1="232" x2="714.84" y2="232"/>
  <text class="label" x="560" y="250">{{process.blank_x_in:.2f}}–{{process.blank_x_max_in:.2f}} in</text>
  <text class="label" x="610" y="50">saw blade</text>
  <text class="label" x="40" y="280">File the burrs off both sawn ends and the long edges; mark one wide face TOP, one narrow face BACK.</text>
