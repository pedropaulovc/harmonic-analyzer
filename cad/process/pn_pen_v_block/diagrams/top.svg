<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="460"/>
  <text class="title" x="20" y="22">VB06: section along the block through the bore (8 px/mm), B down, P left</text>
  <!-- The fixed jaw behind, its top 16.4 mm above the stacks; the stacks under the block's edges. -->
  <rect class="hidden" x="40" y="80.4" width="360" height="359.6" fill="none"/>
  <rect class="fixture-support" x="60" y="211.4" width="320" height="228.6"/>
  <line class="fixture-table" x1="30" y1="440" x2="420" y2="440"/>
  <!-- The block at the bore's plane: the V's flat under the neck, the relief slot under the body. -->
  <polygon class="part-kept" points="120,67.4 329.3,67.4 329.3,158.6 191.1,158.6 191.1,171.5 120,171.5"/>
  <rect class="part-removed" x="120" y="63.1" width="209.3" height="4.3"/>
  <!-- Pivot bore down into the slot; the #30's point below the roof. -->
  <rect class="holes" x="206.8" y="67.4" width="25.6" height="91.2"/>
  <polygon class="holes" points="207.8,158.6 231.4,158.6 219.6,173.6"/>
  <polygon class="active-face" points="203.9,67.4 235.3,67.4 232.4,70.3 206.8,70.3"/>
  <!-- The #30 drill above the bore. -->
  <rect class="cutter" x="206.8" y="32" width="25.6" height="28"/>
  <line class="arrow" x1="219.6" y1="30" x2="219.6" y2="100"/>
  <line class="datum" x1="120" y1="40" x2="120" y2="66"/>
  <text class="datum-label" x="126" y="50">X0 = P</text>
  <line class="datum" x1="329.3" y1="211.4" x2="430" y2="211.4"/>
  <text class="datum-label" x="434" y="215">Z0 stacks' top (B)</text>
  <line class="leader" x1="430" y1="66" x2="330" y2="64"/>
  <text class="label" x="434" y="70">top faced to the height</text>
  <line class="leader" x1="430" y1="100" x2="233" y2="100"/>
  <text class="label" x="434" y="104">pivot bore Ø{{cad.pivot_bore_dia_min_in:.4dot}}–{{cad.pivot_bore_dia_max_in:.4dot}}, X {{cad.pivot_bore_station_in:.3dot}}:</text>
  <text class="label" x="434" y="120">spot, #30 drill to size, pecks of</text>
  <text class="label" x="434" y="136">{{process.peck_30_mm:in.3dot}} full retract, chamfer mill</text>
  <line class="leader" x1="430" y1="172" x2="232" y2="168"/>
  <text class="label" x="434" y="176">#30 point in the slot's air</text>
  <text class="label" x="434" y="230">relief slot (cut in VB05)</text>
  <line class="leader" x1="430" y1="226" x2="300" y2="185"/>
  <text class="label-halo" x="130" y="190">V flat (VB05)</text>
  <text class="label" x="434" y="300">fixed jaw (behind): FRONT face</text>
</svg>
