<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 5 px/mm from the bar's 3/4 in (19.05 mm) thickness. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), its square end drawn as the near half of its end face (arc 12 % of its diameter deep, its lowest point the true end), drawn 1 in out (half_mill_projection_min_mm, a least stick-out) to a break line; the collet not drawn. Shown on the pass at Y1.213 (the files' first pass, Y10.987, hangs over the fixed jaw), which the posted VB02 runs +X at every level: out of the page (seen from the right end, fixed jaw on the right, +Y to the right and +Z up, so +X points at the viewer); at the last level, the length 1.030 (26.162 mm); hatched: the levels from 28.702 (upright_top_max_mm). The 1 in parallels (parallel_height_mm, parallel_thickness_mm). The vise jaws' thickness and the parallels' length are not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm). -->
  <rect class="paper" x="0" y="0" width="760" height="470"/>
  <text class="title" x="20" y="24">VB02, across the jaws, to scale (5 px/mm): P down, the far end faced to the length</text>
  <rect class="fixture-vise" x="162.38" y="450" width="275.25" height="14"/>
  <rect class="clamp" x="162.38" y="225.27" width="90" height="224.73"/>
  <rect class="clamp" x="347.62" y="225.27" width="90" height="224.73"/>
  <rect class="fixture-support" x="252.38" y="323" width="15.88" height="127"/>
  <rect class="fixture-support" x="331.75" y="323" width="15.88" height="127"/>
  <rect class="part-kept" x="252.38" y="179.49" width="95.25" height="143.51"/>
  <text class="label-on-clamp" x="207.38" y="245.27" text-anchor="middle">moving jaw</text>
  <text class="label-on-clamp" x="392.62" y="245.27" text-anchor="middle">fixed jaw</text>
  <rect class="part-removed" x="252.38" y="179.49" width="95.25" height="12.7"/>
  <path class="cutter" d="M337.81 184.57L337.81 65.19L333.85 68.19L329.88 65.19L325.91 68.19L321.94 65.19L317.97 68.19L314 65.19L310.03 68.19L306.06 65.19L302.1 68.19L298.13 65.19L294.16 68.19L290.19 65.19L286.22 68.19L282.25 65.19L278.28 68.19L274.31 65.19L274.31 184.57A31.75 7.62 0 0 0 337.81 184.57Z"/>
  <line class="centre-line" x1="300" y1="40" x2="300" y2="468"/>
  <line class="datum" x1="202.38" y1="323" x2="248.38" y2="323"/>
  <text class="datum-label" x="198.38" y="328" text-anchor="end">Z0: the parallels' top (P)</text>
  <line class="datum" x1="202.38" y1="192.19" x2="248.38" y2="192.19"/>
  <text class="datum-label" x="198.38" y="197.19" text-anchor="end">Z {{cad.far_end_length_in:.3dot}}</text>
  <text class="label" x="470" y="92.19">1/2 in end mill on a middle pass,</text>
  <text class="label" x="470" y="108.19">along +X (out of the page)</text>
  <line class="leader" x1="468" y1="96.19" x2="337.81" y2="132.19"/>
