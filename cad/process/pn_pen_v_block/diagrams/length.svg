  <text class="label" x="470" y="250">P down on the 1 in parallels.</text>
  <text class="label" x="470" y="266">Levels of {{process.face_step_max_mm:in.3dot}} max down to</text>
  <text class="label" x="470" y="282">the length {{cad.far_end_length_min_in:.3dot}}-{{cad.far_end_length_max_in:.3dot}}.</text>
  <text class="label" x="470" y="390">1 in parallel against each jaw</text>
