<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="460"/>
  <text class="title" x="20" y="22">VB07: section along the block through the set-screw hole (8 px/mm), FRONT up, P left</text>
  <rect class="hidden" x="40" y="80.4" width="360" height="359.6" fill="none"/>
  <rect class="fixture-support" x="60" y="211.4" width="320" height="228.6"/>
  <line class="fixture-table" x1="30" y1="440" x2="420" y2="440"/>
  <!-- The block in this plane: the neck between its steps, the body to the far end; the pivot bore crosswise. -->
  <polygon class="part-kept" points="120,52.9 191.1,52.9 191.1,36.6 329.3,36.6 329.3,211.4 191.1,211.4 191.1,195.1 120,195.1"/>
  <circle class="holes" cx="219.6" cy="124" r="12.8"/>
  <!-- The #43 from the front face to the bore's axis. -->
  <rect class="holes" x="210.6" y="36.6" width="18" height="76"/>
  <polygon class="holes" points="210.6,124 228.6,124 219.6,129.5"/>
  <rect class="cutter" x="210.6" y="26" width="18" height="10"/>
  <line class="arrow" x1="219.6" y1="40" x2="219.6" y2="100"/>
  <line class="datum" x1="120" y1="25" x2="120" y2="50"/>
  <text class="datum-label" x="70" y="40">X0 = P</text>
  <line class="datum" x1="329.3" y1="211.4" x2="430" y2="211.4"/>
  <text class="datum-label" x="434" y="215">Z0 stacks' top (BACK)</text>
  <line class="leader" x1="430" y1="70" x2="229" y2="70"/>
  <text class="label" x="434" y="74">4-40 tap drill #43, X {{cad.set_screw_tap_station_in:.3dot}}: spot, then</text>
  <text class="label" x="434" y="90">pecked to the bore's axis ({{cad.set_screw_tap_into_axis_in:.3dot}} deep)</text>
  <line class="leader" x1="430" y1="124" x2="233" y2="124"/>
  <text class="label" x="434" y="128">pivot bore (VB06), crosswise</text>
  <line class="leader" x1="430" y1="176" x2="200" y2="45"/>
  <text class="label" x="434" y="180">tap wall to the step face {{cad.set_screw_tap_wall_min_min_in:.3dot}} min</text>
  <text class="label" x="434" y="300">fixed jaw (behind): B</text>
  <text class="label-halo" x="124" y="48">front step</text>
  <text class="label-halo" x="124" y="208">back step</text>
</svg>
