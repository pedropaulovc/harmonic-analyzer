# MHA-PD-18 transgear arm, prechips traveler (drilled_block adapter; owner
# order 2026-11-21, paper-drive CNC enrolment).
#
# Route, chosen for speed (one part, quantity 1): one blank of 3/8 x 1
# precision-ground 1018 is sawn to 5.70-5.75 in; Setup 2 (PM-30MV CNC, the
# blank flat on parallels, AR01_holes) makes every hole through the faces from
# the rear face: the pivot bore (B) drilled #9 and the pin bore (C) drilled and reamed,
# the pivot's Ø.50 counterbore plunged to its floor with the 1/2 in end mill, the
# pin bore's rear mouth broken with the chamfer mill. Setup 3 makes a 1/2 in
# 6061 sub-plate (AR02_plate drills it, AR03/AR04 stop for the hand taps), the
# arm is screwed down on it through its own bores and AR05_outline cuts the
# whole outline (pivot round, flanks, square end) through into the plate; the
# screws hold the part, so no tabs. Setup 4 (the lathe) passes the arm
# through the spindle bore, its square end in the 4-jaw dialled to the
# section's centre, and spots, drills and reams the blind latch-pin hole from
# the tailstock. Bench deburr and inspection; then the oil film.
#
# Left to the assembly (MHA-PD-00, not made here; the last op names them):
# 2X Ø.1240 dowel holes (PD-00 13A pilots through arm and plate, 13D reams the
# arm's two), the 2X 8-32 tapped holes' match work (13L spot through the
# plate, 13N #29 drill, 13P tap) and the MHA-PD-23 pin's bond (11A-11J).
#
# PENDING OWNER CORRECTION (#3184): two assumptions this plan rests on.
# (1) Stock: 3/8 x 1 precision-ground 1018, Online Metals 12095 (±.001
#     thickness), chosen over cold-finished flat so the faces stay as supplied.
# (2) Faces as supplied: front face A and the rear face are not machined; the
#     ground thickness is the drawing's 3/8 (.3750) GROUND STOCK REF.
#
# To order (not owned): the 12095 bar (stock.1018-ground-flat-3-8x1, one
# 12 in length), the pin-gauge set for the pin
# bore's one check (pin-gauges: its .127 pin must not enter, the upper end
# of the bond clearance MHA-PD-23's drawing prints, on its smallest shank; owner ruling
# 2026-11-24, fit audit question 4: the bore prints the .1260 reamer's
# size with no band and the MHA-PD-23 pin is bonded in it, so the Class X
# .1260/.1265 pair is gone from this plan; cad.pin_bore_dia_band_mm is the
# drawing module's ANALYSIS band, which sizes the reaming op and is no
# acceptance), and the
# two fixture screws (#10-32 x 5/8 and #4-40 x 5/8 socket head cap screws).
# The pivot bore is the #9 drill's hole (owner ruling 2026-11-24, fit audit
# question 6: "Pivot spacer MHA-PD-20 drilled #12 and bonded, with the arm
# pivot drilled #9", approved as recommended; it reverses #2413's .1940
# reamer): no reamer; the drawing's DRILLED HOLES row, .196 +.004/0, is
# checked with two set pins: .196 enters, .200 does not.
#
# The latch-pin hole (fit audit 2026-11-23, pending owner confirmation; the
# owner on the audit: "can the holes not be reamed in the first place"):
# reamed with the over/under set's .1240 reamer and accepted with its own
# MHA-PD-VN-58 dowel, which does not enter by hand; no Class ZZ pins, no pin
# or reamer miking and no trial hole. A dowel that does slide in fails the
# sheet's note 3: the arm stops and the owner is told (traveler review t2:
# passing it on to a bond was an acceptance the drawing does not print).
# Its depth is the reamer's quill reading. Tool audit
# 2026-11-23 (row india-stone-ib8): the stone is the owned two-grit stone's
# 320 face (McMaster-Carr 4506A2), as ch_rocker_strap words it.
#
# Programs: AR01_holes (T1-T7), AR02_plate (T1, T8, T9), AR03_tap_pivot and
# AR04_tap_pin (T10, the tap guide; spindle off), AR05_outline (T11). Setup 4
# is manual (the lathe). Zeroing per setup is in each setup's datum line.
title = "Transgear arm"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel, 3/8 x 1 in flat, precision ground (drawing: {{cad.material_spec}})"
stock = "{{process.blank_z_in:fraction}} x {{process.blank_y_in:.0f}} in precision-ground 1018 flat (Online Metals 12095), one 12 in length: one blank {{process.blank_length_min_mm:in.2f}}–{{process.blank_length_max_mm:in.2f}} in. Sub-plate: a 3.0 in piece sawn off the end of the 1/2 x 6 in 6061 flat."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). The bar is bought precision ground (Online Metals 12095, ±.001 thick), so face A (the front) and the rear face stay as supplied and are never machined; mark A in Setup 1 and keep it readable. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) at the start of every mill setup; each M6 is measured on the tool setter against G54 Z0; pick G54 up again after any E-stop, reset or vise move. Prove each CNC file in air before its first cut. The 2X Ø.1240 dowel holes and the 2X 8-32 tapped holes' match work are made at assembly (MHA-PD-00), not here."
shop = "../shop"
stock_refs = ["1018-ground-flat-3-8x1", "6061-flat-1-2x6-54in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pd_transgear_arm/features.toml"
adapter = "drilled_block"
part = "pd-transgear-arm"

[parameters]
quantity = 1
# The blank: X along the bar, Y across it (1 in), Z its thickness (3/8 in).
blank_x_in = 5.725
blank_y_in = 1.0
blank_z_in = 0.375
blank_width_mm = 25.4
blank_length_min_mm = 144.78
blank_length_max_mm = 146.05
# The pivot's station from the blank's left end: the 141.4 arm with 1.40 mm
# at the pivot end and at least 1.48 at the square end of the shortest blank.
pivot_from_end_mm = 13.9
blank_end_margin_min_mm = 1.4
# Holding: two 1 in parallels (shop-equipment fixtures.parallels-lms-6745) in
# the 6 in PM vise (shop vise-pm-6).
parallel_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044
vise_jaw_height_mm = 44.9453
vise_jaw_width_mm = 158.6738
# The jaws' top above the parallels' top (Setup 2's Z0): 44.9453 − 25.4.
holes_jaw_top_mm = 19.5453
# Holes: the #1 centre drill's spot Ø, the drills' full diameter past face A,
# their points (118°) below Z0, the reamers' tips below Z0.
spot_dia_mm = 2.5
drill_past_mm = 1.0
drill_14_tip_mm = -2.389
drill_9_tip_mm = -2.496
drill_32_tip_mm = -1.885
ream_past_mm = 1.5
drill_peck_mm = 2.54
# The chamfer mill's point: the rear face less the reamed bore's radius and
# the .008 leg (45°).
chamfer_tip_mm = 7.722
# Setup 3: the sub-plate, 6.0 in along X (the 6 in bar's width) by 3.0 across
# the jaws, 1/2 in thick, on the same parallels; the arm centred on it.
plate_length_mm = 152.4
plate_width_mm = 76.2
plate_thickness_mm = 12.7
pivot_on_plate_x_mm = 18.0
# AR05's G54 X/Y is picked up on the arm itself, not the plate, so the screws'
# clearance in the bores (up to ~.006 radial) does not move the outline off
# the bores: AR01 put the pivot pivot_from_end_mm from the blank's left end
# and on its centre line, .500 in from each ground edge. With the .200 edge
# finder: from -X on the left end, X = pivot_on_plate_x_mm less
# pivot_from_end_mm less its radius; from +Y on the ground edge nearer the
# fixed jaw (the centre line at Y -1.500, the edge .500 above it), Y = that
# edge plus its radius (cam.py checks both).
edge_finder_dia_mm = 5.08
arm_x_set_mm = 1.56
arm_y_set_mm = -22.86
plate_jaw_top_mm = 6.845
plate_drill_past_mm = 1.0
# The arm on the plate along X: from the pivot round's back to the square end,
# and the two screws' stations (the pivot and the pin bore).
arm_start_on_plate_mm = 5.5
arm_end_on_plate_mm = 146.9
pin_on_plate_x_mm = 86.815
plate_drill_21_tip_mm = -14.913
plate_drill_43_tip_mm = -14.379
# The outline: the rough pass .010 outside it in levels of at most .039, to
# .010 into the plate; the finish pass at the cutter's radius in one level.
outline_finish_mm = 0.254
outline_through_mm = 0.254
outline_rough_offset_mm = 3.429
outline_level_max_mm = 1.0
outline_levels = 10
outline_level_mm = 0.98044
outline_plunge_feed_per_min_mm = 25.4
# The farthest blank corner from the outline (the longest blank): under the
# rough pass's reach (6.604), so no loose scrap is left.
blank_scrap_reach_mm = 6.556
# Setup 4: the latch-pin hole's reamed full-diameter depth (.400), the
# reamer's end chamfer (.020) and the #32's full-diameter depth (.460).
latch_ream_depth_mm = 10.16
latch_ream_lead_mm = 0.508
latch_drill_depth_mm = 11.684
# (The hole is accepted with its dowel: no pin-gauge parameters.)
arm_length_mm = 141.4
# Each vise hold is centred in the 6.247 in jaws: the work's inset (a
# negative overhang) at the jaws' start, (its length − 158.6738) / 2.
holes_overhang_mm = -6.947
plate_overhang_mm = -3.137
# Tool reach (the capacity checks): the drill chuck's gauge length (shop
# pm-30mv), the R8 collet's, a chucking reamer's 3-1/2 in overall (ASME
# B94.2 for these sizes) and the end mills' least stick-out.
drill_chuck_gauge_mm = 95.0
r8_collet_gauge_mm = 6.3
reamer_oal_mm = 88.9
# Tapping the bare sub-plate under the spring tap guide
# (tools.tap-guide-fisher; owner ruling 2026-11-21): the guide and the tap in
# its wrench together reach at most tap_stack_max_mm below the collet face,
# the spindle-to-table maximum (shop machines.pm-30mv, 431.8) less 25.0 to
# bring the point down onto the wrench (the shop's tool-change clearance),
# the vise bed, the 1 in parallels, the 1/2 in sub-plate and the collet
# gauge: 289.096, rounded down to .01 in. The guide is 3 1/8 in (79.375)
# overall; the tap's reach in its wrench is not on record, so the traveler
# stops before AR03 unless the tap, point to the wrench's centre hole, is at
# most tap_wrench_reach_max_mm: 289.052 less 79.375, 209.677, rounded down
# to .01 in.
tap_stack_max_mm = 289.052
tap_wrench_reach_max_mm = 209.55
quarter_mill_projection_min_mm = 19.05

