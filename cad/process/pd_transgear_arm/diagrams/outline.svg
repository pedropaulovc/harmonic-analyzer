<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left: a section across the jaws, from the RIGHT end, 4.5 px/mm (the fixed jaw on the right, Y0 its face): the two 1 in parallels (1/8 thick, parallel_thickness_mm) against the jaws, the 1/2 x 3 in 6061 sub-plate (plate_thickness_mm, plate_width_mm) on them, its top Z0, the jaw tops 6.845 mm over it (plate_jaw_top_mm). The jaws' thickness and the parallels' length are not on record; jaws and parallels drawn short to a break line toward the bed. Right: from above, 1.6 px/mm, the plate's left end X0, the pivot at X18.0, Y-38.1 (pivot_on_plate_x_mm). The arm screwed down face A on the plate: the blank 1.00 x .375 seen in section at X100, the outline's two flanks 9.01 mm each side of its centre line there; hatched: the outline's removal through all levels, .010 into the plate (outline_through_mm). The 1/4 in end mill to scale (endmill-carbide-3fl-1-4, Ø6.35 mm = 28.6 px) on the posted AR05 first rough level, Z8.570, its centre at Y-25.659 (.135 outside the flank, outline_rough_offset_mm 3.429), passing -X along the flank toward the pivot (anticlockwise); 22.5 mm from the fixed jaw's face. Square end drawn as its end face's near half, 12 % deep; short to a break line (at least .75 in out of the collet). The screws (the #10-32 head Ø.312 x .190 on the spot face's floor, the #4-40 head Ø.183 x .112 on the rear face) are off this section: from above, in the hardware colour. -->
