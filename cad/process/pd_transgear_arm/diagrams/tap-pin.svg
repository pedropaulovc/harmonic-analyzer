<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left: a section across the jaws, from the RIGHT end, 4.5 px/mm (the fixed jaw on the right, Y0 its face): the two 1 in parallels (1/8 thick, parallel_thickness_mm) against the jaws, the 1/2 x 3 in 6061 sub-plate (plate_thickness_mm, plate_width_mm) on them, its top Z0, the jaw tops 6.845 mm over it (plate_jaw_top_mm). The jaws' thickness and the parallels' length are not on record; jaws and parallels drawn short to a break line toward the bed. Right: from above, 1.6 px/mm, the plate's left end X0, the pivot at X18.0, Y-38.1 (pivot_on_plate_x_mm). The arm off. The #4-40 tap's diameter to scale (its major diameter Ø2.845 mm = 12.8 px), its arc-ended point 12 % of its diameter deep at the plate's underside (through). The tap's length and the T-handle wrench are not on record: schematic. The tap guide (shop tap-guide-fisher): its point Ø3/16 to scale in the wrench's centre hole, its Ø.5 shank to scale, drawn short to a break line (3 1/8 in long). Wrench and guide in the tool's colour: they travel with the tap. Spindle off. -->
