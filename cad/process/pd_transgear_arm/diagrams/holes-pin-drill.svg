<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left: a section across the jaws, from the RIGHT end, 7 px/mm (the fixed jaw on the right, Y0 its face): the two 1 in parallels, 1/8 thick (parallel_height_mm, parallel_thickness_mm), against the jaws; the blank 1.00 x .375 (blank_width_mm, rear_face_thickness_stock) face A down on them, its centre line at Y-.500; the jaw tops 19.545 mm over face A (holes_jaw_top_mm). The jaws' thickness and the parallels' length are not on record; the jaws and parallels drawn short to a break line toward the bed. Right: from above, 2.2 px/mm, X0 the blank's left end, the arm's outline (cut in Setup 3) dashed. The #32 drill to scale (shop drill-32, Ø2.9464 mm = 20.6 px), 118 deg point, its full diameter 1.0 mm past face A, its point at Z-1.885 (drill_32_tip_mm, posted); drawn short to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="430"/>
  <text class="title" x="20" y="22">Setup 2, AR01 T3: the #32 drill through the pin bore C (to scale, 7 px/mm)</text>
