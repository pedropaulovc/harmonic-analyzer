<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale. Left: a section across the jaws, from the RIGHT end, 4.5 px/mm (the fixed jaw on the right, Y0 its face): the two 1 in parallels (1/8 thick, parallel_thickness_mm) against the jaws, the 1/2 x 3 in 6061 sub-plate (plate_thickness_mm, plate_width_mm) on them, its top Z0, the jaw tops 6.845 mm over it (plate_jaw_top_mm). The jaws' thickness and the parallels' length are not on record; jaws and parallels drawn short to a break line toward the bed. Right: from above, 1.6 px/mm, the plate's left end X0, the pivot at X18.0, Y-38.1 (pivot_on_plate_x_mm). The arm off. The #43 drill (shop jig-drill-43) to scale (Ø2.2606 mm = 10.2 px), 118 deg point, its full diameter 1.0 mm under the plate (plate_drill_past_mm), its point at Z-14.379 (plate_drill_43_tip_mm, the posted AR02 depth), in the gap between the parallels; drawn short to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="430"/>
  <text class="title" x="20" y="22">Setup 3, AR02 T9: the #43 drill through the sub-plate at the pin station (to scale)</text>
