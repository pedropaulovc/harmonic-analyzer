vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar's thickness and its width near the end, at both edges."
inspection = "Thickness {{process.bar_thickness_min_mm:in.3dot}}–{{process.bar_thickness_max_mm:in.3dot}}, width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}. Outside: stop, the programs assume this section."
