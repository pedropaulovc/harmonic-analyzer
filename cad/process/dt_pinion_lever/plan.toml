tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw one piece, marked 4.75 long, off the end of the 1/2 × 2-1/4 in 1018 bar, the bar lying on a wide face in the saw's vise, the cut across its full 2-1/4 width. The rest of the bar stays for MHA-DT-21, MHA-DT-18 and MHA-MG-01."
