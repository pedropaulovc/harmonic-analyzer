[[setups.operations]]
instruction = "Overall: face B to the crown's apex, micrometers."
inspection = "{{cad.crown_overall_min_in:.3dot}}–{{cad.crown_overall_max_in:.3dot}}. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.crown_overall_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "The rod's station below face B: from Setup 2's reading and the rod's diameter."
instruction_detailed = "The rod's station: Setup 2's reading (the rod's top below face B, in inches, as a positive number) plus half the rod's Ø across its top and bottom at the middle, written down above."
inspection = "{{cad.grip_rod_station_min_in:.3dot}}–{{cad.grip_rod_station_max_in:.3dot}}. Outside: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "The tab stubs: calipers from the rod's tip face to the hub's back, over both filed stubs; then that reading less half the hub's Ø written down above."
inspection = "Over the stubs {{process.tip_to_back_min_mm:in.3dot}}–{{process.tip_to_back_max_mm:in.3dot}} (the rod's {{cad.grip_rod_length_min_in:.2dot}}–{{cad.grip_rod_length_max_in:.2dot}} plus the hub's radius); less half the hub's Ø, {{cad.grip_rod_length_min_in:.3dot}}–{{cad.grip_rod_length_max_in:.3dot}}, the rod's length from the hub's axis. Over either: file the stub that stands proud and measure again. Under either: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{process.tip_to_back_min_mm}}", "{{process.tip_to_back_max_mm}}"] },
  { gauge = "calipers", band_mm = "{{cad.grip_rod_length_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "The bore: the MHA-DT-17 rod enters it by hand to the floor (the drawing's acceptance for the F-drilled bore). MHA-DT-17 not made yet: MHA-DT-00 tries the fit at its lever step."
inspection = "The rod slides in to the floor and turns by hand. It binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}. Wipe the lever clean and dry, then wipe a thin film of ISO VG 32 machine oil over every face and into the bore; wipe off the excess. No plating, no paint."
inspection = "Bright metal under an even oil film, no rust spot."
gauge_checks = "other"
feed = "hand"
