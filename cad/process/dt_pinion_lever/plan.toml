# Pinion engage lever MHA-DT-16 (qty 1), routed for the CNC mill (route A of
# W3B-Lever's route proposal, approved by Main 2026-11-27; owner ruling
# 2026-11-21: where a part can be made either way the agent chooses for speed
# and the owner corrects). The whole lever is milled out of one 4.75 in piece
# sawn off the end of the owned 1/2 x 2-1/4 in 1018 cold-finished flat
# (stock.1018-flat-1-2x2-1-4, the bar MHA-DT-21, MHA-DT-18 and MHA-MG-01 also
# draw on): the hub's axis runs through the bar's 1/2 thickness (the mouth
# face B is the bar's top, kept as bought), the Ø.24 rod lies along the
# piece's 4.75 length, its axis .20 below the bar's top.
#
# Route (the proposal's option B, a lathe-turned rod and a milled hub, was
# slower: six setups, the finished rod held cantilevered for two mill setups,
# and the root still needs the mill, since a lathe shoulder is a plane and the
# hub's round wall leaves up to .030 of square corner beside the rod): saw
# (Setup 1); lying on 1-1/2 in parallel stacks, gripped on the bar's
# cold-finished edges, mouth face up (Setup 2): DT16_top_rough clears a
# window round the part to a ball's radius past the rod's axis plane in
# full-width slots and finishes the hub's wall and the rod's tip face,
# DT16_top_rod finishes the rod's upper half with the 1/4 in ball end mill,
# DT16_top_root cuts the rod's root with the 1/16 in end mill, DT16_top_holes
# drills the bore F, flattens its floor and drills the reference hole F;
# turned end for end, mouth face down (Setup 3): DT16_crown_rough clears the
# rest of the window, DT16_crown_dome_rod cuts the SR crown and the rod's
# lower half, DT16_crown_root the root's lower half. The part then hangs on
# two tabs on the rod's axis plane: sawn off, filed, deburred, inspected and
# oiled at the bench (Setup 4). Every side cut is conventional (#3590): no
# climb pass is declared.
#
# The bore (Ø.257 F DRILL ↧(.32) FLAT BOTTOM; MHA-DT-17 ROD ENTERS BY HAND):
# the F drill's point stops .010 short of the floor; the 1/4 in HSS end mill
# plunges to the floor on the axis and turns one circle there at Ø.259 (the
# DRILLED HOLES band's middle): its flutes span the bore's depth, so the
# circle opens the whole wall to Ø.259 (about .001 a side) and flattens the
# floor, taking out the drill point's cone (a plunged .250 end mill alone
# would leave the wall's last .09 Ø.250, under the band).
#
# The root (INSIDE CORNERS R.040 MAX, RV-01): only a cutter of Ø.080 or
# under leaves R.040, and it must reach the rod's axis plane beside the
# hub's wall with its shank clear of face B (top side) and of the crown's
# dome (crown side): .210 and .233 of flutes (cam.py recomputes them). No
# owned cutter does: the smallest owned square end mill is 1/8 (R.0625), and
# the owned Kyocera 1800.0625.200 1/16 end mill (owner's #3750 record:
# .200 length of cut, 1/8 shank) is .010 and .033 short. The plain MSC
# 35497056 1/16 in end mill (.500 of flutes, to buy, already on the cart for
# MHA-MS-02 and MHA-PD-17) reaches both.
#
# The flip (Setup 2 to Setup 3), against the rod's Ø.24 ±.01 (the only
# printed size cut half in each setup; the shop's own figures): Z, the
# vertical Ø across the parting plane: Setup 2's Z0 on face B within .001
# (the standing page's zero tolerance), Setup 3's Z0 from the miked
# thickness (micrometer .0001) and a touch within .001, the ball -.002/0 on
# its diameter (McMaster 8878A17, sm.toml) so each half stands up to .001
# proud, and each half's cusps .001: .0061 at worst. Y, the side Ø: Y0 from
# the fixed jaw's face in both setups, edge F against it, each within .001,
# so the halves can step .002 at the parting line, and the side reading
# grows by that and by the same ball and cusps: .006 at worst. X, along the
# rod (the tip face and the hub's wall are cut half in each setup): X0 from
# the reference hole Setup 2 drilled at the commanded X (the mill's ±.0008
# positioning repeatability, cnc.toml) and picked up within .001: .0018 at
# worst, against the .XX bands of the tip's 3.39 and the hub's Ø.51. The
# tool setter's repeat between tools is not on record and not in the sums.
# First-part check (Setup 4): both rod Ø readings in band, and their
# difference within flip_check_max_mm (.004: the Z budget's zero terms,
# .0021, and the Y step, .002; the ball and cusps load both readings alike).
#
# The tabs (two, .12 wide × .08 thick, on the rod's axis plane): one joins
# the hub's wall behind the hub, opposite the rod; one joins the rod's tip
# face. Their filed stubs touch two printed sizes: the hub's Ø.51 (.50-.52)
# and the rod's 3.39 (3.38-3.40) from the hub's axis. Setup 4 checks both:
# the calipers from the tip face to the hub's back over both stubs read
# 3.630-3.660 (3.38 + .250 to 3.40 + .260), and that reading less half the
# hub's miked Ø (square to the rod, away from the stubs) reads 3.38-3.40.
#
# The pin hole (Ø.064 MATCH-DRILL THRU AT ASSEMBLY ON MHA-DT-17) is drilled
# at MHA-DT-00, not here.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero a cutter on a
# .002 feeler leaf, as the cone tip block's plan does.
#
# NC (cam:dt_pinion_lever, cad/process/dt_pinion_lever/cam.py):
# DT16_top_rough, DT16_top_rod, DT16_top_root, DT16_top_holes,
# DT16_crown_rough, DT16_crown_dome_rod, DT16_crown_root. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the places in the tools list among the mill's tools: T1
# 1/4 in carbide end mill, T2 1/4 in ball end mill, T3 1/16 in end mill, T4
# centre drill, T5 F drill, T6 1/4 in HSS end mill.
title = "Pinion engage lever"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/2 × 2-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.bar_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in flat bar; one piece about 4.75 long (at least {{process.piece_min_mm:in.2dot}}) sawn off its end: {{process.quantity:d}} part."
shop = "../shop"
stock_refs = ["1018-flat-1-2x2-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

standing = true

[[notes]]
title = "This job"
rows = [
  ["The part", "One lever milled whole from the flat: hub axis through the bar's thickness, face B the bar's own top (kept as bought), the rod along the piece. Setup 2 cuts face B's side and the bore, Setup 3 the crown's side; the lever then hangs on two tabs, sawn off at the bench."],
  ["To buy", "Not on hand, to buy before the job: the 1/16 in end mill with .500 of flutes (MSC 35497056). No owned cutter both leaves the root's R.040 MAX and reaches the rod's axis beside the hub."],
]

[cad]
file = "../../out/features/dt_pinion_lever/features.toml"
adapter = "flat_bar"
part = "dt-pinion-lever"

[parameters]
quantity = 1
# The blank (stock.1018-flat-1-2x2-1-4, a 19 in bar on hand): the piece's
# length along the rod (model Y), the bar's thickness along the hub's axis
# (model Z); flat_bar reads the axes and stock_fit reads blank_<dim>_in.
# The piece is sawn 4.72-4.78 long (mark 4.75, the saw's ±.03).
blank_length_axis = 1
blank_thickness_axis = 2
blank_length_in = 4.75
blank_width_in = 2.25
blank_thickness_in = 0.5
bar_thickness_in = 0.5
piece_min_mm = 119.888
piece_max_mm = 121.412
# The incoming bar gate (.498-.502 thick, 2.245-2.255 wide); the programs
# start from the thickest and widest.
bar_thickness_min_mm = 12.6492
bar_thickness_max_mm = 12.7508
bar_width_min_mm = 57.023
bar_width_max_mm = 57.277
# The hub's axis (both frames' X0 Y0): .80 in from the piece's left end in
# Setup 2, half the bar's nominal 2-1/4 width in from the fixed jaw.
hub_from_end_mm = 20.32
half_width_mm = 28.575
# The part, from the export (cam.py checks them): the rod's axis plane .20
# below face B, the crown's apex .29 below it.
mouth_above_axis_mm = 5.08
apex_below_axis_mm = 7.366
# The window cleared round the part: .53 in either side of the rod's axis,
# .53 behind the hub's axis and 3.70 along the rod from it, each at least
# clear_min_mm (.010) past the farthest a cutter reaches (the hub's wall
# contour, the ball beside the rod and past its tip; cam.py checks them).
# The frame left round it: its ends at least end_wall_floor_mm (.20, the
# author's choice) on the shortest piece, its sides end_wall_min_mm and
# side_wall_min_mm (cam.py recomputes them).
window_half_mm = 13.462
window_back_mm = 13.462
window_tip_mm = 93.98
clear_min_mm = 0.254
end_wall_floor_mm = 5.08
end_wall_min_mm = 5.588
side_wall_min_mm = 14.859
# The two tabs the part hangs on, centred on the rod's axis plane: .12 wide
# across the rod, .08 thick, one behind the hub, one past the rod's tip.
# With the .010 stock and one level's step on them they lie inside the rod's
# section (cam.py checks it), out of the ball's way.
tab_width_mm = 3.048
tab_thickness_mm = 2.032
# Roughing: the 1/4 in carbide end mill (shop endmill-carbide-3fl-1-4), its
# setting (shop settings.endmill-carbide-3fl-1-4-1018-cf, 2800 rpm, .0017
# in/tooth, the 6G chip-load factor 1.0 holding to full slotting): passes
# along the rod no more than one cutter's width apart (rough_stepover_mm),
# so each is a full-width slot with no climb side; levels no deeper than
# .040 (the author's choice for a 1/4 in end mill slotting 1018), .010 of
# stock left on the part (stock_mm), plunging at .001 in/rev (2800 × .001 =
# 2.8 in/min, the author's choice, the bottom of prechips' thrust table).
# Setup 2 clears the window from face B to floor_overlap_mm past a ball's
# radius below the rod's axis plane (top_floor_depth_mm below face B: the
# ball's side passes dip that far); Setup 3 rasters from the thickest bar's
# face to floor_overlap_mm short of that (crown_raster_z_mm above the
# parallels), then only contours round the part (the shadow under the rod's
# widest point and under the tabs) to floor_overlap_mm past the axis plane
# (crown_floor_z_mm). cam.py recomputes the three.
cutter_dia_mm = 6.35
stock_mm = 0.254
rough_step_max_mm = 1.016
rough_stepover_mm = 6.35
plunge_feed_per_min_mm = 71.12
floor_overlap_mm = 0.254
top_floor_depth_mm = 8.509
crown_raster_z_mm = 8.255
crown_floor_z_mm = 4.826
# Finishing: the ball end mill (shop ball-endmill-carbide-2fl-1-4, setting
# settings.ball-endmill-carbide-2fl-1-4-1018-cf) in passes along the rod,
# semi-finishing at the .010 stock semi_step_deg apart round the rod (and
# the crown's meridian), finishing on size scallop_max_mm (.001, the
# author's choice for speed: a tenth of the rod's ±.010 band)
# or finer: rod_step_deg and dome_step_deg (cam.py recomputes them from the
# cusp between two passes).
ball_dia_mm = 6.35
semi_step_deg = 15.0
scallop_max_mm = 0.0254
rod_step_deg = 10.5058
dome_step_deg = 3.8898
# The rod's root (INSIDE CORNERS R.040 MAX): the 1/16 in end mill (shop
# endmill-carbide-3fl-1-16-loc-1-2, TO BUY; its R.031 under R.040), in
# levels down its sides from the rod's top to .010 past the axis plane,
# each from root_overlap_mm (.020) past where the 1/4 in end mill's arc
# began on the hub's wall, round the wall and along the rod's side to
# past where the ball's last pass touched the rod. Each level's step leaves
# a stair no taller than root_cusp_max_mm (.0025) on the rod's surface,
# and is never deeper than root_level_max_mm (.30 × the cutter's diameter,
# Harvey Tool's roughing axial depth for .062-.500 in cutters: Miniature
# End Mills - Square - Long Reach, Stub Flute, 9x Reach Multiple, W.C.
# Chapman's copy, read 2026-11-27). root_reach_mm: the flutes it needs below
# the highest part its 1/8 in shank could meet (cam.py recomputes it).
# Feed: that table's Carbon Steels, Free-Machining/Low Carbon row (10xx -
# 1029), .062 in Roughing .00017 in/tooth (its 9x table, the next longer
# than the cutter's 8x flutes, as ms.toml's stop-em-sixteenth-c360 takes
# it), at the spindle's 2800 rpm (600 SFM would be 36,700): 2800 × 3 ×
# .00017 = 1.43 in/min.
root_cutter_dia_mm = 1.5875
root_cusp_max_mm = 0.0635
root_level_max_mm = 0.47625
root_reach_mm = 5.917
root_overlap_mm = 0.508
root_feed_per_min_mm = 36.271
# cam.py's keep-out bands for the part (the rod and the crown in bands this
# tall, each shape inside the part over its band).
keep_out_band_mm = 0.254
# Holes, in Setup 2's frame: the bore down the hub's axis from face B, and
# the reference hole through the frame's side .80 toward the moving jaw from
# the hub's axis and 1.50 along the rod (clear of the window and the stacks;
# cam.py checks it), 2.30 from the piece's left end: Setup 3 sets X0 from it.
# The #2 centre drill spots both Ø.100, then the F drill (.257): the bore's
# point .010 short of the floor (drill_tip_mm below face B), the reference
# hole's full diameter .040 past the bar's far face (ref_tip_mm), into the
# air between the stacks. The 1/4 in HSS end mill (shop endmill-hss-2fl-1-4)
# plunges to the bore's depth, the .32 middle of the band, and turns one
# circle there at floor_dia_mm (.259, the middle of the DRILLED HOLES band
# .257-.261).
ref_hole_x_mm = 20.32
ref_hole_y_mm = 38.1
ref_station_mm = 58.42
spot_dia_mm = 2.54
drill_short_mm = 0.254
drill_past_mm = 1.016
floor_dia_mm = 6.5786
drill_tip_mm = 7.874
ref_tip_mm = 15.7353
ref_tip_height_mm = -2.9845
# Speeds and feeds of the holes, authored in the operations, as the MHA-DT-14
# strap's (cad/process/dt_pinion_bracket/plan.toml): LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min, the low end taken; AutoDrill
# "Suggested drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/8 in
# .003 in/rev, a size past a column taking that column's feed. Centre drill
# 1800 rpm × .001 = 1.8 in/min (the cone tip block's spot); F (.257) 900 rpm
# (61 ft/min) × .003 = 2.7 in/min. The HSS end mill plunging and circling the
# floor: 1000 rpm (65 ft/min, the low end of LittleMachineShop's HSS milling
# row for 1006-1026, 65-110) × .0015 in/rev = 1.5 in/min (the author's
# choice, half a drill's .003 for a flat-ended cutter).
spot_feed_per_min_mm = 45.72
drill_f_feed_per_min_mm = 68.58
floor_feed_per_min_mm = 38.1
# The SR crown's check on the mill (Setup 3, the ball end mill still in the
# spindle): its tip touched on the apex, then over a point sr_probe_x_mm
# (.315) off the hub's axis, on the side away from the rod; the drop between
# the two readings for SR .40-.42 (cam.py recomputes it from the ball's
# radius: the ball's centre is SR + its radius from the sphere's centre).
sr_probe_x_mm = 8.001
sr_drop_min_mm = 2.5464
sr_drop_max_mm = 2.667
# The flip's first-part check (Setup 4; the budget is in this file's head):
# the rod's Ø across its top and bottom less its Ø across its sides.
flip_check_max_mm = 0.1016
# The tab stubs' check (Setup 4): the calipers from the tip face to the
# hub's back, over both stubs: the rod's 3.38-3.40 plus the hub's radius
# .250-.260.
tip_to_back_min_mm = 92.202
tip_to_back_max_mm = 92.964
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): the set's 1 in and 1/2 in parallels stacked against each jaw (1.5
# in), as the cone tip block's lying setups, the piece gripped on the bar's
# two cold-finished edges, the same edge at the fixed jaw in both setups.
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
lying_grip_mm = 6.8453
# The piece centred on the jaws: its left end (jaw width − its length)/2 in.
vise_inset_mm = -18.6309
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# the spindle nose to the tip. Projections the author's choice: the 1/4 in
# end mills and the ball 1.00 in out of the collet (the deepest cut, .335,
# with the collet nut clear of the frame's top), the 1/16 in its 1/8 in
# collet .75 out (its .500 of flutes clear, its shank gripped 1.75 of its
# 2.50). The #2 combined drill and countersink 1-7/8 in overall; the F drill
# a jobber's 4-1/8 in overall (the longest tool), in the drill chuck.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
mill_projection_min_mm = 25.4
root_projection_min_mm = 19.05
drill_f_oal_mm = 104.775
# The lowest point the ball reaches in Setup 3 (its side passes, a ball's
# radius past the rod's axis plane), above the parallels (cam.py).
ball_low_z_mm = 1.905

