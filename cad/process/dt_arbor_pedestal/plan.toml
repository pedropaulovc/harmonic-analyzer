[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PA07_outline (M6 T1; set 2650): face F down to Z {{cad.near_end_depth_mm:in.4dot}} in two {{process.far_face_level_mm:in.3dot}} levels; then profile the outline, climb, plunging beside a flank's root: three levels {{process.outline_finish_stock_mm:in.3dot}} off it, then one full-depth finish pass on it, {{process.outline_depth_mm:in.3dot}} deep from the far face ({{process.outline_past_mm:in.3dot}} past the strap's outer face, into the step). Unclamp; mic the depth."
settings = "endmill-carbide-3fl-1-2-1018-cf"
inspection = "Depth {{cad.near_end_depth_min_in:.3dot}}–{{cad.near_end_depth_max_in:.3dot}} (the far face to the near end), miked across the foot; strap {{cad.strap_outer_face_depth_min_in:.3dot}}–{{cad.strap_outer_face_depth_max_in:.3dot}} thick, miked beside the bore."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.near_end_depth_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.strap_outer_face_depth_band_mm}}" },
]
milling_cuts = [
  { name = "far face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.far_face_level_mm}}", radial_woc_mm = "{{process.far_face_stepover_max_mm}}", traverse_mm = [0, "{{cad.envelope_y_mm}}"] },
  { name = "outline rough", kind = "side", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_rough_level_mm}}", radial_woc_mm = "{{process.outline_rough_woc_mm}}", traverse_mm = ["{{cad.foot_top_height_mm}}", "{{cad.envelope_y_mm}}"] },
  { name = "outline finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_depth_mm}}", radial_woc_mm = "{{process.outline_finish_stock_mm}}", traverse_mm = ["{{cad.foot_top_height_mm}}", "{{cad.envelope_y_mm}}"] },
]

[[setups.operations]]
instruction = "Depth over its band: mic F to N again, reclamp as before, pick X and Y up again from the bore (as the setup's first op) and touch F again, Z set to the new F-to-N reading (as its Z0 op); run PA07_outline again (F faces down to the depth; the outline's passes recut on line). Depth under its band, or the strap outside its band: stop and tell the owner with the reading."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect, black enamel"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pedestal from the front and the side: the seat, the foot top, the tapered flanks and the crown about the bore, the apex hole into the bore, the hold-down hole through the foot, and where each is measured from." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "reamer"
drilling = "none"
sizing = "other"
instruction = "The apex hole's burr inside the bore: turn the .3760 reamer through the bore by hand in a tap wrench, forward only, Tapmatic Gold, and draw it out still turning forward. Blow the bore out; run the 4-40 tap through the apex hole by hand once more if its mouth is burred."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max: smooth file on the outside edges, the scraper from the deburring set on the bore's, the hold-down hole's and the apex hole's mouths (no countersink). Leave the step's inside corner as cut. Keep the seat flat: stone it lightly on a flat stone. Wash off the oil."
feed = "hand"
inspection = "The seat down on the surface plate: it does not rock and no burr stands proud."
gauge_checks = "other"

[[setups.operations]]
instruction = "Inspect each pedestal; record the readings with its number."
feed = "hand"
inspection = "Every pedestal: GO enters, NO-GO does not: bore Ø{{cad.arbor_bore_dia_min_in:.4dot}}–{{cad.arbor_bore_dia_max_in:.4dot}} after the hand ream, the GO pin the full depth; the arbor {{cad.arbor_bore_mates}} slides through it; the bore bright, no chatter or tears (Ra {{cad.arbor_bore_finish_ra}} µm). Bore height {{cad.arbor_bore_height_min_in:.3dot}}–{{cad.arbor_bore_height_max_in:.3dot}}: the pedestal on its seat on the surface plate, the height gauge on the bore's bottom and top walls, their mean. A 4-40 screw runs in by hand into the bore."
gauge_checks = [
  { gauge = "zz-pins-3760-3765", band_mm = "{{cad.arbor_bore_dia_band_mm}}" },
  { gauge = "height-gauge", band_mm = "{{cad.arbor_bore_height_band_mm}}" },
]

[[setups.operations]]
instruction = "GO pin refused: oil, and turn the same reamer through the bore by hand once more as above; gauge again. Still refused (a reamer cannot be made to cut larger), or the NO-GO pin entering (no cut remedies it): the pedestal is scrap; tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "First pedestal only (the programs hold the second): the crown and the hole stations."
inspection = "Crown R{{cad.crown_radius_min_in:.3dot}}–{{cad.crown_radius_max_in:.3dot}}: calipers from the apex to the bore's near wall, plus half the bore's Ø. Hold-down hole: the #15 drill's shank slips through; on the seat, from F {{cad.hold_down_hole_station_min_in:.3dot}}–{{cad.hold_down_hole_station_max_in:.3dot}} and from W {{cad.hold_down_hole_lateral_min_in:.3dot}}–{{cad.hold_down_hole_lateral_max_in:.3dot}}, calipers to the shank less half its miked Ø. Apex hole, on the top, from F {{cad.apex_tap_station_min_in:.3dot}}–{{cad.apex_tap_station_max_in:.3dot}}, calipers to a 4-40 screw's shank in it less half its Ø."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.crown_radius_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.hold_down_hole_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.hold_down_hole_lateral_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.apex_tap_station_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Any reading outside its band: stop and tell the owner with the pedestal's number and the reading." },
]
feed = "hand"

[[setups.operations]]
instruction = "If the enamel cannot follow now: oil the pedestal lightly, bag it and tag it with its number; wash the oil off before the enamel."
feed = "hand"

[[setups.operations]]
instruction = "Paint (the drawing: {{cad.finish}}): the owner's Rust-Oleum Stops Rust Flat Black 376855 over Rust-Oleum Stops Rust Clean Metal Primer 7780830, the paint maker's primer for bare metal. The primer is not owned: buy it. The enamel: check the shelf, buy if none."
feed = "hand"

[[setups.operations]]
instruction = "Wash the pedestal in detergent, rinse it in clean water and dry it thoroughly."
feed = "hand"

[[setups.operations]]
instruction = "Mask the bore (a 3/8 dowel or a rolled paper plug), the apex hole (a 4-40 screw) and the foot seat."
feed = "hand"

[[setups.operations]]
instruction = "Spray outdoors or in a well-ventilated space, at 50–90 °F and humidity under 70 %. Primer: shake the can a full minute after the ball rattles; 2 light coats a few minutes apart, the can 10–16 in off."
feed = "hand"

[[setups.operations]]
instruction = "Enamel straight after the primer: every unmasked face black, 2 or more light coats a few minutes apart, the can moving and at one distance, no runs. Any further coat within 1 hour or after 48 hours."
feed = "hand"

[[setups.operations]]
instruction = "Let it dry: tack-free in 2–4 hours, handle after 5–9 hours, fully dry in 24 hours."
feed = "hand"

[[setups.operations]]
instruction = "Unmask; wipe the bare bore, the apex thread and the seat with light oil."
feed = "hand"
