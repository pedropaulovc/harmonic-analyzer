feed = "hand"

[[setups.operations]]
instruction = "The part clamped as Holding says: G54 X0 the seat (the RIGHT end), Y0 the fixed jaw's face (W): edge finder (900 rpm)."
instruction_detailed = "The part clamped as Holding says. Edge finder (900 rpm): on the fixed jaw's face beside the part, G10 L20 P1 Y-2.540; on the seat (the part's RIGHT end) from the right, G10 L20 P1 X2.540 (plus: the finder's centre is right of the end)."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove PA04_step_bore in air, Z0 raised {{process.step_prove_raise_mm:in.3dot}} in (the uncut top, the drill and the reamer all clear); every pass crosses above the jaw tops, through every M6. Then Z0 back."
instruction_detailed = "First blank only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + {{process.step_prove_raise_mm:.3f}}) raises Z0 {{process.step_prove_raise_mm:in.3dot}} in: the reamer's and the drill's lowest point then stands above N. Run PA04_step_bore through every M6, watching each move cut only air and each pass cross above the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

# The step's depth and width lie inside em-half-carbide-1018-v6-deep, but
# cad/config/shop-equipment/measured-cuts.toml records its direction as
# conventional (every measured pass), and the owner's 2026-11-16 ruling
# (cam.py: ball screws) keeps the step's passes climb: the first part is
# listened to.
[[setups.operations]]
steps = [
  { kind = "stop", text = "First part only: the step passes at 2400 rpm are inside the depth and width the owner chatter-tested on this end mill, but they cut climb, which was not tested: {{process.step_level_mm:in.3dot}} deep x {{process.step_station_mm:in.3dot}} wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PA04_step_bore (M6 T1; set 2400): the step down to Z {{process.step_floor_mm:in.4dot}} in {{process.step_level_mm:in.3dot}} levels, each in passes across the width, every pass from E toward W (climb), the passes {{process.step_station_mm:in.3dot}} apart from the left end toward the seat, the last with the cutter's edge on the foot top. The step cuts the waste above the foot top away: the hold-down hole opens. At the M6 T2 stop look: the floor flat, the foot top a clean wall."
settings = "em-half-carbide-1018-v6-deep"
milling_cuts = [
  { name = "step", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.step_level_mm}}", radial_woc_mm = "{{process.step_station_mm}}", traverse_mm = ["{{cad.foot_top_height_mm}}", "{{process.upright_top_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, M6 T2: spot the bore on the step's floor Ø{{process.bore_spot_dia_mm:in.3dot}}, under the 23/64; set 1800."
rpm = 1800
feed = "{{process.spot_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "bore spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.bore_spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.spot_feed_per_min_mm}}", stations_mm = "{{cad.arbor_bore_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-23-64"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: 23/64 drill (.3594, the reamer's pilot) down through the strap, one plunge, its full diameter {{process.bore_drill_past_mm:in.3dot}} below the stacks' top, between them; set 650. Cutting oil."
rpm = 650
feed = "{{process.bore_drill_feed_per_min_mm:in.2f}} in/min"
hole_depth_mm = "{{process.step_floor_mm}}"
peck = "none"
milling_cuts = [
  { name = "bore drill", kind = "drill", phase = "rough", cutter_dia_mm = 9.128125, flutes = 2, rpm = 650, feed_mm_min = "{{process.bore_drill_feed_per_min_mm}}", stations_mm = "{{cad.arbor_bore_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.arbor_bore_dia_band_mm}}" }
instruction = "Same file, M6 T5 (spindle off, retracted): ream the bore, the .3760 reamer in its collet, its full diameter {{process.bore_ream_past_mm:in.3dot}} below the stacks' top; set 400. Cutting oil. The file feeds the reamer in and feeds it back out, spindle running: no rapid leaves the bore, which keeps its Ra {{cad.arbor_bore_finish_ra}} µm reamed finish. Leave the part clamped for the check."
rpm = 400
feed = "{{process.ream_feed_per_min_mm:in.1f}} in/min, in and out"
milling_cuts = [
  { name = "bore ream", kind = "drill", phase = "finish", cutter_dia_mm = 9.5504, flutes = 2, rpm = 400, feed_mm_min = "{{process.ream_feed_per_min_mm}}", stations_mm = "{{cad.arbor_bore_height_mm}}" },
]
inspection = "Still clamped, the first part before the second is reamed: GO enters, NO-GO does not: bore Ø{{cad.arbor_bore_dia_min_in:.4dot}}–{{cad.arbor_bore_dia_max_in:.4dot}}, the GO pin the full depth. Finish Ra {{cad.arbor_bore_finish_ra}} µm: an even reamed bore, bright, no chatter rings, tears or spiral marks."
gauge_checks = [{ gauge = "zz-pins-3760-3765", band_mm = "{{cad.arbor_bore_dia_band_mm}}" }]

# The ream's remedy follows its check: prechips prints an op's Check after
# its work, so it is the next op.
[[setups.operations]]
instruction = "GO pin refused: blow out the chips and oil; T5 still in, the part still clamped. MDI G0 Z{{process.reream_clear_mm:.3f}}, G0 X-{{cad.arbor_bore_height_mm:.3f}} Y-{{cad.arbor_bore_lateral_mm:.3f}}, M3 S400, G0 Z{{process.reream_r_plane_mm:.3f}}, G1 Z{{process.ream_tip_height_mm:.3f}} F{{process.ream_feed_per_min_mm:.1f}}, G1 Z{{process.reream_r_plane_mm:.3f}}, G0 Z{{process.reream_clear_mm:.3f}}, M5 (the same reamer once more); gauge again."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "GO pin still refused (a reamer cannot be made to cut larger), NO-GO pin enters (no cut remedies it), or chatter or tears in the bore: the part is scrap; stop and tell the owner." },
]
feed = "hand"

[[setups.operations]]
instruction = "In band: the next part is reamed without the check."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp. Mic the strap beside the bore; calipers across the foot."
inspection = "Strap with the far face's stock {{process.step_floor_min_mm:in.4dot}}–{{process.step_floor_max_mm:in.4dot}} (F to the step's floor), miked beside the bore. Foot {{cad.foot_top_height_min_in:.3dot}}–{{cad.foot_top_height_max_in:.3dot}} thick (the seat to the foot top), calipers."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.step_floor_min_mm}}", "{{process.step_floor_max_mm}}"] },
  { gauge = "calipers", band_mm = "{{cad.foot_top_height_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "Strap over its band: reclamp as before (Z0 is the stacks' top) and pick X0 up again on the seat, as the setup's first op; lower G54 Z by the excess; run PA04_step_bore to the M6 T2 (its upper levels cut air). Mic again."
instruction_detailed = "Strap over: reclamp; edge finder on the seat from the right, G10 L20 P1 X2.540. Send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{process.step_floor_mm:in.4dot}}) × 25.4). Run PA04_step_bore; feed hold at the M6 T2 and reset (the bore is already reamed)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "stop", text = "Strap under {{process.step_floor_min_mm:in.4dot}}, or the foot outside {{cad.foot_top_height_min_in:.3dot}}–{{cad.foot_top_height_max_in:.3dot}}: stop and tell the owner with the reading." },
]
feed = "hand"

