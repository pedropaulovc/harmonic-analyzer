instruction = "Only if the reamer read under the GO pin, before the first part: grip a 2 in offcut of the 1 x 1-1/4 flat on the stacks as Holding says, lying on a 1-1/4 in face (1.00 thick). Console M6 T4 (23/64; the tool setter measures it). Jog it over the offcut's middle, above the gap between the stacks; spindle stopped, its point on a .002 leaf on the top: G10 L20 P1 X0 Y0 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Trial hole, MDI: M3 S650, G0 Z2, G1 Z-29 F{{process.bore_drill_feed_per_min_mm:.1f}}, G0 Z15, M5. Console M6 T5 (the reamer in its collet): M3 S400, G0 Z2, G1 Z-29 F{{process.ream_feed_per_min_mm:.1f}}, G1 Z15, M5. Cutting oil. Gauge it with the pins. The GO pin enters: take the offcut out and go on. Refused: stop and tell the owner (the pins refuse this reamer's holes)."
feed = "hand"

[[setups.operations]]
instruction = "Before the first part goes in, G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack, the jaws open."
