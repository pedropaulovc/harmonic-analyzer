instruction = "On the 0–1 in micrometer (reads .0001; trust a reading to ±.00005), mike the {{cad.arbor_bore_dia_min_in:.4dot}} GO pin, the {{cad.arbor_bore_dia_max_in:.4dot}} NO-GO pin, and the reamer across two opposite margins at its front end. Write the three readings here, and each pin's on its tag."
