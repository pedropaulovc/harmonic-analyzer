  { kind = "stop", text = "Bar thickness or width outside its band: stop and tell the owner with the readings; do not saw it." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 1 x 1-1/4 in 1018 flat bar, the bar flat in the saw's vise. File the burr off both ends and the four long edges so each blank seats flat on the parallels. On each, mark one broad (1-1/4 in) face W and one narrow (1 in) face F with marking fluid (W stays as bought: the lateral datum; F is the far face's bar face), and the blank's number, 1 or 2, on W."
feed = "hand"
inspection = "Each blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
instruction = "A blank shorter than {{process.blank_length_min_in:.2f}}: scrap it and saw another. Longer than {{process.blank_length_max_in:.2f}}: saw it again."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Face E to the width"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 13/16 in and the 1/2 in parallels of the set stacked against each jaw. The blank lying on them along the jaws, W DOWN, gripped on F (against the FIXED jaw) and the opposite narrow face, centred on the jaws. Tap it down onto both stacks while closing the vise. Its top stands {{process.blank_x_mm:in.3dot}} above the stacks, the lower {{process.lying_grip_mm:in.3dot}} of it in the jaws."
