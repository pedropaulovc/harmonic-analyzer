# Arbor pedestal MHA-DT-02 (qty 2), routed for the CNC mill (the agent's
# route for speed, owner rulings 2026-11-21: the owner corrects it
# afterwards). Each pedestal from one sawn blank of 1 x 1-1/4 in 1018 flat
# bar, its length along the bar (the pedestal's height, seat to crown) about
# 2.25-2.30, one blank per program run. The bar's 1 in sets the width (W
# stays cold-finished, the other broad face E is faced to the width), its
# 1-1/4 the depth (the far face's narrow bar face stays until the last setup,
# the near end is faced to the depth plus far_face_stock_mm, the stock that
# lets the step's setup grip a third of the part's height).
#
# Route: saw; Setup 2 lying on W, face E to the width (PA01); Setup 3 the
# far face's bar face down, face the near end (PA02); Setup 4 upright, a
# sawn end up: face the seat, drill the #15 hold-down hole from it into the
# waste above the foot (PA03); Setup 5 the near end up: mill the step down to
# the strap, which opens the hold-down hole, then spot, drill 23/64 and ream
# .3760 the arbor bore through the strap (PA04); Setup 6 upright on the seat:
# face the top end, spot and drill #43 from the apex into the bore (PA05),
# tap 4-40 by hand under the spring tap guide (PA06); Setup 7 the far face
# up, the foot gripped by the seat and the foot top: face the far face to
# the depth and profile the tapered flanks and the crown round the bore
# (PA07); bench
# deburr (the reamer by hand through the bore) and inspect; black enamel,
# the bore and the foot seat masked, the bare machined faces oiled: the
# owner's Rust-Oleum Flat Black 376855 (owner 2026-11-21, answered in
# person: "rust-oleum Flat Black376855") over the maker's Clean Metal
# Primer, by Rust-Oleum's technical data SRT-01 (consumables.black-alkyd-
# enamel cites it).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "remove mention of dead centre ; use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# The apex tap goes up to .579 below the apex, more than the spring's 1/2 in,
# so the point is pushed home again on the way down. FluidNC refuses jogs in
# the Hold an M0 leaves (wiki.fluidnc.com/en/features/single_block_mode), so
# the tap stop is its own file ending M30 over its hole (PA06).
#
# Zeroing: every X/Y zero the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), every Z zero a tool on a .002
# feeler leaf, as the column clamp plans do.
#
# NC (cam:dt_arbor_pedestal, cad/process/dt_arbor_pedestal/cam.py):
# PA01_width, PA02_depth, PA03_seat, PA04_step_bore, PA05_top_apex,
# PA06_apex_tap, PA07_outline. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2
# centre drill, T3 #15, T4 23/64, T5 .3760 reamer, T6 #43, T7 the tap
# guide (the tap is turned by hand).
title = "Arbor pedestal"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel flat bar (drawing: {{cad.material_spec}})"
stock = "{{process.blank_x_in:fraction}} x {{process.blank_z_in:fraction}} in flat bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.east_side_width_min_in:.3dot}}–{{cad.east_side_width_max_in:.3dot}} wide at the foot (W to E), {{cad.near_end_depth_min_in:.3dot}}–{{cad.near_end_depth_max_in:.3dot}} deep (the far face to the near end), the strap {{cad.strap_outer_face_depth_min_in:.3dot}}–{{cad.strap_outer_face_depth_max_in:.3dot}} thick; the bore {{cad.arbor_bore_height_min_in:.3dot}}–{{cad.arbor_bore_height_max_in:.3dot}} above the seat. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Both blanks go through each mill setup in turn before the next setup: after the first, unclamp it, clamp the second as the Holding says and pick up again every zero taken on the part itself (each setup's X0; Setup 4's Z0 on the sawn top; Setup 7's X0, Y0 and Z0); the fixed jaw's Y0 and a stack or parallel Z0 stand. Then run the file and its checks on it. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then, before Cycle Start, touch one of the setup's zeros again with the edge finder: it must read what its step set, within .001 in. It does not, or the part may have moved: take the setup again from its first step, the part out. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; console M6 for the tool in the spindle, then Cycle Start."
shop = "../shop"
stock_refs = ["1018-flat-1x1-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_arbor_pedestal/features.toml"
adapter = "drilled_block"
part = "dt-arbor-pedestal"

[parameters]
quantity = 2
# The bar (stock.1018-flat-1x1-1-4, 8 in on hand: two 2.30 blanks and two
# 1/8 kerfs use 4.85) and the blank the programs are posted for: 2.25-2.30
# in sawn (the 2.18 height, the seat skim, the top end's facing, the saw's
# ±.025).
blank_length_min_in = 2.25
blank_length_max_in = 2.30
blank_length_min_mm = 57.15
blank_length_max_mm = 58.42
kerf_in = 0.125
# stock_fit (prechips drilled_block): the blank along the model axes, X the
# width (the bar's 1 in), Y the height (the bar's length, the shortest
# blank), Z the depth (the bar's 1-1/4).
blank_x_in = 1.0
blank_y_in = 2.25
blank_z_in = 1.25
blank_x_mm = 25.4
blank_z_mm = 31.75
# The bar as received, calipered before sawing (Setup 1): PA01 and PA02 face
# from its nominal 1 in and 1-1/4 in, so a bar over them deepens the first
# level by the excess. The band lets that level reach face_step_max_mm and no
# deeper (PA01's .030 first level: .020 over; PA02's .045: .005 over), and
# takes the same amount under (a thinner bar still cleans up); cam.py
# computes and checks the four.
bar_x_min_mm = 24.892
bar_x_max_mm = 25.908
bar_z_min_mm = 31.623
bar_z_max_mm = 31.877
# Skims and facing (author's choice): the seat .020 off the sawn end; E
# faced to the width, the near end to the depth plus the far face's stock,
# the top end to the height, in equal levels no deeper than
# face_step_max_mm (.050 in); the far face's stock (.060) last, in two
# light levels (the foot-only hold).
seat_skim_mm = 0.508
far_face_stock_mm = 1.524
far_face_level_mm = 0.762
face_step_max_mm = 1.27
# The near end above the far face's bar face after PA02: the depth plus the
# far face's stock. Miked to ±.005 (half the strap's band: the step's floor
# is cut from the bar face, the far face from the near end).
depth_top_mm = 29.464
depth_top_min_mm = 29.337
depth_top_max_mm = 29.591
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2). The
# faces of PA01-PA03 and PA05 at the measured setting
# em-half-carbide-1018-3439-face (shop common.toml; cad/config/
# shop-equipment/measured-cuts.toml, #3439: stable to 1.27 mm deep and 6.4 mm
# wide, conventional, 2420-2490 rpm in the cut): equal passes no wider than
# .250 in, half the cutter and inside its 6.4 mm, the first engaging one
# stepover and the last overhanging the far edge; the zigzag climbs on every
# other pass, which the session did not measure. The far face (PA07) shares its Job and speed with the outline,
# which no measured setting covers (below): it stays on the chart setting
# settings.endmill-carbide-3fl-1-2-1018-cf, in passes no wider than .200 in.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.35
far_face_stepover_max_mm = 5.08
# The step (PA04): equal levels from the near end down to the strap's outer
# face (7 × .100), each a row of passes across the width along +Y, E toward
# W (climb: the uncut stock on the right of travel with M3; the owner's
# 2026-11-16 ruling, ball screws: the report measured conventional passes
# only), at equal stations no further apart than step_station_max_mm from
# beside the open end to the foot top's station (the cutter's edge on the
# foot top). At the measured setting em-half-carbide-1018-v6-deep (stable
# to 6.6 mm deep and 2.2 mm wide): its .100 levels at 2.2 mm stations run
# shorter than the face setting's 1.27 mm levels at 6.35 mm. step_floor_mm:
# the floor above the stacks (the strap plus the far face's stock); cam.py
# computes and checks the floor and the stations.
step_level_mm = 2.54
step_station_max_mm = 2.2
step_station_mm = 2.113
step_floor_mm = 11.684
step_floor_min_mm = 11.557
step_floor_max_mm = 11.811
# The outline (PA07): the flanks and the crown, climb (G2, the PM-30MV has
# ball screws), from the far face through the strap and outline_past_mm into
# the step's void: three rough levels .020 off the outline, then one finish
# pass at full depth. The rough pass's widest cut is the top end's corner,
# off the crown (cam.py checks it). Its finish pass is deeper than any
# measured cut (10.41 mm against 6.6), so PA07 stays on the chart setting.
outline_past_mm = 0.25
outline_depth_mm = 10.41
outline_rough_level_mm = 3.47
outline_finish_stock_mm = 0.508
outline_rough_woc_mm = 4.75
# The strap's narrowest section, at the bore: the crown's Ø less the bore's
# largest (the PA07 beam).
strap_net_width_mm = 12.28
# Spots with the #2 centre drill, each under its drill (no chamfer at the
# mouth): Ø.150 under the #15, Ø.180 under the 23/64, Ø.080 on the apex
# under the #43.
hold_spot_dia_mm = 3.81
bore_spot_dia_mm = 4.572
apex_spot_dia_mm = 2.032
# Hold-down (PA03): the #15 from the seat, one plunge (L/D 1.1), its full
# diameter hold_drill_past_mm past the foot top into the waste the step
# removes; its point hold_tip_depth_mm below the seat.
hold_drill_past_mm = 1.0
hold_tip_depth_mm = 7.454
# Bore (PA04): the 23/64 drill (.3594, .0166 under the reamer: a chucking
# reamer's allowance, .010-.020 at 3/8), one plunge from the step's floor
# (L/D 1.3), its full diameter bore_drill_past_mm past the stacks' top into
# the gap between them; the reamer's full diameter bore_ream_past_mm past it,
# its tip (a chucking reamer's 45° bevel, under reamer_lead_mm long) above
# the drill's point. Tip heights above the stacks (below: negative); cam.py
# checks them.
bore_drill_past_mm = 1.0
bore_ream_past_mm = 1.0
reamer_lead_mm = 1.0
bore_tip_height_mm = -3.742
ream_tip_height_mm = -2.0
# The bore's re-ream by MDI after a GO refusal (owner ruling 2026-11-23,
# tool audit Q1: one more pass with the same reamer): it feeds from 3.3 mm
# above the step's floor (step_floor_mm 11.684) and leaves at 5.5 mm over
# the uncut top (depth_top_mm 29.464), above the part and the jaw tops.
reream_r_plane_mm = 15.0
reream_clear_mm = 35.0
# The Class ZZ pins (shop dt.toml zz-pins-3760-3765; owner ruling
# 2026-11-23, tool audit Q1): GO a plus pin at the bore's low limit, true
# size .3760 to .3762; NO-GO a minus pin at the high limit, .3763 to .3765
# (one pin's ZZ tolerance, .0002, is the record's resolution_mm 0.00508).
# The largest GO pin and the smallest NO-GO pin the sheet may use: with
# both pins there, a bore is sure to pass only between them, the middle
# .0001 of the .0005 band.
go_pin_max_in = 0.3762
nogo_pin_min_in = 0.3763
# Apex (PA05): the #43 pecked .080 with full retract (L/D 4.8), its full
# diameter apex_drill_past_mm past the bore's wall; its point then stands
# apex_tip_height_mm above the parallels.
apex_peck_mm = 2.032
apex_drill_past_mm = 0.5
apex_tip_height_mm = 47.91
# Hand tap (PA06): the plug tap's 5-thread lead (5 × .025) past the bore's
# wall at the thread's major diameter, and 1.0 short of the bore's far wall:
# the tap's point to go tap_reach_min_mm–tap_reach_max_mm below the apex.
plug_tap_lead_mm = 3.175
tap_reach_min_mm = 9.539
tap_reach_max_mm = 14.697
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min, reaming 40-65; AutoDrill "Suggested
# drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001,
# 1/8 in .003 in/rev, a larger size taking the 1/8 column's. Centre drill
# 1800 rpm × .001 = 1.8 in/min (the column clamp's). #15 (.180): 1300 rpm
# (61 ft/min) × .003 = 3.9 in/min. 23/64 (.3594): 650 rpm (61 ft/min) × .003
# = 1.95 in/min. #43 (.089): 2600 rpm (61 ft/min) × .001 = 2.6 in/min.
# Reamer .3760: 400 rpm (39 ft/min, under the band: the finish matters
# more) × .004 = 1.6 in/min, in and out. cam.py posts these.
spot_feed_per_min_mm = 45.72
hold_drill_feed_per_min_mm = 99.06
bore_drill_feed_per_min_mm = 49.53
ream_feed_per_min_mm = 40.64
apex_drill_feed_per_min_mm = 66.04
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick, 1/2-1 in by 1/16): upright, a 7/8 in parallel against each jaw;
# lying in Setups 2 and 3, the 13/16 + 1/2 in parallels stacked against
# each jaw; in Setup 5 the 7/8 + 1/2 in (the jaw tops below the step's
# floor, a third of the part's height gripped); in Setup 7 the 3/4 + 1/2 in
# against the fixed jaw, under the foot.
parallel_height_mm = 22.225
riser_height_mm = 33.3375
step_riser_height_mm = 34.925
foot_riser_height_mm = 31.75
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 22.7203
lying_grip_mm = 11.6078
step_grip_mm = 10.0203
foot_grip_mm = 13.1953
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides. Lying in Setups 2-3 the longest blank, in
# Setup 5 the longest blank less the seat skim; upright the depth plus the
# far face's stock; in Setup 7 the width.
vise_lying_inset_mm = -50.1269
vise_step_inset_mm = -50.3809
vise_upright_inset_mm = -64.6049
vise_foot_inset_mm = -67.3989
# Upright in Setup 4 the longest blank less the seat skim stands above the
# parallels once faced (Setups 5 and 6 work from it too).
upright_top_max_mm = 57.912
# PA04's air prove-out raises Z0 this much (1.600 in): the least .1 in
# multiple that stands the bore drill's point (bore_tip_height_mm) at least
# 5 mm above the uncut near end (depth_top_mm); cam.py computes it. The other
# files prove at 1.000 in: their deepest point then clears their stock top.
step_prove_raise_mm = 40.64
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out its
# measured settings allow (cad/config/shop-equipment/measured-cuts.toml:
# 27.94 to 28.45 mm). The deep one was measured at 27.94 only: 28.45 is the
# owner's ruling for it, not a cut, and a longer tool is the less stiff case.
half_mill_projection_mm = 28.45
# Overall lengths: jobber #15 3-1/2 in, 23/64 4-7/8 in (ASME B94.11M); the
# #2 combined drill and countersink 1-7/8 in. Bounded by their whole length
# below the chuck.
drill_15_oal_mm = 88.9
drill_23_64_oal_mm = 123.825
centre_drill_oal_mm = 47.625
# The .3760 reamer in the 5/16 R8 collet (holders.r8-collets-south-bend-
# sb1280): a .3760 chucking reamer is 7 in long on a .3105 shank (Lawson
# LV533 .3760 listing, read 2026-11-21; the owned reamer's make is not on
# record, so its shank is miked first), set 4.25 in out, about 2-3/4 in of
# shank in the collet. In the drill chuck it would stand 7 in below the
# chuck: Setup 5's work top plus that and the tool-change clearance pass the
# mill's 17 in.
reamer_projection_mm = 107.95
reamer_shank_min_mm = 7.874
reamer_shank_max_mm = 7.9375
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the 7/8 in parallels, the longest blank less the
# seat skim and the collet gauge: 247.059, rounded down to .01 in; it is
# also the guide-and-tap stack's declared reach in the setup's capacity
# check. The guide is 3 1/8 in (79.375) overall, its sellers' size and the
# most it can stand below the collet face; the tap's reach in its wrench is
# not on record, so the traveler stops before the tap file unless the tap,
# point to the wrench's centre hole, is at most tap_wrench_reach_max_mm:
# 246.888 less 79.375, 167.513, rounded down to .01 in.
tap_stack_max_mm = 246.888
tap_wrench_reach_max_mm = 167.38

