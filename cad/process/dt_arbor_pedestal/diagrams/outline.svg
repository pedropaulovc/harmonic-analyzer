<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 7: far face up, the foot gripped by the seat (fixed jaw) and the foot top (moving jaw); PA07 faces F and profiles the flanks and the crown. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="20">Setup 7 (PA07_outline): F to the depth, then the flanks and the crown round the bore</text>
  <rect class="clamp" x="43" y="30" width="414" height="40"/>
  <text class="label-on-clamp" x="66" y="56">fixed jaw</text>
  <rect class="clamp" x="43" y="93.37" width="414" height="122.36"/>
  <text class="label-on-clamp" x="66" y="111.37">moving jaw</text>
  <rect class="part-removed" x="195.09" y="93.37" width="109.83" height="231.34"/>
  <path class="part-kept" d="M304.91 70 L304.91 93.37 L300.22 275.76 A50.24 50.24 0 0 1 199.78 275.76 L195.09 93.37 L195.09 70 Z"/>
  <path class="active-face" d="M304.91 93.37 L300.22 275.76 A50.24 50.24 0 0 1 199.78 275.76 L195.09 93.37"/>
  <circle class="holes" cx="250" cy="274.47" r="21.96"/>
  <line class="centre-line" x1="185.6" y1="274.47" x2="314.4" y2="274.47"/>
  <line class="centre-line" x1="250" y1="208" x2="250" y2="336.8"/>
  <line class="hidden" x1="195.09" y1="93.37" x2="304.91" y2="93.37"/>
  <circle class="datum" cx="250" cy="274.47" r="3.5"/>
  <text class="datum-label" x="186.2" y="278.47" text-anchor="end">X0: the bore</text>
  <circle class="datum" cx="112" cy="70" r="3.5"/>
  <text class="datum-label" x="106" y="86" text-anchor="end">Y0: the seat</text>
  <line class="leader" x1="302.9" y1="185" x2="420" y2="185"/>
  <circle class="leader-dot" cx="302.9" cy="185" r="2"/>
  <text class="label" x="424" y="189">flank, climb, {{process.outline_depth_mm:in.3dot}} deep through the strap</text>
  <line class="leader" x1="284.5" y1="311.5" x2="420" y2="311.5"/>
  <circle class="leader-dot" cx="284.5" cy="311.5" r="2"/>
  <text class="label" x="424" y="315.5">crown R{{cad.crown_radius_in:.2dot}} about the bore</text>
  <line class="leader" x1="250" y1="81.5" x2="420" y2="85.5"/>
  <circle class="leader-dot" cx="250" cy="81.5" r="2"/>
  <text class="label" x="424" y="89.5">foot, {{cad.foot_top_height_in:.2dot}} between the jaws, on the stack</text>
  <text class="label" x="420" y="235.6">F faced first, two levels of {{process.far_face_level_mm:in.3dot}}</text>
  <text class="label" x="420" y="340">Looking down on F.</text>
  <text class="label" x="420" y="358">Z0 the stack's top (N, the foot's near end).</text>
</svg>
