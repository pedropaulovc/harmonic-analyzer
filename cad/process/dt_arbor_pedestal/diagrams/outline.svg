<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- Plan from above, fixed jaw at the top: +Y up, +X (toward W) right. Y0 the seat at the fixed jaw's face, X0 the bore. The 3/4 + 1/2 in stack (1/8 in thick) under the foot's near end N against the fixed jaw only: hidden; its length not on record (drawn along the jaw). The 1/2 in end mill (58.4 px) on PA07's first far-face level Z 28.702, pass Y -29.205 (wholly over the strap), running +X (NC line 41). It stands over the moving jaw below the strap, 15.5 mm above the jaw tops (foot_grip_mm 13.195); the outline's last level, Z 17.53, is 4.3 mm above them. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 7 (PA07_outline), plan 4.6 px/mm: F faced first, level 1; then the flanks and the crown</text>
