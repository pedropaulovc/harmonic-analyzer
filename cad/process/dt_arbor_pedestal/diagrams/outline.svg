  <circle class="leader-dot" cx="270" cy="184.34" r="2"/>
  <text class="label" x="404" y="150">1/2 in end mill, far face level 1</text>
  <text class="label" x="404" y="166">(Z 28.702 mm), pass Y -29.205: +X;</text>
  <text class="label" x="404" y="182">F faced first, two levels of {{process.far_face_level_mm:in.3dot}}</text>
  <line class="leader" x1="400" y1="250" x2="302.9" y2="245"/>
  <circle class="leader-dot" cx="302.9" cy="245" r="2"/>
  <text class="label" x="404" y="254">flank, climb, {{process.outline_depth_mm:in.3dot}} deep through the strap</text>
  <line class="leader" x1="400" y1="311.5" x2="284.5" y2="311.5"/>
  <circle class="leader-dot" cx="284.5" cy="311.5" r="2"/>
  <text class="label" x="404" y="315.5">crown R{{cad.crown_radius_in:.2dot}} about the bore</text>
  <line class="leader" x1="400" y1="85.5" x2="250" y2="81.5"/>
