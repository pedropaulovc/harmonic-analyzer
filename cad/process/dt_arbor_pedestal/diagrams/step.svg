  <line class="active-face" x1="372.06" y1="235.74" x2="372.06" y2="137.95"/>
  <line class="centre-line" x1="155.52" y1="221.74" x2="155.52" y2="322"/>
  <rect class="hidden" x="359" y="174.27" width="41" height="25.15"/>
  <path class="cutter" d="M93.11 143.54L93.11 64L85.34 61L77.58 64L69.82 61L62.06 64L54.3 61L46.54 64L38.78 61L31.02 64L23.26 64L23.26 143.54A34.92 8.38 0 0 0 93.11 143.54Z"/>
