<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- 5.5 px/mm. From the front (looking at the moving jaw): +X right, +Y into the page. X0 the seat (right), the part to -X. The moving jaw (in front) and the stacks drawn as outlines. The 1/2 in end mill (69.85 px, 12 % end arc) on PA04's first level Z 26.924, on its first pass X -62.149 (its edge 2.1 mm into the part's left end), running +Y from E toward W, climb, into the page (NC line 25); drawn short to a break. Every pass runs Y -32.766 to +8.89, out over the fixed jaw: at the floor, Z 11.684, the cutter's end is 1.66 mm above the jaw tops (step_grip_mm 10.020). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 5 (PA04_step_bore), 5.5 px/mm: the step down to the strap, first pass</text>
  <rect class="fixture-support" x="64.98" y="300" width="351.52" height="6"/>
  <rect class="hidden" x="30" y="244.89" width="410" height="95"/>
  <line class="hidden" x1="64.98" y1="306" x2="64.98" y2="340"/>
  <line class="hidden" x1="416.5" y1="306" x2="416.5" y2="340"/>
  <text class="label" x="446" y="248.89">jaw tops</text>
  <text class="label" x="446" y="270">moving jaw in front (outline);</text>
  <text class="label" x="446" y="286">the 7/8 + 1/2 in stacks, 1/8 in thick,</text>
  <text class="label" x="446" y="302">under F at each jaw (top shown)</text>
  <circle class="datum" cx="400" cy="300" r="3.5"/>
  <text class="datum-label" x="446" y="330">X0 the seat; Z0 the stacks' top (F)</text>
  <text class="label" x="20" y="388">Looking at the moving jaw (from the front): +X right, +Y into the page; W at the fixed jaw behind.</text>
  <path class="part-kept" d="M400 300L81.48 300L81.48 235.74L372.06 235.74L372.06 137.95L400 137.95Z"/>
  <rect class="part-removed" x="81.48" y="137.95" width="290.58" height="97.79"/>
