  <text class="label" x="150" y="86">+Y, into the page (from E toward W, climb); levels of {{process.step_level_mm:in.3dot}},</text>
  <text class="label" x="150" y="102">passes {{process.step_station_mm:in.3dot}} apart toward the seat, the last with its edge on the foot top</text>
  <line class="leader" x1="146" y1="80" x2="94" y2="110"/>
  <circle class="leader-dot" cx="94" cy="110" r="2"/>
  <line class="leader" x1="474" y1="217.74" x2="235" y2="235.74"/>
  <circle class="leader-dot" cx="235" cy="235.74" r="2"/>
  <text class="label" x="478" y="221.74">floor Z {{process.step_floor_mm:in.4dot}}: the strap and F's stock</text>
  <line class="leader" x1="474" y1="142.5" x2="372.06" y2="162.5"/>
  <circle class="leader-dot" cx="372.06" cy="162.5" r="2"/>
  <text class="label" x="478" y="146.5">foot top X −{{cad.foot_top_height_mm:in.3dot}}: the last pass's edge</text>
  <line class="leader" x1="474" y1="190.84" x2="383.5" y2="186.84"/>
  <circle class="leader-dot" cx="383.5" cy="186.84" r="2"/>
  <text class="label" x="478" y="194.84">hold-down hole (opened by the step)</text>
