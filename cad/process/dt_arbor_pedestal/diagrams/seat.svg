  <rect class="part-arriving" x="134.19" y="138.06" width="71.63" height="175.26"/>
  <rect class="part-kept" x="134.19" y="139.59" width="71.63" height="173.74"/>
  <rect class="part-removed" x="134.19" y="138.06" width="71.63" height="2.52"/>
