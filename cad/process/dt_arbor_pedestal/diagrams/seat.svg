<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- 3 px/mm. Across the jaws seen from the RIGHT end: +Y (the fixed jaw, W) right, +X out of the page (F faces you; X0, N, away). Plan of the seat from above, fixed jaw at the top. The 7/8 in parallels (parallel_height_mm 22.225) 1/8 in thick against each jaw. The 1/2 in end mill (38.1 px, 12 % end arc) on PA03's one level Z0, pass Y -11.932 (wholly over the blank), running +X (NC line 29), toward you; drawn short to a break. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 4 (PA03_seat), 3 px/mm: face the seat; the #15 hole is the next picture's</text>
  <rect class="fixture-vise" x="64.18" y="380" width="211.63" height="14"/>
