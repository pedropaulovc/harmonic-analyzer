  <text class="label-on-clamp" x="159" y="196.22" text-anchor="middle">moving</text>
  <text class="label-on-clamp" x="341" y="196.22" text-anchor="middle">fixed</text>
  <rect class="fixture-support" x="186.5" y="226.65" width="12.7" height="133.35"/>
  <rect class="fixture-support" x="300.8" y="226.65" width="12.7" height="133.35"/>
  <rect class="part-arriving" x="186.5" y="125.05" width="127" height="101.6"/>
