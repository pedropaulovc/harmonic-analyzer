<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="760" height="330"/>
  <text class="title" x="20" y="22">Bench vise, soft jaws, seen from the front (not to scale)</text>
  <!-- Op 20: the rod's end filed square, 1/16 out -->
  <text class="label" x="20" y="50">Op 20: file the rod end</text>
  <rect class="fixture-vise" x="20" y="170" width="90" height="110"/>
  <rect class="fixture-vise" x="126" y="170" width="90" height="110"/>
  <rect class="part-rest" x="110" y="154" width="16" height="126"/>
  <rect class="part-removed" x="110" y="146" width="16" height="8"/>
  <line class="datum" x1="92" y1="154" x2="144" y2="154"/>
  <rect class="cutter" x="68" y="128" width="100" height="10"/>
  <text class="datum-label" x="20" y="160">filed end</text>
  <line class="leader" x1="84" y1="156" x2="108" y2="155"/>
  <circle class="leader-dot" cx="110" cy="155" r="2.5"/>
  <text class="label" x="20" y="300">end 1/16 above the jaws</text>
  <!-- Op 30: the .65 piece above the jaws, sawn at the mark -->
  <text class="label" x="270" y="50">Op 30: saw the .65 piece off</text>
  <rect class="fixture-vise" x="270" y="170" width="90" height="110"/>
  <rect class="fixture-vise" x="376" y="170" width="90" height="110"/>
  <rect class="part-rest" x="360" y="160" width="16" height="120"/>
  <rect class="part-kept" x="360" y="70" width="16" height="86"/>
  <line class="datum" x1="342" y1="70" x2="394" y2="70"/>
  <line class="datum" x1="346" y1="158" x2="390" y2="158"/>
  <rect class="cutter" x="320" y="161" width="110" height="4"/>
  <text class="label" x="400" y="110">.65 piece</text>
  <text class="label" x="236" y="132">blade just</text>
  <text class="label" x="236" y="148">below the mark</text>
  <text class="label" x="270" y="300">mark 1/16 above the jaws</text>
  <!-- Op 40: the piece filed end down, the sawn end filed to length -->
  <text class="label" x="530" y="50">Op 40: file the sawn end</text>
  <rect class="fixture-vise" x="530" y="170" width="90" height="110"/>
  <rect class="fixture-vise" x="636" y="170" width="90" height="110"/>
  <rect class="part-kept" x="620" y="154" width="16" height="96"/>
  <rect class="part-removed" x="620" y="146" width="16" height="8"/>
  <rect class="cutter" x="578" y="128" width="100" height="10"/>
  <text class="label" x="530" y="300">filed end down; .62–.64</text>
</svg>
