  <text class="label" x="446.2" y="320">P1 blade, its chuck-side face on the</text>
  <text class="label" x="446.2" y="336">shoulder, plunged to Ø{{process.relief_dia_in:.2dot}}, under</text>
  <text class="label" x="446.2" y="352">the pilot: the AR's nose radius out</text>
