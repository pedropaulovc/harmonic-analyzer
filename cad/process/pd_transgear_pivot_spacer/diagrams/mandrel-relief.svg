<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 400 px/in along and across the axis, from above (the cross-slide at the bottom). The bar stays in the jaws from Setup 1: its jaw fronts .6919 behind Setup 1's Z0 (cad.jaw_z_mm), the bar parted at .2169 (cad.part_off_in) plus the 1/16 kerf and faced .07 more off in Op 90, so the shoulder (DRO Z-.197, cad.length_in) is .4994 and the jaw fronts .6919 behind Setup 1's Z0: Z-.3895 here. The mandrel: the pilot .15 long (pilot_length_in) at the spacer's #11 hole, Ø.191 (cad.bore_dia_mm; fitted a light press), the body Ø.38 x .10 (mandrel_body_dia_in, mandrel_body_length_in), the root relief Ø.17 (relief_dia_in) one blade width long. The 3-jaw's body and jaws are schematic (their sizes are not on record). The P1 blade to scale across (shop cutoff-blade-p1, 1/16 = 25 px), its chuck-side face on the shoulder (backed off .0005, 0.2 px, not drawn), its tip at Ø.17; its length runs on past the break line (not on record). The spacer is not on the mandrel yet (Op 140). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 2, Op 110: the P1 blade relieves the pilot's root on the shoulder (to scale, 400 px/in)</text>
