<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="sans-serif" font-size="13">
  <!-- Setup 2, section through the axis, 400 px to the inch: the bar stub left in the 3-jaw from Setup 1, turned into a stub mandrel; the spacer on its pilot, front face to the shoulder, the rear face faced to Z0. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="20" y="22">Setup 2: the spacer on the stub mandrel turned on the bar end, front face to the shoulder; rear face faced to Z0</text>
  <rect class="fixture-vise" x="20" y="70" width="60" height="260"/>
  <rect class="clamp" x="80" y="78" width="50" height="22"/>
  <rect class="clamp" x="80" y="300" width="50" height="22"/>
  <rect class="part-rest" x="80" y="100" width="140" height="200"/>
  <rect class="part-removed" x="220" y="100" width="40" height="24"/>
  <rect class="part-removed" x="220" y="276" width="40" height="24"/>
  <rect class="part-rest" x="220" y="124" width="40" height="152"/>
  <rect class="part-rest" x="260" y="166" width="25" height="68"/>
  <rect class="part-removed" x="260" y="163" width="25" height="3"/>
  <rect class="part-removed" x="260" y="234" width="25" height="3"/>
  <rect class="part-rest" x="285" y="163" width="35" height="74"/>
  <rect class="part-kept" x="260" y="112" width="79" height="51"/>
  <rect class="part-kept" x="260" y="237" width="79" height="51"/>
  <rect class="part-removed" x="339" y="112" width="4" height="51"/>
  <rect class="part-removed" x="339" y="237" width="4" height="51"/>
  <line class="centre-line" x1="10" y1="200" x2="420" y2="200"/>
  <line class="active-face" x1="339" y1="112" x2="339" y2="163"/>
  <line class="active-face" x1="339" y1="237" x2="339" y2="288"/>
  <polygon class="cutter" points="343,300 343,290 351,282 380,282 380,300"/>
  <rect class="cutter" x="350" y="300" width="30" height="50"/>
  <line class="leader" x1="339" y1="130" x2="420" y2="70"/>
  <text class="datum-label" x="424" y="66">Z0: the rear (bearing) face, faced to length</text>
  <line class="leader" x1="260" y1="118" x2="300" y2="50"/>
  <text class="label" x="304" y="46">shoulder, faced in Op 100: DRO Z-{{cad.length_in:.3dot}}</text>
  <line class="leader" x1="240" y1="128" x2="160" y2="50"/>
  <text class="label" x="20" y="46">body Ø{{process.mandrel_body_dia_in:.2dot}}, {{process.mandrel_body_length_in:.2dot}} long</text>
  <line class="leader" x1="305" y1="215" x2="430" y2="232"/>
  <text class="label" x="434" y="236">pilot fitted to the spacer,</text>
  <text class="label" x="434" y="252">{{process.pilot_length_in:.2dot}} long: a light press</text>
  <line class="leader" x1="272" y1="236" x2="430" y2="270"/>
  <text class="label" x="434" y="274">root relief Ø{{process.relief_dia_in:.2dot}} (P1 blade)</text>
  <line class="leader" x1="300" y1="270" x2="430" y2="300"/>
  <text class="label" x="434" y="304">spacer, front face on the shoulder;</text>
  <text class="label" x="434" y="320">its rim overhangs the body all round</text>
  <text class="label" x="390" y="346">AR</text>
  <text class="label" x="20" y="352">3-jaw, not opened since Setup 1</text>
  <text class="label" x="20" y="384">Op 140: the spacer pushed on once, its front face (faced in Setup 1) to the shoulder.</text>
  <text class="label" x="20" y="402">Op 160: pushed off by the blade's face on the overhanging rim, a strip of paper between.</text>
</svg>
