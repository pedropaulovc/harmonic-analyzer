# Transgear pivot spacer MHA-PD-20, one off, turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). Route chosen for speed and for the faces' .001 perpendicularity to the
# bore, which the sheet takes from the shop row "faced on a mandrel after
# reaming" (owner ruling 2026-11-08, #2144 item 4.4; pd_transgear_pivot_spacer_spec
# GEOMETRIC_TOLERANCES_IN). The 1/2 in C36000 bar on hand
# (cad/config/shop-equipment/stock-bought.toml c360-round-1-2; the 7/16 bar is
# only to order).
# Setup 1, the bar: face the end, turn the outside to its .43-.45 band back
# past the parting line, spot, drill #15, ream .1855 through and past the
# parting line in the same chucking (the bore runs true to the outside, the
# printed .016 runout), gauge the bore, part off .025 long.
# Setup 2, a stub mandrel turned on the bar left in the chuck (the jaws not
# opened, so it runs true to the spindle): its end faced square, a pilot
# turned a light press in the gauged bore and relieved at its root, its body
# stepped down behind the shoulder so the spacer's rim overhangs it. The
# spacer pushed on, parted face to the shoulder, by the tailstock dead centre:
# its front face skimmed clean; pushed off by the parting blade on the
# overhang, turned round, pushed on front face to the shoulder, the rear
# face faced to length from the shoulder's DRO station. Each face is faced
# square to the pilot, i.e. to the bore, and indicated there. Bench: deburr,
# gauge the bore again, oil.
#
# Not on hand (cad/config/shop-equipment/, to order): the .1855 chucking
# reamer (tools-reamers-taps.toml reamer-1855) and the .1855 GO / .1860
# NO-GO Class X plug gauge pair (gauges.toml plug-gauges-1855-1860): the band
# is .0005, under the pin-gauge sets' .001 step.
title = "Transgear Pivot Spacer"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 1/2 in"
stock = "Lot: {{process.quantity:d}} spacer. Ø{{process.stock_dia_in:.3dot}} bar, on hand (the {{process.bar_length_in:g}} in bar, shared with MHA-PD-24, MHA-PD-25 and MHA-MG-11); the spacer takes {{cad.pitch_in:.2dot}} in of it, and the stub mandrel of Setup 2 is turned on the end left in the chuck."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. To order (not on hand): the .1855 chucking reamer and the .1855 GO / .1860 NO-GO plug gauge pair for the bore."
shop = "../shop"
stock_refs = ["c360-round-1-2"]
material_key = "lathe-c360"
turning_material = "brass"

[cad]
file = "../../out/features/pd_transgear_pivot_spacer/features.toml"
adapter = "turned_bush"
part = "pd-transgear-pivot-spacer"

[parameters]
quantity = 1
stock_dia_in = 0.5
# The 12 in bar on hand (stock-bought.toml c360-round-1-2 length_in, shared
# with MHA-PD-24, MHA-PD-25 and MHA-MG-11) and the length the 3-jaw grips.
bar_length_in = 12.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted end for Setup 2: about .005 for the front face's skim
# on the mandrel and .02 for the rear face's facing to length.
regrip_allowance_in = 0.025
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts, and the bar Setup 2's
# stub mandrel is turned on: .40 left out of the jaws after the part-off;
# Setup 2 faces .07 off it (the drill's point ran about .06 into it), leaving
# .33 for the .10 body, the shoulder and the .15 pilot, all solid.
jaw_clearance_in = 0.4
# Left a side over the band's low end for the finish passes: roughed to the
# band's top, finished to its middle.
finish_allowance_in = 0.01
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.1016
turn_start_z_mm = 0.5
# Setup 2's stub mandrel (authored). The pilot is fitted to the spacer (a
# light press: it starts by hand and the dead centre pushes it home); its
# aim, .0002-.0005 over the gauged bore's top limit, is printed as an aim
# only. Enough to hold a light facing skim, pushed off at the carriage; .15 long, under the spacer's
# length so the facing tool never meets it. Its root relieved by the P1
# blade to Ø.17 (under the pilot), taking out the AR's R0.4 mm nose radius
# so the spacer seats flat on the shoulder. The body behind the shoulder
# turned to Ø.38, .10 long: the spacer's rim overhangs it all round for the
# blade to push on and the feeler to read the seat.
pilot_dia_min_in = 0.1862
pilot_dia_max_in = 0.1865
pilot_length_in = 0.15
relief_dia_in = 0.17
mandrel_body_dia_in = 0.38
mandrel_body_length_in = 0.1
# The feeler leaf that must not enter under a seated face (the shop's feeler
# gauges, cad/config/shop-equipment/gauges.toml feeler-gauges).
seat_leaf_in = 0.002

