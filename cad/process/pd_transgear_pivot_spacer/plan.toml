# Transgear pivot spacer MHA-PD-20, one off, turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). The bore is a #11 drilled hole, a LOCTITE 638 bonded slip fit on the
# MHA-PD-VN-57 shoulder (owner ruling 2026-11-24, fit audit question 6):
# no reamer, no plug gauges; the hole is accepted by trying the screw's
# shoulder in it. The sheet carries no frame between the faces: its length
# band (±.001; necessity register N-01: at ±.002 the faces' taper takes the
# platen air under its floor) holds at every place round the rim, which bounds their taper
# (pd_transgear_pivot_spacer_spec REAR_FACE_PARALLELISM). The 1/2 in C36000
# bar on hand (cad/config/shop-equipment/stock-bought.toml c360-round-1-2;
# the 7/16 bar is only to order).
# Setup 1, the bar: face the end (the spacer's front face), turn the outside
# to its .43-.45 band back past the parting line, spot, drill #11 through and
# past the parting line in the same chucking (the hole runs true to the
# outside, the printed .016 runout), try the screw's shoulder in the hole,
# part off .02 long.
# Setup 2, a stub mandrel turned on the bar left in the chuck (the jaws not
# opened, so it runs true to the spindle): its end faced square, a pilot
# fitted a light press in this spacer's drilled hole and relieved at its
# root, its body stepped down behind the shoulder so the spacer's rim
# overhangs it. The spacer pushed on once, its front face (faced in Setup 1)
# to the shoulder, by a flat pusher in the tailstock drill chuck (a dead
# centre's point would land on the pilot's solid tip, which stands below the
# spacer's face, before the spacer seats); the rear face faced to length
# from the shoulder's DRO station, so it is cut parallel to the face seated
# on the shoulder. Route chosen over rubbing the parted face flat on the
# surface plate (no mandrel): one mounting on a shoulder faced in place cuts
# the rear face parallel by construction and to length on the DRO, where
# hand rubbing a Ø.44 ring rocks it and is slow to a ±.001 length. The
# micrometer at four places round the rim then reads the length at each,
# and so the faces' taper. Bench: deburr, try the shoulder
# again, wipe dry.
title = "Transgear Pivot Spacer"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 1/2 in"
stock = "Lot: {{process.quantity:d}} spacer. Ø{{process.stock_dia_in:.3dot}} bar, on hand (the bar, shared with MHA-PD-24, MHA-PD-25 and MHA-MG-11): hacksaw a {{process.bar_length_in:g}} in working piece and a 1 in piece for the pusher of Op 130 off it before Setup 1. The spacer takes {{cad.pitch_in:.2dot}} in of the working piece, and the stub mandrel of Setup 2 is turned on the end left in the chuck: the piece stays in the jaws from Setup 1 to the end of Setup 2."
shop = "../shop"
stock_refs = ["c360-round-1-2"]
material_key = "lathe-c360"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant). The note's screw sentence prints at Op 60, where the screw is used.
standing = true

[cad]
file = "../../out/features/pd_transgear_pivot_spacer/features.toml"
adapter = "turned_bush"
part = "pd-transgear-pivot-spacer"

[parameters]
quantity = 1
stock_dia_in = 0.5
# The drawing's bonded-fit clearance on the MHA-PD-VN-57 shoulder
# (pd_transgear_pivot_spacer_callouts.BOND_CALLOUT: CLEARANCE .0035-.0085,
# the #11 of D17, owner question Q7b; test_turned_bush_process ties the two).
bond_clearance_min_in = 0.0035
bond_clearance_max_in = 0.0085
# A working piece sawn off the 12 in bar on hand (stock-bought.toml
# c360-round-1-2 length_in, shared with MHA-PD-24, MHA-PD-25 and MHA-MG-11):
# short enough to stand behind the jaws (the fleet's 10 in limit), and with
# the two 3 in bushing pieces and the 1 in pusher it leaves 1 in of the bar.
bar_length_in = 4.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted end for Setup 2's facing of the rear face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts, and the bar Setup 2's
# stub mandrel is turned on: .40 left out of the jaws after the part-off;
# Setup 2 faces .07 off it (the drill's point ran about .06 into it), leaving
# .33 for the .10 body, the shoulder and the .15 pilot, all solid.
jaw_clearance_in = 0.4
# Left a side over the band's low end for the finish passes: roughed to the
# band's top, finished to its middle.
finish_allowance_in = 0.01
rough_radial_doc_mm = 0.5
finish_radial_doc_mm = 0.05
turn_feed_mm_rev = 0.1016
turn_start_z_mm = 0.5
# Setup 2's stub mandrel (authored). The pilot is fitted to this spacer's
# drilled hole (a light press: it starts by hand and the flat pusher pushes
# it home), not turned to a size. Enough to hold a light facing skim, pushed
# off at the carriage; .15 long, under the spacer's
# length so the facing tool never meets it. Its root relieved by the P1
# blade to Ø.17 (under the pilot), taking out the AR's R0.4 mm nose radius
# so the spacer seats flat on the shoulder. The body behind the shoulder
# turned to Ø.38, .10 long: the spacer's rim overhangs it all round for the
# blade to push on and the feeler to read the seat.
pilot_length_in = 0.15
relief_dia_in = 0.17
mandrel_body_dia_in = 0.38
mandrel_body_length_in = 0.1
# The feeler leaf that must not enter under a seated face (the shop's feeler
# gauges, cad/config/shop-equipment/gauges.toml feeler-gauges).
seat_leaf_in = 0.002

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-11"
name = "#11 drill"
ref = "drill-11"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "feelers"
name = "Feeler gauges"
ref = "feeler-gauges"

[[tools]]
id = "pin-gauges"
name = "Pin gauges, .001 steps: .191 to .196"
ref = "pin-gauges"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "Bar: face, turn the outside, drill #11 through, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts. Leave the bar in the jaws after Op 80: Setup 2 turns its mandrel on it."
datum = "Z0 (carriage DRO) the bar end faced in Op 10."
diagram = { file = "diagrams/bar.svg", alt = "The 1/2 in bar in the 3-jaw: the end faced, the outside turned, the hole spotted and drilled #11 through past the parting line; the spacer parted off .02 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off, the last skim no more than .001 deep at the settings' feed, fed from the outside in to the centre: the spacer's front face (the face that seats on the bar). Set DRO Z0 on it."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Outside rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Outside finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the outside from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}: rough to Ø{{cad.outer_rough_dia_mm:in.3dot}}, then finish in light passes of .001–.002 a side, miking between them, to Ø{{cad.outer_dia_mm:in.3dot}} (the band's middle)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Outside Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Outside over {{cad.outer_dia_max_in:.3dot}} in Op 20: take another finish pass and mike again. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 1 centre drill, about Ø.10 across the countersink: under the #11 drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-11"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Feed the #11 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill in one steady feed until the scale reads {{cad.run_in:.2dot}}: the drill's full diameter then runs through the spacer and past the parting line. The #11 drill is the bore (drawing: #11 DRILL THRU). The outside, turned in Op 20, and this hole are made in one chucking: that holds the drawing's .016 runout of the outside to the bore (not gauged)."
settings = "spacer-lathe-drill-11-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped, the hole blown clear: try the {{cad.bore_mate}} screw in it, thread first; its shoulder slides in by hand. Mike the shoulder. Read the hole with the pin gauges: the largest pin that enters by hand."
inspection = "The {{cad.bore_mate}} shoulder enters the hole by hand. Largest pin that enters, less the miked shoulder: {{process.bond_clearance_min_in:.4dot}}–{{process.bond_clearance_max_in:.4dot}} (the drawing's bonded clearance)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "A shoulder that will not enter in Op 60: break the burr at the hole's mouth, clear the chips and try again. Clearance outside {{process.bond_clearance_min_in:.4dot}}–{{process.bond_clearance_max_in:.4dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10 with a #11 drill that mikes .191 across its lands."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: {{process.regrip_allowance_in:.3dot}} over length, for Setup 2. Hands clear: let the spacer fall; pick it up from the bed or the chip tray only after the spindle has stopped. Leave the bar in the jaws."
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Stub mandrel on the bar: face the rear face to length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The bar left in the 3-jaw from Setup 1, the jaws not opened: a stub mandrel turned on its end runs true to the spindle. The spacer pushed onto the mandrel's pilot by a flat pusher in the tailstock drill chuck, spindle stopped, until its front face (faced in Setup 1) seats on the mandrel's shoulder; its rim overhangs the shoulder all round."
datum = "Z0 (carriage DRO): the spacer's rear face as finished in Op 150, {{cad.length_in:.3dot}} out from the mandrel's shoulder: set by touching the AR on the shoulder, faced in Op 100, and setting DRO Z-{{cad.length_in:.3dot}} there. The P1 blade (Ops 110, 160) works from its own holder: the AR's holder comes off and goes back on the toolpost dovetail with its height nut untouched. Op 160's micrometer reading, not the DRO, accepts the length."
diagram = { file = "diagrams/mandrel.svg", alt = "To scale: the bar stub in the 3-jaw turned into a stub mandrel (body Ø{{process.mandrel_body_dia_in:.2dot}}, pilot with a root relief); the spacer pushed on, front face to the shoulder, the AR tool facing its rear face to Z0, {{cad.length_in:.3dot}} out from the shoulder." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = 8.38, minimum_diameter_mm = 4.318, support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar's parted end square, .07 off in all: the drill's point ran about .06 into it past the parting line, so the pilot's tip is then solid brass with no hole in it. Set DRO Z0 on it for Op 100."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the pilot from the tip back to Z-{{process.pilot_length_in:.2dot}}, until the spacer's hole will not quite start on it; feed the AR out along Z-{{process.pilot_length_in:.2dot}} on the last pass: the shoulder's face. Turn the body behind it to Ø{{process.mandrel_body_dia_in:.2dot}}, {{process.mandrel_body_length_in:.2dot}} long. Then fit the pilot: passes of .0002 a side, trying the spacer between, until it starts by hand about .05 and goes no further. Touch the AR on the shoulder and set DRO Z-{{cad.length_in:.3dot}} there."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
inspection = "Pilot: the spacer starts by hand and stops, with no shake (a light press, fitted to this spacer's hole)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Relieve the pilot's root: the blade's chuck-side face on the shoulder (touch it, then back off .0005), plunge to Ø{{process.relief_dia_in:.2dot}}, under the pilot. It takes out the AR's nose radius in the corner, so the spacer's face can seat on the shoulder."
diagram = { file = "diagrams/mandrel-relief.svg", alt = "To scale: the 1/16 P1 blade's chuck-side face on the mandrel's shoulder, plunged to Ø{{process.relief_dia_in:.2dot}} under the pilot." }
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Spacer off the lathe: deburr both ends of its hole with a light twist of the deburring set's countersink by hand, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, and file any parting burr off the parted face's rim, so neither stands proud of a face."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "The pusher: the 1 in piece sawn off the bar before Setup 1 (stock line). File its sawn end flat and break its edges; chuck the other end in the tailstock drill chuck."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: start the spacer on the pilot, front face first (the face faced in Setup 1). Bring the pusher's flat end onto the parted face (the pilot's tip stands about .07 below it, so only the spacer is pushed) and wind the quill until the spacer seats on the shoulder; withdraw the tailstock."
inspection = "Seated: a {{process.seat_leaf_in:.3dot}} leaf does not enter between the spacer and the shoulder."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the rear face (the parted end; the arm's bearing face, Ra 63) to Z0 in light skims, the last no more than .001 deep at the settings' feed, fed from the outside in to the hole: about Ra 32 from the R0.4 mm nose."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: push the spacer off with the P1 blade's tailstock-side face on the rim where it overhangs the shoulder, a strip of paper between, winding the carriage toward the tailstock. Mike the length at four places round the rim, a quarter turn apart."
inspection = "Length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} at each of the four places, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "A reading over {{cad.length_max_in:.3dot}} in Op 160: wipe the pilot, the shoulder and the front face clean and push the spacer on again as Op 140. Touch the AR on the rear face and feed in by the amount the largest reading stands over {{cad.length_in:.3dot}}; face, then push off and mike again as Op 160. A reading under {{cad.length_min_in:.3dot}}: make another from Setup 1."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check the spacer"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished spacer: its {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} length between parallel faces, the turned outside and the #11 drilled hole through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr the outside edges with the smooth file: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, without touching either face's flat. Break both ends of the hole again only if a burr stands, with a light twist of the countersink."
feed = "hand"

[[setups.operations]]
instruction = "Try the {{cad.bore_mate}} screw's shoulder in the hole from both ends: it slides through by hand."
inspection = "The {{cad.bore_mate}} shoulder passes through the hole by hand."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Finish: wipe the spacer clean and dry, the hole free of oil: it is bonded on {{cad.bore_mate}} at assembly (MHA-PD-00), which degreases it again."
feed = "hand"
