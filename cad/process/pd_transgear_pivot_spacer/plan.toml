[[setups]]
machine_kind = "lathe"
title = "Bar: face, turn the outside, drill and ream the bore, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts. Leave the bar in the jaws after Op 90: Setup 2 turns its mandrel on it."
datum = "Z0 (carriage DRO) the bar end faced in Op 10."
diagram = { file = "diagrams/bar.svg", alt = "The 1/2 in bar in the 3-jaw: the end faced, the outside turned, the bore spotted, drilled and reamed through past the parting line; the spacer parted off .025 long." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Outside rough", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_rough_dia_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_rough_dia_mm}}" },
  { name = "Outside finish", phase = "finish", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.outer_rough_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.finish_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the outside from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}: rough to Ø{{cad.outer_rough_dia_mm:in.3dot}}, then finish in light passes of .001–.002 a side, miking between them, to Ø{{cad.outer_dia_mm:in.3dot}} (the band's middle)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Outside Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Outside over {{cad.outer_dia_max_in:.3dot}} in Op 20: take another finish pass and mike again. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 1 centre drill, about Ø.10 across the countersink: under the #15 drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 1.191

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-15"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #15 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill in one steady feed until the scale reads {{cad.run_in:.2dot}}: the drill's full diameter runs through the spacer and past the parting line. It leaves the reamer about .003 a side."
settings = "lathe-drill-15-c360"
cut_diameter_mm = 4.572
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Ream .1855 from the tailstock, spindle running: feed the reamer in until its lead chamfer meets the hole's mouth and zero the quill scale there; feed slowly until it reads {{cad.run_in:.2dot}} (past the parting line), and withdraw with the spindle still running. The outside, turned in Op 20, and this bore are made in one chucking: that holds the drawing's .016 runout of the outside to the bore (not gauged)."
settings = "lathe-ream-1855-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle stopped: the {{cad.bore_dia_min_in:.4dot}} GO plug enters the bore from the faced end; the {{cad.bore_dia_max_in:.4dot}} NO-GO plug does not. The pilot of Setup 2 is turned over the NO-GO's size, so a bore passing here takes it as a press (drawing: Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}}, a press on {{cad.bore_mate}} of {{cad.bore_interference_min_in:.4dot}}–{{cad.bore_interference_max_in:.4dot}})."
inspection = "Bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}}, GO/NO-GO plugs."
gauge_checks = [{ gauge = "plug-gauges-1855-1860", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "GO tight or NO-GO entering in Op 70: the hole is wrong whatever is done to it; part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10 (a NO-GO entering twice: the reamer cuts oversize, stop and check it)."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: {{process.regrip_allowance_in:.3dot}} over length, for Setup 2. Catch the spacer; leave the bar in the jaws."
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Stub mandrel on the bar: face both ends of the spacer square to its bore"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The bar left in the 3-jaw from Setup 1, the jaws not opened: a stub mandrel turned on its end runs true to the spindle. The spacer pushed onto the mandrel's pilot by the MT3 dead centre in the tailstock quill, spindle stopped, the centre's point in the bore's mouth, until the face toward the chuck seats on the mandrel's shoulder; its rim overhangs the shoulder all round."
datum = "Z0 (carriage DRO): the spacer's rear face as finished in Op 190, {{cad.length_in:.3dot}} out from the mandrel's shoulder: set by touching the AR on the shoulder, faced in Op 110, and setting DRO Z-{{cad.length_in:.3dot}} there. The P1 blade (Ops 120, 180) works from its own holder: the AR's holder comes off and goes back on the toolpost dovetail with its height nut untouched, and the AXA post returns it within about .0005 in Z, inside the ±.002 length band."
diagram = { file = "diagrams/mandrel.svg", alt = "The bar stub in the 3-jaw turned into a stub mandrel: shoulder faced, body stepped down behind it, pilot with a root relief; the spacer pushed on, front face to the shoulder, its rear face faced to Z0, a lever indicator on it." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = 8.38, minimum_diameter_mm = 4.73, support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar's parted end square, .07 off in all: the drill's point and the reamer ran about .06 into it past the parting line, so the pilot's tip is then solid brass with no hole in it. Set DRO Z0 on it for Op 110."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the pilot from the tip back to Z-{{process.pilot_length_in:.2dot}}, to about Ø.188; feed the AR out along Z-{{process.pilot_length_in:.2dot}} on the last pass: the shoulder's face. Turn the body behind it to Ø{{process.mandrel_body_dia_in:.2dot}}, {{process.mandrel_body_length_in:.2dot}} long. Then fit the pilot: passes of .0002 a side, trying the spacer between, until it starts by hand about .05 and goes no further. Touch the AR on the shoulder and set DRO Z-{{cad.length_in:.3dot}} there."
settings = "lathe-ar-c360"
cut_diameter_mm = 4.737
inspection = "Pilot: the spacer starts by hand and stops, with no shake (a light press; Ø{{process.pilot_dia_min_in:.4dot}}–{{process.pilot_dia_max_in:.4dot}} the aim, not a gauge)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Relieve the pilot's root: the blade's chuck-side face on the shoulder (touch it, then back off .0005), plunge to Ø{{process.relief_dia_in:.2dot}}, under the pilot. It takes out the AR's nose radius in the corner, so the spacer's face can seat on the shoulder."
settings = "lathe-part-c360"
cut_diameter_mm = 4.737

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Spacer off the lathe: deburr both ends of its bore with a light twist of the deburring set's countersink by hand, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, and file any parting burr off the parted face's rim, so neither stands proud of a face."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "dead-centre"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped: start the spacer on the pilot parted face first, and wind the tailstock quill to push it on with the dead centre's point in the bore's mouth until it seats on the shoulder; withdraw the tailstock."
inspection = "Seated: a {{process.seat_leaf_in:.3dot}} leaf does not enter between the spacer and the shoulder."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Skim the spacer's front face (the Setup 1 faced end, now out; the face that seats on the bar, Ra 125) clean all over in light passes, about .005 off in all, the last no more than .001 deep at the settings' feed, fed from the outside in to the bore: the AR's R0.4 mm nose at that feed leaves about Ra 32, inside the face's Ra."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "dti"
drilling = "none"
sizing = "other"
instruction = "Lever indicator on the carriage, its tip on the front face just inside the rim; turn the chuck by hand one full turn and read the movement."
inspection = "Front face perpendicularity to the bore {{cad.datum_end_perpendicularity_in:.3dot}} ({{cad.datum_end_perpendicularity_mm:.3f}} mm: {{cad.datum_end_perpendicularity_mm:.3f}} on the 0.001 mm indicator): it moves no more than that over the turn."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{cad.datum_end_perpendicularity_mm}}"] }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Front face reading over {{cad.datum_end_perpendicularity_in:.3dot}} in Op 160: push the spacer off as Op 180, wipe the pilot and the shoulder clean, push it on again parted face to the shoulder as Op 140, skim the front face .001 more as Op 150 and indicate it again as Op 160; then go on at Op 180."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Spindle stopped: push the spacer off. Put the blade's tailstock-side face on the spacer's rim where it overhangs the shoulder, a strip of paper between, and wind the carriage toward the tailstock until the spacer comes off the pilot. Turn it round and push it on as Op 140, front face to the shoulder."
inspection = "Seated: a {{process.seat_leaf_in:.3dot}} leaf does not enter between the spacer and the shoulder."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the rear face (the arm's bearing face, Ra 63) to Z0 in light skims, the last no more than .001 deep at the settings' feed, fed from the outside in to the bore: about Ra 32 from the R0.4 mm nose. Spindle stopped, the indicator's tip on the rear face just inside the rim, one turn of the chuck by hand; then push it off as Op 180, a strip of paper on the rim, and mike the length at three places round the rim."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Rear face perpendicularity to the bore {{cad.far_end_perpendicularity_in:.3dot}} ({{cad.far_end_perpendicularity_mm:.3f}} mm on the 0.001 mm indicator); length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} at every place, micrometer."
gauge_checks = [{ gauge = "dti", band_mm = [0.0, "{{cad.far_end_perpendicularity_mm}}"] }, { gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Rear face reading over {{cad.far_end_perpendicularity_in:.3dot}} in Op 190: push it off, wipe the pilot and the shoulder, push it on again front face to the shoulder, face the rear .001 past Z0 (Z-.001) and repeat Op 190's checks. Length over {{cad.length_max_in:.3dot}}: push it on again the same way and face the rear to Z0 again. Under {{cad.length_min_in:.3dot}}: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups]]
