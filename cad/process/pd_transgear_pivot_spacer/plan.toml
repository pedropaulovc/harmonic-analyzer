title = "Bench: deburr and check the spacer"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished spacer: its {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} length between faces square to the bore, the turned outside and the reamed bore through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr the outside edges with the smooth file: R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, without touching either face's flat. Break both ends of the bore again only if a burr stands, with a light twist of the countersink."
feed = "hand"

[[setups.operations]]
instruction = "The {{cad.bore_dia_min_in:.4dot}} GO plug enters the bore from both ends and the {{cad.bore_dia_max_in:.4dot}} NO-GO plug enters from neither."
inspection = "Bore Ø{{cad.bore_dia_min_in:.4dot}}–{{cad.bore_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "plug-gauges-1855-1860", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "A spacer failing Op 220 is scrapped, not reworked: make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Finish: wipe the spacer clean and give its outside a light coat of light machine oil; keep the bore dry for the press on {{cad.bore_mate}}."
feed = "hand"
