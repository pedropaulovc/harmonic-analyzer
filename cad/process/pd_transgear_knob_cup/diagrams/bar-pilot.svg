<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 250 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.875 bar (bar_dia_in), the jaw fronts .58 behind Z0 (stickout_mm 15.24 less the .02 faced off), the outside Ø.44 (cad.outside_dia_mm) back to Z-.48 (outside_run_in), the pilot Ø.250 (the 1/4 end mill, pilot_cutter_dia_mm) .152 deep (cad.pilot_depth_in), the #33 hole to the quill reading .30 (web_drill_depth_in), the part-off face at Z-.38 (part_off_in) with the 1/16 blade's kerf behind it. The 3-jaw's body and jaws are schematic (their sizes are not on record). The 1/4 HSS end mill to scale (shop endmill-hss-2fl-1-4, Ø6.35 mm = 62.5 px), its square end drawn as the near half of its end face, an arc 12 % of its diameter deep, its apex at the floor, .152 (cad.pilot_depth_in) from Z0. Drawn short to a break line (its length out of the chuck is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1, Op 70: the 1/4 end mill from the tailstock plunges the pilot's flat floor (to scale, 250 px/in)</text>
