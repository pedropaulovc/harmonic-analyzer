<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 250 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.875 bar (bar_dia_in), the jaw fronts .58 behind Z0 (stickout_mm 15.24 less the .02 faced off), the outside Ø.44 (cad.outside_dia_mm) back to Z-.48 (outside_run_in), the pilot Ø.250 (the 1/4 end mill, pilot_cutter_dia_mm) .152 deep (cad.pilot_depth_in), the #33 hole to the quill reading .30 (web_drill_depth_in), the part-off face at Z-.38 (part_off_in) with the 1/16 blade's kerf behind it. The 3-jaw's body and jaws are schematic (their sizes are not on record). The B drill to scale (shop drill-b, Ø.2380 = 59.5 px), its 118 deg point; the quill zeroed with its lips on the #33 hole's edge and fed .08 (pilot_drill_depth_in): its full diameter .04 past Z0, its point in the #33 hole. Drawn short to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1, Op 60: the B drill opens the pilot's start, its point in the #33 hole (to scale, 250 px/in)</text>
  <rect class="fixture-vise" x="259" y="58.62" width="56" height="302.75"/>
  <path class="part-rest" d="M30 100.62L380 100.62L380 319.38L30 319.38L27 312.32L30 305.26L27 298.21L30 291.15L27 284.09L30 277.04L27 269.98L30 262.92L27 255.87L30 248.81L27 241.75L30 234.7L27 227.64L30 220.58L27 213.53L30 206.47L27 199.42L30 192.36L27 185.3L30 178.25L27 171.19L30 164.13L27 157.08L30 150.02L27 142.96L30 135.91L27 128.85L30 121.79L27 114.74L30 107.68Z"/>
  <rect class="part-rest" x="380" y="155" width="25" height="110"/>
  <rect class="part-kept" x="405" y="155" width="95" height="110"/>
  <rect class="holes" x="425" y="195.88" width="75" height="28.25"/>
  <path class="holes" d="M425 195.88L416.51 210L425 224.12Z"/>
  <rect class="clamp" x="315" y="70.62" width="40" height="30"/>
  <rect class="clamp" x="315" y="319.38" width="40" height="30"/>
  <line class="centre-line" x1="20" y1="210" x2="740" y2="210"/>
  <path class="cutter" d="M740 180.25L489.5 180.25L471.62 210L489.5 239.75L740 239.75L737 232.31L740 224.88L737 217.44L740 210L737 202.56L740 195.12L737 187.69Z"/>
  <line class="arrow" x1="720" y1="166" x2="660" y2="166"/>
  <line class="datum" x1="500" y1="40" x2="500" y2="76"/>
  <text class="datum-label" x="506" y="50">Z0 the front face</text>
  <text class="label" x="470" y="330">B drill, lips zeroed on the #33 hole's edge, fed</text>
  <text class="label" x="470" y="346">{{process.pilot_drill_depth_in:.2dot}}: it leaves the end mill about .006 a side</text>
  <line class="leader" x1="520" y1="318" x2="560" y2="230"/>
  <circle class="leader-dot" cx="560" cy="230" r="2"/>
</svg>
