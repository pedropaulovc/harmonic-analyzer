<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 400 px/in, from above (the cross-slide at the bottom): the cup Ø.44 (cad.outside_dia_mm), its front face .36 (cad.rear_face_length_in) behind Z0, the jaws on .18 of it (regrip_grip_in) over the shim wrap (its thickness not drawn), nothing behind it; the parted end .02 over length (regrip_allowance_in). Inside, the pilot Ø.250 .152 deep, the web, the #33 hole from the front face to .30 (its point short of the rear face), the pocket Ø.1875 (the 3/16 end mill) .108 deep (cad.pocket_depth_in). The 3-jaw's body and jaws are schematic (their sizes are not on record). The AR tool schematic (not on record), its point on Z0 part way in. Hatched: this setup's removal (the face, the pocket). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 2, Op 100: turned round on a shim wrap; the AR tool faces the parted end to Z0 (to scale, 400 px/in)</text>
  <rect class="fixture-vise" x="260" y="40" width="56" height="330"/>
  <rect class="part-kept" x="376" y="117" width="144" height="176"/>
  <rect class="holes" x="376" y="155" width="60.8" height="100"/>
  <rect class="holes" x="376" y="182.4" width="120" height="45.2"/>
  <path class="holes" d="M496 182.4L509.58 205L496 227.6Z"/>
  <rect class="part-removed" x="520" y="117" width="8" height="176"/>
  <rect class="part-removed" x="476.8" y="167.5" width="43.2" height="75"/>
  <rect class="clamp" x="376" y="87" width="72" height="30"/>
  <rect class="clamp" x="376" y="293" width="72" height="30"/>
  <line class="centre-line" x1="20" y1="205" x2="740" y2="205"/>
  <path class="cutter" d="M520 265L550 277L550 375L542 372L534 375L526 375L526 289Z"/>
  <line class="arrow" x1="564" y1="321" x2="564" y2="275"/>
  <line class="datum" x1="520" y1="52" x2="520" y2="96"/>
  <text class="datum-label" x="526" y="62">Z0 the rear face, faced to length</text>
  <text class="label" x="584" y="384">AR facing, light skims</text>
  <line class="leader" x1="582" y1="380" x2="538" y2="357"/>
  <circle class="leader-dot" cx="538" cy="357" r="2"/>
  <text class="label" x="14" y="48">3-jaw over a brass shim</text>
  <text class="label" x="14" y="64">wrap, on the outside's</text>
  <text class="label" x="14" y="80">{{process.regrip_grip_in:.2dot}} nearest the front</text>
  <text class="label" x="14" y="96">face; nothing behind the cup</text>
  <line class="leader" x1="190" y1="60" x2="412" y2="101"/>
  <circle class="leader-dot" cx="412" cy="101" r="2"/>
  <text class="label" x="560" y="140">hatched: the pocket</text>
  <text class="label" x="560" y="156">to come (Op 120)</text>
  <line class="leader" x1="558" y1="136" x2="498.4" y2="185"/>
  <circle class="leader-dot" cx="498.4" cy="185" r="2"/>
</svg>
