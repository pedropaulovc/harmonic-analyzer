<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 2, section through the axis, 300 px to the inch: the cup turned round, .18 of its front end in the 3-jaw over a shim wrap; Z0 the rear face at the right. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 2: the cup turned round on a shim wrap; rear face faced to length, the head pocket plunged</text>
  <rect class="fixture-vise" x="20" y="60" width="50" height="280"/>
  <rect class="clamp" x="200" y="104" width="54" height="26"/>
  <rect class="clamp" x="200" y="270" width="54" height="26"/>
  <rect class="fixture-support" x="200" y="130" width="54" height="4"/>
  <rect class="fixture-support" x="200" y="266" width="54" height="4"/>
  <rect class="part-kept" x="200" y="134" width="108" height="132"/>
  <rect class="part-removed" x="308" y="134" width="6" height="132"/>
  <rect class="holes" x="200" y="162" width="46" height="76"/>
  <rect class="holes" x="246" y="183" width="30" height="34"/>
  <rect class="part-removed" x="276" y="172" width="32" height="56"/>
  <line class="centre-line" x1="60" y1="200" x2="560" y2="200"/>
  <line class="active-face" x1="308" y1="134" x2="308" y2="266"/>
  <rect class="cutter" x="308" y="172" width="120" height="56"/>
  <line class="leader" x1="308" y1="150" x2="420" y2="80"/>
  <text class="datum-label" x="424" y="76">Z0: the rear face, faced to length</text>
  <line class="leader" x1="290" y1="226" x2="420" y2="280"/>
  <text class="label" x="424" y="276">head pocket, 3/16 end mill from the tailstock,</text>
  <text class="label" x="424" y="292">{{cad.pocket_depth_min_in:.3dot}}–{{cad.pocket_depth_max_in:.3dot}} deep</text>
  <line class="leader" x1="230" y1="130" x2="200" y2="70"/>
  <text class="label" x="110" y="64">jaws on a shim wrap, {{process.regrip_grip_in:.2dot}} from the front face</text>
  <text class="label" x="20" y="380">nothing behind the cup: the length is set from the micrometer</text>
</svg>
