<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 1, section through the axis, 300 px to the inch: the 7/8 in bar .60 out of the 3-jaw, front end out; Z0 the faced front end at the right. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1: the 7/8 in bar in the 3-jaw, front end out; the outside turned, web hole, pilot; parted off long</text>
  <rect class="fixture-vise" x="20" y="60" width="50" height="280"/>
  <rect class="clamp" x="70" y="40" width="80" height="29"/>
  <rect class="clamp" x="70" y="331" width="80" height="29"/>
  <rect class="part-rest" x="70" y="69" width="116" height="262"/>
  <rect class="part-removed" x="186" y="69" width="144" height="65"/>
  <rect class="part-removed" x="186" y="266" width="144" height="65"/>
  <rect class="part-removed" x="324" y="134" width="6" height="132"/>
  <rect class="part-waste" x="193" y="134" width="23" height="132"/>
  <rect class="part-rest" x="186" y="134" width="7" height="132"/>
  <rect class="part-kept" x="216" y="134" width="108" height="132"/>
  <rect class="holes" x="284" y="162" width="40" height="76"/>
  <rect class="holes" x="234" y="183" width="50" height="34"/>
  <line class="centre-line" x1="60" y1="200" x2="560" y2="200"/>
  <line class="active-face" x1="324" y1="134" x2="324" y2="266"/>
  <line class="leader" x1="324" y1="155" x2="420" y2="146"/>
  <text class="datum-label" x="424" y="150">Z0: the front face as supplied</text>
  <line class="leader" x1="300" y1="134" x2="330" y2="96"/>
  <text class="label" x="334" y="92">outside Ø{{cad.outside_dia_min_in:.3dot}}–{{cad.outside_dia_max_in:.3dot}}, past the parting line</text>
  <line class="leader" x1="304" y1="230" x2="420" y2="250"/>
  <text class="label" x="424" y="246">pilot Ø{{process.pilot_cutter_dia_mm:in.3dot}} REF, 1/4 end mill,</text>
  <text class="label" x="424" y="262">{{cad.pilot_depth_min_in:.3dot}}–{{cad.pilot_depth_max_in:.3dot}} deep, flat floor</text>
  <line class="leader" x1="250" y1="210" x2="420" y2="300"/>
  <text class="label" x="424" y="304">#33 hole through the web, on past</text>
  <text class="label" x="424" y="320">the pocket floor (cut in Setup 2)</text>
  <rect class="cutter" x="193" y="331" width="23" height="40"/>
  <text class="label" x="222" y="370">part off at Z-{{process.part_off_in:.3dot}}</text>
  <text class="label" x="20" y="380">3-jaw</text>
</svg>
