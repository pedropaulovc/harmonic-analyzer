# Transgear knob cup MHA-PD-16, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC; every
# hole on the lathe). The 7/8 in C36000 bar on hand
# (cad/config/shop-equipment/stock-bought.toml c360-round-7-8, allocated to
# MHA-PD-16).
# Setup 1, the bar, front end out: face (Z0, the front face as supplied),
# turn the outside to .44 back past the parting line, spot, drill #33 through
# the web and past the pocket floor, drill B short of the pilot floor, then
# plunge the 1/4 end mill from the tailstock to the pilot depth (owner route,
# #2425: the 1/4 end mill's square corner is the floor's R.005 MAX; the
# pilot is a bonded seat made to fit the MHA-PD-08 journal, its size REF
# and its clearance on the journal the requirement, sheet note 2, rule 4,
# form 2), part off .02 long. Setup 2, the cup turned
# round on its outside over a shim wrap: face the rear to length from the
# miked length, plunge the 1/4 end mill for the head pocket. Bench: deburr,
# check, oil.
# Left for MHA-PD-00 step 22 (sheet note 1: LENGTH AND PILOT DEPTH ARE SUPPLY
# SIZES): the front face is faced at fit-up until the pilot depth is the
# journal's stand-out less the end float, and the pilot is bonded on the
# knob shaft with LOCTITE 641; this traveler supplies the length and the
# pilot depth to their supply bands.
# When the cup can be made (codjiflo r2 on #3493): its pilot is fitted to the
# finished MHA-PD-08 journal, and that journal is turned last to the
# MHA-PD-28 bush's bore, which MHA-PD-00 step 11 reams in the MHA-PD-19
# plate (sub-step 11O, accepted by the journal: row bush-reamed). So the
# journal, and this cup after it, are made once that ream is done; the cup
# waits for step 22.
#
# Not on hand (cad/config/shop-equipment/gauges.toml pin-gauges, to order;
# owner 2026-11-21: "ill buy pin gauges"): the .113 and .117 pins for the web
# hole and the .250-.254 pins for the pilot. The pilot is accepted on its
# mate (traveler-guidelines T0; traveler review 2026-11-24, three runs: two
# fixed pins pass and reject pilots the sheet's clearance does not): the
# finished MHA-PD-08 journal's end is miked as J and enters to the floor,
# P is the largest .001-step pin that enters, and P less J is .0005-.004.
# The pilot lies between P and P + .001, so its clearance on the journal is
# inside the sheet's .0005-.005 and LOCTITE 641's fill
# (pd_transgear_knob_cup_spec PILOT_CLEARANCE, LOCTITE_641_GAP_MAX). No
# plug gauge pair. The pins run from the end mill's .250 to one step over
# the largest P that can pass (the journal as fitted, at most .2493, plus
# .004, or the end mill's largest cut, to the .001 below), so P is always
# found: .254. test_pd_transgear_knob_cup_drawing ties the gauge bands and
# these keys to the spec.
title = "Transgear Knob Cup"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 7/8 in (drawing: {{cad.material_name}})"
stock = "Lot: {{process.quantity:d}} cup. Ø{{process.bar_dia_in:.3dot}} bar, on hand; the cup takes about {{process.bar_use_in:.2dot}} in of it."
shop = "../shop"
stock_refs = ["c360-round-7-8"]
material_key = "lathe-c360"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant); This job says what only this cup needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Make first", "Make MHA-PD-08 first: Op 70 accepts the pilot on its finished journal. That journal is turned last to the MHA-PD-28 bush's bore, which MHA-PD-00 step 11 reams in the MHA-PD-19 plate, so this cup is made after that ream."],
  ["To order", "To order (not on hand): the .113, .117 and .250–.254 pins (pin-gauge sets)."],
]

[cad]
file = "../../out/features/pd_transgear_knob_cup/features.toml"
adapter = "drilled_block"
part = "pd-transgear-knob-cup"

[parameters]
quantity = 1
bar_dia_in = 0.875
# .02 faced, the cup's .38 parted length and the .075 kerf.
bar_use_in = 0.48
# The blank a cup is cut from (stock_fit: envelope X, Y, Z): the 7/8 in
# bar, the cup's parted length.
blank_x_in = 0.875
blank_y_in = 0.38
blank_z_in = 0.875
# Setup 1: out of the jaw fronts, the facing, the .38 parted length, the
# kerf and .10 for the blade to clear the jaws.
stickout_mm = 15.24
face_allowance_in = 0.02
# Left on the parted end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
blade_width_in = 0.0625
# Parting kerf: the blade's width plus .0125 (authored).
part_kerf_in = 0.075
# Setup 1 parts the cup off .02 over its .36 supply length.
part_off_in = 0.38
# Setup 1 turns the outside this far back from Z0, past the parting line.
outside_run_in = 0.48
# The #33 drill's quill depth from its lips at the spot: through the web
# and past the pocket floor (.252 from Z0), short of the parting line.
web_drill_depth_in = 0.3
# The B drill's quill depth from its lips at the spot: its point (118°, .07
# long) then ends inside the #33 hole, above the pilot floor, so the end mill
# cuts the floor flat across its whole face.
pilot_drill_depth_in = 0.08
# The 1/4 end mill's size, the pilot's REF size on the sheet.
pilot_cutter_dia_mm = 6.35
# The smallest pin tried in the pilot, the 1/4 end mill's size, and the
# most the largest entering pin may stand over the miked journal: the
# sheet's clearance maximum less the set's .001 step (the header above).
pilot_go_pin_in = 0.25
pilot_pin_over_journal_max_in = 0.004
# Setup 2: how much of the outside the jaws take, from the front face.
regrip_grip_in = 0.18
# The feeler leaf the AR's tip is touched through in Setup 2 (the shop's
# feeler gauges, cad/config/shop-equipment/gauges.toml feeler-gauges).
touch_leaf_in = 0.002

