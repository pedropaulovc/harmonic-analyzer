<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="14">
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="24">Plan of the saw table: a .95 piece off the 1/16 x 5/8 strip (not to scale)</text>
  <rect class="fixture-table" x="10" y="50" width="740" height="200"/>
  <rect class="clamp" x="420" y="96" width="300" height="34"/>
  <rect class="clamp" x="420" y="170" width="300" height="34"/>
  <rect class="part-kept" x="150" y="130" width="170" height="40"/>
  <rect class="part-rest" x="330" y="130" width="410" height="40"/>
  <rect class="cutter" x="322" y="70" width="8" height="150"/>
  <line class="datum" x1="150" y1="112" x2="150" y2="188"/>
  <text class="datum-label" x="40" y="108">strip's squared end</text>
  <line class="dims" x1="150" y1="210" x2="320" y2="210"/>
  <line class="dims" x1="150" y1="202" x2="150" y2="218"/>
  <line class="dims" x1="320" y1="202" x2="320" y2="218"/>
  <text class="label" x="150" y="244">scribe line .95 from the end</text>
  <text class="label" x="156" y="154">piece: drops clear</text>
  <text class="label" x="290" y="66">blade on the waste side of the line</text>
  <text class="label" x="470" y="90">saw vise: the long end of the strip, flat</text>
  <text class="label" x="20" y="282">1/16 x 5/8 1018 strip, flat on the table; five pieces; file the burr off each</text>
</svg>
