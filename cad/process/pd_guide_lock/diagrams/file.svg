<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif" font-size="14">
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="24">The finished plate, face on (to scale, 400 px to the inch): filing datums and corners</text>
  <rect class="part-removed" x="190" y="70" width="380" height="250"/>
  <rect class="part-kept" x="200" y="120" width="356" height="180" rx="28" ry="28"/>
  <line class="datum" x1="180" y1="300" x2="580" y2="300"/>
  <text class="datum-label" x="586" y="318">guide edge (filed first)</text>
  <line class="datum" x1="200" y1="110" x2="200" y2="316"/>
  <text class="datum-label" x="40" y="214">left end</text>
  <text class="datum-label" x="40" y="232">(filed square</text>
  <text class="datum-label" x="40" y="250">to the guide edge)</text>
  <line class="dims" x1="200" y1="336" x2="556" y2="336"/>
  <text class="label" x="330" y="354">.89 width</text>
  <line class="dims" x1="600" y1="120" x2="600" y2="300"/>
  <text class="label" x="606" y="214">.45 height</text>
  <line class="leader" x1="548" y1="128" x2="640" y2="80"/>
  <circle class="leader-dot" cx="548" cy="128" r="3"/>
  <text class="label" x="600" y="72">4X R.07 corners</text>
  <circle class="hidden" cx="280" cy="210" r="25"/>
  <circle class="hidden" cx="476" cy="210" r="25"/>
  <text class="label" x="300" y="180">2X Ø.125: drilled at assembly, not here</text>
  <text class="label" x="200" y="62">strip waste filed off the edges and ends (shaded)</text>
