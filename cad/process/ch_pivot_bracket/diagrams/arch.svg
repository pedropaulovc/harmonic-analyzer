<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 5. Hand picture at 4.5 px/mm. The part lying I up on the 1 in + 1/2 in stacks (riser_height_mm 38.1), gripped on W (fixed jaw) and E, the seat at X0 on the right, the jaw tops 6.845 mm over the stacks (lying_grip_mm): the jaws grip only waste. Part 19.05 I to O (blank_section_mm), .640 W to E, drawn 1.475 long less the seat skim. Jaws' depth and the vise body are not on record: drawn schematic. Parallels 1/8 in thick (parallel_thickness_mm). PB04's first cut: the arch's first rough level, Z 14.486 (arch_rough_level_mm 4.564 down from I), climb (G2) round the centre X -26.924, Y -8.128 at R14.986 (the arch R.320 + arch_finish_stock_mm 0.508 + the cutter's radius); drawn at its left point, X -41.910, fed +Y. The second level (Z 9.922) and the finish pass are not drawn. The 1/2 in end mill to scale (face_cutter_dia_mm 12.7), its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line, 1.12 in out of the collet (half_mill_projection_mm 28.45; the collet is not drawn, its size is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="24">Setup 5, PB04 T1 on the arch: from above and from the front (4.5 px/mm)</text>
