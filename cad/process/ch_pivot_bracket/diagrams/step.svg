<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 6. Hand picture at 8 px/mm, looking at the moving jaw (its outline only: the jaw tops, 6.845 mm over the stacks, lying_grip_mm). The part I down on the 1 in + 1/2 in stacks, the seat at X0 on the left, the arch to the right (apex 1.380 from the seat), 19.05 I to O (blank_section_mm), the arch and the bore cut in Setup 5. PB05's first cut: the foot end faced down to Z 17.780 (the foot end, .7000) on the pass at Y -6.217, the one wholly over the part (W to E 0 to -16.256), fed +X; drawn at X 20.0. The passes at Y +2.161, -2.028 and -10.406 and the step's levels after it (step_level_mm 1.2065 each, to the outboard face Z 8.128, the last pass's edge on the foot top X 6.096) are not drawn; the step's waste is hatched. The 1/2 in end mill to scale (face_cutter_dia_mm 12.7), its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line, 1.12 in out of the collet (half_mill_projection_mm 28.45; the collet is not drawn, its size is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="24">Setup 6, PB05 faces the foot end, from the front (8 px/mm)</text>
  <rect class="fixture-support" x="106" y="330" width="344.42" height="5"/>
