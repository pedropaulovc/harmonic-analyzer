  <line class="arrow" x1="350" y1="70" x2="390" y2="70"/>
  <circle class="datum" cx="130" cy="330" r="3.5"/>
  <text class="label" x="398" y="74">the 1/2 in end mill on the foot end's level, fed +X:</text>
  <text class="label" x="398" y="90">first the foot end across the whole part, then the step</text>
  <text class="label" x="398" y="106">in levels of {{process.step_level_mm:in.3dot}} down to the ear</text>
  <text class="label" x="426.42" y="191.76">foot end Z {{cad.foot_end_length_mm:in.4dot}}</text>
  <text class="label" x="426.42" y="268.98">outboard face Z {{cad.outboard_face_thickness_mm:in.4dot}}</text>
  <text class="label" x="426.42" y="287.24">jaw tops (the moving jaw, in front)</text>
  <line class="leader" x1="178.77" y1="242" x2="422.42" y2="242"/>
  <circle class="leader-dot" cx="422.42" cy="242" r="2"/>
  <text class="label" x="426.42" y="246">foot top X {{cad.foot_top_height_mm:in.3dot}}: the step's wall</text>
  <line class="leader" x1="337.6" y1="306" x2="422.42" y2="306"/>
  <circle class="leader-dot" cx="422.42" cy="306" r="2"/>
  <text class="label" x="426.42" y="310">bore (Setup 5)</text>
