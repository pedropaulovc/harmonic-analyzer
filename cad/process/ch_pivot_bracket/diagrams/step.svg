  <rect class="holes" x="305.49" y="264.98" width="52.22" height="65.02"/>
  <rect class="holes" x="130" y="210.11" width="48.77" height="36.58"/>
  <line class="active-face" x1="130" y1="187.76" x2="178.77" y2="187.76"/>
  <line class="active-face" x1="178.77" y1="187.76" x2="178.77" y2="264.98"/>
  <line class="active-face" x1="178.77" y1="264.98" x2="410.42" y2="264.98"/>
