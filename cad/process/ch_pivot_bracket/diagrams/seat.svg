  <text class="datum-label" x="644.2" y="154">Y0: W</text>
  <text class="label" x="540" y="251.02">1/2 in end mill on the first pass,</text>
  <text class="label" x="540" y="267.02">Y +0.765 mm, +X; .280 past W</text>
