  <text class="datum-label" x="683.25" y="179">Y0: W</text>
  <text class="label" x="560" y="296.28">hole X {{cad.hold_down_station_mm:.3f}}, Y −{{cad.hold_down_lateral_mm:.3f}} mm</text>
