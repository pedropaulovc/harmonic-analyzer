  <text class="datum-label" x="663.25" y="159">Y0: W</text>
  <text class="label" x="540" y="272.28">1/2 in end mill, Y −10.406 mm</text>
  <text class="label" x="540" y="288.28">pass, +X; .020 past E</text>
</svg>
