<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 4. Hand picture at 4.2 px/mm, from the right end, looking -X (I at the far end, X0). The blank upright on the 1 in parallels against each jaw (parallel_height_mm, parallel_thickness_mm), gripped on W (fixed jaw) and E, the jaw tops 19.545 over the parallels (upright_grip_mm); drawn 1.475 long less the seat skim (blank_length_min/max_mm, seat_skim_mm 0.508); W to E .640 (Setup 3). Jaws' depth and the vise body are not on record: drawn schematic. Parallels 1/8 in thick (parallel_thickness_mm). PB03's first cut: the pass at Y -10.406 (cutter centre), the one least past the blank's sides (.020 past E), its tip at Z0, fed +X (toward you); the passes at Y +0.765 and -4.821 (seat_stepover_mm 5.585) are not drawn. The 1/2 in end mill to scale (face_cutter_dia_mm 12.7), its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line, 1.12 in out of the collet (half_mill_projection_mm 28.45; the collet is not drawn, its size is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="24">Setup 4, PB03 faces the seat, from the right end (4.2 px/mm)</text>
  <rect class="fixture-vise" x="119.72" y="361.92" width="152.28" height="16"/>
  <rect class="clamp" x="230" y="173.15" width="42" height="188.77"/>
  <rect class="clamp" x="119.72" y="173.15" width="42" height="188.77"/>
  <text class="label-on-clamp" x="251" y="189.15" text-anchor="middle">fixed</text>
  <text class="label-on-clamp" x="140.72" y="189.15" text-anchor="middle">moving</text>
  <rect class="fixture-support" x="161.72" y="255.24" width="13.33" height="106.68"/>
  <rect class="fixture-support" x="216.66" y="255.24" width="13.33" height="106.68"/>
  <rect class="part-kept" x="161.72" y="100" width="68.28" height="155.24"/>
  <rect class="part-removed" x="161.72" y="97.87" width="68.28" height="2.13"/>
  <line class="active-face" x1="161.72" y1="100" x2="230" y2="100"/>
  <line class="hidden" x1="161.72" y1="125.6" x2="230" y2="125.6"/>
  <path class="cutter" d="M212.96 93.6L212.96 45.4L209.15 48.4L205.34 45.4L201.53 48.4L197.72 45.4L193.91 48.4L190.1 45.4L186.29 48.4L182.48 45.4L178.67 48.4L174.86 45.4L171.05 48.4L167.24 45.4L163.43 48.4L159.62 45.4L159.62 93.6A26.67 6.4 0 0 0 212.96 93.6Z"/>
  <line class="arrow" x1="153.62" y1="66.4" x2="129.62" y2="66.4"/>
  <text class="label" x="330" y="64">the seat: {{process.seat_skim_mm:in.3dot}} off the sawn end; Z0</text>
  <line class="leader" x1="326" y1="60" x2="167.72" y2="98.74"/>
  <circle class="leader-dot" cx="167.72" cy="98.74" r="2"/>
  <text class="label" x="330" y="84">1/2 in end mill: each pass along X (toward you on</text>
  <text class="label" x="330" y="100">this one), stepping −Y; the #15 drill has its own picture</text>
  <line class="leader" x1="326" y1="140" x2="221.6" y2="125.6"/>
  <circle class="leader-dot" cx="221.6" cy="125.6" r="2"/>
  <text class="label" x="330" y="144">foot top, {{cad.foot_top_height_in:.2dot}} below the seat (hidden)</text>
  <line class="leader" x1="326" y1="300" x2="223.33" y2="308.58"/>
  <circle class="leader-dot" cx="223.33" cy="308.58" r="2"/>
  <text class="label" x="330" y="304">1 in parallels, one against each jaw</text>
  <text class="label" x="330" y="324">W at the fixed jaw (right); I at the far end (X0)</text>
  <text class="label" x="330" y="344">jaw tops {{process.upright_grip_mm:in.2dot}} over the parallels</text>
  <text class="label" x="540" y="136">The seat from above (5 px/mm):</text>
  <rect class="part-kept" x="560" y="155" width="95.25" height="81.28"/>
  <rect class="part-removed" x="560" y="155" width="95.25" height="81.28"/>
