<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 3. Hand picture at 4.5 px/mm. The 3/4 in blank (blank_section_mm 19.05) on a 1 in + 1/2 in stack of parallels against each jaw (riser_height_mm 38.1, parallel_thickness_mm 3.175), the jaw tops 6.845 mm over the stacks (lying_grip_mm). Jaws' depth and the vise body are not on record: drawn schematic. Parallels 1/8 in thick (parallel_thickness_mm). The 1/2 in end mill to scale (face_cutter_dia_mm 12.7), its square end drawn as the near half of the end face, 12 % deep; drawn short to a break line, 1.12 in out of the collet (half_mill_projection_mm 28.45; the collet is not drawn, its size is not on record). PB02's first level, Z 17.018 (width_level_mm 0.762 down from the top), on the pass at Y -8.312, the one wholly over the blank, fed +X (toward you); the other passes (4.888 apart) and the second level to Z 16.256 (the width, .640) are not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="24">Setup 3, PB02_width, from the right end (4.5 px/mm)</text>
