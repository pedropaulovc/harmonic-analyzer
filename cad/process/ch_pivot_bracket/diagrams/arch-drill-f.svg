<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- Setup 5. Hand picture at 4.5 px/mm. The part lying I up on the 1 in + 1/2 in stacks (riser_height_mm 38.1), gripped on W (fixed jaw) and E, the seat at X0 on the right, the jaw tops 6.845 mm over the stacks (lying_grip_mm): the jaws grip only waste. Part 19.05 I to O (blank_section_mm), .640 W to E, drawn 1.475 long less the seat skim. Jaws' depth and the vise body are not on record: drawn schematic. Parallels 1/8 in thick (parallel_thickness_mm). The F drill (.257) to scale (cutter_dia_mm 6.5278; plan tool drill-f), 118 deg point, at the bore X -25.200, Y -8.128, its point at Z 6.961 (PB04's plunge): its full diameter 2.0 mm past the outboard face's plane (bore_drill_past_mm), into the waste Setup 6 removes. Drawn short to a break line (its chuck is not drawn: no size on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
