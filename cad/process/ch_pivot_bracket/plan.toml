feed = "hand"

# PB05 stays on the chart setting, outside the measured envelope: the wall
# pass 9.652 deep x 0.355, the foot-end and step passes 4.189 wide in the
# same operation at its 2650 rpm (the measured face record holds at
# 2420-2490). Owner (Pedro), 2026-11-22: deep walls, "log new
# dechatter issues to try deep axial cuts but with shallow radial depth"
# (#3427); full-width passes, "same log new dechatter issues to try full
# radial depth but shallow axial" (#3428). No re-cut: the first blank is
# listened to.
[[setups.operations]]
steps = [
  { kind = "stop", text = "First blank only: these PB05_step cuts at 2650 rpm have not been chatter-tested on this end mill (owner's test list #3427, #3428): the wall pass .380 deep × {{process.wall_finish_woc_mm:in.3dot}} wide, the foot-end and step passes {{process.face_step_max_mm:in.3dot}} and {{process.step_level_mm:in.3dot}} deep × .165 wide. Listen through the run; on chatter, feed hold, stop the spindle and tell the owner." },
]
feed = "hand"

[[setups.operations]]
