instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max: smooth file on the outside edges, the scraper from the deburring set on the bore's, the hold-down hole's and the apex hole's mouths (no countersink). Leave the inside corner of the step as cut (R{{cad.inside_corner_radius_max_in:.2dot}} max: the end mill's sharp corner; do not file a radius into it). Keep I and the outboard face flat: stone them lightly on a flat stone. Wash off the oil."
