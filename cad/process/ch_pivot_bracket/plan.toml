# Pivot bracket MHA-CH-08 (qty 2), routed for the CNC mill (the agent's
# route for speed, owner rulings 2026-11-21: the owner corrects it
# afterwards). Each bracket from one sawn blank of 3/4 in square 1018, its
# length along the bar about 1.45-1.50, one blank per program run. The bar's
# cold-finished faces: one stays as the inboard face I (the ear's inboard
# thrust face, the datum of the .320 ear, the .70 length and the hole
# stations), its opposite is faced to the .70 length; the two others are
# faced to the .64 width (west side W first, the lateral datum). Both milled
# sides remove the bar's four rounded corners, so every long edge is a
# milled one.
#
# Route: saw; Setup 2 lying on the 1 in + 1/2 in parallel stacks, I to the
# fixed jaw, skim W (PB01); Setup 3 W down, face the east side to the width
# (PB02); Setup 4 upright on the 1 in parallels, gripped on W and E: face the
# seat and drill the #15 hold-down hole from it, into the waste above the
# foot (PB03); Setup 5 lying, I up, the raw opposite face down: profile the
# R.32 arch through the ear and spot, drill (D) and ream (.2560) the bore
# through the ear, both 1 mm into the waste the step removes; the jaws grip
# only that waste, below the cuts (PB04); Setup 6 I down: face the foot end
# to the .70 length and mill the L step to the .320 ear, which opens the
# bore and the hold-down hole (PB05); Setup 7 upright on the seat: spot and
# drill #43 through the arch apex into the bore (PB06), tap 4-40 by hand
# under the spring tap guide in the spindle (PB07); bench deburr (the reamer
# by hand through the bore) and inspect. Finish: black oxide, in the shop.
# Owner (Pedro), answered in
# person 2026-11-21: "Black oxide: cold blackening in the shop with Presto
# Black PC9 is acceptable as the drawing's black oxide." The last setup
# blackens the bracket with Birchwood Presto Black Steel PC9 by the maker's
# instructions (Presto Black Steel PC9 Instructions, steps 1 prepare, 2b
# brush-on, 3 stop, 4 dry, 6 seal; cad/config/shop-equipment/
# consumables.presto-black-steel-pc9, which cites them); the PC9 and the
# gloves and glasses are to buy (to_order).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21: "remove mention of dead centre ; use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so the tap stop is its
# own file ending M30 over its hole (PB07).
#
# Zeroing: every X/Y zero the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), every Z zero a tool on a .002
# feeler leaf, as the column clamp plans do.
#
# NC (cam:ch_pivot_bracket, cad/process/ch_pivot_bracket/cam.py):
# PB01_west, PB02_width, PB03_seat, PB04_arch_bore, PB05_step, PB06_apex,
# PB07_apex_tap. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #15,
# T4 D, T5 .2560 reamer, T6 #43, T7 the tap guide (the tap is turned by
# hand).
title = "Pivot bracket"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (the drawing's MATERIAL: {{cad.material_name}}; the part's spec: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.east_side_width_min_in:.3dot}}–{{cad.east_side_width_max_in:.3dot}} wide (W to E), {{cad.foot_end_length_min_in:.3dot}}–{{cad.foot_end_length_max_in:.3dot}} long (I to the foot end), {{cad.arch_overall_height_min_in:.3dot}}–{{cad.arch_overall_height_max_in:.3dot}} high (seat to the arch apex); the ear {{cad.outboard_face_thickness_min_in:.3dot}}–{{cad.outboard_face_thickness_max_in:.3dot}} thick (I to the outboard face). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Each blank gets its own zeros (no vise stop): in every mill setup, repeat the edge-finder and Z touch-off ops for each blank clamped, before its run. Every cutting file is proved in air on the first blank; the tap file moves only at the machine top and over the hole, spindle off. To order: the .2560 reamer (Setup 5's reaming waits for it), the pin gauges (the bore checks wait for them), and the black-oxide solution with gloves and glasses (the last setup waits for them)."
shop = "../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_pivot_bracket/features.toml"
adapter = "drilled_block"
part = "ch-pivot-bracket"

[parameters]
quantity = 2
# The bore's Class ZZ pins, shop gauges.zz-pins-2560-2600 (owner ruling
# 2026-11-23, tool audit Q1, re-answered, verbatim: "ZZ singles per the
# record: 29 pins (17 plus GO, 12 minus NO-GO), about $130. Accept that good
# holes near a limit may be refused; the traveler mikes each pin so the real
# window is known per pin."). The plan took GO from the .256 minus pin of the
# box, which passes a bore up to .0002 under the band, against the #3075
# record (cad/config/shop-equipment/gauges.toml gauges.pin-gauges: "the GO
# end of a reamed-hole check is a plus pin"). Ø.2560 +.0040/.0000: GO a .2560
# plus single, .2560-.2562 (6.5024 to 6.5024 + 0.00508 mm); NO-GO the .260
# minus pin of the .061-.500 box, .2598-.2600 (6.604 - 0.00508 to 6.604 mm).
# go_pin_min_mm and nogo_pin_max_mm are the band's own ends (cad bore dia;
# test_zz_pin_windows binds all four). A pin miking outside its range is not
# used.
go_pin_min_mm = 6.5024
go_pin_max_mm = 6.5075
nogo_pin_min_mm = 6.5989
nogo_pin_max_mm = 6.604
# The bar (stock.1018-square-3-4) and the blank the programs are posted for:
# 1.45-1.50 in sawn (the 1.38 height, the seat skim and the arch's waste
# above the apex, the saw's ±.025).
blank_section_in = 0.75
blank_section_mm = 19.05         # blank_section_in × 25.4: the holds' and cam.py's section.
blank_length_min_in = 1.45
blank_length_max_in = 1.50
blank_length_min_mm = 36.83
blank_length_max_mm = 38.1
kerf_in = 0.125
# stock_fit (prechips drilled_block): the blank along the model axes, X the
# width, Y the height (the bar's length, the shortest blank), Z the length.
blank_x_in = 0.75
blank_y_in = 1.45
blank_z_in = 0.75
# Skims (author's choice): the seat .020 off the sawn end; W .050 off the
# bar face. E is faced to the width and the foot end to the length in equal
# levels no deeper than face_step_max_mm (.050 in). I is not cut.
seat_skim_mm = 0.508
west_skim_mm = 1.27
face_step_max_mm = 1.27
# Facing W, E and the seat (PB01-PB03): the 1/2 in carbide end mill (shop
# endmill-carbide-3fl-1-2) on the measured face setting
# em-half-carbide-1018-3439-face, valid to 1.27 mm deep and 6.4 mm wide at
# 2420-2490 rpm in the cut (dechatter session of 2026-11-23, #3439;
# cad/config/shop-equipment/measured-cuts.toml): equal passes no wider
# than face_stepover_max_mm, its width limit. Each face cut declares its
# true stepover, the most any of its passes engages, the first and the last
# included (cam.py computes both and the post checks every pass): lying
# across the 3/4 section 4 passes of lying_stepover_mm (3 would need 6.52,
# over the limit), upright across the .64 width 3 of seat_stepover_mm (2
# would need 8.38). Every measured pass was conventional and the faces
# zigzag, so every other pass climbs, not measured. E comes down to the
# width in equal levels of width_level_mm, the fewest no deeper than
# face_step_max_mm.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.4
lying_stepover_mm = 4.8875
seat_stepover_mm = 5.5853
width_level_mm = 0.762
# PB05 (the foot end, the step and its wall pass: one operation, on the
# chart setting endmill-carbide-3fl-1-2-1018-cf, whose wall pass is deeper
# than any measured cut): passes no wider than .200 in, under half the
# cutter (the 6G chip-load factor 1.0 holds to 50 % engagement).
step_stepover_max_mm = 5.08
# The step (PB05): equal levels from the faced foot end down to the outboard
# face (8 × 1.2065), each a zigzag of X passes across the width (the facing
# stations, the last moved onto E's line) from beside the far end to the foot
# top's station (the cutter's edge on the foot top) and back; the stepovers
# at that end sweep the foot top from beyond W to E, and the scallops they
# leave between alternate pairs (at most wall_finish_woc_mm, from the 4.189
# stations) come off in one full-depth pass along the foot top at the end,
# from W to E (climb). cam.py computes and checks both, and simulates what
# that pass meets.
wall_finish_woc_mm = 0.355
step_level_mm = 1.2065
# The arch (PB04): profiled round the R.32 with the end mill's side, climb
# (G2, the PM-30MV has ball screws), through the ear and arch_past_mm into
# the waste the step removes: two rough levels .020 off the radius, then
# one finish pass at full depth. The rough pass's widest cut is the
# longest blank's corner (cam.py checks it).
arch_past_mm = 1.0
arch_depth_mm = 9.128
arch_rough_level_mm = 4.564
arch_finish_stock_mm = 0.508
arch_rough_woc_mm = 4.776
# Each pass plunges beside a side, this far below the arch's tangent point.
arch_lead_mm = 1.0
# Spots with the #2 centre drill, each under its drill (no chamfer at the
# mouth): Ø.150 under the #15, Ø.180 under the D, Ø.080 on the apex under
# the #43.
hold_spot_dia_mm = 3.81
bore_spot_dia_mm = 4.572
apex_spot_dia_mm = 2.032
# Hold-down (PB03): the #15 from the seat, one plunge (L/D 1.6), its full
# diameter hold_drill_past_mm past the foot top into the waste; its point
# then stands hold_tip_height_mm above the parallels in the shortest blank.
hold_drill_past_mm = 1.0
hold_tip_height_mm = 27.852
# Bore (PB04): the D drill (.246, .010 under the reamer) one plunge (L/D
# 1.6), full diameter bore_drill_past_mm past the outboard face's plane; the
# reamer's full diameter bore_ream_past_mm past it, its tip (a chucking
# reamer's 45° bevel, under reamer_lead_mm long) no deeper than the drill's
# full diameter. Tip heights above the stacks; cam.py checks them.
bore_drill_past_mm = 2.0
bore_ream_past_mm = 1.0
reamer_lead_mm = 1.0
bore_tip_height_mm = 7.045
ream_tip_height_mm = 8.922
# The re-ream's MDI approach and retract height (Setup 5 remedy): the bar's
# top plus PB04's 1.0 mm safe plane, as the file's own ream moves
# (cam.py checks it).
ream_clear_z_mm = 20.05
# Apex (PB06): the #43 pecked .080 with full retract (L/D 3.5), its full
# diameter apex_drill_past_mm past the bore's wall; its point then stands
# apex_tip_height_mm above the parallels.
apex_peck_mm = 2.032
apex_drill_past_mm = 0.5
apex_tip_height_mm = 27.069
# Hand tap (PB07): the plug tap's 5-thread lead (5 × .025) past the bore's
# wall at the thread's major diameter, and 1.0 short of the bore's far wall:
# the tap's point to go tap_reach_min_mm–tap_reach_max_mm below the apex.
plug_tap_lead_mm = 3.175
tap_reach_min_mm = 10.104
tap_reach_max_mm = 12.103
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min, reaming 40-65; AutoDrill "Suggested
# drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001,
# 1/8 in .003 in/rev, a size between two columns taking the lower one's
# feed. Centre drill 1800 rpm × .001 = 1.8 in/min (the column clamp's). #15
# (.180): 1300 rpm (61 ft/min) × .003 = 3.9 in/min. D (.246): 1000 rpm (64
# ft/min) × .003 = 3.0 in/min. #43 (.089): 2600 rpm (61 ft/min) × .001 = 2.6
# in/min. Reamer .2560: 450 rpm (30 ft/min, under the band: the finish
# matters more) × .004 = 1.8 in/min, in and out. cam.py posts these.
spot_feed_per_min_mm = 45.72
hold_drill_feed_per_min_mm = 99.06
bore_drill_feed_per_min_mm = 76.2
ream_feed_per_min_mm = 45.72
apex_drill_feed_per_min_mm = 66.04
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): upright, a 1 in parallel against each jaw; lying, the set's 1 in
# and 1/2 in parallels stacked against each jaw (1.5 in), as the column
# clamp plans stack them.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides. Lying, the longest blank; upright in
# Setup 4 the bar's section, in Setup 7 the finished length.
vise_lying_inset_mm = -60.29
vise_upright_inset_mm = -69.81
vise_seat_inset_mm = -70.45
# Upright in Setup 4 the longest blank less the seat skim stands above the
# parallels once faced.
upright_top_max_mm = 37.592
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# The 1/2 in end mill, 3 in overall, 1.12 in (28.45 mm) out of the R8
# collet (owner, Pedro, 2026-11-24: "28.45"): the longer end of the
# stick-out the measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm).
# cam.py checks its
# collet nose clears the stock at every program's deepest cut.
half_mill_projection_mm = 28.45
# Overall lengths: jobber #15 3-1/2 in, D 4 in, #43 2-1/4 in (ASME B94.11M);
# the #2 combined drill and countersink 1-7/8 in; a 1/4 in class chucking
# reamer 6 in. Bounded by their whole length below the chuck.
drill_15_oal_mm = 88.9
drill_d_oal_mm = 101.6
centre_drill_oal_mm = 47.625
reamer_oal_mm = 152.4
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the 1 in parallels, the bracket's height and the
# collet gauge: 266.744, rounded down to .01 in; it is also the
# guide-and-tap stack's declared reach in the setup's capacity check. The
# guide is 3 1/8 in (79.375) overall, its sellers' size and the most it can
# stand below the collet face; the tap's reach in its wrench is not on
# record, so the traveler stops before the tap file unless the tap, point to
# the wrench's centre hole, is at most tap_wrench_reach_max_mm: 266.7 less
# 79.375, 187.325, rounded down to .01 in.
tap_stack_max_mm = 266.7
tap_wrench_reach_max_mm = 187.19

