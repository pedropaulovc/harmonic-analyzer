[[setups]]
machine_kind = "other"
title = "Blacken with Presto Black Steel PC9 (the drawing's black oxide)"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/blacken.svg", alt = "The finished bracket, every surface to be blackened: the faces, the arch, the bore, the hold-down hole and the apex hole." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the bracket with soap and water to take off the oil; rinse and dry it. Hold it by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "Scuff the outside faces lightly with the 220 sanding roll to fresh metal (the maker: Scotch-Brite or blasting), keeping I and the outboard face flat. Not in the bore or the holes. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface with even, light strokes, into the bore and the hold-down and apex holes; re-wet the brush and go over the edges, the holes and any light spot until the bracket is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over, no bare spot and no wiping-off coating. Fits after blackening: the GO pin still enters the bore and a 4-40 screw still runs into the apex hole by hand. Tight: stop and tell the owner; do not re-ream or re-tap."
gauge_checks = "other"
