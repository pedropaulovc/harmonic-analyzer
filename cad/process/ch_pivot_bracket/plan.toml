[[setups]]
machine_kind = "other"
title = "Saw the blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 in square bar with {{process.quantity:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end, a saw kerf between them." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/4 in square 1018 bar, the bar flat in the saw's vise. File the burr off both ends and the four long edges so each blank seats flat on the parallels. On each, mark one cold-finished long face I with marking fluid (the inboard face: it is never cut, so keep it free of dings) and the blank's number, 1 or 2, on it."
feed = "hand"
inspection = "Each blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Shorter: scrap it. Longer: saw it again. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "West side W"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The blank lying on them along the jaws, gripped on I (against the FIXED jaw) and its opposite, centred on the jaws; the face up becomes the west side W. Tap it down onto both stacks while closing the vise. Its top stands {{process.blank_section_in:.3dot}} above the stacks, the lower {{process.lying_grip_mm:in.3dot}} of it in the jaws."
datum = "Program PB01_west (cam:ch_pivot_bracket). G54: X0 the blank's LEFT end, Y0 the fixed jaw's face (I), Z0 the stacks' top; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/west.svg", alt = "The blank lying along the jaws on stacked parallels, I against the fixed jaw; the 1/2 in end mill skims the top face, which becomes the west side W." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_section_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", 17.78], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.blank_section_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = [0, "{{process.blank_length_max_mm}}"], section_mm = { y = "{{process.blank_section_mm}}", z = "{{process.blank_section_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 X0 the blank's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the blank, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack left of the blank."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2dot}} in out of the collet; the tool setter measures it). MDI G0 X-12.700 Y-6.850: the cutter left of the blank, its edge .02 off the fixed jaw, over that jaw's stack. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove PB01_west in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "First blank only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run PB01_west, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run PB01_west (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): skim the top face {{process.west_skim_mm:in.3dot}}, in passes no wider than {{process.lying_stepover_mm:in.3dot}}."
inspection = "Still clamped: the whole top face cut, no cold-finished patch left."
gauge_checks = "other"
settings = "em-half-carbide-1018-3439-face"
milling_cuts = [
  { name = "west side", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.west_skim_mm}}", radial_woc_mm = "{{process.lying_stepover_mm}}", traverse_mm = [0, "{{process.blank_length_max_mm}}"] },
