drilling = "none"
sizing = "other"
instruction = "Run PB05_step (M6 T1; set 2650): face the foot end down to Z {{cad.foot_end_length_mm:in.4dot}} across the whole part, then the step down to Z {{cad.outboard_face_thickness_mm:in.4dot}} in {{process.step_level_mm:in.3dot}} levels, each in passes along the part from beside the arch end to the foot top and back; then one full-depth pass along the foot top, from W to E (climb), takes off the {{process.wall_finish_woc_mm:in.3dot}} scallops the stepovers left on it. The step cuts the waste under the bore and the hold-down hole away: both open."
settings = "endmill-carbide-3fl-1-2-1018-cf"
milling_cuts = [
  { name = "foot end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.step_stepover_max_mm}}", traverse_mm = [0, "{{process.blank_length_max_mm}}"] },
  { name = "step", kind = "end", phase = "rough", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.step_level_mm}}", radial_woc_mm = "{{process.step_stepover_max_mm}}", traverse_mm = ["{{cad.foot_top_height_mm}}", "{{process.blank_length_max_mm}}"] },
  { name = "step wall", kind = "side", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = 9.652, radial_woc_mm = "{{process.wall_finish_woc_mm}}", traverse_mm = [0, "{{cad.east_side_width_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp. Mic the ear and the length; calipers across the foot."
inspection = "Ear {{cad.outboard_face_thickness_min_in:.4dot}}–{{cad.outboard_face_thickness_max_in:.4dot}} thick (I to the outboard face), miked at the arch and beside the foot. Length {{cad.foot_end_length_min_in:.3dot}}–{{cad.foot_end_length_max_in:.3dot}} (I to the foot end), miked. Foot {{cad.foot_top_height_min_in:.3dot}}–{{cad.foot_top_height_max_in:.3dot}} thick (the seat to the foot top), calipers across it beside the ear."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.outboard_face_thickness_band_mm}}" },
  { gauge = "micrometers", band_mm = "{{cad.foot_end_length_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.foot_top_height_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "Any of the three under its band: the part is scrap. Foot over its band: stop and tell the owner (the X of the last pass sets it; a Z drop cannot). Ear over: the drop d = the ear reading − {{cad.outboard_face_thickness_mm:in.4dot}}; d thins the length too (one Z0): if the length reading − d would fall under {{cad.foot_end_length_min_in:.3dot}}, stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Only the length over: d = the length reading − {{cad.foot_end_length_mm:in.3dot}}, but never more than the ear reading − {{cad.outboard_face_thickness_min_in:.4dot}} − .001 (the ear stays in its band). If that cap leaves the length over, stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Re-cut by d: reclamp as before; pick up X0 (the seat) and Y0 (the fixed jaw) again with the edge finder as at this setup's start (Z0 stays the stacks' top). Send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − d × 25.4). Run PB05_step again (its upper levels cut air) and check again: ear, length, foot."
feed = "hand"

