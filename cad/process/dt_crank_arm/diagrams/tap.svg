  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw: the blank O face up, the T edge on the fixed jaw (Y0), its hub end LEFT, X0 its left end, overhanging the jaws' left ends 40.64 mm (process.overhang_mm); the two 1 in parallels, 1/8 thick, against the jaws dotted under it, their left ends at the jaws' left ends. The spacer at the jaws' right ends and the jaws' far ends are off the picture. Bottom: a section along the line marked in plan, seen from the front (looking +Y, +X right): the fixed jaw and its parallel behind, the jaw tops 11.608 mm over the O face (process.jaw_top_mm); the moving jaw and its parallel in front of the cut, not drawn. The jaw and parallel run on to break lines. Setup 2, the section at Y-2.794 through the anchor hole: the #2-56 plug tap to scale across its .086 major Ø (the #2-56 thread). Its own sizes are not on record: its end square with the round cue, drawn 1.5 mm through the underside (the plan runs it until its full threads show below). The tap's length and the T-handle wrench are schematic (not on record). The Fisher tap guide from the shop record (tap-guide-fisher: 1/2 shank, 3/16 point), its spring point in the wrench's centre hole, in the 1/2 collet to a break line; the tap, the wrench and the guide in the tool colour. Spindle off. No plan view here. -->
