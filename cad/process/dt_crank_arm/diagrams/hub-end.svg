  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw: the blank O face up, the T edge on the fixed jaw (Y0), its hub end LEFT, X0 its left end, overhanging the jaws' left ends 40.64 mm (process.overhang_mm); the two 1 in parallels, 1/8 thick, against the jaws dashed under it, their left ends at the jaws' left ends. Bottom: a section along the line marked in plan, seen from the front (looking +Y, +X right): the fixed jaw and its parallel behind, the jaw tops 11.608 mm over the O face (process.jaw_top_mm); the moving jaw and its parallel in front of the cut, not drawn. The jaw and parallel run on to break lines. The plan runs on to the jaws' right ends (158.67 mm long, process.vise_jaw_width_mm): the parallels drawn their 4 in (101.6 mm, the LMS 6745 set), 0–101.6 from the jaws' left faces, their left ends flush with them; the spacer (Setup 1, about 1.5 off the same 5/16 x 1 bar: drawn 1.5 x 1, the length not on record closer than 'about') lying on the vise bed between the jaws, 120.6–158.7 from the jaws' left faces, its right end at the jaws' right ends, as the Holding puts it (owner ruling D49, issue #3686). The section stops at a break line short of it. The section at Y-12.7, through the seat. The 3/8 end mill (shop em, Ø9.525 mm) at X 21.399 Y-12.700, the +X point of its G2 helix (radius 4.8895, process.seat_path_radius_mm) about the seat's axis at X 16.51 (process.hub_waste_mm + R.50), on its level turn at Z-8.1915 (process.through_bottom_mm), 0.254 under the underside, travelling −Y (clockwise from above). Dashed: the seat Ø.76 and the R.50 round to come. In section it ends in its 12 % arc and runs up to a break line. -->
