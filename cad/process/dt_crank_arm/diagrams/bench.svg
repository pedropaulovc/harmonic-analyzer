<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above, to scale at 5.5 px/mm: the arm O face up, the T edge at the top, the hub end LEFT: the seat Ø.76 (cad.hub_seat_dia_mm) at R.50 from the hub tip and the T edge, the hub end R.50 round about it; the anchor hole .79 along (cad.anchor_tap_station_mm) and .11 down (cad.anchor_tap_edge_offset_mm); the match mark .31 left and .31 up (cad.match_mark_x_from_seat_mm, cad.match_mark_y_from_seat_mm); the pivot 2.95 along (cad.pivot_tap_station_mm), the handle end R.50 round about it. -->
  <rect class="paper" x="0" y="0" width="760" height="330"/>
  <text class="title" x="20" y="22">Setup 4: the finished arm, O face up, T edge at the top, the hub end left (to scale, 5.5 px/mm)</text>
  <path class="part-kept" d="M129.8 90.0L542.0 90.0A69.8 69.8 0 0 1 542.0 229.7L129.8 229.7A69.8 69.8 0 0 1 129.8 90.0Z"/>
  <circle class="holes" cx="129.85" cy="159.85" r="53.09"/>
  <circle class="holes" cx="240.21" cy="105.37" r="4.89"/>
  <circle class="holes" cx="86.54" cy="116.54" r="2.1"/>
  <circle class="holes" cx="541.97" cy="159.85" r="8.52"/>
  <circle class="holes" cx="541.97" cy="159.85" r="6.22"/>
  <text class="label" x="40" y="270">seat Ø{{cad.hub_seat_dia_min_in:.2dot}}–{{cad.hub_seat_dia_max_in:.2dot}} (tagged)</text>
  <line class="leader" x1="120" y1="258" x2="129.85" y2="212.94"/>
  <circle class="leader-dot" cx="129.85" cy="212.94" r="2"/>
  <text class="label" x="40" y="40">match mark, punched (Ø.03)</text>
  <line class="leader" x1="140" y1="46" x2="86.54" y2="116.54"/>
  <circle class="leader-dot" cx="86.54" cy="116.54" r="2"/>
  <text class="label" x="260" y="40">anchor {{cad.anchor_tap_thread}}, {{cad.anchor_tap_edge_offset_min_in:.3dot}}–{{cad.anchor_tap_edge_offset_max_in:.3dot}} from the T edge</text>
  <line class="leader" x1="300" y1="46" x2="240.21" y2="103.37"/>
  <circle class="leader-dot" cx="240.21" cy="103.37" r="2"/>
  <text class="label" x="420" y="280">pivot {{cad.pivot_tap_thread}}, countersunk</text>
  <text class="label" x="420" y="296">Ø{{cad.pivot_tap_countersink_dia_max_in:.3dot}} max on the O face</text>
  <line class="leader" x1="500" y1="268" x2="541.97" y2="169.85"/>
  <circle class="leader-dot" cx="541.97" cy="169.85" r="2"/>
  <text class="label" x="390" y="84">T edge (top)</text>
</svg>
