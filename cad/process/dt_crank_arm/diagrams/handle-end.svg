  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw: the arm turned end for end, O face up, the bottom edge on the fixed jaw (Y0), the T edge on the moving jaw, the handle end LEFT; X0 the hub end's tip, the arm at −X; the jaws' left ends 77.47 mm from the tip (process.handle_jaw_end_mm), the seat and the anchor hole in the jaws; the two 1 in parallels dashed under it, their left ends at the jaws' left ends. Bottom: a section through the pivot (Y-12.7) seen from the front (looking +Y, +X right): the fixed jaw and its parallel behind, the jaw tops 11.608 mm over the O face (process.jaw_top_mm); the moving jaw and its parallel in front, not drawn. The jaw and the parallel run on to break lines. The plan runs on to the jaws' right ends (158.67 mm long, process.vise_jaw_width_mm): the parallels drawn their 4 in (101.6 mm, the LMS 6745 set), 0–101.6 from the jaws' left faces, their left ends flush with them; the spacer (Setup 1, about 1.5 off the same 5/16 x 1 bar: drawn 1.5 x 1, the length not on record closer than 'about') lying on the vise bed between the jaws, 120.6–158.7 from the jaws' left faces, its right end at the jaws' right ends, as the Holding puts it (owner ruling D49, issue #3686). The section stops at a break line short of it. X0 drawn at x 650 here (680 in the op pictures) to fit the jaws' right ends. The 3/8 end mill (shop em, Ø9.525 mm) on the G3 round about the pivot's axis (X -87.63, cad.pivot_tap_station_mm + R.50 from X0), path radius 17.4625 (process.round_path_radius_mm), drawn at the path's −X point, X -105.09 Y-12.700, travelling −Y (anticlockwise from above), on its last of eight levels at Z-8.1915 (process.through_bottom_mm). Its path's nearest point to the jaws, X -82.87, is 4.6 mm left of their left ends. In section it ends in its 12 % arc and runs up to a break line. Dashed: the round's line. Hatched in plan: the waste end the round cuts away (from the sawn end, process.hub_waste_mm in from the blank's length, to the round); in section that waste lies under the cutter. -->
