  <!-- Hand picture, to scale at 5 px/mm. Top: plan from above, +X right, +Y up toward the fixed jaw: the arm turned end for end, O face up, the bottom edge on the fixed jaw (Y0), the T edge on the moving jaw, the handle end LEFT; X0 the hub end's tip, the arm at −X; the jaws' left ends 77.47 mm from the tip (process.handle_jaw_end_mm), the seat and the anchor hole in the jaws; the two 1 in parallels dashed under it, their left ends at the jaws' left ends. The spacer at the jaws' right ends is off the picture. Bottom: a section through the pivot (Y-12.7) seen from the front (looking +Y, +X right): the fixed jaw and its parallel behind, the jaw tops 11.608 mm over the O face (process.jaw_top_mm); the moving jaw and its parallel in front, not drawn. The jaw and the parallel run on to break lines. Setup 3, the section at Y-12.7 through the pivot: the #4-40 plug tap to scale across its .112 major Ø (the #4-40 thread). Its own sizes are not on record: its end square with the round cue, drawn 1.5 mm through the underside (the plan runs it until its full threads show below). The tap's length and the T-handle wrench are schematic (not on record). The Fisher tap guide from the shop record (tap-guide-fisher: 1/2 shank, 3/16 point), its spring point in the wrench's centre hole, in the 1/2 collet to a break line; the tap, the wrench and the guide in the tool colour. Spindle off. No plan view here. -->
