# Crank arm MHA-DT-06 (qty 1), routed for the CNC mill (owner ruling
# 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). The arm is the
# bought 5/16 x 1 in 1018 CF flat as supplied (drawing note 1: width and
# thickness as supplied), sawn to a blank and milled at its two ends.
#
# Route: Setup 1 saws the blank (4.20-4.30 in) and a 1.5 in spacer off the 12
# in bar. Setup 2, the outboard face up on 1 in parallels, the top edge on the
# fixed jaw, the hub end overhanging the jaws' left ends, the spacer at their
# right ends: CA01 bores the hub seat by helical interpolation with the 3/8 in
# end mill, rounds the boss end R.50 in levels, spots the anchor hole and the
# match mark and drills the anchor #50 through; CA02 brings the tap guide over
# the anchor hole and the #2-56 is tapped by hand. Setup 3, turned end for
# end, outboard face still up, the bottom edge on the fixed jaw, the handle
# end overhanging: CA03 rounds the handle end R.50, spots, drills #43 through
# and countersinks the pivot hole; CA04 the tap guide over it for the #4-40.
# Setup 4, bench: punch the match mark in its spot, deburr, inspect, oil.
#
# Not made here: the seam ((Ø.156) REAM .17, drawing note 3) is made at
# assembly across the arm and MHA-DT-31 (the feature export's made_at); its
# #25 drill and .1562 reamer (the placeholder plan's tools.drill-25 and
# tools.reamer-1562) belong to the assembly's process. The hub seat is the
# arm's real limits, .75-.77; MHA-DT-31's seat is turned to suit it for the
# .0004-.0012 press (dt_crank_hub_geometry.SEAT_PRESS_INTERFERENCE), so this
# traveler tags the arm with its miked seat.
#
# Workholding: the vise only (no fixture): every cut is at an end, in the
# overhang past the jaws' left ends, where the round's cutter and the drills
# reach through into air. The jaws grip the bar's full thickness on its two
# as-supplied edges; a same-bar spacer at the jaws' other end keeps them
# square (TC 9-524 p. 8-16, the README's "balanced" hold).
#
# FLAGGED: to buy: a .118 minus Class ZZ pin gauge (gauges.pin-gauges,
# to_order) for the countersink's Ø.122 MAX. The seam's #25 drill and .1562
# reamer stay with the assembly.
#
# NC (cam:dt_crank_arm, cad/process/dt_crank_arm/cam.py): CA01_hub_end,
# CA02_anchor_tap, CA03_handle_end, CA04_pivot_tap. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the places in the tools list among the mill's tools: T1
# 3/8 in end mill, T2 #1 centre drill, T3 #50 drill, T4 #43 drill, T5 chamfer
# mill, T6 tap guide.
title = "Crank arm"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 5/16 x 1 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.0f}} in flat bar, the 12 in length: one {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank and a 1.5 in spacer."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Width and thickness are the bar's, as supplied (drawing note 1): no face or edge is machined. Mill speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. The seam (Ø.156 ream .17 deep, note 3) is made at assembly, not here. Finish: {{cad.finish}}."
shop = "../shop"
stock_refs = ["1018-flat-5-16x1-12in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_crank_arm/features.toml"
adapter = "flat_bar"
part = "dt-crank-arm"

[parameters]
quantity = 1
# The adapter's axes: the arm's length along model X, its thickness (the
# inboard and outboard faces) along model Z.
blank_length_axis = 0
blank_thickness_axis = 2
# The blank: the 3.95 in arm (hub tip to handle tip) with .15 at the hub end
# (hub_waste_mm) and .10-.20 at the handle end, sawn 4.20-4.30 from the 12 in
# bar (4.30 + 1.5 spacer + 2 × .125 kerf = 6.05).
blank_length_in = 4.2
blank_length_max_in = 4.3
blank_length_min_mm = 106.68
blank_length_max_mm = 109.22
blank_length_mm = 107.95
blank_width_in = 1.0
blank_thickness_in = 0.3125
# ASTM A108 cold-drawn flat, 1 in wide: thickness +.000/-.004.
blank_thickness_max_mm = 7.9375
blank_thickness_min_mm = 7.8359
# The hub end's waste: the hub tip .15 in from the blank's left end, so the
# seat's axis is R.50 + .15 from X0 (cam.py checks the round's swath clears
# the waste's corners).
hub_waste_mm = 3.81
# The handle end's waste after CA01, from the longest blank (cam.py).
handle_waste_max_mm = 5.08
# Holding (shop workholding.vise-pm-6): two 1 in parallels
# (fixtures.parallels-lms-6745) on the vise bed, one against each jaw, their
# left ends at or right of the jaws' left ends; the bar on them outboard face
# up, gripped on its edges. The jaws' tops stand jaw_top_mm over the outboard
# face (Z0): jaw height less the parallels and the thickest bar (cam.py).
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_height_mm = 25.4
jaw_top_mm = 11.6078
# Setup 2: the blank's left end 1.55-1.65 in past the jaws' left ends
# (overhang_min_mm-overhang_max_mm, set with the steel rule). CA01's farthest
# reach right (the #50's edge at the anchor) is ca01_reach_mm: cam.py proves
# it at least 1.5 mm short of the jaws and parallels at the least overhang.
overhang_mm = 40.64
overhang_min_mm = 39.37
overhang_max_mm = 41.91
ca01_reach_mm = 37.465
# Setup 3: the jaws' left ends 3.00-3.10 in from the hub tip
# (handle_jaw_end_min_mm-handle_jaw_end_max_mm); the handle round's nearest
# reach to the hub tip is ca03_reach_mm (cam.py: 1.5 mm clear of the jaws at
# 3.10). After CA01 the bar is handle_along_mm long (nominal blank less the
# hub waste) and overhangs the jaws' left ends by handle_overhang_mm.
handle_jaw_end_mm = 77.47
handle_jaw_end_min_mm = 76.2
handle_jaw_end_max_mm = 78.74
ca03_reach_mm = 82.8675
handle_along_mm = 104.14
handle_overhang_mm = 26.67
# Through cuts: the thickest bar plus .010 below its underside, into air.
through_past_mm = 0.254
through_bottom_mm = -8.1915
# The seat: the 3/8 in end mill's centre on a helix of seat_path_radius_mm
# ((.76 - .375)/2) about the seat's axis, seat_helix_pitch_mm per turn, then
# one level turn at the bottom.
seat_path_radius_mm = 4.8895
seat_helix_pitch_mm = 0.8
# The rounds: the cutter's centre on R.50 + its radius, conventional, in
# round_levels levels of round_level_mm to through_bottom_mm.
round_path_radius_mm = 17.4625
round_levels = 8
round_level_mm = 1.0239
# Shop settings.endmill-carbide-3fl-3-8-1018-cf: 2800 rpm, .0025 in/tooth, 3
# flutes: 21.0 in/min (cam.py recomputes both from the setting).
em_rpm = 2800
em_feed_per_min_mm = 533.4
# 3/8 in end mill, 4 in overall: at least 1.00 in out of its collet, so the
# collet's nose stays over the jaw tops at the through depth.
em_projection_min_mm = 25.4
# Spots with the #1 centre drill: the anchor and the match mark Ø.030 (on
# the pilot's point: under the #50, and the punched mark's Ø.03); the pivot
# Ø.080 (on the 60° countersink, under the #43).
hub_spot_dia_mm = 0.762
pivot_spot_dia_mm = 2.032
spot_rpm = 2800
spot_feed_per_min_mm = 71.12
# Drills: #50 and #43 at 2800 rpm, 2.8 in/min (as dt_pinion_cam's #50 and
# mg_magnifying_clamp's #43), pecked; their full diameter drill_past_mm past
# the underside (tip = thickest bar + past + the 118° point; cam.py).
drill_rpm = 2800
drill_feed_per_min_mm = 71.12
peck_50_mm = 1.016
peck_43_mm = 1.27
drill_past_mm = 0.5
anchor_drill_tip_mm = -8.9717
pivot_drill_tip_mm = -9.1166
# The deepest point under the bar's underside (the #43's tip): the envelope.
pivot_tip_below_underside_mm = -1.1791
# Drills stand at least 1.00 in out of the chuck: the chuck's nose clears
# the jaw tops at the drills' tips.
drill_projection_min_mm = 25.4
# The pivot's countersink: Ø.110 at the face (the drawing's .122 MAX less
# sink_margin_mm), the 90° chamfer mill's point on the hole's axis
# sink_tip_mm below Z0 (cam.py), plunged at .0005 in/rev (1.4 in/min).
sink_dia_mm = 2.794
sink_margin_mm = 0.254
sink_tip_mm = -1.397
sink_rpm = 2800
sink_feed_per_min_mm = 35.56
# The chamfer mill (McMaster 3073A46, 2 in overall) at least .75 out of its
# collet: its nose clears the jaw tops at the countersink's depth (cam.py).
sink_projection_min_mm = 19.05
# Holders: HA holders.r8-collets-lms-4860.gauge_len_mm; archive
# holders.drill-chuck-r8.gauge_len_mm. Longest tool: the #43 jobber in the
# chuck, 1-3/4 in overall (ASME B94.11M).
r8_collet_gauge_mm = 6.3
drill_chuck_gauge_mm = 95.0
drill_43_oal_mm = 44.45
# Tap stack: the PM-30MV's 17 in spindle-to-table less the shop's tool-change
# clearance, the vise bed, the parallels, the bar and the collet's gauge,
# rounded down to .01 in (cam.py); the tap in its T-handle wrench reaches at
# most tap_wrench_reach_max_mm: the stack less the tap guide's 3 1/8 in,
# rounded down to .01 in.
tap_stack_max_mm = 293.624
tap_wrench_reach_max_mm = 214.122

