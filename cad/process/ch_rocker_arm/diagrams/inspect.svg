<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="12">
  <!-- Setup 4. Plan (left): 1 in = 55 px; hub section (right): 1 in = 200 px. -->
  <rect class="paper" x="0" y="0" width="760" height="330"/>
  <text class="title" x="20" y="18">Setup 4: deburr; the hub length and the bore every arm; heights and the #47 first arm</text>
  <path class="part-kept" d="M30 83.0 A1731.5 1731.5 0 0 0 450 104.6 L450 140 A1766.2 1766.2 0 0 1 30 118.2 Z"/>
  <circle class="part-kept" cx="140" cy="130" r="11"/>
  <circle class="holes" cx="140" cy="130" r="7.1"/>
  <circle class="holes" cx="428.1" cy="111.7" r="2.2"/>
  <line class="dims" x1="140" y1="190" x2="428.1" y2="190"/>
  <line class="leader" x1="140" y1="141" x2="140" y2="196"/>
  <line class="leader" x1="428.1" y1="114" x2="428.1" y2="196"/>
  <text class="label" x="150" y="210">#47 5.249 REF from the bore (5.239/.333 basic;</text>
  <text class="label" x="150" y="226">first arm, calipers over offcut and #47 shank)</text>
  <text class="label" x="30" y="60">F bore: the 1/4 in ground bar offcut slides through, every arm</text>
  <!-- Hub section, 1 in = 200 px: Ø.40 hub, Ø.257 bore, length .278, the
       .098 strap at the hub's middle; end G at the bottom. -->
  <rect class="part-kept" x="560" y="150" width="14.3" height="55.6"/>
  <rect class="part-kept" x="625.7" y="150" width="14.3" height="55.6"/>
  <rect class="part-kept" x="480" y="168" width="80" height="19.6"/>
  <rect class="part-kept" x="640" y="168" width="100" height="19.6"/>
  <rect class="holes" x="574.3" y="150" width="51.4" height="55.6"/>
  <g class="dims">
    <line x1="560" y1="150" x2="462" y2="150"/>
    <line x1="560" y1="205.6" x2="462" y2="205.6"/>
    <line x1="470" y1="150" x2="470" y2="205.6" marker-start="url(#prechips-arr)" marker-end="url(#prechips-arr)"/>
    <line x1="640" y1="205.6" x2="756" y2="205.6"/>
    <line x1="740" y1="177.8" x2="756" y2="177.8"/>
    <line x1="750" y1="177.8" x2="750" y2="205.6" marker-start="url(#prechips-arr)" marker-end="url(#prechips-arr)"/>
  </g>
  <text class="label" x="660" y="222">end G</text>
  <line class="leader" x1="440" y1="246" x2="468" y2="190"/>
  <text class="label" x="300" y="258">hub length .276–.280,</text>
  <text class="label" x="300" y="274">micrometer, every arm</text>
  <line class="leader" x1="700" y1="246" x2="748" y2="195"/>
  <text class="label" x="540" y="258">strap mid-plane from end G</text>
  <text class="label" x="540" y="274">.137–.141, first arm</text>
  <text class="label" x="20" y="315">Edges the cuts left: R.010 or .010 chamfer max; both bore mouths, both #47 mouths, the hub rims.</text>
</svg>
