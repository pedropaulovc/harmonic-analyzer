<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif" font-size="12">
  <!-- Setup 3. Plan (top): 1 in = 55 px, X0 Y0 the hub's axis at (380, 130),
       +Y up the page (the back, the strap's concave edge). Section (bottom):
       through the hub's axis from the front, 1 in = 200 px, Z0 the strap's
       top at y 330. -->
  <rect class="paper" x="0" y="0" width="760" height="470"/>
  <text class="title" x="20" y="18">Setup 3: strap face 2 up; face the second end, F through the hub, #47 through the strap</text>
  <text class="label" x="20" y="38">Plan</text>
  <rect class="fixture-support" x="201.3" y="102.5" width="164.95" height="55"/>
  <rect class="fixture-support" x="393.75" y="102.5" width="164.95" height="55"/>
  <rect class="fixture-support" x="675.6" y="73" width="74.4" height="55"/>
  <path class="part-kept" d="M63.9 83.0 A1731.5 1731.5 0 0 0 696.1 83.0 L696.1 118.2 A1766.2 1766.2 0 0 1 63.9 118.2 Z"/>
  <circle class="part-kept" cx="380" cy="130" r="11"/>
  <circle class="holes" cx="380" cy="130" r="7.1"/>
  <circle class="holes" cx="668.1" cy="111.7" r="2.2"/>
  <rect class="clamp" x="231.7" y="44" width="21.6" height="74"/>
  <rect class="clamp" x="506.7" y="44" width="21.6" height="74"/>
  <!-- Tram: the edge finder on the concave edge at X -3.94 and +3.94. -->
  <circle class="cutter" cx="163.3" cy="93" r="5.5"/>
  <circle class="cutter" cx="596.7" cy="93" r="5.5"/>
  <line class="leader" x1="163.3" y1="87.5" x2="120" y2="60"/>
  <text class="label" x="20" y="56">edge finder, X −100.08 (−3.94 in)</text>
  <line class="leader" x1="596.7" y1="87.5" x2="620" y2="40"/>
  <text class="label" x="470" y="36">X +100.08: Y within 0.05 of X −100.08's</text>
  <line class="leader" x1="668.1" y1="111.7" x2="640" y2="170"/>
  <circle class="leader-dot" cx="668.1" cy="111.7" r="1.5"/>
  <text class="label" x="520" y="184">#47 at X 5.2389, Y .3329</text>
  <line class="leader" x1="714" y1="138" x2="712" y2="128"/>
  <text class="label" x="690" y="150">tip block</text>
  <line class="leader" x1="380" y1="130" x2="340" y2="180"/>
  <text class="label" x="250" y="194">F through the hub at X0 Y0</text>
  <text class="label" x="20" y="214">The #47 lies between the right gap block and the tip block, .135 from the tip block's end.</text>
  <text class="label" x="20" y="240">Section through the hub</text>
  <rect class="fixture-support" x="150" y="349.6" width="180" height="70"/>
  <rect class="fixture-support" x="430" y="349.6" width="180" height="70"/>
  <text class="label" x="160" y="440">gap blocks, 2 in up (broken)</text>
  <rect class="part-kept" x="120" y="330" width="220" height="19.6"/>
  <rect class="part-kept" x="420" y="330" width="220" height="19.6"/>
  <!-- Hub: the lower end (G) faced in Setup 2, the top end now. -->
  <rect class="part-kept" x="340" y="312" width="80" height="55.6"/>
  <rect class="part-removed" x="340" y="302.9" width="80" height="9.1"/>
  <line class="hidden" x1="355.4" y1="302.9" x2="355.4" y2="367.6"/>
  <line class="hidden" x1="404.6" y1="302.9" x2="404.6" y2="367.6"/>
  <!-- F drill: through, its point into the gap. -->
  <polygon class="cutter" points="354.3,236 405.7,236 405.7,382 380,397 354.3,382"/>
  <text class="label" x="200" y="270">F drill (after the facing)</text>
  <line class="leader" x1="300" y1="266" x2="354" y2="280"/>
  <line class="dims" x1="455" y1="312" x2="455" y2="330"/>
  <line class="leader" x1="420" y1="312" x2="470" y2="312"/>
  <text class="label" x="475" y="316">.090 over the strap (Z0 its top)</text>
  <line class="dims" x1="455" y1="349.6" x2="455" y2="367.6"/>
  <line class="leader" x1="420" y1="367.6" x2="616" y2="367.6"/>
  <text class="label" x="620" y="364">end G, faced</text>
  <text class="label" x="620" y="379">in Setup 2</text>
</svg>
