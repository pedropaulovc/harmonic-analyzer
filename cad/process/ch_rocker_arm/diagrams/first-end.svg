<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="sans-serif" font-size="12">
  <!-- Setup 2. Plan (top): 1 in = 55 px, X0 Y0 the hub's axis at (380, 130),
       +Y up the page (the back). Section (bottom): through the hub's axis,
       seen from the front, 1 in = 200 px, Z0 the strap's top at y 330.
       RA01's first pass, drawn in both views: the 1/2 in end mill to scale
       (face_cutter_dia_mm 12.7: 27.5 px in plan, 100 px in section) at
       Y +5.080 (face_pass_y_mm), Z 2.286 (the end's height over the strap),
       fed -X from X +14.000 to -14.000; drawn at X 0, over the hub. Its
       square end drawn as the near half of the end face, 12 % deep; drawn
       short to a break line, 1.12 in out of the collet
       (half_mill_projection_mm 28.45; the collet is not drawn, its size is
       not on record). The second pass (Y -5.080, +X) is not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="470"/>
  <text class="title" x="20" y="18">Setup 2: face the hub's top end (datum G's) to {{cad.hub_end_height_in:.3dot}} over the strap (plan 1 in = 55 px; section 1 in = 200 px)</text>
  <text class="label" x="20" y="38">Plan</text>
  <!-- Gap blocks (2 in up, 3 in along X, inner ends .500 apart) and the tip block. -->
  <rect class="fixture-support" x="201.3" y="102.5" width="164.95" height="55"/>
  <rect class="fixture-support" x="393.75" y="102.5" width="164.95" height="55"/>
  <rect class="fixture-support" x="675.6" y="73" width="74.4" height="55"/>
  <!-- Strap MHA-CH-13 (arc, tips up toward +Y), hub, bore. -->
  <path class="part-kept" d="M63.9 83.0 A1731.5 1731.5 0 0 0 696.1 83.0 L696.1 118.2 A1766.2 1766.2 0 0 1 63.9 118.2 Z"/>
  <circle class="part-kept" cx="380" cy="130" r="11"/>
  <circle class="hidden" cx="380" cy="130" r="6.8"/>
  <!-- Step clamps from the back, toes on the strap over each gap block. -->
  <rect class="clamp" x="231.7" y="44" width="21.6" height="74"/>
  <rect class="clamp" x="506.7" y="44" width="21.6" height="74"/>
  <text class="label" x="150" y="62">step clamp</text>
  <text class="label" x="534" y="62">step clamp, X +2.50</text>
  <text class="label" x="205" y="172">gap block</text>
  <text class="label" x="470" y="172">gap block</text>
  <text class="label" x="632" y="148">tip block</text>
  <!-- The two passes along X at Y +r and -r. -->
  <circle class="cutter" cx="380" cy="119" r="13.75"/>
  <line class="arrow" x1="364" y1="119" x2="336" y2="119"/>
  <line class="leader" x1="390" y1="108" x2="400" y2="54"/>
  <text class="label" x="262" y="36">cutter path: Y +{{process.face_pass_y_mm:in.3dot}} along −X, then</text>
  <text class="label" x="262" y="50">Y −{{process.face_pass_y_mm:in.3dot}} along +X (conventional)</text>
  <text class="label" x="20" y="200">X0 Y0: edge finder on the hub's top end, both sides each way. The arm may lie either end to the right.</text>
  <text class="label" x="20" y="232">Section through the hub</text>
  <!-- Gap blocks (broken: 2 in tall) under the strap. -->
  <rect class="fixture-support" x="150" y="349.6" width="180" height="70"/>
  <rect class="fixture-support" x="430" y="349.6" width="180" height="70"/>
  <text class="label" x="160" y="440">gap blocks, 2 in up (broken), .500 apart</text>
  <!-- Strap, .098 thick; hub Ø.40 through it, its lower end in the gap. -->
  <rect class="part-kept" x="120" y="330" width="220" height="19.6"/>
  <rect class="part-kept" x="420" y="330" width="220" height="19.6"/>
  <rect class="part-kept" x="340" y="312" width="80" height="64.7"/>
  <rect class="part-removed" x="340" y="302.9" width="80" height="9.1"/>
  <line class="hidden" x1="355.4" y1="302.9" x2="355.4" y2="376.7"/>
  <line class="hidden" x1="404.6" y1="302.9" x2="404.6" y2="376.7"/>
  <!-- The 1/2 in end mill on RA01's first pass, at the end's height. -->
  <path class="cutter" d="M430 300L430 236L425.83 239L421.67 236L417.5 239L413.33 236L409.17 239L405 236L400.83 239L396.67 236L392.5 239L388.33 236L384.17 239L380 236L375.83 239L371.67 236L367.5 239L363.33 236L359.17 239L355 236L350.83 239L346.67 236L342.5 239L338.33 236L334.17 239L330 236L330 300A50 12 0 0 0 430 300Z"/>
  <text class="label" x="440" y="256">1/2 in end mill, to scale, {{process.half_mill_projection_mm:in.2f}} out</text>
  <text class="label" x="440" y="272">of the collet (drawn short), on the Y +{{process.face_pass_y_mm:in.3dot}} pass</text>
  <line class="arrow" x1="324" y1="296" x2="296" y2="296"/>
  <!-- .090 from the strap's top (Z0) to the faced end. -->
  <line class="dims" x1="310" y1="312" x2="310" y2="330"/>
  <line class="leader" x1="300" y1="312" x2="340" y2="312"/>
  <text class="label" x="120" y="292">removed: {{cad.face_depth_min_in:.4dot}}–{{cad.face_depth_max_in:.4dot}}</text>
  <text class="label" x="120" y="308">{{cad.hub_end_height_in:.3dot}} over the strap (Z0 its top)</text>
  <text class="label" x="20" y="325">strap MHA-CH-13</text>
  <text class="label" x="420" y="458">hub MHA-CH-12 (Ø{{process.hub_pilot_bore_in:.3dot}} pilot bore hidden)</text>
  <line class="leader" x1="418" y1="452" x2="390" y2="378"/>
</svg>
