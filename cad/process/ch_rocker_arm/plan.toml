note = "Off the rest plate: the A|B position check is done on the angle-plate fixture below (one clamping held through both views), then the part goes back to the rest plate."
# Option 4: the rod-pin hole IS datum C, so its own Ø0.20 position refers only to A|B.
# Rotation about A is free, so the zone is an annulus about A: only the A-to-C centre
# distance is toleranced. Its nominal is the drawing's BASIC 133.07 / 8.46 PIN AXIS pair
# from A combined: features.toml rod_hole.at - pivot_bore.at = (133.0674, 8.4561), D =
# hypot = 133.336. The two views read X and Y in any clocking; D does not depend on it.
# F1 gauge-resolution source: gauges.height-gauge.resolution_in = 0.001 in x 25.4 = 0.0254 mm; never substitute the former uncited 0.018 mm.
# Schema-limited placeholder (realistic, remeasure: #1413): status="measured", date="2026-10-13", instrument="certified gauge blocks and height gauge"; scale-error estimate 0.0254 mm over the 133.336 mm lever, one displayed count (no calibration nominal; conservative rounding up from the former 0.025 mm estimate).
# Schema-limited placeholder (realistic, remeasure: #1413): status="measured", date="2026-10-13", instrument="0.001 mm DTI, gauge pins loaded up/down in both bores"; combined pin-clearance sag estimate 0.013 mm, unchanged from the authored inspection method (no certified nominal; compare the two pin-centre readings).
# Derived guardband: 2*sqrt(2*0.0254^2 + 0.0254^2 + 2*0.013^2 + (0.0254*133.336/100)^2) = 0.116968... mm; round UP to 0.12 mm, so 0.20 - 0.12 = 0.08 mm acceptance. This trial estimate is not calibrated inspection uncertainty.
[setups.ops.inspection_methods]
position_dia = [
  "Inspection fixture: the 4 x 5 x 3-1/2 in angle plate (fixtures.angle-plate) with its bolted foot-end ledge taken off (two #10-24 SHCS), and the pivot bracket's shop-made two-stud bridge clamp (not yet in the shop inventory; it returns with the bracket's migration) on its 3/8-16 studs through the upright's two letter-X stud holes. Datum C is the rod-pin hole itself, so the check reads its centre distance from A; the +X tip land rests on the granite only to steady the arm and is not a datum.",
  "Clean the part, the plate, the bridge and the pin gauges and leave them on the granite surface plate (gauges.granite-surface-plate) for 30 min to reach the plate's temperature.",
  "Push the largest freely passing pin gauge (gauges.pin-gauges) through bore A (datum A), and the largest freely passing one into the rod hole (datum C) from the side away from datum B; copy the sizes marked on the pins: {pin A Ø} {rod pin Ø}.",
  "Seating, view 1: the angle plate stands on its base on the granite. Hold strap datum B (the +Z strap face, the hub's raised side) flat on the upright's outer face, rod end down, the +X tip land resting on the granite in front of the upright, the arm centred between the two studs. Lay the bridge beam across the strap's other face and run both nuts down finger-tight, a little at a time each. Keep this clamping unchanged through step 11.",
  "Reading a pin: the DTI (gauges.dti) on the height gauge's scriber; sweep it across the pin crown within 2 mm of the bore face, raise or lower the slider until the sweep's peak reads zero, and copy the height-gauge reading; a higher contact reads higher. Pin-centre height = reading - pin Ø / 2.",
  "View 1: read hub pin {H1} and rod pin {R1} (hub pin about 132.4 above the rod pin).",
  "Lean check, view 1: read the hub pin crown at its mouth {mouth 1} and 10 mm farther out {out 1}. If they differ by more than 0.025, or B will not lie flat without leaning the pin, the readings are not valid: reseat from step 4; if it persists, stop and report.",
  "View 2: without touching the clamp, tip the whole plate a quarter turn clockwise as you face the part, onto the plate's end (the arm now points right, the rod pin about 15.8 below the hub pin). Read hub pin {H2} and rod pin {R2}.",
  "Plate lean, view 2: the plate's base bottom is now the upright face toward the gauge, on the left. With the DTI on the height gauge against it, read it at 10 mm {base 10} and at 110 mm {base 110} above the granite, moving only the slider; a face standing farther out toward the gauge reads higher. s = base 110 - base 10 = {s} (per 100 mm).",
  "Lean check, view 2, as in step 7: {mouth 2} {out 2}.",
  "Hold check: tip the plate back onto its base (view 1) without touching the clamp and read again: {H1c} {R1c}. If H1c - R1c differs from H1 - R1 by more than 0.013, the part moved in the clamp: restart at step 4.",
  "Calculate: X = (H1 - pin A Ø / 2) - (R1 - rod pin Ø / 2) = {X}; Y = (H2 - pin A Ø / 2) - (R2 - rod pin Ø / 2) = {Y}.",
  "Calculate: Y corrected = Y - s x X / 100 = {Y corrected}. View 1 reads X square to the plate's base; in view 2 the base leans s per 100 from vertical, which adds s x X / 100 to Y over the X lever, so the plate's end needs to be stable but not square.",
  "Calculate: D = √(X² + Y corrected²) = {D}; position Ø = 2 x |D - 133.336| = {position Ø}. 133.336 is the drawing's BASIC 133.07 and 8.46 from A combined: datum C clocks the arm, so only the hole's distance from A is held, whatever the arm's angle on the plate.",
  "Decide: accept if position Ø is no more than 0.08; reject if it is over 0.20; between 0.08 and 0.20 the reading is indeterminate with this height gauge, so re-check it with gauge blocks or on a CMM. AUTHOR'S CHOICE conservative guardband 0.12 mm, rounded up from 2 x sqrt(2 x 0.0254^2 + 0.0254^2 + 2 x 0.013^2 + (0.0254 x 133.336 / 100)^2) mm. The selected gauges.height-gauge resolution is 0.001 in = 0.0254 mm, used on each coordinate difference and on the base-lean difference over 100 mm; the scale-error estimate is 0.0254 mm over the 133.336 mm lever; combined pin-clearance sag is 0.013 mm per coordinate. Scale error and sag are #1413 test-only measured placeholders, not a calibration certificate; remeasure them before shop acceptance.",
]
