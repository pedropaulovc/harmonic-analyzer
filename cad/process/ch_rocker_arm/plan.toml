# HELD REFERENCE ROUTE: not qualified manufacturing instructions.
# Not enrolled in _process_plans.TRAVELER_STEMS; ships no traveler.
# Built-up rocker route: this replaces the retired one-piece 5/16 blank,
# S3 chain-drill relief, skin removal and outline-template filing sequence.
# Source geometry/proof: cad/scripts/ch_rocker_arm_tl_oblique_blank_spec.py.
# The notes below describe the intended operations, not qualified collision
# envelopes, cutting data, tooling acceptance or observed shop results.
# Requalify tooling, workholding and installed-machine clearance before use.
# Current work status: https://github.com/users/pedropaulovc/projects/1
part = "ch-rocker-arm"
features = "../../out/features/ch_rocker_arm/features.toml"
construction = "built_up"
quantity = 1
quantity_cite = "AUTHOR'S CHOICE: one built-up arm; strap MHA-CH-13 plus hub MHA-CH-12"

[drawing]
number = "MHA-CH-06"
revision = "v48"
cite = ["cad/config/parts/ch-rocker-arm.yaml", "cad/config/parts/ch-rocker-strap.yaml", "cad/config/parts/ch-rocker-hub.yaml"]

[stock]
form = "flat_bar"
form_verify = false
material = "1018 cold-finish carbon steel"
material_verify = false
material_cite = ["cad/process/shop/inventory.toml: OnlineMetals 4807, order 1021751700"]
on_hand = false
prerequisite = "Receive the ordered OnlineMetals 4807 1018 CF 1/8 x 1-1/2 in flat (4 x 72 in, ordered 2026-11-03); measure actual section before layout. Saw one 350 mm strap blank square at both ends, not the retired 336 mm one-piece blank; it is used at the as-bought 1-1/2 in width and has NO pre-made hub hole. Keep the remaining bar. Make hub MHA-CH-12 separately to its drawing; this stock row covers the strap only."
section_mm = [38.1, 3.175]
length_mm = 350.0
# Carrier XY: C=(0,-H1); raw width is centred on the finished strap's
# Y envelope, NOT on HUB. Catalogue section and nominal placement, not readings;
# the jig's stop pins register the lower raw edge at blank_spec.RAW_Y_MIN.
origin_mm = [-175.0, 19.57913354012005, 0.0]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
as_is_faces = []
cite = ["ch_rocker_arm_tl_oblique_trammel_spec.BLANK_LENGTH/BLANK_WIDTH/STRAP_SPAN_Y/BLANK_EDGE_WASTE", "ch_rocker_arm_tl_oblique_blank_spec.BLANK_WIDTH/RAW_Y_MIN", "cad/process/shop/inventory.toml: Rocker route v3 stock purchases"]

# This held plan carries layout and proof data directly, not an imaginary
# template or another shop-made gauge. Coordinates are millimetres unless
# the key ends in _in. Source: ch_rocker_arm_tl_oblique_blank_spec.
[bandsaw_preform]
frame = "carrier XY, A1/B1 midpoint origin; +X from A1 toward B1; +Y toward strap"
arc_centre_mm = [0.0, -762.7235464004277]
# Cutter-centre circles of the two jig passes; the finished R800/R816 are unchanged.
inner_centre_radius_mm = 795.2375
outer_centre_radius_mm = 820.7625
# Roughing-layout anchor circles (blank_spec.INNER/OUTER_ANCHOR_RADIUS), a
# small bias from the cutter-centre circles; product radii do not change.
inner_anchor_radius_mm = 795.08
outer_anchor_radius_mm = 821.21
# Circle anchors, ordered left to right: FIVE inner and TWO outer full-edge
# straight cuts; untouched rolled-edge portions are not cuts.
inner_anchors_mm = [[-150.0, 18.0787374077076], [-90.0, 27.2462039065065], [-30.0, 31.7902712264276], [30.0, 31.7902712264276], [90.0, 27.2462039065065], [150.0, 18.0787374077076]]
outer_anchors_mm = [[-160.0, 42.7489013592707], [0.0, 58.4864535995723], [160.0, 42.7489013592707]]
raw_y_limits_mm = [19.57913354012005, 57.67913354012005]
# blank_spec.LAYOUT_DATUM: X from the square-end midpoint (X0 = carrier X0),
# Y from the registered lower raw edge. blank_spec.LAYOUT_MARKS on the exact
# .XXX inch grid, [X, Y] in inches from that datum, ordered as the anchors.
layout_datum_mm = [0.0, 19.57913354012005]
inner_layout_marks_in = [[-5.906, -0.059], [-3.543, 0.302], [-1.181, 0.481], [1.181, 0.481], [3.543, 0.302], [5.906, -0.059]]
outer_layout_marks_in = [[-6.299, 0.912], [0.0, 1.532], [6.299, 0.912]]
retained_edge_normal_error_max_mm = 0.5
layout = "Find the blank's along-strap midpoint from its two square sawn ends and mark it X=0; the lower rolled (raw) edge is Y=0. Mark each layout_marks_in coordinate from that datum with height gauge and square, then join adjacent marks with a straightedge; C is calculated, never centre-punched or drilled. There is no hub hole and no hub datum: do not lay out from one. Extend the first/last line of each chain to each sawn end; clip every line to the actual bar rectangle. The inner marks at X +/-5.906 lie .059 below the raw edge and the outer mark at X 0 lies above the 1.500 raw edge: mark those points on the layout surface beside the bar, transfer each straight line to the bar with square/straightedge, and stop at its rolled-edge intersection. Do not widen the bar or pretend that off-stock anchors are physical vertices."
cutting = "On machines.bandsaw-4x6 in vertical mode with its table installed, use tools.bandsaw-blade-g5114 (14/18 TPI thin-stock blade), not the illustrative coarse 4/6 blade. Keep the broad face supported flat on the saw table with hands clear; present each straight waste-side cut from an accessible raw edge, stop/retract and reposition at corners rather than twist the blade. Remove waste BELOW the inner chain and ABOVE the outer chain; retain the band between them. The marked line describes the nominal RETAINED edge, never the blade centre; put the kerf on its waste side. The acceptance strip is 0.5 mm each side NORMAL to each PRINTED chord, joined by radius-0.5 corner caps: it is the TOTAL layout-plus-saw allowance, not a saw tolerance added to a separate marking tolerance. Inspect the retained cut edge and burrs against that strip and dress saw ridges into it before mounting. This is an inspect-and-finish acceptance, not a claim of bandsaw accuracy. Leave rolled edges unchanged wherever the corridor is outside the raw rectangle."
proof = "ch_rocker_arm_tl_oblique_blank_spec.proof() evaluates continuous domains, not stations: exact segment projections/endpoints over the tip-ray and full cutter-sweep wedges and exact disk/polygon area at both stops. The accepted envelope charges, together: the TOTAL +/-0.5 mm layout-plus-saw corridor normal to each printed chord (not .5 added to separately toleranced marks), the .XXX inch mark rounding, the ordinary loose stop-pin registration across the strap (two 98381A473 pins in #30 loose holes, including pin float and tilt), +/-0.5 mm along-strap placement and the yaw between the two stops, as exact directional setup rectangles; raw edges translate with the blank but carry no saw corridor. Charged floors, rounded down: inner finish stock to R800 >=4.037199 mm (FINISH_STOCK_MIN 4) and inner scrap-side kerf margin >=3.040812 mm; outer finish stock to R816 >=0.309511 mm (FINISH_STOCK_MIN_BY_PASS outer .30; no outer 4 mm requirement) and outer scrap-side kerf margin >=3.495652 mm. The R800 stock claim is within the finished tip rays only; end waste is sacrificial. Do not reuse the retired 4-inner/7-outer table or its margins."
entry = "Side entry is certified by the continuous >=3 mm scrap-side kerf overlap above, not by a percentage: proof() entry_air_fraction is nominal side engagement only, and no accepted air percentage is claimed. At each stop the cutter disk overlaps already-sawn open scrap, so neither entry is a full-width slot. Lower the cutter in that open scrap side and traverse into the preform at cutting depth; NEVER plunge at a stop or enter the unsawn full-width bar. Maintain the qualified stop positions and run-out; do not lengthen a sweep to cut off the clamping tails."

[[setups]]
id = "S0"
machine = "PM-30MV"
stock_in = "stock"
# Facing remains BEFORE sawing, while there is a continuous rectangular seat.
[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Face the rectangular strap blank on fixtures.thin-part-tape-subplate using consumables.tape-3m-444 and the plate's table hold-downs, not a thin strip pinched above vise jaws. Establish one flat face, turn over, seat it fully and finish the opposite face to the MHA-CH-13 drawing thickness (.098 +/- .001 in); check micrometers/0-1in at both ends and centre. Keep both 350 mm ends. Requalify adhesive holding/cutting loads before this held route is used. Clean all adhesive before layout or jig seating."

[[setups]]
id = "S1"
machine = "bandsaw-4x6"
stock_in = "S0"
[[setups.ops]]
op = 10
do = "scribe"
feature = ["top_edge", "profile_outer"]
note = "Apply bandsaw_preform.layout from the square-end midpoint and the registered lower raw edge; mark BOTH waste sides clearly. The printed .XXX inch layout marks and raw limits, not the final R800/R816 lines or any hub hole, locate the pre-saw cuts. The blank has NO hub hole yet; the product hub hole is drilled and reamed in place on the jig at S2 op 30."
[[setups.ops]]
op = 20
do = "deburr"
feature = ["top_edge", "profile_outer"]
note = "Apply bandsaw_preform.cutting and verify its edge acceptance. This held reference records the multi-plane vertical-saw operation in a note because the traveler saw_cut action represents a single plane and is not enrolled for this route. No chain-drill relief, skin or chisel break-out remains."

[[setups]]
id = "S2"
machine = "PM-30MV"
stock_in = "S1"
[[setups.ops]]
op = 10
do = "inspect"
feature = "strap_faces"
note = "Qualify the complete MHA-CH-06-TL-00 jig to its assembly drawing before mounting work: align rails, set and mechanically retain both shoulder pivots at the symmetric A1/B1 stations, qualify feed/end stops and installed stepped tool/toolholder clearance over both full sweeps. The thin 6061 riser MHA-CH-06-TL-24 is already self-cut with the 9/16 cutter and carries its Ø12 drill relief at HUB, two #9 loose CL/CR clearances and two #30 loose stop-pin holes. The carrier HUB #8-32 tap was already drilled and tapped IN SITU, spindle-guided, at the TL-00 step 10 DRO position (table +Y by HUB_OFFSET from the inner-pass apex); record that DRO reading, it is reused at op 30. Drop one common 98381A473 1/8 in plain stock pin into each loose riser stop hole, seated on the carrier; both stand outside both cutter sweeps. No carrier counterbore is required."
[[setups.ops]]
op = 20
do = "drill"
feature = "strap_end_clamp_holes"
tool = "drill-index-115/7-32in"  # blank.CLAMP_DRILL; resolved from the index's declared 1/16-1/2 by 64ths coverage
holder = "drill-chuck-r8"
note = "Sacrificial end-waste clamp holes, NOT features of the finished MHA-CH-13 drawing; the product hub hole stays unmade until S2 op 30. Transfer them from the ACTUAL carrier CL/CR taps with the two common 91251A197 #8-32 x 3/4 SHCS, no special transfer tool: stop/isolate the spindle, remove both shoulder screws and lift the carrier with its riser and stop pins to the bench, supported level on parallels so its underside is reachable. From below, thread one screw up into each CL/CR carrier tap until its tip stands just proud of the riser top through the riser's #9 clearance; coat both tips with layout blue. Lay the faced, bandsawn blank on the riser, push its lower raw edge toward -Y against BOTH stop pins, set it along-strap to the layout's end-midpoint mark (coarse) and press it straight down onto the tips to mark its underside. Lift the blank off; remove both screws. Centre-punch each mark, clamp the blank flat on parallels on the PM-30MV table (never hand-held under power, never drilled on the carrier or near the rolling guides) and drill each mark 7/32 THRU (blank.CLAMP_DRILL; loose clearance for the #8 body and underhead fillet). Deburr. Do not pre-drill nominal CL/CR coordinates from the raw datum; the carrier station table is REF for the blank. Return the carrier to its pivots and refit both mechanically retained shoulder screws per TL-00 before op 30."
[[setups.ops]]
op = 30
do = "drill"
feature = "hub_joint"
tool = "drill-index-115/25-64in"  # .3906 pre-ream drill, resolved from the index's 64ths coverage
holder = "drill-chuck-r8"
note = "Refit the blank with the same registration: lower raw edge -Y against both stop pins, along-strap to the end-midpoint mark. Clamp both ends with common 91251A197 #8-32 x 3/4 SHCS through the 7/32 strap holes and #9 riser clearances into the carrier CL/CR taps. Return the table to the recorded TL-00 step 10 DRO position (carrier at symmetric A1/B1, table +Y by HUB_OFFSET from the inner-pass apex), the same position that tapped the carrier HUB, and lock it. With both ends clamped, spindle-guided, drill the strap 25/64 THRU into the riser's Ø12 relief: .0094 in on diameter for the reamer, inside the ordinary .005-.010 in reaming allowance (Machinery's Handbook 27th ed. p.833). A 118 degree point on any drill under the product hole leads at most holding.DRILL_POINT_LEAD, well inside the riser relief (holding.DRILL_DEPTH_RESERVE). Do not move the table before op 40."
[[setups.ops]]
op = 40
do = "ream"
feature = "hub_joint"
tool = "reamers-inch-purchases/0.4000in"  # the inventory's .4000 straight-flute chucking reamer (pending purchase)
holder = "drill-chuck-r8"
note = "PREREQUISITE: the .4000 reamer is the product hole's existing reamer dependency, listed as a pending purchase (tools.reamers-inch-purchases, present = false). Purchase and receive it, then trial-ream a hole in scrap 1018 and pin-check it to the strap drawing's .4000 +.0005/.0000 before machining any strap; no cutting size or metrology is assumed here. At the same locked DRO position, with both ends still clamped, ream the strap THRU with the .4000 chucking reamer to the MHA-CH-13 hub hole (.4000 +.0005/.0000, Ø10.16 press fit; product unchanged) into the riser's Ø12 relief. Reamer envelope (ch_rocker_arm_tl_oblique_holding_spec): a standard flat-front 45 degree chucking-reamer lead is at most REAMER_LEAD_MAX 5.08635 mm; after the full-diameter land clears the strap, TOOL_OVERTRAVEL_BUDGET .254 mm overtravel fits the riser's TOOL_BREAKTHROUGH_SPACE_MIN 5.842 mm with REAMER_DEPTH_RESERVE .50165 mm above the carrier. No carrier counterbore and no long hand reamer are assumed. Leave both hole edges SHARP as the strap drawing specifies: remove burrs without breaking the edge. Every blank is reamed at this same DRO position; relative eccentricity is repeatability, not a carrier fit."

[[setups]]
id = "S3"
machine = "PM-30MV"
stock_in = "S2"
[[setups.ops]]
op = 10
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Do not unclamp CL/CR. Clean chips from the fresh hub hole. Install the MHA-CH-06-TL-52 brass top-hat washer, its Ø.391 +/-.002 in spigot in the reamed hub hole, 13/64 bore and Ø11 flange on the strap, then the common 91251A197 #8-32 x 3/4 SHCS into the carrier HUB tap at 1 N m. Seat the flange flat; there is no measured centring gate. Confirm both end heads, both stop pins and the washer stand on real stock and clear the full cutter sweeps per TL-00. Install the A1/B1 inner stops. Apply bandsaw_preform.entry; cut the R800 edge with the 3/8 cutter following the qualified jig feed. No plunge or chain drill."
[[setups.ops]]
op = 20
do = "rough_profile"
feature = "profile_outer"
# face_name("profile_outer", 1): deterministic first patch of this feature;
# exact STEP references are bound only when/if this held route is enrolled.
faces = ["HAF_PROFILE_OUTER__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Stop/isolate spindle before re-indexing. Remove both shoulder screws and lift the carrier, move the carriages to the outer stations, reseat at A2/B2 and refit both mechanically retained pivots per TL-00. Do not disturb the stop-pin registration, CL/CR clamps or HUB washer/screw. Install outer stops; lower in open scrap and side-enter per bandsaw_preform.entry, then cut R816 to its stop. The outer pre-saw edge is consumed continuously inside the kerf with the proof's scrap-side margin; retained clamping tails are not released on the jig."

[[setups]]
id = "S4"
machine = "fitting-bench"
stock_in = "S3"
[[setups.ops]]
op = 10
do = "deburr"
feature = ["tip_land_pos_x", "tip_land_neg_x"]
note = "Remove from the stopped jig. Support the strap flat and hold the end waste before separating either tail; saw outside the drawing's tip/taper lines and finish the lands/tapers to MHA-CH-13. Retain both tails until the circular cuts are complete. No chain-drill webs, legacy outline-template filing stand or unmodelled hub clamp is used. Deburr, preserving the drawing's profile zones and face thickness."
[[setups.ops]]
op = 20
do = "inspect"
feature = ["strap_faces", "top_edge", "profile_outer", "tip_land_pos_x", "tip_land_neg_x"]
note = "Inspect the strap to MHA-CH-13, including face thickness, both profile zones and the hub joint hole/fit; use the current drawing's inspection references. The pre-saw proof establishes allowance and engagement only, NOT final radius/profile compliance or installed-machine clearance. Do not reuse the retired template's placeholder metrology or one-piece acceptance windows."

[[setups]]
id = "S5"
machine = "PM-30MV"
stock_in = "S4"
[[setups.ops]]
op = 10
do = "inspect"
feature = "hub_joint"
note = "Make the separate MHA-CH-12 hub and assemble the hub/strap joint to the current MHA-CH-06 built-up assembly drawing, including its joint retention and orientation; do not machine an integral hub from the 1/8 strap. Preserve the drawing's assembly sequence for finish-boring the pivot, making/locating the rod hole and final hub faces after joining; their current sizes, fits and inspection controls come from that package rather than the superseded one-piece route."
[[setups.ops]]
op = 20
do = "inspect"
feature = ["pivot_bore", "rod_hole", "hub_faces", "hub_od"]
note = "Final assembled-arm acceptance is to MHA-CH-06: inspect pivot/rod-hole relationship, bore fit, hub OD/face requirements, strap thickness and the full profile. Finish and any required masking follow the current part/assembly drawings. This held reference does not qualify manufacturing or replace those drawings."
