# HELD REFERENCE ROUTE: not qualified manufacturing instructions.
# Not enrolled in _process_plans.TRAVELER_STEMS; ships no traveler.
# Built-up rocker route: this replaces the retired one-piece 5/16 blank,
# S3 chain-drill relief, skin removal and outline-template filing sequence.
# Source geometry/proof: cad/scripts/ch_rocker_arm_tl_oblique_blank_spec.py.
# The notes below describe the intended operations, not qualified collision
# envelopes, cutting data, tooling acceptance or observed shop results.
# Requalify tooling, workholding and installed-machine clearance before use.
# Current work status: https://github.com/users/pedropaulovc/projects/1
part = "ch-rocker-arm"
features = "../../out/features/ch_rocker_arm/features.toml"
construction = "built_up"
quantity = 1
quantity_cite = "AUTHOR'S CHOICE: one built-up arm; strap MHA-CH-13 plus hub MHA-CH-12"

[drawing]
number = "MHA-CH-06"
revision = "v48"
cite = ["cad/config/parts/ch-rocker-arm.yaml", "cad/config/parts/ch-rocker-strap.yaml", "cad/config/parts/ch-rocker-hub.yaml"]

[stock]
form = "flat_bar"
form_verify = false
material = "1018 cold-finish carbon steel"
material_verify = false
material_cite = ["cad/process/shop/inventory.toml: OnlineMetals 4807, order 1021751700"]
on_hand = false
prerequisite = "Receive the ordered OnlineMetals 4807 1018 CF 1/8 x 1-1/2 in flat (4 x 72 in, ordered 2026-11-03); measure actual section before layout. Cut one 350 mm strap blank, not the retired 336 mm one-piece blank. Keep the remaining bar. Make hub MHA-CH-12 separately to its drawing; this stock row covers the strap only."
section_mm = [38.1, 3.175]
length_mm = 350.0
# Carrier XY: C=(0,-H1); raw width is centred on the finished strap's
# Y envelope, NOT on HUB. Catalogue section and nominal placement, not readings.
origin_mm = [-175.0, 19.5791335401201, 0.0]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
as_is_faces = []
cite = ["ch_rocker_arm_tl_oblique_trammel_spec.BLANK_LENGTH/BLANK_WIDTH/STRAP_SPAN_Y/BLANK_EDGE_WASTE", "cad/process/shop/inventory.toml: Rocker route v3 stock purchases"]

# This held plan carries layout and proof data directly, not an imaginary
# template or another shop-made gauge. All coordinates below are millimetres.
[bandsaw_preform]
frame = "carrier XY, A1/B1 midpoint origin; +X from A1 toward B1; +Y toward strap"
arc_centre_mm = [0.0, -762.7235464004277]
inner_centre_radius_mm = 795.2375
outer_centre_radius_mm = 820.7625
# Circle anchors, ordered left to right. Counts are FOUR inner and SEVEN
# outer full-edge straight cuts; untouched rolled-edge portions are not cuts.
inner_anchors_mm = [[-148.0, 18.6206040264184], [-75.0, 28.9693747541382], [0.0, 32.5139535995722], [75.0, 28.9693747541382], [148.0, 18.6206040264184]]
outer_anchors_mm = [[-140.0, 46.0107000651527], [-100.0, 51.9242802131649], [-60.0, 55.8429331271975], [-20.0, 57.7952415662161], [20.0, 57.7952415662161], [60.0, 55.8429331271975], [100.0, 51.9242802131649], [140.0, 46.0107000651527]]
raw_y_limits_mm = [19.5791335401201, 57.6791335401201]
retained_edge_normal_error_max_mm = 0.5
layout = "Use the raw left end as X=-175 and the lower rolled edge as Y=19.57913354. Mark each coordinate with height gauge and square, then join adjacent anchors with a straightedge; C is calculated, never centre-punched or drilled. Extend the first/last line to each sawn end; clip every line to the actual bar rectangle. Inner anchors at |X|148 and outer anchors at |X|20 are off stock: mark those line extensions on the layout surface, transfer the straight line to the bar with square/straightedge, and stop at its rolled-edge intersection. Do not widen the bar or pretend that off-stock anchors are physical vertices."
cutting = "On machines.bandsaw-4x6 in vertical mode with its table installed, use tools.bandsaw-blade-g5114 (14/18 TPI thin-stock blade), not the illustrative coarse 4/6 blade. Keep the broad face supported flat on the saw table with hands clear; present each straight waste-side cut from an accessible raw edge, stop/retract and reposition at corners rather than twist the blade. Remove waste BELOW the inner chain and ABOVE the outer chain; retain the band between them. The marked line describes the nominal RETAINED edge, never the blade centre; put the kerf on its waste side. Mark an acceptance strip 0.5 mm each side NORMAL to each straight line, joined by radius-0.5 corner caps, and inspect the retained cut edge and burrs against that strip. Dress saw ridges into the strip before mounting. This is an inspect-and-finish acceptance, not a claim of bandsaw accuracy. Leave rolled edges unchanged wherever the corridor is outside the raw rectangle."
proof = "Exact segment projections/endpoints over the tip-ray and full cutter-centre sweep domains, plus exact disk/polygon area at both stops, are implemented in ch_rocker_arm_tl_oblique_blank_spec.proof(). No sparse-station argument. A point in the +/-0.5 NORMAL corridor changes radius by at most 0.5; expanded angular domains cover nearest points across tip/stop rays. Full untrimmed chord corridors are clipped to actual stock, so moving intersections are covered without subtracting saw error from untouched rolled edges. Inner nominal minimum radius 794.350861 gives accepted scrap-side kerf margin >=3.375861 mm. Outer accepted scrap-side margin >=3.648211 mm. Accepted stock to R800 is >=4.262500 mm and to R816 >=4.013460 mm. The >=4 stock claim is within the finished tip rays only; end waste is sacrificial. Four/seven cuts replace the three/five-cut option because that option needed a deliberately rejected +/-0.1 edge acceptance."
entry = "At either stop the actual clipped blank leaves nominal 72.57% cutter-disk air on the inner pass and 42.12% on the outer. Even the accepted +/-0.5 edge strip leaves more than 30% air; neither entry is a full-width slot. Lower the cutter in the already-open scrap side and traverse into the preform at cutting depth; NEVER plunge at a stop or enter the unsawn full-width bar. Maintain the qualified stop positions and run-out; do not lengthen a sweep to cut off the clamping tails."

[[setups]]
id = "S0"
machine = "PM-30MV"
stock_in = "stock"
# Facing remains BEFORE sawing, while there is a continuous rectangular seat.
[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Face the rectangular strap blank on fixtures.thin-part-tape-subplate using consumables.tape-3m-444 and the plate's table hold-downs, not a thin strip pinched above vise jaws. Establish one flat face, turn over, seat it fully and finish the opposite face to the MHA-CH-13 drawing thickness (.098 +/- .001 in); check micrometers/0-1in at both ends and centre. Keep both 350 mm ends. Requalify adhesive holding/cutting loads before this held route is used. Clean all adhesive before layout or jig seating."

[[setups]]
id = "S1"
machine = "bandsaw-4x6"
stock_in = "S0"
[[setups.ops]]
op = 10
do = "scribe"
feature = ["top_edge", "profile_outer"]
note = "Apply bandsaw_preform.layout; mark BOTH waste sides clearly. The supplied circle-anchor table and raw limits, not the final R800/R816 lines, locate the pre-saw cuts."
[[setups.ops]]
op = 20
do = "deburr"
feature = ["top_edge", "profile_outer"]
note = "Apply bandsaw_preform.cutting and verify its edge acceptance. This held reference records the multi-plane vertical-saw operation in a note because the traveler saw_cut action represents a single plane and is not enrolled for this route. No chain-drill relief, skin or chisel break-out remains."

[[setups]]
id = "S2"
machine = "PM-30MV"
stock_in = "S1"
[[setups.ops]]
op = 10
do = "inspect"
feature = "strap_faces"
note = "Qualify the complete MHA-CH-06-TL-00 jig to its assembly drawing before mounting work: align rails, set and mechanically retain both shoulder pivots, qualify feed/end stops and installed stepped tool/toolholder clearance over both full sweeps. Use the actual R3 carrier and extended 6061 riser, not the retired six riser blocks or a fictitious end support. The riser is 350.52 x 41.148 (13.80 x 1.62 in), carrier origin (-175.26,14.986), faced to its drawing thickness; it supports the +/-175 blank tails, including the outboard left clamp at X=-169.5. Match-drill and ream the unchanged .4000 HUB bore at assembly per TL-00 step 10, then chamfer its underside .02 x 45 degrees at the normal .XX tolerance to clear the stud root; the carrier CAD shows this completed assembly-machined state, not a second drilling operation. Self-cut the riser with the 9/16 cutter BEFORE installing the HUB stud, sleeve, washer or clamp screws: the steel sleeve's 14.732 OD is not in the self-cut envelope. The completed self-cut band leaves the 3/8 strap cutter 2.38125 mm clear of the riser on each side. Then fit the full-wall steel sleeve/support and HUB hardware to TL-00, with its locating nose unchanged. Fit the left screw length to actual riser-plus-strap grip plus 8.40-8.62 mm insertion and restore a 45 degree tip chamfer .030-.035 in (.762-.889 mm) AXIAL length. Bound full-thread engagement with the largest chamfer and runout with the smallest; verify both full-thread engagement and no binding in the tap lead, as well as no contact with the blind pilot floor."
[[setups.ops]]
op = 20
do = "ream"
feature = "strap_locator_holes"
note = "Make the strap HUB and CL locating holes and CR clearance to the current TL-00 setup instructions, maintaining the specified fits. Locate from the marked raw-end/edge coordinates, not a centre outside the stock; match the qualified carrier's in-situ HUB/CL locations. The LEFT hole is sacrificial end-waste tooling, NOT a feature on the finished MHA-CH-13 drawing: drill Ø.206 in (5.2324 mm) THRU at carrier XY (-169.5,27.557592509), equivalent to (-169.5,-17.972861091) from HUB. With the strap located on HUB and the retained CL dowel, mark this hole using a pointed #10-24 transfer screw in the carrier's blind LEFT receiver through the riser; lift the work off before drilling the mark, support it flat over drill clearance, deburr and confirm the screw enters freely without shifting the locating fits. Remove the transfer screw before refitting the work and its clamp screw. Do not copy obsolete .256 pivot or #47 rod-hole sizes from the one-piece route. CL remains the locating dowel, distinct from the outboard LEFT clamp."

[[setups]]
id = "S3"
machine = "PM-30MV"
stock_in = "S2"
[[setups.ops]]
op = 10
do = "rough_profile"
feature = "top_edge"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Seat the preform on the extended riser, locate on HUB and CL, retain the existing CR clamp and add BOTH the HUB clamp with its 11 mm brass washer and the outboard left hold-down at X=-169.5 on the actual hub-radius line (Y=27.557592509). Tighten HUB and LEFT to 1 N m each; CR retains its TL-00 instruction. CL is a dowel, never a clamp. Check all head bearing footprints are on retained stock and all support/fastener envelopes clear the full cutter sweeps. Install A1/B1 pivots and the inner stops. Apply bandsaw_preform.entry; cut the R800 edge with the 3/8 cutter following the qualified jig feed. No plunge or chain drill."
[[setups.ops]]
op = 20
do = "rough_profile"
feature = "profile_outer"
# face_name("profile_outer", 1): deterministic first patch of this feature;
# exact STEP references are bound only when/if this held route is enrolled.
faces = ["HAF_PROFILE_OUTER__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
note = "Stop/isolate spindle before re-indexing. Remove both shoulder screws and lift the carrier, move the carriages to the outer stations, reseat at A2/B2 and refit both mechanically retained pivots per TL-00. Do not disturb work locating/clamping. Install outer stops; lower in open scrap and side-enter per bandsaw_preform.entry, then cut R816 to its stop. Both pre-saw edges are consumed continuously inside the kerf with >=3 mm scrap-side margin; retained clamping tails are not released on the jig."

[[setups]]
id = "S4"
machine = "fitting-bench"
stock_in = "S3"
[[setups.ops]]
op = 10
do = "deburr"
feature = ["tip_land_pos_x", "tip_land_neg_x"]
note = "Remove from the stopped jig. Support the strap flat and hold the end waste before separating either tail; saw outside the drawing's tip/taper lines and finish the lands/tapers to MHA-CH-13. Retain both tails until the circular cuts are complete. No chain-drill webs, legacy outline-template filing stand or unmodelled hub clamp is used. Deburr, preserving the drawing's profile zones and face thickness."
[[setups.ops]]
op = 20
do = "inspect"
feature = ["strap_faces", "top_edge", "profile_outer", "tip_land_pos_x", "tip_land_neg_x"]
note = "Inspect the strap to MHA-CH-13, including face thickness, both profile zones and the hub joint hole/fit; use the current drawing's inspection references. The pre-saw proof establishes allowance and engagement only, NOT final radius/profile compliance or installed-machine clearance. Do not reuse the retired template's placeholder metrology or one-piece acceptance windows."

[[setups]]
id = "S5"
machine = "PM-30MV"
stock_in = "S4"
[[setups.ops]]
op = 10
do = "inspect"
feature = "hub_joint"
note = "Make the separate MHA-CH-12 hub and assemble the hub/strap joint to the current MHA-CH-06 built-up assembly drawing, including its joint retention and orientation; do not machine an integral hub from the 1/8 strap. Preserve the drawing's assembly sequence for finish-boring the pivot, making/locating the rod hole and final hub faces after joining; their current sizes, fits and inspection controls come from that package rather than the superseded one-piece route."
[[setups.ops]]
op = 20
do = "inspect"
feature = ["pivot_bore", "rod_hole", "hub_faces", "hub_od"]
note = "Final assembled-arm acceptance is to MHA-CH-06: inspect pivot/rod-hole relationship, bore fit, hub OD/face requirements, strap thickness and the full profile. Finish and any required masking follow the current part/assembly drawings. This held reference does not qualify manufacturing or replace those drawings."
