# HELD REFERENCE ROUTE: not qualified manufacturing instructions.
# This plan is not enrolled in _process_plans.TRAVELER_STEMS and ships no traveler.
# Its S5 template and other standalone tooling CAD were retired at the owner's
# request. Inline shop solids are collision envelopes, not replacement tool drawings.
# Requalify the route and its required tooling before manufacturing from it.
# Current work status: https://github.com/users/pedropaulovc/projects/1
#
# ch_rocker_arm (MHA-CH-06) prechips route, authored from scratch (trial T4, ported from
# cad/prechips-shop 6d5991c9b onto the merged shop fixtures MHA-CH-06-TL-04/05 and TL-10..19).
# Those TL CAD parts are retired (Numbers reserved); the fixtures and gauges stay shop
# inventory items with inline solids, and the outline template's inspection geometry lives
# in cad/scripts/ch_rocker_arm_profile_check.py.
# Coordinates: the model frame is the manifest's (pivot axis at model X0 Y8, hub centred
# on Z0). Setup frames are plan frames below; every number is derived from features.toml.
# Face references are bare HAF labels; _process_plans.bind_plan binds them to the exported
# STEP's exact faces in the generated travelers/ch_rocker_arm/plan.toml.
part = "ch-rocker-arm"
features = "../../out/features/ch_rocker_arm/features.toml"
construction = "one_piece"
quantity = 1
quantity_cite = "AUTHOR'S CHOICE: one arm per traveler run"

[drawing]
number = "MHA-CH-06"
revision = "v47"
cite = ["harmonic-analyzer/cad/config/parts/ch-rocker-arm.yaml:ch-rocker-arm.number", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"

[dro.direction]
x = "right"
y = "away"
z = "up"

# Purchased blank (Pedro 2026-10-11): Online Metals 1018 CR 5/16 x 1-1/2 flat, 2 ft cut
# length; one 336 mm blank is sawn from it. The part (X -146.26..146.26, Y 0..29.30,
# Z -3.53..3.53) sits with 4.4 below Y0 and 4.4 above the tips, so neither 3.75 mm wide
# chain-drill corridor (0.3/0.6 leave + #29 drill) breaks out of the bar edge, and 21.7
# past each tip: the raw blank ends carry the S3/S4 table clamps.
[stock]
form = "flat_bar"
form_verify = false
material = "1018 cold-rolled steel"
drawing_material = "AISI 1018 low-carbon steel" # the drawing's single named grade (Opus review #1020 removed "OR GRAY IRON")
material_verify = false
material_cite = [
  "harmonic-analyzer/cad/config/parts/ch-rocker-arm.yaml:ch-rocker-arm.material_specification",
  "https://www.onlinemetals.com/en/buy/carbon-steel/0-3125-x-1-5-tool-steel-rectangle-bar-1018/pid/12035 (1018 cold finish rectangle 0.3125 x 1.5 in)",
]
on_hand = false
prerequisite = "Buy Online Metals pid 12035 (1018 CR, 5/16 x 1-1/2 in), 2 ft cut length (USD 79.26 on 2026-10-11, length +/-0.125 in). Saw one 336 mm blank on the 4x6 bandsaw; deburr the sawn ends; keep the offcut."
# Catalogue-valued placeholder (realistic, remeasure: #1413): status="measured", date="2026-10-13"; Online Metals pid 12035 section 1-1/2 x 5/16 in = [38.1, 7.9375] mm exactly; instruments="25-50 mm micrometer for width; 0-25 mm micrometer, 0.001 mm for thickness"; scalar/vector-only plan schema.
section_mm = [38.1, 7.9375]
length_mm = 336.0
origin_mm = [-168.0, -4.4, -3.96875]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
as_is_faces = []
cite = [
  "Pedro 2026-10-11 decision (ledger L5): buy 1018 CR 5/16 x 1-1/2 in flat",
  "AUTHOR'S CHOICE: section placement Y -4.4..33.7 keeps the chain-drill corridors inside the bar; 336 mm = tips at X +/-146.26, plus the 3/8 in facing cutter's radius and pass overrun (to X +/-155.8), 3.2 mm crash clearance, and an 8 mm strap pad with 1 mm to the sawn end",
  "Online Metals Cold Roll Steel Tolerances, Rectangle Bar (https://www.onlinemetals.com/en/cold-roll-steel-tolerances, read 2026-10-15): 1018 Cold Finish, width over 0.75 to 1.5 in incl., +/-0.004 in; width governs both width and thickness, so the 5/16 in thickness is 7.9375 +/-0.1016 mm (the S1 D-drill exit margin)",
]

[frames.up]
origin = [0.0, 8.0, -3.96875]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: datum-B side up, lying on the table (rotary or mill); X0 Y0 on the pivot axis, Z0 on the table top under the raw lower face"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "plan stock origin_mm z -3.96875"]

[frames.down]
origin = [0.0, 8.0, 3.96875]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: turned over about X, lying on the table on the raw upper face; X0 Y0 on the pivot axis, Z0 on the table top"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "plan stock origin_mm z -3.96875 + 7.9375"]

[frames.top]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bench frame, datum-B side up; X0 Y0 on the pivot axis, Z0 on the upper hub face"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "features.toml hub_faces.upper_z 3.52825"]

# ---------------------------------------------------------------------------------------
# S1: mill table, raw blank flat on the table, datum-B side up, one strap clamp across each
# raw blank end. Skim the upper hub face, stair-mill the upper hub OD outside its line down
# to datum B (Pedro 2026-10-11: the 336 mm blank cannot swing on the rotary table; the hub
# is filed to buttons in S6), then spot, drill and ream the pivot bore and spot and drill
# the rod hole.
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "stock"

[setups.stock_state]
# The top stays the raw upper face (the blank ends are never faced): no feature names it.
top_feature = "unknown"
top_z = 7.9375
bottom_z = 0.0

# Hole entries and through thickness (docs/rules-operations.md blind_depth). The pivot bore
# enters the raw top, which op 10 faces to 7.497 over the hub (its box covers the bore);
# the rod hole enters the raw top at X133. Both run through to the raw underside (Z0).
# Catalogue-valued placeholder (realistic, remeasure: #1413): status="measured", date="2026-10-13", instrument="0-25 mm micrometer, 0.001 mm"; raw thickness 5/16 in = 7.9375 mm exactly, Online Metals pid 12035 (checklist A1); all raw-stock heights/entries below derive from this same trial reading.
[setups.stock_state.entry_z]
pivot_bore = 7.9375
rod_hole = 7.9375

[setups.stock_state.local_thickness]
pivot_bore = 7.497                # upper hub face (after op 10) to the raw underside
rod_hole = 7.9375                 # raw bar at the arm tip

[setups.hold]
fixture = "rocker-riser-blocks"
pose = { origin_mm = [0.0, 0.0, -2.72415], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
# AUTHOR'S CHOICE: retain each toe position but point the straps outwards.
# The stud is 38.1 behind its toe; these unit axes put both stud centres on
# the table's centre T-slot, Y+/-6.8 after the hold pose is applied (manual p6).
clamps = [
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-mill-raised", restraint = "press", pose = { origin_mm = [-164.0, 6.65, 7.9375], x = [-0.9999922499544683, 0.003937007874015734, 0.0], z = [0.0, 0.0, 1.0] }, note = "4 in stud; T-nut seated for the shim-raised work" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-mill-raised", restraint = "press", pose = { origin_mm = [164.0, 6.65, 7.9375], x = [0.9999922499544683, 0.003937007874015734, 0.0], z = [0.0, 0.0, 1.0] }, note = "4 in stud; T-nut seated for the shim-raised work" },
  { ref = "strap-shim-stack", restraint = "locate", note = "under the left blank end, below its clamp; seats the work at Z0 (prechips#184: locate, not none)", pose = { origin_mm = [-158.0, 6.65, -2.72415], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "strap-shim-stack", restraint = "locate", note = "under the bar at X-60", pose = { origin_mm = [-60.0, 6.65, -2.72415], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "strap-shim-stack", restraint = "locate", note = "under the bar at X+60", pose = { origin_mm = [60.0, 6.65, -2.72415], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "strap-shim-stack", restraint = "locate", note = "under the right blank end, below its clamp", pose = { origin_mm = [158.0, 6.65, -2.72415], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "AUTHOR'S CHOICE: the six riser blocks clamped to the table along the bar line (they lift the work 18.50 so the 3/8 in end mill reaches it inside the spindle-to-table minimum); the raw blank on the four strap shim stacks set on the blocks (any equal height; the S4 set at nominal 2.719), so the letter D drill, the reamer and the #47 drill break through into air above the blocks; then one strap clamp across each raw blank end (X 160-168 either side), over its stack and end block"

[setups.zero.x]
edge = "left sawn blank end, finder tip at Z +4"
edge_mm = -168.0
from = "-x"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "front (Y-) bar edge as rolled, finder tip at Z +4"
edge_mm = -12.4
from = "-y"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
# The drills touch off on this same spot (tool_touches below), so they share the end mill's Z.
edge = "raw top over the X+60 shim stack, at X+60.0 Y+6.65"
# Catalogue-valued placeholder (realistic, remeasure: #1413), status="measured", date="2026-10-13", instrument="0-25 mm micrometer, 0.001 mm" (original authorization 2026-10-11; see
# local://rocker-measurement-checklist.md A1): raw bar thickness = 7.9375 (nominal 5/16 in,
# Online Metals pid 12035), so the raw top stands at stock_state.top_z. Mike the bar before
# clamping; if it is not 7.94 +/-0.02, put M back (measure_then_set, offset 0) or re-author top_z.
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "center-drills-lms-4859/2"
z_face = "top"
edge_mm = 7.9375
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
method = "spindle stopped; lower the tool on the raw top over the X+60 shim stack (clear of the faced hub), at X+60.0 Y+6.65, through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 20
before_ops = [30]

[[setups.zero.tool_touches]]
tool = "drill-index-115/D"
z_face = "top"
edge_mm = 7.9375
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
method = "spindle stopped; lower the tool on the raw top over the X+60 shim stack (clear of the faced hub), at X+60.0 Y+6.65, through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 30
before_ops = [40]

[[setups.zero.tool_touches]]
tool = "reamers-metric/6.5mm"
z_face = "top"
edge_mm = 7.9375
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
method = "spindle stopped; lower the tool on the raw top over the X+60 shim stack (clear of the faced hub), at X+60.0 Y+6.65, through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 40
before_ops = [50]

[[setups.zero.tool_touches]]
tool = "center-drills-lms-4859/2"
z_face = "top"
edge_mm = 7.9375
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
method = "spindle stopped; lower the tool on the raw top over the X+60 shim stack (clear of the faced hub), at X+60.0 Y+6.65, through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 50
before_ops = [60]

[[setups.zero.tool_touches]]
tool = "drill-index-115/#47"
z_face = "top"
edge_mm = 7.9375
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
method = "spindle stopped; lower the tool on the raw top over the X+60 shim stack (clear of the faced hub), at X+60.0 Y+6.65, through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 60
before_ops = [70]

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["HAF_HUB_FACES__P02"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 7.497
doc_mm = 0.4405
approach_mm = 5.0
stock_removal_bounds = { x = [-15.5, 15.5], y = [-15.5, 15.5], z = [7.497, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-10.8, 10.8], y = [-2.8, 18.8], z = [3.52825, 3.96875] } }

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "hub_od"
faces = ["HAF_HUB_OD__P02"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 5.21335
doc_mm = 1.0
approach_mm = 5.0
# AUTHOR'S CHOICE: stairs (one handwheel moves at a time) at 0 allowance down to datum B:
# the stair corners touch the nominal hub circle and the 0.15 cusp is what the S6 file
# takes to the hub buttons. A nonzero leave cannot be kept: its guard covers the datum-B
# floor beside the hub, and the stairs must reach the foot of the hub OD (ledger L34).
rough_allowance_mm = 0.0
contour = { method = "stairs", cusp_mm = 0.15 }

[[setups.ops]]
op = 30
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 1.5                    # tip at Z 5.997 below the faced hub, as the 6.0 stop before
approach_mm = 3.0

[[setups.ops]]
op = 40
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-r8"
# Author's choice: full Ø 0.4 past the raw underside (the #47's breakout), tip at -2.276. With
# Z zero on the raw top, bar thickness (+/-0.004 in, width-governed: see the [stock] cite)
# moves the underside and, with the S4 stacks built to M - 5.219, the
# block seat too: >= 0.298 full-Ø breakout on a thick bar and >= 0.23 point clearance above
# the block on a thin bar (blocks equal within 0.01). At 0.6 that clearance was 0.03.
exit_mm = 0.4
approach_mm = 3.0

[[setups.ops]]
op = 50
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 1.0                     # author's choice: reamer lead and 1.0 past the raw underside
approach_mm = 3.0

[[setups.ops]]
op = 60
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.74                   # tip at Z 7.2 below the raw top, as before
approach_mm = 3.0

[[setups.ops]]
op = 70
do = "drill"
feature = "rod_hole"
tool = "drill-index-115/#47"
holder = "drill-chuck-r8"
exit_mm = 0.4                     # author's choice: tip about 1.0 below the raw underside, 1.7 above the right outer riser block
approach_mm = 3.0

# ---------------------------------------------------------------------------------------
# S2: mill table, turned over onto the raw upper face (the finished upper hub stands 0.44
# below it); one strap clamp across each raw blank end. Indicate the reamed bore, skim the
# lower hub face and stair-mill the lower hub OD outside its line down to the strap face.
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "down"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S1"

[setups.stock_state]
top_feature = "unknown"
top_z = 7.9375
bottom_z = 0.0

[setups.hold]
fixture = "rocker-riser-blocks"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [-1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-mill", restraint = "press", pose = { origin_mm = [-164.0, -6.65, 7.9375], x = [-0.9999922499544683, -0.003937007874015734, 0.0], z = [0.0, 0.0, 1.0] }, note = "4 in stud; T-nut seated under the centre slot lip" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-mill", restraint = "press", pose = { origin_mm = [164.0, -6.65, 7.9375], x = [0.9999922499544683, -0.003937007874015734, 0.0], z = [0.0, 0.0, 1.0] }, note = "4 in stud; T-nut seated under the centre slot lip" },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "the bar on the six riser blocks (turned 180° about Z for the down frame); one strap clamp across each raw blank end (X 160-168 either side), over its end block"

[setups.zero]
transfer = { from = "S1", indicate = ["pivot_bore", "rod_hole"], gauge = "dti", runout_limit_mm = 0.02 }

[setups.zero.x]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
tool = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
tool = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "raw top, at X+60.0 Y-6.65"
# Catalogue-valued placeholder (realistic, remeasure: #1413): status="measured", date="2026-10-13", instrument="0-25 mm micrometer, 0.001 mm"; raw thickness 7.9375 mm exactly from Online Metals pid 12035, 5/16 in (checklist A1); see S1 zero.z.
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
# Schema-limited placeholder (realistic, remeasure: #1413): 0.05 mm heavy cigarette-paper shim; status="measured", date="2026-10-12", instrument="0-25 mm micrometer, 0.001 mm; ten-sheet stack / 10".
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["HAF_HUB_FACES__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 7.497
doc_mm = 0.4405
approach_mm = 5.0
stock_removal_bounds = { x = [-15.5, 15.5], y = [-15.5, 15.5], z = [7.497, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-10.8, 10.8], y = [-2.8, 18.8], z = [-3.96875, -3.52825] } }

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "hub_od"
faces = ["HAF_HUB_OD__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 5.21335
doc_mm = 1.0
approach_mm = 5.0
# AUTHOR'S CHOICE: as S1 op 20, stairs at 0 allowance, the 0.15 cusp left for the S6 file.
rough_allowance_mm = 0.0
contour = { method = "stairs", cusp_mm = 0.15 }

# ---------------------------------------------------------------------------------------
# S3: mill table, datum-B side up on the raw lower face, a strap across each raw blank
# end. Face datum B over the whole bar between the clamps, keeping out of the hub, then
# chain-drill the R816 bottom and the R800 top edge outside the line to 0.12 below the
# lower strap face (a 2.6 mm skin stays under the holes until S4 faces it). The tapers and
# tip lands are left whole: they are the tabs that carry the arm, joined to the blank
# ends, to the bench, where they are hacksawed and filed to the line.
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S2"

[setups.stock_state]
top_feature = "unknown"
top_z = 7.9375
bottom_z = 0.0

[setups.hold]
fixture = "rocker-riser-blocks"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad-mill", restraint = "press", pose = { origin_mm = [-164.0, 6.65, 7.9375], x = [-0.9999922499544683, 0.003937007874015734, 0.0], z = [0.0, 0.0, 1.0] }, note = "4 in stud; T-nut seated under the centre slot lip" },
