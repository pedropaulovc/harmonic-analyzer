method = "press"
process = "AUTHOR'S CHOICE: press in the bench vise between soft jaws, the hub centred in the strap thickness"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_fit.py:PRESS_INTERFERENCE (user rulings 2026-10-16: press fit in the vise; 2026-10-17: H7/r6)"]
