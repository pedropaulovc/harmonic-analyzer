# The vise's jaws close along its local X: turn it so they close along the hub axis
# (model Z) on the two hub ends, its top (local Z) toward +Y, the hub centre 6.5 below the
# jaw tops. The strap stands up between the open jaws, its 14 mm side below the hub
# (strap edge BM Y-14, clear of the body under the jaws at Y-18.5).
