# below it); one strap clamp across each raw blank end. Indicate the reamed bore, skim the
# lower hub face and stair-mill the lower hub OD outside its line down to the strap face.
[[setups]]
id = "S2"
machine = "PM-30MV"
frame = "down"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S1"

[setups.stock_state]
top_z = 7.9375
bottom_z = 0.0

[setups.hold]
fixture = "pm30mv-table"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [-164.0, -6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [164.0, -6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "one strap clamp across each raw blank end (X 160-168 either side), straight onto the mill table"

[setups.zero]
transfer = { from = "S1", indicate = ["pivot_bore", "rod_hole"], gauge = "dti", runout_limit_mm = 0.02 }

[setups.zero.x]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "raw bar thickness (as rolled, both faces raw) at the blank end, with the 0-1 in micrometer before clamping; the top then stands that far above the table"
measure_before_hold = true
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
offset_mm = 0.0
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#389/ADVANCED_FACE[12]/HAF_HUB_FACES__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 7.497
doc_mm = 0.4405
approach_mm = 5.0
stock_removal_bounds = { x = [-15.5, 15.5], y = [-15.5, 15.5], z = [7.497, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-10.8, 10.8], y = [-2.8, 18.8], z = [-3.96875, -3.52825] } }

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "hub_od"
faces = ["#91/ADVANCED_FACE[2]/HAF_HUB_OD__P01", "#266/ADVANCED_FACE[10]/HAF_HUB_OD__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 5.21875
doc_mm = 1.0
approach_mm = 5.0
# AUTHOR'S CHOICE: as S1 op 20, stairs at 0 allowance, the 0.15 cusp left for the S6 file.
rough_allowance_mm = 0.0
contour = { method = "stairs", cusp_mm = 0.15 }

# ---------------------------------------------------------------------------------------
# S3: mill table, datum-B side up on the raw lower face, a strap across each raw blank
# end. Face datum B over the whole bar between the clamps, keeping out of the hub, then
# chain-drill the R816 bottom and the R800 top edge outside the line to 0.12 below the
# lower strap face (a 2.6 mm skin stays under the holes until S4 faces it). The tapers and
# tip lands are left whole: they are the tabs that carry the arm, joined to the blank
# ends, to the bench, where they are hacksawed and filed to the line.
[[setups]]
id = "S3"
machine = "PM-30MV"
frame = "up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S2"

[setups.stock_state]
top_z = 7.9375
bottom_z = 0.0

[setups.hold]
fixture = "pm30mv-table"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [-164.0, 6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [164.0, 6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "one strap clamp across each raw blank end (X 160-168 either side), straight onto the mill table"

[setups.zero]
transfer = { from = "S2", indicate = ["pivot_bore", "rod_hole"], gauge = "dti", runout_limit_mm = 0.02 }

[setups.zero.x]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "raw bar thickness (as rolled, both faces raw) at the blank end, with the 0-1 in micrometer before clamping; the top then stands that far above the table"
measure_before_hold = true
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
offset_mm = 0.0
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "drill-index-115/#33"
z_face = "strap_datum_b"
edge_mm = 5.21875
paper_mm = 0.05
method = "spindle stopped; lower the tool on the strap datum b through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 10
before_ops = [20]

[[setups.zero.tool_touches]]
tool = "drill-index-115/#29"
z_face = "strap_datum_b"
edge_mm = 5.21875
paper_mm = 0.05
method = "spindle stopped; lower the tool on the strap datum b through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 20
before_ops = [30]

[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_datum_b"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 5.21875
doc_mm = 1.0
approach_mm = 5.0
stock_removal_bounds = { x = [-156.2, 156.2], y = [-17.3, 30.5], z = [5.21875, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-146.6, 146.6], y = [-4.4, 33.7], z = [1.25, 3.96875] }, keep_out = [{ at = [0.0, 8.0], dia_mm = 11.0 }] }

[[setups.ops]]
op = 20
do = "rough_profile"
feature = "profile_outer"
faces = ["#178/ADVANCED_FACE[6]/HAF_PROFILE_OUTER__P02"]
tool = "drill-index-115/#33"
holder = "drill-chuck-r8"
direction = "climb"
to_z = 2.6
approach_mm = 3.0
# AUTHOR'S CHOICE: #33 (r 1.435) at 0.3 leaves 1.735 for the file, under the shop's 2.0 cap.
# The convex R816 chain needs 0.3: at 0.25 the #29 chain gouged the arc (prechips#180).
rough_allowance_mm = 0.3
# AUTHOR'S CHOICE: the box stops the chain at the R816 arc ends (holes to X+-135.6), so the
# printed joins up the tapers are clipped off and the tapers and tip lands stay whole as
# the tabs to the bench; the box is the strip below the arc, which breaks out at S5.
stock_removal_bounds = { x = [-135.8, 135.8], y = [-13.0, 2.6], z = [2.6, 8.5] }
contour = { method = "chain_drill", pitch_mm = 4.2 }

[[setups.ops]]
op = 30
do = "rough_profile"
feature = "top_edge"
tool = "drill-index-115/#29"
holder = "drill-chuck-r8"
direction = "climb"
to_z = 2.6
approach_mm = 3.0
rough_allowance_mm = 0.25
contour = { method = "chain_drill", pitch_mm = 4.2 }

# ---------------------------------------------------------------------------------------
# S4: mill table, turned over onto the raw blank ends (the faced datum B and the upper
