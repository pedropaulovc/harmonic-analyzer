note = "With the two blank ends clamped and the hub clamp still off, lay the template on the work, push the 0.2558 in Class X minus pin gauge through its pivot hole into the reamed bore and the 0.0780 in pin gauge through its rod slot into the rod-pin hole; hold the template against both pins while scribing both edges, then lift it off and clamp the hub."

