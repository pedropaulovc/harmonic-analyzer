  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad", restraint = "press", pose = { origin_mm = [-158.0, 6.65, 0.4405], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "across the left raw blank end, over the end block" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad", restraint = "press", pose = { origin_mm = [158.0, 6.65, 0.4405], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "across the right raw blank end, over the end block" },
  { ref = "clamping-kit-pm-52pcck-14mm/strap-pad", restraint = "press", pose = { origin_mm = [0.0, 0.0, 0.0], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] }, note = "on the upper hub face (7.06 thick), over the hub pedestal" },
]
