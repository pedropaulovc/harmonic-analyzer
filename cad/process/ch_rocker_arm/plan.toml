[setups.zero.x]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "raw bar thickness (as rolled, both faces raw) at the blank end, with the 0-1 in micrometer before clamping; the top then stands that far above the table"
measure_before_hold = true
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
offset_mm = 0.0
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 5.21875
doc_mm = 1.0
approach_mm = 5.0
stock_removal_bounds = { x = [-156.2, 156.2], y = [-30.5, 17.3], z = [5.21875, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-146.6, 146.6], y = [-4.4, 33.7], z = [-3.96875, -1.25] }, keep_out = [{ at = [0.0, 8.0], dia_mm = 11.0 }] }

# ---------------------------------------------------------------------------------------
# S5: fitting bench. Scribe the outline from the template pinned in the reamed bore, break
# out the chain-drill webs, hacksaw through the two taper-and-land tabs just outside the
# scribed line and file the outline, tapers and tip lands included, to the line.
[[setups]]
id = "S5"
machine = "fitting-bench"
frame = "top"
coolant = "none"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S4"

[setups.stock_state]
top_z = 0.4405            # the raw blank ends still stand (arm carried on its taper/land tabs)
bottom_z = -7.4970

[setups.hold]
fixture = "bench-vise-4in"
pose = { origin_mm = [0.0, 0.0, -20.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "bench vise, soft jaws on the hub faces"

[[setups.ops]]
op = 10
do = "scribe"
feature = "top_edge"
layout = "template"
guide = { template = "arm-outline-template" }

[[setups.ops]]
op = 20
do = "scribe"
feature = "profile_outer"
layout = "template"
guide = { template = "arm-outline-template" }

[[setups.ops]]
op = 30
do = "file_to_line"
feature = "top_edge"
guide = { template = "arm-outline-template", gauge = "arm-outline-template" }

[[setups.ops]]
op = 40
do = "file_to_line"
feature = "profile_outer"
guide = { template = "arm-outline-template", gauge = "arm-outline-template" }

[[setups.ops]]
op = 50
do = "file_to_line"
feature = "tip_land_pos_x"
guide = { template = "arm-outline-template", gauge = "arm-outline-template" }

[[setups.ops]]
op = 60
do = "file_to_line"
feature = "tip_land_neg_x"
guide = { template = "arm-outline-template", gauge = "arm-outline-template" }

# ---------------------------------------------------------------------------------------
# S6: finishing bench. Deburr, inspect, send out for black oxide.
[[setups]]
id = "S6"
machine = "finishing-bench"
frame = "top"
coolant = "none"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S5"

[setups.stock_state]
top_z = 0.0
bottom_z = -7.0565

[setups.hold]
fixture = "finishing-rest-plate"
pose = { origin_mm = [0.0, 0.0, -7.0565], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "none"

[[setups.ops]]
op = 10
do = "deburr"
feature = "profile_outer"

[[setups.ops]]
op = 20
do = "inspect"
feature = "pivot_bore"
checks = { dia = "pin-gauges", thru = "pin-gauges", finish_ra = "roughness-comparator", process = "pin-gauges" }

[[setups.ops]]
op = 30
do = "inspect"
feature = "rod_hole"
checks = { dia = "pin-gauges", thru = "pin-gauges", at = "height-gauge", position_dia = "height-gauge" }
inspection_methods = { position_dia = "Datums A|B|C: arm on its datum-B face on the surface plate, a Ø6.5 pin gauge in the reamed bore (A); with land C square to the plate on the angle plate, read the Ø2 pin gauge in the rod hole and the Ø6.5 pin over the plate with the height gauge in both directions; position = 2 x hypot(dX, dY) from 133.067 / 8.456 (features.toml rod_hole.at less pivot)" }

[[setups.ops]]
op = 40
do = "inspect"
feature = "hub_od"
checks = { dia = "micrometers/0-1in", coaxiality_dia = "dti" }
inspection_methods = { coaxiality_dia = "Datum A: arm on a Ø6.5 pin gauge in the reamed bore, pin held in V-blocks on the surface plate; sweep each hub OD half with the DTI while turning the arm on the pin; coaxiality = full indicator movement" }

[[setups.ops]]
op = 50
do = "inspect"
feature = "hub_faces"
checks = { length = "micrometers/0-1in" }

[[setups.ops]]
op = 60
do = "inspect"
feature = ["strap_faces", "strap_datum_b"]
checks = { thickness = "micrometers/0-1in" }

[[setups.ops]]
op = 70
do = "inspect"
feature = "top_edge"
checks = { height_above_pivot = "arm-outline-template", radius = "arm-outline-template", arc_len = "arm-outline-template" }

[[setups.ops]]
op = 80
do = "inspect"
feature = "profile_outer"
checks = { bottom_radius = "arm-outline-template", bottom_arc_len = "arm-outline-template", mirror_symmetric = "arm-outline-template" }

[[setups.ops]]
op = 90
do = "inspect"
feature = ["tip_land_pos_x", "tip_land_neg_x"]
checks = { tip_land = "calipers", land_angle_deg = "arm-outline-template" }

[[setups.ops]]
op = 100
do = "coating"
feature = "profile_outer"
process = "black-oxide-vendor"
