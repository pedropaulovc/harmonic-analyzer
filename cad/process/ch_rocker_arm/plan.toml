# ch_rocker_arm (MHA-CH-006 v41) prechips route, authored from scratch (trial T4).
# Coordinates: the model frame is the manifest's (pivot axis at model X0 Y8, hub centred
# on Z0). Setup frames are plan frames below; every number is derived from features.toml.
part = "ch-rocker-arm"
features = "../../out/travelers/ch_rocker_arm/features.toml"
construction = "one_piece"
quantity = 1
quantity_cite = "AUTHOR'S CHOICE: one arm per traveler run"

[drawing]
number = "MHA-CH-006"
revision = "v41"
cite = ["features.toml drawing.number/revision"]

[paths]
inventory = "../shop/inventory.toml"
policy = "../shop/shop-policy.toml"
cutting_data = "../shop/cutting-data.toml"

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"

[dro.direction]
x = "right"
y = "away"
z = "up"

# Purchased blank (Pedro 2026-10-11): Online Metals 1018 CR 5/16 x 1-1/2 flat, 2 ft cut
# length; one 336 mm blank is sawn from it. The part (X -146.26..146.26, Y 0..29.30,
# Z -3.53..3.53) sits with 4.4 below Y0 and 4.4 above the tips, so neither 3.75 mm wide
# chain-drill corridor (0.3/0.6 leave + #29 drill) breaks out of the bar edge, and 21.7
# past each tip: the raw blank ends carry the S3/S4 table clamps.
[stock]
form = "flat_bar"
form_verify = false
material = "1018 cold-rolled steel"
drawing_material = "LOW-CARBON STEEL OR GRAY IRON"
material_verify = false
material_cite = [
  "features.toml material: LOW-CARBON STEEL OR GRAY IRON",
  "https://www.onlinemetals.com/en/buy/carbon-steel/0-3125-x-1-5-tool-steel-rectangle-bar-1018/pid/12035 (1018 cold finish rectangle 0.3125 x 1.5 in)",
]
on_hand = false
prerequisite = "Buy Online Metals pid 12035 (1018 CR, 5/16 x 1-1/2 in), 2 ft cut length (USD 79.26 on 2026-10-11, length +/-0.125 in). Saw one 336 mm blank on the 4x6 bandsaw; deburr the sawn ends; keep the offcut."
section_mm = [38.1, 7.9375]
length_mm = 336.0
origin_mm = [-168.0, -4.4, -3.96875]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
as_is_faces = []
cite = [
  "Pedro 2026-10-11 decision (ledger L5): buy 1018 CR 5/16 x 1-1/2 in flat",
  "AUTHOR'S CHOICE: section placement Y -4.4..33.7 keeps the chain-drill corridors inside the bar; 336 mm = tips at X +/-146.26, plus the 3/8 in facing cutter's radius and pass overrun (to X +/-155.8), 3.2 mm crash clearance, and an 8 mm strap pad with 1 mm to the sawn end",
]

[frames.up]
origin = [0.0, 8.0, -3.96875]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: datum-B side up, lying on the table (rotary or mill); X0 Y0 on the pivot axis, Z0 on the table top under the raw lower face"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "plan stock origin_mm z -3.96875"]

[frames.down]
origin = [0.0, 8.0, 3.96875]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: turned over about X, lying on the table on the raw upper face; X0 Y0 on the pivot axis, Z0 on the table top"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "plan stock origin_mm z -3.96875 + 7.9375"]

[frames.top]
origin = [0.0, 8.0, 3.52825]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bench frame, datum-B side up; X0 Y0 on the pivot axis, Z0 on the upper hub face"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]", "features.toml hub_faces.upper_z 3.52825"]

# ---------------------------------------------------------------------------------------
# S1: rotary table, raw blank flat on the table, datum-B side up, the pivot over the
# table's centre bore. Skim the upper hub face, spot, drill and ream the pivot bore on the
# table axis, turn the table to finish the upper hub OD down to datum B (Pedro
# 2026-10-11), then spot and drill the rod hole while the bore is on the axis.
[[setups]]
id = "S1"
machine = "PM-30MV"
frame = "up"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "stock"

[setups.stock_state]
top_z = 7.9375
bottom_z = 0.0

[setups.hold]
fixture = "rotary-table-6"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
clamps = [
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [-50.0, 3.55, 7.9375], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [50.0, 3.55, 7.9375], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
]
clamp_order = [1, 2]
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "two table strap clamps on the raw top, one each side of the hub 30-70 mm out, inside the table rim"

[setups.zero.x]
edge = "rotary table centre bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "rotary table centre bore"
method = "indicate"
gauge = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
method = "measure_then_set"
gauge = "micrometers/0-1in"
measure = "raw bar thickness (as rolled, both faces raw) at the blank end, with the 0-1 in micrometer before clamping; the top then stands that far above the table"
measure_before_hold = true
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
offset_mm = 0.0
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.zero.tool_touches]]
tool = "center-drills-lms-4859/2"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 10
before_ops = [20]

[[setups.zero.tool_touches]]
tool = "drill-index-115/D"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 20
before_ops = [30]

[[setups.zero.tool_touches]]
tool = "reamers-metric/6.5mm"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 30
before_ops = [40]

[[setups.zero.tool_touches]]
tool = "endmills-lms-6784/3-4in-4fl"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 40
before_ops = [50]

[[setups.zero.tool_touches]]
tool = "center-drills-lms-4859/2"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 50
before_ops = [60]

[[setups.zero.tool_touches]]
tool = "drill-index-115/#47"
z_face = "hub_faces"
edge_mm = 7.497
paper_mm = 0.05
method = "spindle stopped; lower the tool on the hub faces through cigarette paper (0.05) until the paper drags, then Axis Set Z"
after_op = 60
before_ops = [70]

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["#533/ADVANCED_FACE[18]/HAF_HUB_FACES__P02"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 7.497
doc_mm = 0.4405
approach_mm = 5.0
stock_removal_bounds = { x = [-15.0, 15.0], y = [-10.3, 10.3], z = [7.497, 8.5] }
contour = { method = "linear_table", step_mm = 9.0, sweep_frame = "model", sweep_bounds = { x = [-5.4, 5.4], y = [2.6, 13.4], z = [3.52825, 3.96875] } }

[[setups.ops]]
op = 20
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
to_z = 6.0
approach_mm = 3.0

[[setups.ops]]
op = 30
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-r8"
to_z = -2.5
approach_mm = 3.0

[[setups.ops]]
op = 40
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
to_z = -1.5
approach_mm = 3.0

[[setups.ops]]
op = 50
do = "finish_profile"
feature = "hub_od"
faces = ["#75/ADVANCED_FACE[1]/HAF_HUB_OD__P02", "#463/ADVANCED_FACE[15]/HAF_HUB_OD__P02"]
tool = "endmills-lms-6784/3-4in-4fl"
holder = "r8-collets-lms-4860/3-4in"
direction = "climb"
to_z = 5.21875
doc_mm = 1.0
approach_mm = 3.0
contour = { method = "rotary_table", step_deg = 90.0, centre_by = "indicate", centre_feature = "pivot_bore" }

[[setups.ops]]
op = 60
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
to_z = 7.2
approach_mm = 3.0

[[setups.ops]]
op = 70
do = "drill"
feature = "rod_hole"
tool = "drill-index-115/#47"
holder = "drill-chuck-r8"
to_z = -1.0
approach_mm = 3.0

