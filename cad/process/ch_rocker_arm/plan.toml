id = "T1"
machine = "PM-30MV"
frame = "SU"
coolant = "cutting oil, brushed on"
deburr_mm = 0.0
deburr_cite = ["AUTHOR'S CHOICE: the hub hole's two entry edges stay sharp, burrs removed with no break, so the pressed hub root is a corner (R0.2 MAX), not a groove; joint_features.strap_hole states the sharp mouths that J1's forms = [\"hub_root\"] reads"]
