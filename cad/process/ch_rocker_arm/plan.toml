# ch_rocker_arm (MHA-CH-006) prechips route v3: BUILT UP (harmonic-analyzer #1577).
# The finished arm's drawing permits two-piece construction
# (ch_rocker_arm_notes.BUILT_UP_PERMISSION_NOTE, exported as construction = built_up_permitted):
# a turned hub (MHA-CH-012, ch_rocker_hub_spec) pressed into a flat strap (MHA-CH-013,
# ch_rocker_strap_spec), H7/r6 (ch_rocker_hub_fit, user ruling 2026-10-17). One plan, one
# traveler: the hub and strap sheets carry no feature bundle of their own, and the joined
# lineage is what the post-press setups cut, so both branches live here as
# [[stock.components]] joined at J1.
#
# Route (user ruling 2026-10-16, local brief rocker-trammel-plan.md):
#   H1  lathe: face, turn the Ø10.2 r6 land, drill the supply bore, part off oversize
#       (the parted-off end_face has no stock state yet: prechips #292)
#   S0  mill: face the strap both sides 3 -> 2.5 on the taped sub-plate (S0A, S0B; user
#       ruling 2026-10-17, shop record PR #1594)          check errors: prechips #294, #295
#   T1  mill vise: spot, drill, ream the Ø10.2 H7 hub hole
#       (headroom errors on the 290 mm vise base vs 222.25 mm Y travel: prechips #297)
#       CL/CR tooling holes in the end waste                        BLOCKED: prechips #293
#   T2  4x6 bandsaw: rough R800/R816 to the scribed line +1        BLOCKED: prechips >0.1.2 (#249, merged #286)
#   T3  oblique trammel jig TL-000: R800 then R816                  BLOCKED: prechips #255/#269 (PRs #258/#267/#278)
#   T4  bandsaw: saw the end waste off                              BLOCKED: follows T3
#   T5  mill vise: both angled tip lands                            BLOCKED: follows T4
#   J1  bench vise: press the hub in
#   P1  mill: indicate the hub OD, ream Ø6.5, face hub side A, spot and drill the #47
#   P2  mill: flip, face hub side B to length
#   F1  bench: deburr, inspect, black oxide
# Each BLOCKED setup is left out until the prechips release that expresses it is pinned; the
# plan does not work around a missing prechips feature.
#
# Coordinates: the model frame is the manifest's (pivot axis at model X0 Y8, hub centred on
# Z0, strap datum B at Z+1.25). Setup frames are plan frames below. Face references are bare
# HAF labels; _process_plans.bind_plan binds them to the exported STEP's exact faces.
part = "ch-rocker-arm"
features = "../../out/features/ch_rocker_arm/features.toml"
construction = "built_up"   # ch_rocker_arm_notes.BUILT_UP_PERMISSION_NOTE; ch_rocker_hub_fit (user ruling 2026-10-16)

[drawing]
number = "MHA-CH-006"
revision = "v43"
cite = ["harmonic-analyzer/cad/config/parts/ch-rocker-arm.yaml:ch-rocker-arm.number", "harmonic-analyzer/cad/config/release.yaml:next_revision"]

[dro]
controller = "el400"
manual = "Electronica EL400 Operation Manual"
manual_url = "https://www.dropros.com/documents/EL400%20OpManual.pdf"
mode = "abs"

[dro.direction]
x = "right"
y = "away"
z = "up"

[stock]
form = "built_up"
material = "1018 low-carbon steel"
drawing_material = "AISI 1018 low-carbon steel"
on_hand = false
as_is_faces = []
note = "Two components: a 7/16 in cold-finish 1018 round for the hub (MHA-CH-012) and a 3 x 40 mm 1018 flat for the strap (MHA-CH-013), pressed together at J1."
cite = [
  "harmonic-analyzer/cad/config/parts/ch-rocker-hub.yaml:ch-rocker-hub.material_specification (AISI 1018 cold-finish round)",
  "harmonic-analyzer/cad/config/parts/ch-rocker-strap.yaml:ch-rocker-strap.material_specification (AISI 1018 flat, 3 x 40 mm)",
]

[[stock.components]]
id = "hub"
form = "round_bar"
dia_mm = 11.1125
length_mm = 40.0
origin_mm = [0.0, 8.0, 5.2]
axis = [0.0, 0.0, -1.0]
note = "AUTHOR'S CHOICE: 7/16 in cold-finish round over the Ø10.229 land: 1.0 to face, the 8.4 supply hub (ch_rocker_hub_spec SUPPLY_LENGTH_MIN 8.2), the 1.59 parting blade, 4.0 clear of the jaws and a 25 mm grip."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py:SUPPLY_LENGTH_MIN"]

[[stock.components]]
id = "strap"
form = "flat_bar"
section_mm = [40.0, 3.0]
length_mm = 350.0
origin_mm = [-175.0, -6.0, -1.5]
axis = [1.0, 0.0, 0.0]
section_axis = [0.0, 1.0, 0.0]
note = "AUTHOR'S CHOICE: the 350 x 40 x 3 strap blank of the trammel jig (ch_rocker_arm_tl_oblique_trammel_spec BLANK), model Y -6..34 so the 29.3 mm arm sits 6 inside each long edge; 3 mm faced to 2.5 at S0."
cite = ["AUTHOR'S CHOICE", "harmonic-analyzer/cad/config/parts/ch-rocker-strap.yaml:ch-rocker-strap.material_specification"]

# Lathe, hub: origin on the faced hub top end (model Z+4.2), +Z toward the exposed end.
[frames.HL]
origin = [0.0, 8.0, 4.2]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: hub axis = spindle axis; Z0 on the faced top end (op 10); +Z toward the tailstock"
cite = ["AUTHOR'S CHOICE", "features.toml pivot_bore.at [0, 8, 0]"]

# Mill, strap datum-B side up: Z0 on the raw underside, which lies on the taped sub-plate.
[frames.SA]
origin = [0.0, 8.0, -1.5]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: X0 Y0 on the hub axis (model X0 Y8), Z0 on the raw strap underside on the tape"
cite = ["AUTHOR'S CHOICE"]

# Mill, strap turned over about X: Z0 on the faced datum B, which lies on the taped sub-plate.
[frames.SB]
origin = [0.0, 8.0, 1.25]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: turned over about X; Z0 on the S0A-faced datum B, now on the tape"
cite = ["AUTHOR'S CHOICE", "features.toml strap_datum_b z +1.25"]

# Mill, datum B up, Z0 on the finished strap underside.
[frames.SU]
origin = [0.0, 8.0, -1.25]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: datum B up; Z0 on the finished strap underside (model Z-1.25)"
cite = ["AUTHOR'S CHOICE", "features.toml strap_faces z -1.25"]

# Mill, turned over: Z0 on datum B (model Z+1.25), datum B down.
[frames.SD]
origin = [0.0, 8.0, 1.25]
x = [1.0, 0.0, 0.0]
y = [0.0, -1.0, 0.0]
z = [0.0, 0.0, -1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: turned over about X; Z0 on datum B (model Z+1.25), datum B down"
cite = ["AUTHOR'S CHOICE", "features.toml strap_datum_b z +1.25"]

# Bench: the model frame.
[frames.BM]
origin = [0.0, 8.0, 0.0]
x = [1.0, 0.0, 0.0]
y = [0.0, 1.0, 0.0]
z = [0.0, 0.0, 1.0]
binding = "nominal"
note = "AUTHOR'S CHOICE: bench frame on the hub axis at the strap mid-plane"
cite = ["AUTHOR'S CHOICE"]

# The hub's two supply ends: faced at H1 (top) and parted at H1 (bottom). Neither is a
# drawing surface: P1 and P2 face both to the finished hub_faces after the press.
[process_features.hub_supply_top]
kind = "end_face"
at = [0.0, 8.0, 4.2]
axis = [0.0, 0.0, -1.0]
note = "the hub supply's top end, faced square at H1; 0.6718 over the finished hub face"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py:SUPPLY_LENGTH_MIN, FACE_STOCK"]

[process_features.hub_supply_bottom]
kind = "end_face"
at = [0.0, 8.0, -4.2]
axis = [0.0, 0.0, 1.0]
note = "the hub supply's bottom end, parted off at H1; 0.6718 over the finished hub face"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py:SUPPLY_LENGTH_MIN, FACE_STOCK"]

# The press joint (ch_rocker_hub_fit): strap hole H7, hub land r6 on the 10.20 nominal
# (user ruling 2026-10-17: H7/r6, 0.005-0.034 diametral interference). ISO 286-2 over 10
# up to 18: H7 0/+0.018, r6 +0.023/+0.034.
[joint_features.strap_hole]
kind = "cylinder_bore"
component = "strap"
at = [0.0, 8.0, 1.25]
axis = [0.0, 0.0, -1.0]
dia = [10.200, 10.218]
nominal_dia = 10.209
depth = 2.5
thru = true
requirements = ["dia"]
precision = { dia = 3 }
note = "MHA-CH-013's Ø10.20 H7 hub hole, through the faced 2.5 strap"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_fit.py:STRAP_HOLE_BAND", "harmonic-analyzer/cad/scripts/ch_rocker_strap_spec.py:HOLE_DIA"]

[joint_features.hub_land]
kind = "cylinder_spigot"
component = "hub"
at = [0.0, 8.0, 4.2]
axis = [0.0, 0.0, -1.0]
dia = [10.223, 10.234]
nominal_dia = 10.2285
depth = 8.4
thru = false
requirements = ["dia"]
precision = { dia = 3 }
note = "MHA-CH-012's Ø10.20 r6 land, the hub's whole length; it is also the finished hub_od"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_fit.py:HUB_LAND_BAND (user ruling 2026-10-17: H7/r6)", "harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py"]

# ---------------------------------------------------------------------------------------
# H1: lathe, hub. Face the bar end, turn the land, drill the supply bore, part off.
[[setups]]
id = "H1"
machine = "PM-1127VF-LB"
frame = "HL"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "stock.hub"

[setups.stock_state]
od_mm = 11.1125
north_end_z = 1.0
south_end_z = -39.0

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "none"
grip_on = "plain bar behind the jaw fronts"
grip_mm = 25.0
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
stop = "AUTHOR'S CHOICE: sawn end 15 mm out of the jaw fronts, checked with a steel rule before tightening"
clamp = "tighten the chuck key by hand at all three pinions; remove the key"
stickout_mm = 15.0
pose = { origin_mm = [0.0, 0.0, -14.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
jaw_clock_deg = 0.0

[setups.zero.x]
feature = "spindle_axis"
edge_mm = 0.0
from = "+x"
method = "trial_cut_measure"
tool = "hss-toolbit-3-8-rh"
gauge = "micrometers/0-1in"
check_jog_mm = 10.0

[setups.zero.z]
face = "hub bar end (sawn)"
edge_mm = 1.0
from = "+z"
method = "touch the sawn end with the spindle running until the first chip shows; no paper: the end is faced off at op 10"
tool = "hss-toolbit-3-8-rh"
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "face"
feature = "hub_supply_top"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0
to_dia = 0.0
direction = "radially_inward"

[[setups.ops]]
op = 20
do = "rough_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.3
z_to = -10.5
rough_allowance_mm = 0.2
doc_mm = 0.25
direction = "toward_chuck"

[[setups.ops]]
op = 30
do = "finish_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.3
z_to = -10.5
doc_mm = 0.1
direction = "toward_chuck"

[setups.ops.checks]
dia = "micrometers/0-1in"

[[setups.ops]]
op = 40
do = "spot"
feature = "pivot_bore"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 1.5
approach_mm = 3.0

[[setups.ops]]
op = 50
do = "drill"
feature = "pivot_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 10.5
approach_mm = 3.0

[[setups.ops]]
op = 60
do = "part_off"
feature = "hub_supply_bottom"
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
to_z = -8.4
direction = "plunge_radial"

# ---------------------------------------------------------------------------------------
# S0A: mill table, strap blank taped to the faced sub-plate (user ruling 2026-10-17: face
# first on a vacuum/double-sided-tape hold). Face datum B (the +Z face) 3.0 -> 2.75 end to end.
[[setups]]
id = "S0A"
machine = "PM-30MV"
frame = "SA"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "stock.strap"

[setups.stock_state]
top_feature = "unknown"
top_z = 3.0
bottom_z = 0.0

[setups.hold]
fixture = "thin-part-tape-subplate"
pose = { origin_mm = [0.0, 6.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
method = "tape"
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "AUTHOR'S CHOICE: the raw underside taped over its whole length to the sub-plate, which is clamped to the table at its ends and faced in place; roll the blank down"

[setups.zero.x]
edge = "left blank end"
edge_mm = -175.0
from = "-x"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "front long edge of the blank"
edge_mm = -14.0
from = "-y"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "raw top of the right blank end, at X+160 Y+6"
edge_mm = 3.0
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_datum_b"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 2.75
doc_mm = 0.25
approach_mm = 5.0
stock_removal_bounds = { x = [-181.0, 181.0], y = [-14.5, 26.5], z = [2.75, 3.5] }
contour = { method = "linear_table", step_mm = 7.0, sweep_frame = "model", sweep_bounds = { x = [-181.0, 181.0], y = [-8.0, 36.0], z = [1.25, 1.5] } }

# ---------------------------------------------------------------------------------------
# S0B: peeled, turned over about X and re-taped datum B down; face the lower strap face to 2.5.
[[setups]]
id = "S0B"
machine = "PM-30MV"
frame = "SB"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S0A"

[setups.stock_state]
top_feature = "unknown"
top_z = 2.75
bottom_z = 0.0

[setups.hold]
fixture = "thin-part-tape-subplate"
pose = { origin_mm = [0.0, -6.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
method = "tape"
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "AUTHOR'S CHOICE: peel, clean, turn over about X; tape the faced datum B over its whole length to the sub-plate and roll it down"

[setups.zero.x]
edge = "left blank end"
edge_mm = -175.0
from = "-x"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "front long edge of the blank (the S0A back edge)"
edge_mm = -26.0
from = "-y"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "raw top of the right blank end, at X+168 Y-6"
edge_mm = 2.75
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "strap_faces"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 2.5
doc_mm = 0.25
approach_mm = 5.0
stock_removal_bounds = { x = [-181.0, 181.0], y = [-26.5, 14.5], z = [2.5, 3.25] }
contour = { method = "linear_table", step_mm = 7.0, sweep_frame = "model", sweep_bounds = { x = [-181.0, 181.0], y = [-8.0, 36.0], z = [-1.5, -1.25] } }

[setups.ops.checks]
thickness = "micrometers/0-1in"

# ---------------------------------------------------------------------------------------
# T1: mill vise, datum B up on parallels, the jaws on the two long edges. Spot, drill and
# ream the Ø10.2 H7 hub hole.
[[setups]]
id = "T1"
machine = "PM-30MV"
frame = "SU"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "S0B"

[setups.stock_state]
top_feature = "strap_datum_b"
top_z = 2.5
bottom_z = 0.0

[setups.stock_state.entry_z]
strap_hole = 2.5

[setups.stock_state.local_thickness]
strap_hole = 2.5

[setups.hold]
fixture = "vise-pm-6"
support = "none"
grip_on = "AUTHOR'S CHOICE: the strap's two long edges, the hub hole centred in the jaws"
grip_mm = 2.5
fixed_jaw = "rear"
jaws_along = "x"
parallels = "parallels-lms-6745/1in"
parallels_along = "x"
parallels_centres_mm = [[0.0, -10.0], [0.0, 22.0]]
jaw_above_parallels_mm = 19.546
jaw_center_along_mm = 0.0
align = { indicator = "dti", limit_mm = 0.02, over_mm = 120.0, face = "fixed jaw", cite = "AUTHOR'S CHOICE: the vise goes back on after the S0 sub-plate; square the fixed jaw to X within 0.02 over 120 so the T1 hole and the strap edges share one X axis" }
stop = "AUTHOR'S CHOICE: none; X from the edge finder on the left strap end"
clamp = "AUTHOR'S CHOICE: tap the strap down on the two 1 in parallels and tighten; the 350 mm strap overhangs the jaws both sides"

[setups.zero.x]
edge = "left strap end"
edge_mm = -175.0
from = "-x"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.y]
edge = "front long edge (against the moving jaw)"
edge_mm = -14.0
from = "-y"
method = "edge_find"
tool = "edge-finder"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "datum B beside the hole, at X+20"
edge_mm = 2.5
method = "paper"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "spot"
feature = "strap_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 1.5
approach_mm = 3.0

[[setups.ops]]
op = 20
do = "drill"
feature = "strap_hole"
tool = "drills-metric/9.5mm"
holder = "drill-chuck-r8"
exit_mm = 1.0
approach_mm = 3.0

[[setups.ops]]
op = 30
do = "ream"
feature = "strap_hole"
tool = "reamers-metric/10.2mm"
holder = "drill-chuck-r8"
exit_mm = 1.0
approach_mm = 3.0

[setups.ops.checks]
dia = "bore-gauge-small"

# ---------------------------------------------------------------------------------------
# J1: fitting bench, bench vise. Press the hub into the strap hole, centred in the strap.
[[setups]]
id = "J1"
machine = "fitting-bench"
frame = "BM"
stock_in = ["T1", "H1"]
coolant = "none: bench assembly"
deburr_mm = 0.0
deburr_cite = ["AUTHOR'S CHOICE: a press fit cuts no edges"]

[setups.stock_state]
top_z = 4.2
bottom_z = -4.2

[setups.joint]
kind = "cylindrical"
socket = "strap_hole"
spigot = "hub_land"
fit = "interference"
interference_mm = [0.005, 0.034]   # H7/r6, user ruling 2026-10-17
method = "press"
process = "AUTHOR'S CHOICE: press in the bench vise between soft jaws, the hub centred in the strap thickness"
cite = ["harmonic-analyzer/cad/scripts/ch_rocker_hub_fit.py:PRESS_INTERFERENCE (user rulings 2026-10-16: press fit in the vise; 2026-10-17: H7/r6)"]

[setups.hold]
fixture = "bench-vise-4in"
support = "none"
grip_on = "AUTHOR'S CHOICE: the hub's two supply ends, between soft jaws"
grip_mm = "not_applicable"
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = { origin_mm = [0.0, 0.0, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
stop = "AUTHOR'S CHOICE: a 2.95 spacer under the strap sets the hub's stand-out equal both sides"
clamp = "none"

[[setups.ops]]
op = 10
do = "inspect"
feature = "hub_od"
note = "Bore-gauge the strap hole and mic the hub land: land minus hole must read 0.005-0.034."

[setups.ops.checks]
dia = "micrometers/0-1in"

[[setups.ops]]
op = 20
do = "fit"
feature = "hub_od"
note = "Start the hub square in the hole by hand, then close the vise on the two hub ends with the strap on the 2.95 spacer until the hub stands out equally both sides (caliper: 2.95 each side)."

# ---------------------------------------------------------------------------------------
# P1: mill vise, datum B up on parallels clear of the hub (the hub hangs between them);
# indicate the hub OD, ream the pivot bore, face hub side A, spot and drill the #47.
[[setups]]
id = "P1"
machine = "PM-30MV"
frame = "SU"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "J1"

[setups.stock_state]
top_feature = "unknown"
top_z = 5.45
bottom_z = -2.95

[setups.stock_state.entry_z]
pivot_bore = 5.45
rod_hole = 2.5

[setups.stock_state.local_thickness]
pivot_bore = 8.4
rod_hole = 2.5

[setups.hold]
fixture = "vise-pm-6"
support = "none"
grip_on = "AUTHOR'S CHOICE: the strap's two long edges, the hub centred in the jaws"
grip_mm = 2.5
fixed_jaw = "rear"
jaws_along = "x"
parallels = "parallels-lms-6745/1in"
parallels_along = "x"
parallels_centres_mm = [[0.0, -10.0], [0.0, 22.0]]
jaw_above_parallels_mm = 19.546
jaw_center_along_mm = 0.0
stop = "AUTHOR'S CHOICE: none; X and Y indicated on the hub OD"
clamp = "AUTHOR'S CHOICE: datum B up on the two 1 in parallels, which stand clear of the lower hub either side; tap down and tighten"

[setups.zero.x]
feature = "hub_od"
edge_mm = 0.0
from = "indicated"
method = "indicate_axis"
tool = "dti"
check_jog_mm = 10.0

[setups.zero.y]
feature = "hub_od"
edge_mm = 0.0
from = "indicated"
method = "indicate_axis"
tool = "dti"
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "datum B at X+20"
edge_mm = 2.5
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["HAF_HUB_FACES__P02"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 4.77825
doc_mm = 0.67175
approach_mm = 5.0
stock_removal_bounds = { x = [-10.5, 10.5], y = [-10.5, 10.5], z = [4.77825, 5.5] }
contour = { method = "linear_table", step_mm = 7.0, sweep_frame = "model", sweep_bounds = { x = [-6.0, 6.0], y = [2.0, 14.0], z = [3.52825, 4.2] } }

[[setups.ops]]
op = 20
do = "ream"
feature = "pivot_bore"
tool = "reamers-metric/6.5mm"
holder = "drill-chuck-r8"
exit_mm = 1.0
approach_mm = 3.0

[[setups.ops]]
op = 30
do = "spot"
feature = "rod_hole"
tool = "center-drills-lms-4859/2"
holder = "drill-chuck-r8"
depth_mm = 0.74
approach_mm = 3.0

[[setups.ops]]
op = 40
do = "drill"
feature = "rod_hole"
tool = "drill-index-115/#47"
holder = "drill-chuck-r8"
exit_mm = 0.4
approach_mm = 3.0

# ---------------------------------------------------------------------------------------
# P2: turned over about X; face hub side B to the finished length.
[[setups]]
id = "P2"
machine = "PM-30MV"
frame = "SD"
coolant = "cutting oil, brushed on"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "P1"

[setups.stock_state]
top_feature = "unknown"
top_z = 5.45
bottom_z = -2.27825

[setups.hold]
fixture = "vise-pm-6"
support = "none"
grip_on = "AUTHOR'S CHOICE: the strap's two long edges, the hub centred in the jaws"
grip_mm = 2.5
fixed_jaw = "rear"
jaws_along = "x"
parallels = "parallels-lms-6745/1in"
parallels_along = "x"
parallels_centres_mm = [[0.0, -22.0], [0.0, 10.0]]
jaw_above_parallels_mm = 19.546
jaw_center_along_mm = 0.0
stop = "AUTHOR'S CHOICE: none; X and Y indicated in the reamed pivot bore"
clamp = "AUTHOR'S CHOICE: turned over about X, datum B down on the two 1 in parallels, which stand clear of the faced hub either side; tap down and tighten"

[setups.zero]
transfer = { from = "P1", indicate = ["pivot_bore"], gauge = "dti", runout_limit_mm = 0.02 }

[setups.zero.x]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
tool = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.y]
edge = "pivot_bore"
method = "indicate"
gauge = "dti"
tool = "dti"
from = "indicated"
edge_mm = 0.0
check_jog_mm = 10.0

[setups.zero.z]
face = "top"
edge = "strap face at X+20"
edge_mm = 2.5
method = "paper"
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
paper_mm = 0.05
check_jog_mm = 1.0
retouch_after = []

[[setups.ops]]
op = 10
do = "finish_face"
feature = "hub_faces"
faces = ["HAF_HUB_FACES__P01"]
tool = "endmills-lms-6784/3-8in-4fl"
holder = "r8-collets-lms-4860/3-8in"
direction = "climb"
to_z = 4.77825
doc_mm = 0.67175
approach_mm = 5.0
stock_removal_bounds = { x = [-10.5, 10.5], y = [-10.5, 10.5], z = [4.77825, 5.5] }
contour = { method = "linear_table", step_mm = 7.0, sweep_frame = "model", sweep_bounds = { x = [-6.0, 6.0], y = [2.0, 14.0], z = [-4.2, -3.52825] } }

[setups.ops.checks]
length = "micrometers/0-1in"

# ---------------------------------------------------------------------------------------
# F1: finishing bench. Deburr, inspect, send out for black oxide.
[[setups]]
id = "F1"
machine = "finishing-bench"
frame = "BM"
coolant = "none"
deburr_mm = 0.25
deburr_cite = "features.toml general_tolerances edge_break R0.25"
stock_in = "P2"

[setups.stock_state]
top_z = 3.52825
bottom_z = -3.52825

[setups.hold]
fixture = "finishing-rest-plate"
pose = { origin_mm = [0.0, 0.0, -3.52825], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] }
fixed_jaw = "not_applicable"
grip_mm = "not_applicable"
stop = "none"
clamp = "none"

[[setups.ops]]
op = 10
do = "deburr"
feature = "profile_outer"

[[setups.ops]]
op = 20
do = "inspect"
feature = "pivot_bore"
checks = { dia = "pin-gauges", thru = "pin-gauges", finish_ra = "roughness-comparator", process = "pin-gauges" }

[[setups.ops]]
op = 40
do = "inspect"
feature = "hub_od"
checks = { dia = "micrometers/0-1in", coaxiality_dia = "dti" }
inspection_methods = { coaxiality_dia = "Datum A: arm on a Ø6.5 pin gauge in the reamed bore, pin held in V-blocks on the surface plate; sweep each hub OD half with the DTI while turning the arm on the pin; coaxiality = full indicator movement" }

[[setups.ops]]
op = 50
do = "inspect"
feature = "hub_faces"
checks = { length = "micrometers/0-1in" }

[[setups.ops]]
op = 60
do = "inspect"
feature = ["strap_faces", "strap_datum_b"]
checks = { thickness = "micrometers/0-1in" }

[[setups.ops]]
op = 100
do = "coating"
feature = "profile_outer"
process = "black-oxide-vendor"
