# S5: fitting bench, the work on the shop-made filing stand (two end blocks under the raw
# blank ends, a pedestal under the lower hub face), a clamp across each blank end and one on
# the upper hub face. The arm outline template (gauges.arm-outline-template, a shop-made
# gauge; its TL-13 CAD part is retired) is laid on the work pinned in the
# reamed bore by the 0.2558 in Class X minus pin gauge (gauges.vermont-class-x-2558-minus)
# and clocked by the 0.0780 in Class ZZ minus pin gauge (gauges.pin-gauges) through its
# radial rod slot into the #47 rod-pin hole, whenever it scribes (ops 10-20) or gauges (ops
# 70-100). Scribe the outline from it (ops 10-20), break out the chain-drill webs (ops
# 30-40), hacksaw through the two taper-and-land tabs just outside the scribed line (ops
# 50-60) and file the outline, tapers and tip lands included, to the line (ops 70-100). The
# clamped hub holds the arm and the clamped ends hold the frame when the tabs part. prechips
# 0.1.2 has no break-out or hand-saw action (break-out phase: prechips#213; saw_cut needs a
# bandsaw and one cut plane, and any action outside its bench set would put the DRO, zero
# and headroom screens back on this bench setup), so ops 30-60 are bench `deburr` steps
# whose note is the printed instruction.
