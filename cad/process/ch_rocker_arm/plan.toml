# HELD BUILT-UP ROUTE: not qualified manufacturing instructions.
# Not enrolled in _process_plans.TRAVELER_STEMS; no released traveler is claimed.
# Current CAD source is v48; exact delivered v47 example inputs are not a v48 export.
# Combined manufacture of MHA-CH-12 hub and MHA-CH-13 strap, then press as MHA-CH-06.
# Current drawing reservation is v48; the immutable delivered example v47 pair is not
# a current v48 export. Bind bare HAF labels to the future current HA feature export.
# All dimensions are physical millimetres, including conversions of the inch drawings.
# HOLD: bought stock has not been received/measured; thin-part fixtures, trammel, press
# support, tight socket sizing/metrology and final geometric inspection are not established.
# Unknown fields are intentional safety debt, not substitutions for manufactured geometry.
# All numeric geometry, stock states, cutting parameters and frame registrations below
# are authored proposals, not observed measurements or accepted physical installations.
# Actual fixture solids/poses, supports, clamp geometry/torque, calibration and readings
# must be established before use. Inventory identity alone does not qualify capability.
# A guided trammel sweep cannot pass travel/headroom in the current model (docs/plan.md
# 2829-2831); commissioning and full moving-envelope acceptance remain mandatory.
# Component process facts below are not fabricated CAD exports or finished-face identities.
# Component supply dimensions without exported requirement identities are written checks;
# they must not be represented as invented manifest requirements or metrology capability.
