# its own weight; op 97's profile check lies the arm on its template on the granite instead.
# Op 30's A|B|C position check is not done on it either: the part goes onto the
# angle-plate fixture that op 30's procedure and inspection views declare (inventory
# fixtures.angle-plate, ledge removed, with the pivot bracket's shop-made two-stud bridge clamp,
# which left the shared shop inventory in d35921851 and returns with the bracket's migration).
