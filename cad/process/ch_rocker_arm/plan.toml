[stock]
form = "built_up"
material = "AISI 1018 low-carbon steel"
drawing_material = "AISI 1018 low-carbon steel"
material_verify = true
on_hand = false
as_is_faces = []
prerequisite = "Confirm receipt, grade and actual section before sawing: OM4807 1/8 x 1-1/2 in flat for each strap, and ordered OM4793 1/2 in 1018 round for each hub. Catalogue nominal is not an on-hand measurement. Saw strap blanks 354 mm long and hub blanks 42 mm long; remove saw burrs. Use the bandsaw and blade only after stock section, tooth engagement, speed and holding are confirmed."
note = "ONE combined route, two material-disjoint branches. H1 plans hub manufacture with a partial powered parting cut and an explicit held, unmodeled manual-sever handoff; it does not establish a completed separated component. P1/P1E/P2/P2E complete both entire blank planes before P3 squares the strap blank; T1 makes the socket and waste locating holes; R1/R2 rough, T2/T3 finish the arcs on the extant oblique trammel; T4A/T4B/T4C/T4 clock and mill lands/tapers and remove waste; J1 presses; F1/F2 finish the joined hub and bore; D1 drills the rod hole; I1/B1 inspect and finish. No separately imported component bundles. Raw longitudinal strap edges remain scrap, not claimed finished/as-is faces. Actual HA inventory identity and measurement provenance govern; this held proposal does not establish shop capability."
cite = ["AUTHOR'S CHOICE: illustrative process proposal; not a measurement or approval", "harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py:1-70", "harmonic-analyzer/cad/scripts/ch_rocker_strap_spec.py:1-97", "harmonic-analyzer/cad/process/shop/inventory.toml:6480-6489,6687-6694"]

