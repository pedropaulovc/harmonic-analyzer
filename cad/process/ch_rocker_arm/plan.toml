[setups.stock_state]
top_feature = "strap_datum_b"
top_z = 2.5
bottom_z = 0.0

[setups.stock_state.entry_z]
strap_hole = 2.5
cl_tooling_hole = 2.5
cr_tooling_hole = 2.5

[setups.stock_state.local_thickness]
strap_hole = 2.5
cl_tooling_hole = 2.5
cr_tooling_hole = 2.5

[setups.hold]
