  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [-164.0, -6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "clamping-kit-lms-1144/strap-pad", restraint = "press", pose = { origin_mm = [164.0, -6.65, 7.9375], x = [0.0, 1.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "strap-shim-stack", restraint = "none", note = "under the strap at X-120", pose = { origin_mm = [-120.0, -8.96, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
  { ref = "strap-shim-stack", restraint = "none", note = "under the strap at X-45", pose = { origin_mm = [-45.0, -1.26, 0.0], x = [1.0, 0.0, 0.0], z = [0.0, 0.0, 1.0] } },
