# H1 — Manufacture MHA-CH-12 hub supply from ordered1/2in1018 round; not from finished purchased hub.
[[setups]]
id = "H1"
machine = "PM-1127VF-LB"
frame = "H_FRONT"
stock_in = "stock.hub"
note = "Manufacture MHA-CH-12 hub supply from ordered 1/2 in 1018 round; not from finished purchased hub."
coolant = "cutting oil brushed on"
deburr_mm = 0.0 # Preserve sharp press land; remove loose burrs without an edge break.

[setups.hold]
fixture = "chuck-3jaw-6-d1-4"
support = "unknown"
grip_on = "last25mm of raw1/2in bar; no finished thin sleeve clamping"
grip_mm = 25.0
stickout_mm = 17.0
fixed_jaw = "not_applicable"
jaws_along = "not_applicable"
parallels = "not_applicable"
jaw_above_parallels_mm = "not_applicable"
pose = "unknown"
jaw_clock_deg = "unknown"
stop = "Rule-set17mm raw stickout; confirm actual blank length42 before clamping the last 25 mm of raw bar."
clamp = "Tighten chuck pinions and remove key; indicate raw OD. The powered cut in op 70 must leave its declared web. Stop and isolate the spindle and withdraw the blade before op 80. HOLD the actual manual cutting tool, non-damaging sleeve retention, catch-tray placement and hand access until qualified; never reach into rotating work or use a captive mandrel."

[setups.stock_state]
od_mm = 12.7
north_end_z = 2.0
south_end_z = -40.0

[setups.zero.x]
method = "trial_cut_measure"
gauge = "micrometers/0-1in"
tool = "hss-toolbit-3-8-rh"
check_jog_mm = 0.5

[setups.zero.z]
face = "raw front"
method = "paper"
paper_mm = 0.05
tool = "hss-toolbit-3-8-rh"
edge_mm = 2.0
check_jog_mm = 2.0
retouch_after = [20, 30]

[[setups.zero.tool_touches]]
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
before_ops = [70]
x_face = "hub_land"
x_method = "paper"
x_paper_mm = 0.05
gauge = "micrometers/0-1in"
z_face = "hub_supply_front"
method = "paper"
paper_mm = 0.05
edge_mm = 0.0
corner = "chuck_side"
check_jog_mm = 2.0

[[setups.ops]]
op = 10
do = "face"
feature = "hub_supply_front"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
to_z = 0.0
doc_mm = 0.5
feed_mm_rev = 0.05
direction = "toward_axis"
note = "Face raw front to supply datum; touch Z again on the new clean face. Leave final hub face stock."

[[setups.ops]]
op = 20
do = "rough_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -9.10
to_dia = 10.4
rough_allowance_mm = 0.21206
doc_mm = 0.4
feed_mm_rev = 0.08
direction = "toward_chuck"
note = "Turn the full retained 8.50mm supply, not merely strap engagement. Proposed R0.40mm tool nose plus 0.20mm cleanup margin extends the command to Z-9.10; full cylinder reaches Z-8.70 and terminal blend Z-9.10..-8.70 remains wholly in sacrificial chuck-side waste beyond unchanged part-off Z-8.50. The hub_land diameter band and 8.50mm depth are unchanged. HOLD actual tool nose qualification, stock allowance and endpoint/chuck clearance; these are authored process dimensions, not an observed tool nose or native clearance result."

[[setups.ops]]
op = 30
do = "finish_turn"
feature = "hub_land"
tool = "hss-toolbit-3-8-rh"
holder = "qctp-axa-lms-2280/1-turning-facing"
z_from = 0.0
z_to = -9.10
to_dia = 10.18794
doc_mm = 0.10603
feed_mm_rev = 0.04
direction = "toward_chuck"
checks = { "dia" = "unknown" }
inspection_methods = { "dia" = "HOLD: establish calibrated outside measurement uncertainty suitable for10.18286–10.19302 before finishing. Measure both ends/middle in two directions; every reading, with uncertainty, must fit. Existing example micrometer identity is not proof of this10.16micrometre band." }
note = "Finish retained 8.50mm supply press land .4009-.4013in. Proposed R0.40mm nose plus 0.20mm cleanup margin gives command Z-9.10, full cylinder through Z-8.70 and terminal blend Z-9.10..-8.70 entirely in sacrificial chuck-side waste beyond unchanged Z-8.50 part-off. Land diameter band and depth remain unchanged. Preserve land through later handling; no compound/brazing substitute. HOLD actual nose, allowance and endpoint/chuck-clearance qualification; no shop observation or clearance pass is asserted."

[[setups.ops]]
op = 40
do = "spot"
feature = "hub_supply_bore"
tool = "unknown"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 0.5
feed_mm_rev = 0.03
note = "Spot supply bore on lathe axis before drilling; confirm this selected spot drill geometry and mounting."

[[setups.ops]]
op = 50
do = "drill"
feature = "hub_supply_bore"
tool = "drill-index-115/D"
holder = "drill-chuck-tailstock-mt3"
depth_mm = 10.0
feed_mm_rev = 0.08
note = "Full-diameter DEPTH 10 mm (supply bore 0.246 in); 118 deg letter-D point reaches 11.87721 mm within the 12 mm guard, beyond the 8.50 mm kept sleeve but ahead of the nominal chuck front at 15 mm. Confirm actual point/reach and chuck clearance. Never call this under-size supply bore final datum A."
checks = { "dia" = "unknown" }
inspection_methods = { "dia" = "HOLD actual bore-gauge capability, access and uncertainty. Before partial parting, check the accessible mouth and bore at depths spanning the future supply length in two directions within 6.2484–6.3500 including uncertainty; do not infer bore size from the drill. The rear opening does not yet exist. Repeat the complete two-mouth check in op 90 only after the held manual-sever handoff." }

[[setups.ops]]
op = 60
do = "inspect"
feature = "hub_land"
checks = { "dia" = "unknown" }
inspection_note = "Record land sizes and verify the planned supply window 8.50 >=8.128 mm (.32 MIN), with stock at both final faces. This is a pre-cut window check, not a completed-length measurement. Supply wall from smallest land/largest supply bore is at least 1.91643 mm before final ream. Reject taper, scored land or out-of-band bore; retain lot identification. Actual separated length and both bore openings are checked in op 90 after qualified manual separation."
inspection_methods = { "dia" = "Repeat the qualified land diameter check after cooling and before part-off. No caliper substitution for the .0004in supply band." }

[[setups.ops]]
op = 70
do = "part_off"
feature = "hub_supply_parting"
tool = "parting-blade-lms-1728"
holder = "qctp-axa-lms-2280/7-parting"
to_z = -8.5
# AUTHOR'S CHOICE: maximum supply bore 6.35 + twice a nominal 0.25 mm radial web.
# Actual outside/bore sizes and stop-setting uncertainty remain qualification HOLDs.
to_dia = 6.85
feed_mm_rev = 0.025
doc_mm = 0.1
direction = "toward_axis"
note = "The tailstock-side blade edge locates the proposed kept-end cut at Z -8.50; blade width lies toward the chuck. The front-face paper touch sets the chuck-side edge, so use the derived width-compensated DRO target, not -8.50 as the chuck-side reading. Qualify actual blade width and measure the finished land for the explicit X paper pickup. The stop diameter is an author-selected process choice: maximum supply bore 6.35 plus twice a nominal 0.25 mm radial web, not a CAD dimension or a measured web. HOLD actual outside/bore sizes, stop-setting uncertainty, capture and access. Stop powered feed at the declared diameter; do not continue to X0 or claim a separated sleeve. Stop and isolate the spindle, withdraw the blade and retain the raw bar in the chuck for the separate held handoff."

[[setups.ops]]
op = 80
do = "manual_sever"
feature = "hub_supply_parting"
tool = "unknown"
note = "HOLD — UNMODELED MATERIAL CHANGE. The intended handoff is to sever the residual web only with the spindle stopped and isolated, the powered blade withdrawn and the raw bar still securely chuck-held. Before any hand cutting, qualify the actual manual cutting tool, non-damaging retention of the prospective sleeve, catch-tray placement and hand access. Do not improvise with fingers near a powered chuck, a captive mandrel, or twisting the finished press land. If those prerequisites are met, sever only the remaining sacrificial web, control the stationary sleeve and remove it after separation; dress only the sacrificial parted end without shortening below the supply minimum. No manual removal, separation, finished face or resulting-stock geometry is established by this plan. Downstream joining remains HOLD; the inspection below is a planned check, not a material-state receipt."
note_cite = ["AUTHOR'S CHOICE: explicitly held manual-separation handoff after a partial powered cut; not a physical qualification or CAD requirement", "harmonic-analyzer/cad/scripts/ch_rocker_hub_spec.py:51-64"]

[[setups.ops]]
op = 90
do = "inspect"
feature = ["hub_land", "hub_supply_bore"]
checks = { "hub_land" = { "dia" = "unknown" }, "hub_supply_bore" = { "dia" = "unknown" } }
inspection_methods = { "hub_land" = { "dia" = "HOLD qualified actual outside metrology. After qualified manual separation, repeat both ends/middle in two directions; uncertainty must fit within 10.18286–10.19302. Reject manual-cut damage or distortion; no actual reading is recorded." }, "hub_supply_bore" = { "dia" = "HOLD qualified actual bore metrology. After qualified separation, check both now-accessible mouths and the middle over the entire actual sleeve length in two directions within 6.2484–6.3500 including uncertainty; confirm unobstructed openings without burrs. Instrument selection is not a passing part result." } }
inspection_note = "Record actual separated supply length at least 8.128 mm (.32 MIN), sufficient stock at both later finished hub faces, and repeated land/bore readings. The nominal 8.50 mm window is not a measured length. These planned inspections do not establish the unmodeled resulting stock or authorize pressing; retain the manual-handoff and downstream HOLDs."

