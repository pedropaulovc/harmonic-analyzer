# MHA-SM-02 knife mount (qty 2): a 1.00 × 1.17 × .55 block of 4140/4142 HT,
# pre-hardened 28-32 HRC as supplied, cut and finished in that condition (owner
# ruling 2026-11-10, #2334 option B1: no heat treatment in the shop). Route
# (author's choice, for speed): two blanks and a trial coupon sawn off one
# 5/8 × 1-1/4 bar (stock.4140-ht-flat-5-8x1-1-4, to buy); the bar's thickness
# is the depth (model Z), its width the height (model Y), the sawn length the
# width (model X). Six faces squared in the PM-6 vise on the PM-30MV, one NC
# file per setup: KM01 skims a broad face to the back face K; KM02 faces the
# other to the depth (front face F); KM03 skims the bar edge U; KM04 skims the
# S end (the +X side, datum B's side); KM05 faces the N end to the width;
# KM06 faces the top seat A to the height, spots, drills datum B #30 (owner
# ruling 2026-11-24, fit audit OQ19: no reamer, no plug gauges), and drills
# the #25 tap drill, all from one setup (B ⊥ A
# and the tap's position to B come from it); KM07 brings the Fisher tap guide
# over the tap hole for the #10-24 plug, then bottoming, taps by hand
# (FluidNC cannot rigid-tap; owner ruling 2026-11-17); KM08 lies the block on
# K, gripped on its two ends, S against the fixed jaw, and spots, pilots #25,
# drills 31/64 and reams the .4990 knife bore through: X from A and Y from
# S, the faces B and the tap were placed from, so the bore keeps its .824
# BASIC to A, its .300 to B and its parallelism to A (A was faced square to
# K). That needs S square to A: the saw leaves the ends out of square, so
# KM04 stands U square to the table with the square before it faces S (and
# KM05 faces N parallel to S), and A is faced parallel to U in KM06.
# The drawing locates the bore from A and B; B is placed from S, and the bore
# is placed from S in KM08 by the same edge finder, so their spacing carries
# only the edge finder's repeat (a calipered B station would add more error
# than it removed, so none is applied).
# The trial coupon is faced with the blanks (KM01, KM02) and takes KM08
# first (the reamer record's "trial-cut a scrap of the same bar").
# Cutting data on the hard bar: shop settings *-4140-ht (shop/sm.toml, cited
# there). prechips' force model reads milling_material steel_o1 as a proxy:
# its unit power 0.88 hp·min/in³ and drill Kd 31,000 (steel 300 Bhn) against
# Machinery's Handbook Table 3b for 4140 at 280-320 HB, Kp 0.87-0.91
# (PDF1407/p1086), and Table 8's 300 Bhn row for 271-301 HB; E 207 GPa.
title = "Knife mount"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "4140/4142 HT alloy steel, pre-hardened 28-32 HRC, 5/8 × 1-1/4 in flat (drawing: {{cad.material_spec}})"
stock = "5/8 × 1-1/4 in flat bar, 6 in; {{process.quantity:d}} blanks and 1 trial coupon, each {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in."
shop = "../shop"
stock_refs = ["4140-ht-flat-5-8x1-1-4"]
material_key = "4140-ht-28-32-hrc"
milling_material = "steel_o1"

# The shop's standing page carries what every traveler shares (units, speeds,
# homing, Feed Hold, tool changes, proving a file, burrs); This job says what
# only this knife mount needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Finished", "{{cad.minus_x_side_width_min_in:.3dot}}–{{cad.minus_x_side_width_max_in:.3dot}} wide (S end to N end), {{cad.bottom_face_height_min_in:.3dot}}–{{cad.bottom_face_height_max_in:.3dot}} high (underside U to the top seat A), {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} deep (back face K to front face F)."],
  ["Hard bar", "The bar is pre-hardened (28-32 HRC): every speed here is about half the 1018 jobs'; do not raise them."],
  ["Marks", "A the top seat (datum A), U the underside, F the front face, K the back face, S the end nearest the small hole (datum B), N the other end."],
  ["To buy", "Not on hand, to buy before the job: the bar, the .4990 reamer, the Class ZZ pins (.4985 plus, .500 minus) and the minus and plus pin-gauge sets."],
]

