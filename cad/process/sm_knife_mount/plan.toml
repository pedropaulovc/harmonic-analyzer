]

[[setups.operations]]
instruction = "The coupon T: GO enters and NO-GO does not: unclamp it; blanks 1 and 2 follow, each clamped as the Holding says and this setup run again from its edge-find (X0 on each blank's faced A). NO-GO enters the coupon: stop and tell the owner (the reamer cuts oversize in this bar). GO refused: clear the chips, oil, one more pass by MDI (next op) and gauge again; still refused: stop and tell the owner (the pins refuse this reamer's holes)."
feed = "hand"

[[setups.operations]]
instruction = "T6, the .4990 reamer, still in the 7/16 collet, its tool length active; set 190 by hand; cutting oil. Then MDI:\n1. M3 S190, G0 Z{{process.bore_ream_r_plane_mm:.3f}}\n2. G0 X{{cad.knife_bore_basic_from_a:.3f}} Y-{{process.bore_y_mm:.3f}}\n3. G1 Z{{process.bore_ream_tip_height_mm:.3f}} F{{process.bore_ream_feed_mm_min:.2f}}, G1 Z{{process.bore_ream_r_plane_mm:.3f}}\n4. G0 Z{{process.bore_ream_clear_mm:.3f}}, G0 X-8.000 Y-6.850 (off the block, left of A), M5"
feed = "hand"

[[setups.operations]]
instruction = "A blank 1 or 2 whose GO is refused: clear the chips, oil, re-ream it by the MDI above and gauge again; still refused: reject the block (scrap) and tell the owner. NO-GO enters a part (no cut remedies an oversize bore): it is scrap; stop and tell the owner before reaming the other. Gauged: unclamp; the next blank from this setup's edge-find."
feed = "hand"

