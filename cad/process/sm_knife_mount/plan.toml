instruction = "Same file, M6 T2: spot datum B and the tap hole Ø{{process.spot_dia_mm:in.3dot}}, under both drills; set 700."
settings = "jig-spot-4140-ht"
milling_cuts = [
  { name = "top spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, stations_mm = "{{cad.bottom_face_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-30"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T3: #30 drill datum B, pecks of {{process.dowel_peck_mm:in.3dot}} with full retract, its full diameter to the drawing's {{cad.dowel_hole_depth_in:.2dot}} ({{cad.dowel_hole_depth_min_in:.3dot}}–{{cad.dowel_hole_depth_max_in:.3dot}}); set 1050. Cutting oil. The drill is B's finished size (the title block's DRILLED HOLES row)."
settings = "riser-drill-30-4140-ht"
hole_depth_mm = "{{cad.dowel_hole_depth_mm}}"
peck = { step_mm = 3.048, retract = "full" }
peck_reason = "blind in 28-32 HRC steel and B's finished size (no reamer follows), L/D 2.9: backing out every diameter keeps the #30's chips from packing at the bottom and scoring the drilled wall that locates the hanger"
milling_cuts = [
  { name = "dowel drill", kind = "drill", phase = "finish", cutter_dia_mm = 3.2639, flutes = 2, stations_mm = "{{cad.bottom_face_height_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-25"
drilling = "twist_drill"
sizing = { kind = "tap_drill", tap = "tap-bottom" }
instruction = "Same file, M6 T4: #25 drill the tap hole, pecks of {{process.tap_peck_mm:in.3dot}} with full retract, its full diameter to the drawing's {{cad.stud_tap_drill_depth_in:.3dot}} ({{cad.stud_tap_drill_depth_min_in:.3dot}}–{{cad.stud_tap_drill_depth_max_in:.3dot}}); set 900. Cutting oil."
settings = "drill-25-4140-ht"
hole_depth_mm = "{{cad.stud_tap_drill_depth_mm}}"
peck = { step_mm = 3.556, retract = "full" }
peck_reason = "blind in 28-32 HRC steel, the point about .48 deep (L/D 3.2 to the point): backing out every diameter keeps the #25's chips from packing at the bottom, where a jammed small drill breaks"
milling_cuts = [
  { name = "tap drill", kind = "drill", phase = "finish", cutter_dia_mm = 3.7973, flutes = 2, stations_mm = "{{cad.bottom_face_height_mm}}" },
]

[[setups.operations]]
instruction = "Still clamped, every blank: blow both holes out. Datum B's depth: the #30 drill's shank end down in B, its length less what stands above A (calipers). Its size is the drill's (the title block's DRILLED HOLES row): no gauge."
inspection = "B depth {{cad.dowel_hole_depth_min_in:.3dot}}–{{cad.dowel_hole_depth_max_in:.3dot}}. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.dowel_hole_depth_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "Datum B's pin, every blank: the largest pin of the minus and plus pin-gauge sets that enters B to the bottom. Write its size on this sheet beside the blank's number; it stands in B for every check below and for Setup 9's bore from B."
feed = "hand"

[[setups.operations]]
instruction = "Datum B's stations, B's pin standing in B: calipers outside from S over the pin, less half the pin's written size; then from F the same way. Write each blank's B-from-S reading on this sheet beside its number: Setup 8 places the bore .300 from it. B's squareness to A (the drawing's ⊥) is held by this setup, not measured: A is faced and B drilled in the one clamping."
inspection = "B from S {{cad.dowel_hole_side_min_in:.3dot}}–{{cad.dowel_hole_side_max_in:.3dot}}, from F {{cad.dowel_hole_row_min_in:.3dot}}–{{cad.dowel_hole_row_max_in:.3dot}}. Outside either: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.dowel_hole_side_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.dowel_hole_row_band_mm}}" },
]
feed = "hand"

[[setups.operations]]
instruction = "The tap drill, every blank: the #25 drill's shank end down in it, its length less what stands above A (calipers). The first blank only, its spacing to B: calipers outside over B's pin and the #25 shank, less half the sum of the pin's written size and .1495. The tap's position (the drawing's Ø.005 to A|B|C) is held by the program, B and the tap drilled in this one clamping: the spacing catches a gross error only."
inspection = "Tap drill full Ø depth {{cad.stud_tap_drill_depth_min_in:.3dot}}–{{cad.stud_tap_drill_depth_max_in:.3dot}}; on the first blank, B to the tap hole {{process.tap_from_b_min_mm:in.4dot}}–{{process.tap_from_b_max_mm:in.4dot}}. Outside either: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.stud_tap_drill_depth_band_mm}}" },
  { gauge = "calipers", band_mm = ["{{process.tap_from_b_min_mm}}", "{{process.tap_from_b_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
instruction = "Tap length, before the tap file: each #10-24 tap in the T-handle wrench with the centre hole in its top, from its point to the wrench's centre hole: at most {{process.tap_wrench_reach_max_mm:in.2f}} in. That is the mill's 17 in opening less the vise, the parallels, this part, the collet, the tap guide's 3 1/8 in and 1 in to bring the point down onto the wrench. Longer: stop; do not tap on this setup."
feed = "hand"

[[setups.operations]]
instruction = "The bottoming tap's chamfer, its point to the first full-height thread (calipers): at most {{process.tap_chamfer_max_mm:in.3dot}}; note it as c. Over: stop; do not tap on this setup."
inspection = "Bottoming tap's chamfer c at most {{process.tap_chamfer_max_mm:in.3dot}}, calipers."
gauge_checks = [{ gauge = "calipers", band_mm = [0.0, "{{process.tap_chamfer_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run KM07_stud_tap: M6 T7, the tap guide in the 1/2 in collet, pointed end out, spindle off; the file ends Idle at the machine top over the tap hole."
diagram = { file = "diagrams/tap.svg", alt = "The block on edge in the vise, A up; the #10-24 tap in the T-handle wrench in the tap hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the plug tap's point to go {{process.plug_tap_point_mm:in.3dot}} below A, then the bottoming tap's to {{cad.stud_tap_thread_depth_in:.3dot}} plus its chamfer c." }

[[setups.operations]]
instruction = "Tap depth reference: the DRO's work Z, in inches, with the tap's point standing on A beside the hole and the tap guide's point pushed fully home in the wrench."
instruction_detailed = "MDI G0 X{{process.tap_ref_x_mm:.3f}} (over solid A between B and the tap hole), then send G20: the DRO reads inches. Stand the #10-24 plug tap, in its wrench, on its point on A there; jog Z down until the guide's point is in the wrench's centre hole and pushed fully home. Note the DRO Z. Jog Z up clear, send G21, MDI G0 X{{process.tap_x_mm:.3f}} (over the tap hole), send G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-plug"
drilling = "none"
sizing = "other"
instruction = "Plug tap first, by hand under the tap guide, spindle off, Tapmatic Gold: a half turn back each turn (hard steel: break the chip often); push the guide's point home again before the tap has gone 1/2 in. Read with the point pushed fully home: stop when the DRO Z reads the noted Z less {{process.plug_tap_point_mm:in.3dot}}. Jog Z up clear, back the tap out, blow the hole out."
instruction_detailed = "Tap's point in the hole, a drop of Tapmatic Gold; jog Z down until the guide's point is pushed fully home: the spring then holds the tap square and follows it down. Turn the wrench, a half turn back each turn; push the point home again before the tap has gone 1/2 in. To read, push it fully home: stop at the noted Z less {{process.plug_tap_point_mm:in.3dot}}, short of the drill's full diameter. Jog Z up clear, back the tap out by hand, blow the hole out."
feed = "hand"

[[setups.operations]]
instruction = "Bottoming tap reference: send G21, MDI G0 X{{process.tap_ref_x_mm:.3f}}, send G20. Stand the bottoming tap, in its wrench, on its point on A there; jog Z down until the guide's point is pushed fully home in the wrench; note the DRO Z. Jog Z up clear, send G21, MDI G0 X{{process.tap_x_mm:.3f}}, send G20."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-bottom"
drilling = "none"
sizing = "other"
instruction = "Bottoming tap, as the plug tap: stop when the DRO Z reads the noted Z less ({{cad.stud_tap_thread_depth_in:.3dot}} + c): the full thread ends {{cad.stud_tap_thread_depth_min_in:.3dot}}–{{cad.stud_tap_thread_depth_max_in:.3dot}} deep (the drawing's; it sets the MHA-SM-VN-52 stud's tip clearance). Do not force it past: its point is then at the drill's full diameter. Jog Z up clear, send G21, back the tap out by hand; blow the hole out."
inspection = "Thread full to {{cad.stud_tap_thread_depth_min_in:.3dot}}–{{cad.stud_tap_thread_depth_max_in:.3dot}} by the DRO at the stop; a #10-24 screw runs in by hand to the bottom without binding."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Unclamp. File the milled burr off A's four edges with the smooth file, and the mouths of B and the tap hole with the scraper only: A, S and K are Setup 8's seats and datums. Next blank: this setup again from its edge-find."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Knife bore: drill 31/64 and ream .4990 through"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in; 1/8 in thick: the bore falls between them). The block lying on them, K DOWN, gripped across its two finished ends: S against the FIXED jaw, A at the LEFT. Centred on the jaws; tap it down onto both stacks while closing the vise. The lower {{process.lying_grip_mm:in.3dot}} of it is in the jaws. The coupon T first, the same way: K down, gripped across its two sawn ends, its A edge at the LEFT."
datum = "Program KM08_bore. G54: X0 the top seat A (the left), Y0 the fixed jaw's face (S) shifted by B's measured station less .200, Z0 the stacks' top (K); +Y toward the fixed jaw. The bore at X {{cad.knife_bore_basic_from_a:.3f}} (.824 BASIC from A), Y −{{process.bore_y_mm:.3f}} mm (datum B's .200 station plus its .300 BASIC, so with the shift .300 from B as measured); the front face at Z {{cad.back_face_depth_mm:.3f}}."
diagram = { file = "diagrams/bore.svg", alt = "The block lying K down on two 1.5 in stacks, gripped on its two ends, S at the fixed jaw, A at the left; the centre drill, the #25 pilot, the 31/64 drill and the .4990 reamer make the knife bore through between the stacks." }
envelope = { x_span_mm = ["{{cad.bottom_face_height_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.minus_x_side_width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.back_face_depth_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.bore_drill_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_31_64_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.minus_x_side_width_mm}}", along_jaws_mm = "{{cad.bottom_face_height_mm}}", part_height_mm = "{{cad.back_face_depth_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_bore_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.bottom_face_height_mm}}"], clamp_mm = [0, "{{cad.bottom_face_height_mm}}"], section_mm = { y = "{{cad.minus_x_side_width_mm}}", z = "{{cad.back_face_depth_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Start only with the .4990 reamer and the .4985/.500 Class ZZ pins in hand (all to buy). At the bench: mike the reamer's shank (the 7/16 collet holds it). Outside its band: stop and tell the owner."
inspection = "Reamer shank {{process.reamer_shank_min_mm:in.4dot}}–{{process.reamer_shank_max_mm:in.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.reamer_shank_min_mm}}", "{{process.reamer_shank_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Mike the GO pin (.4985 plus), the NO-GO pin (.500 minus) and the reamer (across two opposite margins at its front) on the .0001 micrometer, each to ±.00005. Write the readings on this sheet and each pin's reading on its tag. A pin outside its range is not used."
inspection = "GO reads {{cad.knife_bore_dia_min_in:.4dot}}–{{process.go_pin_max_mm:in.4dot}}, NO-GO {{process.nogo_pin_min_mm:in.4dot}}–{{cad.knife_bore_dia_max_in:.4dot}}. The bore is accepted between the two pin readings (GO reading ≤ bore < NO-GO reading): with both pins at their limits only {{process.go_pin_max_mm:in.4dot}}–{{process.nogo_pin_min_mm:in.4dot}} is sure to pass, so a good bore within .0002 of a limit may be refused. If the reamer reads under the GO pin's reading, the coupon T, reamed first, shows whether the pins accept its holes."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.go_pin_min_mm}}", "{{process.go_pin_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.nogo_pin_min_mm}}", "{{process.nogo_pin_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the top seat A (left), Y0 the fixed jaw's face (S) shifted by the blank's written B-from-S reading less .200, so the bore lands .300 from B: edge finder (900 rpm). On the coupon: X0 on its A bar edge, Y0 on S unshifted."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the block, G10 L20 P1 Y to −2.540 plus (the blank's written B-from-S reading less .200) × 25.4 mm (B at .205: Y-2.413; at .195: Y-2.667; the coupon: Y-2.540); its tip .10 below the block's top, on A from the left, G10 L20 P1 X-2.540. A places the bore .824 from it and B its .300: edge-find both carefully."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top (K), touched with the end mill on the fixed-jaw stack left of the block."
instruction_detailed = "Console M6 T1. MDI G0 X-8.000 Y-6.850: the cutter left of the block, its edge .02 off the fixed jaw, over that jaw's stack. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051."
feed = "hand"

