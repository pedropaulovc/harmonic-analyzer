[[setups]]
machine_kind = "other"
title = "Saw the blanks and the coupon"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 5/8 x 1-1/4 in flat bar with two blanks and a trial coupon, each {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long, marked off its end, a saw kerf between them." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Check the bar's tag or the order against the drawing's material: 4140 or 4142, heat treated (pre-hardened) 28-32 HRC. Anything else: stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "Mike the bar before sawing: width (the 1-1/4) {{process.blank_width_min_in:.3dot}}–{{process.blank_width_max_in:.3dot}} and thickness (the 5/8) {{process.blank_thickness_min_in:.3dot}}–{{process.blank_thickness_max_in:.3dot}} where the pieces come from. Outside either: stop and tell the owner (the programs are proved for these)."
inspection = "Bar width {{process.blank_width_min_in:.3dot}}–{{process.blank_width_max_in:.3dot}} and thickness {{process.blank_thickness_min_in:.3dot}}–{{process.blank_thickness_max_in:.3dot}}, micrometers."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_width_min_mm}}", "{{process.blank_width_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Square the bar's end with one thin cut. Then saw three pieces {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off it, the bar flat in the saw's vise, each cut square across the 1-1/4 width: blanks 1 and 2 and the trial coupon T. The bar is hard steel: feed the blade down slowly and let it cut. File the burr off both sawn faces and the edges so each piece seats flat."
feed = "hand"
inspection = "Each piece {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long across the sawn faces, calipers."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.blank_length_min_mm}}", "{{process.blank_length_max_mm}}"] }]

[[setups.operations]]
instruction = "Shorter: saw another piece from the bar; longer: saw it again. Every program assumes this length."
feed = "hand"

[[setups.operations]]
instruction = "With marking fluid on each piece: its number (1, 2 or T) on a 1-1/4 in wide face; A on one bar edge (the narrow 5/8 face along the length; it becomes the top seat A). Then, the numbered face toward you and A on top: S on the sawn end at your RIGHT (it becomes the end nearest datum B). Every later setup's holding depends on this hand."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Back face K"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The piece lying on them, its numbered face DOWN, gripped across its two bar edges: A against the FIXED jaw, S at the LEFT. Centred on the jaws; tap it down onto both stacks while closing the vise. The lower {{process.lying_grip_mm:in.3dot}} of it is in the jaws. Blanks 1 and 2 and the coupon T in turn."
datum = "Program KM01_back (cam:sm_knife_mount). G54: X0 the left end (S), Y0 the fixed jaw's face (A), Z0 the faced back face K; +Y toward the fixed jaw. The file starts with an M6 for the end mill."
diagram = { file = "diagrams/back.svg", alt = "The piece lying on two 1.5 in parallel stacks, gripped on its bar edges, A at the fixed jaw; the 1/2 in end mill skims the top broad face to the back face K." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_width_max_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.front_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_width_max_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.blank_thickness_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_long_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = [0, "{{process.blank_length_max_mm}}"], section_mm = { y = "{{process.blank_width_max_mm}}", z = "{{process.blank_thickness_max_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "G54 X0 the left end (S), Y0 the fixed jaw's face (A): edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm): on the fixed jaw's face beside the piece, G10 L20 P1 Y-2.540; its tip .10 below the piece's top, on S from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced K, the top's high point less the {{process.back_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, at least 1.00 in out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the top: G10 L20 P1 Z0.813 (the {{process.back_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run KM01_back (M6 T1, 1/2 in end mill; set 1300): skim the top at Z0, {{process.back_skim_mm:in.3dot}} off its high point, in passes no wider than {{process.face_stepover_max_mm:in.3dot}}. Dry, chips blown clear."
settings = "endmill-carbide-3fl-1-2-4140-ht"
milling_cuts = [
  { name = "back face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.back_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.blank_length_max_mm}}"] },
]
inspection = "Still clamped: no unfaced patch left on the top, by eye."
gauge_checks = "other"

[[setups.operations]]
instruction = "An unfaced patch left: send $#, note the G54 line's Z; work out w = that Z − 0.254 and send G10 L2 P1 Z followed by w (Z0 .010 lower). Run KM01_back again."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp; mark this face K; file its edges' burr off so K seats flat. Next piece: this setup again from its edge-find."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Front face F to the depth"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
