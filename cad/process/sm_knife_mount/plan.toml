inspection = "Still clamped: the bore Ø{{cad.knife_bore_dia_min_in:.4dot}}–{{cad.knife_bore_dia_max_in:.4dot}} through: the GO pin (.4985 plus) enters its whole length, the NO-GO pin (.500 minus) does not enter. As reamed (the drawing's finish mark on the bore): no tears or chatter marks."
