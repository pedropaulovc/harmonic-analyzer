feed = "hand"

[[setups.operations]]
instruction = "Fits, if the mating parts are at hand: the MHA-SM-03 trunnion turns freely in the bore; the MHA-SM-VN-53 dowel slides into B; the MHA-SM-VN-52 stud runs into the tap by hand. Tight: stop and tell the owner."
feed = "hand"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}. Oil every surface, the bore and both holes, with the stone lubricant (a light honing oil, on the shelf); wipe off the excess and bag each block with its number."
feed = "hand"
