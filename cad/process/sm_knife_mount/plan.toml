[[setups.operations]]
instruction = "Radial test, every block: dA = the bore from A less .824, dB = the bore from B less .300; r = √((|dA| + {{process.bore_err_a_mm:in.4dot}})² + (|dB| + {{process.bore_err_b_mm:in.4dot}})²), each reading's pin play and gauge count added."
inspection = "r at most .0040 (the drawing's Ø.008 position zone to A|B): a good bore, proven with each reading's error allowed. Over: the gauges cannot prove it; stop and tell the owner (it may still be in the zone: a finer check decides; do not scrap it)."
