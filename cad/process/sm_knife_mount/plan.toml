[parameters]
quantity = 2
# The bar (stock.4140-ht-flat-5-8x1-1-4, to buy). Pre-hard flat is sold
# oversize (the record's Key Metals cite: +.020/+.045 thickness, +.060/+.120
# width); these bands take it, and a mike check of the bar before sawing holds
# it to them (outside them the programs' stock tops are not proved). Sawn
# length: 1.10 ±.05 for the saw.
blank_thickness_min_in = 0.620
blank_thickness_max_in = 0.680
blank_thickness_min_mm = 15.748
blank_thickness_max_mm = 17.272
blank_width_min_in = 1.240
blank_width_max_in = 1.380
blank_width_min_mm = 31.496
blank_width_max_mm = 35.052
blank_length_min_in = 1.05
blank_length_max_in = 1.15
blank_length_min_mm = 26.67
blank_length_max_mm = 29.21
# The smallest blank along each model axis, for stock_fit: X the sawn length,
# Y the bar's width, Z the bar's thickness.
blank_x_in = 1.05
blank_y_in = 1.240
blank_z_in = 0.620
# Skims (author's choice): .030 off the first broad face (K), the first bar
# edge (U) and the first end (S): enough to clean a decarb-free ground or
# sawn face. The front face, the top seat and the N end are faced to size
# from them in equal levels no deeper than face_step_max_mm (.030, the hard
# bar's light passes).
back_skim_mm = 0.762
bottom_skim_mm = 0.762
end_skim_mm = 0.762
face_step_max_mm = 0.762
# Facing: the 1/2 in carbide end mill, equal passes no wider than .200 in,
# under half the cutter (the 6G chip-load factor 1.0 holds to 50 %
# engagement, shop settings.endmill-carbide-3fl-1-2-4140-ht).
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.08
# Stock tops the programs start from (cam.py checks them): KM02 the thickest
# bar less the K skim; KM06 the widest bar less the U skim; KM05 the longest
# blank less the S skim.
front_top_max_mm = 16.51
top_top_max_mm = 34.29
end_top_max_mm = 28.448
# Holes. Spots Ø.100 with the #2 centre drill, under the #30 and the #25 (no
# chamfer at the mouths). Datum B: the #30's full diameter at the drawing's
# .37 depth (.36-.38), the DRILLED HOLES row its size (owner ruling
# 2026-11-24, fit audit OQ19).
# The #25 tap drill: its full diameter at the drawing's .438 depth. The knife
# bore (Ø.4985 +.0015/0, owner ruling 2026-11-23, tool audit Q13: "dia .4985
# +.0015/0 (owner chose against the agent's recommendation to keep .4720); no
# 12 mm reamer"): the #25 pilot's and the owned 31/64 drill's full diameters
# 1.0 mm past K into the gap between the stacks; the .4990 reamer's tip 2.0
# mm past K, above the 31/64 drill's. Pecks of about one diameter with full
# retracts (#30 L/D 3.2, #25 L/D 3.2 blind and 4.2 through); the 31/64 drill,
# L/D 1.1 after the pilot, in one feed.
spot_dia_mm = 2.54
dowel_peck_mm = 3.048
tap_peck_mm = 3.556
drill_past_mm = 1.0
dowel_drill_tip_height_mm = 19.339     # The height less the depth and the #30's 118° point (.981); cam.py checks it.
tap_drill_tip_height_mm = 17.452       # The height less .438 and the #25's point (1.141); cam.py checks it.
pilot_tip_height_mm = -2.141           # 1.0 + the #25's point; cam.py checks it.
bore_drill_tip_height_mm = -4.696      # 1.0 + the 31/64 drill's point (3.696); cam.py checks it.
bore_ream_tip_height_mm = -2.0
bore_ream_r_plane_mm = 14.97           # The depth plus 1.0 (cam.py SAFE_MM); cam.py checks it.
bore_ream_clear_mm = 18.97             # The depth plus 5.0 (cam.py CLEAR_MM); cam.py checks it.
bore_ream_feed_mm_min = 19.304        # The .4990 reamer's setting (190 × 2 × .0508); cam.py checks it.
# KM06 stations from S (X) and F (Y): datum B at the drawing's side and row;
# the tap .300 BASIC from B toward N (cad.stud_tap_basic_from_b). cam.py
# checks them.
tap_x_mm = 12.7
# KM08 stations: the bore .824 BASIC from A (X) and .500 from S (Y, datum B's
# side station plus its .300 BASIC). cam.py checks them.
bore_y_mm = 12.7
# Position checks, on the height gauge over pins: the bore's GO pin (the
# Class ZZ pin Setup 8 mikes) and, in B, the largest pin of the .001-step
# pin-gauge sets that enters it (gauges.pin-gauges; its size written
# here). Each reading's error is the pins' play (each pin rests on its
# hole's low side) plus the gauge's .001 count: from A, the bore's
# (.5000 − .4985)/2 and half a count, .00125; from B, the difference of two
# readings, that plus half B's pin step (.0005) and a full count, .00225.
# Each reading must lie within the zone's
# radius (.004) less its error of its BASIC (the bands below: outside one, no
# bore can be in the zone); then the radial test, with each axis's error
# added, accepts the bore. The tap's B-to-tap spacing ±.010 over the pins, a
# gross check only (the program holds its Ø.005 position; the band clears
# the pins' play in their holes). cam.py checks them.
b_pin_step_mm = 0.0254
bore_err_a_mm = 0.0318
bore_err_b_mm = 0.0572
bore_from_a_min_mm = 20.8598
bore_from_a_max_mm = 20.9994
bore_from_b_min_mm = 7.5756
bore_from_b_max_mm = 7.6644
# Each Class ZZ pin's acceptable reading, one ZZ tolerance (.0002) wide (the
# ToolTravelers pattern, test_zz_pin_windows). The knife bore: GO .4985 plus
# from the band's low end up, NO-GO .500 minus from its high end down.
go_pin_min_mm = 12.6619
go_pin_max_mm = 12.667
nogo_pin_min_mm = 12.6949
nogo_pin_max_mm = 12.7
tap_from_b_min_mm = 7.366
tap_from_b_max_mm = 7.874
# KM07's tap reference station on A, from S: midway on the solid land between
# B's edge and the tap drill's, the tap's point (no wider than its #25 drill)
# clear of both; cam.py checks it.
tap_ref_x_mm = 8.75
# The #10-24 bottoming tap: its chamfer (point to the first full thread)
# measured before tapping, at most the drill's shallowest full-diameter depth
# less the thread depth (.061), so the full thread reaches .375 with the
# point still in the drill's full diameter. The plug tap goes first, its point
# to .430 (.006 above that depth). cam.py checks both.
tap_chamfer_max_mm = 1.5494
plug_tap_point_mm = 10.922
# The bore's parallelism to A (the drawing's .002), for the inspection's
# indicator band; cam.py checks it against the export.
bore_parallelism_mm = 0.0508
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): on edge and upright a 1 in parallel against each jaw; lying the
# 1 in and 1/2 in parallels stacked against each jaw (1.5 in), so every faced
# face stands above the jaw tops.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels under the part.
edge_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides: KM01-KM03 the sawn length, KM04-KM05 the
# height with the top still uncut, KM06 the width, KM08 the height.
vise_long_inset_mm = -64.7319
vise_upright_inset_mm = -62.1919
vise_top_inset_mm = -66.6369
vise_bore_inset_mm = -64.4779
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set at least 1 in out of the collet.
half_mill_projection_min_mm = 25.4
# Overall lengths, bounded long: #2 combined drill and countersink 1-7/8 in;
# a jobber 31/64 drill 5-7/8 in (ASME B94.11M). The .4990 reamer (Shars
# 404-7571: 8 in overall, 2 in flutes; a 1/2 in class chucking reamer's
# .4355 shank) in the 7/16 R8 collet (holders.r8-collets-south-bend-sb1280),
# set 4-1/4 in out: in the drill chuck its 8 in would pass the mill's 17 in
# opening over KM08's work.
centre_drill_oal_mm = 47.625
drill_31_64_oal_mm = 149.225
reamer_projection_mm = 107.95
reamer_shank_min_mm = 11.049
reamer_shank_max_mm = 11.0744
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench reach at most tap_stack_max_mm below the collet face:
# the spindle-to-table maximum (shop machines.pm-30mv, 431.8) less 25.0 to
# bring the point down onto the wrench (the shop's tool-change clearance),
# the vise bed, the 1 in parallels, the setup's work top (the widest bar less
# the U skim) and the collet gauge, rounded down to .01 in; less the guide's
# 3 1/8 in (79.375) the tap in its wrench may reach tap_wrench_reach_max_mm,
# rounded down to .01 in.
tap_stack_max_mm = 267.462
tap_wrench_reach_max_mm = 187.96

