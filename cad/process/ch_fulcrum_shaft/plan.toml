# Fulcrum shaft MHA-CH-04, one off. The ends are turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC); the two set-screw flats are milled on the CNC PM-30MV (NC: cam.py).
# Route chosen for speed: the O.D. is 1/4 ground stock as supplied (1/4
# GROUND STOCK OK; owner ruling 2026-11-20, #2346: a ground-stock shaft is
# cut to length, faced and has its features added, never turned on its
# fitted diameter). Saw a blank a little long; in the 3-jaw over a shim wrap,
# a short stick-out, the rest of the bar back in the spindle bore: face end A;
# turn it round, face end B to the 7.01 tip-to-tip length (a full hemisphere
# keeps its apex on the faced plane) and form dome B with the R.125 form tool;
# turn it round again and form dome A. Then on the mill: the shaft lying along
# the vise jaws on stacked parallels, both flats in one clamping (FS01_flats,
# X0 on tip A), so they face the same way. No centre marks are made (CENTRE
# MARKS .04 DEEP MAX).
#
# NC (cam:ch_fulcrum_shaft, cad/process/ch_fulcrum_shaft/cam.py): FS01_flats.
# Program name, the [parameters] and the milling_cuts names are a contract
# with that recipe. T1 is the 1/8 in end mill.
#
# Flagged: the R.125 form tool (cad/config/shop-equipment/
# tools-special-cutters.toml form-tool-r125) is to order; 1/4 in 1018 ground
# round (stock-to-order.toml 1018-ground-round-1-4) is to order. Lengths over
# 6 in are read with the owned 0-12 in height gauge on the surface plate (the
# owned calipers stop at 6 in).
title = "Fulcrum Shaft"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "AISI 1018 cold-finished steel, precision-ground round, 1/4 in"
stock = "Ø{{process.stock_dia_in:.4dot}} ground bar (to order, not on hand); one blank {{process.blank_length_in:.2dot}} in long."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil. The O.D. is left as supplied: grip it over a brass shim wrap (lathe) and never cut it. Home the mill ($H) and touch off G54 before the mill setup; after any controller reset, stall or E-stop, home and touch off again before Cycle Start. Prove the file in air first."
shop = "../shop"
stock_refs = ["1018-ground-round-1-4"]
material_key = "lathe-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_fulcrum_shaft/features.toml"
adapter = "turned_shaft"
part = "ch-fulcrum-shaft"

[parameters]
quantity = 1
stock_dia_in = 0.25
# Sawn a little over the faced length: about .03 in to face off each end.
blank_length_in = 7.07
as_supplied_outer = 1
# Out of the jaw fronts while an end is faced and domed: under 4 × Ø.
end_stickout_in = 0.5
# The R.125 form tool's radius: each dome is cut full on the Ø.250, a
# hemisphere .125 high (cad.dome_*_form_height), its tip on the faced plane.
dome_form_radius_in = 0.125
# Mill (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8 in
# thick): one 1 in parallel of the set standing on edge, centred between the
# jaws, 1/16 in clear of each (two parallels would fill the 1/4 in gap and
# take the grip off the shaft); the shaft lying on its top edge along the
# jaws, gripped on its O.D.; the cutter works down between the jaw faces.
riser_height_mm = 25.4
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The jaw tops over the O.D. top (Z0): jaw height less the parallel and the
# O.D.; cam.py checks it.
jaw_top_over_od_mm = 13.1953
# Centred: the shaft past the left jaw side by (length − jaw width)/2 from
# tip A (the vise hold's left overhang), as far past the right; cam.py checks it.
vise_jaw_from_x0_mm = 9.69
# The 1/8 in end mill's flats (shop endmill-carbide-3fl-1-8): its centre
# crosses each flat's width at X stations no more than half the cutter apart.
em_eighth_dia_mm = 3.175
flat_stepover_max_mm = 1.5875
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# 1/8 in end mill, 1-1/2 in overall: set at least .75 in out of the collet,
# so it reaches the flats .53 in down between the jaws with the collet nut
# above the jaw tops (cam.py checks it).
em_eighth_projection_min_mm = 19.05
# Each flat's depth below the O.D. top: the O.D. less the across, nominal
# (.2500 − .2380 = .0120 in); cam.py checks it against the export.
flat_depth_mm = 0.3048
# Each flat's ends from tip A, and the right jaw side; cam.py checks them.
flat_datum_from_mm = 6.096
flat_datum_to_mm = 10.414
flat_far_from_mm = 167.64
flat_far_to_mm = 171.958
vise_jaw_to_x0_mm = 168.364

[[tools]]
id = "saw"
name = "Metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "form"
name = "R.125 dome form tool (cuts an SR.125 dome)"
ref = "form-tool-r125"
status = "to_order"

[[tools]]
id = "file"
name = "Files (10 in mill second-cut, 8 in smooth)"
ref = "jig-files"

[[tools]]
id = "em-eighth"
name = "1/8 in carbide end mill"
ref = "endmill-carbide-3fl-1-8"

[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/saw.svg", alt = "The 1/4 in ground bar on the saw: one blank sawn a little over the faced length." }

[[setups.operations]]
instruction = "Mike the bar over the length you will cut, at both ends and the middle: every reading {{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}} (the O.D. is left as supplied)."
inspection = "Bar Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
instruction = "A reading outside the band: mark that length scrap and mike the next length of the bar."

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe {{process.blank_length_in:.2dot}} in from the bar end and saw on the waste side of the scribe. Deburr both sawn ends with the file."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Datum end: face"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the ground O.D., {{process.end_stickout_in:.2dot}} in out of the jaw fronts; the rest of the blank back in the spindle bore."
datum = "Z0 (carriage DRO) the datum end, faced in Op 40."
diagram = { file = "diagrams/end-a.svg", alt = "The blank in the 3-jaw, the datum end out a half inch: faced square." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the datum end square, about {{cad.face_stock_per_end_in:.3dot}} in off, to the centre with no pip."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Far end: face to length, form its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round: 3-jaw over the shim wrap, {{process.end_stickout_in:.2dot}} in out, the datum end back in the spindle bore."
datum = "DRO Z touched on the far end with the facing tool before each skim (Op 50), and with the form tool's tips in Op 70."
diagram = { file = "diagrams/end-b.svg", alt = "The shaft turned round, the far end out: faced to the 7.01 length, then domed with the R.125 form tool." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the far end square in light skims, reading the length between them (Op 60), to {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}}, aiming {{cad.faced_length_in:.3dot}}: the tip-to-tip length (each dome is a full hemisphere, its tip on the faced plane)."
settings = "lathe-ar-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Between skims, take the shaft out, stand it on the datum end on the surface plate, held upright by hand against the side of a 1-2-3 block, and read the far end with the height gauge (the 0–6 in calipers do not reach 7 in). Chuck it again {{process.end_stickout_in:.2dot}} out and touch the facing tool on the far end before the next skim."
inspection = "Length {{cad.faced_length_min_in:.3dot}}–{{cad.faced_length_max_in:.3dot}}."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.faced_length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Set the R.125 form tool on centre height, square to the axis, its arc spanning the whole end. Bring its tips up to the far end and set the cross-slide until both tips just touch the O.D. corner together (no light at either tip): the arc is then centred. Zero the DRO Z there."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Form the far dome: feed along Z to Z−{{cad.dome_far_form_height_in:.3dot}} (the dome's height, the bar's radius). The form then reaches the centre, the tip on the faced plane, the dome tangent to the O.D."
settings = "lathe-form-r125-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Look at the far dome under a light: no pip or flat at the tip, no step where the dome meets the O.D."

[[setups.operations]]
cut_kind = "other"
instruction = "A pip at the tip: the tool is off centre height; reset it and take one more light pass to the same Z−{{cad.dome_far_form_height_in:.3dot}}, never deeper (it would shorten the 7.01 length)."

[[setups.operations]]
cut_kind = "other"
instruction = "A step at the O.D.: the arc is not centred across the bar; centre it as Op 70 and take one more light pass to the same Z."

[[setups.operations]]
cut_kind = "other"
instruction = "A flat at the tip with the DRO at Z−{{cad.dome_far_form_height_in:.3dot}}: the form is not cut to R.125. Stop: the shaft is scrap and the tool goes back."

[[setups]]
machine_kind = "lathe"
title = "Datum end: form its dome"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "Turned round again: 3-jaw over the shim wrap, {{process.end_stickout_in:.2dot}} in out, the far dome back in the spindle bore."
datum = "DRO Z zeroed with the form tool's tips on the datum end (faced in Op 40) in Op 130."
diagram = { file = "diagrams/end-a-dome.svg", alt = "The shaft turned round again, the datum end out: domed with the R.125 form tool." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.end_stickout_mm}}", minimum_diameter_mm = "{{cad.stock_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
instruction = "Set and centre the form tool on the datum end as Op 70, and zero the DRO Z there."

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "form"
drilling = "none"
sizing = "other"
instruction = "Form the datum dome as Op 80: feed along Z to Z−{{cad.dome_datum_form_height_in:.3dot}}."
settings = "lathe-form-r125-1018"
cut_diameter_mm = "{{cad.stock_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Look at the datum dome under a light: no pip or flat at the tip, no step where it meets the O.D."

[[setups.operations]]
cut_kind = "other"
instruction = "A fault: as Ops 100–120, never past Z−{{cad.dome_datum_form_height_in:.3dot}}."

[[setups]]
machine_kind = "other"
title = "Mill both flats"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The PM 6 in vise (jaws {{process.vise_jaw_height_mm:in.2dot}} high). One 1 in parallel of the 1/8 in thick set standing on edge, centred between the jaws, 1/16 in clear of each. The shaft lying on its top edge along the jaws, gripped on its O.D., centred on the jaws: the datum tip {{process.vise_jaw_from_x0_mm:in.2dot}} in past the left jaw side, the far tip as far past the right. Tap it down onto the parallel while closing the vise. Its top stands {{process.jaw_top_over_od_mm:in.3dot}} under the jaw tops. The datum flat lies across the left jaw side, the far flat across the right; the cutter works down between the jaw faces, clear of them."
datum = "Program FS01_flats (cam:ch_fulcrum_shaft). G54: X0 the datum tip (the datum dome's apex), +X along the shaft; Y0 the shaft's axis; Z0 the top of the O.D. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/flats.svg", alt = "The domed shaft lying along the vise jaws on a parallel; the 1/8 in end mill cuts both flats on top, down between the jaw faces." }
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.em_eighth_dia_mm}}"], y_span_mm = ["{{cad.stock_dia_mm}}", "{{process.em_eighth_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.stock_dia_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.flat_datum_across_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_eighth_projection_min_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_eighth_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.stock_dia_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.stock_dia_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_jaw_from_x0_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = ["{{process.vise_jaw_from_x0_mm}}", "{{process.vise_jaw_to_x0_mm}}"], section_mm = { diameter = "{{cad.stock_dia_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 Y0 the shaft's axis and X0 the datum tip: edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm), its tip level with the shaft's axis. Y: on the O.D. from the moving-jaw side, left of the jaws, G10 L20 P1 Y-(the miked O.D./2 + 2.540) in mm; for .2500, Y-5.715. X: on the datum tip from the left, Y0, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the top of the O.D., touched with the end mill over the axis."
instruction_detailed = "Console M6 T1 (1/8 in end mill, at least {{process.em_eighth_projection_min_mm:in.2dot}} in out of the collet; the tool setter measures it). MDI G0 X5.000 Y0.000: over the O.D. left of the jaws, past the dome. Spindle stopped, its tip just dragging a .002 feeler leaf on the O.D. top: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove FS01_flats in air, Z0 raised 1.000 in; every move between the flats clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run FS01_flats: at its M6 prompt T1 is already in, so continue; the spindle runs at 2800 in air. Watch each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run FS01_flats (M6 T1, 1/8 in end mill; set 2800): each flat ramped in across its width, then cut {{process.flat_depth_mm:in.3dot}} deep in passes across it, the datum flat {{process.flat_datum_from_mm:in.3dot}}–{{process.flat_datum_to_mm:in.3dot}} and the far flat {{process.flat_far_from_mm:in.3dot}}–{{process.flat_far_to_mm:in.3dot}} from the datum tip."
settings = "endmill-carbide-3fl-1-8-lathe-1018"
milling_cuts = [
  { name = "flat_datum", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_datum_from_mm}}", "{{process.flat_datum_to_mm}}"] },
  { name = "flat_far", kind = "end", phase = "finish", cutter_dia_mm = "{{process.em_eighth_dia_mm}}", axial_doc_mm = "{{process.flat_depth_mm}}", radial_woc_mm = "{{process.flat_stepover_max_mm}}", traverse_mm = ["{{process.flat_far_from_mm}}", "{{process.flat_far_to_mm}}"] },
]

[[setups.operations]]
instruction = "Unclamp and read each flat across to the O.D. under it with the calipers' outside jaws, the jaw tips on the flat (a micrometer's Ø.25 anvil is wider than the flat)."
inspection = "Each flat across {{cad.flat_datum_across_min_in:.3dot}}–{{cad.flat_datum_across_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_datum_across_band_mm}}" }]

[[setups.operations]]
instruction = "A flat outside the band: the shaft is scrap; make another from Setup 1 (once unclamped, the round shaft will not seat again with its flats at the same angle, so a flat is not re-cut)."

[[setups]]
machine_kind = "other"
title = "Bench: deburr, check, oil"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/inspect.svg", alt = "The finished shaft: 7.01 tip to tip, both R.125 domes, the two .238 flats on one side, the O.D. as supplied." }

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break the flats' edges with the smooth file, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max; leave the O.D. and the domes untouched."
feed = "hand"

[[setups.operations]]
instruction = "Datum flat: read with the calipers from the datum tip to the flat's nearer end, and the flat's length. Far flat: read from the far tip to the far flat's end nearer the far tip, and its length; its station from the datum tip is the Op 60 length less those two readings."
inspection = "Datum flat from the datum tip {{cad.flat_datum_station_min_in:.2dot}}–{{cad.flat_datum_station_max_in:.2dot}}, far flat from the datum tip {{cad.flat_far_station_min_in:.2dot}}–{{cad.flat_far_station_max_in:.2dot}}; each {{cad.flat_datum_length_min_in:.2dot}}–{{cad.flat_datum_length_max_in:.2dot}} long."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.flat_datum_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.flat_datum_length_band_mm}}" }]

[[setups.operations]]
instruction = "Mike the O.D. at both ends and the middle: the jaws must not have marked it."
inspection = "O.D. Ø{{cad.outer_dia_min_in:.4dot}}–{{cad.outer_dia_max_in:.4dot}}."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
instruction = "A flat out of station or length, or a jaw-marked O.D. under {{cad.outer_dia_min_in:.4dot}}: scrap the shaft and make another from Setup 1."

[[setups.operations]]
instruction = "Wipe the shaft with machine oil."
