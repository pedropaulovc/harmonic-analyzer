diagram = { file = "diagrams/tap.svg", alt = "To scale, from the front at tap 1 (the strip cut away on the tap line): the #0-80 tap in the T-handle wrench in hole 1, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point to stop {{process.tap_point_depth_mm:in.3dot}} under the flat top. The wrench and the tap's length schematic." }

[[setups.operations]]
instruction = "Tap depth references, once, at hole 1: the DRO's work Z with each tap's point on the flat top beside the hole and the guide's point pushed home in the wrench. Write Zp (plug) and Zb (bottoming)."
instruction_detailed = "MDI G91 G0 X3.810, G90 (beside the hole, on the flat top). The plug tap in its wrench, standing on its point: jog Z down until the guide's point is pushed fully home in the wrench's centre hole; write the DRO Z as Zp. The same with the bottoming tap: Zb. Jog Z up clear and MDI G91 G0 X-3.810, G90: back over the hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-0-80-plug"
drilling = "none"
sizing = "other"
instruction = "Tap {{cad.tap_1_thread}} with the plug tap under the guide, spindle off, dry: a quarter turn at a time, backing off when it stiffens. Stop when the DRO Z reads Zp − {{process.tap_point_depth_mm:.3f}}, read with the point pushed home. Jog Z up clear; back the tap out by hand."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-0-80-bottoming"
drilling = "none"
sizing = "other"
instruction = "The bottoming tap the same way, to Zb − {{process.tap_point_depth_mm:.3f}}: the full thread {{cad.tap_1_thread_depth_min_in:.3dot}}–{{cad.tap_1_thread_depth_max_in:.3dot}} deep. Back it out and blow the hole out."
feed = "hand"
inspection = "A #0-80 screw (the MHA-PD-VN-55 fillister on hand) runs in by hand to the bottom of the thread. Binds: run the bottoming tap again; still binds: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Holes 2, 3 and 4 the same way, each: G10 L2 P1 X(its E again + t), $# check, run FR05_tap, plug to Zp − {{process.tap_point_depth_mm:.3f}}, bottoming to Zb − {{process.tap_point_depth_mm:.3f}}, blow out, screw check."
