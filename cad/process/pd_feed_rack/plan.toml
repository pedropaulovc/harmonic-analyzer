datum = "Programs FR03_spot, FR04_drill, FR05_tap, each run once per hole. G54: X0 the hole's tooth, entered for each hole from the table (G10 L2 P1 X); Y0 the tap line, {{cad.tap_1_inset_in:.3dot}} in from the front face, +Y toward the back face; Z0 the flat top. Each file starts with an M6."
diagram = { file = "diagrams/drill.svg", alt = "To scale, from the front at tap 1 (the strip cut away on the tap line): the strip teeth down on the stack at the fixed jaw, flat top up; the 3/64 drill in hole 1 over its tooth's centre (X0), its full diameter {{cad.tap_1_drill_depth_in:.3dot}} under the flat top (Z0); the moving jaw, in front, not drawn." }
