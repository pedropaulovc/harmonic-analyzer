drilling = "none"
sizing = "other"
instruction = "Taps 1 and 2 from the LEFT end, into the table: edge finder on the LEFT end, then the #49 drill's shank in the space on each tap tooth's left, the finder touching both sides of it."
instruction_detailed = "Edge finder (900 rpm) on the LEFT end from the left: G10 L20 P1 X-2.540. Lay the #49 drill's shank (never its flutes) across the strip in the space nearest the row's aim. Finder tip .008 over the crests (lower it onto a .008 feeler leaf there, take the leaf out): touch the rod from the left and write the X; lift, cross over, touch from the right and write that X. t outside the aim's window: move the rod one space toward the aim and read it again."
diagram = { file = "diagrams/measure-left.svg", alt = "To scale, from the front: hold A, the piece teeth up with its LEFT end {{process.measure_overhang_mm:in.2f}} in out past the jaws; the #49 drill's shank seated in the space on tap 1's tooth's left, the edge finder touching it from the left, its tip .008 over the crests; X0 the LEFT end." }
