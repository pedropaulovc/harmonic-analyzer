# Feed rack MHA-PD-26 (qty 1), routed for the CNC mill (agent's choice for
# speed, owner ruling 2026-11-21: the owner corrects the route afterwards;
# route approved by Main 2026-11-27, W3B-Small lane). A 10.75 in piece of the
# bought SDP/SI A 1B12-Y324 brass rack (32 DP, 20° PA, 3/16 square, 48 in),
# its ends milled to the 10.62 length and four #0-80 taps drilled into its
# flat top, each on a tooth's centre (ON TOOTH CENTRES ±.005).
#
# Route: Setup 1 bench, mike the section and saw the piece with the junior
# hacksaw. Setup 2 CNC teeth up on one parallel stack against the fixed jaw:
# the LEFT end .30 in past the jaws' left side, FR01 mills it with the
# cutter's side; re-gripped with the RIGHT end .30 in past the right side,
# X0 touched again on the milled left end, FR02 mills the right end to the
# length, and the length is read on the work X DRO in that hold (owner Q3:
# the 6 in calipers cannot reach it and the 48 in rule does not prove ±.01;
# the CNC holds the length). Centred in one hold, each end 2.2 in past the
# jaws, the side pass would bend the strip 0.465 mm along Y against the
# 0.025 finish limit (prechips milling_deflection, 29 N at .0011 in/tooth,
# .015 radial, 5.42 mm deep); .30 in past the jaws it is about 0.001. Then
# two re-grips (holds A and B), each with the measured end 4.75 out past the
# jaws: a rod (the #49 drill's shank) in the space on each tap tooth's left,
# the edge finder on both its sides; the rod's middle plus half a pitch is
# that tooth's centre t. Taps 1-2 are measured from the milled LEFT end,
# taps 3-4 from the milled RIGHT end (the left end cannot stand out while
# they are clear of the jaws) and carried to the left end with L. Setup 3
# CNC teeth down, centred: Y0 the tap line from the front face, Z0 the flat
# top; for each hole X0 = E + t (E the touched end's G54 X, read with $#),
# entered with G10 L2 P1 X. FR03 spots, FR04 drills the 3/64 to .129, FR05
# brings the tap guide over the hole (one Idle-ending file, the
# pd_platen_bottom_guide precedent); each is a one-hole file at X0 Y0, run
# once per hole. Setup 4 bench: deburr and check.
#
# The length's budget, FR02 from a fresh X0 on the milled left end: the
# edge finder's .0002 plus the repeatability .0008 against ±.010.
#
# This departs from the standing page's single G54 per setup: each hole of
# Setup 3 has its own X0, written in the plan's tables, never added in the
# head (W3B-Small decision, Main option A, 2026-11-27: G54 only; _gcode.py
# and _freecad_cam_runtime handle no other work offset).
#
# The tooth-centre error budget (Main's requirement; the drawing's ±.005 on
# each tap's tooth centre), per hole, in inches:
#   edge finder, the rod's middle (two touches)      .0002  usual figure
#   edge finder, the end touched in Setup 2          .0002  usual figure
#   edge finder, the end touched in Setup 3          .0002  usual figure
#   rod roll-over in the space (allowance)            .0002  author's
#   repeatability ±.0008 (0.02 mm) at 4 positions     .0032  cnc.pm-30mv (owner)
#   on record, worst                                  .0040
#   proxy: rod seating against the tooth form         .00075 SDP/SI precision
#     grade (tooth to tooth .0005, accumulated .002, catalogue p. 1-190):
#     a proxy, the commercial grade publishes none
#   worst with the proxy                              .00475 against ±.005
#   root sum of squares                               about .0018
#   unknown, unpublished: the commercial strip's local tooth form (p. 1-193
#     lists no accuracy for A 1B12-) and the 3/64 drill's walk off the spot.
# The edge finder's .0002 is the usual figure, never measured in this shop
# (as the dt_pinion_cam and pd_support_bar plans cite it). Measuring each
# tooth removes the strip's accumulated pitch error and its lead from the
# chain. Four checks with no extra setup back it: each t read twice from a
# fresh end touch (agree within .004, else a third); each d - d1 inside its
# printed station band; each spot looked at against its tooth before
# drilling; each G10 read back with $#.
#
# Rod: the owned #49 drill (.073, tools.drill-49) seats on both flanks of a
# space clear of the root: pd_feed_rack_spec.rack_gauge_pin_contact_mm(1.8542)
# gives its centre 4.967 mm over the flat top, .204 mm (.008) over the
# crests, and 1.06 mm of root clearance; 5/64 and larger do not seat.
#
# Stock (cad/config/shop-equipment/ stock.sdp-rack-a-1b12-y324, to order,
# price read live 2026-11-27): one 48 in rack gives four 10.75 pieces plus
# kerfs (43.1 in): the part and three spares. Tools to order: the junior
# hacksaw (tools.junior-hacksaw) and the Fisher tap guide
# (tools.tap-guide-fisher).
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder); every Z zero a tool on a .002
# feeler leaf.
#
# NC (cam:pd_feed_rack, cad/process/pd_feed_rack/cam.py): FR01_left,
# FR02_right, FR03_spot, FR04_drill, FR05_tap. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/4 in end mill, T2
# centre drill, T3 3/64 drill, T4 the tap guide (the taps are turned by hand).
title = "Feed Rack"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "{{cad.material_spec}}"
stock = "Qty {{process.quantity:d}}. One {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in piece of the SDP/SI A 1B12-Y324 rack (to order: 48 in, four pieces)."
shop = "../shop"
stock_refs = ["sdp-rack-a-1b12-y324"]
material_key = "rack-brass"
milling_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# homing, Feed Hold, tool changes, proving a file); This job says what only
# this rack needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["To buy before Setup 1", "The SDP/SI A 1B12-Y324 rack, 48 in ($252.94, 11 weeks), the junior hacksaw and the Fisher tap guide. The rack gives four 10.75 pieces: the part and three spares. A hole off its tooth scraps the piece (about $63 of rack): saw another and start again at Setup 2."],
  ["Tooth centres", "Each tap goes on a tooth's centre. Where the teeth fall on a sawn piece is unknown, so Setup 2 measures each tap's tooth from an end and Setup 3 zeroes X on it, hole by hole. The tables carry every number, in mm; write each one in."],
]

[cad]
file = "../../out/features/pd_feed_rack/features.toml"
adapter = "drilled_block"
part = "pd-feed-rack"

[parameters]
quantity = 1
# The piece (stock.sdp-rack-a-1b12-y324); stock_fit reads blank_<axis>_in
# (model axes: X the length, Y the flat top to the crests, Z the face width).
blank_x_in = 10.75
blank_y_in = 0.1875
blank_z_in = 0.1875
# The sawn piece's band: 10.75 marked with the combination square's 12 in
# blade (1/64 graduations), sawn on the waste side by hand; the programs are
# posted for the longest.
blank_length_min_in = 10.72
blank_length_max_in = 10.80
blank_length_min_mm = 272.288
blank_length_max_mm = 274.32
# The junior hacksaw's kerf (authored, as dt_pinion_lever_pin: the blade is
# not measured on record).
kerf_in = 0.03
# The section: 3/16 REF square (cad.teeth_height_ref, cad.back_face_depth_ref)
# with the spec's receiving room, twice drawn bar's .003 either side
# (pd_feed_rack_spec.PURCHASED_RACK_SECTION_ROOM_IN): SDP/SI publishes none
# and the drawing pays these limits. cam.py checks them.
section_mm = 4.7625
section_min_mm = 4.6101
section_max_mm = 4.9149
# The length's target, the middle of 10.62 ±.01 (cam.py checks it).
length_target_mm = 269.748
# Setup 2: the left end's skim (a hand-sawn end's lean and burr; author's
# choice); the length window on the work X DRO, the band plus the .200 edge
# finder's radius (cam.py checks them).
left_end_skim_mm = 0.762
length_dro_min_mm = 272.034
length_dro_max_mm = 272.542
# Ends: the 1/4 in carbide end mill's side (shop endmill-carbide-3fl-1-4,
# settings.rack-em-quarter-brass), one level from over the crests to .020
# under the thickest strip's flat top (into the air past the stack), equal
# radial steps no deeper than .015, one-way conventional passes across the
# strip. cam.py checks end_axial_doc_mm.
em_dia_mm = 6.35
end_step_max_mm = 0.381
end_past_mm = 0.508
end_axial_doc_mm = 5.4229
end_floor_mm = -0.508            # The ends' lowest point over the stack's top (the capacity check).
# The end mill set 5/8 in out of its collet: 2.5 diameters (the shop's
# stickout_ld_max is 3.0), its collet clear of the jaw tops over the deepest
# pass (cam.py checks both).
em_projection_mm = 15.875
# Holding (shop workholding.vise-pm-6, fixtures.parallels-lms-6745, 1/8 in
# thick): the set's 1 in parallel on its 9/16 in, one stack (1.5625 in)
# against the fixed jaw under the 3/16 strip, so the thickest strip's top
# stays under the jaw tops: the whole section is gripped, teeth up and teeth
# down.
riser_height_mm = 39.6875
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# The jaw tops over Z0 (the crests in FR01-FR02, the flat top in FR03-FR05)
# on the thinnest strip; cam.py checks it.
jaw_top_over_work_mm = 0.6477
# The end holds: the end milled .30 in past its jaw side (cantilever about
# 7 mm). FR01 grips the longest piece from there to left_clamp_end_mm; FR02
# the same piece less the left end's skim, its raw right end .30 in past
# the right side, the milled left end right_hold_overhang_mm out past the
# left side (cam.py checks them).
end_overhang_mm = 7.62
left_clamp_end_mm = 166.2938
right_hold_length_mm = 273.558
right_hold_overhang_mm = 107.2642
right_clamp_end_mm = 265.938
# Setup 3: the finished strip centred.
hole_overhang_mm = 55.5371
hole_clamp_end_mm = 214.2109
# Holds A and B: the measured end 4.75 out past the jaws, the other end
# measure_inset_mm inside them; the edge finder on the rod at the farthest
# tooth the windows allow stays 2.9 mm or more clear of the jaw side (cam.py
# checks both).
measure_overhang_mm = 120.65
measure_inset_mm = 9.5758
# Half the 32 DP pitch (cad.teeth_pitch_ref / 2): the rod's middle to its
# tooth's centre.
half_pitch_mm = 1.2468
# The rod: the #49 drill's shank (shop tools.drill-49.diameter_mm); its
# centre stands .204 mm over the crests (the header), so the finder's tip
# goes .008 over them to meet it at its widest.
rod_dia_mm = 1.8542
# Tap 1's window: its tooth within half a pitch of the nominal station,
# inside the printed ±.050; the printed station bands in mm for the table
# (cad.tap_<k>_station_band_mm; cam.py checks them).
tap_1_window_min_mm = 51.1196
tap_1_window_max_mm = 53.6132
tap_1_station_min_mm = 51.0964
tap_1_station_max_mm = 53.6364
tap_2_station_min_mm = 54.737
tap_2_station_max_mm = 54.991
tap_3_station_min_mm = 109.601
tap_3_station_max_mm = 109.855
tap_4_station_min_mm = 164.465
tap_4_station_max_mm = 164.719
# Setup 3's Y0: the edge finder on the front face from the operator's side
# sets Y0 on the tap line, its radius plus the printed inset (cam.py).
y_touch_mm = 4.92125
# Holes: the #1 centre drill spots to Ø.060, the thread's basic major (a
# .007 mouth chamfer, under the .010 edge break), to spot_depth_mm (cam.py);
# then the 3/64 to the drill depth's nominal .129 at full diameter, pecked
# 1.0 mm (under one diameter) with full retracts, its point inside the tooth
# on the thinnest strip.
spot_dia_mm = 1.524
spot_depth_mm = 1.4793
drill_3_64_dia_mm = 1.190625     # Shop tools.drill-3-64.diameter_mm.
peck_mm = 1.0
drill_tip_height_mm = -3.6343
drill_tip_over_stack_mm = 0.9758  # The thinnest strip's section plus drill_tip_height_mm (capacity).
# Speeds (shop settings.rack-spot-brass, rack-drill-3-64-brass): 2800 rpm,
# 2.8 in/min.
spot_feed_mm_min = 71.12
drill_feed_mm_min = 71.12
# The taps' point stops at the drill's shallowest shoulder (.124): a
# bottoming tap's 1-1.5 pitch lead leaves the full thread .105-.112, inside
# .105-.115 (cam.py checks it against the drill depth's band).
tap_point_depth_mm = 3.1496
# Machine-capacity inputs (mm): tool lengths from the spindle nose to tip.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# ASME B94.11M jobber, 3/64: 1-3/4 in overall; the #1 combined drill and
# countersink 1-1/4 in. Bounded by their whole length below the chuck.
centre_drill_oal_mm = 31.75
drill_3_64_oal_mm = 44.45
# The least each must stand out of the drill chuck to reach its depth with
# the chuck over the jaw tops; cam.py checks it.
spot_projection_min_mm = 8.0
drill_3_64_projection_min_mm = 10.0
# Tapping under the spring tap guide: the guide and the tap in its wrench
# reach at most tap_stack_max_mm below the collet face (the spindle-to-table
# maximum 431.8 less 25.0 to bring the point down onto the wrench, the vise
# bed, the stack, the thickest strip and the collet gauge, rounded down to
# .01 in); the tap's own reach in its wrench that less the guide's 3 1/8 in
# (cam.py checks both).
tap_stack_max_mm = 282.448
tap_wrench_reach_max_mm = 202.946

