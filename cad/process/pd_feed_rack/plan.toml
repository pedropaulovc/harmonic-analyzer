instruction = "Hold A: unclamp and slide the piece right until its LEFT end stands {{process.measure_overhang_mm:in.2f}} out past the jaws' left side (the right end {{process.measure_inset_mm:in.2f}} inside the jaws). Teeth up on the same stack, the front face at the FIXED jaw; tap it down while closing the vise."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
