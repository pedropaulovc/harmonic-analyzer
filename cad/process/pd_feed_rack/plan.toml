[[setups.operations]]
instruction = "Before clamping: of the two #0-80 taps on hand, the bottoming tap has 1–2 chamfered threads at its point, the plug 3–5 (the record does not say which is which). Tag them. Both with 3–5: stop and tell the owner; the full thread needs a bottoming tap."
feed = "hand"

[[setups.operations]]
instruction = "Stop check before clamping: each tap in the T-handle wrench measures at most {{process.tap_wrench_reach_max_mm:in.2f}} in from its point to the wrench's centre hole (the mill's 17 in less the vise, the stack, the strip, the collet, the guide's 3 1/8 in and 1 in to bring the point down). Over: stop."
feed = "hand"

[[setups.operations]]
instruction = "Clamp as Holding says. G54 Y0 the tap line, Z0 the flat top: edge finder on the front face, the centre drill on the flat top."
instruction_detailed = "Edge finder (900 rpm) on the front face left of the jaws, from your side: G10 L20 P1 Y-{{process.y_touch_mm:.3f}} (its .100 radius plus the {{cad.tap_1_inset_in:.3dot}} inset). Console M6 T2 (#1 centre drill in the drill chuck, at least {{process.spot_projection_min_mm:in.2dot}} out of it); spindle stopped, its tip just dragging a .002 feeler leaf on the flat top left of the jaws: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "E for each end, into the table: the edge finder on the LEFT end (G10 L20 P1 X-2.540), send $#, write the G54 X as E for holes 1 and 2; then on the RIGHT end (G10 L20 P1 X2.540), $#, E for holes 3 and 4. Copy each t used from Setup 2; write E + t."
feed = "hand"
