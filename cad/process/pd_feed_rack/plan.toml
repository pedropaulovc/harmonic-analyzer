[[setups]]
machine_kind = "other"
title = "Saw the piece"
machine = "Bench"
holding = "The bench vise with soft jaws, the rack flat top up."
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "To scale, from above: the rack's end in the bench vise's soft jaws, flat top up; the junior hacksaw's blade in its {{process.kerf_in:.2dot}} kerf on the waste side of the mark, {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in from the rack's end; the LEFT end marked; the rest of the 48 in rack drawn short to a break line." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the rack's height (flat top to the tooth crests) and its face width, 1 in from the end."
inspection = "Both {{process.section_min_mm:in.4dot}}–{{process.section_max_mm:in.4dot}}. Outside: stop; the holds and the tap line assume it."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.section_min_mm}}", "{{process.section_max_mm}}"] }]

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe a line 10.75 from the rack's end with the combination square. The rack in the soft jaws, the line 1/16 out past them; saw on the waste side with the junior hacksaw, light strokes. File both ends' burrs off and mark the rack's own end LEFT: every X counts from it."
feed = "hand"
inspection = "Piece {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long on the combination square's 12 in blade. Shorter: saw another; longer: saw again."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Ends to the length; measure each tap's tooth"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The set's 1 in parallel on its 9/16 in, one stack against the FIXED jaw, centred. The piece teeth up on it along the jaws, the front face against the FIXED jaw, the LEFT end to the left and {{process.end_overhang_mm:in.2dot}} in out past the jaws' left side (the calipers' depth rod). Tap it down onto the stack while closing the vise; the crests stay under the jaw tops."
datum = "Program FR01_left. G54: X0 {{process.left_end_skim_mm:in.3dot}} right of the sawn LEFT end (the finished end), Y0 the front face, +Y toward the fixed jaw; Z0 the crests. The file starts with an M6 for the end mill. FR02_right, holds A and B: the zeros their steps set."
diagram = { file = "diagrams/ends.svg", alt = "To scale, from the front at the left end, with an inset from above: the piece teeth up on the stack at the fixed jaw, its LEFT end {{process.end_overhang_mm:in.2dot}} in out past the jaws; the 1/4 in end mill's side on the left end's last pass at X0, its end {{process.end_past_mm:in.3dot}} under the flat top; from above, the pass runs −Y across the strip." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.em_dia_mm}}", 5.08], y_span_mm = ["{{process.section_mm}}", "{{process.em_dia_mm}}", 5.08], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.section_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.end_floor_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_projection_mm}}"] }
vise_hold = [
  { vise = "vise-pm-6", across_jaws_mm = "{{process.section_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.section_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.end_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{process.section_mm}}", along_jaws_mm = "{{process.right_hold_length_mm}}", part_height_mm = "{{process.section_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["rest", "{{process.end_overhang_mm}}"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{process.section_mm}}", along_jaws_mm = "{{process.length_target_mm}}", part_height_mm = "{{process.section_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.measure_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{process.section_mm}}", along_jaws_mm = "{{process.length_target_mm}}", part_height_mm = "{{process.section_max_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["rest", "{{process.measure_overhang_mm}}"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
]
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = ["{{process.end_overhang_mm}}", "{{process.left_clamp_end_mm}}"], section_mm = { y = "{{process.section_min_mm}}", z = "{{process.section_min_mm}}" }, vise_left = "start", vise_hold = 1 }

