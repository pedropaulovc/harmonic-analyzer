<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="430"/>
  <text class="title" x="20" y="20">Setup 2, section across the jaws, from the LEFT end (1 in = 100 px)</text>
  <line class="fixture-table" x1="60" y1="400" x2="420" y2="400"/>
  <rect class="clamp" x="140" y="223" width="60" height="177"/>
  <rect class="clamp" x="237.5" y="223" width="60" height="177"/>
  <text class="label-on-clamp" x="146" y="390">moving</text>
  <text class="label-on-clamp" x="247" y="390">fixed</text>
  <!-- A 1/2 + 9/16 in stack against each jaw, 1/8 in thick. -->
  <rect class="fixture-support" x="200" y="293.75" width="12.5" height="106.25"/>
  <rect class="fixture-support" x="225" y="293.75" width="12.5" height="106.25"/>
  <!-- The bar on edge, 3/8 across, B down; A faced from 1.25 to .840. -->
  <rect class="part-kept" x="200" y="209.75" width="37.5" height="84"/>
  <rect class="part-removed" x="200" y="168.75" width="37.5" height="41"/>
  <rect class="cutter" x="212" y="100" width="50" height="60"/>
  <line class="arrow" x1="245" y1="90" x2="215" y2="90"/>
  <line class="datum" x1="80" y1="293.75" x2="150" y2="293.75"/>
  <text class="datum-label" x="20" y="289">Z0 (B)</text>
  <line class="datum" x1="237.5" y1="140" x2="237.5" y2="166"/>
  <text class="datum-label" x="242" y="150">Y0 (F)</text>
  <text class="label-halo" x="204" y="285">B</text>
  <text class="label-halo" x="204" y="223">T</text>
  <line class="leader" x1="236" y1="190" x2="320" y2="170"/>
  <text class="label" x="322" y="168">edge A faced down to Z {{process.top_width_mm:in.4dot}} in levels: the top face T</text>
  <line class="dims" x1="340" y1="209.75" x2="340" y2="293.75"/>
  <line class="dims" x1="330" y1="209.75" x2="350" y2="209.75"/>
  <line class="dims" x1="330" y1="293.75" x2="350" y2="293.75"/>
  <text class="label" x="355" y="255">.840 B to T, jaw tops .133 below T</text>
  <text class="label" x="330" y="320">F against the fixed jaw, ends 1.6 in out past the jaws</text>
</svg>
