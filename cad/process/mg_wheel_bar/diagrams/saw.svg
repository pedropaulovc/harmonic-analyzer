<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="230"/>
  <text class="title" x="20" y="20">Setup 1, the bar lying flat in the saw's vise (plan, 1 in = 25 px)</text>
  <line class="fixture-table" x1="20" y1="160" x2="760" y2="160"/>
  <!-- The rest of the 72 in bar to the right of the blank. -->
  <rect class="part-rest" x="281" y="128.75" width="470" height="31.25"/>
  <!-- The blank, about 9.35 in, and the kerf. -->
  <rect class="part-kept" x="40" y="128.75" width="238" height="31.25"/>
  <rect class="part-removed" x="278" y="124" width="3" height="40"/>
  <rect class="clamp" x="310" y="98" width="60" height="30"/>
  <rect class="clamp" x="310" y="161" width="60" height="30"/>
  <text class="label-on-clamp" x="314" y="118">saw vise</text>
  <line class="dims" x1="40" y1="108" x2="278" y2="108"/>
  <line class="dims" x1="40" y1="102" x2="40" y2="124"/>
  <line class="dims" x1="278" y1="102" x2="278" y2="124"/>
  <text class="label-halo" x="60" y="100">blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in</text>
  <line class="leader" x1="279.5" y1="170" x2="279.5" y2="192"/>
  <text class="label" x="210" y="208">saw kerf</text>
  <text class="label" x="420" y="120">rest of the 3/8 x 1-1/4 in flat</text>
  <line class="datum" x1="40" y1="170" x2="40" y2="192"/>
  <text class="datum-label" x="46" y="192">LEFT end (marked)</text>
  <text class="label-halo" x="70" y="150">3/8 x 1-1/4 in 1018 CF, face F up</text>
  <text class="label" x="60" y="222">mark edge A (the near 3/8 in edge, toward you; it becomes the top face) and the far edge B</text>
</svg>
