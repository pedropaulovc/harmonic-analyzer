  <line class="arrow" x1="765" y1="135" x2="765" y2="205"/>
  <text class="label" x="640" y="275">right end: passes −Y</text>
  <!-- The edge finder on the milled left end, in the air. -->
  <circle class="cutter" cx="58.2" cy="185" r="7.0"/>
  <line class="datum" x1="65.2" y1="60" x2="65.2" y2="135"/>
  <text class="datum-label" x="20" y="55">X0: the edge finder on the milled LEFT end (the pickup)</text>
  <line class="dims" x1="65.2" y1="300" x2="248.3" y2="300"/>
  <line class="dims" x1="65.2" y1="205" x2="65.2" y2="305"/>
  <line class="dims" x1="248.3" y1="250" x2="248.3" y2="305"/>
  <text class="label" x="80" y="318">left end {{process.pickup_reach_min_mm:in.2f}}+ out past the jaws</text>
  <line class="dims" x1="65.2" y1="340" x2="716.4" y2="340"/>
  <line class="dims" x1="716.4" y1="205" x2="716.4" y2="345"/>
