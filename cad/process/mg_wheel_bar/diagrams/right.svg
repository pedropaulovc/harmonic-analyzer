  <line class="leader" x1="630" y1="153.8" x2="600" y2="70"/>
  <text class="label" x="480" y="64">clamp holes #9 at {{cad.clamp_hole_1_station_in:.3f}} and {{cad.clamp_hole_2_station_in:.3f}}</text>
  <line class="leader" x1="233.2" y1="150" x2="200" y2="70"/>
  <text class="label" x="140" y="80">axle bore (Setup 3): the pickup check</text>
  <text class="label" x="20" y="420">Section as Setup 3: F down on both stacks at the moving jaw, T at the fixed jaw, the .125 pin at B.</text>
