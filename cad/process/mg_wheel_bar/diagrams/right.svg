  <rect class="clamp" x="248.3" y="198.8" width="437.3" height="50"/>
  <text class="label-on-clamp" x="440" y="120">fixed jaw</text>
  <text class="label-on-clamp" x="440" y="230">moving jaw</text>
  <rect class="part-kept" x="65.2" y="140" width="655.4" height="58.8"/>
  <rect class="part-removed" x="716.4" y="140" width="4.2" height="58.8"/>
  <circle class="holes" cx="582.6" cy="153.8" r="7.0"/>
  <circle class="holes" cx="679.0" cy="153.8" r="7.0"/>
  <circle class="holes" cx="233.2" cy="153.8" r="6.5"/>
  <circle class="holes" cx="68.7" cy="153.8" r="6.3"/>
