# Wheel bar MHA-MG-08 (qty 1), routed for the CNC mill (agent's choice for
# speed, owner ruling 2026-11-21: the owner corrects the route afterwards).
# One sawn blank of the 3/8 x 1-1/4 in 1018 cold-finished flat (on hand,
# cad/config/shop-equipment/ stock.1018-flat-3-8x1-1-4) about 9.35 long. The
# bar's 3/8 thickness is the drawing's .374 depth AS SUPPLIED (the front and
# back faces are never cut); its 1-1/4 width comes down to the .43 height,
# .41 off each edge so the cold-finished skin leaves both sides and the bar
# stays straight.
#
# Route: saw; Setup 2 on edge, edge B down, face edge A down .41 to the top
# face (WB02_top); Setup 3 lying, front face down, the top face at the fixed
# jaw, the LEFT end .50 out past the jaws: mill the left end with the
# cutter's side, spot, drill #15 (hanger) and #17 (axle), ream the axle bore
# .1865 (WB03_left); Setup 4, the same hold slid along the jaws so the RIGHT
# end stands .50 out past them: mill the right end to the length, spot and
# drill both clamp holes #9 (WB04_right); Setup 5 on edge, the top face
# down, face edge B down to the .43 height (WB05_height); bench deburr,
# inspect.
#
# Re-clamp for a bar longer than the jaws (9.40 blank, 6.247 in jaws): a
# centred hold leaves each end 1.58 in out, and a #15 drilled .20 from the
# end bends the bar .002 there (prechips' milling deflection estimate), over
# a finish hole's limit. So each end's holes are drilled with that end held
# near the jaws (end_overhang_mm out past them): Setup 3 the left end and
# the hanger and axle holes, Setup 4 the right end and the two clamp holes.
# The pickup between them is the left end itself: Setup 3 mills it to X0;
# Setup 4 sets X0 on that milled end again with the edge finder (it stands
# 2.5 in out past the jaws' left side, in the air), so every station, the
# length included, counts from the one milled end; the edge finder's
# repeat (.0002) is a twenty-fifth of the clamp holes' ±.005. Setups 2 and
# 5 face along the whole bar, centred, each end 1.58 out. cam.py checks
# every hold's overhangs, the holes inside each hold's reach, the pickup's
# reach past the jaws, the grips, the stacks against every hole and the
# ends' passes clear of the jaws.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder) and every Z zero the end mill on a
# .002 feeler leaf; a to-size face's Z0 is the stacks' top, set from the
# miked width or depth, as the bottom guide's plan does.
#
# Not on hand, to buy before Setup 3 (flagged): the .1865 chucking reamer
# (shop-equipment tools.reamer-1865, to_order) and the axle bore's Class ZZ
# pins, a .1865 plus single (GO) and the .187 minus pin of the .061-.500 box
# (NO-GO), shop gauges.zz-pins-1865-1870; the pin-gauge sets
# (gauges.pin-gauges, to_order) for the drilled holes. Owner ruling
# 2026-11-23 (tool audit Q1, re-answered), verbatim: "ZZ singles per the
# record: 29 pins (17 plus GO, 12 minus NO-GO), about $130. Accept that good
# holes near a limit may be refused; the traveler mikes each pin so the real
# window is known per pin." It replaces the Class X .1865/.1870 pair. Setup 3
# mikes both pins and the reamer before clamping, and the station check over
# the GO pin uses its miked reading.
#
# NC (cam:mg_wheel_bar, cad/process/mg_wheel_bar/cam.py): WB02_top,
# WB03_left, WB04_right, WB05_height. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2 #2
# centre drill, T3 #17, T4 #15, T5 #9, T6 .1865 reamer.
title = "Wheel bar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/8 x 1-1/4 in flat: a plain carbon steel (drawing: {{cad.material_spec}})"
stock = "3/8 x 1-1/4 in flat bar; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.right_end_length_min_in:.2f}}–{{cad.right_end_length_max_in:.2f}} long (left end to right end), {{cad.bottom_face_height_min_in:.3dot}}–{{cad.bottom_face_height_max_in:.3dot}} high (top face to bottom face), {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} deep (the bar's 3/8 thickness as supplied). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home. After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every file is proved in air before it cuts. To buy before Setup 3: the .1865 reamer, the .1865/.1870 plug gauge pair and the pin gauge set (its .125 pin seats Setups 3 and 4)."
shop = "../shop"
stock_refs = ["1018-flat-3-8x1-1-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/mg_wheel_bar/features.toml"
adapter = "flat_bar"
part = "mg-wheel-bar"

[parameters]
quantity = 1
# The adapter's axes: the bar's length along model X, its thickness (the
# front and back faces) along model Z; the height is the bar's width.
blank_length_axis = 0
blank_thickness_axis = 2
# The blank (stock.1018-flat-3-8x1-1-4): sawn 9.30-9.40 long, the bar's
# width and thickness as supplied.
blank_length_in = 9.3
blank_length_max_in = 9.4
blank_length_min_mm = 236.22
blank_length_max_mm = 238.76
blank_width_in = 1.25
blank_thickness_in = 0.375
# The bar's 3/8 thickness in mm, and the thickest the saw's gate passes (the
# depth band's top): the programs' stock tops on it.
blank_thickness_mm = 9.525
depth_max_mm = 9.6266
# WB03's deepest point: the reamer's tip under F.
ream_tip_mm = -2.54
# The incoming bar gate on its width (author's choice, ±.005 about 1-1/4):
# WB02 faces from the widest.
bar_width_min_mm = 31.623
bar_width_max_mm = 31.877
# Targets (cam.py checks them against the export): the length the middle of
# its 9.1-9.3 band; the height the middle of its .42-.44 band. The top face
# is cut first, .840 above edge B (top_width_mm): .41 off the 1-1/4 width,
# the other .41 off edge B in WB05.
length_target_mm = 233.68
height_target_mm = 10.922
top_width_mm = 21.336
# The left end's skim (a sawn end's lean and burr); X0 is the finished left
# end, .060 right of the sawn one. The right end's finished station from the
# sawn left end (the end cuts' beam station).
left_end_skim_mm = 1.524
right_end_station_mm = 235.204
# The length on the work X DRO, the right end touched from the right with the
# .200 edge finder: the length band plus its radius (cam.py checks them).
length_dro_min_mm = 233.68
length_dro_max_mm = 238.76
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2), equal
# levels no deeper than .050 and two equal passes across the 3/8 edge, each
# 5.0125 mm (.197 in: 9.525 + cam.py's 0.5 overhang, in two; one would need
# 10.0), inside the measured face envelope, shop
# settings.em-half-carbide-1018-3439-face (dechatter session of 2026-11-23,
# #3439: stable to 6.4 mm wide at up to 1.27 mm deep, 2420-2490 rpm in the
# cut, conventional; the zigzag's return passes climb, and that half is not
# measured). The width declared is the passes' own, not the record's 6.4:
# at 6.4 prechips' bending estimate of WB05's free end is over the finish
# limit. cam.py starts each level with the
# cutter over the edge, so no pass takes more than the stepover.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.0125
face_step_max_mm = 1.27
# Ends: the same cutter's side, one level from the thickest bar's back face
# to .020 under the front face (end_axial_doc_mm, cam.py checks it), in
# equal radial steps no deeper than .030, one-way conventional passes across
# the bar. 10.13 mm deep is past the measured 6.6 mm (v6-deep), so the ends
# stay on the chart setting (settings.endmill-carbide-3fl-1-2-1018-cf).
end_step_max_mm = 0.762
end_past_mm = 0.508
end_axial_doc_mm = 10.1346
# Holes: spot Ø.140 with the #2 centre drill, under the #17 (no chamfer at
# the mouths), then each drill through, no peck (L/D 2.2 at most), its full
# diameter 1.0 mm past the front face into the air beside the stacks; its
# 118° point below that (cam.py checks the tips). The .1865 reamer fed
# through to .100 below the front face, in and out, spindle running.
spot_dia_mm = 3.556
drill_past_mm = 1.0
drill_17_tip_mm = -2.32
drill_15_tip_mm = -2.374
drill_9_tip_mm = -2.496
ream_past_mm = 2.54
# A reamer takes at most this much on the diameter after its drill (.016 in).
ream_stock_max_mm = 0.4064
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min, the low end taken; AutoDrill
# "Suggested drilling feed rates" (read 2026-11-20), row Stl, Carbon: 1/8 in
# .003 in/rev, a size between two columns taking the lower one's feed. #17
# (.173): 1300 rpm × .003 = 3.9 in/min; #15 (.180): 1250 × .003 = 3.75; #9
# (.196): 1150 × .003 = 3.45. The #2 centre drill as the bottom guide's spot:
# 1800 rpm × .001 = 1.8 in/min. Reaming (author's rule of thumb, as the
# pinion bracket's): half the drilling speed, 30 ft/min, .004 in/rev: .1865
# at 600 rpm = 2.4 in/min.
spot_feed_per_min_mm = 45.72
drill_17_feed_per_min_mm = 99.06
drill_15_feed_per_min_mm = 95.25
drill_9_feed_per_min_mm = 87.63
ream_feed_per_min_mm = 60.96
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick, 1/2-1 in by 1/16): Setup 2, a 1/2 + 9/16 in stack against each
# jaw (the jaw tops .133 under the top face's cut); Setups 3 and 4, two 1 +
# 1/2 in stacks side by side against the MOVING jaw (under edge B's .25
# strip, clear of the hole row); Setup 5, a 9/16 + 7/8 in stack against each
# jaw (the jaw tops .098 under the finished bottom face, a third of the .840
# gripped).
top_riser_height_mm = 26.9875
riser_height_mm = 38.1
height_riser_height_mm = 36.5125
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: the jaw height less each setup's stack.
top_grip_mm = 17.9578
lying_grip_mm = 6.8453
height_grip_mm = 8.4328
# Setups 2 and 5: the longest blank centred on the jaws, each end (its
# length − the jaw width)/2 out past the jaw sides; the jaws grip it from
# there to vise_clamp_end_mm (the beams' clamp).
vise_overhang_mm = 40.0431
vise_clamp_end_mm = 198.7169
# Setups 3 and 4 (the re-clamp): the near sawn end end_overhang_mm out past
# the jaws, read with the rule. Setup 3 grips the longest blank from there
# to left_clamp_end_mm; Setup 4 from right_clamp_start_mm to
# right_clamp_end_mm (the longest blank's sawn right end less the
# overhang). Setup 4's pickup: the milled left end stands at least
# pickup_reach_min_mm out past the jaws' left side (the shortest blank),
# room for the edge finder. The Z touch-offs: the end mill over the jaws'
# middle in each hold (Setup 4's for the shortest blank, within the jaws for
# any). cam.py checks them all.
end_overhang_mm = 12.7
left_clamp_end_mm = 171.3738
right_clamp_start_mm = 67.3862
right_clamp_end_mm = 226.06
pickup_reach_min_mm = 63.3224
z_touch_left_x_mm = 90.5129
z_touch_right_x_mm = 142.6591
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm). cam.py checks the
# collet's nose clears the bar at the deepest end-mill cut.
half_mill_projection_mm = 28.45
# ANSI B94.2 straight-shank chucking reamer, .1865: 4-1/2 in overall,
# bounded by its whole length below the chuck; the #2 centre drill 1-7/8 in;
# the #9 jobber drill 3-1/2 in.
reamer_oal_mm = 114.3
centre_drill_oal_mm = 47.625
drill_9_oal_mm = 88.9
# The axle bore's Class ZZ pins (owner ruling 2026-11-23, tool audit Q1; shop
# gauges.zz-pins-1865-1870): each pin is made within .0002 in = 0.00508 mm
# of its size, on one side. GO, the .1865 plus single, is .1865-.1867 in
# (4.7371 to 4.7371 + 0.00508 mm); NO-GO, the .187 minus pin of the box, is
# .1868-.1870 in (4.7498 - 0.00508 to 4.7498 mm). go_pin_min_mm and
# nogo_pin_max_mm are the band's own ends (cad axle bore dia), repeated in
# mm for the micrometer checks (test_zz_pin_windows binds all four). A pin
# miking outside its range is not used.
go_pin_min_mm = 4.7371
go_pin_max_mm = 4.7422
nogo_pin_min_mm = 4.7447
nogo_pin_max_mm = 4.7498

