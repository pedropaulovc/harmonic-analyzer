[[setups.operations]]
instruction = "Before clamping: mic T to edge B at the bar's middle and write it down (mm = in × 25.4). Home the mill ($H). G54 Y0 the bare fixed jaw's face, then clamp it as Holding says; X0 the milled LEFT end: edge finder (900 rpm)."
instruction_detailed = "Before clamping: mic T to B at the bar's middle; write it down in mm (in × 25.4). Home the mill ($H). Edge finder (900 rpm), the vise empty: on the fixed jaw's face, G10 L20 P1 Y-2.540. Clamp it as Holding says. Edge finder, its tip below the jaw tops, on the LEFT end from the left: G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top (T), from that reading and the end mill touched on edge B at the bar's middle."
instruction_detailed = "Console M6 T1 (the tool setter measures it); MDI G0 X116.840 Y-4.763. Spindle stopped, its tip just dragging a .002 feeler leaf on edge B: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove WB05_height in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run WB05_height (M6 T1; 2450, display near 2485): face edge B down to Z {{process.height_target_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.top_width_mm:in.3dot}}, in passes along the bar no wider than {{process.face_stepover_max_mm:in.3dot}}. Unclamp; mic the height."
settings = "em-half-carbide-1018-3439-face"
inspection = "Height {{cad.bottom_face_height_min_in:.3dot}}–{{cad.bottom_face_height_max_in:.3dot}}, T to the bottom face, miked at both ends and the middle."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.bottom_face_height_band_mm}}" }]
milling_cuts = [
  { name = "height", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.length_target_mm}}"] },
]

[[setups.operations]]
instruction = "Over {{cad.bottom_face_height_max_in:.3dot}}: wipe T and the stacks clean (a chip under it is the usual cause), then repeat this setup from its first op with the new middle reading (it sets Z0 again) and run WB05_height again; it faces only what stands above Z {{process.height_target_mm:in.4dot}}. Under {{cad.bottom_face_height_min_in:.3dot}}: the bar is scrap."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bar, back face toward the viewer, T up, the LEFT end on the left: the hanger hole, the reamed axle bore and the two clamp holes on one row .197 below the top face, at their stations from the left end; the edges broken." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file. Wash off the oil and dry."
feed = "hand"
inspection = "No burr stands proud of any face or end."
gauge_checks = "other"

[[setups.operations]]
instruction = "Hole sizes: the pin gauges in the hanger hole and in each clamp hole; the GO and NO-GO Class ZZ pins in the axle bore."
inspection = "Hanger hole Ø{{cad.hanger_hole_dia_min_in:.3dot}}–{{cad.hanger_hole_dia_max_in:.3dot}}: the .180 pin enters (GO), the .184 does not (NO-GO). Clamp holes Ø{{cad.clamp_hole_1_dia_min_in:.3dot}}–{{cad.clamp_hole_1_dia_max_in:.3dot}}: the .196 pin enters, the .200 does not. Axle bore: the GO pin still enters, the NO-GO still does not. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "pin-gauges", band_mm = "{{cad.hanger_hole_dia_band_mm}}" },
  { gauge = "pin-gauges", band_mm = "{{cad.clamp_hole_1_dia_band_mm}}" },
  { gauge = "zz-pins-1865-1870", band_mm = "{{cad.axle_bore_dia_band_mm}}" },
]

[[setups.operations]]
instruction = "The hole row's height from T: the .196 pin in clamp hole 1; the calipers from T over the pin, less half its Ø (.098)."
inspection = "{{cad.clamp_hole_1_height_min_in:.3dot}}–{{cad.clamp_hole_1_height_max_in:.3dot}} from T. The other holes: the program's Y from the same Y0, not gauged. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.clamp_hole_1_height_band_mm}}" }]

[[setups.operations]]
instruction = "The clamp holes' stations from the left end, on the surface plate: stand the bar on its LEFT end, F held flat by hand against the side of a 1-2-3 block stood on end, the .196 pin in each clamp hole in turn; the height gauge on the top of the pin, less half its Ø (.098)."
inspection = "Clamp hole 1 {{cad.clamp_hole_1_station_min_in:.3dot}}–{{cad.clamp_hole_1_station_max_in:.3dot}} and clamp hole 2 {{cad.clamp_hole_2_station_min_in:.3dot}}–{{cad.clamp_hole_2_station_max_in:.3dot}} from the left end. The hanger hole: the program's station from the same X0, its ±.010 band wider. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "height-gauge", band_mm = "{{cad.clamp_hole_1_station_band_mm}}" },
  { gauge = "height-gauge", band_mm = "{{cad.clamp_hole_2_station_band_mm}}" },
]

[[setups.operations]]
instruction = "Wipe every face and the holes with a film of light machine oil against rust in storage (the drawing's finish: {{cad.finish}}). Tag the bar {{cad.drawing_number}}."
feed = "hand"
