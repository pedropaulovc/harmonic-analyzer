[[setups.operations]]
instruction = "File done, still clamped, the bore's edges still sharp: try the GO pin, then the NO-GO pin, in the axle bore. The sheet accepts a bore from the GO pin's reading up to, not including, the NO-GO pin's reading (the first op of this setup). Both pass: skip the next two ops. GO refused: the next op. NO-GO enters: the op after it."
inspection = "Axle bore Ø{{cad.axle_bore_dia_min_in:.4dot}}–{{cad.axle_bore_dia_max_in:.4dot}} (a press fit on MHA-MG-07's axle): GO enters, NO-GO does not. With both pins at their limits only {{process.go_pin_max_mm:in.4dot}}–{{process.nogo_pin_min_mm:in.4dot}} is sure to pass: a good bore within .0002 of either end may be refused."
gauge_checks = [{ gauge = "zz-pins-1865-1870", band_mm = "{{cad.axle_bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "Only if the GO pin was refused (otherwise skip): still clamped, blow the chips out, oil the bore and ream it once more with T6 by MDI, then gauge it again as the op before. Still refused: the bar is rejected; stop and tell the owner (the pins cannot show the bore at or over {{cad.axle_bore_dia_min_in:.4dot}}; a reamer cuts no larger)."
instruction_detailed = "Only if the GO pin was refused (otherwise skip): blow the chips out, brush oil into the bore. Console M6 T6 (the tool setter measures it), S600 M3. G0 X{{cad.axle_bore_station_mm:.3f}} Y-{{cad.axle_bore_height_mm:.3f}}, G0 Z(the back-face reading in mm + 5.000); G1 Z{{process.ream_tip_mm:.3f}} F{{process.ream_feed_per_min_mm:.1f}}; G1 Z(the reading in mm + 5.000) at the same feed; M5. Gauge again with both pins."
feed = "hand"
inspection = "GO enters, NO-GO does not: go on (skip the next op). GO still refused: the bar is rejected; stop and tell the owner (the pins cannot show the bore at or over {{cad.axle_bore_dia_min_in:.4dot}}; a reamer cuts no larger)."
gauge_checks = [{ gauge = "zz-pins-1865-1870", band_mm = "{{cad.axle_bore_dia_band_mm}}" }]

[[setups.operations]]
instruction = "NO-GO enters: no cut remedies it. The bar is rejected; stop and tell the owner (nothing on the sheet shows the bore at or under {{cad.axle_bore_dia_max_in:.4dot}})."
feed = "hand"

[[setups.operations]]
instruction = "Still clamped: the axle bore's station from the left end."
instruction_detailed = "The GO pin in the axle bore; the calipers from the left end over the pin, less half the GO pin's miked reading (about .0933)."
inspection = "Axle bore {{cad.axle_bore_station_min_in:.3dot}}–{{cad.axle_bore_station_max_in:.3dot}} from the left end. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.axle_bore_station_band_mm}}" }]

