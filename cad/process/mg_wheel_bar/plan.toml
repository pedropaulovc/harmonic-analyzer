[[setups.operations]]
instruction = "Before clamping, on the bench: with the .0001 micrometer (it reads to about ±.00005), mike the GO pin, the NO-GO pin, and the reamer across two opposite margins at its front end. Write the three readings here, and each pin's reading on its tag."
inspection = "GO pin {{cad.axle_bore_dia_min_in:.4dot}}–{{process.go_pin_max_mm:in.4dot}}; NO-GO pin {{process.nogo_pin_min_mm:in.4dot}}–{{cad.axle_bore_dia_max_in:.4dot}}. A pin outside its range is not used: get another before running WB03_left."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.go_pin_min_mm}}", "{{process.go_pin_max_mm}}"] }, { gauge = "micrometers", band_mm = ["{{process.nogo_pin_min_mm}}", "{{process.nogo_pin_max_mm}}"] }]
feed = "hand"

[[setups.operations]]
instruction = "Only if the reamer read under the GO pin's reading (otherwise skip): before clamping the blank, clamp a 1018 offcut in the vise and make a trial hole by hand at the console: the #17 drill through at 1300 rpm, then the .1865 reamer through at 600 rpm, cutting oil. Gauge it with both pins: GO refused, stop and tell the owner (this reamer's holes would be refused)."
feed = "hand"

[[setups.operations]]
instruction = "Before clamping: mic F to the back face at the blank's middle and write it down (mm = in × 25.4). Home the mill ($H). G54 Y0 on the bare fixed jaw's face (it becomes T's) with the edge finder."
instruction_detailed = "Before clamping: mic F to the back face at the blank's middle; write it down in mm (in × 25.4). Home the mill ($H). Edge finder (900 rpm), the vise empty: on the fixed jaw's face, G10 L20 P1 Y-2.540."
feed = "hand"

[[setups.operations]]
instruction = "Clamp it as Holding says. G54 X0 {{process.left_end_skim_mm:in.3dot}} right of the sawn LEFT end, where WB03 mills it, with the edge finder."
instruction_detailed = "Clamp it as Holding says. Edge finder (900 rpm) on the sawn LEFT end from the left: G10 L20 P1 X-4.064. The end mill takes that end back to X0, so every station counts from the end it leaves."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top (F), from that reading and the end mill touched on the back face over the jaws."
instruction_detailed = "Console M6 T1 (the tool setter measures it); MDI G0 X{{process.z_touch_left_x_mm:.3f}} Y-10.668 (over the middle of the jaws). Spindle stopped, its tip just dragging a .002 feeler leaf on the back face: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove WB03_left in air, Z0 raised 1.000 in; every move clears the jaws, the stacks and the pin, through every M6. Then Z0 back."
feed = "hand"

