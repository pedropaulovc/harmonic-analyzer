[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/8 x 1-1/4 in flat bar with one blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar's thickness (3/8) and width (1-1/4) at its end and 10 in along it."
inspection = "Thickness {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} (it is the finished depth: never cut); width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}. Outside: stop, the programs assume this section."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.back_face_depth_band_mm}}" },
  { gauge = "micrometers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/8 x 1-1/4 in 1018 flat, the bar flat in the saw's vise. File the burr off both ends and the four long edges so it seats flat on the parallels and the jaws. With marking fluid, the blank lying with one 1-1/4 in face up and one end to your left: mark that end LEFT (every X counts from it), the face up F (the front face) and the 3/8 in edge nearest you A (it becomes the top face); the far edge is B."
feed = "hand"
inspection = "Blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long, the combination square's 12 in blade. Shorter: saw another; longer: saw it again."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Top face, on edge"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1/2 in and a 9/16 in parallel of the set stacked against each jaw ({{process.top_riser_height_mm:in.4dot}} in). The blank on edge on them, edge B down, edge A up, F against the FIXED jaw, gripped across its two 1-1/4 in faces, LEFT end to the left, centred on the jaws (both ends about 1.6 in out past them). Tap it down onto both stacks along its length while closing the vise. The lower {{process.top_grip_mm:in.3dot}} of its width is in the jaws."
datum = "Program WB02_top. G54: X0 {{process.left_end_skim_mm:in.3dot}} right of the LEFT end (where Setup 3 mills that end), Y0 the fixed jaw's face (F), +Y toward it; Z0 the stacks' top (edge B), set from the miked width. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/top.svg", alt = "The blank on edge on stacked parallels, edge B down, F at the fixed jaw; the 1/2 in end mill faces edge A down in levels to the top face, .840 above edge B." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_thickness_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.top_riser_height_mm}}", "{{process.bar_width_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.top_riser_height_mm}}", "{{process.top_width_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_thickness_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{process.bar_width_max_mm}}", parallel_height_mm = "{{process.top_riser_height_mm}}", overhang_mm = ["{{process.vise_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.blank_length_max_mm}}"], clamp_mm = ["{{process.vise_overhang_mm}}", "{{process.vise_clamp_end_mm}}"], section_mm = { y = "{{cad.back_face_depth_mm}}", z = "{{process.top_width_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before clamping: mic edge B to edge A at the blank's middle and write it down (mm = in × 25.4). Home the mill ($H). G54 Y0 the bare fixed jaw's face, then clamp it as Holding says; X0 {{process.left_end_skim_mm:in.3dot}} right of the LEFT end: edge finder (900 rpm)."
instruction_detailed = "Before clamping: mic B to A at the blank's middle; write it down in mm (in × 25.4). Home the mill ($H). Edge finder (900 rpm), the vise empty: on the fixed jaw's face, G10 L20 P1 Y-2.540. Clamp it as Holding says. Edge finder, its tip below the jaw tops, on the blank's LEFT end from the left: G10 L20 P1 X-4.064 (its .100 radius plus the {{process.left_end_skim_mm:in.3dot}} end skim)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top (edge B), from that reading and the end mill touched on edge A at the blank's middle."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it); MDI G0 X116.840 Y-4.763 (the blank's middle, over edge A). Spindle stopped, its tip just dragging a .002 feeler leaf on edge A: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove WB02_top in air: Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run WB02_top, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run WB02_top (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): face edge A down to Z {{process.top_width_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.bar_width_max_mm:in.3dot}} (the widest bar: a narrower one cuts air first), in passes along the bar no wider than {{process.face_stepover_max_mm:in.3dot}}. Unclamp; mark the new face T (the top face) with marking fluid."
settings = "em-half-carbide-1018-3439-face"
inspection = "Width B to T {{process.top_width_mm:in.3dot}}, miked at both ends and the middle: within .005 of it (the height is cut to size in Setup 5). Over: the next op. Under: stop and tell the owner."
gauge_checks = "other"
milling_cuts = [
  { name = "top face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = ["{{process.left_end_skim_mm}}", "{{process.right_end_station_mm}}"] },
]

[[setups.operations]]
instruction = "Only if the width is over: mic B to T at the middle and write it down (mm). Clamp it again as Holding says, T up. The re-clamp moves the bar: pick up G54 X0 again on the LEFT end."
instruction_detailed = "Only if the width is over: mic B to T at the middle; write it down in mm. Clamp it again as Holding says, T up. Edge finder (900 rpm), its tip below the jaw tops, on the LEFT end from the left: G10 L20 P1 X-4.064 (Y0 stays: the fixed jaw has not moved)."
feed = "hand"

[[setups.operations]]
instruction = "Then touch the end mill off on T as in Op 40 (Z0 from that reading) and run WB02_top again: it faces only what stands above Z {{process.top_width_mm:in.4dot}}."
feed = "hand"
inspection = "Width B to T within .005 of {{process.top_width_mm:in.3dot}}. Still over: wipe the stacks and repeat from the op before; under: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "File the milling burr off T's two long edges (T to F and T to the back face), a light stroke along each: T seats against the fixed jaw in Setups 3 and 4 and on the stacks in Setup 5."
feed = "hand"
inspection = "No burr stands proud along T's edges (a fingernail drawn across). Proud: file it again."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Left end; the hanger hole and the axle bore"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Two stacks of the 1 in and the 1/2 in parallels (1.5 in) side by side against the MOVING jaw (1/4 in wide in all), centred along the jaws, none at the fixed jaw: the holes, .197 from T, exit clear of them. The blank lying on them along the jaws, F down, T against the FIXED jaw, edge B (as bought) at the moving jaw, the sawn LEFT end {{process.end_overhang_mm:in.2f}} out past the jaws' left side (the rule), the rest out past their right side. The .125 pin of the pin-gauge set laid along edge B between it and the moving jaw, on the stacks' top, so the jaw seats T flat against the fixed jaw. The stacks (4 in long) and the pin lie wholly between the jaws' sides: the end mill passes .020 below their top just outside the jaws. Tap it down onto the stacks along its length while closing the vise. The lower {{process.lying_grip_mm:in.3dot}} of its thickness is in the jaws."
datum = "Program WB03_left. G54: X0 {{process.left_end_skim_mm:in.3dot}} right of the sawn LEFT end (where WB03 mills that end), Y0 the fixed jaw's face (T), +Y toward it; Z0 the stacks' top (F), set from the miked thickness. The hanger hole at X {{cad.hanger_hole_station_in:.3f}} and the axle bore at X {{cad.axle_bore_station_mm:in.4f}} in (X{{cad.axle_bore_station_mm:.3f}} mm), Y −{{cad.axle_bore_height_in:.3f}} in. At every M6 stop the file has stopped the spindle and lifted the tool above the bar."
diagram = { file = "diagrams/left.svg", alt = "The blank lying front face down on two stacks at the moving jaw, the top face at the fixed jaw, its left end just out past the jaws; the 1/2 in end mill's side mills the left end, the centre drill spots, the #15 and #17 drill the hanger hole and the axle bore through beside the stacks and the .1865 reamer reams the axle bore." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.top_width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.depth_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.ream_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.top_width_mm}}", along_jaws_mm = "{{process.blank_length_max_mm}}", part_height_mm = "{{cad.back_face_depth_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.end_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "as_bought", moving_jaw_contact = "rod" }
