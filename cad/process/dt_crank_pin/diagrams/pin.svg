  <circle class="leader-dot" cx="94" cy="124" r="2"/>
  <text class="label" x="520" y="60">small end Ø.183 REF</text>
  <line class="leader" x1="600" y1="66" x2="629.4" y2="92.18"/>
  <circle class="leader-dot" cx="629.4" cy="92.18" r="2"/>
