<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the vise from the front (the operator's side, looking +Y): +X to the right, +Z up, the fixed jaw (paper folded over it) behind the pin; the moving jaw, in front, is not drawn. To scale at 5 px/mm: the pin (cad.taper_dia_ref, cad.taper_length_ref, 1:48), big end to the LEFT, its rim (X0) .25 past the jaws' left face (process.big_end_overhang_mm), lying on the 1 in x 4 in parallel on edge (process.riser_height_mm, process.parallel_length_mm) whose left end is flush with the jaws; the spacer S, two wrung gauge blocks 1.375 x .35 (process.spacer_length_mm, process.spacer_height_mm), on its right end; the jaw tops 14.062 mm over Z0 (process.jaw_top_over_pin_mm), the jaw's height from process.vise_jaw_height_mm, its length to a break line; the paper's thickness is not drawn. The #45 drill (process.drill_45_dia_mm, 10.4 px) at X 3.810 (cad.ring_hole_station_mm), its point at Z-6.609, DP01's posted depth: its full diameter 0.5 mm (process.hole_drill_past_mm) under the pin, in air. The #1 centre drill's spot (T1) is under it and not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="430"/>
  <text class="title" x="20" y="22">Setup 2, DP01 T2: the #45 drill pecks the ring hole through the overhang, seen from the front (to scale, 5 px/mm)</text>
