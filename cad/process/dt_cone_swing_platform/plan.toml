diagram = { file = "diagrams/outline-drill-43.svg", alt = "Section at the hold-down, 8 px/mm: the #43 down through the hold-down hole and its counterbore, {{process.holddown_seat_depth_mm:in.3dot}} into the plate." }
rpm = 2800
feed = "{{process.drill_43_feed_per_min_mm:in.1f}} in/min"
