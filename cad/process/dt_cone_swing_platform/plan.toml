outline_through_mm = 0.508
outline_bottom_mm = -0.508
finish_stock_mm = 0.254
outline_levels = 8
outline_level_mm = 0.8731
# Setup 4's beam: the platform between its post screws and the hold-down,
# at its narrowest there (beside the hold-down: E to the west edge, 1.08 in).
platform_narrowest_mm = 27.5
finish_levels = 2
finish_level_mm = 3.4925
clear_offset_mm = 6.4
# The relief: Z0 its floor. Fit branch (the bar t thicker than the
# shoulder's length L): the floor L above the plate's top, the bar's top at
# most the thickest bar less the shortest shoulder (shoulder_min_mm:
# McMaster 91829A560, 1/4 in +.002/-0) over it. REF branch (t at or under
