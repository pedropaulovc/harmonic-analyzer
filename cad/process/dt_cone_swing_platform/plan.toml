# past 3 diameters). Each L hole lets its 1/4-20 screw float screw_float_mm
# a side, for the tram on E.
plate_drill_rpm = 2800
drill_l_feed_per_min_mm = 213.36
drill_25_feed_per_min_mm = 142.24
drill_43_feed_per_min_mm = 106.68
drill_l_tip_mm = -15.413
screw_float_mm = 0.508
peck_25_mm = 2.54
peck_43_mm = 1.27
drill_25_tip_mm = -14.3408
# The hold-down's 4-40 seat in the plate: #43 holddown_seat_depth_mm deep;
# the plug tap tap_4_40_turns turns past its first bite (tap_4_40_depth_mm);
# the #4-40 x 1/2 screw (holddown_screw_length_mm) reaches its full threads
