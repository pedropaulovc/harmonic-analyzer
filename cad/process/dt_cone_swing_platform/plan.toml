instruction = "G54 Y0 on the fixed jaw's face, X0 on the blank's marked end (edge finder at 900 rpm). Console M6 T1 (1/4 in end mill, at least {{process.quarter_projection_min_mm:in.3dot}} out of its collet). Z0: T1's end on a .002 leaf on the underside."
instruction_detailed = "Edge finder (900 rpm) on the fixed jaw's face from −Y: G10 L20 P1 Y−2.540. MDI G0 Y−31.75; on the blank's marked end from −X: G10 L20 P1 X−2.540. Console M6 T1 (the tool setter measures it). MDI G0 X120 Y−31.75, spindle stopped, its end just dragging a .002 leaf on the underside: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL01_holes in air, Z0 raised 1.000 in: watch every move clear the jaw tops and every cut stay outside the jaws' ends. Then Z0 back."
