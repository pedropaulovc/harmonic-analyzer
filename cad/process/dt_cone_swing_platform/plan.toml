peck = { step_mm = 1.27, retract = "full" }
beam = { axis = "x", hold = "between", extent_mm = [0, "{{process.spoil_plate_length_mm}}"], supports_mm = [266.7, 381.0], section_mm = { y = "{{process.spoil_plate_width_mm}}", z = "{{process.spoil_plate_thickness_mm}}" } }
milling_cuts = [
  { name = "holddown seat", kind = "drill", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 2.2606, flutes = 2, rpm = 2800, feed_mm_min = "{{process.drill_43_feed_per_min_mm}}", stations_mm = 325.6 },
]

[[setups.operations]]
speed_kind = "spindle"
