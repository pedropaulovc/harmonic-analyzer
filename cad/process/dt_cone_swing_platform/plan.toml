[[setups.operations]]
instruction = "Blow out the chips. Try the MHA-DT-VN-52 shoulder screw that goes with this platform down the pivot bore from the top, by hand."
inspection = "The shoulder enters the full depth by hand (drawing: MHA-DT-VN-52 SHOULDER ENTERS, SWINGS FREE; the swing is tried at assembly)."
gauge_checks = "other"

[[setups.operations]]
instruction = "Shoulder refused: blow out the chips and oil the bore; Console M6 T6 (the same reamer). MDI: G53 G0 Z0, G0 X0 Y0, M3 S600, G0 Z15, G1 Z{{process.ream_tip_mm:.3f}} F{{process.ream_feed_per_min_mm:.1f}}, G1 Z15, G53 G0 Z0, M5. Try it again. Still refused: stop and tell the owner."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run PL06_holddown_tap: M6 T11, the tap guide, spindle off; the file ends Idle at the machine top over the hold-down hole."

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
drilling = "none"
sizing = "other"
instruction = "Tap #4-40 into the plate by hand under the tap guide, down through the hold-down hole, as Setup 2: {{process.tap_4_40_turns:d}} turns past the first bite ({{process.tap_4_40_depth_mm:in.2f}} into the plate), a half turn back each turn. Jog Z up, back the tap out, blow out the hole."
diagram = { file = "diagrams/outline-tap-4-40.svg", alt = "Section at the hold-down, 4 px/mm: the #4-40 tap down through the hold-down hole into the plate, under the tap guide and the T-handle wrench, all in the cutter colour." }
feed = "hand"

[[setups.operations]]
instruction = "Run PL07_wedge_tap (M6 T11, spindle off; Idle over the wedge screw's hole). Tap #10-24 through the plate by hand under the guide, down through the blank's #7 hole, until the full threads show under the plate. Jog up, back the tap out, blow out."
diagram = { file = "diagrams/outline-tap-10-24.svg", alt = "Section at the wedge screw's hole, 4 px/mm: the #10-24 tap down through the blank's #7 hole and through the plate, under the tap guide and the wrench." }
feed = "hand"

[[setups.operations]]
instruction = "Screw a #4-40 x 1/2 SHCS into the hold-down seat and a #10-24 x 1/2 SHCS into the wedge seat, each snug on the top face: the hold-down holds the pivot end, the wedge screw the waste wedge once the outline is through."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL08_outline in air, Z0 raised 1.000 in: send $#, note the G54 Z; G10 L2 P1 Z(noted Z + 25.4); run it: every move clears the hold-down and wedge screw heads and the clamps; E is cut only at the pivot-end corner's round. Then G10 L2 P1 Z(noted Z)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-quarter"
drilling = "none"
sizing = "other"
instruction = "Run PL08_outline (M6 T1, 1/4 in end mill; set 2800, brush oil): one running file, three stages: a clearing pass along the chamfer takes the blank's corner there; the rough pass round the outline {{process.finish_stock_mm:in.3dot}} outside the line, {{process.outline_levels:d}} levels of {{process.outline_level_mm:in.3dot}}; the finish pass on the line, {{process.finish_levels:d}} levels of {{process.finish_level_mm:in.3dot}}. Each level plunged in air beside E; all conventional (G3), {{process.outline_through_mm:in.3dot}} into the plate."
diagram = { file = "diagrams/outline-mill.svg", alt = "Plan, 2.5 px/mm: the 1/4 in end mill on PL08's first pass, along the chamfer at Z5.604, taking the blank's corner; then round the outline anticlockwise." }
settings = "endmill-carbide-3fl-1-4-1018-cf"
rpm = 2800
feed = "{{process.em_quarter_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "outline rough", kind = "slot", phase = "rough", cutter_dia_mm = 6.35, flutes = 3, rpm = 2800, feed_mm_min = "{{process.em_quarter_feed_per_min_mm}}", axial_doc_mm = "{{process.outline_level_mm}}", radial_woc_mm = 6.35, stations_mm = [-235.0, -112.0, 7.0] },
  { name = "outline finish", kind = "side", phase = "finish", cutter_dia_mm = 6.35, flutes = 3, rpm = 2800, feed_mm_min = "{{process.em_quarter_feed_per_min_mm}}", axial_doc_mm = "{{process.finish_level_mm}}", radial_woc_mm = "{{process.finish_stock_mm}}", stations_mm = [-235.0, -112.0, 7.0] },
]

[[setups.operations]]
instruction = "Spindle stopped, blow the chips away. T1 out of the spindle, the edge finder in (900 rpm): on the pivot-end edge from +X at Y0. X0 is the pivot's axis, so the DRO X there (mm) less 2.540 is that edge's station."
inspection = "Pivot-end edge {{process.north_station_min_mm:.2f}}–{{process.north_station_max_mm:.2f}} mm ({{cad.north_edge_station_min_in:.2f}}–{{cad.north_edge_station_max_in:.2f}} in) from the pivot's axis: the outline's registration on the pivot. Outside: stop and tell the owner. Not gauged: the rest of the outline and the post, hold-down and wedge holes (PL01 drilled them with the pivot in one program; the paths hold them). Setup 5 checks the relief's and the notch's widths."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.north_edge_station_band_mm}}" }]

[[setups.operations]]
instruction = "Unscrew the wedge screw and lift the waste wedge off (it is free: never lever it against the part). Screw the VN-52 shoulder screw into the wedge seat until its shoulder seats on the plate; find the gauge-block stack that just slides between the plate and the head's underside: L, the shoulder's length. Take the screw out."
inspection = "L read to .0001 on the job card beside t. t over L: the FIT branch (floor L above the underside, drawing note 1). t at or under L: the REF branch (floor .010 below the top; shims at assembly, owner ruling 2026-11-22)."
gauge_checks = [{ gauge = "gauge-blocks-mitutoyo", band_mm = [6.35, 6.4008] }]

[[setups.operations]]
instruction = "Edge finder out. Console M6 T1 (the tool setter measures it), spindle stopped. FIT branch: its end on a .002 leaf on the plate's top (X25 Y0), G10 L20 P1 Z(.051 − L in mm). REF branch: on the leaf on the platform's top (X−40 Y0), G10 L20 P1 Z0.301. Z0 is now the relief's floor."
instruction_detailed = "Edge finder out, T1 back in: Console M6 T1 (the tool setter measures it). FIT branch: MDI G0 X25 Y0; jog T1 down until it just drags a .002 leaf on the plate's top; G10 L20 P1 Z(0.051 − L), L in mm (L in × 25.4): the plate's top reads −L. REF branch: MDI G0 X−40 Y0 (over the platform, clear of the hold-down head); the leaf on the platform's top; G10 L20 P1 Z0.301: the top reads 0.250 (.010)."
feed = "hand"

[[setups.operations]]
instruction = "Prove PL09_relief in air, Z0 raised 1.000 in: send $#, note the G54 Z; G10 L2 P1 Z(noted Z + 25.4); run it: every move clears the hold-down screw's head. Then G10 L2 P1 Z(noted Z)."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-quarter"
drilling = "none"
sizing = "other"
instruction = "Run PL09_relief (M6 T1; set 2800): one level at Z0 (the branch's floor), in from beside the pivot-end edge along E's side, round the pivot (G2) and out along the far side: the relief {{cad.top_relief_width_nominal_in:.2dot}} wide, R{{cad.top_relief_end_radius_nominal_in:.2dot}} about the pivot, open to the pivot-end edge."
diagram = { file = "diagrams/outline-relief.svg", alt = "Plan of the pivot end, 8 px/mm: the 1/4 in end mill on the relief's floor, in from the pivot-end edge along E's side, round the pivot and out along the far side." }
settings = "endmill-carbide-3fl-1-4-1018-cf"
rpm = 2800
feed = "{{process.em_quarter_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "relief", kind = "slot", phase = "finish", cutter_dia_mm = 6.35, flutes = 3, rpm = 2800, feed_mm_min = "{{process.em_quarter_feed_per_min_mm}}", axial_doc_mm = "{{process.relief_stock_top_mm}}", radial_woc_mm = 6.35, stations_mm = [0.0, 7.0] },
]

[[setups.operations]]
instruction = "FIT branch only (REF: skip to the shims op). Take out the hold-down and the post screws. Lay the platform on the plate, its bore over the wedge seat (the flat face L was read on); VN-52 down through the bore into that seat, tight. Swing the platform a few degrees each way, clear of the clamps; push and pull its free end along the screw's axis."
inspection = "Swings free with no tight spot and no axial shake felt (drawing note 1). Free: skip the next op. Tight: the next op. Shake: stop and tell the owner."
gauge_checks = "other"

[[setups.operations]]
instruction = "FIT branch, tight only: VN-52 out; the platform back on its post screws, E trammed as above, hold-down screw in. T1 out of its collet, its 1/4 in shank stood down in the bore: pick up G54 X/Y on it as above; shank and edge finder out, T1 back. Send $#, note G54 Z; G10 L2 P1 Z(noted Z − 0.013) (.0005 lower; no touch-off). Run PL09_relief again (its M6 T1 measures T1); repeat the swing test."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "shims"
drilling = "none"
sizing = "other"
instruction = "REF branch only: no swing test here. The shim washers go under the VN-52 head at assembly (MHA-DT-00), stacked until it swings free with no shake. Write \"REF branch, t and L\" on the job card that goes with the platform."
feed = "hand"

[[setups.operations]]
instruction = "Take the hold-down and post screws out and lift the platform off the plate. Keep the VN-52 with the platform for assembly."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/bench.svg", alt = "The finished platform top up: the pivot bore and the top relief at the pivot end, the counterbored hold-down beside them, the two post taps near the marked end, the lock notch in the far edge, the chamfered corner." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr every milled edge top and bottom, the notch's and the relief's edges, both mouths of the four holes (two post taps, pivot, hold-down) and the counterbore's rim to R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max (deburring tool, smooth file). Break E's two long corners the same, lightly: E stays straight. Never stone the underside's face."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-1-4-20"
drilling = "none"
sizing = "other"
instruction = "Run the 1/4-20 tap through both post taps again by hand to clear the burrs; wash off the oil and chips."
feed = "hand"

[[setups.operations]]
instruction = "The relief and the notch: calipers' inside jaws across each, square to its sides."
inspection = "Relief {{cad.top_relief_width_min_in:.2f}}–{{cad.top_relief_width_max_in:.2f}} wide; notch {{cad.lock_notch_width_min_in:.2f}}–{{cad.lock_notch_width_max_in:.2f}} wide. Outside: tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.top_relief_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.lock_notch_width_band_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "Black oxide: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/bench.svg", alt = "The finished platform, as inspected, to be blackened all over: faces, edges, the bore, the holes and the relief." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}: all over, no masking (the #52 hole is made after, at assembly). Done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup: the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the platform with soap and water to take off the oil and the marker; rinse and dry it. Hold it by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "No sanding: the machined edges are fresh metal already (the maker's step 1), and the faces are the bar's as supplied. A rust spot or stain only: touch that spot lightly with the 220 roll, never on the underside. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface with even, light strokes, into the bore, the counterbore, the tapped holes and the relief; re-wet the brush and go over the edges, the holes and any light spot until the platform is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse the platform thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess; oil the tapped holes."
feed = "hand"
inspection = "Even black all over, no bare spot and no wiping-off coating. Fit after blackening: the MHA-DT-VN-52 shoulder still enters the bore by hand. Tight: stop and tell the owner; do not re-ream."
gauge_checks = "other"
