tool = "tap-1-4-20"
drilling = "none"
sizing = "other"
instruction = "Tap 1/4-20 through by hand under the tap guide, spindle off, cutting oil: tap's point in the hole, jog Z down until the guide's point is pushed fully home in the wrench, then turn the wrench, a half turn back each turn; the spring follows the tap. Stop when the tap's full threads show past the top face (the full .25 thickness threaded: note 2's .88D engagement)."
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, back the tap out by hand. Run PL03_post_near_tap (M6 T11, spindle off; ends Idle over the post hole nearer E) and tap it the same way; jog up, back the tap out, blow out both holes."
feed = "hand"

[[setups.operations]]
instruction = "Unclamp. File the exit burrs off the top face at the five holes and stone both faces' sawn-end corners; take any raised burr off the underside (U) at the counterbore's rim and the hole mouths with the deburring tool, without stoning U's face, so U seats flat on the spoil plate's top in Setup 4."
feed = "hand"

