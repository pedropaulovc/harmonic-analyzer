blank_thickness_axis = 1
# The blank: the platform's 9.53 in along edge E (plate_along_mm, the NW
# round to the chamfer's south end) with north_waste_mm and south_waste_mm
# at its ends after facing (faced_length_mm), south_face_mm faced off the
# sawn south end and the rest off the north end, sawn 9.70-9.76 in.
blank_length_in = 9.7
blank_length_max_in = 9.76
blank_length_min_mm = 246.38
blank_length_max_mm = 247.904
blank_length_mm = 247.142
blank_width_in = 2.5
blank_thickness_in = 0.25
# The drawing's thickness band, the as-supplied bar's (top_face).
blank_thickness_min_mm = 6.223
blank_thickness_max_mm = 6.477
# The platform laid on E: E stands edge_e_from_pivot_mm east of the pivot,
# lay_angle_deg off the drawing's length axis; it spans plate_across_mm
# square to E (of the bar's 2.5 in).
edge_e_from_pivot_mm = 16.2245
lay_angle_deg = 1.8612
plate_across_mm = 60.1167
north_waste_mm = 1.5
south_waste_mm = 1.0
faced_length_mm = 244.6388
south_face_mm = 1.0
north_face_max_mm = 2.2652
end_woc_max_mm = 2.54
# Holding, Setup 2 (shop workholding.vise-pm-6): two 1 in parallels
# (fixtures.parallels-lms-6745) on the vise bed, one against each jaw; the
# blank on them underside up, gripped on its edges, E on the fixed jaw. The
# jaws' tops stand s2_jaw_top_mm over the underside (Z0): jaw height less
# the parallels and the thinnest bar (cam.py).
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_height_mm = 25.4
s2_jaw_top_mm = 13.3223
# The blank centred in the jaws: its south end s2_overhang_min_mm-
# s2_overhang_max_mm past the jaws' left ends (s2_overhang_mm on the nominal
# blank). The south holes reach s2_south_reach_mm from X0 and the north ones
# start at s2_north_reach_mm: cam.py proves both 1.5 mm clear of the jaws.
s2_overhang_mm = 44.2341
s2_overhang_min_mm = 43.18
s2_overhang_max_mm = 45.72
s2_south_reach_mm = 31.8807
s2_north_reach_mm = 217.695
pivot_x2_mm = 236.997
holddown_x2_mm = 220.362
# The ends: the 1/4 in end mill's side, end_levels levels of end_level_mm
# to end_bottom_mm (the thickest bar and through_past_mm below it, into air).
through_past_mm = 0.254
end_levels = 3
end_level_mm = 2.2437
end_bottom_mm = -6.731
# Spots with the #1 centre drill Ø.100 on its countersink (under every drill
# it starts).
spot_dia_mm = 2.54
spot_rpm = 2800
spot_feed_per_min_mm = 35.56
# Drills in 1018: #31 at 2800 rpm, .001 in/rev (2.8 in/min, as the crank
# arm's #43); B at 1200, .002 (2.4 in/min) and #7 at 1500, .002 (3.0 in/min),
# the channel lever's D and #21 speeds for their sizes; each through in one
# feed (at most 3 diameters deep), its full diameter drill_past_mm past the
# far face (tip = thickest bar + past + the 118° point; cam.py).
drill_31_rpm = 2800
drill_31_feed_per_min_mm = 71.12
drill_b_rpm = 1200
drill_b_feed_per_min_mm = 60.96
drill_7_rpm = 1500
drill_7_feed_per_min_mm = 76.2
drill_past_mm = 0.5
drill_31_tip_mm = -7.8927
drill_b_tip_mm = -8.7932
drill_7_tip_mm = -8.5108
# The .2510 reamer, Setup 4 (the bar flat on the spoil plate, its thrust
# into the plate): 600 rpm, .004 in/rev (2.4 in/min) in and out at feed,
# its full diameter ream_past_mm into the plate (ream_tip_mm below Z0); the
# B drill re-enters its hole first, its full diameter drill_past_mm deeper
# (pivot_redrill_tip_mm), and leaves the reamer ream_allowance_mm on the
# diameter (the channel lever's reamer speeds).  The bore prints no band:
# the MHA-DT-VN-52 shoulder entering by hand accepts it (owner ruling
# 2026-11-24, fit audit question 10), so no pins.
ream_rpm = 600
ream_feed_per_min_mm = 60.96
ream_past_mm = 1.5
ream_tip_mm = -1.5
pivot_redrill_tip_mm = -3.8162
ream_allowance_mm = 0.3302
# Drills and the reamer stand at least 1.00 in out of the chuck, the 1/4 in
# end mill 1.375 in (of its 3 in) and the 1/8 in end mill .75 in out of
# their collets: each nose clears the jaw tops at its tool's deepest point
# (cam.py), and the shortest reaches Setup 4's deepest cut (machine
# capacity: the spindle's 2.46 in least height over the table).
drill_projection_min_mm = 25.4
quarter_projection_min_mm = 34.925
eighth_projection_min_mm = 19.05
# The counterbore: the 1/8 in end mill's centre on a G2 helix of
# cbore_path_radius_mm about the hold-down's axis, cbore_helix_pitch_mm a
# turn, to the counterbore's nominal depth, then one level turn.  .0425 in
