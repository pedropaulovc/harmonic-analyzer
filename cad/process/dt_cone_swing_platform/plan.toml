em_quarter_rpm = 2800
em_quarter_feed_per_min_mm = 363.22
em_eighth_rpm = 2800
em_eighth_feed_per_min_mm = 213.36
# Setup 3: the spoil plate (spoil_plate_* mm, 1/2 x 6 x 18 in) on five 1-2-3
# blocks lying flat (1 in up): two under each end, under the step clamps,
# and one under its middle. Plate frame: X0 its left end, Y0 its front edge,
