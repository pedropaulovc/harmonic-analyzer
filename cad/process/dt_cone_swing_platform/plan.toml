tap_4_40_depth_mm = 10.16
holddown_screw_length_mm = 12.7
# The wedge screw (#10-24 x 1/2) holds the west waste: wedge_x_mm along E
# and wedge_y_mm across from the pivot (Setup 4 frame), its head clear of
# the outline's swath and of the bar's edge (cam.py).
wedge_x_mm = -13.411
wedge_y_mm = 28.775
# The outline: Z0 the plate's top; outline_through_mm into the plate. The
# rough pass finish_stock_mm outside the finish, outline_levels levels of
# outline_level_mm; the finish pass in finish_levels levels of
# finish_level_mm; first a clearing pass clear_offset_mm off the chamfer
