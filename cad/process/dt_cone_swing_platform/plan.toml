# Cone swing platform MHA-DT-20 (qty 1), routed for the CNC mill (owner
# ruling 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). The platform
# is the bought 1/4 x 2-1/2 in 1018 CF flat as supplied (drawing: thickness
# as supplied, 1/4 PLATE AS SUPPLIED), sawn to a blank and milled to its
# outline.
#
# Route: the platform is laid in the bar at 1.86° so that its east edge (the
# swing-stop face, NE corner to SE corner) is the bar's straight edge E, as
# supplied; every other edge is milled, the waste a wedge on the west side.
# Setup 1 saws the blank (9.70-9.76 in) and gates its thickness. Setup 2, the
# UNDERSIDE up on parallels in the vise, E on the fixed jaw, both ends
# overhanging: PL01 faces both ends to length, spots every hole, drills the
# hold-down #31 and counterbores it from the underside (the 1/8 in end mill's
# helix), drills B through the pivot, and drills #7 at the two post taps and
# the wedge screw's hole; PL02/PL03 bring the tap guide over each post hole
# for the 1/4-20. Setup 3, vise off: the 1/2 x 6 in aluminium spoil plate on
# 1-2-3 blocks, step-clamped: PL04 drills its two clearance holes for the
# post screws. Setup 4, the blank top up on the plate, screwed from below
# into its post taps and trammed on E; G54 on the pivot hole: PL05 runs the
# B drill on into the plate and reams the pivot .2510 (the bar flat on the
# plate: a reamer's thrust on Setup 2's overhang bent it past the finish
# limit), then drills the plate through the hold-down and wedge holes;
# PL06-PL07 bring the tap guide over each (4-40, 10-24); the hold-down and
# wedge screws go in; PL08 cuts the outline through (the SE corner cleared,
# roughed in levels, finished); the bar's thickness and the shoulder
# screw's length pick the relief's floor and PL09 cuts the top relief
# (drawing note 1); a fitted relief is swing-tested on the wedge seat, the
# flat face its shoulder was measured on.
# Setup 5, bench: deburr, inspect. Setup 6: black oxide (Presto Black PC9).
#
# Not made here: the #52 tip-dowel hole (#52 DRILL THRU, note 3; owner
# ruling 2026-11-24, fit audit question 11) is made at assembly (MHA-DT-00
# step 2; the feature export's made_at), after blackening: the drawing's
# finish leaves it bare, oiled. The placeholder plan's tools placed
# elsewhere: tools.drill-53, tools.reamer-0630 and tools.pin-gauges are no
# longer needed (that step drills 1/16, then #52); tools.reamers-adjustable-lms-
# 5948 is replaced by the fixed .2510 reamer (owner ruling 2026-11-24, fit
# audit question 10; #3073: a fixed reamer); tools.endmill-7-32 is not
# needed (the owned 1/8 in end mill interpolates the counterbore);
# tools.depth-micrometer is not needed (the calipers' depth rod holds the
# counterbore's .010 band).
#
# The underside is the bar's cold-finished face as supplied (Ra 63 SLIDING
# FACE): never faced, so the as-supplied thickness band holds; it is
# inspected by eye and fingernail in Setup 1 and kept off the vise's jaws'
# grit by the parallels. The top face is as supplied too (Ra 125).
#
# Drawing note 1, FIT TOP RELIEF DEPTH TO MHA-DT-VN-52 SHOULDER: SWINGS
# FREE, NO AXIAL SHAKE. Owner decision 2026-09-22 (cnc rulings record):
# "fit the actual purchased shoulder and finished plate; do not invent a
# numerical axial-clearance band." Owner ruling 2026-11-22 (issue #3363,
# option B of C:/farm-runs/triage-2026-11-19/cnc/questions/flat-a-platform-
# relief-fit.json): "keep the screw as bought; relief to the sheet's .010
# REF; steel shim washers under the head, 1/4 ID, .001 steps, stacked at
# assembly until it swings free with no shake". Setup 4 mics the bar's
# thickness t beside the pivot and measures the shoulder's length L with
# gauge blocks under its head. t over L (the fit branch): the relief's floor
# L above the underside, then the swing test. t at or under L (the REF
# branch): the floor .010 below the top; no swing test here, the shims go
# under the head at assembly (MHA-DT-00, #3363).
#
# FLAGGED: to buy before Setup 4: the .2510 reamer (tools.reamer-2510,
# to_order; owner ruling 2026-11-24, fit audit question 10: the bore prints
# no band and the MHA-DT-VN-52 shoulder is its gauge, so the pivot's Class
# ZZ pins and the .2500 reamer are no longer needed), the hold-down screws (fixtures.dt-
# platform-hold-down-screws, to_order: two 1/4-20 x 3/4 SHCS, one #4-40 x
# 1/2 SHCS, one #10-24 x 1/2 SHCS) and the MHA-DT-VN-52 shoulder screw that
# will be assembled with this platform (McMaster 91829A560, the assembly's
# bought part). For the REF branch's assembly: the steel shim washer
# assortment, 1/4 ID x 3/8 OD, .001 steps (fixtures.shim-washers-1-4-id-
# arbor-19, Precision Brand 25100, to_order; #3363). Before Setup 1: the
# 48 in steel rule (tools.steel-rule-48, to_order). Before Setup 6: the PC9
# and the gloves and glasses (consumables.presto-black-steel-pc9,
# consumables.chemical-gloves-eye-protection, to_order).
#
# Black oxide: the drawing's finish, matte black oxide, oil sealed (the
# #52 hole bare, oiled: made after it). Owner (Pedro), answered in person
# 2026-11-21: "Black oxide: cold blackening in the shop with Presto Black
# PC9 is acceptable as the drawing's black oxide." Setup 6 blackens the
# platform with Birchwood Presto Black Steel PC9 by the maker's instructions
# (Presto Black Steel PC9 Instructions, steps 1 prepare, 2b brush-on, 3
# stop, 4 dry, 6 seal; cad/config/shop-equipment/
# consumables.presto-black-steel-pc9, which cites them).
#
# Spoil plate: the freed 1/2 x 6 x 18 in 6061 bar (stock.6061-flat-1-2x6-
# 18in, on hand), whole, its top the Z0 of Setups 3-4; it keeps its holes
# and can serve again.
#
# NC (cam:dt_cone_swing_platform, cad/process/dt_cone_swing_platform/
# cam.py): PL01_holes, PL02_post_far_tap, PL03_post_near_tap,
# PL04_plate_holes, PL05_seat_drills, PL06_holddown_tap, PL07_wedge_tap,
# PL08_outline, PL09_relief. Program names, the [parameters]
# and the milling_cuts names are a contract with that recipe. Tool numbers
# are the places in the tools list among the mill's tools: T1 1/4 in end
# mill, T2 1/8 in end mill, T3 #1 centre drill, T4 #31, T5 B, T6 .2510
# reamer, T7 #7, T8 L, T9 #25, T10 #43, T11 tap guide.
title = "Cone swing platform"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 1/4 x 2-1/2 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.1f}} in flat bar (36 in length on hand): one blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in. Spoil plate: the 1/2 x 6 x 18 in 6061 bar, whole."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Thickness and edge E are the bar's, as supplied: neither face is machined. Mill speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Prove each cutting program in air on its first run (the setups' prove ops); the tap-guide files (PL02, PL03, PL06, PL07) only carry the guide in Idle over a hole: watch their first run, a hand on feed hold. Made at assembly (MHA-DT-00), not here: the #52 tip-dowel hole (step 3) and, on a bar thinner than the VN-52 shoulder, the steel shim washers under its head (owner ruling 2026-11-22; GitHub issue 3363 adds them to the assembly's hardware). Finish: {{cad.finish}}."
shop = "../shop"
stock_refs = ["1018-flat-1-4x2-1-2", "6061-flat-1-2x6-18in"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/dt_cone_swing_platform/features.toml"
adapter = "flat_bar"
part = "dt-cone-swing-platform"

[parameters]
quantity = 1
# The adapter's axes: the platform's length along model Z, its thickness
# (underside to top face) along model Y.
