<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="sans-serif" font-size="13">
  <!-- Top: plan from above, 2.6 px/mm (+X right toward the pivot end, +Y up toward the fixed jaw; Y0 the fixed jaw's face = edge E, the blank at -Y; X0 the sawn marked end). The jaws 158.67 wide (vise_jaw_width_mm), their left ends s2_overhang_mm 44.23 from the sawn end; jaw thickness schematic. The 1/4 in end mill (6.35) on the first posted pass, PL01 L27-L28: X-2.175 (1.0 mm off the sawn end), Y+4.675 to Y-68.175 (-Y, away from the fixed jaw), Z-2.244 (level 1 of 3). Bottom: detail from the front (+X right, +Z up, +Y into the page), 6 px/mm: the end, Z0 the underside (up), the three levels to Z-6.731, the 1 in parallels under the blank inside the jaws (their length schematic), the moving jaw in front (outline), its top s2_jaw_top_mm 13.32 above Z0. Holes marked where PL01 puts them. -->
  <rect class="paper" x="0" y="0" width="760" height="560"/>
  <text class="title" x="20" y="22">Setup 2 (PL01, T1): face the marked end, underside up, E on the fixed jaw (plan 2.6 px/mm; detail 6 px/mm)</text>
  <rect class="clamp" x="155.01" y="43.6" width="412.55" height="36.4"/>
  <rect class="clamp" x="155.01" y="245.1" width="412.55" height="36.4"/>
