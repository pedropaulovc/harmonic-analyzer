  <text class="label" x="150" y="300">1/4 in end mill, first pass at Z-{{process.end_level_mm:.3f}} mm (1 of {{process.end_levels:d}}), 1.0 mm off the sawn end,</text>
  <text class="label" x="150" y="316">run across the bar away from the fixed jaw (−Y); then the pivot end to {{process.faced_length_mm:in.3f}}</text>
  <line class="leader" x1="146" y1="296" x2="38.34" y2="142.4"/>
  <circle class="leader-dot" cx="38.34" cy="142.4" r="2"/>
  <text class="label" x="150" y="340">dashed: the holes PL01 drills next (post taps, pivot, hold-down, wedge screw)</text>
