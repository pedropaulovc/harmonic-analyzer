<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="13">
  <!-- As Op 80's picture. The 1/8 in end mill (3.175 = 19 px; square end, 12 % cue) at the helix's last turn (PL01 L135-L136): its axis at X221.441, 1.0795 off the hole's axis (cbore_path_radius_mm), its end at Z-3.505: Ø5.334, 3.505 deep from the underside. G2 (clockwise seen from above), 0.5 mm a turn. -->
  <rect class="paper" x="0" y="0" width="760" height="330"/>
  <text class="title" x="20" y="22">Op 90 (PL01, T2): the 1/8 in end mill's helix, the hold-down counterbore (from the front, 6 px/mm)</text>
  <rect class="part-kept" x="40" y="200" width="333.83" height="38.1"/>
  <rect class="fixture-support" x="40" y="238.1" width="77.45" height="76.2"/>
  <rect class="hidden" x="40" y="120.07" width="77.45" height="194.23"/>
  <text class="label" x="44" y="96.07">moving jaw (in front,</text>
  <text class="label" x="44" y="112.07">outline); parallel below</text>
  <rect class="holes" x="213.03" y="200" width="18.29" height="38.1"/>
  <rect class="holes" x="206.17" y="200" width="32" height="21.03"/>
  <path class="cutter" d="M238.17 218.75L238.17 92L228.65 89L219.12 92L219.12 218.75A9.52 2.29 0 0 0 238.17 218.75Z"/>
  <text class="datum-label" x="40" y="194">Z0 the underside (U, up)</text>
  <text class="label" x="380" y="52">1/8 in end mill, G2 helix of {{process.cbore_path_radius_mm:in.4dot}} radius,</text>
  <text class="label" x="380" y="68">{{process.cbore_helix_pitch_mm:.1f}} mm a turn, to {{cad.holddown_cbore_depth_nominal_in:.3dot}} deep: Ø{{cad.holddown_cbore_dia_nominal_in:.3dot}}</text>
  <line class="leader" x1="376" y1="48" x2="240.17" y2="116"/>
  <circle class="leader-dot" cx="240.17" cy="116" r="2"/>
</svg>
