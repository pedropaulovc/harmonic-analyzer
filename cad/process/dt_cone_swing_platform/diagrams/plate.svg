  <rect class="fixture-support" x="40" y="223" width="114" height="76" stroke-dasharray="4 3"/>
  <rect class="fixture-support" x="612" y="70" width="114" height="76" stroke-dasharray="4 3"/>
  <rect class="fixture-support" x="612" y="223" width="114" height="76" stroke-dasharray="4 3"/>
  <rect class="fixture-support" x="326" y="146" width="114" height="76" stroke-dasharray="4 3"/>
  <rect class="clamp" x="78" y="50" width="38" height="96"/>
  <rect class="clamp" x="78" y="223" width="38" height="96"/>
  <rect class="clamp" x="650" y="50" width="38" height="96"/>
