<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="sans-serif" font-size="13">
  <!-- Top: plan from above, 2.5 px/mm (+X right toward the pivot end, +Y up away from E; X0 Y0 the pivot's axis), the blank top up on the spoil plate (part of the plate drawn), E to the front; the outline (cam.py's elements on the feature bundle) and the waste it leaves (hatched: milled later in this setup by PL08 and PL09); the post screws from below at the two post taps. Bottom: section at Y0 from the front (+X right, +Z up), 8 px/mm: Z0 the plate's top, the blank 6.35 over it; the B drill (6.0452 = 48.4 px) at X0 (PL05 L25), its point at Z-3.816 (pivot_redrill_tip_mm) in the plate, so the reamer runs out into a hole. The plate's 1-2-3 blocks lie outside this section (plate X 381 on, here X38.7 on). -->
  <rect class="paper" x="0" y="0" width="760" height="560"/>
  <text class="title" x="20" y="22">Setup 4 (PL05, T5): the B drill down the pivot into the plate (plan 2.5 px/mm; section 8 px/mm)</text>
