]

[[setups.operations]]
instruction = "First blank only (and each blank after any re-run), still clamped: each hole's X from N, the calipers from the right end over the largest pin gauge that slips in, less half its Ø."
inspection = "Near hole {{cad.ear_near_x_min_in:.3dot}}–{{cad.ear_near_x_max_in:.3dot}} and far hole {{cad.ear_far_x_min_in:.3dot}}–{{cad.ear_far_x_max_in:.3dot}} from N: the drawing's {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}} about the bore, which the pair bore puts {{cad.bore_location_in:.3dot}} from N. Outside: stop and tell the owner (MIN EAR WALL {{cad.ear_wall_min_in:.3dot}})."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.ear_near_x_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.ear_far_x_band_mm}}" },
]

[[setups.operations]]
instruction = "Then unclamp that blank and check each hole's height on the surface plate."
inspection = "Each hole from B (Y) {{cad.ear_height_min_in:.3dot}}–{{cad.ear_height_max_in:.3dot}}: the part on B on the surface plate, the height gauge over the slip-in pin less half its Ø. Outside: stop and tell the owner."
gauge_checks = [{ gauge = "height-gauge", band_mm = "{{cad.ear_height_band_mm}}" }]

