[[setups]]
machine_kind = "other"
title = "Outside face to the depth; drill both ear holes"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The same stacks (1/8 in thick: the holes fall between them). The blank turned over end for end: the mating face down on both stacks, B against the FIXED jaw, gripped on B and the top, centred. Its RIGHT end is the near side N: the hole stations count from it."
datum = "Program CF06_bar_drill. G54: X0 the RIGHT end (N), the part to −X; Y0 the fixed jaw's face (B), +Y toward it; Z0 the stacks' top (the mating face). Ear holes at X −{{cad.ear_near_x_in:.3f}} and −{{cad.ear_far_x_in:.3f}} in, Y −{{cad.ear_height_in:.3f}} in. Tool lengths from the tool setter at each M6; at every M6 stop the file has stopped the spindle and lifted the tool above the part."
diagram = { file = "diagrams/drill.svg", alt = "The half lying on stacked parallels, mating face down, bottom face at the fixed jaw; the 1/2 in end mill faces the outside face to the depth, the centre drill spots and the #9 drills both ear holes through between the parallels." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{cad.height_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_section_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.drill_tip_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_9_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_oal_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{process.blank_section_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{cad.height_mm}}", z = "{{cad.depth_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 the RIGHT end (N, marked in Setup 4), Y0 the fixed jaw's face (B): edge finder (900 rpm). Scribe the N in on that end."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm): on the fixed jaw's face beside the part, G10 L20 P1 Y-2.540; on the part's RIGHT end (N) from the right, G10 L20 P1 X2.540 (plus: the finder's centre is right of the end). Scribe N into the marking on the right end: it is the near side the stations and the bore count from, here and in the pair."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack left of the part."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-55.400 Y-6.850: the cutter left of the part's far end, its edge .02 off the fixed jaw, over that jaw's stack. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove CF06_bar_drill in air, Z0 raised 1.000 in; every move clears the jaws, through every M6. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF06_bar_drill (M6 T1; 2450, display near 2485): face the outside face down to Z {{cad.depth_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}}. At the M6 T2 stop, still clamped: check the depth."
settings = "em-half-carbide-1018-3439-face"
inspection = "Depth {{cad.depth_min_in:.3dot}}–{{cad.depth_max_in:.3dot}} at the M6 T2 stop: the calipers' depth rod from the outside face to the fixed-jaw stack's top beside the part, at both ends."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.depth_band_mm}}" }]
milling_cuts = [
  { name = "outside face", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{cad.width_mm}}"] },
]

[[setups.operations]]
instruction = "Depth over {{cad.depth_max_in:.3dot}}: stop the file; home ($H) and repeat this setup's X0, Y0 and Z0 touch-offs (a stop resets the controller); then send $#, note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{cad.depth_mm:in.4dot}}) × 25.4); run CF06_bar_drill again from its start (the face, then the holes) and re-check. Under {{cad.depth_min_in:.3dot}}: the half is scrap."
feed = "hand"

