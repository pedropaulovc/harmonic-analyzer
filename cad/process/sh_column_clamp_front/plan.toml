# Column clamp front MHA-SH-01 (qty 3), routed for the CNC mill (owner
# ruling 2026-11-20, Pedro, relayed by Main). Each half from one sawn blank of
# 3/4 in square 1018 about 2.0 long, one blank per program run: faced and
# sized to the drawing (the 1.890 width, the .630 height, the .685 depth
# from the mating face to the outside face), then both #9 ear holes drilled
# through from one zero, stations from the near side N and heights from the
# bottom face B. The half bore is not cut here: MHA-SH-02's traveler bolts
# each front to its own back with their own #8-32 screws and interpolates
# the full Ø1.008 bore on the split line with the 1/2 in carbide end mill,
# gauges it, then faces .020 off the back's mating face. This traveler stops
# at that pair setup (Setup 9) and finishes the front after it.
#
# Route: saw; Setups 2-3 upright on the 1 in parallels: face the first end
# (CF01), turn over, face to the width (CF02); Setups 4-7 lying on the 1 in
# and 1/2 in parallels stacked under each jaw (1.5 in, so every face stands
# above the jaw tops): face the bottom face B (CF03), B down, face the top to
# the height (CF04), jaws on B and the top, skim the mating face (CF05),
# mating face down, face the outside face to the depth, spot and drill both ears
# (CF06); bench deburr; the pair bore (MHA-SH-02 Setup 9); deburr and
# inspect; black enamel: the owner's Rust-Oleum Flat Black 376855 (owner
# 2026-11-21, answered in person: "rust-oleum Flat Black376855") over the
# maker's Clean Metal Primer, by Rust-Oleum's technical data SRT-01
# (consumables.black-alkyd-enamel cites it).
#
# Zeroing: the touch probe has no holder (its 6 mm R8 collet is off the buy
# list, cad/config/shop-equipment/ gauges.touch-probe-diy0-tp05), so every
# X/Y zero is the owned .200 in edge finder at 900 rpm (logbook 2026-11-04,
# tools.edge-finder) and every Z zero the end mill on a .002 feeler leaf, as
# the magnifying clamp plan does.
#
# NC (cam:sh_column_clamp_front, cad/process/sh_column_clamp_front/cam.py):
# CF01_first_end, CF02_length, CF03_bottom, CF04_height, CF05_mating,
# CF06_bar_drill. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #9.
title = "Column clamp front"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (drawing: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}} wide (N to the far end), {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}} high (B to the top), {{cad.depth_min_in:.3dot}}–{{cad.depth_max_in:.3dot}} deep (mating face to outside face, the face the bar seats against). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home (logbook 2026-11-06). After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every file is proved in air on the first blank. The bore is cut with the mating MHA-SH-02 back in its traveler's Setup 9; keep each front with its back from there on (scribe the pair number on both)."
shop = "../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/sh_column_clamp_front/features.toml"
adapter = "clamp_half"
part = "sh-column-clamp-front"

[parameters]
quantity = 3
# The bar (stock.1018-square-3-4) and the blank the programs are posted for:
# the owner's "about 2.0" sawn length, ±.05 for the saw.
blank_section_in = 0.75
blank_section_mm = 19.05         # blank_section_in × 25.4: the vise holds' and cam.py's section.
blank_length_min_in = 1.95
blank_length_max_in = 2.05
kerf_in = 0.125
# The other half's outside face to the bore axis (MHA-SH-02's pre-face
# depth band, .600-.620): the pair picture's back half.
other_half_depth_min_mm = 15.24
other_half_depth_max_mm = 15.748
# Skims (author's choice, .020 in each, enough to clean a sawn end or the
# bar's cold-finished face): the first end, the bottom face and the mating
# face. The other end, the top and the outside face are faced to size from
# them in equal levels no deeper than face_step_max_mm (.050 in).
end_skim_mm = 0.508
bottom_skim_mm = 0.508
mating_skim_mm = 0.508
face_step_max_mm = 1.27
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) on the
# owner's measured face setting, shop settings.em-half-carbide-1018-3439-face
# (dechatter session of 2026-11-23, #3439: stable to 6.4 mm wide at up to
# 1.27 mm deep, 2420-2490 rpm in the cut; cad/config/shop-equipment/
# measured-cuts.toml): every face level no deeper than face_step_max_mm and
# equal passes across the face no wider than that record's 6.4 mm, the
# first with the cutter over the edge so it too takes one pass's width
# (cam.py checks both). The 3/4 in faces take four passes of 4.89 mm (19.05
# + the 0.5 overhang; three would need 6.52, over the limit), the .630 faces
# three of 5.50 mm (two would need 8.25). Every measured pass was
# conventional and the faces zigzag (owner ruling 2026-11-16), so every
# other pass climbs: that half is not measured.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.4
# Ear holes: spot Ø.150 with the #2 centre drill, under the #9 (no chamfer
# at the mouth), then the #9 through, pecked .180 (under one diameter) with
# full retracts (L/D 3.5), its full diameter 1.0 mm past the mating face
# into the gap between the parallels.
spot_dia_mm = 3.81
peck_mm = 4.572
drill_past_mm = 1.0
# The #9's point 1.0 + its 118° point (1.496) below the parallels' top;
# cam.py checks it.
drill_tip_height_mm = -2.496
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003 in/rev,
# a size between two columns taking the lower one's feed. Centre drill:
# 1800 rpm (88 ft/min on its 3/16 body; the strap plan's spot speed) × .001
# (its 5/64 pilot) = 1.8 in/min. #9 (.196): 1200 rpm (62 ft/min) × .003 =
# 3.6 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
drill_feed_per_min_mm = 91.44
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): upright, a 1 in parallel against each jaw; lying, the set's 1 in
# and 1/2 in parallels stacked against each jaw (1.5 in), as the sub-plate
# plan stacks them, so every lying face stands above the jaw tops.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides, upright the section, lying the width.
vise_upright_inset_mm = -69.81
vise_lying_inset_mm = -55.33
# Upright, the tallest blank less the first-end skim stands above the
# parallels in CF02; cam.py checks it.
upright_top_max_mm = 51.562
# The bolted pair in MHA-SH-02's Setup 9 (drawn by the pair picture): the
# MHA-SH-VN-53 clamp screw, McMaster 90280A201 #8-32 × 1-1/4 narrow
# fillister (sh_vn_clamp_screw_spec.FILLISTER_SIZE: head Ø.270 × .156); a
# 1-2-3 block, its 1 in face between the heads; the back-side parallel
# stopped .625 from the bore axis along the jaws.
screw_head_dia_mm = 6.858
screw_head_height_mm = 3.9624
screw_length_mm = 31.75
spacer_block_width_mm = 25.4
back_parallel_end_mm = 15.875
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm).
half_mill_projection_mm = 28.45
# ASME B94.11M jobber lengths, overall: #9 3-1/2 in; the #2 combined drill
# and countersink 1-7/8 in. Bounded by their whole length below the chuck.
drill_9_oal_mm = 88.9
centre_drill_oal_mm = 47.625

[[tools]]
id = "em-half"
name = "1/2 in carbide end mill"
ref = "endmill-carbide-3fl-1-2"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill-9"
name = "#9 drill"
ref = "riser-drill-9"
[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "files"
name = "Files"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "The 3/4 in square bar with {{process.quantity:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long marked off its end, a saw kerf between each." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off the 3/4 in square 1018 bar, the bar flat in the saw's vise (MHA-SH-02's traveler saws its three the same way). File the burr off both ends and the four long edges so each blank seats flat on the parallels. Mark each blank F1, F2, F3 on a cold-finished long face with marking fluid (the sawn ends are faced off)."
feed = "hand"
inspection = "Each blank {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} long, calipers. Outside: shorter, scrap it; longer, saw it again. Every program assumes this blank."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{cad.blank_length_min_mm}}", "{{cad.blank_length_max_mm}}"] }]

[[setups]]
machine_kind = "other"
title = "First end"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "A 1 in parallel against each jaw. The blank upright on them, a sawn end up, gripped across two opposite faces of the square, centred on the jaws. Tap it down onto both parallels with a soft mallet while closing the vise; both parallels pinned. The lower {{process.upright_grip_mm:in.2dot}} of it is in the jaws."
datum = "Program CF01_first_end (cam:sh_column_clamp_front). G54: X0 Y0 the bar's axis, Z0 the faced first end; +Y toward the fixed jaw. The file starts with an M6 for the end mill; tool lengths from the tool setter."
diagram = { file = "diagrams/first-end.svg", alt = "The blank upright on two 1 in parallels in the vise, a sawn end up; the 1/2 in end mill faces it in passes across the square." }
envelope = { x_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_length_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{process.blank_section_mm}}", part_height_mm = "{{cad.blank_length_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_section_mm}}", y = "{{process.blank_section_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 Y0 the bar's axis: edge finder (900 rpm) on the left and right faces and on the fixed jaw."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face beside the blank, G10 L20 P1 Y(half the miked section in mm − 2.540); for .750, Y6.985. X: its tip .10 below the sawn top, on the blank's LEFT face from the left, G10 L20 P1 X0; on its RIGHT face from the right, G10 L20 P1 X(half the DRO X reading)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the faced first end, the sawn top's high point less the {{process.end_skim_mm:in.3dot}} skim."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2dot}} in out of the collet; the tool setter measures it). Spindle stopped, its tip just dragging a .002 feeler leaf on the highest point of the sawn top: G10 L20 P1 Z0.559 (the {{process.end_skim_mm:in.3dot}} skim plus the .002 leaf)."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove CF01_first_end in air, Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "First blank only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run CF01_first_end, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF01_first_end (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): face the first end at Z0, {{process.end_skim_mm:in.3dot}} off the high point, in passes no wider than {{process.face_stepover_max_mm:in.3dot}}. A sawn patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run it again."
settings = "em-half-carbide-1018-3439-face"
milling_cuts = [
  { name = "first end", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.end_skim_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "Other end to the width"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "As Setup 2, the blank turned over: the faced first end down on both parallels, the sawn end up."
datum = "Program CF02_length. G54: X0 Y0 the bar's axis, Z0 the parallels' top (the faced first end); +Y toward the fixed jaw."
diagram = { file = "diagrams/length.svg", alt = "The blank upright on two 1 in parallels, the faced end down; the 1/2 in end mill faces the sawn end down to the width in levels." }
envelope = { x_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.upright_top_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.width_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{process.blank_section_mm}}", part_height_mm = "{{process.upright_top_max_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.vise_upright_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{process.upright_top_max_mm}}"], clamp_mm = [0, "{{process.upright_grip_mm}}"], section_mm = { x = "{{process.blank_section_mm}}", y = "{{process.blank_section_mm}}" }, vise_left = "other" }

[[setups.operations]]
instruction = "Home the mill first ($H). Repeat Setup 2's touch-off: edge finder X0 Y0 on the bar's axis (the blank was turned over), then M6 T1 and Z0 as below."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top, touched with the end mill on the fixed-jaw parallel beside the blank."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-17.000 Y2.675: the cutter left of the blank, its edge .02 off the fixed jaw, over that jaw's parallel. Spindle stopped, its tip just dragging a .002 feeler leaf on the parallel: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove CF02_length in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF02_length (M6 T1; 2450, display near 2485): face the sawn end down to Z {{cad.width_mm:in.4dot}} in equal levels no deeper than {{process.face_step_max_mm:in.3dot}} from {{process.upright_top_max_mm:in.3dot}} (the longest blank: a shorter one cuts air first). Then, still clamped, check the width."
settings = "em-half-carbide-1018-3439-face"
inspection = "Width {{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}}: the calipers' depth rod from the faced top to the fixed-jaw parallel beside the blank, at two corners."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]
milling_cuts = [
  { name = "length", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_step_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", stations_mm = "{{process.upright_top_max_mm}}" },
]

[[setups.operations]]
instruction = "Over {{cad.width_max_in:.3dot}}: lower G54 Z by the reading less {{cad.width_mm:in.3dot}} and run CF02_length again. Under {{cad.width_min_in:.3dot}}: the blank is scrap."
instruction_detailed = "Over {{cad.width_max_in:.3dot}}: send $# and note the G54 line's Z; G10 L2 P1 Z(that Z − (the reading − {{cad.width_mm:in.3dot}}) × 25.4). Run CF02_length again and check again. Under {{cad.width_min_in:.3dot}}: the blank is scrap."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bottom face B"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The 1 in and the 1/2 in parallels of the set stacked against each jaw (1.5 in). The blank lying on them along the jaws, gripped across two opposite cold-finished faces, centred on the jaws; the face up becomes the bottom face B. Tap it down onto both stacks while closing the vise. Its top stands {{process.blank_section_in:.3dot}} above the stacks, the lower {{process.lying_grip_mm:in.3dot}} of it in the jaws."
datum = "Program CF03_bottom. G54: X0 the blank's LEFT end, its near side N (marked N after this setup and kept at the left through Setup 6), Y0 the fixed jaw's face, Z0 the stacks' top; +Y toward the fixed jaw."
diagram = { file = "diagrams/bottom.svg", alt = "The blank lying along the jaws on stacked parallels; the 1/2 in end mill skims the top face, which becomes the bottom face B." }
envelope = { x_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = ["{{process.blank_section_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_section_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{cad.height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.blank_section_mm}}", along_jaws_mm = "{{cad.width_mm}}", part_height_mm = "{{process.blank_section_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.vise_lying_inset_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.width_mm}}"], clamp_mm = [0, "{{cad.width_mm}}"], section_mm = { y = "{{process.blank_section_mm}}", z = "{{process.blank_section_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Home the mill first ($H). G54 X0 the blank's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Home the mill first ($H). Edge finder (900 rpm): on the fixed jaw's face beside the blank, G10 L20 P1 Y-2.540; on the blank's LEFT end from the left, G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the stacks' top, touched with the end mill on the fixed-jaw stack left of the blank."
instruction_detailed = "Console M6 T1 (the tool setter measures it). MDI G0 X-12.700 Y-6.850: the cutter left of the blank, its edge .02 off the fixed jaw, over that jaw's stack. Spindle stopped, its tip just dragging a .002 feeler leaf on the stack: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "First blank only: prove CF03_bottom in air, Z0 raised 1.000 in. Then Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CF03_bottom (M6 T1; 2450, display near 2485): skim the top face {{process.bottom_skim_mm:in.3dot}} at Z {{process.blank_section_mm:in.3dot}} less the skim. A cold-finished patch left: send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − 0.254) (Z0 .010 lower) and run it again. Unclamp; mark this face B (blue marking fluid and a scribed B) and the blank's number on it."
