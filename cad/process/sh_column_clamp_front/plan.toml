envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr the drill exits on the mating face flush (scraper from the deburring set; no countersink), then break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. The mating face must lie flat on the back's: stone it lightly on a flat stone and wipe it. Keep N and B readable. Wash off the oil."
feed = "hand"
inspection = "Mating face down on the surface plate: it does not rock and no burr stands proud. Rocks: stone it again."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Pair bore with the back (MHA-SH-02 traveler, Setup 9)"
machine = "See MHA-SH-02"
indexing = "none"
diagram = { file = "diagrams/pair.svg", alt = "This front bolted to its back with two #8-32 screws, N ends flush, gripped in the vise on the outside faces with a 1-2-3 block between the screw heads; the 1/2 in end mill interpolates the full bore on the split line." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Take this front, with its number, to MHA-SH-02's traveler, Setup 9: it bolts the front to a back (N ends flush, B faces down), interpolates the bore (Ø{{cad.bore_dia_in:.3dot}} REF) on the split line with the end mill, accepts it by its clearance on the miked column and records the pair. Then Setup 10 of that traveler faces only the back. The front comes back bored; keep it with its back."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr, inspect, black enamel"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished front, looking down the bore: the ear holes either side, the web between each and the bore, the bore's place from the N end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Inspect first, the bore's edges still sharp (the deburr below breaks them): the bore was accepted in the pair (MHA-SH-02 Setup 9). The ears now; under the web or outside the band: stop and tell the owner."
inspection = "Each ear's web to the bore, on the mating face: the calipers' outside jaw tips into the ear hole and the bore, closed on the web: at least {{cad.ear_wall_min_in:.3dot}} (MIN EAR WALL). Each ear's station: that web plus half the ear hole's pin plus half the bore's recorded Ø, {{cad.ear_station_min_in:.3dot}}–{{cad.ear_station_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = ["{{cad.ear_wall_min_mm}}", "{{cad.ear_wall_best_mm}}"] },
  { gauge = "calipers", band_mm = "{{cad.ear_station_band_mm}}" },
]

[[setups.operations]]
instruction = "The bore's place from N; outside the band: stop and tell the owner."
inspection = "The calipers from N to the bore's near edge on the mating face, plus half its recorded Ø: {{cad.bore_location_min_in:.3dot}}–{{cad.bore_location_max_in:.3dot}}."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.bore_location_band_mm}}" },
]

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Deburr the bore's edges at the top and bottom faces and along the mating face, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, scraper and smooth file; no burr may stand proud of the mating face. Wash off the oil."
feed = "hand"

[[setups.operations]]
instruction = "If the enamel cannot follow now: oil the front lightly, bag it and tag it with its pair number; wash the oil off before the enamel."
feed = "hand"

[[setups.operations]]
instruction = "Paint: the owner's Rust-Oleum Stops Rust Flat Black 376855 over Rust-Oleum Stops Rust Clean Metal Primer 7780830, the paint maker's primer for bare metal. The primer is not owned: buy it. The enamel: check the shelf, buy if none."
feed = "hand"

[[setups.operations]]
instruction = "Wash the front in detergent, rinse it in clean water and dry it thoroughly."
feed = "hand"

[[setups.operations]]
instruction = "Mask the bore, both ear holes (a plug or a #8 screw in each) and the outside face (the bar seats on it), the face opposite the bore."
feed = "hand"

[[setups.operations]]
instruction = "Spray outdoors or in a well-ventilated space, at 50–90 °F and humidity under 70 %. Primer: shake the can a full minute after the ball rattles; 2 light coats a few minutes apart, the can 10–16 in off."
feed = "hand"

[[setups.operations]]
instruction = "Enamel straight after the primer: every unmasked face black, 2 or more light coats a few minutes apart, the can moving and at one distance, no runs. Any further coat within 1 hour or after 48 hours."
feed = "hand"

[[setups.operations]]
instruction = "Let it dry: tack-free in 2–4 hours, handle after 5–9 hours, fully dry in 24 hours."
feed = "hand"

[[setups.operations]]
instruction = "Unmask; wipe the bare bore, ear holes and outside face with light oil."
feed = "hand"
