]

# The thickness check's remedy and the reseat follow the check: prechips
# prints an op's Check after its work, so they are the next op.
[[setups.operations]]
steps = [
  { kind = "stop", text = "Thick: stop the file; clean under the blank, reseat, reclamp and run RS03 again from its start (the same Z). Thick again, or thin: the blank is scrap." },
]
feed = "hand"

# The hub hole is drilled where the fence and end stop put the blank, and
# RS04 puts it back there to cut the outline round it (the plug only floats,
# #3713; delegated ruling 2026-11-26 (Main), no precedent; owner review
# #2144 (D55)): both seats are proved by the same .002 leaf, so the hole sits
# on the outline's centre within .002 each way (the outline's profile band is
# +/-.010).
[[setups.operations]]
steps = [
  { kind = "action", text = "In band: reseat the blank as it was (face 2 up, the same long edge on the fence, the same end on the end stop) and clamp at {{process.clamp_torque_in_lb:g}} in-lb." },
  { kind = "check", text = "A .002 feeler leaf enters neither between the blank's long edge and the fence nor between its end and the end stop." },
  { kind = "stop", text = "It enters: unclamp, clean the edge, the end and both stop faces, reseat and clamp again." },
  { kind = "action", text = "Then the same stop's tool change: T3, the #2 centre drill, in; set 1800; Cycle Start." },
]
feed = "hand"

# Hub hole, over the plate's counterbore: the blank spans it as a short beam
# between its edges; the drill and reamer push down on it.
[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, on from that stop with T3: spot the hub hole Ø{{process.spot_dia_mm:in.3dot}} at X {{cad.hub_x_in:.3f}}, Y −{{cad.hub_y_in:.3f}} at 1800."
rpm = 1800
feed = "{{process.hub_spot_feed_per_min_mm:in.1f}} in/min"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "hub spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.hub_spot_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

# Drill and ream speeds: LittleMachineShop "Cutting Speeds", Drilling &
# Reaming, Plain carbon steels 1006-1026 (read 2026-11-17): drilling
# 60-100 ft/min, reaming 40-65; the low ends: 600 rpm on the 25/64 drill
# (61 ft/min), 400 rpm on the .400 reamer (42 ft/min). Feeds: [parameters].
[[setups.operations]]
speed_kind = "spindle"
tool = "hub-drill"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: 25/64 drill through into the counterbore, no peck; set 600. Cutting oil."
rpm = 600
feed = "{{process.hub_drill_feed_per_min_mm:in.1f}} in/min"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
hole_depth_mm = "{{cad.thickness_mm}}"
peck = "none"
milling_cuts = [
  { name = "hub drill", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.hub_drill_dia_mm}}", flutes = 2, rpm = 600, feed_mm_min = "{{process.hub_drill_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "hub-reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.hub_dia_band_mm}}" }
instruction = "Same file, M6 T5: ream through, .4000 reamer in the drill chuck; set 400. Cutting oil. The file feeds the reamer in and feeds it back out, spindle running: no rapid leaves the bore. Leave the blank clamped for the check."
inspection = "Still clamped: the .400 minus pin of the pin-gauge set enters the hub hole by hand. Every hole; the first blank's before reaming any other."
rpm = 400
feed = "{{process.hub_ream_feed_per_min_mm:in.1f}} in/min, in and out"
gauge_checks = "other"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
# No reamer kind: its thrust is analysed as a two-lip twist drill's at the
# reamer Ø and the same feed (flutes = 2 is that model's, not the reamer's),
# far above what a .009 in ream allowance takes.
milling_cuts = [
  { name = "hub ream", kind = "drill", phase = "finish", cutter_dia_mm = "{{process.hub_reamer_dia_mm}}", flutes = 2, rpm = 400, feed_mm_min = "{{process.hub_ream_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

# The ream's remedy and the unclamp follow its check (#3060): prechips prints
# an op's Check after its work, so they are the next op.
[[setups.operations]]
steps = [
  { kind = "stop", text = "The pin will not enter: stop, the reamer is worn or undersize; tell the owner." },
  { kind = "action", text = "The pin enters: unclamp the blank and lift it out." },
]
feed = "hand"

# RS04: the outline, one tool, no stop inside the file. The blank is bonded
# to the plate and screwed down at the hub; the setup's beam is the whole
# blank on its tape stack, which the plunge and the fence sliver cut into.
[[setups]]
machine_kind = "other"
title = "Bond to the plate; outline"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Blank bonded to the plate under its whole face: blue painter's tape on the plate and on the blank's face 1, GH1200 thick CA glue between (the stack {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}, miked). Face 1 down, the reamed hub hole over the hub plug TL-02's pilot in the plate's counterbore (tape cut away there), the same long edge against the fence and the same end on the end stop as in RS03; screwed down at the hub: the #10-32 × 5/8 button-head screw TL-VN-51 through the marked washer TL-VN-52, centred by eye, into the plate. Edge clamps backed off clear of the blank."
datum = "Program RS04_outline. G54 unchanged: Y0 fence, X0 end stop; Z0 the plate top; the file works {{process.tape_stack_mm:in.3dot}} above it for the tape stack (blue tape, CA glue, blue tape). The fence and the end stop put the hub hole back at X {{cad.hub_x_in:.3f}}, Y −{{cad.hub_y_in:.3f}}, where RS03 drilled it, and set the blank square; the plug only floats in the counterbore."
diagram = { file = "diagrams/outline.svg", alt = "Plan of the sub-plate: blank bonded to the plate (blue tape, CA glue, blue tape) against the fence, no edge clamps; screw and washer at the hub hole; the fence notched under both tips of the strap; the 1/8 in end mill's slot runs round the whole outline, top arc toward the fence." }
# Top: the strap on the thickest stack; deepest: the through cut stops in
# the stack, above the plate top.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.outline_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.fence_notch_depth_mm}}", "{{process.outline_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{process.tape_stack_max_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_top_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{cad.blank_bond_area_mm2}}", width_mm = "{{cad.blank_width_mm}}" }] } }

# The drill and reamer leave their exit burr on face 1, which seats on the
# tape and the plug pilot next: it comes off here, the edges kept sharp.
[[setups.operations]]
steps = [
  { kind = "action", text = "Per blank. Rub each face of the reamed blank flat across the hub hole on the 320-grit face of the two-grit sharpening stone: the burr off, both edges left sharp." },
  { kind = "check", text = "Hub hole: both edges sharp, no burr." },
  { kind = "stop", text = "Burr: stone it off flat again and check again. An edge rounded over: the blank is scrap, before it is taped." },
]
feed = "hand"

# The bond (owner rulings 2026-11-23, R1/R2): blue painter's tape on both
# faces, CA glue between; the operator proves each bond by its stack and a
# hand push test, there is no pull test. The stack check subtracts the
# blank's own thickness, miked first.
[[setups.operations]]
steps = [
  { kind = "action", text = "Mic the blank's thickness at both ends and at mid-length beside the hub hole; write the three readings down in mm." },
  { kind = "action", text = "Degrease the plate top over the blank's place and the blank's face 1 with isopropyl alcohol; wipe both dry." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Tape the plate with ScotchBlue 2090 (1.41 in wide), two strips along X from the end stop to 1/4 past the blank's right end: the first with its edge on the fence face, the second butted to it. Edges touching, never overlapped, no gap over 1/32. The seam is {{process.tape_seam_plate_mm:in.2dot}} from the fence." },
  { kind = "action", text = "Cut the plate's tape away over the counterbore with a knife, round its edge." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Tape face 1 with two strips along the blank's length, each hanging over one long edge, butted at mid-width: the seam {{process.tape_seam_blank_mm:in.2dot}} from either edge, about .66 off the plate's seam, under the strap's body. Never overlapped, no gap over 1/32." },
  { kind = "action", text = "Trim the tape flush with the blank's edges and ends with a knife, and cut it away round the hub hole." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Burnish both tapes down hard with the round back of a screwdriver handle, every strip, edges included." },
  { kind = "check", text = "No bubble, no lifted edge on either tape." },
  { kind = "stop", text = "A bubble or lifted edge: burnish it again; still lifted, replace that strip." },
]
feed = "hand"

[[setups.operations]]
instruction = "Drop the hub plug TL-02 into the counterbore, pilot up. Back the edge clamps off clear of the blank's place."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "GH1200 thick CA (the 1500 cps bottle) on the plate's tape: a zigzag bead about 1/16 wide, lines about 3/4 apart, kept 1/4 inside the blank's place and clear of the counterbore, about 20 in of bead. No glue on bare metal." },
  { kind = "action", text = "Mist Starbond accelerator on the blank's tape (the face with no glue), two or three sprays." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Within about 10 seconds of the spray: lower the blank, face 1 down, its hub hole over the plug's pilot, the same long edge on the fence and the same end on the end stop as in RS03, held against both. The glue grabs at once: it cannot be slid afterwards." },
  { kind = "action", text = "Press it down by hand over its whole face with a flat block, for 1 minute. Then wait 5 minutes (the maker: cures in seconds with accelerator; the 1 + 5 minutes is the shop's margin)." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "A .002 feeler leaf enters neither between the blank's long edge and the fence nor between its end and the end stop: the hub hole is back where RS03 drilled it." },
  { kind = "stop", text = "It enters: peel the blank off, clean both faces, re-tape and re-bond from the degrease." },
]
feed = "hand"

# The stack: the mill's own Z, the way Z0 was set (the .200 gauge block under
# a stopped cutter). Work Z read there = .200 block + stack + blank, so
# stack = Z − 5.080 − the blank's reading at that place (mm, the console's).
[[setups.operations]]
instruction = "Console M6 T2 (the 1/8 in end mill). Spindle off: T2 just dragging on the .200 gauge block laid on the blank's top, near each end and beside the hub; read work Z at each. Stack = Z − 5.080 − the blank's reading there."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Stack {{process.tape_stack_min_mm:.2f}}–{{process.tape_stack_max_mm:.2f}} mm ({{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}) at all three places, the two ends within 0.05 mm (.002) of each other." },
  { kind = "stop", text = "Outside the band, or the ends further apart: peel the blank off, clean both faces, re-tape and re-bond from the degrease." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Push test: with the heel of the hand push the blank hard along and across; try to lift each corner with a thumbnail. No movement, no creak, no lifted corner." },
  { kind = "stop", text = "Any movement: peel the blank off, clean both faces, re-tape and re-bond from the degrease. This test is the owner's acceptance of the hold: there is no pull test." },
]
feed = "hand"

[[setups.operations]]
instruction = "The marked washer TL-VN-52 on the blank, centred on the hub hole by eye; the button-head screw TL-VN-51 through it into the plate, snug. Look again after snugging: the washer's rim even all round the hole."
feed = "hand"

# Cut cautions for the bond, real for CA and paper tape (brief step 8).
[[setups.operations]]
instruction = "For all of RS04: cut dry, or with a light air blast. No flood or mist coolant and no water: paper tape soaks and lets go. No oil on the work."
feed = "hand"

[[setups.operations]]
instruction = "CA softens with heat; never touch the work while RS04 runs. If the slot smokes or chips come off blue: Feed Hold, then Reset (the spindle stops). Jog Z up until T2 clears the blank top and the screw head, the spindle stopped; only then touch the blank. When it is cool enough to hold a finger on, run RS04 again from its start: the levels already cut pass in air."
feed = "hand"

# Every level starts with a straight plunge (feed: [parameters]); the plunge
# pushes down onto the plate.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Run RS04_outline (M6 T2: 1/8 in end mill, {{process.eighth_mill_projection_min_mm:in.2dot}}–{{process.eighth_mill_projection_max_mm:in.2dot}} out of the collet; set 2800). One run, no stop: the next four ops are its stages. Each depth level starts with a straight plunge. First blank: watch the first level pass outside the washer."
rpm = 2800
feed = "{{process.outline_plunge_feed_per_min_mm:in.1f}} in/min plunge"
milling_cuts = [
  { name = "outline plunge", kind = "plunge", phase = "rough", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", flutes = 3, rpm = 2800, feed_mm_min = "{{process.outline_plunge_feed_per_min_mm}}", traverse_mm = "{{cad.outline_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop. Fence sliver: inside both fence notches the strip of blank between the outline and the fence ({{cad.fence_margin_mm:in.3dot}} at its thinnest) is milled away, levels ≤ {{process.fence_sliver_step_mm:in.3dot}}, before the outline is cut."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "fence sliver", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", axial_doc_mm = "{{process.fence_sliver_step_mm}}", radial_woc_mm = "{{process.outline_cutter_dia_mm}}", stations_mm = "{{cad.fence_notch_x_mm}}" },
]

# From here every outline cut is judged on the pieces the slot separates: the
# strap, the fence-side waste between the notches and the front waste, each
# held by its own tape (and the strap by the screw, which is given no credit).
# The front waste's area is its strip along the bottom arc only.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop. Outline rough: a slot {{process.outline_finish_stock_mm:in.3dot}} outside the strap's edge, full perimeter, levels ≤ {{process.outline_rough_step_mm:in.3dot}}, down to a skin {{process.outline_skin_mm:in.3dot}} thick."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "strap", kind = "part", area_mm2 = "{{cad.strap_bond_area_mm2}}", width_mm = "{{cad.width_mm}}" }, { name = "fence-side waste", kind = "waste", area_mm2 = "{{cad.fence_waste_area_mm2}}" }, { name = "front waste", kind = "waste", area_mm2 = "{{cad.front_waste_area_mm2}}" }] } }
milling_cuts = [
  { name = "outline rough", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_rough_step_mm}}", radial_woc_mm = "{{process.outline_cutter_dia_mm}}", traverse_mm = "{{cad.outline_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop. Outline finish: the edge itself, {{process.outline_finish_stock_mm:in.3dot}} radial, one level down to the skin."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "strap", kind = "part", area_mm2 = "{{cad.strap_bond_area_mm2}}", width_mm = "{{cad.width_mm}}" }, { name = "fence-side waste", kind = "waste", area_mm2 = "{{cad.fence_waste_area_mm2}}" }, { name = "front waste", kind = "waste", area_mm2 = "{{cad.front_waste_area_mm2}}" }] } }
milling_cuts = [
  { name = "outline finish", kind = "side", phase = "finish", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", axial_doc_mm = "{{cad.outline_wall_depth_mm}}", radial_woc_mm = "{{process.outline_finish_stock_mm}}", traverse_mm = "{{cad.part_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = "other"
instruction = "Same file, no stop. Outline through: the skin, at the finished size, one level {{cad.outline_through_depth_mm:in.3dot}} deep, to {{process.outline_breakthrough_mm:in.3dot}} below the strap's nominal underside, into the tape stack; the cutter does not reach the plate."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "strap", kind = "part", area_mm2 = "{{cad.strap_bond_area_mm2}}", width_mm = "{{cad.width_mm}}" }, { name = "fence-side waste", kind = "waste", area_mm2 = "{{cad.fence_waste_area_mm2}}" }, { name = "front waste", kind = "waste", area_mm2 = "{{cad.front_waste_area_mm2}}" }] } }
milling_cuts = [
  { name = "outline through", kind = "slot", phase = "rough", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", axial_doc_mm = "{{process.outline_through_step_mm}}", radial_woc_mm = "{{process.outline_cutter_dia_mm}}", traverse_mm = "{{cad.part_x_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "Free, clean, deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished strap: two concentric arc edges, a tip land and an end face at each end, the reamed hub hole on the centre line; overall length for reference, edge heights from the hub centre and the corner slants calipers read from it." }
envelope = "other"
vise_hold = "other"
beam = "other"
inspection = [
  "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}}, micrometer, every strap: again after the stoning, freeing and straightening, any of which can move it (RS03's reading gated the machining).",
  "Every strap, from the hub centre: calipers over the .400 minus pin of the pin-gauge set in the hub hole, the reading less .200. Top edge {{cad.top_height_min_in:.3dot}}–{{cad.top_height_max_in:.3dot}} above and bottom edge {{cad.bottom_height_min_in:.3dot}}–{{cad.bottom_height_max_in:.3dot}} below, on the hub centreline: the check that the strap stayed on its tape against the fence and end stop.",
  "First article only, the same way, at both ends: the top corner, where the short tip land meets the angled end face, and the bottom corner, where the end face meets the bottom edge. The drawing's {{cad.corner_station_min_in:.2f}}–{{cad.corner_station_max_in:.2f}} and {{cad.foot_station_min_in:.2f}}–{{cad.foot_station_max_in:.2f}} run along the strap, but the top corner stands {{cad.corner_rise_in:.3dot}} and the bottom corner {{cad.foot_rise_in:.3dot}} above the hub centre, so the calipers read the slant: top corners {{cad.corner_slant_min_in:.3f}}–{{cad.corner_slant_max_in:.3f}}, bottom corners {{cad.foot_slant_min_in:.3f}}–{{cad.foot_slant_max_in:.3f}}.",
  "First article only: tip lands {{cad.tip_length_min_in:.2dot}}–{{cad.tip_length_max_in:.2dot}} long, from the top edge to the top corner, calipers along the land.",
  "Not gauged, the program's interpolated path: arc radii R{{cad.top_radius_min_in:.1f}}–{{cad.top_radius_max_in:.1f}} top and R{{cad.bottom_radius_min_in:.1f}}–{{cad.bottom_radius_max_in:.1f}} bottom, tip-land angle {{cad.tip_angle_min_deg:.1f}}–{{cad.tip_angle_max_deg:.1f}}°.",
]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.top_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bottom_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.corner_slant_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.foot_slant_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.tip_length_band_mm}}" },
]

[[setups.operations]]
steps = [
  { kind = "action", text = "First article only, strap still on the plate (diagnostic, REF): calipers across the two edges at the hub and 4.7 in either side, about {{cad.width_mm:in.3dot}} each (the arcs' spacing); write them down." },
  { kind = "check", text = "A .124 gauge block from the 81-piece set slides along the slot all round." },
  { kind = "stop", text = "Tight: a waste piece has moved toward the strap; once the strap is freed, check that edge against the inspection bands." },
]
feed = "hand"

# Release by peeling, no solvent soak (brief steps 10-11): the plate's tape
# bends, never the strap.
[[setups.operations]]
steps = [
  { kind = "action", text = "Screw and washer out. Waste first: slide a single-edge razor flat under the plate's tape at each waste piece's edge and lift the piece off with its tape." },
  { kind = "action", text = "The strap: slide the razor (or a .010 feeler leaf) flat under the plate's tape at one long edge and work it along the whole length a little at a time, so the tape bends, not the strap; never lever it up from one end." },
]
feed = "hand"

[[setups.operations]]
instruction = "Lay the strap tape-up on the surface plate. Hold it down flat with one hand close to the peel line and peel its tape back on itself, low and slow, along the length. The strap is never lifted by an edge while tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Residue: a CA spot on the strap or plate, acetone on a rag; the tape's adhesive film, isopropyl alcohol. Peel the plate's tape, lift the hub plug out and wipe the plate before the next blank."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, except the hub hole; file off any step left at the skin, {{process.outline_skin_mm:in.3dot}} above face 1." },
  { kind = "check", text = "Hub hole: both edges sharp, no burr." },
  { kind = "stop", text = "Burr: stone it off flat again and check again. An edge rounded over: scrap." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "On the surface plate, each face down in turn: the strap lies flat without rocking." },
  { kind = "stop", text = "Rocks: set it straight by hand on the surface plate (bend the high part back, never at the hub hole), then check again. Still rocks: scrap." },
]
feed = "hand"

[[setups.operations]]
instruction = "First article only, strap freed and flat: the same three widths again (REF); a change from the readings on the plate is spring, not the cutter's path. The strap is accepted by the inspection below."
feed = "hand"
