instruction = "Run RS04_outline (M6 T2: 1/8 in end mill, {{process.eighth_mill_projection_min_mm:in.2dot}}–{{process.eighth_mill_projection_max_mm:in.2dot}} out of the collet; set 2800). One run, no stop: the next four ops are its stages. Each depth level starts with a straight plunge. First blank: watch the first level pass outside the washer."
