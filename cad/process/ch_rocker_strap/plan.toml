# Rocker strap MHA-CH-13: the first part routed for the CNC mill
# (owner ruling 2026-11-17). Route, owner-chosen: 12 in blanks sawn from the
# 1/8 x 1-1/2 in 1018 CF flat (OnlineMetals 4807), 20 off; a shop-made 6061
# sub-plate gripped in the PM vise carries a fixed fence (Y0), an end stop (X0)
# and four Mitee-Bite Pitbull 26000 edge clamps (to buy). The sub-plate, hub
# plug, bought washer, clamps and hub screw are the fixture MHA-CH-13-TL-00, made
# beforehand to its drawings (cad/config/shop-equipment/
# fixtures.strap-*); this traveler cuts only the strap. Per the part
# registry's process text (cad/config/parts/ch-rocker-strap.yaml): rough both
# faces in turns, release and reseat, finish both faces to the thickness band;
# then, still in the edge clamps, spot, drill and ream the hub hole.
#
# The outline is not held on tabs (owner decision 2026-11-17): the blank is
# bonded to the plate on blue painter's tape on both faces with CA glue
# between (owner ruling 2026-11-23, R1: "for tape isnt it possible to use blue
# painters tape on both sides and ca glue between them") and screwed down
# through the reamed hub hole over a plug in the plate's counterbore; the
# edge clamps are backed off, since once the cut is through they would push
# loose waste into the cutter. No tape is under the blank while its faces are
# cut: the stack's thickness variation would go into the thickness band. The
# #47 rod-pin hole is not on this part.
#
# NC (cam:ch_rocker_strap, cad/process/ch_rocker_strap/cam.py): RS01_rough_faces,
# RS02_finish_face_1, RS03_finish_face_2_hub, RS04_outline. G54 is fixed to
# the plate in all four: X0 the end stop's face, Y0 the fence face, Z0 the
# plate top. Program names, the [parameters] and the milling_cuts names are a
# contract with that recipe.
#
# Holding in prechips' terms: clamped stages are a plate hold with clamp
# stations (a downward push bends nothing). The outline is a bonded plate
# hold: nothing bends; each cut's forces are compared with the bond's
# accepted strengths under every piece it leaves on the plate.
title = "Rocker strap"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished flat, 1/8 × 1-1/2 in (OnlineMetals 4807)"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in flat; {{process.quantity:d}} × {{process.blank_length_in:g}} in blanks."
shop = "../shop"
stock_refs = ["1018-flat-1-8x1-1-2"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

# The shop's standing page carries what every traveler shares (units, speeds,
# homing, Feed Hold, tool changes, proving a file, burrs); This job says what
# only this strap needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["Finished", "{{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} thick, ({{cad.overall_length_in:.2f}}) long."],
  ["Fixture", "One blank at a time through Setups 2–5, on the fixture MHA-CH-13-TL-00 (made beforehand to its drawings)."],
]

[cad]
file = "../../out/features/ch_rocker_strap/features.toml"
adapter = "arc_strap"
part = "ch-rocker-strap"

[parameters]
quantity = 20
blank_length_in = 12.0
blank_width_in = 1.5
blank_thickness_in = 0.125
kerf_in = 0.125
# Blank-thickness band the fixed facing heights are posted for (the catalogue
# states no tolerance): RS01 roughs face 1 at a fixed Z, so the adapter
# refuses a band whose thinnest blank that pass would miss. The operator mics
# each blank; out of band, stop.
blank_thickness_min_in = 0.122
blank_thickness_max_in = 0.126
# Left on each face by RS01 for the finish passes (.005 in).
face_finish_stock_mm = 0.127
# The face cuts' depths, restated from the facing arithmetic (the adapter's
# cad.face_*_doc_mm; cam.py recomputes and checks both): the deepest rough
# cut is the thickest blank's first face, the finish takes the finish stock.
face_rough_doc_mm = 0.2413
face_finish_doc_mm = 0.127
# Face stepover of the 1/2 in end mill, the measured face setting
# (settings.em-half-carbide-1018-3439-face, dechatter session of 2026-11-23,
# #3439: stable to 6.4 mm wide at up to 1.27 mm deep, 2420-2490 rpm in the
# cut; cad/config/shop-equipment/measured-cuts.toml): seven passes over the
# 1-1/2 in width plus the recipe's overhang, a width cam.py posts exactly
# (44 % of the cutter; six passes would need 6.43 mm, over the limit). Every
# measured pass was conventional and the faces zigzag (owner ruling
# 2026-11-16, kept 2026-11-22), so every other pass climbs, not measured.
face_stepover_mm = 5.588
# The strap in the blank, setup frame: X from the end stop, Y from the fence
# into the blank (machine −Y), top arc toward the fence, bottom arc toward
# the front edge. The hub is centred along the blank and 1.000 in from the
# fence, not centred across: the outline slot then leaves 0.53 mm of blank at
# the fence under the strap's tips (milled away, see the fence notches) and
# 1.58 mm at the front edge under the hub.
hub_x_mm = 152.4
hub_y_mm = 25.4
# Edge clamps for the faces and the hub hole, X from the end stop: 1.00, 4.25,
# 7.75 and 11.00 in.
clamp_1_x_mm = 25.4
clamp_2_x_mm = 107.95
clamp_3_x_mm = 196.85
clamp_4_x_mm = 279.4
# Clamp screw torque, reduced from the maker's 1.3 ft-lb maximum so the edge
# load does not bow a .098 in strip off the plate (owner-adopted estimate,
# 0.5 ft-lb, no source: confirm on the first article), printed in in-lb for
# the torque screwdriver.
clamp_torque_in_lb = 6
# Sub-plate MHA-CH-13-TL-01 (drawing ch_rocker_strap_tl_sub_plate), 13 × 3 ×
# .490 in 6061: top flat and parallel to its drawing, with an integral fence
# along its back and an end stop at the blank's left end standing .074 ±.005
# above it, so the plate under Z0 is .416 in (plate_top_height_mm): the height every
# Z stack above the vise bed uses, and the vise's grip (the front face, the
# lower of the two the jaws hold).
plate_start_x_mm = -12.7
plate_length_mm = 330.2
plate_width_mm = 76.2
plate_top_height_mm = 10.5664
fence_width_mm = 12.7
# Fence top, end-stop top and clamp noses above the plate top: all under the
# finished thickness, so the face cutter clears them. Fence and end stop: the
# drawing's .074 +.005, .079. Clamp: the Pitbull 26000's minimum clamped
# height, .075 in (shop-equipment
# fixtures.edge-clamps-low-profile.min_clamp_height_mm), a catalogue nominal
# rather than a limit: the prove-out holds the noses to the fence's .079,
# which cam.py proves under the faced top as well.
fence_height_mm = 2.0066
end_stop_height_mm = 2.0066
clamp_height_mm = 1.905
# The fence face swept along X with the lever indicator once per vise setup:
# the source of the reading (the fixture sheet MHA-CH-13-TL-00's step
# mirrors it, ch_rocker_strap_tl_fixture_spec.FENCE_READING_IN). Y0 is
# touched on the fence at the hub station (Op 30), so the plate's hub tap
# sits on the program's hub; its notch ends lie 5.9 in either side: a
# fence out by the reading over the 12 in moves each notch that much x
# 5.9/12 off the program's, against .0025 in of spare notch depth (the
# fixture's necessity register, N-01).
fence_sweep_max_in = 0.001
# Under the hub the plate has a Ø1/2 in counterbore .185 in deep with a
# #10-32 tapped hole through its floor. In RS03 it is the relief the drill
# and reamer run into: their tips stop relief_floor_clearance_mm above its
# floor (25/64 drill: 118° point 2.98 mm long, so its full diameter is 1.0 mm
# through the strap; the reamer's lead likewise). In RS04 the hub plug sits in
# it. The hub hole may be drilled x_stop_tolerance_mm off the counterbore's
# centre (setting X0 and Y0, and the fixture's own error): the author's
# allowance, no source; Ø12.7 leaves 1.26 mm round the hub hole.
hub_relief_dia_mm = 12.7
hub_relief_depth_mm = 4.7
relief_floor_clearance_mm = 0.5
x_stop_tolerance_mm = 0.5
drill_tip_z_mm = -4.0
ream_tip_z_mm = -4.0
# Outline hold-down (fixture assembly MHA-CH-13-TL-00): the hub plug TL-02 in
# the counterbore, its pilot slipping into the reamed hub hole, the washer
# TL-VN-52 over the hole and the #10-32 × 5/8 button-head screw TL-VN-51
# (McMaster 91255A267) through both into the plate. Owner ruling 2026-11-23:
# "change the screw to #10-32. The sub-plate's tapped hole becomes #10-32 and
# the plug's bore .201 (#7 drill). The washer is then a #10 SAE washer you
# already own (McMaster 96659A104, .219 x .500, pack of 100 from PO
# 1103PCAMPOS), used as supplied. The made washer, its drawing and its lathe
# traveler are deleted." It reverses 2026-11-17's "Use a 1/4-20 hub screw.
# The .23 in of thread in the 6061 plate is accepted: the screw only snugs
# the strap during the outline." (the thread acceptance stands). Owner ruling
# 2026-11-23, the washer: "Pick one washer from the pack of 100 by
# measurement and keep it with the fixture: OD .505 or under and bore .220 or
# under ... The traveler says to mike it once and centre it by eye."
# washer_od_max_mm and washer_bore_no_go_mm print that selection (the bore by
# the pin gauge of its limit, which must not enter).
# bushing_flange_dia_mm (.540) is the diameter the washer stays inside when
# centred: half of .505, plus ASME B18.21.1's .013 bore-to-rim run-out all
# one way, plus the tapped hole's .003 position, is .268 from the hub centre
# (.537 across). The outline cutter's edge must pass
# bushing_clearance_mm from it (prechips refuses otherwise: the strap's
# bottom edge is at least 7.49 mm from the hub centre, so 0.63 mm). Pushed
# fully to one side the washer reaches 7.27 mm from the hub centre
# (ch_rocker_strap_tl_vn_hub_washer_spec.REACH_MAX), inside the 7.358 the
# program keeps out of and 0.22 mm short of the cutter's edge: hence centre
# it, and watch the first level. bushing_stack_height_mm (.202) covers the
# thickest washer B18.21.1 allows, .065, plus the head's .101 above the
# strap's top (.166); cam.py keeps the holder and every link move clear of
# it. All three stand as they were for the made washer, so RS04 is unchanged.
# Owner ruling 2026-11-24 (Pedro), on the pushed-aside 0.22 mm: "Accept as
# is: centre the washer by eye, 0.5 mm centred, 0.22 mm worst case; the
# traveler says to centre it and to watch the first level."
washer_od_max_mm = 12.827
washer_bore_no_go_mm = 5.588
bushing_flange_dia_mm = 13.716
bushing_clearance_mm = 0.5
bushing_stack_height_mm = 5.1308
# Hold: blue painter's tape on the plate and on the blank, CA glue between
# (shop-equipment consumables.hold-painters-tape-ca: ScotchBlue 2090, GH1200
# thick, Starbond accelerator). Owner, 2026-11-23, R2: "it is widely used in
# industry with much heavier requirements; take it as given it will work".
# The stack (tape + glue + tape) is the record's: .011 nominal, every bond
# miked into .009-.013 before the program runs.
tape_stack_mm = 0.28
tape_stack_min_mm = 0.23
tape_stack_max_mm = 0.33
# The arc_strap adapter's name for the whole stack under the blank (it
# derives the through depth from it); the same number as tape_stack_mm,
# which cam.py checks.
tape_thickness_mm = 0.28
# The bond's strengths are stresses the owner accepts (the record's
# accepted_shear_kpa / accepted_tensile_kpa, the fleet figure the planner set
# under the owner's delegation), used as written: a cap as well as an
# envelope, so a cut asking more takes more levels.
bond_accepted_shear_mpa = 0.6
bond_accepted_tensile_mpa = 0.6
# Tape seams, each layer's distance from the fence face. The blank is 1-1/2
# in wide, the tape 1.41 in (consumables.tape-scotchblue-2090.width_mm): two
# strips on each face, seams along X. Plate: the first strip's edge on the
# fence face, the second butted to it, so its seam is a strip's width out.
# Blank: two strips butted at mid-width, both edges trimmed flush: 16.8 mm
# (.66 in, about half a strip) off the plate's. The blank's seam lies under
# the strap's body, 1.9 mm inside its top edge at the hub, and leaves it
# through both end faces; the plate's runs under the bottom slot for about
# 68 mm round the hub, where the blank's tape above it is whole. cam.py
# checks the spacing and that the slot never lies over both seams.
tape_seam_blank_mm = 19.05
tape_seam_plate_mm = 35.814
# Outline, 1/8 in 3-flute carbide end mill at .001 in/tooth (shop
# settings.endmill-carbide-3fl-1-8-1018-cf-tru-edge); its 30° helix (shop
# tools.endmill-carbide-3fl-1-8.helix_deg) lifts with tan 30° of the
# tangential force. The slot is roughed .2 mm outside the edge and the wall
# finished down to a skin left under the slot (owner-adopted, about .010 in);
# only then is the skin cut through at the finished size, into the stack and
# short of the plate. The file works on the nominal stack, so the skin is
# .25 ± .05 mm (.008–.012) over the band. outline_breakthrough_mm is below
# the nominal underside: the through cut runs at Z .115 mm over the plate,
# inside the plate's own tape (.137 thick), .115 under the strap's underside
# at the thinnest stack (.23) and .215 at the thickest (.33), and .115 above
# the plate at either (cam.py checks both ends of the band).
outline_cutter_dia_mm = 3.175
outline_finish_stock_mm = 0.2
outline_skin_mm = 0.25
outline_breakthrough_mm = 0.165
# Depth levels (R3, owner 2026-11-23: "no need to bring to me ; make coarser
# as you see fit"). Two limits: the bond's accepted 0.6 MPa, a cap (prechips
# refuses a cut whose lift asks more), and, the 1/8 in end mill slotting 1018
# being unmeasured (not in measured-cuts.toml), no level deeper than the
# deepest the same cutter at the same setting slots in 1018 in a reviewed
# traveler on main: ch_connecting_rod Setup 6 ("Face F: outline on tabs"),
# program CR08_outline, cut "outline", 1.185 mm (its outline_level_mm).
# - fence sliver, the blank whole (38.1 mm wide), top to the through Z
#   (2.654 mm): the precedent binds, 3 levels of .885 (was 4 of .642 at the
#   old .75 mm bond limit);
# - outline rough, judged on the strap alone (16 mm wide), top to the skin
#   (the 2.239 mm wall): the bond cap binds, 4 levels of .560, a lift of
#   0.46 MPa; the next coarser, 3 levels of .746, would ask 0.61 MPa (prechips:
#   1.185 mm levels ask 0.972). Was 14 of .160 at the old .17 mm bond limit;
# - finish pass, one level over the wall depth (cad.outline_wall_depth_mm),
#   unchanged;
# - through cut, the skin and the breakthrough (cad.outline_through_depth_mm,
#   .415 mm): one level (about 0.34 MPa; was 2 of .165 at the old .17 mm bond
#   limit), outline_through_step_mm that whole depth. The skin itself stays:
#   it is the thin-part limit that keeps the freed pieces joined until the
#   last pass.
fence_sliver_step_mm = 1.185
outline_rough_step_mm = 0.56
outline_through_step_mm = 0.415
# The fence-side strip is milled away before the outline where it is under
# sliver_width_min_mm (owner-adopted: no free strip of that order; the value,
# as wide as the strap is thick, is the author's). That is 133.5 to 148.0 mm
# either side of the hub; the fence is notched there (distances from the hub
# centre along X, a cutter radius and more beyond each end), fence_notch_depth_mm
# back from the fence face, down to the plate top.
sliver_width_min_mm = 2.5
fence_notch_inner_mm = 131.0
fence_notch_outer_mm = 150.0
# Notch depth and floor, the end stop's height and the bushing stack are read
# and checked by cam.py against the posted paths, not by prechips.
fence_notch_depth_mm = 4.0
fence_notch_floor_z_mm = 0.0
# Hub hole: spot Ø.125 at the top with the 60° centre drill.
spot_dia_mm = 3.175
spot_point_deg = 60
hub_drill_dia_mm = 9.921875
hub_reamer_dia_mm = 10.16
# Feeds the program runs and the sheet prints, each from one number (mm/min):
# spot 1800 rpm × .002 in/rev = 3.6 in/min; drill 600 × .004 = 2.4; reamer
# 400 × .008 = 3.2 (feeds per rev: the author's choice, no source); outline
# plunge at half the 1/8 in end mill's chip load, 2800 × 3 × .0005 = 4.2.
hub_spot_feed_per_min_mm = 91.44
hub_drill_feed_per_min_mm = 60.96
hub_ream_feed_per_min_mm = 81.28
outline_plunge_feed_per_min_mm = 106.68
face_cutter_dia_mm = 12.7
# Machine-capacity inputs (mm): heights above the mill table, tool lengths
# from spindle nose to tip.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_height_mm = 25.4        # 1 in parallels (shop-equipment fixtures.parallels-lms-6745).
plate_overhang_mm = 85.76        # (plate length − jaw width)/2, plate centred in the jaws.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm (as the base-bar plan).
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# ANSI B94.2 13/32 in class chucking reamer: 7 in overall, bounded by its
# whole length below the chuck.
reamer_oal_mm = 177.8
# 1/2 in carbide end mill, 3 in overall (shop-equipment
# tools.endmill-carbide-3fl-1-2): set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm). The collet's lower end then stands
# about 31 mm over
# the plate top while the faces are cut: the jaws' top is 9 mm over it, the
# fence, end stop and clamp noses at most 2 mm.
half_mill_projection_mm = 28.45
# 1/8 in end mill, 1-1/2 in overall, 1/2 in of flute: between this much out
# of the collet and its flute length (4 diameters).
eighth_mill_projection_min_mm = 12.0
eighth_mill_projection_max_mm = 12.7

