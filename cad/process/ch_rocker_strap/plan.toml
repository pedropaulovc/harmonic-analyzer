[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "{{process.quantity:d}} blanks {{process.blank_length_in:g}} in long sawn one after another from the end of the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in flat." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:g}} in blanks from the {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in flat, flat on the saw bed. Deburr the sawn ends and both long edges: the blank must seat flat on the plate and square against the fence."
feed = "hand"

# RS01: face 1, M0 flip, face 2. Heights are fixed from the plate top (Z0), so
# the faces are skimmed equally on a nominal blank; cad.face_z_* come from the
# blank thickness, the finished thickness and face_finish_stock_mm.
[[setups]]
machine_kind = "other"
title = "Rough both faces on the sub-plate"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Sub-plate MHA-CH-13-TL-01 in the vise on 1 in parallels, centred, the fence indicated within {{process.fence_sweep_max_in:.3dot}} along X and the plate top indicated within .001 over the 12 in under the blank; it stays there for every blank. Blank flat on the plate, one long edge against the fence, its left end against the end stop, pushed by the Mitee-Bite Pitbull 26000 (4-40) edge clamps TL-VN-50 at X {{cad.clamp_stations_in}} from the end stop, each tightened to {{process.clamp_torque_in_lb:g}} in-lb. Clamp noses, fence and end-stop tops at most {{process.fence_height_mm:in.3dot}} above the plate, below the cut."
datum = "Program RS01_rough_faces (cam:ch_rocker_strap). One G54 while the plate stays put: Z0 = the plate top, Y0 = the fence face (blank at −Y), X0 = the end stop's face, set in Op 30. After the plate moves, or after homing again (the standing page says when), in this setup or any later one on the plate: no blank on the plate, set all three again as Op 30 does; a blank on it, stop and tell the owner (the blank covers the faces Op 30 touches). Every file (RS01–RS04) starts with an M6, so none runs on the length the last file left, even re-run or restarted."
diagram = { file = "diagrams/rough.svg", alt = "Plan of the sub-plate: fence along the back, blank against it and against the end stop at its left end, edge clamps at the front at X {{cad.clamp_stations_in}}; the 1/2 in end mill faces the full blank, one face, then the other after the flip." }
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{cad.thickness_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_mm}}"] }
# The vise grips the sub-plate, not the blank: every size here is the plate's.
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_top_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# Section at the finished thickness, the thinnest the blank gets.
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", clamps_mm = "{{cad.clamp_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }

# The plate top's tilt along X is a thickness wedge: face 1 is cut parallel
# to the table, then lies on the tilted top for face 2, so the strap ends up
# thicker at one end by the top's run-out over the blank. .001, the shop's
# flatness/parallelism row, keeps that to half the .002 thickness band; the
# per-blank thickness check at RS03's M6 T3 catches the rest. A shim between
# the parallels and the plate's low end levels a plate whose top and
# underside are not parallel; the fence and end-stop heights do not change.
[[setups.operations]]
steps = [
  { kind = "check", text = "Once per vise setup, no blank in: the lever indicator along the plate top over X 0–12 reads within .001; then along the fence face over X 0–12, within {{process.fence_sweep_max_in:.3dot}}." },
  { kind = "stop", text = "Plate top over: reseat the plate on the parallels and indicate again. Still over: a feeler-gauge leaf between the parallels and the plate's low end, then indicate again." },
  { kind = "stop", text = "Fence over: open the vise a little, tap the plate's high-reading end away from the indicator with a soft mallet, close the vise and indicate the fence, then the plate top, again." },
]
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (the 1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet). T1, spindle off, just dragging on a .200 gauge block on the plate top: G10 L20 P1 Z5.080. The .200 edge finder at 900 rpm on the end stop's face: G10 L20 P1 X2.540; then at X {{cad.hub_x_in:.3f}} (the hub station), on the fence face: G10 L20 P1 Y-2.540 (its 2.540 mm radius each time)."
feed = "hand"

# Owner ruling 2026-11-23: "Pick one washer from the pack of 100 by
# measurement and keep it with the fixture ... The traveler says to mike it
# once and centre it by eye." The limits: [parameters] washer_*.
[[setups.operations]]
steps = [
  { kind = "check", text = "Once, for the fixture: pick the hub washer TL-VN-52 from the #10 SAE washer pack (McMaster 96659A104). Its outside diameter mikes {{process.washer_od_max_mm:in.3dot}} or under, and the {{process.washer_bore_no_go_mm:in.3dot}} pin gauge does not enter its bore." },
  { kind = "stop", text = "Over on either: take another washer from the pack and measure it the same way." },
  { kind = "action", text = "Mark the washer with a paint pen and keep it with the fixture: no other washer goes on the hub." },
]
feed = "hand"

# Prove-out: the clamps, fence and end stop stand about .02 under the finish
# face, and their heights are set by hand. One limit for all three, the
# drawing's high limit on the fence and end stop.
[[setups.operations]]
steps = [
  { kind = "action", text = "First blank only, before it goes in: prove RS01–RS04 in air. Edge finder out; console M6 T1; on the .200 block: G10 L20 P1 Z-20.320 (Z0 25.4 mm, 1.000 in, high). Run each file single block through its first plunges. Then M6 T1 and G10 L20 P1 Z5.080 on the block again." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Calipers' depth rod: clamp noses, fence and end-stop tops each ≤ {{process.fence_height_mm:in.3dot}} above the plate." },
  { kind = "stop", text = "Over: no blank goes in. Reseat the clamp, or bring the fence or end stop to its drawing height, and check again." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "Per blank: mic it, {{process.blank_thickness_in:.3dot}} nominal, every reading {{process.blank_thickness_min_in:.3dot}}–{{process.blank_thickness_max_in:.3dot}}, else stop." },
  { kind = "action", text = "Lay it on the plate: the face up now is face 1. One long edge on the fence, the left end on the end stop; clamp." },
]
feed = "hand"

