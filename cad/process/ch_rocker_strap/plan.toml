]

# RS03, still in the edge clamps, no tape: finish face 2, then the hub hole.
# Tool numbers are the places in the tools list: T1 1/2 in end mill, T2 1/8 in
# end mill, T3 centre drill, T4 25/64 drill, T5 reamer.
[[setups]]
machine_kind = "other"
title = "Finish the second face; hub hole"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Turn the blank over end for end (face 1, finished, down; face 2 up), the same long edge on the fence and the other end on the end stop; clamp at X {{cad.clamp_stations_in}}, {{process.clamp_torque_in_lb:g}} in-lb. Counterbore under the hub empty: no plug in it."
datum = "Program RS03_finish_face_2_hub. G54 unchanged: Z0 plate top, Y0 fence, X0 end stop; the hub hole is at X {{cad.hub_x_in:.3f}}, Y −{{cad.hub_y_in:.3f}}, over the plate's counterbore."
diagram = { file = "diagrams/hub.svg", alt = "Plan of the sub-plate: blank against the fence and the end stop under the edge clamps; the 1/2 in end mill takes the finish pass over the full face; the hub hole at X {{cad.hub_x_in:.3f}} Y −{{cad.hub_y_in:.3f}}." }
# Deepest: the drill and reamer tips in the counterbore; longest tool: the
# reamer in the drill chuck; shortest: the 1/2 in end mill in its collet.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{process.ream_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_top_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", clamps_mm = "{{cad.clamp_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run RS03_finish_face_2_hub (M6 T1 at its start, the 1/2 in end mill; 2650): the face at Z {{cad.thickness_in:.4dot}}. It stops at its M6 T3 (spindle off, cutter retracted), before the centre drill goes in: unclamp the blank and lift it off for the check, since the micrometer cannot reach under it on the plate."
inspection = "Every blank's thickness acceptance: {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}}, micrometer at both ends and mid-length."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.thickness_band_mm}}" }]
