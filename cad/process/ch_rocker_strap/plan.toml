  { name = "face finish", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{cad.face_finish_doc_mm}}", radial_woc_mm = "{{process.face_stepover_mm}}", traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

# The thickness check's remedy and the reseat follow the check: prechips
# prints an op's Check after its work, so they are the next op.
[[setups.operations]]
steps = [
  { kind = "stop", text = "Thick: stop the file; clean under the blank, reseat, reclamp and run RS03 again from its start (the same Z). Thick again, or thin: the blank is scrap." },
]
feed = "hand"

[[setups.operations]]
instruction = "In band: reseat the blank as it was (face 2 up, the same long edge on the fence, the same end on the end stop) and clamp at {{process.clamp_torque_in_lb:g}} in-lb. Then the same stop's tool change: T3, the #2 centre drill, in; set 1800; Cycle Start (the M6 measures it on the tool setter)."
feed = "hand"

# Hub hole, over the plate's counterbore: the blank spans it as a short beam
# between its edges; the drill and reamer push down on it.
[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
drilling = "none"
sizing = "other"
instruction = "Same file, on from that stop with T3: spot the hub hole Ø{{process.spot_dia_mm:in.3dot}} at X {{cad.hub_x_in:.3f}}, Y −{{cad.hub_y_in:.3f}} at 1800."
rpm = 1800
feed = "{{process.hub_spot_feed_per_min_mm:in.1f}} in/min"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
  { name = "hub spot", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.spot_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = "{{process.hub_spot_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

# Drill and ream speeds: LittleMachineShop "Cutting Speeds", Drilling &
# Reaming, Plain carbon steels 1006-1026 (read 2026-11-17): drilling
# 60-100 ft/min, reaming 40-65; the low ends: 600 rpm on the 25/64 drill
# (61 ft/min), 400 rpm on the .400 reamer (42 ft/min). Feeds: [parameters].
[[setups.operations]]
speed_kind = "spindle"
tool = "hub-drill"
drilling = "twist_drill"
sizing = "other"
instruction = "Same file, M6 T4: 25/64 drill through into the counterbore, no peck; set 600. Cutting oil."
rpm = 600
feed = "{{process.hub_drill_feed_per_min_mm:in.1f}} in/min"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
hole_depth_mm = "{{cad.thickness_mm}}"
peck = "none"
milling_cuts = [
  { name = "hub drill", kind = "drill", phase = "rough", cutter_dia_mm = "{{process.hub_drill_dia_mm}}", flutes = 2, rpm = 600, feed_mm_min = "{{process.hub_drill_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "hub-reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.hub_dia_band_mm}}" }
instruction = "Same file, M6 T5: ream through, .4000 reamer in the drill chuck; set 400. Cutting oil. The file feeds the reamer in and feeds it back out, spindle running: no rapid leaves the bore. Leave the blank clamped for the check."
inspection = "Still clamped: hub hole Ø{{cad.hub_dia_min_in:.4dot}}–{{cad.hub_dia_max_in:.4dot}}, the .4000 GO plug gauge enters, the .4005 NO-GO does not. Every hole; the first blank's before reaming any other."
rpm = 400
feed = "{{process.hub_ream_feed_per_min_mm:in.1f}} in/min, in and out"
gauge_checks = [{ gauge = "plug-gauges-4000-4005", band_mm = "{{cad.hub_dia_band_mm}}" }]
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.hub_relief_x_mm}}", section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.thickness_mm}}" } }
# No reamer kind: its thrust is analysed as a two-lip twist drill's at the
# reamer Ø and the same feed (flutes = 2 is that model's, not the reamer's),
# far above what a .009 in ream allowance takes.
milling_cuts = [
  { name = "hub ream", kind = "drill", phase = "finish", cutter_dia_mm = "{{process.hub_reamer_dia_mm}}", flutes = 2, rpm = 400, feed_mm_min = "{{process.hub_ream_feed_per_min_mm}}", stations_mm = "{{process.hub_x_mm}}" },
]

# The ream's remedy and the unclamp follow its check (#3060): prechips prints
# an op's Check after its work, so they are the next op.
[[setups.operations]]
steps = [
  { kind = "stop", text = "NO-GO enters or GO will not: stop, the reamer is out of band." },
  { kind = "action", text = "In band: unclamp the blank and lift it out." },
]
feed = "hand"

# RS04: the outline, one tool, no stop inside the file. The blank is bonded
# to the plate and screwed down at the hub; the setup's beam is the whole
# blank on its tape, which the plunge and the fence sliver cut into.
[[setups]]
machine_kind = "other"
title = "Bond to the plate; outline"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Blank bonded to the plate on 3M VHB 5906 tape ({{process.tape_thickness_mm:in.3dot}}) under its whole face, face 1 down, the reamed hub hole over the hub plug TL-02's pilot in the plate's counterbore, one long edge against the fence, and screwed down at the hub: the 1/4-20 × 5/8 button-head screw TL-VN-51 through the washer TL-03 into the plate. Edge clamps backed off clear of the blank."
datum = "Program RS04_outline. G54 unchanged: Y0 fence, X0 end stop, Z0 the plate top; the file works {{process.tape_thickness_mm:in.3dot}} above it for the tape. The plug puts the hub hole at X {{cad.hub_x_in:.3f}}, Y −{{cad.hub_y_in:.3f}}; the fence sets the blank square."
diagram = { file = "diagrams/outline.svg", alt = "Plan of the sub-plate: blank bonded to the plate against the fence, no edge clamps; screw and washer at the hub hole; the fence notched under both tips of the strap; the 1/8 in end mill's slot runs round the whole outline, top arc toward the fence." }
# Top: the strap on its tape; deepest: the through cut stops in the tape,
# above the plate top.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.outline_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.fence_notch_depth_mm}}", "{{process.outline_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}", "{{process.tape_thickness_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_top_height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_top_height_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{cad.blank_length_mm}}"], seat = "faced sub-plate", seat_mm = "{{cad.plate_x_mm}}", bond = { shear_mpa = "{{process.tape_shear_mpa}}", tensile_mpa = "{{process.tape_tensile_mpa}}", derating = "{{process.bond_derating}}", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{cad.blank_bond_area_mm2}}", width_mm = "{{cad.blank_width_mm}}" }] } }

# The drill and reamer leave their exit burr on face 1, which seats on the
# tape and the plug pilot next: it comes off here, the edges kept sharp.
[[setups.operations]]
steps = [
  { kind = "action", text = "Per blank. Rub each face of the reamed blank flat across the hub hole on a fine stone: the burr off, both edges left sharp." },
  { kind = "check", text = "Hub hole: both edges sharp, no burr." },
  { kind = "stop", text = "Burr: stone it off flat again and check again. An edge rounded over: the blank is scrap, before it is taped." },
]
feed = "hand"

[[setups.operations]]
instruction = "Degrease the plate top and the blank's face 1 with isopropyl alcohol and water. Lay the 3M VHB 5906 tape on the plate over the blank's whole footprint, cut away at the counterbore. Drop the hub plug into the counterbore."
feed = "hand"

[[setups.operations]]
instruction = "Lower the blank, face 1 down, hub hole over the plug's pilot, long edge against the fence, and press it down over its whole face (the tape wants about 15 psi). Washer and screw on at the hub, snug. Back the edge clamps off clear of the blank."
feed = "hand"

[[setups.operations]]
instruction = "Wait 20 minutes: the tape is taken at half strength, which it reaches by then."
feed = "hand"

