inspection = [
  "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}}, micrometer, every strap: again after the stoning, freeing and straightening, any of which can move it (RS03's reading gated the machining).",
  "Every strap, from the hub centre: calipers over the .4000 GO plug gauge in the hub hole, the reading less .200. Top edge {{cad.top_height_min_in:.3dot}}–{{cad.top_height_max_in:.3dot}} above and bottom edge {{cad.bottom_height_min_in:.3dot}}–{{cad.bottom_height_max_in:.3dot}} below, on the hub centreline: the check that the strap stayed on its tape and plug.",
  "First article only, the same way, at both ends: the top corner, where the short tip land meets the angled end face, and the bottom corner, where the end face meets the bottom edge. The drawing's {{cad.corner_station_min_in:.2f}}–{{cad.corner_station_max_in:.2f}} and {{cad.foot_station_min_in:.2f}}–{{cad.foot_station_max_in:.2f}} run along the strap, but the top corner stands {{process.corner_rise_in:.3dot}} and the bottom corner {{process.foot_rise_in:.3dot}} above the hub centre, so the calipers read the slant: top corners {{process.corner_slant_min_in:.3f}}–{{process.corner_slant_max_in:.3f}}, bottom corners {{process.foot_slant_min_in:.3f}}–{{process.foot_slant_max_in:.3f}}.",
  "First article only: tip lands {{cad.tip_length_min_in:.2dot}}–{{cad.tip_length_max_in:.2dot}} long, from the top edge to the top corner, calipers along the land.",
  "Not gauged, the program's interpolated path: arc radii R{{cad.top_radius_min_in:.1f}}–{{cad.top_radius_max_in:.1f}} top and R{{cad.bottom_radius_min_in:.1f}}–{{cad.bottom_radius_max_in:.1f}} bottom, tip-land angle {{cad.tip_angle_min_deg:.1f}}–{{cad.tip_angle_max_deg:.1f}}°.",
]
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.thickness_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.top_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.bottom_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.corner_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.foot_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.tip_length_band_mm}}" },
]

[[setups.operations]]
steps = [
  { kind = "action", text = "First article only, strap still on the plate (diagnostic, REF): calipers across the two edges at the hub and 4.7 in either side, about {{cad.width_mm:in.3dot}} each (the arcs' spacing); write them down." },
  { kind = "check", text = "A .124 pin gauge passes along the slot all round." },
  { kind = "stop", text = "Tight: a waste piece has moved toward the strap; once the strap is freed, check that edge against the inspection bands." },
]
feed = "hand"

[[setups.operations]]
instruction = "Screw and washer out. Lift the waste pieces. Free the strap by working a thin blade under it along its length; do not lever it up from one end. Lift the hub plug out of the counterbore. Clean the tape off strap and plate with isopropyl alcohol."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, except the hub hole; file off any step left at the skin, {{process.outline_skin_mm:in.3dot}} above face 1." },
  { kind = "check", text = "Hub hole: both edges sharp, no burr." },
  { kind = "stop", text = "Burr: stone it off flat again and check again. An edge rounded over: scrap." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "On the surface plate, each face down in turn: the strap lies flat without rocking." },
  { kind = "stop", text = "Rocks: set it straight by hand on the surface plate (bend the high part back, never at the hub hole), then check again. Still rocks: scrap." },
]
feed = "hand"

[[setups.operations]]
instruction = "First article only, strap freed and flat: the same three widths again (REF); a change from the readings on the plate is spring, not the cutter's path. The strap is accepted by the inspection below."
feed = "hand"
