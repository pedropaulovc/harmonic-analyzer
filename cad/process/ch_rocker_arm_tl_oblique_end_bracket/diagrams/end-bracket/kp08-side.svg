<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-cad-template="jig-bracket-tap" data-face="kp08" viewBox="0 0 720 {{view.height}}" width="720" height="{{view.height}}" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <!-- Setup 4: rolled over, KP08 SIDE up; top view and section at H1 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#111"/>
    </marker>
    <pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fbe1dd"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#b33" stroke-width="1.6"/>
    </pattern>
    <pattern id="thread" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#fff"/>
      <path d="M0 0L4 4M4 0L0 4" stroke="#333" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="720" height="{{view.height}}" fill="#fff"/>

  <!-- schematic fixtures: bed, parallels, soft jaws; vise jaws -->
  <g id="fixture" data-cad-group="fixture" fill="#e6e7e9" stroke="#888" stroke-width="1.2"/>
  <g id="jaws" data-cad-group="jaws" fill="#8a9099" stroke="#111" stroke-width="1.2"/>
  <!-- part material from CAD values and authored parameters -->
  <g id="other" data-cad-group="other" fill="#eceef0" stroke="#888" stroke-width="1.2"/>
  <g id="arriving" data-cad-group="arriving" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="6 4"/>
  <g id="kept" data-cad-group="kept" fill="#d7e1ec" stroke="#111" stroke-width="1.6"/>
  <g id="removed" data-cad-group="removed" fill="url(#cut)" stroke="none"/>
  <g id="threads" data-cad-group="threads" fill="url(#thread)" stroke="#555" stroke-width="0.6"/>
  <g id="holes" data-cad-group="holes" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <!-- parallels under the work and hidden edges -->
  <g id="hidden" data-cad-group="hidden" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="5 3"/>
  <!-- schematic tools, this setup's cuts, datums, dimensions and labels -->
  <g id="tool" data-cad-group="tool" fill="#c9a227" stroke="#111" stroke-width="1.2"/>
  <g id="active" data-cad-group="active" fill="none" stroke="#e07000" stroke-width="3" stroke-linecap="round"/>
  <g id="datum" data-cad-group="datum" fill="#b22" stroke="#b22" stroke-width="2.4"/>
  <g id="arrows" data-cad-group="arrows" stroke="#111" stroke-width="1.5" marker-end="url(#arr)"/>
  <g id="dims" data-cad-group="dims" stroke="#111" stroke-width="1"/>
  <g id="leaders" data-cad-group="leaders" fill="none" stroke="#333" stroke-width="0.9"/>
  <g id="labels" data-cad-group="labels" fill="#111"/>
  <g id="titles" data-cad-group="titles" fill="#555" font-style="italic"/>

  <!-- legend -->
  <g transform="translate({{view.legend_x}} {{view.legend_y}})" font-size="13">
    <rect x="0" y="0" width="26" height="12" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="34" y="11">arriving material</text>
    <rect x="232" y="0" width="26" height="12" fill="url(#cut)"/>
    <text x="266" y="11">removed in this setup</text>
    <rect x="464" y="0" width="26" height="12" fill="#d7e1ec" stroke="#111" stroke-width="1.6"/>
    <text x="498" y="11">kept after this setup</text>
    <line x1="0" y1="26" x2="26" y2="26" stroke="#e07000" stroke-width="3"/>
    <text x="34" y="31">cut or tapped here</text>
    <rect x="232" y="20" width="26" height="12" fill="url(#thread)" stroke="#555" stroke-width="0.6"/>
    <text x="266" y="31">thread</text>
    <rect x="464" y="20" width="26" height="12" fill="#8a9099" stroke="#111"/>
    <text x="498" y="31">fixtures, tools: schematic</text>
  </g>
</svg>
