# Source: cad/process/hand-travelers/
# ch-rocker-arm-tl-oblique-end-bracket-traveler-2026-11-02.html (drawing v47):
# operation order, tools, speeds, parallels, ~.2 in overhang, Y0 on the fixed
# jaw and the INNER END / ROW EDGE datums. Holding both brackets per clamping,
# one at each jaw end (so X0/XR and the Y0 touch in the gap between them), is
# Pedro's 2026-11-10 ruling, not the hand sheet. The feature manifest wins
# where they disagree: two shared-axis #8-32 holes at the KP08 stations,
# drilled #29 through and tapped plug-then-bottoming from both faces to the
# drawing's tip marks (v47: four #8-32 from the bar side, two #6-32 from the
# KP08 side, plug tap to about 5/8 in). The v49 sheet names the faces FRONT
# FACE (the KP08's, KP08 SIDE here) and BACK FACE (the base bar's, BAR SIDE).
title = "Oblique trammel end bracket — {{process.quantity:d}} identical"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar (OnlineMetals 1165, shared with TL-26); {{process.quantity:d}} × {{process.blank_length_in:.2f}} in blanks."
note = "Inches unless mm. Finished length {{cad.length_min_in:.3f}}–{{cad.length_max_in:.3f}}; 1/2 and 1 in faces as bought. Both pieces in the vise together, one at each jaw end; each op on both before the next tool."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_end_bracket/features.toml"
adapter = "harmonic_end_bracket"

[parameters]
blank_length_in = 2.85
blank_min_length_in = 2.75
blank_thickness_in = 0.5
blank_width_in = 1.0
quantity = 2
kerf_in = 0.125                 # Hand sheet: about 1/8 in per cut.
# Hand sheet: Y0 touched on the fixed jaw past the part. Two-up (2026-11-10)
# that station is in the gap between the parts.
y_touch_x_in = 3.5
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). Archive values are
# archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
overhang_mm = 5.08               # Hand sheet: ~.2 in past the jaw side.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
parallel_height_mm = 25.4        # 1 in parallels (archive parallels-lms-6745 1in).
parallel_thickness_mm = 3.175    # Archive parallels-lms-6745 thickness_in 0.125.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
end_cut_tip_z_mm = -1.016        # Hand sheet: cutter .04 below the part.
cutter_dia_mm = 12.7             # 1/2 in end mill.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# Archive LMS 6784 projections: 7/16 in 41, 11/16 in 50; the 1/2 in cutter has
# no member record, so its neighbours bound it (as in base-bar.toml).
half_mill_projection_min_mm = 41.0
half_mill_projection_max_mm = 50.0
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
spot_projection_mm = 27.0        # Archive center-drills-lms-4859 #2, drill chuck.
tap_oal_mm = 53.975              # Archive taps-unc-hand 8-32 oal 2.125 in.
# Hand sheet: stop as soon as the drill is through. Archive #29 has a 118°
# point, so its tip stands (3.4544 / 2) / tan 59° below the underside.
drill_tip_z_mm = -1.038

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "em-half"
name = "1/2 in end mill"
ref = "jig-em-half"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill"
name = "#29 drill"
ref = "jig-drill-29"
[[tools]]
id = "plug"
name = "8-32 plug tap"
ref = "jig-tap-8-32-plug"
[[tools]]
id = "bottoming"
name = "8-32 bottoming tap"
ref = "jig-tap-8-32-bottoming"

[[setups]]
machine_kind = "other"
title = "Saw blanks"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
diagram = { file = "diagrams/end-bracket/saw.svg", alt = "Both bracket blanks from the bar end left after the lever blank" }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "From the 1165 bar end left after the TL-26 lever blank: saw {{process.quantity:d}} × {{process.blank_length_in:.2f}} adjacent blanks, waste side of the line; each ≥{{process.blank_min_length_in:.2f}} long."
instruction_detailed = "From the 1165 bar end left after the TL-26 lever blank: saw {{process.quantity:d}} × {{process.blank_length_in:.2f}} blanks, waste side of the line; each ≥{{process.blank_min_length_in:.2f}} long. Take both from this one bar, next to each other: the vise clamps the pair together, so their as-bought widths must match in the jaws."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Square both ends"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Both blanks flat, 1 in face up, on 1 in parallels against both jaws, one at each jaw end, outboard end ~.2 past the jaw side; then each turned end-for-end in place."
diagram = { file = "diagrams/end-bracket/ends.svg", alt = "Both blanks in the vise, one at each jaw end: outboard ends cleaned to INNER END, then both turned end-for-end and cut to length" }
datum = "Each part's first squared end = its INNER END. Turned: X0 left INNER END; XR = right INNER END."
# Two parts, one at each jaw end: the cutter centre spans the jaw width, both
# overhangs and one cutter diameter; across the 1 in face plus one diameter.
envelope = { x_span_mm = ["{{process.vise_jaw_width_mm}}", "{{process.overhang_mm}}", "{{process.overhang_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.end_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
# The left part, as-bought 1/2 in edges in the jaws, its twin mirrored at the
# right jaw end. Both holds place it alike; the blank length bounds the turned
# part (its first end is only cleaned).
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.blank_width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "twin_part", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04 below parts. Clean up both outboard ends, .02 X steps, ≤ half the allowance: left feeding toward you, right feeding away. Mark INNER END on each."
settings = "jig-em-half-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Turn both end-for-end, raw end ~.2 out. X0 on left INNER END; touch right INNER END, note XR. Measure cutter D; .02 passes: left end feeding toward you to X = −({{cad.length_in:.3f}} + D/2); right end feeding away to X = XR + {{cad.length_in:.3f}} + D/2."
instruction_detailed = "Turn each part end-for-end in place, INNER END inboard, raw end ~.2 past its jaw side. Touch both INNER ENDs from the gap between the parts: X0 on the left part's, then read the right part's as XR. Measure cutter D; .02 passes: left end feeding toward you, last pass X = −({{cad.length_in:.3f}} + D/2); right end feeding away, last pass X = XR + {{cad.length_in:.3f}} + D/2."
settings = "jig-em-half-6061-t6511"
inspection = "Length {{cad.length_min_in:.3f}}–{{cad.length_max_in:.3f}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
instruction = "Each part: mark ROW EDGE on one 1 in side, BAR SIDE (drawing BACK FACE) and KP08 SIDE (drawing FRONT FACE) on the 1/2 in faces; record its W (ROW EDGE to opposite side) mid-length."

[[setups]]
machine_kind = "other"
title = "Drill / tap from BAR SIDE"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Both on edge, BAR SIDE up, ROW EDGE at fixed jaw, INNER END left: left part's INNER END and right part's far end ~.2 past the jaw sides. 1 in parallels pushed against both jaws leave a 1/4 in gap under the hole rows."
datum = "X0 left INNER END; XR = right INNER END; Y0 ROW EDGE (fixed jaw face); +Y toward you."
diagram = { file = "diagrams/end-bracket/bar-side.svg", alt = "Both parts on edge with BAR SIDE up and ROW EDGE at the fixed jaw; section through H1" }
# Holes on both parts and the Y0 touch in the gap between them lie within the
# jaw width plus both overhangs. Longest: a tap (overall length bounds its
# projection) in the drill chuck; shortest: the centre drill.
envelope = { x_span_mm = ["{{process.vise_jaw_width_mm}}", "{{process.overhang_mm}}", "{{process.overhang_mm}}"], y_span_mm = "{{cad.thickness_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.width_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.tap_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.spot_projection_mm}}"] }
# The left part on edge, as-bought 1 in faces in the jaws, its twin at the
# right jaw end.
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.thickness_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.width_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "twin_part", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot H1–H{{cad.hole_count:d}} on both parts (right part at XR + X), cone ~5/32 across. X ±{{cad.station_tol_in:.3f}} ({{cad.station_tol_mm:.2f}} mm); Y {{cad.row_min_in:.3f}}–{{cad.row_max_in:.3f}}."
instruction_detailed = "Y0: ROW EDGE is on the fixed jaw, so touch the jaw face from your side at ~X {{process.y_touch_x_in:g}}, in the gap between the parts, and zero Y there. X0 on the left INNER END; touch the right part's INNER END from the gap and note XR. Spot H1–H{{cad.hole_count:d}} on both parts (right part at XR + X), cone ~5/32 across. X ±{{cad.station_tol_in:.3f}} ({{cad.station_tol_mm:.2f}} mm); Y {{cad.row_min_in:.3f}}–{{cad.row_max_in:.3f}}."
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Hole", "X", "Y"]
rows = "{{cad.hole_rows}}"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill"
sizing = { kind = "band", band_mm = "{{cad.tap_drill_band_mm}}" }
instruction = "H1–H{{cad.hole_count:d}} through on both parts, tip just through; peck .1."
rpm = 3000
feed = "hand"
inspection = "Each part: stations {{cad.hole_stations_mm}} mm ±{{cad.station_tol_mm:.2f}} from its INNER END; row {{cad.row_min_in:.3f}}–{{cad.row_max_in:.3f}} from ROW EDGE."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.hole_1_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.hole_2_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.row_band_mm}}" }]

[[setups.operations]]
speed_kind = "other"
tool = "plug"
sizing = "other"
instruction = "Start H1–H{{cad.hole_count:d}} on both parts. Plug tip not past {{cad.bar_tip_max_in:.3f}} below BAR SIDE."
instruction_detailed = "Tape a flag on the plug tap {{cad.bar_tip_max_in:.3f}} from its tip. Start H1–H{{cad.hole_count:d}} on both parts square from the drill chuck, spindle off, about 3 turns; finish with the T-handle, stopping before the flag reaches BAR SIDE."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "bottoming"
sizing = "other"
instruction = "Finish H1–H{{cad.hole_count:d}} on both parts to tip mark {{cad.bar_tip_min_in:.3f}}–{{cad.bar_tip_max_in:.3f}} below BAR SIDE, measured from the physical tip."
instruction_detailed = "Tape a flag on the bottoming tap {{cad.bar_tip_min_in:.3f}}–{{cad.bar_tip_max_in:.3f}} from its physical tip. Finish H1–H{{cad.hole_count:d}} on both parts until the flag reaches BAR SIDE."
feed = "hand"
inspection = "{{cad.thread}} full thread {{cad.bar_thread_min_in:.3f}}–{{cad.bar_thread_max_in:.3f}} from BAR SIDE."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.bar_thread_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Tap from KP08 SIDE"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Both rolled over in place on the same parallels: KP08 SIDE up, INNER END left, ROW EDGE at moving jaw."
diagram = { file = "diagrams/end-bracket/kp08-side.svg", alt = "Both parts rolled over with KP08 SIDE up and ROW EDGE at the moving jaw; section through H1" }
datum = "Re-find X0 left INNER END and XR right INNER END; Y0 fixed jaw; hole row at Y = W − {{cad.row_in:.3f}}, each part's own W."
# Taps only, over the drilled holes. Tap projection has no record, so the
# shortest tool is bounded by the chuck alone and the deepest point by the
# underside.
envelope = { x_span_mm = ["{{process.vise_jaw_width_mm}}", "{{process.overhang_mm}}", "{{process.overhang_mm}}"], y_span_mm = "{{cad.thickness_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.width_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.tap_oal_mm}}"], shortest_tool_mm = "{{process.drill_chuck_gauge_mm}}" }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.thickness_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.width_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.overhang_mm}}", "rest"], jaw_offset = "balanced", balance = "twin_part", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "other"
tool = "plug"
sizing = "other"
instruction = "Start H1–H{{cad.hole_count:d}} on both parts. Plug tip not past {{cad.kp08_tip_max_in:.3f}} below KP08 SIDE."
instruction_detailed = "Tape a flag on the plug tap {{cad.kp08_tip_max_in:.3f}} from its tip. Start H1–H{{cad.hole_count:d}} on both parts square from the drill chuck, spindle off, about 3 turns; finish with the T-handle, stopping before the flag reaches KP08 SIDE."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "bottoming"
sizing = "other"
instruction = "Finish H1–H{{cad.hole_count:d}} on both parts to tip mark {{cad.kp08_tip_min_in:.3f}}–{{cad.kp08_tip_max_in:.3f}} below KP08 SIDE, from the physical tip."
instruction_detailed = "Flag the bottoming tap {{cad.kp08_tip_min_in:.3f}}–{{cad.kp08_tip_max_in:.3f}} from its physical tip. Finish H1–H{{cad.hole_count:d}} on both parts until the flag reaches KP08 SIDE."
feed = "hand"
inspection = "Full thread {{cad.kp08_thread_min_in:.3f}}–{{cad.kp08_thread_max_in:.3f}} from KP08 SIDE."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.kp08_thread_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Deburr / inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/end-bracket/inspect.svg", alt = "Finished bracket: hole stations from INNER END, row from ROW EDGE and both thread zones" }
envelope = "other"
vise_hold = "other"

[[setups.operations]]
instruction = "Edges and hole ends R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; do not countersink threads. From each face run a #8-32 socket screw in by hand to its own full-thread depth only, never on into the other face's thread: caliper the screw's length L first, then stop with L − {{cad.bar_thread_min_in:.3f}} still showing above BAR SIDE, L − {{cad.kp08_thread_min_in:.3f}} above KP08 SIDE."
inspection = "Section {{cad.thickness_min_in:.3f}}–{{cad.thickness_max_in:.3f}} × {{cad.width_min_in:.3f}}–{{cad.width_max_in:.3f}} as bought; screws turn in by hand to that depth (length showing on calipers)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.bar_thread_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.kp08_thread_band_mm}}" }]
