# Column clamp back MHA-SH-02 (qty 3), routed for the CNC mill (owner
# ruling 2026-11-20, Pedro, relayed by Main). Each half from one sawn blank of
# 3/4 in square 1018 about 2.0 long, one blank per program run: faced and
# sized to the drawing (the 1.890 width, the .630 height) and to the .610
# pre-face depth (the drawing's .590 plus the .020 grip offset, SEE NOTE 1),
# both #29 tap drills drilled through from one zero and tapped 8-32 by hand
# under the spring tap guide; stations from the near side N, heights from
# the bottom face B. Then the pair: each back bolted to its front
# (MHA-SH-01, drilled by its own traveler) with their own #8-32 screws,
# gripped on the two outside
# faces with a 1-2-3 block between the screw heads, and the full Ø1.008 bore
# interpolated on the split line with the 1/2 in carbide end mill, gauged
# with the telescoping gauges; unbolted, .020 faced off the back's mating
# face (.610 -> .590), the drawing's gap between the halves. This traveler
# owns the pair (Main, 2026-11-20).
#
# Route: saw; Setups 2-3 upright on the 1 in parallels: face the first end
# (CB01), turn over, face to the width (CB02); Setups 4-7 lying on the 1 in
# and 1/2 in parallels stacked under each jaw (1.5 in): face B (CB03), B
# down, the top to the height (CB04), jaws on B and the top, skim the mating
# face (CB05), mating face down, face the outside face to the pre-face depth,
# spot and drill both tap drills (CB06), tap both under the tap guide (CB07,
# CB08); bench deburr; the pair bore (CB09, CB10 to open it if small); the
# face-off (CB11); deburr and inspect; black enamel: the owner's Rust-Oleum
# Flat Black 376855 (owner 2026-11-21, answered in person: "rust-oleum Flat
# Black376855") over the maker's Clean Metal Primer, by Rust-Oleum's
# technical data SRT-01 (consumables.black-alkyd-enamel cites it).
#
# Tapping: FluidNC cannot rigid-tap (owner, Pedro, 2026-11-17). The tap is
# guided by the Fisher spring tap guide in the 1/2 in R8 collet (owner, Pedro,
# answered in person 2026-11-21, cnc rulings record: "use
# https://littlemachineshop.com/products/tap-guide-fisher?variant=45472915226805
# on r8 0.5 collet"; cad/config/shop-equipment/ tools.tap-guide-fisher, to
# buy, owner ruling 2026-11-22): its spring-loaded point seats in the T-handle
# wrench's centre hole and follows the tap down 1/2 in, spindle off; the
# operator jogs Z only to push the point home again and to read the depth.
# FluidNC refuses jogs in the Hold an M0 leaves
# (wiki.fluidnc.com/en/features/single_block_mode), so each tap stop is its
# own file ending M30 over its hole (CB07, CB08).
#
# Zeroing: the touch probe has no holder (its 6 mm R8 collet is off the buy
# list, cad/config/shop-equipment/ gauges.touch-probe-diy0-tp05), so every
# X/Y zero is the owned .200 in edge finder at 900 rpm (logbook 2026-11-04,
# tools.edge-finder) and every Z zero the end mill on a .002 feeler leaf.
# The pair's Y0, the split line, is the fixed jaw's face less the back's
# miked pre-face depth (Main, 2026-11-20): the back's outside face is against
# that jaw.
#
# NC (cam:sh_column_clamp_back, cad/process/sh_column_clamp_back/cam.py):
# CB01_first_end, CB02_length, CB03_bottom, CB04_height, CB05_mating,
# CB06_back_drill, CB07_tap_1, CB08_tap_2, CB09_pair_bore, CB10_bore_open,
# CB11_face_off. Program names, the [parameters] and the milling_cuts names
# are a contract with that recipe. Tool numbers are the places in the tools
# list among the mill's tools: T1 1/2 in end mill, T2 centre drill, T3 #29,
# T4 tap guide (the tap is turned by hand).
title = "Column clamp back"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/4 in square (drawing: {{cad.material_spec}})"
stock = "{{process.blank_section_in:fraction}} in square bar; {{process.quantity:d}} × {{process.blank_length_min_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.width_min_in:.3dot}}–{{cad.width_max_in:.3dot}} wide (N to the far end), {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}} high (B to the top), {{cad.depth_min_in:.3dot}}–{{cad.depth_max_in:.3dot}} deep (mating face to outside face; {{cad.pre_face_depth_min_in:.3dot}}–{{cad.pre_face_depth_max_in:.3dot}} until the face-off). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) and touch off G54 at the start of every mill setup: a FluidNC reset loses home (logbook 2026-11-06). After any controller reset, stall or E-stop, home and touch off again before Cycle Start. Every file is proved in air on the first blank. Setup 9 bores each back with a front from MHA-SH-01's traveler; keep each back with its front from there on (scribe the pair number on both)."
shop = "../shop"
stock_refs = ["1018-square-3-4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/sh_column_clamp_back/features.toml"
adapter = "clamp_half"
part = "sh-column-clamp-back"

[parameters]
quantity = 3
# The bar (stock.1018-square-3-4) and the blank the programs are posted for:
# the owner's "about 2.0" sawn length, ±.05 for the saw.
blank_section_in = 0.75
blank_section_mm = 19.05         # blank_section_in × 25.4: the vise holds' and cam.py's section.
blank_length_min_in = 1.95
blank_length_max_in = 2.05
kerf_in = 0.125
# The other half's outside face to the bore axis (MHA-SH-01's depth band,
# .680-.690): the pair's front half.
other_half_depth_min_mm = 17.272
other_half_depth_max_mm = 17.526
# Skims (author's choice, .020 in each, enough to clean a sawn end or the
# bar's cold-finished face): the first end, the bottom face and the mating
# face. The other end, the top and the outside face are faced to size from
# them in equal levels no deeper than face_step_max_mm (.050 in).
end_skim_mm = 0.508
bottom_skim_mm = 0.508
mating_skim_mm = 0.508
face_step_max_mm = 1.27
# Facing: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2) on the
# owner's measured face setting, shop settings.em-half-carbide-1018-3439-face
# (dechatter session of 2026-11-23, #3439: stable to 6.4 mm wide at up to
# 1.27 mm deep, 2420-2490 rpm in the cut; cad/config/shop-equipment/
# measured-cuts.toml): every face level no deeper than face_step_max_mm and
# equal passes across the face no wider than that record's 6.4 mm, the
# first with the cutter over the edge so it too takes one pass's width
# (cam.py checks both). The 3/4 in faces take four passes of 4.89 mm (19.05
# + the 0.5 overhang; three would need 6.52, over the limit), the .630 faces
# three of 5.50 mm (two would need 8.25). Every measured pass was
# conventional and the faces zigzag (owner ruling 2026-11-16), so every
# other pass climbs: that half is not measured.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 6.4
# The grip offset CB11 faces off the mating face in one level: the drawing's
# .020 (MHA-SH-02 NOTE 1), restated here so the measured envelope can read
# the cut's depth; cam.py checks it equals the export's grip offset.
grip_offset_mm = 0.508
# Tap drills: spot Ø.120 with the #2 centre drill, under the #29 (no chamfer
# at the mouth; the tap's start is the drill's), then the #29 through,
# pecked .120 (under one diameter) with full retracts (L/D 4.5), its full
# diameter 1.0 mm past the mating face into the gap between the parallels.
spot_dia_mm = 3.048
peck_mm = 3.048
drill_past_mm = 1.0
# The #29's point 1.0 + its 118° point (1.038) below the parallels' top;
# cam.py checks it.
drill_tip_height_mm = -2.038
# Speeds and feeds of the holes, authored in the operations: LittleMachineShop
# "Cutting Speeds", Drilling & Reaming, Plain carbon steels 1006-1026 (read
# 2026-11-20): drilling 60-100 ft/min; AutoDrill "Suggested drilling feed
# rates" (read 2026-11-20), row Stl, Carbon: 1/16 in .001, 1/8 in .003 in/rev,
# a size between two columns taking the lower one's feed. Centre drill:
# 1800 rpm (88 ft/min on its 3/16 body) × .001 (its 5/64 pilot) = 1.8 in/min.
# #29 (.136): 1700 rpm (61 ft/min) × .003 = 5.1 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
drill_feed_per_min_mm = 129.54
# Tapping 8-32 through: the plug tap's point stops this far below the
# outside face, a standard #8 hand tap's .750 thread length, so its shank
# stays out of the hole; its 5/32 chamfer then leaves partial threads only
# in the last .016 at the mating face, which the .020 face-off removes.
tap_point_depth_mm = 19.05
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick): upright, a 1 in parallel against each jaw; lying, the set's 1 in
# and 1/2 in parallels stacked against each jaw (1.5 in), as the sub-plate
# plan stacks them, so every lying face stands above the jaw tops.
parallel_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: jaw height less the parallels (upright) or the stacks (lying).
upright_grip_mm = 19.5453
lying_grip_mm = 6.8453
# Each part centred on the jaws: its ends (jaw width − its length along the
# jaws)/2 in from the jaw sides, upright the section, lying the width.
vise_upright_inset_mm = -69.81
vise_lying_inset_mm = -55.33
# Upright, the tallest blank less the first-end skim stands above the
# parallels in CB02; cam.py checks it.
upright_top_max_mm = 51.562
# The bolted pair (Setup 9; the pair picture): the MHA-SH-VN-53 clamp
# screws, McMaster 90280A201 #8-32 × 1-1/4 narrow fillister
# (sh_vn_clamp_screw_spec.FILLISTER_SIZE: head Ø.270 × .156), the
# assembly's own pair; one of the owner's two 1-2-3 blocks (shop
# fixtures.blocks-123), its 1 in face between the heads, 2 in tall on the
# vise bed, 3 in across the jaws; a single 1 in parallel under each half,
# the back's stopped .625 from the bore axis along the jaws (it would
# otherwise run under the bore: the back is only .610 deep).
screw_head_dia_mm = 6.858
screw_head_height_mm = 3.9624
screw_length_mm = 31.75
spacer_block_width_mm = 25.4
spacer_block_height_mm = 50.8
spacer_block_length_mm = 76.2
back_parallel_end_mm = 15.875
# Across the jaws in the pair: the front's depth, the back's pre-face depth
# and the block's 3 in. cam.py checks it.
pair_jaw_span_mm = 109.093
# The pair bore (CB09): a climbing helix at the rough radius, .010 in under
# the finish on the radius, .020 in down per turn, from the pair's top to
# 1.0 mm past the underside (into the gap between the parallels); a finish
# and a spring turn at full depth. CB10 opens the finish .002 in on the
# diameter (.001 on the radius) when the gauge reads it small.
bore_finish_stock_mm = 0.254
helix_pitch_mm = 0.508
bore_past_mm = 1.0
bore_tip_height_mm = -1.0
bore_open_mm = 0.0508
bore_open_radial_mm = 0.0254
# The end mill's centre runs the helix at the chart setting's feed scaled to
# its centre: the edge, at the rough radius plus the cutter's, carries the
# chip load of shop settings.endmill-carbide-3fl-1-2-1018-cf (565.4 ×
# 6.198/12.548). The bore is not inside a measured envelope (a full-width
# helix and a 17 mm deep finish wall), so it stays on that chart setting.
# cam.py checks it.
bore_feed_per_min_mm = 279.27
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# The 1/2 in end mill set at least 1.25 in out of its collet for the bore,
# so the collet's face clears the 1-2-3 block and the fixed jaw with the
# cutter 1.0 mm below the pair (cam.py checks it).
bore_mill_projection_min_mm = 31.75
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# for every face (Setups 2-7 and 10) (owner, Pedro, 2026-11-24: "28.45"),
# the longer end of the stick-out the measured face setting allows
# (cad/config/shop-equipment/measured-cuts.toml: 27.94 to 28.45 mm). Setup
# 10 resets it
# from the bore's longer set.
half_mill_projection_mm = 28.45
# ASME B94.11M jobber length, overall, of the #2 combined drill and
# countersink, 1-7/8 in. Bounded by its whole length below the chuck.
centre_drill_oal_mm = 47.625
# Tapping under the spring tap guide (tools.tap-guide-fisher): the guide and
# the tap in its wrench together reach at most tap_stack_max_mm below the
# collet face, the spindle-to-table maximum (shop machines.pm-30mv, 431.8)
# less 25.0 to bring the point down onto the wrench (the shop's tool-change
# clearance), the vise bed, the stacks, the setup's tallest stock (the
# blank's section) and the collet gauge, rounded down to .01 in; cam.py
# checks it. It is also the guide-and-tap stack's declared reach in the
# capacity check. The guide is 3 1/8 in (79.375) overall, its sellers' size
# and the most it can stand below the collet face; the tap's reach in its
# wrench is not on record, so the traveler stops before the first tap file
# unless the tap, point to the wrench's centre hole, is at most
# tap_wrench_reach_max_mm: 270.002 less 79.375, 190.627, rounded down to
# .01 in (cam.py checks it).
tap_stack_max_mm = 270.002
tap_wrench_reach_max_mm = 190.5

[[tools]]
id = "em-half"
name = "1/2 in carbide end mill"
ref = "endmill-carbide-3fl-1-2"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill-29"
name = "#29 drill"
ref = "jig-drill-29"
[[tools]]
id = "tap-guide"
name = "Fisher spring tap guide"
ref = "tap-guide-fisher"
[[tools]]
id = "tap-8-32"
name = "8-32 plug tap"
ref = "jig-tap-8-32-plug"
[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "files"
name = "Files"
