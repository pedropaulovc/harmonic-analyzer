# Cone tip end screw MHA-DT-39, one off: a bought McMaster-Carr 91794A559
# (18-8 stainless, 1/4-28 x 3/4 slotted fillister head) with the one added
# operation the sheet asks for, a #52 hole drilled .12 deep at full diameter,
# concentric in its threaded end (owner decision C1, PR #1992; owner ruling
# 2026-11-24, fit audit question 11: drilled #52, no longer reamed .0630).
# On the manual PM-1127VF-LB (owner ruling 2026-11-21: turned parts get
# lathe travelers, no NC). Route chosen for speed: one chucking of the screw.
# The 6 in 4-jaw (on hand, cad/config/shop-equipment/fixtures.toml
# chuck-4jaw-6) closes no smaller than Ø.2865 (owner 2026-11-24), over the
# shank's .2435-.2489 crests (#3496), so Setup 1 makes a split bush in the
# 4-jaw from the 1/2 in brass bar on hand: faced, drilled E (.250) through and
# slit (delegated ruling 2026-11-27 (Main), precedent: the transgear pin's
# split bush, #3494; owner review #2144 (D57)). Its bore need not run true:
# Setup 2 dials the screw, not the bush. Setup 2: the screw's shank in the
# bush, the head behind it inside the jaws' opening, the bush on the jaws'
# front step with its slit between two jaws; the thread crests dialled in
# with the DTI. The hole's wall to the thread's minimum minor is .0659 at
# a centred hole at the drilled row's largest .0675 against the printed
# .065 MIN, so the hole may sit only .0009 off the
# thread's axis: the crests are dialled to .0005 TIR (an offset of .00025)
# before anything cuts. The threaded end is left as supplied (the sheet
# keeps all purchased geometry). Spot, drill #52 by the quill scale, check
# the depth with the drill's own shank before unchucking. Bench: break the
# hole's mouth, clean. The 4-jaw's jaw-step depth and the tailstock chuck
# that carries the drills are not on record (#3754).
#
# Bought, not stock (owner ruling 2026-11-20, #2368, as MHA-DT-09): no stock
# row; the stock BOM reads the registry SKU. The brass is the bush's. Every
# tool but the junior hacksaw that slits the bush is on hand: the #52
# drill is in the owned 115-piece index (tools-drills.toml drill-52). The
# .0630 reamer and its Class ZZ pins (reamer-0630, zz-pins-0630-0635) are no
# longer needed.
title = "Cone Tip End Screw"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "18-8 stainless steel, McMaster-Carr 91794A559 (1/4-28 x 3/4 in slotted fillister head screw), as supplied"
stock = "Lot: {{process.quantity:d}} screw, bought: McMaster-Carr 91794A559, used as supplied but for the added hole. For the split bush that holds it: a {{process.bush_length_in:.2dot}} in piece of the Ø{{process.bush_dia_in:.2dot}} C360 brass bar on hand."
stock_refs = ["c360-round-1-2"]  # the split bush's brass (#3496); the screw is bought
shop = "../shop"
material_key = "lathe-18-8"

# The shop's standing page carries what every traveler shares (units, lathe
# speeds, coolant); This job says what only this screw needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["As bought", "The screw's thread, head and slot are left as bought."],
]

[cad]
file = "../../out/features/dt_cone_tip_end_screw/features.toml"
adapter = "drilled_block"
part = "dt-cone-tip-end-screw"

[parameters]
quantity = 1
# The bought screw is the blank (stock_fit: envelope X, Y, Z): its head
# Ø.414 across, and the head's .237 plus the .75 shank along its axis.
blank_x_in = 0.414
blank_y_in = 0.987
blank_z_in = 0.414
# How far the threaded end stands out of the bush's front face: room for the
# DTI's tip on the crests and for the drill chuck, the head and .35 of the
# shank behind it.
stickout_in = 0.4
# The split bush (#3496): a piece of the 1/2 in C360 bar on hand, held on
# its whole length on the 4-jaw's front step, its face at the jaw fronts,
# drilled E (.250) through, then slit along one side. The 4-jaw grips its
# Ø.50, inside the chuck's measured range; it closes on the crests. .30 long:
# the screw's .75 shank less the .40 out leaves .35, and .05 of it stays
# clear between the bush and the head.
bush_dia_in = 0.5
bush_dia_mm = 12.7
bush_length_in = 0.3
bush_length_mm = 7.62
# The #52 drill's quill reading, from the lips touching the spot's rim: its
# full diameter then stands about .007 above the face (the Ø.04 spot under
# the drill's 118-degree point), so .125 on the scale leaves about .118 at
# full diameter, inside the sheet's .11–.13.
drill_depth_mm = 3.175

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-52"
name = "#52 drill"
ref = "drill-52"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "drill-e"
name = "Letter E drill (.250)"
ref = "drill-e"

[[tools]]
id = "hacksaw"
name = "Junior hacksaw, 32 TPI"
ref = "junior-hacksaw"
status = "to_order"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "Split bush in the 4-jaw: face, drill, slit"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "A {{process.bush_length_in:.2dot}} in piece sawn off the Ø{{process.bush_dia_in:.2dot}} brass bar with the metal-cutting saw, in the 6 in 4-jaw on the jaws' front step over its whole length, its face at the jaw fronts, centred by eye on the chuck's face rings: it need not run true, as Setup 2 dials the screw. The screw's .249 crests are under the 4-jaw's least grip (Ø.2865): this bush holds it in Setup 2."
datum = "None read: the hole is drilled from the tailstock right through the piece."
# Independent jaws set by hand (shop workholding.chuck-4jaw-6).
lathe_hold = "other"
diagram = { file = "diagrams/bush.svg", alt = "To scale: the 1/2 in brass piece in the 4-jaw on the front step, its face at the jaw fronts; the AR tool facing it; hatched, the E hole drilled right through." }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the piece's end square in a light skim."
rpm = 1200
feed = "by hand, a light skim, dry"
cut_diameter_mm = "{{process.bush_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 1 centre drill, only the point's cone, about Ø.12 across: under the E drill, so the drill removes it."
rpm = 2000
feed = "tailstock quill by hand"
cut_diameter_mm = 3.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-e"
drilling = "twist_drill"
sizing = "other"
instruction = "Drill E right through the piece from the tailstock in one steady feed (it is only 1.2 diameters deep), backing out once if chips pack."
diagram = { file = "diagrams/bush-drill.svg", alt = "To scale: the E drill from the tailstock right through the brass piece, into the chuck's bore." }
rpm = 1200
feed = "tailstock quill by hand, light and steady, dry"
cut_diameter_mm = 6.35
hole_depth_mm = "{{process.bush_length_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "other"
tool = "hacksaw"
drilling = "none"
sizing = "other"
instruction = "Take the piece out. In the bench vise, saw one slit along its whole length with the junior hacksaw, through one wall into the hole. Break the slit's edges and the hole's mouths with the smooth file. Wipe the hole clean."
inspection = "The screw's shank slides into the bush by hand, the thread catching nowhere."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "4-jaw on the split bush: dial in, spot and drill the end hole"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "The screw's threaded shank in the split bush, the threaded end {{process.stickout_in:.2dot}} in out of the bush's front face and the head behind the bush; the bush in the 6 in 4-jaw on the jaws' front step, its face at the jaw fronts and its slit midway between two jaws, the head inside the jaws' opening, clear of them. The jaws never touch the thread. Jaws snug, then dialled in (Op 50) and tightened in turn."
datum = "The threaded end face as bought: the hole's depth is measured from it (the tailstock quill scale zeroed on it)."
# Independent jaws dialled in by hand (shop workholding.chuck-4jaw-6).
lathe_hold = "other"
diagram = { file = "diagrams/lathe.svg", alt = "Op 70, to scale: the bought screw in the split bush, the bush in the 4-jaw on the jaws' front step, the head behind it, the threaded end .40 out; the #52 drill from the tailstock, its full diameter .118 deep in the end." }

[[setups.operations]]
cut_kind = "other"
instruction = "Dial in: lay the .100 gauge block flat on the thread crests across the axis, its edge flush with the screw's end (its .35 width bridges about ten pitches, so the thread form cannot move the needle), the DTI's tip on its top; turn the chuck slowly by hand, a fingertip keeping the block from turning, and bring the jaws in a pair at a time until the needle moves .0005 or less in a turn. Check again after the last jaw is tightened."
inspection = "Thread crests run out .0005 or less, DTI on the .100 gauge block. The hole then sits within .00025 of the thread's axis: the wall has .0009 to spare against its .065 MIN."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre of the end from the tailstock with the No. 1 centre drill, only the point's cone, about Ø.04 across: under the #52 drill, so the drill removes it and the mouth keeps no countersink."
settings = "lathe-centre-18-8"
cut_diameter_mm = 1.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-52"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #52 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{process.drill_depth_mm:in.3dot}}, backing fully out to clear chips every .06 in (once its own diameter), then withdraw."
settings = "lathe-drill-52-18-8"
cut_diameter_mm = 1.6129
hole_depth_mm = "{{process.drill_depth_mm}}"
peck = { step_mm = 1.6129, retract = "full" }
peck_reason = "18-8 makes stringy chips that pack in a .0635 drill's flutes and snap it: backing fully out every .06 clears them and lets fresh oil in"

[[setups.operations]]
cut_kind = "other"
instruction = "Still chucked, spindle stopped, the tailstock left locked and only the quill wound back, the hole blown clean: take the #52 drill from the chuck and push its shank end into the hole by hand to the bottom (the square end stops where the full diameter ends). Caliper the drill's length; with it at the bottom, read how far it stands out of the end face with the calipers' depth rod; its length less that is the depth."
inspection = "The #52 shank enters to the bottom; {{cad.end_hole_depth_min_in:.2dot}}–{{cad.end_hole_depth_max_in:.2dot}} deep at full diameter."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.end_hole_depth_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Shallow (under {{cad.end_hole_depth_min_in:.2dot}}): blow the chips out, oil, and run the same drill back in, spindle running, on the quill zero (the tailstock still locked), until the scale reads .130; then check again as the operation before."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Deep (over {{cad.end_hole_depth_max_in:.2dot}}), or still shallow after the second pass: scrapped, not reworked; make another from a new screw."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: break the hole's mouth, clean"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished screw: the bought 1/4-28 x 3/4 fillister screw with the #52 hole drilled .12 deep in its threaded end, the mouth broken." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break the hole's mouth, a {{cad.chamfer_max_in:.3dot}} max chamfer, with a twist of the deburring set's countersink by hand, without touching the end face's flat (it bears on the MHA-DT-38 bushing)."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: as supplied, passivated): wash off the cutting oil and dry the screw; nothing else is applied."
feed = "hand"
