# Cone tip end screw MHA-DT-39, one off: a bought McMaster-Carr 91794A559
# (18-8 stainless, 1/4-28 x 3/4 slotted fillister head) with the one added
# operation the sheet asks for, a Ø.0630 +.0005/.0000 hole reamed .12 deep,
# concentric in its threaded end (owner decision C1, PR #1992). On the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). Route chosen for speed: one chucking.
# Setup 1: the 6 in 4-jaw (on hand, cad/config/shop-equipment/fixtures.toml
# chuck-4jaw-6) on the threaded shank over a brass shim wrap, on the jaws'
# front step only, the head behind it clear of the jaws; the thread crests
# dialled in with the DTI. The hole's wall to the thread's minimum minor is
# .0679 at a centred hole against the printed .067 MIN, so the hole may sit
# only .0009 off the thread's axis: the crests are dialled to .0005 TIR (an
# offset of .00025) before anything cuts. The threaded end is left as
# supplied (the sheet keeps all purchased geometry). Spot, drill #53 .15
# deep, ream .0630 to .12 by the quill scale, check depth and size with the
# plug gauges before unchucking. Bench: break the hole's mouth, clean.
#
# Bought, not stock (owner ruling 2026-11-20, #2368, as MHA-DT-09): no stock
# row; the stock BOM reads the registry SKU. Not on hand (cad/config/
# shop-equipment/, to order): the .0630 reamer (tools-reamers-taps.toml
# reamer-0630) and the .0630 GO / .0635 NO-GO Class X plug gauge pair
# (gauges.toml plug-gauges-0630-0635).
title = "Cone Tip End Screw"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "18-8 stainless steel, McMaster-Carr 91794A559 (1/4-28 x 3/4 in slotted fillister head screw), as supplied"
stock = "Lot: {{process.quantity:d}} screw, bought: McMaster-Carr 91794A559, used as supplied but for the added hole."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); cutting oil on the stainless. To order (not on hand): the .0630 chucking reamer and the .0630 GO / .0635 NO-GO plug gauge pair. The screw's thread, head and slot are left as bought."
shop = "../shop"
material_key = "lathe-18-8"

[cad]
file = "../../out/features/dt_cone_tip_end_screw/features.toml"
adapter = "drilled_block"
part = "dt-cone-tip-end-screw"

[parameters]
quantity = 1
# The bought screw is the blank (stock_fit: envelope X, Y, Z): its head
# Ø.414 across, and the head's .237 plus the .75 shank along its axis.
blank_x_in = 0.414
blank_y_in = 0.987
blank_z_in = 0.414
# How far the threaded end stands out of the jaws' front step: room for the
# DTI's tip on the crests and for the drill chuck, the head and .35 of the
# shank behind it.
stickout_in = 0.4
# The #53 drill's full diameter goes .03 past the reamed depth, so the
# reamer's end never meets the drill point's cone.
drill_depth_mm = 3.81

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-53"
name = "#53 drill"
ref = "drill-53"

[[tools]]
id = "reamer"
name = ".0630 chucking reamer"
ref = "reamer-0630"
status = "to_order"

[[tools]]
id = "plugs"
name = "Plug gauges .0630 GO, .0635 NO-GO"
ref = "plug-gauges-0630-0635"
status = "to_order"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "4-jaw on the thread: dial in, spot, drill and ream the end hole"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "6 in 4-jaw on the threaded shank over a wrap of brass shim (it keeps the jaws off the thread), on the jaws' front step only: the head sits behind that step, clear of the jaws, and the threaded end stands {{process.stickout_in:.2dot}} in out of the jaw fronts. Jaws snug, then dialled in (Op 10) and tightened in turn."
datum = "The threaded end face as bought: the hole's depth is measured from it (the tailstock quill scale zeroed on it)."
lathe_hold = "other"
diagram = { file = "diagrams/lathe.svg", alt = "The bought screw in the 4-jaw on the jaws' front step over brass shim, the head behind the step clear of the jaws, the threaded end .40 out: the crests dialled in, the end hole spotted, drilled #53 and reamed .0630 from the tailstock." }

[[setups.operations]]
cut_kind = "other"
instruction = "Dial in: lay the .100 gauge block flat on the thread crests across the axis, its edge flush with the screw's end (its .35 width bridges about ten pitches, so the thread form cannot move the needle), the DTI's tip on its top; turn the chuck slowly by hand, a fingertip keeping the block from turning, and bring the jaws in a pair at a time until the needle moves .0005 or less in a turn. Check again after the last jaw is tightened."
inspection = "Thread crests run out .0005 or less, DTI on the .100 gauge block. The hole then sits within .00025 of the thread's axis: the wall has .0009 to spare against its .067 MIN."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre of the end from the tailstock with the No. 1 centre drill, only the point's cone, about Ø.04 across: under the #53 drill, so the drill removes it and the mouth keeps no countersink."
settings = "lathe-centre-18-8"
cut_diameter_mm = 1.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-53"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #53 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill until the scale reads {{process.drill_depth_mm:in.2dot}}, backing fully out to clear chips every .06 in (once its own diameter). It leaves the reamer about .0018 a side."
settings = "lathe-drill-53-18-8"
cut_diameter_mm = 1.5113
hole_depth_mm = "{{process.drill_depth_mm}}"
peck = { step_mm = 1.5113, retract = "full" }
peck_reason = "18-8 makes stringy chips that pack in a .0595 drill's flutes and snap it: backing fully out every .06 clears them and lets fresh oil in"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.end_hole_dia_band_mm}}" }
instruction = "Ream .0630 from the tailstock: spindle running, feed the reamer in until its end chamfer just meets the drilled hole's mouth and zero the quill scale there; ream until the scale reads {{cad.end_hole_depth_in:.2dot}}, then withdraw with the spindle still running."
settings = "lathe-ream-0630-18-8"
cut_diameter_mm = "{{cad.end_hole_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
instruction = "Still chucked, spindle stopped, the tailstock left locked and only the quill wound back, the hole blown clean: the {{cad.end_hole_dia_min_in:.4dot}} GO plug enters to the bottom and the {{cad.end_hole_dia_max_in:.4dot}} NO-GO plug does not enter. With the GO plug at the bottom, read how far it stands out of the end face with the calipers' depth rod; the plug's miked length less that is the depth."
inspection = "Hole Ø{{cad.end_hole_dia_min_in:.4dot}}–{{cad.end_hole_dia_max_in:.4dot}}, {{cad.end_hole_depth_min_in:.2dot}}–{{cad.end_hole_depth_max_in:.2dot}} deep at full diameter."
gauge_checks = [{ gauge = "plug-gauges-0630-0635", band_mm = "{{cad.end_hole_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.end_hole_depth_band_mm}}" }]
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Shallow in Op 50 (under {{cad.end_hole_depth_min_in:.2dot}}), or the GO plug not entering: run the reamer back in, spindle running, on Op 40's quill zero (the tailstock still locked), until the scale reads .125; then repeat Op 50."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
instruction = "Deep (over {{cad.end_hole_depth_max_in:.2dot}}), still shallow or tight after Op 60, or the NO-GO plug entering: scrapped, not reworked; make another from a new screw."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: break the hole's mouth, clean"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished screw: the bought 1/4-28 x 3/4 fillister screw with the Ø.0630 hole reamed .12 deep in its threaded end, the mouth broken." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Break the hole's mouth, a {{cad.chamfer_max_in:.3dot}} max chamfer, with a twist of the deburring set's countersink by hand, without touching the end face's flat (it bears on the MHA-DT-38 bushing)."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: as supplied, passivated): wash off the cutting oil and dry the screw; nothing else is applied."
feed = "hand"
