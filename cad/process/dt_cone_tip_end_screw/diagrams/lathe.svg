<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Section through the screw's axis, about 300 px to the inch: the head Ø.414 x .237, the 1/4-28 shank .75 long, .40 of it out of the jaws' front step. Styles: prechips.palette. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1: the bought screw in the 4-jaw, on the jaws' front step over brass shim; the end hole drilled #52 from the tailstock</text>
  <rect class="fixture-vise" x="40" y="60" width="90" height="280"/>
  <polygon class="clamp" points="130,70 240,70 240,100 330,100 330,159 240,159 240,125 130,125"/>
  <polygon class="clamp" points="130,330 240,330 240,300 330,300 330,241 240,241 240,275 130,275"/>
  <rect class="fixture-support" x="240" y="159" width="90" height="3"/>
  <rect class="fixture-support" x="240" y="238" width="90" height="3"/>
  <rect class="part-kept" x="154" y="138" width="71" height="124"/>
  <rect class="part-threads" x="225" y="162" width="225" height="76"/>
  <rect class="part-removed" x="414" y="190" width="36" height="20"/>
  <polyline class="hidden" points="450,191 405,191 399,200 405,209 450,209"/>
  <line class="centre-line" x1="140" y1="200" x2="700" y2="200"/>
  <line class="active-face" x1="450" y1="162" x2="450" y2="238"/>
  <rect class="cutter" x="472" y="194" width="150" height="12"/>
  <rect class="fixture-support" x="345" y="132" width="105" height="30"/>
  <line class="leader" x1="398" y1="132" x2="430" y2="76"/>
  <text class="label" x="434" y="60">.100 gauge block across the crests,</text>
  <text class="label" x="434" y="76">the DTI's tip on it: .0005 TIR max</text>
  <line class="leader" x1="190" y1="262" x2="190" y2="372"/>
  <text class="label" x="70" y="388">head behind the step, clear of the jaws</text>
  <line class="leader" x1="285" y1="241" x2="320" y2="364"/>
  <text class="label" x="300" y="380">brass shim on the thread, front step only</text>
  <line class="leader" x1="432" y1="210" x2="470" y2="262"/>
  <text class="label" x="474" y="268">#52 drilled {{cad.end_hole_depth_min_in:.2dot}}–{{cad.end_hole_depth_max_in:.2dot}} deep</text>
  <line class="leader" x1="450" y1="160" x2="520" y2="140"/>
  <text class="label" x="524" y="138">end face as bought: quill scale zero</text>
  <text class="label" x="630" y="190">#52 drill</text>
  <line class="dims" x1="330" y1="250" x2="450" y2="250"/>
  <line class="dims" x1="330" y1="242" x2="330" y2="258"/>
  <line class="dims" x1="450" y1="240" x2="450" y2="258"/>
  <text class="label" x="350" y="270">.40 out of the jaws</text>
</svg>
