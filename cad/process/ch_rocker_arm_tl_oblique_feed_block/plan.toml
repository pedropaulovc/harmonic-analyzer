beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = [0, "{{process.jaw_grip_mm}}"], section_mm = { x = "{{cad.length_mm}}", y = "{{cad.height_mm}}" } }
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.height_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.blank_length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.y_length_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.blank_length_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_x_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Square SPINDLE END to the table; face the up end just clean (≤{{process.cleanup_in:.2dot}}). Mark it ROW SIDE."
milling_cuts = [{ name = "ROW SIDE clean-up", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 0.508, radial_woc_mm = 12.7, stations_mm = "{{cad.blank_length_mm}}" }]
instruction_detailed = "Stand the blank on a sawn end, SEAT and TOP in the jaws: it stands about 3.6 tall, so take light passes. Before tightening, stand the combination square on the table against SPINDLE END and push it plumb. Face the up end just clean (≤{{process.cleanup_in:.2dot}}) and mark it ROW SIDE: the hole rows measure from it."
settings = "basebar-face-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "ROW SIDE down, SPINDLE END square; face LUG END to overall {{cad.overall_y_min_in:.3dot}}–{{cad.overall_y_max_in:.3dot}}."
# One pass may take all that the clean-up leaves (2.794 mm).
milling_cuts = [{ name = "LUG END to overall", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 2.794, radial_woc_mm = 12.7, stations_mm = "{{cad.blank_length_mm}}" }]
settings = "basebar-face-6061-t6511"
inspection = "Overall {{cad.overall_y_min_in:.3dot}}–{{cad.overall_y_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.overall_y_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Mill the lug notch"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on 1 in parallels, SPINDLE END at fixed jaw; LUG END ~2.0 past the right jaw side; {{cad.height_nominal_in:.2dot}} spacer (e.g. TL-22) at the left jaw end."
datum = "X0 LUG END (touched); Y0 SPINDLE END = fixed jaw face; Z0 TOP."
diagram = { file = "diagrams/feed-block/notch.svg", alt = "LUG END past the right jaw side, spacer at the left: the notch beside the fixed jaw milled out" }
# Stations from LUG END. The lug hangs out past the jaw side, a cantilever
# from it; the finished lug section is taken for every pass (the weakest).
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.overall_y_mm}}"], clamp_mm = ["{{process.notch_overhang_mm}}", "{{cad.overall_y_mm}}"], section_mm = { y = "{{process.lug_width_mm}}", z = "{{cad.height_mm}}" } }
# The cutter works only past the jaw side: along the lug plus a cutter
# diameter either side, across the notch plus one diameter.
envelope = { x_span_mm = ["{{cad.lug_length_mm}}", "{{process.half_cutter_dia_mm}}", "{{process.half_cutter_dia_mm}}"], y_span_mm = ["{{cad.lug_x_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{cad.height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{process.notch_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.length_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.height_mm}}", parallel_height_mm = "{{process.face_parallel_height_mm}}", overhang_mm = ["rest", "{{process.notch_overhang_mm}}"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Notch {{cad.lug_length_in:.2f}} from LUG END × {{cad.lug_x_in:.2dot}} from SPINDLE END, through (tip .04 below SEAT); ≤.10 steps."
# block-em-half-long-6061-t6511: 1250 rpm, 3 in/min (76.2 mm/min); full height.
milling_cuts = [
  { name = "notch steps", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = 2.54, rpm = 1250, feed_mm_min = 76.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "lug and step faces", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.height_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 76.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
]
instruction_detailed = "Touch LUG END and zero X; the fixed jaw face is SPINDLE END, zero Y on it. The notch is everything within {{cad.lug_x_in:.2dot}} of SPINDLE END for {{cad.lug_length_in:.2f}} back from LUG END, through the full height. Cutter tip .04 below SEAT (it is in free air past the jaws), inside the cutter's 1 in of flute. Step in toward the lug face no more than .10 per pass, feeding along X, and take the last .01 off the lug face and the step face with the cutter's side, square; the inside corner keeps the cutter's own sharp corner."
settings = "block-em-half-long-6061-t6511"
inspection = "Lug {{cad.lug_x_min_in:.3dot}}–{{cad.lug_x_max_in:.3dot}} from SPINDLE END; step {{cad.lug_length_min_in:.3f}}–{{cad.lug_length_max_in:.3f}} from LUG END."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.lug_x_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.lug_length_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Holes from TOP"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat, SEAT down on 1 in parallels, SPINDLE END at the fixed jaw, ROW SIDE left, centred."
datum = "X0 ROW SIDE (touched); Y0 SPINDLE END = fixed jaw face; Z0 TOP; +Y toward you."
diagram = { file = "diagrams/feed-block/holes.svg", alt = "Block SEAT down, SPINDLE END at the fixed jaw: pivot seat B and H1-H4 with their counterbores; section through H1 and B" }
# Stations from ROW SIDE; the jaws grip the body, not the notched lug.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.y_length_mm}}"], clamp_mm = [0, "{{process.body_y_mm}}"], section_mm = { y = "{{cad.length_mm}}", z = "{{cad.height_mm}}" } }
# Every hole sits inside the block. Longest: a jobber drill in the chuck;
# shortest: the 5/16 in end mill in its collet. The tap tip runs deepest.
envelope = { x_span_mm = "{{cad.y_length_mm}}", y_span_mm = "{{cad.length_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{cad.height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{process.tap_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.length_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.height_mm}}", parallel_height_mm = "{{process.face_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_y_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot B and H1–H4 from the table. X, Y ±{{cad.hole_x_tol_in:.3dot}}."
# Stations: X from ROW SIDE. The #2 centre drill at its 3/16 in body Ø (largest cone).
milling_cuts = [{ name = "spots B, H1–H4", kind = "drill", phase = "rough", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 4.7625, stations_mm = ["{{cad.bore_y_mm}}", "{{cad.hole_y1_mm}}", "{{cad.hole_y2_mm}}"] }]
instruction_detailed = "Touch ROW SIDE and zero X; the fixed jaw face is SPINDLE END, so touch it and zero Y. Spot B and H1–H4 at the table positions (±{{cad.hole_x_tol_in:.3dot}}), cone a little under each drill."
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Hole", "X from ROW SIDE", "Y from SPINDLE END"]
rows = "{{cad.hole_rows}}"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-15"
sizing = { kind = "band", band_mm = "{{cad.hole_dia_band_mm}}" }
instruction = "H1–H4 through, peck .1."
milling_cuts = [{ name = "H1–H4", kind = "drill", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 4.572, stations_mm = ["{{cad.hole_y1_mm}}", "{{cad.hole_y2_mm}}"] }]
rpm = 3000
feed = "hand"
inspection = "Rows {{cad.hole_y1_nominal_in:.3dot}}/{{cad.hole_y2_nominal_in:.3dot}}, stations {{cad.hole_x1_nominal_in:.3dot}}/{{cad.hole_x2_nominal_in:.3dot}}, ±{{cad.hole_x_tol_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.hole_x1_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.hole_x2_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.hole_y1_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.hole_y2_band_mm}}" }]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-5-16"
sizing = { kind = "band", band_mm = "{{cad.cbore_dia_band_mm}}" }
instruction = "Counterbore H1–H4: floor {{cad.cbore_floor_min_in:.3dot}}–{{cad.cbore_floor_max_in:.3dot}} above SEAT (≈{{cad.cbore_depth_in:.3dot}} deep)."
milling_cuts = [{ name = "H1–H4 counterbores", kind = "plunge", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 7.9375, stations_mm = ["{{cad.hole_y1_mm}}", "{{cad.hole_y2_mm}}"] }]
instruction_detailed = "Measure the block's height H. Plunge the 5/16 end mill on each of H1–H4 to Z = −(H − {{cad.cbore_floor_nominal_in:.3dot}}), about {{cad.cbore_depth_in:.3dot}} deep, so each floor stands {{cad.cbore_floor_min_in:.3dot}}–{{cad.cbore_floor_max_in:.3dot}} above SEAT."
rpm = 2000
feed = "hand"
inspection = "Floors {{cad.cbore_floor_min_in:.3dot}}–{{cad.cbore_floor_max_in:.3dot}} above SEAT."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.cbore_floor_band_mm}}" }]

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-f"
sizing = { kind = "band", band_mm = "{{cad.tap_drill_band_mm}}" }
instruction = "B through (tap drill), peck .1."
milling_cuts = [{ name = "B tap drill", kind = "drill", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 6.5278, stations_mm = "{{cad.bore_y_mm}}" }]
rpm = 2450
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-3-8"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Seat B: plunge to Z −{{cad.bore_depth_nominal_in:.3dot}}, flat floor."
milling_cuts = [{ name = "seat B", kind = "plunge", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 9.525, stations_mm = "{{cad.bore_y_mm}}" }]
instruction_detailed = "Still on B, plunge the 3/8 end mill over the F hole to Z −{{cad.bore_depth_nominal_in:.3dot}}, pecking out the chips; dwell a moment at depth so the floor cleans up flat. The cutter itself sizes the seat: the .375 pin enters full depth, the .379 does not."
rpm = 1650
feed = "hand"
inspection = "Ø{{cad.bore_dia_min_in:.3dot}}–{{cad.bore_dia_max_in:.3dot}} × {{cad.bore_depth_min_in:.3dot}}–{{cad.bore_depth_max_in:.3dot}} deep, flat."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.bore_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.bore_depth_band_mm}}" }]

[[setups.operations]]
speed_kind = "other"
tool = "tap"
sizing = "other"
instruction = "Tap B {{cad.pivot_thread}} through."
instruction_detailed = "Start the 5/16-18 plug tap in B square from the drill chuck, spindle off, about 3 turns; finish through with the T-handle, backing off each half turn to break the chip."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Leadscrew clearance through the lug"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On SPINDLE END on 1/2 in parallels, SEAT at the fixed jaw, LUG END left, centred."
datum = "X0 LUG END (touched); Y0 SEAT = fixed jaw face; Z0 OUTER END."
diagram = { file = "diagrams/feed-block/lug-bore.svg", alt = "Block standing on SPINDLE END, SEAT at the fixed jaw: the leadscrew clearance down through the lug from OUTER END" }
# Standing on SPINDLE END, drilled down its own height from OUTER END:
# thrust along the upright block compresses it, so these cuts bend nothing.
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = [0, "{{process.jaw_grip_mm}}"], section_mm = { x = "{{cad.overall_y_mm}}", y = "{{cad.height_mm}}" } }
# The hole and the LUG END touch lie within the overall length; across, the
# .96 height. The drill and end-mill tips run deepest, just past the lug's
# underside; longest: that jobber drill in the chuck; shortest: an end mill
# in its collet.
envelope = { x_span_mm = "{{cad.y_length_mm}}", y_span_mm = "{{cad.height_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.lug_x_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.length_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_y_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
instruction = "Hold: both KP08 axis heights (base to bore centre) recorded; either more than {{process.leadscrew_margin_mm:.2f}} mm off {{process.kp08_axis_height_mm:.2f}} mm, stop and report."

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot X {{cad.screw_y_nominal_in:.3dot}}, Y {{cad.screw_z_nominal_in:.4dot}} ({{cad.screw_z_mm:.2f}} mm)."
milling_cuts = [{ name = "leadscrew spot", kind = "drill", phase = "rough", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 4.7625, stations_mm = "{{cad.length_mm}}" }]
instruction_detailed = "Touch LUG END and zero X; the fixed jaw face is SEAT, zero Y on it. Spot at X {{cad.screw_y_nominal_in:.3dot}} ({{cad.screw_y_min_in:.3dot}}–{{cad.screw_y_max_in:.3dot}}), Y {{cad.screw_z_nominal_in:.4dot}} ({{cad.screw_z_band_text}} from SEAT). Lock both table axes for the rest of the setup."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-5-16"
sizing = "other"
instruction = "Pilot through the lug, peck .1."
milling_cuts = [{ name = "leadscrew pilot", kind = "drill", phase = "rough", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 7.9375, stations_mm = "{{cad.length_mm}}" }]
rpm = 2000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-3-8"
sizing = { kind = "band", band_mm = "{{cad.screw_dia_band_mm}}" }
instruction = "Plunge through the lug, peck; Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}."
milling_cuts = [{ name = "leadscrew clearance", kind = "plunge", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 9.525, stations_mm = "{{cad.length_mm}}" }]
instruction_detailed = "Change to the 3/8 end mill, table still locked. Plunge it down the pilot right through the lug, pecking out the chips; its 3/8 shank follows the flutes into the hole. The cutter sizes the hole: the .375 pin passes through, the .379 does not."
rpm = 1650
feed = "hand"
inspection = "Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}; {{cad.screw_y_min_in:.3dot}}–{{cad.screw_y_max_in:.3dot}} from LUG END; {{cad.screw_z_band_text}} from SEAT."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.screw_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_y_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_z_band_mm}}" }]

