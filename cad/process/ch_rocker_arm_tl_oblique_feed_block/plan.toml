[[setups]]
machine_kind = "other"
title = "Face SEAT and TOP"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on 1 in parallels, as-bought 3 in edges in the jaws, centred."
diagram = { file = "diagrams/feed-block/faces.svg", alt = "Blank flat in the vise: clean one face (SEAT), flip, face TOP to height" }
# The whole blank lies inside the jaw span: no station bends.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = [0, "{{cad.blank_length_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.height_mm}}" } }
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{cad.height_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.blank_width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_thickness_mm}}", parallel_height_mm = "{{process.face_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_blank_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face the up side just clean (≤{{process.cleanup_in:.2dot}}). Mark it SEAT."
milling_cuts = [{ name = "SEAT clean-up", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 0.508, radial_woc_mm = 15.24, traverse_mm = [0, "{{cad.blank_length_mm}}"] }]
settings = "basebar-face-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "SEAT down; face TOP to height {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}."
milling_cuts = [{ name = "TOP to height", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 0.508, radial_woc_mm = 15.24, traverse_mm = [0, "{{cad.blank_length_mm}}"] }]
instruction_detailed = "Turn the blank over, SEAT down on the parallels, and tap it down until both parallels are pinned. Touch TOP, then face it in two or three passes until the blank measures {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}} over SEAT; aim for the middle."
settings = "basebar-face-6061-t6511"
inspection = "Height {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.height_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Mill SPINDLE END and OUTER END"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On edge on 1/2 in parallels, SEAT and TOP in the jaws, centred."
diagram = { file = "diagrams/feed-block/width.svg", alt = "Blank on edge: clean one 3 in edge (SPINDLE END), flip, mill the other down to the 1.64 length" }
# Standing on edge: a cantilever up from the jaw tops, bent across the jaws.
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.blank_width_mm}}"], clamp_mm = [0, "{{process.jaw_grip_mm}}"], section_mm = { x = "{{cad.blank_length_mm}}", y = "{{cad.height_mm}}" } }
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.height_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.blank_width_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.length_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_width_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_blank_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face the up edge just clean (≤{{process.cleanup_in:.2dot}}). Mark it SPINDLE END."
milling_cuts = [{ name = "SPINDLE END clean-up", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 0.508, radial_woc_mm = 12.7, stations_mm = "{{cad.blank_width_mm}}" }]
settings = "basebar-face-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "SPINDLE END down; mill OUTER END down in ≤{{process.layer_in:.2dot}} layers to length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
milling_cuts = [
  { name = "OUTER END layers", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "rough", axial_doc_mm = 2.54, radial_woc_mm = 12.7, stations_mm = "{{cad.blank_width_mm}}" },
  { name = "OUTER END last layer", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, rpm = 850, feed_mm_min = 172.72, phase = "finish", axial_doc_mm = 2.54, radial_woc_mm = 12.7, stations_mm = "{{cad.length_mm}}" },
]
instruction_detailed = "Turn the blank over, SPINDLE END down on the 1/2 in parallels, and tap it down. About 1.3 in comes off: face OUTER END in layers no deeper than {{process.layer_in:.2dot}}, two overlapping passes per layer across the .96 edge. Measure from SPINDLE END before the last layer; finish at {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
settings = "basebar-face-6061-t6511"
inspection = "Length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Face ROW SIDE and LUG END"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On end on 1/2 in parallels, SEAT and TOP in the jaws, SPINDLE END squared to the table, centred."
