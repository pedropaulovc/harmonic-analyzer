beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.overall_y_mm}}"], clamp_mm = ["{{process.notch_overhang_mm}}", "{{cad.overall_y_mm}}"], section_mm = { y = "{{cad.height_mm}}", z = "{{process.lug_width_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Notch {{cad.lug_length_in:.2f}} from LUG END, down to Z −{{cad.lug_x_nominal_in:.3dot}} in ≤.10 layers (last .005–.010), three passes per layer at Y .20/.48/.76; finish the step face at X {{cad.lug_length_in:.3dot}}."
instruction_detailed = "Touch SPINDLE END and zero Z. Spindle off, set the cutter's edge at X {{cad.lug_length_in:.3dot}} just above SPINDLE END and sight down: the jaw side must lie at least .15 beyond the cutter. Each layer is no deeper than .10. The middle pass at Y .48 (a full slot) and the Y .20 pass start in the air past LUG END, table moving right, and stop with the cutter's edge at X 1.88. The Y .76 pass then starts at the step: plunge the layer there (the slot beside it is open), cutter's edge at X 1.88, and run out past LUG END, table moving left. All three are conventional. The flutes (≥1.00) cover the {{cad.lug_x_nominal_in:.2dot}} depth. Take the last layer .005–.010 to Z −{{cad.lug_x_nominal_in:.3dot}}: the cutter's end makes the lug face and its square corner the inside corner. Last, with the cutter's edge at X {{cad.lug_length_in:.3dot}}, take the .01 off the step face in one pass across, table moving away from you (conventional)."
# block-em-half-long-6061-t6511: 1800 rpm, 8 in/min (203.2 mm/min). The
# side passes are ~.25 wide; the slot is the full width.
milling_cuts = [
  { name = "notch slot layers", kind = "slot", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 2.54, radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "notch side passes", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 2.54, radial_woc_mm = 6.35, rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "lug face last layer", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.254, radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "step face", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.lug_x_mm}}", radial_woc_mm = 0.254, rpm = 1800, feed_mm_min = 203.2, stations_mm = "{{cad.lug_length_mm}}" },
]
settings = "block-em-half-long-6061-t6511"
inspection = "Lug face {{cad.lug_x_min_in:.3dot}}–{{cad.lug_x_max_in:.3dot}} from SPINDLE END; step {{cad.lug_length_min_in:.3f}}–{{cad.lug_length_max_in:.3f}} from LUG END; inside corner the cutter's square corner (R.040 max)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.lug_x_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.lug_length_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Holes from TOP"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat, SEAT down on 1 in parallels no thicker than 1/8, tight against the jaws (H1–H4 break out .22 from each jaw); SPINDLE END at the fixed jaw, ROW SIDE on your right, centred."
datum = "X0 ROW SIDE (touched): the hole table's X runs left from it, −X on the DRO; Y0 SPINDLE END = fixed jaw face, +Y toward you; Z0 TOP, touched off with each end mill."
diagram = { file = "diagrams/feed-block/holes.svg", alt = "Block SEAT down, SPINDLE END at the fixed jaw: pivot seat B and H1-H4 with their counterbores; section through H1 and B" }
# Every hole sits inside the block. Longest: a jobber drill in the chuck;
# shortest: the 5/16 in end mill in its collet. The tap tip runs deepest.
envelope = { x_span_mm = "{{cad.y_length_mm}}", y_span_mm = "{{cad.length_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{cad.height_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.face_parallel_height_mm}}", "{{process.tap_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.length_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.height_mm}}", parallel_height_mm = "{{process.face_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_y_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# Stations from ROW SIDE; the jaws grip the body, not the notched lug.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.y_length_mm}}"], clamp_mm = [0, "{{process.body_y_mm}}"], section_mm = { y = "{{cad.length_mm}}", z = "{{cad.height_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot B and H1–H4 from the table. H1–H4 X, Y ±{{cad.hole_x_tol_in:.3dot}}; B ±.01."
instruction_detailed = "Touch ROW SIDE and zero X; the fixed jaw face is SPINDLE END, so touch it and zero Y. Spot B and H1–H4 at the table positions, each X to the left of ROW SIDE (−X on the DRO) (H1–H4 ±{{cad.hole_x_tol_in:.3dot}}, B ±.01), cone a little under each drill."
# Stations: X from ROW SIDE. The #2 centre drill at its 3/16 in body Ø (largest cone).
milling_cuts = [{ name = "spots B, H1–H4", kind = "drill", phase = "rough", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 4.7625, stations_mm = ["{{cad.bore_y_mm}}", "{{cad.hole_y1_mm}}", "{{cad.hole_y2_mm}}"] }]
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Hole", "X from ROW SIDE", "Y from SPINDLE END"]
rows = "{{cad.hole_rows}}"

