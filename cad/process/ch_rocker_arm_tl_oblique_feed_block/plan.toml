# Source: the v50 MHA-CH-06-TL-32 sheets through the feature manifest (sizes,
# lug, stations, rows, limits, the counterbored .375 seat and its 5/16-18
# tap, the Ø.375 leadscrew clearance and its row and height). No hand
# traveler exists for this block. Route, tools, speeds, workholding and datums
# are authored here, as for TL-22 (its plan.toml): one blank from the
# OnlineMetals 1187 1 x 3 in bar (the sheet's material block; coordinator
# 2026-11-14) with the 3.47 overall along the bar, both faces faced, the 1.64
# milled from the 3 in width on edge in ≤.10 layers (owner ruling #2083: mill
# to size, no bandsaw rip), the sawn ends faced on end, the top holes in one
# hold (the seat a plunged 3/8 end mill, as TL-22's), the leadscrew clearance
# with the block standing on SPINDLE END, plunged with the same 3/8 end mill
# (owner ruling 2026-11-13; RV-04 accepts its .044 wall to the taps), and
# last the lug notch with the block on edge, OUTER END down, so the end
# mill's square end cuts the lug face and leaves the inside corner sharp
# (INSIDE CORNERS R.040 MAX; blind review 2026-11-14 L1). Both hole setups
# come before the notch (Codjiflo, #2745/#397): the block is still a full
# rectangle, so the fixed jaw meets all of SPINDLE END and the block stands
# on all of it; the clearance is cut blind past where the lug face will be,
# and the notch opens it. The four #4-40 nut
# taps are transferred through the MHA-CH-06-TL-VN-84 feed nut at TL-00
# assembly (the sheet's note): no operation here. The KP08 axis-height check
# (#2184) is an assembly check, not this part's.
# Speeds: the jig sheets' LittleMachineShop 6061-T6 row, 165 ft/min:
# rpm = 12 × 165 / (π × D in), rounded down to 50, capped at the PM-30MV's
# 3000 (#15 3501 → 3000; F 2452 → 2450; 5/16 2017 → 2000; 3/8 1680 → 1650).
# Both 1/2 in end mills run 1800 rpm, 8 in/min (.0022 in/tooth). Every speed
# lies in the high belt range (1400-3000), so the belt never moves.
title = "Oblique trammel feed block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} × 12 in bar (OnlineMetals 1187, shared with TL-22); {{process.quantity:d}} blank {{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} × {{process.blank_length_in:.2f}} in."
note = "Inches. Every face machined. The {{cad.nut_tap_count:d}}X {{cad.nut_thread}} nut taps are transferred at TL-00 assembly, not here."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_feed_block/features.toml"
adapter = "harmonic_feed_block"

[parameters]
blank_length_in = 3.6            # Y 3.47 + two .02 clean-ups + saw allowance.
blank_min_length_in = 3.55
blank_width_in = 3.0             # 1187 bar width; mills to the 1.64.
blank_thickness_in = 1.0         # 1187 bar thickness; faces to .96.
quantity = 1
kerf_in = 0.125                  # As the jig sheets: about 1/8 in per cut.
cleanup_in = 0.02                # First face of each pair: just clean.
layer_in = 0.10                  # Facing layers on the 1.36 off OUTER END.
end_layer_in = 0.05              # Facing layers on the tall ends (Setup 4).
# Lug notch, on edge, TOP at the fixed jaw: LUG END 2.05-2.15 past the right
# jaw side (the model's hand: SPINDLE END up, TOP behind) leaves the
# cutter's edge at the 1.89 step .16-.26 clear of the jaw; 3.47 − 2.15 = 1.32
# in stays gripped. The vise hold and the bending take the 2.15 worst case
# (54.61 mm). The left jaw end holds a spacer across the jaws, matched to the
# block's across-jaw size there, its height: an 1187 offcut faced at the
# block's finish Z in "Face SEAT and TOP" and within .001 of it. The
# finished TL-22 is not the spacer (Codjiflo, #2745): its .950-.970 height is
# unmatched, and its SEAT and TOP would take the jaw load.
notch_overhang_min_in = 2.05
notch_overhang_max_in = 2.15
notch_overhang_mm = 54.61
spacer_length_in = 1.58         # The spacer offcut, along the bar and the jaws.
spacer_length_mm = 40.132        # 1.58 × 25.4.
# The spacer's match to the block's measured height, ±.001 about the .96
# nominal: (.96 ∓ .001) × 25.4.
spacer_match_low_mm = 24.3586
spacer_match_high_mm = 24.4094
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). Archive values are
# archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
face_parallel_height_mm = 25.4   # 1 in parallels (shop-equipment parallels-lms-6745).
edge_parallel_height_mm = 12.7   # 1/2 in parallels, same set.
face_cutter_dia_mm = 12.7        # 1/2 in end mill (LMS 6784 set).
half_cutter_dia_mm = 12.7        # The owner's 1/2 in end mill, flutes ≥1.00.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# Archive LMS 6784 projections from the R8 collet: 1/4 in 25, 7/16 in 41,
# 11/16 in 50; the 1/2 and 5/16 in cutters have no member record, so their
# neighbours bound them.
half_mill_projection_min_mm = 41.0
half_mill_projection_max_mm = 50.0
small_mill_projection_min_mm = 25.0
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Archive drill-index-115 13/32 in member, 112.8 out of drill-chuck-r8: a
# recorded jobber above every drill here, so it bounds the longest drill.
drill_projection_max_mm = 112.8
# A plug tap runs its 3-5 chamfered threads (5 × 1.411 mm pitch) and a little
# more past SEAT before full thread reaches it; the parallels leave the gap.
tap_tip_z_mm = -8.0
# The leadscrew clearance, cut before the notch: blind from OUTER END to
# Z −.90, past the lug face to come (1.650 − .860 = .790 from OUTER END at
# worst), so the notch opens it. Its floor stands 1.64 − .90 = .74 above
# SPINDLE END (18.796 mm); the 5/16 drill and 3/8 end mill tips run ~.1
# below that.
lug_bore_depth_in = 0.90
lug_bore_floor_mm = 18.796
drill_tip_z_mm = -2.54
# Milling deflection (prechips milling_deflection). A part standing in the
# vise on the 1/2 in parallels is gripped only up to the jaw tops:
# jaw_grip_mm = vise_jaw_height_mm − edge_parallel_height_mm (44.9453 − 12.7).
# The 1/2 in cutters run 1800 rpm, 8 in/min = 203.2 mm/min, in .40 in
# (10.16 mm) steps across a face and a full 12.7 mm width across a .96 end
# or edge. Hand-fed drills and plunges are declared at .001 in/tooth
# (.002 in/rev).
jaw_grip_mm = 32.2453
# The lug, (1.64 − .87) in = 19.558 mm: its height above OUTER END in the
# notch setup and its smallest section.
lug_width_mm = 19.558

