gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.screw_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_y_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_z_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Mill the lug notch"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On edge, OUTER END down on 1/2 in parallels, TOP at the fixed jaw; LUG END {{process.notch_overhang_min_in:.2f}}–{{process.notch_overhang_max_in:.2f}} past the right jaw side, measured; the spacer (faced with the block, within .001 of its height) across the jaws at the left jaw end, faced sides against the jaws; not TL-22."
datum = "X0 LUG END (touched), +X into the part; Y0 TOP = fixed jaw face, +Y toward you; Z0 SPINDLE END (touched with the cutter)."
diagram = { file = "diagrams/feed-block/notch.svg", alt = "Front view, moving jaw not shown: the block on edge, LUG END past the right jaw side, the notch cut down from SPINDLE END to the lug face" }
# The cutter works only past the jaw side: along the lug plus a cutter
# diameter either side, across the .96 plus one diameter, down to the lug
# face .77 above the parallels.
envelope = { x_span_mm = ["{{cad.lug_length_mm}}", "{{process.half_cutter_dia_mm}}", "{{process.half_cutter_dia_mm}}"], y_span_mm = ["{{cad.height_mm}}", "{{process.half_cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{process.lug_width_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.length_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["rest", "{{process.notch_overhang_mm}}"], jaw_offset = "balanced", balance = "spacer", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# Stations from LUG END. The lug hangs out past the jaw side, a cantilever
# from it at the 2.15 worst case; the finished lug section (.96 across the
# jaws, .77 high) is taken for every pass, the weakest.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.overall_y_mm}}"], clamp_mm = ["{{process.notch_overhang_mm}}", "{{cad.overall_y_mm}}"], section_mm = { y = "{{cad.height_mm}}", z = "{{process.lug_width_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Notch {{cad.lug_length_in:.2f}} from LUG END, down to Z −{{cad.lug_x_nominal_in:.3dot}} in ≤.10 layers (last .005–.010), three passes per layer at Y .20/.48/.76; finish the step face at X {{cad.lug_length_in:.3dot}}."
instruction_detailed = "Touch SPINDLE END and zero Z. Spindle off, set the cutter's edge at X {{cad.lug_length_in:.3dot}} just above SPINDLE END and sight down: the jaw side must lie at least .15 beyond the cutter. Each layer is no deeper than .10. Rough each layer to the step's low limit, the cutter's edge at X {{cad.lug_length_min_in:.3dot}}, leaving the rest for the finish. First the middle pass at Y .48, a full slot: start in the air past LUG END, table moving right, and stop at the step. Then Y .76 (the uncut strip toward you): start in the air past LUG END, table moving right, and stop at the step. Then Y .20 (the strip toward the fixed jaw): plunge the layer at the step, beside the open slot, and run out past LUG END, table moving left. Both side passes are conventional. The flutes (≥1.00) cover the {{cad.lug_x_nominal_in:.2dot}} depth. From Z −.74 the layers break into the leadscrew clearance, an interrupted cut: keep the feed steady. Take the last layer .005–.010 to Z −{{cad.lug_x_nominal_in:.3dot}}: the cutter's end makes the lug face and its square corner the inside corner. Last, with the cutter's edge at X {{cad.lug_length_in:.3dot}}, take the rest off the step face in one pass across, table moving toward you (conventional)."
# block-em-half-long-6061-t6511: 1800 rpm, 8 in/min (203.2 mm/min). The
# side passes are ~.25 wide; the slot is the full width.
milling_cuts = [
  { name = "notch slot layers", kind = "slot", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 2.54, radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "notch side passes", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 2.54, radial_woc_mm = 6.35, rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "lug face last layer", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.254, radial_woc_mm = "{{process.half_cutter_dia_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.lug_length_mm}}"] },
  { name = "step face", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.half_cutter_dia_mm}}", flutes = 2, axial_doc_mm = "{{cad.lug_x_mm}}", radial_woc_mm = 0.254, rpm = 1800, feed_mm_min = 203.2, stations_mm = "{{cad.lug_length_mm}}" },
]
settings = "block-em-half-long-6061-t6511"
inspection = "Lug face {{cad.lug_x_min_in:.3dot}}–{{cad.lug_x_max_in:.3dot}} from SPINDLE END; step {{cad.lug_length_min_in:.3f}}–{{cad.lug_length_max_in:.3f}} from LUG END; inside corner the cutter's square corner (R.040 max)."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.lug_x_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.lug_length_band_mm}}" }]

