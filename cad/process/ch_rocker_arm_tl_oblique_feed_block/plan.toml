# Source: the v49 MHA-CH-06-TL-32 sheets through the feature manifest (sizes,
# lug, stations, rows, limits, the flat-bottomed .375 seat and its 5/16-18 tap,
# the Ø.375 leadscrew clearance and its row and height). No hand traveler exists for
# this block. Route, tools, speeds, workholding and datums are authored here,
# as for TL-22 (its plan.toml): one blank from the OnlineMetals 1187 1 x 3 in
# bar with the 3.47 overall along the bar, both faces faced, the 1.64 length
# milled from the 3 in width on edge (owner ruling #2083: mill to size, no
# bandsaw rip), the sawn ends faced on end, then the lug notch with LUG END out
# past the jaw side, the top holes in one hold (the seat a plunged 3/8 end
# mill, as TL-22's), and the leadscrew clearance with the block standing on
# SPINDLE END, plunged with the same 3/8 end mill (owner ruling 2026-11-13;
# RV-04 accepts its .044 wall to the taps). The four #4-40 nut taps are
# transferred through the MHA-CH-06-TL-VN-84 feed nut at TL-00 assembly (the
# sheet's note): no operation here.
# Speeds: the jig sheets' LittleMachineShop 6061-T6 row, 165 ft/min:
# rpm = 12 × 165 / (π × D in), rounded down to 50, capped at the PM-30MV's
# 3000 (#15 3501 → 3000; F 2452 → 2450; 5/16 2017 → 2000; 3/8 1680 → 1650).
title = "Oblique trammel feed block"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} × 12 in bar (OnlineMetals 1187, shared with TL-22); {{process.quantity:d}} × {{process.blank_length_in:.2f}} in blank."
note = "Inches. Every face machined. The {{cad.nut_tap_count:d}}X {{cad.nut_thread}} nut taps are transferred at TL-00 assembly, not here."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_feed_block/features.toml"
adapter = "harmonic_feed_block"

[parameters]
blank_length_in = 3.6            # Y 3.47 + two .02 clean-ups + saw allowance.
blank_min_length_in = 3.55
blank_width_in = 3.0             # 1187 bar width; mills to the 1.64 length.
blank_thickness_in = 1.0         # 1187 bar thickness; faces to .96.
quantity = 1
kerf_in = 0.125                  # As the jig sheets: about 1/8 in per cut.
cleanup_in = 0.02                # First face of each pair: just clean.
layer_in = 0.10                  # Facing layers down to size.
# Lug notch: LUG END 2.0 in past the right jaw side leaves the step ~.1 clear
# of it; a block as high as the part fills the left jaw end.
notch_overhang_mm = 50.8
spacer_length_in = 1.5
# HA ch_rocker_arm_tl_vn_oblique_leadscrew_spec.KP08_AXIS_HEIGHT, unverified on
# the uxcell blocks (HA #2184). At the plunged Ø.375's least size and its
# title-block stations the leadscrew keeps 0.31 mm of radial clearance
# (feed spec LEADSCREW_RADIAL_CLEARANCE − LEADSCREW_OFFSET), so a KP08 more
# than 0.30 mm off its 15.00 mm is stopped before the clearance is cut.
kp08_axis_height_mm = 15.0
leadscrew_margin_mm = 0.30
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). Archive values are
# archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
face_parallel_height_mm = 25.4   # 1 in parallels (shop-equipment parallels-lms-6745).
edge_parallel_height_mm = 12.7   # 1/2 in parallels, same set.
face_cutter_dia_mm = 19.05       # 3/4 in end mill.
half_cutter_dia_mm = 12.7        # 1/2 in end mill.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
# Archive LMS 6784 projections from the R8 collet: 1/4 in 25, 7/16 in 41,
# 11/16 in 50, 3/4 in 57; the 1/2 and 5/16 in cutters have no member record,
# so their neighbours bound them.
face_mill_projection_mm = 57.0
half_mill_projection_min_mm = 41.0
half_mill_projection_max_mm = 50.0
small_mill_projection_min_mm = 25.0
notch_tip_z_mm = -1.016          # Notch cutter .04 below SEAT (free air).
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# Archive drill-index-115 13/32 in member, 112.8 out of drill-chuck-r8: a
# recorded jobber above every drill here, so it bounds the longest drill.
drill_projection_max_mm = 112.8
# A plug tap runs its 3-5 chamfered threads (5 × 1.411 mm pitch) and a little
# more past SEAT before full thread reaches it; the parallels leave the gap.
tap_tip_z_mm = -8.0
# 5/16 drill and 3/8 end mill tips ~.1 past the lug's underside.
drill_tip_z_mm = -2.54
# Milling deflection (prechips milling_deflection). A part standing in the
# vise on the 1/2 in parallels is gripped only up to the jaw tops:
# jaw_grip_mm = vise_jaw_height_mm − edge_parallel_height_mm (44.9453 − 12.7).
# The 3/4 in cutter faces at basebar-face-6061-t6511 (850 rpm, 6.8 in/min =
# 172.72 mm/min) with .60 in (15.24 mm) steps across a wide face, and two
# overlapping .50 in (12.7 mm) passes across a .96 face or edge. Hand-fed
# drills and plunges are declared at .001 in/tooth (.002 in/rev).
jaw_grip_mm = 32.2453
# Notch: the lug left past the jaws is (1.64 − .87) in = 19.558 mm wide, its
# smallest section; the fixed jaw meets SPINDLE END only off the lug, along
# body_y_mm = overall − lug length = 88.138 − 48.006 from ROW SIDE.
lug_width_mm = 19.558
body_y_mm = 40.132

