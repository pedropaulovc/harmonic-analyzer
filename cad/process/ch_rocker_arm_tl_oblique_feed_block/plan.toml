instruction = "3/8 end mill miked ≥.3750; plunge to Z −{{process.lug_bore_depth_in:.2dot}} in .25 pecks, full retract after each: Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}."
instruction_detailed = "Change to the 3/8 end mill, table still locked; it must mike .3750 or more across its flutes. Touch OUTER END with it and zero Z. Plunge it down the pilot in pecks of about .25 (Z −.25, −.50, −.75, then −{{process.lug_bore_depth_in:.2dot}}), retracting it fully out of the hole after each and brushing the chips off: its 3/8 shank follows the flutes into the hole, closing it above them, so the chips leave only on a retract. The cutter sizes the hole: the .375 pin enters full depth, the .379 does not."
milling_cuts = [{ name = "leadscrew clearance", kind = "plunge", phase = "finish", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 9.525, stations_mm = "{{cad.length_mm}}" }]
rpm = 1650
