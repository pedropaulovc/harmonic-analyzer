[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "From the 1187 bar end: one {{process.blank_length_in:.2f}} blank, waste side of the line; ≥{{process.blank_min_length_in:.2f}}."
