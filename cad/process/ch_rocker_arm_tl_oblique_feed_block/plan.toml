milling_cuts = [{ name = "leadscrew spot", kind = "drill", phase = "rough", material = "aluminum_6061", flutes = 2, feed_per_tooth_mm = 0.0254, cutter_dia_mm = 4.7625, stations_mm = "{{cad.length_mm}}" }]
