[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "SEAT down; face TOP to height {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}: one rough pass, then a .005–.010 finish pass."
instruction_detailed = "Turn the blank over, SEAT down on the parallels, and tap it down until both parallels are pinned. Touch TOP and take one rough pass to about .010 over size, then measure and take the .005–.010 finish pass to {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}} over SEAT; each pass is .40 steps along the blank, across its 3 in."
milling_cuts = [
  { name = "TOP rough", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = 203.2, phase = "rough", axial_doc_mm = 1.016, radial_woc_mm = 10.16, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "TOP finish", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = 203.2, phase = "finish", axial_doc_mm = 0.254, radial_woc_mm = 10.16, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]
settings = "block-em-half-6061-t6511"
inspection = "Height {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.height_band_mm}}" }]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Spacer: the offcut on the same parallels; face it at the block's finish Z, unmoved; caliper it within .001 of the block's height."
instruction_detailed = "The spacer balances the vise in the notch setup; the finished TL-22 is not used. Leave the knee locked and the DRO Z where the block's finish pass ran. Unclamp the block and clamp the spacer offcut in its place, flat on the same parallels, its as-bought 3 in edges in the jaws; tap it down until both parallels are pinned. Take a rough pass about .010 above the finish Z, then the finish pass at the block's finish Z: the spacer comes out at the block's height over the same parallels. Caliper the block and the spacer at both ends: the spacer must be within .001 of the block. If it is thick, take another .001–.002; if it is thin, make it up with shim stock between the spacer and the moving jaw in the notch setup. Mark it SPACER."
milling_cuts = [
  { name = "spacer rough", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = 203.2, phase = "rough", axial_doc_mm = 1.016, radial_woc_mm = 10.16, traverse_mm = [0, "{{process.spacer_length_mm}}"] },
  { name = "spacer finish", kind = "end", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 2, rpm = 1800, feed_mm_min = 203.2, phase = "finish", axial_doc_mm = 0.254, radial_woc_mm = 10.16, traverse_mm = [0, "{{process.spacer_length_mm}}"] },
]
settings = "block-em-half-6061-t6511"
inspection = "Spacer within .001 of the block's height."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.spacer_match_low_mm}}", "{{process.spacer_match_high_mm}}"] }]

