indexing = "none"
machine_ref = "pm-30mv"
holding = "On SPINDLE END on 1/2 in parallels, SEAT at the fixed jaw, LUG END left, centred."
datum = "X0 LUG END (touched); Y0 SEAT = fixed jaw face; Z0 OUTER END."
diagram = { file = "diagrams/feed-block/lug-bore.svg", alt = "Block standing on SPINDLE END, SEAT at the fixed jaw: the leadscrew bore down through the lug from OUTER END" }
# The bore and the LUG END touch lie within the overall length; across, the
# .96 height. The 5/16 drill tip runs deepest, just past the lug's underside;
# longest: that jobber drill in the chuck; shortest: the boring head and bar.
envelope = { x_span_mm = "{{cad.y_length_mm}}", y_span_mm = "{{cad.height_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.lug_x_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.boring_head_len_mm}}", "{{process.boring_bar_reach_long_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.length_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_y_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }

[[setups.operations]]
instruction = "Hold: both KP08 axis heights (base to bore centre) recorded; either off {{process.kp08_axis_height_mm:.2f}} mm, stop and report (~{{process.leadscrew_margin_mm:g}} mm leadscrew clearance)."

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot X {{cad.screw_y_nominal_in:.3dot}}, Y {{cad.screw_z_nominal_in:.4dot}} ({{cad.screw_z_mm:.2f}} mm)."
instruction_detailed = "Touch LUG END and zero X; the fixed jaw face is SEAT, zero Y on it. Spot at X {{cad.screw_y_nominal_in:.3dot}} ({{cad.screw_y_min_in:.3dot}}–{{cad.screw_y_max_in:.3dot}}), Y {{cad.screw_z_nominal_in:.4dot}} ({{cad.screw_z_band_text}} from SEAT). Lock both table axes for the rest of the setup."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-5-16"
sizing = "other"
instruction = "Drill through the lug, peck .1."
rpm = 2000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "boring"
sizing = "other"
instruction = "Bore through to Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}."
instruction_detailed = "Fit the 1.5 in reach bar. The drill only roughs the hole: open it a few thousandths per pass right through the lug so the bar puts it where the table is locked, to Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}."
rpm = 1650
feed = "hand"
inspection = "Ø{{cad.screw_dia_min_in:.3dot}}–{{cad.screw_dia_max_in:.3dot}}; {{cad.screw_y_min_in:.3dot}}–{{cad.screw_y_max_in:.3dot}} from LUG END; {{cad.screw_z_band_text}} from SEAT."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.screw_dia_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_y_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.screw_z_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Deburr / inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/feed-block/inspect.svg", alt = "Finished block: lug, hole positions from ROW SIDE and SPINDLE END; section through H1 and B" }
envelope = "other"
vise_hold = "other"

[[setups.operations]]
instruction = "Edges and hole ends R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max. Run a 5/16-18 screw through B."
inspection = "{{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} × {{cad.overall_y_min_in:.3dot}}–{{cad.overall_y_max_in:.3dot}} × {{cad.height_min_in:.3dot}}–{{cad.height_max_in:.3dot}}; screw runs through by hand."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.overall_y_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.height_band_mm}}" }]
