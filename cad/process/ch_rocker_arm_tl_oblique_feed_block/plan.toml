[[setups]]
machine_kind = "other"
title = "Leadscrew clearance through the lug"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On SPINDLE END on 1/2 in parallels, SEAT at the fixed jaw, LUG END on your right, centred."
datum = "X0 LUG END (touched): the bore's X runs left from it, −X on the DRO; Y0 SEAT = fixed jaw face; Z0 OUTER END."
diagram = { file = "diagrams/feed-block/lug-bore.svg", alt = "Block standing on all of SPINDLE END, SEAT at the fixed jaw: the leadscrew clearance down from OUTER END, blind past where the notch's lug face will be" }
# The hole and the LUG END touch lie within the overall length; across, the
# .96 height. The drill and end-mill tips run deepest, just past the blind
# floor; longest: that jobber drill in the chuck; shortest: an end mill in
# its collet.
envelope = { x_span_mm = "{{cad.y_length_mm}}", y_span_mm = "{{cad.height_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{cad.length_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.edge_parallel_height_mm}}", "{{process.lug_bore_floor_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.small_mill_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{cad.height_mm}}", along_jaws_mm = "{{cad.y_length_mm}}", part_height_mm = "{{cad.length_mm}}", parallel_height_mm = "{{process.edge_parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_y_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
# Standing on all of SPINDLE END (the notch comes later), drilled down from
# OUTER END: thrust along the upright block compresses it, so these cuts
# bend nothing.
beam = { axis = "z", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = [0, "{{process.jaw_grip_mm}}"], section_mm = { x = "{{cad.overall_y_mm}}", y = "{{cad.height_mm}}" } }

[[setups.operations]]
