holding = "On edge, OUTER END down on 1/2 in parallels, TOP at the fixed jaw; LUG END {{process.notch_overhang_min_in:.2f}}–{{process.notch_overhang_max_in:.2f}} past the right jaw side, measured; a {{cad.height_nominal_in:.2dot}} spacer across the jaws (TL-22) at the left jaw end."
