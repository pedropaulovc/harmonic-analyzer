instruction = "SPINDLE END down; mill OUTER END down in ≤{{process.layer_in:.2dot}} layers to length {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
instruction_detailed = "Turn the blank over, SPINDLE END down on the 1/2 in parallels, and tap it down. About 1.3 in comes off: face OUTER END in layers no deeper than {{process.layer_in:.2dot}}, two overlapping passes per layer across the .96 edge. Measure from SPINDLE END before the last layer; finish at {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}."
settings = "basebar-face-6061-t6511"
