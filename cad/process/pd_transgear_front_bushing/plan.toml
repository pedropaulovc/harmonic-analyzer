# Transgear front bushing MHA-PD-25, one off, turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). Route chosen for speed: two chuckings of the 1/2 in C36000 bar on hand
# (cad/config/shop-equipment/stock-bought.toml c360-round-1-2).
# Setup 1, the bar: face the end (Z0: the ring face, which takes the chamfer),
# turn the outside to its .46-.48 band back past the parting line, chamfer the
# faced end's edge .02 MAX x 45° with the compound, spot, drill #31 and ream
# .1260 through and past the parting line in the same chucking, part off .02
# long.
# Setup 2: the bushing turned round, .10 of its outside in the 3-jaw over a
# shim wrap, the parted end out; nothing seats it axially, so the length's
# +/-.001 band is set from the micrometer, not a stop (the MHA-DT-38 bushing's
# regrip): mike the length, touch the AR on the parted end, preset the DRO to
# the miked length less the .227 nominal, face to Z0. Both faces bear (the
# MHA-PD-10 sleeve's nose and the MHA-PD-VN-61 ring), and both are faced.
# Bench: break the edges and the bore's ends. The drawing prints the bore as
# the reamer's size with no band (rule 4, form 2; its modelled cut is the
# owner's ruling of 2026-11-24 on fit audit question 5): its fit is accepted
# on the MHA-PD-23 pin, which is turned
# last to this bore and tried in it on the pin's own traveler. Here the bore
# gets no size check (traveler review t2: a .127 must-not-enter pin was an
# acceptance the drawing does not print), only a look at its finish.
# cad.bore_dia_band_mm is the drawing module's ANALYSIS band (what the reamer
# is modelled to cut); it sizes the reaming op and is no acceptance.
#
# Not on hand (cad/config/shop-equipment/, to order): the .1260 chucking
# reamer (tools-reamers-taps.toml reamer-1260; it serves MHA-PD-24 and
# MHA-PN-05 too).
title = "Transgear Front Bushing"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 1/2 in"
stock = "Lot: {{process.quantity:d}} bushing. Ø{{process.stock_dia_in:.3dot}} bar, on hand: saw a {{process.bar_length_in:g}} in piece off it for the lathe, never the whole bar (it would run out past the spindle's rear end); the bushing takes {{cad.pitch_in:.2dot}} in of it."
shop = "../shop"
stock_refs = ["c360-round-1-2"]
material_key = "lathe-c360"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant); This job says what only this bushing needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["To order", "To order (not on hand): the .1260 chucking reamer."],
  ["Fit", "The bore's fit is accepted on the MHA-PD-23 pin, which is turned last to this bushing: keep the bushing with MHA-PD-18, MHA-PD-10 and MHA-PD-24."],
]

[cad]
file = "../../out/features/pd_transgear_front_bushing/features.toml"
adapter = "turned_bush"
part = "pd-transgear-front-bushing"

[parameters]
quantity = 1
stock_dia_in = 0.5
# A piece of the 12 in bar on hand and the length the 3-jaw grips of it.
bar_length_in = 3.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The part-off op mikes the blade's cutting edge and presets the DRO to that.
blade_width_in = 0.0625
parts_per_pull = 1
# The parting blade's clearance to the jaw fronts.
jaw_clearance_in = 0.1
# Setup 2: how much of the outside the jaws take, from the Setup 1 faced end.
regrip_grip_in = 0.1
# Outside passes (authored): the .02 in wide band takes rough passes only.
rough_radial_doc_mm = 0.25
turn_feed_mm_rev = 0.1016
# The tool starts its pass this far off the faced end.
turn_start_z_mm = 0.5

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-31"
name = "#31 drill"
ref = "drill-31"

[[tools]]
id = "reamer"
name = ".1260 chucking reamer"
ref = "reamer-1260"
status = "to_order"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "deburr"
name = "Deburring countersink"
ref = "deburring-set"

[[setups]]
machine_kind = "lathe"
title = "Bar: face, turn, chamfer, drill and ream the bore, part off long"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw on the Ø{{process.stock_dia_in:.3dot}} bar, {{process.chuck_grip_in:.2dot}} in in the jaws; {{cad.stickout_in:.2dot}} in out of the jaw fronts."
datum = "Z0 (carriage DRO) the bar end faced in Op 10: the ring face."
diagram = { file = "diagrams/bar.svg", alt = "To scale: the 1/2 in bar in the 3-jaw, {{cad.stickout_in:.2dot}} out; the AR tool facing the end to Z0, the ring face; hatched, the rest of the setup's removal: the outside, the bore and the parting kerf." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.stock_dia_mm}}", stock_diameter_mm = "{{cad.stock_dia_mm}}", stickout_mm = "{{cad.stickout_mm}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}", support = "none" }
turning_support = { kind = "chuck_only", chuck_z_mm = "{{cad.jaw_z_mm}}" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the bar end square, {{process.face_allowance_in:.2dot}} in off, finishing with a light skim from the centre out; set DRO Z0 on it. This end is the thrust face on MHA-PD-VN-61, a running face at Ra 63."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.stock_dia_mm}}"
inspection = "Ring face: Look: a bright, even face with no tears or chatter rings, by eye and fingernail (Ra 63: the R0.4 nose at .004 in/rev leaves about Ra 32)."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "longitudinal_turning"
turning_cuts = [
  { name = "Outside", phase = "rough", start_z_mm = "{{process.turn_start_z_mm}}", end_z_mm = "{{cad.run_end_z_mm}}", kept_start_z_mm = "{{cad.outer_datum_out_near_z_mm}}", kept_end_z_mm = "{{cad.kept_end_z_mm}}", start_diameter_mm = "{{cad.stock_dia_mm}}", end_diameter_mm = "{{cad.outer_turn_min_mm}}", max_radial_doc_mm = "{{process.rough_radial_doc_mm}}", feed_mm_rev = "{{process.turn_feed_mm_rev}}", minimum_diameter_mm = "{{cad.outer_turn_min_mm}}" },
]
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the outside from Z0 back past the parting line to Z{{cad.run_end_z_mm:in.2dot}}, to Ø{{cad.outer_dia_mm:in.3dot}} (the band's middle), miking between passes (spindle stopped, the tool backed off) and taking the last one light."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Outside Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}, micrometer."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Outside over {{cad.outer_dia_max_in:.3dot}} in Op 20: take another finish pass and mike again. Under {{cad.outer_dia_min_in:.3dot}}: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Compound at 45°: chamfer the outside edge of the faced end about .010 × 45° with the AR's nose in light passes, checking between them; {{cad.chamfer_datum_leg_max_in:.3dot}} at most, so the ring keeps its full flat."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Chamfer {{cad.chamfer_datum_leg_max_in:.3dot}} × 45° max: lay the calipers' jaws flat on the end face and close them onto the chamfer; the flat reads at least the outside Ø less {{cad.chamfer_datum_leg_max_in:.3dot}} twice."
gauge_checks = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "A chamfer over {{cad.chamfer_datum_leg_max_in:.3dot}} in Op 40: part the turned length off as scrap, pull the bar out to {{cad.stickout_in:.2dot}} in again and start again at Op 10."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock with the No. 1 centre drill, only the point's cone, about Ø.08 across: under the #31 drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 2.0

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-31"
drilling = "twist_drill"
sizing = "other"
instruction = "Feed the #31 drill in until its lips just touch the spot's rim and zero the tailstock quill scale there. Drill in one steady feed until the scale reads {{cad.run_in:.2dot}} (the hole is under three diameters deep, so it needs no peck): the hole runs through the bushing and past the parting line. It leaves the reamer .003 a side."
diagram = { file = "diagrams/bar-drill.svg", alt = "To scale: the #31 drill from the tailstock, its full diameter at the quill reading {{cad.run_in:.2dot}}, through the bushing and past the parting line." }
settings = "lathe-drill-31-c360"
cut_diameter_mm = 3.048
hole_depth_mm = "{{cad.run_mm}}"
peck = "none"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "reamer"
drilling = "none"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Ream .1260 from the tailstock, spindle running: feed the reamer in until its lead chamfer meets the hole's mouth and zero the quill scale there; feed slowly until it reads {{cad.run_in:.2dot}} (past the parting line), and withdraw with the spindle still running. The bore runs on the MHA-PD-23 pin: Ra 63."
diagram = { file = "diagrams/bar-ream.svg", alt = "To scale: the .1260 reamer from the tailstock in the #31 hole, to the quill reading {{cad.run_in:.2dot}}; its lead chamfer drawn schematic (no size on record)." }
settings = "lathe-ream-1260-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "cutoff"
drilling = "none"
sizing = "other"
instruction = "Bring the blade's chuck-side face onto the faced end and set DRO Z there to the blade's width, miked across its cutting edge ({{process.blade_width_in:.4dot}} nominal): the DRO then reads the blade's tailstock-side face. Part off with that face at Z-{{cad.part_off_in:.3dot}}: {{process.regrip_allowance_in:.2dot}} over length, for Setup 2. Hands clear: let the bushing fall; pick it up from the bed or the chip tray only after the spindle has stopped."
diagram = { file = "diagrams/bar-part.svg", alt = "To scale: the 1/16 P1 blade, its tailstock-side face at Z-{{cad.part_off_in:.3dot}}, its tip at the reamed bore." }
settings = "lathe-part-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "lathe"
title = "Turned round: face the parted end to length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a shim wrap of brass shim, {{process.regrip_grip_in:.2dot}} in of the outside in the jaws from the chamfered Setup 1 end, the wrap cut no wider than that so it stands no further out than the jaws; the parted end {{cad.outer_stickout_far_mm:in.2dot}} in out. Nothing seats the bushing axially: the jaw tips may stand proud of the chuck face."
datum = "Z0: the parted face (the nose face), {{cad.length_nominal_in:.3dot}} from the Setup 1 faced end, preset from the length miked in Op 100; the setting error, about .0005 either way, plus a touch mark of at most .0005, which only shortens it, stays inside the {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} band."
diagram = { file = "diagrams/regrip.svg", alt = "The bushing turned round, its chamfered end in the jaws over a shim wrap with nothing behind it: the parted end faced to length from the miked length." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{cad.outer_dia_mm}}", stock_diameter_mm = "{{cad.outer_dia_mm}}", stickout_mm = "{{cad.outer_stickout_far_mm}}", minimum_diameter_mm = "{{cad.outer_dia_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Mike the length at the outer rim; write it down (about {{cad.part_off_in:.3dot}} the first time). Chuck it; spindle running, touch the AR lightly on the parted end's outer rim, a mark no deeper than .0005, and set DRO Z to that length less {{cad.length_nominal_in:.4dot}}. Face in light skims to Z0, the last one .001 deep from the centre out (the nose face, thrust on MHA-PD-10, a running face at Ra 63); unchuck and mike at the rim."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Length {{cad.length_min_in:.4dot}}–{{cad.length_max_in:.4dot}} across the faces, micrometer. Nose face: Look: a bright, even face with no tears or chatter rings, by eye and fingernail (Ra 63: the R0.4 nose at .004 in/rev leaves about Ra 32)."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
instruction = "Over {{cad.length_max_in:.4dot}} in Op 100: chuck it again and repeat Op 100 from that reading. Under {{cad.length_min_in:.4dot}}: scrapped, not reworked; make another from Setup 1. Only a part in the band goes on to the bench."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check the bore"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bushing: its {{cad.length_min_in:.4dot}}–{{cad.length_max_in:.4dot}} length, the turned outside, the ring face's chamfer and the reamed bore through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburr"
drilling = "none"
sizing = "other"
instruction = "Deburr: break both ends of the bore and the nose face's outside edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, with a twist or a light stroke of the deburring set's countersink by hand, without touching the faces' flats or the bore's wall."
feed = "hand"

[[setups.operations]]
instruction = "Look down the bore from each end against a light."
inspection = "The bore's wall bright and smooth, no chatter rings or tears, by eye (Ra 63, held by the reamer). The bore's size is the .1260 reamer's; the running fit is accepted on the MHA-PD-23 pin (its traveler: the pin enters and turns free, no shake)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "A bore with chatter rings or tears in Op 130: scrapped, not reworked; make another from Setup 1."
feed = "hand"

[[setups.operations]]
instruction = "Finish (drawing: bright machined, oiled): wipe the bushing clean and give it, bore included, a light coat of light machine oil."
feed = "hand"
