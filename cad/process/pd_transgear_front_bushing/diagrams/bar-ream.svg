<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="sans-serif" font-size="13">
  <!-- To scale, 300 px/in along and across the axis, from above (the cross-slide at the bottom): the Ø.500 bar (stock_dia_in), the jaw fronts 0.417 behind Z0 (cad.jaw_z_mm), the outside Ø0.470 (cad.outer_dia_mm) back to Z-0.317 (cad.run_end_z_mm), the part-off face at Z-0.242 (cad.part_off_in) with the 1/16 blade's kerf behind it. The 3-jaw's body and jaws are schematic (their sizes are not on record). The .1260 reamer to scale (shop reamer-1260, Ø3.2004 mm = 37.8 px), its 45 deg lead chamfer (schematic, about .01) at Z-0.317, in the #31 hole (white). Drawn short to a break line (its length out of the chuck is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1: the .1260 reamer from the tailstock, to the same quill reading (to scale, 300 px/in)</text>
