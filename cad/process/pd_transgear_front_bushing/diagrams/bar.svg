<!-- The 1/2 in brass bar in the 3-jaw: face, turn the outside, chamfer the faced end, centre, drill #31, ream .1260, part off long. Drawn once by prechips.bush_diagrams and kept as a picture: the template labels the reamed bore with a size band, and the drawing prints none (fit audit 2026-11-23). Not to scale after a model change; its sizes are bound. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 503.8" width="720" height="503.8" font-family="Arial, Helvetica, sans-serif" font-size="14"><defs>
  <marker id="prechips-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#111" />
  </marker>
  <pattern id="prechips-cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#fbe1dd" />
    <line x1="0" y1="0" x2="0" y2="6" stroke="#b33" stroke-width="1.6" />
  </pattern>
  <pattern id="prechips-sec" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#d7e1ec" />
    <line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="0.9" />
  </pattern>
  <pattern id="prechips-thread" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="4" fill="#fff" />
    <path d="M0 0L4 4M4 0L0 4" stroke="#333" stroke-width="0.8" />
  </pattern>
  <pattern id="prechips-vise" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#dcdee1" />
    <line x1="0" y1="3" x2="6" y2="3" stroke="#9a9fa6" stroke-width="1" />
  </pattern>
  <pattern id="prechips-plate" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#e6e8ea" />
    <line x1="4" y1="0" x2="4" y2="8" stroke="#9a9fa6" stroke-width="1" />
  </pattern>
  <pattern id="prechips-bond" width="10" height="6" patternUnits="userSpaceOnUse">
    <rect width="10" height="6" fill="#f4f1e4" />
    <path d="M1 1.5H5M6 4.5H10" stroke="#555" stroke-width="1" />
  </pattern>
  <pattern id="prechips-support" width="4" height="4" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#2f6b3a" />
  </pattern>
</defs><rect class="paper" width="720" height="503.8" fill="#fff" /><g class="fixture-table" fill="#f1f2f3" stroke="#7a7f86" stroke-width="1" /><g class="fixture-vise" fill="url(#prechips-vise)" stroke="#555" stroke-width="1.2"><rect x="30" y="165" width="40" height="210" /><rect x="379.21" y="256" width="34" height="28" /></g><g class="fixture-plate" fill="url(#prechips-plate)" stroke="#555" stroke-width="1.2" /><g class="bond" fill="url(#prechips-bond)" stroke="none" /><g class="part-rest" fill="#c9cbce" stroke="#888" stroke-width="1.2"><path d="M10.00 195.00H218.11V345.00H10.00L5 326.25L15 288.75L5 251.25L15 213.75L10 195Z" /></g><g class="part-waste" fill="#eeeff0" stroke="#666" stroke-width="1.2" stroke-dasharray="2 2" /><g class="part-arriving" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="8 4"><rect x="10" y="195" width="309.21" height="150" /></g><g class="part-kept" fill="#d7e1ec" stroke="#111" stroke-width="1.6"><path d="M246.61 199.50L313.21 199.50L313.21 340.50L246.61 340.50Z" /><rect x="240.61" y="199.5" width="6" height="141" /></g><g class="section" fill="url(#prechips-sec)" stroke="#111" stroke-width="1.5" /><g class="part-removed" fill="url(#prechips-cut)" stroke="none"><rect x="246.61" y="195" width="66.6" height="4.5" /><rect x="246.61" y="340.5" width="66.6" height="4.5" /><rect x="218.11" y="195" width="22.5" height="150" /><rect x="313.21" y="195" width="6" height="150" /></g><g class="part-threads" fill="url(#prechips-thread)" stroke="#555" stroke-width="0.6" /><g class="holes" fill="#fff" stroke="#111" stroke-width="1.2" /><g class="hidden" fill="none" stroke="#555" stroke-width="1.1" stroke-dasharray="4 3"><rect x="246.61" y="251.1" width="66.6" height="37.8" /><rect x="218.11" y="251.1" width="28.5" height="37.8" /></g><g class="fixture-support" fill="url(#prechips-support)" stroke="#2f6b3a" stroke-width="1.3" stroke-dasharray="1.5 2" /><g class="clamp" fill="#6b7178" stroke="#111" stroke-width="1.2"><rect x="70" y="173" wi