"89.08" y="110.95" text-anchor="middle">3-jaw chuck,</text><text x="89.08" y="126.95" text-anchor="middle">jaws on bar Ø{{process.stock_dia_in:.3dot}}</text><text x="279.91" y="126.95" text-anchor="middle">turn Ø{{cad.outer_dia_min_in:.3dot}}–{{cad.outer_dia_max_in:.3dot}}</text><text x="458.37" y="78.95" text-anchor="middle">tailstock, in turn:</text><text x="458.37" y="94.95" text-anchor="middle">centre drill</text><text x="458.37" y="110.95" text-anchor="middle">drill under the reamer</text><text x="458.37" y="126.95" text-anchor="middle">ream Ø.126, the .1260 reamer</text><text x="229.36" y="473.8" text-anchor="middle">parting blade:</text><text x="229.36" y="489.8" text-anchor="middle">part off</text><text x="355.04" y="473.8" text-anchor="middle">chamfer:</text><text x="355.04" y="489.8" text-anchor="middle">{{cad.chamfer_datum_leg_max_in:.3dot}} max × 45°</text><text x="472.6" y="473.8" text-anchor="middle">face the end</text><text x="472.6" y="489.8" text-anchor="middle">to Z0</text></g><g class="label-on-clamp" fill="#fff" /><g class="label-halo" fill="#111" stroke="#fff" stroke-width="4" paint-order="stroke" /><g class="datum-label" fill="#b22" font-weight="bold" /><g class="title" fill="#555" font-style="italic"><text x="20" y="24">Bar in the chuck, seen from the operator's side</text></g></svg>
