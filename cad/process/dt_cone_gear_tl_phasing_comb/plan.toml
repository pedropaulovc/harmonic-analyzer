[[setups.operations]]
instruction = "Plate out of the vise, on the bench. No solvent soak: the comb comes off by peeling. Waste first: slide a thin blade (single-edge razor or .010 feeler) flat under the plate's tape at the waste's front edge, work it along, and peel the waste off with its tape, its tongue drawn out of the U's slot."
feed = "hand"

[[setups.operations]]
instruction = "The comb: slide the blade flat under the plate's tape at the comb's back edge (the stepped arm's) and work it along the whole length a little at a time, then under the spring arm from the closed end toward the open end, so the tape, not the comb, bends. Never lever the comb up from one end; never lift it by an edge or an arm while any tape still holds it."
feed = "hand"

[[setups.operations]]
instruction = "Lay the comb tape-up on the plate's bare top in front of its tape (about 2.2 in wide, along the edge that faced the moving jaw), hold it down flat with the other hand close to the peel line, and peel its tape back on itself, low and slow, along its length from the closed end toward the open end."
feed = "hand"

[[setups.operations]]
instruction = "Any CA spot on the comb or the plate: acetone on a rag (acetone softens CA). Tape adhesive film: isopropyl alcohol. Peel the plate's tape and wipe the plate."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "stone"
drilling = "none"
sizing = "other"
instruction = "Rub each face of the comb flat on the 320-grit face of the two-grit sharpening stone to take the cut's burr off; break the edges R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max with the smooth file, every edge, the blade steps' corners included."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "check", text = "The comb lies flat on the bare plate top: no arm rocks or stands up when pressed at its end, and no light shows under either arm along its length." },
  { kind = "stop", text = "An arm stands up: press it flat between thumb and plate and check again; then check its grip span and spring width below." },
]
feed = "hand"

[[setups.operations]]
instruction = "Measure the U with calipers: the setup's first three inspection lines."
feed = "hand"

[[setups.operations]]
instruction = "Measure the blade steps with calipers: each riser from the open end along the stepped arm; each level's depth as the stepped arm's width at that level less its width at the MHA-DT-03-T030 seat (the seat line is the stepped arm's inner edge at the open end): the setup's last two inspection lines."
feed = "hand"

[[setups.operations]]
instruction = "Any size out of its band: scrap the comb (no rework on a cut sheet part); cut another from the rest of the sheet by repeating Setups 1 to 3. Bag the comb with its number (FINISH: as cut)."
feed = "hand"
