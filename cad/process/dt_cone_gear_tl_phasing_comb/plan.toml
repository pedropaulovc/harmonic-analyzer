# Cone tip gears' phasing comb MHA-DT-03-TL-02, one off (shop tooling for
# MHA-DT-00; owner ruling 2026-11-13: cut to shape from one sheet; #2734: one
# flat U of .020 half-hard brass, as bought). Route chosen for speed: the U's
# blade staircase, its .557 grip and its full-R slot hold .XXX and .XX bands
# a hand-sawn and filed .020 sheet would take hours to reach, so the outline
# is cut on the CNC mill in one file.
#
# Setup 1 at the bench: mike the sheet, snip a 4.25 x 1.50 blank from a
# corner and file its burrs off so it lies flat. Setup 2 on the PM-30MV: the
# spoil plate (fixtures.sheet-spoil-plate, a plain 6 x 5 x 1/2 6061 plate,
# made from owned bar) on 1 in parallels across the vise jaws, its back edge
# on the fixed jaw; the blank bonded to its top on blue painter's tape on the
# plate and on the blank with CA glue between (owner 2026-11-23). G54: X0
# the plate's left end, Y0 the fixed jaw's face, Z0 the plate top. CB01_outline
# (cam:dt_cone_gear_tl_phasing_comb) brings the 1/32 downcut end mill in through
# the blank's margin and round the U at the finished size, three equal levels,
# the last with its tip .004 into the spoil plate: the comb comes free of the
# blank. Setup 3 at the
# bench frees the comb from the tape, deburrs and inspects it (FINISH: as cut).
#
# Cutter: the 1/32 Harvey 896231 downcut bought for MHA-PD-03 (shop
# common.toml tools.endmill-carbide-3fl-1-32-downcut), not a 1/16 downcut
# bought for this comb alone (tool audit 2026-11-23, endmill-carbide-3fl-1-16-
# downcut: "Cut the comb with the 1/32 in Harvey 896231 downcut already
# bought (x2) for MHA-PD-03, at its recorded maker chip load ... drop the 1/16
# downcut"). Same downcut series, so the arms are still pushed onto the tape.
# The blanking cuts stay with the snips: the audit's junior-hacksaw route
# needs the .020 sheet sandwiched between scrap boards no shop record holds,
# and its 4.25 in cut is a stopped cut 1.50 in from the edge of the 12 in
# sheet, which the bench vise cannot sandwich along its length.
#
# To order: the .020 sheet (stock-to-order.toml c260-h02-sheet-020-12x12),
# the 1/32 carbide downcut end mill (tools-special-cutters.toml
# endmill-carbide-3fl-1-32-downcut, Harvey Tool 896231, on MHA-PD-03's order)
# and straight-cut aviation snips (tools-hand.toml aviation-snips-straight).
# The spoil plate is to make from owned stock. On hand: the blue tape, the CA
# glue and its accelerator (consumables.toml hold-painters-tape-ca).
title = "Cone Tip Gear Phasing Comb"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C26000 cartridge brass, half hard (H02), .020 sheet"
material_key = "c260-h02"
milling_material = "brass"
stock = "Qty {{process.quantity:g}}. C26000 H02 brass sheet, .020 x 12 x 12 in (to order, not on hand); the comb takes one {{process.blank_length_in:.2dot}} x {{process.blank_width_in:.2dot}} in blank snipped from a corner."
shop = "../shop"
stock_refs = ["c260-h02-sheet-020-12x12"]

# The shop's standing page carries what every traveler shares (units,
# homing, Feed Hold, tool changes, proving a file); the setups print the
# route and the run op the dry cut.
standing = true

[cad]
file = "../../out/features/dt_cone_gear_tl_phasing_comb/features.toml"
adapter = "flat_bar"
part = "dt-cone-gear-tl-phasing-comb"

[parameters]
quantity = 1
# The comb's length runs along model X, its height along Y, the sheet's
# thickness along Z.
blank_length_axis = 0
blank_thickness_axis = 2
# The blank: the comb's 3.65 x .90 (the north end's length from the south
# end; the back's height from the far edge) with blank_margin_mm all round.
# The recipe (cam.py) recomputes both and refuses a disagreement.
blank_length_in = 4.25
blank_width_in = 1.5
blank_thickness_in = 0.02
blank_length_mm = 107.95
blank_width_mm = 38.1
# .30 in margin: the cutter plus blank_edge_error_mm, the blank's
# placement by steel rule and a snipped edge's wander (the author's 1/8 in,
# no source), stays inside the blank (sized for the 1/16 cutter first; the
# 1/32 needs less and the blank is kept).
blank_margin_mm = 7.62
blank_edge_error_mm = 3.175
# The blank's place on the plate: its left end and its back edge 1/2 in in
# from the plate's left end and back edge (steel rule), so the comb's south
# end and back edge stand at these work X and Y.
blank_left_x_mm = 12.7
blank_back_y_mm = 12.7
comb_south_x_mm = 20.32
comb_back_y_mm = -20.32
# The comb's U along the blank (traverse) and the plate under it, both in the
# blank's own X from its left end (the beam checks).
outline_from_x_mm = 7.62
outline_to_x_mm = 100.33
plate_from_x_mm = -12.7
plate_to_x_mm = 139.7
# The spoil plate (fixtures.sheet-spoil-plate): the 1/2 x 6 in bar's 6 in
# width along the jaws, its sawn 5 in length across them.
plate_length_mm = 152.4
plate_width_mm = 127.0
plate_thickness_mm = 12.7
# The hold (owner 2026-11-23, R1: "for tape isnt it possible to use blue
# painters tape on both sides and ca glue between them"): ScotchBlue 2090
# blue painter's tape on the plate and on the blank's underside, GH1200
# thick CA glue between. The stack and its band are the shop record's
# (consumables.hold-painters-tape-ca: .011 nominal, .009-.013), proved on
# the mill before the cut (Setup 2's stack check).
tape_stack_mm = 0.28
tape_stack_min_mm = 0.23
tape_stack_max_mm = 0.33
# Its strengths are the stresses accepted for the hold, used as written (R2:
# "it is widely used in industry with much heavier requirements; take it as
# given it will work"; the figure set by the planner as the owner delegated,
# the same record's accepted_shear_kpa and accepted_tensile_kpa: 0.6 MPa, a
# cap as well as an envelope). The operator proves the bond by a push test.
bond_accepted_shear_mpa = 0.6
bond_accepted_tensile_mpa = 0.6
# The two pieces the cut leaves on the tape: the comb's U (the outline's
# area) and the rest of the blank round it (the recipe recomputes both).
comb_bond_area_mm2 = 1010.43
waste_bond_area_mm2 = 3102.466
# The blank's whole face on the tape before the cut (length × width), and
# the comb's narrowest arm, the spring arm's .09 (the far edge's
# spring_width): the width the cut's lift is judged on.
blank_area_mm2 = 4112.895
comb_spring_width_mm = 2.286
# The cutter's tip .004 in into the spoil plate (Z0 its bare top beside the
# tape): the plate is a spoil plate, unfaced, and its mill-finish top, the
# feeler touch-off and the tape stack all vary, so the tip goes past the
# stack instead of stopping in it. Z0 is the plate top, so on every stack
# the tip stands .004 into the plate, no deeper than spoil_cut_max_mm; the
# recipe requires it at least through_margin_min_mm below the sheet's
# underside on the thinnest stack (.009). The depth runs from the thickest
# sheet's top on the nominal stack (.011 + .022) to the tip, in level_count
# equal levels, the fewest with each at most level_depth_max_fraction of
# the cutter's diameter; on the thickest stack (.013) the first level takes
# .002 more, .0143, still under .5 x D (.0155): the recipe checks it.
# Levels (R3: "no need to bring to me ; make coarser as you see fit"): the
# bond does not set them. The binding limit is the cutter maker's: Harvey
# Tool's slotting depth for the series (SF_896200, read 2026-11-22: axial
# .5 x D), never exceeded (delegated ruling 2026-11-22: never above the
# maker's published figure), as MHA-PD-03's plan cuts with the same cutter.
# .9404 / (.5 × .7874) = 2.39, so 3 levels of .3135 mm (.0123 in), where the
# .006 tape took 3 of .2701; MHA-PD-03 runs .3238 mm levels by the same
# rule in the same cutter and brass. The 0.6 MPa bond cap does not bind: the cut
# asks .026 MPa in shear of the comb (the smallest piece, 1010 mm²) and no
# tension (a downcut).
outline_tip_z_mm = -0.1016
outline_tip_into_plate_mm = 0.1016
through_margin_min_mm = 0.2
spoil_cut_max_mm = 0.254
outline_depth_mm = 0.9404
level_depth_max_fraction = 0.5
level_count = 3
level_depth_mm = 0.31347
# The 1/32 end mill (shop tools.endmill-carbide-3fl-1-32-downcut
# diameter_mm; the recipe checks it).
outline_cutter_dia_mm = 0.7874
# The title block's INSIDE CORNERS R.040 MAX (cad/config/title_block.yaml
# in.inside_corner.radius_in): the cutter's radius must not exceed it.
inside_corner_max_mm = 1.016
# Machine-capacity inputs (mm): heights above the mill table, tool lengths
# from spindle nose to tip.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
parallel_height_mm = 25.4        # 1 in parallels (shop-equipment fixtures.parallels-lms-6745).
# The jaw tops above the plate top: jaw height − parallels − plate (recomputed).
jaw_top_over_plate_mm = 6.8453
# The plate's ends inside the jaws' width, centred: no overhang either side.
plate_overhang_mm = 0.0
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm (as the base-bar plan).
# The 1/32 end mill on its 1/8 shank, 1-1/2 in overall: 3/4 to 1 in out of
# the 1/8 collet, so the collet's nose stays above the jaw tops at the cut
# (the recipe checks the least), at least 1/2 in of shank held.
em_thirtysecond_projection_min_mm = 19.05
em_thirtysecond_projection_max_mm = 25.4

[[tools]]
id = "snips"
name = "Aviation snips, straight cut"
ref = "aviation-snips-straight"

[[tools]]
id = "file"
name = "8 in smooth file"
ref = "jig-files"

[[tools]]
id = "plate"
name = "Spoil plate"
ref = "sheet-spoil-plate"
description = "Spoil plate 6 x 5 x 1/2 in 6061, made beforehand: a 5 in length sawn off the owned 1/2 x 6 in bar, sawn ends deburred, top as supplied"

[[tools]]
id = "tape"
name = "Blue painter's tape"
ref = "tape-scotchblue-2090"
description = "ScotchBlue Original Multi-Surface 2090 painter's tape, 1.41 in wide: on the plate and on the blank's underside"

[[tools]]
id = "glue"
name = "CA glue, thick"
ref = "ca-glue-gh1200"
description = "GH1200 CA super glue, the 1500 cps thick bottle: the bead between the plate's tape and the blank's tape"

[[tools]]
id = "accelerator"
name = "CA accelerator"
ref = "ca-accelerator-starbond"
description = "Starbond CA glue accelerator spray: misted on the blank's tape so the glue sets at once"

[[tools]]
id = "em-thirtysecond"
name = "1/32 in carbide downcut end mill"
ref = "endmill-carbide-3fl-1-32-downcut"
# Harvey Tool 896231: 3 left-hand spiral, right-hand cut flutes, "prevents
# lifting of workpiece" (harveytool.com family page, read 2026-11-22): its
# helix pushes the comb's narrow arms onto the tape.
axial_direction = "down"

# Owned two-grit stone in place of the India stone (tool audit 2026-11-23,
# level 0, india-stone-ib8: the comb's 4.25 x 1.50 lies inside the stone's
# 6 x 2 face; an India stone is aluminium oxide, as is its 320-grit face).
[[tools]]
id = "stone"
name = "Two-grit sharpening stone (320 face)"
ref = "sharpening-stone-two-grit"

[[setups]]
machine_kind = "other"
title = "Bench: check the sheet, snip the blank"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/blank.svg", alt = "The 12 x 12 sheet with the 4.25 x 1.50 blank marked in one corner: two snip cuts, the blank's edges filed." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mike the sheet as it arrives, 1 in in from two edges."
inspection = "Both readings {{cad.top_stock_thickness_min_in:.3dot}}–{{cad.top_stock_thickness_max_in:.3dot}}, else stop: it is not the .020 sheet."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.top_stock_thickness_band_mm}}" }]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "snips"
drilling = "none"
sizing = "other"
instruction = "Mark a {{process.blank_length_in:.2dot}} x {{process.blank_width_in:.2dot}} in blank in one corner of the sheet with a scriber and rule, its two outer edges the sheet's own edges. Snip along the two lines, the snips' flat blade on the blank's side so the curl goes into the sheet, not the blank."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Lay the blank on the spoil plate: press any curl at the snipped edges flat with a thumb, then file the burr off both snipped edges, the file flat on the plate's top, so the blank lies flat on the tape." },
  { kind = "check", text = "The blank lies flat on the plate: no edge rocks or stands up when pressed." },
  { kind = "stop", text = "An edge still stands up: snip a new blank from the sheet and try again (a strip snipped off this one would eat the margin the cutter needs)." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "CNC mill: bond the blank to the spoil plate; cut the comb out"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Spoil plate on 1 in parallels across the vise jaws, its back edge on the fixed jaw, centred along the jaws: the jaw tops stand {{process.jaw_top_over_plate_mm:in.3dot}} above the plate top, room for the edge finder's touch. The blank bonded to its top under its whole face: blue tape on the plate, CA glue, blue tape on the blank (stack {{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}), its left end and back edge {{process.blank_left_x_mm:in.2dot}} in from the plate's left end and back edge."
datum = "Program CB01_outline. G54: X0 the plate's left end, Y0 the fixed jaw's face (the plate's back edge), Z0 the plate top, bare right of the tape; the file works {{process.tape_stack_mm:in.3dot}} above it for the tape stack, its last level {{process.outline_tip_into_plate_mm:in.3dot}} into the plate on any stack; +Y toward the fixed jaw. The comb's open end stands at X {{process.comb_south_x_mm:in.3dot}}, its back edge (the stepped arm's, toward the fixed jaw) at Y {{process.comb_back_y_mm:in.3dot}}. After homing again (the standing page says when): check that the blank has not moved or lifted on its bond. One off, the blank moved, or the plate moved in the vise: stop and tell the owner."
diagram = { file = "diagrams/outline.svg", alt = "Plan of the spoil plate in the vise: the plate's blue tape, two strips along X from its left end to 5 in, and on it the blank near the fixed jaw and the plate's left end; dashed, the tape seams along X, the plate's under the U's slot and the blank's in its back margin; the comb's U drawn inside the blank with its open end left and its stepped arm toward the fixed jaw; the 1/32 end mill's path runs round the U once per level, starting and ending at the middle of the spring arm's front edge (toward the moving jaw)." }
# Top: the thickest sheet on the thickest tape stack; deepest: the cutter's
# tip, .004 into the spoil plate.
envelope = { x_span_mm = ["{{process.blank_length_mm}}", "{{process.blank_left_x_mm}}"], y_span_mm = ["{{process.blank_width_mm}}", "{{process.blank_back_y_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.tape_stack_max_mm}}", "{{cad.top_stock_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.plate_thickness_mm}}", "{{process.outline_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_thirtysecond_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.em_thirtysecond_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", grips = "plate", across_jaws_mm = "{{process.plate_width_mm}}", along_jaws_mm = "{{process.plate_length_mm}}", part_height_mm = "{{process.plate_thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{process.plate_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" }
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "blank", kind = "part", area_mm2 = "{{process.blank_area_mm2}}", width_mm = "{{process.blank_width_mm}}" }] } }

[[setups.operations]]
instruction = "Spoil plate on the 1 in parallels across the jaws, its back edge on the fixed jaw, centred along the jaws; close the vise and tap the plate down onto the parallels."
feed = "hand"

[[setups.operations]]
instruction = "G54 X0 the plate's left end, Y0 the fixed jaw's face: edge finder (900 rpm)."
instruction_detailed = "Edge finder (900 rpm). Y: its tip .10 below the jaw top, on the fixed jaw's face from the plate's side (−Y), G10 L20 P1 Y-2.540. X: its tip .10 below the plate top, on the plate's left end from the left, G10 L20 P1 X-2.540. Edge finder out."
feed = "hand"

[[setups.operations]]
instruction = "Mike the blank 1/4 in in from its front edge at three spots: 1/2 in in from each end and at the middle. Write the three readings down in mm (in × 25.4): op 140 subtracts each from its Z reading to find the tape stack there."
feed = "hand"

[[setups.operations]]
instruction = "Clean: degrease the plate top and the blank's underside with isopropyl alcohol on a clean rag; wipe both dry with a fresh rag."
feed = "hand"

# R1 (the hold): seams along the long cuts (X); the blank's seam offset from
# the plate's by .82 in, so no cut line and no freed piece rides on a seam
# of both layers: the plate's runs inside the U's slot (the waste tongue),
# the blank's in its back margin.
[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
instruction = "Tape the plate: two strips of the blue tape (1.41 in wide) along the jaws, each from the plate's left end (trimmed flush) to 5.0 in, 1/4 in past the blank's right end. The first flush with the plate's back edge (fixed jaw), the second butted to it: edges never overlapped, no gap over 1/32. Seam 1.41 in from the fixed jaw. The plate right of 5.0 in stays bare."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tape"
drilling = "none"
sizing = "other"
instruction = "Tape the blank's whole underside: two strips along its length, butted, never overlapped, the first flush with its front edge, the second over the .09 in left at its back edge. Trim both flush with its edges and ends with a knife. Its seam lies .09 in from its back edge: on the plate, .82 in off the plate's seam."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Burnish both tapes down hard with the round back of a screwdriver handle: every strip, edges included. No bubble or lifted edge." },
  { kind = "action", text = "With a marker and a steel rule, mark the blank's place on the plate's tape: its left end {{process.blank_left_x_mm:in.2dot}} in from the plate's left end, its back edge {{process.blank_back_y_mm:in.2dot}} in from the plate's back edge." },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "glue"
drilling = "none"
sizing = "other"
steps = [
  { kind = "action", text = "Glue: thick CA on the plate's tape inside the marked place, a zigzag bead about 1/16 wide, lines about 3/4 in apart, kept 1/4 in inside the marks: about 6 in of bead, .4 sq in. No glue on bare metal." },
  { kind = "action", text = "Mist the accelerator on the blank's tape (the face with no glue), two or three sprays." },
]
feed = "hand"

[[setups.operations]]
instruction = "Press, within about 10 seconds of the spray (the glue grabs at once; the blank cannot be slid after): lower the blank, tape down, its left end and back edge on the marks. Press it down over its whole face with a flat block for 1 minute. Then wait 5 minutes."
feed = "hand"

[[setups.operations]]
instruction = "Console M6 T1 (1/32 in end mill, {{process.em_thirtysecond_projection_min_mm:in.2dot}}–{{process.em_thirtysecond_projection_max_mm:in.2dot}} out of the collet). Spindle stopped, its tip just dragging a .002 feeler leaf on the bare plate top right of the tape: G10 L20 P1 Z0.051 (mm: .002 in)."
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Check, stack: spindle stopped, the tip dragging the same leaf on the blank's top at op 60's three spots; read Z (mm). Stack = reading − 0.051 (the leaf) − that spot's op 60 thickness." },
  { kind = "check", text = "Every stack {{process.tape_stack_min_mm:.2f}}–{{process.tape_stack_max_mm:.2f}} mm ({{process.tape_stack_min_mm:in.3dot}}–{{process.tape_stack_max_mm:in.3dot}}); the two ends within 0.05 mm (.002) of each other." },
  { kind = "stop", text = "Outside the band or ends differing more: Z up, plate left in the vise (G54 stands); free the blank as ops 190–200 free the comb, peel the plate's tape; ops 70–120, then this op again." },
]
feed = "hand"

[[setups.operations]]
steps = [
  { kind = "action", text = "Check, push test: jog Z up 1 in clear. With the heel of the hand push the blank hard along and across; try to lift each corner with a thumbnail." },
  { kind = "check", text = "No movement, no creak, no lifted corner." },
  { kind = "stop", text = "Any movement: the plate left in the vise, free the blank as ops 190–200 free the comb, peel the plate's tape, then ops 70–120 and ops 140–150 again." },
]
feed = "hand"

# Three levels, each one pass at the finished size, entered from the air
# through the blank's margin and left back out the same way. The last level
# cuts through both tapes and the glue, so the comb and the waste each stay
# on their own island of tape.
[[setups.operations]]
speed_kind = "spindle"
tool = "em-thirtysecond"
drilling = "none"
sizing = "other"
instruction = "Run CB01_outline (M6 T1: set 2800; about 19 min): in through the margin, round the U anticlockwise at size and out, {{process.level_count:g}} times, each {{process.level_depth_mm:in.4dot}} deeper, the last {{process.outline_tip_into_plate_mm:in.3dot}} into the plate. Dry: a light air blast from a nozzle held well clear of the spindle, hands off the work; no coolant or water (paper tape soaks and lets go)."
settings = "endmill-carbide-3fl-1-32-downcut-c260"
beam = { axis = "x", hold = "plate", extent_mm = [0, "{{process.blank_length_mm}}"], seat = "spoil plate", seat_mm = ["{{process.plate_from_x_mm}}", "{{process.plate_to_x_mm}}"], bond = { shear_mpa = "{{process.bond_accepted_shear_mpa}}", tensile_mpa = "{{process.bond_accepted_tensile_mpa}}", accepted_by = "the shop owner", pieces = [{ name = "comb", kind = "part", area_mm2 = "{{process.comb_bond_area_mm2}}", width_mm = "{{process.comb_spring_width_mm}}" }, { name = "waste", kind = "waste", area_mm2 = "{{process.waste_bond_area_mm2}}" }] } }
milling_cuts = [
  { name = "outline", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.outline_cutter_dia_mm}}", axial_doc_mm = "{{process.level_depth_mm}}", radial_woc_mm = "{{process.outline_cutter_dia_mm}}", traverse_mm = ["{{process.outline_from_x_mm}}", "{{process.outline_to_x_mm}}"] },
]

# CA softens with heat (the brief's cut caution): the remedy stops the feed
# and waits for the blank to cool; the standing page's Feed Hold row reruns
# the file.
[[setups.operations]]
steps = [
  { kind = "action", text = "CA softens with heat; never touch the work while CB01_outline runs." },
  { kind = "stop", text = "The cut smokes or smells hot: Feed Hold; jog Z up clear and wait until the blank is cool to a finger." },
]
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Bench: free the comb, deburr, inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished comb: the U's length and height, the spring arm's width and grip span under the seat line, the slot's length to its full R, and the four blade starts from the open end and depths under the seat line with the last level's end." }
