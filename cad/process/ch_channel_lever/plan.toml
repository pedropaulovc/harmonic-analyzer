[[setups.operations]]
instruction = "Back to the collet (console M6 T1). Brush the spoil plate clean and stone its top flat round the drilled hub and hole stations with the India stone; check it with the 6 in rule as on the bench. The plate still against the fixed jaw and the moving parallel still under its milled edge (moved: slide it back flush). Clamp the next four flush on it, pick up X0 again and repeat this setup from CL01_face_b, skipping the first-load-only ops (the Z0 correction is never repeated): Y and Z0 stay."
feed = "hand"

