[[setups]]
machine_kind = "other"
title = "Saw and mic the blanks; the spoil plate"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "A 72 in length of the 5/16 x 1 in flat marked into nine 7.75 in blanks with kerfs between; beside it the 5/8 x 4 in aluminium flat with a 6 in piece marked off its end." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blanks at least {{process.blank_length_in:.2f}} long, aiming at 7.78: nine from each of the two 72 in lengths and two from the 36 in, each marked off with the tape. File the burrs off both ends."
feed = "hand"
inspection = "Each blank at least {{process.blank_length_in:.2f}} long (the tape): the 7.29 lever centred in it with .23 at each end for its frame and the X0 pick-up. Nine must come from each 72 in length, so none is over {{process.blank_length_max_in:.2f}} (9 × 7.81 + 8 × .125 kerf = 71.3). Shorter: saw another."
gauge_checks = "other"

[[setups.operations]]
instruction = "Mic each blank's thickness at both ends and the middle, and its width at the middle. Mark one wide face A with marking fluid along its length; the other is B. Number the blanks 1–{{process.quantity:d}} on A at one end, the left end in every setup, and write each blank's width (to .0001) beside its number. Keep the blanks in loads of four: 1–4, 5–8 and so on."
inspection = "Every thickness reading {{process.blank_thickness_min_mm:in.4dot}}–{{process.blank_thickness_max_mm:in.4dot}}: this traveler's incoming-stock gate (the drawing's hub is {{cad.hub_far_face_length_min_in:.4dot}}–{{cad.hub_far_face_length_max_in:.4dot}}, faced from B). Width .9960–1.0020: this traveler's gate, which keeps the pockets' 1 mm wall at the blank's sides (Setup 3 corrects Y for each load's total width). Outside either: set the blank aside and tell the owner."
gauge_checks = [
  { gauge = "micrometers", band_mm = ["{{process.blank_thickness_min_mm}}", "{{process.blank_thickness_max_mm}}"] },
  { gauge = "micrometers", band_mm = ["{{process.blank_width_min_mm}}", "{{process.blank_width_max_mm}}"] },
]

[[setups.operations]]
speed_kind = "other"
tool = "cutoff-saw"
drilling = "none"
sizing = "other"
instruction = "Every lot (the 20 blanks): saw a new 6 in piece off the end of the 5/8 x 4 in 6061 flat (the spoil plate, 6 x 4 in); the last lot's plate is drilled and ringed and is not reused. File its burrs and mark one 4 in end LEFT: the spoil plate runs 6 in along X and 4 in across the jaws. Setup 2 mills one long edge and faces its top, once each, before the first load."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Side B: face, pocket, bore and holes"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The parallel set's 15/16 in pair on the bed of the 6 in PM vise (shop vise-pm-6), one against each jaw; the spoil plate on them, faced side up, 6 in along X, its LEFT end to the left and its as-bought long edge against the fixed jaw, as the plate ops below leave it (it stays there for every load; brush it clean of chips and burrs before each load). The parallels stand loose: when the vise opens, the moving one stays under the plate's milled edge, where clamping the plate alone left it. The jaws' top stands .237–.260 above the spoil plate's top (checked below): it grips most of each .3085–.3125 blank and stays at least .040 under the faced B face (.3005), so the T1 1/2 in end mill passes over the jaws when it faces B. Four blanks of one load side by side across the jaws on the spoil plate, each on its A face (B up), numbers to the left, the lowest number against the fixed jaw. Flush the left ends with a 1-2-3 block's 3 in edge set twice, overlapping (across blanks 1–3 and the spoil plate's left edge, then across blanks 2–4), and feel that all four ends are flush; then close the vise on the blanks, tapping them down onto the spoil plate. The jaws grip the blanks only: the plate, 3.940–3.960 wide, is under the narrowest load (3.984), so the blank against the moving jaw stands .024–.068 past its milled edge."
datum = "Programs CL01_face_b (T1), CL02_pocket_b (T1, T2), CL03_bore (T3, T6, T7), CL04_holes (T3, T4, T5). G54: X0 the left end of the blank against the fixed jaw (picked up on every load), Y0 the fixed jaw's face, Z0 the spoil plate's top. +X toward the blanks' right ends, +Y toward the fixed jaw: the blanks lie at −Y."
diagram = { file = "diagrams/side_b.svg", alt = "Four blanks across the vise jaws on the spoil plate, B up, still whole rectangles (the outline comes in Setup 4); what this setup cuts is hatched: B faced all over, each blank's 1/2 in slot along its centre line from past the right end to the hub with its arc round the hub at ±25°, the two 1/8 in rings round the hub at ±55°, then the bore at the hub and the pin and spring holes on the centre line. A 2.5 x detail shows one hub. A section across the jaws shows what rests on what: the 15/16 in parallels on the vise bed, one against each jaw; the 5/8 in plate faced to .583 on them, against the fixed jaw, its milled edge short of the moving jaw; the blanks on the plate, gripped by the jaws, whose top stands .237–.260 above the plate; T1 facing B over the moving jaw." }
envelope = { x_span_mm = ["{{process.blank_length_max_mm}}", "{{process.face_cutter_dia_mm}}", "{{process.face_cutter_dia_mm}}", 5.08], y_span_mm = [101.6, 1.0], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.blank_thickness_max_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.support_height_mm}}", "{{process.drill_f_tip_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.drill_f_oal_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.eighth_mill_projection_min_mm}}"] }
