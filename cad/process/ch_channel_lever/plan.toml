[[setups.operations]]
instruction = "Every lot, before the first load: console M6 T1. Mill one long edge of the new spoil plate, stood on edge in the vise, so the plate is 3.940–3.960 wide."
instruction_detailed = "Every lot, before the first load. Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it). Calipers across the new spoil plate's width at its LEFT end: W. Stand the plate on one long edge on the parallel set's 5/32 in shim pair, one against each jaw, its two faces in the jaws, LEFT end to the left; tap it down onto both while closing the vise (the jaws grip the lower 1.61 of its 4 in). Set 2650. Spindle stopped, touch the T1 tip on the top edge at the LEFT end over a .002 feeler leaf; then jog Z down .002 plus (W − 3.950) and take the top edge along X by hand jog in two overlapping passes across its 5/8 thickness, the cutter running off both ends: the plate is then 3.950 wide."
feed = "hand"

[[setups.operations]]
instruction = "Every lot: open the vise and lift the plate out; its width."
inspection = "3.940–3.960 (the calipers across the plate, at both ends and the middle): under the narrowest load (3.984), so the jaws grip the blanks and never the plate, and at least .057 onto the 1/8 in moving parallel on the widest (4.008). Over 3.960: stand it back on the shim pair as in the op before, touch the top edge at the LEFT end again, jog down .002 plus (the LEFT-end reading − 3.950), take the edge again and recheck. Under 3.940: saw a new plate and start again from the op before."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.spoil_plate_width_min_mm}}", "{{process.spoil_plate_width_max_mm}}"] }]

[[setups.operations]]
instruction = "Every lot: face the spoil plate's top alone to .583 on the 1 in and 1/2 in pairs stacked, its top above the jaws."
instruction_detailed = "Every lot. Take the shim pair out. Stack the set's 1 in pair on its 1/2 in pair, one stack against each jaw (1.5 in), the stacks centred along the jaws. Lay the plate flat on them, centred along them (its ends about 1 in past the 4 in stacks), its milled edge toward the moving jaw, LEFT end to the left; tap it down onto both stacks while closing the vise on the plate alone: the jaws grip the lower .27 of its edges and its top stands about .36 above them. Mic it at both ends (the anvil under the plate's end, past the stacks' ends): T, the thicker reading. Spindle stopped, touch the T1 tip on the plate's top over a .002 feeler leaf at the end that read T; then jog Z down .002 plus (T − .583) and face the whole top at 2650 by hand jog in overlapping passes along X at most .4 apart, the cutter running off both ends and over both jaws' tops, so it leaves no lip at the edges. More than .050 to take off: two levels."
feed = "hand"

[[setups.operations]]
instruction = "Every lot, still clamped: the spoil plate's thickness after facing."
inspection = ".578–.588 (the micrometers at both ends, the anvil under the plate's end): on the 15/16 in pair this puts the jaws' top .244–.254 above it. Over .588: jog down the excess and face again. Under .578: saw a new plate and start again from the width op."
gauge_checks = [{ gauge = "micrometers", band_mm = ["{{process.spoil_plate_thickness_min_mm}}", "{{process.spoil_plate_thickness_max_mm}}"] }]

[[setups.operations]]
instruction = "Open the vise and lift the plate out; take the stacks out. File the burr off the plate's four top edges with light strokes, never below the faced top."
feed = "hand"

[[setups.operations]]
instruction = "Every lot, the plate on the bench: its faced top after filing."
inspection = "A 6 in rule laid across the faced top at both ends and the middle: no rock, no burr or edge standing proud. Fail: file the proud edge again and recheck."
gauge_checks = "other"

[[setups.operations]]
instruction = "Every lot: the 15/16 in pair (4 in long) on the vise bed, one against each jaw, both wiped clean, their left ends at the jaws' left side, under the hubs' end of the load; the plate on them, faced side up, its as-bought long edge against the fixed jaw and its LEFT end .75 out past the jaws' left side (the blanks flushed with that end then sit centred in the jaws). Tap it down while closing the vise on the plate alone."
feed = "hand"

[[setups.operations]]
instruction = "Every lot, the plate clamped alone on the 15/16 in pair: the jaws' top above its top."
inspection = "Jaws' top .237–.260 above the spoil plate's top (the calipers' depth rod, its end on the plate beside each jaw, near the jaws' left side and near the plate's right end; the plate touches both jaws): .237 grips the blanks the shop's 6 mm minimum; .260 keeps the jaws .040 under the faced B face (.3005). A plate faced to .583 reads about .249. Outside the band, or the four readings spread more than .002: open the vise, lift the plate, wipe the parallels, the vise bed and the plate's underside of chips, set it back, clamp it alone and check again. Still outside: check the parallels are the 15/16 in pair and mic the plate again (.578–.588); both right: stop and tell the owner."
gauge_checks = [{ gauge = "calipers", band_mm = ["{{process.jaw_top_min_mm}}", "{{process.jaw_top_max_mm}}"] }]

[[setups.operations]]
instruction = "Open the vise a quarter turn, the jaws just off the plate: it stays on the parallels, the moving one under its milled edge (pushed out with the jaw: slide it back flush with that edge). Then G54 Z0 on the spoil plate's top with T1; the plate is not lifted again this lot."
instruction_detailed = "Open the vise a quarter turn, the jaws just off the plate: it stays on the parallels, the moving one under its milled edge (pushed out with the jaw: slide it back flush with that edge). Spindle stopped, the T1 tip just dragging a .002 feeler leaf on the spoil plate's top: G10 L20 P1 Z0.051. This Z0 stays for every load and both sides (the tool setter measures each M6, holder swaps included); from here on the spoil plate is not lifted, only brushed and stoned in place, and never clamped: the jaws close on the blanks."
feed = "hand"

[[setups.operations]]
instruction = "G54 Y0 the fixed jaw's face: edge finder (900 rpm), from the blanks' side. Send $# and note the G54 line's Y for Setup 3."
instruction_detailed = "Edge finder (900 rpm), its tip .10 below the jaw top, touched on the fixed jaw's face from the blanks' side (−Y): G10 L20 P1 Y-2.540. Send $# and write down the G54 line's Y: Setup 3 sets each load's Y from it."
feed = "hand"

[[setups.operations]]
instruction = "Every load: load four blanks as in Holding; G54 X0 the left end of the blank against the fixed jaw: edge finder (900 rpm), from the left."
instruction_detailed = "Load the four as in Holding. Edge finder (900 rpm), its tip .10 below the blanks' top, on the left end of the blank against the fixed jaw, from the left: G10 L20 P1 X-2.540."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CL01_face_b and CL02_pocket_b in air (this op covers those two files only), Z0 raised 1.000 in; every move clears the jaws. Then Z0 back."
instruction_detailed = "First load only: send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run CL01_face_b and CL02_pocket_b, watching each move clear the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Run CL01_face_b (M6 T1; set 2450: the display rests near 2485, not 2380): face B of all four blanks to {{process.hub_thickness_mm:in.4dot}} above the spoil plate in one level, zigzag rows along X at most {{process.face_stepover_max_mm:in.3dot}} apart, at most {{process.face_removal_max_mm:in.3dot}} deep."
settings = "em-half-carbide-1018-3439-face"
milling_cuts = [
  { name = "face b", kind = "end", phase = "finish", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", axial_doc_mm = "{{process.face_removal_max_mm}}", radial_woc_mm = "{{process.face_stepover_max_mm}}", traverse_mm = [0, "{{process.blank_length_min_mm}}"] },
]

[[setups.operations]]
instruction = "First load only: unclamp, lift out the blank against the fixed jaw (the load's lowest number), mic it near its left end, write the reading H on its A face beside its number, then put it back flush and clamp again."
inspection = "Hub thickness {{cad.hub_far_face_length_min_in:.4dot}}–{{cad.hub_far_face_length_max_in:.4dot}} (every blank is faced across its whole B face). In the band: straight on to CL02_pocket_b, skipping the next op. Over .3010: the next op. Under .3000: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.hub_far_face_length_band_mm}}" }]

[[setups.operations]]
instruction = "First load only, once, and only when the op before read over .3010: lower Z0 by the excess and run CL01_face_b again."
instruction_detailed = "Send $#, note the G54 line's Z, G10 L2 P1 Z(that Z − (the reading − {{process.hub_thickness_mm:in.4dot}}) × 25.4): a reading of .3015 lowers Z0 .0254 mm. Run CL01_face_b again. The corrected Z0 stays for CL02_pocket_b onward, for every later load and for side A."
feed = "hand"

[[setups.operations]]
instruction = "Only after the Z0 correction: unclamp, mic the same blank again near its left end, write this reading over H, put it back flush and clamp again."
inspection = "Hub thickness {{cad.hub_far_face_length_min_in:.4dot}}–{{cad.hub_far_face_length_max_in:.4dot}}: on to CL02_pocket_b. Still outside: stop and tell the owner."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.hub_far_face_length_band_mm}}" }]

