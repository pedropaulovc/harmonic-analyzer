]

[[setups]]
machine_kind = "other"
title = "Black oxide: blacken with Presto Black Steel PC9"
machine = "Bench, ventilated"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished lever, as inspected, to be blackened all over: the hub, the bar, the bore and the holes." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "The drawing's finish: {{cad.finish}}, all over (no masking). Done in the shop by cold blackening with Birchwood Presto Black Steel PC9 (owner ruling 2026-11-21: accepted as the drawing's black oxide), by its maker's instructions as below. To buy before this setup (none on record): the PC9, chemical-resistant gloves and safety glasses."
feed = "hand"

[[setups.operations]]
instruction = "Gloves and safety glasses on (the maker: it contains acid). Wash the levers with soap and water to take off the oil and the marker numbers; rinse and dry them. Hold each by its edges from here on."
feed = "hand"

[[setups.operations]]
instruction = "No sanding: the machined faces are fresh metal already (the maker's step 1), and the hub and web are at their final thickness. A rust spot or stain only: touch that spot lightly with the 220 roll, never on the hub faces. Wash again and dry."
feed = "hand"

[[setups.operations]]
instruction = "Mix the PC9 with water 1:1 in a plastic cup (the maker: 50–100% for brush-on). Brush it on every surface of each lever with even, light strokes, into the bore and the pin and spring holes; re-wet the brush and go over the edges, the holes and any light spot until the lever is an even black (the maker: do not press hard, it lifts the coating)."
feed = "hand"

[[setups.operations]]
instruction = "Rinse each lever thoroughly with clean water to stop the reaction (left acid keeps working and rusts the part); dry with a lint-free cloth or compressed air. Light spots: brush again, rinse, dry. Collect the solution and rinse water for a hazardous-waste drop-off, not the drain (the maker)."
feed = "hand"

[[setups.operations]]
instruction = "Seal: wipe on the stone lubricant (a light oil; the maker: clear coat, wax or oil), leave it a few minutes, wipe off the excess."
feed = "hand"
inspection = "Even black all over each lever, no bare spot and no wiping-off coating. Fit after blackening: the 1/4 in ground bar offcut still slides through the bore. Tight: stop and tell the owner; do not open the bore."
gauge_checks = "other"
