# Channel lever MHA-CH-02 (qty 20), routed for the CNC mill (owner ruling
# 2026-11-21: NC and travelers for every made part; the route is the
# author's, chosen for speed, the owner corrects it afterwards). Each lever is
# machined from a 7.75 in length of the bought 5/16 x 1 in 1018 CF flat
# (cad/config/parts/ch-channel-lever.yaml's process text): the hub's faces,
# the plate's two faces, the F-drilled fulcrum bore, the two drilled holes and
# the outline.
#
# Route: saw 20 blanks (nine from each of two 72 in bars, two from the 36 in)
# and mic them; saw a new 6 in spoil plate off the 5/8 x 4 in 6061 flat every
# lot. Setup 2 first mills the plate's width and faces it to .583; then, side
# B up, four blanks per load across the jaws on the spoil plate on the 15/16
# in parallels: face B to the hub's thickness (CL01); pocket B down
# to the plate's near face (CL02); spot, drill D, then F, the fulcrum bores
# (CL03); spot and drill the #47 pin holes and the #21 spring holes (CL04).
# Setup 3, turned over, side A up: pocket A down to the plate's far face
# (CL05). Setup 4, the same clamping: cut each lever's outline over the
# plate on seven tabs (CL06), then, on the same 1/8 in end mill, round each
# hub above and below the plate (CL07). Setup 5, bench: break the
# levers off their tabs, file the tab stubs, deburr, inspect. Setup 6: black
# oxide in the shop, Presto Black Steel PC9.
#
# Pockets: the 1/2 in end mill's slot along each lever's centre line, from
# past the blank's far end to the hub, and its arc round the hub; the 1/8 in
# end mill's two rings round the hub clear the roots the slot's arc cannot
# reach without cutting into the next blank. The roots' inside corners print
# 2X R.065 (.060-.070; owner ruling 2026-11-23, tool audit Q9: "Print a
# local corner limit R.065 (.060-.070), cut with the 1/8 end mill; no 5/64
# cutter"): the 1/8 in outline leaves its own R.0625 there.
#
# Workholding: the agent's recommendation (option A, the vise; owner's
# per-part choice pending, 2026-11-21). The blanks lie on a faced spoil plate
# cut from a 5/8 x 4 in 6061 flat (stock.6061-flat-5-8x4, to buy; delegated
# ruling D44, see Holding below), not a drawn fixture: the parallels alone
# would leave the two inner blanks unsupported. A switch to a plate fixture
# replaces only Setup 4 (CL06, CL07) and its holding.
#
# The fulcrum bore is drilled F, .257, at the title block's DRILLED HOLES row
# (owner ruling 2026-11-24, fit audit question 1, approved as recommended;
# the .2560 reamer and its Class ZZ pins are gone): the owned 115-piece
# index's F (tools.jig-drill-f) opens the D pilot, and a short offcut of the
# 1/4 in ground bar the shafts are cut from (stock 1018-ground-round-1-4)
# sliding through is the acceptance; the other holes as drilled. The
# drawing's finish, matte black oxide, oil
# sealed (all over, no masking), is done in the shop: delegated ruling
# 2026-11-21 (Main, owner review #2144, cnc rulings record; precedent: the
# owner's PC9 ruling below) drops MIL-DTL-13924 from the sheet, recorded
# beside the finish line in cad/config/parts/ch-channel-lever.yaml by #3318.
# Owner
# (Pedro), answered in person 2026-11-21: "Black oxide: cold blackening in
# the shop with Presto Black PC9 is acceptable as the drawing's black
# oxide." Setup 6 blackens the levers with Birchwood Presto Black Steel PC9
# by the maker's instructions (Presto Black Steel PC9 Instructions, steps 1
# prepare, 2b brush-on, 3 stop, 4 dry, 6 seal; cad/config/shop-equipment/
# consumables.presto-black-steel-pc9, which cites them); the PC9 and the
# gloves and glasses (consumables.chemical-gloves-eye-protection) are to
# buy (to_order).
#
# Zeroing: Z0 the spoil plate's bare top before the blanks go on, touched
# with T1 on a .002 feeler leaf, kept for every load (the tool setter
# measures each M6, holder swaps included); Y0 the fixed jaw, edge finder,
# kept for side B and shifted by each load's width for side A (the load is
# turned over as one stack, so every centre line moves by the same amount);
# X0 the left end of the blank against the fixed jaw, edge finder at 900
# rpm, picked up again on every load and after the flip.
#
# NC (cam:ch_channel_lever, cad/process/ch_channel_lever/cam.py):
# CL01_face_b, CL02_pocket_b, CL03_bore, CL04_holes, CL05_pocket_a,
# CL06_outline, CL07_hub. Program names, the [parameters] and the
# milling_cuts names are a contract with that recipe. Tool numbers are the
# places in the tools list among the mill's tools: T1 1/2 in end mill, T2 1/8
# in end mill, T3 #1 centre drill, T4 #47 drill, T5 #21 drill, T6 D drill, T7
# F drill.
title = "Channel lever"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 5/16 x 1 in flat (drawing: {{cad.material_spec}})"
stock = "{{process.blank_thickness_in:fraction}} x {{process.blank_width_in:.0f}} in flat bar: two 72 in lengths and one 36 in; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blanks. Spoil plate: a new 6 in piece of the 5/8 x 4 in 6061 flat every lot."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Faces: B, the hub's near face, is faced in Setup 2; A, the far face, stays as bought. Mark A on each blank in Setup 1 and keep it readable. Words: the spoil plate is the aluminium plate the blanks lie on (Z0); the web is the lever's thin section along its bar (the drawing's plate, .114–.120 thick). Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter counts from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. CL07_hub alone has no M6: before running it again, console M6 T2 (the tool setter measures it). Order: Setup 2 for all the loads; then Setups 3 and 4 back to back on each load (the same clamping) before the next load. The spoil plate, the parallels, G54 Z0 and the noted Setup 2 G54 Y stay for every load and both sides, while the vise, parallels and spoil plate have not moved (moved: stop and tell the owner); X0 is picked up on every load."
shop = "../shop"
stock_refs = ["1018-flat-5-16x1-72in", "1018-flat-5-16x1-36in", "6061-flat-5-8x4"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/ch_channel_lever/features.toml"
adapter = "flat_bar"
part = "ch-channel-lever"

[parameters]
quantity = 20
# The adapter's axes: the lever's length along model X, its thickness (the
# hub's faces) along model Z.
blank_length_axis = 0
blank_thickness_axis = 2
# The blank: the 5/16 x 1 in flat, sawn 7.75-7.81 long: the 7.29 in lever
# with at least .12 in (3 mm) at each end. Nine per 72 in length (9 × 7.81 +
# 8 × .125 kerf = 71.3), four from the 36 in: 22.
blank_length_in = 7.75
blank_length_max_in = 7.81
blank_length_min_mm = 196.85
blank_length_max_mm = 198.374
blank_width_in = 1.0
blank_thickness_in = 0.3125
kerf_in = 0.125
# ASTM A108 cold-drawn flat, 1 in wide: thickness +.000/-.004.
blank_thickness_max_mm = 7.9375
blank_thickness_min_mm = 7.8359
end_margin_min_mm = 3.0
# The hub's centre (the fulcrum bore) from the blank's left end: the lever
# centred in the shortest blank (cam.py checks the margins).
hub_from_end_mm = 11.811
# Four blanks per load across the jaws, each at its nominal width.
blanks_per_load = 4
blank_pitch_mm = 25.4
# Targets, each band's middle (cam.py checks them against the export): the
# hub's thickness, the plate's near-face offset and its thickness; the
# pockets' floors above Z0 with B up (the plate's near face) and A up (its
# far face); B's facing takes at most the thickest blank less the hub.
hub_thickness_mm = 7.6327
plate_offset_mm = 2.3114
plate_thickness_mm = 2.9718
pocket_b_floor_mm = 5.3213
pocket_a_floor_mm = 5.2832
face_removal_max_mm = 0.3048
# Face B's widest bite: the measured face setting
# (settings.em-half-carbide-1018-3439-face, dechatter session of 2026-11-23,
# #3439: stable to 6.4 mm wide at up to 1.27 mm deep, 2420-2490 rpm in the
# cut; cad/config/shop-equipment/measured-cuts.toml). CL01's first row takes
# exactly this much, every later row its even share of the rest, 6.38 mm:
# 16 rows across the load (15 would need 6.81 mm, over the limit; cam.py
# checks every pass). Every measured pass was conventional and the face
# zigzags, so every other row climbs, not measured.
face_stepover_max_mm = 6.4
# Holding (shop workholding.vise-pm-6): the spoil plate (5/8 in 6061, 6 x
# 3.95 in, one long edge milled, its top faced to .583) on the 15/16 in pair
# of the parallel set (fixtures.parallels-lms-6745, 1/8 in thick), one
# parallel against each jaw; the blanks on the plate, gripped by their
# edges. The jaws' top stands above the plate's top (Z0): the grip, under
# the faced blanks' top. The traveler gauges the jaws' top above the faced
# plate, clamped alone, against the band jaw_top_min_mm-jaw_top_max_mm
# (.237-.260): at least the shop's 6.0 mm grip, and the shop's jaw-clearance
# floor (cad/config/shop-equipment cnc.toml, D32) under the faced hub, where
# CL01 passes over the moving jaw. cam.py proves the band's ends (the
# guards, the jaws' keep-outs at the high end, the drills over the thinnest
# plate it accepts) and that the faced plate's band lands in it.
#
# The plate (#3607): delegated ruling 2026-11-26 (Main), no precedent;
# owner review #2144 (rulings.md D44); it replaces the owner's option A of
# 2026-11-26 (.025 shim stock on the 1 in parallels under the 1/2 in plate),
# which failed three review rounds on its hold (sheets pinched by the jaws,
# sheets dropping off the moving parallel when the vise opens, the depth
# rod's reach at the moving jaw); flagged to the owner. The set steps in
# 1/16 in, so only a plate faced between the bought sizes lands the band:
# on the 15/16 pair, .578-.588 puts the jaws' top .244-.254 above it and
# 1.18-1.44 mm under the faced hub. It is faced alone on the set's 1 in and
# 1/2 in pairs stacked (facing_stack_mm), its top above the jaws, so the cutter
# runs off every edge; then it goes onto the 15/16 pair and is clamped alone
# for the gauge. Its width: one long edge milled to 3.940-3.960, the plate
# stood on edge on the set's 5/32 in shim pair (edge_shim_height_mm; the
# jaws then grip 40 % of its 4 in, over the shop's third), under the
# narrowest load of four blanks (3.984, from Setup 1's .9960-1.0020 gate) so
# the jaws grip the blanks and never the plate, and over the widest load
# less a parallel (4.008 - .125), so its far edge stays .057 or more on the
# moving parallel even when that parallel is pushed against its jaw. The
# parallels stand loose: the moving one stays under the plate's edge where
# the plate's clamping left it when the vise opens.
parallel_height_mm = 23.8125
parallel_thickness_mm = 3.175
facing_stack_mm = 38.1
edge_shim_height_mm = 3.96875
spoil_plate_bought_mm = 15.875
spoil_plate_thickness_mm = 14.8082
spoil_plate_thickness_min_mm = 14.6812
spoil_plate_thickness_max_mm = 14.9352
spoil_plate_width_mm = 100.33
spoil_plate_width_min_mm = 100.076
spoil_plate_width_max_mm = 100.584
spoil_plate_length_mm = 152.4
support_height_mm = 38.6207
blank_width_min_mm = 25.2984
blank_width_max_mm = 25.4508
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
jaw_top_min_mm = 6.0198
jaw_top_max_mm = 6.604
# The jaws centred on the shortest blank: their left side from X0.
jaw_start_mm = 19.0881
jaw_end_mm = 177.7619
# The 1/2 in carbide end mill: B faced in zigzag rows across the load; the
# pockets in levels no deeper than .031: the slot along the centre line and
# its arc round the hub, which stops 1 mm short of the blank's side (the
# arc's half angle; cam.py computes it).
face_cutter_dia_mm = 12.7
pocket_level_max_mm = 0.8
pocket_finish_mm = 0.2032
pocket_frame_min_mm = 1.0
# With B pocketed, each blank's section is its two side strips beside the
# slot (the blank less the 1/2 in slot), the faced thickness deep.
frame_strips_width_mm = 12.7
pocket_arc_deg = 25.4585
# The 1/8 in carbide end mill: two rings round the hub, at the hub's radius
# plus its own and at 10 mm, ±55° from the centre line, in levels no deeper
# than .048 (two per pocket); its plunges into metal at 1 in/min.
eighth_cutter_dia_mm = 3.175
eighth_plunge_feed_per_min_mm = 25.4
ring_outer_radius_mm = 10.0
ring_half_angle_deg = 55
ring_level_max_mm = 1.2192
# Holes: spot Ø.065 with the #1 carbide centre drill (under the #47), the
# drills through in pecks with full retracts, each full diameter .5 mm into
# the spoil plate; the F drill opens the D hole the same way.
spot_dia_mm = 1.651
drill_past_mm = 0.5
drill_d_tip_mm = -2.377
drill_f_tip_mm = -2.461
# Speeds, authored in the operations: LittleMachineShop "Cutting Speeds",
# Drilling & Reaming, Plain carbon steels 1006-1026 (read 2026-11-20):
# drilling 60-100 ft/min. The #47 (.0785) at 2800 rpm, the
# mill's top (58 ft/min), .001 in/rev = 2.8 in/min (AutoDrill "Suggested
# drilling feed rates", Stl, Carbon, 1/16 in, read 2026-11-20); the #21
# (.159) at 1900 (79 ft/min) and the D (.246) at 1200 (77 ft/min), each .002
# in/rev (the author's choice, the 1/16 column's doubled for the larger
# drills): 3.8 and 2.4 in/min; the #1 centre drill at 2800, .0005 in/rev =
# 1.4 in/min; the F (.257) at 1185, the spindle's 11th stop (11 x 107.7,
# machines.pm-30mv; 80 ft/min), .002 in/rev = 2.4 in/min.
spot_feed_per_min_mm = 35.56
drill_47_feed_per_min_mm = 71.12
drill_21_feed_per_min_mm = 96.52
drill_d_feed_per_min_mm = 60.96
drill_f_feed_per_min_mm = 60.96
# The outline: the 1/8 in end mill round each lever at its radius outside
# the drawn edge, over the plate's thickness in levels no deeper than .043,
# from its far face to .010 past its near face; then round the hub alone above
# and below the plate to .010 into the spoil plate. Seven tabs .100 wide and
# .050 thick on the plate's near face (the tab's top .050 above it): one at
# the hub's far side and six along the bar, alternately on its top and bottom
# edges, 20 to 172 mm from the hub's centre (the last at the end of the bar's
# straight edge, before the tip's round), so no stretch between tabs, nor
# the tip past the last, bends past prechips' finish limit under the cut.
# Each lap starts at 95 mm on the bottom edge.
outline_level_max_mm = 1.0922
outline_through_mm = 0.254
tab_thickness_mm = 1.27
tab_top_mm = 3.5814
tab_width_mm = 2.54
tab_top_1_x_mm = 20
tab_bottom_1_x_mm = 50
tab_top_2_x_mm = 80
tab_bottom_2_x_mm = 110
tab_top_3_x_mm = 136
tab_bottom_3_x_mm = 172
outline_start_x_mm = 95
# The tabs' stations from X0: the hub's far side, then the hub's place plus
# each bar tab's (cam.py checks them).
tab_station_1_mm = 5.715
tab_station_2_mm = 31.811
tab_station_3_mm = 61.811
tab_station_4_mm = 91.811
tab_station_5_mm = 121.811
tab_station_6_mm = 147.811
tab_station_7_mm = 183.811
# The lever's extent from X0 with side A up: the hub's far side to the tip.
lever_start_mm = 5.715
lever_end_mm = 191.1028
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm); 1/8 in end mill, 1-1/2 in overall:
# at least .75 in out.
half_mill_projection_mm = 28.45
eighth_mill_projection_min_mm = 19.05
# ASME B94.11M jobber, D: 4 in overall; F: 4-1/8 in overall.
drill_d_oal_mm = 101.6
drill_f_oal_mm = 104.775

