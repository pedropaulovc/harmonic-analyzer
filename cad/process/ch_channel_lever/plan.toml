[[setups.operations]]
instruction = "Every load: G54 Y from W, this load's width; then console M6 T1. Z0 stays."
instruction_detailed = "W = the sum of the four widths written on this load's blanks in Setup 1. Turned over as one stack, every blank's centre line moves by 4.000 − W, the same for all four: G10 L2 P1 Y(the noted Setup 2 Y − (W − 4.000) × 25.4). Example: W = 3.9960 moves Y0 .1016 mm toward the fixed jaw. Console M6 T1."
feed = "hand"

[[setups.operations]]
instruction = "First load only: prove CL05_pocket_a in air, Z0 raised 1.000 in, through each M6. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z now. G10 L2 P1 Z(that Z + 25.400). Run CL05_pocket_a in air through each M6. G10 L2 P1 Z(the Z noted in this op) puts Z0 back."
feed = "hand"

# Not measured: owner (Pedro), 2026-11-22, on full-width passes: "same log
# new dechatter issues to try full radial depth but shallow axial" (#3428).
