[[setups]]
machine_kind = "other"
title = "Spotted holes (after TL-00 step 11C)"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On 1 in parallels ≤1/8 thick (HUB breaks out .18 from the far edge), marked (carrier) face up, ZERO EDGE at the fixed jaw, pins out. Holds: L, left end at the left jaw side; C, centred; R, right end at the right jaw side."
datum = "No DRO coordinates: each hole is drilled at its own spot mark."
diagram = { file = "diagrams/riser/spots.svg", alt = "Marked face up: seven spot marks drilled in three vise holds, then turned over and R1–R4 countersunk" }
# Every hole lies inside the finished part; the 12 mm drill in the drill
# chuck is the longest tool, the #2 centre drill the shortest.
envelope = { x_span_mm = "{{cad.length_mm}}", y_span_mm = "{{cad.width_mm}}", work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.hub_drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.hub_drill_projection_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.centre_drill_projection_mm}}"] }
# Hold L: left end at the left jaw side; C: centred; R: right end at the
# right jaw side. The adapter refuses a REF hole outside every hold's jaws or
# over a parallel.
vise_hold = [
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = [0.0, "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["rest", 0.0], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
]
# Every hole is drilled between the two parallels: the plate spans the gap
# across Y.
beam = { axis = "y", hold = "between", extent_mm = [0, "{{cad.width_mm}}"], supports_mm = "{{cad.parallel_gap_mm}}", section_mm = { x = "{{process.cross_strip_mm}}", z = "{{cad.thickness_mm}}" } }

