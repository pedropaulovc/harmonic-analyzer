# Prechips plan for MHA-CH-06-TL-24 (oblique trammel riser). Needs prechips
# 0.11.0 (the harmonic_riser adapter and milling_deflection);
# prechips examples/riser.toml copies this file with only the cad and shop
# paths changed. Dimensions, limits and the revision bind from the released
# v49 manifest (cad/out/features/ch_rocker_arm_tl_oblique_riser/features.toml)
# and sheet MHA-CH-06-TL-24 v49. Route from the v49
# notes.process: 1/4 x 1-3/4 in 6061 bar, faced to .24 and milled to
# 1.69 x 13.80; P1/P2 drilled #30 at their printed .XX stations. R1–R4, HUB,
# CL and CR print X/Y LOC REF ("SPOT FROM TL-21 AT ASSEMBLY"): TL-00 v49
# steps 11–11C stand the stop pins in P1/P2, set and clamp the riser on the
# carrier and spot the seven centres from below through the carrier; step 11D
# finishes the riser to this sheet (Setup 5), so no REF hole is drilled at its
# nominal X/Y. TL-00 step 18 cuts the 9/16 groove in place on the jig.
# Process choices (blank, strap layout, holds, passes, speeds) are authored.
title = "Oblique trammel riser"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{process.blank_thickness_in:fraction}} × {{process.blank_width_in:fraction}} in bar; {{process.quantity:d}} × {{process.blank_length_in:.2f}} in blank."
note = "Inches. Finished {{cad.length_in:.2f}} × {{cad.width_in:.2f}} × {{cad.thickness_in:.2dot}}. Setups 1–4 in the shop; Setup 5 after TL-00 step 11C. The sheet's Ø.129 THRU (P1, P2, R1–R4) is the #30 (.1285) rounded: drill #30."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_riser/features.toml"
adapter = "harmonic_riser"

[parameters]
blank_length_in = 14.0
blank_min_length_in = 13.95
kerf_in = 0.125                  # About 1/8 in per cut.
blank_width_in = 1.75
blank_thickness_in = 0.25
quantity = 1
# Setup 2, bare table: Stage A straps bear ~.5 on each end and one sits at
# mid-length; the 3/4 in cutter keeps .1 off each toe. Stage B straps sit
# on Stage A's faced metal (outer and inner pairs, in from each end), clear
# of the end and middle cuts, which overlap Stage A by .25.
strap_toe_in = 0.5
strap_clear_in = 0.1
face_overlap_in = 0.25
strap_a_mid_x_in = 7.0
strap_b_outer_in = 1.5
strap_b_inner_in = 5.0
strap_width_in = 0.75
edge_cleanup_in = 0.03           # Setup 3 hold 1: clean-up off the first edge.
# Setup 4: each arriving end ~.6 past its jaw side, so P1/P2 drill in the
# overhang clear of the jaws and parallels (the adapter refuses otherwise).
overhang_in = 0.6
# Bounded: the beams model the longest overhang and Y0's X 8 touch must stay
# in the long right overhang (hold 1 right jaw side at .8 + 6.25 = 7.05 in).
overhang_max_in = 0.8
y_touch_x_in = 8.0               # Y0 touched in the long right overhang.
# milling_deflection stations, mm from the blank's left end (Setup 2) or
# from ZERO END (Setup 4; the adapter binds the jaw sides). Stage A end
# straps bear ~.25 in from each end (half the .5 toe). Stage A spans run
# from .6 in (toe + clear) to 6.525 in (7.0 - .375 strap - .1 clear) and
# from 7.475 in to 13.4 in; Stage B cuts .85 in (toe + clear + overlap) off
# each end and 6.275-7.725 in under the middle strap.
strap_a_left_x_mm = 6.35         # .25 in.
strap_a_mid_x_mm = 177.8         # strap_a_mid_x_in 7.0.
strap_a_right_x_mm = 349.25      # (14.00 - .25) in.
strap_b1_x_mm = 38.1             # strap_b_outer_in 1.5.
strap_b2_x_mm = 127.0            # strap_b_inner_in 5.0.
strap_b3_x_mm = 228.6            # (14.00 - 5.0) in.
strap_b4_x_mm = 317.5            # (14.00 - 1.5) in.
stage_a_left_from_mm = 15.24
stage_a_left_to_mm = 165.735  # [.6, 6.525] in.
stage_a_right_from_mm = 189.865
stage_a_right_to_mm = 340.36  # [7.475, 13.4] in.
stage_b_left_from_mm = 0
stage_b_left_to_mm = 21.59  # [0, .85] in.
stage_b_mid_from_mm = 159.385
stage_b_mid_to_mm = 196.215  # [6.275, 7.725] in.
stage_b_right_from_mm = 334.01  # 13.15 in; the pass runs to the blank's end.
# Setup 5: a drill's thrust bends the plate across the gap between the two
# parallels; 1 in of plate along X is taken to carry it (the jaws grip
# 6.25 in, so this understates the stiffness).
cross_strip_mm = 25.4
# Vise and parallels; the vise values repeat shop workholding.vise-pm-6.
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
parallel_height_mm = 25.4        # 1 in parallels (archive parallels-lms-6745 1in).
parallel_thickness_mm = 3.175    # Archive parallels-lms-6745 thickness_in 0.125.
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection). Archive values are
# archive/pre-v0.10-2026-11-08 examples/inventory/pedro-shop.toml.
face_cutter_dia_mm = 19.05       # 3/4 in end mill.
cutter_dia_mm = 12.7             # 1/2 in end mill.
drill_tip_z_mm = -2.54           # Drill tips ~.1 past breakthrough.
hub_drill_tip_z_mm = -4.318      # 12 mm HUB: 118° point ~3.6 long, full diameter ~.03 past.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
face_mill_projection_mm = 57.0   # Archive LMS 6784 3/4 in member.
half_mill_projection_min_mm = 41.0  # Archive LMS 6784 neighbours bound 1/2 in.
half_mill_projection_max_mm = 50.0
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
centre_drill_projection_mm = 27.0  # Archive center-drills-lms-4859 #2, drill-chuck-r8.
# Archive drill-index-115 #15 (4.572 mm) jobber, 62 out of drill-chuck-r8: the
# next recorded jobber above #30, so it bounds that drill.
stop_drill_projection_mm = 62.0
# Archive drill-index-115 15/32 in jobber, 125 out of drill-chuck-r8 (146.1
# overall), plus the 5 mm longer DIN 338 12 mm jobber (151 overall).
hub_drill_projection_mm = 130.0

[[tools]]
id = "saw"
name = "Saw"
ref = "jig-saw"
[[tools]]
id = "em-face"
name = "3/4 in end mill"
ref = "basebar-em-face"
[[tools]]
id = "em-half"
name = "1/2 in end mill"
ref = "jig-em-half"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill-30"
name = "#30 drill"
ref = "riser-drill-30"
[[tools]]
id = "drill-9"
name = "#9 drill"
ref = "riser-drill-9"
[[tools]]
id = "drill-quarter"
name = "1/4 drill"
ref = "riser-drill-quarter"
[[tools]]
id = "drill-12mm"
name = "12 mm drill"
ref = "riser-drill-12mm"
[[tools]]
id = "csk"
name = "3/8 in 82° countersink"
ref = "riser-countersink"

[[setups]]
machine_kind = "other"
title = "Saw blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
beam = "other"
diagram = { file = "diagrams/riser/saw.svg", alt = "The riser blank from the measured bar end" }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Cut {{process.blank_length_in:.2f}} from the measured bar end, ~{{process.kerf_in:fraction}} kerf, waste side of the line; blank ≥{{process.blank_min_length_in:.2f}}."
feed = "hand"

[[setups.operations]]
instruction = "Caliper the bar at both ends and mid-length."
inspection = "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} at all three: skip Setup 2; over {{cad.thickness_max_in:.3dot}}: Setup 2."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Face the top on the table (only a bar over {{cad.thickness_max_in:.3dot}})"
machine = "PM-30MV; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Vise off; bar flat on the clean table. Stage A: a strap across each end (toe ~{{process.strap_toe_in:.1dot}} on the bar) and one at mid-length. Stage B: four straps on faced metal ~{{process.strap_b_outer_in:g}} and {{process.strap_b_inner_in:g}} in from each end, then A's off."
datum = "Z0 = mill table. Bar does not move between stages."
diagram = { file = "diagrams/riser/face.svg", alt = "Bar strapped on the bare table: Stage A faces the two spans between end and middle straps, Stage B faces both ends and the middle strip from four straps on faced metal; section shows the top skimmed to the finished thickness from the table" }
# The cutter centre runs the blank length and across its width plus one
# diameter; the bar lies on the table.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = "{{cad.blank_thickness_mm}}", deepest_cut_mm = "{{cad.thickness_mm}}", longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = "other"
# Straps hold the bar both ways; the table only pushes up. Each cut
# bends between the two straps either side of it (operation beams).
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_a_left_x_mm}}", "{{process.strap_a_mid_x_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.blank_thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Stage A: face the left span, cutter edge ≥{{process.strap_clear_in:.1dot}} off each toe; ≤.010 passes, +X, stepover .60; last pass .005 to Z {{cad.thickness_in:.3dot}}."
instruction_detailed = "Stage A: clean the table and the bar underside first: a chip under this thin bar prints through as a step. Touch the cutter on a paper strip on the table beside the bar and set Z = +.003 (the paper). Face the left span between the end and middle straps, cutter edge ≥{{process.strap_clear_in:.1dot}} off each toe: ≤.010 per pass, +X, stepover .60; last pass .005 deep, at Z {{cad.thickness_in:.3dot}}."
settings = "basebar-face-6061-t6511"
milling_cuts = [
  { name = "rough passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_a_left_from_mm}}", "{{process.stage_a_left_to_mm}}"] },
  { name = "last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.127, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_a_left_from_mm}}", "{{process.stage_a_left_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Stage A: face the right span the same way."
settings = "basebar-face-6061-t6511"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_a_mid_x_mm}}", "{{process.strap_a_right_x_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
milling_cuts = [
  { name = "rough passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_a_right_from_mm}}", "{{process.stage_a_right_to_mm}}"] },
  { name = "last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.127, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_a_right_from_mm}}", "{{process.stage_a_right_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Stage B straps on, A's off (bar unmoved): face the left end to the same Z, ≥{{process.face_overlap_in:.2dot}} over A; last pass .005."
settings = "basebar-face-6061-t6511"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_b1_x_mm}}", "{{process.strap_b2_x_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
milling_cuts = [
  { name = "rough passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_left_from_mm}}", "{{process.stage_b_left_to_mm}}"] },
  { name = "last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.127, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_left_from_mm}}", "{{process.stage_b_left_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face the strip under the old middle strap the same way."
settings = "basebar-face-6061-t6511"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_b2_x_mm}}", "{{process.strap_b3_x_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
milling_cuts = [
  { name = "rough passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_mid_from_mm}}", "{{process.stage_b_mid_to_mm}}"] },
  { name = "last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.127, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_mid_from_mm}}", "{{process.stage_b_mid_to_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face the right end the same way."
settings = "basebar-face-6061-t6511"
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = ["{{process.strap_b3_x_mm}}", "{{process.strap_b4_x_mm}}"], section_mm = { y = "{{cad.blank_width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
milling_cuts = [
  { name = "rough passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_right_from_mm}}", "{{cad.blank_length_mm}}"] },
  { name = "last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.face_cutter_dia_mm}}", flutes = 4, axial_doc_mm = 0.127, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = ["{{process.stage_b_right_from_mm}}", "{{cad.blank_length_mm}}"] },
]
inspection = "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} at both ends and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Both long edges, on edge in vise"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "On edge on one 1 in parallel against the fixed jaw, bar centred (~{{cad.blank_centred_overhang_in:.1f}} out each side). The underside (as bought) at the fixed jaw."
datum = "Z on the top edge. Hold 2: turned end-for-end, ZERO EDGE down on the parallel."
diagram = { file = "diagrams/riser/edges.svg", alt = "End views: on edge on one parallel, top edge cleaned up to make ZERO EDGE, then turned end-for-end with ZERO EDGE down and milled to width" }
# The cutter centre runs the blank length plus one diameter; on edge, the
# finished width is the deepest cut.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.thickness_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.blank_width_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.width_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
# The as-bought (unfaced) face seats on the fixed jaw; turning end-for-end
# keeps it there.
vise_hold = [
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.thickness_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.blank_width_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.blank_centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.thickness_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.width_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.blank_centred_overhang_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "as_bought", moving_jaw_face = "as_bought", moving_jaw_contact = "flat" },
]
# On edge the bar bends across its .24 thickness (y) as well as down its
# width (z); the jaws are the only clamp.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = "{{cad.edges_jaw_mm}}", section_mm = { y = "{{cad.thickness_mm}}", z = "{{cad.blank_width_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Hold 1: cutter centred on the edge; clean up the top edge, ~{{process.edge_cleanup_in:.2dot}} in .010 passes, last .005. Mark it ZERO EDGE."
instruction_detailed = "Hold 1: one parallel only: the .24 bar is too thin to straddle a pair. Tap the bar down until the parallel will not slide. Cutter centred on the edge, clean up the top edge along X in .010 passes, last .005, ~{{process.edge_cleanup_in:.2dot}} in all, until it is milled full length: the thin bar overhangs the jaws ~{{cad.blank_centred_overhang_in:.1f}} each side, so heavier passes push it sideways. Mark it ZERO EDGE on both faces."
settings = "riser-em-half-6061-t6511"
milling_cuts = [
  { name = "cleanup passes", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.254, radial_woc_mm = "{{cad.thickness_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "ZERO EDGE last pass", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.127, radial_woc_mm = "{{cad.thickness_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Hold 2: turn end-for-end, ZERO EDGE down on the parallel. Measure width w; .010 passes to .005 over, then .005 to {{cad.width_in:.3f}}."
instruction_detailed = "Hold 2: turn end-for-end, ZERO EDGE down on the parallel. Measure the width w, touch the cutter on the top edge and set Z = w. Cutter centred on the edge, take .010 passes to Z .005 over {{cad.width_in:.3f}}, then a .005 pass to Z {{cad.width_in:.3f}}."
settings = "riser-em-half-6061-t6511"
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.blank_length_mm}}"], clamp_mm = "{{cad.edges_jaw_mm}}", section_mm = { y = "{{cad.thickness_mm}}", z = "{{cad.width_mm}}" } }
milling_cuts = [
  { name = "width rough", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = "{{process.cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.254, radial_woc_mm = "{{cad.thickness_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "width finish", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = "{{process.cutter_dia_mm}}", flutes = 2, axial_doc_mm = 0.127, radial_woc_mm = "{{cad.thickness_mm}}", rpm = 1800, feed_mm_min = 203.2, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]
inspection = "Width {{cad.width_min_in:.2f}}–{{cad.width_max_in:.2f}} at both ends and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Ends to length; P1 and P2"
machine = "PM-30MV / 6 in vise"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on 1 in parallels, ZERO EDGE at the fixed jaw. Hold 1: left end {{process.overhang_in:.1dot}}–{{process.overhang_max_in:.1dot}} out past the left jaw side. Hold 2: slid left, right end {{process.overhang_in:.1dot}}–{{process.overhang_max_in:.1dot}} out past the right jaw side."
datum = "X0 ZERO END (hold 1 mills it, hold 2 re-finds it); Y0 ZERO EDGE, touched at ~X {{process.y_touch_x_in:g}}; +Y toward you."
diagram = { file = "diagrams/riser/ends.svg", alt = "Hold 1: left end out of the vise, ZERO END milled and P1 drilled; hold 2: slid left, right end milled to length and P2 drilled" }
# Cutter centre past both ends (final X = length + D/2) and across the width.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.parallel_height_mm}}", "{{process.drill_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.stop_drill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
# Both long edges are milled; the end overhangs past each jaw side.
vise_hold = [
  { vise = "vise-pm-6", across_jaws_mm = "{{cad.width_mm}}", along_jaws_mm = "{{cad.blank_length_mm}}", part_height_mm = "{{cad.thickness_mm}}", parallel_height_mm = "{{process.parallel_height_mm}}", overhang_mm = ["{{cad.overhang_max_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "machined", moving_jaw_contact = "flat" },
