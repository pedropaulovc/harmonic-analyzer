# Transgear thumbnut MHA-PD-13, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC). Route
# chosen for speed: two chuckings of the 7/8 in C36000 bar on hand
# (cad/config/shop-equipment/stock-bought.toml c360-round-7-8).
# Setup 1, the bar, seat end out: face the end (Z0: the seat face), turn the
# head's knurl blank back past the parting line, straight-knurl the head,
# turn the flange, cut the waist with the parting blade, spot, drill #29
# through and past the parting line, countersink the seat end and tap #8-32
# through by hand from the tailstock, all in the chucking that faced the seat
# (the thread square to the seat it bears on), part off .02 long.
# Setup 2: the nut turned round, its knurled head in the 3-jaw over a shim
# wrap with only the smaller flange and waist behind it; mike the length,
# preset the DRO from it, face the rim to length, cut the dished face (the
# flat floor to a held Ø and depth, then the cone with the compound into its
# corner), countersink the rim end and chase the thread from the rim end.
# Bench: deburr, check against the drawing, oil.
# The thumbnut leaves nothing for the assembly: MHA-PD-00 faces the drive
# collar's pilot (MHA-PD-22) and cuts the knob shaft's stud (MHA-PD-08) to
# fit the nut's rim, both on their own parts.
#
# Not on hand (cad/config/shop-equipment/, to buy): the straight 25 TPI knurl
# wheel and its holder (pd.toml tools.knurl-straight-25tpi).
title = "Transgear Thumbnut"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 7/8 in"
stock = "Lot: {{process.quantity:d}} thumbnut. Ø{{process.stock_dia_in:.3dot}} bar, on hand; the nut takes {{cad.pitch_in:.2dot}} in of it."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. To buy (not on hand): the straight 25 TPI knurl and its holder for the head."
shop = "../shop"
stock_refs = ["c360-round-7-8"]
material_key = "lathe-c360"
turning_material = "brass"

[cad]
file = "../../out/features/pd_transgear_thumbnut/features.toml"
adapter = "turned_bush"
part = "pd-transgear-thumbnut"

[parameters]
quantity = 1
stock_dia_in = 0.875
# A piece of the bar on hand and the length the 3-jaw grips of it.
bar_length_in = 3.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted rim end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The waist and part-off ops mike the blade's cutting edge and preset the DRO.
blade_width_in = 0.0625
parts_per_pull = 1
# Clearance to the jaw fronts at the parting line (authored): the blade's
# .10, raised to .25 because the knurl is fed to the parting line in Op 50
# and its holder carries the wheel in a side plate (about 1/8 in, not on
# record: the knurl is to buy) on the chuck side of the wheel.
jaw_clearance_in = 0.25
# Setup 2: how much of the knurled head the jaws take, from its rear face;
# the rim end stands out past them for the facing and the dish.
regrip_grip_in = 0.25
# The #29 drill's full-diameter depth (.90 in) from its lips touching the spot, and
# the plug tap's pencil mark from its point (authored): .72, inside the plug
# tap's .75 thread length (tools-reamers-taps.toml taps-unc-hand 8-32-plug
# flute_len_in), so its Ø.168 shank never reaches the Ø.136 hole. Its 3-5
# chamfered threads (about .09-.16) then leave full thread to about .56-.63
# from the seat; the hole ends at the recess floor, .57-.61 from the seat, so
# at worst the last pitch or two there carry the chamfer's partial thread,
# which the rim-end chase (Op 250, tap_chase_mark_in) clears. The drill runs past the
# tap's point.
tap_drill_depth_mm = 22.86
tap_mark_in = 0.72
# The rim-end chase (Setup 2, Op 250): the seat-end tap leaves up to a
# chamfer's length (.16) of partial thread above the recess floor, which lies
# .03-.05 under the rim face, so partial thread runs no farther than .21 from
# the rim face; the plug tap entered from the rim clears it when its point
# reaches .21 + .16 = .37: marked .40 from its point (authored), well inside
# its .75 thread length.
tap_chase_mark_in = 0.40
# The dish floor held inside the drawing's bands (authored): the Op 220 cone
# at the drawing's flank sets the rim at about floor Ø + 6 × depth, so the
# floor Ø.350 ±.002 and depth .040 ±.001 put the rim at .582-.598, inside
# its .58-.60. In mm for the gauge checks: × 25.4.
recess_floor_hold_min_in = 0.348
recess_floor_hold_max_in = 0.352
recess_floor_hold_min_mm = 8.8392
recess_floor_hold_max_mm = 8.9408
recess_depth_hold_min_in = 0.039
recess_depth_hold_max_in = 0.041
recess_depth_hold_min_mm = 0.9906
recess_depth_hold_max_mm = 1.0414
# Countersinks (authored): Ø.170, between the #8-32 major Ø.164 (the first
# thread broken all round) and the drawing's .18 max; the 90° chamfer mill
# fed (.170 - .136) / 2 = .017 past its flutes touching the #29 hole's edge.
csk_dia_in = 0.17
csk_feed_in = 0.017
# The most quill feed past first touch: (.18 - .136) / 2 = .022 gives the
# drawing's Ø.18 max on the 90° chamfer mill (authored).
csk_feed_max_in = 0.022
# Outside passes (authored): the .02 in wide bands take rough passes only.
rough_radial_doc_mm = 0.5
turn_feed_mm_rev = 0.1016
# The tool starts its pass this far off the faced end.
turn_start_z_mm = 0.5

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "knurl"
name = "Straight knurl 25 TPI and holder"
ref = "knurl-straight-25tpi"  # drawing cross-check 2026-11-19: STRAIGHT KNURL 25 TPI
status = "to_order"

[[tools]]
id = "cutoff"
name = "P1 HSS cutoff blade"
ref = "cutoff-blade-p1"

[[tools]]
id = "centre"
name = "No. 1 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-29"
name = "#29 drill"
ref = "jig-drill-29"  # Drills #29

[[tools]]
id = "csk"
name = "1/4 90° chamfer mill"
ref = "chamfer-mill-330ch-1-4-90"  # drawing cross-check 2026-11-19: Ø.18 MAX X 90° BOTH ENDS

[[tools]]
