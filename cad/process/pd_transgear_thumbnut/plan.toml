# Transgear thumbnut MHA-PD-13, one off, turned on the manual PM-1127VF-LB
# (owner ruling 2026-11-21: turned parts get lathe travelers, no NC). Route
# chosen for speed: two chuckings of the 7/8 in C36000 bar on hand
# (cad/config/shop-equipment/stock-bought.toml c360-round-7-8).
# Setup 1, the bar, seat end out: face the end (Z0: the seat face), turn the
# head's knurl blank back past the parting line, straight-knurl the head,
# turn the flange, cut the waist with the parting blade, spot, drill #29
# through and past the parting line, countersink the seat end and tap #8-32
# through by hand from the tailstock, all in the chucking that faced the seat
# (the thread square to the seat it bears on), part off .02 long.
# Setup 2: the nut turned round, its knurled head in the 3-jaw over a shim
# wrap with only the smaller flange and waist behind it; mike the length,
# preset the DRO from it, face the rim to length; rechuck, set the compound
# to the dish's flank by an indicator and turn the toolpost before any
# touch-off, then face the dish's floor to its depth and corner on the DROs
# and cut the cone up the compound from that corner, so the rim follows;
# countersink the rim end and chase the thread from the rim end.
# Bench: deburr, check against the drawing, oil.
# The thumbnut leaves nothing for the assembly: MHA-PD-00 faces the drive
# collar's pilot (MHA-PD-22) and cuts the knob shaft's stud (MHA-PD-08) to
# fit the nut's rim, both on their own parts.
#
# Not on hand (cad/config/shop-equipment/, to buy): the straight 25 TPI knurl
# wheel and its holder (pd.toml tools.knurl-straight-25tpi).
title = "Transgear Thumbnut"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass round bar, 7/8 in"
stock = "Lot: {{process.quantity:d}} thumbnut. Ø{{process.stock_dia_in:.3dot}} × {{process.bar_length_in:g}} in blank sawn off the bar on hand; the nut takes {{cad.pitch_in:.2dot}} in of it."
shop = "../shop"
stock_refs = ["c360-round-7-8"]
material_key = "lathe-c360"
turning_material = "brass"

# The shop's standing page carries what every traveler shares (units, speeds,
# coolant); This job says what only this thumbnut needs.
standing = true

[[notes]]
title = "This job"
rows = [
  ["To buy", "To buy (not on hand): the straight 25 TPI knurl and its holder for the head."],
]

[cad]
file = "../../out/features/pd_transgear_thumbnut/features.toml"
adapter = "turned_bush"
part = "pd-transgear-thumbnut"

[parameters]
quantity = 1
stock_dia_in = 0.875
# A blank sawn off the bar on hand and the length the 3-jaw grips of it
# (fleet rule, Main 2026-11-22: no bar past the rear of the spindle). Chucked
# .99 out, 2.01 in of it lies behind the jaw fronts, grip included, inside
# the working limit machines.toml machines.pm-1127vf-lb
# bar_behind_jaw_fronts_max_in (the owner's measured 17 in jaw fronts to
# spindle rear, less its margin; test_lathe_bar_length), and well
# inside the chuck's own body. Yield: the nut and one
# restart (each takes about .82 in with the kerf; a restart needs 1.74 in).
bar_length_in = 3.0
chuck_grip_in = 0.75
# Facing allowance: squares a sawn bar end.
face_allowance_in = 0.02
# Left on the parted rim end for Setup 2 to face to length.
regrip_allowance_in = 0.02
# Parting kerf: the P1 blade's width plus .0125 (authored), for wander or a
# .010 step toward the chuck that widens a deep groove.
part_kerf_in = 0.075
# The P1 cutoff blade's width: its record (cad/config/shop-equipment/
# tools-cutting.toml tools.cutoff-blade-p1 width_in, the makers' 1/16 in).
# The waist and part-off ops mike the blade's cutting edge and preset the DRO.
blade_width_in = 0.0625
parts_per_pull = 1
# Clearance to the jaw fronts at the parting line (authored): the blade's
# .10, raised to .25 because the knurl is fed to the parting line in Op 50
# and its holder carries the wheel in a side plate (about 1/8 in, not on
# record: the knurl is to buy) on the chuck side of the wheel.
jaw_clearance_in = 0.25
# Setup 2: how much of the knurled head the jaws take, from its rear face;
# the rim end stands out past them for the facing and the dish.
regrip_grip_in = 0.25
# The #29 drill's full-diameter depth (.90 in) from its lips touching the spot, and
# the plug tap's pencil mark from its point (authored): .72, inside the plug
# tap's .75 thread length (tools-reamers-taps.toml taps-unc-hand 8-32-plug
# flute_len_in), so its Ø.168 shank never reaches the Ø.136 hole. Its 3-5
# chamfered threads (about .09-.16) then leave full thread to about .56-.63
# from the seat; the hole ends at the recess floor, .57-.61 from the seat, so
# at worst the last pitch or two there carry the chamfer's partial thread,
# which the rim-end chase (Op 270, tap_chase_mark_in) clears. The drill runs past the
# tap's point.
tap_drill_depth_mm = 22.86
tap_mark_in = 0.72
# The rim-end chase (Setup 2, Op 270): the seat-end tap leaves up to a
# chamfer's length (.16) of partial thread above the recess floor, which lies
# .03-.05 under the rim face, so partial thread runs no farther than .21 from
# the rim face; the plug tap entered from the rim clears it when its point
# reaches .21 + .16 = .37: marked .40 from its point (authored), well inside
# its .75 thread length.
tap_chase_mark_in = 0.40
# The dish (authored). The compound is set to the flank, t = 18.4° off the
# cross slide (tan t = .04 / .12: the drawing's rim .59, floor .35, depth
# .04), by a .001 dial indicator on it against the faced rim: .300 on the
# compound's dial moves it .300 sin t = .095 along Z (and .285 across the
# face, inside the .31 ring between the countersink and the knurl), to
# about ±0.2°. The
# floor is faced at Z-.040 on the carriage DRO and out to its corner on the
# X DRO, then the cone is cut up the compound from that corner (about
# .040 / sin t = .127 of compound travel to the face), so the rim follows:
# corner Ø .350 + 2 × .040 / tan t = .590. The AR's R0.4 nose (lathe.toml
# tools.lathe-ar, r = .0157, a TCMT: its nose arc spans 120°): the X DRO,
# set on the knurl's crests at touch, reads the nose's inner edge, so the
# nose's centre is r out. That holds with the chuck-side edge 20°-25° off
# the face: over 18.4° it clears the cone, under 30° the arc still reaches
# the OD's inner normal (Op 200 bounds it). The floor flat
# ends at the centre and the sharp floor-cone corner lies a further
# r sin t - r (1 - cos t) / tan t = .0026 out. The X DRO figure for the
# corner Ø .350 is .350 - 2 (.0157 + .0026) = .313. The regrip's
# eccentricity e moves one crest touch by up to 2e on the diameter, so
# Op 220 touches a crest by each of the three jaws, 120° apart, and sets the
# X DRO on their mean: e cos(a) summed at three equal spacings is zero, so
# the mean is the crests' diameter about the spindle axis. Op 190 also
# trues the regrip to .001 TIR (a test indicator on a feeler leaf laid on
# the crests, bridging the roots) so the rim-end countersink and chase run
# on the hole's axis. Errors: touch-off and DRO
# about ±.001 on the corner and rim, the depth ±.0005 (±.003 on the rim),
# the angle ±0.2° (±.003 on the rim): worst case the corner .349-.351 and
# the rim .583-.597, inside the drawing's .34-.36 and .58-.60. Neither is gauged: no named tool registers on the rim's edge,
# and calipers on the floor ride the shallow wall (a contact .001 up reads
# .006 large), so the floor reading is only a gross check.
# The touch-offs go through a .001 cigarette paper, spindle stopped, so the
# finished knurl and rim take no witness.
recess_corner_x_dro_in = 0.313
# The rim's worst case from the errors above (printed in Op 240).
rim_held_min_in = 0.583
rim_held_max_in = 0.597
# After the cone (Op 240) the three crests touched again as in Op 220 give
# the X datum's drift d against D0 + .002 (their mean, ±.001): the corner is
# then .350 - d and the rim .590 - d ± .006 (depth and angle). With the
# re-touch's ±.001 the rim stays in .58-.60 for a reading inside d = ±.003:
# under D0 - .001 the dish is cut large (scrapped), over D0 + .005 it is cut
# small (X touched off again and the dish recut).
crest_drift_scrap_in = 0.001
crest_drift_recut_in = 0.005
# The floor check: calipers flat on the floor read about .345 (the flat
# ends .005 inside the corner), never low but high if they ride the wall.
# Under .341 the corner is under .346 and the rim may fall under .58 (a
# small nose, or the floor short): faced out by the shortfall from .345.
# Over .355 held down, the corner is over .36 (a larger nose than the
# .313 figure's R0.4, or the floor cut to the printed .350): scrapped.
floor_flat_nominal_in = 0.345
floor_flat_read_min_in = 0.341
floor_flat_read_max_in = 0.355
compound_check_travel_in = 0.3
# .300 sin 18.4° = .095; ±.001 on the indicator is ±0.2° on the flank.
compound_check_rise_min_in = 0.094
compound_check_rise_max_in = 0.096
cone_compound_travel_in = 0.14
# Countersinks (authored): Ø.170, between the #8-32 major Ø.164 (the first
# thread broken all round) and the drawing's .18 max; the 90° chamfer mill
# fed (.170 - .136) / 2 = .017 past its flutes touching the #29 hole's edge.
csk_dia_in = 0.17
csk_feed_in = 0.017
# The most quill feed past first touch: (.18 - .136) / 2 = .022 gives the
# drawing's Ø.18 max on the 90° chamfer mill (authored).
csk_feed_max_in = 0.022
# Outside passes (authored): the .02 in wide bands take rough passes only.
rough_radial_doc_mm = 0.5
turn_feed_mm_rev = 0.1016
# The tool starts its pass this far off the faced end.
turn_start_z_mm = 0.5

