  <!-- To scale, 300 px/in, from above (the cross-slide at the bottom): the Ø.500 x .60 brass piece (bush_dia_in, bush_length_in) in the 3-jaw on .50 (bush_grip_in), .10 out of the jaw fronts; the jaws drawn .50 long, schematic (their sizes are not on record), the chuck's body behind them schematic, its bore open behind the piece. The nick at jaw 1 filed on the rim. The .1260 reamer to scale (37.8 px), its 45 deg lead chamfer (schematic) past the back end. Drawn short to a break line (its length out of the chuck is not on record). -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 1, Op 40: the .1260 reamer right through in one slow feed (to scale, 300 px/in)</text>
