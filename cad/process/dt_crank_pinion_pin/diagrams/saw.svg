<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above, to scale at 200 px/in: the Ø.125 rod (process.stock_dia_in), the scribe .58 (process.saw_length_in) from the end faced in Op 10, the blade on its far side. The saw's vise jaws are schematic (not on record); the blade's kerf is not on record: drawn as a heavy line at the cut. The rod runs on to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="260"/>
  <text class="title" x="20" y="22">Setup 2, Op 20: the pin's .58 piece off the rod's faced end, from above (to scale, 200 px/in)</text>
  <rect class="fixture-table" x="20" y="57.5" width="720" height="135"/>
  <rect class="part-kept" x="120" y="127.5" width="116" height="25"/>
  <path class="part-rest" d="M236 127.5L730 127.5L727 135.83L730 144.17L730 152.5L236 152.5Z"/>
  <rect class="clamp" x="326" y="93.5" width="130" height="34"/>
  <rect class="clamp" x="326" y="152.5" width="130" height="34"/>
  <text class="label-on-clamp" x="334" y="115.5">saw vise</text>
  <text class="label" x="326" y="83.5">saw vise on the long end (jaws schematic)</text>
  <rect class="cutter" x="237" y="95" width="3" height="90"/>
  <line class="datum" x1="120" y1="112" x2="120" y2="168"/>
  <text class="datum-label" x="114" y="106" text-anchor="end">faced end (Op 10)</text>
  <text class="label" x="120" y="206">scribe line {{process.saw_length_in:.2dot}} from the faced end; the blade on its far side;</text>
  <text class="label" x="120" y="222">the piece drops clear onto the saw base: pick it up only once the blade stops</text>
  <text class="label" x="120" y="246">Ø1/8 drill rod; file the burr off the sawn end</text>
</svg>
