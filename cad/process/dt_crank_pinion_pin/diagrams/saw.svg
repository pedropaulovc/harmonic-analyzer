<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="14">
  <rect class="paper" x="0" y="0" width="760" height="300"/>
  <text class="title" x="20" y="24">Plan of the saw bed: the pin's .58 piece off the rod's faced end (not to scale)</text>
  <rect class="fixture-table" x="10" y="50" width="740" height="200"/>
  <rect class="clamp" x="420" y="100" width="300" height="34"/>
  <rect class="clamp" x="420" y="166" width="300" height="34"/>
  <rect class="part-kept" x="120" y="138" width="200" height="24"/>
  <rect class="part-rest" x="330" y="138" width="410" height="24"/>
  <rect class="cutter" x="322" y="70" width="8" height="160"/>
  <line class="datum" x1="120" y1="120" x2="120" y2="180"/>
  <text class="datum-label" x="40" y="116">faced end (Op 10)</text>
  <line class="dims" x1="120" y1="200" x2="320" y2="200"/>
  <line class="dims" x1="120" y1="192" x2="120" y2="208"/>
  <line class="dims" x1="320" y1="192" x2="320" y2="208"/>
  <text class="label" x="90" y="246">scribe line .58 from the faced end</text>
  <text class="label" x="124" y="132">the pin's piece: let it drop clear</text>
  <text class="label" x="300" y="66">blade on the far side of the line</text>
  <text class="label" x="470" y="92">saw vise: the long end of the 1/8 rod</text>
  <text class="label" x="20" y="280">Ø1/8 drill rod; file the burr off the sawn end</text>
</svg>
