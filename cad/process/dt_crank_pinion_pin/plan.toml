# Crank pinion pin MHA-DT-29, one off (owner ruling 2026-11-21: turned parts
# get lathe travelers, no NC; bench and trivially cut parts get travelers
# too). Route chosen for speed: the fewest honest steps. Nothing is turned: the
# 1/8 in drill rod's diameter is the drawing's STOCK, AS SUPPLIED reference.
# Each end is faced on the manual PM-1127VF-LB with under 3 diameters out of
# the 3-jaw (the shop's unsupported stickout limit; a .56 pin parted off the
# rod would stand .81 out), so the pin is sawn, not parted. Setup 1: face the
# rod end (Z0). Setup 2 at the saw: a .58 piece off the faced end. Setup 3:
# the piece turned round, the sawn end faced to the .55-.57 length, measured
# between skims. Bench: break the edges, check the length, oil (FINISH:
# bright, oiled). The hole it drives into is match-drilled at assembly
# (MHA-DT-10).
#
# Stock: 1/8 in drill rod is to order (cad/config/shop-equipment/
# stock-to-order.toml drill-rod-1-8, a 3 in piece); none is on hand, and no
# 1/8 in 1018 CF round (the drawing's other choice) is owned either.
title = "Crank Pinion Pin"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "Drill rod, 1/8 in (drawing: AISI 1018 CF or drill rod, 1/8 in)"
stock = "Qty {{process.quantity:g}}. Ø{{process.stock_dia_in:.3dot}} drill rod, a 3 in piece (to order, not on hand); the pin takes {{process.saw_length_in:.2dot}} in of it."
shop = "../shop"
stock_refs = ["drill-rod-1-8"]
material_key = "lathe-o1-drill-rod"

# The shop's standing page carries what every traveler shares (units, lathe
# speeds, coolant); nothing else in the old note was only this pin's.
standing = true

[cad]
file = "../../out/features/dt_crank_pinion_pin/features.toml"
adapter = "turned_bush"
part = "dt-crank-pinion-pin"

[parameters]
quantity = 1
stock_dia_in = 0.125
# Sawn off the faced end: the .56 pin and the facing allowance left on the
# sawn end, which also takes up the saw's squareness.
saw_length_in = 0.58
# Facing allowance: squares the rod's end in Setup 1.
face_allowance_in = 0.02
# Left on the sawn end for Setup 3 to face the pin to length.
regrip_allowance_in = 0.02
# The saw's kerf (authored; the blade is not measured on record).
part_kerf_in = 0.09
# How much of the piece the 3-jaw takes in Setup 3.
regrip_grip_in = 0.4

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "saw"
name = "14 in metal-cutting saw"
ref = "saw-evolution-14"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "lathe"
title = "Lathe: face the rod end"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the Ø{{process.stock_dia_in:.3dot}} rod (the jaws close on the pin's as-supplied O.D.), {{cad.outer_stickout_datum_mm:in.2dot}} in out of the jaw fronts; the rest of the 3 in piece runs back through the jaws into the spindle bore."
datum = "Z0 (carriage DRO) the rod end faced in Op 10."
diagram = { file = "diagrams/bar.svg", alt = "The 1/8 in drill rod in the 3-jaw over a shim wrap with little out: its end faced square." }
# The 1/8 rod is under the 3-jaw's .1750 least grip (owner 2026-11-24;
# workholding.chuck-3jaw-6): this hold is impossible as written, #3498.
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the rod end square in light cuts, {{process.face_allowance_in:.2dot}} in off; set DRO Z0 on it."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Saw: the pin's piece off the faced end"
machine = "Evolution 14 in metal-cutting saw"
holding = "The rod flat on the saw bed, its long end clamped in the saw's vise, the faced end free beyond the blade."
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "Plan of the saw bed: the 1/8 rod's long end in the vise, the blade on the far side of a line .58 from the faced end." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Scribe the rod {{process.saw_length_in:.2dot}} in from the faced end and saw on the far side of the line, the long end clamped in the saw's vise; let the piece drop clear onto the saw base and pick it up only after the blade has stopped. File the burr off the sawn end."
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "Lathe: turned round, face to length"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "3-jaw over a brass shim wrap on the piece turned round, the faced end {{process.regrip_grip_in:.2dot}} in in the jaws; the sawn end {{cad.outer_stickout_far_mm:in.2dot}} in out."
datum = "The Op 10 face, in the jaws: the length is measured across both faces."
diagram = { file = "diagrams/second-end.svg", alt = "The piece turned round, the faced end in the jaws over a shim wrap: the sawn end faced to the pin's length." }
# Under the 3-jaw's .1750 least grip, as the first lathe setup: #3498.
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the sawn end square in light cuts toward the {{cad.length_nominal_in:.2dot}} length: between cuts, stop the spindle, take the piece out and caliper it across both faces, then chuck it again over the shim. Stop inside {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}; Op 50 is the acceptance."
settings = "lathe-ar-o1"
cut_diameter_mm = "{{cad.outer_dia_mm}}"

[[setups]]
machine_kind = "other"
title = "Bench: break the edges, check the length, oil"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished pin: its .56 length and the 1/8 rod outside as supplied." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Break both end edges, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, without rounding the faced ends' flats."
feed = "hand"

[[setups.operations]]
instruction = "Measure the length across the ends with calipers."
inspection = "Length {{cad.length_min_in:.2dot}}–{{cad.length_max_in:.2dot}}."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.length_band_mm}}" }]
feed = "hand"

[[setups.operations]]
instruction = "Over {{cad.length_max_in:.2dot}}: face it again as in Setup 3, then repeat Ops 40 and 50. Under {{cad.length_min_in:.2dot}}: scrap it, not reworked; make another by repeating Setups 1 to 3 on the rest of the rod."
feed = "hand"

[[setups.operations]]
instruction = "Wipe the pin with a light machine-oil film (FINISH: bright, oiled) and bag it with its number."
feed = "hand"
