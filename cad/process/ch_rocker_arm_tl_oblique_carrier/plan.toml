[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
sizing = "other"
instruction = "Tap R1–R4 {{cad.riser_thread}} through."
instruction_detailed = "Put the 4-40 plug tap in the drill chuck over each hole, spindle off, and turn the chuck by hand about three turns with light quill pressure so it starts square. Release the chuck and finish through with the tap wrench, backing off a half turn every turn: a 4-40 tap breaks easily in a chip-packed hole."
feed = "hand"

