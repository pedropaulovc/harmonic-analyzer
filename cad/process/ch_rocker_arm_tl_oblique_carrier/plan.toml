# Sources: drawing MHA-CH-06-TL-21 v49 (three sheets: section A-A underside
# chamfer, sheet 2 hole table and notes 1-2, sheet 3 HUB REF) and its feature
# manifest; the carrier's registry process note (21.3 in length from the owned
# 1/2 x 6 bar, milled to width, no rip; .3760 reamer; HUB drilled and tapped at
# assembly, TL-00 step 10); the base-bar plan's table-clamped edge, end and
# facing sequence and its owner-ruled speeds (same bar, same cutters); logbook
# 2026-11-05/06 for the owned 1-2-3 blocks and LMS 1268 strap clamps.
#
# Workholding differs from the registry note, which mills the width "on edge in
# the vise": standing 6 in tall on edge the bar is gripped at most the 1.77 in
# jaw height, under the shop's one-third rule (2.0 in), so vise_holding refuses
# it. The whole plate is therefore made flat on the table, vise off, on four
# 1-2-3 blocks placed between hole columns so every through hole breaks out
# over air, as the base bar's edges and ends are. Coordinates are sheet 2's:
# X/Y from the lower-left corner (ZERO END, ZERO EDGE), all from one DRO zero.
# Note 2's relations (B1, A2, B2, CL, CR, R1-R4 from A1 in X and the A1-B1 line
# in Y) are inspected before tapping by centring the DTI on a pin in each hole;
# A1 and the L rows, located from the corner, are checked with calipers.
#
# The pin holes' underside chamfer (.012 min x 45°, sheet 1 section A-A) has
# no manifest record, so its leg is authored from the sheet; the TL-VN-78
# spacer's smallest OD (.625 -.005, AS62-18-40) bounds its mouth.
title = "Oblique trammel carrier"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{cad.material_spec}}; {{process.quantity:d}} × {{process.blank_length_in:.2f}} in blank."
note = "Inches. X/Y from the lower-left corner (ZERO END, ZERO EDGE), as sheet 2. Vise off: the plate stays flat on the table on four 1-2-3 blocks under strap clamps. HUB is drilled and tapped at assembly (TL-00 step 10), not here."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_carrier/features.toml"
adapter = "harmonic_carrier"

[parameters]
blank_length_in = 21.3           # Registry process note: a 21.3 in length.
blank_min_length_in = 20.8       # Author's choice: ≥.15 to clean up each sawn end.
blank_width_in = 6.0
blank_thickness_in = 0.5
quantity = 1
kerf_in = 0.125                  # Hand sheets: about 1/8 in per cut.
# Four 1-2-3 blocks lying flat (1 in up), 2 in along the plate and 3 in across
# it, centred on the width, mirrored about mid-length. The adapter refuses a
# block under any hole (HUB included): these sit between hole columns.
block_length_in = 2.0
block_width_in = 3.0
# Strap toes land on the blocks, never on the overhang beyond them: the toe's
# centre is 1.35 in in from a long edge, inside the blocks' 1.05-4.05 in span
# across the 5.1 in plate. The adapter refuses a toe outside the blocks.
strap_toe_in = 1.35
block_inner_offset_in = 3.15
block_outer_offset_in = 7.55
# Sheet 1 section A-A: .012 min x 45°, 4X UNDERSIDE, SEATS ON TL-VN-78 SPACER.
pin_chamfer_min_in = 0.012
# TL-VN-78 (AS62-18-40) OD .625 -.005: the chamfer mouth stays inside its seat.
spacer_seat_dia_in = 0.62
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection), as in the base-bar
# plan.
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in up.
edge_cut_tip_z_mm = -2.032       # Edge cutter .04–.08 in below the underside.
end_cut_tip_z_mm = -1.016        # End cutter .04 in below the plate.
# A chucking reamer's lead runs about .3 in past the underside to size the bore.
ream_tip_z_mm = -7.62
cutter_dia_mm = 12.7             # 1/2 in end mill (edges, ends).
face_cutter_dia_mm = 19.05       # 3/4 in end mill (faces).
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
half_mill_projection_min_mm = 41.0  # Archive LMS 6784 neighbours bound 1/2 in.
half_mill_projection_max_mm = 50.0
face_mill_projection_mm = 57.0   # Archive LMS 6784 3/4 in projection.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
spot_projection_mm = 27.0        # Archive center-drills-lms-4859 #2, drill chuck.
# ANSI B94.2 3/8 in straight-shank chucking reamer: 7 in overall; its whole
# length bounds its projection from the drill chuck.
reamer_oal_mm = 177.8

