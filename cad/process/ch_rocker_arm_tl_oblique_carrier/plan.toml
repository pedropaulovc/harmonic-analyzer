# Sources: drawing MHA-CH-06-TL-21 (three sheets: edge-view thickness,
# sheet 2 hole table and notes 1-2, sheet 3 HUB REF) and its feature
# manifest; the carrier's registry process note (21.3 in length from the owned
# 1/2 x 6 bar, clamped flat on the table, no rip; holes from the sheet 2
# corner; .3760 reamer; HUB drilled and tapped at assembly, TL-00 step 10;
# owner rulings 2026-11-13); the base-bar plan's table-clamped edge, end and
# facing sequence and its owner-ruled speeds (same bar, same cutters); logbook
# 2026-11-05/06 for the owned 1-2-3 blocks and LMS 1268 strap clamps.
#
# Workholding: standing 6 in tall on edge the bar would be gripped at most the
# 1.77 in jaw height, under the shop's one-third rule (2.0 in), so vise_holding
# refuses it. The whole plate is made flat on the table, vise off, on four
# 1-2-3 blocks placed between hole columns so every through hole breaks out
# over air, as the base bar's edges and ends are. Coordinates are sheet 2's:
# X/Y from the lower-left corner (ZERO END, ZERO EDGE), all from one DRO zero.
# Note 2's relations (B1, A2, B2, CL, CR, R1-R4 from A1 in X and the A1-B1 line
# in Y) are inspected before tapping by centring the DTI on a pin in each hole;
# L1/L2 and A1 itself (located from the corner) are read in the same check,
# the corner zero kept.
#
# Blind review 2026-11-14: TOP alone is faced, and only when the sawn bar is
# over .480 (X1: neither flatness nor parallelism is toleranced); the ends
# rough at .100 (X2); the edges keep .080 roughing, since .150 bends the
# two-strap blank 0.15 mm (milling_deflection, X3 refused); the reamer keeps
# the owner-ruled 3000 rpm (#2748) and gains a test hole and a runout check
# (S1's safeguards; its lower speed is not taken).
#
# The pin holes' underside edges carry the title block's edge break only, no
# chamfer (owner ruling 2026-11-13): the TL-VN-78 spacers seat on them.
# Reamed Ø.3760–.3770 (owner ruling 2026-11-13: what the owned .3760 over
# reamer cuts), gauged with the owned pin-gauge set, .376 GO / .377 NO-GO.
title = "Oblique trammel carrier"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "6061-T6511 aluminium"
stock = "{{cad.material_spec}}; {{process.quantity:d}} × {{process.blank_length_in:.2f}} in blank."
note = "Inches. X/Y from the lower-left corner (ZERO END, ZERO EDGE), as sheet 2. Vise off: the plate stays flat on the table on four 1-2-3 blocks under strap clamps. HUB is drilled and tapped at assembly (TL-00 step 10), not here."
shop = "../shop.toml"
material_key = "6061-t6511"

[cad]
file = "../../out/features/ch_rocker_arm_tl_oblique_carrier/features.toml"
adapter = "harmonic_carrier"

[parameters]
blank_length_in = 21.3           # Registry process note: a 21.3 in length.
blank_min_length_in = 20.8       # Author's choice: ≥.15 to clean up each sawn end.
blank_width_in = 6.0
blank_thickness_in = 0.5
quantity = 1
kerf_in = 0.125                  # Hand sheets: about 1/8 in per cut.
# Four 1-2-3 blocks lying flat (1 in up), 2 in along the plate and 3 in across
# it, centred on the width, mirrored about mid-length. The adapter refuses a
# block under any hole (HUB included): these sit between hole columns.
block_length_in = 2.0
block_width_in = 3.0
# Strap toes land on the blocks, never on the overhang beyond them: the toe's
# centre is 1.35 in in from a long edge, inside the blocks' 1.05-4.05 in span
# across the 5.1 in plate. The adapter refuses a toe outside the blocks.
strap_toe_in = 1.35
block_inner_offset_in = 3.15
block_outer_offset_in = 7.55
# TL-VN-78 (AS62-18-40) OD .625 -.005: the adapter checks the broken underside
# edge stays inside its seat; the setup 7 picture draws it.
spacer_seat_dia_in = 0.62
# Machine-capacity inputs (mm). Heights are above the mill table; tool lengths
# run from spindle nose to tip (holder gauge + projection), as in the base-bar
# plan.
block_height_mm = 25.4           # 1-2-3 blocks lying flat, 1 in up.
edge_cut_tip_z_mm = -2.032       # Edge cutter .04–.08 in below the underside.
end_cut_tip_z_mm = -1.016        # End cutter .04 in below the plate.
# A chucking reamer's lead runs about .3 in past the underside to size the bore.
ream_tip_z_mm = -7.62
cutter_dia_mm = 12.7             # 1/2 in end mill (edges, ends).
face_cutter_dia_mm = 19.05       # 3/4 in end mill (faces).
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
half_mill_projection_min_mm = 41.0  # Archive LMS 6784 neighbours bound 1/2 in.
half_mill_projection_max_mm = 50.0
face_mill_projection_mm = 57.0   # Archive LMS 6784 3/4 in projection.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
spot_projection_mm = 27.0        # Archive center-drills-lms-4859 #2, drill chuck.
# ANSI B94.2 3/8 in straight-shank chucking reamer: 7 in overall; its whole
# length bounds its projection from the drill chuck.
reamer_oal_mm = 177.8

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"
[[tools]]
id = "em-half"
name = "1/2 in end mill"
ref = "basebar-em-half"
[[tools]]
id = "em-face"
name = "3/4 in end mill"
ref = "basebar-em-face"
[[tools]]
id = "spot"
name = "#2 centre drill"
ref = "jig-spot"
[[tools]]
id = "drill-43"
name = "#43 drill"
ref = "jig-drill-43"
[[tools]]
id = "drill-29"
name = "#29 drill"
ref = "jig-drill-29"
[[tools]]
id = "drill-f"
name = "F drill"
ref = "jig-drill-f"
[[tools]]
id = "drill-23-64"
name = "23/64 drill"
ref = "jig-drill-23-64"
[[tools]]
id = "reamer"
name = ".3760 reamer"
ref = "reamer-0376"
[[tools]]
id = "tap-4-40"
name = "4-40 plug tap"
ref = "jig-tap-4-40-plug"
[[tools]]
id = "tap-8-32"
name = "8-32 plug tap"
ref = "jig-tap-8-32-plug"
[[tools]]
id = "tap-5-16"
name = "5/16-18 plug tap"
ref = "jig-tap-5-16-18-plug"
# Job-specific gauging and setup equipment, not cutting tools: the .376 and
# .377 pins from the owned pin-gauge set (shop.toml gauges.pin-gauges) and the
# .200 in edge finder (logbook 2026-11-04).
[[tools]]
id = "pins-0376"
name = ".376 GO / .377 NO-GO pins"
description = ".376 and .377 pins from the owned pin-gauge set (.001 in steps)"
[[tools]]
id = "edge-finder"
name = ".200 in edge finder"
description = ".200 in edge finder (X0, Y0 for the holes)"

[[setups]]
machine_kind = "other"
title = "Saw blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
diagram = { file = "diagrams/carrier/saw.svg", alt = "The carrier blank from the 1173 bar" }
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:.2f}} from the 1173 bar, waste side of the line; blank ≥{{process.blank_min_length_in:.2f}}. Mic its thickness at the four corners and mid-length; T = thinnest."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Both long edges to width"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on four 1-2-3 blocks (1 in up, 3 in across, centred on the width) at {{cad.block_blank_stations}} from the sawn left end (the {{process.blank_length_in:.2f}} blank trims equally to {{cad.block_stations}} from the finished ZERO END); both long edges overhang. One strap at each end, along X at mid-width, toe over the end block; edges clear."
# milling_deflection: blocks only push up, so the two end straps (over the end
# blocks) are the only hold against the end mill's lift: a pinned span between
# them, X from the blank's left end. Section: the finished width (the back
# edge's last pass, the narrowest) at the blank thickness.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.end_block_blank_x_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
datum = "Face up = TOP. Front edge milled first becomes ZERO EDGE. +X right, +Y away."
diagram = { file = "diagrams/carrier/edges.svg", alt = "Blank flat on four 1-2-3 blocks with an end strap at mid-width of each end; front edge cut in +X makes ZERO EDGE, back edge cut in −X finishes the width" }
# Cutter centre runs past both blank ends and across the 6 in blank.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.edge_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04–.08 below underside. Front edge in +X, conventional; rough .050–.080 radial, finish .005–.010; take about half the {{process.blank_width_in:.1f}} − {{cad.width_in:.1f}} excess. Mark ZERO EDGE on TOP. Keep this clamping."
settings = "basebar-edge-6061-t6511"
# Settings: 1250 rpm, 6 in/min (152.4 mm/min), 1/2 in 2-flute: .0024 in/tooth.
milling_cuts = [
  { name = "front edge rough .080", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.032, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "front edge finish .010", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Back edge in −X, conventional; rough .050–.080 radial, finish to {{cad.width_in:.1f}} wide from ZERO EDGE."
settings = "basebar-edge-6061-t6511"
milling_cuts = [
  { name = "back edge rough .080", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.032, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
  { name = "back edge finish .010", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, traverse_mm = [0, "{{cad.blank_length_mm}}"] },
]
inspection = "Width {{cad.width_min_in:.1f}}–{{cad.width_max_in:.1f}} at both ends and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Both ends to length"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Plate stays on the blocks. Add two straps across the finished long edges, toes {{process.strap_toe_in:.2f}} in from the edge over the two end blocks (front at the left, back at the right); snug, then remove the end straps. Do not move the plate."
# milling_deflection: the edge straps over the end blocks hold the plate both
# ways (straps over the inner blocks left a 7.5 in overhang that bent 0.037 mm
# under the right end's finish pass). Blank frame; finished width at the blank
# thickness. Both end cuts are declared at the blank's ends, the farthest out.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.blank_length_mm}}"], supports_mm = "{{cad.end_block_blank_x_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.blank_thickness_mm}}" } }
datum = "First squared end (left) becomes ZERO END, X0. Keep ZERO EDGE."
diagram = { file = "diagrams/carrier/ends.svg", alt = "Straps moved onto the long edges over the end blocks; left end squared in −Y to ZERO END, right end cut in +Y to length" }
# Cutter centre runs past both ends (final X = length + D/2) and across the width.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.end_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04 below plate. Left end in −Y: .100 passes, last .010; with the cutter touching it set X = −D/2 (D = measured cutter Ø); mark ZERO END on TOP. Right end in +Y: .100 passes, last .010 at cutter-centre X = {{cad.length_in:.3f}} + D/2."
instruction_detailed = "Measure the cutter, D. Cutter .04 below the plate. Square the left end in −Y: .100 passes down to a last .010 pass; with the cutter still touching that end, set DRO X = −D/2, so X0 is the end face; mark ZERO END on TOP. Right end in +Y: .100 passes, reading the length on the DRO, until a last .010 pass at cutter-centre X = {{cad.length_in:.3f}} + D/2."
settings = "basebar-edge-6061-t6511"
milling_cuts = [
  { name = "left end .100 rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.54, rpm = 1250, feed_mm_min = 152.4, stations_mm = 0 },
  { name = "left end last .010 to ZERO END", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, stations_mm = 0 },
  { name = "right end .100 rough", kind = "side", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 2.54, rpm = 1250, feed_mm_min = 152.4, stations_mm = "{{cad.blank_length_mm}}" },
  { name = "right end last .010 to length", kind = "side", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 12.7, flutes = 2, axial_doc_mm = "{{cad.blank_thickness_mm}}", radial_woc_mm = 0.254, rpm = 1250, feed_mm_min = 152.4, stations_mm = "{{cad.blank_length_mm}}" },
]
inspection = "Length {{cad.length_min_in:.1f}}–{{cad.length_max_in:.1f}} on the DRO from ZERO END."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.length_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Face TOP to thickness"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Same blocks and edge straps (over the end blocks). Each edge strap's footprint (the edge to its toe, plus a cutter radius) stays unfaced until the last full-area pass at final Z; then end straps back on at mid-width over the end blocks, toes on faced metal with paper under them, and the edge straps off."
# Blind review X1: neither flatness nor parallelism is toleranced and the
# drawing needs only .460-.480 thick, so TOP alone is faced (UNDERSIDE stays
# as the T6511 bar came), and not at all when the sawn bar already reads
# inside the band. milling_deflection: both clampings hold at the end blocks;
# finished-length frame, section at the finished size (the thinnest).
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = "{{cad.end_block_x_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
datum = "Z from T (Setup 1). Keep ZERO END and ZERO EDGE marks."
diagram = { file = "diagrams/carrier/face-top.svg", alt = "TOP faced to thickness on the blocks under the edge straps; then the end straps on faced metal and the edge-strap footprints faced at the same Z" }
# Arrives at blank thickness; the last pass leaves the finished top.
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{cad.thickness_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "If T is {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}}, skip to the check. Else face TOP only, +X, +Y stepover .60: passes ≤.030 to Z {{cad.thickness_max_in:.3dot}}, last pass to Z {{cad.thickness_in:.3dot}}; then the footprints as above, same Z."
instruction_detailed = "If the thinnest reading of T (Setup 1) is already {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}}, the plate meets the drawing: skip the facing and do the check below. Otherwise touch TOP with a cigarette paper at mid-length and set Z = T. Face TOP only, feeding +X along the whole length and stepping .60 in +Y, round each edge strap's footprint: passes of .030 or less down to Z = {{cad.thickness_max_in:.3dot}}, then a last pass to Z = {{cad.thickness_in:.3dot}}. After that last full-area pass, without touching Z: put the end straps back on at mid-width over the end blocks, toes on faced metal with paper under them, snug them, then take the edge straps off and face their footprints at the same Z. UNDERSIDE stays as the bar came."
settings = "basebar-face-6061-t6511"
# Settings: 850 rpm, 6.8 in/min (172.72 mm/min), 3/4 in 4-flute: .002 in/tooth.
milling_cuts = [
  { name = "TOP passes ≤.030 to .480", kind = "end", phase = "rough", material = "aluminum_6061", cutter_dia_mm = 19.05, flutes = 4, axial_doc_mm = 0.762, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.length_mm}}"] },
  { name = "TOP last pass .010", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 19.05, flutes = 4, axial_doc_mm = 0.254, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, traverse_mm = [0, "{{cad.length_mm}}"] },
  { name = "edge-strap footprints", kind = "end", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 19.05, flutes = 4, axial_doc_mm = 0.762, radial_woc_mm = 15.24, rpm = 850, feed_mm_min = 172.72, stations_mm = "{{cad.end_block_x_mm}}" },
]
inspection = "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} at the four corners and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Holes: spot, drill, ream, tap"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Plate stays on the blocks, TOP up, ZERO END left, ZERO EDGE front: block centres at X {{cad.block_stations}} ±.06. ZERO EDGE indicated along X within .002 over its length. One strap over each block (alternate front/back), toe {{process.strap_toe_in:.2f}} in from the edge on the block: blocks and toes sit between hole columns. Before the first drill, sight under A1, B1, CL and CR: each clears its block by about 1/8."
datum = "X0 ZERO END, Y0 ZERO EDGE (edge finder); +X right, +Y away. HUB is not drilled here."
diagram = { file = "diagrams/carrier/holes.svg", alt = "Plate TOP up on the blocks with one strap over each; all twelve tabled holes from X0 Y0 at the lower-left corner; HUB shown dashed, made at assembly" }
# Hole centres lie inside the plate. Longest: the chucking reamer in the drill
# chuck; shortest: the centre drill. The reamer's lead runs deepest.
envelope = { x_span_mm = "{{cad.length_mm}}", y_span_mm = "{{cad.width_mm}}", work_top_mm = ["{{process.block_height_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.ream_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.spot_projection_mm}}"] }
vise_hold = "other"
# milling_deflection: a strap over each block clamps the plate both ways there;
# every hole is over air between blocks. The check takes two supports per
# operation, so each hole group declares the two clamps that bracket it and
# ignores the others (the weaker hold): R1–R4 and L1, L2 between the inner
# blocks (R3, R4 as overhangs past them); CL, CR between the end blocks; A1,
# A2, B1, B2 beyond the end blocks' outer edges, the fulcrum a drill's thrust
# bends the plate over (cantilever from block_span_mm). Drills and spots are
# hand fed; each cut states the chip load the operator applies (in/rev = 2 ×
# feed_per_tooth_mm). The finished section.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = "{{cad.inner_block_x_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot A1, A2, B1, B2 (full Ø.19 cone) and CL, CR (cone just under .136) from one X0/Y0, each axis approached from the same side. Note 2: B1, A2, B2, CL, CR, R1–R4 ±{{cad.location_tol_in:.3dot}} from A1 in X and the A1–B1 line in Y; A2, B2 {{cad.outer_row_in:.3dot}} ±{{cad.outer_row_tol_in:.3dot}} above that line."
instruction_detailed = "Edge-find ZERO END for X0 and ZERO EDGE for Y0. Spot A1, A2, B1, B2, CL and CR at the table's X/Y: CL and CR with the cone just under the #29 (.136); A1, A2, B1, B2 down to the full Ø.19 body, the largest cone a #2 centre drill cuts, so the 23/64 starts true. R1–R4, L1 and L2 follow in the next op. Every position is ±{{cad.location_tol_in:.3dot}}, except that A2 and B2 sit {{cad.outer_row_in:.3dot}} ±{{cad.outer_row_tol_in:.3dot}} above the A1–B1 line. Sheet 2's note 2 measures B1, A2, B2, CL, CR and R1–R4 from A1 and that line, not from the corner, so keep one zero for every hole and approach each X and each Y from the same side: the holes then sit right relative to A1 even if the edge-find is a little off."
rpm = 3000
feed = "hand"
# The #2 centre drill's Ø3/16 body cone, .001 in/rev.
beam = { axis = "x", hold = "between", extent_mm = [0, "{{cad.length_mm}}"], supports_mm = "{{cad.end_block_x_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [
