name = ".200 in edge finder"
description = ".200 in edge finder (X0, Y0 for the holes)"

[[setups]]
machine_kind = "other"
title = "Saw blank"
machine = "Saw / bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
diagram = { file = "diagrams/carrier/saw.svg", alt = "The carrier blank from the 1173 bar" }

[[setups.operations]]
speed_kind = "other"
tool = "saw"
sizing = "other"
instruction = "Saw {{process.quantity:d}} × {{process.blank_length_in:.2f}} from the 1173 bar, waste side of the line; blank ≥{{process.blank_min_length_in:.2f}}. Mic its thickness at the four corners and mid-length; T = thinnest."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Both long edges to width"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Flat on four 1-2-3 blocks (1 in up, 3 in across, centred on the width) at {{cad.block_stations}} from the finished ZERO END (blank ~{{process.blank_length_in:.1f}} long, trim equal); both long edges overhang. One strap at each end, along X at mid-width, toe over the end block; edges clear."
datum = "Face up = TOP. Front edge milled first becomes ZERO EDGE. +X right, +Y away."
diagram = { file = "diagrams/carrier/edges.svg", alt = "Blank flat on four 1-2-3 blocks with an end strap at mid-width of each end; front edge cut in +X makes ZERO EDGE, back edge cut in −X finishes the width" }
# Cutter centre runs past both blank ends and across the 6 in blank.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.blank_width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.edge_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04–.08 below underside. Front edge in +X, conventional; rough .050–.080 radial, finish .005–.010; take about half the {{process.blank_width_in:.1f}} − {{cad.width_in:.1f}} excess. Mark ZERO EDGE on TOP. Keep this clamping."
settings = "basebar-edge-6061-t6511"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Back edge in −X, conventional; rough .050–.080 radial, finish to {{cad.width_in:.1f}} wide from ZERO EDGE."
settings = "basebar-edge-6061-t6511"
inspection = "Width {{cad.width_min_in:.1f}}–{{cad.width_max_in:.1f}} at both ends and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.width_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Both ends to length"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Plate stays on the blocks. Add two straps across the finished long edges, toes {{process.strap_toe_in:.2f}} in from the edge over the two inner blocks (one from the front, one from the back); snug, then remove the end straps. Do not move the plate."
datum = "First squared end (left) becomes ZERO END, X0. Keep ZERO EDGE."
diagram = { file = "diagrams/carrier/ends.svg", alt = "Straps moved onto the long edges over the inner blocks; left end squared in −Y to ZERO END, right end cut in +Y to length" }
# Cutter centre runs past both ends (final X = length + D/2) and across the width.
envelope = { x_span_mm = ["{{cad.blank_length_mm}}", "{{process.cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.end_cut_tip_z_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.half_mill_projection_min_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
sizing = "other"
instruction = "Cutter .04 below plate. Square left end in −Y, .020 passes; mark ZERO END on TOP. Right end in +Y, .010 passes; final cutter-centre X = {{cad.length_in:.3f}} + D/2 (D = measured cutter Ø)."
instruction_detailed = "Measure the cutter, D. Cutter .04 below the plate. Square the left end in −Y with .020 passes; with the cutter still touching that end, set DRO X = −D/2, so X0 is the end face; mark ZERO END on TOP. Right end in +Y with .010 passes; read the length on the DRO before the last pass; last pass at cutter-centre X = {{cad.length_in:.3f}} + D/2."
settings = "basebar-edge-6061-t6511"
inspection = "Length {{cad.length_min_in:.1f}}–{{cad.length_max_in:.1f}} on the DRO from ZERO END."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.length_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Face TOP"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Same blocks and edge straps. After the first pass over all but the two toe patches: end straps back on at mid-width over the end blocks, toes on faced metal with paper under them; then remove the edge straps."
datum = "Z from T (Setup 1). Keep ZERO END and ZERO EDGE marks."
diagram = { file = "diagrams/carrier/face-top.svg", alt = "TOP faced on the blocks under the edge straps; then the end straps on faced metal and the two toe patches faced at the same Z" }
# Arrives at blank thickness; the deepest pass leaves the finished top.
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{cad.thickness_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Take half of (T − {{cad.thickness_in:.3dot}}) off TOP: .010 per pass, +X, +Y stepover .60, all but the two toe patches. Move the straps as above; face both patches at the same Z."
instruction_detailed = "Touch TOP with a cigarette paper at mid-length and set Z = T. Take half of (T − {{cad.thickness_in:.3dot}}) off TOP in .010 passes: feed +X along the whole length, step .60 in +Y, leaving a cutter's width round each edge-strap toe. Without touching Z: put the end straps back on at mid-width over the end blocks, toes on faced metal with paper under them, snug them, then take the edge straps off and face the two toe patches."
settings = "basebar-face-6061-t6511"

[[setups]]
machine_kind = "other"
title = "Face UNDERSIDE to thickness"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Rolled over on the same blocks, UNDERSIDE up: ZERO END still left, ZERO EDGE now at the back. Edge straps over the inner blocks; then the end straps for the toe patches, as Setup 4."
datum = "Z from the plate's measured thickness after Setup 4."
diagram = { file = "diagrams/carrier/face-under.svg", alt = "Plate rolled over, UNDERSIDE up and ZERO EDGE at the back, faced to thickness in the same two clampings" }
envelope = { x_span_mm = ["{{cad.length_mm}}", "{{process.face_cutter_dia_mm}}"], y_span_mm = ["{{cad.width_mm}}", "{{process.face_cutter_dia_mm}}"], work_top_mm = ["{{process.block_height_mm}}", "{{cad.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{cad.thickness_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.face_mill_projection_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-face"
sizing = "other"
instruction = "Face UNDERSIDE to {{cad.thickness_in:.3dot}}: .010 roughing passes, last pass .003–.005; toe patches after the strap move, same Z. Mark UNDERSIDE."
instruction_detailed = "Mic the plate again (T1). Touch UNDERSIDE with a cigarette paper and set Z = T1. Face down to Z = {{cad.thickness_in:.3dot}} with .010 passes and a .003–.005 last pass, +X, .60 stepover, round the edge-strap toes; move the straps as in Setup 4 and face the two patches at the same Z. Mark UNDERSIDE."
settings = "basebar-face-6061-t6511"
inspection = "Thickness {{cad.thickness_min_in:.3dot}}–{{cad.thickness_max_in:.3dot}} at the four corners and mid-length."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.thickness_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Holes: spot, drill, ream, tap"
machine = "PM-30MV, vise off; inch DRO"
indexing = "none"
machine_ref = "pm-30mv"
holding = "Rolled back, TOP up, ZERO END left, ZERO EDGE front, on the blocks at X {{cad.block_stations}}. ZERO EDGE indicated along X within .002 over its length. One strap over each block (alternate front/back), toe {{process.strap_toe_in:.2f}} in from the edge on the block: blocks and toes sit between hole columns."
datum = "X0 ZERO END, Y0 ZERO EDGE (edge finder); +X right, +Y away. HUB is not drilled here."
diagram = { file = "diagrams/carrier/holes.svg", alt = "Plate TOP up on the blocks with one strap over each; all twelve tabled holes from X0 Y0 at the lower-left corner; HUB shown dashed, made at assembly" }
# Hole centres lie inside the plate. Longest: the chucking reamer in the drill
# chuck; shortest: the centre drill. The reamer's lead runs deepest.
envelope = { x_span_mm = "{{cad.length_mm}}", y_span_mm = "{{cad.width_mm}}", work_top_mm = ["{{process.block_height_mm}}", "{{cad.thickness_mm}}"], deepest_cut_mm = ["{{process.block_height_mm}}", "{{process.ream_tip_z_mm}}"], longest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.reamer_oal_mm}}"], shortest_tool_mm = ["{{process.drill_chuck_gauge_mm}}", "{{process.spot_projection_mm}}"] }
vise_hold = "other"

[[setups.operations]]
speed_kind = "spindle"
tool = "spot"
sizing = "other"
instruction = "Spot all {{cad.hole_count:d}} holes from one X0/Y0, each axis approached from the same side. Note 2: B1, A2, B2, CL, CR, R1–R4 ±{{cad.location_tol_in:.3dot}} from A1 in X and the A1–B1 line in Y; A2, B2 {{cad.outer_row_in:.3dot}} ±{{cad.outer_row_tol_in:.3dot}} above that line."
instruction_detailed = "Edge-find ZERO END for X0 and ZERO EDGE for Y0. Spot all {{cad.hole_count:d}} holes at the table's X/Y, cone just under each drill. Every position is ±{{cad.location_tol_in:.3dot}}, except that A2 and B2 sit {{cad.outer_row_in:.3dot}} ±{{cad.outer_row_tol_in:.3dot}} above the A1–B1 line. Sheet 2's note 2 measures B1, A2, B2, CL, CR and R1–R4 from A1 and that line, not from the corner, so keep one zero for every hole and approach each X and each Y from the same side: the holes then sit right relative to A1 even if the edge-find is a little off."
rpm = 3000
feed = "hand"

[setups.operations.table]
columns = ["Hole", "X", "Y", "Thread / bore"]
rows = "{{cad.hole_rows}}"

# Drill speeds: LittleMachineShop drilling and reaming table, row wrought
# aluminium 6061-T6: 350-400 ft/min drilling and reaming, above the PM-30MV's
# 3000 rpm top speed for every size here.
[[setups.operations]]
speed_kind = "spindle"
tool = "drill-43"
sizing = { kind = "band", band_mm = "{{cad.riser_drill_band_mm}}" }
instruction = "R1–R4 through; peck .1."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-29"
sizing = { kind = "band", band_mm = "{{cad.clamp_drill_band_mm}}" }
instruction = "CL, CR through; peck .1."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-f"
sizing = { kind = "band", band_mm = "{{cad.lever_drill_band_mm}}" }
instruction = "L1, L2 through; peck .1."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "drill-23-64"
sizing = "other"
instruction = "A1, B1, A2, B2 through for the reamer; peck .1."
rpm = 3000
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "reamer"
sizing = { kind = "band", band_mm = "{{cad.pin_dia_band_mm}}" }
instruction = "Ream A1, B1, A2, B2 through."
instruction_detailed = "Reamer in the drill chuck at the same X/Y as each 23/64 hole. Brush on cutting fluid (WD-40 or kerosene for aluminium) and feed down in one steady pass until the full-diameter flutes are through the underside; do not dwell or stop in the bore. Withdraw with the spindle still running, then wipe the chips off the flutes before the next hole."
rpm = 3000
feed = "hand"
inspection = "Ø{{cad.pin_dia_min_in:.4dot}}–{{cad.pin_dia_max_in:.4dot}}: GO pin enters full depth, NO-GO does not start, each hole."
gauge_checks = [{ gauge = "pin-0376-go-nogo", band_mm = "{{cad.pin_dia_band_mm}}" }]

[[setups.operations]]
instruction = "Before tapping or unclamping: a pin in each hole (GO pin in the reams, the largest pin gauge that enters each drilled hole). Centre the DTI on each pin: X = mean of its two side flanks, Y = mean of front and back. From A1: X, and Y from the line = Y − B1's Y × X / {{cad.b1_station_in:.3f}}."
instruction_detailed = "Leave the plate clamped and do this before any tap goes in. Put the GO pin in each reamed hole and, in each drilled hole, the largest pin gauge that enters. With the DTI in the spindle, centre on each pin: touch its left and right flanks at the same indicator reading and take the DRO X halfway between; do the same front and back for Y. Zero the DRO on A1's centre. Read every other hole's X and Y. B1's Y tilts the A1–B1 line, so for each hole take Y − B1's Y × X / {{cad.b1_station_in:.3f}}: that is its height above the line. Compare each hole with the table."
inspection = "Every row inside its limits: X from A1, Y from the A1–B1 line."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.b1_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.b2_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.a2_offset_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.cl_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.cr_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r1_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r2_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r3_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r4_station_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.outer_row_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.cl_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.cr_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r1_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r2_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r3_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r4_height_band_mm}}" }]

[setups.operations.table]
columns = ["Hole", "X from A1", "Y from the A1–B1 line"]
rows = "{{cad.relation_rows}}"

[[setups.operations]]
speed_kind = "other"
tool = "tap-4-40"
sizing = "other"
instruction = "Tap R1–R4 {{cad.riser_thread}} through."
instruction_detailed = "Put the 4-40 plug tap in the drill chuck over each hole, spindle off, and turn the chuck by hand about three turns with light quill pressure so it starts square. Release the chuck and finish through with the tap wrench, backing off a half turn every turn: a 4-40 tap breaks easily in a chip-packed hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-8-32"
sizing = "other"
instruction = "Tap CL, CR {{cad.clamp_thread}} through."
instruction_detailed = "Tap CL and CR {{cad.clamp_thread}} through as R1–R4: started square from the drill chuck, spindle off, finished with the tap wrench."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-5-16"
sizing = "other"
instruction = "Tap L1, L2 {{cad.lever_thread}} through."
instruction_detailed = "Tap L1 and L2 {{cad.lever_thread}} through as R1–R4: started square from the drill chuck, spindle off, finished with the tap wrench."
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Underside chamfers / deburr / inspect"
machine = "Bench"
indexing = "none"
envelope = "other"
vise_hold = "other"
diagram = { file = "diagrams/carrier/inspect.svg", alt = "Section at A1 with the 45° underside chamfer inside the TL-VN-78 spacer seat, and the pin-hole relations read from A1" }

[[setups.operations]]
speed_kind = "other"
tool = "csk"
sizing = "other"
instruction = "UNDERSIDE of A1, B1, A2, B2: 45° chamfer, mouth Ø{{cad.chamfer_mouth_min_in:.3dot}} min, inside Ø{{process.spacer_seat_dia_in:.3dot}}."
instruction_detailed = "Plate UNDERSIDE up on the bench. Turn the 90° countersink by hand in each reamed hole, a few even turns at a time, until the chamfer's outer edge measures Ø{{cad.chamfer_mouth_min_in:.3dot}} or a little more all round (the .012 min leg); stop well inside Ø{{process.spacer_seat_dia_in:.3dot}}, where the TL-VN-78 spacer seats. Do not chamfer the TOP side of these bores past the edge break."
feed = "hand"
inspection = "Each underside mouth Ø{{cad.chamfer_mouth_min_in:.3dot}} min, all round."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.chamfer_mouth_band_mm}}" }]

[[setups.operations]]
instruction = "Edges and other hole ends R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; do not countersink threads. Run a screw into every thread."
instruction_detailed = "Break every edge and hole end R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max with a deburring tool; do not countersink the threads. Run a screw of each size in through every thread by hand. Then check the corner-located holes with calipers: GO pin in A1, measure from ZERO END and from ZERO EDGE to the pin's far side and take off half the pin; for L1 and L2, measure from ZERO EDGE to each hole's far edge and take off half the hole."
inspection = "From the corner: A1 X {{cad.a1_station_min_in:.3f}}–{{cad.a1_station_max_in:.3f}}, Y {{cad.a1_row_min_in:.3f}}–{{cad.a1_row_max_in:.3f}}; L1 Y {{cad.l1_row_min_in:.3dot}}–{{cad.l1_row_max_in:.3dot}}, L2 Y {{cad.l2_row_min_in:.3dot}}–{{cad.l2_row_max_in:.3dot}}. 4-40, 8-32 and 5/16-18 screws turn in through by hand."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.a1_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.a1_height_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.l1_row_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.l2_row_band_mm}}" }]
