instruction = "Every edge and hole end, the reamed holes' (A1, B1, A2, B2) undersides included, R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max; do not countersink threads. Run a screw into every thread."
instruction_detailed = "Break every edge and hole end R{{cad.edge_break_in:.3f}} or chamfer {{cad.chamfer_max_in:.3f}} max with a deburring tool, the underside ends of A1, B1, A2, B2 included: the TL-VN-78 spacers seat there, so a light even break, no countersink. Do not countersink the threads. Run a screw of each size in through every thread by hand."
