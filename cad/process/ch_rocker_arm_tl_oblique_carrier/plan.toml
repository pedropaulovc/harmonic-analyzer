[[setups.operations]]
speed_kind = "spindle"
tool = "reamer"
sizing = { kind = "band", band_mm = "{{cad.pin_dia_band_mm}}" }
instruction = "Indicate the reamer's runout in the chuck, ≤.0005. Ream a test hole in the bar's offcut first (same 23/64 drill, same reamer) and gauge it. Then ream A1, B1, A2, B2 through, one steady pass."
instruction_detailed = "Reamer in the drill chuck: indicate it just above the flutes and turn the chuck by hand; re-seat it until the runout reads .0005 or less. Clamp the bar's offcut from Setup 1 beside the plate, drill it 23/64 and ream it exactly as below, then gauge it: the .376 GO pin enters and the .377 NO-GO does not start. If it fails, stop and sort out the reamer before touching the plate: these four holes cannot be reworked. Then, at the same X/Y as each 23/64 hole, brush on cutting fluid (WD-40 or kerosene for aluminium) and feed down in one steady pass, about .004 per revolution (12 in/min, about 2-3 s through), until the full-diameter flutes are through the underside; do not dwell or stop in the bore. Withdraw with the spindle still running, then wipe the chips off the flutes before the next hole."
rpm = 3000
feed = "hand"
# No reamer kind: its thrust is declared as a twist drill's at the reamer Ø
# (the larger, chisel-edge figure), .004 in/rev.
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{cad.length_mm}}"], clamp_mm = "{{cad.block_span_mm}}", section_mm = { y = "{{cad.width_mm}}", z = "{{cad.thickness_mm}}" } }
milling_cuts = [{ name = "ream A1, A2, B1, B2 at .004 in/rev", kind = "drill", phase = "finish", material = "aluminum_6061", cutter_dia_mm = 9.5504, flutes = 2, feed_per_tooth_mm = 0.0508, stations_mm = "{{cad.pin_x_mm}}" }]
inspection = "Ø{{cad.pin_dia_min_in:.4dot}}–{{cad.pin_dia_max_in:.4dot}}: the .376 GO pin enters full depth, the .377 NO-GO does not start, each hole."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.pin_dia_band_mm}}" }]

[[setups.operations]]
instruction = "Before tapping or unclamping: a pin in each hole (GO pin in the reams, the largest pin gauge that enters each drilled hole). Centre the DTI on each pin: X = mean of its two side flanks, Y = mean of front and back. Keep the corner zero: A1's own reading is its corner X/Y. All values from A1: X = reading − A1's; Y_line = Y − (B1's Y × X / {{cad.b1_station_in:.3f}}), a term that can be skipped for the ±.005 rows when B1's Y is within ±.001. L1, L2: X on the DRO; Y by calipers from ZERO EDGE over the pin."
instruction_detailed = "Leave the plate clamped and do this before any tap goes in. Put the GO pin in each reamed hole and, in each drilled hole, the largest pin gauge that enters. With the DTI in the spindle, centre on each pin: touch its left and right flanks at the same indicator reading and take the DRO X halfway between; do the same front and back for Y. Do not re-zero: the taps go back to the table's X/Y. Write down A1's centre: with the corner zero kept it is A1's position from the corner, checked against the table. Take every other hole's X and Y from A1 as its reading minus A1's. B1's Y tilts the A1–B1 line, so for each hole take Y_line = Y − (B1's Y × X / {{cad.b1_station_in:.3f}}): that is its height above the line. If B1's Y reads within ±.001 of A1's, the term is under .001 everywhere and may be skipped for the ±.005 rows; keep it for A2 and B2. Compare each hole with the table. L1 and L2 are located from the corner: read their X on the DRO, and measure their Y with calipers from ZERO EDGE to the pin's far side, less half the pin."
inspection = "A1 from the corner X {{cad.a1_station_min_in:.3f}}–{{cad.a1_station_max_in:.3f}}, Y {{cad.a1_row_min_in:.3f}}–{{cad.a1_row_max_in:.3f}}. Every row inside its limits: X from A1, Y from the A1–B1 line. L1, L2 X {{cad.l1_station_min_in:.3f}}–{{cad.l1_station_max_in:.3f}}; Y L1 {{cad.l1_row_min_in:.3dot}}–{{cad.l1_row_max_in:.3dot}}, L2 {{cad.l2_row_min_in:.3dot}}–{{cad.l2_row_max_in:.3dot}} from ZERO EDGE."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.a1_station_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.a1_height_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.b1_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.b2_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.a2_offset_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.cl_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.cr_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r1_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r2_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r3_station_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.r4_station_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.outer_row_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.cl_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.cr_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r1_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r2_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r3_height_band_mm}}" }, { gauge = "mill-y-dro", band_mm = "{{cad.r4_height_band_mm}}" }, { gauge = "mill-x-dro", band_mm = "{{cad.l1_station_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.l1_row_band_mm}}" }, { gauge = "calipers", band_mm = "{{cad.l2_row_band_mm}}" }]

