# Drill and ream speeds: LittleMachineShop "Cutting Speeds", Drilling &
# Reaming table, row wrought aluminum 6061-T6: drilling 350-400 ft/min,
# reaming 350-400 ft/min (https://littlemachineshop.com/pages/cutting-speeds,
# read 2026-11-13). Every size here computes above the PM-30MV's 3000 rpm top
# speed, so drills and the reamer run at 3000 (owner ruling 2026-11-13, #2748).
# The blind review (S1) cited lower HSS reaming speeds; the owner ruling
# stands, and its safeguards are taken instead: reamer runout checked and a
# test hole gauged in the offcut before the plate.
