<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" width="780" height="720" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the elevation to scale at 4 px/mm (seen from the moving jaw's side, the moving jaw, its stacks and the pin cut away), the plan at 1.5 px/mm. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 28.45 mm out (half_mill_projection_mm) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on SB03_end_a's last pass on END A, X6.350 (its side on X0; the first pass, X7.112, takes 0.762 of the sawn end's 1.524), its end at Z-10.033 (end_past_mm .508 under the back face), going +Y across the bar, the same place in both views. END A sawn 12.7 mm (end_overhang_mm) out past the jaws' right side; the stacks 4 in long, centred on the jaws. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The pin's length is not on record: drawn 2 in, schematic. The holes the same file drills later are dashed in the plan. The elevation is broken off on the left. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
