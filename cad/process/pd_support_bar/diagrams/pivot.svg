<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" width="780" height="680" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the section to scale at 4 px/mm at the pivot hole (X168.060 Y-14.500, posted SB05_back_csk), seen from the far end (on the right in the plan), the fixed jaw on the right; the plan at 1.5 px/mm. The bar turned over end for end, the back face up (Z0), F down. 1/4 in 90° chamfer mill (shop chamfer-mill-carbide-1-4-90): body Ø6.35 mm, its 90° point at csk_tip_mm -2.007, drawn as a sharp point (the tip's flat is not on record), short to a break line, the collet not drawn. The #29 hole and F's countersink from Setup 3 drawn. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The pin's length is not on record: drawn 2 in, schematic. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
  <rect class="paper" x="0" y="0" width="780" height="680"/>
  <text class="title" x="20" y="24">SB05: the chamfer mill countersinks the pivot hole's back mouth (to scale, 4 px/mm; plan 1.5 px/mm)</text>
