<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 680" width="780" height="680" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the section to scale at 4 px/mm (101.6 px/in), the plan at 1.5 px/mm, from the bar's sizes: 9.525 mm across the jaws (blank_thickness_mm), 25.2222 mm above the parallels after the skim (height_target_mm), from 25.4508 (bar_width_max_mm): the .229 mm skim is under 1 px here, so it is named, not hatched. 1/2 in end mill Ø12.7 mm (face_cutter_dia_mm, shop endmill-carbide-3fl-1-2), drawn 28.45 mm out (half_mill_projection_mm) to a break line, the collet not drawn; its square end drawn as the near half of its end face, an arc 12 % of its diameter deep whose lowest point is the true end. Drawn on SB02_top's pass Y-3.675 (-X) at its last level, Z25.222: of the two passes the one least past the bar's edges (2.675 mm over the fixed jaw, 0.500 over the moving one; its end 5.677 mm over the jaw tops, top_jaw_clear_mm). One 1 in parallel against each jaw (top_riser_height_mm 25.4). Section seen from END A (the right), the fixed jaw on the right. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
