<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="330"/>
  <text class="title" x="20" y="20">Setup 1, the bar lying flat in the saw's vise (plan, 1 in = 25 px)</text>
  <!-- The 24 in length: the blank, about 17.87 in, the kerf and the rest. -->
  <rect class="part-rest" x="509.75" y="100" width="150.25" height="25"/>
  <rect class="part-kept" x="60" y="100" width="446.75" height="25"/>
  <rect class="part-removed" x="506.75" y="95" width="3" height="35"/>
  <rect class="clamp" x="560" y="70" width="60" height="30"/>
  <rect class="clamp" x="560" y="125" width="60" height="30"/>
  <line class="dims" x1="60" y1="60" x2="506.75" y2="60"/>
  <line class="dims" x1="60" y1="54" x2="60" y2="98"/>
  <line class="dims" x1="506.75" y1="54" x2="506.75" y2="93"/>
  <text class="label" x="200" y="52">blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in</text>
  <text class="label-halo" x="80" y="117">3/8 x 1 in 1018 cold-finished flat, lying on a 1 in face</text>
  <line class="leader" x1="508.25" y1="131" x2="494" y2="152"/>
  <text class="label" x="436" y="166">saw kerf</text>
  <text class="label" x="632" y="92">rest of the bar</text>
  <!-- The blank's marks. -->
  <text class="title" x="20" y="200">The blank's marks, looking at F with T up</text>
  <rect class="part-kept" x="60" y="230" width="446.75" height="25"/>
  <text class="label-halo" x="270" y="247">F, the front face</text>
  <line class="leader" x1="150" y1="230" x2="165" y2="218"/>
  <text class="label" x="168" y="220">T, the top edge (the one it rocked on)</text>
  <line class="datum" x1="506.75" y1="222" x2="506.75" y2="263"/>
  <text class="datum-label" x="512" y="247">END A</text>
  <text class="label" x="12" y="247">far end</text>
  <line class="leader" x1="330" y1="255" x2="345" y2="268"/>
  <text class="label" x="348" y="273">bottom edge</text>
  <text class="label" x="60" y="296">the back face is the 1 in face behind F</text>
  <!-- The bow check, the bow drawn large. -->
  <text class="title" x="575" y="200">Bow check on the mill table</text>
  <line class="fixture-table" x1="570" y1="262" x2="772" y2="262"/>
  <path class="part-kept" d="M578 262 Q671 250 764 262 L764 244 Q671 232 578 244 Z"/>
  <text class="label-halo" x="656" y="251">T up</text>
  <line class="leader" x1="671" y1="259" x2="671" y2="282"/>
  <text class="label" x="590" y="296">the .003 leaf must not enter</text>
  <text class="label" x="590" y="313">here (the bow is drawn large)</text>
</svg>
