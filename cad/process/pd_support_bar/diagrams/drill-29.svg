<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm, a section across the jaws at the pivot hole, seen from the end on the right of the plan, the fixed jaw on the right; the bar 9.525 mm thick (blank_thickness_mm), 25.2222 mm across (height_target_mm). #29 drill Ø3.4544 mm (milling_cuts cutter_dia_mm, shop jig-drill-29), 118° point, at the pivot hole (X-168.060 Y-14.500, posted NC), its point at drill_29_tip_mm -11.563 below F; drawn short to a break line, the chuck not drawn. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">SB03, same file: the #29 drill through the pivot hole (to scale, 4 px/mm)</text>
