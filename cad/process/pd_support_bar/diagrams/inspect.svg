  <rect class="holes" x="105" y="128.07" width="12.6" height="7.96" rx="3.98" ry="3.98"/>
  <rect class="holes" x="47.07" y="125.28" width="18.26" height="13.54" rx="6.77" ry="6.77"/>
  <rect class="holes" x="49.9" y="128.07" width="12.6" height="7.96" rx="3.98" ry="3.98"/>
  <circle class="hidden" cx="291.6" cy="132.83" r="2.2"/>
  <circle class="hidden" cx="280.6" cy="132.83" r="2.2"/>
