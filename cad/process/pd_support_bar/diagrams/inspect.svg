  <circle class="holes" cx="731.8" cy="132.05" r="6.25"/>
  <circle class="holes" cx="731.8" cy="132.05" r="3.92"/>
  <circle class="holes" cx="676.7" cy="132.05" r="6.25"/>
  <circle class="holes" cx="676.7" cy="132.05" r="3.92"/>
  <circle class="part-threads" cx="485.3" cy="132.83" r="3.3"/>
