  <line class="dims" x1="600" y1="110" x2="600" y2="132.05"/>
  <line class="leader" x1="600" y1="122" x2="590" y2="164"/>
  <text class="label" x="520" y="178">row {{cad.clamp_hole_1_height_min_in:.3dot}}–{{cad.clamp_hole_1_height_max_in:.3dot}} below T</text>
