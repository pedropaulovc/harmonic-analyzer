  <line class="dims" x1="676.7" y1="198" x2="750" y2="198"/>
  <line class="dims" x1="676.7" y1="140" x2="676.7" y2="203"/>
  <text class="label" x="671" y="202" text-anchor="end">clamp hole 2 {{cad.clamp_hole_2_station_min_in:.3dot}}–{{cad.clamp_hole_2_station_max_in:.3dot}}</text>
