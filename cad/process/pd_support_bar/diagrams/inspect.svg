  <line class="dims" x1="731.8" y1="140" x2="731.8" y2="223"/>
  <text class="label" x="726" y="222" text-anchor="end">clamp hole 1 {{cad.clamp_hole_1_station_min_in:.3dot}}–{{cad.clamp_hole_1_station_max_in:.3dot}}</text>
  <line class="dims" x1="38" y1="262" x2="750" y2="262"/>
  <line class="dims" x1="38" y1="152" x2="38" y2="268"/>
  <line class="dims" x1="750" y1="162" x2="750" y2="268"/>
  <text class="label" x="330" y="256">length {{cad.far_end_length_min_in:.1f}}–{{cad.far_end_length_max_in:.1f}}</text>
  <text class="label" x="44" y="170">far end (sawn and filed)</text>
  <line class="leader" x1="286" y1="136" x2="250" y2="190"/>
  <text class="label" x="120" y="204">2X #4-40: at assembly, not made here</text>
  <text class="label" x="30" y="300">Edges broken R{{cad.edge_break_in:.3dot}} or chamfered {{cad.chamfer_max_in:.3dot}} max. Stations are from END A; heights from T.</text>
  <text class="label" x="30" y="318">Slide faces, {{cad.front_face_finish_ra_uin:d}} µin Ra: T (milled) and F (as supplied). The back face and the bottom edge stay as supplied.</text>
</svg>
