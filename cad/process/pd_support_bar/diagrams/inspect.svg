  <text class="datum-label" x="776" y="94" text-anchor="end">END A</text>
  <!-- Callouts above the bar. -->
  <text class="label" x="30" y="44">2X slot {{cad.clamp_slot_3_width_min_in:.3dot}}–{{cad.clamp_slot_3_width_max_in:.3dot}} wide through,</text>
  <text class="label" x="30" y="60">counterbore {{cad.clamp_slot_4_cbore_width_min_in:.3dot}}–{{cad.clamp_slot_4_cbore_width_max_in:.3dot}} wide</text>
  <text class="label" x="30" y="76">× {{cad.clamp_slot_4_cbore_depth_min_in:.2dot}}–{{cad.clamp_slot_4_cbore_depth_max_in:.2dot}} deep</text>
  <line class="leader" x1="111.3" y1="124.5" x2="100" y2="82"/>
