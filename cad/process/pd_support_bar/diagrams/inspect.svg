  <text class="label" x="300" y="76">on both faces</text>
  <line class="leader" x1="483.5" y1="130" x2="392" y2="80"/>
  <text class="label" x="540" y="44">2X Ø{{cad.clamp_hole_1_dia_min_in:.3dot}}–{{cad.clamp_hole_1_dia_max_in:.3dot}} through,</text>
  <text class="label" x="540" y="60">counterbore Ø{{cad.clamp_hole_1_cbore_dia_min_in:.4dot}}–{{cad.clamp_hole_1_cbore_dia_max_in:.4dot}}</text>
  <text class="label" x="540" y="76">× {{cad.clamp_hole_1_cbore_depth_min_in:.2dot}}–{{cad.clamp_hole_1_cbore_depth_max_in:.2dot}} deep</text>
  <line class="leader" x1="729" y1="126.5" x2="690" y2="82"/>
  <line class="leader" x1="674" y1="126.5" x2="650" y2="82"/>
