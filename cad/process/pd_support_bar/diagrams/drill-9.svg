<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, to scale at 4 px/mm, a section across the jaws at clamp hole 1, seen from the end on the right of the plan, the fixed jaw on the right; the bar 9.525 mm thick (blank_thickness_mm), 25.2222 mm across (height_target_mm). #9 drill Ø4.9784 mm (milling_cuts cutter_dia_mm, shop riser-drill-9), 118° point, at clamp hole 1 (X-11.557 Y-14.000, posted NC), its point at drill_9_tip_mm -12.021 below F; drawn short to a break line, the chuck not drawn. The #2 centre drill's spot before it is not drawn. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
