<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" font-family="sans-serif" font-size="13">
  <!-- Hand picture, the bar, the tap's diameter and the tap guide's body to scale at 4 px/mm, a section at the pivot hole as in the setup picture (the back face up, Z0). #8-32 plug tap Ø.164 (4.166 mm, the thread's major diameter, shop jig-tap-8-32-plug), its point at tap_point_depth_mm 15.24 below the back face (5.715 mm below F, in the air between the stacks), its end drawn as the near half of its end face (an arc 12 % of its diameter deep). Tap guide (tools.tap-guide-fisher): body Ø.5 (shank_dia_in) drawn to a break line, its point Ø.1875 (point_dia_in). The tap's length, the T-handle wrench and how far the point stands out are not on record: schematic. The wrench and the guide in the tool's colour: they turn or travel with the tap. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
  <rect class="paper" x="0" y="0" width="780" height="500"/>
  <text class="title" x="20" y="24">SB06: the 8-32 tap by hand under the tap guide (bar to scale, 4 px/mm)</text>
