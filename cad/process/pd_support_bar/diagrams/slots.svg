<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" font-family="sans-serif" font-size="13">
  <rect class="paper" x="0" y="0" width="780" height="620"/>
  <text class="title" x="20" y="20">Setup 4, one clamp slot from above, fixed jaw at the top (enlarged)</text>
  <!-- A patch of the bar round the slot; the counterbore, the through
       slot, the cutter on the through path's +Y straight. -->
  <rect class="part-kept" x="40" y="100" width="260" height="180"/>
  <rect class="part-removed" x="88.83" y="129.81" width="162.34" height="120.39" rx="60.19" ry="60.19"/>
  <rect class="holes" x="113.64" y="154.61" width="112.73" height="70.77" rx="35.39" ry="35.39"/>
  <path class="centre-line" d="M149.02 176.84 L190.98 176.84 A13.16 13.16 0 0 1 190.98 203.16 L149.02 203.16 A13.16 13.16 0 0 1 149.02 176.84 Z"/>
  <circle class="cutter" cx="170" cy="176.84" r="22.23"/>
  <line class="arrow" x1="120" y1="142" x2="220" y2="142"/>
  <line class="arrow" x1="220" y1="238" x2="120" y2="238"/>
  <line class="centre-line" x1="149.02" y1="110" x2="149.02" y2="304"/>
  <line class="centre-line" x1="190.98" y1="110" x2="190.98" y2="304"/>
  <line class="dims" x1="149.02" y1="298" x2="190.98" y2="298"/>
  <line class="leader" x1="170" y1="298" x2="186" y2="318"/>
  <text class="label" x="60" y="332">{{cad.clamp_slot_3_run_in:.3dot}} between the two end centres</text>
  <line class="axis" x1="60" y1="90" x2="60" y2="52"/>
  <text class="label" x="68" y="62">+Y, toward the fixed jaw</text>
  <line class="leader" x1="190" y1="170" x2="326" y2="96"/>
  <text class="label" x="330" y="100">1/8 in end mill, going round clockwise: the wall on its left</text>
  <text class="label" x="330" y="117">(conventional), a little deeper each lap, then one level lap</text>
  <line class="leader" x1="222" y1="200" x2="326" y2="160"/>
  <text class="label" x="330" y="164">the slot, through: {{cad.clamp_slot_3_width_min_in:.3dot}}–{{cad.clamp_slot_3_width_max_in:.3dot}} wide</text>
  <text class="label" x="330" y="181">({{process.slot_step_max_mm:in.3dot}} a lap, to {{process.slot_past_mm:in.2dot}} under the back face)</text>
  <line class="leader" x1="240" y1="214" x2="326" y2="224"/>
  <text class="label" x="330" y="228">its counterbore: {{cad.clamp_slot_4_cbore_width_min_in:.3dot}}–{{cad.clamp_slot_4_cbore_width_max_in:.3dot}} wide,</text>
  <text class="label" x="330" y="245">{{cad.clamp_slot_4_cbore_depth_min_in:.2dot}}–{{cad.clamp_slot_4_cbore_depth_max_in:.2dot}} deep from F ({{process.slot_cbore_step_max_mm:in.3dot}} a lap)</text>
  <text class="label" x="330" y="290">The file cuts slot 3 through, then slot 4 through,</text>
  <text class="label" x="330" y="307">then both counterbores.</text>
  <!-- Plan, fixed jaw at the top, 1 in = 40 px; X0 (the milled END A) at
       x = 745. -->
  <text class="title" x="20" y="390">Plan (fixed jaw at the top, 1 in = 40 px)</text>
  <rect class="clamp" x="265.1" y="450" width="249.9" height="30"/>
  <rect class="clamp" x="265.1" y="524.7" width="249.9" height="30"/>
  <text class="label-on-clamp" x="350" y="470">fixed jaw</text>
  <text class="label-on-clamp" x="350" y="545">moving jaw</text>
  <rect class="fixture-support" x="350" y="519.7" width="80" height="5"/>
  <rect class="part-kept" x="33" y="480" width="712" height="39.7"/>
  <circle class="holes" cx="726.8" cy="502.05" r="6.25"/>
  <circle class="holes" cx="726.8" cy="502.05" r="3.92"/>
  <circle class="holes" cx="671.7" cy="502.05" r="6.25"/>
  <circle class="holes" cx="671.7" cy="502.05" r="3.92"/>
  <circle class="holes" cx="480.3" cy="502.83" r="2.72"/>
  <rect class="part-removed" x="97.17" y="495.28" width="18.26" height="13.54" rx="6.77" ry="6.77"/>
  <rect class="holes" x="100" y="498.07" width="12.6" height="7.96" rx="3.98" ry="3.98"/>
  <rect class="part-removed" x="42.07" y="495.28" width="18.26" height="13.54" rx="6.77" ry="6.77"/>
  <rect class="holes" x="44.9" y="498.07" width="12.6" height="7.96" rx="3.98" ry="3.98"/>
  <text class="label-halo" x="120" y="494">3</text>
  <text class="label-halo" x="64" y="494">4</text>
  <circle class="cutter" cx="749" cy="510" r="4"/>
  <circle class="cutter" cx="29" cy="510" r="4"/>
  <line class="datum" x1="745" y1="440" x2="745" y2="560"/>
  <text class="datum-label" x="741" y="444" text-anchor="end">X0: the milled END A</text>
  <line class="dims" x1="515" y1="425" x2="745" y2="425"/>
  <line class="dims" x1="515" y1="420" x2="515" y2="450"/>
  <line class="dims" x1="745" y1="420" x2="745" y2="440"/>
  <text class="label" x="530" y="418">END A {{process.pickup_out_mm:in.2f}} in out past the jaws</text>
  <line class="leader" x1="751" y1="514" x2="700" y2="574"/>
  <text class="label" x="776" y="590" text-anchor="end">edge finder on END A for X0</text>
  <line class="leader" x1="29" y1="514" x2="40" y2="574"/>
  <text class="label" x="20" y="590">edge finder on the far end: the length check</text>
  <text class="label" x="40" y="470">3, 4: the slots, in the air</text>
  <text class="label" x="20" y="608">slot 3 at X {{cad.clamp_slot_3_station_in:.3dot}}, slot 4 at X {{cad.clamp_slot_4_station_in:.3dot}} left of X0</text>
</svg>
