<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" font-family="sans-serif" font-size="13">
  <!-- Hand picture from above. The enlarged view to scale at 14 px/mm, the plan at 1.5 px/mm. 1/8 in end mill Ø3.175 mm (slot_cutter_dia_mm, shop endmill-carbide-3fl-1-8), drawn at SB04_slots' first point on slot 3, X-407.061 Y-13.060 (posted NC), where it starts its ramp round the racetrack clockwise: centre path radius 0.94 mm about the slot's end centres X-407.061/-404.063, Y-14.000. The slot 5.055 wide (slot_width_mm) and its counterbore 8.599 wide (slot_cbore_width_mm, cut later in the file) drawn to size. The bar slid along the jaws, END A 146.05 mm (pickup_out_mm) out past their right side; the slots stand about 100 mm out past their left side, in the air. Three stacks 1.5 in high (riser_height_mm 38.1): 1 in + 1/2 in at the fixed jaw, 1 in + 1/2 in under the bottom edge and the two 3/4 in outside it under the .125 pin (Ø3.175 mm), the moving jaw on the pin. The pin's length is not on record: drawn 2 in, schematic. The vise jaws' thickness is not on record: schematic. Jaw height 44.9453 mm (vise_jaw_height_mm), jaw width 158.6738 mm (vise_jaw_width_mm); the parallels 1/8 in thick (parallel_thickness_mm), 4 in long (fixtures.parallels-lms-6745). -->
