# Support bar MHA-PD-07 (qty 1), routed for the CNC mill (agent's choice for
# speed, owner ruling 2026-11-21: the owner corrects the route afterwards).
# One sawn blank of the 3/8 x 1 in 1018 cold-finished flat (to order,
# cad/config/shop-equipment/ stock.1018-flat-3-8x1: one 24 in length) about
# 17.87 long. The bar's 3/8 thickness is the drawing's .374 depth AS SUPPLIED
# (the front and back faces are never cut) and its bottom edge stays as
# supplied too: only the top (slide) edge is skimmed (owner ruling
# 2026-11-20, #2421 option B). END A is milled; the far end stays sawn and
# filed (its ±.1 band).
#
# Route: saw, gate the section and the bow; Setup 2 on edge, skim the top
# face (SB02_top); Setup 3 lying, front face up, END A .50 out past the
# jaws: mill END A with the cutter's side, spot, drill #9 and counterbore
# clamp holes 1 and 2, drill the pivot hole #29 and countersink its front
# mouth (SB03_end_a); Setup 4, the same hold slid along the jaws, X0 picked
# up again on the milled END A: both clamp slots and their counterbores
# with the 1/8 in end mill (SB04_slots); Setup 5, turned over end for end,
# the back face up: the pivot hole's back countersink (SB05_back_csk) and
# its 8-32 thread by hand under the tap guide (SB06_tap); bench deburr,
# inspect.
#
# Re-clamp for a bar three times the jaws' width (17.9 blank, 6.247 in
# jaws). Lying, a #9 drilled 5 in out past the jaws would bend the bar far
# over a finish hole's limit (prechips' milling deflection estimate), so
# clamp holes 1 and 2, the pivot hole and END A are cut with END A held
# .50 out past the jaws (Setup 3). The slots stand 15.9-17.4 from END A:
# no hold keeps both END A within the spindle's reach for a pickup and the
# slots near the jaws, so they are not drilled but milled 4-5.5 in out past
# the jaws with the 1/8 in end mill ramping .006 a lap (the #9's thrust is a
# hundred times that cutter's lift), which prechips passes at the finish
# limit. The pickup is END A itself: Setup 3 mills it to X0; Setups 4 and 5
# set X0 on that milled end again with the edge finder (it stands 5.75 in
# out past the jaws, in the air), so every station counts from the one
# milled end; the edge finder's repeat (.0002) is a twenty-fifth of the
# stations' ±.005. Setups 2, 4 and 5 hold the bar at one station along the
# jaws (END A 5.75 in out), so the top skim's own travel, proved in air,
# covers every later pickup. cam.py checks every hold's overhangs and
# grips, the holes inside Setup 3's reach, the pickups inside the travel
# Setup 2 proves, the stacks and the pin against every hole and slot, and
# every pass clear of the jaws.
#
# Zeroing: every X/Y zero is the owned .200 in edge finder at 900 rpm
# (logbook 2026-11-04, tools.edge-finder), Y0 taken on the bare fixed jaw
# before the bar covers it; every Z zero a tool on a .002 feeler leaf. The
# top skim's Z0 is the parallels' top, set from the miked width (as the
# wheel bar's); lying, Z0 is the face that is up, so the counterbores' and
# countersinks' depths count from the face the drawing gives them from.
#
# RV-03 (cad/config/parts/pd-support-bar.yaml machinist_exceptions,
# delegated ruling 2026-11-21, Main): each .196 hole may sit up to .002 off
# its MHA-SH-02 tap's line (sheet note 1). The programs cut the nominal
# row; nothing here spends that allowance.
#
# Not made here: the two #4-40 hook taps (the drawing: spotted through
# MHA-PD-14 at assembly).
#
# To buy (flagged): the bar itself (stock.1018-flat-3-8x1, to_order) before
# Setup 1; the pin-gauge sets (gauges.pin-gauges, to_order) before Setup 3,
# for the .125 pin at the moving jaw and the hole and slot sizes. The
# Fisher tap guide (tools.tap-guide-fisher, to_order, owner ruling
# 2026-11-22) before Setup 5's tap stop.
#
# NC (cam:pd_support_bar, cad/process/pd_support_bar/cam.py): SB02_top,
# SB03_end_a, SB04_slots, SB05_back_csk, SB06_tap. Program names, the
# [parameters] and the milling_cuts names are a contract with that recipe.
# Tool numbers are the places in the tools list among the mill's tools: T1
# 1/2 in end mill, T2 #2 centre drill, T3 #9, T4 5/16 in end mill, T5 #29,
# T6 90° chamfer mill, T7 1/8 in end mill, T8 tap guide.
title = "Support bar"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "1018 cold-finished steel, 3/8 x 1 in flat: this traveler's stock, a plain carbon steel as the drawing's MATERIAL asks (the part's record: {{cad.material_spec}})"
stock = "3/8 x 1 in flat bar; {{process.quantity:d}} × {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in blank."
note = "Inches unless mm; G-code and console entries in mm (the files and the controller run G21). Finished {{cad.far_end_length_min_in:.1f}}–{{cad.far_end_length_max_in:.1f}} long (END A to the far end), {{cad.bottom_face_height_min_in:.3dot}}–{{cad.bottom_face_height_max_in:.3dot}} high (top face to bottom face), {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} thick (the bar's 3/8 as supplied). Two slide faces, {{cad.front_face_finish_ra_uin:d}} µin Ra: the top face T, milled here, and the front face F, the bar's cold-finished skin, never cut: keep F off chips and grit. Speeds on the PM-30MV low belt (100–2800 rpm): no belt change. Home the mill ($H) once, after switching it on: every M6's trip to the tool setter and the tap files' G53 retract count from home. Home again only after a power cycle or a controller restart, an E-stop, an alarm, a limit switch hit, a stall or a crash: homing brings the stored G54 back. Then check every zero of the setup again, each the way its step set it: each must read what its step set, within .001 in. One does not, cannot be reached with the part in, or the part may have moved: take the setup again from its first step, the part out. They all do: run the interrupted file again from its start. Feed Hold, then Reset with the axes stopped keeps position and G54: no homing, no new zero; run the interrupted file again from its start: its first M6 measures the tool, and cuts already made are cut in air. Every file is proved in air before it cuts. Not made here: the 2X #4-40 UNC tapped holes (the drawing: spotted through MHA-PD-14 at assembly). To buy: the 3/8 x 1 in bar before Setup 1; the pin-gauge sets before Setup 3."
shop = "../shop"
stock_refs = ["1018-flat-3-8x1"]
material_key = "rocker-1018-cold-finished"
milling_material = "steel_1018"

[cad]
file = "../../out/features/pd_support_bar/features.toml"
adapter = "flat_bar"
part = "pd-support-bar"

[parameters]
quantity = 1
# The adapter's axes: the bar's length along model X, its thickness (the
# front and back faces) along model Z; the height is the bar's width.
blank_length_axis = 0
blank_thickness_axis = 2
# The blank (stock.1018-flat-3-8x1): sawn 17.82-17.92 long, the bar's width
# and thickness as supplied. Less END A's skim the bar is 17.76-17.86 long,
# inside the drawing's 17.7-17.9 with .04 in hand at each limit
# (bar_length_min_mm, bar_length_max_mm: the far end's stations from the
# milled END A; cam.py checks them).
blank_length_in = 17.82
blank_length_max_in = 17.92
blank_length_min_mm = 452.628
blank_length_max_mm = 455.168
blank_width_in = 1.0
blank_thickness_in = 0.375
# The bar's 3/8 thickness in mm: the depth band's top, the thickest the
# saw's gate passes; the lying programs' depths run through it.
blank_thickness_mm = 9.525
bar_length_min_mm = 451.104
bar_length_max_mm = 453.644
# The incoming bar's gates. Width (ASTM A108 cold-finished flat, 1 in:
# +.000/-.004, with .002 over): .996-1.002; SB02 faces from the widest. Bow
# edgewise: the .003 feeler leaf under the blank's middle, the hollow edge
# down; the narrowest bar's .003 skim then still cleans the top face's ends.
bar_width_min_mm = 25.2984
bar_width_max_mm = 25.4508
bow_max_mm = 0.0762
# The top face's height above the bottom edge after the skim (cam.py checks
# it against the export): .993, .003 over the height band's floor and .003
# under the narrowest bar.
height_target_mm = 25.2222
# END A's skim (a sawn end's lean and burr); X0 is the milled END A, .060
# inside the sawn one, which stands at sawn_end_a_mm from it.
end_a_skim_mm = 1.524
sawn_end_a_mm = -1.524
# The length on the work X DRO, the far end touched with the .200 edge
# finder: the length band plus its radius (cam.py checks them).
length_dro_min_mm = 452.12
length_dro_max_mm = 457.2
# The top skim: the 1/2 in carbide end mill (shop endmill-carbide-3fl-1-2),
# equal levels no deeper than .0025 (four from the widest bar) and two
# equal passes across the 3/8 edge, each 5.0125 mm (.197 in: 9.525 +
# cam.py's 0.5 overhang, in two), inside the measured face envelope, shop
# settings.em-half-carbide-1018-3439-face (dechatter session of 2026-11-23,
# #3439: stable to 6.4 mm wide at up to 1.27 mm deep, 2420-2490 rpm in the
# cut, conventional; the zigzag's return passes
# climb, and that half is not measured), and no heavier than prechips allows
# (the bar's ends, 5.8 in out past the jaws, bend sideways under more: at
# this width a .003 level is over the finish limit, so four levels of two
# passes replace the three of three that 3.4 mm wide took).
# cam.py starts each level with the cutter over the edge, so no pass takes
# more than the stepover.
face_cutter_dia_mm = 12.7
face_stepover_max_mm = 5.0125
face_step_max_mm = 0.0635
# END A: the same cutter's side, one level from the front face to .020 under
# the thickest bar's back face (end_axial_doc_mm, cam.py checks it), in
# equal radial steps no deeper than .030, one-way conventional passes across
# the bar. 10.03 mm deep is past the measured 6.6 mm (v6-deep), so END A
# stays on the chart setting (settings.endmill-carbide-3fl-1-2-1018-cf).
end_step_max_mm = 0.762
end_past_mm = 0.508
end_axial_doc_mm = 10.033
# Holes, Z from the front face: spot Ø.125 with the #2 centre drill, under
# the #29 (no chamfer at the mouths), then each drill through, no peck (L/D
# 2.8 at most), its full diameter 1.0 mm past the thickest bar's back face
# into the air between the stacks; its 118° point below that (cam.py checks
# the tips). The clamp holes' counterbores: the 5/16 in end mill plunged to
# the drawing's depth.
spot_dia_mm = 3.175
drill_past_mm = 1.0
drill_9_tip_mm = -12.0207
drill_29_tip_mm = -11.5628
# The pivot hole's countersinks: the 90° chamfer mill's point csk_tip_mm
# below the face, half of csk_dia_mm (.158: .011 under the drawing's .169
# max, for the touch-off, the tool setter and a worn point; cam.py checks
# both).
csk_dia_mm = 4.0132
csk_tip_mm = -2.0066
# The clamp slots, 1/8 in carbide end mill (shop endmill-carbide-3fl-1-8,
# its diameter -.002/0 on McMaster's page, shop/common.toml): programmed
# .199 wide for a full-size cutter, so .197-.199 as cut, inside the
# drawing's .196-.200; their counterbores programmed .3385 wide (.3365-.3385
# as cut, the drawing's .330-.345). The cutter ramps round each slot's
# racetrack clockwise, slot_step_max_mm (.006) deeper each lap, to
# slot_past_mm under the thickest bar's back face (slot_bottom_mm); each
# counterbore the same way, slot_cbore_step_max_mm (.010) a lap, then one
# level lap on its floor. Its path takes .070 (1.772 mm) off the slot's
# wall along the straights and, round the half circles, where the cutter
# wraps the wall, as much as a straight cut slot_cbore_radial_mm (.088)
# wide: the cut the deflection screen is given. The slots' farthest cuts
# from END A (the beam stations; cam.py checks them all).
slot_cutter_dia_mm = 3.175
slot_width_mm = 5.055
slot_cbore_width_mm = 8.599
slot_step_max_mm = 0.15
slot_cbore_step_max_mm = 0.25
slot_cbore_radial_mm = 2.2304
slot_past_mm = 0.5
slot_bottom_mm = -10.025
slot_far_station_mm = 443.0016
slot_cbore_far_station_mm = 444.7736
# The cutter sizes those two paths admit: each drawing band less twice its
# path's offset from the slot's centre line (.940 and 2.712 mm), the bands
# the 1/8 in cutter is sized against (cam.py checks them).
slot_cutter_min_mm = 3.098
slot_cutter_max_mm = 3.1996
slot_cbore_cutter_min_mm = 2.958
slot_cbore_cutter_max_mm = 3.339
# Speeds and feeds of the holes, authored in the operations:
# LittleMachineShop "Cutting Speeds", Drilling & Reaming, Plain carbon steels
# 1006-1026 (read 2026-11-20): drilling 60-100 ft/min, the low end taken;
# AutoDrill "Suggested drilling feed rates" (read 2026-11-20), row Stl,
# Carbon: 1/16 in .001, 1/8 in .003 in/rev, a size between two columns
# taking the lower one's feed. #9 (.196): 1150 rpm × .003 = 3.45 in/min; #29
# (.136): 1700 rpm (61 ft/min) × .003 = 5.1 in/min. The #2 centre drill as
# the wheel bar's spot: 1800 rpm × .001 = 1.8 in/min. The counterbores (the
# 5/16 in HSS end mill fed down the #9 hole like a counterbore, author's
# choice): the drilling range's low end, 60 ft/min = 750 rpm, .001 in/tooth
# = 1.5 in/min. The countersinks (the carbide chamfer mill's point in the
# #29 hole, cutting at Ø.136-.158, author's choice): 2000 rpm (83 ft/min at
# Ø.158), .0005 in/tooth = 2.0 in/min. cam.py posts these.
spot_feed_per_min_mm = 45.72
drill_9_feed_per_min_mm = 87.63
drill_29_feed_per_min_mm = 129.54
cbore_feed_per_min_mm = 38.1
csk_feed_per_min_mm = 50.8
# Holding (shop workholding.vise-pm-6 and fixtures.parallels-lms-6745, 1/8
# in thick, 1/2-1 in by 1/16): Setup 2, a 1 in parallel against each jaw
# (the jaw tops .223 under the top face's cut); Setups 3-5, three 1.5 in
# stacks: a 1 + 1/2 in against the fixed jaw, a 1 + 1/2 in and, outside it,
# the two 3/4 in against the moving jaw (the pin on the outer one, the bar's
# bottom edge on the inner; every hole and slot exits between the fixed
# jaw's stack and the inner one).
top_riser_height_mm = 25.4
riser_height_mm = 38.1
parallel_thickness_mm = 3.175
vise_bed_height_mm = 73.3044     # Shop workholding.vise-pm-6.bed_height_mm.
vise_jaw_height_mm = 44.9453     # Shop workholding.vise-pm-6.jaw_height_mm.
vise_jaw_width_mm = 158.6738     # Shop workholding.vise-pm-6.jaw_width_mm.
# Grips: the jaw height less each setup's stack; Setup 2's jaw tops
# top_jaw_clear_mm under the top face.
top_grip_mm = 19.5453
top_jaw_clear_mm = 5.6769
lying_grip_mm = 6.8453
# Setup 3: the sawn END A end_overhang_mm out past the jaws' right side,
# read with the rule; the jaws then grip the bar from a_clamp_start_mm to
# a_clamp_end_mm from the milled END A. Setups 4 and 5: the milled END A
# pickup_out_mm (5.75 in) out past the jaws, which grip from there to
# b_clamp_end_mm; Setup 2 holds the blank at the same station, its sawn END
# A top_out_mm (5.81 in) out. The X0 pickup on a sawn END A reads the edge
# finder's .100 radius (shop tools.edge-finder) plus the end skim
# (sawn_pickup_x_mm). The Z touch-offs: over the jaws' middle in each hold
# (z_touch_a_x_mm; z_touch_b_x_mm; Setup 5's, turned over, z_touch_c_x_mm)
# and over the middle of the face that is up (z_touch_top_y_mm, the
# thickness's; z_touch_lying_y_mm, the height's). cam.py checks them all.
end_overhang_mm = 12.7
a_clamp_start_mm = 11.176
a_clamp_end_mm = 169.8498
pickup_out_mm = 146.05
top_out_mm = 147.574
b_clamp_end_mm = 304.7238
sawn_pickup_x_mm = 4.064
z_touch_a_x_mm = -90.5129
z_touch_b_x_mm = -225.3869
z_touch_c_x_mm = 225.3869
z_touch_top_y_mm = -4.7625
z_touch_lying_y_mm = -12.6111
# Machine-capacity inputs (mm): heights from the table, tool lengths from
# spindle nose to tip.
r8_collet_gauge_mm = 6.3         # HA: holders.r8-collets-lms-4860.gauge_len_mm.
drill_chuck_gauge_mm = 95.0      # Archive holders.drill-chuck-r8.gauge_len_mm.
# 1/2 in end mill, 3 in overall: set 1.12 in (28.45 mm) out of the collet
# (owner, Pedro, 2026-11-24: "28.45"), the longer end of the stick-out the
# measured face setting allows (cad/config/shop-equipment/
# measured-cuts.toml: 27.94 to 28.45 mm); cam.py checks the
# collet's nose clears the bar at END A's cut. The 1/8 in end mill, 1-1/2
# overall, 1/2 in of flute: at least .55 out, so the collet's nose stays .15
# above the bar at the slots' bottom, and at most .75, half its length left
# in the collet; the chamfer mill at least .50 out.
half_mill_projection_mm = 28.45
eighth_mill_projection_min_mm = 13.97
eighth_mill_projection_max_mm = 19.05
chamfer_projection_min_mm = 12.7
# ASME B94.11M jobber length, overall, of the #9 drill, 3-5/8 in. Bounded by
# its whole length below the chuck.
drill_9_oal_mm = 92.075
# Tapping 8-32 through under the spring tap guide (tools.tap-guide-fisher).
# The plug tap's point goes tap_point_depth_mm (.60) below the back face:
# past the front face by more than its 5/32 chamfer, so the full thread is
# through, and under a standard #8 hand tap's .750 thread length, so its
# shank stays out of the hole. The guide and the tap in its wrench together
# reach at most tap_stack_max_mm below the collet face: the spindle-to-table
# maximum (shop machines.pm-30mv, 431.8) less 25.0 to bring the point down
# onto the wrench (the shop's tool-change clearance), the vise bed, the
# stacks, the bar's thickness and the collet gauge, rounded down to .01 in.
# The guide is 3 1/8 in (79.375) overall; the tap's reach in its wrench is
# not on record, so the traveler stops before the tap file unless the tap,
# point to the wrench's centre hole, is at most tap_wrench_reach_max_mm
# (cam.py checks all three).
tap_point_depth_mm = 15.24
tap_stack_max_mm = 279.4
tap_wrench_reach_max_mm = 199.898

