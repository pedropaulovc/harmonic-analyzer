instruction = "The length, before the slots are cut: the edge finder on the far end from the left; the work X DRO reads −(the length + .100)."
instruction_detailed = "Send G20 (the DRO reads inches). Edge finder (900 rpm, console) on the far end from the left, its tip below F: the work X DRO reads −(the length + .100). Send G21."
inspection = "Length {{cad.far_end_length_min_in:.1f}}–{{cad.far_end_length_max_in:.1f}}: the DRO −{{process.length_dro_min_mm:in.3f}} to −{{process.length_dro_max_mm:in.3f}}. Longer: unclamp, file the far end and repeat this setup; shorter: stop and tell the owner."
gauge_checks = [{ gauge = "mill-x-dro", band_mm = "{{cad.far_end_length_band_mm}}" }]

[[setups.operations]]
instruction = "G54 Z0: the front face F, the 1/8 in end mill touched on it over the jaws."
instruction_detailed = "Console M6 T7 (1/8 in end mill, {{process.eighth_mill_projection_min_mm:in.2dot}}–{{process.eighth_mill_projection_max_mm:in.2dot}} in out of its collet; the tool setter measures it); MDI G0 X{{process.z_touch_b_x_mm:.3f}} Y{{process.z_touch_lying_y_mm:.3f}} (over the middle of the jaws). Spindle stopped, its tip just touching a .002 feeler leaf on F: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Pickup check before cutting: MDI G0 Z5.000, then G0 X-{{cad.clamp_hole_2_station_mm:.3f}} Y-{{cad.clamp_hole_2_height_mm:.3f}} and G0 Z1.000: the end mill's tip stands centred over clamp hole 2 (look across it from the front and from the side). Off by a visible amount: stop and set X0 again."
feed = "hand"

[[setups.operations]]
instruction = "Prove SB04_slots in air, Z0 raised 1.000 in; the cutter stays over the bar's far end, clear of the jaws. Then Z0 back."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run SB04_slots, watching the cutter stay over the bar's far end, clear of the jaws. G10 L2 P1 Z(the noted Z) puts Z0 back."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = { kind = "band", band_mm = ["{{process.slot_cutter_min_mm}}", "{{process.slot_cutter_max_mm}}"] }
instruction = "Run SB04_slots (M6 T7; set 2800): slot 3, then slot 4, each through the bar: the cutter ramps round the slot's racetrack clockwise (the wall on its left, conventional with M3), {{process.slot_step_max_mm:in.3dot}} deeper each lap, to {{process.slot_past_mm:in.3dot}} past the back face, then one level lap. Cutting oil; brush the chips clear."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "slot", kind = "slot", phase = "finish", cutter_dia_mm = "{{process.slot_cutter_dia_mm}}", axial_doc_mm = "{{process.slot_step_max_mm}}", radial_woc_mm = "{{process.slot_cutter_dia_mm}}", stations_mm = ["{{cad.clamp_slot_3_station_mm}}", "{{process.slot_far_station_mm}}"] },
]

[[setups.operations]]
speed_kind = "spindle"
tool = "em-eighth"
drilling = "none"
sizing = { kind = "band", band_mm = ["{{process.slot_cbore_cutter_min_mm}}", "{{process.slot_cbore_cutter_max_mm}}"] }
instruction = "Same file, no stop, the same cutter: each slot's counterbore, {{process.slot_cbore_width_mm:in.4dot}} wide, the same way round, {{process.slot_cbore_step_max_mm:in.3dot}} deeper each lap, to {{cad.clamp_slot_3_cbore_depth_mm:in.3dot}} below F, then one level lap on its floor."
settings = "endmill-carbide-3fl-1-8-1018-cf-tru-edge"
milling_cuts = [
  { name = "slot counterbore", kind = "side", phase = "finish", cutter_dia_mm = "{{process.slot_cutter_dia_mm}}", axial_doc_mm = "{{process.slot_cbore_step_max_mm}}", radial_woc_mm = "{{process.slot_cbore_radial_mm}}", stations_mm = ["{{cad.clamp_slot_3_station_mm}}", "{{process.slot_cbore_far_station_mm}}"] },
]

[[setups.operations]]
instruction = "File done, still clamped: gauge both slots and slot 4's counterbore."
instruction_detailed = "File done, still clamped: the pin gauges along both slots; the calipers' inside jaws across slot 4's counterbore and their depth rod on its floor, the calipers' end on F."
inspection = "Slots {{cad.clamp_slot_3_width_min_in:.3dot}}–{{cad.clamp_slot_3_width_max_in:.3dot}} wide: the .196 pin slides the slot's length, the .200 does not enter. Counterbore {{cad.clamp_slot_4_cbore_width_min_in:.3dot}}–{{cad.clamp_slot_4_cbore_width_max_in:.3dot}} wide, {{cad.clamp_slot_4_cbore_depth_min_in:.2dot}}–{{cad.clamp_slot_4_cbore_depth_max_in:.2dot}} deep from F. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "pin-gauges", band_mm = "{{cad.clamp_slot_3_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.clamp_slot_4_cbore_width_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.clamp_slot_4_cbore_depth_band_mm}}" },
]

[[setups]]
machine_kind = "other"
title = "The pivot hole: back countersink and 8-32 thread"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "The same three stacks, wiped clean with the pin and F (F goes down on them: a chip would score the slide face). The bar turned over end for end: the back face up, F down on the stacks, T again against the FIXED jaw, the .125 pin along the bottom edge on the outer stack, END A now to the LEFT, the milled END A {{process.pickup_out_mm:in.2f}} in (5 3/4) out past the jaws' left side (the rule). Tap the bar down onto the stacks while closing the vise."
datum = "Programs SB05_back_csk and SB06_tap. G54: X0 the milled END A (the pickup, now at the left), +X along the bar; Y0 the fixed jaw's face (T), +Y toward it; Z0 the back face. The pivot hole at X {{cad.pivot_tap_station_in:.3dot}}, Y −{{cad.pivot_tap_height_in:.3dot}} in. Each file starts with an M6; tool lengths from the tool setter."
diagram = { file = "diagrams/pivot.svg", alt = "To scale, a section across the jaws at the pivot hole and the plan: the bar turned over end for end, the back face up, F down on the three stacks, T at the fixed jaw, the .125 pin on the outer stack, END A {{process.pickup_out_mm:in.2f}} in out past the jaws' left side; the 1/4 in chamfer mill's point at Z{{process.csk_tip_mm:in.3dot}} (Z0 the back face), countersinking the hole's mouth." }
envelope = { x_span_mm = ["{{process.bar_length_max_mm}}", 10.16], y_span_mm = ["{{process.height_target_mm}}", 5.08], work_top_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_thickness_mm}}"], deepest_cut_mm = ["{{process.vise_bed_height_mm}}", "{{process.riser_height_mm}}", "{{process.blank_thickness_mm}}", "{{process.csk_tip_mm}}"], longest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.tap_stack_max_mm}}"], shortest_tool_mm = ["{{process.r8_collet_gauge_mm}}", "{{process.chamfer_projection_min_mm}}"] }
vise_hold = { vise = "vise-pm-6", across_jaws_mm = "{{process.height_target_mm}}", along_jaws_mm = "{{process.bar_length_max_mm}}", part_height_mm = "{{cad.back_face_depth_mm}}", parallel_height_mm = "{{process.riser_height_mm}}", overhang_mm = ["{{process.pickup_out_mm}}", "rest"], jaw_offset = "centred", fixed_jaw_face = "machined", moving_jaw_face = "as_bought", moving_jaw_contact = "rod" }
beam = { axis = "x", hold = "cantilever", extent_mm = [0, "{{process.bar_length_max_mm}}"], clamp_mm = ["{{process.pickup_out_mm}}", "{{process.b_clamp_end_mm}}"], section_mm = { y = "{{process.height_target_mm}}", z = "{{cad.back_face_depth_mm}}" }, vise_left = "start" }

[[setups.operations]]
instruction = "Before the bar goes in: G54 Y0 on the bare fixed jaw's face, edge finder (900 rpm). The bar will cover that face."
instruction_detailed = "Before the bar goes in: edge finder (900 rpm), its tip below the jaw tops, on the bare fixed jaw's face from the front: G10 L20 P1 Y-2.540. The bar will cover that face."
feed = "hand"

[[setups.operations]]
instruction = "Clamp the bar as Holding says. The pickup: G54 X0 on the milled END A with the edge finder (900 rpm)."
instruction_detailed = "Clamp the bar as Holding says. The pickup, G10 L20 P1 X-2.540: the edge finder (900 rpm) on the milled END A from the left, its tip on the end below the back face."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the back face, the chamfer mill's point touched on it over the jaws."
instruction_detailed = "Console M6 T6 (1/4 in 90° chamfer mill, at least .50 out of its collet; the tool setter measures it); MDI G0 X{{process.z_touch_c_x_mm:.3f}} Y{{process.z_touch_lying_y_mm:.3f}} (over the middle of the jaws). Spindle stopped, its point just touching a .002 feeler leaf on the back face, the last .010 in .001 steps: G10 L20 P1 Z0.051."
feed = "hand"

[[setups.operations]]
instruction = "Pickup check before cutting: MDI G0 Z5.000, then G0 X{{cad.pivot_tap_station_mm:.3f}} Y-{{cad.pivot_tap_height_mm:.3f}} and G0 Z1.000: the chamfer mill's point stands centred over the pivot hole (look across it from the front and from the side). Off by a visible amount: stop and set X0 again."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "chamfer"
drilling = "none"
sizing = "other"
instruction = "Prove SB05_back_csk in air (Z0 raised 1.000 in, then back). Run it (M6 T6; set 2000): countersink the pivot hole's mouth in the back face to Ø{{process.csk_dia_mm:in.3dot}} (the file feeds the point half that below the face), under the drawing's Ø{{cad.pivot_tap_csk_dia_max_in:.3dot}} MAX."
rpm = 2000
feed = "{{process.csk_feed_per_min_mm:in.1f}} in/min"
milling_cuts = [
  { name = "back countersink", kind = "drill", phase = "finish", cutter_dia_mm = "{{process.csk_dia_mm}}", flutes = 2, rpm = 2000, feed_mm_min = "{{process.csk_feed_per_min_mm}}", stations_mm = "{{cad.pivot_tap_station_mm}}" },
]

[[setups.operations]]
instruction = "The 8-32 plug tap goes in the small T-handle tap wrench with the centre hole in its top (the tap guide's point seats there). Measure it from the tap's point to that hole (calipers, or the combination square's 12 in blade): at most {{process.tap_wrench_reach_max_mm:in.2f}} in, or the guide cannot come down onto it: stop. Mark the tap {{process.tap_point_depth_mm:in.2dot}} up from its point with marking fluid."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-guide"
drilling = "none"
sizing = "other"
instruction = "Run SB06_tap: M6 T8, the tap guide in the 1/2 in collet, pointed end out (the tool setter measures it), spindle off; the file ends Idle at the machine top over the pivot hole."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "tap-8-32"
drilling = "none"
sizing = "other"
instruction = "Tap {{cad.pivot_tap_thread}} through by hand under the tap guide, spindle off, cutting oil: the tap's point in the hole, jog Z down until the guide's point is pushed fully home in the wrench. Turn the wrench, a half turn back each turn; jog the guide down again before the tap has gone 1/2 in. Stop when the tap's mark reaches the back face: the full thread is through F."
diagram = { file = "diagrams/pivot-tap.svg", alt = "Section at the pivot hole, the bar and the tap to scale: the 8-32 plug tap in the T-handle wrench in the hole, the tap guide in the spindle, its spring point in the wrench's centre hole; the tap's point {{process.tap_point_depth_mm:in.2dot}} below the back face when its mark reaches it, through F, between the stacks. The wrench and the tap's length schematic." }
feed = "hand"

[[setups.operations]]
instruction = "Jog Z up clear, back the tap out by hand and blow the hole out."
inspection = "A #8-32 screw runs through the thread by hand. Binds: run the tap through again under the tap guide; still binds: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "other"
title = "Deburr and inspect"
machine = "Bench"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished bar, front face toward the viewer, END A at the right: clamp holes 1 and 2 and the two clamp slots on one row below the top face, counterbored from the front; the tapped pivot hole; the edges broken." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "deburring-set"
drilling = "none"
sizing = "other"
instruction = "Deburr the clamp holes' and the slots' mouths on F and the back face and the counterbores' rims flush with a scraper from the deburring set (no countersink), the scraper kept off F's flat. The pivot hole's two countersunk mouths: scrape only a burr the tap raised; they stay under Ø{{cad.pivot_tap_csk_dia_max_in:.3dot}}."
feed = "hand"
inspection = "No burr stands proud of F or the back face at a hole or slot. One does: scrape it again."
gauge_checks = "other"

[[setups.operations]]
speed_kind = "other"
tool = "files"
drilling = "none"
sizing = "other"
instruction = "Break every edge, R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max, smooth file; a light stroke only along T's and F's edges, the file kept off their flats (the slide faces). Wash off the oil and dry."
feed = "hand"
inspection = "No burr stands proud of any face or end. One does: file it off."
gauge_checks = "other"

[[setups.operations]]
instruction = "The clamp row's height from T: the .196 pin in clamp hole 1, then in slot 4; each time the calipers from T over the pin, less half its Ø (.098)."
inspection = "{{cad.clamp_hole_1_height_min_in:.3dot}}–{{cad.clamp_hole_1_height_max_in:.3dot}} from T at both (Setup 3's Y0 and Setup 4's). Clamp hole 2, the pivot hole and slot 3: the programs' Y from the same two zeros, not gauged. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.clamp_hole_1_height_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.clamp_slot_4_height_band_mm}}" },
]

[[setups.operations]]
instruction = "The clamp holes' stations from END A: the .196 pin in each in turn; the calipers from END A over the pin, less half its Ø (.098)."
inspection = "Clamp hole 1 {{cad.clamp_hole_1_station_min_in:.3dot}}–{{cad.clamp_hole_1_station_max_in:.3dot}} and clamp hole 2 {{cad.clamp_hole_2_station_min_in:.3dot}}–{{cad.clamp_hole_2_station_max_in:.3dot}} from END A. The pivot hole (cut from the same X0) and the slots (X0 picked up on END A and checked over clamp hole 2): the programs' stations, not gauged. Outside: stop and tell the owner."
gauge_checks = [
  { gauge = "calipers", band_mm = "{{cad.clamp_hole_1_station_band_mm}}" },
  { gauge = "calipers", band_mm = "{{cad.clamp_hole_2_station_band_mm}}" },
]

[[setups.operations]]
instruction = "F, the slide face on MHA-PD-02, after the route: look along it and draw a fingernail across it at both ends and the middle."
inspection = "F smooth from end to end, no dent or score the nail catches, as it was at Setup 1 ({{cad.front_face_finish_ra_uin:d}} µin Ra, as supplied). A dent or score: stop and tell the owner."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Wipe every face and the holes with a film of light machine oil against rust in storage (the drawing's finish: {{cad.finish}}). Tag the bar {{cad.drawing_number}}."
feed = "hand"
