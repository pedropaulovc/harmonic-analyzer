]

[[setups.operations]]
instruction = "Over {{cad.bottom_face_height_max_in:.3dot}}: wipe the bottom edge and the parallels clean (a chip under the bar is the usual cause), repeat this setup from its second op with the new middle reading and run SB02_top again. Under {{cad.bottom_face_height_min_in:.3dot}}, or marking fluid left on T: stop and tell the owner."
feed = "hand"

