inspection = "Height, T to the bottom edge, {{cad.bottom_face_height_min_in:.3dot}}–{{cad.bottom_face_height_max_in:.3dot}}, miked at both ends and the middle; T bright from end to end, no marking fluid left (the top face, {{cad.top_face_finish_ra_uin:d}} µin Ra: the end mill's cut)."
