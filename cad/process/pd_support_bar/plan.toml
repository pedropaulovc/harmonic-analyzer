[[setups]]
machine_kind = "other"
title = "Gate the bar; saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "To scale, from above: the 3/8 x 1 in flat bar lying on a 1 in face in the saw's vise, one blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in long off its end, the saw blade in its kerf (the kerf drawn schematic); the rest of the bar in the vise." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
instruction = "Mic the bar's thickness (3/8) and width (1 in) at its end, 9 in and 18 in along it."
inspection = "Thickness {{cad.back_face_depth_min_in:.3dot}}–{{cad.back_face_depth_max_in:.3dot}} (it is the finished thickness: never cut); width {{process.bar_width_min_mm:in.3dot}}–{{process.bar_width_max_mm:in.3dot}}. Outside: stop and tell the owner; the programs assume this section."
gauge_checks = [
  { gauge = "micrometers", band_mm = "{{cad.back_face_depth_band_mm}}" },
  { gauge = "micrometers", band_mm = ["{{process.bar_width_min_mm}}", "{{process.bar_width_max_mm}}"] },
]
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw {{process.quantity:d}} blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} in long (17 7/8 on the tape) off the 3/8 x 1 in 1018 flat, the bar lying flat in the saw's vise. File the sawn ends smooth and square to the long edges (the combination square); file the burr off both ends and the four long edges so the blank seats flat on the parallels and the jaws."
feed = "hand"
inspection = "Blank {{process.blank_length_in:.2f}}–{{process.blank_length_max_in:.2f}} long: its end within half a 1/16 division of the tape's 17 7/8 mark (Setup 4 checks the finished length on the mill). Longer: saw or file it again; shorter: stop and tell the owner (the bar yields one blank)."
gauge_checks = "other"

[[setups.operations]]
instruction = "Find the top edge. Stand the blank on each long edge in turn on the clean mill table, along the land between two T-slots. The edge it rocks on (bowed outward) becomes the top face: mark it T with marking fluid. No rock on either edge: mark either one T."
inspection = "The blank standing on its other edge (T up): the .003 feeler leaf does not enter under its middle. Enters: stop and tell the owner (the skim would not clean T's ends)."
gauge_checks = "other"
feed = "hand"

[[setups.operations]]
instruction = "Mark the front face and END A with marking fluid. F, the front face (the counterbores go in it; it slides on MHA-PD-02): the cleaner of the two 1 in faces. END A (every station counts from it): the RIGHT end when you look at F with T up. The other 1 in face is the back face, the other edge the bottom edge, the other end the far end."
diagram = { file = "diagrams/marks.svg", alt = "To scale, the blank seen on F with T up: T marked on the top edge (the one it rocked on), F on the front face, END A at the right end; the back face is the 1 in face behind F." }
feed = "hand"
inspection = "F as supplied is the drawing's {{cad.front_face_finish_ra_uin:d}} µin Ra slide face (any process): the cold-finished skin smooth and bright from end to end, by eye and fingernail, with no rust pit, dent or score the nail catches. Neither 1 in face passes: stop and tell the owner."
gauge_checks = "other"

[[setups]]
machine_kind = "other"
title = "Top face T, on edge"
machine = "PM-30MV CNC (FluidNC, CNCjs with the electronic tool setter) / vise, swivel off"
indexing = "none"
machine_ref = "pm-30mv"
holding = "One 1 in parallel of the set ({{process.parallel_thickness_mm:in.3dot}} thick) against each jaw; the jaws' faces and the blank wiped clean (F stays as supplied). The blank on edge on them, T up, the bottom edge down, the back face against the FIXED jaw, F toward the moving jaw, END A to the RIGHT, the sawn END A {{process.top_out_mm:in.2f}} in (5 13/16) out past the jaws' right side (the rule); the far end stands about as far out past their left side. Tap it down onto both parallels while closing the vise. The lower {{process.top_grip_mm:in.3dot}} of its width is in the jaws."
