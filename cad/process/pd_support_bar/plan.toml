[[setups.operations]]
instruction = "Before the blank goes in: G54 Y0 on the bare fixed jaw's face, edge finder (900 rpm). The blank will cover that face."
instruction_detailed = "Before the blank goes in: edge finder (900 rpm), its tip below the jaw tops, on the bare fixed jaw's face from the front: G10 L20 P1 Y-2.540. The blank will cover that face."
feed = "hand"

[[setups.operations]]
instruction = "Mic the bottom edge to T at the blank's middle and write it down (mm = in × 25.4). Clamp it as Holding says. G54 X0 {{process.end_a_skim_mm:in.3dot}} left of the sawn END A: edge finder (900 rpm)."
instruction_detailed = "Mic the bottom edge to T at the blank's middle; write it down in mm (in × 25.4). Clamp it as Holding says. Edge finder (900 rpm) on the sawn END A from the right, its tip below T: G10 L20 P1 X{{process.sawn_pickup_x_mm:.3f}} (its .100 radius plus the {{process.end_a_skim_mm:in.3dot}} end skim)."
feed = "hand"

[[setups.operations]]
instruction = "G54 Z0: the parallels' top (the bottom edge), from that reading and the end mill touched on T at the blank's middle."
instruction_detailed = "Console M6 T1 (1/2 in end mill, {{process.half_mill_projection_mm:in.2f}} in out of the collet; the tool setter measures it); MDI G0 X{{process.z_touch_b_x_mm:.3f}} Y{{process.z_touch_top_y_mm:.3f}} (the blank's middle, over T). Spindle stopped, its tip just dragging a .002 feeler leaf on T: G10 L20 P1 Z(the reading in mm + 0.051)."
feed = "hand"

[[setups.operations]]
instruction = "Prove SB02_top in air: Z0 raised 1.000 in; every move clears the jaws and the table reaches both ends of the blank. Then Z0 back. A travel alarm: the vise sits too far off the table's middle; move it and start this setup again."
instruction_detailed = "Send $# and note the G54 line's Z. G10 L2 P1 Z(that Z + 25.400) raises Z0 1.000 in. Run SB02_top, watching each move clear the jaws and the table reach both ends of the blank. G10 L2 P1 Z(the noted Z) puts Z0 back. A travel alarm: the vise sits too far off the table's middle; move it and start this setup again."
feed = "hand"

[[setups.operations]]
speed_kind = "spindle"
tool = "em-half"
drilling = "none"
sizing = "other"
instruction = "Paint T with marking fluid. Run SB02_top (M6 T1, 1/2 in end mill; set 2450: the display rests near 2485, not 2380): skim T down to Z {{process.height_target_mm:in.4dot}} in levels no deeper than {{process.face_step_max_mm:in.4dot}} from {{process.bar_width_max_mm:in.3dot}} (the widest bar: a narrower one cuts air first), two passes along the bar per level, each no wider than {{process.face_stepover_max_mm:in.3dot}}. Unclamp."
