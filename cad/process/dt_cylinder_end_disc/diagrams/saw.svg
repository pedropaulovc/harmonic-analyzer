<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="sans-serif" font-size="13">
  <!-- Hand picture, from above, to scale at 60 px/in: the 1/8 x 2-1/2 in flat (process.blank_side_in) on the saw bed, its edge on the fence, clamped in the saw's vise; a 2-1/2 in length (a square) marked off its end. The saw's vise jaw and the fence are schematic (not on record); the blade's kerf is not on record: drawn as a heavy line at the cut. The flat runs on to a break line. -->
  <rect class="paper" x="0" y="0" width="760" height="360"/>
  <text class="title" x="20" y="22">Setup 1, Op 10: a 2-1/2 in length off the 1/8 x 2-1/2 flat, against the fence, from above (to scale, 60 px/in)</text>
  <rect class="fixture-table" x="20" y="45" width="720" height="260"/>
  <rect class="part-kept" x="40" y="115" width="150" height="150"/>
  <path class="part-rest" d="M190 115L730 115L727 122.14L730 129.29L727 136.43L730 143.57L727 150.71L730 157.86L727 165L730 172.14L727 179.29L730 186.43L727 193.57L730 200.71L727 207.86L730 215L727 222.14L730 229.29L727 236.43L730 243.57L727 250.71L730 257.86L730 265L190 265Z"/>
  <rect class="fixture-support" x="20" y="265" width="720" height="8"/>
  <rect class="clamp" x="280" y="81" width="130" height="34"/>
  <text class="label-on-clamp" x="288" y="103">saw vise</text>
  <text class="label" x="280" y="71">saw vise on the long end (jaws schematic)</text>
  <rect class="cutter" x="190" y="90" width="3" height="200"/>
  <text class="label" x="40" y="330">fence: the flat's edge against it</text>
  <line class="leader" x1="140" y1="318" x2="160" y2="270"/>
  <circle class="leader-dot" cx="160" cy="270" r="2"/>
  <text class="label" x="60" y="195">a {{process.blank_side_in:g}} in square</text>
  <text class="label" x="198" y="350">blade at the mark; the square drops clear</text>
</svg>
