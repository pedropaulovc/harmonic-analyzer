<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <!-- Setup 3, seen from the operator's side, headstock at the left, to scale at 2 px/mm: the blank on a 3/8-16 x 1-1/2 hex bolt, head outboard (head, washer, blank, washer, nut), the bolt's threads in the 3-jaw up to the nut. -->
  <rect class="paper" x="0" y="0" width="760" height="400"/>
  <text class="title" x="20" y="22">Setup 3: the blank on the bolt mandrel, head outboard, the threads in the 3-jaw: turn the outside</text>
  <line class="centre-line" x1="20" y1="200" x2="560" y2="200"/>
  <rect class="fixture-vise" x="40" y="48" width="100" height="304"/>
  <rect class="part-rest" x="110" y="190.5" width="89.4" height="19"/>
  <rect class="fixture-vise" x="140" y="120" width="30" height="70.5"/>
  <rect class="fixture-vise" x="140" y="209.5" width="30" height="70.5"/>
  <rect class="part-rest" x="170" y="185.7" width="16.7" height="28.6"/>
  <rect class="part-rest" x="186.7" y="181.4" width="3.2" height="37.2"/>
  <rect class="part-arriving" x="189.9" y="132.5" width="6.35" height="135"/>
  <rect class="part-kept" x="189.9" y="145" width="6.35" height="110"/>
  <rect class="part-rest" x="196.25" y="181.4" width="3.2" height="37.2"/>
  <rect class="part-rest" x="199.45" y="185.7" width="11.9" height="28.6"/>
  <path class="cutter" d="M193,257 L199,262 L206,262 L206,336 L194,336 L194,268 Z"/>
  <line class="leader" x1="155" y1="122" x2="155" y2="46"/>
  <text class="label-halo" x="160" y="42">3-jaw on the bolt's threads, up to the nut</text>
  <line class="leader" x1="178" y1="212" x2="178" y2="362"/>
  <text class="label-halo" x="184" y="372">nut, tight; a flat washer each side of the blank</text>
  <line class="leader" x1="205" y1="200" x2="300" y2="165"/>
  <text class="label-halo" x="304" y="162">bolt head outboard, on the outer washer</text>
  <line class="leader" x1="193" y1="140" x2="300" y2="135"/>
  <text class="label-halo" x="304" y="138">dashed: the sawn blank; heavy outline: the finished Ø2.16–2.18</text>
  <line class="leader" x1="206" y1="300" x2="300" y2="310"/>
  <text class="label-halo" x="304" y="314">AR tool turns the outside to Ø2.16–2.18</text>
  <text class="label" x="40" y="388">6 in 3-jaw (two jaws shown in section)</text>
</svg>
