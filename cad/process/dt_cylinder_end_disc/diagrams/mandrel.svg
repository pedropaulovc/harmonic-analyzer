<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif" font-size="13">
  <!-- Hand picture, a section through the axis from above (the cross-slide at the bottom), to scale at 4 px/mm (101.6 px/in): the 3/8-16 bolt (process.bolt_dia_mm), head outboard; from the jaws out: the nut (about .33, process.mandrel_stickout_mm's note), a fender washer, the disc .11 (cad.length_in), a fender washer and the head (about .23), 21 mm out of the jaws (process.mandrel_stickout_mm). The nut's and head's across-flats (drawn 9/16) and the washers (drawn Ø1-1/2 x 1/16) are schematic, not on record. The 3-jaw's jaws and body are schematic. Dashed: the sawn blank's swing, Ø2.657 at its corners (process.blank_swing_mm); hatched: the ring turned off down to Ø2.17 (cad.outer_dia_in). The AR tool schematic, its point at Ø2.17, fed toward the chuck. -->
  <rect class="paper" x="0" y="0" width="760" height="420"/>
  <text class="title" x="20" y="22">Setup 3, Op 80: the AR tool turns the outside to Ø2.16–2.18 on the bolt mandrel (to scale, 4 px/mm)</text>
  <rect class="fixture-vise" x="174" y="138.95" width="56" height="142.1"/>
  <path class="part-rest" d="M120 190.95L360.77 190.95L360.77 229.05L120 229.05L117 221.43L120 213.81L117 206.19L120 198.57Z"/>
  <rect class="clamp" x="230" y="150.95" width="50" height="40"/>
  <rect class="clamp" x="230" y="229.05" width="50" height="40"/>
  <rect class="part-rest" x="280" y="181.43" width="33.53" height="57.15"/>
  <rect class="part-rest" x="313.53" y="133.8" width="6.35" height="152.4"/>
  <rect class="part-arriving" x="319.88" y="75.02" width="11.18" height="269.96"/>
  <rect class="part-removed" x="319.88" y="88.08" width="11.18" height="243.84"/>
  <rect class="part-kept" x="319.88" y="99.76" width="11.18" height="220.47"/>
  <rect class="part-rest" x="331.05" y="133.8" width="6.35" height="152.4"/>
  <rect class="part-rest" x="337.4" y="181.43" width="23.37" height="57.15"/>
  <line class="centre-line" x1="100" y1="210" x2="740" y2="210"/>
  <path class="cutter" d="M331.05 320.24L361.05 332.24L361.05 390.24L353.05 387.24L345.05 390.24L337.05 390.24L337.05 344.24Z"/>
  <line class="arrow" x1="309.88" y1="360.24" x2="269.88" y2="360.24"/>
  <text class="label" x="260" y="40">3-jaw on the bolt's threads, up to the nut</text>
  <line class="leader" x1="300" y1="46" x2="255" y2="160.95"/>
  <circle class="leader-dot" cx="255" cy="160.95" r="2"/>
  <text class="label" x="440" y="110">nut toward the chuck, tight; a fender washer each</text>
  <text class="label" x="440" y="126">side of the disc; the bolt head outboard</text>
  <line class="leader" x1="438" y1="106" x2="352.77" y2="187.43"/>
  <circle class="leader-dot" cx="352.77" cy="187.43" r="2"/>
  <text class="label" x="440" y="330">AR tool: the outside across its thickness,</text>
  <text class="label" x="440" y="346">light cuts at the sawn flats' interruptions,</text>
  <text class="label" x="440" y="362">to Ø{{cad.outer_dia_min_in:.2dot}}–{{cad.outer_dia_max_in:.2dot}}</text>
  <line class="leader" x1="438" y1="326" x2="351.05" y2="380.24"/>
  <circle class="leader-dot" cx="351.05" cy="380.24" r="2"/>
  <text class="label" x="40" y="384">dashed: the sawn blank;</text>
  <text class="label" x="40" y="400">heavy outline: the finished disc</text>
</svg>
