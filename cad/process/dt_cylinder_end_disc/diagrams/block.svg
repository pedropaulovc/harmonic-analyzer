<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="sans-serif" font-size="13">
  <!-- Hand picture, a section through the axis from above (the cross-slide at the bottom), to scale at 5 px/mm (127 px/in): the sawn blank 2-1/2 in across its flats (process.blank_side_in; the section through two opposite jaws) and 1/8 thick (process.blank_axial_in), its back face on the jaw steps. The 6 in 4-jaw's jaws, steps and body are schematic (the steps' depth is not on record: drawn .12). The AR tool schematic (not on record), its point on the faced plane at Ø1.4, feeding out. Hatched: the .015 (cad.face_stock_in) faced off inside Ø2.25; the ring outside it is turned off in Setup 3. The MT3 dead centre that seated the punch mark while the jaws were tightened is withdrawn: a callout, not drawn. -->
  <rect class="paper" x="0" y="0" width="760" height="480"/>
  <text class="title" x="20" y="22">Setup 2, Op 50: the AR tool faces the out face from the centre out to Ø2.25 (to scale, 5 px/mm)</text>
  <path class="clamp" d="M379.69 398.75L379.69 445.74L283.8 445.74L283.8 382.24L360 382.24L360 398.75Z"/>
  <path class="clamp" d="M379.69 81.25L379.69 34.26L283.8 34.26L283.8 97.76L360 97.76L360 81.25Z"/>
  <rect class="fixture-vise" x="223.8" y="34.26" width="60" height="411.48"/>
  <rect class="part-kept" x="360" y="81.25" width="15.88" height="317.5"/>
  <line class="centre-line" x1="150" y1="240" x2="740" y2="240"/>
  <text class="datum-label" x="391.69" y="60">the back face (datum end), on the jaw steps</text>
  <line class="leader" x1="389.69" y1="56" x2="361" y2="106.65"/>
  <circle class="leader-dot" cx="361" cy="106.65" r="2"/>
  <rect class="part-removed" x="373.97" y="97.12" width="1.9" height="285.75"/>
  <path class="cutter" d="M373.97 328.9L403.97 340.9L403.97 428.9L395.97 425.9L387.97 428.9L379.97 428.9L379.97 352.9Z"/>
  <line class="arrow" x1="419.97" y1="338.9" x2="419.97" y2="388.9"/>
  <text class="label" x="430" y="300">AR tool: face the out face from the centre out</text>
  <text class="label" x="430" y="316">to Ø2.25 only (Op 40's hand check; Ø2.20 if</text>
  <text class="label" x="430" y="332">a jaw is in the way), never out to the jaws;</text>
  <text class="label" x="430" y="348">to {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} thick by micrometer</text>
  <line class="leader" x1="428" y1="296" x2="393.97" y2="398.9"/>
  <circle class="leader-dot" cx="393.97" cy="398.9" r="2"/>
  <text class="label" x="430" y="120">MT3 dead centre: its point in the punch mark</text>
  <text class="label" x="430" y="136">while the jaws were tightened in turn;</text>
  <text class="label" x="430" y="152">withdrawn before this cut (not drawn)</text>
  <text class="label" x="150" y="470">6 in 4-jaw on the four sawn edges (two jaws shown in section)</text>
</svg>
