# Cylinder bank south end disc MHA-DT-26, one off, turned on the manual
# PM-1127VF-LB (owner ruling 2026-11-21: turned parts get lathe travelers, no
# NC). Route chosen for speed (agent's choice under the owner ruling of
# 2026-11-21) from the 1/8 x 2-1/2 in C36000 flat on hand, bought for this
# disc (stock.c360-flat-1-8x2-1-2): saw a 2-1/2 in square off it and saw its
# corners off; Setup 2, the blank in the 6 in 4-jaw on its sawn edges, its
# centre-punch mark trued to the MT3 dead centre in the tailstock: face the
# out face to the thickness, spot and drill V through; Setup 3, the blank on
# a 3/8-16 bolt through that hole, head outboard (head, washer, blank,
# washer, nut), the threads in the 3-jaw: turn the outside to its
# diameter. Bench: deburr and check.
#
# Owner rulings 2026-11-21 (answered in person): the 6 in 4-jaw independent
# chuck is on hand (cad/config/shop-equipment/fixtures.chuck-4jaw-6), and the
# tailstock is MT3, which the owner's MT3 dead centre fits
# (tools.dead-centre-mt3). The 4-jaw's body is Ø160 mm and its jaws open to
# 140 mm (owner, measured 2026-11-22; fixtures.chuck-4jaw-6); its least grip
# is .2865 in (owner 2026-11-24; workholding.chuck-4jaw-6 grip_range_mm), and
# Setup 2 opts out of the lathe-holding screen (lathe_hold = "other");
# the 2-1/2 in square blank, about 3.54 in (90 mm) across its corners, is
# well inside the 140 mm opening.
#
# FLAGGED, not on record: the mandrel hardware, one 3/8-16 x 1-1/2 in
# FULLY threaded hex bolt (a standard bolt's 1/2 in plain shank would stop
# the nut short of the .24 in stack), one 3/8-16 hex nut and two 3/8 x
# 1-1/2 in OD fender washers (they back the .11 disc to Ø1.5 and clear the
# Ø2.16 turned edge by .33); shop hardware, to find or buy.
title = "Cylinder Bank South End Disc"
part = "{{cad.drawing_number}}"
revision = "{{cad.revision}}"
material = "C36000 free-machining brass, 1/8 x 2-1/2 in flat"
stock = "1/8 × 2-1/2 in flat, on hand; one disc from a {{process.blank_side_in:g}} in square sawn off it."
note = "Inches unless mm. Lathe PM-1127VF-LB (70–380 and 380–2000 rpm); brass cut dry. Not on record, to find or buy before the job: the mandrel's 3/8-16 x 1-1/2 in fully threaded hex bolt, its nut and two 3/8 x 1-1/2 in OD fender washers. The .377 and .381 pin gauges are on the owner's order (owner 2026-11-21: \"ill buy pin gauges\")."
shop = "../shop"
stock_refs = ["c360-flat-1-8x2-1-2"]
material_key = "lathe-c360"
turning_material = "brass"

[cad]
file = "../../out/features/dt_cylinder_end_disc/features.toml"
adapter = "turned_bush"
part = "dt-cylinder-end-disc"

[parameters]
quantity = 1
# The square sawn off the flat and the flat's thickness along the axis.
blank_side_in = 2.5
blank_axial_in = 0.125
# What Setup 2 faces off the out face for the picture: the flat's .125 less
# the disc's .11 nominal (the adapter binds the same as cad.face_stock_in).
face_allowance_in = 0.015
# The sawn blank's largest swung diameter: the square's corners sawn off
# .80 back along each edge leave vertices at (1.25, .45) in from its centre,
# Ø2.657 in (67.49 mm); the cut lines stand 1.202 in from the centre, so the
# blank still holds a Ø2.40 circle, over the disc's Ø2.18.
blank_swing_mm = 67.49
# Setup 3: the 3/8-16 bolt (Ø.375) head outboard, its threads in the 3-jaw
# up to the nut, so all that stands out of the jaws is the nut (about .33),
# a washer, the blank, a washer and the head (about .23): about .81 in, set
# at 21 mm; the thread's root, about Ø.30, the least section there.
bolt_dia_mm = 9.525
mandrel_stickout_mm = 21.0
bolt_root_mm = 7.5

[[tools]]
id = "saw"
name = "Evolution miter saw"
ref = "saw-evolution-14"

[[tools]]
id = "ar"
name = "AR turning tool"
ref = "lathe-ar"

[[tools]]
id = "dead-centre"
name = "MT3 dead centre"
ref = "dead-centre-mt3"
description = "MT3 dead centre, in the lathe tailstock: centres the blank on its punch mark (Setup 2)"

[[tools]]
id = "centre"
name = "No. 3 centre drill"
ref = "centre-drills-carbide-60"

[[tools]]
id = "drill-v"
name = "V drill"
ref = "drill-v"

[[tools]]
id = "file"
name = "Smooth file"
ref = "jig-files"

[[setups]]
machine_kind = "other"
title = "Saw the blank"
machine = "Saw / bench"
indexing = "none"
diagram = { file = "diagrams/saw.svg", alt = "Op 10, to scale, from above: a {{process.blank_side_in:g}} in length marked off the 1/8 x 2-1/2 flat lying against the fence and sawn on the waste side of the line." }
envelope = "other"
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw a {{process.blank_side_in:g}} in length off the flat, the flat lying on the saw bed against the fence, clamped in the saw's vise: a {{process.blank_side_in:g}} in square. Scribe both diagonals and centre-punch where they cross. Mark each corner .8 in back along both edges."
feed = "hand"

[[setups.operations]]
speed_kind = "other"
tool = "saw"
drilling = "none"
sizing = "other"
instruction = "Saw each corner off: the square flat on the bed, an edge on the fence, the head at 45°, the square clamped in the saw's vise, the blade on the marks. Deburr the sawn edges."
diagram = { file = "diagrams/saw-corners.svg", alt = "Op 20, to scale, from above: the square flat on the bed, an edge on the fence, the head at 45°; a corner sawn off on the marks, the finished Ø2.17 disc inside the corners left." }
feed = "hand"

[[setups.operations]]
instruction = "Mike the thickness at four places: {{cad.length_min_in:.3dot}} or over everywhere, else stop."
inspection = "Thickness at least {{cad.length_min_in:.3dot}} (micrometer, four places)."
gauge_checks = "other"
feed = "hand"

[[setups]]
machine_kind = "lathe"
title = "4-jaw: face to thickness, drill V"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "6 in 4-jaw on the blank's four sawn edges, seated flat on the jaw steps, jaws snug only. The MT3 dead centre in the tailstock: run its point into the centre-punch mark, then tighten the jaws in turn, a pair at a time, keeping the point seated in the mark; withdraw the tailstock."
datum = "The face against the jaw steps; the out face is faced to the thickness from it."
diagram = { file = "diagrams/block.svg", alt = "Op 50, to scale: a section through the 4-jaw, the sawn blank's back face on the jaw steps; the AR tool faces the out face from the centre out to Ø2.25 (the dead centre that seated the punch mark withdrawn)." }
lathe_hold = "other"

[[setups.operations]]
cut_kind = "other"
instruction = "Spindle off: set the AR tool's tip on the out face at Ø2.25 and turn the chuck a full turn by hand. No jaw may touch the tool or its holder (the jaws' step depth is not on record). A jaw in the way: try Ø2.20, just over the finished Ø2.18; a jaw in the way there too: stop and tell the owner."
feed = "hand"

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Face the out face from the centre out to the Ø the check above cleared (Ø2.25, or Ø2.20), never out to the jaws; Setup 3 turns off the ring outside it. Light skims, miking the thickness between them, to {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}} (about {{cad.face_stock_in:.3dot}} comes off)."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Thickness {{cad.length_min_in:.3dot}}–{{cad.length_max_in:.3dot}}, by micrometer, four places."
gauge_checks = [{ gauge = "micrometers", band_mm = "{{cad.length_band_mm}}" }]

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "centre"
drilling = "none"
sizing = "other"
instruction = "Spot the centre from the tailstock, about Ø.25 across the countersink: under the V drill, so the drill removes it."
settings = "lathe-centre-c360"
cut_diameter_mm = 2.778

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "drill-v"
drilling = "twist_drill"
sizing = { kind = "band", band_mm = "{{cad.bore_dia_band_mm}}" }
instruction = "Drill V through from the tailstock, dry, feeding gently as the point breaks through (brass grabs): the hole is the mandrel's in Setup 3."
diagram = { file = "diagrams/block-drill.svg", alt = "Op 70, to scale: the V drill through the blank from the tailstock, its point breaking through the back face clear of the jaw steps." }
settings = "lathe-drill-v-c360"
cut_diameter_mm = "{{cad.bore_dia_mm}}"
hole_depth_mm = 6.0
peck = "none"

[[setups]]
machine_kind = "lathe"
title = "Bolt mandrel: turn the outside"
machine = "PM-1127VF-LB lathe"
indexing = "none"
machine_ref = "pm-1127vf-lb"
holding = "On the 3/8-16 x 1-1/2 in fully threaded bolt, head outboard: head, fender washer, the blank (its V hole on the bolt), fender washer, nut, the nut tight. The bolt's threaded end in the 3-jaw up to the nut, the jaws on the threads."
datum = "The disc's faces between the washers; only the outside is cut."
diagram = { file = "diagrams/mandrel.svg", alt = "Op 80, to scale: the blank on the 3/8-16 bolt between fender washers, head outboard, the nut toward the chuck, the bolt's threads in the 3-jaw; the AR tool turns the outside to Ø{{cad.outer_dia_min_in:.2dot}}–{{cad.outer_dia_max_in:.2dot}}." }
lathe_hold = { chuck = "chuck-3jaw-6", grip_diameter_mm = "{{process.bolt_dia_mm}}", stock_diameter_mm = "{{process.blank_swing_mm}}", stickout_mm = "{{process.mandrel_stickout_mm}}", minimum_diameter_mm = "{{process.bolt_root_mm}}", support = "none" }

[[setups.operations]]
cut_kind = "other"
speed_kind = "spindle"
tool = "ar"
drilling = "none"
sizing = "other"
instruction = "Turn the outside across its thickness, light cuts at the sawn flats' interruptions, to Ø{{cad.outer_dia_min_in:.2dot}}–{{cad.outer_dia_max_in:.2dot}}."
settings = "lathe-ar-c360"
cut_diameter_mm = "{{cad.outer_dia_mm}}"
inspection = "Outside Ø{{cad.outer_dia_min_in:.2dot}}–{{cad.outer_dia_max_in:.2dot}}, by calipers."
gauge_checks = [{ gauge = "calipers", band_mm = "{{cad.outer_dia_band_mm}}" }]

[[setups]]
machine_kind = "other"
title = "Bench: deburr and check"
machine = "Bench"
envelope = "other"
indexing = "none"
diagram = { file = "diagrams/inspect.svg", alt = "The finished disc: Ø2.17 by .11 with the V hole through." }
vise_hold = "other"
beam = "other"

[[setups.operations]]
speed_kind = "other"
tool = "file"
drilling = "none"
sizing = "other"
instruction = "Deburr: break both outside edges and both ends of the hole R{{cad.edge_break_in:.3dot}} or chamfer {{cad.chamfer_max_in:.3dot}} max."
feed = "hand"

[[setups.operations]]
instruction = "Check the hole: a Ø{{cad.bore_dia_min_in:.3dot}} pin gauge enters and a Ø{{cad.bore_dia_max_in:.3dot}} does not."
inspection = "Hole Ø{{cad.bore_dia_min_in:.3dot}}–{{cad.bore_dia_max_in:.3dot}}."
gauge_checks = [{ gauge = "pin-gauges", band_mm = "{{cad.bore_dia_band_mm}}" }]
feed = "hand"
