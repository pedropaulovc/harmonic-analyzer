# Owner-accepted machinist-review exceptions for draw_dt_cone_gear.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_dt_cone_gear.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
# TODO(#1649): RV-01 is pending owner confirmation. The geometry follows
# from two owner rulings, and changing it changes MHA-DT-004. #1649 lists
# the options (two-piece tip, integral pinion, keep, push-broach, 1/16 land,
# round pinned/soldered bore); one owner pick there closes this RV-01 and
# MHA-DT-004's (#1644). Remove RV-01 when that pick lands.
- id: "RV-01"
  kind: "accept"
  anchor:
    - "dim:BoreCutDia@BoreProfile"
    - "dim:BoreAF@BoreProfile"
  finding: "the T006/T012 D-bore, ~0.8 mm across with its flat ~0.02 past the centre and held to 0.01 through the face, has no plausible hobby-shop route to cut or check"
  reason: "the bore is fixed by owner rulings, not chosen on this sheet: the 1/32 in terminal land of MHA-DT-004 that T012 and T006 slide on (user ruling U40, 2026-09-23, https://github.com/pedropaulovc/harmonic-analyzer/issues/971#issuecomment-6151646064; DT6-FORM1 option (a), 2026-10-10) and one D-flat on every gear land, run out through the tip, phasing every gear to the shaft (user ruling 2026-09-28, recorded in dt_cone_gear_shaft_spec FLAT_OFFSETS); the sliding fit is 0.025-0.075 diametral and 0.010-0.030 across the flat on that land; the geometry decision is open with the owner at https://github.com/pedropaulovc/harmonic-analyzer/issues/1649"
- id: "RV-02"
  kind: "accept"
  anchor:
    - "dim:BoreCutDia@BoreProfile"
    - "note:draw_dt_cone_gear.DIMENSION_CALLOUTS[BoreCutDia]"
  finding: "the bore callout gives no process word such as REAM or BORE (rule 12)"
  reason: "owner ruling 2026-09-29 took the process word off both D-bores (MHA-DT-003 and MHA-DT-007): a through reamer would cut away the flat, the dimensions define the D-profile, and the route belongs in the book, not on the print (https://github.com/pedropaulovc/harmonic-analyzer/commit/7b9ed689199b72c7b0b9db70bfee9ca4fd497e4f)"
