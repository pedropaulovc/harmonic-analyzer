# Owner-accepted machinist-review exceptions for draw_ch_rocker_arm_tl_oblique_jig_assembly.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_ch_rocker_arm_tl_oblique_jig_assembly.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
- id: "RV-01"
  kind: "accept"
  anchor:
    - "note:ch_rocker_arm_tl_oblique_jig_assembly_spec.NUT_FIT_STEP"
    - "note:ch_rocker_arm_tl_oblique_jig_assembly_spec.FEED_TIGHTEN_STEP"
  finding: "no mechanical lock on the nut-flange screws under the reversing nut torque (rule 23)"
  reason: "static clamp, rule 23's last bullet: the 4 M3 SHCS clamp the Tr8 nut's flange to TL-29 and no operating torque reaches them. The nut's worst-case torque is 0.87 N·m (1 kN hand-abuse thrust, oiled Tr8x2 thread); the flange's clamp slip torque is 8.0 to 10.7 N·m (4 x M3 at 1.67 kN preload from 1.0 N·m, mu 0.15 to 0.20, on the 16 bolt circle), a 9 to 12x margin, so the flange never slips (jig spec NUT_FLANGE_SLIP_MARGIN, self-checked >= 1.5). A wedge-lock pair cannot seat: an M3 pair's OD 7.0 on the 16 bolt circle overlaps the nut's 10.2 body by 0.6 (owner ruling 2026-10-17, via coordinator) (owner-accepted)"
- id: "RV-02"
  kind: "accept"
  anchor: "note:ch_rocker_arm_tl_oblique_jig_assembly_spec.NUT_BRACKET_SET_STEP"
  finding: "a three-place set given to hold the #8 taps' end walls (rules 4 and 17: walls fixed with geometry, not a tighter band)"
  reason: "TL-29 cannot grow: a longer bracket puts the leadscrew feed gap under 2.5 and its 3/4 stock caps the length, so the set takes the title block's .XXX band (+/-0.13) with its reason, and each #8 tap's end wall is 1.544 min at the worst case of every band, over the 1.5 floor; MHA-CH-006-TL-29 states it on its #8 callout (nut bracket spec END_WALL_MIN, self-checked) (owner ruling 2026-10-17, via coordinator) (owner-accepted)"
- id: "RV-03"
  kind: "accept"
  anchor: "note:ch_rocker_arm_tl_oblique_jig_assembly_spec.FEED_TIGHTEN_STEP"
  finding: "set screws on a hand-cranked, reversing shaft held only by threadlocker, no mechanical lock (rule 23)"
  reason: "the lock means is the owner's choice: a bought low-strength (purple) threadlocker on each set screw, named in step 8, with no new hardware; each set screw seats on a flat on the screw, so the flat, not friction, carries the hand-crank torque (owner ruling 2026-10-18, via coordinator) (owner-accepted)"
