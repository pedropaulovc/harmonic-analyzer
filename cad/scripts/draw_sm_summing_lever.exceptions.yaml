  reason: "owner ruling 2026-10-18: machined from solid with an R1.0 MAX inside-corner ceiling; the shop-wide default goes in the title block under #1625, which also adds the local R0.5 MAX stub-root and R0.4 MAX rib-end limits (owner-accepted; no code anchor: nothing prints an inside-corner radius until #1625)"
