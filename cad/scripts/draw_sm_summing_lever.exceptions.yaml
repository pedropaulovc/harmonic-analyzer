# Owner-accepted machinist-review exceptions for draw_sm_summing_lever.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_sm_summing_lever.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
- id: "RV-01"
  kind: "accept"
  anchor: "frame:sm_summing_lever_spec.GEOMETRIC_TOLERANCES_MM[spring-hole pattern position]"
  finding: "pattern position frame over-specified (rule 5)"
  reason: "one pattern control keeps the 20 channels spring geometry consistent; its Ø0.15 zone, tightened from Ø0.30 by owner ruling on code review C06, keeps neighbouring MHA-CH-014 jam nuts 0.25 apart with both taps at their worst (owner-accepted)"
