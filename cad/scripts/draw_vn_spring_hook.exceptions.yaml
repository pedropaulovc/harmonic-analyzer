# Owner-accepted machinist-review exceptions for draw_vn_spring_hook.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_vn_spring_hook.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
- id: "RV-01"
  kind: "accept"
  anchor:
    - "dim:ChamferWidth@StockDeburrProfile"
    - "note:draw_vn_spring_hook.CHAMFER_CALLOUT[ChamferWidth]"
  finding: "chamfer band over-specified for a deburr; the low limit only needs some chamfer (rule 4)"
  reason: "owner ruling 2026-10-17: both limits carry function. Low: the cut end's flat must pass the #6-32 tap drill it enters, so the chamfer is at least MIN_CHAMFER_WIDTH_MM 0.4001 ((major - tap drill) / 2), and the 0.41 low limit stays above it. High: 0.51 at the steepest in-band angle sets the axial chamfer the past-nut budget charges, keeping the worst-case full thread past MHA-CH-014 at or above the 1.5875 (two-pitch) floor"
