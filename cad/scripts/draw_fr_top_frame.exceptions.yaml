# Owner-accepted machinist-review exceptions for draw_fr_top_frame.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_fr_top_frame.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
- id: "RV-01"
  kind: "accept"
  anchor:
    - "frame:fr_top_frame_spec.GEOMETRIC_TOLERANCES_MM[knife-hanger slot position]"
    - "frame:fr_top_frame_spec.GEOMETRIC_TOLERANCES_MM[knife-hanger crossbar centring]"
  finding: "position frames over-specified (rule 5)"
  reason: "keeps both knife mounts dowel lines square to the knife-edge line and bounds the hanger axes' shift off the crossbar median while retaining the screw/slot and side webs (owner-accepted knife-edge-system control)"
- id: "RV-02"
  kind: "accept"
  anchor: "note:fr_top_frame_spec.DRAWING_NOTES"
  finding: "inside-corner radius stated in a general note rather than modelled (rules 2, 16, 21)"
  reason: "owner ruling 2026-10-18: the cast window corners and flange junctions take at most the casting's own R3.0 root radius, stated once in the general note until the title block gains its inside-corner default (#1625); the model's T-roots carry the dimensioned R3.0"
- id: "RV-03"
  kind: "accept"
  anchor:
    - "note:fr_top_frame_spec.DRAWING_NOTES_B"
    - "note:fr_top_frame_spec.DRAWING_NOTES_C"
  finding: "Ra 3.2 required over whole faced planes, not only the locating seats, and given in note text (rules 6, 7)"
  reason: "owner rulings 2026-10-11, 2026-10-12, 2026-10-14 and 2026-10-18: the top plane between the bosses and the underside plane between the bosses are each faced in one pass for a cohesive appearance, so the keeper feet, hanger washers and knife-mount seats land on one faced plane wherever fit-up puts them"
- id: "RV-04"
  kind: "accept"
  anchor: "note:fr_top_frame_spec.DRAWING_NOTES"
  finding: "general 1.6 chamfer overrides the title-block edge break without a stated function (rules 1, 2)"
  reason: "owner rulings 2026-10-14 and 2026-10-18: the 1/16 in x 45 break on the convex casting edges is the machine's aesthetic, matching the base; hole, bore, counterbore, tap and slot mouths keep the title-block break"
