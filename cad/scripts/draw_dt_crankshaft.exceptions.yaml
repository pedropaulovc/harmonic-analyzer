# Owner-accepted machinist-review exceptions for draw_dt_crankshaft.py: the
# drawing-simplicity-policy.md "Named exceptions" mechanism. Each anchor names
# the symbol that prints the excused item; draw_dt_crankshaft.py tags the site with
# '# machinist-exception: <id>'. Read only by machinist_exceptions.py; no build
# or draw closure reaches this file, so editing it re-keys nothing.
# TODO(#1625): remove RV-01 and the INSIDE CORNERS note when the title
# block gains its inside-corner default.
- id: "RV-01"
  kind: "accept"
  anchor: "note:dt_crankshaft_spec.DRAWING_NOTES"
  finding: "shoulder fillets/undercuts not sized at each step (rule 11) or a general inside-corner note in place of a title-block default"
  reason: "owner ruling 2026-10-18 (fr-top-frame / sm-summing-lever / dt-cone-pivot-post precedent): turned with an R0.25 MAX inside-corner ceiling, printed as one note until the shop-wide default goes in the title block under #1625 (owner-accepted)"
- id: "RV-02"
  kind: "minor"
  anchor: "note:dt_crankshaft_notes.DRIVE_PIN_RIM_NOTE"
  finding: "wall from each drive-pin hole to the Ø17.50 seat-spigot rim below the 1.5 mm floor (rules 17, 20)"
  reason: "owner ruling 2026-10-18 on PR #1654 (#991): 0.48 MIN at the smallest printed spigot (Ø17.40) and the hole's worst position; the Ø14 pin circle is shared with MHA-PD-009 and its drive collar, and between the wheel's Ø10.3 bore and the spigot there is only 1.05 of radial room for both walls, so no pin circle meets 1.5 on both sides (a Ø12 circle breaks the wheel's holes into its bore); the spigot diameter is held by the #25 chain wrapping the T12. Accepted as stated until the redesign in #1679 (owner-ruled shortfall)"
