# Global machine inputs — the few independent numbers the geometry derives from.
#
# Build scripts read these; everything else (centre distances, cam grids,
# incline trig, shaft steps) is COMPUTED from them in code. Do not paste
# derived values back here — keep this to genuine inputs with provenance.
#
# Provenance is preserved INLINE here (source / confidence / notes) rather than
# regenerated into DIMENSIONS.md — the curated 788-line DIMENSIONS.md narrative
# stays the human research record; these notes are its machine-readable digest,
# and feed the parts' "Notes" custom property (build_*.py save -> Part D).
# Confidence ladder (DIMENSIONS.md): annotated > stated > scaled > legacy > derived.
units: mm

gear_train:
  diametral_pitch: 49.82           # DP_TRAIN — cone/cylinder train (= 122*25.4/62.2)
  fundamental_cone_teeth: 120      # largest cone gear; per-channel = 120 - 6*index
  cylinder_teeth: 120              # equal-size cylinder gears
  crank_drive_ratio: [16, 64]      # 16T pinion on crankshaft : 64T on cone shaft
  crank_drive_diametral_pitch: 26.57 # = DP_TRAIN*64/120, so the 64T pitch radius equals the cone T120's (30.59) — restores the book's "64T OD ≈ cone 120T OD" read and keeps the 64T ~1.9× coarser than the train (low; rescaled with the 62.2 anchor)
  source: "DIMENSIONS.md ch13 (cylinder gear OD scaling), ch29/ch8 (gear law)"
  confidence: low
  notes: >-
    Tooth counts counted directly on the book plates (high). DP is now ANCHORED
    on the measured cylinder-gear OD = 62.2 mm (DIMENSIONS.md ch13, scaled p.25
    bottom-left vs the back-view gear brackets, LOW confidence): m = 62.2/(120+2)
    = 0.50984 mm, DP = 25.4/m = 49.82, pitch dia = 120*m = 61.18 mm. This
    SUPERSEDES the former DP 30 round-inch derivation (which gave OD 103.3) — see
    the ch12/ch13 discrepancy notes. Cone T120 shares this module (it meshes the
    cylinder set). Gear law (ch.29 p.99, annotated): cylinder gear k turns k/80
    rev per crank turn; ch.8 p.7 (stated): gear n spins n× gear 1. Crank reduction
    16:64 = 1:4 sets the cone-shaft input speed.

cone_incline:
  # True-cone incline derived from exact tracking: sin(i) = radius_step / z_pitch.
  # radius_step = 3*25.4/DP = 1.5295 (pitch-radius step per 6 teeth at DP 49.82);
  # z_pitch = drum_seat*cos(asin(radius_step/drum_seat)) = 7.0565. -> incline = 12.5188 deg.
  # NOTE drum_seat_nominal is RE-TUNED (7.5 -> 7.2204) so z_pitch stays 7.0565 =
  # the channels.station_pitch grid: holding the channel spine fixed keeps the
  # rocker/lever/spring/output machinery in place when the gear module shrinks.
  radius_step_mm: 1.5295
  drum_seat_nominal_mm: 7.2204
  derived_incline_deg: 12.5188     # documentation only; code recomputes from the two inputs
  source: "M6.7 true-cone derivation, re-tuned for DP 49.82 (ch13 OD 62.2)"
  confidence: low
  notes: >-
    Incline is DERIVED, not measured: sin(i)=radius_step/z_pitch where
    z_pitch=sqrt(drum_seat^2 - radius_step^2)=7.0565, giving i=12.5188°. The
    smaller radius_step (1.5295 vs the old 2.54) follows from the finer module
    DP 49.82 (ch13 OD 62.2); drum_seat_nominal is re-tuned to 7.2204 so z_pitch
    stays locked to the channels.station_pitch 7.0565 grid (the cone seat pitch
    along the shaft is now z_pitch*cos(i) = 6.8888, cone stack ~137.8 mm). The
    naive arcsin(radius_step/drum_seat) is wrong (mistakes the drum chord for the
    pitch advance) — see the solidworks-modeling-pitfalls memory.

channels:
  count: 20                        # full channel table size (channels.yaml rows)
  active_count: 3                  # <-- TEMPORARY (see note below)
  station_pitch_mm: 7.0565         # PITCH — z-spacing between channel stations
  station_z0_mm: -67.1             # z_station(j) = station_z0 + station_pitch*j
  source: "DIMENSIONS.md ch12-13 drum grid"
  confidence: med
  notes: >-
    Station pitch is the drum grid spacing, frame-locked; z0 anchors station 0.
    Scaled from the annotated drum photos (ch12-13), re-measured during the M6
    drive-train build.

    TEMPORARY BUILD-PERFORMANCE REDUCTION (2026-06-19): active_count caps the
    per-channel mechanism the build actually instantiates — the cylinder gear +
    its cam follower (connecting-rod) in drive-train, and the rocker-arm /
    amplitude-bar / channel-lever (top lever) / return spring in channel — to the
    FIRST active_count channels (3). The 20 cone gears are KEPT (the cone stack is
    derived from the full count: 388/207 in build_drive_train_assembly.py read all
    20 rows), as are all 20 rows of channels.yaml (gear law, ratios, the synthesis
    truth model). This was done ONLY to cut the full-build / refresh time while the
    remaining parts of the device are certified; it WILL BE RECOVERED by setting
    active_count back to 20 (and restoring amplitude:preset to `square`, then
    regenerating channels.yaml amplitude_mm by the law below) once certification is
    complete. _config.active_count()/active_channels() are the single read points.

output:
  magnify_factor: 4.0              # magnifying lever / wheel amplification to the pen
  spring_count_channel: 20         # one return spring per channel
  spring_count_counter: 1          # single counter spring (force-balance datum)
  pen_trace_half_mm: 15.0          # physical pen half-stroke the computed curve maps onto
  pen_rest_crank_deg: 90.0         # crank angle the saved/render pose sits at (pen at datum)
  source: "DIMENSIONS.md ch19, ch26-28"
  confidence: med
  notes: >-
    20 channel return springs + 1 counter spring (ch.19) float the summing lever
    in static equilibrium; the magnifying lever/wheel amplifies its travel ~4×
    to the pen (ch.26-28). The summation is COMPUTED, not force-simulated — see
    docs/motion-policy.md and truth_model.py. The pen is driven KINEMATICALLY:
    the pen-rod travel mate is equation-linked to a CrankDeg global through the
    chained Fourier sum (pen_driver.py), reproducing truth_model.pen_y with no
    force solver. pen_trace_half_mm maps the (dimensionless-amplitude) computed
    curve onto a physical pen half-stroke; at pen_rest_crank_deg the pen sits at
    its build datum so the saved render pose is unchanged. verify.py --suite
    kinematics sweeps CrankDeg and asserts the sampled tip matches truth_model.

amplitude:                         # ch15 — the amplitude bars set the Fourier coefficients
  preset: neutral                  # <-- TEMPORARY: all bars reset to neutral (a_j = 0)
  fundamental_station_mm: 80.0     # a_1 bar station; a_j = this / harmonic_n (odd j), 0 (even j)
  max_travel_mm: 88.0              # ±88 mm amplitude-bar seesaw range (ch.15)
  source: "DIMENSIONS.md ch15; truth_model.py"
  confidence: med
  notes: >-
    The amplitude bar station along the rocker IS the Fourier coefficient a_j.
    TEMPORARY (2026-06-19): every bar has been reset to its neutral position
    (a_j = 0, the `neutral` preset), so channels.yaml amplitude_mm is all zeros and
    the synthesised pen trace is flat. This pairs with the temporary channel
    reduction (channels.active_count) and will be RECOVERED together: restore
    preset to `square` and regenerate channels.yaml amplitude_mm by the square law
    — for the `square` preset a_j = fundamental_station_mm / harmonic_n on the ODD
    harmonics and 0 on the even ones (the textbook square-wave partial sum, odd
    terms ∝ 1/n). truth_model.py reads the same amplitude_mm vector, so the
    computed pen curve always matches the as-built bar stations; verify.py --suite
    config asserts channels.yaml obeys whichever preset is set here.

alignment_pinion:                  # ch25 — engages the cylinder-gear set for zeroing
  teeth: 42
  disengaged_tip_gap_mm: 2.0       # PINION_GAP
  engaged_center_distance_mm: 41.30  # ENGAGED_C2C = (120+42)/2 * 25.4/DP (DP 49.82)
  source: "DIMENSIONS.md ch25"
  confidence: low
  notes: >-
    42T pinion counted on the ch25 plate (high); swings into the 120T cylinder set
    to zero all channels. Engaged centre distance = (120+42)/2 · 25.4/DP = 41.30 mm
    at the new DP 49.82 (was 68.58 at DP 30); disengaged it stands off with a 2 mm
    tip gap.
