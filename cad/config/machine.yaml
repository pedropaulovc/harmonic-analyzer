# Global machine inputs — the few independent numbers the geometry derives from.
#
# Build scripts read these; everything else (centre distances, cam grids,
# incline trig, shaft steps) is COMPUTED from them in code. Do not paste
# derived values back here — keep this to genuine inputs with provenance.
#
# Provenance is preserved INLINE here (source / confidence / notes) rather than
# regenerated into DIMENSIONS.md — the curated 788-line DIMENSIONS.md narrative
# stays the human research record; these notes are its machine-readable digest,
# and feed the parts' "Notes" custom property (build_*.py save -> Part D).
# Confidence ladder (DIMENSIONS.md): annotated > stated > scaled > legacy > derived.
units: mm

gear_train:
  diametral_pitch: 30.0            # DP_TRAIN — cone/cylinder train
  fundamental_cone_teeth: 120      # largest cone gear; per-channel = 120 - 6*index
  cylinder_teeth: 120              # equal-size cylinder gears
  crank_drive_ratio: [16, 64]      # 16T pinion on crankshaft : 64T on cone shaft
  crank_drive_diametral_pitch: 16.0  # coarser than the DP-30 train; round-PD estimate (low)
  source: "DIMENSIONS.md ch12 (DP), ch29/ch8 (gear law)"
  confidence: high
  notes: >-
    Tooth counts counted directly on the book plates; DP 30 stated ch12.
    Gear law (ch.29 p.99, annotated): cylinder gear k turns k/80 rev per crank
    turn; ch.8 p.7 (stated): gear n spins n× gear 1. Crank reduction 16:64 = 1:4
    sets the cone-shaft input speed.

cone_incline:
  # True-cone incline derived from exact tracking: sin(i) = radius_step / z_pitch.
  # radius_step = 3*25.4/DP = 2.54 (pitch-radius step per 6 teeth);
  # z_pitch = 7.5*cos(asin(2.54/7.5)) = 7.0568. -> incline = 21.0976 deg.
  # NOT arcsin(2.54/7.5)=19.8 — see solidworks-modeling-pitfalls.
  radius_step_mm: 2.54
  drum_seat_nominal_mm: 7.5
  derived_incline_deg: 21.0976     # documentation only; code recomputes from the two inputs
  source: "M6.7 true-cone derivation"
  confidence: high
  notes: >-
    Incline is DERIVED, not measured: sin(i)=radius_step/z_pitch where
    z_pitch=7.5·cos(asin(2.54/7.5))=7.0568, giving i=21.0976°. The naive
    arcsin(2.54/7.5)=19.8° is wrong (mistakes the drum chord for the pitch
    advance) — see the solidworks-modeling-pitfalls memory.

channels:
  count: 20
  station_pitch_mm: 7.0565         # PITCH — z-spacing between channel stations
  station_z0_mm: -67.1             # z_station(j) = station_z0 + station_pitch*j
  source: "DIMENSIONS.md ch12-13 drum grid"
  confidence: med
  notes: >-
    Station pitch is the drum grid spacing, frame-locked; z0 anchors station 0.
    Scaled from the annotated drum photos (ch12-13), re-measured during the M6
    drive-train build.

output:
  magnify_factor: 4.0              # magnifying lever / wheel amplification to the pen
  spring_count_channel: 20         # one return spring per channel
  spring_count_counter: 1          # single counter spring (force-balance datum)
  pen_trace_half_mm: 15.0          # physical pen half-stroke the computed curve maps onto
  pen_rest_crank_deg: 90.0         # crank angle the saved/render pose sits at (pen at datum)
  source: "DIMENSIONS.md ch19, ch26-28"
  confidence: med
  notes: >-
    20 channel return springs + 1 counter spring (ch.19) float the summing lever
    in static equilibrium; the magnifying lever/wheel amplifies its travel ~4×
    to the pen (ch.26-28). The summation is COMPUTED, not force-simulated — see
    docs/motion-policy.md and truth_model.py. The pen is driven KINEMATICALLY:
    the pen-rod travel mate is equation-linked to a CrankDeg global through the
    chained Fourier sum (pen_driver.py), reproducing truth_model.pen_y with no
    force solver. pen_trace_half_mm maps the (dimensionless-amplitude) computed
    curve onto a physical pen half-stroke; at pen_rest_crank_deg the pen sits at
    its build datum so the saved render pose is unchanged. verify.py --suite
    motion sweeps CrankDeg and asserts the sampled tip matches truth_model.

amplitude:                         # ch15 — the amplitude bars set the Fourier coefficients
  preset: square                   # the waveform the bar stations encode
  fundamental_station_mm: 80.0     # a_1 bar station; a_j = this / harmonic_n (odd j), 0 (even j)
  max_travel_mm: 88.0              # ±88 mm amplitude-bar seesaw range (ch.15)
  source: "DIMENSIONS.md ch15; truth_model.py"
  confidence: med
  notes: >-
    The amplitude bar station along the rocker IS the Fourier coefficient a_j.
    channels.yaml amplitude_mm is DERIVED from this scale: for the `square`
    preset a_j = fundamental_station_mm / harmonic_n on the ODD harmonics and 0
    on the even ones (the textbook square-wave partial sum, odd terms ∝ 1/n).
    truth_model.py reads the same amplitude_mm vector, so the computed pen curve
    always matches the as-built bar stations; verify.py --suite config asserts
    channels.yaml obeys this law. Change the preset/scale here and regenerate the
    channel bar stations to retune the machine.

alignment_pinion:                  # ch25 — engages the cylinder-gear set for zeroing
  teeth: 42
  disengaged_tip_gap_mm: 2.0       # PINION_GAP
  engaged_center_distance_mm: 68.58  # ENGAGED_C2C = (120+42)/2 * 25.4/DP
  source: "DIMENSIONS.md ch25"
  confidence: high
  notes: >-
    42T pinion counted on the ch25 plate; swings into the 120T cylinder set to
    zero all channels. Engaged centre distance = (120+42)/2 · 25.4/DP = 68.58 mm;
    disengaged it stands off with a 2 mm tip gap.
