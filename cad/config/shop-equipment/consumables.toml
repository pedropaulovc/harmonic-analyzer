# --- Taped holds on the CNC: blue painter's tape both faces, CA between -------

# Owner ruling 2026-11-23 (Pedro), taped holds: "for tape isnt it possible to
# use blue painters tape on both sides and ca glue between them"; "it is widely
# used in industry with much heavier requirements; take it as given it will
# work". The six taped parts (MHA-CH-13 strap, MHA-MS-01 stick, MHA-PD-01
# platen, MHA-PD-03 platen clip, MHA-PD-19 arm plate, MHA-DT-03-TL-02 phasing
# comb) hold this way; the 3M VHB 5906 record this replaces is retired with
# its purchase. No pull test; the operator proves each bond by a hand push.
# Then, on the depth levels the old tape's data-sheet strength had set:
# "no need to bring to me ; make coarser as you see fit".
#
# The hold's strength is ACCEPTED, not read from a data sheet: no maker states
# a tensile or shear strength for painter's tape under cyanoacrylate (the
# tape's listing gives a peel adhesion, a force per width of tape being
# stripped, which is not the strength of a face-bonded area). The owner
# accepted the hold and left the coarsening to the planner; accepted_*_kpa is
# the planner's figure under that delegation, not the owner's number and not a
# measurement: .6 MPa, the most a taped plan's cut may put on a bond in
# prechips' model (cross force over the piece's area; a lift at a piece's edge
# as 4 x force over a patch as long as the piece is wide). Most cuts are far
# under it and are set by the cutter and machine. It binds on narrow parts
# cut with an upcut end mill, where the edge of a masking-tape bond would
# peel first: the MHA-MS-01 stick's outline at one full-depth level would ask
# 1.6 MPa and so takes three (.54 MPa). prechips' bond check refuses any cut
# that would load a bond harder. Once parts have held, the owner may raise
# this one figure and those cuts coarsen further. Each traveler prints the
# figure as accepted.
#
# Stack: the listing's 5.4 mil per tape, twice, plus the glue line: a stated
# assumption, .011 in nominal. The programs work that far above the plate;
# every bond's stack is miked before its program runs and must read inside
# stack_min_mm..stack_max_mm.
[consumables.hold-painters-tape-ca]
name = "Taped hold: blue painter's tape on both faces, thick CA glue between"
kind = "bonded_hold"
status = "on_hand"
tape = "tape-scotchblue-2090"
adhesive = "ca-glue-gh1200"
accelerator = "ca-accelerator-starbond"
stack_thickness_mm = 0.28
stack_min_mm = 0.23
stack_max_mm = 0.33
accepted_shear_kpa = 600
accepted_tensile_kpa = 600
accepted_by = "the shop owner"
cite = ["Owner (Pedro) 2026-11-23: \"for tape isnt it possible to use blue painters tape on both sides and ca glue between them\"", "Owner (Pedro) 2026-11-23: \"it is widely used in industry with much heavier requirements; take it as given it will work\"", "Owner (Pedro) 2026-11-23: \"no need to bring to me ; make coarser as you see fit\""]

