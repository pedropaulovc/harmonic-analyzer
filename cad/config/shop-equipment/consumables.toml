# --- MHA-CH-13 rocker strap on the CNC (cad/process/ch_rocker_strap) ---------

# Tape for the MHA-CH-13 outline hold. Chosen because its data sheet states
# both a normal tensile and a shear strength; the thin transfer tapes read
# (3M 468MP, Nitto P-02) state peel and, for 468MP, lap shear only. It is a
# permanent tape: freeing the strap and cleaning both faces is part of the
# route (plan Setup 6).
[consumables.tape-3m-vhb-5906]
name = "3M VHB tape 5906, .006 in (0.15 mm), black"
kind = "double_sided_tape"
make = "3M"
sku = "5906"
status = "to_order"
thickness_mm = 0.15
normal_tensile_kpa = 690
dynamic_shear_kpa = 690
purchase = "1-1/2 in wide, or two 3/4 in strips side by side: 12 in per strap, 20 ft for the lot of 20. Rolls are 5 yd (15 ft), so two 1-1/2 in rolls or three 3/4 in rolls (#3083 row 11, owner ruling 2026-11-20). No price or stock read."
note = "Not owned: to buy. MHA-CH-13 Setup 5: bonds the faced blank to the sub-plate under its whole face while the outline is cut."
cite = ["3M VHB Tapes Technical Data, November 2015, Typical Performance Characteristics, 5906: thickness .006 in (0.15 mm); 90 degree peel 9 lb/in (16 N/cm); normal tensile (ASTM D-897, to aluminium, 72 h dwell) 100 lb/in2 (690 kPa); dynamic overlap shear (ASTM D-1002, to stainless steel, 72 h dwell) 100 lb/in2 (690 kPa); Application Techniques: clean with 50:50 isopropyl alcohol and water, about 15 psi application pressure, about 50% of ultimate bond strength after 20 minutes, 90% after 24 hours, 100% after 72 hours. Read 2026-11-17 from a distributor's copy (3M's own link refused the fetch): https://www.tspinc.com/pdf/3M-VHB-Tapes-Technical-Data.pdf"]

