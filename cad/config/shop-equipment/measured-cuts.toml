# The envelope each measured cutting setting is valid inside. The record key is
# the prechips setting's key in cad/process/shop/ (which carries its speed and
# chip load, once); these are the facts prechips has no field for: it refuses
# any other key on a setting record (pedropaulovc/prechips#586). A dechatter
# result holds for one tool assembly (cutter, holder, stick-out) and only as
# deep and as wide as the passes that were cut, so a plan operation naming one
# of these settings must pin the assembly's stick-out in the plan parameter
# named here and declare each cut (milling_cuts) no deeper and no wider than
# the limits: cad/scripts/_measured_cuts.py, test_measured_cuts.py.
#
# stickout_mm is the owner's own measurement of the assembly that made the
# cuts. report_setup_stickout_mm is what the report's setup field reads, where
# the two differ: the reports are the owner's recorded data and are not edited.
# direction is the reports' setup: every pass was conventional. No plan field
# states a cut's direction, so it is recorded here and not checked: a zigzag
# face climbs on every other pass, and that half is not measured.
#
# The mill's spindle is set by hand, and the speed a report prints is the one
# it asked for. The speed the spindle ran is in the session's results file
# (results: every round's results.json as dechatter wrote it; spindle_hz × 60),
# and it is the one that counts. Where a record carries speed_in_cut_rpm, that
# is the band of heard speeds its limit holds in, with chatter heard on both
# sides of it; speed_no_load_rpm is what to set before the cutter enters (the
# spindle slows in a wide cut). stickout_min_mm, where given, is the shortest
# stick-out a plan may pin for the setting: shorter is stiffer, and the reason
# it is allowed is beside the record.

# dechatter 0.4.0 report v5, 2026-11-22: 1.27 mm deep only. 2370 rpm was
# stable at 3.0, 3.2 and 3.4 mm wide; 3.4 mm was the widest cut made. Those
# passes ran at 2376-2379 rpm as heard; the next session heard 3.4 mm chatter
# at 2272, one step of the dial below, and cut wider (the record after this
# one, which new plans use).
[measured_cuts.em-half-carbide-1018-v5-face]
tool = "endmill-carbide-3fl-1-2"
holder = "R8 collet"
report = "cad/process/dechatter/2026-11-22-pm30mv-em-half-carbide-1018-v5.html"
results = "cad/process/dechatter/2026-11-22-pm30mv-em-half-carbide-1018-v5-results.json"
stickout_mm = 27.94
report_setup_stickout_mm = 30.0
stickout_parameter = "half_mill_projection_mm"
direction = "conventional"
axial_doc_max_mm = 1.27
radial_woc_max_mm = 3.4
cite = ["Owner (Pedro) 2026-11-22: \"stickout is recorded as 30mm but is actually 27.94\""]

# dechatter 0.5.0, session 1018-3.4mm-3fl-issue3439-v1, 2026-11-23 (#3439):
# 1.27 mm deep, 0.071 mm/tooth, conventional. One pass each, speeds as heard:
#   3.4 mm  asked 2300, ran 2272  chatter
#   3.4 mm  asked 2420, ran 2477  stable
#   3.4 mm  asked 2550, ran 2582  chatter
#   4.6 mm  asked 2420, ran 2377  stable
#   5.6 mm  asked 2430, ran 2486  stable
#   6.4 mm  asked 2450, ran 2455  stable (2488 in the light pass before it)
#   7.1 mm  asked 2450, ran 2422  stable (2486 before it)
#   7.6 mm  asked 2480, ran 2398  chatter (2488 before it)
# The limit taken is 6.4 mm, not the 7.1 mm the report recommends: 7.1 was one
# seven-second pass, 0.5 mm under the pass that chattered, so 6.4 keeps one
# stable pass and 1.2 mm between it and chatter. Every verdict is close: the
# stable passes read 23.7-24.4 dB against the detector's 27, the chattering
# ones 27.2, 27.3 and 28.6 (v5's stable passes read 16-19).
# Speed: stable from 2422 to 2486 in the cut at 5.6 mm and wider, chatter at
# 2272 and 2582 (3.4 mm) and at 2398 (7.6 mm, beyond the limit). At 6.4 mm
# itself only 2455 was cut; the band's ends are the 7.1 mm and 5.6 mm passes.
# 4.6 mm was also stable a step lower, at 2377, as v5's 3.4 mm was; wider
# than 4.6 mm is not measured at that speed. Asking for 2450 gave 2486-2488
# before the cut in each of the three rounds that asked for 2450 or 2480.
# Stick-out: the session's setup reads 28.448 mm (1.120 in), half a millimetre
# longer than the 27.94 the owner measured for v5 and v6. The plans pin 27.94
# (the deep record was measured there, and a longer tool is the worse case for
# it), so this record allows 27.94 to 28.448: the shorter assembly is the
# stiffer one, both sessions heard chatter at the same two pitches (about 400
# and 2050-2130 Hz), and v5 cut this record's speed step below (2377) stable
# to 3.4 mm at 27.94. Wider than 3.4 mm has not been cut at 27.94 itself.
# Not measured: climb, the session's other depth (0.4 mm), any chip load but
# 0.071 mm/tooth.
[measured_cuts.em-half-carbide-1018-3439-face]
tool = "endmill-carbide-3fl-1-2"
holder = "R8 collet"
report = "cad/process/dechatter/2026-11-23-pm30mv-em-half-carbide-1018-issue3439-v1.html"
results = "cad/process/dechatter/2026-11-23-pm30mv-em-half-carbide-1018-issue3439-v1-results.json"
stickout_mm = 28.448
stickout_min_mm = 27.94
report_setup_stickout_mm = 28.448
stickout_parameter = "half_mill_projection_mm"
direction = "conventional"
axial_doc_max_mm = 1.27
radial_woc_max_mm = 6.4
speed_in_cut_rpm = [2420, 2490]
speed_no_load_rpm = [2450, 2490]
cite = ["Owner (Pedro) 2026-11-22: \"stickout is recorded as 30mm but is actually 27.94\""]

