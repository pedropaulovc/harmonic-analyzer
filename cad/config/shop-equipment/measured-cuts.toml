# The envelope each measured cutting setting is valid inside. The record key is
# the prechips setting's key in cad/process/shop/ (which carries its speed and
# chip load, once); these are the facts prechips has no field for: it refuses
# any other key on a setting record (pedropaulovc/prechips#586). A dechatter
# result holds for one tool assembly (cutter, holder, stick-out) and only as
# deep and as wide as the passes that were cut, so a plan operation naming one
# of these settings must pin the assembly's stick-out in the plan parameter
# named here and declare each cut (milling_cuts) no deeper and no wider than
# the limits: cad/scripts/_measured_cuts.py, test_measured_cuts.py.
#
# stickout_mm is the owner's own figure for the assembly that made the cuts.
# report_setup_stickout_mm is what the report's setup field reads, where the
# two differ: the reports are the owner's recorded data and are not edited.
# A plan may pin any stick-out from stickout_min_mm to stickout_max_mm (each
# stickout_mm where the record does not give it); the reason a record allows
# a stick-out it was not cut at is beside the record.
# direction is the reports' setup: every pass was conventional. No plan field
# states a cut's direction, so it is recorded here and not checked: a zigzag
# face climbs on every other pass, and that half is not measured.
#
# The mill's spindle is set by hand, and the speed a report prints is the one
# it asked for. The speed the spindle ran is in the session's results file
# (results: every round's results.json as dechatter wrote it; spindle_hz × 60),
# and it is the one that counts. Where a record carries speed_in_cut_rpm, that
# is the band of heard speeds its limit holds in, with chatter heard on both
# sides of it; speed_no_load_rpm is what to set before the cutter enters (the
# spindle slows in a wide cut).
#
# The travelers set this cutter 28.45 mm (1.12 in) out. Owner (Pedro)
# 2026-11-24, asked "the session's setup stick-out reads 28.448 mm against the
# 27.94 the plans pin; which should the travelers print?": "28.45".

# dechatter 0.4.0 report v5, 2026-11-22: 1.27 mm deep only. 2370 rpm was
# stable at 3.0, 3.2 and 3.4 mm wide; 3.4 mm was the widest cut made. Those
# passes ran at 2376-2379 rpm as heard; the next session heard 3.4 mm chatter
# at 2272, one step of the dial below, and cut wider (the record after this
# one, which new plans use).
# Stick-out: cut at the owner's 27.94 mm. 28.45 is allowed by his ruling of
# 2026-11-24. The next session, at 28.448 mm, cut this depth stable 4.6 mm
# wide at 2377 rpm as heard, this record's speed, and 3.4 mm wide at 2477.
[measured_cuts.em-half-carbide-1018-v5-face]
tool = "endmill-carbide-3fl-1-2"
holder = "R8 collet"
report = "cad/process/dechatter/2026-11-22-pm30mv-em-half-carbide-1018-v5.html"
results = "cad/process/dechatter/2026-11-22-pm30mv-em-half-carbide-1018-v5-results.json"
stickout_mm = 27.94
stickout_max_mm = 28.45
report_setup_stickout_mm = 30.0
stickout_parameter = "half_mill_projection_mm"
direction = "conventional"
axial_doc_max_mm = 1.27
radial_woc_max_mm = 3.4
cite = ["Owner (Pedro) 2026-11-22: \"stickout is recorded as 30mm but is actually 27.94\"", "Owner (Pedro) 2026-11-24, asked which of the session's 28.448 mm and the plans' 27.94 the travelers should print: \"28.45\""]

