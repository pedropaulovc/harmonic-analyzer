# The envelope each measured cutting setting is valid inside. The record key is
# the prechips setting's key in cad/process/shop/ (which carries its speed and
# chip load, once); these are the facts prechips has no field for: it refuses
# any other key on a setting record (pedropaulovc/prechips#586). A dechatter
# result holds only as deep and as wide as the passes that were cut, so a plan
# operation naming one of these settings must declare each cut (milling_cuts)
# no deeper and no wider than the limits: cad/scripts/_measured_cuts.py,
# test_measured_cuts.py.
#
# One record set per cutter (owner ruling 2026-11-25, in measured_cutters'
# cite): a cutter's records hold at every stick-out in its measured_cutters
# band, from the shortest to the longest stick-out the plans use for it. A
# plan operation naming one of them pins each of the cutter's
# stickout_parameters it defines inside that band, and a plan cutting a side
# or end cut with the cutter, in its records' material, at a stick-out inside
# the band names a record for the cut (full-width slots and plunges excepted:
# no record is a slot). stickout_mm is the owner's own figure for the assembly
# that made a record's cuts; report_setup_stickout_mm is what the report's
# setup field reads, where the two differ: the reports are the owner's
# recorded data and are not edited.
# direction is the session's setup. No plan field states a cut's direction,
# so it is recorded here and not checked: a plan picks the record whose
# direction matches its cut, and a zigzag face climbs on every other pass.
# The first part of each program is a supervised run, hand on the feed
# override, adjusted by ear (the same ruling); a session is for a cut that
# chatters on a part.
#
# The mill's spindle is set by hand, and the speed a report prints is the one
# it asked for. The speed the spindle ran is in the session's results file
# (results: every round's results.json as dechatter wrote it; spindle_hz × 60),
# and it is the one that counts. Where a record carries speed_in_cut_rpm, that
# is the band of heard speeds its limit holds in, with chatter heard on both
# sides of it; speed_no_load_rpm is what to set before the cutter enters (the
# spindle slows in a wide cut).

# The 1/2 in carbide end mill in its R8 collet. Owner (Pedro) 2026-11-25, on
# the stick-out each session was cut at: "I can not believe that 2 mm [of
# stick-out] makes any significant difference. This whole exercise is going
# way above and beyond what even professional CNC machinists do. I will never
# actually make a part if I keep having to trial every single combination of
# parameters." Ruled with it: the cutter's measured records hold from the
# shortest to the longest stick-out the plans use for it; a shorter stick-out
# than a session's is only stiffer.
# Shortest: its flute length plus 10 % (owner ruling 2026-11-25 on #3386,
# "min stickout based on flute length then add 10pct on top of it"): 25.4 ×
# 1.1 = 27.94 mm, which v5 and v6 were cut at. Longest: the column clamp's
# bore, 31.75 mm (1.25 in) out so the collet clears its 1-2-3 block
# (sh_column_clamp bore_mill_projection_min_mm). The sessions sit inside:
# 27.94 (v5, v6), 28.45 (#3439), 28.52 (#3427), 29.13 (#3627). Outside it no
# record holds, so those cuts stay on the chart setting, run supervised: the
# amplitude bar's 50.8 mm (2 in, #3384) and the magnifying bracket's neck,
# 46.99-50.8 mm out to reach past its foot. A plan pins the stick-out in one
# of stickout_parameters; a setup runs at the ones it names (its envelope's
# tool lengths, its touch-off text), or at every one the plan pins where it
# names none.
[measured_cutters.endmill-carbide-3fl-1-2]
holder = "R8 collet"
stickout_min_mm = 27.94
stickout_max_mm = 31.75
stickout_parameters = ["half_mill_projection_mm", "half_mill_projection_min_mm", "bore_mill_projection_min_mm", "neck_mill_projection_min_mm"]
cite = ["Owner (Pedro) 2026-11-25: \"I can not believe that 2 mm [of stick-out] makes any significant difference. This whole exercise is going way above and beyond what even professional CNC machinists do. I will never actually make a part if I keep having to trial every single combination of parameters.\"", "Owner (Pedro) 2026-11-25 on #3386: \"min stickout based on flute length then add 10pct on top of it\""]

