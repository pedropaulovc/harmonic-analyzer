# The MHA-DT-11 drive-pin jig (owner ruling 2026-11-22: the holes on the
# lathe, option C2; sketch sketches/turnmill-a-crankshaft-lathe-jig.png). The
# shaft lies in the jig parallel to the spindle on the cross slide; the
# cutters turn in the headstock; the cross-slide DRO steps the two holes
# ±7.000 mm from the stub's axis, which a DTI swept round the stub from the
# spindle sets as X0.
[fixtures.dt-crankshaft-drive-pin-jig]
name = "MHA-DT-11 drive-pin jig: 1 in 1018 bar, Ø.750 shank, .4385 bore reamed in place"
kind = "fixture"
status = "to_make"
supply = "shop_made"
purchase = "Make from the 1 in 1018 CF bar on hand (stock.1018-round-1), 4.75 in long: turn 2.00 in of one end to Ø.750 for the AXA No. 4 heavy-duty boring holder (tools.qctp-axa-lms-2280), face both ends square, and drill 3/8 from the shank's end 1.90 deep (the pinion seat's clearance). On the mill: drill #21 and tap 10-32 radially into the Ø1.0 head 1.25 in from its front face, .50 deep. Its .4385 bore is not made here: the dt_crankshaft traveler bores it in place on the lathe, the jig in the No. 4 holder on the tool post, each cutter in the 3-jaw and the carriage feeding the jig (centre drill, 27/64 drill, the .4385 reamer 2.95 deep into the 3/8 hole), so the bore lies on the spindle axis and along the carriage travel by construction. The holder stays on the tool post until the crankshaft's holes are done."
note = "Workholding for the MHA-DT-11 drive-pin holes (dt_crankshaft plan). The crankshaft goes in far end first: its two Ø.4375 journals (.4367-.4375) and the Ø.375 inboard neck in the .4385 bore (owner ruling 2026-11-23, tool audit Q11), the Ø.3125 pinion seat in the 3/8 hole; a 10-32 set screw on a brass pad bears down on the Ø.41 relief and seats both journals on the bore's bottom; a 1/8 in spacer between the spigot's rear face and the jig face while clamping, then withdrawn, leaves the gap the #54 knockouts break into."

