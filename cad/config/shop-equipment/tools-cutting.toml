# Screw-slotting saw for the MHA-DT-12 (dt-cylinder-gear) alignment notch, x20
# (#2364). The sheet prints the kerf .016 MAX: wider, it cuts the flanks of the
# two teeth beside it (dt_cylinder_gear_spec.NOTCH_WIDTH). The 1/32 in saw the
# archived inventory listed (45952b66bc tools.slitting-saws) cuts both flanks
# up to r 31.76, past the 31.75 pitch circle, and through the T120 cone mesh's
# lowest contact near r 31.34. The .014 blade leaves .002 under the MAX for
# arbor runout. Its 1 in hole goes on the owned R8 stepped saw arbor
# (tools.saw-arbor-r8-stepped, owner 2026-11-24: its steps take 1 in bores),
