# Screw-slotting saw for the MHA-DT-12 (dt-cylinder-gear) alignment notch, x20
# (#2364). The sheet prints the kerf .016 MAX: wider, it cuts the flanks of the
# two teeth beside it (dt_cylinder_gear_spec.NOTCH_WIDTH). The 1/32 in saw the
# archived inventory listed (45952b66bc tools.slitting-saws) cuts both flanks
# up to r 31.76, past the 31.75 pitch circle, and through the T120 cone mesh's
# lowest contact near r 31.34. The .014 blade leaves .002 under the MAX for
# arbor runout. Its 1 in hole fits the R8 one-inch-pilot saw arbor in that
# archived record, so no arbor is bought; that arbor's ownership and its 45 mm
# nut diameter are the archived record's #1413 trial placeholders, not shop
# facts: if no 1 in arbor is on the shelf, one is bought with the saw. Reach:
# blade radius 1.375 in = 34.9 mm against the notch's .12 depth; the arbor
# sits 64.1 mm off the gear axis, 9.4 mm above the tips at a 45 mm nut.
[tools.cylinder-notch-saw]
name = "TTC 10-215-014 HSS screw-slotting saw, 2-3/4 x .014 x 1 in hole, 72 teeth"
kind = "slitting_saw"
make = "TTC"
sku = "10-215-014"
source = "https://www.travers.com/product/ttc-10-215-014-slotting-saw-10-215-014"
purchase = "Travers 10-215-014, $24.28 each, 107 in stock (Travers listing read live 2026-11-10)"
status = "to_order"
note = "Not owned: to buy. MHA-DT-12 alignment notch, .016 MAX x .12 deep, one per gear."
dia_in = 2.75
thickness_in = 0.014
bore_in = 1.0
teeth = 72

# Engraving bit for every MHA-MS-01 (ms-stick) graduation and numeral (#2433):
# a 30-degree included V cuts the printed .016 MIN / .024 MAX tick at its face
# plunged .021-.033 deep (.020 MIN deep, .080 MIN stock under at the .120
# thinnest bar), and the .016 MIN-deep numerals. Its cutting setting is
# cad/process/shop/ settings.ms-stick-engrave-brass. Graduation stations
# are dialled on the X DRO (dro.pm-30mv, .0002 in): its readings are the
# record of the sheet's +/-.002 stations, finer than any loupe check. Note 3
# leaves the numeral font to the shop: a single-stroke font of straight
# horizontal and vertical strokes cuts each stroke with one handwheel.
[tools.ms-stick-engraver]
name = "2L Profiler P-125x2.0-30-.005-S, 30 deg included V, .005 in tip, solid carbide, soft-materials (brass) grade"
kind = "engraving_bit"
make = "2L Inc."
sku = "P-125x2.0-30-.005-S"
source = "https://www.2linc.com/product/profiler-engraving-tools/"
purchase = "2L P-125x2.0-30-.005-S, $18.40 each (2L listing read live 2026-11-11); buy two, a broken tip stops the job"
status = "to_order"
note = "Not owned: to buy. MHA-MS-01 graduations (101 ticks) and numerals 0-10."
included_angle_deg = 30.0
