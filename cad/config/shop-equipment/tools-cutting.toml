# The owner's two stepped saw arbors (photo above): an R8-shank one with a cap
# and flat-head screw, and a 1/2 in straight-shank one with a cap. Owner
# 2026-11-24, verbatim: "the bottom arbor has 0.5 in shank and both are
# designed for saws with bores of 1 7/8 3/4 5/8 1/2 ; they are not keyed";
# "caps are 1/2 in each ; both arbors steps are spring loaded so they fit 1 in
# bores"; "1/2 thickness 1.25 dia"; "screw are standdard hex countersunk 0.635
# len; 0.623 dia". So: the saw centres on the spring-loaded stepped pilot
# (the step its hole fits; the pilot slides back as the cap clamps), seats
# against the body's shoulder, and is clamped by the cap (1.25 in across,
# .50 in thick) and its countersunk hex-socket screw on the side away from
# the spindle. The screw: .635 long, head .623 across, and the owner's thread
# gauge "says 1 . 25" (2026-11-24): read as a 1.25 mm pitch, so M8 x 1.25
# (the agent's reading: a .623 = 15.82 mm head is inside DIN 7991's M8 head,
# 15.57-16.00 mm, Fuller Fasteners "DIN 7991 Specifications", read
# 2026-11-24; .635 = 16.1 mm overall, an M8 x 16; its key 5 mm by that
# standard, not read by him). Clamp torque 20 N·m (about 15 ft·lbf): under
# the 23 N·m Engineers Edge gives for an M8 class 8.8 ISO countersunk
# hex-socket screw at friction .14 (preload 13.2 kN; class 10.9 28.3 N·m;
# "Countersunk Screws Torque Table Metric, ISO", read 2026-11-24), so it
# holds whatever the screw's class (not read). The drive is the cap's
# friction only (not keyed): about 11 kN of preload on two faces of the saw.
# Its axial place is the shoulder and cap; its centring is a sliding fit,
# so runout is read on every mounting. Measured by the owner 2026-11-24:
# "sticks 1.4 in below spindle; 1.25 dia" (the arbor installed; its body
# above the saw 1.25 across, the same as the cap). His photo
# (owner-photos/saw-arbor-installed-1p4-2026-11-24.png) marks the 1.4 from
# the spindle nose to the cap's lower face, the arbor installed with no saw
# fitted. With a saw the cap's face drops by about the saw's thickness (the
# .064 saw: about 1.46 below the nose); the shoulder sits about .90 below
# the nose only if the cap seats on it with no saw (the spring pilot may hold
# it off: unverified). Those figures serve clearance envelopes only: a plan
# sets the saw's Z by touching off the saw itself. Not yet measured: the
# screw head's stand past the cap face (a
# countersunk head normally sits flush or under; not stated) and runout. A
# plan that rests a clearance on one of those names it as a bounded
# assumption and stops to measure it before the spindle starts. The R8 one is the
# mill's saw arbor: drawn up on the spindle taper it is stiffer and nearer
# the nose than the 1/2 in shank one in a collet (a .5 in shank is about a
# thirteenth as stiff in bending as the .95 in R8 shank, d^4, and a collet
# can slip under a saw's side load).
[tools.saw-arbor-r8-stepped]
name = "R8 stepped slitting-saw arbor, spring-loaded pilot for 1, 7/8, 3/4, 5/8, 1/2 in holes, cap and flat-head screw, not keyed"
kind = "saw_arbor"
status = "on_hand"
pieces = 1
