# The P1 is a T-type blade: widest at its top cutting edge, tapering below for
# side clearance, so its kerf is the edge's width. 1/16 in is the P1 size's
# nominal width in the makers' tables; the travelers mike the edge and preset
# the DRO to the reading. It sits in the AXA set's No. 7 parting blade holder.
[tools.cutoff-blade-p1]
name = "P1 HSS T-type cutoff blade, 1/16 in wide x 1/2 in high x 4-1/2 in long"
kind = "cutoff_blade"
status = "on_hand"
