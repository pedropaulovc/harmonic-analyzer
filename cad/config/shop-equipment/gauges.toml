# --- Bands the 2026-11-23 rulings re-cut (tool audit Q7, Q8, Q11, Q13, Q14) ---
# Same policy as the zz-pins records above: a plus single is the GO; where the
# top limit is a whole thousandth the NO-GO is the sets' minus pin. Each record
