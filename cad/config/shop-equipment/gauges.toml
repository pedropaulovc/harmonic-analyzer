# --- MHA-CH-13 rocker strap on the CNC (cad/process/ch_rocker_strap) ---------

# Hub-hole acceptance for MHA-CH-13, Ø.4000-.4005 (codjiflo PR #3049): a
# fixed-limit pair, .4000 GO and .4005 NO-GO. Vermont Gage's standard Class X
# pin/plug gages: .004-1.000 in by .0001 in, tolerance .000040 in up to
# .8250 in, GO plus and NO-GO minus, so a GO that enters proves the hole at or
# over .4000 and a NO-GO that does not proves it at or under .4005. The pair
# gives up .00008 in (16 %) of the .0005 in band; Vermont's 10 % rule would
# take class XX (.000020 in, a quoted custom gage). Range and tolerance:
# cad/process/shop.toml gauges.plug-gauges-4000-4005.
[gauges.plug-gauges-4000-4005]
name = "Plug gauge pair, .4000 GO and .4005 NO-GO, Class X"
kind = "plug_gauge_pair"
make = "Vermont Gage"
status = "to_order"
purchase = "Two Vermont Gage standard Class X steel pin/plug gages, .4000 in GO (plus tolerance) and .4005 in NO-GO (minus tolerance), each +/- .000040 in; no part number, price or stock read."
note = "Not owned: to buy. MHA-CH-13 Setup 4 (RS03, after the ream): the first hole gauged before the lot, then every hole; GO enters, NO-GO does not."
cite = ["Vermont Gage, Standard Class X pin/plug gages (read 2026-11-17): range .004-1.000 in, increments .0001 in, tolerance +/- .000040 in up to .8250 in, Go: plus tolerance, NoGo: minus tolerance: https://www.vermontgage.com/gaging-products/standard-pin-gages-and-sets/class-x-standard-pin-plug-gages", "Vermont Gage, Gage Tolerance Selection (read 2026-11-17): the 10% rule, GO at the hole's minimum with the tolerance plus, NO-GO at its maximum with the tolerance minus; ASME B89.1.5 chart, .010-.825 in: XX .000020, X .000040 in: https://vermontgage.com/support/detail/gage-tolerance-selection"]

