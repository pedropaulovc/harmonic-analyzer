# CAD-owned shop-equipment records: facts the CAD specs and their tests read,
# and workholding a process plan names, that the prechips shop schema cannot
# express. Each fact lives in exactly one
# file: anything prechips can hold (machines, chucks, measuring ranges and
# resolutions, tools' sizing data, cutting settings) is in cad/process/shop/,
# and no field here repeats one there. An object may appear in both files with
# disjoint fields (gauges.dti, gauges.pin-gauges).
#
# TOML, deliberately not YAML: a *.yaml file in cad/config joins
# _buildgraph.all_config_files() and would re-key every whole-config consumer.
# No COM build closure reads it: it is in no leaf's cache key.
#
# Records moved verbatim from cad/process/shop/inventory.toml (last at
# 45952b66bc); "#1413 placeholder" values are realistic estimates still to be
# remeasured, as they were there.

# --- measuring equipment on the mill -------------------------------------

# The PM-30MV's installed DRO; the mill's own capacity is cad/process/shop/
# machines.pm-30mv, and its scale resolution is shop/ gauges.mill-x-dro.
[dro.pm-30mv]
make = "MagXact MX-100M"
status = "on_hand"
note = "owner confirmed on hand 2026-11-19"
cite = [
  "DRO accuracy, vendor-stated: MagXact MX-100M product page (https://www.precisionmatthews.com/products/dro-mag-m-3ax-18x36x20), read 2026-10-27: \"Magnetic Scales and encoders, .0002” Accuracy\"; the X, Y and Z scales are each listed at .0002 in. Installed DRO and 0.0002 in precision confirmed by the owner 2026-10-27.",
]

# --- measuring equipment on the lathe ------------------------------------

# The PM-1127VF-LB's DRO. Owner (Pedro), answered in person 2026-11-21 (cnc
# rulings record, second ask): 5 micron. Its axes, owner 2026-11-24: the
# carriage (Z) and the cross slide (X), not the compound. So a compound move
# never shows on the DRO: a plan reads the compound on its own dial and sets
# its angle by indicator or its swivel scale, and returns it to its zero
# before trusting a DRO reading. Its make is unrecorded. Plans read the two
# axes as gauges through cad/process/shop/ gauges.lathe-z-dro and
# gauges.lathe-x-dro.
[dro.pm-1127vf-lb]
status = "on_hand"
axes = ["carriage (Z)", "cross slide (X)"]
note = "5 um (0.005 mm) resolution, owner-stated; reads the carriage and the cross slide, not the compound (owner 2026-11-24); make and scale lengths not recorded."
cite = [
  "Owner (Pedro) 2026-11-21, answered in person: \"there is a 5 micron dro but recheck part geometry ; i was not expecting such tight tolerances\"",
  "Owner (Pedro) 2026-11-24, relayed by Main, verbatim: \"dro main slide and cross sline not compound\"",
]
