# CAD-owned shop-equipment records: facts the CAD specs and their tests read,
# and workholding a process plan names, that the prechips shop schema cannot
# express. Each fact lives in exactly one
# file: anything prechips can hold (machines, chucks, measuring ranges and
# resolutions, tools' sizing data, cutting settings) is in cad/process/shop/,
# and no field here repeats one there. An object may appear in both files with
# disjoint fields (gauges.dti, gauges.pin-gauges).
#
# TOML, deliberately not YAML: a *.yaml file in cad/config joins
# _buildgraph.all_config_files() and would re-key every whole-config consumer.
# No COM build closure reads it: it is in no leaf's cache key.

# Spindle speed stops (#3439). The spindle rests only on steps of 2800/26 =
# 107.7 rpm: turning the knob, it ramps from one stop to the next and stays
# on none between. Resting speeds observed in the four dechatter sessions of
# 2026-11-22 and 2026-11-23, heard (the results files' spindle_hz x 60) or
# read off the display (spindle_rest_observed_rpm, each 0-18 rpm over a
# multiple of the step): 1511-1515, 1837-1841, 1947-1953, 2269-2282,
# 2373-2387, 2477-2488, 2582-2601, 2692, 2787-2800. Values between appear
# only while the spindle ramps. The head's display is a live tachometer, not
# the setpoint: with the spindle free it reads 3-8 rpm above the heard speed
# (spindle_display_over_heard_rpm), and in a cut it follows the spindle down.
# NOT known: the cause (the knob or the drive), and what the display reads
# at the 2477-2488 stop, which was used only on 2026-11-23 and not filmed.
# Sources: owner (Pedro) 2026-11-24, "check D:\HarmonicAnalyzer videos for
# actual speeds; 28.45"; his videos DJI_20261122173617_0018_D (v5) and
# DJI_20261122181554_0019_D (v6), read frame by frame against the sessions'
# timelines in https://github.com/pedropaulovc/harmonic-analyzer/issues/3439#issuecomment-7120803633 ;
# cad/process/dechatter/*-results.json. prechips has no field for these;
# test_measured_cuts.py checks the step against the results files.
# Spindle nose and quill collar clearance envelope (quill retracted), measured
# with digital calipers by the owner (Pedro) on 2026-11-26 while checking
# upright counterbore clearance beside tall lugs (MHA-CH-07):
# - R8 steel spindle nose cylinder OD: 1.7360 in (44.094 mm);
# - recessed quill bearing-retainer ring down to the horizontal step shoulder
#   at the top of the R8 spindle nose's milled wrench flat (taken with the
#   caliper's rear/end step-measurement faces, fixed end on the bearing ring
#   and slider step shelf on the right-hand wrench-flat shoulder above the
#   lower wrench-flat section; owner confirmed step-face usage 2026-11-26):
#   0.5510 in (13.995 mm);
# - white cast quill clamp collar OD: 4.2415 in (107.734 mm; the front
#   depth-scale bracket boss stands proud of this round);
# - main sheet-metal head housing underside to R8 spindle nose bottom face
#   (caliper step faces): 1.9995 in (50.787 mm).
# Photos: research/shop-evidence/2026-11-26/pm30mv-*.jpg. prechips has no
# spindle-nose or quill-collar geometry fields.
[machines.pm-30mv]
kind = "mill"
status = "on_hand"
spindle_speed_step_rpm = 107.7
spindle_speed_steps = 26
spindle_rest_observed_rpm = [[1511, 1515], [1837, 1841], [1947, 1953], [2269, 2282], [2373, 2387], [2477, 2488], [2582, 2601], [2692, 2692], [2787, 2800]]
spindle_display_over_heard_rpm = [3, 8]
spindle_nose_od_in = 1.7360
spindle_wrench_flat_shoulder_below_quill_ring_in = 0.5510
quill_collar_od_in = 4.2415
spindle_below_head_housing_in = 1.9995
cite = [
  "Owner (Pedro) 2026-11-24, \"check D:\\HarmonicAnalyzer videos for actual speeds; 28.45\"; videos DJI_20261122173617_0018_D (v5) and DJI_20261122181554_0019_D (v6), https://github.com/pedropaulovc/harmonic-analyzer/issues/3439#issuecomment-7120803633 ; cad/process/dechatter/*-results.json",
  "Owner (Pedro) 2026-11-26 caliper photos research/shop-evidence/2026-11-26/pm30mv-spindle-nose-od.jpg (1.7360 in OD), research/shop-evidence/2026-11-26/pm30mv-spindle-below-collar.jpg (0.5510 in step-face reading from recessed bearing-retainer ring to top shoulder of spindle wrench flat; step-face usage confirmed by owner 2026-11-26), research/shop-evidence/2026-11-26/pm30mv-quill-collar-od.jpg (4.2415 in OD), and research/shop-evidence/2026-11-26/pm30mv-spindle-below-head.jpg (1.9995 in step-face reading from head housing underside to spindle nose bottom face)",
]
note = "Ownership, discrete spindle-speed stops (#3439), and measured spindle-nose / quill-collar clearance envelope (2026-11-26); capacity and travel stay in cad/process/shop/common.toml, same key. Explicit on_hand preserves the pre-split ASSEMBLY.md OWNED, which read a shop.toml record with no present key as owned."

# The BS-0 semi-universal dividing head (installed on the PM-30MV, #465; its
# indexing facts for prechips are cad/process/shop/common.toml machines.bs-0,
# same key). Accessories on hand, owner 2026-11-24, verbatim: "has
# tailstock, dead center flange plate 3 jaw chuck all 3 plates etc" and
# "everything in manual is accounted": every item of the manual's BS-0
# enclosure list (its items marked "only BS-2" excluded) is on hand: the
# fixed tailstock, the carrier (driving dog), the centres for head and
# tailstock, the direct indexing plate with 24 notches, indirect plates A, B
# and C, the flange plate, the test certificate, the operating instructions
# and the indirect dividing table; plus the 3-jaw chuck he named
# (shop workholding.chuck-3jaw-5-bs0). The sector arms are part of the head.
# Maker figures, not measured (the head's manual, "Semi-Universal
# Dividing Head", pages photographed by the owner; p01-p02 committed as
# research/shop-evidence/2026-11-24/, read 2026-11-24): worm ratio 1:40; plates A 15-20, B 21, 23,
# 27, 29, 31, 33, C 37, 39, 41, 43, 47, 49; spindle thread BS-0 1-1/2"-8 TPI;
# centre taper B&S No. 7; spindle hole 18 mm; centre height (h) 100 mm;
# differential indexing and spiral milling only on the BS-2.
[machines.bs-0]
kind = "dividing_head"
status = "on_hand"
accessories_on_hand = ["fixed tailstock", "carrier (driving dog)", "centres for head and tailstock", "direct indexing plate, 24 notches", "index plate A", "index plate B", "index plate C", "flange plate", "3-jaw chuck", "test certificate", "operating instructions", "indirect dividing table"]
spindle_thread = "1-1/2-8"
centre_taper = "B&S No. 7"
spindle_hole_mm = 18.0
centre_height_mm = 100.0
differential_indexing = false
cite = [
  "Owner (Pedro) 2026-11-24, relayed by Main, verbatim: \"has tailstock, dead center flange plate 3 jaw chuck all 3 plates etc\"; \"everything in manual is accounted\"",
  "BS-0 manual, Semi-Universal Dividing Head, ENCLOSURE and table \"Semi-Universal Index B&S Type No.0 No.1\": BS-0 h 100 mm, taper of center B&S No.7, diameter of spindle hole 18 mm; THREAD SPINDLE: BS-0 1-1/2\" -8TPI; worm gear ratio 1:40; plates A 15,16,17,18,19,20 B 21,23,27,29,31,33 C 37,39,41,43,47,49; differential and spiral milling (only BS-2); owner photos research/shop-evidence/2026-11-24/bs0-manual-p01.jpg and bs0-manual-p02.jpg, read 2026-11-24",
]
note = "On hand with every item of the manual's BS-0 enclosure list and the 3-jaw chuck (owner 2026-11-24); sector arms are part of the head. Simple and direct indexing only (no differential on the BS-0)."

# Tailstock taper MT3: owner (Pedro), answered in person 2026-11-21 (cnc
# rulings record), "Lathe tailstock taper: MT3; the mill tap-guide dead centre
# fits" (tools.dead-centre-mt3); the lathe's manual agrees ("Taper in
# Tailstock Spindle .... MT3", PM-1127VF-LB Operator's Manual 2015,
# specifications, read 2026-11-21). prechips has no field for it.
[machines.pm-1127vf-lb]
kind = "lathe"
status = "on_hand"
tailstock_taper = "MT3"
# The maker's product page, specifications table (Precision Matthews
# PM-1127VF-LB; read 2026-11-23 from its Wayback copy of 2019-12-31, the live
# page now 404): "Spindle Bore 1-1/2″", "Longitudinal Feeds .0025-.012 IPR",
# "Cross Feeds .001-.0056 IPR". prechips has no field for them. The bore is
# the spindle's, and it, not the 4-jaw's 1-3/4 in through-bore
# (fixtures.chuck-4jaw-6), limits bar through the headstock.
spindle_bore_in = 1.5
longitudinal_feed_in_rev = [0.0025, 0.012]
cross_feed_in_rev = [0.001, 0.0056]
# Bar behind the chuck (#3424; fleet rule, Main 2026-11-22). The change-gear
# cover has a hole at the spindle's rear (owner, 2026-11-22), so bar CAN pass
# out the back; what the spindle supports is only the length up to its rear
# end. Bar must end inside the spindle unless the traveler declares an
# outboard support. The maker does not publish the length from the jaw fronts
# to the spindle's rear end: the product page (the Wayback copy above, its
# specifications table) and the PM-1127VF-LB Operator's Manual 2015
# ("Features", p. 5: "Hole Through Spindle ... 1.5"", "Overall Dimension of
# the lathe ... Length 55" x Width 27.5" x Height 26.5"") give the bore and
# the machine's size only; read 2026-11-22. The owner measured it on the
# machine, verbatim (2026-11-24, cnc rulings record): "jaw fronts to the rear
# of the spindle 17in". He did not say which chuck was on.
# bar_behind_jaw_fronts_max_in is the most bar, grip included, a traveler may
# put behind the jaw fronts without an outboard support: the measured 17 in
# less bar_behind_margin_in. The 1.0 in margin covers the tape reading (a
# whole-inch figure, so up to 1/2 in of rounding), a hand-scribed, hacksawn
# piece running long (about 1/8 in), and the other chuck's jaw fronts sitting
# nearer the spindle than the one he measured (not stated which; the 3-jaw
# and the 160 mm 4-jaw differ in body length); with it the bar's end stays
# inside the spindle whichever chuck is on. A traveler that loads longer bar
# saws it to a working length first or declares its outboard support.
jaw_fronts_to_spindle_rear_in = 17.0
bar_behind_margin_in = 1.0
bar_behind_jaw_fronts_max_in = 16.0
cite = [
  "Precision Matthews, PM-1127VF-LB product page, specifications (Wayback 2019-12-31, read 2026-11-23): Spindle Bore 1-1/2 in; Longitudinal Feeds .0025-.012 IPR; Cross Feeds .001-.0056 IPR: http://web.archive.org/web/20191231175250/http://www.precisionmatthews.com/shop/pm-1127vf-lb/",
  "PM-1127VF-LB Operator's Manual 2015, Features p. 5 and Physical Features p. 6, read 2026-11-22 (https://archive.org/download/pm-1440-gs-v-3-2020-10/Precision%20Matthews/PM-1127VF-LB-Manual-2015.pdf): \"Hole Through Spindle ... 1.5\", (38mm)\"; \"Overall Dimension of the lathe ... Length 55\" x Width 27.5\" x Height 26.5\"\"; no spindle or headstock length is given",
  "Owner (Pedro) 2026-11-22, relayed by Main: the change-gear cover has a hole at the spindle's rear, so bar can pass out the back",
  "Owner (Pedro) 2026-11-24, measured, verbatim (cnc rulings record, C:/farm-runs/triage-2026-11-19/cnc/rulings.md): \"jaw fronts to the rear of the spindle 17in\"",
]
note = "Ownership, the tailstock taper, the spindle bore, the power-feed ranges and the supported bar length behind the chuck (jaw_fronts_to_spindle_rear_in measured 17 in by the owner 2026-11-24; bar_behind_jaw_fronts_max_in is that less bar_behind_margin_in: bar ends inside the spindle unless an outboard support is declared); its other facts are cad/process/shop/, same key. Explicit on_hand preserves the pre-split ASSEMBLY.md OWNED, which read a shop.toml record with no present key as owned."
