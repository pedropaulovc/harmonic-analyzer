# CAD-owned shop-equipment records: facts the CAD specs and their tests read,
# and workholding a process plan names, that the prechips shop schema cannot
# express. Each fact lives in exactly one
# file: anything prechips can hold (machines, chucks, measuring ranges and
# resolutions, tools' sizing data, cutting settings) is in cad/process/shop/,
# and no field here repeats one there. An object may appear in both files with
# disjoint fields (gauges.dti, gauges.pin-gauges).
#
# TOML, deliberately not YAML: a *.yaml file in cad/config joins
# _buildgraph.all_config_files() and would re-key every whole-config consumer.
# No COM build closure reads it: it is in no leaf's cache key.
#
# Records moved verbatim from cad/process/shop/inventory.toml (last at
# 45952b66bc); "#1413 placeholder" values are realistic estimates still to be
# remeasured, as they were there.

# --- measuring equipment on the mill -------------------------------------

# The PM-30MV's CNC conversion; the mill's capacity stays cad/process/shop/
# machines.pm-30mv (prechips has no control or repeatability field). Owner
# (Pedro) 2026-11-16, relayed by Main: "the PM-30MV is CNC-converted and runs
# GRBL with ballscrews on X/Y. Positioning repeatability is ±0.02 mm" (owner
# value).
[cnc.pm-30mv]
control = "GRBL"
drive = "ballscrews on X and Y"
repeatability_mm = 0.02
status = "on_hand"
note = "owner confirmed on hand 2026-11-19"
cite = [
  "Owner (Pedro) 2026-11-16, relayed by Main: PM-30MV CNC-converted, GRBL, ballscrews on X/Y; positioning repeatability ±0.02 mm (owner value).",
]

# PM-30MV controller, sender and tool-length and probing kit. Owner (Pedro)
# 2026-11-16, relayed by Main: the controller's FluidNC
# config. Firmware and sender commits as read for the tool-change design:
# FluidNC v3.7.8 = bdring/FluidNC bc5f3e936a9b4f2c29f0d4b9099d4dcdfffcdc5d,
# CNCjs v1.11.5 = cncjs/cncjs b56f643a1f178978ba4d416f508ed26ea1db5008.
[cnc.pm-30mv-controller]
firmware = "FluidNC v3.7.8"
board = "generic ESP32 (config board: None), CP210x USB"
homing = "switches on all three axes"
# The hand-tap files' G53 G0 Z0 retract (cad/process/*/cam.py
# MACHINE_Z_TOP_MM) rests on this; the owner confirmed it 2026-11-21.
z_machine_zero = "top of Z travel after homing"
probe_pin = "gpio.5:high:pd, nothing wired (2026-11-16); gpio.5:low:pu once the touch probe is wired"
toolsetter_pin = "gpio.21:low:pu, the tool setter"
sender = "CNCjs 1.11.5, Manual Tool Change (Custom Probing)"
status = "on_hand"
note = "FluidNC 3.7.8 has no manual tool change of its own (atc_manual arrives in 3.8), no expressions, variables or flow control, and no canned cycles (GCode.cpp 'Not supported'); CNCjs expands M6 and FreeCAD's post translates drill cycles to G0/G1. Owner confirmed on hand 2026-11-19."
cite = [
  "Owner (Pedro) 2026-11-16, relayed by Main: FluidNC config (board, homing, probe and toolsetter pins), CNCjs 1.11.5.",
  "FluidNC v3.7.8 source: Probe.cpp tripped() ORs the probe and toolsetter pins; MotionControl.cpp mc_probe_cycle alarms ProbeFailInitial on a tripped start; GCode.cpp G10 L20 = MPos - G92 - TLO - value, saved to NVS (Settings.cpp Coordinates::set).",
  "Owner (Pedro) 2026-11-21, answered in person (cnc rulings record), asked whether machine Z = 0 is the top of travel after homing: \"yes\".",
]

# The least air between a cutter and a vise jaw or clamp it passes over: the
# programmed point (the tool's lowest: an end mill's end, a drill's or chamfer
# mill's point) at least this far above the declared jaw/clamp keep-out box's
# top, on every move whose cutter reaches over the box. _gcode.check_keep_out
# enforces it through cam_nc.verify; a recipe may raise it for a keep_out
# check, never lower it. It covers a tool-setter or touch-off error, a part
# not fully down on its parallels and a chip under it. Census of the posted
# NC on main (issue #3607): 22 of 46 recipes pass a cutter over a jaw, least
# 0.521 mm; at 1.0 three were under it. The floor is D32, a delegated ruling
# 2026-11-25 (Main) with no precedent: the owner reviews it first on #2144
# (cad/docs/drawing-simplicity-policy.md, "Named exceptions"), posted there at
# issuecomment-7171575340 and corrected at issuecomment-7171657471.
[cnc.jaw-clearance]
jaw_clearance_min_mm = 1.0
cite = [
  "D32, delegated ruling 2026-11-25 (Main), no precedent: a 1.0 mm (.040 in) floor between any cutter and a declared jaw/clamp box, an HA fact in cad/config/shop-equipment; issue #3607. The owner reviews it on #2144 (cad/docs/drawing-simplicity-policy.md, \"Named exceptions\"): https://github.com/pedropaulovc/harmonic-analyzer/issues/2144#issuecomment-7171575340, corrected at https://github.com/pedropaulovc/harmonic-analyzer/issues/2144#issuecomment-7171657471.",
]

# A machine reamer cuts its full diameter only above its 45° end chamfer, so
# a reamed through hole is full size at its far face only when the programmed
# tip passes that face by more than the chamfer's axial length plus
# past_margin_mm (a touch-off error, a part not fully down, the chamfer's
# own tolerance). Each recipe that reams a through hole checks it through
# cam_nc.ream_full_diameter_past_min_mm. The rule and its 0.25 mm margin
# are a delegated ruling 2026-11-26 (Main), no precedent; owner review #2144.
# chamfer_length_mm is keyed by the cad/process/shop/ tool record. No vendor
# of a bought SKU publishes it (McMaster, Shars, Zoro, Alvord-Polk and the
# ASME B94.2 tables read 2026-11-26 give the 45° angle only). The values are
# W.C. Chapman's same-size miniature chucking reamers (RSB series), whose
# catalogue lists each chamfer length. .4000, .4385 and .4990 are past that
# catalogue's range: they take its ratio (chamfer about 0.08 D), rounded up
# to the next .0001 in. Measure each on receipt (ESTIMATE in its cite).
[cnc.ream-full-diameter]
past_margin_mm = 0.25
chamfer_length_mm = { "reamer-0775" = 0.1778, "reamer-0930" = 0.21336, "reamer-1260" = 0.28702, "reamer-2510" = 0.51054, "reamer-4000" = 0.81534, "reamer-4385" = 0.89408, "reamer-4990" = 1.016 }
cite = [
  "Delegated ruling 2026-11-26 (Main), no precedent; owner review #2144: the tip passes a through hole's far face by more than the reamer's recorded chamfer + 0.25 mm.",
  "W.C. Chapman, Miniature Reamers, complete size list (https://shop.wcchapman.com/holemaking-threading/available-sizes/miniature-reamers/), read 2026-11-26, column \"Chamfer Length\": RSB0775 0.0775\" 0.0070\"; RSB0930 0.0930\" 0.0084\"; RSB1260 0.1260\" 0.0113\"; RSB2510 0.2510\" 0.0201\"; largest listed RSB3760 0.3760\" 0.0301\".",
  "ESTIMATE, measure on receipt: reamer-4000 .0321 in, reamer-4385 .0352 in, reamer-4990 .0400 in, each 0.08005 D (W.C. Chapman's ratio, .0301/.3760) rounded up to the next .0001 in, as no maker lists these sizes' chamfer.",
  "45° chamfer: MSC reamer buying guide (https://www.mscdirect.com/resources/buying-guides/reamers), \"45° chamfer angle for smooth entry into existing holes\"; ICS catalogue p.188 (https://www.icscuttingtools.com/catalog/page_188.pdf), \"The cutting edge is ground with a 45° chamfer angle for easy hole entry.\"",
]
