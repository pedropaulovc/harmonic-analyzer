# CAD-owned shop-equipment records: facts the CAD specs and their tests read,
# and workholding a process plan names, that the prechips shop schema cannot
# express. Each fact lives in exactly one
# file: anything prechips can hold (machines, chucks, measuring ranges and
# resolutions, tools' sizing data, cutting settings) is in cad/process/shop.toml,
# and no field here repeats one there. An object may appear in both files with
# disjoint fields (gauges.dti, gauges.pin-gauges).
#
# TOML, deliberately not YAML: a *.yaml file in cad/config joins
# _buildgraph.all_config_files() and would re-key every whole-config consumer.
# No COM build closure reads it: it is in no leaf's cache key.
#
# Records moved verbatim from cad/process/shop/inventory.toml (last at
# 45952b66bc); "#1413 placeholder" values are realistic estimates still to be
# remeasured, as they were there.

# --- assembly tools, gauges and consumables (#2392) ------------------------

# Every tool the machine's assembly sheets name has one record, so the release's
# ASSEMBLY.md tool list (cad/scripts/ha_assembly_package.py TOOLS) marks it
# OWNED, TO BUY or TO MAKE from here. Records marked "archived inventory" carry
# identity fields moved from cad/process/shop/inventory.toml at 45952b66bc.
# They are owned only where that inventory recorded possession: the gauges of
# the shop's first inventory, the parallels it sourced by photo and LMS
# package, the bench and hand tools Pedro listed as kept
# (2026-10-15, #1550), and the Loctite 638 of his adhesive rulings. A tool it
# recorded only as approved to buy, as a trial assumption or as an
# illustrative example is status = "to_order", as is every new record: nothing
# recorded the shop owning it, so it is to buy (or to record, if the shop has
# one). No vendor or SKU is asserted for a tool to buy.

