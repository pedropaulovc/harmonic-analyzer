# Materials & display palette.
#
# `material` = the SolidWorks material applied (mass properties + default
# appearance). `palette` = photo-sampled display-colour overrides applied at
# body scope AFTER the material (SolidWorks quantises to 8 bit/channel; compare
# readback with 1/255 tolerance). RGB are 0..1 linear, sampled from the ch30
# studio plates. See _common.apply_material / apply_color.
units: mm

palette:                              # name: [r, g, b]
  casting_green:  [0.03, 0.45, 0.38]  # cast-iron frame parts (studio green;
  # re-sampled 2026-07-08 from ch30 p002/p009 + ch17/ch18 medians — the old
  # 0.13 red channel washed the paint into pastel teal; the plates read
  # R≈0.05·G, B≈0.85·G)
  polished_steel: [0.65, 0.64, 0.63]  # frame columns
  panel_black:    [0.08, 0.08, 0.09]  # platen board / clips / knife hardware
  spring_black:   [0.12, 0.12, 0.13]  # blued spring wire
  stained_oak:    [0.16, 0.10, 0.07]  # crank handle (dark-stained wood)
  paper_white:    [0.92, 0.92, 0.88]  # platen paper sheet
  bar_steel:      [0.42, 0.41, 0.39]  # amplitude-bar curtain
  muntz_yellow:   [0.72, 0.56, 0.18]  # the 4 hard yellow cone tip gears (T006-T024);
  # ESTIMATE (golder + more saturated than the brass default) -- NOT yet ch30-sampled,
  # refine against the p.21 macro during the Phase 3 rebuild

# The four smallest cone gears (T006, T012, T018, T024 — the cone tip) read
# "slightly more yellow … a different, perhaps harder metal" (book ch.12 p.21).
# Period-accurate reading: a harder high-zinc yellow metal (Muntz metal 60/40
# Cu-Zn / manganese bronze — both more golden and markedly harder than the
# ~70/30 alpha brass of the larger gears), cut from drawn rod on a wheel-cutting
# engine and soldered to the shaft. Modeled as the muntz_yellow appearance over
# the brass material on those four configurations (applied in the Phase 3 rebuild).
cone_tip_gear_configs: [T006, T012, T018, T024]

# Parts that take the cast-iron green frame appearance (memory: M6.x green castings).
casting_green_parts:
  - arbor-pedestal
  - cone-pivot-post  # absorbed the old crank-pedestal (merged column, 2026-07-03)
  - harmonic-base
  - rocker-arm-support
  - top-frame
  - summing-lever  # ch17/ch18 macros: same green paint as the frame (2026-07-08)
  - pen-v-block    # ch24 macro: green-painted cradle over the brass mass model

# Default SolidWorks materials by part class (per-part override lives in parts.yaml).
materials:
  brass:  { sw_name: "Brass",  applies_to: "gears, pinion drum, knobs, fine fittings" }
  steel:  { sw_name: "Plain Carbon Steel", applies_to: "shafts, bars, levers, rods, springs" }
  cast_iron: { sw_name: "Cast Iron", applies_to: "frame castings (casting_green_parts)" }
  wood:   { sw_name: "Oak", applies_to: "crank handle" }
