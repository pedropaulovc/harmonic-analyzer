# The gauge geometry the rocker's profile check reads (edge, pivot pin and rod-slot
# registration) is owned by cad/scripts/ch_rocker_arm_profile_check.py, and the solids
# below are the plate's outline envelope with the pivot hole and the rod slot's pin seat
# as voids, in that module's frame (origin on the pivot-hole axis in the face laid on the
# arm, +Y toward the arcs' centre, +X toward the rod end, plate Z0..3.175). Physical
# features: 1/8 in O1 ground flat (3.175 as supplied); pivot hole reamed H7 6.500-6.515
# for the 0.2558 in Class X minus pin (gauges.vermont-class-x-2558-minus); rod slot 1.983
# +0.010/0 wide (0.001-0.017 diametral clearance on the 0.0780 in Class ZZ minus pin),
# radial to the pivot at the arm's rod-pin hole station (133.067, 8.456 BASIC), 0.75 run.
# Accepted on PROFILE (Pedro 2026-10-11): DTI stations within +/-0.03 of the nominal arcs
# about the pivot; the trammel setting is the proof of R. The same acceptance is taken
# with pins in both the pivot hole and the rod slot (#1545): the slot's 0.0780 in pin is
# one of gauges.pin-gauges and clocks the template on the arm. verify = false is an
# ASSUMED placeholder pending Pedro's measurement (authorized 2026-10-11).
