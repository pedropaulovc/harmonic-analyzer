# CAD-owned shop-equipment records: facts the CAD specs and their tests read,
# and workholding a process plan names, that the prechips shop schema cannot
# express. Each fact lives in exactly one
# file: anything prechips can hold (machines, chucks, measuring ranges and
# resolutions, tools' sizing data, cutting settings) is in cad/process/shop.toml,
# and no field here repeats one there. An object may appear in both files with
# disjoint fields (gauges.dti, gauges.pin-gauges).
#
# TOML read directly by its consumers, deliberately not YAML: a *.yaml file in
# cad/config joins _buildgraph.all_config_files() and would re-key every
# whole-config consumer.
#
# Records moved verbatim from cad/process/shop/inventory.toml (last at
# 45952b66bc); "#1413 placeholder" values are realistic estimates still to be
# remeasured, as they were there.

