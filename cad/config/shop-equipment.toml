# PM-30MV controller, sender and tool-length and probing kit. Owner (Pedro)
# 2026-11-16, relayed by Main: the controller's FluidNC
# config. Firmware and sender commits as read for the tool-change design:
# FluidNC v3.7.8 = bdring/FluidNC bc5f3e936a9b4f2c29f0d4b9099d4dcdfffcdc5d,
# CNCjs v1.11.5 = cncjs/cncjs b56f643a1f178978ba4d416f508ed26ea1db5008.
