# --- MHA-CH-13 rocker strap on the CNC (cad/process/ch_rocker_strap) ---------
# Owner-chosen route (2026-11-17, relayed by Main): a shop-made sub-plate in
# the PM vise, the blank against its fence under four low-profile edge clamps.
# The fixture is drawn as MHA-CH-13-TL-00 (drawing
# ch_rocker_strap_tl_fixture_assembly; parts TL-01 sub-plate, TL-02 hub plug,
# TL-03 hub washer, TL-VN-50 edge clamp, TL-VN-51 hub screw). The plan's
# [parameters] carry the sizes prechips reads (plate_*, fence_*,
# clamp_height_mm, hub_relief_dia_mm, bushing_*); they are not repeated here.
[fixtures.strap-sub-plate]
name = "MHA-CH-13-TL-01 rocker-strap sub-plate, 6061, 13 x 3 x .49 in, integral fence and end stop"
kind = "fixture_plate"
present = false
status = "not made: shop-made from owned stock"
purchase = "Make to drawing MHA-CH-13-TL-01 (ch_rocker_strap_tl_sub_plate) from the owned 1/2 x 6 in 6061-T6511 flat (OnlineMetals 1173, bought for the oblique trammel jig and freed, owner 2026-11-17): saw one 13 in length and mill a 3.00 in wide strip off it (the rest, about 2.8 x 13 in, stays as fixture stock). The drawing holds the interfaces the strap's setups use: .490 overall; the top (the plan's Z0) with the fence along the back edge and the end stop at the blank's left end standing .074 +/-.005 above it, so .416 of plate under Z0; under the hub hole, at X 6.000 from the stop face and Y 1.000 in front of the fence face, a counterbore .500 dia x .185 deep with a 1/4-20 tapped hole through its floor, .231 of thread (owner ruling 2026-11-17: \"Use a 1/4-20 hub screw. The .23 in of thread in the 6061 plate is accepted: the screw only snugs the strap during the outline.\"); the fence notched .17 deep at both ends (X 0-.92 and 11.08 on), where the outline cutter mills away the strip of blank under the strap's tips; four Pitbull clamp pockets with 4-40 holes along the front at the plan's clamp stations (fixtures.edge-clamps-low-profile)."
use = "MHA-CH-13 Setups 2-5: seats the 1/8 x 1-1/2 in blank for facing and the hub hole (edge clamps), and for the outline (bonded with consumables.tape-3m-vhb-5906, screwed down at the hub)"

