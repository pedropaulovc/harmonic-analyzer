number: MHA-CH-00
# channel assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the channel
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - ch vn frame side screw datum x
  - ch vn frame side screw datum y
  - ch vn frame side screw datum z
  - ch fulcrum shaft datum x
  - ch fulcrum shaft datum y
  - ch fulcrum shaft datum z
  # MHA-CH-VN-55 keeper set screws, datum-located IDENTITY beside the keeper
  # foot screws [INFERENCE: same learned side; confirm on the farm build].
  - ch vn fulcrum set screw datum x
  - ch vn fulcrum set screw datum y
  - ch vn fulcrum set screw datum z
  # The old pivot-ball mounts became ch-pivot-bracket 2026-09; same
  # datum-locate idiom and learned sides, keyed by canonical component names.
  - ch pivot bracket datum x
  - ch pivot bracket datum y
  - ch pivot bracket datum z
  - ch pivot bracket datum y @npn
  # #743 PR2: the channel's datum-located MHA-CH-VN-57 bracket hold-downs,
  # inserted IDENTITY like the brackets whose x/y/z seeds they share
  # (r743-4D: the channel build's first MISS was the washer's x; the
  # hold-downs follow it in the same datum-locate loop).
  - ch vn bracket hold down screw datum x
  - ch vn bracket hold down screw datum y
  - ch vn bracket hold down screw datum z
  # #743 PR2: the thrust washers (north and south, user 2026-10-10; MHA-CH-VN-56
  # since the owner's 2026-10-15 purchased-washer ruling), datum-located
  # IDENTITY like the pivot brackets (r743-4D flip-seed MISS on its x); both
  # share the one canonical signature.
  - ch vn rocker thrust washer datum x
  - ch vn rocker thrust washer datum y
  - ch vn rocker thrust washer datum z
  # #948 ruling R: the MHA-CH-VN-54 rocker bank spring, datum-located IDENTITY
  # beside the washer [INFERENCE: same learned side; confirm on the farm build].
  - ch vn rocker bank spring datum x
  - ch vn rocker bank spring datum y
  - ch vn rocker bank spring datum z
  # User 2026-10-10: the MHA-SH-VN-54 apex set screws, datum-located IDENTITY
  # in the bracket loop's wake [INFERENCE: same learned side as every other
  # IDENTITY datum-located channel part; confirm on the farm build].
  - sh vn arbor set screw datum x
  - sh vn arbor set screw datum y
  - sh vn arbor set screw datum z
allowed_free_stems:
  - ch-rocker-arm
  - ch-connecting-rod
  - ch-amplitude-bar
  - ch-channel-lever
  # The pressed rod-pivot pin is lock-mated to its free rod (pressed in the
  # fork tines) and reads under-constrained with it; it adds no DOF.
  - ch-rod-pivot-pin
  # The MHA-CH-11 bar pivot pin is lock-mated to its bar, so it rides the
  # bar's freed amplitude DOF and reads under-constrained with it (it adds no
  # DOF of its own; not a required family).
  - ch-bar-pivot-pin
# Rocker swing + rod follow + bar amplitude, plus the channel lever which
# must read under-constrained WITH the chain (closed by the J5 foot-on-arc
# coupling off the rocker -- a frozen lever means the coupling died).
required_free_stems:
  - ch-rocker-arm
  - ch-connecting-rod
  - ch-amplitude-bar
  - ch-channel-lever
# 3 DOF per active channel: rocker swing + connecting-rod follow +
# amplitude-bar slide.
free_dof: 0
free_dof_per_active_channel: 3
# drawing_unit: the fitter sheets, their TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in

# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for ch_channel_assembly, ignored by
#   the build.
machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "sheet 4 KEEPER PLAN VIEW, the lug inner faces 1.5946 ±.0010 and 7.1846 ±.0010 off the MHA-FR-02 line of the upper socket centres (KeeperFrontFaceZ, KeeperRearFaceZ), and step 10's statement of what those bands hold"
    finding: "lug inner faces DRO-set to ±.001 where a fit-up of the keepers to the MHA-CH-04 flats could absorb the stack (rules 4, 19)"
    reason: "owner ruling X-A (50072e913, 2026-10-18) loosened the lug centre's lateral band to ±.004 and left the inner faces at KEEPER_FITUP_LOCATION_BAND_MM ±.001 because the shaft flats need them. As stated in step 10, the lug centre's ±.004 band keeps each transferred foot hole over the MHA-FR-02 rail web with a full wall round its tap; the title-block band would put the drill wall below .059. Both bands are named on the sheet with their mates. The south band also holds the south foot .022 clear of the MHA-FR-02 front socket boss (build_fr_top_frame KEEPER_FOOT_PRINTED_BOSS_MARGINS, at the keeper's printed .65 overall, owner ruling 2026-10-28). The ±.001 pair is what ch_fulcrum_shaft_spec's .048 flat-station window and the frame's foot-to-boss stack are computed against. Replacing them with a fit-up to the flats changes those shared stacks (MHA-CH-04, MHA-FR-02), and that is left to the owner (PR #1665, decisions) (owner-accepted)"
