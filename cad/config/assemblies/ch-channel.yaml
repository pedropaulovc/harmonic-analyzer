number: MHA-CH-00
# channel assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the channel
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert: []
allowed_free_stems:
  - ch-rocker-arm
  - ch-connecting-rod
  - ch-amplitude-bar
  - ch-channel-lever
  # The MHA-SH-VN-58 pivot pins: each RodPin is lock-mated to its free rod
  # (pressed in the fork tines), each BarPin to its bar (riding the bar's freed
  # amplitude DOF); each reads under-constrained with its host and adds no DOF
  # of its own (not a required family).
  - sh-vn-pivot-pin
# Rocker swing + rod follow + bar amplitude, plus the channel lever which
# must read under-constrained WITH the chain (closed by the J5 foot-on-arc
# coupling off the rocker -- a frozen lever means the coupling died).
required_free_stems:
  - ch-rocker-arm
  - ch-connecting-rod
  - ch-amplitude-bar
  - ch-channel-lever
# 3 DOF per active channel: rocker swing + connecting-rod follow +
# amplitude-bar slide.
free_dof: 0
free_dof_per_active_channel: 3
# drawing_unit: the fitter sheets, their TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in

# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for ch_channel_assembly, ignored by
#   the build.
machinist_exceptions:
  - id: "U-MHA-SH-VN-54-in-CH-08-no-lock"
    kind: "accept"
    where: "rocker bank fit-up, step set-screws-driven: one MHA-SH-VN-54 cup-point set screw tightened down each MHA-CH-08 ear's apex tap onto its MHA-CH-05 flat; no stake, nut or threadlocker"
    finding: "MHA-SH-VN-54 set screws on the reversing pivot shaft carry no mechanical lock (rule 23, lock threaded joints exposed to operating loads)"
    reason: "Owner ruling 2026-11-20 (Pedro), #2397 (threaded-joint-retention.md ruling U-MHA-SH-VN-54-in-CH-08-no-lock), in his words \"Follow recommendations unless noted otherwise\", accepting option 2 for the CH pivot/fulcrum stakes guarding shafts pulled to change a channel part: drop the stakes on joints that must open for channel, wire or spring service and rely on the set screw on a flat. The pivot shaft comes out to change one channel part, so a stake would make that service destructive. Covers these two set screws only"
  - id: "U-MHA-CH-VN-55-no-lock"
    kind: "accept"
    where: "lever bank fit-up, step fulcrum-set-screws-driven: one MHA-CH-VN-55 cup-point set screw tightened down each MHA-CH-07 keeper's crown tap onto its MHA-CH-04 flat; no stake, nut or threadlocker"
    finding: "MHA-CH-VN-55 set screws on the reversing fulcrum shaft carry no mechanical lock (rule 23, lock threaded joints exposed to operating loads)"
    reason: "Owner ruling 2026-11-20 (Pedro), #2397 (threaded-joint-retention.md ruling U-MHA-CH-VN-55-no-lock), the same ruling as U-MHA-SH-VN-54-in-CH-08-no-lock: the fulcrum shaft comes out to change one channel part, so its set screws hold on the shaft's flats unstaked. Covers these two set screws only"
  - id: "CH-00-pin-bond"
    kind: "accept"
    where: "steps rod-pin-bonded and bar-pin-bonded and the PIN BOND note on the detail sheet: an MHA-SH-VN-58 pin that slid into its MHA-CH-03 fork or MHA-CH-01 bar ream by hand bonded with LOCTITE 641 on its trailing end only, then checked cured"
    finding: "a press that slips salvaged with retaining compound instead of renewing the part (rule 23: a slip fit is a new part)"
    reason: "Owner ruling 2026-11-24, fit audit question 3, APPROVED as recommended (option A): the .0775 holes are reamed with no band and accepted by the pin itself, and a pin that enters by hand is bonded with LOCTITE 641 instead of the bar or rod being scrapped. The largest hole bonded is the one the .079 pin of the .061-.500 set does not enter (the bar and rod travelers; delegated ruling 2026-11-24, no precedent): a .0009 gap at most, inside 641's .15 mm gap fill (sh_vn_pivot_pin_spec.BOND_GAP). 641 is the removable grade, so the pin still comes out (with heat) for channel service; the trailing-end coat keeps the compound off the running arm or lever (the audit's second pass)"
