# issue #2361): it never enters a machine assembly or BOM. Its components are
# the fixture body dt-cylinder-gear-tl-cam-fixture (MHA-DT-12-TL-01) and its
# bought hardware: the stub dowel (-TL-VN-50), the clock pin cut from a gauge
# pin (-TL-VN-51), the clamp screw (-TL-VN-52) and its washer (-TL-VN-53).
# The cylinder gear it holds (MHA-DT-12) is the workpiece and is not placed.
#
# flip_invert / allowed_free_stems / required_free_stems: none, every part
#   is fixed in the kit frame.
# free_dof: every part is fixed, so 0 (verify:soundness).
flip_invert: []
allowed_free_stems: []
required_free_stems: []
free_dof: 0
# drawing_unit: the fitter sheet, its TOL_* rows and the saved model's units
