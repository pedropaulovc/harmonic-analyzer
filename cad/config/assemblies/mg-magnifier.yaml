number: MHA-MG-00
# magnifier assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the magnifier
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - mag lever depth @npn
  - mag lever knife line across @npn
allowed_free_stems:
  - mg-vn-lever-wire
  - mg-magnifying-bracket
  - mg-magnifying-clamp
  - mg-magnifying-lever
  - mg-magnifying-vertical-rod
  - mg-magnifying-wheel
  - mg-wheel-drum
  - mg-output-fixture
  - mg-vn-magnifying-bracket-screw
  - mg-vn-thumb-screw
# Three freed DOF (lever knife-rock + wire swing/spin); the yoke-coupled
# wheel must read under-constrained WITH them, else the coupling died -- and
# so must the lock-mated bracket (it AFFIXES the rod to the rocking summing
# bar; a regression to grounded re-creates the collar clipping, codex #201).
# The blued-steel neck takes the lever's 1/4-20 UNC-2A thread in its UNC-2B
# through tap. Install to native ThreadProjection; no shoulder, lock or adhesive.
# mg-vn-thumb-screw instances ride this chain: clamp first, output fixture second.
# The clamp's thumb screw pinches the lever; the vertical rod screws into the
# clamp's bottom tap and seats on its shoulder (#1559). Lever, thumb screw,
# rod, fixture hook and drum wire lane share one plumb plane (option A1).
# The fixture's hex body carries the wire groove and axial tap.
required_free_stems:
  - mg-magnifying-lever
  - mg-magnifying-wheel
  - mg-vn-lever-wire
  - mg-magnifying-bracket
# The freed lever knife-rock + the articulated lever-wire's swing/spin; the
# wheel is COUPLED by the WIRE-1 yoke (no DOF of its own).
free_dof: 3
# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for mg_magnifier_assembly, ignored by
#   the build.
machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "the step that screws the MHA-MG-04 vertical rod into the MHA-MG-02 clamp's bottom tap by hand until its shoulder seats, and the rod-to-clamp joint in the views"
    finding: "the shoulder-seated #4-40 rod thread carries no lock against the wire's torque about the rod axis (rule 23, lock threaded joints exposed to operating loads)"
    reason: "owner ruling #1559 (2026-10-15): thread the rod end into the block, which carries no rotational load; the seated shoulder is the joint's datum and the thread only holds it there, with no set screw, bonding or lock (mg_rod_clamp_joint.py); full-thread engagement stays at least 1.5D at the printed worst case"
  - id: "RV-02"
    kind: "accept"
    where: "the MHA-MG-03 lever-in-MHA-MG-01 bracket joint and the step installing it to thread projection"
    finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
    reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. The two mating part packages and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
