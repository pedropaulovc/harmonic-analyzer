number: MHA-DT-00
# drive-train assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the drive-train
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - alignment pinion axial
  - axial seat
  - cam follower back seat depth
  - cam follower front seat depth
  - cone gear axial seat
  - cone platform height
  - crankshaft axial (on the plate)
  - lever axial seat
  - lift rod axial
  - pinch head seat @ppn
  - pinion arbor axial
  - pinion cam back set pin axial
  - pinion cam front set pin axial
  - tip block axial seat
  - tip collar axial seat
  # Option E-a: the pinned torque shaft's axial station (pc-ea run).
  - torque shaft axial
allowed_free_stems:
  - dt-alignment-pinion
  - dt-cone-gear
  - dt-cone-gear-shaft
  - dt-cone-pivot-post
  - dt-cone-swing-platform
  - dt-vn-cone-tip-adjuster
  - dt-cone-tip-block
  - dt-vn-cone-tip-block-screw
  # MHA-DT-VN-69 is pressed in the MHA-DT-21 foot and rides the swing (rule-23
  # retention, owner ruling 2026-11-07, PR #2248).
  - dt-vn-locating-pin
  - dt-vn-cone-tip-collar
  - dt-vn-cone-tip-pinch-screw
  - dt-crank-arm
  - dt-crank-drive-gear
  - dt-crank-handle
  # MHA-DT-34/MHA-DT-35: bonded to the handle, they ride its crank spin.
  - dt-crank-handle-butt-cup
  - dt-crank-handle-ferrule
  - dt-crank-handle-pivot-screw
  - dt-crank-hub
  - dt-vn-crank-hub-pin
  - dt-crank-pin
  - dt-crank-pin-eye
  - dt-crank-pin-ring
  - dt-crank-pinion
  - dt-crank-pinion-pin
  # MHA-DT-VN-67: closed on the crankshaft, they turn with the freed crank spin.
  - dt-vn-crank-seat-drive-pin
  - dt-crankshaft
  - dt-cylinder-gear
  - sh-vn-brass-fillister-screw
  # MHA-DT-VN-65/150: lock-mated to the arm, they ride the crank spin.
  - dt-vn-keeper-chain
  - dt-vn-keeper-chain-link
  - dt-pinion-arbor
  # MHA-DT-33: lock-mated to MHA-DT-22, it rides the freed engage swing.
  - dt-pinion-arbor-collar
  - dt-pinion-bracket
  - dt-pinion-cam
  - dt-pinion-cam-pin
  - dt-pinion-handle
  - dt-pinion-lever
  - dt-vn-post-mount-screw
  # MHA-DT-30: locked to the lift rod, it turns with the freed rod spin.
  - dt-pinion-lever-pin
  - dt-pinion-lift-rod
  # Option E-a: pinned to both straps, the torque shaft swings with them.
  - dt-pinion-pivot-shaft
  # MHA-DT-VN-63: locked in each strap's cross hole, it swings with the strap.
  - dt-vn-pinion-strap-pin
# One family per freed DOF that must ITSELF read under-constrained.
required_free_stems:
  - dt-crankshaft
  - dt-cone-swing-platform
  - dt-pinion-bracket
  - dt-pinion-lift-rod
# The crank spin, the cone-platform swing, the pinion engage swing and the
# lift-rod/cam spin (PR8).
free_dof: 4
# drawing_unit: the fitter sheets, their TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in
# machinist_exceptions: the assembly drawing's machinist-review exceptions
#   (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for dt_drive_train_assembly.
machinist_exceptions:
  # TODO(#1179): remove DT-01 when MHA-FR-01 carries a lock for MHA-DT-VN-52.
  - id: "DT-01"
    kind: "minor"
    where: "sheet 10 step 23 and sheet 12 check 4: MHA-DT-VN-52 shoulder screw run into its blind #10-24 MHA-FR-01 pivot seat, shoulder seated hard, MHA-DT-20 swinging on its oiled shoulder"
    finding: "threaded joint under operating load without a lock (rule 23)"
    reason: "temporary, pending owner confirmation (#1179): the receiver is the MHA-FR-01 base (joint_retention.py ha-harmonic-analyzer/cone-pivot-screw-in-base), whose blind seat under a bottomed shoulder leaves nothing this assembly can stake, nut or pin; every lock #1179 lists (a through tap with a jam nut or staked mouth underneath, a cross pin through the base boss, a keyed washer pinned to the base) is a base change. MHA-DT-VN-51 clamps the swing in the saved and running pose; it is loosened only for checks 4 and 5"
  - id: "DT-02"
    kind: "minor"
    where: "sheet 7 step 2: 2X MHA-DT-VN-61 1/4-20 screws cut to fit into the MHA-DT-20 taps, ENGAGEMENT .220 MIN (0.88D)."
    finding: "thread engagement below 1.5D (rule 18)"
    reason: "Owner ruling 2026-11-01: MHA-DT-VN-61 post-mount thread engagement 0.87D MIN (0.88D after #2107) accepted as a minor exception; #1019's 0.90D target not met. The same joint is MHA-DT-VN-61's RV-01"
  - id: "DT-03"
    kind: "minor"
    where: "sheet 7 step 3: MHA-DT-VN-55 #10-32 cup set screw threaded into MHA-DT-21, ENGAGEMENT .190 MIN (1.0D)."
    finding: "thread engagement below 1.5D (rule 18)"
    reason: "Owner ruling 2026-11-01: thread engagement below 1.5D with no geometry escape accepted as a minor exception. MHA-DT-VN-55 tip adjuster, 1.0D (#975): the tip block's depth and the adjuster's working window fix it"
  - id: "DT-04"
    kind: "minor"
    where: "sheet 12 check 4: VERIFY MHA-DT-VN-52 FULL-FORM THREAD ENGAGEMENT .190 MIN; SHOULDER FULLY SEATED."
    finding: "thread engagement below 1.5D (rule 18)"
    reason: "Owner ruling 2026-11-01: thread engagement below 1.5D with no geometry escape accepted as a minor exception. MHA-DT-VN-52 cone pivot shoulder screw in the MHA-FR-01 blind seat, 1.0D"
  - id: "DT-05"
    kind: "minor"
    where: "sheet 10 steps 18A-18B, 19B and 20: MHA-DT-24 pinion spring foot pad on one MHA-SH-VN-52 #4-40 fillister screw in its transferred MHA-FR-01 seat, the crest bearing on the parked back MHA-DT-14 flank"
    finding: "one-screw part that can turn about its screw with no locating feature (rule 23 static clamp)"
    reason: "Owner ruling 2026-11-07 (MHA-DT-00 rubric sample, PR #2248): no dowel, pin or second screw. The spring is very rarely used and any turning is inconsequential; the operator realigns the spring by eye and retorques the screw"
  - id: "DT-06"
    kind: "minor"
    where: "sheet 9 steps 10-10J: the back MHA-CH-08 set at DRO Y on the MHA-FR-05 rail and held by one MHA-CH-VN-57 #8-32 through its foot"
    finding: "one-screw part whose turning would change a setting, with no dowel, tongue, step or second screw (rule 23 static clamp)"
    reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144. Pending owner confirmation; the dowel option is #2277. 10D clamps the ear at Y, 10F screws it down, 10G rechecks Y and 10H checks by hand that it does not turn. The wave-spring preload acts along the shaft axis in the screw's plane, so it puts no torque about the screw, and once MHA-CH-00 sets the pivot shaft in both ears the two brackets turn only together"
