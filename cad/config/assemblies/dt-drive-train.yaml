number: MHA-DT-00
# drive-train assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the drive-train
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - alignment pinion axial
  - axial seat
  - cam follower back seat depth
  - cam follower front seat depth
  - cone gear axial seat
  # MHA-DT-37 (owner decision C1 keyed, 2026-11-09, PR #1992) is authored in
  # the cone gears' frame (Front plane on its leaves' south face), so its seat
  # takes their polarity; seeded by that precedent, not yet read.
  - cone tip gear axial seat
  # MHA-DT-VN-71 (owner decision C1 keyed, 2026-11-09, PR #1992): its Front
  # and Right planes sit on the + side of the shaft's same-sense planes, as
  # the cone gears' Front planes do.  Both inverted seeds read correct on
  # assembly:dt_drive_train (06460fb6a8, farm run 20261110T053131196Z, leaf
  # 20261110T054925Z-1 task.log lines 400-401 and 607): seated with no
  # flip-seed MISS and queried inverted by the end-of-build audit.
  - cone key axial seat
  - cone key on the keyseat floor
  - cone platform height
  - crankshaft axial (on the plate)
  # MHA-DT-39's TipFace and MHA-DT-38's NorthFace normals both point up the
  # shaft, so the plain sign rule seats the screw end 0.15 INSIDE the bushing:
  # PR 2 farm proof 6fda5a4 (assembly:dt_drive_train) read a 2.906 mm^3
  # end-screw/bushing overlap, the 0.15 mm-deep chamfered annulus that side
  # predicts (2.92 mm^3).  The 0.30 mm wrong-side move is inside the mate
  # guard's 0.5 mm origin tolerance, so only the interference gate saw it.
  - end screw end play gap
  - lever axial seat
  - lift rod axial
  - pinch head seat @ppn
  - pinion arbor axial
  - pinion cam back set pin axial
  - pinion cam front set pin axial
  - tip block axial seat
  # Option E-a: the pinned torque shaft's axial station (pc-ea run).
  - torque shaft axial
allowed_free_stems:
  - dt-alignment-pinion
  - dt-cone-gear
  - dt-cone-gear-shaft
  - dt-cone-pivot-post
  - dt-cone-swing-platform
  - dt-cone-tip-block
  - dt-vn-cone-tip-block-screw
  # MHA-DT-VN-69 is pressed in the MHA-DT-21 foot and rides the swing (rule-23
  # retention, owner ruling 2026-11-07, PR #2248).
  - dt-vn-locating-pin
  # MHA-DT-VN-71 sits in the MHA-DT-04 keyseat and rides the shaft's spin
  # and swing (owner decision C1 keyed, 2026-11-09, PR #1992).
  - dt-vn-cone-shaft-key
  # MHA-DT-37 is bonded in MHA-DT-04's socket and MHA-DT-38 is bonded on its
  # pivot: both ride the shaft's spin and swing.  MHA-DT-39 threads through
  # MHA-DT-21 and rides the swing (owner decision C1 keyed, 2026-11-09, PR
  # #1992).
  - dt-cone-tip-gear
  - dt-cone-tip-bushing
  - dt-cone-tip-end-screw
  - dt-vn-cone-tip-pinch-screw
  - dt-crank-arm
  - dt-crank-drive-gear
  - dt-crank-handle
  # MHA-DT-34/MHA-DT-35: bonded to the handle, they ride its crank spin.
  - dt-crank-handle-butt-cup
  - dt-crank-handle-ferrule
  - dt-crank-handle-pivot-screw
  - dt-crank-hub
  - dt-vn-crank-hub-pin
  - dt-crank-pin
  - dt-crank-pin-ring
  - dt-crank-pinion
  - dt-crank-pinion-pin
  # MHA-DT-VN-67: closed on the crankshaft, they turn with the freed crank spin.
  - dt-vn-crank-seat-drive-pin
  - dt-crankshaft
  - dt-cylinder-gear
  # MHA-DT-VN-65/70: lock-mated to the arm, they ride the crank spin.
  - dt-vn-keeper-chain
  - dt-vn-keeper-chain-screw
  - dt-pinion-arbor
  # MHA-DT-33: lock-mated to MHA-DT-22, it rides the freed engage swing.
  - dt-pinion-arbor-collar
  - dt-pinion-bracket
  - dt-pinion-cam
  - dt-pinion-cam-pin
  - dt-pinion-handle
  - dt-pinion-lever
  - dt-vn-post-mount-screw
  # MHA-DT-30: locked to the lift rod, it turns with the freed rod spin.
  - dt-pinion-lever-pin
  - dt-pinion-lift-rod
  # Option E-a: pinned to both straps, the torque shaft swings with them.
  - dt-pinion-pivot-shaft
  # MHA-DT-VN-63: locked in each strap's cross hole, it swings with the strap.
  - dt-vn-pinion-strap-pin
# One family per freed DOF that must ITSELF read under-constrained.
required_free_stems:
  - dt-crankshaft
  - dt-cone-swing-platform
  - dt-pinion-bracket
  - dt-pinion-lift-rod
# The crank spin, the cone-platform swing, the pinion engage swing and the
# lift-rod/cam spin (PR8).
free_dof: 4
# drawing_unit: the fitter sheets, their TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in
# machinist_exceptions: the assembly drawing's machinist-review exceptions
#   (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for dt_drive_train_assembly.
machinist_exceptions:
  # TODO(#1179): remove DT-01 when MHA-FR-01 carries a lock for MHA-DT-VN-52.
  - id: "DT-01"
    kind: "minor"
    where: "sheet 11 step 23 and sheet 13 check 4: MHA-DT-VN-52 shoulder screw run into its blind #10-24 MHA-FR-01 pivot seat, shoulder seated hard, MHA-DT-20 swinging on its oiled shoulder"
    finding: "threaded joint under operating load without a lock (rule 23)"
    reason: "temporary, pending owner confirmation (#1179): the receiver is the MHA-FR-01 base (joint_retention.py ha-harmonic-analyzer/cone-pivot-screw-in-base), whose blind seat under a bottomed shoulder leaves nothing this assembly can stake, nut or pin; every lock #1179 lists (a through tap with a jam nut or staked mouth underneath, a cross pin through the base boss, a keyed washer pinned to the base) is a base change. MHA-DT-VN-51 clamps the swing in the saved and running pose; it is loosened only for checks 4 and 5"
  - id: "DT-02"
    kind: "minor"
    where: "sheet 7 step 2: 2X MHA-DT-VN-61 1/4-20 screws cut to fit into the MHA-DT-20 taps, ENGAGEMENT .210 MIN (0.84D)."
    finding: "thread engagement below 1.5D (rule 18)"
    reason: "Owner ruling 2026-11-01: MHA-DT-VN-61 post-mount thread engagement 0.87D MIN (0.88D after #2107) accepted as a minor exception; #1019's 0.90D target not met. Owner ruling 2026-11-24, fit audit part 2 S2 (\"all approved (ticked)\"): flush to .015 short by straightedge, 0.84D MIN. The same joint is MHA-DT-VN-61's RV-01"
  # DT-03 (MHA-DT-VN-55 #10-32 cup adjuster, 1.0D) retired with the adjuster:
  # owner decision C1 keyed, 2026-11-09, PR #1992
  # (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992).  Ids are not
  # reused.
  - id: "DT-04"
    kind: "minor"
    where: "sheet 13 checks 4X-4Y: VERIFY MHA-DT-VN-52'S STEP 23L TURNS (SHEET 16 ROW 18: 8 MIN); SHOULDER STAYS SEATED."
    finding: "thread engagement below 1.5D (rule 18)"
    reason: "Owner ruling 2026-11-01: thread engagement below 1.5D with no geometry escape accepted as a minor exception. MHA-DT-VN-52 cone pivot shoulder screw in the MHA-FR-01 blind seat, 1.0D"
  - id: "DT-05"
    kind: "minor"
    where: "sheets 10-11 steps 18A-18B, 19B and 20: MHA-DT-24 pinion spring foot pad on one MHA-SH-VN-52 #4-40 fillister screw in its transferred MHA-FR-01 seat, the crest bearing on the parked back MHA-DT-14 flank"
    finding: "one-screw part that can turn about its screw with no locating feature (rule 23 static clamp)"
    reason: "Owner ruling 2026-11-07 (MHA-DT-00 rubric sample, PR #2248): no dowel, pin or second screw. The spring is very rarely used and any turning is inconsequential; the operator realigns the spring by eye and retorques the screw"
  - id: "DT-06"
    kind: "minor"
    where: "sheet 10 steps 10-10J: the back MHA-CH-08 set at DRO Y on the MHA-FR-05 rail and held by one MHA-CH-VN-57 #8-32 through its foot"
    finding: "one-screw part whose turning would change a setting, with no dowel, tongue, step or second screw (rule 23 static clamp)"
    reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 6.1; the dowel option is #2277. 10D clamps the ear at Y, 10F screws it down, 10G rechecks Y and 10H checks by hand that it does not turn. The wave-spring preload acts along the shaft axis in the screw's plane, so it puts no torque about the screw, and once MHA-CH-00 sets the pivot shaft in both ears the two brackets turn only together"
  # DT-07 (MHA-DT-39 1/4-28 end screw, 1.39D) retired: owner ruling 2026-11-20
  # on #2726, "B": the 3/4 McMaster 91794A559 screw in the .44 MHA-DT-21 keeps
  # 1.5D at the print-worst embed.
  - id: "DT-08"
    kind: "minor"
    where: "sheet 13 check 4S: TURN THE CRANK 80 TURNS: THE GEARS MUST NEVER BIND (A GEAR OUTSIDE THE TWO 4E BINDS MAY SHAKE)."
    finding: "a cone gear outside the two pairs that hold the feel-set cone line may run below contact ratio 1.0 (tolerance-policy.md cone gate); its shake is stated with no limit"
    reason: "Owner ruling 2026-11-14 (Pedro), #2584 option A: accept and state it on the sheet. Check 4 lays the cone line on the first bind near each end; a gear past a hold rides the line's extension, looser by its slope times the overhang. The gears must never bind (4S). Sampled builds (informational, #2584) put the loosest such gear 0.376 mm above standard (contact ratio about 0.77) against about 1 mm for full disengagement, so no gear skips; backlash itself is not a function (owner direction 2026-11-11, #2416)"
  - id: "DT-09"
    kind: "minor"
    where: "sheets 9-10 steps 8T, 9F and 9Q, sheet 13 checks 4C-4M: each MHA-DT-02 arbor pedestal on MHA-FR-01 clamped at its DRO X/Y (setting table rows 2-3), set by feel at check 4E, then held by one MHA-DT-VN-62 #8-32 through its foot hole into the seat spotted through that hole at check 4J and drilled and tapped with the bank lifted off at check 4L"
    finding: "one-screw part whose turning would change a setting, with no dowel, tongue, step or second screw (rule 23 static clamp)"
    reason: "Delegated ruling 2026-11-17 (Main) on #2648 (https://github.com/pedropaulovc/harmonic-analyzer/issues/2648#issuecomment-6970974102), precedent: the owner's accepted one-screw joints MHA-DT-24 (DT-05, #2248) and MHA-CH-08 (DT-06), under the owner's by-feel direction for the cone set (#2365); owner review #2144 (https://github.com/pedropaulovc/harmonic-analyzer/issues/2144); not an owner ruling. The pedestals are set by feel at checks 4C-4F; owner ruling 2026-11-24 (fit audit part 2 C6: 'Yes: set by feel, spot the holes after, tripwire .015.') drops the DRO recheck, spots the seats after 4E (4J) and keeps one tripwire (4G: neither X indicator over .015). 9Q checks by hand that neither moves, and 4W redoes checks 4-7 after any later loosening. The owner can still choose a dowel match-drilled through the foot into MHA-FR-01"
  - id: "DT-10"
    kind: "minor"
    where: "sheet 8 steps 4J-4L: TURN MHA-DT-07 ONE FULL REVOLUTION BY HAND: IT MUST NEVER BIND; IF THE TEETH BIND, RECUT MHA-DT-10: EVERY TOOTH GAP .004 WIDER, CUTTER MOVED SIDEWAYS, SAME DEPTH; AFTER A RECUT, REPEAT FROM 4D."
    finding: "the fixed-centre 16T:64T crank mesh can close by about 0.08 mm at the prints' tightest whole-face corner; it is fitted by hand at assembly, with a 16T recut as the remedy, and a recut 16T no longer matches its sheet's tooth reference rows"
    reason: "Delegated ruling 2026-11-17 (Main) on #2481, option B (https://github.com/pedropaulovc/harmonic-analyzer/issues/2481#issuecomment-6970972065), precedent: the owner's fit-by-feel directions for the cone mesh (#2365) and the feed rack (#2416), where a mesh is accepted by hand at assembly rather than at every print corner; owner review #2144 (https://github.com/pedropaulovc/harmonic-analyzer/issues/2144); not an owner ruling. The 2026-11-15 owner pack on #2481 computes the closure from ten allowances stacked at their worst (400 simulated builds: none bound) and the .004 sideways recut clearing it (+0.022 / +0.005 mm); the 16T is the last-fitted part, still unpinned at 4J. The owner can still choose option C (crank bore +.006)"
  - id: "DT-11"
    kind: "accept"
    where: "sheet 15 setting table row 1 and sheet 9 step 8E: GEAR 0 CAM FACE TO GEAR 19 BACK FACE 5.997-6.003, INDICATOR ON BLOCKS; 8E. MEASURE GEAR 19'S BACK FACE ON AN INDICATOR ZEROED ON 6.0000 GAUGE BLOCKS ON THAT STOP"
    finding: "the closed gear stack is read against a wrung 6.0000 gauge-block stack set up for that one size (drawing-guidelines rule 4: a gauge block stack set up for one size)"
    reason: "Delegated ruling 2026-11-25 (Main), precedent: D4/D14 (2026-11-24) and the owner's 'stay as tight as today' on these settings; owner review #2144 (D28); not an owner ruling. The 6.0000 stack is the setting reference for the 5.997-6.003 window. Its blocks are the owned Mitutoyo 81-piece inch set (cad/config/shop-equipment/gauges.toml gauge-blocks-mitutoyo, owned since 2026-11-08), not a gauge bought for this setting, and the shop owns no 5-6 in micrometer (#2362). The window (±.003) has only the cone tip bushing's 0.024 mm worst-case air behind it (dt_cone_tip_air C-01 'can reach G19'; -0.003 mm at the title block's ±.005; necessity N-02); calipers over 6 in read ±.001 at best, a third of the window, and the shop table gives them no accuracy row"
  - id: "DT-12"
    kind: "accept"
    where: "sheet 16 acceptance row 8 and sheet 8 step 3C: MHA-DT-04 END PLAY AT THE SHAFT END .002-.009, DIAL INDICATOR; 3C. MEASURE THE MHA-DT-04 END PLAY AT THE SHAFT END"
    finding: "the shaft end play window .002-.009 (.007) is tighter than the title block's .XXX row, which would print .002-.012 (drawing-guidelines rule 4)"
    reason: "MHA-DT-00 row 8, delegated ruling 2026-11-25 (Main), no precedent; owner review #2144 (D30). NOT necessary: at .002-.012 nothing fails (pivot engagement 1.401 -> 1.346 mm; bushing least air 0.024 mm and step-23 look air 0.7305 mm unchanged; crank contact ratio 1.0769). Kept only because opening it re-keys about 60 leaves including the frame (fr_harmonic_base); the opening is issue #3600, to ride the next change that rebuilds the cone set or the frame. Accepts this window only."
  - id: "U-MHA-DT-VN-61-no-lock"
    kind: "accept"
    where: "sheet 7 steps 2M and 2S-2U, sheet 8 step 3G, and sheet 13 checks 4V-4W: MHA-DT-05 held on MHA-DT-20 by the two MHA-DT-VN-61 1/4-20 screws, turned on them until the MHA-DT-37 pivot runs free and tightened; no lock and no dowel; MHA-DT-02 AND MHA-DT-VN-61 STAY AS SET FROM HERE ON, and a loosened screw re-sets the post by step 3G (2M, 2S-2U, then 3C-3F) before checks 4-7 are redone"
    finding: "MHA-DT-VN-61 post-mount screws carry no mechanical lock, and MHA-DT-05's yaw is held by their head and face friction only (rule 23, lock threaded joints exposed to operating loads; static clamp whose turning would change a setting)"
    reason: "Owner ruling 2026-11-20 (Pedro), #1177 (triage of 2026-11-19; threaded-joint-retention.md ruling U-MHA-DT-VN-61-no-lock): 'B only if plate hole can be a blind hole otherwise it could rub on the deck when swinging the plate. Otherwise A'. The plate hole cannot be blind (the match-drilling after fit-up could reach a blind hole only through the 3.73 post, and option B's 1/8 dowel leaves no .060 floor in the .245 plate), so A stands: friction only. #3085 option B (same triage) adds the hold and the re-set as checks 4V-4W. This accepts no lock for this joint, not a demonstrated immunity: journal drag and the crank load still pass a cyclic moment about vertical. The same joint's engagement is DT-02"
  - id: "U-MHA-SH-VN-54-DT-no-lock"
    kind: "accept"
    where: "sheets 9-10 step 9N: RUN THE FRONT MHA-SH-VN-54 IN TIGHT, THEN THE BACK ONE (each #4-40 cup point into its #43 spot in MHA-DT-13 through the MHA-DT-02 crown tap); no stake, jam screw or threadlocker"
    finding: "MHA-SH-VN-54 arbor set screws carry no mechanical lock (rule 23, lock threaded joints exposed to operating loads)"
    reason: "Owner ruling 2026-11-20 (Pedro), #1173 (triage of 2026-11-19, option A, in his words: \"A\"; threaded-joint-retention.md ruling U-MHA-SH-VN-54-DT-no-lock): accept the bare cup point, like U-MHA-PD-VN-57-no-lock. The two screws hold the stationary MHA-DT-13 arbor by their own thread and the cup in the arbor's spot. The rejected options were staking the crown tap mouth and raising the crown for a jam screw. This accepts only these two set screws' missing lock"
  - id: "U-MHA-DT-VN-70-no-lock"
    kind: "accept"
    where: "sheet 8 steps 6L-6M: MHA-DT-VN-70 screws the MHA-DT-VN-65 end link flat to MHA-DT-06 through its eye, seated and not turning by hand; no lock"
    finding: "MHA-DT-VN-70 keeper-chain anchor screw on the turning crank arm carries no mechanical lock (rule 23)"
    reason: "Owner ruling 2026-11-20 (Pedro), #1175 (triage of 2026-11-19, option A, in his words: \"A\"; threaded-joint-retention.md ruling U-MHA-DT-VN-70-no-lock): accept unlocked. Its load is a few grams of chain, it is in plain sight on the crank and is re-tightened when seen, and losing it frees only the keeper chain, not the crank. The rejected options were a filed-flush screw with a staked tap mouth and a jammed #2-56 hex nut. This accepts only this screw's missing lock"
