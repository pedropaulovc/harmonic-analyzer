number: MHA-DT-03-TL-05
# Keyed cutting arbor kit contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. A shop fixture (issue #2465): it never
# enters a machine assembly or BOM. Its components are the keyed arbor
# dt-cone-gear-tl-keyed-arbor (MHA-DT-03-TL-03), its bonded key
# dt-cone-gear-tl-arbor-key (MHA-DT-03-TL-06), the three backing collars
# dt-cone-gear-tl-arbor-collar (MHA-DT-03-TL-04, members C175, C100, C050)
# and the nut dt-cone-gear-tl-vn-arbor-nut (MHA-DT-03-TL-VN-50, McMaster
# 95462A505). The blank, the dividing head and the cutter are not kit items.
#
# flip_invert / allowed_free_stems / required_free_stems: none, every part is
#   fixed in the kit frame.
# free_dof: every part is fixed, so 0 (verify:soundness).
flip_invert: []
allowed_free_stems: []
required_free_stems: []
free_dof: 0
# drawing_unit: the fitting sheet, its TOL_* rows and the saved model's units
#   are decimal inch, matching the arbor drawing.
drawing_unit: in
