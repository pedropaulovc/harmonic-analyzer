number: MHA-PD-00
# paper-drive assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the paper-drive
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - crank chain wheel axial
  - knob chain wheel axial
  # (was "rack pinion disc axial" -- the 120T disc's label became "reducer
  # disc" in the PR #196 real-train rework; same mate, same learned side.
  # Latent until 2026-07-07's full paper-drive rebuild re-keyed it.)
  - reducer disc axial
  # The .243 collar's 0.0169 air, now at its front with the rear seated on F
  # (#290, #2148). The same plane pair as the retired rear-gap mate (a
  # behind part's Front Plane against the part ahead's +Z RearFace, the
  # behind part moving), whose sign-rule side run 20261102T151544062Z showed
  # lands 0.0169 inside, under the 0.5 mm flip-miss gate;
  # _assert_knob_collar_capture checks the side.
  - drive collar front behind the knob wheel rear face
allowed_free_stems:
  - sh-vn-brass-fillister-screw
  - pd-vn-platen-clip-screw  # MHA-PD-VN-65 clip screws ride the platen
  - pd-guide-lock
  - pd-vn-guide-lock-screw  # MHA-PD-VN-60 lock screws ride the platen (R9-31)
  - pd-platen
  - pd-platen-clip
  - pd-platen-guide
  - pd-platen-paper
  - pd-platen-rack
  - pd-rack-pinion
  - pd-transgear-disc-hub  # disc cluster: hub, screws and feed pinion lock to the disc
  - pd-vn-transgear-disc-screw
  - pd-transgear-drive-collar  # shaft D-core coaxial and clocked; actual rear face seated on gear front F
  - pd-transgear-feed-pinion
  - pd-transgear-knob-cup  # knob stack: rides the knob shaft (lock-mated)
  - pd-vn-transgear-knob-cup-pin  # pins the cup to the knob shaft's journal
  - pd-vn-transgear-knob-drive-pin  # pair pressed in the drive collar
  - pd-transgear-knob-shaft
  - pd-transgear-knob-thrust-ring
  - pd-transgear-removable
  - pd-transgear-thumbnut  # rides the knob shaft (lock-mated)
# One freed DOF (the crank T12 spin). paper-drive is checked by INSTANCE, not
# this stem (verify._required_free_instances) -- three transgear-removable
# siblings share the stem, so a stem check passes even if T12 is pinned and
# T24/T18 is loose (codex #189 :679). Kept as reference data only.
required_free_stems:
  - pd-transgear-removable
# The freed crank (T12) spin; the knob T24 is chain-coupled and the platen is
# rack-coupled (no DOF of their own).
free_dof: 1
# carries_chain: wraps the roller chain, so verify:soundness's interference
#   gate gets the authored wheel mounts, as the assembly build does (541011de0).
carries_chain: true
# drawing_unit: the fitter sheet, its TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in
# machinist_exceptions: the fitter package's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for pd_paper_drive_assembly,
#   ignored by the build.
machinist_exceptions:
  - id: "U-MHA-PD-13-no-lock"
    kind: "accept"
    where: "sheets 10 and 11, knob stack and chain fit-up: MHA-PD-13 thumbnut tight on the MHA-PD-22 collar's pilot, MHA-PD-08 knob shaft stud; THUMBNUT IS A CLAMP ONLY; NEVER TURNED TO DRIVE"
    finding: "MHA-PD-13 thumbnut on the reversing knob shaft carries no mechanical lock (rule 23, lock threaded joints exposed to operating loads)"
    reason: "user ruling 2026-10-03 on the machinist review of 6c385465d, re-granted 2026-10-11 for #8-32 (joint_retention ruling U-MHA-PD-13-no-lock): the T24 floats under the flange and turns against it only by its drive-pin backlash, so the drag it passes is over 300x below the hand-tight nut's break-away torque; every positive lock tried broke a wall or the chain's envelope"
  - id: "PD-00-knob-setting-true"
    kind: "accept"
    where: "sheet 6, step 12C (and 12F/12H/12R, which reuse it): pivot bore, the pin's shank in pin bore S and knob bore N indicated TRUE: SWEEP UNDER .0005, ONE DIVISION ON A .0005 TEST INDICATOR, SO N LANDS INSIDE THE S TO N BAND, WITHIN .004 OF ITS DETAIL K SETTING"
    finding: "TRUE sweep finer than the .002 S-N band (1.7242 +.002/.000) or the .0005 assembly row needs (rule 4, over_specification)"
    reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 5.3: DETAIL K's setting circle opens to Ø.008 (stock_form_quality.reducer_k_setting_diameter_mm 0.2032; paper_drive_arm_registration.REDUCER_AXIS_SETUP_RADIUS_MM .1016 mm), decoupled from the S-K set band, which stays 43.794 +.002/-0 (pd_rack_pinion_spec.CENTRE_DISTANCE_SET_BAND_IN) because the reducer mesh needs it. The knob bore N (the model's K) must end inside that circle about its DETAIL K nominal, not only inside the S-N band. The pivot-and-pin tram turns N about S with a 0.64 lever (K_SET_CENTRE_DISTANCE_MM / PIN_STATION), which amplifies the across error: with the DRO's stated accuracy and one full .0005 division of sweep the worst-case N lands .0563 mm (.0022) off, inside the .1016 mm circle, and the radial error (about .0199 mm) keeps margin at both ends of the set band (test_the_jig_bored_k_lands_in_the_set_band_with_margin_at_both_ends). One division is the coarsest acceptance the shop's .0005 test indicator reads"
  - id: "PD-00-disc-hub-shear-clamp"
    kind: "accept"
    where: "sheet 5, step 9 (9H FIX THE DISC WITH 3 MHA-PD-VN-55 SCREWS, the hand-torque check 9N after it) and sheet 8, step 16: MHA-PD-06 disc to MHA-PD-17 hub flange"
    finding: "disc-to-hub joint carries the reversing drive torque on seated #0-80 screws, which rule 23's drive-torque row does not list; no pin, bond or other drive means (rule 23)"
    reason: "Delegated ruling 2026-11-08 (Main), no precedent; owner review #2144; pending owner confirmation: joint_retention record pd-paper-drive/disc-screws classes this joint STATIC_CLAMP. Disc, hub and sleeve turn as one body; the drive torque acts about the pin axis and the three screws on the flange's bolt circle carry it as shear across their own axes, never as torque about them, so it is a clamped joint with no loosening torque on the screws. The step prints its bench acceptance (sleeve held, firm hand torque at the disc rim does not turn the disc on the hub) and a remedy"
  - id: "PD-00-feed-mesh-by-feel"
    kind: "accept"
    where: "step 24 (hanger-meshed): the MHA-PD-10 feed pinion swung up into the MHA-PD-05 rack until the teeth are fully engaged without binding and clamped, a tight spot eased off at it, then the no-skip check; no feeler, gauge, stop or backlash value"
    finding: "feed rack mesh set by feel with no gauge or number, so a fitter could leave it at zero backlash or ease it loose (rule 4 / unquantified setting)"
    reason: "Owner direction 2026-11-11 (Pedro) on #2416: 'the only things to control are that gears don't bind, don't come loose and that paper advances at constant speed; backlash is not a problem'; the original latches the pinion into the rack with no gauge. Delegated rulings 2026-11-11 (Main) under that direction, no precedent (the floor departs from the owner's 1.1 continuous-action floors at a loose extreme: the reducer's runout extreme, 2026-10-11, and option C's 1.1 for the removed .003 leaf fallback; the root sum square is an exception to the repo's worst-case mesh stacks, limited to this mesh, because the setting is by feel and the acceptance is functional); owner review #2144; pending owner confirmation: the feel set is gated at the worst corner's first bind (0.069 mm tooth-centred backlash, root clearance and interference clear there) and at the loosest feel set, that bind plus the root sum square of the independent openings (rack index error, the feed's lateral terms, the pinion's toothspace runout and the rack's crest drift along the run, twice the rack-soldered ±.002 band): 0.188 mm backlash at contact ratio >= 1.0 (1.133), continuous conjugate action being what constant-speed feed asks (pd_paper_drive_assembly_steps.FEED_LOOSEST_MESH). Reported, not gated: with every term at its limit (0.299 mm) the contact ratio is 0.942, a slight hitch in the feed at that station, caught by the steady-advance check (FEED_WORST_CASE_MESH). The remedy eases the arm only until the teeth just turn free at the tight spot, which keeps the set at that spot's bind; the no-skip check before the hook is drilled guards against the mesh coming loose and sends the fitter to the parts on a skip. Residual accepted: no bind is guaranteed at the phase felt in step 24 only; a later re-latch at another tooth offset can bring the pinion's high tooth to the tightest station, up to one TIR (0.051 mm) radial past the felt bind (about 0.037 mm backlash); a bind there is felt in service and cured by re-setting the arm (step 25's remedy), as on the original"
