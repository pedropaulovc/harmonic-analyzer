# bit dt-cone-tip-gear-tl-form-cutter (MHA-DT-37-TL-01), the bar
# dt-cone-tip-gear-tl-cutter-bar (MHA-DT-37-TL-02) and the bought #4-40 x 1/4
# cup-point set screw that clamps the bit, the shared native
# sh-vn-arbor-set-screw (MHA-SH-VN-54).
#
# flip_invert / allowed_free_stems / required_free_stems: none, every part is
#   fixed at its set-up pose.
# free_dof: every part is fixed, so 0 (verify:soundness).
flip_invert: []
allowed_free_stems: []
required_free_stems: []
free_dof: 0
# drawing_unit: the fitter sheet, its TOL_* rows and the saved model's units
