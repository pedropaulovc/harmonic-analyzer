number: MHA-FR-000
# frame assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the frame
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert: []
allowed_free_stems: []
required_free_stems: []
free_dof: 0
# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for fr_frame_assembly, ignored by
#   the build.
machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "the MATCH-FIT AND ASSEMBLY SEQUENCE step 9. SET MHA-FR-004 DECORATED FACE UP, CENTRED FRONT TO REAR, PARALLEL TO AND INSET FROM THE NEAR DECK END PER SECTION B-B, SHEET 1; CLAMP. SPOT MHA-FR-001 THROUGH ITS FOUR HOLES; DRILL AND TAP EACH PER ITS MHA-FR-001 TRANSFER CALLOUT. SEAT ALL FOUR MHA-VN-006 HEADS."
    finding: "fit-up at assembly (rule 19)"
    reason: "the nameplate's four #4-40 base seats are spotted through the clamped plate and drilled and tapped at assembly (the base sheet prints them as transferred from MHA-FR-004), so the plate's holes locate at the title block's .X grade: the 0.203 diametral float of the screw in its 3.048 hole (3.048 - 2.845) is far short of the 3.705 the loose bands would demand (plate station .X +/-0.8 plus a base tap at .XX +/-0.51 on each axis, 2 x sqrt(2) x 1.31 = 3.705), so the step absorbs the whole stack and neither part takes a tighter band (owner ruling 2026-10-15, #1468 option A) (owner-accepted)"
