number: MHA-SM-00
# summing assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the summing
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - summing lever axial
allowed_free_stems:
  - sm-summing-lever
  - sm-vn-boss-hook
# One freed DOF (the lever knife-edge rock); the lock-mated boss-hook must
# read under-constrained WITH it (a grounded/fixed
# regression would freeze the counter-spring anchor while the lever still
# swings, codex #201).
# The purchased MHA-SM-VN-56 shoulder screw is locked to the fixed gooseneck;
# the upper eye rides free on the shoulder under its head (owner ruling
# 2026-11-08 (Pedro), #2144 item 11.4: bare slotted McMaster 91829A566, washer
# dropped) and adds no operational freedom.
required_free_stems:
  - sm-summing-lever
  - sm-vn-boss-hook
# The freed lever knife-edge rock; the boss-hook rides it locked.
free_dof: 1
# drawing_unit: the fitter sheets, their TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in
# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for sm_summing_assembly.
machinist_exceptions:
  - id: "SM-01"
    kind: "accept"
    where: "sheet 3 step 8 and check 3: MHA-SM-VN-56 seated on the MHA-SM-01 end-piece face, the upper loop of MHA-SM-VN-51 free on its shoulder under its head, no threadlocker"
    finding: "threaded joint under operating load without a lock (rule 23)"
    reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 11.4, supersedes #1951's clamped eye and the 2026-09-21 static-clamp ruling this row recorded (drafted by the fan-out, PENDING the owner's confirmation that the seated shoulder needs no lock): the shoulder screw is tightened until its shoulder seats on the end-piece face, so screw and end piece never move relative to each other; the eye turns and slides only on the ground shoulder, whose drag is the eye load times friction at the shoulder radius, far below the seated shoulder's breakaway friction, and nothing clamps the eye to turn the screw (joint_retention.py sm-summing/gooseneck-shoulder-screw, STATIC_CLAMP). Check 3 is the acceptance."
  - id: "SM-02"
    kind: "accept"
    where: "sheet 3 step 2 and sheet 1 DETAIL A: MHA-SM-VN-50 threaded bare into the MHA-SM-03 tapped boss, cut end within half a turn of flush with the boss underside, eye clocked, no lock part"
    finding: "threaded adjuster under the counter-spring pull held by a plain thread, no lock (rule 23)"
    reason: "Owner ruling 2026-11-09 (Pedro), #2326: \"these jam nuts dont actually exist in real device and must be removed ; there is no torque load on hooks so theres no need for nuts\". The spring pulls along the shank axis, which the full 19.05 boss thread carries (joint_retention.py sm-summing/boss-hook-in-lever, ruling U-MHA-SM-VN-50-no-lock). This accepts only this joint's missing lock."
