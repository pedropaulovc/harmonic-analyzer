number: MHA-PN-00
# pen assembly contract -- per-assembly build data read through
# cad/scripts/_assembly_contract.py. Editing this file re-keys ONLY the pen
# closure (its assembly leaf, its verify_soundness leaf, and whatever consumes
# its saved .SLDASM), never a sibling assembly.
#
# flip_invert: _assembly._flip_sig signatures (+ " @<diag>" orientation suffix
#   for a rotation/mirror twin) whose distance driver seats OPPOSITE the plain
#   sign rule. List every signature THIS build queries that needs inverting; a
#   signature shared with another assembly goes in both files. A build that
#   lands a mate on the wrong side fails with "flip-seed MISS ... toggle sig",
#   naming this file; the end-of-build seed audit logs every queried signature
#   and warns on entries no mate queried.
# allowed_free_stems: the exact component families allowed to read
#   under-constrained (freed operational DOF + everything coupled to them).
#   Shared by the incremental refresh and verify:soundness.
# required_free_stems: one family per freed DOF that must itself read
#   under-constrained (verify:soundness necessity).
# free_dof (+ free_dof_per_active_channel x active channels): the operational
#   DOF the saved model ships free (verify:soundness).
flip_invert:
  - hanger screw head plane
  # (was "pen rod travel snapshot" -- the label gained the PARK-driver tag
  # 2026-07-07; same mate, same learned side)
  - pen rod travel PARK driver (freed in default build)
# The carriage riders (v-block, marker, stirrup frame + thumb screw, rod set
# screw, adjuster stud + jam nut) are lock-mated to the free rod and read
# under-constrained with it.
allowed_free_stems:
  - pn-pen-rod
  - pn-vn-pen-marker
  - sh-vn-music-wire
  - pn-pen-v-block
  - pn-pen-frame
  - pn-vn-pen-set-screw
  - pn-vn-pen-rod-set-screw
  - pn-pen-adjust-screw
  - pn-vn-pen-adjust-nut
# One freed DOF (the carriage travel); every lock-mated rider and the pen-wire
# must ride it -- with the neutral preset the motion sweep reads got == want
# == 0 even if a rider were disconnected (codex #201).
required_free_stems:
  - pn-pen-rod
  - pn-vn-pen-marker
  - sh-vn-music-wire
  - pn-pen-v-block
  - pn-pen-frame
  - pn-vn-pen-set-screw
  - pn-vn-pen-rod-set-screw
  - pn-pen-adjust-screw
  - pn-vn-pen-adjust-nut
# The freed carriage travel; the marker + pen-wire are lock-mated and ride
# it. The F5 pen-driver equation is installed transiently by
# verify:kinematics on the replayed drive mate.
free_dof: 1
# drawing_unit: the fitter sheet, its TOL_* rows and the saved model's units
#   are decimal inch (#290).
drawing_unit: in
# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for pn_pen_assembly, ignored by
#   the build.
machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "the sequence step that runs the MHA-PN-VN-52 cup-point set screw into the v-block's front-face tap onto the rod's pivot end, with nothing on its thread, and the check that the v-block does not turn on the pivot by hand at the 45 deg +/-1 deg yaw (DETAIL C)"
    finding: "the #4-40 cup-point set screw holding the pen yaw is a threaded joint under reversing nib drag with no lock (rule 23)"
    reason: "owner ruling U-MHA-PN-VN-52-no-lock (user, 2026-10-14, PR #1436; joint_retention.py pn-pen/rod-set-screw-in-v-block): the set screw is the operator's yaw adjustment and a light clamp, re-set when it drifts; the block's .367 tap leaves no room for a second jam screw, and the 1898 machine ran the plain cup point bare (owner-accepted)"
