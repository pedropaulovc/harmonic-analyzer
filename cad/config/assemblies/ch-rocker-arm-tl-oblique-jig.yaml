# The sweep; verify's pass-sweep-interference-free gate replays the recorded
# slide drive through both passes (the .<asm>.sweep.json sidecar).
free_dof: 1
# machinist_exceptions: the assembly drawing's owner-declared machinist-review
#   exceptions (drawing-simplicity-policy.md "Named exceptions"); read by
#   machinist_exceptions.load_exceptions for ch_rocker_arm_tl_oblique_jig_assembly,
#   ignored by the build.
machinist_exceptions:
  # RV-01, re-accepted for issue #1630's #4-40 joint (owner ruling 2026-10-19,
  # via coordinator: the bought nut, no lock, no receipt limits, 0.4 N·m;
  # owner ruling 2026-10-20: #4-40 button heads directly on the flange, no
  # washers, taps spotted from the nut's own flange holes). Jig spec numbers;
  # the brass flange's hole and thickness carry no vendor band, taken at
  # nominal. Superseded
  # provenance, the owner-accepted M3 entry (2026-10-17), verbatim:
  #   where: "steps 7A and 8 (sheet 6) and sheet 4 balloons 15 and 26: the TR8X2 flanged nut's 4 M3 X 10 SHCS into the nut bracket, tightened to 1.0 N·m"
  #   finding: "no mechanical lock on the nut-flange screws under the reversing nut torque (rule 23)"
  #   reason: "static clamp, rule 23's last bullet: the 4 M3 SHCS clamp the Tr8 nut's flange to TL-29 and no operating torque reaches them. The nut's worst-case torque is 0.87 N·m (1 kN hand-abuse thrust, oiled Tr8x2 thread); the flange's clamp slip torque is 8.0 to 10.7 N·m (4 x M3 at 1.67 kN preload from 1.0 N·m, mu 0.15 to 0.20, on the 16 bolt circle), a 9 to 12x margin, so the flange never slips (jig spec NUT_FLANGE_SLIP_MARGIN, self-checked >= 1.5). A wedge-lock pair cannot seat: an M3 pair's OD 7.0 on the 16 bolt circle overlaps the nut's 10.2 body by 0.6 (owner ruling 2026-10-17, via coordinator) (owner-accepted)"
  - id: "RV-01"
    kind: "accept"
    where: "steps 7A and 8 (sheet 7) and sheet 5 balloons 17 and 28: the TR8X2 flanged nut's 4 #4-40 X 1/2 BHCS into the nut bracket, tightened to 0.4 N·m"
    finding: "no mechanical lock on the nut-flange screws under the reversing nut torque (rule 23)"
    reason: "static clamp, rule 23's last bullet: the 4 #4-40 BHCS clamp the Tr8 nut's flange to TL-29 and no operating torque reaches them. The nut's worst-case torque is 0.87 N·m (1 kN hand-abuse thrust, oiled Tr8x2 thread); the flange's clamp slip torque is 3.4 to 4.5 N·m (4 x #4-40 at 0.70 kN preload from 0.4 N·m, mu 0.15 to 0.20, on the 16 bolt circle), a 3.9 to 5.1x margin, so the flange never slips (jig spec NUT_FLANGE_SLIP_MARGIN, self-checked >= 1.5). Each button head bears directly on the brass flange at 79 MPa, under its 124 MPa yield (jig spec NUT_SCREW_FLANGE_BEARING_MPA). A lock washer seats only under OD 5.8: the 16 bolt circle less the nut's 10.2 body leaves 2.9 radially (owner ruling 2026-10-19, via coordinator; button heads, no washers, owner ruling 2026-10-20) (owner-accepted)"
  - id: "RV-02"
    kind: "accept"
    where: "step 7C (sheet 7): CENTRE 54.500 FROM THE BLOCK'S SPINDLE END (SETS #8 TAP END WALLS), the nut bracket's set on pivot block 1 before its taps are spotted"
    finding: "a three-place set given to hold the #8 taps' end walls (rules 4 and 17: walls fixed with geometry, not a tighter band)"
    reason: "TL-29 cannot grow: a longer bracket puts the leadscrew feed gap under 2.5 and its 3/4 stock caps the length, so the set takes the title block's .XXX band (+/-0.13) with its reason, and each #8 tap's end wall is 1.544 min at the worst case of every band, over the 1.5 floor; MHA-CH-06-TL-29 states it on its #8 callout (nut bracket spec END_WALL_MIN, self-checked) (owner ruling 2026-10-17, via coordinator) (owner-accepted)"
  - id: "RV-03"
    kind: "accept"
    where: "step 8 (sheet 7): the handwheel's and the two KP08 pillow blocks' set screws on the leadscrew's flats, EACH LOCKED WITH LOW-STRENGTH (PURPLE) THREADLOCKER"
    finding: "set screws on a hand-cranked, reversing shaft held only by threadlocker, no mechanical lock (rule 23)"
    reason: "the lock means is the owner's choice: a bought low-strength (purple) threadlocker on each set screw, named in step 8, with no new hardware; each set screw seats on a flat on the screw, so the flat, not friction, carries the hand-crank torque (owner ruling 2026-10-18, via coordinator) (owner-accepted)"
  - id: "RV-04"
    kind: "minor"
    where: "step C3B (sheet 10) and the fastener table: the 4 NAS1352N5H12 5/16-18 X 3/4 drilled-head screws per pivot cap (item 34) into the THRU-tapped pivot block"
    finding: "cap screw complete-thread engagement below 1.5D: estimated worst case 9.81 against 11.91 MIN, with no engagement measurement at assembly (rule 4 / thread engagement)"
    reason: "an estimate, not a guarantee: no NAS1352 or supplier limit bounds the thread runouts of a screw this short (3/4 < the 1.125 minimum basic thread length; NAS note c only says as close to the head as practicable), so ASME B18.3 conventions stand in. Estimated worst case along the inclined tap axis (retention spec cap_screw_complete_engagement_estimate): shortest 3/4 screw less 2P incomplete point, at the highest seated head, against the deeper of the block tap mouth's title-block break plus 1P and the screw's 2P underhead thread runout (ASME B18.3) at the lowest seat, gives 9.81 complete-thread engagement, under 1.5D = 11.91. The owner keeps the stocked 3/4 NAS1352N5H12 and accepts the shortfall as minor, with C3B a plain statement and no assembly measurement or supplier thread-length guarantee (owner ruling 2026-10-27, via coordinator) (owner-accepted)"
