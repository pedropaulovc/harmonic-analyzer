number: MHA-CH-06-TL-00
# Shop fixture: one carriage-slide DOF. Rail 1 carries the integral feed block,
# rail 2 the plain pivot block. Both purchased shoulder-screw stacks and every
# carrier rider move with the linkage; the raised leadscrew/KP08s stay fixed.
# The free stems are native files (the spec's MOVING_STEMS): the rail kit
# (MHA-CH-06-TL-VN-83) for its Carriage members and the leadscrew kit
# (MHA-CH-06-TL-VN-84) for its FeedNut; their Rail and LeadScrew stay fixed,
# and the build requires each moving kit occurrence itself to read free. The
# common #8-32 screw (TL-VN-61) is listed for its CL, CR and HUB strap clamps,
# which ride the carrier; its rail and TL-28 bar occurrences stay fixed, and
# the build requires each clamp occurrence itself to read free. The loose
# 98381A473 stop pins are the reused MHA-SM-VN-53 native.
