machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "F2: four #4-40 X 5/8 B18.6.3 flat heads (TL-VN-67) through the countersunk holes of the bought brass flange nut (MHA-CH-06-TL-VN-84, FeedNut) into the integral feed block's transferred taps, 0.3 N·m, crosswise in 2 stages"
    finding: "no mechanical lock on the feed nut screws under reversing nut torque (rule 23)"
    reason: "Owner ruling 2026-11-04 on #2177 (option B) replaced the shop-made TL-27 nut and its TL-VN-81 dowel with the ReliaBot leadscrew's own brass flange nut, its spigot faced off. Main ruling 2026-11-03 on #2112 Codjiflo P1 still holds: a positive stop, no friction counted on. The four flat heads, seated in the nut's 82° countersinks and threaded into TL-32's lug, key the nut: its reversing torque (1.19 N·m at the 1361 N crank thrust) puts 37 N on each head at the 16 mm PCD, a margin of 30 on the #4-40 minor section in shear, so no turning load loosens the screws: a static clamp. At 0.3 N·m the four screws' preload (527 N each) is 1.55 x that thrust, so the nut never lifts off the lug, and each head's bearing on the brass (102 MPa) stays under the 117 MPa (17 ksi) yield of 360-H02, taken because the listing states no alloy. The owner accepted the static clamp without washers for the bought nut's flange on 2026-10-19/20. The lug's taps are transferred from the seated, clocked nut at assembly (F1B-F2)."
  - id: "RV-03"
    kind: "accept"
    where: "step 8B: the handwheel and KP08 set screws on leadscrew flats, locked with Loctite 222 (low-strength purple) threadlocker"
    finding: "set screws on a hand-cranked reversing shaft use threadlocker without a mechanical lock (rule 23)"
    reason: "Owner ruling 2026-10-18 retains bought low-strength threadlocker on each set screw; the shaft flats carry the hand-crank torque."
  - id: "RV-04"
    kind: "accept"
    where: "P2: the two 5/16-18 shoulder screws seated in block counterbores, Loctite 222 and 4.0 N·m"
    finding: "pivot shoulder screws use threadlocker without a separate mechanical thread lock (rule 23)"
    reason: "The owner-approved 2026-10-23 plain-pivot contract explicitly chooses Loctite 222 and torque. Each screw shoulder bottoms in its counterbore, leaving measured .002–.010 carrier running clearance; the head, thread, block and carriage form the positive lift-capture path. This is not whole-jig load certification."
  - id: "RV-05"
    kind: "accept"
    where: "Step 5: each M4 X 20 SHCS cut to its own counterbore floor height + .189, engaging .183-.195 of the HGH15CA carriage's M4 x 5"
    finding: "carriage screw full-thread engagement .162 min (4.12 mm, 1.03D; the tip reaches .183, less its 0.75P chamfer), under rule 18's 1.5D"
    reason: "The HGH15CA-style kit carriage's M4 holes are 5 mm deep (HIWIN reference geometry, checked at receipt), so no M4 reaches 1.5D (6.0 mm). Owner ruling 2026-11-01, option A: the TL-22/TL-32 counterbore floor drops .614 to .570 and each screw is cut to fit its own floor at assembly (rule 19), so the reach carries only the ±.005 cut and the .001 reading: .183 of tip reach against the .151 the uncut screw left, 1.03D of full thread once the 0.75P tip chamfer is deducted Owner exception confirmed 2026-11-01 (relayed by Main) at 1.16D. Owner ruling 2026-11-08 (Pedro), #2144 item 1.4: the recount charges the 0.75P tip chamfer, .162 MIN (1.03D), same geometry, shop-fixture load."
