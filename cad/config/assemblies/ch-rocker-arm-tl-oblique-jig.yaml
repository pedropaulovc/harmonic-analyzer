machinist_exceptions:
  - id: "RV-01"
    kind: "accept"
    where: "F1: two #4-40 X 3/4 FLANGED BHCS through the TL-27 feed nut's clearance holes into the integral feed block, 0.4 N·m, the nut keyed by the TL-VN-81 dowel"
    finding: "no mechanical lock on the feed nut screws under reversing nut torque (rule 23)"
    reason: "Main ruling 2026-11-03 on #2112 Codjiflo P1: positive dowel stop; friction claim dropped. The TL-VN-81 3/32 dowel, a slip fit in TL-27 and pressed into TL-32's lug, takes the nut's reversing torque (1.02 N·m at the 1161 N crank thrust) with margins of 19 or more in shear and in bearing on the brass and the 6061, so no turning load reaches the screws: a static clamp. At 0.4 N·m the two screws' preload (703 N each) alone exceeds that thrust, so the nut never lifts off the lug, and each flange's bearing on the brass (73 MPa) stays under its 17 ksi yield. The owner accepted the static clamp without washers for the bought nut's flange on 2026-10-19/20 and replaced that nut with the shop-made TL-27 on 2026-11-01 (item 4). The lug's taps and dowel hole are transfer-drilled through the seated nut at assembly (F1)."
  - id: "RV-03"
    kind: "accept"
    where: "step 8: the handwheel and KP08 set screws on leadscrew flats, locked with Loctite 222 (low-strength purple) threadlocker"
    finding: "set screws on a hand-cranked reversing shaft use threadlocker without a mechanical lock (rule 23)"
    reason: "Owner ruling 2026-10-18 retains bought low-strength threadlocker on each set screw; the shaft flats carry the hand-crank torque."
  - id: "RV-04"
    kind: "accept"
    where: "P2: the two 5/16-18 shoulder screws seated in block counterbores, Loctite 222 and 4.0 N·m"
    finding: "pivot shoulder screws use threadlocker without a separate mechanical thread lock (rule 23)"
    reason: "The owner-approved 2026-10-23 plain-pivot contract explicitly chooses Loctite 222 and torque. Each screw shoulder bottoms in its counterbore, leaving measured .002–.010 carrier running clearance; the head, thread, block and carriage form the positive lift-capture path. This is not whole-jig load certification."
  - id: "RV-05"
    kind: "accept"
    where: "Step 5: each M4 X 20 SHCS cut to its own counterbore floor height + .189, engaging .183-.195 of the HGH15CA carriage's M4 x 5"
    finding: "carriage screw full-thread engagement .162 min (4.12 mm, 1.03D; the tip reaches .183, less its 0.75P chamfer), under rule 18's 1.5D"
    reason: "The bought HGH15CA carriage's vendor M4 holes are 5 mm deep, so no M4 reaches 1.5D (6.0 mm). Owner ruling 2026-11-01, option A: the TL-22/TL-32 counterbore floor drops .614 to .570 and each screw is cut to fit its own floor at assembly (rule 19), so the reach carries only the ±.005 cut and the .001 reading: .183 of tip reach against the .151 the uncut screw left, 1.03D of full thread once the 0.75P tip chamfer is deducted Owner exception confirmed 2026-11-01 (relayed by Main) at 1.16D. Delegated ruling 2026-11-03 (Main), following the owner option-A ruling of 2026-11-01: the recount charges the 0.75P tip chamfer, .162 MIN (1.03D), same geometry, shop-fixture load; owner review #2144."
