      taper pin MHA-DT-09 crosses the hub and shaft behind the arm; removing it releases
      the matched arm/hub assembly for gear service. Simple punched witnesses on the
      arm and shaft dome aid re-alignment; they are not machined dimples.

      Rest pose (ch30 eight-views): the crank arm hangs straight down (−Y), the handle
      pivot 75 mm below the crankshaft axis with the grip axis parallel to the shaft.
- heading: Chapter 12 — Cone Gear Set (pp. 16–21)
  elements:
  - prose: 'Current chosen inch design (2026-10-08): 48DP PA20 cones/drum/alignment and normal-24DP PA20 crossed crank, with actual finite stock/custom cutter authority rather than ideal actual-count involutes. Historical photo measurements and prior reconstruction choices remain identified as such, not current cutting dimensions. T006 is cut by the custom DT6-FORM1 finite N6PA20 tool, option (a) (user ruling 2026-10-10): root R1.10, a drum-tip trochoid relief below the true-involute start, tool thickness 0.872 and blank Ø4.31, on the 1/32 in terminal journal. The cone centre is set at assembly on T120 (cone_set_stack); cones T012..T120 are accepted at nominal contact ratio >= 1.0 with no binding and no interference at the RSS corner (RSS contact ratio and arithmetic worst-corner interference are REF). T006 is pending exception ruling #971: relief >= 10 um clear of every drum-tip path, backlash >= 0.02, contact ratio REF (~0.77).'
