      Notes: brass frame holds the marker in a v-block; v-block on a square brass rod
      attached to the wire from the magnifying wheel (vertical motion); platen provides
      horizontal motion. Small set screw adjusts pen angle to paper to cut friction.
      Provenance (ch. 5 Preface): the original pen holder was missing — the one in all
      book photos is a modern replacement designed/built by Mike Harland and Tom
      Wilson. Model the replacement (it is what the photos document).

      Pen layout (machine coords, 2026-09 photo re-derive — build_pn_pen_assembly):
      pen rod vertical at x 3, z −157.0 band (rod z −159.5..−154.5), y 368..518,
      #47 wire hole at y 513 just above the hanger block top (511); the rod line
      sits 5.5 forward of the old −151.5 so the 45° block's paper-side corner
      (z −144.3) clears the paper front (−143.25). V-block origin (−9.73, 364,
      −155.59), yawed +45° about Y (its length runs forward + east): the rod bore
      (local x 10, z 8) on the rod axis with the rod 14 into it; marker in the
      bottom groove along the block length, axis 0.25 under the groove roof,
      nib at (−10.50, 364.25, −143.50) = 0.25 off the paper front at paper
      mid-height, barrel running 110 forward to (67.25, ., −221.25). Stirrup frame
      yawed −45° with its window round the block section (1.0 a side, top rail
      0.1 above the block top), 1.0 forward of the rod's front face; thumb screw
      stood on end (+X → +Y) on the frame's screw axis, knob outer face y 340,
      tip 0.25 under the marker. All carriage parts lock-mated to the rod; the
      rod's Y travel is the freed DOF.
