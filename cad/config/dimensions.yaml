      - - Cone shaft length
        - Selected nominal 209.790340373345 mm overall (shaft-local station of tip); dt_cone_gear_shaft_spec.SHAFT_LENGTH is the reader
        - '8.259'
        - 'Front end is cone station −61.906860997930, derived from POST_STATION, half the post cone-boss length and 1.0 mm journal proud. cone_line extends the pivot and block together by 8.0 mm: the retained 7.5 mm extension plus cone_shaft_land_bands.TIP_COLLAR_BODY_NORTH_SHIFT_MM = 0.50 mm, coupled to collar nose length, width and tap station. Current nominal block north face is cone station 154.446979375415, 5.575 mm south of the pivot; ADJUSTER_EMBED 7.77 (recentred for the Ø1/32 in terminal stub) and vn_cone_tip_adjuster_spec.CUP_DEPTH nominal 1.2065 place the model apex/tip at 147.883479375415. The flat tip seats on the cup wall, not its apex. These nominal source stations do not establish supplied-cup fit or full printed-band air. Former 209.390340373345, 208.890340373345, 205.390340373345, 201.390340373345 and 201.6406869456 mm lengths belong to earlier reconstructions.'
        - derived from current spec
