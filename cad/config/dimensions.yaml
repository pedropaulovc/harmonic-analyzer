      Notes: set is a sandwich — shiny brass gears alternating with black rough-finished
      connecting rods. Each rod rides the cam on the gear to its right; cam converts
      rotation to near-sinusoidal reciprocation of the rod → rocker arm. Notches aligned
      to top = cosine mode; rotated 90° = sine mode (pp. 66–67).

      M4 build (`build_cylinder_gear.py`): single non-configured part — 120T involute
      ring (cone-gear equation-curve technique, toothed-disc volume reproduces the
      cone gear's T120 configuration), integral cam boss (lobe +Y, toward the
      notch: the ch14 end views show the 0-crank tip row LEVEL at the TOP of the
      stroke — cos mode reads +1 at notch-up, so the lobe points up), plain bore
      through gear and cam, alignment notch near +Y. The book states only the notch
      **depth** (3 mm); the p.23 close-up labelled "notch" shows the mark as a thin
      saw **kerf cut between two teeth** — the real gears keep all 120 teeth, they are
      NOT missing one. So it is modeled as a 0.4 mm saw kerf, 3 mm deep, seated in the
      root **valley** nearest +Y (90° = 30·γ is a tooth crest at 120 T, so the kerf
      rides the adjacent valley at 90° + γ/2; flanking crests stay intact, removed
      solid ≈ 0.60 mm² → v_notch ≈ 1.8 mm³). This SUPERSEDES both the former 3 mm
      square (width estimated = depth, low) and the interim missing-tooth slit. The
      standalone `eccentric-cam` part (M2 legacy re-author) was removed -- the
      integral cam on the cylinder gear is the only cam geometry now built.

      **M6.2 keyway refutation (kinematic proof):** cylinder gear k turns k/80
      rev per crank (ch. 29 gear law) — every gear at a DIFFERENT speed — so the
      gears cannot be keyed to a common rotating shaft. The cylinder shaft is a
      stationary arbor; gears spin freely on plain bores. This also explains the
      ch. 25 setup pinion (turns all 20 gears as one only after the cone pivots
      out of engagement). The legacy `parameters.kcl` cam keyway (3.2 × 1.5) and
      matching shaft keyseat were legacy fiction — both removed in M6.2
      (`build_cylinder_gear.py`, `build_cylinder_gear_shaft.py`).

      ### Drive-train layout (M6.2, eight-views 0°/90° + ch. 12 p.18 top-down)

      Assembly frame: X = machine length (+ right when viewed from the front),
      Y up from base top face (absolute Y = value + 50.8), Z = depth (− front).
      Scales: front view bottom plate 2750 px / 457 mm = 6.02 px/mm; landmarks
      converted from 400 dpi eight-views extractions (`ch30_images/`).
      Eight-views calibrations (make_machine_grid.py): front p1 6.02 px/mm,
      x0_img 1634, base-top y_img 6580; back p5 6.143 px/mm, x0 1647, ybase
      6551, x mirrored (--xflip); side v3 (90°, camera WEST, −z left, M6.5)
      6.124 px/mm, z0 at x_img 1744.5, ybase 6569. Perspective: scale ratio ≈
      D/(D + depth), D ≈ 977 from the near base edge — far objects compress
      toward the horizon (e.g. the crank pedestal at x +122.3 reads at ratio
      0.736 in v3).

      **ch30 GT triangulation (2026-07-02).** The per-view scalings above are
      superseded for the DRIVE-TRAIN features by a full bundle adjustment over
      all 8 ch30 eight-views photos (annotated landmarks + tube-silhouette
      observations; `cad/scripts/diagnostics/triangulate_ch30_gt.py`, ground
      truth in `research/1-research-documentation/039-ch30-annotation-benchmark/
      ground_truth/`). Solved features (machine frame, ±1σ ≈ 1.5–2.7 mm):
      crank_sprocket (−122.84, 144.78, −189.10), cone_front (−127.00, 101.25,
      −123.07), cone_back (−81.03, 104.60, +101.83), pinion_front (−10.16,
      104.23, −144.07), pinion_back (−11.41, 106.71, +91.25), cyl_front
      (−51.93, 100.45, −89.66), cyl_back (−52.73, 105.24, +91.49). These drive
      the 2026-07-02 re-anchor rows below (drive height 104.8, crank above the
      64T, alignment pinion restored level-inboard).
