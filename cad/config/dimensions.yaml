      Notes: round brass rod lever; magnification set by a reeded (knurled) screw
      adjustment that moves the effective fulcrum/attachment point. Geometry
      constraint used in M2: output/input arm ratio = 4 at maximum setting (rod
      ends domed; both rods revolves with hemispherical caps).

      KINEMATICS (2026-07-04, engineerguy video 2/4 + 4/4): the rod does NOT
      spin in the bracket collar — it "extends from the pivoted summing bar"
      and pivots WITH it about the knife-edge ridge line (pre-mirror (15,
      984.834) after the 2026-08-02 rederive's −10.3 summing shift, along Z;
      the ~6 mm tip arc ≈ 1.6° of knife rock); the clamp
      position along the rod is the radius from THAT pivot, which is what the
      ≤4× adjustment really is. The bracket collar is a loose Ø6.2/Ø6 guide.

      DEPTH RE-ANCHOR (2026-07-04, ch30 p.4; window re-solved 2026-08-02 with
      the new casting): the side view shows the whole output line (fixture
      wire → wheel → rim wire → pen rod) as one PLUMB vertical at the machine
      front — the old z −85 (M6.4 low) hung the wire hook 50 behind the wheel
      plane (~8° lean, photo-refuted). Lever rod z −128.3 KEPT. The whole
      lever/clamp/rod/fixture chain rides the summing bar −10.3 (rod at
      LEVER_ROD_Y 979.7, ridge contact 984.834): the clamp thumb screw is
      shortened 12 → 11 under-head so its head top lands at y 998.7 — a 1.0
      margin below the casting underside 999.7 — and the new front rail
      (inner z −93, outer −131, band 999.7..1036.2) therefore imposes NO z
      bound (escaping past the outer face −131 would need lever rod
      z ≤ −136.25, infeasible vs the rim-duck floor −128.31). Surviving
      window: front column surface −127.95 (gap 0.6) .. rim-duck −128.31 ⇒
      z −128.3. Vertical rod z −134.8 (skew bore 6.5, top y 984.7), wire hook
      at (−150, 915.05, −137.95) tied under the fixture collar beside the
      rod; hub end z −142.77, yoke WIRE_END (63.324, 573.083, −142.77),
      YOKE_PLANE_OFFSET −0.0564; bracket arm machine −124.3..−70. The side plate
      now seats at the shifted lever front, z −76.2874..−73.1124; its former
      −81..−76.45 band was a stale pre-MECHANISM_Z_SHIFT front-face reference.
      Lever-wire straight
      rest run 362.731 → 352.813 (−9.918: the hook DROPS toward the fixed
      wheel, so the wire SHRINKS — the contract's "+10.3" was a sign slip).
      Derived from the plumb-line photo + wire clearance solve (≥0.25
      everywhere; a perfectly planar wire is impossible — the rim ring blocks
      it — so the wire leans ~0.8°, ducking behind the rim into the hub's
      back groove band). ch30 px measurement anchored on column pitch + GT
