        - PASS (footprint length; depth is a recorded design departure) — thicknesses photo-verify in M2
      - - summing-lever
        - none
        - UNVERIFIED — p.42–43 proportion check in M2
      - - rocker-arm-support ×3 → `fr-rocker-arm-support` ×1 (M6.12)
        - none
        - 'M6.3 refuted the legacy windowed square frame (184 wide); M6.9 PARTIALLY REINSTATED it — ch30 p008 (brightened) shows exactly that frame: north frustum + south upright + top/foot rails (ch. 14 layout table). The ×3 count stays refuted (ONE frame: two uprights; the legacy third instance at x ≈ 0 under the transgear is the pinion-bar/stud''s job). M6.12: the two-part split (rocker-arm-support frustum + a-frame upright) is unified into the single `fr-rocker-arm-support` casting'
      - - oscilating-arms
        - 'ch.14 re-read: the "12.5 mm width" was a misread (callout is 2.5 mm plate thickness)'
        - SUPERSEDED — re-authored as rocker-arm with corrected dims (`build_rocker_arm.py`)
      - - tube-frame
        - 'ch.6: frame column height 107 cm — legacy file measured 1016 mm (40"), CONTRADICTS the book'
        - 'RE-AUTHORED — `build_fr_tube_frame.py`; 2026-08-02 rederive: COLUMN_LENGTH 989.9 → 1014.0 (top y 1064.8 — the columns run +28.6 proud of the new rail top 1036.2 through the Ø25.5 boss bores, reconciling the book''s 107 cm with the ch30 stub reads), each stub closed by an integral spherical dome cap r 12.7 × h 3.3 from y 1061.5 — plain capped tops, NO nut, NO thread (user-corrected: the polished tops in top.png/ch30 p002 are pressed-in turned caps; supersedes the old "no stub above" read). Source: ch30 px measurement anchored on column pitch + GT rescale + ch19 closeups (2026-08-02 rederive), measured/med. OD REDERIVED Ø25.4 (1") from the ch30 8-views (M6.11): 4 quarter views isolate single columns, apparent width = OD × scale (scale fit from the ±197/±112 stations + azimuth, R² 0.94–0.99, cross-checked by the 460 mm base ~1500 px) → 7 reads = Ø23.8 ± 1.0, rounded to 1" stock; SUPERSEDES legacy Ø1.375" (~45% oversize). Wall kept legacy 0.12" → Ø19.3 bore. M4 fluting retired (M6.8: plain reflective columns)'
