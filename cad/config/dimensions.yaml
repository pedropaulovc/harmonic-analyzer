  - prose: |2

      Notes: single pinion — a long toothed drum, engaged via a small ball-handle
      lever, meshes the cylinder gear set and turns all 20 cylinder gears as one —
      used only during setup to align the 3 mm notches (top = cosine, 90° = sine)
      after pivoting the cone set out of engagement. Set the actual notch UP BY
      EYE, then apply the cone lock: the alignment drum has no index. Its authored
      home-clock gauge is not a readout datum or a cone-home/crank-index TE tare.
      The "small gear" visible on the lever arm in the p.68–69 photos is the
      drum's front end face, not a separate idler (`v4_pinion_018` recedes behind it).

      ### Alignment-pinion layout — RESTORED 2026-07-02 (ch30 GT), level-inboard

      The mechanism (32T zeroing drum + swing straps, pivot blocks, torque
      shaft, lift rod, lever, integral grip head and separate crossrod) is BACK in
      `build_dt_drive_train_assembly.py`, re-solved against the ch30 GT
      triangulation, then re-closed around the v2 post and the later raised-axis law. The 2026-06-18
      removal used a superseded pre-correction drum model and argued it could not
      thread the 12.56 mm channel between the rocker-support frustum and the
      64T — but the GT shows the drum never lived there: pinion_front/pinion_back
      triangulate its axis near machine x −10 to −11, y ~104–107. The x evidence
      establishes the level-inboard topology; the selected finite stock forms,
      common 4.732 mm raise, user-authoritative 32T count and U28 2.2425 mm
      parked tip gap now own the derived location. Current nominal layout in
      dimensions.yaml / the pure rig readers has axis (−17.116, 95.25), from
      X_DRUM plus drum radius 32.220, pinion radius 8.815 and parked gap 2.2425;
      former axis (−16.876, 90.518) / radii 32.279 and 8.996 were ideal-tooth
      lower-rig references. Drum z −70.389..+72.811 (143.2 face, all 20
      stations), integral steel arbor/head root z −130.689..+95.561,
      head/crossrod axis z −137.189, and separate MHA-DT-015 crossrod at +65°.
      Straps: 15 wide × 9 thick with R7.5 ends, plain (no cam relief), pivot
      (−13.152, 67.532), bore-to-bore c2c 28.0, parked at an 8.139° lean; the
      former pivot (−12.912, 62.8) belonged to the lower ideal-tooth rig. The swing
      rides the setup DOF (a freed operational DOF, its angle drive spec recorded
      in the DOF manifest; articulated by the mobility probe / motion drives).
      The selected stainless return spring (table row above) stands beside the back strap,
      foot on the base east of it, and presses the swing to the disengaged rest —
      parked-pose clearances asserted in `build_dt_drive_train_assembly`
      (`SPRING_*`). The engage path is the p.69 cam: the lift rod rides the
      blocks' other bores at (5.348, 69.692); former (5.588, 64.960) belonged
      to the lower ideal-tooth rig. Each strap tail carries a Ø4
      follower pin (table row above), bonded into its blind seat, that the
      rod's eccentric collar lifts. The collar is Ø14.6 with a 2.0 eccentricity
      and keeps a 2.100 thin-side wall. Current nominal parked surface gap is
      0.161; dimensions.yaml records −76.622° cam rotation, 1.928 mm engaged
      authority and 2.731 mm follower projection beyond contact. Former
      −80.813° / 1.760 / 2.623 results describe the earlier ideal-tooth rig.
      The assembly's CAM_* and segment-distance guards consume current readers;
      their presence is not an exercised-check claim. Current pitch-circle sum
      40.216667 plus 0.35 extension gives 40.566667. The drum is 32T 48DP PA20,
      pitch Ø16.933333 with finite-26T-form blank Ø17.63 / tips 17.61..17.63.
      Historical DP49.82 / Ø17.334 / C2C38.990010 and ideal-32T tip Ø17.991667
      describe prior reconstructions. Alignment is FITUP/zeroing duty: actual
      UNION must retain continuity/no-gap, positive backlash, root air at least
      0.20 and handover no larger than 0.005 mm across the whole retained centre
      range and all 16 manufacturing-profile pairs. Flank/flank coverage is
      diagnostic only, not contact ratio or a greater-than-1.1 alignment release
      criterion; neither pointwise contact samples nor supported branch span alone
      establish all-phase carrier-aware backlash, air or signed TE.


