- heading: Appendix C — Open items (must close before the milestone that needs them)
  elements:
  - prose: |2+

      The drive-train entries below preserve dated research/reconstruction history,
      not active cutting dimensions or current qualification. In particular, the
      DP30/PA14.5 inference in item 1, channel/incline arithmetic in item 3,
      old stack and 1/16 in terminal in items 6–7, and fixed-axis/ideal-helix
      studies in item 9 are superseded by the source-attributed Chapter 11–13/25
      rows above. Item 10 preserves restoration history, not current rig sizes.
      Historical observations and their original wording are retained below.

      1. **Gear module + pressure angle** (ch. 12/13/25) — **RESOLVED in M4 prep:
         DP 30 (m = 0.8467 mm), PA 14.5° (assumed, unchanged).** Two independent
         measurements converge: (a) p.18 macro (`12_…/page002_img07`, 7 mm-callout
         scale 16.57 px/mm): rim silhouette striations at 22.3 px are the interleaved
         near/far tooth serrations (half-pitch — the steel drive gear's visibly
         coarser teeth in `page002_img02` corroborate), so p = 44.6 px = 2.69 mm vs
         DP 30's 2.66 mm; (b) p.18 cone view (`page002_img04`, 150 mm-arrow scale
         ≈ 4.83 px/mm): largest cone gear OD ≈ 105 ± 5 mm vs DP 30's 103.3 mm
         (m = 0.8 → 97.6 marginal, m = 1.0 → 122 excluded). Clincher: DP 30 makes
         every key PD a round inch value — largest cone / cylinder gear 4.000",
         pinion 1.400". The photogrammetry cross-check (`195445871`) was abandoned:
         through-glass color cast + parallax made the nameplate unusable.
         NOTE: ch. 23 translational gearing looks coarser than DP 30 in the video
         frames (`v4_transgear_*`) — its module is a separate question, measure when
         authoring those parts.
      2. **Pinion tooth count** (ch. 25) — **32 teeth, user-authoritative
         correction 2026-09-22.** This supersedes the prior video-frame count;
         no historical photo justification overrides the corrected count.
      3. **Channel pitch** — **RESOLVED in M6: 7.5 mm along the cone axis,
         7.06 mm projected on the machine depth (Z)**, uniform with the gear
         stack (vertical connecting rods, no splay). Measured on all four p.28
         end-view strips (400 dpi extraction): arm-end tip pitch ≈ 60 px vs tip
         width ≈ 20 px = the 2.5 mm arm plate (annotated p.27) → pitch ≈ 3.0 ×
         2.5 = 7.5 mm. Self-consistent: 20 ends × 60 px ≈ 1140 px of the 1512 px
         strip. The 16 mm candidate is refuted.
         Z-projection refinement (M6.7 supersedes the M6.2/M6.6 readings):
         the 7.5 annotation's Z-projection 7.5 × cos(arcsin(2.54/7.5)) =
         7.0568 mm is the FRAME-LOCKED drum/channel grid — stack spans
         19 × 7.0568 ≈ 134.1 mm, ~2.8 mm air per side inside the gates'
         139.7 mm clear span (inner faces at Z = ±69.85). The cone-shaft
         incline then follows from exact tracking of perpendicular-seated
         gears (true cone, p.18): a gear square to the shaft contacts the
         parallel-axis drum via the tooth at the drum-facing azimuth, which
         sits r·sin θ along-shaft south of the gear centre, so the 20 mesh
         centres are collinear iff the radius step tracks per DRUM pitch:
         7.0568 sin θ = 2.54 → θ = arcsin(2.54/7.0568) = 21.0976° (the
         earlier arcsin(2.54/7.5) = 19.8° put the tracking on the wrong leg
         of the triangle — 0.44 mm/station z-drift, "most gears not
         meshing"; atan = 18.7° was doubly wrong). Along-shaft seat pitch
         7.0568 × cos θ = 6.5839 (forces the 6.5 face, ch. 12 rows). The
         incline lies in the HORIZONTAL plane: the cone sits beside the drum
         at the same height and converges on it toward the small end (ch. 12
         p.18 top-down photo; the eight-views side view shows the cone
         midline near-level) — see "Drive-train layout" in the ch. 13
         section. Cross-check: tan(cone half-angle) = 2.54/6.5839 = tan θ,
         so the cone's drum-side generator runs parallel to the drum axis —
         exactly the p.18 seam.
      4. **Rocker arm working length** — RE-RESOLVED in M6.3 (±114.3 symmetric),
         superseded by the ch.30 back-view seesaw read (11.5" top arc, see the
         ch. 14 table), rod pin RE-RESOLVED by the ch30 GT vertical-rod closure
         at +127.37, near the rod-side tip — see the ch. 14 "Rocker pivot &
         supports layout" table. M2's rod-at-tip read is thus partially
         vindicated (its asymmetric 100/70 profile stays refuted; the ch. 15
         "positive one side, negative the opposite side" argument constrains
         the AMPLITUDE-BAR feet, which do ride both sides of the pivot, not
         the rod).
      5. **Feature mapping of the 16 mm (ch. 14) and 32 mm (ch. 17) callouts** —
         ch. 14 16 mm RESOLVED in M2 = rocker arm end-face depth (see ch. 14
         table). ch. 17 32 mm RESOLVED in M2 = spring coil body length (ch. 17
         table, annotated high).
      6. **Cylinder-set axial budget** (ch. 13) — **RESOLVED in M6**: p.22
         stack macro (400 dpi) measures gear face / axial pitch = 190/497 px
         ≈ 0.38 → face 3.0 mm; budget per 7.5 mm channel = face 3.0 + cam 3.5
         (0.5 air per side in the 4.5 gap) with the 3.0 rod ring riding the cam
         (0.25 axial clearance per side). Legacy 10.2 cam thickness refuted;
         `build_cylinder_gear.py` updated (face 7 → 3, cam 10.16 → 3.5). The
         ch. 12 "7 mm" face callout applies to the CONE gears; the 2026-09-28
         touching-stack model uses 6.8887 ±0.025 per gear instead (ch. 12 face row).
      7. **Small cone gears cannot carry the 9.525 mm shaft bore** (ch. 12) —
         **RESOLVED: configured D-bore + stepped D-flat shaft.** The smallest
         gears need Ø1.5875 seats; T018 uses Ø3.175, T024 Ø6.35, and T030–T120
         Ø9.525. The shaft has one common-clock +X flat per gear land, with AF
         1.460/2.921/5.842/8.763 for increasing land diameter and +0/−0.010
         band. Each matching bore AF is +0.010/+0.020 above the shaft nominal
         (0.01–0.03 flat clearance); the round diametral slip fit is
         0.025–0.105. The 2026-09-28 user ruling replaces the former plain
         bore/air-gap interpretation with twenty 6.8887 ±0.025 gears touching
         in a 137.774 ±0.20 stack. The p.21 macro shows solder blobs on the
         small gears; D-flats are an intentional fidelity departure for
         alignment without adhesive. The configured bore drove the gear blank
         from a revolve to an extruded disc in the original parametric build.
      8. **Translational gearing fixed-reduction topology** (ch. 23) — found in
         M4c keyframe measurement: a small fine-tooth steel pinion (≈ Ø21 mm,
         est. 24T DP 30) rides coaxially with the 120T rack pinion
         (`v4_transgear_002/003/008`), but the frames do not show what it meshes,
         nor which shafts carry the two chain wheels vs the removable 12/18/24
         pair.
         **M6.8 topology resolution** (ch. 23 PDF + `v4_transgear_002/008/012`
         + ch30 p002 full-res): the stud carries the 96T disc + latch big hub;
         the KNOB SHAFT (latch small hub) carries the fine 24T pinion — it is
         NOT coaxial with the disc; the M4c read conflated the two shafts —
         plus a chain-wrapped removable; the crankshaft carries the second
         chain-wrapped removable. The bead chain rides the removables' m2
         teeth directly (no separate sprockets), which is how gear swaps
         change the platen ratio and why the latch slackens the chain.
         **Kinematic riddle CLOSED (paper-drive rework, 2026-07-07):** the
         two-centre-distance contradiction (engaged 51.0 vs measured rest
         66.05) was an artefact of the WRONG topology. The disc is 120T DP38
         (not 96T DP30), it never meshes the rack (the 12T DP30 feed pinion
         behind it does — 4/4 video: "behind and attached to the fourth gear
         is the fifth gear... twelve teeth and engages the rack"), and the
         latch arm's single c2c 44.766 IS the permanent 12T:120T mesh — the
         66.05 "rest" measurement was fitted against the disc-meshes-rack
         assumption. Unlatching tilts the WHOLE cluster away from the rack
         (v4_transgear 001 vs 011-013: the feed-pinion/rack mesh opens, the
         12T:120T mesh never does), and the arm swing about the stud provides
         chain slack for gear swaps. Modeled: the engaged state exactly; the
         tilt path is not modeled.
      9. **Crank-drive gear pair** (ch. 11/12) — found in M4c: the dark steel
         gear at the cone set's large end ("This gear engages the crank",
         p.20) implements the stated 4:1 crank→cone reduction together with a
         pinion on the crankshaft; neither part is in any legacy source. Teeth
         are visibly ~1.5–2× coarser than the train and not countable in the
         available photos. The 4:1 ratio fixes the 64T:16T tooth split.
         With cone-pivot-post-v2 fixed in world space, the 64T/cone stack
         recenters 33.115 mm along its unchanged bore. The resulting 39.735
         mm c2c fixes DP 25.7311 at 0.25 mm slack (64T PD 63.176, 16T PD
         15.794), superseding the intermediate DP24.74 layout.
         **M6.2 ratification — RESOLVED by the ch30 GT (2026-07-02):** the
         "broken" +55-derived vs +122-photo crank position was a false
         dichotomy. The old derivation assumed the 16T meshes the 64T
         HORIZONTALLY (crank on the drive line); the GT triangulates the crank
         axis at (−122.84, 144.78) — ABOVE the 64T, near-vertical mesh azimuth.
         That result explained the old model, but cone-pivot-post-v2 now
         overrides it with the physical cast-in axis; after the exact Ry180
         installation that axis is (−129.336, 129.850) and
         retires the 62.2-OD/equal-radius closure.
         **Engaged-mesh rederive (2026-07-14):** the near-vertical pose above
         initially shipped with a radial BACKOFF c2c 40.446 that left the tip
         circles 0.29 apart — the gears visibly did not mesh, refuted by the
         deeply-engaged pair in the ch12 p.18/p.19 photos. The pair is a
         crossed-axis mesh (crank machine-z — the GT axle-x matches the
         pedestal-x at both z stations, killing a cone-parallel crankshaft —
         vs the 12.52°-inclined 64T plane), and straight uniform teeth
         CANNOT engage across it (±1.08 mm lateral flank misregistration vs
         ≤0.70 available clearance — why the backoff existed). The 64T's
         teeth are now a TRUE 12.00° helix (exact-solid rederive at the
         recentered station with the straight 16T; one involute tooth
         boss-swept with twist, patterned — smooth helicoid flanks) + 0.15
         backlash + root relief on both. **V2 casting override (2026-07-24):**
         the exact rederived bores keep the drive line at y 90.518 and crank
         axis at (−129.336, 129.850), closing the DP25.7311 pair at c2c 39.735
         (0.25 design slack; #906 then cut both gears with one DP 26.306 normal
         cutter, leaving 0.423 reference slack). User ruling 2026-09-28
         restores that fixed crank axis and the unrelieved v36 post boss.
         The 64T keeps its south face on the unchanged 3.181 thrust collar
         and grows north to 7.2113 so it bears on T120 in the solid cone
         stack (user ruling 2026-09-28). The 16T teeth (grown to 11.6 north,
         user ruling 2026-09-30, then R9-55 and R9-56) sit 0.25 off the restored boss at z −70.210,
         so its south face is z −69.960. They run at full OD for the 8.5
         shoulder and are turned to Ø16.21 north of it: with every printed
         band, fit offset and axis pose at its worst the shoulder's axial air
         to T120 is −0.090 and the turned band's radial −0.116 (a named
         exception, user 2026-09-30, #1154; +0.12 / +0.11 RSS, +0.311 /
         +0.251 on the nominal axes), so the pair is checked on a 0.10
         feeler at fit-up with MHA-DT-010 and T120 pushed together, before the
         free-running revolution; each cut answers its own reading: the band
         is turned down to Ø15.78 MIN (still in 16T:64T contact wherever its
         reading can fail) only if the band stops the feeler, the shoulder
