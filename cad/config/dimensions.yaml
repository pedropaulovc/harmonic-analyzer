      Notes: speed combos — small driving + large driven = slowest platen (smallest
      horizontal scale), large+small = fastest, medium+medium = 1:1. Latch disengages
      gearing from the platen rack (quick reset; also slackens chain for swapping the
      removable gears). Pinions and sprockets are steel; disc and rack are brass.

      Current paper-drive topology retains the six gears established by the
      2026-07-07 video re-derivation: (1) crank T12 and (2) knob T24 removable
      ANSI #25 sprockets, connected by the selected fixed 66-link chain;
      (3) custom integral 15T 48DP PA20 knob-shaft pinion cut straight through
      its face with the finite stock #7/14T master; (4) 150T 48DP PA20 brass
      reducer disc cut with the finite stock #1/135T master, permanently
      meshing (3) at the physical 43.794 +0.050/-0 centre specified by
      `pd_rack_pinion_spec` and the mounted arm geometry (15:150 replaced
      12:120 under #2034; the ratio stays 1:10);
      (5) independent 12T 32DP PA20 feed sleeve cut with the stock #8/12T
      master; and (6) purchased SDP/SI A 1B12-Y324 32DP PA20 rack, cut to the
      platen length and soft-soldered to its brass backer.
      Knob-bearing and plate-screw stations follow the physical reducer
      centre; rack mounting height follows the finite feed contact law.
      Printed tangent spans control actual rigid master translations, not a
      generated profile-shift law. Unlatching swings the cluster away from
      the rack without changing the reducer centre distance.
      The historical 66.05 rest / 51.0 engaged riddle came from the refuted
      disc-meshes-rack interpretation; neither dimension defines this model.
      Net feed with T12/T24 mounted is 0.5 × (15/150) × π × 9.525 =
      1.496183501 mm per crank revolution (`paper_drive_geom`), −6.25% from
      the preceding DP30 feed law, 1.595929068 mm/rev; this paper-scale change
      is intentional, not compensated. The spare T18 lies loose on the base
      at machine (+160, 53.2, −75). No chain sprocket meshes a spur gear.
      The historical pitch measurements are retained in the source rows;
      the selected 48DP reducer and 32DP feed use actual stock-form cutters,
      not catalogue drop-in gears or a generated-profile-shift substitute.
      The measuring stick (ch. 16, hand tool) lies flat on the base at (−158, 53.8, −133),
      graduations up (M6.5).
