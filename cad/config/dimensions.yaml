      Notes: speed combos — small driving + large driven = slowest platen (smallest
      horizontal scale), large+small = fastest, medium+medium = 1:1. Latch disengages
      gearing from the platen rack (quick reset; also slackens chain for swapping the
      removable gears). Brass gears, central bores.

      Paper-drive rework notes (2026-07-07, FINAL topology — supersedes the M4c
      and M6.8 readings and CLOSES Appendix C #8): the six gears, per the 4/4
      video narration, are (1) the crank removable chain wheel (T12 mounted)
      and (2) the knob removable chain wheel (T24 mounted) — the roller chain
      rides their m2 teeth; (3) the 12T DP38 THIRD gear pinned on the knob
      shaft just behind the removable; (4) the 120T DP38 reducer disc on the
      stud, in PERMANENT mesh with (3) at c2c 44.766 — the latch arm pivots ON
      the stud, so this centre distance never changes and the old two-distance
      riddle (66.05 rest vs 51.0 engaged) dissolves: the measured 66.05 was a
      fit against the wrong disc-meshes-rack topology, and unlatching tilts
      the WHOLE cluster away from the rack (v4_transgear 001 vs 011-013);
      (5) the 12T DP30 FEED pinion locked coaxially behind the disc ("behind
      and attached to the fourth gear"), passing under the platen's bottom
      edge to mesh (6) the teeth-down rack. Net feed with T12/T24 mounted:
      0.5 × (12/120) × π × 10.16 = 1.596 mm per crank revolution. The spare
      removable (T18) lies loose on the base (machine (−160, 53.2, −15)). The
      mixed-pitch jam note (m2 vs DP 30/38) still bars any literal
      removable-on-gear mesh; it never happens in this topology. The measuring
      stick (ch. 16, hand tool) lies flat on the base at (−158, 53.8, −133),
      graduations up (M6.5).
