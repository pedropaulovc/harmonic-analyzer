      Notes: all 20 gears rotate together on one D-flat shaft. Their 6.8756 ±0.025
      faces touch from the collar-supported 64T to T006; accept the twenty-gear
      stack at 137.512 ±0.20. The MHA-DT-VN-54 set-screw collar is pushed onto a
      0.45 mm feeler against T006 and locked on the D-flat, for 0.35–0.55 mm
      stack end play. The separate block/cup sets shaft end play; current
      collar-to-block clearance belongs to the assembly's physical-air ledger.
      Engagement with cylinder gears is oblique (partial engagement → distinct
      wear). The four smallest gears (T006–T024) look "slightly more yellow …
      a different, perhaps harder metal" (p.21). A harder high-zinc yellow
      metal — Muntz metal (60/40 Cu-Zn) or manganese bronze — is a plausible
      interpretation, not a proven material; the model uses `muntz_yellow`.
      The p.21 macro shows solder blobs on the small gears, but the
      2026-09-28 user ruling chooses co-clocked D-flats and matching D-bores
      to align the gears without adhesive: a deliberate departure from that
      photographed detail. The cone set pivots out of engagement for sine/cosine
      alignment (ch. 25). Current tooth authority is the finite stock/custom
      tool form and its off-centre root arcs; no ideal-N upper continuation is
      permitted. The earlier ideal 6T involute was severely undercut at standard
      proportions and used stub-form gap floors in the previous builder.
      All 20 tooth counts are configurations T006..T120 of
      `dt-cone-gear.SLDPRT` with configured bores. The separate dark 64T
      beside T120 engages the crank (p.20). Tool authority alone is not
      manufacturing approval: current profile settings, actual3D UNION,
      handovers, signed TE and stock-budget disposition remain source-bound.
      Earlier modified ideal-profile studies refused 42/48/54T on their
      single-flank screen and other root/backlash cases; their T006 worst web
      0.35425 mm used the former 1/16 in terminal seat. Those are historical
      study observations, not current 1/32 in cutter-native results.
      Neither earlier green CAD integration nor the former U40 ruling
      qualifies the current family.
