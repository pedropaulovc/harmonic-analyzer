      Notes: round brass rod lever; magnification set by a reeded (knurled) screw
      adjustment that moves the effective fulcrum/attachment point. Geometry
      constraint used in M2: output/input arm ratio = 4 at maximum setting.
      The free rod tip remains domed; the bracket end is now flat and threaded.

      KINEMATICS (2026-07-04, engineerguy video 2/4 + 4/4): the rod does NOT
      spin about its bracket thread axis — it "extends from the pivoted summing bar"
      and pivots WITH it about the knife-edge ridge line (pre-mirror (15,
      984.834) after the 2026-08-02 rederive's −10.3 summing shift, along Z;
      the ~6 mm tip arc ≈ 1.6° of knife rock); the clamp
      position along the rod is the radius from THAT pivot, which is what the
      ≤4× adjustment really is. Screw the constant-diameter threaded end through
      the bracket to the native 1.25 tip projection; the full body has no shoulder.
      No locknut, set screw or adhesive is added to this non-rotating joint.

      DEPTH RE-ANCHOR (2026-07-04, ch30 p.4; window re-solved 2026-08-02 with
      the new casting; #1559 A1 2026-10-16): the side view shows the whole
      output line (fixture wire → wheel → rim wire → pen rod) as one PLUMB
      vertical at the machine front. Since #1559 the lever axis, clamp,
      vertical rod, fixture hook and the lever wire's drum end all lie in ONE
      plane z −173.51 (= the drum wire lane, PEN_Z_MID −162.5 − 11.01, in the
      pressed brass drum's middle), so the wire leaving the fixture and the rod
      axis are coplanar with the wheel's wire lane and the WIRE-1 yoke point
      sits on the wire's Top plane (no YokePlane offset). The bracket arm
      grows from 52 to 97 to reach it from the summing-lever face. The whole
      lever/clamp/rod/fixture chain rides the summing bar −10.3 (rod at
      LEVER_ROD_Y 979.7, ridge contact 984.834). The clamp is a vertical 1/2
      hex placed unrotated: its thumb screw (top) and the rod's threaded end
      (bottom) share the nominal CLAMP_X axis, with direct manufactured relative locations.
      The thumb screw's stock reach is derived from McMaster 91882A221; its tip is tangent to
      the lever top. The casting underside is y 999.7, and the screw head
      clears it without forcing the output line farther forward. The lever
      clears the front column face (z −124.7) by about 45.8. The vertical rod
      screws into the clamp and seats on its shoulder at y959.75 (thread tip
      y967.25, bottom dome y834.75); the fixture screw axis stays y919.7, with
      the hex body spanning approximately 913.3..926.1. Both thumb screws are
      installed backed out to tip/rod tangency so nominal CAD solids do not
      overlap.

      The fixture screw points toward the bracket, and the wire winds in
      the spigot groove then leaves its front tangent at screw-axis height.
      Its yaw about the vertical rod (+26.69°) is solved from the groove
      station and groove-root radius plus wire radius and 0.25 stand-off, so
      the hook lands at (139.98, 919.7, −173.51) in the rod plane. Hook X,
      yaw, wire length (354.683), drum tangent (clock 15.82°) and the yoke
      point are derived in cad/scripts/mg_output_fixture_geom.py and
      sh_vn_music_wire_lever_geom.py. The drawing-free route checks clearance behind
      the rim (6.61), spokes (8.61) and boss (4.10). The straight rest wire
      clears the fixture groove flanks, spigot and screw head numerically,
      and the farm assembly interference gate checks the installed solids.
      Wraps, tie-offs and wire compliance remain unmodeled.
