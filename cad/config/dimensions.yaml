        - 147 cm
        - '57.9'
        - photo callout p.3
        - annotated
        - high
      - - Frame column height
        - 107 cm
        - '42.1'
        - photo callout p.3
        - annotated
        - high
      - - Base length
        - 46 cm
        - '18.1'
        - photo callout p.3
        - annotated
        - high
      - - Base depth
        - 28 cm
        - '11.0'
        - photo callout p.3
        - annotated
        - high
      - - Weight
        - 69 kg
        - 152 lb
        - photo callout p.3
        - annotated
        - high
  - prose: |2

      Cross-validation: base 46 × 28 cm = 18.1" × 11.0" **confirms** legacy
      HarmonicBase.cs bottom plate 18.0" × 11.0" (within rounding of the cm callouts).
      DESIGN DEPARTURE (2026-09-15): the modelled base is 457.2 × 287.2 (pad
      444.5 × 274.5), i.e. +7.8 mm deeper than the 28 cm callout, so the four
      column sockets keep an equal land on both axes -- 5.5 mm to the 2026-09
      rim; since the user ruling of 2026-10-09 the rim is gone and each socket
      opens on the green land, 12.5 mm to the pad edge (the photographed
      11.0" plate leaves only 1.6 mm in Z at the ±112 column
      stations, which manufacturing tolerances could consume). The columns stay
      at the photographed stations; only the base plate grew. Source of truth:
      `cad/scripts/fr_harmonic_base_spec.py` (TOP_WIDTH derivation).
      The current inch-train cutover retains this centred footprint, not a new
      rear-only base extension. Its drive-train seats follow the live parked
      alignment pivot and cylinder-bank faces (`build_fr_harmonic_base`).
      `BLOCK_SCREW_XZ` reads `pinion_rig_park_geometry.PIVOT_X` and
      `pinion_rig_layout.BLOCK_SEAT_Z`; `FOOT_SCREW_XZ` reads that same pivot
      and `SPRING_PAD_Z`. Pedestal seats remain at X = −60.393602135 and
      Z = −90.518912220 / +92.061087780, through `PEDESTAL_SCREW_XZ`.
      The former block X = −21.412205567 / −4.412205567 and spring-foot
      X = −32.912205567 describe the earlier ideal-tooth parked rig; they are
      historical reconstruction coordinates, not current drilling inputs.
      Pivot, lock and stop seats follow `cone_line.PIVOT_XZ` and
      `dt_cone_swing_platform_geometry.swing_hardware_geometry`.
      Frame column 107 cm is the top-down anchor for tube-frame length; 147 − 107 =
      40 cm of counter-spring rod arc above the frame.
- heading: Chapter 26/29/8/9 — System-level facts (gear law, scale references)
  elements:
  - prose: ''
  - table:
      columns:
      - fact
      - value
      - source
      - method
      - confidence
      rows:
      - - Gear law
        - cylinder gear k turns k/80 rev per crank turn (k = 1…20)
        - ch.29 photo caption p.99
        - annotated
        - high
      - - Sample spacing
        - Δ = π/20 per 2 crank turns; 20 arms uniformly subdivide [0, π]
        - ch.29 p.99
        - annotated
        - high
      - - Cylinder gear speed ratio
        - gear n spins n× gear 1
        - ch.8 p.7
        - stated
        - high
      - - Nameplate
        - '100 × 55 mm, brass, 4 corner #4-40 brass fillister screws into blind taps in the base deck (2026-09-02: the model had holes but no screws), on base near platen'
        - ch.26 text p.70
        - stated
        - high
      - - Maker / date
        - Wm. Gaertner & Co., Chicago; built 1896–1923 (likely 1901–09)
        - ch.26
        - stated
        - high
  - prose: |2

      The nameplate's 100 mm width nearly fills the p.71 photo and appears in situ on
      the base in the p.70 photo — best photogrammetric ruler for the base/platen region.

      **Derived: cylinder gear tooth count = 120.** Cone does 1/4 rev per crank turn
      (ch.12); cone gear k has 6k teeth (ch.12); cylinder gear k rate = (1/4)·(6k/T) rev
      per crank = k/80 (ch.29) ⟹ T = 120 for all cylinder gears. Consequence: each
      cylinder gear has the same tooth count (and pitch diameter) as the largest cone
      gear — visually checkable against ch.13 photos. Confidence: high (pure arithmetic
      from three high-confidence facts).

      Chapters scanned with no dimensional content: 01–05, 07, 10, 27, 31. Ch.28
      (Michelson & Stratton 1898 paper, 80-element machine) gives no absolute
      dimensions; transferable facts: cone tooth counts proportional 1:2:…:n; sine⇄cosine
      shift = 90° quarter-turn of all eccentrics via one long pinion engaging all at once
      (matches ch.25); spring-summation balance y = Σx / [n(l/L + a/b)] with design rule
      "l/L and a/b as small as possible"; accuracy benchmark 0.65–0.7% of largest term.

      ---
