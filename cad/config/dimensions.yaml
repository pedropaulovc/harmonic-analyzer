        - 'Stepped from the front end: Ø12.2308 journal shaft-local 0–43.011; Ø15.875 integral thrust collar shaft-local 43.011–46.192218417631, supporting the 64T south face and defining the drawing length origin. Gear lands Ø9.525 / 6.35 / 3.175 / 0.79375 (terminal 1/32 in), with co-clocked +X flats, nominal AF 8.763 / 5.842 / 2.921 / 0.420, each +0/−0.010. Seat steps remain 1.0 mm south of the T030/T024/T018 north faces, at cone stations 100.519532647896 / 107.395144329776 / 114.270756011656. T012, T006 and the custom collar share the terminal land; its end follows SHAFT_LENGTH.'
