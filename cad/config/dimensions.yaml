      Notes: set is a sandwich — shiny brass gears alternating with black rough-finished
      connecting rods. Each rod rides the cam on the gear to its right; cam converts
      rotation to near-sinusoidal reciprocation of the rod → rocker arm. Notches aligned
      to top = cosine mode; rotated 90° = sine mode (pp. 66–67).

      The later 2026-10-20 owner ruling reduces the south disc enough to
      prevent interference, superseding same-gear OD. Use a full circular
      Ø55.0 C36000 brass disc at the existing ordinary .X ±0.8 band, not a
      relieved disc or a relocated drive. The original Ø64.44 intersects the
      64T gear's solid root and the engaged alignment-pinion drum.
      dt_cylinder_end_disc_clearance derives the reduced disc's arithmetic
      worst-case envelopes from the actual printed size limits, the 64T's
      chamfer-shortened bore support, T120 feeler/set and seat floats, tooth
      runout, compensated south datum and all disc tilt permitted by its bore.
      The 64T separating-plane air is 0.553834 mm, the engaged pinion's
      enclosing-sphere radial air 3.496162 mm; both exceed 0.10 running air
      plus 0.25 spare. Minimum projected retaining land beyond the farthest
      accepted rod-ring bore edge is 2.549601 mm. Covering the entire ring
      outer rim is neither required nor claimed; continuous axial capture is.
      All 20 cone gears share the drive axis: their maximum printed tip radius
      is 32.175 mm (T120), below the 64T's 35.570 mm maximum by 3.395 mm.
      The nearest cone's full-cylinder nominal axial gap is 1.928227 mm
      (T120), increasing northward for every smaller cone. This axial gap is
      not claimed at free-bore disc tilt; the radial separating plane is the
      controlling clearance proof.
      Before exporting the disc drawing, its native below-callout text is
      read back exactly: DRILL THRU selects the bore limits used above, and
      the thickness callout identifies the south bank datum. A failed write
      or mismatched readback refuses export rather than losing those facts.
      cylinder_bank_layout calls the pure owning-spec guard with its actual
      datum budget. Native assembly checks remain required, including an
      engaged-pinion sweep; a parked-pose interference result alone cannot
      certify that sweep. MHA-DT-00 sheet 15 carries native associative closed
      stack and north spring-gap settings; assembly steps 8 and 9C use them.

      Current build (`build_dt_cylinder_gear.py`): single non-configured custom
      120T 48DP PA20 gear/cam composite with a finite #2 / 55T-reference stock
      tooth rim, not the custom cone T120 solid. The integral cam lobe is +Y, toward the
      notch: the ch14 end views show the 0-crank tip row LEVEL at the TOP of the
      stroke — cos mode reads +1 at notch-up, so the lobe points up; plain bore
      through gear and cam, alignment notch near +Y. The book states only the notch
      **depth** (3 mm); the p.23 close-up labelled "notch" shows the mark as a thin
      saw **kerf cut between two teeth** — the real gears keep all 120 teeth, they are
      NOT missing one. The selected 0.4 mm-wide, 3 mm-deep saw kerf is placed by
      `dt_cylinder_gear_spec.NOTCH_PHASE_DEG` relative to the cam, preserving the
      physical cam/notch home lock rather than providing an arbitrary TE tare.
      The earlier ideal-tooth construction placed it at 90° + γ/2 because +Y
      was a crest at 120T; its ≈0.60 mm² removal / ≈1.8 mm³ notch volume is a
      historical CAD observation, not a current finite-tool volume result. The
      thin-valley reading superseded the earlier 3 mm square (width assumed
      equal to depth, low confidence) and interim missing-tooth slit. The
      standalone `eccentric-cam` part (M2 legacy re-author) was removed -- the
      integral cam on the cylinder gear is the only cam geometry now built.

      **M6.2 keyway refutation (kinematic proof):** cylinder gear k turns k/80
      rev per crank (ch. 29 gear law) — every gear at a DIFFERENT speed — so the
      gears cannot be keyed to a common rotating shaft. The cylinder shaft is a
      stationary arbor; gears spin freely on plain bores. This also explains the
      ch. 25 setup pinion (turns all 20 gears as one only after the cone pivots
      out of engagement). The legacy `parameters.kcl` cam keyway (3.2 × 1.5) and
      matching shaft keyseat were legacy fiction — both removed in M6.2
      (`build_dt_cylinder_gear.py`, `build_dt_cylinder_gear_shaft.py`).

      ### Drive-train layout (M6.2, eight-views 0°/90° + ch. 12 p.18 top-down)

