      Notes: single pinion — a long toothed drum, engaged via a small ball-handle
      lever, meshes the cylinder gear set and turns all 20 cylinder gears as one —
      used only during setup to align the 3 mm notches (top = cosine, 90° = sine)
      after pivoting the cone set out of engagement. The "small gear" visible on the
      lever arm in the p.68–69 photos is the drum's front end face, not a separate
      idler (video frame `v4_pinion_018` shows the drum receding behind it).

      ### Alignment-pinion layout — RESTORED 2026-07-02 (ch30 GT), level-inboard

      The mechanism (42T zeroing drum + swing straps, pivot blocks, torque
      shaft, lift rod, lever and tee handle) is BACK in
      `build_drive_train_assembly.py`, re-solved against the ch30 GT
      triangulation. The 2026-06-18 removal argued the Ø22.4 drum could not
      thread the 12.56 mm channel between the rocker-support frustum and the
      64T — but the GT shows the drum never lived there: pinion_front/pinion_back
      triangulate its axis at machine x −10.16/−11.41, y ~104–107 — LEVEL with
      the drive line and INBOARD of the cylinder drum (between drum and machine
      centreline), not in the frustum/64T channel at all. Modeled layout
      (`APINION_*` constants): axis at pre-mirror (+10.384, 104.8) =
      X_DRUM − (drum tip 31.10 + pinion tip 11.22 + 2.0 disengaged gap) — GT
      0.2σ with the config gap untouched; drum z −75.0..+68.2 (face 143.2,
      spans all 20 stations); front stub runs south to z −132 carrying the tee
      handle (hub at z −144.0 = the GT handle ball −144.07); back stub free end
      z +91.25 = GT pinion_back exactly. Straps: 18 wide (0.8× the 42T tip
      Ø22.4, `v4_pinion_018` — the teeth stand proud of both flanks), pivot
      y 62.8, bore-to-bore c2c 43.0, parked at a −12.38° west lean; the swing rides the torque shaft as
      the p2 setup DOF (a freed operational DOF, its angle drive spec recorded
      in the DOF manifest; articulated by the mobility probe / motion drives). The brass
      return spring (table row above) stands east of the back strap, foot on
      the base, and presses the swing west to the disengaged rest —
      parked-pose clearances asserted in `build_drive_train_assembly`
      (`SPRING_*`). The engage path (PR5) is the p.69 cam: the lift rod rides
      the blocks' WEST bores (`LIFT_X = PIVOT_X − 15`; it sat east through the
      DP40 cram, but an east lift swings the drum OUT of mesh), and each strap
      tail carries a Ø3 follower pin (table row above) the rod's radial cam
      pin lifts — parked gap 0.9, first touch at ~12° rod azimuth, engaged
      pose holdable at ~11°, tail-cap gouge excluded through the sweep, all
      asserted analytically (`CAM_*` + the segment-distance scan). At DP 49.82
      the drum is 42T Ø22.4 (same DP as the cylinder train it must mesh); the
      table above records the book-vintage DP 30 readings.


