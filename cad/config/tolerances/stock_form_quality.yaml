stock_form_quality:
  # Ordinary hobby-shop limits (Main ruling 2026-10-10, tolerance reset):
  # tooth-space runout, the projected reducer axis zone and the reducer
  # setup clock take the shop's ordinary turned runout, 0.05 mm (as
  # shaft_turned_runout_mm); the reducer centre and knob core/journal are
  # sized to that TIR. Pinion index stays 0.010 (about 0.1 deg at these
  # radii, held by a dividing head). The measurement uncertainties are
  # internal method constants and are never printed.
  toothspace_runout_tir_mm: 0.050
  reducer_position_diameter_mm: 0.050
  shaft_turned_runout_mm: 0.050
  reducer_axis_projected_zone_diameter_mm: 0.050
  arm_opposite_face_parallelism_mm: 0.005
  recording_paper_width_deviation_mm: 0.100
  recording_paper_left_inset_deviation_mm: 0.100
  recording_pen_x_deviation_mm: 0.100
  # Purchased-rack index and assembled face lead share the feed mesh's
  # opposite-flank budget: while two pairs touch (CR 1.245-1.318) the
  # second pair's clearance is the set datum backlash (0.12 MIN) less the
  # other lateral terms (form 0.025 + pinion index 0.010 + cocking 0.0046
  # + tilt 0.0001 = 0.0397), leaving 0.080 for rack index + face lead.
  # Index 0.055 holds SDP/SI's published rack accuracy (Gears.pdf p. 1-190:
  # tooth-to-tooth .0005 in, total accumulated .002 in = 0.051 mm); the
  # 0.025 lead takes the rest. Contact continuity is not binding: the
  # 0.245 overlap of the 2.343 base pitch tolerates 0.61 mm of index.
  rack_pitch_index_deviation_mm: 0.055
  rack_flank_constraint_deviation_mm: 0.025
  # Source closing/projection outer gives0.2724567 mm native root air.
  # Keep the0.25 mm floor: this inclusive MAX pays indicator U0.002;
  # reject measured intrusion above0.018. Conditional, not supplier accuracy.
  rack_root_material_intrusion_mm: 0.020
  rack_working_side_angle_deviation_deg: 2.0
  rack_flank_secant_minimum_height_mm: 0.800
  purchased_rack_working_side_form_model_premise: PURCHASED_RACK_32DP_PA20_STRAIGHT_SMOOTH_WORKING_SIDE_FORM
  pinion_pitch_index_deviation_mm: 0.010
  rack_face_lead_deviation_mm: 0.025
  pitch_index_measurement_uncertainty_mm: 0.002
  wire_measurement_uncertainty_mm: 0.005
  rack_face_width_max_mm: 4.800
  rack_stock_height_max_mm: 4.800
  reducer_setup_clock_deviation_mm: 0.050
  receiving_allocation_status: provisional
  note: "Conditional inspection/rejection controls, not supplier accuracy, an AGMA class or hardware qualification. Receiving-allocation release is the explicit receiving_allocation_status field. Pay actual calibration, common datum, wire geometry, orientation and thermal uncertainty in addition to the source micrometer/indicator floors. Full rack material still uses both signed X-intercepts, all usable gaps and the whole face in one independent material/end XY datum; complete point/root envelopes require justified whole-material process or functional evidence. The named standard-manufactured straight/smooth WORKING-SIDE form is a MODEL premise at the native-gear form level, not a local-normal certificate inferred from samples. Back its angle control with the SAME physical wire and diameter at both measured heights: the common radius offset cancels under that premise. Pay both centre-coordinate readings and require the entire secant-angle enclosure inside the source band. Crest, root and birth/edge cones are not made working sides and remain independently enclosed. Root intrusion is subtracted from actual root air, never from its required floor. Incoming intrinsic lead belongs to rack form; separate lead controls assembled rigid face/axis misalignment. Tooth-space TIR refers to the running journal/bore; indicate and lock the disc as a matched cluster against the feed running bore. Coupled reamed dowels locate the plate; screws clamp only. Position is diametral; retain actual projected gear/wheel planes and opposite-arm-face payment. Rack/support asset height uses one captured loaded axis datum; later pivot/journal motion, tilted sections and service cock are separately paid. Stock height/face width and paper/media/nib bands remain independent. Introduced paper error after ONE held initial zero is a NAMED DETERMINISTIC term in the total coefficient-error budget, never operator-index credit. Knob transfer alone is not crank qualification. Only unchanged chain polygon/link pitch is inherited; introduced geometry/gravity/slack/fit-induced chain phase remains paid."
