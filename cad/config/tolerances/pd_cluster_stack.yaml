pd_cluster_stack:
  # The knob train's printed lengths ahead of the disc cluster (the arm-plate
  # hub face station, the thrust ring and the knob pinion's face width) print
  # at this band; transgear_cluster_fit owns the closed-form stack. The disc
  # cluster's own end float is shimmed at assembly (owner ruling 2026-11-01,
  # #2124), so its inch lengths carry their own bands.
  printed_length_band_mm: 0.02
