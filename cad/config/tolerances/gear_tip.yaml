gear_tip:                # (upper, lower) diametral deviations, native on the tip OD
  standard_band_mm: [0.0, -0.1016]  # .0000/-.0040 in
  contact_critical_band_mm: [0.0, -0.02]
  note: "Functional fit/process tip grades, not AGMA accuracy classes or an ideal-CR allocation. Contact-critical retains the 0.02 mm diametral grade only for the 12T knob-shaft pinion: its 12T:120T reducer contact ratio at nominal centre is 1.207 against the 1.2 floor (1.191 at -0.05). The 32T alignment, 120T cylinder and 12T feed pinion tips take standard; every gate of theirs passes at -0.10. Finite stock support pays both printed tip and retained thickness/depth limits. Alignment is a fit-up mesh: actual supported-union continuity, positive backlash and root air must pass the whole booked centre stack; smooth-flank span is reported, not gated at >1.1. Operating meshes and absolute zero TE have separate source-owned gates. See tolerance-policy.md."

