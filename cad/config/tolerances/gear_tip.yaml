gear_tip:                # (upper, lower) diametral deviations, native on the tip OD
  standard_band_mm: [0.0, -0.1016]  # .0000/-.0040 in
  contact_critical_band_mm: [0.0, -0.0381]  # .0000/-.0015 in
  note: "Functional fit/process tip grades, not AGMA accuracy classes or an ideal-CR allocation. Contact-critical, .0015 in (0.0381 mm) diametral, is kept only for the 15T knob-shaft pinion (MHA-PD-08): owner ruling 2026-11-24, audit part 2 question C3, \"Yes, O.D. +0/-.0015.\" and \"Print +0/-.0015 as ruled; the gate is read at three places (1.100 passes).\" Its 15T:150T contact ratio is 1.284 at the nominal centre (floor 1.2) and 1.0997, read 1.100, at the runout extreme at the set band's top (floor 1.1). The 32T alignment, 120T cylinder and 12T feed pinion tips take standard; every gate of theirs passes at -0.10. Finite stock support pays both printed tip and retained thickness/depth limits. Alignment is a fit-up mesh: actual supported-union continuity, positive backlash and root air must pass the whole booked centre stack; smooth-flank span is reported, not gated at >1.1. Operating meshes and absolute zero TE have separate source-owned gates. See tolerance-policy.md."

