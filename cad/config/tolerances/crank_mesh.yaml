  note: "Current crossed crank uses normal 24DP PA20, finite 14T stock form for the straight 16T pinion, and finite 55T normal stock form for the right-hand 64T helix. Beta follows the configured cone incline; current post/station and centre derive their source readers. The preceding 43.524321 mm centre with 0.30 mm extension is not a stock-form certificate; functional actual3D station selection remains pending. Selected standard-root translations and actual base-tangent span controls replace the former ideal 0.15-mm geometry-thinning knob. The 64T is thinned -0.050/-0.200 mm about its standard-depth thickness and modelled at -0.050; the 16T retains +0/-0.020. The retained tooth-cutting setup TIR is0.05 mm on EACH gear about its finished bore: radial eccentricity E is at most TIR/2 =0.025 mm for each16T and64T, so the pair radial cutting-setup allowance is0.05 mm. This is a process-setting limit, not an AGMA class, cutter-form accuracy claim or new geometric FCF; both gear specs own their actual source read. Actual blank, root envelope, process corners and phase follow the cutter-native spec and qualification readers; no unsupported upper-flank continuation is allowed. Main requires actual3D UNION functional coverage at least0.62 over the whole booked stack including opening, with supported finite corner/edge contact included; flank/flank coverage is diagnostic only. This is non-contact-ratio functional coverage, not an ideal involute CR claim, and signed TE must pay the existing budget. Historical ideal-profile nine-phase results were0.304345..0.310839 mm nominal backlash, seed−1.78 degrees, window−2.794590..−0.758457 degrees, +0.015729 mm worst closing backlash and0.717076 worst-opening normal-section contact ratio against the former0.62 screen. Those are OLD-PROFILE NONCERTIFYING reproduction evidence, not a certificate for the selected stock-form pair. Earlier12.00-degree /7.2113-mm-face /−1.49-degree values describe the still older tooth system."

