cone_drum_oblique_mesh:  # the inclined cone partial engagement
  # The engaged centre is SET AT ASSEMBLY (user ruling 2026-10-10): pedestal screws
  #   snug-loose, swing in on shims at T012 and T120 so the arbor aligns to the cone
  #   line, tighten the pedestals, then set T120 with a radial tip-to-root feeler at
  #   the standard clearance + edge_slack and lock the cone-lock-knob (MHA-VN-013).
  #   The other cones follow the swing rotation. cone_set_stack books the centres;
  #   dt_mesh_checks gates nominal CR >= 1.0 and no binding/interference at the RSS
  #   corner (RSS CR reported). The swing stop (MHA-VN-015) only limits the disengaged swing.
  edge_slack_mm: 0.20               # T120 feeler set point over standard; the CAD placement
  set_feeler_reading_mm: 0.0254     # one 0.001-in feeler leaf step
  pivot_bore_band_mm: [0.015, 0.0]  # platform pivot bore, reamed 6.35 H7 on the stock shoulder
  pivot_seat_position_mm: 0.05      # base pivot seat to the arbor-pedestal seats, one setup
  tooth_cutting_runout_tir_mm: 0.05 # per gear (each cone and the drum) about its finished bore
  note: "oblique partial engagement; centre set at assembly on T120 (cone_set_stack)"

