# Setup-picture findings known on main, admitted by the render gate until fixed.
#
# prechips_traveler.py measures every plan picture on the hobby sheet it has just
# rendered (cad/scripts/picture_clip.py, Arial metrics: the font the PDF prints in)
# and refuses the render on a finding this file does not list, or on a listed one
# that no longer occurs. The list only shrinks: fix a picture, render it, and
# delete the entries the render reports fixed. Never add an entry to pass a
# render; a new finding is fixed in the picture.
#
# Each entry: kind | the picture's whole alt text (" (picture N)", its 1-based
# place on the sheet, appended when two pictures on the sheet share it) | the
# text clipped or crossed ("a / b" for two overlapping texts). Entries count:
# a finding occurring twice in one picture is listed twice. Recorded from
# 52b3709d61 with main db73d3fde2 merged, every enrolled plan rendered on prechips 0.11.53, 2026-11-26:
# 58 findings (58 LEADER) on 26 plans.

