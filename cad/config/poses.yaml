# Saved ASSEMBLY POSE CONFIGURATIONS (2026-09-02).
#
# Default is the photographed ch15 p.30 amplitude-bar fan. Its per-channel
# stations live in channels.yaml because they are the build pose, not a saved
# override. The parallel configuration drives every amplitude bar to the common
# zero station. The sinusoid keeps those Default stations while turning the
# rocker/cam train to the ch14 p.28 middle end view.
#
# A pose configuration never changes the mechanism geometry: the build authors
# every freed operational DOF's drive from the DOF manifest as a permanent
# `POSE_<key>` mate, SUPPRESSED in Default and UNSUPPRESSED in each saved
# configuration with the value listed here. Each pose resolves its own
# exact-length cosmetic spring bank so both spring eyes remain on their fixed
# plate hook and moving lever endpoint; the other banks stay suppressed.
source: ch15 p.30 (page001_img01, the fanned Default bank) + ch14 p.28 end views (0 / 6 / 14 / 40 cranks)
confidence: low
notes: >
  The photographed Default amplitudes are a linear ramp because the individual
  graduations are not readable; channels.yaml owns those interpreted stations.
  Parallel-bank is the explicit all-zero comparison state. Sinusoid-6-cranks
  retains each Default amplitude while cylinder gear k stands at
  360 * 6 * k / 80 deg from notch-up (gear law, ch29). Each bar's flat notch
  roof rides the turned arc on its lower corner, so the build solves the
  configuration-specific foot radius and follows it with the lever and spring.

parallel:
  configuration: parallel-bank
  target_amplitude_mm: 0.0

sinusoid:
  configuration: sinusoid-6-cranks
  crank_turns: 6
