# Saved ASSEMBLY POSE CONFIGURATIONS (2026-09-02, user directive: the amplitude-bar
# fan and the rocker-arm sinusoidal setup are separate SolidWorks configurations
# of the built assemblies; Default stays the ch30 eight-view rest pose).
#
# A pose configuration never changes geometry: the build authors every freed
# operational DOF's drive from the DOF manifest as a PERMANENT `POSE_<key>` mate,
# SUPPRESSED in Default (so the shipped Default stays the free kinematic model
# the gates prove) and UNSUPPRESSED in the pose configuration with the value
# listed here. The cosmetic channel-spring bank is re-posed rigidly per
# configuration (its length variants are Default's -- see the fan note below).
source: ch15 p.30 (page001_img01, the fanned bank) + ch14 p.28 end views (0 / 6 / 14 / 40 cranks)
confidence: low
notes: >
  Fan amplitudes are a linear ramp across the channels (the p.30 plate shows the
  bars leaning progressively, tops together at the levers); the exact per-channel
  values are not readable, so the ramp tops out at the square preset's 79.375 mm (3-1/8 in).
  The sinusoid pose is the ch14 p.28 middle end view: 6 crank turns, so cylinder
  gear k stands at 360 * 6 * k / 80 deg from notch-up (gear law, ch29).

amplitude_fan:
  configuration: amplitude-fan
  # a_j for channel j = 0..19 (mm along the rocker arc from the pivot, +X lifting side)
  amplitude_mm: [0.0, 4.1776, 8.3553, 12.5329, 16.7105, 20.8882, 25.0658, 29.2434,
                 33.4211, 37.5987, 41.7763, 45.9539, 50.1316, 54.3092, 58.4868,
                 62.6645, 66.8421, 71.0197, 75.1974, 79.375]

sinusoid:
  configuration: sinusoid-6-cranks
  crank_turns: 6
