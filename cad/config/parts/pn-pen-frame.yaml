pn-pen-frame:
  number: MHA-PN-01
  material: C36000 free-machining brass
  tolerance_class: machined_block
  process: "machined (brass)"
  material_specification: "C36000 free-machining brass"
  finish: as machined
  quantity: 1
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "bottom view, TAP 4-40 UNC THRU located .16 in the .31 depth: the wall from the thread to the far face, stated by the native .074 MIN TAP WALL dimension (TapWallMin@TapWallReference)"
      finding: "far-side tap wall .074 in at the printed worst case (depth .30, station .17, #4-40 major .1120), under the .080 in target and over the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (MHA-PN-01 thumb-screw tap wall .074). No geometry escape: rule 17 forbids tightening the location band to protect the wall and FRAME_DEPTH can't grow (carriage fit leaves 0.016 mm); the station prints at the title block's .XX (.16) and the sheet states the worst-case wall as a model-owned single limit, never as note text (pn_pen_frame_spec.TAP_WALL_MIN_MM, which refuses anything under the .060 floor)"
    - id: "RV-02"
      kind: "accept"
      where: "the thumb-screw tap's native Hole Wizard callout only: its drill-diameter variable (hw-tapdrldia or hw-thrutapdrldia as carried by the callout), written to 3 decimal places at drawing time from draw_pn_pen_frame.TAP_DRILL_PLACES through _drawing_hole_callout.set_hole_callout_precision (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes hole callout precision at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Delegated ruling 2026-11-02 (Main), carried from pn-pen-rod RV-02: drawing-side ICalloutLengthVariable precision is the established merged pattern. Native experiment run 20261102T230110877Z: part-authored Hole Wizard precision did not reach the callout (read -1, the document default). Owner review #2144. This accepts no other precision, band, callout or package departure."
