dt-cone-tip-gear:
  title: Cone Tip Gear
  number: MHA-DT-37
  description: "CONE TIP GEAR, T006, INTEGRAL SPIGOT AND PIVOT"
  material: Brass
  # The four cone-tip gears are the harder high-zinc yellow metal of the
  # source machine (dimensions.yaml ch.12 p.21), the cone family's
  # material_tip_specification (dt_cone_tip_gear_spec checks they agree).
  material_specification: C67500 manganese bronze
  finish: AS MACHINED, UNCOATED
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "turned between centres from bar, steady support for the Ø.0625 x .76 spigot (L/D 12); integral Ø.0625 pivot; gear cutting: six leaves, 48DP PA20, with the DT6-FORM1 custom fly cutter at standard depth"
  drawing_unit: in
  # T006 left the MHA-DT-03 family for its own part (owner decision C1 keyed,
  # 2026-11-09, PR #1992, https://github.com/pedropaulovc/harmonic-analyzer/pull/1992):
  # its spigot is bonded through T012 and T018 into the MHA-DT-04 socket, its
  # pivot carries the bonded MHA-DT-38 bushing (#2469) and runs in the MHA-DT-39 end
  # screw. Its leaves are the family's T006: the custom DT6-FORM1 N6 PA20 tool,
  # option (a) (user ruling 2026-10-10): root R1.10 with a drum-tip trochoid
  # relief; it is the named contact-ratio exception (dt_cone_gear_spec,
  # test_standard_mesh_checks). The R1.491 tool with root MIN 2.346 is retired.
  # MHA-DT-03's RV-01 (the .031 D-bore) and RV-04 (T006's .0256 bore web)
  # retired with the bore: the stems are integral, under the root envelope.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheet 1: the tip Ø.1696 +.0000/-.0008 on the side view and the CIRCULAR TOOTH THICKNESS .0343 +.0000/-.0016 on the front view, each flagged SEE NOTE 2 (accept over pins, then by the feel set with MHA-DT-12 at assembly)"
      finding: "the two T006 tooth bands are converted millimetre widths, not plain inch steps, and narrower than their shop-table rows (rule 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 9.3 (fan-out OQ-3: keep, with routes), recorded as MHA-DT-03 RV-05 and carried here unchanged when T006 became MHA-DT-37 (owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992), C1 keyed). The bands are the custom DT6-FORM1 tooth's (dt_cone_gear_spec CUSTOM_SIX_*): widening the thickness to -.0020 fails the spec's tip-land minimum, and the over-pins then assembly acceptance in note 2 is the fit route; since the owner's by-feel direction of 2026-11-11 (#2365) that assembly acceptance is the MHA-DT-00 check 4 feel set, and GEAR DATA carries the backlash as REF (route wording only, bands unchanged: delegated 2026-11-12, ConeFeel2584 for Main, #2586). Accepts the notation and width of these two T006 bands only, no other band or callout departure."
    - id: "RV-02"
      kind: "accept"
      where: "sheet 1: the gear face width's nominal .2934, printed at four places with its .002 band (FaceWidth; dt_cone_tip_gear_spec.FACE_WIDTH is the MHA-DT-03 family's)"
      finding: "a four-place nominal off the .001 grid (rule 3)"
      reason: "Owner ruling 2026-11-20 (Pedro, triage of 2026-11-19, #2631): 'Follow recommendations unless noted otherwise', accepting the recommendation 'Exempt closure (RV row): no geometry change, sheet text only'. The face is the 20-gear stack closure, dt_cone_gear_spec.FACE_WIDTH = SEAT_PITCH floored to four millimetre places (7.4528 mm), shared by MHA-DT-03 (its RV-08); .293 would re-key the cone stack closure and every cone gear. Accepts this nominal's four places only, no other band or callout departure."
    - id: "RV-03"
      kind: "accept"
      where: "sheet 1: the spigot Ø.0625 -.0003/-.0013 (SpigotDia, BONDED FIT, LOCTITE 638 / SEE NOTE 4) and the pivot Ø.0625 -.0003/-.0013 (PivotDia, BONDED AND RUNNING FIT / SEE NOTE 1), each with its clearances REF in notes 1 and 4"
      finding: "two .0010-wide bands on turned diameters, narrower than the shop's turned-diameter row (±.001, .0020 total), printed as bands (rule 4, form 4) although each stem's mates are reamed holes that could be tried"
      reason: "D50 as amended, delegated ruling 2026-11-26 (Main), no precedent; owner review #2144: owner form timed out. Accepted as a band narrower than the shop's turned-diameter row, reached by finishing passes and a stone to the 0-1 in micrometer (reads .0001: the band is ten graduations), not by cutting to a number. Both ends are necessary: the top .0622 keeps .0003 bond clearance in the .0625 reamed holes, never line to line where LOCTITE 638 is wiped off (#2530); the bottom .0612 is the loosest either stem may be: the pivot one thou looser fails dt_cone_tip_air C-02 (step 23's look rejects an in-print build, 0.2550 mm against 0.2667 mm; necessity N-03), and the spigot sets how far an uncorrected T012 sits off its drum, which only MHA-DT-00 check 5C's running test accepts (owner ruling 2026-11-24 C5): read on its own part it is 1.0068 at the .0018 bond and 0.9384 one thou looser, under the cone set's 1.0 floor, so more gears would hesitate and be re-bonded (necessity N-04). Form 2 (each stem turned to its holes) cannot be accepted: the pivot's two holes cannot be fitted with the .001-step Class ZZ pins and a clearance maximum cannot be found by trying a fixed-reamer hole (D47 withdrawn, Codjiflo r2 on #3689). Accepts these two bands only, no other band or callout departure."
