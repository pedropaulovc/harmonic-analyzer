ch-rocker-arm-tl-oblique-base-bar:
  title: Rocker Oblique Trammel Base Bar
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-20
  description: "BASE BAR"
  # The bar only carries tapped rail holes, counterbored clearance holes and
  # hold-down slots, keeps its stock width and is faced to .47 on both large
  # faces (owner ruling 2026-10-30, the seats): no grade or temper
  # is functional, so the title block names the aluminium flat-bar family
  # (rule 2; machinist review ENFORCE); OnlineMetals 17666 6061-T6511 is the
  # source, the widest listed bar that fits the 6 in vise's stock hard jaws.
  material: ALUMINUM FLAT BAR 1/2 x 5-1/2 in
  material_specification: Aluminum flat bar (e.g. 6061-T6 or 6082-T6; OnlineMetals 17666 6061-T6511), 1/2 x 5-1/2 in; width as supplied, both large faces faced to .47
  finish: as machined
  quantity: 2
  tolerance_class: machined_block
  process: "saw and face to length; face both large faces to thickness; drill and tap the seven #8-32 rail holes through; drill the eight #8 bracket holes through and counterbore them from the underside; mill the two hold-down slots through; break edges"
  drawing_unit: in
