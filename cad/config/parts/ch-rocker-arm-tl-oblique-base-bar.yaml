ch-rocker-arm-tl-oblique-base-bar:
  title: Rocker Oblique Trammel Base Bar
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-20
  description: "BASE BAR"
  # The bar only carries tapped rail holes, counterbored clearance holes and
  # hold-down slots, is faced to .47 on both large faces (owner ruling
  # 2026-10-30, the seats) and milled to 5.50 wide on edge in the vise, no
  # bandsaw rip (owner ruling #2083): no grade or temper is functional, so
  # the title block names the aluminium flat-bar family (rule 2; machinist
  # review ENFORCE); the owned OnlineMetals 1173 6061-T6511 1/2 x 6 bar is
  # the source. The title-block cell holds one line, so the material names
  # the bar it is cut from; the milled 5.50 width prints on the sheet.
  material: ALUMINUM FLAT BAR 1/2 x 6 in
  material_specification: Aluminum flat bar milled from 1/2 x 6 in (e.g. 6061-T6511, owned OnlineMetals 1173); both large faces faced to .47, width milled to 5.50
  finish: as machined
  quantity: 2
  # One native model, one Number, two named members (oblique simplification
  # PR2): Bar1 under rail 1 carries the TL-28 end-bracket holes; Bar2 under
  # rail 2 is the same bar without them, turned over.
  default_configuration: Bar1
  configuration_quantities:
    Bar1: 1
    Bar2: 1
  tolerance_class: machined_block
  process: "saw and face to length; face both large faces to thickness; mill to width on edge in the vise (no bandsaw rip); drill and tap the eight #8-32 rail holes through; bar 1 only: drill the four #12 bracket holes through and counterbore them from the underside; mill the two hold-down slots through; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view: RailHoles station references and BracketHoles vendor-mating station dimensions"
      finding: "metric vendor-mating hole stations print in millimetres on an inch sheet, beside inch dimensions from the same left end"
      reason: "owner ruling 2026-11-01 (ruling 4B), relayed by Main: controlled interfaces to the metric-only KP08, HGR15 and Tr8 vendor lines retain exact millimetres, the mm unit label and their applicable explicit mm bands rather than rounded inch conversions (drawing-simplicity-policy.md, supplier-unit exception). Owner ruling 2026-11-08 (Pedro), #2144 item 13.1 supersedes the former independent rail-station bands: rail positions are untoleranced REF, transferred from the actual trimmed rail to its paired base bar and accepted by free screw insertion with rail ends flush to base-bar ends. This records the existing rulings, not a new waiver."
    - id: "RV-02"
      kind: "minor"
      where: "end view: the Ra 125 seat label SEATS ON PM-30MV MILL TABLE (SHOP EQUIPMENT) (sheet 1 underside, sheet 2 top face)"
      finding: "the mill-table seat names the PM-30MV mill table, shop equipment with no MHA drawing number (rule 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.3. Follows the FoDtFab1 Q2 dividing-head pattern (PM BS-0 DIVIDING HEAD named as shop equipment, no new identity): the PM-30MV is the shop's mill (cad/process/shop/inventory.toml machines.PM-30MV), not a project part, so its table takes no drawing number. The rail seat on the other face keeps its drawing number (TL-VN-83), and both faced seats stay per owner ruling 2026-10-30. This accepts no other mate, finish or package departure."
    - id: "RV-03"
      kind: "minor"
      where: "sheets 1 and 2: title blocks (one DWG. NO. MHA-CH-06-TL-20 on both sheets), the isometric captions BASE BAR 1, END BRACKET HOLES and BASE BAR 2, NO BRACKET HOLES, and the sheet 1 bracket-hole callout line BAR 1 ONLY"
      finding: "bar 1 (bracket holes, rail seat on the front face) and bar 2 (no bracket holes, seat faces swapped) print one drawing number, so a callout that uses only the number cannot say which bar it means"
      reason: "Coordinator decision (Main) under the owner's jig-simplicity ruling 2026-11-13. The owner was asked whether to use dash numbers, and the question timed out 2026-11-14, so the default was taken; the owner may revert to dash numbers (TL-20-1 / TL-20-2). This is a shop fixture: one native model, one number by design, with Bar1 and Bar2 configurations, QTY 1 each. The sheets tell the two bars apart by the captions BASE BAR 1 / BASE BAR 2 and the BAR 1 ONLY bracket-hole line. This accepts no other identity, mate or package departure."
  drawing_unit: in
