ch-rocker-arm-tl-oblique-base-bar:
  title: Rocker Oblique Trammel Base Bar
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-20
  description: "BASE BAR"
  # The bar only carries tapped rail holes, counterbored clearance holes and
  # hold-down slots, is faced to .47 on both large faces (owner ruling
  # 2026-10-30, the seats) and milled to 5.50 wide on edge in the vise, no
  # bandsaw rip (owner ruling #2083): no grade or temper is functional, so
  # the title block names the aluminium flat-bar family (rule 2; machinist
  # review ENFORCE); the owned OnlineMetals 1173 6061-T6511 1/2 x 6 bar is
  # the source. The title-block cell holds one line, so the material names
  # the bar it is cut from; the milled 5.50 width prints on the sheet.
  material: ALUMINUM FLAT BAR 1/2 x 6 in
  material_specification: Aluminum flat bar milled from 1/2 x 6 in (e.g. 6061-T6511, owned OnlineMetals 1173); both large faces faced to .47, width milled to 5.50
  finish: as machined
  quantity: 2
  tolerance_class: machined_block
  process: "saw and face to length; face both large faces to thickness; mill to width on edge in the vise (no bandsaw rip); drill and tap the eight #8-32 rail holes through; drill the eight #8 bracket holes through and counterbore them from the underside; mill the two hold-down slots through; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view: RailHoles station references and BracketHoles vendor-mating station dimensions"
      finding: "metric vendor-mating hole stations print in millimetres on an inch sheet, beside inch dimensions from the same left end"
      reason: "owner ruling 2026-11-01 (ruling 4B), relayed by Main: controlled interfaces to the metric-only KP08, HGR15 and Tr8 vendor lines retain exact millimetres, the mm unit label and their applicable explicit mm bands rather than rounded inch conversions (drawing-simplicity-policy.md, supplier-unit exception). Main's owner-delegated R4 ruling of 2026-11-07 supersedes the former independent rail-station bands: rail positions are untoleranced REF, transferred from the actual trimmed rail to its paired base bar and accepted by free screw insertion with rail ends flush to base-bar ends. This records the existing rulings, not a new waiver."
  drawing_unit: in
