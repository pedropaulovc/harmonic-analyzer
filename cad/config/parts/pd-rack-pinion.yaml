pd-rack-pinion:
  title: Reducer Disc
  number: MHA-PD-06
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  drawing_unit: in
  # Selected stock cutter: TTC 10-289-481, 48DP PA20 #1 (135T to rack), observed
  # in Travers' catalogue 2026-10-27 (#2034):
  # https://www.travers.com/product/ttc-10-289-481-involute-style-gear-cutter-10-289-481
  # StockForm uses the lower-count 135T master; no generated profile-shift model.
  # Verified cutter body OD 44.45 mm and arbor bore 22.225 mm; grind depth/form
  # accuracy are unpublished. The 2.25-module master depth is Main's design premise.
  process: "blank from 1/8 x 4 C360 flat, bore reamed with the .501 reamer (to order) and the MHA-PD-17 spigot turned to it; 150T 48DP PA20 teeth cut with stock #1 form cutter (135T master) on the shop-made arbor between two backing discs (shop-equipment.toml fixtures.pd-rack-pinion-cutting-arbor), with radial setting and tooth-span limits from the part specification; indicate the disc to the actual feed running-bore datum before transferring, drilling and tapping the #0-80 holes at assembly; inspect assembled tooth-space runout and the retained matched reducer clock"
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore, read with the Ø.040 pin in 12 spaces, every 12th or 13th"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore, measured with a calibrated pin, is the owner gear-tooth critical class; the assembled running datum is the feed pinion bore (owner-accepted). Owner ruling 2026-11-20 (Pedro), #2665, in his words: \"Follow recommendations unless noted otherwise\"; the recommendation he accepted: \"12 spaces plus the OD check; once-a-turn runout is caught by any evenly spaced sample.\" Owner ruling 2026-11-21 (Pedro), #2665: \"the MHA-PD-06 part sheet changes to 12 spaces too, so the sheet agrees with the accepted 12-space check\""
    - id: "RV-03"
      kind: "minor"
      where: "the #0-80 taps' note 2, its last sentence: WALL .064 MIN TO BORE (the front-face web; the rear .069)"
      finding: "tap-to-bore web below the .080 target at the finished worst case (rules 17, 20)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 3.1: the Ø.75 bolt circle, the Ø.504 bore and the .063 web are confirmed (first ruled by Main 2026-11-04 on #2167, option A, and 2026-11-07, Q-PD06-1 option B; the owner's thin-wall band .060-.080: DT-35 .060, DT-08 .0602, #989; RV-04 on MHA-PD-18, #1379; RV-01 on MHA-PD-11, #2124). The taps transfer from the MHA-PD-17 flange's Ø.75 bolt circle; a Ø.78 circle restores .080 but moves the hub's holes and grows its flange from Ø1.05 to Ø1.08. The bore opens from Ø.501 to Ø.504 so MHA-PD-00 can set the disc central, which costs the web .003 (the bore's radius and the disc's float on the spigot while the taps are spotted). The .0826 unbroken worst web pays the bore's .015 front chamfer leg and the tap's .004 mouth break and lands at .0636. Since #2412 (2026-11-12) the bore takes the stock .5010 chucking reamer (tools.reamer-5010, to order) over a Ø.498 spigot, which returned .0015 to the web. The bore now prints that reamer's size with no band and the MHA-PD-17 spigot, made in this shop, is turned to it: its size prints REF and its clearance in the bore, .003-.005, is the requirement (drawing-guidelines rule 4, form 2). With the reamer taken to cut +.002/0 (pd_rack_pinion_spec.BORE_BAND) the web is .0830 unbroken, .0640 at the front face (pd_rack_pinion_spec.TAP_WALL_TEXT prints .064), .069 at the rear: over the .063 the owner confirmed, and a wall between the .060 floor and the .080 target is advisory (rule 20)."
