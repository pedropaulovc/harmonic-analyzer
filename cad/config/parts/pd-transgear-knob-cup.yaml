  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): face both ends and ream the bore through; cup/journal spring-pin hole match-drilled at assembly with the cup set on the specified end-float feeler"
