      reason: "Owner ruling 2026-11-20 (Pedro), #2192, in his words: \"A\" (accept as a thin-wall minor in the #989 band, print the wall MIN). The hole's centre is drilled .120 from the front face at the MHA-PD-00 step, printed at three places (+/-.005); .120 less .005, the largest .065 hole's .0325 radius and the title block's .010 break on the front face's edges leaves .0725, between the .060 floor and the .080 target. Same band as the .0655-.073 walls accepted 2026-11-08 under #2144 (MHA-PD-12 RV-01, MHA-PD-10 RV-03/RV-04)"
