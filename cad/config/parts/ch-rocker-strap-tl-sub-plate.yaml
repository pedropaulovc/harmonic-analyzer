ch-rocker-strap-tl-sub-plate:
  title: Rocker Strap Sub-Plate
  # Shop tooling: the parent MHA-CH-13 Number plus -TL-nn (subsystem-identities.md).
  # 2026-11-17 owner ask: the strap's work holder, with its fence and end stop
  # milled integral with the plate (the top is milled down around them). Its
  # model frame is the strap programs' G54: X0 the end-stop face, Y0 the fence
  # face, Z0 the plate top the strap's tape lies on (cad/process/ch_rocker_strap).
  number: MHA-CH-13-TL-01
  material: 6061-T6511 ALUMINUM
  material_specification: 6061-T6511 aluminum flat, 1/2 x 6 in, ASTM B221
  # Stock: owned OnlineMetals 1173, 1/2 x 6 in 6061-T6511 extruded flat
  # (shop-equipment.toml fixtures.strap-sub-plate).
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "saw one 13 in length from the owned 1/2 x 6 in 6061-T6511 flat and mill a 3.00 in strip off it; CNC: mill both long edges for the vise jaws, face the top, then in one vise setup mill the plate top (Z0) down around the integral fence and end stop, their faces (Y0, X0), the fence notches, the clamp pockets and the hub counterbore; spot, drill and hand-tap the 4-40 and 10-32 holes; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the 10-32 UNF-2B THRU hole below the hub counterbore"
      finding: "thread engagement in the .23 in of plate under the counterbore, the figure the owner accepted; derived from it: .21 in of full thread nominal (1.11D) and .186 at the worst case of the printed bands, the counterbore's depth at its Hole Wizard .XX (.18 MIN, .97D floored), after the title block's .010 edge break at both tap mouths, short of 1.5D (.29 in) in aluminum (rule 18)"
      reason: "Owner ruling 2026-11-17 (Pedro): \"Use a 1/4-20 hub screw. The .23 in of thread in the 6061 plate is accepted: the screw only snugs the strap during the outline.\" Owner ruling 2026-11-23: \"change the screw to #10-32. The sub-plate's tapped hole becomes #10-32 and the plug's bore .201 (#7 drill).\" The accepted .23 in of plate is unchanged; the worst-case full thread derived from it is .186 (.97D floored; the 1/4-20 had .76D), restated from an agent's 1.01D worked with the wrong band (#3622): delegated ruling 2026-11-26 (Main), precedent: owner RV-01 2026-11-17 (.23 in of thread accepted); owner review #2144 (D55)."
