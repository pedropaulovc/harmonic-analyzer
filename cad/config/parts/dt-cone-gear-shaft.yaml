dt-cone-gear-shaft:
  title: Cone Gear Shaft
  number: MHA-DT-04
  material: AISI 1018 cold-finished steel shafting
  material_specification: ASTM A108 1018
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "turned stepped shaft with integral bearing journal and thrust collar (steel); 5/8 in cold-finished round bar, collar OD as supplied"
  drawing_unit: in
  # Owner decision 2026-11-09, C1 keyed (PR #1992): lands 3 and 4 are gone,
  # land 2 is round and ends inside T024's bore with a reamed socket for
  # MHA-DT-37's spigot; no D-flat remains on the shaft. Retired with that
  # decision: RV-01 (the slender .031 terminal land, its D-flat and its
  # CORNERS .001 MAX) and RV-02 (the tailstock note). The rulings they rested
  # on are superseded by C1 keyed: U40 2026-09-23 (integral .031 tip land
  # turned with tailstock support) and 2026-09-28 ("one flat per gear land;
  # no keys, no solder, no retaining compound; no gear bonded"). RV-03 keeps
  # the journal only: no across-flat band remains.
  machinist_exceptions:
    - id: "RV-03"
      kind: "accept"
      where: "sheet 1, the journal Ø.4825 +.0000/-.0008 (RUNNING FIT, MATCHED TO MHA-DT-05 BORE); land 1's keyed section A-A and the socket's reamed Ø.0625 +.0005/-.0000 are out of scope (owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): plain inch-step bands)"
      finding: "-.0008 is a converted millimetre band (0.02 mm), not a plain inch step, and narrower than the turned-diameter row (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (F1, F2, F5): the band comes from the fleet-shared constant _fit_shaft_h.SHAFT_H, kept as is with the matched-fit route printed at the feature; the shared constant is restated at the next re-key of the cone shaft family. Re-scoped by owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): the tip land and the across-flats it also covered are gone"
