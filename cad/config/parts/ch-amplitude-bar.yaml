ch-amplitude-bar:
  number: MHA-CH-01
  # Any cold-finished low-carbon 1/4 in square bar (1018, 1020, 12L14): no
  # fit, plating or load needs one grade (machinist review, rule 2).
  material: "LOW-CARBON STEEL CF, 1/4 in sq"
  material_specification: low-carbon cold-finished steel, 1/4 in sq
  # Owner ruling 2026-11-14 (Pedro, #2342): "polished bare steel, oiled, no
  # plating", as the original's bars (ch15 p.32 photos; 1898 predates chromium
  # plating). The as-supplied CF faces are buffed bright, which takes off no
  # measurable stock, so the wall MINs computed on the narrowest stock hold
  # (RV-05, RV-06); the oil covers the whole bar, notches and pin hole too.
  finish: "CF faces buffed bright; oil all over; no plating"
  quantity: 20
  tolerance_class: machined_block
  fit_class: sliding_amplitude_bar_on_rocker
  process: "machined (steel); as-supplied 1/4 CF square (bows about .013 over 31.82) straightened or selected to the MHA-CH-00 straightness check"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the two notch-centring ledge bands, .073 ±.002 in DETAIL A and .063 ±.002 in DETAIL B"
      finding: "tight ledge bands over-specified on centred notches (rules 4, 5)"
      reason: "each ledge band is what holds the far cheek wall the notch-width callout states; at the title-block .XXX band (±.005) the top notch's cheek thins further under the .060 floor and the foot notch's falls to it with nothing in hand (owner-accepted: keep the bands)"
    - id: "RV-03"
      kind: "accept"
      where: "the three-place TopPinX location .125 under HOLE WALL .078 MIN"
      finding: "three-place pin-hole location over-specified (rule 4)"
      reason: "the tight location holds the reamed pin hole's wall to the nearer depth face at .078 on the narrowest stock, at the largest hole a bonded pin is accepted in (RV-06); a looser band lets the wall fall further under the .080 target, to .073 at .XX (owner-accepted: keep the band)"
    - id: "RV-04"
      kind: "minor"
      where: "the CHEEK WALL .052 MIN line under the top notch-width callout (RUNNING FIT on the lever)"
      finding: "top notch cheek wall below the .080 in target and the .060 floor (rules 17, 20)"
      reason: "the book's 1/4 square bar straddles the .118 lever, so its cheeks cannot reach the target; approved floor 1.17 mm (.046) MIN at the top notch, stated as a plain fact at its width: .052 on the inch print (owner-ruled shortfall, 2026-10-15). The foot notch, .104 on the .098 rocker strap (#3114), now leaves its cheek over the floor (RV-05)"
    - id: "RV-05"
      kind: "minor"
      where: "DETAIL B, the notch-centring ledge .063 ±.002 (the near cheek); DETAIL A, the ledge .073 ±.002 (the near cheek) and the CHEEK WALL .063 MIN line under the foot notch-width callout (RUNNING FIT on the rocker; the far cheek)"
      finding: "notch cheeks below the .080 in target at the worst case: top near cheek .061 at the ledge's printed lower limit, foot near cheek .071, foot far cheek .063 (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. each notch is its plate at maximum material plus the running floor (.124 on the .118 lever, .104 on the .098 rocker strap, #3114), centred on the 1/4 square stock, so the top ledge is .063 and its ±.002 band leaves .061 MIN, the foot ledge is .073 and leaves .071 MIN, and the foot's far cheek beside its widest notch on the narrowest stock is .063 MIN, all above the .060 floor"
    - id: "RV-06"
      kind: "minor"
      where: "VIEW C (the right side of DETAIL B), TopPinX .125 with its HOLE WALL .078 MIN callout"
      finding: "reamed pin-hole wall to the far depth face .078 at the worst case, below the .080 in target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. Restated for owner ruling 2026-11-24, fit audit question 3 (the hole reamed .0775 with no band, a pin that enters by hand bonded instead of the bar scrapped): the largest hole accepted is the one the .079 pin of the .061-.500 set does not enter (delegated ruling 2026-11-24 (Main), no precedent, #2144 (rulings.md D13): a single limit, one pin of the owned .001-step set; .0005 looser than the audit's .0785, which the set does not hold; sh_vn_pivot_pin_spec BOND_HOLE_MAX), mid-depth in the 1/4 square stock (+.000/-.002), located .125 ±.005 from the back face, so the far wall is .078 MIN on the narrowest stock (.0785), above the .060 floor; the hole stays on the stock's centre that the bar's mid-plane mates and the pin press contract read"
    - id: "RV-08"
      kind: "accept"
      where: "VIEW C, the pivot-pin hole Ø.0775 REAM THRU, SEE NOTE 1 (the MHA-SH-VN-58 pin does not enter by hand)"
      finding: "the reamer size is not a 64th or .001 over or under one, so the hole needs a reamer bought for this size (rule 4 form 3)"
      reason: "Owner ruling 2026-11-24, fit audit question 3, approved as recommended (option A, \"as asked\"): \"May the .0775 holes print no band and be accepted by the pin itself (it presses in, it does not enter by hand), with a pin that does enter by hand bonded with LOCTITE 641 instead of the bar or rod being scrapped?\"; the audit's answer keeps the reamer (\"The .0775 reamer ($22.72) stays.\"). Accepts this hole's .0775 reamer size only; the hole still prints no band and the pin is its gauge."
