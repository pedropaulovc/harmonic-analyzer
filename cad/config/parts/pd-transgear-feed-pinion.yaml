pd-transgear-feed-pinion:
  title: Feed Pinion Sleeve
  number: MHA-PD-10
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: SAE 1018 CF bar, ASTM A108-24
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  drawing_unit: in
  # The independent 12T 32DP feed uses the finite lower-count #8/12T stock master,
  # not the reducer's 48DP cutter and not a generated positive profile shift.
  # Precise/Penn 10-289-328: 32DP PA20 #8, body OD 57.15 mm, arbor bore 25.4 mm.
  # https://www.penntoolco.com/precise-20-involute-h-s-s-gear-cutter-8-diametral-pitch-32-cutter-diameter-2-1-4-hole-size-1/
  # Ground depth/form accuracy are unpublished; 2.25-module depth is Main's premise.
  process: "turned from bar; integral 12T 32DP PA20 teeth cut with stock #8 form cutter (12T master), with radial setting, tooth-span and all-space angular-index acceptance from the part specification; flat milled"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the step-face squareness frame to the bore (datum A)"
      finding: "squareness frame over-specified (rule 5)"
      reason: "owner-accepted disc-cluster control keeping the step square to its bore"
    - id: "RV-02"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore, measured with a calibrated pin in each space, is the owner gear-tooth critical class (owner-accepted)"
    - id: "RV-03"
      kind: "minor"
      where: "the D-FLAT WALL TO BORE .072 MIN. note (VIEW E D-flat .138 ±.002 from axis against the Ø.126 REAM THRU bore)"
      finding: "D-flat wall to bore below the .080 in target (rules 17, 20)"
      reason: "The flat, a milled step located from the bore axis, takes the shop's ±.002 row (#2409, machinist reviews r4 and r5), and the printed MIN is .072: the wall is .0725 at the worst case along the part, .1360 flat less the .0635 radius of the largest bore the .1260 reamer is modelled to cut (owner ruling 2026-11-24, fit audit part 2: \"question 5 in the audit's full form (disc .005 back, pin +0/-.0005, bores +.001) both go ahead\"; it was .07275 at a bore of .1265; pd_transgear_feed_pinion_spec.FLAT_WALL_WORST and FLAT_WALL_NOTE). A wall between the .060 floor and the .080 target is advisory (rule 20). It replaces owner ruling 2026-11-08 (Pedro), #2144 item 3.4 (.073 MIN at the 0/-.001 row) and owner ruling 2026-10-27 (#1378), which accepted .0741 (.074 MIN) for #290's contract fits (.138 flat F11, .125 bore F3). The local wall where the title block's .010 bore-mouth and flat/nose breaks meet at the nose face, accepted then at ~.054, is .0525 with the flat and the .1270 modelled bore (FLAT_WALL_WORST less both .010 breaks), .00165 thinner: accepted as it is (Main, by the owner's delegation of 2026-11-24, D8: \"MHA-PD-10 RV-03 nose-face wall .00165 thinner than the ~.054 of 2026-10-27: accepted.\")"
    - id: "RV-04"
      kind: "minor"
      where: "the boss wall between the (Ø.313) boss, turned to the MHA-PD-17 bore, and the Ø.126 bore at the nose face"
      finding: "boss wall below the .080 in target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1378): accept as is. Re-sized for #290 (boss .313 +.0005/.0000); restated by owner ruling 2026-11-24 (Pedro), fit audit question 5: \"Yes: restate RV-04 to .0730 and build the full form.\" .3130/2 less .1270/2 (the largest bore the .1260 reamer is modelled to cut) is .0930; less the .010 OD and bore edge breaks the worst wall is .0730, between the .060 floor and the .080 target (it was .0733 at a bore of .1265; first ruled at 1.638 mm, .0645)"
    - id: "RV-06"
      kind: "accept"
      where: "the end view's SPAN 2 TEETH .1523/.1515 limits, MATCHED FIT, SEE GEAR DATA"
      finding: "span limits .0008 apart read as a converted millimetre band, not a plain inch step (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144; pending owner confirmation (L3): the limits are the stock #8 cutter's 2-tooth tangent span over its +/-.0004 radial-setting window, widened by the profile's geometry bound and rounded outward to .0001 (pd_transgear_feed_pinion_spec.SPAN_LIMITS); the manufactured tooth profiles the feed-rack mesh check reads are derived back from these printed limits, so a .001 step would pass spans outside the setting window the mesh is proved over. The span is a matched fit: MHA-PD-00 sets the mesh depth to the actual teeth at assembly and accepts it on function (GEAR DATA row, #2416)"
    - id: "RV-07"
      kind: "accept"
      where: "VIEW C's .543 max. row, GAP RUN-OUT ON BOSS / PARTIAL DEPTH TO STEP ALLOWED"
      finding: "GAP RUN-OUT read as a private phrase, or as the geometric runout tolerance (rule 26)"
      reason: "owner ruling 2026-11-20 (#2423), in his words: \"A\" (the option put to him: restate the witnesses in product terms, print only: 'CUTTER RUN-OUT' -> 'GAP RUN-OUT ON BOSS', plus a short partial-depth line; no method words). The second row says ALLOWED because the ruling's ACCEPTED is a word the sheet may not print (#3137)"
