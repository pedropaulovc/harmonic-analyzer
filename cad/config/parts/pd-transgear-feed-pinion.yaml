pd-transgear-feed-pinion:
  title: Feed Pinion Sleeve
  number: MHA-PD-10
  material: SAE 1018 CF bar, ASTM A108-24
  material_specification: SAE 1018 CF bar, ASTM A108-24
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  # The independent 12T 32DP feed uses the finite lower-count #8/12T stock master,
  # not the reducer's 48DP cutter and not a generated positive profile shift.
  # Precise/Penn 10-289-328: 32DP PA20 #8, body OD 57.15 mm, arbor bore 25.4 mm.
  # https://www.penntoolco.com/precise-20-involute-h-s-s-gear-cutter-8-diametral-pitch-32-cutter-diameter-2-1-4-hole-size-1/
  # Ground depth/form accuracy are unpublished; 2.25-module depth is Main's premise.
  process: "turned from bar; integral 12T 32DP PA20 teeth cut with stock #8 form cutter (12T master), with radial setting, tooth-span and all-space angular-index acceptance from the part specification; flat milled"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the step-face squareness frame to the bore (datum A)"
      finding: "squareness frame over-specified (rule 5)"
      reason: "owner-accepted disc-cluster control keeping the step square to its bore"
    - id: "RV-02"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore, measured with a calibrated pin in each space, is the owner gear-tooth critical class (owner-accepted)"
    - id: "RV-03"
      kind: "minor"
      where: "the D-FLAT WALL TO BORE 1.52 MIN. note (Section B-B D-flat 3.500 0/-0.015 from axis against the Ø3.900 REAM THRU bore)"
      finding: "D-flat wall to bore below the 2.0 mm target (rules 17, 20)"
      reason: "owner ruling 2026-10-27 (#1378): accept as is; keep the geometry and the printed 1.52 MIN. The wall is 1.527 at the worst case along the part (3.485 flat less the 1.958 bore radius); the local ~1.03 where the title block's 0.25 bore-mouth and flat/nose breaks meet at the nose face is accepted"
    - id: "RV-04"
      kind: "minor"
      where: "the boss wall between the Ø8.200 boss and the Ø3.900 bore at the nose face"
      finding: "boss wall below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1378): accept as is. 8.191/2 less 3.916/2 is 2.138; less the 0.25 OD and bore edge breaks the worst wall is 1.638, between the 1.5 floor and the 2.0 target"
    - id: "RV-05"
      kind: "minor"
      where: "the 12T root to the Ø3.900 bore at the rear face (ROOT ENVELOPE Ø7.93 min.)"
      finding: "root wall below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1378): accept as is. 7.93/2 less 3.916/2 is 2.007; less 0.025 for the 0.05 TIR tooth-space runout and the 0.25 bore edge break the worst wall is 1.732, between the 1.5 floor and the 2.0 target"
