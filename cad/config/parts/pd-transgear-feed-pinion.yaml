pd-transgear-feed-pinion:
  title: Feed Pinion Sleeve
  number: MHA-PD-10
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: SAE 1018 CF bar, ASTM A108-24
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  drawing_unit: in
  # The independent 12T 32DP feed uses the finite lower-count #8/12T stock master,
  # not the reducer's 48DP cutter and not a generated positive profile shift.
  # Precise/Penn 10-289-328: 32DP PA20 #8, body OD 57.15 mm, arbor bore 25.4 mm.
  # https://www.penntoolco.com/precise-20-involute-h-s-s-gear-cutter-8-diametral-pitch-32-cutter-diameter-2-1-4-hole-size-1/
  # Ground depth/form accuracy are unpublished; 2.25-module depth is Main's premise.
  process: "turned from bar; integral 12T 32DP PA20 teeth cut with stock #8 form cutter (12T master), with radial setting, tooth-span and all-space angular-index acceptance from the part specification; flat milled"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the step-face squareness frame to the bore (datum A)"
      finding: "squareness frame over-specified (rule 5)"
      reason: "owner-accepted disc-cluster control keeping the step square to its bore"
    - id: "RV-02"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore, measured with a calibrated pin in each space, is the owner gear-tooth critical class (owner-accepted)"
    - id: "RV-03"
      kind: "minor"
      where: "the D-FLAT WALL TO BORE .073 MIN. note (Section B-B D-flat .1380 0/-.001 from axis against the Ø.1250 +.0015/+.0010 REAM THRU bore)"
      finding: "D-flat wall to bore below the .080 in target (rules 17, 20)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (pending owner confirmation): the flat's band opens to the shop's 0/-.001 row and the printed MIN re-rules to .073; the wall is .07375 at the worst case along the part (.1370 flat less the .06325 bore radius). It re-rules owner ruling 2026-10-27 (#1378), which accepted .0741 (.074 MIN) for #290's contract fits (.138 flat F11, .125 bore F3); the local wall where the title block's .010 bore-mouth and flat/nose breaks meet at the nose face, accepted then at ~.054, is .0004 thinner with the flat"
    - id: "RV-04"
      kind: "minor"
      where: "the boss wall between the Ø.3130 boss and the Ø.1250 bore at the nose face"
      finding: "boss wall below the .080 in target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1378): accept as is. Re-sized for #290 (boss .313 +.0005/.0000): .3130/2 less .1265/2 is .0933; less the .010 OD and bore edge breaks the worst wall is .0733, between the .060 floor and the .080 target (first ruled at 1.638 mm, .0645)"
    - id: "RV-05"
      kind: "accept"
      where: "the GEAR DATA row SPAN MATCHED FIT: BACKLASH WITH MATE SET AT ASSY .0048 TO .0055 (DIAL), PER MHA-PD-00 STEP 24"
      finding: "rack datum shake band .0048 TO .0055 printed at four places, not a plain inch step (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144; pending owner confirmation: the window is the feed mesh's datum backlash from the MHA-PD-10 GEAR DATA (pd_transgear_feed_pinion_spec.RACK_BACKLASH_RANGE, the same RACK_DATUM_BACKLASH_TEXT constant MHA-PD-10 prints, with the identical exception there). .005 TO .0055 is an unreadable .0005 window and .0045 TO .0055 gives up margin at the binding end; the dial reads .0001"
    - id: "RV-06"
      kind: "accept"
      where: "the end view's SPAN 2 TEETH .1523/.1515 limits, MATCHED FIT, SEE GEAR DATA"
      finding: "span limits .0008 apart read as a converted millimetre band, not a plain inch step (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144; pending owner confirmation (L3): the limits are the stock #8 cutter's 2-tooth tangent span over its +/-.0004 radial-setting window, widened by the profile's geometry bound and rounded outward to .0001 (pd_transgear_feed_pinion_spec.SPAN_LIMITS); the manufactured tooth profiles the feed-rack mesh check reads are derived back from these printed limits, so a .001 step would pass spans outside the setting window the mesh is proved over. The span is a matched fit, its acceptance the GEAR DATA backlash with MHA-PD-05 set at assembly (RV-05)"
