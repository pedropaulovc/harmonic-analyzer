dt-crank-drive-gear:
  number: MHA-DT-07
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  drawing_unit: in
  process: "gear cutting: normal-24DP PA20 right-hand helical milling with the finite 55T normal stock form and mechanically lead-geared universal dividing head"
  # Beta follows the 13.001107-degree cone incline; lead 37.239 in/rev.
  # Cutter #2 uses its actual 55T stock form, not an ideal 69.185T virtual flank.
  # No compatible low-angle stock 64T helical gear is verified.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "front view, the D-bore callout Ø.3750 +.0018/+.0010 THRU (.0010-.0038 DIAMETRAL CLEARANCE ON CONE GEAR SHAFT MHA-DT-04), with its BORE ACROSS FLAT .3450 +.0008/+.0004 partner"
      finding: "the D-bore callout names no process word (REAM, DRILL or BORE) under rule 12"
      reason: "owner ruling 2026-09-29 (commit 7b9ed6891, codex machinist review of the #1128 full build): the process word is ruled off both D-bores. A through reamer cuts away the material the retained flat needs, so REAM would be false, and the native limits on the round and across-flat dimensions define the D-profile; the route belongs in the book and logbook, not on the print (owner-accepted)"
