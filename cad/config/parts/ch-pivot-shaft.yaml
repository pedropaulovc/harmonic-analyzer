ch-pivot-shaft:
  number: MHA-CH-05
  material: Plain Carbon Steel
  material_specification: AISI 1018 steel, precision-ground rod, Ø1/4 in
  finish: machined, oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  # Owner ruling 2026-11-20 (#2346): "Buy ground rod; it costs little and leaves the fit stacks alone."
  process: "cut from Ø1/4 in precision-ground rod (steel), O.D. as supplied; both ends faced to length and domed on the lathe; two set-screw flats milled in line, one side"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the Ø.2500 +.0000/-.0008 journal, RUNNING FIT IN MHA-CH-06, 1/4 GROUND STOCK OK"
      finding: "the -.0008 lower deviation is not a plain inch step: it reads as a converted millimetre value (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out F1 and F5). The band is the fleet-shared ground-shaft class _fit_shaft_h.SHAFT_H (0/-.0008), kept fleet-wide and restated at that family's next re-key; the callout names its route, bought 1/4 ground stock. Accepts the printed step only, no other band or fit departure."
