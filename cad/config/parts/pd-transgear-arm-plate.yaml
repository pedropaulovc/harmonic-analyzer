pd-transgear-arm-plate:
  title: Transgear Arm Plate
  number: MHA-PD-19
  material: AISI 1018 cold-finished steel
  material_specification: AISI 1018 cold-finished steel bar, ASTM A108, 1-1/2 in
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: >-
    Mill the outline from 1-1/2 in bar and step the notch; turn the front hub
    and rear boss on the bore axis; ream the bore; drill and countersink the
    two clamp screw holes. Clamp the plate on the rear face of MHA-PD-18
    (before its MHA-PD-23 pin is pressed) and, on the mill DRO, set the
    knob bore at the MHA-PD-00 VIEW K coordinates from the arm's pin bore,
    indicated true. Drill the two common #44 (.086) locating pilots
    through the plate and through the arm in that setting.
    Ream plate holes .0945 through and arm holes .0930
    separately; never pass the larger plate reamer into an arm press seat.
    Arm-hole mouth breaks .002 MAX (plate holes per the title block).
    Reassemble the original matched pair and inspect
    the actual hole positions, S-K setting and complete loaded
    free-motion envelope; do not accept an arbitrary as-made bolted pose.
  installation_notes: |-
    INSTALLATION - MATCHED ARM / ARM PLATE
    SET THE SPECIFIED CRITICAL S-K POSE BEFORE MATCH-REAMING.
    TWO MHA-PD-VN-64 DOWELS LOCATE; SCREWS CLAMP ONLY.
    DO NOT LOCATE BY COUNTERSINK CENTERING OR SCREW-HOLE FLOAT.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the locating-pattern and running-axis position controls"
      finding: "position controls over-specified (rule 5)"
      reason: "required by the whole-stack stock-form gate including the rigid two-hole registration yaw; stock dowels in reamed holes locate, the screws clamp (owner-accepted)"
    - id: "RV-02"
      kind: "accept"
      where: "the knob bore's perpendicularity frame to datum A (face-A view)"
      finding: "perpendicularity frame on a running bore (rule 5)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144. Knob axis K carried from the bore to the chain plane must stay inside the reducer's axis zone the air stacks charge, and this frame is what bounds it: Ø.002 over the shortest bore (28.47 mm) projects to 0.0719 mm at K_PROJECTED_HEIGHT_MM (40.31 mm) against the 0.0832 mm zone (paper_drive_arm_registration.AXIS_PROJECTED_ZONE_DIAMETER_MM)"
