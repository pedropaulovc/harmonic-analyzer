ch-pivot-bracket:
  number: MHA-CH-008
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-finished steel bar
  finish: black oxide
  tolerance_class: machined_block
  quantity: 2
  process: "milled L foot and arched ear; reamed cross-bore; drilled hold-down hole; #4-40 tapped through the arch apex into the bore"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the apex tap callout's closing line #4-40 ENGAGEMENT 3.10 MIN (1.08D)."
      finding: "apex #4-40 set-screw full thread below 1.5D at the worst case (rule 18, thread engagement: 1.5D of full thread)"
      reason: "3.10 MIN (3.098, 1.089D; 3.66 = 1.29D nominal) of full thread in the R8 arch wall over the bore at the worst printed limits, less both sags and the one-pitch entry chamfer; the arch over the bore is all the thread the ear has, and the cup-point set screw bears on the pivot shaft's flat and carries no axial working load (owner-ruled shortfall)"
