dt-pinion-arbor:
  title: Integral Pinion Arbor and Grip Head
  number: MHA-DT-22
  # Owner ruling 2026-11-20 (#2375, "Follow recommendations unless noted
  # otherwise"; recommendation B): 12L14 as on MHA-DT-23/-33, and 1144
  # stress-relieved, the usual low-distortion bar for a long slender turned
  # shaft. No geometry or fit change; Loctite 638 bonds either.
  material: 1018, 1020, 12L14 or 1144 cold-finished steel
  material_specification: "cold-finished steel bar: 1018, 1020 or 12L14 (ASTM A108), or 1144 stress-relieved (ASTM A311)"
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "turn integral arbor, neck, and head from one blank; ream head cross-hole for MHA-DT-15 grip crossrod; bond crossrod with Loctite 638"
  drawing_unit: in
  machinist_exceptions:
    # TODO(#1625): remove RV-01 and the INSIDE CORNERS note when the title
    # block gains its inside-corner default.
    - id: "RV-01"
      kind: "accept"
      where: "inside corners at the Ø5/16 to Ø.41 neck shoulder and the Ø.41 to Ø.59 head rear face"
      finding: "shoulder fillets/undercuts not sized at each step (rule 11) or a general inside-corner note in place of a title-block default"
      reason: "owner ruling 2026-10-18 (dt-crankshaft / fr-top-frame / sm-summing-lever precedent): turned with an R.010 MAX inside-corner ceiling, printed as one note until the shop-wide default goes in the title block under #1625 (owner-accepted); nothing seats against either shoulder (the collar spans 1.17-1.83 from the head rear face)"
    - id: "RV-02"
      kind: "accept"
      where: "main view: the span bands Ø.3125 -.0004/-.0038 (2X SEE NOTE 2)"
      finding: "-.0004/-.0038 is a converted millimetre band (0.010/0.097 mm), not a plain inch step (rule 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 8.3 (fan-out rule L3). The band is dt_pinion_arbor_geometry SHAFT_DIA_BAND, which the MHA-DT-33 collar spec and the pin-hole spec also read; restating it re-keys the arbor, the collar, the drive train and the kinematic probe across slices. A computed plain-step restatement that keeps every minimum clearance (spans Ø.3101 ±.002, top limit unchanged) passes every spec check and is deferred to that family's next re-key. The journals carry no band: they are made to fit the MHA-DT-14 bores, size REF, acceptance in note 1 (owner ruling 2026-11-24, fit audit question 12). The two bond lands carry no band either: they are turned to the 5/16 drilled MHA-DT-01 bore, size REF, acceptance in note 3 (owner ruling 2026-11-24, fit audit question 13; made to fit: delegated ruling 2026-11-24 (FitLaneDT)). Accepts this notation only, no other band or callout departure."
