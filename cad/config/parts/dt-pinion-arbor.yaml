dt-pinion-arbor:
  title: Integral Pinion Arbor and Grip Head
  number: MHA-DT-22
  material: AISI 1018 cold-finished steel
  material_specification: AISI 1018 cold-finished steel bar, ASTM A108
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "turn integral arbor, neck, and head from one blank; ream head cross-hole for MHA-DT-15 grip crossrod; bond crossrod with Loctite 638"
  drawing_unit: in
  machinist_exceptions:
    # TODO(#1625): remove RV-01 and the INSIDE CORNERS note when the title
    # block gains its inside-corner default.
    - id: "RV-01"
      kind: "accept"
      where: "inside corners at the Ø5/16 to Ø.41 neck shoulder and the Ø.41 to Ø.59 head rear face"
      finding: "shoulder fillets/undercuts not sized at each step (rule 11) or a general inside-corner note in place of a title-block default"
      reason: "owner ruling 2026-10-18 (dt-crankshaft / fr-top-frame / sm-summing-lever precedent): turned with an R.010 MAX inside-corner ceiling, printed as one note until the shop-wide default goes in the title block under #1625 (owner-accepted); nothing seats against either shoulder (the collar spans 1.17-1.83 from the head rear face)"
    - id: "RV-02"
      kind: "accept"
      where: "main view: the 2X journal callout Ø.3125 -.0004/-.0012 (RUNNING FIT, SEE NOTE 1, both journals) and the span bands Ø.3125 -.0004/-.0038 (2X SEE NOTE 2, and each BONDED IN MHA-DT-01 bond land)"
      finding: "-.0004/-.0012 and -.0004/-.0038 are converted millimetre bands (0.010/0.030 and 0.010/0.097 mm), not plain inch steps (rule 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 8.3 (fan-out rule L3). The bands are dt_pinion_arbor_geometry JOURNAL_DIA_BAND and SHAFT_DIA_BAND, which the MHA-DT-33 collar spec, the pin-hole spec and the drum bond check also read; restating them re-keys the arbor, the collar, the drive train and the kinematic probe across slices. Computed plain-step restatements that keep every minimum clearance (journals Ø.3116 ±.0005, spans Ø.3101 ±.002, top limits unchanged) pass every spec check and are deferred to that family's next re-key. The running fit to the measured MHA-DT-14 bore is printed in note 1. Accepts this notation only, no other band or callout departure."
