ch-rocker-arm-tl-oblique-carrier:
  title: Rocker Oblique Trammel Carrier Plate
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-21
  # The pin holes are reamed and the plate must stay flat on two pins: a
  # stable (stress-relieved), free-machining grade. The source is the owned
  # OnlineMetals 1173 bar (shop inventory), milled to width on edge in the
  # vise, no bandsaw rip (owner ruling #2083).
  material: 6061-T6511 aluminium
  material_specification: 1/2 x 6 in 6061-T6511 aluminium bar, ASTM B221 (owned OnlineMetals 1173)
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: >-
    saw a 21.3 in length from the 1/2 x 6 bar and mill it to width on edge
    in the vise, no bandsaw rip (the 6 in width does not fit the 5 3/4 in
    vise jaws flat); face to .47 drawing thickness and mill to 20.5 x 5.1;
    drill and ream the four pivot-pin holes
    with the .3760 reamer; chamfer each pin hole's underside edge .012 min x
    45 deg; spot-drill the CL spot; drill and tap the CR, riser
    and feed-lever holes; break edges. The HUB hole is match-drilled and
    reamed in situ on the assembled jig (MHA-CH-06-TL-00 step 10). The
    pivot bores turn on TL-VN-77 shoulder screws; the underside seats on
    TL-VN-78 spacers.
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X 5/16-18 UNC feed-lever taps"
      finding: "engagement .394 min (1.26D) in the .47 plate, under 1.5D (rule 18)"
      reason: ".47 plate cannot hold 1.5D of 5/16-18 and the feed lever only takes hand load; the shortfall is stated in the tap callout (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
  drawing_unit: in
