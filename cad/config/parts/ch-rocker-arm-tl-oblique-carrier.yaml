ch-rocker-arm-tl-oblique-carrier:
  title: Rocker Oblique Trammel Carrier Plate
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-21
  # The pin holes are reamed and the plate must stay flat on two pins: a
  # stable (stress-relieved), free-machining grade. The source is the owned
  # OnlineMetals 1173 bar (shop inventory), ripped to fit the vise.
  material: 6061-T6511 aluminium
  material_specification: 1/2 x 6 in 6061-T6511 aluminium bar, ASTM B221 (owned OnlineMetals 1173)
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: >-
    saw a 540 length from the 1/2 x 6 bar and rip it to about 135 wide (the
    6 in width does not fit the 5 3/4 in vise jaws); face to 12.0 drawing
    thickness and mill to 520 x 130; drill and ream the four pivot-pin holes;
    chamfer each pin hole's underside edge 0.3 min x 45 deg; centre-drill the
    HUB and CL spots; drill and tap the CR, riser and feed-lever holes; break
    edges. The unchanged H7 pivot bores turn on TL-VN-77 shoulder screws; the
    underside seats on TL-VN-78 spacers.
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X 5/16-18 UNC feed-lever taps"
      finding: "engagement 9.53 min (1.20D) in the 12 plate, under 1.5D (rule 18)"
      reason: "12 plate cannot hold 1.5D of 5/16-18 and the feed lever only takes hand load; the shortfall is stated in the tap callout (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
  drawing_unit: in
