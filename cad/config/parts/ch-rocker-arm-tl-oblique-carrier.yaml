ch-rocker-arm-tl-oblique-carrier:
  title: Rocker Oblique Trammel Carrier Plate
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-21
  # The pin holes are reamed and the plate must stay flat on two pins: a
  # stable (stress-relieved), free-machining grade. The source is the owned
  # OnlineMetals 1173 bar (shop inventory), milled to width clamped flat on
  # the mill table, no bandsaw rip (owner rulings #2083, 2026-11-13 #2743).
  material: 6061-T6511 aluminium
  material_specification: 1/2 x 6 in 6061-T6511 aluminium bar, ASTM B221 (owned OnlineMetals 1173)
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: >-
    saw a 21.3 in length from the 1/2 x 6 bar; clamp it flat on 1-2-3
    blocks on the mill table under strap clamps (the 6 in width does not fit
    the 5 3/4 in vise jaws flat, and on edge the jaws grip too little of its
    height), no bandsaw rip; mill it to 20.5 x 5.1 and face to .47 drawing
    thickness; locate holes from the hole table's origin, the plate's
    lower-left corner on sheet 2; use .XXX coordinates at the title-block
    ±.005, except the flagged A2/B2 Y .964 ±.002 row; drill and ream the
    four pivot-pin holes with the .3760 reamer; drill and tap the CL and CR
    end-clamp holes #8-32 THRU, then the riser and feed-lever holes. Break
    edges, the pin holes' underside edges included (the spacers seat on
    them). At the assembled jig's HUB DRO
    setting (TL-00 step 10), spindle-guide the tap drill and tap for the
    ordinary #8-32 THRU HUB receiver; its table location is REF, never an
    independent predrilling control. Each strap is drilled and reamed at
    that same setting through the riser's relief; there is no precision
    carrier HUB bore, underside hub chamfer, or carrier counterbore.
    The CAD shows the finished assembly-machined HUB tap, not a separate
    manufactured hole-location requirement.
    The pivot bores turn on TL-VN-77 shoulder screws; the underside seats on
    TL-VN-78 spacers.
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X 5/16-18 UNC feed-lever taps"
      finding: "engagement .394 min (1.26D) in the .47 plate, under 1.5D (rule 18)"
      reason: ".47 plate cannot hold 1.5D of 5/16-18 and the feed lever only takes hand load; the shortfall is stated in the tap callout (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "RV-02"
      kind: "accept"
      where: "hole-table A2/B2 rows flagged NOTE 1"
      finding: "one flagged note carries the local Y .964 ±.002 control rather than a separate dimension (rules 3 and 7)"
      reason: "Owner Option B ruling 2026-11-06, Ref #2151: print exactly 'A2, B2: Y .964 ±.002 FROM THE A1-B1 AXIS LINE'. The model owns the matching local limits, the native table owns all .XXX coordinates from A1, and this package-specific note does not establish general drawing policy or add a shop check."
  drawing_unit: in
