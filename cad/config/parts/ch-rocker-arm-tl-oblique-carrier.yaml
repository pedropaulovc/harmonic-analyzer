ch-rocker-arm-tl-oblique-carrier:
  title: Rocker Oblique Trammel Carrier Plate
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-21
  # The pin holes are reamed and the plate must stay flat on two pins:
  # a stable, free-machining plate grade.
  material: 6061-T651 aluminium
  material_specification: 1/2 in 6061-T651 aluminium plate, ASTM B209
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: >-
    start from 1/2 in plate; face to 12.0 drawing thickness and saw/mill to
    520 x 130; drill and ream the four pivot-pin holes; chamfer each pin hole's
    underside edge 0.3 min x 45 deg; centre-drill the HUB and CL spots; drill and
    tap the CR, riser and feed-lever holes; break edges. Before assembly, inspect
    ALL FOUR pivot bores A1, B1, A2 and B2 individually against the carrier's
    actual bottom seating face. Support that clean face on equal-height clean
    parallels on a granite surface plate, without rocking or distorting clamps.
    Use a straight adjustable expanding test arbor seated over the bore's
    straight cylindrical land, not either mouth chamfer, to eliminate fit play;
    a loose H7/h6 pivot pin is not an axis gauge. Check the height-gauge indicator
    travel against a square normal to the surface plate. Indicate the arbor
    laterally at two heights exactly 10.50 mm apart: the change must be at most
    0.05 mm in every azimuth. Measure two orthogonal lateral changes and use their
    vector resultant, sqrt(dx^2 + dy^2), for the maximum departure; do not allow
    0.05 separately in each direction. Reverse and reseat the arbor to bound its
    straightness and seating error, and include these and setup repeatability
    within the 0.05 maximum rather than adding allowances. Record a result for
    each bore before installing the carrier on the two pivot pins; the carrier
    remains supported by those pins only, with no skid.
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X 5/16-18 UNC feed-lever taps"
      finding: "engagement 9.53 min (1.20D) in the 12 plate, under 1.5D (rule 18)"
      reason: "12 plate cannot hold 1.5D of 5/16-18 and the feed lever only takes hand load; the shortfall is stated in the tap callout (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
