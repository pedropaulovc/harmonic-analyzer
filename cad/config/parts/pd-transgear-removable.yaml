pd-transgear-removable:
  title: Removable Chain Sprocket
  number: MHA-PD-09
  description: "ANSI #25 CHAIN SPROCKET, T12/T18/T24; 1 EACH; McMASTER BLANKS REWORKED"
  material: Plain Carbon Steel
  material_specification: "bought steel ANSI #25 sprocket: McMaster 6793K4 (T12), 6793K11 (T18), 6793K17 (T24); supplier states no steel grade"
  finish: "as supplied, unplated; supplier states no coating"
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "modify McMaster 6793K4 (T12) / 6793K11 (T18) / 6793K17 (T24) steel plain-bore ANSI #25 sprockets, teeth, OD and plate faces as supplied: turn the hub off flush with the supplied plate; drill the bore 13/32 (.406) through; drill two #40 (.098) drive-pin holes through on a .551 pitch circle"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the BORE TO DRIVE-PIN HOLE WEB .018 MIN note"
      finding: "bore-to-drive-pin web below the .060 floor (rule 17)"
      reason: "Owner ruling 2026-11-01: shared #25 sprocket-seat geometry; accepted as a permanent minor exception (revisit in #2141). The Ø.406 bore and the #40 drive-pin holes on R.2756 come from the shared sprocket seat (_sprocket_seat_geometry); .024 nominal, .018 MIN with both holes drilled oversize and the pin at its full location band (#1377)"
    - id: "RV-02"
      kind: "accept"
      where: "the two #40 drive-pin holes' .2756 ±.0009 locations from the bore axis"
      finding: "drilled-hole location band tighter than the ±.005 drilled-hole row, a converted-mm value, with no fit route (rules 3, 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out F4). The band is the shared #25 sprocket seat's (_sprocket_seat_geometry.DRIVE_PIN_OFFSET_TOL), set by the dowel slip budget: the 3/32 pins of MHA-DT-11 and MHA-PD-22 enter these holes with .0039 diametral slip, and the pin and hole location bands spend .0036 of it, so neither can loosen; a cross-part transfer route was not taken now because it re-keys MHA-DT-11, MHA-PD-22 and both assemblies"
