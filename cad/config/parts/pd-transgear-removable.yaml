pd-transgear-removable:
  title: Removable Chain Sprocket
  number: MHA-PD-09
  description: "ANSI #25 CHAIN SPROCKET, T12/T18/T24; 1 EACH; McMASTER BLANKS REWORKED"
  material: Plain Carbon Steel
  material_specification: "bought steel ANSI #25 sprocket: McMaster 6793K4 (T12), 6793K11 (T18), 6793K17 (T24); supplier states no steel grade"
  finish: "as supplied, unplated; supplier states no coating"
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "modify McMaster 6793K4 (T12) / 6793K11 (T18) / 6793K17 (T24) steel plain-bore ANSI #25 sprockets, teeth, OD and plate faces as supplied: turn the hub off flush with the supplied plate; drill the bore 13/32 (.406) through; drill two #40 (.098) drive-pin holes through at their .276 targets either side of the bore (a .551 pitch circle); try each wheel on the pins of MHA-PD-22 and MHA-DT-11: it drops on freely and lifts off"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the BORE TO DRIVE-PIN HOLE WEB .014 MIN note"
      finding: "bore-to-drive-pin web below the .060 floor (rule 17)"
      reason: "Delegated ruling 2026-11-24 (FitBatchPD), restating the value only: .018 MIN to .014 MIN. Precedent: owner ruling 2026-11-01 on this same web (shared #25 sprocket-seat geometry; accepted at .018 MIN as a permanent minor exception, revisit in #2141) and owner ruling 2026-11-24, fit audit question 8, which made the pin-hole offsets REF targets accepted by the wheel's trial on the pins of MHA-PD-22 and MHA-DT-11. https://github.com/pedropaulovc/harmonic-analyzer/issues/2144. The Ø.406 bore and the #40 drive-pin holes on R.2756 come from the shared sprocket seat (_sprocket_seat_geometry); .024 nominal. The .018 charged each centre ±.0009, a band the sheet no longer prints; the trial bounds the two holes' spacing only, so the web is now charged the shop's drilled-hole location row, ±.005 (.0146 with both holes drilled .004 oversize and the centre .005 toward the bore; #1377). The geometry is unchanged. Owner question open with the batch (sketch Q-PD-pin-walls-under-trial.png): keep this value, or print a location band again to hold .018"
