dt-cone-swing-platform:
  # Plan length is the 9-1/16 in fraction sized off the cone_line post/pivot stations;
  # the 2-3/8 in south width and 1/4-20 mounting pattern follow the retained post foot.
  title: Cone Swing Platform
  number: MHA-DT-020
  # U41 (2026-09-23): the thickness is the stock's, as supplied; the 2-3/8 in
  # plan envelope fits the 2-1/2 in bar, whose mill tolerance holds the
  # +/-0.13 the drawing-guidelines.md rule 17 (walls and webs) stacks use (dt_cone_swing_platform_spec.PLATE_STOCK_BAND).
  # Printed in the title block's MATERIAL row: 81788ce9 wrapped the long
  # form onto a second line, so the full wording lives in the spec below.
  material: 1018 CF FLAT 1/4 x 2-1/2 in
  material_specification: ASTM A108 1018 cold-finished flat bar, 1/4 x 2-1/2 in; thickness as supplied
  finish: MIL-DTL-13924 Class 1 black oxide with oil seal; all surfaces
  quantity: 1
  tolerance_class: machined_block
  process: "machined from supplied steel flat bar"
