dt-cone-swing-platform:
  # Current plan length derives from the extended cone_line post/pivot stations;
  # the 61 mm south width and 1/4-20 mounting pattern follow the retained post foot.
  title: Cone Swing Platform
  number: MHA-DT-20
  # U41 (2026-09-23): the thickness is the stock's, as supplied; the plan
  # envelope fits the 2-1/2 in bar, whose mill tolerance holds the
  # +/-.005 the drawing-guidelines.md rule 17 (walls and webs) stacks use (dt_cone_swing_platform_spec.PLATE_STOCK_BAND).
  # Printed in the title block's MATERIAL row: 81788ce9 wrapped the long
  # form onto a second line, so the full wording lives in the spec below.
  material: 1018 CF FLAT 1/4 x 2-1/2 in
  material_specification: ASTM A108 1018 cold-finished flat bar, 1/4 x 2-1/2 in; thickness as supplied
  finish: MIL-DTL-13924 Class 1 black oxide with oil seal; Ø.0630 hole bare, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "machined from supplied steel flat bar"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the pivot reamed bore's native Hole Wizard callout only: its hw-diam callout variable's tolerance places, written as 4 at drawing time from PIVOT_HOLE_BAND by draw_dt_cone_swing_platform._print_pivot_band_exactly (ICalloutLengthVariable.TolerancePrecision)"
      finding: "a drawing script writes a banded hole callout's tolerance precision at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (33 uses on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). This accepts no other precision, band, callout or package departure."
    - id: "RV-02"
      kind: "minor"
      where: "sheet 1, the note for the 2X 1/4-20 UNC THRU ALL post taps: 1/4-20 THREAD ENGAGEMENT 0.88D MIN."
      finding: "thread engagement below 1.5D (rule 18)"
      reason: "Owner ruling 2026-11-01: MHA-DT-VN-61 post-mount thread engagement 0.87D MIN (0.88D after #2107) accepted as a minor exception; #1019's 0.90D target not met. These taps are that joint's receiver (MHA-DT-VN-61's RV-01)"
    - id: "RV-03"
      kind: "accept"
      where: "the tip-block hold-down counterbored hole's (at its C1 keyed station, HoldDownZ .730 from the pivot bore, with MHA-DT-21) and the post-mount tapped holes' native Hole Wizard callouts only: their hw-thruholedia, hw-cbdia, hw-cbdepth and hw-thrutapdrldia callout variables' decimal places, written as 3 at drawing time from draw_dt_cone_swing_platform.HOLDDOWN_CALLOUT_PRECISION and POST_MOUNT_CALLOUT_PRECISION by draw_dt_cone_swing_platform.build (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes Hole Wizard callout places at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 call sites on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). Re-scoped to the hold-down hole moved .329 south (.409 to .738 from the pivot bore) with MHA-DT-21: owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992); the same hole stands .730 from the pivot bore since #2697 (.008 north, same callouts). This accepts no other precision, band, callout or package departure."
