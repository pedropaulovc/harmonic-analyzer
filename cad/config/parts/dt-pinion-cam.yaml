dt-pinion-cam:
  title: Pinion Eccentric Cam
  number: MHA-DT-23
  material: 1018, 1020 or 12L14 cold-finished steel
  material_specification: 1018, 1020 or 12L14 cold-finished steel
  finish: bright machined; clean tapped hole, then protect with ISO VG 32 oil film
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view, Ø.2510 reamed bore (REAM THRU, no band) offset .079 inside the Ø.575 OD, both at the title block's ±.005: thin-side wall, stated by the native .0752 MIN THIN-SIDE WALL dimension (ThinWallMin@ThinWallReference)"
      finding: "thin-side wall .07525 in (1.91135 mm) at the printed worst case, between the .060 in floor and the .080 in target (rule 17): .00475 in under the target, .01525 in over the floor. The sheet prints it as .0752 MIN (1.91008 mm), .07525 floored to four places on purpose so the print never states more wall than the worst case leaves"
      reason: "fit audit S3, owner ruling 2026-11-24 (\"S1, S2, S3, S4, S5, S6 all approved (ticked)\"; S3: the cam O.D. and eccentricity from ±.002 to ±.005, the wall between the .060 floor and the .080 target, restating this exception): a thin-side wall between the floor and the target is accepted. The bore stays on the owned .2510 reamer (fit audit F19; owner ruling via Main 2026-10-30, #290), analysed at .2510-.2515; the OD 14.6 and eccentricity 2.0 print in inches as .575 and .079. Worst case = OD .570, bore .2515, eccentricity .084 (dt_pinion_cam_spec.THIN_SIDE_WALL_MIN_MM, which refuses anything under the .060 floor). The sheet prints the accepted wall as the model-owned single limit .0752 MIN, never as note text"
    - id: "RV-02"
      kind: "accept"
      where: "front view and VIEW A, Ø.070 TAP DRILL THRU TO BORE / #2-56 UNC cross-hole through the thick side of the offset bore, with note 1's loose ASME B18.3 #2-56 UNC X 3/16 flat-point socket set screw"
      finding: "blocker: the 3/16 (.1875) set screw is shorter than the thick-side wall it threads through (about .233 to .249 at the printed limits), read as a screw that stops inside the tapped hole and cannot reach the bore or lift rod MHA-DT-17 (rules 16 and 21), with a longer screw or a geometry change asked for"
      reason: "Owner ruling 2026-11-17 (Pedro): \"The 3/16 in set screw stays. It is headless and drives below the OD to seat on the rod flat; a longer screw would stand proud of the OD. The screw being shorter than the wall is intended.\" The tap is through to the bore, so the screw travels its whole depth; dt_pinion_cam_spec.SET_SCREW_SUBFLUSH_MIN_MM refuses a screw that could stand proud once seated."
