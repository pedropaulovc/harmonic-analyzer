pn-pen-rod:
  number: MHA-PN-04
  material: Brass
  material_specification: C36000 free-machining brass square bar
  finish: machined, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "machined (brass)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "view from square end, TAP 0-80 UNF centred in the .197 +.000/-.002 SQ end: the wall from the thread to each flat, stated by the native .067 MIN TAP WALL dimension (TapWallMin@TapWallReference)"
      finding: "tap wall .0675 in at the printed worst case (square .195, #0-80 major .060), under the .080 in target and over the .060 in floor (rule 17). The sheet prints it as .067 MIN: the .0675 floored to three places on purpose so the print never states more wall than the worst case leaves"
      reason: "owner ruling 2026-10-31 via coordinator Main on MHA-PN-01 (rule 17 forbids tightening a band to protect a wall; #0-80 is the smallest thread and the square is fixed by the V-block). The sheet states the worst-case wall as a model-owned single limit, never as note text (pn_pen_rod_spec.TAP_WALL_MIN_MM, which refuses anything under the .060 floor)"
