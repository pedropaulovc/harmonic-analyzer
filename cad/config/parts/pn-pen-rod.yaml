pn-pen-rod:
  number: MHA-PN-04
  material: Brass
  material_specification: C36000 free-machining brass square bar
  finish: machined, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "machined (brass)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "view from square end, TAP 0-80 UNF centred in the .197 +.000/-.002 SQ end: the wall from the thread to each flat, stated by the native .067 MIN TAP WALL dimension (TapWallMin@TapWallReference)"
      finding: "tap wall .0675 in at the printed worst case (square .195, #0-80 major .060), under the .080 in target and over the .060 in floor (rule 17). The sheet prints it as .067 MIN: the .0675 floored to three places on purpose so the print never states more wall than the worst case leaves"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (MHA-PN-04 stud tap wall .067). No geometry escape: rule 17 forbids tightening a band to protect a wall, #0-80 is the smallest thread and the square is fixed by the V-block. The sheet states the worst-case wall as a model-owned single limit, never as note text (pn_pen_rod_spec.TAP_WALL_MIN_MM, which refuses anything under the .060 floor)"
    - id: "RV-02"
      kind: "accept"
      where: "the adjuster stud's blind #0-80 tap native Hole Wizard callout only: its drill-diameter, drill-depth and full-thread callout variables' places, written at drawing time from draw_pn_pen_rod.STUD_TAP_PRECISION (pn_pen_rod_spec.STUD_TAP_DEPTH_PLACES for both depths) through _drawing_hole_callout.set_hole_callout_precision (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes hole callout precision at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 set_hole_callout_precision call sites on main). Native experiment run 20261102T230110877Z: part-authored Hole Wizard precision did not reach the callout (read -1, the document default). Owner review #2144. This accepts no other precision, band, callout or package departure."
