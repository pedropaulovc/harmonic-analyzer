dt-cone-tip-block:
  title: Cone Tip Block
  number: MHA-DT-21
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: black oxide
  quantity: 1
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the four native Hole Wizard callouts only (through adjuster thread and pinch opposite-jaw thread hw-thrutapdrldia, pinch entry-jaw clearance hw-diam, hold-down foot tap hw-tapdrldia, hw-threaddepth and hw-tapdrldepth): their callout variables' decimal places, written as 3 (sizes, draw_dt_cone_tip_block.HOLE_CALLOUT_PLACES) and 2 (foot tap depths, dt_cone_tip_block_spec.FOOT_DEPTH_PLACES) at drawing time by draw_dt_cone_tip_block.build (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes Hole Wizard callout places at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 call sites on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). This accepts no other precision, band, callout or package departure."
