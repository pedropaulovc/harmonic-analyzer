dt-cone-tip-block:
  title: Cone Tip Block
  number: MHA-DT-21
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: black oxide
  quantity: 1
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the four native Hole Wizard callouts only (through 1/4-28 adjuster thread and pinch opposite-jaw thread hw-thrutapdrldia, pinch entry-jaw clearance hw-diam, hold-down foot tap hw-tapdrldia, hw-threaddepth and hw-tapdrldepth): their callout variables' decimal places, written as 3 (sizes, draw_dt_cone_tip_block.HOLE_CALLOUT_PLACES) and 2 (foot tap depths, dt_cone_tip_block_spec.FOOT_DEPTH_PLACES) at drawing time by draw_dt_cone_tip_block.build (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes Hole Wizard callout places at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 call sites on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). Re-checked for the 1/4-28 through thread of the C1 keyed end screw (owner ruling 2026-11-09 via PR #1992, https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): the same variable, the same places. This accepts no other precision, band, callout or package departure."
    - id: "RV-02"
      kind: "accept"
      where: "bottom view: the .215 station of the 4-40 UNC-2B hold-down tap (and the Ø.0620 ream on its line) from the north face, whose reason SETS MHA-DT-39 REACH prints on the tap's size callout"
      finding: "a three-place location with no band of its own whose function is stated on the hole's callout and not at the dimension (rule 3), or a mate named for a location (rule 7)"
      reason: "Delegated ruling 2026-11-13 (Main), no precedent; the owner reviews it first on #2144. The geometry fix (#2726, 3/4 end screw) is not taken here because its SKU edit re-keys 13 sheets outside this change. The station sets where the block's north face stands over the MHA-DT-20 hold-down hole and so the 5/8 end screw MHA-DT-39's engagement window: at .XX the screw's shallow engagement falls under the owner's 1.39 D (dt-drive-train DT-07), so the third place is functional (build_dt_drive_train_assembly END_SCREW_EMBED_WORST_MM). Machinist reviews of #2725 refused the reason both on the tap callout (runs 20261113T171850731Z, 20261113T172852461Z) and under the dimension (run 20261113T204523352Z, rule 7), so no ink satisfies both. Retires with the 3/4 end screw of #2726, which lets the station print .22 at .XX. Accepts this station's places and where its reason prints only, no other departure."
