pd-platen:
  number: MHA-PD-02
  material: Brass
  material_specification: C36000 free-machining brass plate, 1/4 in
  finish: machined; chemically blackened (brass black)
  quantity: 1
  tolerance_class: plate_profile
  process: "machined (brass): 1/4 in plate thinned to .152 by equal cuts from both faces (about .049 a side), turned over between passes so the skins relieve evenly"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the hole table's four clip-screw #2-56 through-tap rows (X .170 and 10.446 from the left edge, Y 2.301 and 5.025 from the bottom edge, MATE MHA-PD-03), with the TAP 2-56 UNC THRU ALL callout PATTERN MATCHES MHA-PD-03"
      finding: "three-place tap stations read as a tight band or over-specification (rules 3, 4)"
      reason: "the clip screws are fixed in these taps and float only in the clip's #2 loose holes (.030 min over the shank); that float holds the clip's and these taps' position zones (.014 each, .028 together) only with both patterns at .XXX; transfer-drilling the clips from the platen was rejected so any clip fits any platen (owner-accepted)"
    - id: "RV-02"
      kind: "minor"
      where: "section A-A, the counterbore floor reference (.037) C'BORE FLOOR .027 MIN WORST CASE"
      finding: "counterbore floor below the .060 in wall floor (rule 17)"
      reason: ".027 MIN at the worst printed limits (.037 nominal) under each #4 guide-screw head; the plate is brass and the screws are hand-tight, so the floor's shear ring under the head (about .012 in^2) carries only that clamp, with the plate thickness and the sub-flush head recess unchanged (owner-ruled shortfall, restated in inch 2026-10-31)"
    - id: "RV-03"
      kind: "minor"
      where: "the TAP 2-56 UNC THRU ALL callout's line THREAD ENGAGEMENT 1.47D MIN on the four clip-screw through taps"
      finding: "clip-screw thread engagement below 1.5D at the worst case (rule 18)"
      reason: "Delegated ruling 2026-11-12 (Main, #2411 brief: 'at least ~1.5 d or state why less holds a paper clip'), no geometry escape short of the deleted bosses (#2411); precedent fr-nameplate RV-03 (owner ruling 2026-11-01, 1.19D below 1.5D accepted as minor); owner review #2144. The four #2-56 brass screws carry only the clip's spring preload on paper and are never loaded in service; 1.53D nominal (.127 MIN full thread: the thinnest .147 plate less both tap mouths' .010 title-block breaks)."
