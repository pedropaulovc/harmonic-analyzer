pd-transgear-pivot-spacer:
  title: Transgear Pivot Spacer
  number: MHA-PD-20
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "turned from bar (brass): drill and ream the bore, face both ends to length"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the two faces squareness frames to the pressed bore (datum A)"
      finding: "squareness frames over-specified (rule 5)"
      reason: "the preloaded spring seats the hanger on these faces; their squareness is the hanger only tilt (owner-accepted)"
    - id: "RV-02"
      kind: "accept"
      where: "the O.D.'s circular runout frame to the pressed bore (datum A)"
      finding: "runout frame over-specified (rule 5)"
      reason: "bounds the bore's offset in bar chucked as supplied, which the .080 wall target is charged against (owner ruling 2026-10-27, #1380)"
