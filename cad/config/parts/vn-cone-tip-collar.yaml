vn-cone-tip-collar:
  title: Cone Tip Stack Collar
  number: MHA-VN-016
  description: "CUSTOM CONE TIP COLLAR WITH GROUND SCREW"
  material: Plain Carbon Steel
  material_specification: "1018 or 1215 low-carbon steel collar; reworked 18-8 stainless stock set screw"
  stock: "3/4 in steel round bar; McMaster-Carr 94355A213 #2-56 x 5/16 in flat-tip set screw"
  finish: bare steel; protect collar with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: fastener_clearance
  process: "turn source-selected diameter 17.05 body, width 11.50, with diameter 6.40 south nose length 3.50 and BASIC tap 7.50; the single 0.50 coupled shift in cone_shaft_land_bands moves large collar material, shaft tip, tip block and platform pivot together while retaining engaged gear/post/crank stations; preserve native shoulder root and free-edge breaks, full printed 2.0 wall target, 1.5 floor, ordinary bands, radial tap/flat grades, full thread and socket reach; finish the same retained round-bore limits (native in-band representative prints diameter 0.849 +/-0.030, not a zero-clearance shaft-sized hole); mill radial tap face; tap #2-56 2B to native BASIC position and MAX root controls; grind supplied screw dog tip to native size and total runout relative to retained thread axis, retaining stock thread and hex"
