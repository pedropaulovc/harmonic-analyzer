vn-cone-tip-collar:
  title: Cone Tip Stack Collar
  number: MHA-VN-016
  description: "CUSTOM CONE TIP COLLAR WITH GROUND SCREW"
  material: Plain Carbon Steel
  material_specification: "1018 or 1215 low-carbon steel collar; reworked 18-8 stainless stock set screw"
  stock: "3/4 in steel round bar; McMaster-Carr 94355A213 #2-56 x 5/16 in flat-tip set screw"
  finish: bare steel; protect collar with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: fastener_clearance
  process: "turn source-selected diameter 17.05 body, width 11.50, with diameter 6.40 south nose length 3.50 and BASIC tap 7.50; the single 0.50 coupled shift in cone_shaft_land_bands moves large collar material, shaft tip, tip block and platform pivot together while retaining engaged gear/post/crank stations; preserve native shoulder root and free-edge breaks, full printed 2.0 wall target, 1.5 floor, ordinary bands, radial tap/flat grades, full thread and socket reach; finish the same retained round-bore limits (native in-band representative prints diameter 0.849 +/-0.030, not a zero-clearance shaft-sized hole); mill radial tap face; tap #2-56 2B to native BASIC position and MAX root controls; grind supplied screw dog tip to native size and total runout relative to retained thread axis, retaining stock thread and hex"
  installation_notes: "Set unchanged 0.45 +/-0.10 feeler off T006's actual thrust face; seat both finite collar-bore ends on the terminal journal's retained round BACK arc, then snug the complete ground dog wholly inside the unbroken D-flat and its torque-corner 0.020 MAX breaks; remove the leaf. Never swing/run loose. Follow assembly critical running-bore/shaft-seat setup on actual-post mandrel and the complete installed centre family; no commodity receiving or full-P1 tracking procedure. Retain the datum-fixed north box and full rho^2/Rmax^2+q/e<=1 motion with Rmax from dt_tip_collar_air.NORTH_RADIAL_MOTION_MAX_MM (0.480 mm), and manufactured whole-bank working-face grade that never removes running-bore cock. Fitted-centre total expanded uncertainty <=0.005 mm; 0.001 mm indicator resolution is not accuracy. Propagate centre, fixed-plane/station and correlated q/e uncertainty into the whole-state observed upper; upper plus its expanded uncertainty must not exceed Rmax. Entire cup-seated uncertainty family remains in the fixed box. No loose D-fit motion, fake zero concentricity, mean/tare, nominal cup-angle bound, or supplied-stock pass claim. Retain original shaft/stack/bank floats and print-worst collar-to-tip-block and full manufactured-P1 collar-to-bank air."
