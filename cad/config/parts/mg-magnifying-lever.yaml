mg-magnifying-lever:
  number: MHA-MG-03
  material: Brass
  material_specification: Brass
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  fit_class: shaft_in_bushing  # selected quarter-inch body slides in the clamp
  process: "as-bought full-body 1/4 in brass rod, printed as the REF stock fraction; the stock's .000/-.002 governs and every fit stack charges it; overall 6.59 at the title block .XX band (it moves the fitted free tip in the published operating travel; the 167.5 mm model nominal closes the fixed bracket station and stays); nominal free hemisphere tip and knife position unchanged; opposite end flat with 1/4-20 UNC-2A thread .71 at the title block .XX band from the tip through the incomplete root runout; tip chamfer modeled .008, with hidden native primary-distance limits 0 to .010 (title-block edge break), retained 45 degree entry indication and ordinary ±1 degree angular allowance; incomplete thread .075 MAX each end (1.5 pitches), with the conservative .0104 tip-leg envelope charged ADDITIONALLY, not assumed inside that limit; constant-diameter stock outside the thread, no shoulder or relief groove; install by the assembly native .05 tip-projection dimension through the .49 MHA-MG-01 bracket neck: the single fitted interval gives worst full overlap .423 above 1.5D .375, with .061 root-runout clearance and .038 minimum projection. Overall rod length variation moves the fitted free tip and is included in operating travel; no separate fixed-useful-pose engagement claim. No locknut, set screw or adhesive; keep the complete MHA-MG-02 clamp bore on the plain body, clear of runout and thread"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "front view: the Ra 125 µin symbol on the Ø1/4 plain body, its reason MHA-MG-02 SCREW SEAT at the symbol."
      finding: "Ra 125 µin on a set/thumb-screw clamp face: a clamp face carries no symbol (rule 6, roughness symbols only where a surface runs, slides or locates)"
      reason: "owner ruling 2026-10-17, retained on the quarter-inch body in the 2026-10-20 threaded redesign: the plain body is the functional screw seat which locates the MHA-MG-02 clamp anywhere along its permitted travel; this is one static mating seat locating the part on its neighbour."
    - id: "RV-02"
      kind: "accept"
      where: "this lever's external thread in the MHA-MG-01 bracket, installed by MHA-MG-00 to tip projection"
      finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
      reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. Assembly RV-02 and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
