mg-magnifying-lever:
  number: MHA-MG-03
  material: Brass
  material_specification: Brass
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing  # selected quarter-inch body slides in the clamp
  process: "selected full-body 1/4 in brass rod accepted at Ø6.35 0/−0.05 (not an unverified supplier tolerance); 167.5 overall uses the ordinary .X title-block band, currently ±0.8; nominal free hemisphere tip and knife position unchanged; opposite end flat with 1/4-20 UNC-2A thread 18.00 at the title block .XX band, currently ±0.51, from the tip through the incomplete root runout; tip chamfer remains modeled 0.20, with hidden native primary-distance limits 0..0.25 from the title-block maximum, retained 45 degree entry indication and ordinary ±1 degree angular allowance; incomplete thread 1.905 MAX each end (1.5 pitches), with the conservative 0.258882578 tip-leg envelope charged ADDITIONALLY, not assumed inside that limit; constant-diameter stock outside the thread, no shoulder or relief groove; install by the assembly native 1.25 tip-projection dimension through the ordinary 12.50 ±0.51 MHA-MG-01 bracket: the single fitted interval gives worst full overlap 10.307234843 above 1.5D 9.525, with 0.815 root-runout clearance and 0.740 minimum projection. Overall rod length variation moves the fitted free tip and is included in operating travel; no separate fixed-useful-pose engagement claim. No locknut, set screw or adhesive; keep the complete MHA-MG-02 clamp bore on the plain body, clear of runout and thread"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "front view: the Ra 3.2 symbol on the Ø6.35 plain body, its reason MHA-MG-02 SCREW SEAT at the symbol."
      finding: "Ra 3.2 on a set/thumb-screw clamp face: a clamp face carries no symbol (rule 6, roughness symbols only where a surface runs, slides or locates)"
      reason: "owner ruling 2026-10-17, retained on the quarter-inch body in the 2026-10-20 threaded redesign: the plain body is the functional screw seat which locates the MHA-MG-02 clamp anywhere along its permitted travel; this is one static mating seat locating the part on its neighbour."
    - id: "RV-02"
      kind: "accept"
      where: "this lever's external thread in the MHA-MG-01 bracket, installed by MHA-MG-00 to tip projection"
      finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
      reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. Assembly RV-02 and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
