mg-magnifying-lever:
  number: MHA-MG-003
  material: Brass
  material_specification: Brass
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing   # the clamp block slides along the rod
  process: "selected cold-drawn brass rod, body Ø1/4 (6.35) 0/−0.03; 6-1/2 (165.1) ±0.8 tip-to-tip with tangent hemispherical ends; select or lap the bracket-end land to Ø6.350 0/−0.006, starting 3/8 (9.525) +0/−0.05 mm before the tip and ending at its dome tangent (6.35 mm nominal cylindrical engagement); light-press the MHA-MG-001 collar onto the rod held near its end and retain with Loctite 638, alternative soft solder or braze"
