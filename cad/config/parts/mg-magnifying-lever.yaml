mg-magnifying-lever:
  number: MHA-MG-03
  material: Brass
  material_specification: Brass
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing  # selected quarter-inch body slides in the clamp
  process: "selected full-body 1/4 in brass rod accepted at Ø6.35 0/−0.05 (not an unverified supplier tolerance); 167.5 ±0.8 overall, useful free hemisphere tip and knife position unchanged; opposite end flat with 1/4-20 UNC-2A thread 18.00 ±0.51 from the tip through the incomplete root runout; tip chamfer 0.20 ±0.05 at 45 degrees, incomplete thread 1.905 MAX each end (1.5 pitches); constant-diameter stock outside the thread, no shoulder or relief groove; the latest start of full thread clears the earliest receiver near face by 0.985; install by the assembly's native tip-projection dimension through the MHA-MG-01 bracket, with at least 1.5D FULL engaged thread; no locknut, set screw or adhesive; keep the complete MHA-MG-02 clamp bore on the plain body, clear of runout and thread"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "front view: the Ra 3.2 symbol on the Ø6.35 plain body, its reason MHA-MG-02 SCREW SEAT at the symbol."
      finding: "Ra 3.2 on a set/thumb-screw clamp face: a clamp face carries no symbol (rule 6, roughness symbols only where a surface runs, slides or locates)"
      reason: "owner ruling 2026-10-17, retained on the quarter-inch body in the 2026-10-20 threaded redesign: the plain body is the functional screw seat which locates the MHA-MG-02 clamp anywhere along its permitted travel; this is one static mating seat locating the part on its neighbour."
