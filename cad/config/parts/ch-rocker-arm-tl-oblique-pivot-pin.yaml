ch-rocker-arm-tl-oblique-pivot-pin:
  title: Rocker Oblique Trammel Pivot Pin
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-23
  material: 1144 stress-proof steel
  material_specification: 1144 stress-proof cold-drawn round, 1-1/2 in
  finish: as turned
  quantity: 2
  tolerance_class: machined_block
  process: >-
    turn both original fit journals, narrow inner-race bosses and integral
    36 x 3 flange from one piece; turn the upper boss nominally 12.35 from the
    flange top to the carrier seat; leave the lower boss long, measure the installed
    upper inner-race face against the block floor, and fit the boss for 0.10-0.15
    flange-rim floor clearance without bearing preload; keep the relieved broad
    underside clear of seal and outer race; drill the real 5 cross hole 18.5 above
    the carrier seat and 6 from the end; lead-chamfer both ends with carrier-end
    lead MAX 0.5 to preserve the cross-hole end ligament; limit seating shoulder
    fillets to R0.2 and flange edge breaks to 0.25. Before press assembly, inspect
    BOTH broad annular flange stop faces for their native total axial runout
    0.05 to datum A, the actual bearing-journal cylinder: hold the bearing journal
    in a clean collet, indicate its exposed cylindrical land at two separated
    axial stations to remove setup eccentricity and tilt, and restrain axial
    float without bending the pin. With an axial dial/test indicator, rotate
    through complete revolutions while sweeping the entire annular face radially,
    including radius 17.50 from datum A (diameter 35.00). Do not re-zero between
    radii: highest minus lowest reading over the ENTIRE face must be at most
    0.05 mm on EACH face, covering every azimuth and radius. Reposition the
    indicator to reach the opposite face; if the pin is rechucked, re-indicate
    datum A before accepting that face. Include setup repeatability and residual
    journal alignment error in the 0.05 maximum, not as extra allowances; record
    both full-face results before pressing. Press assembly loads only through the
    fitted races; destructive service presses upward from the lower pin end and
    replaces pin plus both bearings.
  machinist_exceptions:
    - id: RV-01
      kind: accept
      where: bearing-journal datum A and both integral-flange axial stop faces
      finding: total-runout frames and their datum over-specified under rule 5
      reason: >-
        User selected "Use standard GD&T" on 2026-10-21 for this pin only:
        total axial runout 0.05 to datum A on BOTH full annular flange stop
        faces, referenced to the actual 10.001-10.007 bearing-journal cylinder.
        These faces stop against MHA-CH-06-TL-22 and MHA-CH-06-TL-30 to capture
        the carrier mechanically even without bearing retention. Size bands
        cannot constrain face tilt to that axis; assembled C2 can hide it through
        bearing motion or cancelling tilts. The full-face control includes the
        diameter-35 inspection circle and preserves the capture_bounds limit
        atan(0.05/35), while additionally limiting face form. Inspect before press
        assembly; no geometry, numerical limit or other-package exception changed.
