dt-cylinder-gear:
  number: MHA-DT-12
  material: Brass
  material_specification: C36000 free-machining brass
  finish: "POLISH COSMETIC FACES ONLY; EXCLUDE BORE, CAM OD AND TEETH"
  quantity: 20
  tolerance_class: machined_block
  # Gear+cam composite: this part absorbs the former standalone eccentric-cam
  # (MHA-029, removed). fit_class is the gear's primary interface (gear_mesh);
  # the integral cam OD is additionally a cam_follower_contact bearing surface
  # for the connecting-rod strap (cam dims/provenance in build_dt_cylinder_gear.py).
  fit_class: gear_mesh
  process: "gear cutting: 120T 48DP PA20 with the finite 55T stock form cutter and integral custom eccentric cam"
  # OutsideDia uses the shared standard 0/-.004 in tip grade at .XXX.
  # Boston Y48120 is a pitch/count rim candidate, not this cutter-native composite:
  # face, bore/hub, actual flank and cam attachment require separate qualification.
  # Catalog selection does not establish availability or adaptation approval.
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view, the bore callout: .072 MIN WALL TO CAM OD"
      finding: "the crescent wall between the Ø.3760 bore and the Ø1.205 cam OD is .072 in at the printed worst case, under the .080 in target (rule 17), over the .060 in floor"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. Here (#992) the .3402 throw (the channel's kinematic gain), the owner-ruled Ø1.205 cam OD (MHA-CH-03 ring) and the .3760 running fit on MHA-DT-13 fix the wall at .072"
