dt-cylinder-gear:
  number: MHA-DT-12
  material: Brass
  material_specification: C36000 free-machining brass
  finish: "POLISH COSMETIC FACES ONLY; EXCLUDE BORE, CAM OD AND TEETH"
  quantity: 20
  tolerance_class: machined_block
  # Gear+cam composite: this part absorbs the former standalone eccentric-cam
  # (MHA-029, removed). fit_class is the gear's primary interface (gear_mesh);
  # the integral cam OD is additionally a cam_follower_contact bearing surface
  # for the connecting-rod strap (cam dims/provenance in build_dt_cylinder_gear.py).
  fit_class: gear_mesh
  process: "gear cutting: 120T 48DP PA20 with the finite 55T stock form cutter and integral custom eccentric cam; matched set of 20: finish-face gears 0-19 in order, each to .3000 less the running sum of the earlier gears' miced deviations from .3000, inside its printed .3000 +/-.0010; a replacement gear is faced to the set's shortfall"
  # Owner ruling 2026-11-11 (#2362, option g): the 20-gear stack meets its
  # MHA-DT-00 step 8E window (5.997-6.003 at the #1038 .300 in pitch) because
  # each gear absorbs the earlier gears' deviations while the band, the window
  # and the guards stay
  # as they are; steps 8F-8G (re-face the thickest, remake the thinnest)
  # remain the fallback.
  # OutsideDia uses the shared standard 0/-.004 in tip grade at .XXX.
  # Boston Y48120 is a pitch/count rim candidate, not this cutter-native composite:
  # face, bore/hub, actual flank and cam attachment require separate qualification.
  # Catalog selection does not establish availability or adaptation approval.
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view, the leader note on the cam's thin side: WALL .071 MIN TO BORE"
      finding: "the crescent wall between the Ø.3760 bore and the Ø1.205 cam OD is .071 in at the printed worst case, under the .080 in target (rule 17), over the .060 in floor"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. Here (#992) the .3402 throw (the channel's kinematic gain), the owner-ruled Ø1.205 cam OD (MHA-CH-03 ring) and the .3760 running fit on MHA-DT-13 fix the wall at .072; the throw band opened to ±.002 (Owner ruling 2026-11-08 (Pedro), #2144 item 8.2) takes it to .071"
