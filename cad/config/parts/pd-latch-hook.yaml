pd-latch-hook:
  title: Latch Hook
  number: MHA-PD-14
  # pd_latch_hook_spec.MATERIAL_TITLE: the title block's MATERIAL cell.
  material: ".032 C260 brass, H02 half hard"
  material_specification: "C26000 cartridge brass strip .032 in +/-.002 in, H02 half hard, ASTM B36, as supplied; McMaster-Carr 8859K86 (2 x 12 in strip). H01 quarter hard and annealed tempers are not acceptable"
  # Material (#2527). Owner ruling 2026-11-20 (Pedro): "no heat treatment for
  # now; pd-latch-hook should be changed to not require heat treatment"; of the
  # stocks put to him he chose half-hard C26000 brass, McMaster 8859K86, used
  # as supplied (the geometry and its bands unchanged).
  # Function: releasing the latch flexes the arm 5.2 mm along the pin at the
  # pin hole. pd_latch_hook_spec asserts that the thickest sheet's arm root
  # reaches the H02 minimum yield (ASTM B888, 290 MPa) only past twice that
  # flex (RELEASE_OVERPULL), so a 2x overpull does not set the leaf; H01 (145
  # MPa) and annealed brass fail that check, hence the temper requirement in
  # the FINISH cell. The ear's R.05 bend is R/t 1.47-1.56; C26000 H02's
  # published 90 deg minimum is R/t 0 across and along the rolling direction
  # (Aurubis C26000 datasheet), so the blank takes either orientation.
  finish: "bare, as supplied, no heat treatment; quarter-hard or annealed brass not acceptable"
  quantity: 1
  tolerance_class: machined_block
  process: ".032 in C26000 H02 half-hard brass strip, as supplied: cut the blank to the flat pattern, bend the ear 90 degrees, drill the screw holes from the formed ear, roll the arm and form the tab; fit to the support bar (its taps spotted through the screw holes), clamp the hanger at full feed mesh, transfer the latch pin's centre to the strip; remove, drill the pin hole on the mark, reinstall"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X Ø.128 DRILL THRU screw-hole callout: WALL .060 MIN TO EDGES (the +Y edge .060, the -Y edge .068 and the far -X end .061)"
      finding: "screw-hole walls to the base's edges below the .080 target at the finished worst case (rule 17)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 3.3: the .32 x .66 base and its .060 walls are confirmed (#2166 option A, the existing geometry kept), following the approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989), RV-04 on MHA-PD-18 (#1379) and RV-01 on MHA-PD-12 (#2124). Growing the base to .35 by .68 with the row at .169 restores .080 but moves the base edges into the lock sweep. Delegated ruling 2026-11-07 (Main, Q1): the MHA-PD-07 bar's taps are spotted through these holes at assembly, so their positions take the title block's .XXX row; the .080 unbroken wall pays the .010 outside edge break and the .010 hole-mouth break and lands at the .060 floor"
