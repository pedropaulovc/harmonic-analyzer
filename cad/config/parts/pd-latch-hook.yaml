pd-latch-hook:
  title: Latch Hook
  number: MHA-PD-14
  # pd_latch_hook_spec.MATERIAL_TITLE: the title block's MATERIAL cell.
  material: ".032 1095 sheet, annealed"
  material_specification: "1095 spring steel sheet .032 in +/-.002 in, annealed, ASTM A684; McMaster-Carr 9043K43"
  # Hardness (#2414): the shop tempers in its 450 F oven, so the print states
  # what that oven gives 1095. Not a spring temper: 44-50 HRC needs 650 F or
  # more (650 F gives 50 and 53-54 HRC on the sheets below). Not a temper
  # colour: blue forms near 560-600 F, also past the oven, and colours are
  # not dependable (MH 27th p.521-523, as the oven's shop record cites).
  # Oil-quenched 1095 tempered 2 h x 2:
  # 400 F 60-61, 450 F 57-58, 500 F 55-56 HRC (New Jersey Steel Baron 1095
  # heat-treat sheet, https://cdn.newjerseysteelbaron.com/wp-content/uploads/2020/07/1095-Heat-Treat-7-20.pdf,
  # read 2026-11-10); 400 F 62-63, 450 F 61-62, 500 F 59-60 HRC (Kevin
  # Cashen, https://cashenblades.com/2021/02/08/1095/, ASM, Carpenter and
  # Crucible data, read 2026-11-10). The oven's +/-25 F swing about 450 F
  # gives about 56-62 HRC across the two sheets, inside 55-62.
  # Function: releasing the latch flexes the arm 5.2 mm along the pin at the
  # pin hole, a 236 MPa peak at the arm's root (0.115 % strain; 250 MPa on
  # .034 sheet). Soft 1095 yields near 525 MPa (cold drawn; annealed is
  # lower), so a 2x overpull would set an unhardened leaf; at 55 HRC (tensile
  # about 1,900 MPa by the 3.45 x HB rule) the flex is a small fraction of
  # yield. The hardness keeps the leaf from taking a set and the pin hole's
  # bearing edge from wearing; 62 MAX keeps it tempered (as-quenched 64-66).
  # Park's AAA fully hardened 1/8 in 1095 and canola did not (Larrin
  # Thomas, https://knifesteelnerds.com/2021/07/19/which-quenching-oil-is-best-for-knives/),
  # so the quench is AAA. Shop kit: Pedro's approved heat-treat kit
  # (tools.torch-bernzomatic-ts8000, fixtures.fire-brick-chamber,
  # fixtures.quench-can-m2a1, consumables.quench-oil-parks-aaa and
  # anti-scale-atp-641, machines.tempering-oven,
  # gauges.oven-thermometer-taylor-5932, gauges.hardness-files), recorded in
  # cad/process/shop/inventory.toml up to 02fdd651e0.
  finish: hardened and tempered after drilling, 55-62 HRC
  quantity: 1
  tolerance_class: machined_block
  process: ".032 in annealed 1095 sheet: cut the blank to the flat pattern, bend the ear 90 degrees, drill the screw holes from the formed ear, roll the arm and form the tab annealed; fit to the support bar (its taps spotted through the screw holes), clamp the hanger at full feed mesh, transfer the latch pin's centre to the strip and drill the pin hole on the mark; remove; harden: brush on ATP-641, heat in the fire-brick chamber with the MAP torch to non-magnetic plus one shade (1450-1475 F) and soak 5 min, then quench in Park's AAA oil, arm tip first and straight down; temper at once in the tempering oven on the steel block at 450 F read on the oven thermometer, 2 h, air cool, then 2 h again; check on the base's edge that the 55 HRC file skates; reinstall"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X Ø.128 DRILL THRU screw-hole callout: WALL .060 MIN TO EDGES (the +Y edge .060, the -Y edge .068 and the far -X end .061)"
      finding: "screw-hole walls to the base's edges below the .080 target at the finished worst case (rule 17)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 3.3: the .32 x .66 base and its .060 walls are confirmed (#2166 option A, the existing geometry kept), following the approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989), RV-04 on MHA-PD-18 (#1379) and RV-01 on MHA-PD-12 (#2124). Growing the base to .35 by .68 with the row at .169 restores .080 but moves the base edges into the lock sweep. Delegated ruling 2026-11-07 (Main, Q1): the MHA-PD-07 bar's taps are spotted through these holes at assembly, so their positions take the title block's .XXX row; the .080 unbroken wall pays the .010 outside edge break and the .010 hole-mouth break and lands at the .060 floor"
