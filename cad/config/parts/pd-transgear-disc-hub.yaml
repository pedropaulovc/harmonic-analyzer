pd-transgear-disc-hub:
  title: Transgear Disc Hub
  number: MHA-PD-17
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): face, turn spigot, flange and hub, bore, face the spigot end and flange rear square to the bore in one setup; broach or shape the D-flat; drill the flange screw holes; match-drill the oil hole through hub and sleeve at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the flange rear face and spigot end squareness frames to the bore (datum A)"
      finding: "squareness frames over-specified (rule 5)"
      reason: "owner-accepted disc-cluster control keeping the flange and spigot square to the bore"
    - id: "RV-02"
      kind: "accept"
      where: "side view, the .5390 ±.0007 overall length (DISC CLUSTER STACK, NOT PROUD OF FEED PINION MHA-PD-10 NOSE)"
      finding: "tight part band holding the disc-cluster stack instead of a fit-up adjustment (rules 4, 19)"
      reason: "owner ruling #2038: nothing in the disc cluster is faced or shimmed at assembly, so this length carries the MHA-PD-00 end-float stack (transgear_cluster_fit); at ±.0007 the worst end float is .0080 (0.2032 mm) against the 0.20 mm floor, and ±.001 falls below it (owner exception, provisional pending confirmation 2026-11-01)"
    - id: "RV-03"
      kind: "accept"
      where: "side view, the .1440 ±.0007 spigot length (DISC CLUSTER STACK)"
      finding: "tight part band holding the disc-cluster stack instead of a fit-up adjustment (rules 4, 19)"
      reason: "owner ruling #2038: nothing in the disc cluster is faced or shimmed at assembly, so the spigot length is a printed term of the disc-front stack (transgear_cluster_fit) that sets the collar air pd_cluster_air holds (owner exception, provisional pending confirmation 2026-11-01)"
