pd-transgear-disc-hub:
  title: Transgear Disc Hub
  number: MHA-PD-17
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): face, turn spigot, flange and hub, ream the bore .3135 thru, face the spigot end and flange rear square to the bore in one setup; drill the flange screw holes; drill the #56 key-pin chord hole thru on -Y and ream it .0615 from +X to its stop; match-drill the oil hole through hub and sleeve at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the flange rear face and spigot end squareness frames to the bore (datum A)"
      finding: "squareness frames over-specified (rule 5)"
      reason: "owner-accepted disc-cluster control keeping the flange and spigot square to the bore"
    - id: "RV-02"
      kind: "minor"
      where: "the bore callout's last line: WALL .071 MIN (the spigot end; the hub front face .090)"
      finding: "spigot wall over the bore below the .080 target at the finished worst case (rules 17, 20)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 3.2: the .073 walls are kept (#2168 option A, the existing geometry kept), following the approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989), RV-04 on MHA-PD-18 (#1379) and RV-01 on MHA-PD-11 (#2124). The bore fits the MHA-PD-10 boss and the spigot the MHA-PD-06 bore, so the spigot wall cannot grow; a Ø.53 body restores .080 at the hub front only and takes .005 from the disc-screw head air and the knob-wheel gap. Each wall pays the .010 rim break and the .010 bore-mouth break: the body .098 to .078, the spigot .093 to .073 Delegated ruling 2026-11-12 (Main, #2412 brief: bore the MHA-PD-06 disc to a stock reamer size): the spigot is turned to Ø.498 (was Ø.501) so the disc's bore takes the owned .501 reamer at the same .0030-.0045 clearance; that thins the finished spigot wall from .073 to .0715 (prints .071), still inside the owner's .060-.080 thin-wall band (#989) this ruling applies; owner review #2144."
    - id: "RV-03"
      kind: "minor"
      where: "SECTION A-A, the key pin's Ø.0615 chord ream .174 ±.002 from the axis under the Ø.540 hub O.D."
      finding: "wall from the chord ream to the hub O.D. .0605 at the worst case, below the .080 target (rule 17)"
      reason: "Delegated ruling 2026-11-11 (Main), under owner ruling 2026-11-08 (Pedro), #2144 item 3.2: the approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989), as RV-02. The chord pin's side lies along the MHA-PD-10 flat (.136-.140 from the axis), so its .174 ±.002 axis and the largest .0620 ream fix the wall's inner side; the hub O.D. goes from Ø.52 to Ø.540 (.XXX, ±.005; its callout states the wall it holds), which holds the .060 floor (.2675 - .176 - .031 = .0605) where Ø.530 would not; pd_transgear_disc_hub_spec asserts it"
    - id: "RV-04"
      kind: "accept"
      where: "the key pin MHA-PD-VN-69 along the MHA-PD-10 flat (SECTION A-A, the chord .174 ±.002)"
      finding: "the pin's side stands .0006-.0087 off the flat, so the hub turns up to 8.3 deg each way on the sleeve before the pin bears: the drive is not positive at rest (rule 4)"
      reason: "Delegated ruling 2026-11-11 (Main), no precedent; owner review #2144: the stated play is the air that keeps the pin off the flat at every printed limit, so the hub still slides on and off with the pin in. The feed drives one way, so the play is taken up once and lost only on reversal, about .054 of paper (both sides of the play at the 12T's pitch radius)"
