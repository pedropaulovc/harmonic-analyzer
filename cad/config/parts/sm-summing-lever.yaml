sm-summing-lever:
  number: MHA-SM-03
  material_family: ferrous_noncritical
  finish: green enamel; mask knife edges and tapped holes; oil bare machined surfaces
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "machined from solid stock"
  # #2129: uniform coefficient slab X0..1.75, Y-.138..+.138, Z+/-3.00 (.276
  # thick) and the .276 counter web, both centred on the pivot/knife axis.
  # Shared positive rib: R.60 wrap, tangent flanks and R.040
  # blends into both coefficient faces at X1.41. The title block owns the
  # R.040 MAX ceiling; bounded native profile-blend and rib inner-cap-root guards
  # against plate, cylinder and counter web remain. Four longitudinal plate/web
  # cylinder families, the boss/crease and side-arc web families and the knife-stub roots
  # join every remaining inside corner without tangent propagation.
  # No R.040 blend reaches the receiver entry caps; the knife seat clears the stub roots.
  # Spring seats rise .038 (0.96 mm) with the plate top; the #1769 footprint is
  # unchanged and the spring pattern is Ø.010 (#2326).
  # The .354 receiver extends inward only; entry face and axes stay fixed.
  # Pad/ledge and sharp-junction (former RV-02) exceptions are eliminated.
  # Knife hardness debt (#1611) stays separate.
  # Native drawing contains six views on two sheets, reduced from nine views.
  # Native underside/swept-clearance and measured installed balance remain open.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-seat and 20-hole spring-pattern position frame (Ø.010 RFS to A|B|C; datum C, the coefficient-plate top the taps run through, clocks the pattern about A)"
      finding: "pattern position frame over-specified (rule 5)"
      reason: "one pattern control keeps the 20 channels spring geometry consistent (owner-accepted); its Ø.010 zone is the drawing guidelines' cap for a tap with no ream or register word, no longer tightened for neighbouring jam nuts, which #2326 removed"
    - id: "RV-03"
      kind: "accept"
      where: "front view, 2X R5.47 web arcs; words added to the Ø.75 callout: 'WEB ARCS RUN FROM QUADRANTS TO AXIS A AT ENDS'"
      finding: "the web arc endpoints are defined only in words added to the boss-diameter callout, and the arc centres are never located"
      reason: "owner ruling 2026-10-18: the arcs are non-functional web clearance, located by the boss Ø.75 and stub geometry they join (owner-accepted)"
    - id: "RV-04"
      kind: "accept"
      where: "the three native Hole Wizard tap callouts only (20X spring pattern, counter anchor, 2X bracket mounting taps): their drill-diameter, drill-depth and full-thread callout variables' places, written at drawing time from sm_summing_lever_notes SPRING_TAP_PRECISION / COUNTER_TAP_PRECISION / BRACKET_TAP_PRECISION by draw_sm_summing_lever through _drawing_hole_callout.set_hole_callout_precision (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes hole callout precision at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 set_hole_callout_precision call sites on main). Native experiment run 20261102T230110877Z: part-authored Hole Wizard precision did not reach the callout (read -1, the document default). Owner review #2144. This accepts no other precision, band, callout or package departure."
