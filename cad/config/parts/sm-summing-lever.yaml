sm-summing-lever:
  number: MHA-SM-003
  material_family: ferrous_noncritical
  finish: green enamel; mask knife edges and tapped holes; oil bare machined surfaces
  quantity: 1
  tolerance_class: machined_block
  process: "machined from solid stock"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-seat and 20-hole spring-pattern position frame (Ø0.15 RFS)"
      finding: "pattern position frame over-specified (rule 5)"
      reason: "one pattern control keeps the 20 channels spring geometry consistent; its Ø0.15 zone, tightened from Ø0.30 by owner ruling on code review C06, keeps neighbouring MHA-CH-014 jam nuts 0.25 apart with both taps at their worst (owner-accepted)"
    # TODO(#1625): remove RV-02 when the title block gains its inside-corner
    # default and this lever models R0.5 MAX stub roots / R0.4 MAX rib ends.
    - id: "RV-02"
      kind: "accept"
      where: "internal corners at the rib, web, boss, cylinder and plate junctions, the plate-to-pad step and the stub-to-end-rib shoulders"
      finding: "sharp internal corners with no stated fillet or maximum radius (rules 11, 16)"
      reason: "owner ruling 2026-10-18: machined from solid with an R1.0 MAX inside-corner ceiling; the shop-wide default goes in the title block under #1625, which also adds the local R0.5 MAX stub-root and R0.4 MAX rib-end limits (owner-accepted)"
