sm-summing-lever:
  number: MHA-SM-03
  material_family: ferrous_noncritical
  finish: green enamel; mask knife edges and tapped holes; oil bare machined surfaces
  quantity: 1
  tolerance_class: machined_block
  process: "machined from solid stock"
  # Option A: uniform coefficient slab X0..44.45, Y-4.46..2.54, Z+/-76.20,
  # 7.00 thick downward from the unchanged spring top; counter web stays
  # 5.08 centred. Shared positive rib: R15.24 wrap, tangent flanks and R1
  # blends into both coefficient faces at X35.75. The title block owns the
  # R1 MAX ceiling; bounded native profile-blend and rib inner-cap-root proofs
  # against plate, cylinder and counter web remain, without tangent propagation
  # onto receiver entry caps or knife shoulders. Not a general body-fillet claim.
  # Spring/nut seats, Ø0.15 pattern, receiver8.20 and #1769 footprint stay put.
  # Pad/ledge exceptions are eliminated; unchanged-junction RV-02 remains.
  # Knife-root radius/hardness debt stays separate from the proved rib roots.
  # Intended drawing reduction 9 -> 6 views awaits native regeneration.
  # Native underside/swept-clearance and measured installed balance remain open.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-seat and 20-hole spring-pattern position frame (Ø0.15 RFS)"
      finding: "pattern position frame over-specified (rule 5)"
      reason: "one pattern control keeps the 20 channels spring geometry consistent; its Ø0.15 zone, tightened from Ø0.30 by owner ruling on code review C06, keeps neighbouring MHA-CH-14 jam nuts 0.25 apart with both taps at their worst (owner-accepted)"
    # Carry forward b2c8d954 RV-02 only at the unchanged junctions below.
    # The eliminated pad step and changed, proved R1 rib-side roots are excluded.
    - id: "RV-02"
      kind: "accept"
      where: "the unchanged longitudinal coefficient-plate-to-pivot-cylinder and counter-web-to-pivot-cylinder junctions between rib caps; boss-to-counter-web and boss-to-negative-X-middle-rib-flank junctions; negative-X middle-rib-flank-to-counter-web face creases; and knife-stub-to-end-rib shoulders"
      finding: "sharp internal corners with no stated fillet or maximum radius (rules 11, 16)"
      reason: "owner ruling 2026-10-18, already authorized in b2c8d954 RV-02: machined from solid with an R1.0 MAX inside-corner ceiling; carry that authorization forward only for the listed unchanged junctions while the shop-wide default remains under #1625. The eliminated pad step, modeled profile blends and now-filleted rib inner-cap side roots against plate, cylinder and counter web are excluded. Unchanged knife-stub roots retain the separate #1625 local R0.5 MAX debt; knife material/hardness remains separate under #1611 (owner-accepted)"
    - id: "RV-03"
      kind: "accept"
      where: "front view, 2X R138.85 web arcs; words added to the Ø19.05 callout: 'WEB ARCS RUN FROM QUADRANTS TO AXIS A AT ENDS'"
      finding: "the web arc endpoints are defined only in words added to the boss-diameter callout, and the arc centres are never located"
      reason: "owner ruling 2026-10-18: the arcs are non-functional web clearance, located by the boss Ø19.05 and stub geometry they join (owner-accepted)"
