sm-gooseneck:
  number: MHA-SM-01
  material: 4130-N tube
  # Owner rulings 2026-11-08 (Pedro), #2315: the bent tube alone. The end plug
  # is its own part (MHA-SM-05), bonded at MHA-SM-00; the reference machine has
  # no leg sleeve, so MHA-FR-02's hub is bored to the tube; no plating.
  material_specification: "4130-N seamless steel tube, 1/2 in OD x 0.065 in wall (OnlineMetals 7322)"
  finish: polished bare; oil or wax
  quantity: 1
  tolerance_class: machined_block
  process: "1/2 in tube bent by hand on a simple shop-made grooved form with a tail; then both ends sawn and faced, the arm end to the reach and the foot to the overall height"
  drawing_unit: in
