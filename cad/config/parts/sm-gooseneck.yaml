sm-gooseneck:
  number: MHA-SM-01
  material: 4130-N tubes; mild steel end piece
  material_specification: "4130-N seamless steel tube, 1/2 in OD x 0.065 in wall (OnlineMetals 7322); sleeve 4130-N seamless 5/8 in OD x 0.058 in wall (OnlineMetals 7324); end piece AISI 1018 cold-drawn round, 5/8 in"
  finish: ASTM B456 SC2 Ni-Cr plate after joining; mask and oil c'bore and tap; oil bore; dims pre-plate
  quantity: 1
  tolerance_class: machined_block
  process: "1/2 in tube; end piece silver-brazed (or LOCTITE 638) and cooled or cured before bending; leg sleeve silver-brazed; end piece tapped 1/4-28 UNF-2B blind"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet 1, arm-end counterbore: C'BORE WALL .074 MIN"
      finding: "counterbore-to-OD wall .074 in minimum, below the .080 in target but above the .060 in floor (rule 17)"
      reason: "owner ruling 2026-10-27 (#1951, via coordinator Main): the whole gooseneck is 1/2 in tube ending flush, with no step, in the solid Ø.500 end piece, so the Ø.275/.279 counterbore that clears MHA-SM-04's thread run-out (single-pointed per Pedro's owner ruling 2026-11-05, coordinator session) leaves .074 at the worst printed limits (sm_gooseneck_spring_joint.COUNTERBORE_WALL_MIN, floored, never rounded up). No tighter band is allowed; the sheet states the wall."
    - id: "RV-02"
      kind: "accept"
      where: "sheet 1, note 4: JOIN END PIECE, COOL OR FULLY CURE, THEN BEND"
      finding: "process sequence stated in a note (rule 7, geometry not method)"
      reason: "owner ruling 2026-10-27 (#1997, via coordinator Main, on codjiflo's shank-to-bend-tangent finding): the end piece is joined before the tube is bent, and the braze cools or the retaining compound fully cures first, so the solid shank, .046 short of the bend's exit tangent, supports the tube through the bend. The owner asked for this order and cool-down on the sheet, briefly, and nothing more."
    - id: "RV-03"
      kind: "accept"
      where: "sheet 1, end view: the 1/4-28 tap ⌖ Ø.012 | A (A = the end piece's Ø.50 OD) and the counterbore ⌖ Ø.008 | B (B = the tap)"
      finding: "location zones tighter than the title block's hole-position row, on a turned end piece located from its OD (rule 16/19)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (sm Q6): the two zones are the radial offsets MHA-SM-04's thread run-out clearance and the counterbore wall are budgeted with (sm_gooseneck_spring_joint.THREAD_AXIS_OFFSET_MAX .006 and COUNTERBORE_AXIS_OFFSET_MAX .004); at the row's Ø.014 zone the run-out's .0015 radial clearance (RUNOUT_RADIAL_CLEARANCE_MIN) goes negative and the stated C'BORE WALL .074 MIN (RV-01) no longer holds. Both are turned in one chucking on the end piece's OD before it is brazed, so the zones are lathe-routine; they print as standard position frames instead of the former prose radial limits"
