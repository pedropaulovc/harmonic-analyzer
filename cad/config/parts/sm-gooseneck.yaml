sm-gooseneck:
  number: MHA-SM-01
  material: 4130-N tubes; mild steel end piece
  material_specification: "4130-N seamless steel tube, 1/2 in OD x 0.065 in wall (OnlineMetals 7322); sleeve 4130-N seamless 5/8 in OD x 0.058 in wall (OnlineMetals 7324); end piece AISI 1018 cold-drawn round, 5/8 in"
  finish: ASTM B456 SC2 Ni-Cr plate after joining; mask and oil tap; oil bore; dims pre-plate
  quantity: 1
  tolerance_class: machined_block
  process: "1/2 in tube; end piece silver-brazed (or LOCTITE 638) and cooled or cured before bending; leg sleeve silver-brazed; end piece tapped #10-24 UNC-2B blind"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "sheet 1, note 3: JOIN END PIECE, COOL OR FULLY CURE, THEN BEND"
      finding: "process sequence stated in a note (rule 7, geometry not method)"
      reason: "owner ruling 2026-10-27 (#1997, via coordinator Main, on codjiflo's shank-to-bend-tangent finding): the end piece is joined before the tube is bent, and the braze cools or the retaining compound fully cures first, so the solid shank, .046 short of the bend's exit tangent, supports the tube through the bend. The owner asked for this order and cool-down on the sheet, briefly, and nothing more."
    - id: "RV-04"
      kind: "minor"
      where: "sheet 1, end view, the #10-24 blind tap: ENGAGEMENT .220 MIN (1.16D)"
      finding: "full-thread engagement .220 in (1.16D), below rule 18's 1.5D"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 11.4 (option A, a shoulder screw seated on the end face); owner ruling 2026-11-08 (Pedro), #2144 item 11.4: bare slotted McMaster 91829A566, washer dropped, and this shortfall accepted with that choice: the catalogue screw's 3/8 thread, less its undercut (2.3368, the family's vendor model) and a 1.5-pitch tip lead, leaves .220 of full thread whatever the tap depth (sm_gooseneck_spring_joint.ENGAGEMENT_MIN, floored); the 18-8 screw runs in the 1018 end piece and the eye rides free on the shoulder, so the thread carries only the seated shoulder's preload."
