fr-top-frame:
  number: MHA-FR-02
  # Owner ruling 2026-11-10 (#2333, option a): a one-off gray-iron sand
  # casting poured from a 3D-printed pattern and machined on its seats only.
  # It supersedes the ferrous_noncritical family's low-carbon-steel
  # alternative and the "solid stock or casting" process. ASTM A48 class 25B:
  # the class is the minimum tensile and test bar B covers the controlling
  # section, the .51 webs; a class 30B heat also conforms.
  material: GRAY IRON, ASTM A48 CLASS 25B
  material_specification: GRAY IRON, ASTM A48 CLASS 25B
  finish: ALKYD PRIME/GREEN ENAMEL;MASK SEATS/BORES/THREADS;LIGHT OIL BARE METAL
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  # Owner rulings 2026-11-10, all in the model and on the print
  # (https://github.com/pedropaulovc/harmonic-analyzer/issues/2333).
  # tolerance_class stays machined_block: the title block serves the machined
  # features, and every as-cast dimension carries its own ±.03.
  #   B1  2° draft: added on the rail webs, the crossbar web and side walls,
  #       the plan gussets, junction lands, hub rib, hub V-gussets and the
  #       set-screw boss's side walls; taken out of the four corner-boss
  #       barrels, Ø1.77 held on the faced top
  #   B2  ±.03 on every printed dimension with an as-cast end; machined-to-
  #       machined dimensions keep the title block, and every proof charges
  #       the ±.03 at the as-cast limits
  #   B3  the four boss tops are faced seats (native finish symbol), so .18,
  #       .90 and .642 +.010/0 are machined-to-machined; the boss bottom
  #       prints 1.69 ±.03 below the faced top
  #   B4  the set-screw boss runs the rail's full height to the faced top;
  #       its cast face moves .87 -> .95 ±.03 from the gooseneck bore axis,
  #       held on the faced top, and the spot face stays .83
  #   B5  datum D stays the median plane of the as-cast crossbar sides,
  #       .99 ±.03 wide on the faced underside
  #   B6  six cast datum targets: E1-E3 on three boss bottoms, F1-F2 on the
  #       two rear boss barrels, G1 on the rear-west boss barrel
  #   D1  draft taken out on the faces B1 does not name: the .32 flange's
  #       outer and window rims and the hub-rib and land strips flush with
  #       them (nominal on the faced top), the hub boss barrel (Ø1.18 on the
  #       underside) and the set-screw boss face (.95 on the faced top)
  #   D2  G1 on the west barrel; the socket table's origin is the F|G (west,
  #       rear) corner and its coordinates are BASIC; the hanger holes leave
  #       the table, .XXX from the socket axes, and keep ⌖ .010 | D
  #   D3  web thickness ±.03 and web median ⌖ .06 | A | B; B is a new datum,
  #       the 4X socket pattern (the hole table's B1/B2 tags are gone)
  #   D4  draft angle 2° +1°/-0 where added, 2° ±1° where taken out
  #   D5  cross-screw counterbore floor .62 from the socket axis (was .65;
  #       fr_frame_attachment_spec.TOP_SCREW_SEAT_Z 128.524 -> 127.762 mm)
  #   D6  the sockets' upper position tier is Ø.06: ⌖ Ø.06 | E | F | G over
  #       ⌖ Ø.010 | A, printed as two single-segment frames (the drawing
  #       guidelines allow no composite frame; both tiers keep their values
  #       and datums)
  # Main's delegated ruling 2026-11-11 (#2333): the 4X Ø1.77 boss callout
  # carries ⌖ Ø.06 | A | B, each barrel on the faced top to the socket
  # pattern.  Targets F and G touch the barrels 1.56 under the faced top, so
  # the sockets' Ø.06 to E | F | G does not hold a barrel to its own socket;
  # the wall, keeper-foot and head-recess stacks charge this frame.  At every
  # printed limit at once the cross-screw head can stand .029 proud of the
  # counterbore mouth (.041 under it at nominal); that residual is the
  # owner's (#2516).
  process: "gray iron casting from a 3D-printed pattern, machined on the seats: the faced top and underside planes, the four boss tops, the faced top carried into the two west bosses under the MHA-CH-07 keeper feet (owner ruling 2026-11-11, #1038, option K5: the proud .18 removed inboard of a step .67 from each socket axis, its floor one plane with the faced top, root R.02 max), the edge breaks bordering those faced planes, tube sockets, cap recesses and their mouth chamfers, gooseneck bore and its mouth chamfer, set-screw tap and spot face, cross-screw counterbores, clearance holes and far-wall taps, hanger holes, dowel reams and knockouts, and the keeper taps transferred at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-hanger crossbar centring frame"
      finding: "position frames over-specified (rule 5)"
      reason: "owner ruling 2026-10-24 (ASME Y14.5-2018) and owner ruling 2026-10-24 T+H3: the crossbar centring frame bounds the hanger axes' shift off the crossbar median while retaining the screw/ream and side webs (owner-accepted knife-edge-system control); #290 restates it in decimal inch, and owner ruling 2026-11-06 restates it on the shop row: the hanger holes ⌖ .010 | D. Owner ruling 2026-11-08 (Pedro), #2144 item 11.3: the -X reams and their position frames are deleted (the earlier frames that took the +X reams as datums, and owner ruling 2026-11-06's 2X ⌖ Ø.004 | A | D, SEP REQT pair frame); each remaining ream is located .300 ±.005 from its #10 hole's axis (section F-F) and refined by RV-05's ⊥, and the MHA-SM-00 gauge bar, not the crossbar, sets the knife mounts' yaw. Owner rulings 2026-11-10 (#2333, B5 and D2): D stays the median plane of the as-cast crossbar sides, .99 ±.03 wide on the faced underside and 9.18 ±.03 from the G plane (sheet 7), and the hanger holes, off the hole table, are located .XXX from the socket axes (sheet 3)"
    - id: "RV-02"
      kind: "accept"
      where: "sheet 3 general note 'INSIDE CORNERS R.12 MAX UNLESS NOTED'"
      finding: "inside-corner radius stated in a general note rather than modelled (rules 2, 16, 21)"
      reason: "owner ruling 2026-10-18: the cast window corners and flange junctions take at most the casting's own R.12 root radius, stated once in the general note until the title block gains its inside-corner default (#1625); the model's T-roots carry the dimensioned R.12"
    - id: "RV-03"
      kind: "accept"
      where: "the whole-top 'Ra 125' facing note (linked note B), the underside-plane 'Ra 125' facing note (linked note C) and the 4X boss-top 'Ra 125' symbol (BOSS TOPS, 4X)"
      finding: "Ra 125 µin required over whole faced planes and on the four boss tops, not only the locating seats, and given in note text (rules 6, 7)"
      reason: "owner rulings 2026-10-11, 2026-10-12, 2026-10-14 and 2026-10-18: the top plane between the bosses and the underside plane between the bosses are each faced in one pass for a cohesive appearance, so the keeper feet, hanger washers and knife-mount seats land on one faced plane wherever fit-up puts them. Owner ruling 2026-11-10 (#2333, B3): the four corner-boss tops are faced too, their symbol being what requires the cut, so the cap recess depth, the boss height above the faced top and the cross-screw axis below the boss top are machined-to-machined"
    - id: "RV-04"
      kind: "accept"
      where: "sheet 3 general note 'CONVEX CAST EDGES .06 X 45 DEG WHERE SHOWN'"
      finding: "general .06 chamfer overrides the title-block edge break without a stated function (rules 1, 2)"
      reason: "owner rulings 2026-10-14 and 2026-10-18: the 1/16 in x 45 break on the convex casting edges is the machine's aesthetic, matching the base, printed .06 at .XX as a non-functional break (Main's #290 ruling); owner ruling 2026-11-07 rescopes it to the convex cast edges where the .06 break fits (the ones the views show chamfered): every other edge, including hole, bore, counterbore, spot-face and tap mouths and the edges the model leaves unbroken at .06 under the knife seats, beside the hub boss, on the crossbar flange's undersides (no shelf for the break at the as-cast limits) and round the set-screw boss on the faced top, takes the title block's .010 break, so no edge reads SHARP"
    - id: "RV-05"
      kind: "accept"
      where: "the knife-hanger press reams' perpendicularity refinement to the faced underside (2X ⊥ Ø.001 | A, section F-F)"
      finding: "orientation refinement over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the pressed dowels the knife mounts slip onto lean no more than the mounts' ⊥ Ø.001 holes and the slip clearance absorb, so the mounts slide home without binding (the assembly's slip-tilt contract); owner ruling 2026-11-06 sets the reams' ⊥ Ø.001 on the shop row, and owner ruling 2026-11-08 (Pedro), #2144 item 11.3 leaves one ream per station"
    - id: "RV-06"
      kind: "minor"
      where: "the MHA-SM-VN-53 knockout floor land: the 2X #51 knockouts (Ø.067 THRU ALL FROM REAM FLOOR) on the dowel ream axes, coaxial by the drawing alone"
      finding: "the pressed dowel's end flat bears on a .0124 minimum land, below the .016 floor-land target, at the drawn coaxiality's implied-zero ±.005 per axis (rules 16, 17)"
      reason: "owner ruling 2026-10-27 (knockout option c), re-confirmed by owner ruling 2026-10-28: accept the .0124 land at the drawn coaxiality's worst case rather than a method note (REAM SETUP) or a position frame, the knockout called out '#51 DRILL / 2X Ø.067 THRU ALL FROM REAM FLOOR' (2X since owner ruling 2026-11-08 (Pedro), #2144 item 11.3, one ream per station). The knockout is coaxial with its ream by process, drilled through from the ream in the same setup, and the common drawn axis is read at the title block's .XXX ±.005 per axis (owner ruling 2026-10-28), not the coarsest row an implied zero takes elsewhere. The dowel still bottoms on a continuous land (fr_top_frame_spec.HANGER_PIN_FLOOR_BEARING_LAND_MIN). The .0124 is computed with the knockout originating at the ream floor, as that callout's FROM REAM FLOOR row states, so the drawn coaxiality is held at the floor; drilled from the faced top, the #51's own drift at the floor (0.3 deg over the .967 run, .005) would also be charged and the land would fall to about .007"
    - id: "RV-07"
      kind: "accept"
      where: "the faced underside's knife-mount seat patches carry no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed .0004 seat conformity over the .540 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about .0008 (the ream and the MHA-SM-02 hole each at ⊥ Ø.001)"
    - id: "RV-09"
      kind: "accept"
      where: "the 4X tube sockets' two stacked position frames (⌖ Ø.06 | E | F | G over ⌖ Ø.010 | A, the pattern datum B, sheet 3) and the six cast datum targets E1-E3, F1-F2 and G1 with their BASIC locations (sheet 7)"
      finding: "position frame, datum targets and BASIC coordinates over-specified for a one-off casting (rules 1, 5)"
      reason: "owner rulings 2026-11-10 (#2333, B6, D2 and D6): the first setup stands on three cast boss bottoms (E1-E3) and against three cast barrel points (F1-F2 on the two rear barrels, G1 on the rear-west barrel), and the upper frame sets the socket pattern in the cast bosses from those six points within Ø.06; the lower frame keeps the four axes mutually located within Ø.010 and square to the faced underside for the MHA-FR-03 columns, and the BASIC table from the F|G corner is what the upper frame controls (owner-accepted)"
    - id: "RV-10"
      kind: "accept"
      where: "the rail webs' position frames (⌖ .06 | A | B under the 2X web-width callouts, sections H-H and E-E)"
      finding: "position frames on as-cast webs over-specified (rule 5)"
      reason: "owner ruling 2026-11-10 (#2333, D3): each rail web's median stays within ±.03 of its socket-axis line, which is what leaves the keeper 2-56 tap drill its .0807 minimum wall (target .080) and the T flange undersides their printed shelf once the web thickness takes the as-cast ±.03 (owner-accepted)"
    - id: "RV-11"
      kind: "accept"
      where: "the 4X corner bosses' position frame (⌖ Ø.06 | A | B, 4X, on the Ø1.77 ±.03 boss at the faced top, sheet 3)"
      finding: "position frame on as-cast bosses over-specified (rule 5)"
      reason: "Delegated ruling 2026-11-11 (Main), following owner precedent 2026-11-10 (#2333 D3, the rail webs' ⌖ .06 | A | B, RV-10, and D6, whose stacks charge a barrel within .03 of its socket); owner review #2144: each cast barrel stays within .03 of its machined socket, which is what leaves the socket wall .247 minimum at the boss bottom (.383 at the faced top, less half the barrel's ±.03, its steepest 3° draft over the 1.69 to the boss bottom, half the socket's .XXX band and that zone's radius) and each west barrel at least .160 past its keeper relief's step (owner ruling 2026-11-11, #1038, K5: the MHA-CH-07 keeper feet now stand .029 minimum off those machined steps, which are located from the socket axes, not off the barrels); the sockets' Ø.06 to E | F | G does not hold it, because F and G touch the barrels 1.56 under the faced top"
    - id: "RV-12"
      kind: "accept"
      where: "the added draft's callout (2° +1°/0° DRAFT, WEBS, CROSSBAR, POCKETS, GUSSETS, PADS, SET-BOSS SIDES, HOLDS 2-56 TAP WALL .080 MIN, sheet 7)"
      finding: "draft band tighter than the title block's ±1° on added-draft faces that hold no 2-56 tap wall (rule 4)"
      reason: "owner ruling 2026-11-10 (#2333, D4): faces where draft is added print 2° +1°/-0 and faces where it is taken out print 2° ±1°; the one band covers every added-draft face of the pattern, and its 2° minimum is what leaves the keeper 2-56 tap drill its .0807 wall in the rail web (.0636 at 1°, target .080) (owner-accepted)"
