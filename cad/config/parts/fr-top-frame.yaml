fr-top-frame:
  number: MHA-FR-02
  # Owner ruling 2026-11-10 (#2333, option a): a one-off gray-iron sand
  # casting poured from a 3D-printed pattern and machined on its seats only.
  # It supersedes the ferrous_noncritical family's low-carbon-steel
  # alternative and the "solid stock or casting" process. The A48 class is
  # the minimum tensile class, so a class 30 heat also conforms.
  material: GRAY IRON, ASTM A48 CLASS 25
  material_specification: GRAY IRON, ASTM A48 CLASS 25
  finish: ALKYD PRIME/GREEN ENAMEL;MASK SEATS/BORES/THREADS;LIGHT OIL BARE METAL
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "gray iron casting from a 3D-printed pattern, machined on the seats: the faced top and underside planes, tube sockets, cap recesses, gooseneck bore and the drilled, tapped and reamed holes"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-hanger crossbar centring frame"
      finding: "position frames over-specified (rule 5)"
      reason: "owner ruling 2026-10-24 (ASME Y14.5-2018) and owner ruling 2026-10-24 T+H3: the crossbar centring frame bounds the hanger axes' shift off the crossbar median while retaining the screw/ream and side webs (owner-accepted knife-edge-system control); #290 restates it in decimal inch, and owner ruling 2026-11-06 restates it on the shop row: the hanger holes ⌖ .010 | D. Owner ruling 2026-11-08 (Pedro), #2144 item 11.3: the -X reams and their position frames are deleted (the earlier frames to the +X reams as datums B front and C rear, and owner ruling 2026-11-06's 2X ⌖ Ø.004 | A | D, SEP REQT pair frame); each remaining ream is located .300 ±.005 from its #10 hole's axis (section F-F) and refined by RV-05's ⊥, and the MHA-SM-00 gauge bar, not the crossbar, sets the knife mounts' yaw"
    - id: "RV-02"
      kind: "accept"
      where: "sheet 3 general note 'INSIDE CORNERS R.12 MAX UNLESS NOTED'"
      finding: "inside-corner radius stated in a general note rather than modelled (rules 2, 16, 21)"
      reason: "owner ruling 2026-10-18: the cast window corners and flange junctions take at most the casting's own R.12 root radius, stated once in the general note until the title block gains its inside-corner default (#1625); the model's T-roots carry the dimensioned R.12"
    - id: "RV-03"
      kind: "accept"
      where: "the whole-top 'Ra 125' facing note (linked note B) and the underside-plane 'Ra 125' facing note (linked note C)"
      finding: "Ra 125 µin required over whole faced planes, not only the locating seats, and given in note text (rules 6, 7)"
      reason: "owner rulings 2026-10-11, 2026-10-12, 2026-10-14 and 2026-10-18: the top plane between the bosses and the underside plane between the bosses are each faced in one pass for a cohesive appearance, so the keeper feet, hanger washers and knife-mount seats land on one faced plane wherever fit-up puts them"
    - id: "RV-04"
      kind: "accept"
      where: "sheet 3 general note 'CONVEX CAST EDGES .06 X 45 DEG WHERE SHOWN'"
      finding: "general .06 chamfer overrides the title-block edge break without a stated function (rules 1, 2)"
      reason: "owner rulings 2026-10-14 and 2026-10-18: the 1/16 in x 45 break on the convex casting edges is the machine's aesthetic, matching the base, printed .06 at .XX as a non-functional break (Main's #290 ruling); owner ruling 2026-11-07 rescopes it to the convex cast edges where the .06 break fits (the ones the views show chamfered): every other edge, including hole, bore, counterbore, spot-face and tap mouths and the edges the model leaves unbroken at .06 under the knife seats and beside the hub boss, takes the title block's .010 break, so no edge reads SHARP"
    - id: "RV-05"
      kind: "accept"
      where: "the knife-hanger press reams' perpendicularity refinement to the faced underside (2X ⊥ Ø.001 | A, section F-F)"
      finding: "orientation refinement over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the pressed dowels the knife mounts slip onto lean no more than the mounts' ⊥ Ø.001 holes and the slip clearance absorb, so the mounts slide home without binding (the assembly's slip-tilt contract); owner ruling 2026-11-06 sets the reams' ⊥ Ø.001 on the shop row, and owner ruling 2026-11-08 (Pedro), #2144 item 11.3 leaves one ream per station"
    - id: "RV-06"
      kind: "minor"
      where: "the MHA-SM-VN-53 knockout floor land: the 2X #51 knockouts (Ø.067 THRU ALL FROM REAM FLOOR) on the dowel ream axes, coaxial by the drawing alone"
      finding: "the pressed dowel's end flat bears on a .0124 minimum land, below the .016 floor-land target, at the drawn coaxiality's implied-zero ±.005 per axis (rules 16, 17)"
      reason: "owner ruling 2026-10-27 (knockout option c), re-confirmed by owner ruling 2026-10-28: accept the .0124 land at the drawn coaxiality's worst case rather than a method note (REAM SETUP) or a position frame, the knockout called out '#51 DRILL / 2X Ø.067 THRU ALL FROM REAM FLOOR' (2X since owner ruling 2026-11-08 (Pedro), #2144 item 11.3, one ream per station). The knockout is coaxial with its ream by process, drilled through from the ream in the same setup, and the common drawn axis is read at the title block's .XXX ±.005 per axis (owner ruling 2026-10-28), not the coarsest row an implied zero takes elsewhere. The dowel still bottoms on a continuous land (fr_top_frame_spec.HANGER_PIN_FLOOR_BEARING_LAND_MIN). The .0124 is computed with the knockout originating at the ream floor, as that callout's FROM REAM FLOOR row states, so the drawn coaxiality is held at the floor; drilled from the faced top, the #51's own drift at the floor (0.3 deg over the .967 run, .005) would also be charged and the land would fall to about .007"
    - id: "RV-07"
      kind: "accept"
      where: "the faced underside's knife-mount seat patches carry no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed .0004 seat conformity over the .540 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about .0008 (the ream and the MHA-SM-02 hole each at ⊥ Ø.001)"
