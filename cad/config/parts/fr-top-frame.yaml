fr-top-frame:
  number: MHA-FR-02
  material_family: ferrous_noncritical
  finish: ALKYD PRIME/GREEN ENAMEL;MASK SEATS/BORES/THREADS;LIGHT OIL BARE METAL
  quantity: 1
  tolerance_class: machined_block
  process: "machined from solid stock or casting"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheet 6: the two knife-hanger dowel-slot position frames, ⌖ 0.05 | B | C▷ 'SLOT WIDTH ON B' (front slot) and ⌖ 0.05 | C | B▷ 'SLOT WIDTH ON C' (rear slot), with section F-F's toleranced 2X 15.264 ±0.13 MATCHES MHA-SM-02 slot station; and sheet 3's knife-hanger crossbar centring frame (2X HANGER AXES ON D)"
      finding: "position frames over-specified (rule 5); and the slot frames read as incomplete or missing their basics because no boxed basic dimension locates the slot: 2X 15.264 prints as an ordinary ±0.13 dimension, not basic (rule 5)"
      reason: "owner ruling 2026-10-24 under ASME Y14.5-2018: each sheet-6 slot frame controls only the slot WIDTH, its median plane centred on its own round hole (datum B front, datum C rear) at an implied basic 0 and an implied basic 90 deg to the B-C line, which need no printed basic; the toleranced 2X 15.264 ±0.13 sets the slot's position ALONG the slot and is the band the slot-travel (3.820 min against 3.795 required) and 2.0 wall stacks charge, so a basic along-slot dimension is not required and the frames are complete as drawn. The frames keep both knife mounts' dowel lines square to the knife-edge line and bound the hanger axes' shift off the crossbar median while retaining the screw/slot and side webs (owner-accepted knife-edge-system control)"
    - id: "RV-02"
      kind: "accept"
      where: "sheet 3 general note 'INSIDE CORNERS R3.0 MAX UNLESS NOTED'"
      finding: "inside-corner radius stated in a general note rather than modelled (rules 2, 16, 21)"
      reason: "owner ruling 2026-10-18: the cast window corners and flange junctions take at most the casting's own R3.0 root radius, stated once in the general note until the title block gains its inside-corner default (#1625); the model's T-roots carry the dimensioned R3.0"
    - id: "RV-03"
      kind: "accept"
      where: "the whole-top 'Ra 3.2' facing note (linked note B) and the underside-plane 'Ra 3.2' facing note (linked note C)"
      finding: "Ra 3.2 required over whole faced planes, not only the locating seats, and given in note text (rules 6, 7)"
      reason: "owner rulings 2026-10-11, 2026-10-12, 2026-10-14 and 2026-10-18: the top plane between the bosses and the underside plane between the bosses are each faced in one pass for a cohesive appearance, so the keeper feet, hanger washers and knife-mount seats land on one faced plane wherever fit-up puts them"
    - id: "RV-04"
      kind: "accept"
      where: "sheet 3 general note 'CONVEX EDGES 1.6 X 45 DEG UNLESS NOTED' and the SHARP exceptions it names"
      finding: "general 1.6 chamfer overrides the title-block edge break without a stated function (rules 1, 2)"
      reason: "owner rulings 2026-10-14 and 2026-10-18: the 1/16 in x 45 break on the convex casting edges is the machine's aesthetic, matching the base; hole, bore, counterbore, tap and slot mouths keep the title-block break"
