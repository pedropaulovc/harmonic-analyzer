fr-top-frame:
  number: MHA-FR-02
  material_family: ferrous_noncritical
  finish: ALKYD PRIME/GREEN ENAMEL;MASK SEATS/BORES/THREADS;LIGHT OIL BARE METAL
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "machined from solid stock or casting"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-hanger press ream position frames and the knife-hanger crossbar centring frame"
      finding: "position frames over-specified (rule 5)"
      reason: "owner ruling 2026-10-24 (ASME Y14.5-2018, this RV-01 as then accepted for the slot frames) and owner ruling 2026-10-24 T+H3: the knife-mount dowels press into these crossbar reams and the slots moved to MHA-SM-02 (its RV-01), so the reams' frames take the slot frames' place under the same knife-edge-system control: each -X ream ⌖ Ø.002 to the +X ream beside it (B front, C rear) at BASIC .600, clocked by the other station's +X ream (the BASIC added for the farm run 4 machinist review); owner ruling 2026-10-27 (#2016, option A) adds the reams' ⊥ refinement (RV-05). The frames keep both knife mounts' dowel lines square to the knife-edge line and bound the hanger axes' shift off the crossbar median while retaining the screw/ream and side webs (owner-accepted knife-edge-system control); #290 restates the frames in decimal inch"
    - id: "RV-02"
      kind: "accept"
      where: "sheet 3 general note 'INSIDE CORNERS R.12 MAX UNLESS NOTED'"
      finding: "inside-corner radius stated in a general note rather than modelled (rules 2, 16, 21)"
      reason: "owner ruling 2026-10-18: the cast window corners and flange junctions take at most the casting's own R.12 root radius, stated once in the general note until the title block gains its inside-corner default (#1625); the model's T-roots carry the dimensioned R.12"
    - id: "RV-03"
      kind: "accept"
      where: "the whole-top 'Ra 125 µIN' facing note (linked note B) and the underside-plane 'Ra 125 µIN' facing note (linked note C)"
      finding: "Ra 125 µin required over whole faced planes, not only the locating seats, and given in note text (rules 6, 7)"
      reason: "owner rulings 2026-10-11, 2026-10-12, 2026-10-14 and 2026-10-18: the top plane between the bosses and the underside plane between the bosses are each faced in one pass for a cohesive appearance, so the keeper feet, hanger washers and knife-mount seats land on one faced plane wherever fit-up puts them"
    - id: "RV-04"
      kind: "accept"
      where: "sheet 3 general note 'CONVEX EDGES .063 X 45 DEG UNLESS NOTED' and the SHARP exceptions it names"
      finding: "general .063 chamfer overrides the title-block edge break without a stated function (rules 1, 2)"
      reason: "owner rulings 2026-10-14 and 2026-10-18: the .063 (1/16 in) x 45 break on the convex casting edges is the machine's aesthetic, matching the base; hole, bore, counterbore, spot-face and tap mouths keep the title-block break"
    - id: "RV-05"
      kind: "accept"
      where: "the knife-hanger press reams' perpendicularity refinement to the faced underside (4X ⊥ Ø.0008 | A, section F-F)"
      finding: "orientation refinement over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the pressed dowels the knife mounts slip onto lean no more than the mounts' ⊥ .0006 holes and the slip clearance absorb, so the mounts slide home without binding (the assembly's slip-tilt contract)"
    - id: "RV-06"
      kind: "minor"
      where: "the MHA-SM-VN-53 knockout floor land: the 4X #51 knockouts (Ø.067 THRU ALL FROM REAM FLOOR) on the dowel ream axes, coaxial by the drawing alone"
      finding: "the pressed dowel's end flat bears on a .0124 minimum land, below the .016 floor-land target, at the drawn coaxiality's implied-zero ±.005 per axis (rules 16, 17)"
      reason: "owner ruling 2026-10-27 (knockout option c), re-confirmed by owner ruling 2026-10-28: accept the .0124 land at the drawn coaxiality's worst case rather than a method note (REAM SETUP) or a position frame, the knockout called out '#51 DRILL / 4X Ø.067 THRU ALL FROM REAM FLOOR'. The knockout is coaxial with its ream by process, drilled through from the ream in the same setup, and the common drawn axis is read at the title block's .XXX ±.005 per axis (owner ruling 2026-10-28), not the coarsest row an implied zero takes elsewhere. The dowel still bottoms on a continuous land (fr_top_frame_spec.HANGER_PIN_FLOOR_BEARING_LAND_MIN). The .0124 is computed with the knockout originating at the ream floor, as that callout's FROM REAM FLOOR row states, so the drawn coaxiality is held at the floor; drilled from the faced top, the #51's own drift at the floor (0.3 deg over the .967 run, .005) would also be charged and the land would fall to about .007"
    - id: "RV-07"
      kind: "accept"
      where: "the faced underside's knife-mount seat patches carry no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed .0004 seat conformity over the .540 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about .0017"
