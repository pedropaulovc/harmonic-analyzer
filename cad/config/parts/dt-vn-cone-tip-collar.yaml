dt-vn-cone-tip-collar:
  title: Cone Tip Stack Collar
  number: MHA-DT-VN-54
  description: "CUSTOM CONE TIP COLLAR WITH SET SCREW"
  material: Plain Carbon Steel
  material_specification: "1018 or 1215 low-carbon steel collar; 18-8 stainless stock set screw as supplied"
  stock: "3/4 in steel round bar; McMaster-Carr 94355A213 #2-56 x 5/16 in flat-tip set screw"
  finish: bare steel; protect collar with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: fastener_clearance
  process: "turn source-selected diameter .66 body, width .453, with diameter .25 south nose length .138 and tap station .295 (inch sheet); the single 0.50 coupled shift in cone_shaft_land_bands moves large collar material, shaft tip, tip block and platform pivot together while retaining engaged gear/post/crank stations; preserve native shoulder root and free-edge breaks, full printed 2.0 wall target, ordinary bands, radial tap/flat grades, full thread and socket reach; finish the same retained round-bore limits (native in-band representative prints diameter .0330 +/-.0010, not a zero-clearance shaft-sized hole); mill radial tap face; tap #2-56 2B through at the printed station; fit the supplied flat-point screw unaltered"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the set screw tap's native Hole Wizard callout only: its hw-thrutapdrldia callout variable's decimal places, written as 3 at drawing time from draw_dt_vn_cone_tip_collar.TAP_CALLOUT_PRECISION by draw_dt_vn_cone_tip_collar.build (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes Hole Wizard callout places at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Delegated ruling 2026-11-02 (Main), following owner precedent: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 call sites on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). Owner review #2144. This accepts no other precision, band, callout or package departure."
    - id: "RV-02"
      kind: "accept"
      where: "sheet 1 only: the three-place .138 nose length and .453 width on the turning view and the .295 tap station on VIEW A, printed bare (value and the title block's .XXX band, no words)"
      finding: "three-place sizes with no stated function (rule 3 over-specification), or a request to state their function, print them at .XX, or delete a note stating their tap-wall function (rules 3, 7, 17)"
      reason: "PROVISIONAL, pending owner confirmation (dt-vn-1 question Q1 to Main, 2026-11-07, sketch C:/farm-runs/fo-dt-vn-1/q-collar-walls.md). The three sizes hold the through 2-56 tap's walls to the shoulder and the end face at .081 MIN worst case (dt_vn_cone_tip_collar_spec.WORST_WALLS_MM); at .XX both walls fall to .064, under the .080 target, and any stated wall reason is design rationale under rule 7. This accepts no other band, place, wording or package departure."
