pd-feed-rack:
  title: Feed Rack
  number: MHA-PD-26
  # Owner rulings 2026-11-13 (#2410): the purchased strip alone, cut to the
  # platen's width and screwed by its flat top to the MHA-PD-27 bottom guide
  # rail; no backer, no solder. It replaces the retired MHA-PD-05.
  stock_name: Purchased Brass Rack Stock, 32DP PA20, 3/16 in Square, 48 in
  supplier: SDP/SI
  supplier_skus: [A 1B12-Y324]
  # https://shop.sdp-si.com/a-1b12-y324.html
  # https://sdp-si.com/D820/PDFS/Gears.pdf p. 1-193: Y = PA20; F = T = 3/16 in.
  # Commercial rack; no published pitch-accuracy grade, inventory or certification claim.
  material: Brass
  material_specification: "SDP/SI A 1B12-Y324 brass rack stock, 32DP PA20, 48 in, 3/16 in square"
  finish: "rack as purchased"
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "fabricated from purchased SDP/SI A 1B12-Y324 rack stock, cut to the platen's 10.62 in; four #0-80 taps in its flat top transferred through the MHA-PD-27 rail at MHA-PD-00, each over a tooth"
  drawing_unit: in
  installation_notes: |-
    CUT TO 10.62 IN; TAPS TRANSFERRED FROM MHA-PD-27 AT ASSEMBLY.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the sheet carrying only the two incoming stock sizes and the purchased-rack line"
      finding: "pitch-accuracy limits missing on the purchased rack (rule 12)"
      reason: "pitch accuracy is the catalogue part own; the assembly checks the running mesh over the whole engaged window (owner-accepted; carried over from the retired MHA-PD-05, the same purchased strip)"
