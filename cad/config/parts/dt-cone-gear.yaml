dt-cone-gear:
  number: MHA-DT-03
  description: "CONE GEAR, T006-T120 BY 6; 1 EACH"
  material: Brass
  material_specification: C36000 free-machining brass
  # The four cone-tip gears (T006-T024) are a harder high-zinc yellow metal in
  # the source machine (dimensions.yaml ch.12 p.21: Muntz metal / manganese
  # bronze, chosen because the finest teeth wear most). Manufacturing spec for
  # them; the title-block material above covers T030-T120 only.
  material_tip_specification: C67500 manganese bronze
  finish: AS MACHINED, UNCOATED
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "gear cutting: 48DP PA20 cutter-native cone family; actual specified finite stock/custom tool authority governs blank and plunge"
  drawing_unit: in
  # The current spec owns the actual cutter support, tip and floor geometry;
  # no ideal upper-flank continuation is a manufacturing substitute.
  # Earlier changed-profile studies refused 42/48/54T and other root/backlash cases.
  # T006 is cut by the custom DT6-FORM1 N6PA20 tool, option (a) (user ruling
  # 2026-10-10): root R1.10 with a drum-tip trochoid relief, on the .031 in
  # journal; it is the named contact-ratio exception (dt_cone_gear_spec,
  # test_standard_mesh_checks). The R1.491 tool with root MIN 2.346 is retired.
  # TODO(#1649): RV-01 is pending owner confirmation. The geometry follows
  # from two owner rulings, and changing it changes MHA-DT-04. #1649 lists
  # the options (two-piece tip, integral pinion, keep, push-broach, 1/16 land,
  # round pinned/soldered bore); one owner pick there closes this RV-01 and
  # MHA-DT-04's (#1644). Remove RV-01 when that pick lands.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheets T006 and T012, DETAIL A (bore): the Ø.0310 +.0018/+.0010 bore (BoreCutDia) with .0170 +.0008/+.0004 across the flat (BoreAF), through the face"
      finding: "the T006/T012 D-bore, ~.031 across with its flat ~.0015 past the centre and held to .0004 through the face, has no plausible hobby-shop route to cut or check"
      reason: "the bore is fixed by owner rulings, not chosen on this sheet: the .031 in terminal land of MHA-DT-04 that T012 and T006 slide on (user ruling U40, 2026-09-23, https://github.com/pedropaulovc/harmonic-analyzer/issues/971#issuecomment-6151646064; DT6-FORM1 option (a), 2026-10-10; #290 moved the land from 1/32 to .031 for the .0320 micro reamer) and one D-flat on every gear land, run out through the tip, phasing every gear to the shaft (user ruling 2026-09-28, recorded in dt_cone_gear_shaft_spec FLAT_OFFSETS); the sliding fit is .0010-.0026 diametral and .0004-.0012 across the flat on that land; the geometry decision is open with the owner at https://github.com/pedropaulovc/harmonic-analyzer/issues/1649"
    - id: "RV-02"
      kind: "accept"
      where: "every gear sheet, DETAIL A (bore): the D-bore diameter callout 'Ø… THRU' (BoreCutDia)"
      finding: "the bore callout gives no process word such as REAM or BORE (rule 12)"
      reason: "owner ruling 2026-09-29 took the process word off both D-bores (MHA-DT-03 and MHA-DT-07): a through reamer would cut away the flat, the dimensions define the D-profile, and the route belongs in the book, not on the print (https://github.com/pedropaulovc/harmonic-analyzer/commit/7b9ed689199b72c7b0b9db70bfee9ca4fd497e4f)"
    - id: "RV-03"
      kind: "minor"
      where: "sheet T012, front view: the root-to-bore web stated by the native .0797 MIN dimension (WebMin) from the Ø.0310 +.0018/+.0010 bore to the root envelope MIN"
      finding: "the T012 web is .0797 in (2.0244 mm) at the printed worst case (largest bore .0328, smallest root envelope .1922): .0003 in under the .080 in target (rule 17), .0197 in over the .060 in floor"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. Here the .031 terminal land (cut by the .0320 micro reamer) and the cutter-native T012 root fix the web at .0797; anything thinner must be ruled again"
    - id: "RV-04"
      kind: "minor"
      where: "sheet T006, GEAR DATA: WEB MIN (REF): .0256"
      finding: "the T006 root-to-bore web is .0256 in at the printed worst case (largest bore .0328, smallest root envelope .0840), under the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-01: accepted until #1649. The .031 terminal land and its D-bore (RV-01) and the cutter-native T006 root (DT6-FORM1) fix the web; #1649's tip-land geometry pick replaces it"
    - id: "RV-05"
      kind: "accept"
      where: "sheet T006 and its continuation sheet 21: the tip Ø.1696 +.0000/-.0008 on the side view, the CIRCULAR TOOTH THICKNESS .0343 +.0000/-.0016 on the front view, and FORM TOLERANCE: X +.0008 / -.0000 on sheet 21, each flagged SEE NOTE 2 (accept over pins, then by backlash with MHA-DT-12 at assembly)"
      finding: "the three T006 tooth bands are converted millimetre widths, not plain inch steps, and narrower than their shop-table rows (rule 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 9.3 (fan-out OQ-3: keep, with routes). The bands are the custom DT6-FORM1 tooth's (dt_cone_gear_spec CUSTOM_SIX_*): widening the thickness to -.0020 fails the spec's tip-land minimum, and the over-pins then backlash acceptance in note 2 and GEAR DATA is the fit route. Accepts the notation and width of these three T006 bands only, no other band or callout departure."
    - id: "RV-06"
      kind: "accept"
      where: "every gear sheet, DETAIL A: the D-bore Ø +.0018/+.0010 THRU and BORE ACROSS FLAT +.0008/+.0004, each flagged SEE NOTE 1 (made to the measured MHA-DT-04 land, clearance REF)"
      finding: "+.0018/+.0010 and +.0008/+.0004 are converted millimetre bands, not plain inch steps (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out rulings F2 and F5). The limits come from the fleet-shared gear_seat_fit and cone_shaft_land_bands.FLAT_AF_BAND, restated in inch steps at that family's next re-key; widening the flat to its row would let the D-flat clock each gear up to 11.6 degrees against its ±.25 degree phase. The matched-fit route to the measured land is printed in note 1. Accepts this notation only, no other band or callout departure."
