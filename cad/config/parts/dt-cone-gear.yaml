dt-cone-gear:
  number: MHA-DT-03
  description: "CONE GEAR, T012-T120 BY 6; 1 EACH"
  material: Brass
  material_specification: C36000 free-machining brass
  # The three cone-tip gears of this family (T012-T024) are a harder
  # high-zinc yellow metal in the source machine (dimensions.yaml ch.12 p.21:
  # Muntz metal / manganese bronze, chosen because the finest teeth wear
  # most). Manufacturing spec for them; the title-block material above covers
  # T030-T120 only. T006 is its own part, MHA-DT-37 (dt-cone-tip-gear).
  material_tip_specification: C67500 manganese bronze
  finish: AS MACHINED, UNCOATED
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "gear cutting: 48DP PA20 cutter-native cone family; actual specified finite stock/custom tool authority governs blank and plunge"
  drawing_unit: in
  # The current spec owns the actual cutter support, tip and floor geometry;
  # no ideal upper-flank continuation is a manufacturing substitute.
  # Earlier changed-profile studies refused 42/48/54T and other root/backlash cases.
  # Owner decision 2026-11-09, C1 keyed (PR #1992): no D-bore remains. T012
  # and T018 are reamed for MHA-DT-37's spigot and T024 for MHA-DT-04's round
  # land 2, each a bonded slip fit; T030-T120 are broached for the land-1 key.
  # Retired with that decision: RV-01 (the .031 D-bore of T006/T012), RV-02
  # (no process word on the D-bores; the 2026-09-29 no-REAM ruling applied to
  # the D-bores only), RV-04 (T006's web; T006 is MHA-DT-37). RV-05 (the
  # T006 tooth bands) moved to MHA-DT-37 with its sheet. The 2026-09-28
  # ruling "one flat per gear land; no keys, no solder, no retaining compound;
  # no gear bonded" is superseded by C1 keyed. RV-06 (the converted
  # +.0018/+.0010 bore band) retired with fit audit 2026-11-23
  # (MHA-DT-03.keyed_bore, .T024_bore): every bore prints its reamer's size
  # with no band, MHA-DT-04's land turned last to it; RV-03 and RV-07 name
  # the bores as printed, their webs at the reamer's modelled largest cut.
  machinist_exceptions:
    - id: "RV-03"
      kind: "minor"
      where: "sheet T012, front view: the root-to-bore web stated by the native .0674 MIN dimension (WebMin) from the Ø.0625 REAM THRU bore (largest modelled cut .0630) to the root envelope MIN"
      finding: "the T012 web is .0674 in (1.7120 mm) at the printed worst case (largest bore .0630, smallest root envelope .1979): .0126 in under the .080 in target (rule 17), .0074 in over the .060 in floor"
      reason: "Owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992), C1 keyed: T012 is reamed round Ø.0625 and bonded on MHA-DT-37's Ø.0625 spigot, which must stand under T006's root so the DT6-FORM1 cutter runs off; the cutter-native T012 root fixes the web (research: drive-train-cone-tip-options.md, option C), ruled at .0646. It replaces the 2026-11-01 ruling's .0797 on the retired .031 terminal land. Owner ruling 2026-11-22 (Pedro, #2473, option G) made T012's tooth thickness +.003/-0 at the same cutter and depth, so the cutter no longer sinks to a thin limit and the root envelope MIN rises from .1922 to .1979: the web is .0674, thicker than ruled. Anything thinner than .0674 must be ruled again"
    - id: "RV-07"
      kind: "minor"
      where: "sheet T030, GEAR DATA: WEB MIN (REF): .0631, root envelope to the hub keyway's top corner (KeyedBoreProfile: Ø.3760 REAM THRU bore, smallest modelled cut .3760; KeywayWidth .0625 +.0020/-.0000, KeywayT .4025 ±.003, printed as limits .4055/.3995)"
      finding: "the T030 web is .0631 in at the printed worst case (root envelope MIN .5661, keyway corner at T MAX .4055 from the far side of the smallest bore .3760, keyway at its widest .0645): .0169 in under the .080 in target (rule 17), .0031 in over the .060 in floor"
      reason: "Owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992), C1 keyed: land 1 takes a 1/16 square key (MHA-DT-VN-71) and T030-T120 are broached for it, replacing the land's D-flat. The research's .0641 is at the keyway's centreline; the corner, nearer the root, governs. ANSI B17.1's 3/32 key would leave T030 .052, under the floor, so the owner took the 1/16 key; T036 up keep .124 or more. Anything thinner must be ruled again"
    - id: "RV-08"
      kind: "accept"
      where: "every sheet T012-T120: the gear face width's nominal .2934, printed at four places with its .002 band (FaceWidth)"
      finding: "a four-place nominal off the .001 grid (rule 3)"
      reason: "Owner ruling 2026-11-20 (Pedro, triage of 2026-11-19, #2631): 'Follow recommendations unless noted otherwise', accepting the recommendation 'Exempt closure (RV row): no geometry change, sheet text only'. The face is the 20-gear stack closure, dt_cone_gear_spec.FACE_WIDTH = SEAT_PITCH floored to four millimetre places (7.4528 mm), not a fabricated size snapped to a grid; .293 would re-key the cone stack closure and every cone gear. Accepts this nominal's four places only, no other band or callout departure."
