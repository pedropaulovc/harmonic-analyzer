dt-cone-gear:
  number: MHA-DT-003
  description: "CONE GEAR, T006-T120 BY 6; 1 EACH"
  material: Brass
  material_specification: C36000 free-machining brass
  # The four cone-tip gears (T006-T024) are a harder high-zinc yellow metal in
  # the source machine (dimensions.yaml ch.12 p.21: Muntz metal / manganese
  # bronze, chosen because the finest teeth wear most). Manufacturing spec for
  # them; the title-block material above covers T030-T120 only.
  material_tip_specification: C67500 manganese bronze
  finish: AS MACHINED, UNCOATED
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "gear cutting: 48DP PA20 cutter-native cone family; actual specified finite stock/custom tool authority governs blank and plunge"
  # The current spec owns the actual cutter support, tip and floor geometry;
  # no ideal upper-flank continuation is a manufacturing substitute.
  # Earlier changed-profile studies refused 42/48/54T and other root/backlash cases.
  # T006 is cut by the custom DT6-FORM1 N6PA20 tool, option (a) (user ruling
  # 2026-10-10): root R1.10 with a drum-tip trochoid relief, on the 1/32 in
  # journal; it is the named contact-ratio exception (dt_cone_gear_spec,
  # test_standard_mesh_checks). The R1.491 tool with root MIN 2.346 is retired.
