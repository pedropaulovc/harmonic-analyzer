dt-cone-gear:
  number: MHA-DT-03
  description: "CONE GEAR, T012-T120 BY 6; 1 EACH"
  material: Brass
  material_specification: C36000 free-machining brass
  # The three cone-tip gears of this family (T012-T024) are a harder
  # high-zinc yellow metal in the source machine (dimensions.yaml ch.12 p.21:
  # Muntz metal / manganese bronze, chosen because the finest teeth wear
  # most). Manufacturing spec for them; the title-block material above covers
  # T030-T120 only. T006 is its own part, MHA-DT-37 (dt-cone-tip-gear).
  material_tip_specification: C67500 manganese bronze
  finish: AS MACHINED, UNCOATED
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  process: "gear cutting: 48DP PA20 cutter-native cone family; actual specified finite stock/custom tool authority governs blank and plunge"
  drawing_unit: in
  # The current spec owns the actual cutter support, tip and floor geometry;
  # no ideal upper-flank continuation is a manufacturing substitute.
  # Earlier changed-profile studies refused 42/48/54T and other root/backlash cases.
  # Owner decision 2026-11-09, C1 keyed (PR #1992): no D-bore remains. T012
  # and T018 are reamed for MHA-DT-37's spigot and T024 for MHA-DT-04's round
  # land 2, each a bonded slip fit; T030-T120 are broached for the land-1 key.
  # Retired with that decision: RV-01 (the .031 D-bore of T006/T012), RV-02
  # (no process word on the D-bores; the 2026-09-29 no-REAM ruling applied to
  # the D-bores only), RV-04 (T006's web; T006 is MHA-DT-37). RV-05 (the
  # T006 tooth bands) moved to MHA-DT-37 with its sheet. The 2026-09-28
  # ruling "one flat per gear land; no keys, no solder, no retaining compound;
  # no gear bonded" is superseded by C1 keyed.
  machinist_exceptions:
    - id: "RV-03"
      kind: "minor"
      where: "sheet T012, front view: the root-to-bore web stated by the native .0646 MIN dimension (WebMin) from the Ø.0625 +.0005/-.0000 reamed bore to the root envelope MIN"
      finding: "the T012 web is .0646 in (1.6408 mm) at the printed worst case (largest bore .0630, smallest root envelope .1922): .0154 in under the .080 in target (rule 17), .0046 in over the .060 in floor"
      reason: "Owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992), C1 keyed: T012 is reamed round Ø.0625 and bonded on MHA-DT-37's Ø.0625 spigot, which must stand under T006's root so the DT6-FORM1 cutter runs off; the cutter-native T012 root fixes the web at .0646 (research: drive-train-cone-tip-options.md, option C). It replaces the 2026-11-01 ruling's .0797 on the retired .031 terminal land. Anything thinner must be ruled again"
    - id: "RV-06"
      kind: "accept"
      where: "sheets T024-T120: the bore Ø +.0018/+.0010 (REAM THRU; BoreCutDia on T024's front view, KeyedBoreDia in DETAIL A on T030-T120), flagged SEE NOTE 1"
      finding: "+.0018/+.0010 is a converted millimetre band, not a plain inch step (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out rulings F2 and F5). The limits come from the fleet-shared gear_seat_fit seat class on MHA-DT-04's GEAR_SEAT_BAND, restated in inch steps at that family's next re-key. Re-scoped by owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): no D-bore or across-flat band remains, and T012/T018 take the reamer's plain +.0005/-.0000. Accepts this notation only, no other band or callout departure."
    - id: "RV-07"
      kind: "minor"
      where: "sheet T030, GEAR DATA: WEB MIN (REF): .0621, root envelope to the hub keyway's top corner (KeyedBoreProfile: Ø.3750 +.0018/+.0010 bore, KeywayWidth .0625 +.0020/-.0000, KeywayT .4045 ±.0020)"
      finding: "the T030 web is .0621 in at the printed worst case (root envelope MIN .5661, keyway corner at T MAX .4065 from the far side of the smallest bore .3760, keyway at its widest .0645): .0179 in under the .080 in target (rule 17), .0021 in over the .060 in floor"
      reason: "Owner ruling 2026-11-09 via PR #1992 (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992), C1 keyed: land 1 takes a 1/16 square key (MHA-DT-VN-71) and T030-T120 are broached for it, replacing the land's D-flat. The research's .0641 is at the keyway's centreline; the corner, nearer the root, governs. ANSI B17.1's 3/32 key would leave T030 .052, under the floor, so the owner took the 1/16 key; T036 up keep .124 or more. Anything thinner must be ruled again"
