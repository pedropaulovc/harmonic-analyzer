dt-pinion-lift-rod:
  title: Pinion Lift Rod
  number: MHA-DT-17
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-finished steel shafting
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "machined (steel)"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheet 1, main (side) view: the 198.3 body length from the flat end to the SR4.8 / Ø6.35 crown rim, with (199.5) the reference overall to the dome tip"
      finding: "the toleranced length stops at the edge-broken crown rim and reads like an overall that is not one, while the true overall is only a reference (rules 10 and 11)"
      reason: "owner ruling, 2026-10-19: the rod's rim is set flush with the MHA-DT-18 back block's outer face, so the rig's worst fitted stacks (pinion_rig_layout lift_rod_seat_stack and lever_north_travel_stack) read the rim-to-flat-end length's .X band. Tolerancing the overall instead stacks the crown sagitta on it (-0.22/+0.37 under SR4.8 at .X on the Ø6.35 h band), and the lever throw plane's air to the torque shaft front end would fail by 0.33 (0.04 slack today). The body length stays the controlling size, and (199.5) stays the reference overall"
