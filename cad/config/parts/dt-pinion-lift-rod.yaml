dt-pinion-lift-rod:
  title: Pinion Lift Rod
  number: MHA-DT-17
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-finished steel shafting
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheet 1, main (side) view: the body length from the flat end to the SR.19 / Ø.2500 crown rim, with the reference overall to the dome tip in parentheses"
      finding: "the toleranced length stops at the edge-broken crown rim and reads like an overall that is not one, while the true overall is only a reference (rules 10 and 11)"
      reason: "owner ruling, 2026-10-19: the rod's rim is set flush with the MHA-DT-18 back block's outer face, so the rig's worst fitted stacks (pinion_rig_layout lift_rod_seat_stack and lever_north_travel_stack) read the rim-to-flat-end length's band (.XX on the #290 inch sheet). Tolerancing the overall instead would stack the crown sagitta's band on both stacks. The body length stays the controlling size, and the overall stays a reference"
