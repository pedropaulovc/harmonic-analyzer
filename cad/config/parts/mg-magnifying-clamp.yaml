mg-magnifying-clamp:
  number: MHA-MG-02
  material: Brass
  material_specification: Brass
  finish: machined; chemically blackened (brass black)
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: >-
    Cut 29.50 long from 1/2 hex brass, AF acceptance 12.57–12.83 and transverse
    envelope 15.00 MAX over the full height; flats as supplied. Face both ends
    square to the nominal hex axis; the bottom is the MHA-MG-04 shoulder seat.
    Drill Ø6.50 +0.10/0 through the corners at 19.95 from the bottom, sliding
    on the MHA-MG-03 quarter-inch body. Locate the bore axis and both #4-40
    axes independently 6.35 from the same actual full-height Z flat at the
    ordinary .XX ±0.51 band; also locate each #4-40 entry 6.35 from its actual
    diagonal stock flat. Do not assume a perfect common stock axis.
    Tap the top into the bore (6.30 REF thread, 9.55 drill); retain the blind
    bottom rod tap at 8.55 full thread and 12.75 drill at the .XX band.
    Inspect 2.0 MIN finished net wall at the bore and both taps throughout
    their depth; AF alone does not certify stock form or those finished walls.
    Full-depth 15.00 tan(0.3 degree) angular run-off and actual relative-axis
    limits feed the finite-tip male/female FULL overlap and drill-cone checks.
    Seat the actual stock thumb screw on the lever before inspecting overlap
    and collar clearance. Chemically blacken.
