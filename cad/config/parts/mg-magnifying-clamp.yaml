mg-magnifying-clamp:
  number: MHA-MG-02
  material: Brass
  material_specification: Brass
  finish: machined; chemically blackened (brass black)
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  drawing_unit: in
  process: >-
    Cut 1.16 long from 1/2 hex brass. The flats are as bought: (1/2 in) is
    a stock REF, untoleranced; the supplier governs it, assumed ±.005 for
    the wall checks. Face both ends square to the nominal hex axis; the
    bottom is the MHA-MG-04 shoulder seat.
    Drill Ø.257 (F) +.004/0 through the corners at .79 from the bottom, sliding
    on the MHA-MG-03 quarter-inch body. Locate the bore axis and both #4-40
    axes independently .25 from the same actual full-height Z flat at the
    ordinary .XX ±.01 band; also locate each #4-40 entry .25 from its actual
    diagonal stock flat. Do not assume a perfect common stock axis.
    Tap the top into the bore (.25 REF thread, .37 drill); retain the blind
    bottom rod tap at .33 full thread and .48 drill at the .XX band.
    There is no custom finished wall or envelope inspection.
    The supplied hex at ±.005 and ±1 degree flats gives a conservative
    calculated full-height transverse bound of .66; it is not a printed
    stock limit. Including location, drilled diameter, flat angle and drill
    wander gives .0895 minimum bore-to-flat wall, above the .080 rule-17
    target; the blind drill-point floor is .1281. No perfect common stock centre or
    all-standard-thread-root guarantee is claimed.
    The full .66 tan(0.3 degree) run-off feeds the finite-tip male/female
    FULL overlap and drill-cone checks.
    Seat the actual stock thumb screw on the lever before inspecting overlap
    and collar clearance. Chemically blacken.
