mg-magnifying-clamp:
  number: MHA-MG-02
  material: Brass
  material_specification: Brass
  finish: machined; chemically blackened (brass black)
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "cut 29.50 long from 7/16 hex bar (brass), flats as supplied: face both ends square to the hex axis (the bottom face is the MHA-MG-04 shoulder seat); hold on flats and centre-drill the corner ridge before drilling the Ø6.50 +0.10/0 lever bore through the corners at 19.95 from the bottom, sliding on the MHA-MG-03 quarter-inch body; tap #4-40 from the top face on the hex axis into the bore (6.30 REF thread, 9.55 drill) and #4-40 blind from the bottom face on the hex axis; retain the rod tap 8.55 full thread and 12.75 drill at the .XX band; spend 0.10 plus 0.3 degree angular wander over maximum-stock half depth at the bottom tap and full depth at the exit-side flats/contact; rod-tap floor 2.036 minimum, whole-flat wall 2.023 minimum; actual stock thumb-tip chamfer 0.47625 and finite-tip/angle envelope included in installed male/female FULL overlap 4.313 minimum, collar clearance 3.373 minimum; chemically blacken"
