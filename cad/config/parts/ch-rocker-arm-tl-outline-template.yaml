ch-rocker-arm-tl-outline-template:
  title: Rocker Arm Outline Template
  # Shop gauge: the parent MHA-CH-006 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-006-TL-13
  material: AISI O1 tool steel
  material_specification: AISI O1 precision ground flat stock, 1/8 in, as supplied (annealed)
  finish: annealed as supplied; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  process: "bought: cut by wire EDM from this CAD (outline, pivot hole and rod slot) at an outside vendor; no shop operations"
  machinist_exceptions:
    - id: "TL-01"
      kind: "accept"
      where: "the rod slot station, BASIC 133.067 and 8.456 from the pivot centreline"
      finding: "basic dimensions with no feature-control frame (rule 5)"
      reason: "the slot clocks the gauge: it is laid on the rocker with pin gauges in its pivot hole and this slot, and its receipt acceptance (inventory rocker-profile-gauge: DTI stations within 0.03) is taken with pins in both, so the station has no band of its own; a title-block +/-0.13 across the slot would rotate the outline by up to 2.08 x 0.13 at the tail end and break the 0.16 gauge share of the rocker zone (#1545 option 4)"
