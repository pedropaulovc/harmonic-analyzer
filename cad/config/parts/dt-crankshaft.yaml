dt-crankshaft:
  number: MHA-DT-11
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  drawing_unit: in
  process: "turned from bar: 3/8 in core, integral Ø.689 sprocket seat collar with 2 reamed drive-pin holes, Ø.3125 pinion seat step (steel)"
  machinist_exceptions:
    # TODO(#1625): remove RV-01 and the INSIDE CORNERS note when the title
    # block gains its inside-corner default.
    - id: "RV-01"
      kind: "accept"
      where: "inside corners at every shoulder: dome shank to seat spigot, collar to its rear land, the journals and the Ø.3125 seat step"
      finding: "shoulder fillets/undercuts not sized at each step (rule 11) or a general inside-corner note in place of a title-block default"
      reason: "owner ruling 2026-10-18 (fr-top-frame / sm-summing-lever / dt-cone-pivot-post precedent): turned with an R.010 MAX inside-corner ceiling, printed as one note until the shop-wide default goes in the title block under #1625 (owner-accepted)"
    - id: "RV-02"
      kind: "minor"
      where: "end view, under the 2X REAM Ø.0930 drive-pin callout: DRIVE-PIN HOLE TO SPIGOT RIM .019 MIN."
      finding: "wall from each drive-pin hole to the Ø.689 seat-spigot rim below the .060 floor (rules 17, 20)"
      reason: "owner ruling 2026-10-18 on PR #1654 (#991): .019 MIN at the smallest printed spigot (Ø.685) and the hole's worst position; the Ø.551 pin circle is shared with MHA-PD-09 and its drive collar, and between the wheel's Ø.406 bore and the spigot there is only .041 of radial room for both walls, so no pin circle meets .060 on both sides (a Ø.47 circle breaks the wheel's holes into its bore); the spigot diameter is held by the #25 chain wrapping the T12. Accepted as stated until the redesign in #1679 (owner-ruled shortfall)"
    - id: "RV-03"
      kind: "accept"
      where: "front view: the Ø.3750 (SLIDING FIT, in MHA-DT-31), 2X Ø.4490 (RUNNING FIT, in MHA-DT-05) and Ø.3125 (SLIDING FIT, in MHA-DT-10) limits +.0000/-.0008, each flagged SEE NOTE 3 (turn to the measured mate bore, CLEARANCE .0010-.0023)"
      finding: "-.0008 is a converted millimetre band, not a plain inch step (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out ruling F5). The limits come from fleet-shared fit constants (dt_crank_hub_geometry.SHAFT_DIA_BAND and the shaft_in_bushing fit class behind JOURNAL_DIA_BAND), which are restated in inch steps at the next re-key of that family; the matched-fit route to each measured bore is printed at its callout. Accepts the -.0008 notation on these three diameters only, no other band or callout departure."
    - id: "RV-04"
      kind: "accept"
      where: "end view: the 2X .2756 ±.0009 locations of the 2X REAM Ø.0930 drive-pin holes from the axis"
      finding: "a reamed-hole location band of ±.0009 (.0018 total) is narrower than the ±.002 shop-table row with no transfer route, and ±.0009 is a converted millimetre band (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out ruling F4). The band is the shared _sprocket_seat_geometry.DRIVE_PIN_OFFSET_TOL, set by the slip budget of dowels MHA-DT-VN-67 in sprocket MHA-PD-09 (spacing error .0036 against the .0039 minimum clearance); a transfer route would re-key MHA-PD-09 and its drive collar across slices. Accepts this location band only, no other departure."
    - id: "RV-05"
      kind: "accept"
      where: "end view, 2X REAM Ø.0930 drive-pin holes: the depth ↧ .1555 ±.0040"
      finding: "the four-place depth nominal .1555 is off the .001 in grid and reads as a converted millimetre value (rule 3)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 8.1 (fan-out ruling on Q-DT11-2: the depth stays as is). The depth is the press depth shared with drive pin MHA-DT-VN-67 (dt_vn_crank_seat_drive_pin_spec.PRESS_DEPTH), which sets the pins' projection into sprocket MHA-PD-09; restating it re-keys the seat geometry across slices and is deferred to its next re-key. Accepts this depth's places only, no other departure."
    - id: "RV-06"
      kind: "accept"
      where: "front view: the 2X Ø.375 ±.010 callout, with its one leader on the neck at the Ø.3125 seat step; its second neck lies between the Ø.689 collar and the left Ø.4490 journal"
      finding: "the 2X callout has a leader to one of its two necks only (rules 10, 26)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 8.1 (fan-out rule L3). Both necks are one Ø.375 ±.010 turned diameter identified by the 2X count, ASME practice for identical features. Every diameter on this sheet is authored in the end-profile sketch and reaches the side view only by dragging one dimension, and the collar-side land has no free text position (the collar spigot, journal and station dimensions fence it), so a second leader or a detail would need a new model witness and a re-layout. Accepts the single leader only, no other band or callout departure."
