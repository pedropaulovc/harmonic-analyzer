ch-rocker-arm-tl-trammel-pivot-plate:
  title: Rocker Template Trammel Pivot Plate
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-19
  # The seat plate needs only a flat, drillable bar: any low-carbon grade
  # serves (SolidWorks material Plain Carbon Steel); the shop stock is the
  # 1018 offcut below.
  material: LOW-CARBON STEEL FLAT
  material_specification: AISI 1018 cold-rolled flat bar, 3/4 x 1-1/2 in (offcut of the trammel block bar)
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "saw offcut and face ends to length; drill 5/64 pilot blind; No. 2 centre drill the 60 degree seat; drill #16 through and countersink 90 degrees for the screws; break edges"
