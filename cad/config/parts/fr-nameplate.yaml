fr-nameplate:
  number: MHA-FR-004
  material: Brass
  material_specification: Brass sheet, 1.5 mm (C26000 cartridge or C35300 engraving brass)
  finish: polished; sunk field and engraving blackened
  quantity: 1
  tolerance_class: visual_noncritical
  process: "engraved brass plate"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the notes OUTLINE AND CORNERS PER pdf/fr-nameplate-outline.dxf, SUNK FIELD PER pdf/fr-nameplate-field.dxf and ENGRAVING PER pdf/fr-nameplate-engraving.dxf"
      finding: "outline corners, sunk-field border and engraved artwork defined only by the release-bundle DXFs, not dimensioned on the sheet (rule 1)"
      reason: "the traced period artwork is the definition: the field is the engraving's own pinstripe inner edge and the outline its traced outer edge, shipped in the release bundle beside the PDF; redrawing it as dimensions would restate the artwork (owner-accepted)"
    - id: "RV-02"
      kind: "minor"
      where: "the sheet note FLOOR UNDER ENGRAVING 0.54 MIN"
      finding: "floor under the engraving below the 1.5 mm wall floor (rules 17, 20)"
      reason: "0.54 MIN at the worst printed thickness and engraving depth (0.800 nominal); a decorative engraving floor on a plate that carries no load (owner-ruled shortfall)"
    - id: "RV-03"
      kind: "minor"
      where: "the sheet note SCREWS ENGAGE 3.73 MIN FULL THREAD"
      finding: "#4-40 screw full-thread engagement below 1.5D (rules 18, 20)"
      reason: "3.73 MIN (1.31D) for the 1/4 in 90114A511 fillister at its shortest stock length through the thickest printed plate, tip chamfer deducted; it only holds an unloaded cosmetic plate, so the screw stays (owner-ruled shortfall)"
