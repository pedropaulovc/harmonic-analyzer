fr-nameplate:
  number: MHA-FR-04
  material: Brass
  material_specification: Brass sheet, .063 in C260 (C26000 cartridge brass; OnlineMetals 23624)
  finish: polished; etched field blackened
  quantity: 1
  tolerance_class: visual_noncritical
  drawing_unit: in
  process: "acid-etched brass plate"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the DXF note: OUTLINE AND ETCH RESIST PER pdf/fr-nameplate-resist.dxf (the resist DXF)"
      finding: "the plate outline and its corner radii, and the etched field's edge, letters and ornament, are defined only by the release-bundle resist DXF and not dimensioned on the sheet (rule 1)"
      reason: "the traced period artwork is the definition of both: the resist DXF's outer loop is the plate's traced outer edge and corners, and its inner loops are the traced field edge, lettering and ornament, shipped in the release bundle beside the PDF; the acceptance covers the outline DXF as well as the artwork (owner ruling 2026-10-15); redrawing either as dimensions would restate the artwork. Owner ruling 2026-11-20 (Pedro), #2313: \"A\" (etch the field ~.010 (.008-.012); letters and border proud and polished): the resist is the border plus the filled letters, widened by the etch depth per edge for the etch's undercut (owner-accepted)"
    - id: "RV-03"
      kind: "minor"
      where: "the sheet note SCREWS ENGAGE .133 MIN FULL THREAD"
      finding: "#4-40 screw full-thread engagement below 1.5D (rules 18, 20)"
      reason: "Owner ruling 2026-11-01: thread engagement below 1.5D with no geometry escape accepted as a minor exception. .133 MIN (1.19D) of installed full-thread overlap in the base's #4-40 receiver: the 1/4 in 90114A511 fillister at its shortest stock length through the thickest printed .063 plate, tip chamfer deducted, counted only past the receiver's .010 entrance break. The screw's bare projection is .143 (1.28D); both are below the 1.31D accepted earlier for the former 1.5 mm plate. It only holds an unloaded cosmetic plate, so the screw stays (owner-ruled shortfall)"
    - id: "RV-05"
      kind: "minor"
      where: "the sheet note FLOOR UNDER ETCHED FIELD .046 MIN: the .063 plate at its .058 minimum less the .012 deepest etch (SECTION A-A)"
      finding: "floor under the etched field below the .060 wall floor (rules 17, 20)"
      reason: "Owner ruling 2026-11-20 (Pedro), #2313: \"A\" (etch the field ~.010 (.008-.012); letters and border proud and polished), which restates this exception at .046 MIN (.058 plate min - .012); it replaces owner ruling 2026-11-08 (Pedro), #2144 item 12.2 (the .037 floor under the former .016 sunk field) and the .025 floor under the former engraving. A decorative plate that carries no load (owner-ruled shortfall)"
    - id: "RV-07"
      kind: "accept"
      where: "SECTION A-A, the .008-.012 ETCHED FIELD DEPTH limits"
      finding: "an explicit band narrower than the .XXX row with no mate named (rules 3, 4)"
      reason: "Owner ruling 2026-11-20 (Pedro), #2313: \"A\" (etch the field ~.010 (.008-.012); letters and border proud and polished): one time-set etch depth printed with its limits replaces the former .016 sunk field and .028 engraving; the deepest etch sets the stated floor (RV-05). A decorative depth with no mate (owner-accepted)"
