cone-swing-platform:
  # The 266 x 61 mm plan envelope and 1/4-20 post-mount pattern cascade from
  # cone-pivot-post-v2.SLDPRT; the wedge itself remains the ch.12 p.18 platform.
  number: MHA-091
  # U41 (2026-09-23): the thickness is the stock's, as supplied; the 61 mm
  # plan envelope fits the 2-1/2 in bar, whose mill tolerance holds the
  # +/-0.13 the rule-12 stacks use (cone_swing_platform_spec.PLATE_STOCK_BAND).
  # Printed in the title block's MATERIAL row: 81788ce9 wrapped the long
  # form onto a second line, so the full wording lives in the spec below.
  material: 1018 CF FLAT BAR 1/4 x 2-1/2 in
  material_specification: ASTM A108 1018 cold-finished flat bar, 1/4 x 2-1/2 in; thickness as supplied
  finish: MIL-DTL-13924 Class 1 black oxide with oil seal; all surfaces
  quantity: 1
  tolerance_class: machined_block
  process: "machined (steel plate)"
