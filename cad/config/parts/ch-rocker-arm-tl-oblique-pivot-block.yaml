ch-rocker-arm-tl-oblique-pivot-block:
  title: Rocker Oblique Trammel Pivot Block
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-22
  material: 6061-T6 aluminium
  material_specification: 6061-T6 aluminum flat bar, 1 x 3 in, machined to 24 high with 67 wide integral wing and original 40 wide tail
  finish: as machined
  quantity: 2
  tolerance_class: machined_block
  process: "face the block to the unchanged 24 height; mill the spindle end and 67 wide integral wing while retaining the original 40 wide tail and its X=20 end; locate both wing +X steps directly 21.200 +/-0.13 from the actual bearing axis, with no competing wing-length or end-location tolerance chain; preserve bearing axis X=-32 and both original bearing seats, 4 web and 25 puller cavity; preserve original carriage counterbores and nut-bracket holes; tap four 5/16-18 through holes at bearing-axis offsets X=+/-14.500,Y=+/-25.500, each location +/-0.13; end-mill two cylindrical flat-bottom register recesses, diameter 7.20 +0.10/0 and depth 2.000 +/-0.13 from the block top, at signed bearing-axis offsets (-4.500,-24.000) and (+4.500,+24.000), each XY location +/-0.13; indicate the actual bearing axis for the wing steps and cap interfaces, not an outside edge; inspect both planar floors and remaining material to the bearing pockets, cap taps, carriage and nut-bracket holes; retain the existing top flange-stop face outside these recesses with no added bearing pocket; press bearing assembly only on fitted races; destructive cartridge service removes cap, presses pin upward from its lower end, and replaces pin plus both bearings"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the 2X bearing seats: position Ø0.02 to datum A, the bottom seat, in Section A-A"
      finding: "position frame outside the rule 5 short list"
      reason: "the two 6200 seats carry one pivot pin; misaligned seats would preload the bearings and tilt the pin that sets the trammel radius (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "RV-02"
      kind: "accept"
      where: "Section A-A, the 2X 10.000 bearing-seat depths and the web they set"
      finding: "three-place depths and a web 3.23 min stated on them"
      reason: "the web behind each inner race must keep the 3.0 collet-puller space; at two places it could drop to 2.47 (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "RV-03"
      kind: "accept"
      where: "Section B-B, the 15.600 counterbore floor from the carriage seat"
      finding: "three-place floor height"
      reason: "the floor sets the M4 x 20 screws' engagement in the HGH15CA carriage's 5.0 deep thread (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "RV-04"
      kind: "minor"
      where: "Section B-B, the M4 x 20 carriage screws"
      finding: "engagement 3.85-4.95 in the carriage's 5.0 deep thread, under 1.5D (rule 18)"
      reason: "the bought carriage's M4 x 5 holes limit the engagement; the shortfall is stated on the sheet (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "RV-05"
      kind: "accept"
      where: "View C, the 2X Ø7.940 x 4.400 side-screw counterbores from the +Y face"
      finding: "three-place counterbore Ø7.940 and depth 4.400, holding side counterbore walls 1.67 min to each other and 1.83 min to the carriage-screw holes, under the 2.0 target (rule 17), over the 1.5 floor"
      reason: "MHA-CH-06-TL-29's #8 screw positions on the 24 block set the spacing; at two places the counterbore-to-counterbore wall would fall to 1.29, under the 1.5 floor, so the three-place bands hold the walls the side callout states (owner ruling 2026-10-17, via coordinator, RockerV3 session)"
    - id: "PC-01"
      kind: "accept"
      where: "Capture wing plan, four 5/16-18 receiver taps located directly from the bearing axis at three places +/-0.13"
      finding: "three-place cap-receiver location dimensions"
      reason: "the direct bearing-axis locations preserve screw clearance to the cap; integral registers, not screw friction or thread profiles, set the cap translation bound"
