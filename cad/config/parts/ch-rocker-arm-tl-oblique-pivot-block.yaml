  material: 6061-T6 aluminium
  material_specification: 6061-T6 aluminum flat bar, new 1 x 3-1/2 in stock, machined to .96 high
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "Rectangular rail-2 block; shoulder-screw seat and four carriage counterbores. Keep carriage counterbore floors .570 above the bottom; pivot seat reamed .3760-.3765, .359 deep from top with a 5/16-18 tapped through hole below."
