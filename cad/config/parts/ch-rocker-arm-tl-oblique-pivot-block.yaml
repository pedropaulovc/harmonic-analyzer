ch-rocker-arm-tl-oblique-pivot-block:
  title: Rocker Oblique Trammel Pivot Block
  # Shop fixture: the parent MHA-CH-006 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-006-TL-22
  material: 6061-T6 aluminium
  material_specification: 6061-T6 aluminum flat bar, 1 x 2 in, machined to a 70 x 40 x 24 block
  finish: as machined
  quantity: 2
  tolerance_class: machined_block
  process: "saw and mill the block to 70 x 40 x 24; bore the 30 bearing seat 10 deep from the top, then from the bottom, leaving the 4 shoulder with R0.4 max corners; bore the 25 shoulder hole through; drill the four 4.5 holes through and counterbore 8 from the top to 15.6 above the bottom; drill the two 4.98 holes through along the width and counterbore 7.94 from the +Y face; break edges"
