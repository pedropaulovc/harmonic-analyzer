ch-rocker-arm-tl-oblique-pivot-block:
  title: Rocker Oblique Trammel Pivot Block
  number: MHA-CH-06-TL-22
  # No grade or temper is functional: the title block names the aluminium
  # flat-bar family (rule 2; machinist review), as TL-28 does.
  material: ALUMINUM FLAT BAR 1 x 3 in
  material_specification: Aluminum flat bar (e.g. 6061-T6), new 1 x 3 in stock (OnlineMetals 1187), machined to .96 high
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "Centred rail-2 block, 1.64 x 1.58 x .96; shoulder axis .82 from either end, centred on the HGH15CA 26 x 26 pattern. Keep carriage counterbore floors .570 above the bottom; pivot seat .375 with a flat floor, .359 deep from top, with a 5/16-18 tapped through hole below."
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "Section B-B, the .570 counterbore floor callout: ENGAGES .162 MIN (1.03D)"
      finding: "M4 carriage screw full-thread engagement .162 min (4.12 mm, 1.03D): the tip reaches .183 and its 0.75P chamfer is not full thread; under rule 18's 1.5D, stated as a plain fact"
      reason: "The bought HGH15CA carriage's vendor M4 holes are 5 mm deep, so no M4 reaches 1.5D (6.0 mm). Owner ruling 2026-11-01, option A (the jig's RV-05): the counterbore floor drops .614 to .570 and each screw is cut to fit its own floor at assembly (rule 19), so the reach carries only the ±.005 cut and the .001 reading: .183 of tip reach, 1.03D of full thread once the 0.75P tip chamfer is deducted Owner exception confirmed 2026-11-01 (relayed by Main) at 1.16D. Owner ruling 2026-11-08 (Pedro), #2144 item 1.4: the recount charges the 0.75P tip chamfer, .162 MIN (1.03D), same geometry, shop-fixture load."
  drawing_unit: in
