ch-rocker-strap:
  title: Rocker Strap
  number: MHA-CH-13
  # Component of the built-up MHA-CH-06 (ch_rocker_arm_notes.BUILT_UP_PERMISSION_NOTE);
  # test_part_coverage counts it reachable through that part.
  component_of: ch-rocker-arm
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: AISI 1018 CF flat, 1/8 x 1-1/2 REF
  # Stock: OnlineMetals 4807, 1/8 x 1-1/2 in 1018 cold-finish flat, 4 x 72 in,
  # bought in the 2026-11-03 machine stock order (#2173); it replaces the
  # 1/8 x 2 in (OnlineMetals 4808) the inch conversion first named. Catalogue
  # nominals; no thickness or width tolerance stated.
  # Black oxide once, on the joined MHA-CH-06, after its bore and length are
  # finished; note 2 names the joint ("on joined MHA-CH-06" read as an
  # unexplained second joint to the r1 machinist review). The field names the
  # mate it follows (fab-2 r5, 2 of 3 runs: "after joining" named none);
  # the title-block cell takes 36 characters.
  finish: black oxide after joining MHA-CH-12
  quantity: 20
  tolerance_class: machined_block
  drawing_unit: in
  # #2340: the strap needs no flatness control of its own. Its .098 +/-.001
  # thickness (whose MMC envelope bounds its bow) sets the fork's side
  # clearance, and once joined MHA-CH-06's owner-accepted strap position zone
  # (.004 to its hub face, RV-05) holds the mid-plane the bar-foot and
  # neighbouring-fork gaps spend (ch_channel_assembly_spec bar_gap_budget,
  # sh_vn_pivot_pin_rod_spec joint_budget). The route keeps the bought flat
  # (#2173) and skims both faces equally instead of one.
  process: "1018 cold-finish flat 1/8 x 1-1/2 in (OnlineMetals 4807, #2173), both faces skimmed equally to the finished thickness, about .0135 off each, on the full-width blank before the outline is cut: rough the two faces in turns, release the blank and reseat it, then take the finish passes on both faces; hub hole reamed; outline milled; MHA-CH-12 pressed in, then finished on MHA-CH-06. A strap that leaves its thickness band, or after joining MHA-CH-06's strap position zone, is set straight by hand on the surface plate and rechecked, or exchanged"
