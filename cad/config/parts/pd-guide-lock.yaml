pd-guide-lock:
  number: MHA-PD-12
  # 2026-10-11 (user): 1/16 in steel sheet, thickness as supplied; the
  # sheet's +/-.005 in mill band is the one the lock-station sweep and the
  # screw engagement spend (pd_guide_lock_spec.LOCK_THICK_BAND). The sheet
  # prints the thickness as a 1/16 REF (#290: stock fractions are reference,
  # the supplier's band governs), so the band is stated here. That band, not
  # a grade or a ground form, is what the plate needs, so the title block
  # names the low-carbon family (rule 2; machinist review ENFORCE, PR #1897);
  # 1388K196 stays the example source.
  material: LOW-CARBON STEEL SHEET 1/16 in
  material_specification: Low-carbon steel sheet (ASTM A36, AISI 1008/1010 or 1018), 1/16 in, thickness as supplied within +/-.005 in (e.g. McMaster-Carr 1388K196 A36 precision-ground)
  finish: black oxide
  quantity: 4
  tolerance_class: machined_block
  process: "cut from 1/16 in sheet: saw and file the outline, file the four corner radii, drill the screw holes (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X screw-hole callout: WALL .065 MIN TO EDGES (the guide-side and left ligaments)"
      finding: "screw-hole wall to the plate's guide-side and left edges below the .080 target at the finished worst case (rule 17)"
      reason: "delegated ruling 2026-11-03, following the owner's approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989), RV-04 on MHA-PD-18 (#1379) and RV-01 on MHA-PD-11 (#2124); owner review on #2144. The holes (.155 row, .157 and .709 stations) land on the platen guide's #4-40 tap pattern, whose rail walls are already at the floor (RV-01 on MHA-PD-11). Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144, pending owner confirmation: the holes are transferred from those taps at assembly, so their locations print plain at the title block's .XXX +/-.005; at that placement band the guide-side wall is .0855 unbroken and pays the .010 outside edge break and the .010 hole-mouth break to land at .0655 (left .0675)"
