ch-channel-lever:
  number: MHA-CH-02
  # Owner ruling 2026-11-03 (stock order #2173): 1018 cold-finish steel,
  # machined from the bought 5/16 x 1 in flat, supersedes the 2026-10-15
  # gray cast iron ruling. Black oxide covers carbon steel and adds no
  # build-up on the banded faces.
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  # Delegated ruling 2026-11-21 (Main), owner review #2144: no MIL spec on the
  # finish; the owner ruled cold blackening (Presto Black PC9) acceptable as the
  # drawing's black oxide.
  finish: matte black oxide, oil sealed
  quantity: 20
  tolerance_class: machined_block
  # #2340: the plate's form needs no flatness control of its own. Its thickness
  # band (whose MMC envelope bounds the plate's bow) and its offset from the hub
  # face, both +/-.002, are what the bar-to-bar gap at the bar pin spends
  # (sh_vn_pivot_pin_bar_spec joint_budget), and the levers' plates stand .18
  # apart, so nothing else rubs. The route keeps the bought bar (#2173) and
  # cuts the plate so it stays flat: equal stock off both faces, a release
  # before the finish passes, and hand setting (no furnace for stress relief).
  process: "machined from the bought 5/16 x 1 in 1018 cold-finish flat (#2173): hub and plate faces, the F-drilled fulcrum bore and the drilled holes; the flat is .3125 +.000/-.004 thick (ASTM A108 cold-drawn flats, the 1 in width governs), so facing the hub to .300 +.001/.000 takes .0075 to .0125 off its two faces. The plate comes off both faces equally, about .097 each, cut as a pocket inside the bar's uncut edges, which carry the part on its second side: rough the two faces in turns to .020 over, release the part and reseat it, then take the finish passes on both faces; cut the outline free last and drill after it. A plate that leaves its thickness or plate-offset band once free is set straight by hand on the surface plate and rechecked, or exchanged"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the hub width .300 +.001/.000 (SETS PITCH OF 20X STACK ON MHA-CH-04)"
      finding: "20-hub face-to-face stack with no fit-up allowance or shim (rule 19)"
      reason: "the hubs set the station pitch with no shim by design. Since the owner's C10 (2026-11-24, fit audit part 2: \"Yes: rear keeper set to the stack over a .020 leaf.\") the rear keeper follows the stack, so the stack's end play is that leaf whatever the hubs measure; what the hub band still holds is the rear keeper's station over the fulcrum shaft's flats (necessity N-01, delegated ruling 2026-11-24 (Main), no precedent, #2144 (rulings.md D16))"
    - id: "RV-03"
      kind: "accept"
      where: "the hub width .300 +.001/.000 (SETS PITCH OF 20X STACK ON MHA-CH-04)"
      finding: "band .001 total, narrower than the milled/turned width row (+/-.001), with no fit route at the callout (rule 4)"
      reason: "restated by delegated ruling 2026-11-24 (Main), no precedent, #2144 (rulings.md D16), superseding the 2026-11-07 end-play reason (#2144) that the owner's C10 (2026-11-24) made moot: the rear keeper is set to the bare stack over a .020 leaf, so the band no longer guards end play. It still cannot open: at the title block's +/-.005 the twenty-hub stack moves the rear keeper off the fulcrum shaft's set-screw flats (ch_fulcrum_shaft_spec.FLAT_STATION_WINDOW_MM .474 mm at this band, -2.066 at +/-.005) and its foot onto the rail boss (build_fr_top_frame KEEPER_FOOT_PRINTED_BOSS_MARGINS -.660 mm at +.005), necessity N-01; the 20X stack is still measured at the channel assembly (RV-02)"
    - id: "RV-04"
      kind: "minor"
      where: "front view, the R.167 tip about the #21 spring-eye hole (callout HOLDS WALL .060 MIN)"
      finding: "finished wall from the #21 hole to the tip .0605, the printed worst case less both .010 edge breaks, under the .080 in target (rule 17)"
      reason: "Owner ruling 2026-11-18 (#3113, codjiflo round 1 on PR #3115): the lever tapers toward its spring tip; the photo ratio's R.150 left the #21 hole a .0435 finished wall once the hole-mouth and outside .010 breaks were charged, under the floor, so the owner chose the blunter R.167 (tip depth 0.90 of the .37 bar). The full-round tip concentric with the #21 hole leaves .167 -.005 - (.159 +.004)/2 = .0805 printed and .0805 - 2 x .010 = .0605 finished, above the .060 floor. The radius prints at three places because R.17 at two would take the wall below the target; the callout states the wall it holds. Accepts this wall only, no other band or wall departure."
    - id: "RV-05"
      kind: "accept"
      where: "front view, the 2X R.065 at the two bar-to-hub roots (callout NOTHING SEATS IN THESE CORNERS)"
      finding: "a three-place radius with no band of its own and no fit, wall or clearance named, so the third place reads as over-specification; print R.06 or R.07 (rule 3)"
      reason: "Owner ruling 2026-11-23 (Pedro), tool audit Q9, option A: \"Print a local corner limit R.065 (.060-.070) on those corners and cut them with the 1/8 end mill: no 5/64 cutter\" (MHA-CH-02, CH-03, PN-01, PN-05). The three places are the ruled limit: under the title block's .XXX +/-.005, R.065 prints exactly .060-.070, the band the 1/8 in end mill's R.0625 sits in; a two-place R.06 or R.07 (+/-.01) would print .050-.070 or .060-.080, neither the ruled limit. The callout names why the corner may stand over INSIDE CORNERS R.040 MAX. Accepts these corners' places only, no other band or callout."
