ch-channel-lever:
  number: MHA-CH-02
  # Owner ruling 2026-11-03 (stock order #2173): 1018 cold-finish steel,
  # machined from the bought 5/16 x 1 in flat, supersedes the 2026-10-15
  # gray cast iron ruling. Hot alkaline black oxide (MIL-DTL-13924 Class 1)
  # covers carbon steel and adds no build-up on the banded faces.
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: matte black oxide per MIL-DTL-13924 Class 1, oil sealed
  quantity: 20
  tolerance_class: machined_block
  process: "machined from 5/16 x 1 in 1018 cold-finish flat: hub and plate faces, the reamed fulcrum bore and the drilled holes"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "accept"
      where: "the hub width .278 +.001/.000 (20 HUBS STACK; SETS STATION PITCH)"
      finding: "20-hub face-to-face stack with no fit-up allowance or shim (rule 19)"
      reason: "the hubs set the station pitch with no shim by design; the stack's end float is proven at the channel assembly, not on this part (owner-accepted)"
