ch-channel-lever:
  number: MHA-CH-02
  # Owner ruling 2026-11-03 (stock order #2173): 1018 cold-finish steel,
  # machined from the bought 5/16 x 1 in flat, supersedes the 2026-10-15
  # gray cast iron ruling. Hot alkaline black oxide (MIL-DTL-13924 Class 1)
  # covers carbon steel and adds no build-up on the banded faces.
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: matte black oxide per MIL-DTL-13924 Class 1, oil sealed
  quantity: 20
  tolerance_class: machined_block
  # #2340: the plate's form needs no flatness control of its own. Its thickness
  # band (whose MMC envelope bounds the plate's bow) and its offset from the hub
  # face, both +/-.002, are what the bar-to-bar gap at the bar pin spends
  # (sh_vn_pivot_pin_bar_spec joint_budget), and the levers' plates stand .18
  # apart, so nothing else rubs. The route keeps the bought bar (#2173) and
  # cuts the plate so it stays flat: equal stock off both faces, a release
  # before the finish passes, and hand setting (no furnace for stress relief).
  process: "machined from the bought 5/16 x 1 in 1018 cold-finish flat (#2173): hub and plate faces, the reamed fulcrum bore and the drilled holes; the flat is .3125 +.000/-.004 thick (ASTM A108 cold-drawn flats, the 1 in width governs), so facing the hub to .300 +.001/.000 takes .0075 to .0125 off its two faces. The plate comes off both faces equally, about .097 each, cut as a pocket inside the bar's uncut edges, which carry the part on its second side: rough the two faces in turns to .020 over, release the part and reseat it, then take the finish passes on both faces; cut the outline free last and drill and ream after it. A plate that leaves its thickness or plate-offset band once free is set straight by hand on the surface plate and rechecked, or exchanged"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "accept"
      where: "the hub width .300 +.001/.000 (SETS PITCH OF 20X STACK ON MHA-CH-04)"
      finding: "20-hub face-to-face stack with no fit-up allowance or shim (rule 19)"
      reason: "the hubs set the station pitch with no shim by design; the stack's end float is proven at the channel assembly, not on this part (owner-accepted)"
    - id: "RV-03"
      kind: "accept"
      where: "the hub width .300 +.001/.000 (SETS PITCH OF 20X STACK ON MHA-CH-04)"
      finding: "band .001 total, narrower than the milled/turned width row (+/-.001), with no fit route at the callout (rule 4)"
      reason: "the band can neither open nor take a route on this sheet: twenty hubs at +.001 must still float between the MHA-CH-07 keepers on the .010 end-play leaf at the shortest lug span (MHA-CH-00 lever-bank-slides), and +.002 would close that play; at the .300 pitch the bar-to-bar top gap is 0.686 mm at the band (sh_vn_pivot_pin_bar_spec neighbour_clearance_min), so the 20X stack is measured at the channel assembly (RV-02). Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
