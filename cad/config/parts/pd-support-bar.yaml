pd-support-bar:
  number: MHA-PD-07
  material: Plain Carbon Steel
  material_specification: ASTM A108 1018 cold-finished flat bar, 3/8 x 1 in; thickness as supplied
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  process: "machined (steel); from the back face, the transgear pivot tapped #8-32 through and the latch hook's two base-screw holes tapped #4-40 through (spotted through MHA-PD-14 at assembly), each countersunk both faces"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "SECTION A-A thickness .374 +.001/-.003 (SETS MHA-PD-VN-57 ENGAGEMENT), the 3/8 CF flat's as-supplied band"
      finding: "a reason on an overall size (rule 7 narration), or a three-place size with no stated function (rule 3)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 4.3. The thickness is spent by a stack: the MHA-PD-VN-57 pivot screw's thread engagement (under rule 18's 1.5D) and tip window. Rule 3 makes such a size a rule 4 matter that names its stack; printed bare, the reviews read it as over-specification (round 4, 3/3), and with its stack named, as narration (round 5 local repeat, 3/3). Its band is the 3/8 CF flat's as supplied (ASTM A108): owner ruling 2026-11-21 (Pedro), #1563, option C: \"Print the MHA-PD-07 bar thickness as supplied, .374 +.001/-.003 (model unchanged at .374)\"; at .375 the shortest stock pivot screw (.355 thread) reaches the .020 deepest recess with no fitter selection, and the worst engagement is 1.526D. The height this entry also covered (1.010, SETS MHA-PD-12 RETENTION) is now 1.00 at the .XX row with no reason: owner ruling 2026-11-20 (Pedro), #2421, in his words: \"B\" (1.00 tall at .XX from 3/8 x 1 CF, the top edge skimmed only, the MHA-PD-12 lock unchanged)."
    - id: "RV-03"
      kind: "minor"
      where: "sheet note 1, linked from the 2X round clamp counterbores' callout (INTO MHA-SH-02 TAPS, SEE NOTE 1): 1. EACH .196 HOLE TO ITS MHA-SH-02 TAP: OFFSET UP TO .002 OVER #8 SCREW CLEARANCE."
      finding: "the MHA-SH-VN-53 clamp screw line (bar hole to MHA-SH-02 back-arc tap) not held by the hole's radial float at the worst case once drill wander is charged, with no fit-up adjustment (rules 17, 19, 20)"
      reason: "Delegated ruling 2026-11-21 (Main), following the owner's acceptance of the same shortfall at about 0.046 mm on #2421/#2422 and sh-column-clamp-front RV-02; owner review #2144. The shortfall it accepts is the computed 0.0500 mm below, not the ~0.046 the owner saw. The owner's acceptance: Owner ruling 2026-11-20 (Pedro), #1988, in his words: \"Follow recommendations unless noted otherwise\"; the recommendation accepted: \"Accept the ~0.046 shortfall as ruled, consistent with RV-02 (0.053) on the clamp front screw line; the worst case needs every wander term to stack against the band limits.\" Charged: the clamp row and stations at the title block's +/-.005 rounded to the printed .001 (clamp_position_zone), the back-arc tap's zone and 0.3 deg wander, and this bar's 0.3 deg through-hole wander over the .375 thickest bar (#1563 option C), against the #8 screw in the .196 MIN hole: 0.0500 mm (.0020) over, stated rounded up as .002 (build_pd_support_bar.CLAMP_SCREW_LINE_SHORTFALL, held at or under 0.051). The ruling's ~0.046 left out the .001 rounding reach; the computed value stays inside the 0.053 of sh-column-clamp-front RV-02, the precedent the ruling names. No slot, oversize or match-drill is added"
    - id: "RV-04"
      kind: "accept"
      where: "sheet 1, DETAIL C, the 2X west clamp slots' width: 2X .196 +.004/.000 THRU, CLEARANCE FOR MHA-SH-VN-53"
      finding: "an explicit band on a milled slot, .004 wide against the .XXX row's .010, with no necessity-register entry (rules 3, 4: over-specification)"
      reason: "Delegated ruling 2026-11-26 (Main), no precedent; owner review #2144 (D52). The band is the 1/8 in end mill's own spread at the programmed .199 (.197-.199 as cut with the cutter's -.002/0, process plan SB04_slots), so it costs the shop nothing, and it is checked with the .196 and .200 pins the plan already names. Dropped to the .XXX row (.191-.201) it gains no room and leaves margins the shop cannot read (tolerance-policy.md: a margin under .001 is not evidence either way): the MHA-SH-VN-53 shank's float across a .191 slot against the clamp row's and the MHA-SH-02 tap's height bands is +.0014 with the tap's drill wander charged, -.0006 with the bar's drill wander charged too. No failure at the looser size is shown, so it is accepted here, not entered as a necessity."
