pd-platen-guide:
  number: MHA-PD-11
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-rolled steel
  finish: black oxide + oil; oil the taps cut at assembly
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 9X #4-40 tap pattern: WALL .060 MIN, TAPS TO EDGES (both rows at .140 ±.004, to the bottom face and to the top face)"
      finding: "tap wall to the rail's edges below the .080 target at the finished worst case (rule 17)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144: the .060 floor is confirmed, following the approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989) and RV-04 on MHA-PD-18 (#1379). The taps are noncritical, so they print plain coordinates, the row at .140 ±.004 to hold this floor. The rail is .29 at .XX (owner ruling B2, 2026-11-01): the bottom row cannot move (the rack backer blocks the rail growing down) and the #4-40 taps receive vendor screws, so the .080 unbroken wall pays the .010 outside edge break and the .010 tap mouth break and lands at the .060 floor"
