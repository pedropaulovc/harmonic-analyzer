pd-platen-guide:
  number: MHA-PD-11
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-rolled steel
  finish: black oxide + oil; oil the taps cut at assembly
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 9X #4-40 tap pattern: WALL .060 MIN, TAPS TO EDGES (both rows, to datum B and to the top face)"
      finding: "tap wall to the rail's edges below the .080 target at the finished worst case (rule 17)"
      reason: "delegated ruling 2026-11-03, following the owner's approved band for thin walls between .060 and .080 (DT-35 .060, DT-08 .0602; #989) and RV-04 on MHA-PD-18 (#1379); owner review on #2144. The rail is .29 at .XX (owner ruling B2, 2026-11-01): the bottom row cannot move (the rack backer blocks the rail growing down) and the #4-40 taps receive vendor screws, so the .080 unbroken wall pays the .010 outside edge break and the .010 tap mouth break and lands at the .060 floor"
    - id: "RV-02"
      kind: "accept"
      where: "the 9X #4-40 tap pattern's position frame to datums A, B and C (A1, A3, A5, A7, A9: SPOT THRU MHA-PD-02 AT ASSEMBLY, DRILL, TAP)"
      finding: "position frame and datum features on a rail (rule 5)"
      reason: "delegated ruling 2026-11-03 under rule 5's mating-pattern class: the taps receive screws fixed in two other parts, the platen's counterbored guide holes and the guide lock's drilled holes, so the pattern must match both and a coordinate plus/minus would stack each tap's error into both clearances; following the owner-accepted position controls on MHA-PD-18's locating pattern (RV-01) and the owner-accepted matched-pattern float on MHA-PD-02/MHA-PD-03 (RV-01); owner review on #2144"
    - id: "RV-03"
      kind: "accept"
      where: "the Ø.008 position zone on the lock taps A2, A4, A6 and A8, narrower than the drilled-hole row (±.005)"
      finding: "drilled-and-tapped hole positions banded tighter than the drilled-hole row with no fit route at the feature (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144. The rail's walls already sit at the .060 floor (RV-01), so a wider zone would push the taps' walls below the floor; the lock taps are drilled and tapped to the zone, and MHA-PD-12's holes are transferred from these taps at assembly, so the lock follows the rail's actual taps"
