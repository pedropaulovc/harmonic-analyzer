dt-crank-handle:
  number: MHA-DT-08
  material: FAS white oak, grain axial; 6-8% MC
  material_specification: FAS white oak, clear, straight grain along axis; 6-8% MC
  finish: P220; ebonize (India ink or aniline dye); 3x satin poly, P320 between; mask bore, tenon, counterbore
  quantity: 1
  tolerance_class: visual_noncritical
  process: "turned (wood)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "tenon callout: WALL .060 MIN"
      finding: "oak tenon wall over the pivot bore .0602 along the tenon at the smallest tenon, the largest matched-fit bore and its .004 offset, above the .060 floor and under the .080 target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (extends to MHA-DT-08; a larger tenon thins the MHA-DT-34 ferrule, whose walls are already exceptions, and the bore runs on the MHA-DT-32 shoulder)"
    - id: "RV-02"
      kind: "minor"
      where: "tenon callout: WALL .040 MIN AT TENON END"
      finding: "oak tenon wall .0402 at the tenon's free end, where the outside edge and the pivot-bore mouth each take the .010 edge break, below the .060 floor (rule 17)"
      reason: "Main delegated ruling 2026-11-04 (#2171, option C; listed for owner review on #2144): the end ring is oak bonded inside the MHA-DT-34 ferrule, its edges carry no load (the bore runs on the MHA-DT-32 shoulder along its length), and restoring .060 needs a larger ferrule against the user's 2026-09-30 ring size; precedent owner ruling 2026-10-26 (#1900, MHA-DT-34 arm face, both edges broken)"
    - id: "RV-03"
      kind: "accept"
      where: "DETAIL B: the tenon-root relief chamfer .039 ±.010 X 45°, flagged SEE NOTE 3 (MHA-DT-34 FERRULE SEATS ON TENON SHOULDER)"
      finding: "a three-place nominal on a ±.010 chamfer; the chamfer could print at a two-place title-block grade (rule 3)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out rule L3). The relief's limits are owner-ruled (2026-10-24, #1900): .029 keeps the R.012 root round (reach .0290) behind the MHA-DT-34 seat face, and .049 leaves the ferrule's 0.5 mm seat floor. .04 X 45° at the .XX grade (.030-.050) fails that seat floor by about .0007, so .039 ±.010 is the widest band that holds both. Accepts these places only, no other band or callout departure."
