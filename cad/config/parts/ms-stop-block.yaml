ms-stop-block:
  number: MHA-MS-02
  material: Brass
  material_specification: Brass
  finish: machined; chemically blackened (brass black)
  quantity: 1
  tolerance_class: machined_block
  process: "milled 21 x 14.1 x 11 brass block; window milled open into the plate-side face; #4-40 thumbscrew tap up through the head face; two #2-56 plate-screw holes match-drilled with its ms-stop-plate in one pilot pass, then bottoming-tapped blind from the plate mating face (parts paired, not interchangeable)"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "right side view, under the 2.10 roof thickness: WALL 1.59 MIN"
      finding: "roof over the open rebate below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-09 (option B in stop_roof_options_v1.png): height 14.1 with a directly dimensioned 2.1 roof replaced the sketch's 14 / 2.0; at the routine .XX +/-0.51 the roof keeps 1.59 MIN, above the 1.5 floor. Recorded here in the form the gate reads; not a new ruling"
    - id: "RV-02"
      kind: "minor"
      where: "front view, 1.00 x 45 degree roof-end chamfer, 2 CORNERS"
      finding: "plain edge chamfer given two decimal places (rule 3)"
      reason: "owner ruling 2026-10-09 (option B in stop_roof_options_v1.png): the 2.0 roof of the sketch was thickened to 2.1 for the routine .XX +/-0.51 chamfer-to-window margin, so the 1.00 chamfer keeps .XX (1.51 largest) inside the 1.59 thinnest roof; at .X +/-0.8 it could cut through. Recorded here in the form the gate reads; not a new ruling"
    - id: "RV-03"
      kind: "minor"
      where: "front view, first of the three web rows under the 2X #2-56 match-drill tap callout: DRILL POINT TO OPPOSITE FACE 1.59 MIN"
      finding: "wall from each #2-56 tap's drill point to the face opposite the stop-plate mating face below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-24 (#1937): accepted as stated, no geometry change; 1.594 at the printed worst case (7.80 +0.13 cylindrical depth from the mating face plus the oversize #49 drill point, in the 10.49 MIN block depth: rebate 8.40 MIN plus back wall 2.60 -0.51), above the 1.5 floor (owner-ruled shortfall)"
    - id: "RV-04"
      kind: "minor"
      where: "front view, second of the three web rows under the 2X #2-56 match-drill tap callout: THREAD TO END FACE 1.50 MIN"
      finding: "wall from the far #2-56 tap's major diameter to the block end face below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-24 (#1937): accepted as stated, no geometry change; 1.5078 at the printed worst case (21.0 -0.8 block length, the plate master's 17.50 +0.10 station transferred to the far tap, the #2-56 major radius), printed floored to 1.50 MIN, above the 1.5 floor (owner-ruled shortfall)"
    - id: "RV-05"
      kind: "minor"
      where: "front view, last of the three web rows under the 2X #2-56 match-drill tap callout: THREAD TO REBATE FLOOR 1.99 MIN"
      finding: "wall from each #2-56 tap's major diameter to the open rebate's floor below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-24 (#1937): accepted as stated, no geometry change; 1.9978 at the printed worst case (rebate floor 7.19 MIN from 14.1 -0.8 height, 2.10 +0.51 roof and 3.40 +0.1 rebate, less the plate master's 4.00 +0.10 station and the #2-56 major radius), printed floored to 1.99 MIN (owner-ruled shortfall)"
