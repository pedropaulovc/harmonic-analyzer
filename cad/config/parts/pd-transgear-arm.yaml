pd-transgear-arm:
  title: Transgear Arm
  number: MHA-PD-18
  material: AISI 1018 cold-finished steel
  material_specification: "AISI 1018 cold-finished steel bar, ASTM A108; 5/16 x 1 precision-ground flat, thickness ±0.001 in (McMaster-Carr 9517K466)"
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  process: "saw from 5/16 x 1 precision-ground flat stock (McMaster 9517K466), faces as supplied; for inspection, datum A is associated to front face A by the minimax (Chebyshev) fit (owner ruling 2026-10-27, #1379); mill the outline to the pivot radius and the square end; drill and ream the pivot bore and counterbore the rear spot face; drill and ream the pin bore through, square to the faces, for the MHA-PD-23 press; drill, countersink both sides and tap the plate clamp holes through; hold arm and MHA-PD-19 on independent retained datum-A fixture carriers at the specified critical S-K gear-plane setting and projected-axis limits; drill the two common 1.80 locating pilots through the plate and through the arm; retain each carrier while finishing plate holes 2.010–2.020 through and arm holes 1.990–2.000 through, separately, with mouth breaks 0.05 MAX; reassemble the original matched pair and inspect the actual hole positions, S-K gear-plane setup and complete loaded free-motion envelope; drill and ream the blind latch-pin hole flat-bottomed into the square end"
  installation_notes: |-
    INSTALLATION - MATCHED ARM / ARM PLATE
    SET THE SPECIFIED CRITICAL S-K POSE BEFORE MATCH-REAMING.
    TWO MHA-PD-VN-64 DOWELS LOCATE; SCREWS CLAMP ONLY.
    DO NOT LOCATE BY COUNTERSINK CENTERING OR SCREW-HOLE FLOAT.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the locating-pattern and running-axis position controls"
      finding: "position controls over-specified (rule 5)"
      reason: "required by the whole-stack stock-form gate including the rigid two-hole registration yaw; stock dowels in reamed holes locate, the screws clamp (owner-accepted)"
    - id: "RV-02"
      kind: "accept"
      where: "the 0.050 flatness frame on front face A"
      finding: "flatness on ground-stock face over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#1379): datum A is established by the minimax fit, so face A's flatness plus the stock's ±0.001 in thickness band bounds the rear plate seat's tilt to A (0.1008); that tilt sets the MHA-PD-VN-56 worst engagement and the reducer-axis tilt (owner-accepted)"
    - id: "RV-03"
      kind: "accept"
      where: "the MHA-PD-VN-58 latch pin's blind flat-bottom press hole"
      finding: "pressed pin has no way out (rule 16)"
      reason: "owner ruling 2026-10-27 (#1379): \"MHA-PD-18 latch pin should never come out.\" A permanent press; it is not removed in service, so rule 16's removal path does not apply (owner-accepted)"
    - id: "RV-04"
      kind: "minor"
      where: "end view, the latch-pin hole callout: PIN HOLE TO FACES 1.74 MIN"
      finding: "latch-pin hole ligament to the front and rear faces below the 2.0 mm target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1379): the Ø3.175 MHA-PD-VN-58 hole at mid-thickness of the 5/16 stock leaves 1.74 MIN at full budget (stock band, height band, 0.3 deg run-off over the deepest hole, both 0.25 breaks at the mouth), above the 1.5 floor; the next stock size up is tracked in #2019"
