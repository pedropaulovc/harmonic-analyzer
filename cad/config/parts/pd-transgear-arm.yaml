pd-transgear-arm:
  title: Transgear Arm
  number: MHA-PD-18
  material: AISI 1018 cold-finished steel
  material_specification: AISI 1018 cold-finished steel bar, ASTM A108
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  process: "saw from 3/8 x 1 precision-ground 1018 flat stock (Online Metals 12095), faces as supplied; mill the outline to the pivot radius and the square end; drill and ream the pivot bore and plunge the rear spot face with a 1/2 end mill; drill and ream the pin bore through, square to the faces, for the MHA-PD-23 press; drill and ream the blind latch-pin hole into the square end to a drill point with the .1240 set reamer (the MHA-PD-VN-58 dowel is its gauge: it does not enter by hand). At assembly (MHA-PD-00 steps 12-13, DETAIL K), after MHA-PD-23 is pressed, MHA-PD-19 set at DETAIL K and the trial mesh read: match-drill two #32 pilots with MHA-PD-19 and ream the arm's two holes with the .1240 set reamer (press fit on MHA-PD-VN-64, which does not enter by hand; mouth breaks .002 MAX); spot through MHA-PD-19's screw holes, drill #29 and tap #8-32 UNC through"
  drawing_unit: in
  installation_notes: |-
    INSTALLATION - MATCHED ARM / ARM PLATE
    SET THE SPECIFIED CRITICAL S-K POSE BEFORE MATCH-REAMING.
    TWO MHA-PD-VN-64 DOWELS LOCATE; SCREWS CLAMP ONLY.
    DO NOT LOCATE BY COUNTERSINK CENTERING OR SCREW-HOLE FLOAT.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the feed-stud bore's position (A|B) and perpendicularity (A) frames and the two locator holes' position frames (A|B|C)"
      finding: "position and perpendicularity controls over-specified (rule 5)"
      reason: "required by the whole-stack stock-form gate including the rigid two-hole registration yaw; stock dowels in reamed holes locate, the screws clamp (owner-accepted). Owner ruling 2026-11-20 (#1571): \"Follow recommendations unless noted otherwise\": the recommended option 1, the location names every printed frame."
    - id: "RV-03"
      kind: "accept"
      where: "the MHA-PD-VN-58 latch pin's blind press hole"
      finding: "pressed pin has no way out (rule 16)"
      reason: "owner ruling 2026-10-27 (#1379): \"MHA-PD-18 latch pin should never come out.\" A permanent press; it is not removed in service, so rule 16's removal path does not apply (owner-accepted)"
    - id: "RV-05"
      kind: "accept"
      where: "section A-A's spot-face floor nominal .2717 ±.002 (SEE NOTE 4)"
      finding: "fabricated nominal off the .001 grid (rule 3)"
      reason: "Delegated ruling 2026-11-20 (Main), following owner precedent 2026-10-31 (#290, spot-face floor 6.9 mm = MHA-PD-VN-63 installed height) and rule 3's calibrated-spring exemption; owner review #2144"
