pd-transgear-arm:
  title: Transgear Arm
  number: MHA-PD-18
  material: AISI 1018 cold-finished steel
  material_specification: AISI 1018 cold-finished steel bar, ASTM A108
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  process: "saw from 5/16 x 1 precision-ground flat stock (McMaster 9517K466), faces as supplied; mill the outline to the pivot radius and the square end; drill and ream the pivot bore and counterbore the rear spot face; drill and ream the pin bore through, square to the faces, for the MHA-PD-23 press; drill, countersink both sides and tap the plate clamp holes through; before the MHA-PD-23 pin is pressed, clamp MHA-PD-19 on the rear face and, on the mill DRO, set its knob bore at the MHA-PD-00 VIEW K coordinates from the pin bore, indicated true; drill the two common .070 locating pilots through the plate and through the arm in that setting; finish the plate holes to MHA-PD-19 and the arm holes .0784–.0786 through, separately, with mouth breaks .0019 MAX; reassemble the original matched pair and inspect the actual hole positions, S-K setting and complete loaded free-motion envelope; drill and ream the blind latch-pin hole flat-bottomed into the square end"
  drawing_unit: in
  installation_notes: |-
    INSTALLATION - MATCHED ARM / ARM PLATE
    SET THE SPECIFIED CRITICAL S-K POSE BEFORE MATCH-REAMING.
    TWO MHA-PD-VN-64 DOWELS LOCATE; SCREWS CLAMP ONLY.
    DO NOT LOCATE BY COUNTERSINK CENTERING OR SCREW-HOLE FLOAT.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the locating-pattern and running-axis position controls"
      finding: "position controls over-specified (rule 5)"
      reason: "required by the whole-stack stock-form gate including the rigid two-hole registration yaw; stock dowels in reamed holes locate, the screws clamp (owner-accepted)"
    - id: "RV-03"
      kind: "accept"
      where: "the MHA-PD-VN-58 latch pin's blind flat-bottom press hole"
      finding: "pressed pin has no way out (rule 16)"
      reason: "owner ruling 2026-10-27 (#1379): \"MHA-PD-18 latch pin should never come out.\" A permanent press; it is not removed in service, so rule 16's removal path does not apply (owner-accepted)"
    - id: "RV-04"
      kind: "minor"
      where: "end view, the latch-pin hole callout: PIN HOLE TO FACES .065 MIN"
      finding: "latch-pin hole ligament to the front and rear faces below the .080 target (rule 17)"
      reason: "owner ruling 2026-10-27 (#1379): the .125 MHA-PD-VN-58 hole at mid-thickness of the 5/16 stock leaves .0659 at full budget, printed .065 MIN (stock band ±.001, .XXX height band ±.005 from the title block per coordinator ruling (a), 0.3 deg run-off over the deepest hole, both .010 breaks at the mouth), above the .060 floor; the next stock size up is tracked in #2019"
