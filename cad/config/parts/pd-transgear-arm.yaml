pd-transgear-arm:
  title: Transgear Arm
  number: MHA-PD-018
  material: AISI 1018 cold-finished steel
  material_specification: AISI 1018 cold-finished steel bar, ASTM A108
  finish: bright machined; protect with ISO VG 32 machine-oil film
  quantity: 1
  tolerance_class: machined_block
  process: "saw from 5/16 x 1 precision-ground flat stock (McMaster 9517K466), faces as supplied; mill the outline to the pivot radius and the square end; drill and ream the pivot bore and counterbore the rear spot face; drill and ream the pin bore through, square to the faces, for the MHA-PD-023 press; drill, countersink both sides and tap the plate clamp holes through; hold arm and MHA-PD-019 on independent retained datum-A fixture carriers at the specified critical S-K gear-plane setting and projected-axis limits; drill the two common 1.80 locating pilots through the plate and blind into the arm; retain each carrier while finishing plate holes 2.010–2.020 through and arm holes 1.990–2.000 separately from the rear to 4.80 ±0.05 full-cylinder flat-bottom depth, with mouth breaks 0.05 MAX; reassemble the original matched pair and inspect the actual hole positions, S-K gear-plane setup and complete loaded free-motion envelope; drill and ream the blind latch-pin hole flat-bottomed into the square end"
  installation_notes: |-
    INSTALLATION - MATCHED ARM / ARM PLATE
    SET THE SPECIFIED CRITICAL S-K POSE BEFORE MATCH-REAMING.
    TWO MHA-VN-051 DOWELS LOCATE; SCREWS CLAMP ONLY.
    DO NOT LOCATE BY COUNTERSINK CENTERING OR SCREW-HOLE FLOAT.
