ch-fulcrum-keeper:
  number: MHA-CH-07
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: AISI 1018 cold-finished steel bar
  finish: black oxide + oil; oil the bore and crown and the crown tap, all cut after the pair-ream
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "right view, bore width station '(.275) ON WIDTH CENTER \u00b1.012, HOLDS MHA-CH-VN-55 THREAD ENGAGEMENT'"
      finding: "bore lateral place held to \u00b1.012 about the width centre instead of a title-block .XX station off a side face (\u00b1.01 plus half the width's \u00b1.01) to hold crown-tap thread engagement (rule 4)"
      reason: "the crown is a full round that follows the .55 width, so the bore must sit on the width centre, .275 off either face, which a title-block .XX station cannot print; \u00b1.012 holds the MHA-CH-VN-55 set screw at 1.5D full thread and no more than .016 proud at the worst case; the geometry alternative is the parked lug/crown resize (owner ruling Q10-B)"
    - id: "RV-02"
      kind: "accept"
      where: "foot-hole side station '.275 \u00b1.005, CENTERS MHA-FR-02 TAP IN RAIL WEB'"
      finding: "foot-hole lateral station held at .XXX instead of title-block .XX (rule 4)"
      reason: "the MHA-FR-02 rail tap is transferred through this hole; at .XX its rail-web thread ligament (build_fr_top_frame) falls below the frame's floor (owner ruling 2026-10-16)"
    - id: "RV-03"
      kind: "accept"
      where: "top view, foot-hole station '.18' off the foot tip (foot end face), beside the crown tap's '.16' off the inner lug face"
      finding: "the top view uses two origins: the foot hole is located .18 off the foot tip while the crown tap and the front view's .32 and .65 baseline from the inner lug face (rule 10)"
      reason: "owner ruling 2026-10-28 (option D): the hole is located off the foot tip because that protects the counterbore tip wall, .0726 at the full worst case (.18 at .XX, the \u00d8.150 counterbore at DRILLED HOLES +.004, two .010 edge breaks, 0.3 deg run-off over its .083 depth); located off the inner lug face (.47) the .65's band joins the stack and leaves .0626"
    - id: "RV-04"
      kind: "minor"
      where: "top view, the foot counterbore \u00d8.150 located .18 off the foot tip: the wall between the counterbore and the foot tip"
      finding: "counterbore-to-tip wall .0726 at the full worst case, below the .080 target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. The keeper foot is short; .0726 is the wall at .18 -.01 with the \u00d8.154 largest counterbore, two .010 edge breaks and 0.3 deg run-off over its .083 depth, above the .060 floor; the \u00d8.150 counterbore is the #2-56 head's \u00d8.140 plus .005 a side, and the inner-lug-face origin leaves .0626 (RV-03)"
