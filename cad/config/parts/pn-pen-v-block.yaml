pn-pen-v-block:
  number: MHA-PN-05
  material: Brass
  material_specification: C360 free-machining brass
  finish: machined; bright brass
  quantity: 1
  tolerance_class: machined_block
  process: "machined (brass)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view, TAP 4-40 UNC INTO PIVOT BORE located .49 from the paper end, .14 past the .35 step: the wall from the thread to the step face over the step's .08, stated by the native .064 MIN TAP WALL dimension (TapWallMin@TapWallReference)"
      finding: "tap wall to the step face .064 in at the printed worst case (tap station .48, step .36, #4-40 major .1120), under the .080 in target and over the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (MHA-PN-05 set-screw tap wall .064). No geometry escape: rule 17 forbids tightening a band to protect a wall; the step can't move toward the paper end (the stirrup slides on the neck with 0.016 mm to spare) and the tap/pivot bore can't move toward the free end (it carries the block toward the recording paper, which keeps 0.071 mm of clearance). The sheet states the worst-case wall as a model-owned single limit, never as note text (pn_pen_v_block_spec.TAP_WALL_MIN_MM, which refuses anything under the .060 floor)"
