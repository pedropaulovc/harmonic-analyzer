ch-rocker-arm-tl-oblique-feed-nut:
  title: Rocker Oblique Trammel Feed Nut
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  # Owner ruling 2026-11-01 (item 4): shop-made, replacing the retired bought
  # Tr8x2 flange nut MHA-CH-06-TL-VN-55. The Tr8x2 thread runs in the brass.
  number: MHA-CH-06-TL-27
  material: BRASS 360-H02 RECT BAR 3/4 x 1-1/4 in
  material_specification: Brass 360 (C36000) half-hard extruded rectangle bar, ASTM B16, 3/4 x 1-1/4 in (OnlineMetals 1500); height and width as supplied
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "saw and face to length; drill letter C and tap Tr8x2 RH through square to the faces; drill the two Ø.170 clearance holes through; drill and ream the 3/32 dowel hole through; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the Tr8x2-7H RH THRU bore in the .40 nut"
      finding: "Tr8 full-thread engagement .37 min (1.17D): the .39 minimum nut less a .010 edge-break chamfer at each bore mouth, under 1.5D (rule 18)"
      reason: "Owner ruling 2026-11-01: thread engagement below 1.5D with no geometry escape accepted as a minor exception (this package: 1.17D of full thread at the .39 minimum length less both mouth chamfers, 1.20D nominal). The shortest nut that engages 1.5D (.49, .48 min) puts the #4-40 flanged heads on its -X face 2.38 mm from the near KP08 at the travel stop, inside the 2.5 mm feed gap, and the +X stop has no room; the nut carries hand feed only."
  drawing_unit: in
