dt-cone-pivot-post:
  number: MHA-DT-05
  material_family: ferrous_noncritical
  finish: RAL 6005 ALKYD; SSPC-SP 3; 50-75 um DFT; MASK MACHINED FACES; OIL BARE FACES ISO VG 32
  quantity: 1
  tolerance_class: machined_block
  process: "machined from solid stock or casting"
  # Both journal heights and the body follow the shared raised-axis law in
  # _cone_axis_constants; the head height and mounting pitch are unchanged.
  # Crank axis height and cone incline read the current machine configs;
  # the former 86 mm / 72.7 mm / 12.5182-degree v36 values are historical.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the crank-bore diametral angularity frame to the cone-journal bore (datum A, clocked by the foot seat datum B, plan angle basic)"
      finding: "angularity frame over-specified (rule 5)"
      reason: "the fixed-centre 16T:64T crossed mesh loses running clearance to yaw and tilt of the crank axis; the mesh must never bind (owner-ruled)"
    - id: "RV-02"
      kind: "accept"
      where: "inside corners at the head-to-body, crank-boss-to-head and cone-pad-to-body junctions"
      finding: "sharp internal corners with no stated fillet or maximum radius (rules 11, 16)"
      reason: "owner ruling 2026-10-18 (fr-top-frame / sm-summing-lever precedent): machined with an R1.0 MAX inside-corner ceiling, now supplied by the shop-wide title-block default under #1625; the accepted corner geometry is unchanged (owner-accepted)"
