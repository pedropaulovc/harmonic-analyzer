ch-rocker-arm-tl-oblique-pivot-retainer:
  title: Rocker Oblique Pivot Top Retainer
  number: MHA-CH-06-TL-31
  material: low-carbon steel
  material_specification: low-carbon steel flat, 3/8 x 1 in
  finish: as turned; light oil
  quantity: 2
  tolerance_class: machined_block
  process: >-
    Turn the washer outside and clearance bore from 3/8-in steel; supply a
    7 mm minimum-thickness blank for fitting, not a 7 mm finished retainer.
    Face its underside to the actual 0.10-0.25 mm loaded running gap on the
    MHA-CH-06-TL-21 carrier and MHA-CH-06-TL-23 pin while holding the headed
    clevis firmly against the UPPER edge of the pivot-pin cross-hole. The
    calculated native finished thickness is reference only; include actual
    carrier, drilled-hole and purchased-clevis dimensions in the fitting.
    Keep both removable washers and both headed clevis pins installed with
    fresh bent split cotters for either pass pair. Isolate the spindle before
    removing either retainer. Accept actual installed toolholder/spindle
    clearance before operation; pin-end projection is not collision proof.
