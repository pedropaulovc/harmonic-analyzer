dt-crank-hub:
  number: MHA-DT-31
  # Rule 2 calls for material families, not an arbitrary list of grades.
  # This pressed, pinned hub needs no single grade (review r1 of 114fa71c1).
  material: MILD STEEL OR FREE-CUTTING STEEL
  material_specification: mild steel or free-cutting steel, cold-finished bar
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: shaft_in_bushing
  process: "turned stepped through hub; matched light press in crank arm"
