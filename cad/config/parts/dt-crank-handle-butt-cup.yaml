dt-crank-handle-butt-cup:
  title: Crank Handle Butt Cup
  number: MHA-DT-35
  description: "CRANK HANDLE BUTT CUP"
  # Owner ruling B on #1375: stock for the enlarged body and restored wall floor.
  material: AISI 12L14 or 1018 CF rod, 1/2 in
  material_specification: AISI 12L14 or 1018 cold-finished steel rod, 1/2 in
  finish: bright turned, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "turned (steel); epoxied flush in the MHA-DT-08 butt counterbore; face left flat, the oak's end round turned clear of it"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "pocket bore callout: WALL .060 MIN"
      finding: "steel pocket wall .060 at the outer face, where the pocket mouth and the body's face edge each take the .010 edge break, at the smallest body and largest pocket (the straight wall below the face holds .080); at the .060 floor and under the .080 target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (extends to MHA-DT-35 .060). Owner ruling 2026-11-08 (Pedro), #2144 item 7.1 (#2170, option B): the body grows Ø.382 to Ø.422 so the broken face keeps the floor, as owner ruling B on #1375 grew it for the straight wall; the MHA-DT-32 head fixes the pocket, and a body large enough for .080 at the face flattens the MHA-DT-08 butt dome"
