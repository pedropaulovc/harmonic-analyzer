dt-crank-handle-butt-cup:
  title: Crank Handle Butt Cup
  number: MHA-DT-35
  description: "CRANK HANDLE BUTT CUP"
  # Owner ruling B on #1375: stock for the enlarged body and restored wall floor.
  material: AISI 12L14 or 1018 CF rod, 1/2 in
  material_specification: AISI 12L14 or 1018 cold-finished steel rod, 1/2 in
  finish: bright turned, oiled
  quantity: 1
  tolerance_class: machined_block
  process: "turned (steel); epoxied flush in the MHA-DT-08 butt counterbore; face left flat, the oak's end round turned clear of it"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "pocket bore callout: WALL .061 MIN"
      finding: "steel pocket wall .061 at the outer face, where the pocket mouth and the body's face edge each take the .010 edge break, at the smallest body and largest pocket (the straight wall below the face holds .081); above the .060 floor and under the .080 target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (extends to MHA-DT-35 .061). Owner ruling 2026-11-08 (Pedro), #2144 item 7.1 (#2170, option B) and owner ruling 2026-11-26 (#3743, option A): the body grows to Ø.447 around the Ø.275 +/-.005 pocket so the straight wall holds .081 and the broken face .061; a body large enough for .080 at the face flattens the MHA-DT-08 butt dome"
