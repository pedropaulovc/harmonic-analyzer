pn-pen-hanger:
  number: MHA-PN-02
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: AISI 1018 CF flat, 1/8 x 3/4 REF
  # Stock: OnlineMetals 4804, 1/8 x 3/4 in 1018 cold-finish flat, 24 in,
  # bought for this part in the 2026-11-03 machine stock order (#2436); the
  # strap and both guide plates come from it.
  finish: "black oxide per MIL-DTL-13924 Class 1, oil sealed"
  quantity: 1
  tolerance_class: machined_block
  fit_class: fastener_clearance
  process: "machined (steel); guide plates silver-brazed to the strap"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the hanger-screw #8 close-clearance hole's native Hole Wizard callout only: its hw-diam variable's decimal places, written as 3 at drawing time from draw_pn_pen_hanger.SCREW_HOLE_CALLOUT_PRECISION through _drawing_hole_callout.set_hole_callout_precision (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes hole callout precision at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 1.2: drawing-side ICalloutLengthVariable precision is the established merged pattern. Native experiment run 20261102T230110877Z: part-authored Hole Wizard precision did not reach the callout (read -1, the document default). Owner review #2144. This accepts no other precision, band, callout or package departure."
