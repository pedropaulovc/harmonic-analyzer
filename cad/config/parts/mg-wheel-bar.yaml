mg-wheel-bar:
  number: MHA-MG-08
  material: Plain Carbon Steel
  material_specification: Plain Carbon Steel
  finish: machined
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "machined (steel)"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view, drilled axle-bore callout: WALL .074 MIN (axle bore top wall, to the top face)"
      finding: "axle bore top wall .074 MIN, below the .080 target (rule 17)"
      reason: "owner ruling 2026-10-26 (#1532): the row stands 5.0 mm (.197) under the top face because the MHA-PN pen-hanger strap's top is flush with the bar top and the row carries the MHA-MG-07 axle, the wheel and the MHA-SH-02 taps, so no height change reaches this wall; restated for the drilled bore by owner ruling 2026-11-24, fit audit question 18 (\"APPROVED as recommended\": the .1865 reamed bore becomes a 3/16 drilled bore with the axle bonded, the wall .0743, under the ruled .076); full worst case = row .XXX band at its printed .197 (one row height for all four holes), 3/16 drilled bore at its .1915 top (DRILLED HOLES +.004), 0.3 deg run-off over the deepest bar, R.010 edge break at the rim and at the top edge; holds the .060 floor"
    - id: "RV-02"
      kind: "minor"
      where: "front view, hanger-hole callout: WALL .076 MIN (hanger hole top wall, to the top face)"
      finding: "hanger hole top wall .078 MIN, below the .080 target (rule 17)"
      reason: "owner ruling 2026-10-26 (#1532): the row stands 5.0 mm (.197) under the top face (strap top flush with the bar top; row at the axle, wheel and taps' height), so no height change reaches this wall; full worst case = row .XXX band at its printed .197 (one row height for all four holes), DRILLED HOLES +.004, 0.3 deg run-off, R.010 edge break at the rim and at the top edge; holds the .060 floor"
    - id: "RV-03"
      kind: "minor"
      where: "front view, 2X clamp-hole callout: WALL .070 MIN (clamp holes top wall, to the top face)"
      finding: "clamp holes top wall .070 MIN, below the .080 target (rule 17)"
      reason: "owner ruling 2026-10-26 (#1532): the row stands 5.0 mm (.197) under the top face (strap top flush with the bar top; row at the MHA-SH-02 taps' height), so no height change reaches this wall; full worst case = the title block's +/-.005 row band (tightened from +/-.007, Owner ruling 2026-11-08 (Pedro), #2144 item 11.2), DRILLED HOLES +.004, 0.3 deg run-off, R.010 edge break at the rim and at the top edge; holds the .060 floor"
    - id: "RV-07"
      kind: "minor"
      where: "front view, hanger-hole callout: WALL .076 MIN (hanger hole end wall, to the left end)"
      finding: "hanger hole end wall .076 MIN, below the .080 target (rule 17)"
      reason: "owner ruling 2026-10-26 (#1532): the hanger station is the pen-hanger strap's screw line 5.0 mm (.20) from the free left end; full worst case = station .XX band at its printed .20, DRILLED HOLES +.004, 0.3 deg run-off, R.010 edge break at the rim and at the end edge; holds the .060 floor"
    - id: "RV-08"
      kind: "minor"
      where: "sheet note 1, linked from the 2X clamp-hole callout (CLEARS MHA-SH-02 TAPS, SEE NOTE 1): 1. EACH .196 HOLE TO ITS MHA-SH-02 TAP: OFFSET UP TO .003 OVER #8 SCREW CLEARANCE."
      finding: "the MHA-SH-VN-53 clamp screw line (bar hole to MHA-SH-02 back-arc tap) not held by the hole's radial float at the worst case once drill wander is charged, with no fit-up adjustment (rules 17, 19, 20)"
      reason: "Delegated ruling 2026-11-21 (Main), following the owner's acceptance of the same shortfall at about 0.046 mm on #2421/#2422 and sh-column-clamp-front RV-02; owner review #2144. The shortfall it accepts is the computed 0.0527 mm below, not the ~0.046 the owner saw. The owner's acceptance: Owner ruling 2026-11-20 (Pedro), #1988, in his words: \"Follow recommendations unless noted otherwise\"; the recommendation accepted: \"Accept the ~0.046 shortfall as ruled, consistent with RV-02 (0.053) on the clamp front screw line; the worst case needs every wander term to stack against the band limits.\" Charged: the clamp row and stations at the title block's +/-.005 rounded to the printed .001, the back-arc tap's zone and 0.3 deg wander, and this bar's 0.3 deg through-hole run-off (mg_wheel_bar_spec.DRILL_RUNOFF), against the #8 screw in the .196 MIN hole: 0.0527 mm (.0021) over, stated rounded up as .003 (test_mg_wheel_bar_drawing holds it at or under 0.053). The ruling's ~0.046 left out the .001 rounding reach; the computed value stays inside the 0.053 of sh-column-clamp-front RV-02, the precedent the ruling names. No slot, oversize or match-drill is added"
