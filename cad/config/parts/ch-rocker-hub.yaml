ch-rocker-hub:
  title: Rocker Hub
  number: MHA-CH-12
  # Component of the built-up MHA-CH-06 (ch_rocker_arm_notes.BUILT_UP_PERMISSION_NOTE);
  # test_part_coverage counts it reachable through that part.
  component_of: ch-rocker-arm
  material: Plain Carbon Steel
  material_specification: AISI 1018 cold-finish round
  # Black oxide once, on the joined MHA-CH-06, after its bore and length are
  # finished; note 1 names the joint.
  finish: black oxide after joining
  quantity: 20
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from 1018 round: land turned to its press band, bore drilled and length parted off long; pressed into MHA-CH-13, then bore and length finished on MHA-CH-06"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "face view, the \u00d8.246 supply bore callout: WALL .075 MIN"
      finding: "wall from the largest supply bore to the smallest press-fit land below the .080 target (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. .075 MIN between the \u00d8.4009 least land and the \u00d8.250 largest letter-D drill (DRILLED HOLES +.004) stays above the .060 floor; the bore is a supply size reamed to its finished size after joining (MHA-CH-06), and the letter-D drill leaves the stock the ream needs"
