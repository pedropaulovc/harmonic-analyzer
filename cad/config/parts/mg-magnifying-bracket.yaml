mg-magnifying-bracket:
  number: MHA-MG-01
  material: LOW-CARBON STEEL
  material_specification: LOW-CARBON STEEL
  finish: blued
  quantity: 1
  tolerance_class: machined_block
  process: "simple blued low-carbon-steel L; parallel 11.00 neck and concentric R5.50 ±0.05 nose, no taper or collar; 12.50 thread-axis thickness uses ordinary .XX ±0.51 and standard 1/4-20 UNC through tap, ordinary 2B title-block fit; native hole locations 5.50 ±0.05 from the physical neck side and nose tip retain material around the tap; no extra functional qualifiers on the print. The 3.175 foot remains ordinary .XXX ±0.13 because coarser bands lose #2-56 screw engagement or bottom clearance. Mouth chamfers remain modeled 0.20 at 45 degrees, native primary distance 0..0.25 and ordinary angular band; printed edge acceptance follows the title block, with no local angle-only note. No custom internal-major maximum or guaranteed manufactured nose-wall calculation (ASME B1.1 does not specify an internal maximum major diameter); nominal major-to-nose wall 2.325 and nominal mouth wall 2.125, actual finished walls remain governed by drawing-policy target 2.0 / floor 1.5. Full thread overlap is at least 10.272234843 at the useful pose or 10.307234843 when fitted to the native projection, both above 1.5D 9.525. Generic elastic moduli are estimates, not a grade-specific yield guarantee; factor-three simultaneous bending/torsion von Mises demand is conservatively bounded at about 27.360 MPa. Smooth tangent root R0.60 inside plus R0.25 outside edge, inside-corner acceptance follows title-block R1.0 MAX; foot 54.25 x 12.70 x 3.175, free end extended 5.00 only to machine X -8.00, unchanged hole axes X 1.00 / 14.70 give setbacks 9.00 / 22.70; seat and lever pose unchanged; simple end view with native THRU callout, no A-A or custom root inspection; actual isometric scale caption required."
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the MHA-MG-03 external lever thread in this bracket's through tap, installed by MHA-MG-00 to tip projection"
      finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
      reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. Assembly RV-02 and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
