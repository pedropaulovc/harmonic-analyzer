mg-magnifying-bracket:
  number: MHA-MG-01
  material: LOW-CARBON STEEL
  material_specification: LOW-CARBON STEEL
  finish: blued
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "simple blued low-carbon-steel L; parallel neck and concentric nose, no taper or collar; .49 thread-axis neck with a standard 1/4-20 UNC through tap at the title block's 2B. RV-03 keeps the head geometry and its three tightened controls: nose R.217 ±.002 and the tap .217 ±.002 from the nose tip and side, RETAINS TAP WALL below-text, no outside-profile fit mate. Matched-width foot, flush with the neck sides and without a lateral ledge: .433 wide, 2.14 long, .125 ±.005 thick (MHA-MG-VN-53 SCREW GRIP: .120 to .130 keeps full screw engagement and tip clearance); two #2 clearance holes at the MHA-SM-03 tapped-hole stations, .354 and .894 from the free end and .189 from the lower edge. The SM-facing foot back is the one locating seat, Ra 125 µin; bluing and CAST/MACHINED are not a substitute for that grade. Mouth breaks are modeled .008 at 45 degrees with native primary distance 0 to .010 (title-block edge break) and the ordinary angular band; the inside X-root and free-foot rounds are the .010 edge break. No internal-major MAX or manufactured nose-wall guarantee is inferred from 2B: the .092 major-to-nose and .084 mouth walls are nominal only, so neither the .080 target nor the .060 floor is certified. Fitted projection gives full overlap .423 above 1.5D .375, root-runout clearance .061 and minimum projection .038. Arm demand uses the minimum accepted .48 x .430 section, maximum span 3.845 and fitted gravity arm 6.331, with nominal A1 force stations; the foot gives a minimum prying arm of .187. Generic steel has no certified yield margin. Decimal-inch sheet (#290): the neck, nose and foot keep the shared receiver joint's millimetre geometry and print rounded; every stack reads the printed limits."
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the MHA-MG-03 external lever thread in this bracket's through tap, installed by MHA-MG-00 to tip projection"
      finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
      reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. Assembly RV-02 and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
    - id: "RV-03"
      kind: "accept"
      where: "MHA-MG-01 sheet 1, existing thread-axis end view: NoseR R.217 ±.002 and TapFromTip/TapFromSide .217 ±.002"
      finding: "Retained head wall controls: these three head profile/location bands are tighter than the ordinary title-block band to retain tap wall, without an outside-profile fit mate; keeping the existing geometry and these exact controls is an accepted departure from rules 4/17."
      reason: "User explicitly selected 'A — Keep geometry; approve exception' in this session after the PNG comparison; the earlier timed-out selection was not approval. Acceptance is limited to retaining this existing head geometry and these three controls with their RETAINS TAP WALL below-text; #290 restates the original ±0.05 mm controls as ±.002 in about the R.217/.217 that the unchanged 5.50 mm head prints. The finished head minimum wall is unknown: ordinary 1/4-20 UNC 2B supplies no specified finished internal-major MAX here, and diameter .250 BASIC is not the actual manufactured envelope. The .092 head and .084 mouth walls are nominal only; at the printed limits with the .010 edge break the mouth wall is .078 MIN, under the .080 target and over the .060 floor (owner, #290 inch step: accepted here, no special edge break). Neither the .080 target nor the .060 floor is certified. This creates no outside-profile mate, thread-major limit or manufactured-wall guarantee, and waives no foot-grip, mounting mate-flag, drawing line-clearance, other wall or installed-engagement requirement. The separate RV-02 retention acceptance is unchanged."
