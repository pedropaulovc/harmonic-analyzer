  process: "simple L machined from 1018 cold-drawn steel, then blued; parallel neck sides, no taper or collar boss; neck 12.50 ±0.10 thick on the thread axis, centred on the lever; axial nose R5.50 ±0.05 with the 1/4-20 UNC-2B through tap located 5.50 ±0.05 from the physical neck side and nose tip; internal thread-root envelope Ø6.45 MAX, both mouth chamfers 0.20 ±0.05 on both legs at 45 degrees; true radial location stack sqrt(0.10^2+0.10^2), plus drill wander 0.10 + 12.6 tan(0.3 degrees) = 0.165974, gives 1.667605 minimum thread-mouth wall, printed 1.667 MIN, above the 1.5 floor but below the 2.0 target; four foot corners and all inside neck/foot corners R0.25 MAX; mounting holes, seat and 3.175 ±0.13 screw grip unchanged; foot right edge extends flush to the neck right face without a ledge; mates the MHA-MG-03 lever thread without locknut, set screw or adhesive"
