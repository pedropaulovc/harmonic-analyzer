mg-magnifying-bracket:
  number: MHA-MG-01
  material: LOW-CARBON STEEL
  material_specification: LOW-CARBON STEEL
  finish: blued
  quantity: 1
  tolerance_class: machined_block
  process: "simple blued low-carbon-steel L; parallel nominal 11.00 neck and concentric R5.50 ±0.05 nose, no taper or collar; nominal 12.50 thread-axis thickness prints 12.5 at ordinary .X ±0.8 with standard 1/4-20 UNC through tap, ordinary 2B title-block fit. Owner 2026-10-22 chose Keep geometry; explain controls, superseding the prior no-qualifier direction: all three head radius/location ±0.05 dimensions retain source-owned RETAINS TAP WALL below-text, not an outside-profile fit mate. Foot grip is explicit native 3.175 ±0.13 with MHA-MG-VN-53 / SCREW GRIP below-text; its accepted 3.045..3.305 interval retains 3.305 full screw engagement and 0.0075 tip clearance. Overall foot length and width print one place with their own ordinary bands; modeled 54.25 x 12.70 x 3.175, machine X -8..46.25, hole axes X 1/14.70 and lowered local Y -0.71 remain unchanged. Native source owns precision, bands and functional text; one existing sheet and ordinary end view, no extra view or section. Mouth breaks stay modeled 0.20 at 45 degrees with native primary distance 0..0.25 and ordinary angular band. No internal-major MAX or manufactured nose-wall guarantee is inferred from 2B: nominal major-to-nose wall 2.325 and mouth wall 2.125 are nominal only; actual finished walls remain subject to the 2.0 target / 1.5 floor. Fitted projection gives full overlap 10.017234843 above 1.5D 9.525, root-runout clearance 0.525 and minimum projection 0.740. Arm demand uses minimum accepted 11.7 x 10.9 section, maximum span 97.965 and fitted gravity arm 161.710, with nominal A1 X/Y force stations; generic steel has no certified yield margin. Tangent roots remain R0.60 inside plus R0.25 outside; inside acceptance follows title-block R1.0 MAX. No custom root inspection; actual isometric scale caption required."
  machinist_exceptions:
    - id: "RV-02"
      kind: "accept"
      where: "the MHA-MG-03 external lever thread in this bracket's through tap, installed by MHA-MG-00 to tip projection"
      finding: "the unseated lever thread has no mechanical anti-loosening means; projection is set without a shoulder or preload (rule 23, lock threaded joints exposed to operating loads)"
      reason: "user, 2026-10-20: 'no further thread locking needed because mg-magnifying-lever does not experience rotational forces'. The accepted design has no added lock; it is not a static clamp or a demonstrated vibration-proof joint. Vibration can still change projection or back the lever out. Assembly RV-02 and joint_retention.py U-MHA-MG-03-no-lock record this same joint, with full engagement remaining a separate requirement."
    - id: "RV-03"
      kind: "accept"
      where: "the R5.50 ±0.05 nose and both 5.50 ±0.05 tap locations, each carrying RETAINS TAP WALL below-text"
      finding: "tight outside-profile/location bands retain material around a standard through tap, rather than defining an outside-profile mating fit (rules 4 and 17)"
      reason: "owner, 2026-10-22: Keep geometry; explain controls. Retain the existing head geometry and three ±0.05 bands, with concise material-retention text; no outside-profile mate is invented. This explicitly supersedes the prior removal of those functional qualifiers. The standard 2B thread still supplies no internal-major MAX or all-variation wall guarantee; this acceptance adds no thread-cavity limit or wall shortfall approval."
