ch-rocker-arm:
  number: MHA-CH-06
  material: Plain Carbon Steel
  material_specification: AISI 1018 low-carbon steel
  finish: matte black oxide
  quantity: 20
  tolerance_class: machined_block
  drawing_unit: in
  process: "machined from solid stock"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "rod-pin hole position frame (position dia .014 to A|B), datum feature C"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "rod-pin coordinates set the connecting-rod lever length and angle; changing them changes the cam-to-rocker closure and neutral pose (owner-accepted channel-consistency control); datum C clocks the arm from the rod pin, which sets the arm's angle"
    - id: "RV-02"
      kind: "accept"
      where: "the two surface-profile frames, each with its unequally disposed (circled U) modifier: the R31.496 (R800 mm) upper arc (U .020, zone wholly outside), and the R32.126 (R816 mm) lower arc with its tapers and both tip lands, between J and K (U 0, zone wholly inside)"
      finding: "surface-profile frames over-specified (rule 5); circled-U modifier on both frames (rule 26)"
      reason: "the R800 form sets the amplitude-bar foot sliding-contact locus closing the rocker-bar-lever chain, and the R816 arc, tapers and tip lands between J and K complete the concentric strap envelope filed to one scribed line; a radius size band cannot state the accepted form (owner-accepted). The circled-U modifiers: the rocker contract's one-sided height envelope (ch_rocker_arm_spec.TOP_EDGE_BAND, +.020/.000) puts the top edge's zone wholly outside and the lower outline's wholly inside, and the outline-template inspection (ch_rocker_arm_profile_check) reads exactly those zones; an equal-bilateral zone would move the kinematic nominal and re-key the chain. Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
    - id: "RV-03"
      kind: "minor"
      where: "the sheet note HUB WALL .064 MIN"
      finding: "bore-to-hub wall below the .080 in target (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. .064 MIN at the worst printed limits (\u00d8.40 at .XX, the reamed \u00d8.2560 +.0010 bore, the \u00d8.004 position zone) stays above the .060 floor; the OD ceiling is set by the amplitude-bar foot cheeks at rest, so the shared hub nominal stays unchanged"
    - id: "RV-04"
      kind: "accept"
      where: "hub OD position frame dia .004 to A, authored by draw_ch_rocker_arm._hub_position_frame from ch_rocker_arm_spec.HUB_COAXIALITY_DIA"
      finding: "hub OD position frame over-specified on a channel part (rule 5)"
      reason: "retain the existing hub OD control to the pivot axis: owner ruling 2026-10-19 (relayed by coordinator); this acceptance covers only the existing dia .004 (formerly 0.10 mm) to A frame, not a tighter band or any other feature"
    - id: "RV-05"
      kind: "accept"
      where: "strap position frame .004 to G, authored by draw_ch_rocker_arm._strap_position_frame from ch_rocker_arm_spec.STRAP_HUB_SYMMETRY; G is the hub minus-Z end face with BASIC .1389 to the strap centre"
      finding: "strap position frame and datum G over-specified on a channel part (rule 5)"
      reason: "retain the existing strap-to-hub registration: owner ruling 2026-10-19 (relayed by coordinator); this acceptance covers only the existing .004 (formerly 0.10 mm) to G frame and its hub-end-face BASIC registration, not another datum scheme or a tighter band"
    - id: "RV-06"
      kind: "accept"
      where: "general note 2 'MAY BE HUB MHA-CH-12 JOINED TO STRAP MHA-CH-13 PER THEIR DWGS.'"
      finding: "a process option (built-up route) on a part sheet (rule 7)"
      reason: "user ruling 2026-10-16 (route v3): the arm may be the turned hub MHA-CH-12 pressed into the flat strap MHA-CH-13; the note is the owner's permission only, and the joint (its press fit, ch_rocker_hub_fit) is defined on those two details, which exist for this route. Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
