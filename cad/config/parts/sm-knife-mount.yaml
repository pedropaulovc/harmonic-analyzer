sm-knife-mount:
  number: MHA-SM-02
  material: AISI O1 tool steel
  material_specification: AISI O1 tool steel
  finish: 58-60 HRC, unpainted; sizes apply after hardening
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the datum-C dowel slot's position frame and the #10-24 hanger-tap and knife-bore position frames to A|B|C"
      finding: "position frames over-specified (rule 5)"
      reason: "keep the knife bore square to the dowel line and let the crossbar clearance hole float round the bolt (owner-accepted knife-edge-system control; the slot frame moved here from MHA-FR-02 with the slot, owner ruling 2026-10-24 T+H3)"
    - id: "RV-02"
      kind: "accept"
      where: "the knife-bore position frame's composite lower segment, Ø0.05 to A|B|C under the Ø0.20 to A|B|C"
      finding: "composite position frame over-specified (rule 5)"
      reason: "the lower segment only orients: it holds the knife bore's axis parallel to the top seat and clocked to the B-C dowel line within Ø0.05, the far-end offset the trunnion's rock budget charges, while the Ø0.20 still locates the bore (owner-accepted knife-edge-system control, owner ruling 2026-10-27, #2016)"
    - id: "RV-03"
      kind: "accept"
      where: "the datum-B dowel hole's and the datum-C dowel slot's perpendicularity refinements to A (⊥ Ø0.015 | A and ⊥ 0.015 | A)"
      finding: "orientation refinements over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the hole and slot that slip onto the crossbar's pressed dowels are held square to the top seat so a dowel leaning within MHA-FR-02's ⊥ Ø0.02 still slides home without binding (the assembly's slip-tilt contract)"
    - id: "RV-04"
      kind: "accept"
      where: "the top seat (datum A) carries no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed 0.01 seat conformity over the 13.2 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about 0.03"
