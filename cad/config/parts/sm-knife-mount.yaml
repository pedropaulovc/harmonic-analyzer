sm-knife-mount:
  number: MHA-SM-02
  material: AISI 4140/4142 HT steel
  material_specification: AISI 4140/4142 HT, pre-hardened, as supplied
  # Owner ruling 2026-11-10 (Pedro), #2334, option B1 with S1 and S2: the block is cut from 4140/4142 HT bar as supplied (28-32 HRC) with no heat treatment in the shop; both fits and the tap are cut once, in that condition, with HSS. It supersedes the 2026-11-08 owner ruling (SM-02 harden less: O1 drawn back to 40-45 HRC, fit sizes cut after hardening), whose own intent (a hardness the shop can still ream, no allowance, no lap) it keeps.
  # 28-32 HRC is the mill's pre-hardened (quenched and tempered) condition: Wingate Alloys 4140 HT (https://wingatealloys.com/products/alloy-steel/4140-ht-4140-prehard/), Ameralloy 4140 (https://ameralloy.com/product/alloy-steel-4140/). The seat need only out-rank the lever's soft parent-metal knife (#1611); no check reads a harder seat.
  finish: "28-32 HRC as supplied; unpainted, oiled"
  quantity: 2
  tolerance_class: machined_block
  # S1 of the same ruling supersedes delegated ruling sm Q3 (2026-11-07, Main): the #10-24 tap is located on the part from datum B, not spotted through MHA-FR-02. The owner rulings of 2026-11-05 (tap annealed, inspect hardened) and the delegated sm Q5 have no hardening left to govern.
  # Owner ruling 2026-11-23, tool audit Q13: "dia .4985 +.0015/0 (owner chose against the agent's recommendation to keep .4720); no 12 mm reamer". The trunnion bore was the book's close bore, Ø.472 (ch18 p.42, 2026-09-02 re-read); it is now Ø.4985 +.0015/0, 5.6 % larger than the book's, reamed with the .4990 reamer of the over/under set.
  process: "machined complete from 4140/4142 HT bar as supplied (28-32 HRC), no heat treatment; the MHA-SM-03 trunnion bore is reamed (.4990 HSS reamer) to its printed band and the datum-B MHA-SM-VN-53 dowel hole is a #30 drill (owner ruling 2026-11-24, fit audit OQ19); one blind #10-24 thread per mount (two mounts total), drilled and tapped at its position from datum B with a bottoming tap and checked with an MHA-SM-VN-52 bolt"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the knife-bore position frame ⌖ Ø.008 | A | B, which carries datum C"
      finding: "position frame over-specified (rule 5)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 11.3 (scheme S1): one dowel (datum B) and the screw hang the block, the former slot datum C is deleted, and the bore is located to A|B only; its yaw about B is left free on the part because the MHA-SM-00 gauge bar through both mounts' bores sets it at assembly (fit-up order owner-confirmed 2026-11-08 (Pedro), #2144 item 11.3) and the rock gauge proves the 5.0 deg free rock (build_sm_summing_assembly). The Ø.008 bounds the bore's offset off its station, which the hanger-bolt float and rear-mount yaw budgets charge (owner-accepted knife-edge-system control). Owner ruling 2026-11-10 (Pedro), #2334 option B1, S1: the #10-24 tap is cut on the part from datum B instead of spotted through MHA-FR-02, and the bore, now datum C, clocks the tap's frame (RV-06)"
    - id: "RV-02"
      kind: "accept"
      where: "the knife-bore parallelism refinement ∥ .002 | A under the Ø.008 position frame"
      finding: "orientation refinement over-specified (rule 5)"
      reason: "Owner ruling 2026-11-08 (Pedro), #2144 item 11.3: the refinement holds the bore's axis parallel to the top seat (its pitch) so the gauge bar enters both mounts' bores and the trunnion's ridge bears along the bore; the yaw it leaves free is set by the gauge bar at MHA-SM-00 (owner-accepted knife-edge-system control, owner ruling 2026-10-27, #2016)"
    - id: "RV-03"
      kind: "accept"
      where: "the datum-B dowel hole's perpendicularity refinement to A (⊥ Ø.001 | A)"
      finding: "orientation refinements over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the hole that slips onto the crossbar's pressed dowel is held square to the top seat so a dowel leaning within MHA-FR-02's ⊥ Ø.001 still slides home without binding (the assembly's slip-tilt contract)"
    - id: "RV-04"
      kind: "accept"
      where: "the top seat (datum A) carries no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed .0004 seat conformity over the .540 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about .0035 (owner ruling 2026-11-24, fit audit OQ19: B drilled #30, its .0032 least slip; .0011 under the former reamed slip; since #3124 items 3 and 4: the proud set at assembly, the holes to drill points; with the hole at ⊥ Ø.001, delegated ruling sm Q1, and MHA-FR-02's ream at ⊥ Ø.001, owner ruling 2026-11-06)"
    - id: "RV-06"
      kind: "accept"
      where: "the #10-24 tap's position frame ⌖ Ø.005 | A | B | C▷"
      finding: "drilled-and-tapped hole positioned tighter than the drilled-hole location row with no fit route (rule 4); tertiary datum with translation modifier (rule 5)"
      reason: "Owner ruling 2026-11-10 (Pedro), #2334 option B1 with S1: the tap is drilled and tapped on the part at the DRO from datum B, in the top-seat setup that drills B; the bore is reamed from the front face in its own setup, so a pin indicated in the bore, or in B and the tap, carries the clocking across the setup change (the B-to-tap line square to the bore within atan(0.0635 / 7.62) = 0.48 deg); the transfer through the frame it replaces needed an assembly step before the part was finished. Owner ruling 2026-11-10 (Pedro), #2334 margin option 1a, superseding the Ø.008 zone of the B1 ruling: once the stack charged the gauge bar's own .0017 play in the bores, Ø.008 left only 0.018 mm of bolt spare in MHA-FR-02's C-drill hole and a 0.053 mm washer ring inside its knockouts; Ø.005 left 0.072 and 0.160 with MHA-FR-02 unchanged. Owner ruling 2026-11-20 (Pedro), #2499: 'Follow recommendations unless noted otherwise': the gauge bar's fit widened to .0026-.0041 so it passes two conforming bores. Owner ruling 2026-11-24, fit audit OQ19 (B a #30 drill, MHA-FR-02's hanger holes a letter E), C12 (the washer's criterion is its bearing width round the hole, not a ring inside the knockouts) and S6 (the gauge bar turned until it slides through both mounts, DIA .496 MIN: at most .0040 play): at Ø.005 the bolt keeps 0.078 mm of spare (build_sm_summing_assembly HANGER_SCREW_FLOAT_SPARE) and the washer 1.472 mm of bearing width (build_fr_top_frame HANGER_WASHER_BEARING_MIN); Ø.010 would overrun the float. The bore (datum C, translated) only clocks the tap about B: the gauge bar aligns each block to its bore at MHA-SM-00, so the tap must stand on the bore's square through B, or the bore's yaw inside its own zone would swing the tap 0.11 mm across its bolt hole"
    - id: "RV-07"
      kind: "accept"
      where: "the knife bore's limits of size, Ø.4985 +.0015/.0000 REAM THRU, RUNNING FIT ON MHA-SM-03 TRUNNION"
      finding: "band on a reamed hole; limits of size on a hole whose mate is a made part (rule 4)"
      reason: "Owner ruling 2026-11-23, tool audit Q13, option B: \"dia .4985 +.0015/0\" (chosen over keeping .4720; no 12 mm reamer). The band is the owner's printed size for this bore, reamed with the .4990 reamer of the over/under set (process above); register N-01 keeps the REAM."
