sm-knife-mount:
  number: MHA-SM-02
  material: AISI O1 tool steel
  material_specification: AISI O1 tool steel
  finish: 58-60 HRC, unpainted; sizes apply after hardening
  quantity: 2
  tolerance_class: machined_block
  process: "machined (steel)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the datum-C dowel slot's position frame (⌖ .002 | A | B on the slot width) and the #10-24 hanger-tap and knife-bore position frames to A|B|C"
      finding: "position frames over-specified (rule 5); and the slot frame reads as incomplete or missing its basics because no boxed basic dimension locates the slot (rule 5)"
      reason: "keep the knife bore square to the dowel line and let the crossbar clearance hole float round the bolt (owner-accepted knife-edge-system control). The slot frame moved here from MHA-FR-02 with the slot (owner ruling 2026-10-24 T+H3) and keeps that frame's owner ruling of 2026-10-24 under ASME Y14.5-2018: it controls only the slot WIDTH, its median plane centred on datum B's axis at an implied basic 0 across the dowel line and an implied basic 0 deg along it, which need no printed basic; the toleranced .57 (.XX) to the slot's half-round end sets the slot's position ALONG the slot and is the band the slot-pin margin and slot-to-tap web stacks charge, so a basic along-slot dimension is not required and the frame is complete as drawn"
    - id: "RV-02"
      kind: "accept"
      where: "the knife-bore position frame's composite lower segment, Ø.002 to A|B|C under the Ø.008 to A|B|C"
      finding: "composite position frame over-specified (rule 5)"
      reason: "the lower segment only orients: it holds the knife bore's axis parallel to the top seat and clocked to the B-C dowel line within Ø.002, the far-end offset the trunnion's rock budget charges, while the Ø.008 still locates the bore (owner-accepted knife-edge-system control, owner ruling 2026-10-27, #2016)"
    - id: "RV-03"
      kind: "accept"
      where: "the datum-B dowel hole's and the datum-C dowel slot's perpendicularity refinements to A (⊥ Ø.0006 | A and ⊥ .0006 | A)"
      finding: "orientation refinements over-specified (rule 5)"
      reason: "owner ruling 2026-10-27 (#2016, option A): the hole and slot that slip onto the crossbar's pressed dowels are held square to the top seat so a dowel leaning within MHA-FR-02's ⊥ Ø.0008 still slides home without binding (the assembly's slip-tilt contract)"
    - id: "RV-04"
      kind: "accept"
      where: "the top seat (datum A) carries no flatness control"
      finding: "seat flatness unspecified for the knife-mount dowel slip-tilt fit (rules 1, 5)"
      reason: "owner preference 2026-10-27 (no FCF on face-milled seats): the knife-mount slip-tilt proof (build_sm_summing_assembly, #2016) charges an assumed .0004 seat conformity over the .540 minimum seat, which a face-milled seat drawn flat by the bolt holds; the fit binds only past about .0017"
