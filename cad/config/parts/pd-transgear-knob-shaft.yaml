pd-transgear-knob-shaft:
  title: Transgear Knob Shaft
  number: MHA-PD-08
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  fit_class: shaft_in_bushing
  # Selected stock cutter: TTC 10-289-487, 48DP PA20 #7 (14–16T); in stock 2026-10-27.
  # https://www.travers.com/product/ttc-10-289-487-involute-style-gear-cutter-10-289-487
  # Same body as the #8 10-289-488. StockForm uses the lower-count 14T master;
  # rigid template translation is not x.
  # Verified cutter body OD 44.45 mm and arbor bore 22.225 mm; grind depth/form
  # accuracy are unpublished. Main's 2.25-module depth is a model premise,
  # provisional for physical admission, not published vendor ground geometry.
  # Pedro's owner ruling, 2026-11-05 (coordinator session): single-point, not die-cut.
  process: "turned from bar, including the front neck and limited corner radius; integral 15T 48DP PA20 teeth cut straight at full depth through the face with stock #7 form cutter (14T master), with radial setting, tooth-span and all-space angular-index acceptance from the part specification; mill the front D-core flat to its specified physical rounded-tool-end limits; #8-32 UNC-2A thread single-pointed on the lathe; rear cup/journal spring-pin hole match-drilled at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore is the owner gear-tooth critical class (owner-accepted)"
    - id: "RV-02"
      kind: "accept"
      where: "the core and front-relief runout frames to the running journal"
      finding: "runout frames over-specified (rule 5)"
      reason: "finite stock-cutter clearance requires runout control of the core and front relief to the running journal (owner-accepted gear class)"
    - id: "RV-03"
      kind: "accept"
      where: "front view, D-core collar seat Ø.1910 +.0000/-.0008, linked SEE NOTE 2 (SLIDING FIT ON TRANSGEAR DRIVE COLLAR MHA-PD-22: SLIDES IN, NO ROCK)"
      finding: "band narrower than the turned-diameter row, or -.0008 a converted-millimetre deviation (rules 4, 26)"
      reason: "fleet-shared shaft h fit class kept, restated at the next re-key of that family; the matched sliding fit to MHA-PD-22 is printed at the callout. Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
    - id: "RV-04"
      kind: "accept"
      where: "front view, gear tip Ø.3533 +.0000/-.0008, linked SEE GEAR DATA (MATES WITH: REDUCER DISC MHA-PD-06; SPAN MATCHED FIT: BACKLASH WITH MATE .002-.007, FEELER)"
      finding: "band narrower than the turned-diameter row, or -.0008 a converted-millimetre deviation (rules 4, 26)"
      reason: "fleet-shared contact-critical gear-tip class kept, restated at the next re-key of that family; the mesh route is the gear data backlash acceptance at the callout. Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
    - id: "RV-05"
      kind: "accept"
      where: "front end view, D-flat .0840 +.0000/-.0006 from the axis, linked SEE NOTE 2 (SLIDING FIT ON TRANSGEAR DRIVE COLLAR MHA-PD-22: SLIDES IN, NO ROCK)"
      finding: "band narrower than the milled row, or -.0006 a converted-millimetre deviation (rules 4, 26)"
      reason: "loosening it re-sets the MHA-PD-22 D-bore flat clearance (.0008-.0020) its own sheet and tests carry, so the band is kept with the matched sliding fit printed at the callout (L3). Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144"
    - id: "RV-06"
      kind: "accept"
      where: "detail B, front neck Ø.155/.150 LIMITS CLEARS MHA-PD-22"
      finding: "neck relief limits over-specified; print at the title-block row or as a single MAX (rule 5)"
      reason: "owner ruling, machinist review r8: the .155 maximum keeps the neck's crown out of the MHA-PD-22 torqued core-flat plane (the title-block .157 fails that air) and the .150 minimum keeps the section that carries the drive torque, so neither the row nor a single MAX holds both"
