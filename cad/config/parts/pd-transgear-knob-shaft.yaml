pd-transgear-knob-shaft:
  title: Transgear Knob Shaft
  number: MHA-PD-08
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  fit_class: shaft_in_bushing
  # Selected stock cutter: TTC 10-289-487, 48DP PA20 #7 (14–16T); in stock 2026-10-27.
  # https://www.travers.com/product/ttc-10-289-487-involute-style-gear-cutter-10-289-487
  # Same body as the #8 10-289-488. StockForm uses the lower-count 14T master;
  # rigid template translation is not x.
  # Verified cutter body OD 44.45 mm and arbor bore 22.225 mm; grind depth/form
  # accuracy are unpublished. Main's 2.25-module depth is a model premise,
  # provisional for physical admission, not published vendor ground geometry.
  # Pedro's owner ruling, 2026-11-05 (coordinator session): single-point, not die-cut.
  process: "turned from bar, including the front neck and limited corner radius; the front D-core turned to slide by hand, with no shake, in the drilled bore of the finished MHA-PD-22 drive collar; integral 15T 48DP PA20 teeth cut straight at full depth through the face with stock #7 form cutter (14T master), with radial setting, tooth-span and all-space angular-index acceptance from the part specification; mill the front D-core flat last, to its specified physical rounded-tool-end limits, coming down .001 at a time until the MHA-PD-22 collar with its MHA-PD-VN-70 pin pressed slides on by hand; #8-32 UNC-2A thread single-pointed on the lathe before the teeth are cut, the tip carried on a tailstock centre in sacrificial length parted off after threading, finished with spring passes; rear end chamfered .015 X 45 deg, drilled #50 and tapped #2-56 blind on the axis with a bottoming tap in the rear chucking, for the MHA-PD-VN-71 cup screw"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the tooth-space radial runout callout to the actual running bore"
      finding: "runout callout over-specified (rule 5)"
      reason: "tooth-space radial runout to the actual running bore is the owner gear-tooth critical class (owner-accepted)"
    - id: "RV-02"
      kind: "accept"
      where: "the core and front-relief runout frames to the running journal"
      finding: "runout frames over-specified (rule 5)"
      reason: "finite stock-cutter clearance requires runout control of the core and front relief to the running journal (owner-accepted gear class)"
    - id: "RV-04"
      kind: "accept"
      where: "front view, gear tip Ø.3533 +.0000/-.0015, linked SEE GEAR DATA (MATES WITH: REDUCER DISC MHA-PD-06; SPAN MATCHED FIT: RUNS ON MATE WITH NO TIGHT SPOT)"
      finding: "band narrower than the turned-diameter row (rule 4)"
      reason: "Owner ruling 2026-11-24, audit part 2 question C3, in his words: \"Yes, O.D. +0/-.0015.\" and \"Print +0/-.0015 as ruled; the gate is read at three places (1.100 passes).\" A smaller tip shortens the reducer's path of contact: 1.284 at the nominal centre against 1.2, and 1.0997 (read 1.100) at the runout extreme at the set band's top against his 1.1 (paper_drive_mesh_check). The mesh route is the gear data's trial with the mate at the callout (owner ruling 2026-11-24, audit part 2 question C2: the feeler backlash row is deleted). It retires the delegated ruling of 2026-11-07 (Main) that kept the -.0008 fleet class"
    - id: "RV-06"
      kind: "accept"
      where: "detail B, front neck Ø.155/.150 LIMITS, linked SEE NOTE 4 (NECK AND D-FLAT END UNDER DRIVE COLLAR MHA-PD-22.)"
      finding: "neck relief limits over-specified; print at the title-block row or as a single MAX (rule 5)"
      reason: "owner ruling, machinist review r8: the .155 maximum keeps the neck's crown out of the MHA-PD-22 torqued core-flat plane (the title-block .157 fails that air) and the .150 minimum keeps the section that carries the drive torque, so neither the row nor a single MAX holds both"
