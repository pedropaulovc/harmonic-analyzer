ch-rocker-arm-tl-vn-oblique-leadscrew-kit:
  title: Rocker Oblique Trammel Leadscrew Kit
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-VN-nn (subsystem-identities.md).
  # Owner ruling 2026-11-04 (#2187): the ReliaBot screw and its brass nut are one
  # native model with the LeadScrew and FeedNut members as configurations. It
  # replaces TL-VN-54 (screw) and the unreleased TL-VN-82 (nut).
  number: MHA-CH-06-TL-VN-84
  stock_name: ReliaBot T8 Tr8x2 lead screw, 600 mm, with brass flange nut
  supplier: Amazon (sold by ReliaBot)
  supplier_skus: ["B085DDHJTW"]
  # The default LeadScrew member's SOLIDWORKS library material. The FeedNut
  # member carries Brass in its own configuration (its member spec).
  material: AISI 304
  # Kit-level wording, printed in every sheet's title block; the members'
  # materials are SUS304 stainless steel and brass, alloy not stated.
  material_specification: "SUS304 screw; brass nut"
  finish: as supplied
  # Installed members, not purchased kits: one screw and one nut per listing.
  quantity: 2
  default_configuration: LeadScrew
  configuration_quantities:
    LeadScrew: 1
    FeedNut: 1
  tolerance_class: visual_noncritical
  process: purchased
  drawing_unit: mm
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet 3, Section F-F, the 4X Ø4.76/4.50 82° CSK callout: MIN WALL 0.40 TO BODY, 0.45 TO OD"
      finding: "countersink rims at the worst case the package allows (each hole ±0.05 off its station on the Ø16 PCD, the countersink 0.02 off its hole, the mouth at its Ø4.76 band maximum, the body at its Ø10.3 receipt maximum, the flange at its Ø21.8 receipt minimum) leave 0.40 mm to the body and 0.45 mm to the flange OD, below the 1.5 mm metric wall floor"
      reason: "owner ruling pending — see #2187 owner-decision comment https://github.com/pedropaulovc/harmonic-analyzer/pull/2187#issuecomment-6647986159 (option A, keep the countersinks, is carried in the branch until the owner answers). The supplied Ø3.5 holes on the Ø16 PCD already leave 1.15 mm to the body and 1.25 mm to the OD nominal, 1.00 mm and 1.05 mm at the receipt limits, so no countersink on this bought nut meets the floor. The lip carries no load: each #4-40 flat head (91771A112) takes 37 N at the 1.19 N·m reversing torque, ×29.8 in shear."
