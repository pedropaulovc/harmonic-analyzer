dt-cone-gear-tl-phasing-comb:
  title: Cone Tip Gear Phasing Comb
  # Shop tooling: the parent MHA-DT-03 Number plus -TL-nn (subsystem-identities.md).
  # Owner ruling 2026-11-09 (b1) via PR #1992
  # (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): one flat
  # comb that phases T030 (keyed) and the bonded T024, T018, T012 and T006
  # together while LOCTITE 638 grabs (MHA-DT-00 step 1); owner ruling
  # 2026-11-10 via PR #1992: a single blade per gear, dropped in one tooth
  # space of it; owner ruling 2026-11-13: cut to shape from a single sheet of
  # brass or other metal. Never in the drive-train BOM.
  number: MHA-DT-03-TL-02
  material: C26000 BRASS, HALF-HARD
  material_specification: C26000 half-hard brass shim stock, .020 in +/-.002 in, ASTM B36
  finish: as cut
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "cut the stepped outline from .020 in sheet; deburr"
