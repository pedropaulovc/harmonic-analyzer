dt-cone-gear-tl-phasing-comb:
  title: Cone Tip Gear Phasing Comb
  # Shop tooling: the parent MHA-DT-03 Number plus -TL-nn (subsystem-identities.md).
  # Owner ruling 2026-11-09 (b1) via PR #1992
  # (https://github.com/pedropaulovc/harmonic-analyzer/pull/1992): one
  # comb that phases T030 (keyed) and the bonded T024, T018, T012 and T006
  # together while LOCTITE 638 grabs (MHA-DT-00 step 1); owner ruling
  # 2026-11-10 via PR #1992: a single blade per gear, dropped in one tooth
  # space of it; owner ruling 2026-11-13: cut to shape from a single sheet of
  # brass or other metal; owner, 2026-11-14 (#2734): the cone stands up and
  # the comb is a flat U clipped over its tip. Never in the drive-train BOM.
  # Stock: .020 1095 blue-tempered spring steel (McMaster-Carr 9014K143, 6 x
  # 12 in sheet, $22.72, read 2026-11-14), pending owner confirmation (default
  # taken on a timeout, #2734). Brass is a drop-in: material
  # "C26000 BRASS, HALF-HARD" and material_specification "C26000 half-hard
  # brass shim stock, .020 in +/-.002 in, ASTM B36" (McMaster-Carr 9011K111);
  # the spec proves the spring arm on brass and picks the model's material
  # from this row.
  number: MHA-DT-03-TL-02
  material: 1095 SPRING STEEL, BLUE-TEMPERED
  material_specification: 1095 blue-tempered spring steel shim stock, .020 in +/-.001 in, ASTM A684, SAE AMS5122
  finish: as cut
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "cut the U outline from .020 in sheet; deburr"
