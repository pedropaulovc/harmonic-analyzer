pd-transgear-drive-collar:
  title: Transgear Drive Collar
  number: MHA-PD-22
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): turn the body and pilot from blanks with the specified facing allowance; drill the bore #11 (.191) through (the MHA-PD-08 knob shaft's D-core is turned to slide in it); ream the two .0930 drive-pin holes through at their .2756 targets (the MHA-PD-VN-54 dowel is the gauge: it does not enter by hand); ream the .0615 blind flat-pin hole from the rear to its floor (the MHA-PD-VN-70 dowel is the gauge) and press the MHA-PD-VN-70 pin to the floor; at assembly all three MHA-PD-09 wheels are tried on the pressed drive pins; face the rear to fit directly on the knob gear front F, facing the pin flush with it, then break the rear bore mouth .008 X 45° through the pin's crest with it (collar and pin are one permanent pair); face the pilot to the specified sprocket proudness at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet note 1: DRIVE-PIN HOLE TO COLLAR RIM .019 MIN."
      finding: "wall from each drive-pin hole to the Ø.689 +.000/-.004 collar OD below the .060 floor (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: shared #25 sprocket-seat geometry; accepted as a permanent minor exception (revisit in #2141)"
    - id: "RV-03"
      kind: "minor"
      where: "sheet note 2: PERMANENT PIN MHA-PD-VN-70: HOLE TO DRIVE-PIN HOLE .076 MIN."
      finding: "web from the Ø.0615 flat-pin ream (.118 ±.002 from the bore axis) to the -Y Ø.0930 drive-pin ream at the worst centres and largest holes below the .080 target, above the .060 floor (rules 17, 20)"
      reason: "Delegated ruling 2026-11-11 (Main), #2409; precedent band .060-.080: owner ruling 2026-11-08 #2144 item 3.2 / RV-02 on MHA-PD-17. The flat pin's centre is set by its crest, which the knob shaft's #8-32 stud must pass and the D-flat is milled to, and the drive-pin circle by the shared #25 sprocket seat, so neither can move to widen the web"
    - id: "RV-04"
      kind: "accept"
      where: "the MHA-PD-VN-70 pin's crest on the MHA-PD-08 D-core's flat (sheet: Ø.0615 ream .118 ±.002 from the bore axis; MHA-PD-08 core flat)"
      finding: "rotational lost motion between collar and knob shaft: the MHA-PD-08 flat is milled last until this collar with its pin slides on by hand, which leaves the crest up to .002 clear of the flat, and the round bore floats on the core, so the collar turns up to ±11° on the shaft before the crest drives (rule 21: a drive with play)"
      reason: "Delegated ruling 2026-11-11 (Main), no precedent; owner review #2144; #2409; figures restated for the fitted flat (fit audit 2026-11-23, pending owner confirmation; with the flat's former printed band they were ±17°, 34°, 3.4° and 0.29 mm). The play is stated, not hidden: reversing the knob takes up to 21° of free travel, 2.1° at the feed sleeve through the 15:150 transgear, 0.18 mm of paper travel on the feed pinion's pitch circle. The paper feeds one way while the crank turns, so the lash is taken up once and stays loaded"
