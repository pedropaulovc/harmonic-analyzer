pd-transgear-drive-collar:
  title: Transgear Drive Collar
  number: MHA-PD-22
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): turn the body and pilot from blanks with the specified facing allowance; drill the bore #11 (.191) through (the MHA-PD-08 knob shaft's D-core is turned to slide in it); ream the two .0930 drive-pin holes through at their .276 targets (the MHA-PD-VN-54 dowel is the gauge: it does not enter by hand); ream the .0615 blind flat-pin hole from the rear to its floor (the MHA-PD-VN-70 dowel is the gauge) and press the MHA-PD-VN-70 pin to the floor; at assembly all three MHA-PD-09 wheels are tried on the pressed drive pins; face the rear to fit directly on the knob gear front F, facing the pin flush with it, then break the rear bore mouth .008 X 45° through the pin's crest with it (collar and pin are one permanent pair); face the pilot to the specified sprocket proudness at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet note 1: DRIVE-PIN HOLE TO COLLAR RIM .018 MIN."
      finding: "wall from each drive-pin hole to the Ø.689 +.000/-.004 collar OD below the .060 floor (rules 17, 20)"
      reason: "Owner ruling 2026-11-01 on this same wall: shared #25 sprocket-seat geometry, accepted at .019 MIN as a permanent minor exception (revisit in #2141). Owner ruling 2026-11-24, fit audit question 8 (the rulings record: approved as recommended, ticked by him): the drive-pin offsets became .2756 targets, accepted by trying the three MHA-PD-09 wheels on. The .019 charged each centre ±.0009, a band the sheet no longer prints; the trial bounds the two pins' spacing only, so the wall is now charged the shop's reamed-hole location row, ±.002: .0181 at the smallest O.D., the centre .002 outward, the hole .0935 (pd_transgear_drive_collar_spec.DRIVE_PIN_COLLAR_RIM_WORST). The geometry is unchanged. The value .018 is NOT ruled: it is an open owner question (sketch Q-PD-pin-walls-under-trial.png): keep .018, or print a location band again to hold .019"
    - id: "RV-03"
      kind: "minor"
      where: "sheet note 2: PERMANENT PIN MHA-PD-VN-70: HOLE TO DRIVE-PIN HOLE .075 MIN."
      finding: "web from the Ø.0615 flat-pin ream (.118 ±.002 from the bore axis) to the -Y Ø.0930 drive-pin ream at the worst centres and largest holes below the .080 target, above the .060 floor (rules 17, 20)"
      reason: "The drive-pin centre is now charged the shop's reamed-hole location row ±.002 instead of the ±.0009 the sheet no longer prints (owner ruling 2026-11-24, fit audit question 8, the rulings record: approved as recommended, ticked by him: offsets REF, accepted by trial), so the web's printed MIN moves from .076 to .075 (pd_transgear_drive_collar_spec.FLAT_PIN_WEB_WORST, asserted over WALL_FLOOR). A web between the .060 floor and the .080 target is advisory (rule 20), and it has no geometry escape: the flat pin's centre is set by its crest, which the knob shaft's #8-32 stud must pass and the D-flat is milled to, and the drive-pin circle by the shared #25 sprocket seat, so neither can move to widen the web (#2409)"
    - id: "RV-04"
      kind: "accept"
      where: "the MHA-PD-VN-70 pin's crest on the MHA-PD-08 D-core's flat (sheet: Ø.0615 ream .118 ±.002 from the bore axis; MHA-PD-08 core flat)"
      finding: "rotational lost motion between collar and knob shaft: the MHA-PD-08 flat is milled last until this collar with its pin slides on by hand, which leaves the crest up to .002 clear of the flat, and the round bore floats on the core, so the collar turns up to ±11° on the shaft before the crest drives (rule 21: a drive with play)"
      reason: "The play is stated, not hidden: reversing the knob takes up to 21° of free travel, 2.1° at the feed sleeve through the 15:150 transgear, 0.18 mm of paper travel on the feed pinion's pitch circle (pd_transgear_drive_collar_spec.FLAT_PIN_PLAY_DEG and KNOB_REVERSAL_PLAY_DEG; the collar tests derive the paper travel). The paper feeds one way while the crank turns, so the lash is taken up once and stays loaded: under rule 4 a joint its load keeps against one side of its clearance takes the play out, so no tighter fit is needed. The flat is made to fit, milled last until this collar with its pin slides on by hand (rule 4, form 2), which gives less play than the ±17° (34°, 3.4°, 0.29 mm) the flat's former printed band gave (#2409); the spec asserts the fitted play never exceeds that"
    - id: "RV-05"
      kind: "accept"
      where: "sheet 1, end view: Ø.0930 2X REAM THRU, SEE NOTE 3 / PRESS FIT, DOWEL MHA-PD-VN-54"
      finding: "the reamer's size Ø.0930 is .00075 under 3/32, off rule 4 form 3's grid of a 64th size or .001 over or under it (over-specification: a special reamer)"
      reason: "NOT ruled: an open owner question (keep the .0930 stock reamer here, or move this pair of holes to the grid's .0928). Fit audit question 8, which the owner approved on 2026-11-24 (the rulings record: approved as recommended, ticked by him), changed how the drive pins are accepted and kept this hole as it was; it did not ask about the reamer's size. The facts: no reamer is bought for this sheet alone, since the .0930 chucking reamer is a catalogue stock size (McMaster-Carr 8803A197, shop record reamer-0930) that the build already buys for the same MHA-PD-VN-54 dowel's press in the MHA-DT-11 crank spigot. The hole is the shared #25 sprocket seat's drive-pin hole (_sprocket_seat_geometry.DRIVE_PIN_HOLE_DIA), one size on the crank and on this collar so the MHA-PD-09 wheels meet the same pins on either; the grid's .0928 here would add a second reamer for one sheet and deepen the press beside the .018 rim. The sheet prints no band on it and the dowel is the gauge (note 3), as form 3 requires"
