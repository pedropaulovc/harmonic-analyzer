pd-transgear-drive-collar:
  title: Transgear Drive Collar
  number: MHA-PD-22
  material: Brass
  material_specification: C36000 free-machining brass
  finish: bright machined, oiled
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from bar (brass): turn the body and pilot from blanks with the specified facing allowance; drill undersize and finish the true D-bore, retaining its separately limited flat; ream the two drive-pin holes through; face the rear to fit directly on the knob gear front F, finish the final rear D-bore entry at 45 degrees with the specified equal-leg limits, and face the pilot to the specified sprocket proudness at assembly"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet note 1: DRIVE-PIN HOLE TO COLLAR RIM .019 MIN."
      finding: "wall from each drive-pin hole to the Ø.689 +.000/-.004 collar OD below the .060 floor (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: shared #25 sprocket-seat geometry; accepted as a permanent minor exception (revisit in #2141)"
    - id: "RV-02"
      kind: "accept"
      where: "the two Ø.0930 dowel reams' .2756 ±.0009 locations from the D-bore axis"
      finding: "reamed-hole location band tighter than the ±.002 reamed-hole row, a converted-mm value, with no fit route (rules 3, 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out F4). The band is the shared #25 sprocket seat's (_sprocket_seat_geometry.DRIVE_PIN_OFFSET_TOL), set by the dowel slip budget: the 3/32 dowels pressed here enter MHA-PD-09's holes with .0039 diametral slip, and the pin and hole location bands spend .0036 of it, so neither can loosen; a cross-part transfer route was not taken now because it re-keys MHA-DT-11, MHA-PD-09 and both assemblies"
