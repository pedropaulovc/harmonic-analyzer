ch-rocker-arm-tl-oblique-riser:
  title: Rocker Oblique Trammel Riser
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-24
  # Acetal machines clean and spares the cutter where the jig cuts its own
  # band in place (SolidWorks material POM Acetal Copolymer).
  material: ACETAL (DELRIN)
  material_specification: 1/4 in acetal (Delrin) stock; supplier and stock width/length unselected
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "start from 1/4 in acetal stock; face to 6.0 drawing thickness and mill the blank to 40 x 340; spot the holes from the carrier at assembly, drill #4 clearance through and countersink 82 degrees for the four screws; drill the HUB, CL and CR clearance holes through; break edges"
