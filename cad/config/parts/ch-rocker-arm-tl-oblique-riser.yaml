ch-rocker-arm-tl-oblique-riser:
  title: Rocker Oblique Trammel Riser
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-24
  # The wider self-cut band keeps the strap cutter 2.38125 mm off the riser.
  material: 6061 aluminium
  material_specification: 6061 aluminium
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "start from 1/4 x 1-3/4 in 6061 bar; face to .24 and mill to 1.62 x 13.80; locate seven holes through the carrier and transfer the eighth from the left blind tap at assembly; drill #4 clearance through and countersink 82 degrees for four screws; drill .600 HUB, CL, CR and added left-clamp clearances through; self-cut the band with the 9/16 cutter before fitting the steel hub sleeve and loading the strap; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X Ø.257 CL and CR clearance-hole callout: WALL .074 MIN TO CUT EDGE"
      finding: "wall from the CL/CR holes to the jig's self-cut band edge .074 in at the printed worst case (drill at its band's top, the TL-21 CL/CR stations' title-block error about the cut's centre), under the .080 in target and over the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions (this package: .074 at the printed worst case, relayed by Main as the jig riser .075; also ruling 6); CL/CR stay on the strap's hub radius and the riser cutter and band stay as they are. ch_rocker_arm_tl_oblique_riser_spec.CLAMP_BAND_WALLS counts the carrier station error and refuses anything under the .060 floor; the sheet states the worst-case wall floored to three places, never as note text"
  drawing_unit: in
