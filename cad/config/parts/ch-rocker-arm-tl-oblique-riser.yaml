ch-rocker-arm-tl-oblique-riser:
  title: Rocker Oblique Trammel Riser
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-24
  # The wider self-cut band keeps the strap cutter 2.38125 mm off the riser.
  material: 6061 aluminium
  material_specification: 6061 aluminium
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "start from 1/4 x 1-3/4 in 6061 bar; face to .24 and mill to 1.62 x 13.80; locate seven holes through the carrier and transfer the eighth from the left blind tap at assembly; drill #4 clearance through and countersink 82 degrees for four screws; drill .600 HUB, CL, CR and added left-clamp clearances through; self-cut the band with the 9/16 cutter before fitting the steel hub sleeve and loading the strap; break edges"
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "the 2X Ø.257 CL and CR clearance-hole callout: WALL .071 MIN TO CUT EDGE"
      finding: "wall from CL/CR to the self-cut outer band edge .071 in minimum at the printed worst case; CR governs at 1.810703955 mm (.071287557 in), under the .080 in target and over the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-01 accepted this package's .074 minimum. Extended to .071 MIN by owner Option B ruling 2026-11-06 (coordinator-applied): the carrier's .XXX ±.005 baseline coordinates and local A2/B2 Y .964 ±.002 control require the correlated pin/cut-circle and rounding stack. Retain the 9/16 self-cut route and all nominal hole positions; no geometry or threshold change. ch_rocker_arm_tl_oblique_riser_spec.CLAMP_BAND_WALLS refuses a wall below .060 and the native callout prints the calculated minimum floored to three places."
  drawing_unit: in
