dt-crank-pinion:
  number: MHA-DT-10
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: LOW-CARBON STEEL, E.G. 1018 CF
  finish: oiled
  quantity: 1
  tolerance_class: machined_block
  fit_class: gear_mesh
  drawing_unit: in
  process: "gear cutting: 16T normal-24DP PA20 straight-spur milling with the finite 14T stock form, cutter #7 (14-16T)"
  # Face, shoulder and north band follow the current dt_crank_pinion_spec.
  # SDP/SI S1086Z-024S016 is a pitch/count candidate, not a cutter-native drop-in.
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "sheet 1, section A-A, crankshaft bore callout Ø.3135 REAM THRU / SEE NOTE 2"
      finding: "the bore's mate MHA-DT-11 is turned to it (rule 4 form 2), so a reamer the shop keeps (5/16) is asked instead of the .3135 over size"
      reason: "delegated ruling 2026-11-24 (Main), precedent: owner ruling 2026-11-20, #3073; owner review #2144 (D19). The bore slides on MHA-DT-11's seat, turned to it (.0010-.0023; shake there is 64T mesh run-out, N-01), then cross-pinned by MHA-DT-29; .3135 is 5/16 + .001, rule 4's standard over size, reamed with the owned adjustable set: no tool bought. Accepts this bore's .3135 only, with no band."
