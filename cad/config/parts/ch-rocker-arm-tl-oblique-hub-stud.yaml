  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  # Replaces the bonded TL-VN-80 gauge pin (retired 2026-11-06).
  number: MHA-CH-06-TL-33
  material: 1018 cold-finished steel
  material_specification: 1018 cold-finished steel
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "turn from 3/4 in 1018 round: face the flange end, turn the .71 x .12 flange, the slip-fit shank and the .4000 locating nose with the shank root at R.008 MAX; supply .82 MIN above the flange seat; at assembly face the nose to .080 +/-.008 above the actual MHA-CH-06-TL-24 riser, then drill and tap #10-24 to the printed depths from the faced nose; break edges"
  drawing_unit: in
