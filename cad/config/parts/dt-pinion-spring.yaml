dt-pinion-spring:
  title: Pinion Return Leaf Spring
  number: MHA-DT-24
  material: 17-7 PH Cond C, .015 in
  material_specification: 17-7 PH stainless (UNS S17700) strip, Condition C, ASTM A693; 0.015 in +/-0.00075 in, sheared 1/4 in wide from McMaster-Carr 2325K19
  finish: degreased after forming; bare stainless, no coating
  quantity: 1
  tolerance_class: machined_block
  process: "formed strip blank (17-7 PH stainless, Condition C)"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "sheet 1, top view, PadLen .15 from the pad hole axis: HOLE WEB .076 MIN"
      finding: "hole-to-pad-relief web .076 in minimum, below the .080 in target but above the .060 in floor (rule 17)"
      reason: "owner approval via coordinator Main, 2026-10-19, PR #1675 option (1), carried to the #290 inch sheet: dt_pinion_spring_geometry.PAD_WING_FROM_HOLE is the longest wing on PadLen's .XX grid whose R.010 MAX relief still clears the bend at FootLen's low limit (+/-.020 formed band), with FootLen/FreeKinkH/PadLen baselined on the hole axis. PAD_HOLE_WEB_MIN floors the physical worst case to .076, never up. No mating interface moves, and the foot screw's head still bears well inside the wing. The sheet states the shortfall through dt_pinion_spring_spec.PAD_LEN_CALLOUT; no tighter band is allowed."
    - id: "RV-02"
      kind: "accept"
      where: "the pad's #4 clearance hole's native Hole Wizard callout only: its hw-diam callout variable's decimal places, written as 3 at drawing time from dt_pinion_spring_spec.HOLE_CALLOUT_PRECISION by draw_dt_pinion_spring.build (ICalloutLengthVariable.Precision)"
      finding: "a drawing script writes a Hole Wizard callout's diameter places at render time instead of importing part-authored places (drawing-simplicity-policy.md model ownership, rules 3 and 4)"
      reason: "Delegated ruling 2026-11-02 (Main), following owner precedent: drawing-side ICalloutLengthVariable precision is the established merged pattern (22 call sites on main, e.g. draw_ch_rocker_arm_tl_oblique_base_bar.py:876). Native experiment run 20261102T230110877Z: part-authored HW diameter precision 4 did not reach the callout (read -1). Owner review #2144. This accepts no other precision, band, callout or package departure."
