ch-rocker-arm-tl-trammel-scriber-block:
  title: Rocker Template Trammel Scriber Block
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-15
  # The block needs only a flat, free-machining low-carbon bar: any grade
  # serves (SolidWorks material Plain Carbon Steel); the shop stock is the
  # 1018 cold-rolled flat bar below.
  material: LOW-CARBON STEEL FLAT
  material_specification: 1018 cold-rolled flat bar, 3/4 x 1-1/2 in, ASTM A108
  finish: as machined, edges broken
  quantity: 1
  tolerance_class: machined_block
  process: "saw to length; mill the bar slot; drill and ream both point holes in one setting; saw the slit; drill and tap the set screws and the pinch screws, then drill the pinch clearances; break edges"
