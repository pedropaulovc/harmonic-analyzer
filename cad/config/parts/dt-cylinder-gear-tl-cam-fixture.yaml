dt-cylinder-gear-tl-cam-fixture:
  title: Cylinder Gear Cam Turning Fixture
  # Shop tooling: the parent MHA-DT-12 Number plus -TL-nn (subsystem-identities.md).
  # Issue #2361: the lathe fixture on which the integral eccentric cam of each of
  # the 20 MHA-DT-12 cylinder gears is turned after its bore, teeth and notch.
  # Never in the drive-train BOM.
  number: MHA-DT-12-TL-01
  material: LOW-CARBON STEEL, E.G. 1018 CF
  material_specification: low-carbon cold-finished steel round, 3-1/2 in, ASTM A108 (1018)
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turn the register and both faces in one chucking; locate, drill and ream the stub and clock-pin holes on the mill DRO from the register axis; break edges"
