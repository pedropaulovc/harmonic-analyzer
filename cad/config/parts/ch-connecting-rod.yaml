ch-connecting-rod:
  number: MHA-CH-03
  material: Plain Carbon Steel
  material_specification: AISI 1018 low-carbon steel plate
  finish: BLACK ENAMEL; MASK BORE, PLATE FACES, PIN HOLE AND FORK SLOT; OIL BARE MACHINED SURFACES
  quantity: 20
  tolerance_class: machined_block
  fit_class: cam_follower_contact
  process: "machined from 1018 steel plate"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "minor"
      where: "DETAIL C, the near tine .067 ±.002 (2X), its callout naming the TINE WALL"
      finding: "fork tine wall .065 at its printed lower limit, below the .080 in target (rules 17, 20)"
      reason: "each gap between neighbouring 2.5 mm rocker arms at the 7.0565 channel pitch holds one tine of each adjacent rod, so the tine is pitch-bound; .065 (1.651 mm) MIN at the worst printed limits stays above the .060 floor; the same wall the owner accepted as 1.65 MIN under the metric 1.5 floor (owner-ruled shortfall)"
    - id: "RV-03"
      kind: "accept"
      where: "front view, boxed .16 BASIC from datum A (the bore axis) to datum B (the shank's left flank)"
      finding: "basic A-to-B tie without a geometric control or acceptance tolerance on datum feature B (rules 5, 10)"
      reason: "owner ruling 2026-10-24 (#1980): the basic tie is the frame's origin across the shank; B's offset is bounded in practice by the .32 width and the title block, so no further control is added (RV-01 stands) (owner-accepted)"
