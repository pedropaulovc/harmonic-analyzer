ch-connecting-rod:
  number: MHA-CH-03
  material: Plain Carbon Steel
  material_specification: AISI 1018 CF flat, 1/4 x 2 REF
  finish: BLACK ENAMEL; MASK BORE, RING AND SHANK FACES, PIN HOLE, FORK SLOT; OIL BARE SURFACES
  quantity: 20
  tolerance_class: machined_block
  fit_class: cam_follower_contact
  # #2340: the ring and shank need no flatness control of their own. The
  # ring's near face from the fork's datum face and its thickness, both
  # +/-.002 (the thickness's MMC envelope bounds the plate's bow), are what the
  # flat rod's cam-to-arm window spends (test_channel_axial_budget), the ring
  # floats about .045 a side in its .179 MIN cam slot, and neighbouring
  # shanks stand .21 apart. The route keeps the bought bar (#2173) and cuts
  # the plate so it stays flat: equal stock off both faces, a release before
  # the finish passes, and hand setting (no furnace for stress relief).
  process: "machined from the bought 1/4 x 2 in 1018 cold-finish flat (OnlineMetals 7469, #2173): the fork faces skimmed to .240, about .005 off each face; the ring and shank come off both faces equally, about .082 each, cut as a pocket inside the blank's uncut edges, which carry the part on its second side: rough the two faces in turns to .020 over, release the part and reseat it, then take the finish passes on both faces; cut the outline free last and bore, slot and ream after it. A rod whose ring face or thickness leaves its band once free is set straight by hand on the surface plate and rechecked, or exchanged"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "minor"
      where: "DETAIL C, the near tine .067 ±.002 (2X), its callout naming the TINE WALL"
      finding: "fork tine wall .065 at its printed lower limit, below the .080 in target (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. each gap between neighbouring .098 rocker arms at the .300 channel pitch holds one tine of each adjacent rod, so the tine is pitch-bound: the opposed-fork budget leaves .039 (0.99) against the .014 (0.35) floor, so each tine could grow at most .0126 to .0776 MIN, still under the .080 target, and the re-pitch keeps the tines as printed (owner ruling 2026-11-11); .065 MIN at the worst printed limits stays above the .060 floor"
    - id: "RV-03"
      kind: "accept"
      where: "front view, boxed .16 BASIC from datum A (the bore axis) to datum B (the shank's left flank)"
      finding: "basic A-to-B tie without a geometric control or acceptance tolerance on datum feature B (rules 5, 10)"
      reason: "owner ruling 2026-10-24 (#1980): the basic tie is the frame's origin across the shank; B's offset is bounded in practice by the .32 width and the title block, so no further control is added (RV-01 stands) (owner-accepted)"
    - id: "RV-04"
      kind: "accept"
      where: "front view, the Ø.0770 +.0009/+.0005 REAM THRU pin hole, PRESS FIT ON MHA-SH-VN-58, with note 1's matched press fit"
      finding: "the +.0009 upper deviation is not a plain inch step: it reads as a converted millimetre value (rule 4)"
      reason: "Delegated ruling 2026-11-07 (Main), no precedent; owner review #2144 (fan-out Q1, pending owner confirmation; F5 applied by analogy). The limits .0775-.0779 are the ones the pin budget holds against the 5/64 dowel pin MHA-SH-VN-58 (ANSI FN2, .00085 MAX interference; owner press-fit ruling 2026-10-09, #1292 F1): a .0775 reamer cuts inside them. Restating them as Ø.0775 +.0004/.0000 moves the model's nominal and re-keys the channel assembly for print text alone, and no plain step on .0770 holds both the least interference and the FN2 cap. The hole is reamed to the measured pin (note 1). Accepts the printed step only, no other band or fit departure."
