ch-connecting-rod:
  number: MHA-CH-03
  material: Plain Carbon Steel
  material_specification: AISI 1018 CF flat, 1/4 x 2 REF
  # Owner ruling 2026-11-20 (#2348): "Black oxide and oil", like the channel
  # lever; the enamel masked both broad faces and was filed at the pins.
  # Delegated ruling 2026-11-21 (Main), owner review #2144: no MIL spec on the
  # finish; the owner ruled cold blackening (Presto Black PC9) acceptable as the
  # drawing's black oxide.
  finish: matte black oxide, oil sealed
  quantity: 20
  tolerance_class: machined_block
  fit_class: cam_follower_contact
  # #2340: the ring and shank need no flatness control of their own. The
  # ring's near face from the fork's datum face and its thickness, both
  # +/-.002 (the thickness's MMC envelope bounds the ring's bow), set how far
  # the fork can stand off the ring (test_channel_axial_budget). #3114: the
  # ring is the original's .170 and slides in its .179 MIN cam slot with .007
  # MIN to spare, so the slot locates the rod and the floating arm follows the
  # fork; the shank is .13 (the original's about .138 at two places), its
  # near face .05 from the fork's datum face, inside both ring faces at the
  # title block's .XX, and neighbouring shanks stand .17 apart. The route
  # keeps the bought bar (#2173) and cuts ring and shank so they stay flat:
  # near-equal stock off both faces, a release before the finish passes, and
  # hand setting (no furnace for stress relief).
  process: "machined from the bought 1/4 x 2 in 1018 cold-finish flat (OnlineMetals 7469, #2173): the fork faces skimmed to .240, about .005 off each face; the ring comes off both faces equally, about .040 each, and the shank about .055 off the datum-face side and .065 off the other, cut as a stepped pocket inside the blank's uncut edges, which carry the part on its second side: rough the two faces in turns to .020 over, release the part and reseat it, then take the finish passes on both faces; cut the outline free last and bore, slot and ream after it. A rod whose ring face or thickness leaves its band once free is set straight by hand on the surface plate and rechecked, or exchanged"
  drawing_unit: in
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "minor"
      where: "DETAIL C, the near tine .067 ±.002 (2X), its callout naming the TINE WALL"
      finding: "fork tine wall .065 at its printed lower limit, below the .080 in target (rules 17, 20)"
      reason: "Owner ruling 2026-11-01: thin walls above the .060 floor but under the .080 target, with no geometry escape, are accepted as package-specific minor exceptions. each gap between neighbouring .098 rocker arms holds one tine of each adjacent rod, and the arms float on the pivot shaft (owner ruling 2026-11-18, #3114), so two neighbours can close hub on hub at their .276 MIN hubs: the opposed-fork budget then leaves .015 (0.381) against the .014 (0.35) floor, so the tine cannot grow, and the tines stay as printed (owner ruling 2026-11-11); .065 MIN at the worst printed limits stays above the .060 floor"
    - id: "RV-03"
      kind: "accept"
      where: "front view, boxed .16 BASIC from datum A (the bore axis) to datum B (the shank's left flank)"
      finding: "basic A-to-B tie without a geometric control or acceptance tolerance on datum feature B (rules 5, 10)"
      reason: "owner ruling 2026-10-24 (#1980): the basic tie is the frame's origin across the shank; B's offset is bounded in practice by the .32 width and the title block, so no further control is added (RV-01 stands) (owner-accepted)"
