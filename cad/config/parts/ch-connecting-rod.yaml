ch-connecting-rod:
  number: MHA-CH-03
  material: Plain Carbon Steel
  material_specification: AISI 1018 low-carbon steel plate
  finish: BLACK ENAMEL; MASK BORE, PLATE FACES, PIN HOLE AND FORK SLOT; OIL BARE MACHINED SURFACES
  quantity: 20
  tolerance_class: machined_block
  fit_class: cam_follower_contact
  process: "machined from 1018 steel plate"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "the one position control carried on this sheet"
      finding: "position frame over-specified on a channel part (rule 5)"
      reason: "a coordinate plus/minus would let the 20 channels scatter; at most one control per channel part (owner-accepted channel-consistency class)"
    - id: "RV-02"
      kind: "minor"
      where: "sheet note 1, TINE WALL 1.65 MIN"
      finding: "fork tine wall below the 2.0 mm target (rules 17, 20)"
      reason: "each gap between neighbouring 2.5 rocker arms at the 7.0565 channel pitch holds one tine of each adjacent rod, so the tine is pitch-bound; 1.65 MIN at the worst printed limits stays above the 1.5 floor (owner-ruled shortfall)"
    - id: "RV-03"
      kind: "accept"
      where: "front view, boxed 4.00 BASIC from datum A (the bore axis) to datum B (the shank's left flank)"
      finding: "basic A-to-B tie without a geometric control or acceptance tolerance on datum feature B (rules 5, 10)"
      reason: "owner ruling 2026-10-24 (#1980): the basic tie is the frame's origin across the shank; B's offset is bounded in practice by the 8.00 width and the title block, so no further control is added (RV-01 stands) (owner-accepted)"
