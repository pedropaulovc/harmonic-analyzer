ch-rocker-arm-tl-oblique-end-bracket:
  title: Rocker Oblique Trammel End Bracket
  # Shop fixture: the parent MHA-CH-06 Number plus -TL-nn (subsystem-identities.md).
  number: MHA-CH-06-TL-28
  # The bracket only holds two #8-32 tapped holes for SHCS and
  # keeps its stock width and height: no grade or temper is functional, so
  # the title block names the aluminium flat-bar family (rule 2; machinist
  # review ENFORCE); the owned OnlineMetals 1165 6061-T6511 bar is the source.
  material: ALUMINUM FLAT BAR 1/2 x 1 in
  material_specification: Aluminum flat bar (e.g. 6061-T6 or 6082-T6; owned OnlineMetals 1165 6061-T6511), 1/2 x 1 in on edge; 1/2 along screw, 1 high, as supplied
  finish: as machined
  quantity: 2
  tolerance_class: machined_block
  # Owner ruling 2026-11-05: the CAD follows the 2026-11-02 hand traveler (issue
  # #2154): a hand tap cannot thread the 1 in height, so each tap drill runs
  # through. Owner ruling Main 2026-11-06 (option B): two holes on the KP08's
  # 42 mm pitch, each tapped #8-32 from both faces, the bar screw up from the
  # bottom and the KP08 screw down from the top, their tips apart in the
  # shared hole. Each thread has a printed window (.491 ±.005 from the bottom,
  # .436 ±.005 from the top) and each tap point a depth it must not pass
  # (end bracket spec BAR_TAP_TIP_MAX .558, KP08_TAP_TIP_MAX .503): the
  # bottoming tap finishes each thread; the plug tap only starts it.
  process: "saw and face to length; drill the two #8-32 tap holes #29 through; mark both 8-32 hand taps (plug and bottoming) at .558 and at .503 from the point; from the bottom face, start each hole with the plug tap and finish with the bottoming tap to full thread .491 ±.005 deep, neither tap past its .558 mark; from the top face, the same to full thread .436 ±.005 deep, neither tap past its .503 mark; break edges"
  # KP08 axial width 13 is the uxcell listing's (55 x 13 x 28, read 2026-11-04); nominal overhang is 0.15 each side.
  # Reallocate bought 1165 leftover after TL-26; 1164 half-by-three-quarter is spare.
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "front view: the two 8-32 KP08 block-hole stations 13.925 ±.13 mm and 55.925 ±.13 mm"
      finding: "metric vendor-mating hole stations print in millimetres on an inch sheet, beside inch stations from the same left end"
      reason: "owner ruling 2026-11-01 (ruling 4B), relayed by Main: the KP08 pillow block, HGR15R rail and Tr8 nut are metric-only vendor lines, so the stations that mate with their holes keep the vendor's exact millimetres, printed in mm with the unit label and an explicit mm band (drawing-simplicity-policy.md, supplier-unit exception), not rounded inch conversions"
  drawing_unit: in
