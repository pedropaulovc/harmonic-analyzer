mg-output-fixture:
  number: MHA-MG-06
  material: C36000 free-cutting brass
  material_specification: C36000 free-cutting brass
  finish: as-machined
  quantity: 1
  tolerance_class: machined_block
  drawing_unit: in
  process: "turned from 7/16 hex bar (brass): face the free end, turn the spigot and its full-radius wire groove, width 2R, walls to the Ø.33 root; hold on flats and centre-drill the 120-degree corner ridge before drilling the F (Ø.257) rod bore through the corners on the hex axis; tap #4-40 from the spigot face into the bore"
  machinist_exceptions:
    - id: "RV-01"
      kind: "accept"
      where: "side view, under the view: the bore's stations .23 (free end to the Ø.257 bore axis) and .49 (bore axis to the spigot face) on one row, the overall (.72) REF outermost."
      finding: "overall length is a reference only; the free end is located by a length chained from the cross-hole, not by a real overall (rule 10, dimension from a real feature; rule 11, turned parts read like the lathe)"
      reason: "owner ruling 2026-10-17 (review r4), restated for the inch sheet (#290) and for the 1/4 rod's Ø.257 bore and the .49 face station (owner rulings 2026-11-20 on #2404 and #2403): the rule 17 .080 wall forbids a real overall at the title block's bands. With .72 and .49 both at .XX ±.01, the free end's station stacks to ±.02, and the free-end wall to the Ø.257 bore (drilled +.004/0, radius up to .1305; drill run-off .0053 at the exit corner) falls to .0742, under the .080 target. Chained, the .23 at its own ±.01 holds .0842. The bore is the part's datum (the rod and the thumb screw's reach both work off it), so both stations run from it."
