ch-rocker-arm-tl-oblique-feed-block:
  title: Rocker Oblique Trammel Feed Block
  number: MHA-CH-06-TL-32
  # No grade or temper is functional: the title block names the aluminium
  # flat-bar family (rule 2; machinist review), as TL-28 does.
  material: ALUMINUM FLAT BAR 1 x 3-1/2 in
  material_specification: Aluminum flat bar (e.g. 6061-T6), new 1 x 3-1/2 in stock, machined to .96 high
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "Centred 1.64 x 1.58 x .96 rail-1 block with integral nut lug, 3.47 overall across. Lug starts .87 from the block's spindle end and runs flush to the block's far end: one continuous +X face, no step. The feed nut seats on that +X face, body away from spindle. Drill the leadscrew clearance to print; transfer the four taps through the MHA-CH-06-TL-VN-84 FeedNut at TL-00 assembly. Keep carriage counterbore floors .570 above the bottom; pivot seat bored .3760-.3765 with a flat floor, .359 deep from top, with a 5/16-18 tapped through hole below."
  machinist_exceptions:
    - id: "RV-02"
      kind: "minor"
      where: "VIEW D: the KP08 leadscrew axis 12.400 ±.13 mm"
      finding: "a metric vendor-mating station prints in millimetres on an inch sheet, beside inch dimensions"
      reason: "owner ruling 2026-11-01 (ruling 4B), relayed by Main: the KP08 pillow block is a metric-only vendor line, so the leadscrew axis height that mates with it keeps the vendor's exact millimetres, printed in mm with the unit label and an explicit mm band (drawing-simplicity-policy.md, supplier-unit exception), not a rounded inch conversion"
    - id: "RV-03"
      kind: "minor"
      where: "Section B-B, the .570 counterbore floor callout: ENGAGES .162 MIN (1.03D)"
      finding: "M4 carriage screw full-thread engagement .162 min (4.12 mm, 1.03D): the tip reaches .183 and its 0.75P chamfer is not full thread; under rule 18's 1.5D, stated as a plain fact"
      reason: "The HGH15CA-style carriage's M4 holes are 5 mm deep (the HIWIN reference geometry, checked on the kit carriage at receipt), so no M4 reaches 1.5D (6.0 mm). Owner ruling 2026-11-01, option A (the jig's RV-05): the counterbore floor drops .614 to .570 and each screw is cut to fit its own floor at assembly (rule 19), so the reach carries only the ±.005 cut and the .001 reading: .183 of tip reach, 1.03D of full thread once the 0.75P tip chamfer is deducted Owner exception confirmed 2026-11-01 (relayed by Main) at 1.16D. Owner ruling 2026-11-08 (Pedro), #2144 item 1.4: the recount charges the 0.75P tip chamfer, .162 MIN (1.03D), same geometry, shop-fixture load."
    - id: "RV-04"
      kind: "minor"
      where: "VIEW D, the Ø.351 leadscrew clearance callout: WALL .060 MIN TO TAPS"
      finding: "wall from the leadscrew clearance to the four transferred #4-40 taps .060 in (1.53 mm) at the printed worst case with rule 17's drill wander charged (0.3° over the .770 THRU taps, 0.10 mm; the clearance bored at its ±.002 Y and ±.05 mm Z station and at its .XXX ±.005 size, the leadscrew at its .358 mm stack offset, the nut's holes at their ±0.05 station and the #29 spot's 0.073 residual, every tap anywhere in VIEW D's 4X 45° ±5° clocking), under the .080 in target and over the .060 in floor (rule 17)"
      reason: "Owner ruling 2026-11-04 (#2177 option B, relayed by Main): Ø.351 leadscrew clearance, wall .060 in (1.53 mm) at the printed worst case, .083 nominal, accepted below the .080 target and above the .060 floor; Owner ruling 2026-11-08 (Pedro), A2 option (i): the taps stay THRU ALL and only the clearance is located ±.002 (bored at its station), which holds the floor with the drill wander charged; the KP08 axis height behind the stack is UNVERIFIED (#2184)."
  drawing_unit: in
