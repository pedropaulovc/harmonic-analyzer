ch-rocker-arm-tl-oblique-feed-block:
  title: Rocker Oblique Trammel Feed Block
  number: MHA-CH-06-TL-32
  material: 6061-T6 aluminium
  material_specification: 6061-T6 aluminum flat bar, new 1 x 3-1/2 in stock, machined to .96 high
  finish: as machined
  quantity: 1
  tolerance_class: machined_block
  process: "Integral rail-1 nut lug; drill all four nut taps to print, not match-drilled. Keep carriage counterbore floors .570 above the bottom; pivot seat reamed .3760-.3765, .359 deep from top with a 5/16-18 tapped through hole below."
  machinist_exceptions:
    - id: "RV-01"
      kind: "minor"
      where: "VIEW D, the spigot recess callout's row WALL .036 MIN TO 4-40 TAPS"
      finding: "wall from the four #4-40 nut-flange taps to the spigot recess under the .060 in floor and the .080 in target (rules 17, 20)"
      reason: "0.937 mm (.036) at the printed worst case: the bought Tr8 nut's Ø16 PCD puts each #4-40 major beside the Ø.42 recess that clears its Ø10.2 spigot, the recess at its .XX upper limit and each tap off its exact-mm station by the 0.13 band in Y and Z; with #4-40 on that circle no recess that still clears the spigot reaches the floor. The #2-56 redesign (ruling of 2026-11-01, option C) was withdrawn because a #2 button head cannot bear on the nut's Ø3.5 flange holes without washers. Owner exception pending confirmation (main had .035)."
    - id: "RV-02"
      kind: "minor"
      where: "VIEW D: the KP08 leadscrew axis 12.400 ±.13 mm and the Tr8 nut-flange tap stations 5.657 ±.13 mm"
      finding: "metric vendor-mating stations print in millimetres on an inch sheet, beside inch dimensions"
      reason: "owner ruling 2026-11-01 (ruling 4B), relayed by Main: the KP08 pillow block, HGR15R rail and Tr8 nut are metric-only vendor lines, so the stations that mate with their holes keep the vendor's exact millimetres, printed in mm with the unit label and an explicit mm band (drawing-simplicity-policy.md, supplier-unit exception), not rounded inch conversions"
    - id: "RV-03"
      kind: "minor"
      where: "Section B-B, the .570 counterbore floor callout: ENGAGES .183 MIN (1.16D)"
      finding: "M4 carriage screw engagement .183 min (4.65 mm, 1.16D), under rule 18's 1.5D, stated as a plain fact"
      reason: "The bought HGH15CA carriage's vendor M4 holes are 5 mm deep, so no M4 reaches 1.5D (6.0 mm). Owner ruling 2026-11-01, option A (the jig's RV-05): the counterbore floor drops .614 to .570 and each screw is cut to fit its own floor at assembly (rule 19), so the reach carries only the ±.005 cut and the .001 reading, 1.16D minimum. Owner exception confirmed 2026-11-01 (relayed by Main)."
  drawing_unit: in
