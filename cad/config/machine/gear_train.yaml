
gear_train:
  diametral_pitch: 48.0            # standard inch cone/cylinder train
  pressure_angle_deg: 20.0
  fundamental_cone_teeth: 120      # largest cone gear; per-channel = 120 - 6*index
  cylinder_teeth: 120              # equal-size cylinder gears
  cylinder_lock_phase_deg: 1.5     # drive-train locks every cylinder gear at Rz(+1.5), half its 3-deg pitch, to mesh
                                   # tooth-in-gap with the phase-0 cones -- so at crank home every cam LOBE (a tooth
                                   # crest) sits 1.5 deg off vertical: a common cam phase the error budget scores as-built
  drive_axis_y_mm: 90.518          # cylinder-gear shaft (drum) axis height: base top 50.8 + swing plate 6.35 + v2 journal
                                   # 33.368 (build_drive_train_assembly derives it and asserts against this; channels read it)
  crank_drive_ratio: [16, 64]      # 16T pinion on crankshaft : 64T on cone shaft
  crank_drive_normal_module_mm: 1.0583333333333333 # standard normal 24DP; transverse pitch and helix follow the cone incline
  crank_drive_pressure_angle_deg: 20.0            # standard normal-plane cutter pressure angle
  crank_drive_backlash_mm: 0.15                   # transverse 64T tooth thinning at pitch radius
  crank_axis_height_mm: 76.46364350289599          # physical 24DP pair centre with 0.30 mm slack; from cone journal datum
  source: "DIMENSIONS.md ch13 (cylinder gear OD scaling), ch29/ch8 (gear law)"
  confidence: low
  notes: >-
    Tooth counts counted directly on the book plates (high). DP is now ANCHORED
    on the measured cylinder-gear OD = 62.2 mm (DIMENSIONS.md ch13, scaled p.25
    bottom-left vs the back-view gear brackets, LOW confidence): m = 62.2/(120+2)
    = 0.50984 mm, DP = 25.4/m = 49.82, pitch dia = 120*m = 61.18 mm. This
    SUPERSEDES the former DP 30 round-inch derivation (which gave OD 103.3) — see
    the ch12/ch13 discrepancy notes. Cone T120 shares this module (it meshes the
    cylinder set). Gear law (ch.29 p.99, annotated): cylinder gear k turns k/80
    rev per crank turn; ch.8 p.7 (stated): gear n spins n× gear 1. Crank reduction
    16:64 = 1:4 sets the cone-shaft input speed. The crank-pair module is now
    subordinate to the manually rederived v2 post: its cast-in crank-axis
    location fixes DP 24.74 at the checked 0.25 mm engaged centre-distance
    slack; equal 64T/cone-T120 pitch radii are no longer assumed.
