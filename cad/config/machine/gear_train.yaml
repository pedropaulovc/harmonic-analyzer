
gear_train:
  diametral_pitch: 48.0            # standard inch cone/cylinder train
  pressure_angle_deg: 20.0
  fundamental_cone_teeth: 120      # largest cone gear; per-channel = 120 - 6*index
  cylinder_teeth: 120              # equal-size cylinder gears
  cylinder_lock_phase_deg: 1.5     # drive-train locks every cylinder gear at Rz(+1.5), half its 3-deg pitch, to mesh
                                   # tooth-in-gap with the phase-0 cones -- so at crank home every cam LOBE (a tooth
                                   # crest) sits 1.5 deg off vertical: a common cam phase the error budget scores as-built
  drive_axis_y_mm: 95.25          # base top + platform stock + common cone-axis height
  crank_drive_ratio: [16, 64]      # 16T pinion on crankshaft : 64T on cone shaft
  crank_drive_normal_module_mm: 1.0583333333333333 # standard normal 24DP; transverse pitch and tooth inclination follow the cone incline
  crank_drive_pressure_angle_deg: 20.0            # standard normal-plane cutter pressure angle
  crank_axis_height_mm: 81.1276                     # 38.1 cone axis + 1.694 in (43.0276), the post's printed CrankAboveCone; crank_mesh c2c_slack_mm closes the 16T/64T centre on it
  crank_mesh_phase_offset_deg: 0.0               # offset from the standard tooth-in-gap seed at the contact azimuth
  source: "48DP PA20 cone train and normal-24DP PA20 crossed-crank design; DIMENSIONS.md ch13/ch29/ch8 for historical counts and gear law"
  confidence: high                 # selected tooth systems; historical scale measurements remain low confidence
  notes: >-
    Cone, cylinder and alignment teeth use the 48DP PA20 tooth system.
    Shop-made profiles use the actual specified finite stock/custom cutter
    authority; blank OD and plunge are selected against its finite support,
    with no ideal upper-flank continuation. Cylinder uses the 55T stock form
    and alignment the 26T. The 120T pitch diameter is 63.5 mm; 64.558333 mm
    was its earlier ideal-profile tip, not a cutter-native certificate.
    Cone counts are retained on the .300 in (7.62 mm) channel grid.
    The crossed crank uses normal 24DP PA20, actual 14T form for its straight
    16T pinion and actual 55T normal form for the 64T, whose teeth are
    straight, inclined right hand at the cone incline (12.024699 degrees)
    and plain-indexed with no lead gearing (owner ruling 2026-11-10, #2332).
    The 64T's transverse pitch is therefore 23.473389DP (pitch diameter
    69.252888 mm). Actual tip, floor and phase belong to the current finite
    stock-form spec and mesh readers.
    The physical pair centre is 43.391205 mm, the two pitch radii plus the
    crank_mesh running extension; the cone journal is 38.1 mm above the
    unrelieved swing platform and the post crank axis is 81.1276 mm above
    it, 1.694 in above the journal as the post prints it. Post body height
    is 94.742 mm.
    Cutter #7 is the 14T stock form for the spur; cutter #2 is the actual
    55T normal stock form for the 64T. The 68.405 virtual tooth count
    (64 / cos^3 of the incline) only selects that cutter number; it is not
    permission to use an ideal virtual flank.
    Gear law (ch.29 p.99, annotated): cylinder gear k turns k/80 rev per
    crank turn; ch.8 p.7 (stated): gear n spins n times gear 1.
    Crank reduction 16:64 = 1:4 sets the cone-shaft input speed.
