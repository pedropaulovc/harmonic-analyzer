
build_lock:
  # Per-assembly build mode: how the operational DOF are handled in the saved model.
  #
  #   free   = leave the predetermined operational DOF UNLOCKED (default). The saved
  #            model is a working kinematic model -- e.g. the crank spins and the whole
  #            geared train turns with it. The freed-DOF "park driver" mates are NOT
  #            authored at all (skipping the mate solve saves build time); each is
  #            RECORDED to a .<stem>.park.json sidecar and re-authored transiently by
  #            the release preflight, which proves the closure then discards unsaved.
  #   locked = author + engage the park drivers: every operational DOF is pinned, the
  #            model is fully defined (0 DOF), the saved pose is a hard, reproducible
  #            snapshot. An explicit opt-in for a pinned export/snapshot.
  #
  # Read by the per-assembly build script as `_config.machine("build_lock", "<stem>")`
  # with a STRING-LITERAL stem, so it tokenises to machine/build_lock.yaml in the doit
  # file_dep + remote-cache digest (see _buildgraph._family_tokens): flipping a value
  # rebuilds ONLY the assembly that reads it, and keys the cache correctly free vs locked.
  drive_train: free
  channel: free
  magnifier: free
  source: "design decision 2026-06 (default-free kinematic model + opt-in lock)"
  confidence: high
  notes: >-
    drive-train frees the crank spin (1 DOF). channel frees, per active channel, the
    rocker swing + connecting-rod follow + amplitude-bar slide (3 DOF/channel), so the
    saved model is a working kinematic channel bank. magnifier frees the lever's
    knife-edge rock + the articulated hub-wire's swing/spin (3 DOF, 2026-07-04): the
    lever pivots about the summing bar's knife-edge ridge (video 2/4+4/4, ~6 mm tip
    arc), the clamp/vertical-rod/fixture group swings with it, the wire ball-joints
    at the hook + rides the hub at the 0.25 stand-off tangency, and the WIRE-1 yoke
    mate turns the magnifying wheel (coupled, not separately freed). In a free build these freed-DOF
    drivers are DEFERRED (recorded to a park-spec sidecar, not authored); a locked build
    authors them engaged. Other assemblies do not read build_lock and stay fully defined.
    The verify DOF gate adapts: free -> necessity only (>= N under-constrained); the
    exact-count closure runs in the opt-in release preflight (assert_park_closure);
    locked / unread -> strict 0-DOF. See AGENTS.md "Default-free DOF".
