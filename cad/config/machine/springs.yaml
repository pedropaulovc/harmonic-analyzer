# Fixed native placements; preserve full floating-point round-trip precision.
# Distance guards bound measurement uncertainty, never placement clearance.
# boolean_stability_mm seats each contact that far past the native Boolean's
# collision/clear boundary. That boundary is not the physical contact: the Boolean
# fails while ClosestDistance still reads ~2.4e-5 mm and the gate reads the failure
# as interference. Where it starts succeeding scatters ~6e-7 mm between a fixture
# and the mated assembly and ~2.3e-6 mm between rebuilds of the same swept spring,
# so 6e-6 mm clears the measured scatter ~2.6x over.
# 2026-10-16 (#1189): both counter records moved +3.836 mm in Y with the
# MHA-SM-VN-50 anchor, which now stands its jam-nut thread above the boss. The
# whole counter stack (anchor, spring, gooseneck, screw) translates rigidly,
# so every measured contact is unchanged; the summing assembly's native
# contact gates re-certify both seats.
# 2026-11-01 (#290 FR plane snap): the knife and fulcrum chains translate
# rigidly by -0.0068 mm in Y with the MHA-FR-02 underside (999.7 -> 999.6932,
# top_frame_plane), so every channel and counter record's eye, centre and
# gooseneck heights moved by exactly that; lengths, axes and measured contact
# distances are unchanged, and the native contact gates re-certify every seat.
# channels.yaml must exactly match a preset vector below. Custom stations require
# new native calibration; builds never interpolate or search for a replacement.
