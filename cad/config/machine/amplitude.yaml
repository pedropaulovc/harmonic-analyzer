
amplitude:                         # ch15 — the amplitude bars set the Fourier coefficients
  preset: neutral                  # all amplitude bars at rest (a_j = 0) — matches the neutral-state photos
  fundamental_station_mm: 80.0     # a_1 bar station; a_j = this / harmonic_n (odd j), 0 (even j)
  max_travel_mm: 88.0              # ±88 mm amplitude-bar seesaw range (ch.15)
  stick_division_spacing_mm: 14.2   # measuring-stick engraved scale: pitch of the 11 full ticks the
                                   # operator reads bar stations against (ch16 page001_img02: the 0 and 10
                                   # numerals sit 805 px = 142 mm apart at 5.65 px/mm, half the rocker's
                                   # 292 mm working arc -- the old 80 mm misread the 8 mm width callout)
  stick_division_count: 11         # full ticks, values 0..10 (the stated 0-10 scale)
  stick_minor_per_division: 10     # tenths: 9 short ticks between full ticks (page001_img03)
  source: "DIMENSIONS.md ch15; truth_model.py"
  confidence: med
  notes: >-
    The amplitude bar station along the rocker IS the Fourier coefficient a_j.
    The `neutral` preset parks every bar at rest (a_j = 0), so channels.yaml
    amplitude_mm is all zeros and every channel return spring sits at the same
    rest length — one shared spring geometry across all 20 channels (the
    reference photos show the machine in this neutral state). The `square`
    preset (a_j = fundamental_station_mm / harmonic_n on the ODD harmonics, 0
    on the even ones — the textbook square-wave partial sum, odd terms ∝ 1/n) is
    the alternative. truth_model.py reads the same amplitude_mm vector, so the
    computed pen curve always matches the as-built bar stations; verify.py --suite
    config asserts channels.yaml obeys whichever preset is set here.
