
channels:
  count: 20                        # full channel table size (channels.yaml rows)
  active_count: 20                 # all 20 channels active (full state)
  station_pitch_mm: 7.62           # PITCH — z-spacing between channel stations; .300 in (owner ruling 2026-11-11, #1038)
  station_z0_mm: -69.08391221957346 # bank-centred recenter: z_station(j) = station_z0 + station_pitch*j (= _cone_axis_constants.CHANNEL_Z0)
  rocker_pivot_xy_mm: [72.9, 253.8]   # rocker pivot shaft axis (x, y); machine frame (crank at -X)
  lever_fulcrum_xy_mm: [199.9, 1061.3932] # lever fulcrum shaft axis (x, y): keeper seat 1036.1932
                                       # (top_frame_plane FULCRUM_KEEPER_SEAT_Y) + keeper shaft-axis rise 25.2
  source: "owner ruling 2026-11-11 (#1038): .300 in; dimensions.yaml Appendix C #3"
  confidence: high                 # owner-ruled design value; the original measures 7.5-7.6 mm
  notes: >-
    Station pitch is .300 in (7.62 mm) by owner ruling 2026-11-11 (#1038):
    eleven photo/callout reads of the original give 7.5 to 7.6 mm; the
    former 7.0565 was a doubled cosine error on the book's 7.5 (dimensions.yaml
    Appendix C #3). z0 anchors station 0: station 9 (the lever/rocker hub
    bank mid, Z -0.504) is kept, so station 0 moved 9 x 0.5635 = 5.0715 mm
    to the front (owner ruling 2: bank centred).

    active_count caps the per-channel mechanism the build instantiates — the
    cylinder gear + its cam follower (connecting-rod) in drive-train, and the
    rocker-arm / amplitude-bar / channel-lever (top lever) / return spring in
    channel — to the FIRST active_count channels. At the full count (20) every
    channel is built. The 20 cone gears are always KEPT (the cone stack is derived
    from the full count: build_drive_train_assembly.py reads all 20 rows), as are
    all 20 rows of channels.yaml (gear law, ratios, the synthesis truth model).
    _config.active_count()/active_channels() are the single read points.
