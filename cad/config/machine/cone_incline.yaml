
cone_incline:
  # True-cone incline derived from exact tracking: sin(i) = radius_step / z_pitch.
  # Current 48DP design: radius_step = 3*25.4/48 = 1.5875 mm per 6 teeth.
  # z_pitch = sqrt(drum_seat^2 - radius_step^2) = 7.0565 mm; i = 13.001107 deg.
  # drum_seat_nominal is re-tuned to preserve the channels.station_pitch grid;
  # the cone's along-shaft seat pitch is z_pitch*cos(i), not drum_seat_nominal.
  # Earlier 49.82DP / OD62.2 photo-scale geometry is historical evidence only.
  radius_step_mm: 1.5875
  drum_seat_nominal_mm: 7.232865856629721
  derived_incline_deg: 13.001107353689502
  source: "2026-10-08 selected 48DP PA20 design; M6.7 exact-tracking derivation on the retained 7.0565 mm channel grid"
  confidence: high                 # selected geometry; not a measured historical incline
  notes: >-
    Incline is derived from the selected 48DP train, not measured from a
    photograph: sin(i)=radius_step/z_pitch, with radius_step=1.5875 mm and
    z_pitch=sqrt(drum_seat^2-radius_step^2)=7.0565 mm, giving
    i=13.0011073536895 degrees. The 7.232865856630 mm drum-seat input keeps
    the channel grid fixed; the actual along-shaft cone seat pitch is
    z_pitch*cos(i)=6.875611682 mm and the faced cone width is 6.8756 mm.
    The former 49.82DP radius step 1.5295 mm, 7.2204 mm drum-seat input and
    approximately 12.5188-degree incline belong to the superseded
    photo-scale reconstruction, not the current manufacturing dimensions.
    arcsin(radius_step/drum_seat) is not the exact-tracking incline: it
    mistakes the drum chord for the pitch advance.
