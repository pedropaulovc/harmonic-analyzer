# channel axial budget.)" The bank's
# south datum chain, cylinder_bank_layout DATUM_CHAIN_STACK (DRO locate 0.10
# plus the miked disc 0.013 = 0.113 mm), feeds test_channel_axial_budget.
# Sketch fit-audit-2026-11-23/batch-dt/cone/C9-8R-datum-chain.png. Rows 1
# and 2 are under D28's 0.03 mm line already at today's band; D28 keeps them,
# it does not tighten them.
# N-03 and N-04 gate on a contact ratio, so their margins are the contact
# ratio over the 1.0 floor.
