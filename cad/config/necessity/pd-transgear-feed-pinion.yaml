# Why each REAM and each band under the title block stays on MHA-PD-10
# (owner ruling 2026-11-24: "In the part's registry file, not on the sheet.
# The sheet stays clean; the reviewer fails a tight feature that has no
# registry reason."). Read by the machinist review only. The gear's outside
# diameter and its tooth data keep the gear data block's rules. The boss is
# rule 4, form 2 (its mate is made to it). The bore is form 3: the MHA-PD-23
# pin passes through this bore, MHA-PD-24's and MHA-PD-25's and is turned to
# them, so the three take one reamer; its modelled cut is the owner's ruling
# of 2026-11-24 on fit audit question 5. The collar-to-disc air is one budget
# (delegated ruling 2026-11-25 (Main), D21, #2144): the MHA-PD-17 spigot
# length spends it at the title block and the bores keep it;
# cad/scripts/test_pd_collar_air_necessity.py derives the airs N-01 quotes.
necessity:
  - id: N-01
    feature: "sheet 1, section B-B, Ø.126 REAM THRU bore, MHA-PD-23 IS TURNED TO THIS BORE"
    kind: gap
    reason: "cocked on the pin, MHA-PD-06 closes its air to MHA-PD-22"
    source: "pd_cluster_air.COLLAR_AIR, statistical, floor 0.1016 mm: 0.1366 as modelled; with this bore's clearance on the pin .002 looser the sleeve cocks further and the air is 0.0675, under the floor (test_pd_collar_air_necessity)"
  - id: N-02
    feature: "sheet 1, section B-B, tooth length .535 ±.001 to the step (SEATS MHA-PD-17 SPIGOT)"
    kind: gap
    reason: "keeps hub MHA-PD-17 front face behind the sleeve nose"
    source: "transgear_cluster_fit.RECESS_RANGE: .0000-.0060 at ±.001, .0040 proud at ±.005"
  - id: N-03
    feature: "sheet 1, section B-B, overall length 1.077 ±.001 (DISC CLUSTER STACK)"
    kind: gap
    reason: "term of hub recess and MHA-PD-25 end float stack"
    source: "transgear_cluster_fit.RECESS_CHAIN and SLEEVE_REAR_FORWARD_CHAIN (OL)"
  - id: N-04
    feature: "sheet 1, VIEW E, flat .138 ±.002 from the axis (KEYS PIN MHA-PD-VN-69)"
    kind: gap
    reason: "keeps key pin MHA-PD-VN-69 gap; hub still slides on"
    source: "pd_transgear_disc_hub_spec.KEY_PIN_FLAT_AIR (.0006 least)"
  - id: N-05
    feature: "sheet 1, end view, SPAN 2 TEETH .1523/.1515 (MATCHED FIT, SEE GEAR DATA)"
    kind: mesh
    reason: "cutter setting window the MHA-PD-26 rack mesh is proved over"
    source: "pd_transgear_feed_pinion_spec.SPAN_LIMITS; machinist exception RV-06"
