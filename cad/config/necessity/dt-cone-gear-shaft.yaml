# Why each REAM and each band under the title block stays on MHA-DT-04
# (drawing-guidelines rule 4; owner ruling 2026-11-24: "In the part's
# registry file, not on the sheet. The sheet stays clean; the reviewer fails
# a tight feature that has no registry reason."). Read by the machinist review
# only. The journal and both lands are turned last to their mates and print
# as references with their acceptance (form 2): no entry. Fit batch DT,
# 2026-11-24.
# The keyseat width's entry (N-02, error_budget cone_key_play) is withdrawn:
# cone_key_play books the gears' keyway clearance only, and the one key's
# side play in this keyseat is common to every keyed gear, so it moves only
# the crank index (error_budget.yaml). The width prints (.0625) REF and note
# 1's key trial governs (machinist review r1, farm run 20261124T110807008Z;
# drawing-guidelines rule 4, form 3: the bought key is the gauge, and no
# check books the keyseat's side play). N-03 keeps its id.
necessity:
  - id: N-01
    feature: "sheet 1, tip end view, Ø.0625 REAM .20 socket (SEE NOTE 2)"
    kind: mesh
    reason: "spigot float tilts T012 and T018 off the running axis"
    source: "cone_running_axis (MHA-DT-37 cures off-centre and tilted in the socket); the MHA-DT-37 spigot prints its own band and is bonded in this socket (D51 as amended, 2026-11-26)"
  - id: N-03
    feature: "sheet 1, section A-A, keyseat S .3355 +.0000/-.0040 (NOTE 1)"
    kind: gap
    reason: "keeps the key's top clear of the gears' keyways"
    source: "cone_land_key KEY_TOP_RADIAL_CLEARANCE_FLOOR_MM (.0015) and its key-edge depth"
