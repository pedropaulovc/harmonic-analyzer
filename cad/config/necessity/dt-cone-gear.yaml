# Why each REAM and each band under the title block stays on MHA-DT-03
# (drawing-guidelines rule 4; owner ruling 2026-11-24: "In the part's
# registry file, not on the sheet. The sheet stays clean; the reviewer fails
# a tight feature that has no registry reason."). Read by the machinist review
# only. Every bore prints its reamer's size with no band and its mate
# (MHA-DT-04's land, MHA-DT-37's spigot) is turned to it last (form 2). Gear
# tooth data (tip, tooth thickness, root envelope, runouts, over pins) keep
# the gear data block's rules. Fit batch DT, 2026-11-24.
#
# N-04 (keyway width .0625 +.0020/-.0000, trace, error_budget cone_key_play)
# is withdrawn: the budget closes without the band (cone_key_play at a .010
# key play: scatter MAE .2243 % against .2195 % at .004; it closes at both),
# so no check fails without it. The width prints (.0625) REF, the standard
# 1/16 A broach cuts it and the bought key MHA-DT-VN-71 is the gauge, note 1
# (drawing-guidelines rule 4, form 3; machinist review r1, farm run
# 20261124T110807008Z). N-05 and N-06 keep their ids.
necessity:
  - id: N-01
    feature: "sheets T030-T120, DETAIL A, Ø.3760 REAM THRU keyed bore (SEE NOTE 1)"
    kind: mesh
    reason: "bore spread becomes float and tooth runout on the arbor"
    source: "fit audit 2026-11-23 MHA-DT-03.keyed_bore (SkepticDT claim 2): with a letter V drill (.377-.381) the float spread and TL-03's seat play (fitted to the tightest blank) take T030's cone_set_stack contact ratio to 0.853 RSS (gate 1.0); reamed 1.0546"
  - id: N-02
    feature: "sheet T024, front view, Ø.2510 REAM THRU bore (SEE NOTE 1)"
    kind: mesh
    reason: "teeth must lie within the bond's tap-true reach"
    source: "T024 is tapped true on land 2 while wet (owner ruling 2026-11-21, #3292) only within its .0010-.0038 bond clearance; TL-07's seat is fitted to this bore, so the reamed bore keeps tooth runout to bore inside that reach (fit audit 2026-11-23 MHA-DT-03.T024_bore, judged reamed)"
  - id: N-03
    feature: "sheets T012 and T018, front view, Ø.0625 REAM THRU bore (SEE NOTE 1)"
    kind: mesh
    reason: "tooth-space runout to the bore needs a true bore"
    source: "owner ruling 2026-11-21, #3219 option D: .0015 TIR tooth-space runout to the bore, bore reamed in the OD's chucking"
  - id: N-05
    feature: "sheets T030-T120, DETAIL A, keyway T .4055/.3995 (SEE NOTE 1)"
    kind: gap
    reason: "keeps the key's top clear and T030's web above floor"
    source: "cone_land_key KEY_TOP_RADIAL_CLEARANCE_FLOOR_MM (.0015); T030 keyway web .0631 (exception RV-07)"
  - id: N-06
    feature: "every sheet, face width .2934 ±.002 (20-GEAR STACK ON MHA-DT-04)"
    kind: gap
    reason: "each face steps the next gear's station on the cone"
    source: "dt_cone_gear_stack: the 20-gear stack accepted at +/-0.20 mm books each face's band; land step, tip recess and key margin keep their margins at +/-.002 (#2314, owner loosening pass 2026-11-11)"
