# Why each band under the title block stays on MHA-DT-37 (drawing-guidelines
# rule 4; owner ruling 2026-11-24: "In the part's registry file, not on the
# sheet."). Read by the machinist review only. The spigot and the pivot carry
# no band: each is turned last to slide in its reamed holes and prints as a
# reference with its clearance (form 2, fit audit 2026-11-23 MHA-DT-37.stems).
# Tooth data (tooth thickness, root envelope, runout, over pins) keep the
# gear data block's rules. Fit batch DT, 2026-11-24.
necessity:
  - id: N-01
    feature: "Ø.1696 +.0000/-.0008 blank (tip) diameter"
    kind: mesh
    reason: "larger loses the tip land, smaller loses T006 contact"
    source: "fit audit 2026-11-23 MHA-DT-37.blank_od (keep; recommended A, T006 exception #971 pending): DT6-FORM1's drum-tip relief (dt_mesh_checks.t006_relief_clearance_mm) not re-run at a wider band"
  - id: N-02
    feature: "face width .2934 ±.002 (CONE SEAT PITCH ON MHA-DT-04)"
    kind: gap
    reason: "sets the cone set's last seat station on the shaft"
    source: "owner ruling 2026-11-20 (#2631), exception RV-02: the shared .2934 face; dt_cone_gear_stack books each face's band in the 20-gear stack (fit audit 2026-11-23 MHA-DT-03.face_width, keep)"
  - id: N-03
    feature: "note 1, pivot clearances .0003-.0018 bonded in MHA-DT-38, .0013-.0063 running in MHA-DT-39"
    kind: gap
    reason: "bushing cock and pivot play close the tip air"
    source: "D47, delegated ruling 2026-11-26 (Main), precedent: the owner's question-11 ruling 2026-11-24 (end hole #52 as drilled) and the made-to-fit form of the owner-approved fit policy; owner review #2144; its order amended 2026-11-26 (Main). Order: both holes are made first; the MHA-DT-39 hole is pin-read as h, the largest pin of the .001-step Class ZZ set (gauges.pin-gauges) that enters; the pivot is turned last to slide in the MHA-DT-38 bore (the bond's try-in holds .0003-.0018) and mikes h-.0053 to h-.0013, which puts its running clearance in the hole inside .0013-.0063. A diameter meeting both clearances always exists: for every bore .0625-.0630 and hole .0635-.0675 the window is at least rule 4's narrowest clearance range, .001 (check C-01 of checks/test-dt-cone-tip-gear-drawing.yaml). What fails past them is dt_cone_tip_air C-01, the bushing air to G19 (0.024 mm at both maxima): the bushing cures off its axis and cocked by the bond clearance, and the pivot's running clearance adds its play; LOCTITE 638's own gap (0.25 mm, cone_tip_cluster.RETAINING_COMPOUND_MAX_GAP_MM) is not the limit"
