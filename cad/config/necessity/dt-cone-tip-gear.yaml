# Why each band under the title block stays on MHA-DT-37 (drawing-guidelines
# rule 4; owner ruling 2026-11-24: "In the part's registry file, not on the
# sheet."). Read by the machinist review only. The spigot and the pivot carry
# no band: each is turned last to slide in its reamed holes and prints as a
# reference with its clearance (form 2, fit audit 2026-11-23 MHA-DT-37.stems).
# Tooth data (tooth thickness, root envelope, runout, over pins) keep the
# gear data block's rules. Fit batch DT, 2026-11-24.
necessity:
  - id: N-01
    feature: "Ø.1696 +.0000/-.0008 blank (tip) diameter"
    kind: mesh
    reason: "larger loses the tip land, smaller loses T006 contact"
    source: "fit audit 2026-11-23 MHA-DT-37.blank_od (keep; recommended A, T006 exception #971 pending): DT6-FORM1's drum-tip relief (dt_mesh_checks.t006_relief_clearance_mm) not re-run at a wider band"
  - id: N-02
    feature: "face width .2934 ±.002 (CONE SEAT PITCH ON MHA-DT-04)"
    kind: gap
    reason: "sets the cone set's last seat station on the shaft"
    source: "owner ruling 2026-11-20 (#2631), exception RV-02: the shared .2934 face; dt_cone_gear_stack books each face's band in the 20-gear stack (fit audit 2026-11-23 MHA-DT-03.face_width, keep)"
  - id: N-03
    feature: "spigot (Ø.0625) REF, CLEARANCE .0003-.0018 bonded in MHA-DT-04, MHA-DT-03-T012, MHA-DT-03-T018"
    kind: mesh
    reason: "spigot float runs T006 out on its drum mesh"
    source: "fit audit 2026-11-23 MHA-DT-37.stems (made to fit, rule 4 form 2, under the owner-approved fit policy, PR #3513). Until the bond cures the spigot floats half its largest clearance in MHA-DT-04's socket (cone_running_axis.SPIGOT_FLOAT_MM, 0.0229 mm), which tilts MHA-DT-37 about the pivot: 0.0410 mm stand-off at the socket mouth, 0.315 of it at T006's plane, in T006's 0.0383 mm eccentricity about the running axis (cone_set_stack.cone_eccentricity_mm), summed in cone-set-stack C-01 (NOMINAL_CONTACT_RATIO_MIN). T012 and T018 are read after cure (cone_set_stack.ASSEMBLED_RUNOUT_TIR_MM), so the float does not reach them"
