# Why the REAM and the band under the title block stay on MHA-PD-25 (owner
# ruling 2026-11-24: "In the part's registry file, not on the sheet. The
# sheet stays clean; the reviewer fails a tight feature that has no registry
# reason."). Read by the machinist review only. The bore is rule 4, form 3:
# the MHA-PD-23 pin passes through this bore, MHA-PD-10's and MHA-PD-24's and
# is turned to them, so the three take one reamer; its modelled cut and this
# part's length are the owner's ruling of 2026-11-24 on fit audit question 5.
# The collar-to-disc air is one budget (delegated ruling 2026-11-25 (Main),
# D21, #2144): the MHA-PD-17 spigot length spends it at the title block and
# the bores keep it; cad/scripts/test_pd_collar_air_necessity.py derives the
# airs N-01 quotes.
necessity:
  - id: N-01
    feature: "sheet 1, end view, Ø.126 REAM THRU bore, MHA-PD-23 IS TURNED TO THIS BORE"
    kind: gap
    reason: "cocked on the pin, MHA-PD-06 closes its air to MHA-PD-22"
    source: "pd_cluster_air.COLLAR_AIR, statistical, floor 0.1016 mm: 0.1366 as modelled; with this bore's clearance on the pin .002 looser the bushing and its ring cock further and the air is 0.0953, under the floor (test_pd_collar_air_necessity)"
  - id: N-02
    feature: "sheet 1, side view, length .227 ±.001"
    kind: gap
    reason: "looser, the unshimmed ring gap closes under the float floor"
    source: "transgear_cluster_fit.RING_FLOAT_CHAIN (LFB): at ±.003 the unshimmed ring gap's low end is 0.1778 mm, under END_FLOAT_MIN 0.2032"
