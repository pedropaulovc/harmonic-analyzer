# Necessity register for MHA-PD-00 (drawing-guidelines.md rules 4 and 22):
# the assembly settings banded tighter than their title-block row. Read by
# the machinist review only. Owner ruling 2026-11-24: "In the part's registry
# file, not on the sheet."
necessity:
  - id: N-01
    feature: "sheet 13 DETAIL J and step 3B, rack crests .100 ±.002 below the platen's bottom edge"
    kind: gap
    reason: "keeps the MHA-PD-27 platen-tap top wall over its .060 floor"
    source: "pd_platen_bottom_guide_spec.CREST_SET_BAND in PLATEN_TAP_Y_BAND: the taps are spotted through the platen at this set, so the band moves the tap row; at .624 high the top wall is 1.540 mm over 1.524 (PLATEN_TAP_TOP_WALL_MIN), and at ±.005 it would be 1.464 (or the owner-ruled .219 counterbore moves). The mesh depth is felt at step 24, not set by this band"
  - id: N-02
    feature: "steps 3B and 26P and setting table row 18, rack crests at the two ends WITHIN .001 of each other"
    kind: mesh
    reason: "crest drift takes the feed mesh's contact ratio under one"
    source: "pd_paper_drive_assembly_steps.LEVEL_RACK_CREST_DRIFT, FEED_WORST_CASE_MESH: every loose term stacked, contact ratio 1.028 over the 1.0 floor with the ends level (0.932 with the ±.002 band's .004 of drift); checks/pd-paper-drive-assembly-steps.yaml C-03, C-04; delegated ruling 2026-11-26 (Main), no precedent; owner review #2144 (D48, fit audit part 2, B4)"
  - id: N-04
    feature: "sheet 7 DETAIL K, S to N 1.7242 +.002/-.001"
    kind: mesh
    reason: "sets the reducer mesh's centre distance"
    source: "pd_rack_pinion_spec.CENTRE_DISTANCE_SET_BAND_IN, CENTRE_DISTANCE_TRIAL_BAND_IN; owner ruling 2026-11-08, #2144 item 5.3; owner ruling 2026-11-24, fit audit part 2 C1 (the trial may move the plate within +.002/-.001)"
  - id: N-05
    feature: "setting table row 10 (12N, 13W, 27J), disc shake (THE NEEDLE MOVES), .008 MAX at the tooth in mesh"
    kind: mesh
    reason: "sets the reducer mesh's backlash"
    source: "draw_pd_paper_drive_assembly.REDUCER_SHAKE_MAX_MM; owner ruling 2026-11-24, fit audit part 2 C2 (the .0005 floor retired)"
  - id: N-06
    feature: "setting table row 23 (22F dry, 22Q, 33B), knob end float .006 TO .010"
    kind: gap
    reason: "keeps the knob shaft's end float open"
    source: "pd_transgear_knob_shaft_spec.END_FLOAT, END_FLOAT_SET_TOL; the dry trial 22F before the bond: delegated ruling 2026-11-26 (Main), no precedent; owner review #2144 (D48, fit audit part 2, B6)"
  - id: N-07
    feature: "steps 9C, 9N and setting table row 6, MHA-PD-06 O.D. then tooth spaces .002 TIR MAX on the mandrel"
    kind: mesh
    reason: "disc run-out swings the reducer mesh's backlash once a turn"
    source: "pd_rack_pinion_spec.TOOTH_SPACE_RUNOUT_TIR_MM; exception PD-00-disc-tir-sample covers only the sampling"
  - id: N-08
    feature: "sheet 6 DETAIL E and steps 19C, 33H, ring to front bushing .008 +.006/.000"
    kind: gap
    reason: "sets the sleeve cluster's end float on the shims"
    source: "#2124 (owner ruling 2026-11-01): the ring gap read on a feeler, cluster rearward, and shimmed"
  - id: N-09
    feature: "steps 7A-7D and setting table row 5, lock front face to bar back face .002 TO .009"
    kind: gap
    reason: "bounds the platen's float forward toward the disc"
    source: "pd_platen_guide_spec.LOCK_GAP_FIT (R9-47)"
  - id: N-10
    feature: "step 21A and setting table row 15, collar pilot .002 TO .006 proud of each MHA-PD-09 wheel"
    kind: gap
    reason: "leaves the wheel free under the thumbnut's seat"
    source: "pd_transgear_drive_collar_spec.PILOT_PROUD_RANGE (R9-70)"
  - id: N-11
    feature: "steps 5D, 5E and setting table rows 2-4, MHA-PD-12 hole marks .151 TO .159, .153 TO .161, .705 TO .713"
    kind: gap
    reason: "keeps the lock's hole walls inside their judged band"
    source: "draw_pd_paper_drive_assembly.GUIDE_LOCK_MARK_BAND_MM: the holes' printed .XXX location band less the transfer's own .001 (GUIDE_LOCK_TRANSFER_MM); pd_guide_lock_spec.HOLE_LIGAMENTS_FINISHED judges the hole walls at that printed band (HOLE_PLACEMENT_BAND) and asserts them over WALL_FLOOR_MM (rule 17)"
  - id: N-12
    feature: "step 14B and setting table row 12, MHA-PD-VN-56 tips FLUSH TO .008 proud of the arm front"
    kind: gap
    reason: "a prouder tip closes the latched hanger's sweep clearance"
    source: "transgear_hanger_joints.PLATE_SCREW_CUT_PROUD_MAX; build_pd_paper_drive_assembly lock sweep, plate-screw tip"
  - id: N-13
    feature: "step 16 and setting table row 14, MHA-SH-VN-59 tips dressed FLUSH with the disc rear face, a straightedge lies flat"
    kind: gap
    reason: "a proud tip strikes the platen behind the disc"
    source: "pd_transgear_disc_screw_spec.TIP_BELOW_REAR_FACE (R9-47): flush is the window's .000 end; its .008 end is the unprinted dressing allowance the disc tap's worst engagement charges (ENGAGEMENT_WORST, 1.5D by .001)"
  - id: N-14
    feature: "step 20A and sheet 13 DETAIL F, MHA-PD-VN-54 dowels .091 TO .098 proud of the collar front"
    kind: gap
    reason: "pins drive the wheel's full plate under the thumbnut"
    source: "pd_vn_transgear_knob_drive_pin_spec.PROUD_RANGE, PROUD_SET_TOL; reason read from the spec by the spacer fix agent, for the collar family to confirm"
  - id: N-15
    feature: "step 11Q and setting table row 8, MHA-PD-28 bore REAM Ø.2490 THRU, running fit on the MHA-PD-08 journal"
    kind: mesh
    reason: "journal play opens the reducer mesh's centre distance"
    source: "pd_transgear_knob_bush_geometry.BORE_DIA; the journal is turned to the reamed bore (rule 4 form 2)"
  - id: N-17
    feature: "step 12T and setting table row 11, table moved toward S from DETAIL K's setting (sheet 7) .0006 ALONG AND .0006 ACROSS, DRO"
    kind: mesh
    reason: "a larger move binds the reducer mesh"
    source: "pd_paper_drive_knob_setting_spec.TRIAL_MOVE_TOWARD_MM (_trial_move): whole counts of the installed DRO (.0002 in inch mode, DRO_COUNT_MM), the pair nearest the ruled .001 along S-K whose setting, TRUE's .00078 error charged (TRUE_RADIAL_ERROR_MM), keeps N inside DETAIL K's -.001 and passes the no-bind gate (binds(): the two running fits pressed shut leave backlash; it fails below N -.00079) and every reducer mesh gate at the lowest N (TRIAL_LOWEST_MESH.require(): contact ratio 1.32 over its 1.2 floor, root clearance, interference). .0006 and .0006 are three counts each, .00085 along S-K, N no lower than -.00069. A plain .0005 is not a count the DRO shows (2.5 counts). Owner ruling 2026-11-24, fit audit part 2 C1: \"Yes, the trial may move the plate within those limits.\""
