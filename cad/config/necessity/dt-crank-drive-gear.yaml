# Why each ream and each band tighter than the title block stays on MHA-DT-07
# (drawing-guidelines rule 4; owner ruling 2026-11-24: the reason lives here,
# not on the sheet).  The reamed bore with MHA-DT-04's land turned to it, the
# keyway and the face width as kept are the fit audit's rows for MHA-DT-07
# (2026-11-23, approved as recommended 2026-11-24).
necessity:
  - id: N-01
    feature: "sheet 1, front view, Ø.3760 REAM THRU bore"
    kind: trace
    reason: "bore shake rocks the 64T, a mesh run-out"
    source: "gear_seat_fit.GEAR_SEAT_CLEARANCE (.0010-.0038); the owned .3760 over reamer cuts the land-1 bores alike"
  - id: N-02
    feature: "sheet 1, front view, .0625 +.002/.000 keyway width"
    kind: gap
    reason: "a wider keyway lets the 64T clock on key MHA-DT-VN-71"
    source: "cone_land_key.KEYWAY_WIDTH_BAND; the 1/16 broach shared with the land-1 cone gears"
  - id: N-03
    feature: "sheet 1, front view, .4025 ±.003 keyway T"
    kind: gap
    reason: "a shallower keyway binds on key MHA-DT-VN-71"
    source: "cone_land_key.KEYWAY_T_BAND (ANSI B17.1 T); the broach shared with the land-1 cone gears"
  - id: N-04
    feature: "section A-A, .2617 ±.0010 face width"
    kind: gap
    reason: "its term in the solid cone gear stack on MHA-DT-04"
    source: "gear_face_band.GEAR_FACE_WIDTH_BAND; dt_cone_gear_shaft_spec SEAT_STEP_BUDGET (fit audit: ±.002 not checked by the mesh tests)"
  - id: N-05
    feature: "sheet 1, gear data, base tangent span over 7 teeth .8333 TO .8378"
    kind: mesh
    reason: "sets mesh backlash with crank pinion MHA-DT-10"
    source: "dt_crank_drive_gear_spec.BASE_TANGENT_SPAN_LIMITS_MM; crank_mesh_stack.standard_check"
