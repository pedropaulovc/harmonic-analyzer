# Per-channel harmonic parametrics — SINGLE SOURCE OF TRUTH for the 20 channels.
#
# The build loop (build_channel_assembly.py / build_drive_train_assembly.py)
# reads this file; change a number here and `build_all.py --rebuild channel`
# (or drive_train) regenerates a valid machine. Derived geometry (centre
# distances, cam grids, z-stations) is COMPUTED in code from machine.yaml +
# these tooth counts — it is not duplicated here.
#
# index        0-based channel, matches the z-station build order (j)
# cone_teeth   cone gear k tooth count = 120 - 6*index  (range 120..6)
# cylinder_teeth   always 120 (equal-size cylinder gears)
# harmonic_n   synthesised harmonic = cone_teeth/6 = 20 - index
# ratio        gear-mate ratio [cone_teeth, 120]  (cylinder ang.vel / cone)
# phase_deg    eccentric/cam phase offset for this channel
# amplitude_mm a_j coefficient = amplitude-bar station along the rocker
#              (neutral demo default; override per preset in amplitudes.yaml)
units: mm
source: "DIMENSIONS.md ch8/ch12/ch29 gear law"
confidence: high
notes: >-
  Every per-channel number is DERIVED from one rule, so provenance is file-level
  not per-row: cone_teeth = 120 - 6·index (range 120..6), cylinder_teeth = 120,
  harmonic_n = cone_teeth/6 = 20 - index, ratio = [cone_teeth, 120]. The
  [120-6k : 120] mesh law is annotated in the book (ch.29 p.99) and stated ch.8 —
  high confidence. phase_deg / amplitude_mm are the SETTABLE inputs (the cam
  phase and amplitude-bar station per channel); the zeros here are the neutral
  demo pose, overridden per preset (see truth_model.coefficients).
channels:
  - index: 0
    cone_teeth: 120
    cylinder_teeth: 120
    harmonic_n: 20
    ratio: [120, 120]
    phase_deg: 0.0
    amplitude_mm: 0.0
  - index: 1
    cone_teeth: 114
    cylinder_teeth: 120
