# Fits & clearances — applied UNIFORMLY across channels (see cad/docs/tolerance-policy.md).
#
# Because the output is a force balance, channel-to-channel consistency matters
# more than absolute precision: these are shared named classes, never per-part
# magic numbers. Build scripts assert their analytic clearance margins against
# these values and raise on violation.
units: mm

# Drawing title-block general tolerances live in title_block.yaml (own file, so
# a title-block edit never shifts this file's digest and FULL-rebuilds the
# assemblies whose geometry reads the fit classes below).

general:
  machined_block:    { tolerance: "+/-0.10", applies_to: "milled blocks, brackets, plates" }
  plate_profile:     { tolerance: "+/-0.20", applies_to: "noncritical exterior profiles" }
  visual_noncritical: { tolerance: "+/-0.50", applies_to: "cosmetic/decorative geometry" }

fits:
  shaft_in_bushing:        # crank / rocker / lever pivots — hand-cranked, low-speed slip fit
    diametral_clearance_mm: [0.025, 0.075]
    applies_to: [crank pivots, rocker pivots, lever pivots]

  gear_mesh:               # cone<->cylinder and platen rack-pinion
    backlash_mm: [0.05, 0.20]
    rack_backlash_mm: 0.30           # RACK_BACKLASH (build_paper_drive_assembly.py)
    note: "zero-backlash-in-CAD gears bind in brass"

  cone_drum_oblique_mesh:  # the inclined cone partial engagement
    edge_slack_mm: 0.25              # experimental PA20 common-axis mesh
    note: "oblique partial engagement; checker-arbitrated edge slacks 0.00..1.14"

  crank_mesh:              # 16T:64T crossed mesh (crank machine-z over the inclined 64T)
    c2c_slack_mm: 0.25               # Historical transverse-DP reference, not a backlash target.
    note: "Fixed-centre crossed-helical pair: one normal-DP cutter, 64T true 12.00° helix and 0.15 tooth thinning. User ruling 2026-09-28 requires positive worst-case tight backlash with no backlash window. The 2026-09-28 stack ruling grew the 64T to 7.2113 (north, toward T120) and cut the 16T face to 9.5; diagnostics/crank_mesh_backlash_study.py re-measured that pair over 9 phases and 13 centre-distance/thinning cases: no jam, nominal common seed-offset interval approximately -2.789..-0.215 deg, tightest case (cd -0.15, 64T thinning 0.05) -2.087..-0.884 deg. Every case brackets the assembly seed offset -1.49. crank_mesh_stack takes the conservative historical reference centre distance, while the assembly and exact-solid diagnostic use the physical grown-gear centre."

  cam_follower_contact:
    min_clearance_to_adjacent_channel_mm: 0.50
    contact_gap_mm: 0.02             # BAR_CONTACT_GAP — design margin, not a tangent

  sliding_amplitude_bar_on_rocker:
    side_clearance_mm: [0.05, 0.20]
    note: "bar slides without binding through the full rocker sweep"

  spring_eye_threading:
    min_margin_mm: 0.10              # plate-threading loop margin bound (~0.11 observed)

  fastener_clearance:
    close_mm: 0.10
    normal_mm: 0.25
    # The drilled-hole DRAWING tolerance is a title-block general tolerance, not
    # a fit class -- it lives in title_block.yaml (drilled_hole) with the other
    # $PRPSHEET-stamped tolerances, so a display edit re-stamps parts without a
    # geometry FULL rebuild.
