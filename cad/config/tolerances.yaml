# Fits & clearances — applied UNIFORMLY across channels (see cad/docs/tolerance-policy.md).
#
# Because the output is a force balance, channel-to-channel consistency matters
# more than absolute precision: these are shared named classes, never per-part
# magic numbers. Build scripts assert their analytic clearance margins against
# these values and raise on violation.
units: mm

# Drawing title-block general tolerances live in title_block.yaml (own file, so
# a title-block edit never shifts this file's digest and FULL-rebuilds the
# assemblies whose geometry reads the fit classes below).

general:
  machined_block:    { tolerance: "+/-0.10", applies_to: "milled blocks, brackets, plates" }
  plate_profile:     { tolerance: "+/-0.20", applies_to: "noncritical exterior profiles" }
  visual_noncritical: { tolerance: "+/-0.50", applies_to: "cosmetic/decorative geometry" }

fits:
  shaft_in_bushing:        # crank / rocker / lever pivots — hand-cranked, low-speed slip fit
    diametral_clearance_mm: [0.025, 0.075]
    applies_to: [crank pivots, rocker pivots, lever pivots]

  gear_mesh:               # cone<->cylinder and platen rack-pinion
    backlash_mm: [0.05, 0.20]
    rack_backlash_mm: 0.30           # RACK_BACKLASH (build_paper_drive_assembly.py)
    note: "zero-backlash-in-CAD gears bind in brass"

  gear_tip:                # (upper, lower) diametral deviations, native on the tip OD
    standard_band_mm: [0.0, -0.10]
    contact_critical_band_mm: [0.0, -0.02]
    note: "Functional fit/process tip grades, not AGMA accuracy classes or an ideal-CR allocation. Contact-critical retains the 0.02 mm diametral grade for 32T alignment and 120T cylinder tips. Finite stock support pays both printed tip and retained thickness/depth limits. Alignment is a fit-up mesh: actual supported-union continuity, positive backlash and root air must pass the whole booked centre stack; smooth-flank span is reported, not gated at >1.1. Operating meshes and absolute zero TE have separate source-owned gates. See tolerance-policy.md."

  cone_drum_oblique_mesh:  # the inclined cone partial engagement
    edge_slack_mm: 0.25              # selected 48DP PA20 oblique partial engagement
    centre_opening_mm: 0.20           # total booked opening, including runout/bearing allowance
    note: "oblique partial engagement; checker-arbitrated edge slacks 0.00..1.14"

  crank_mesh:              # 16T:64T crossed mesh (crank machine-z over the inclined 64T)
    c2c_slack_mm: 0.30               # configured extension; actual 3D functional centre selection pending
    gear64_tooth_thickness_deviations_mm: [0.100, -0.050]  # retained (upper, lower) capability; not geometric thinning
    tooth_cutting_runout_tir_mm: 0.05  # per gear: cutting setup about the finished bore, not an AGMA accuracy grade
    note: "Current crossed crank uses normal 24DP PA20, finite 14T stock form for the straight 16T pinion, and finite 55T normal stock form for the right-hand 64T helix. Beta follows the configured cone incline; current post/station and centre derive their source readers. The preceding 43.524321 mm centre with 0.30 mm extension is not a stock-form certificate; functional actual3D station selection remains pending. Selected standard-root translations and actual base-tangent span controls replace the former ideal 0.15-mm geometry-thinning knob. The 64T retains +0.100/-0.050 mm tooth-thickness capability about its actual stock-form nominal; the 16T retains +0/-0.020. The retained tooth-cutting setup TIR is0.05 mm on EACH gear about its finished bore: radial eccentricity E is at most TIR/2 =0.025 mm for each16T and64T, so the pair radial cutting-setup allowance is0.05 mm. This is a process-setting limit, not an AGMA class, cutter-form accuracy claim or new geometric FCF; both gear specs own their actual source read. Actual blank, root envelope, process corners and phase follow the cutter-native spec and qualification readers; no unsupported upper-flank continuation is allowed. Main requires actual3D UNION functional coverage at least0.62 over the whole booked stack including opening, with supported finite corner/edge contact included; flank/flank coverage is diagnostic only. This is non-contact-ratio functional coverage, not an ideal involute CR claim, and signed TE must pay the existing budget. Historical ideal-profile nine-phase results were0.304345..0.310839 mm nominal backlash, seed−1.78 degrees, window−2.794590..−0.758457 degrees, +0.015729 mm worst closing backlash and0.717076 worst-opening normal-section contact ratio against the former0.62 screen. Those are OLD-PROFILE NONCERTIFYING reproduction evidence, not a certificate for the selected stock-form pair. Earlier12.00-degree /7.2113-mm-face /−1.49-degree values describe the still older tooth system."

  cam_follower_contact:
    min_clearance_to_adjacent_channel_mm: 0.50
    contact_gap_mm: 0.02             # BAR_CONTACT_GAP — design margin, not a tangent

  sliding_amplitude_bar_on_rocker:
    side_clearance_mm: [0.05, 0.20]
    note: "bar slides without binding through the full rocker sweep"

  spring_eye_threading:
    min_margin_mm: 0.10              # plate-threading loop margin bound (~0.11 observed)

  fastener_clearance:
    close_mm: 0.10
    normal_mm: 0.25
    # The drilled-hole DRAWING tolerance is a title-block general tolerance, not
    # a fit class -- it lives in title_block.yaml (drilled_hole) with the other
    # $PRPSHEET-stamped tolerances, so a display edit re-stamps parts without a
    # geometry FULL rebuild.
