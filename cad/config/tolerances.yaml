# Fits & clearances — applied UNIFORMLY across channels (see cad/docs/tolerance-policy.md).
#
# Because the output is a force balance, channel-to-channel consistency matters
# more than absolute precision: these are shared named classes, never per-part
# magic numbers. Build scripts assert their analytic clearance margins against
# these values and raise on violation.
units: mm

# Drawing title-block general tolerances live in title_block.yaml (own file, so
# a title-block edit never shifts this file's digest and FULL-rebuilds the
# assemblies whose geometry reads the fit classes below).

general:
  machined_block:    { tolerance: "+/-0.10", applies_to: "milled blocks, brackets, plates" }
  plate_profile:     { tolerance: "+/-0.20", applies_to: "noncritical exterior profiles" }
  visual_noncritical: { tolerance: "+/-0.50", applies_to: "cosmetic/decorative geometry" }

fits:
  shaft_in_bushing:        # crank / rocker / lever pivots — hand-cranked, low-speed slip fit
    diametral_clearance_mm: [0.025, 0.075]
    applies_to: [crank pivots, rocker pivots, lever pivots]

  gear_mesh:               # cone<->cylinder and platen rack-pinion
    backlash_mm: [0.05, 0.20]
    rack_backlash_mm: 0.30           # RACK_BACKLASH (build_paper_drive_assembly.py)
    note: "zero-backlash-in-CAD gears bind in brass"

  gear_tip:                # (upper, lower) diametral deviations, native on the tip OD
    standard_band_mm: [0.0, -0.10]
    contact_critical_band_mm: [0.0, -0.02]
    note: "Functional fit/process tip grades, not AGMA accuracy classes or an ideal-CR allocation. Contact-critical retains the 0.02 mm diametral grade for 32T alignment and 120T cylinder tips. Finite stock support pays both printed tip and retained thickness/depth limits. Alignment is a fit-up mesh: actual supported-union continuity, positive backlash and root air must pass the whole booked centre stack; smooth-flank span is reported, not gated at >1.1. Operating meshes and absolute zero TE have separate source-owned gates. See tolerance-policy.md."

  stock_form_quality:
    toothspace_runout_tir_mm: 0.005
    reducer_position_diameter_mm: 0.050
    shaft_turned_runout_mm: 0.050
    reducer_axis_projected_zone_diameter_mm: 0.010
    arm_opposite_face_parallelism_mm: 0.005
    recording_paper_width_deviation_mm: 0.100
    recording_paper_left_inset_deviation_mm: 0.100
    recording_pen_x_deviation_mm: 0.100
    rack_pitch_index_deviation_mm: 0.010
    rack_flank_constraint_deviation_mm: 0.025
    # Source closing/projection outer gives0.2724567 mm native root air.
    # Keep the0.25 mm floor: this inclusive MAX pays indicator U0.002;
    # reject measured intrusion above0.018. Conditional, not supplier accuracy.
    rack_root_material_intrusion_mm: 0.020
    rack_working_side_angle_deviation_deg: 2.0
    rack_flank_secant_minimum_height_mm: 0.800
    purchased_rack_working_side_form_model_premise: PURCHASED_RACK_32DP_PA20_STRAIGHT_SMOOTH_WORKING_SIDE_FORM
    pinion_pitch_index_deviation_mm: 0.010
    rack_face_lead_deviation_mm: 0.010
    pitch_index_measurement_uncertainty_mm: 0.002
    wire_measurement_uncertainty_mm: 0.005
    feed_loaded_travel_height_deviation_mm: 0.010
    rack_face_width_max_mm: 4.800
    rack_stock_height_max_mm: 4.800
    reducer_setup_clock_deviation_mm: 0.010
    receiving_allocation_status: provisional
    note: "Conditional inspection/rejection controls, not supplier accuracy, an AGMA class or hardware qualification. Receiving-allocation release is the explicit receiving_allocation_status field. Pay actual calibration, common datum, wire geometry, orientation and thermal uncertainty in addition to the source micrometer/indicator floors. Full rack material still uses both signed X-intercepts, all usable gaps and the whole face in one independent material/end XY datum; complete point/root envelopes require justified whole-material process or functional evidence. The named standard-manufactured straight/smooth WORKING-SIDE form is a MODEL premise at the native-gear form level, not a local-normal certificate inferred from samples. Back its angle control with the SAME physical wire and diameter at both measured heights: the common radius offset cancels under that premise. Pay both centre-coordinate readings and require the entire secant-angle enclosure inside the source band. Crest, root and birth/edge cones are not made working sides and remain independently enclosed. Root intrusion is subtracted from actual root air, never from its required floor. Incoming intrinsic lead belongs to rack form; separate lead controls assembled rigid face/axis misalignment. Tooth-space TIR refers to the running journal/bore; indicate and lock the disc as a matched cluster against the feed running bore. Coupled reamed dowels locate the plate; screws clamp only. Position is diametral; retain actual projected gear/wheel planes and opposite-arm-face payment. Rack/support asset height uses one captured loaded axis datum; later pivot/journal motion, tilted sections and service cock are separately paid. Stock height/face width and paper/media/nib bands remain independent. Introduced paper error after ONE held initial zero is a NAMED DETERMINISTIC term in the total coefficient-error budget, never operator-index credit. Knob transfer alone is not crank qualification. Only unchanged chain polygon/link pitch is inherited; introduced geometry/gravity/slack/fit-induced chain phase remains paid."

  cone_drum_oblique_mesh:  # the inclined cone partial engagement
    # The engaged centre is SET AT ASSEMBLY (user ruling 2026-10-10): pedestal screws
    #   snug-loose, swing in on shims at T012 and T120 so the arbor aligns to the cone
    #   line, tighten the pedestals, then set T120 with a radial tip-to-root feeler at
    #   the standard clearance + edge_slack and lock the cone-lock-knob (MHA-VN-013).
    #   The other cones follow the swing rotation. cone_set_stack books the centres;
    #   dt_mesh_checks gates nominal CR >= 1.0 and no binding/interference at the RSS
    #   corner (RSS CR reported). The swing stop (MHA-VN-015) only limits the disengaged swing.
    edge_slack_mm: 0.20               # T120 feeler set point over standard; the CAD placement
    set_feeler_reading_mm: 0.0254     # one 0.001-in feeler leaf step
    pivot_bore_band_mm: [0.015, 0.0]  # platform pivot bore, reamed 6.35 H7 on the stock shoulder
    pivot_seat_position_mm: 0.05      # base pivot seat to the arbor-pedestal seats, one setup
    tooth_cutting_runout_tir_mm: 0.05 # per gear (each cone and the drum) about its finished bore
    note: "oblique partial engagement; centre set at assembly on T120 (cone_set_stack)"

  crank_mesh:              # 16T:64T crossed mesh (crank machine-z over the inclined 64T)
    c2c_slack_mm: 0.30               # configured extension; actual 3D functional centre selection pending
    gear64_tooth_thickness_deviations_mm: [-0.050, -0.200]  # (upper, lower) about the standard-depth thickness; thin-only (Main ruling 2026-10-10)
    tooth_cutting_runout_tir_mm: 0.05  # per gear: cutting setup about the finished bore, not an AGMA accuracy grade
    note: "Current crossed crank uses normal 24DP PA20, finite 14T stock form for the straight 16T pinion, and finite 55T normal stock form for the right-hand 64T helix. Beta follows the configured cone incline; current post/station and centre derive their source readers. The preceding 43.524321 mm centre with 0.30 mm extension is not a stock-form certificate; functional actual3D station selection remains pending. Selected standard-root translations and actual base-tangent span controls replace the former ideal 0.15-mm geometry-thinning knob. The 64T is thinned -0.050/-0.200 mm about its standard-depth thickness and modelled at -0.050; the 16T retains +0/-0.020. The retained tooth-cutting setup TIR is0.05 mm on EACH gear about its finished bore: radial eccentricity E is at most TIR/2 =0.025 mm for each16T and64T, so the pair radial cutting-setup allowance is0.05 mm. This is a process-setting limit, not an AGMA class, cutter-form accuracy claim or new geometric FCF; both gear specs own their actual source read. Actual blank, root envelope, process corners and phase follow the cutter-native spec and qualification readers; no unsupported upper-flank continuation is allowed. Main requires actual3D UNION functional coverage at least0.62 over the whole booked stack including opening, with supported finite corner/edge contact included; flank/flank coverage is diagnostic only. This is non-contact-ratio functional coverage, not an ideal involute CR claim, and signed TE must pay the existing budget. Historical ideal-profile nine-phase results were0.304345..0.310839 mm nominal backlash, seed−1.78 degrees, window−2.794590..−0.758457 degrees, +0.015729 mm worst closing backlash and0.717076 worst-opening normal-section contact ratio against the former0.62 screen. Those are OLD-PROFILE NONCERTIFYING reproduction evidence, not a certificate for the selected stock-form pair. Earlier12.00-degree /7.2113-mm-face /−1.49-degree values describe the still older tooth system."

  cam_follower_contact:
    min_clearance_to_adjacent_channel_mm: 0.50
    contact_gap_mm: 0.02             # BAR_CONTACT_GAP — design margin, not a tangent

  sliding_amplitude_bar_on_rocker:
    side_clearance_mm: [0.05, 0.20]
    note: "bar slides without binding through the full rocker sweep"

  spring_eye_threading:
    min_margin_mm: 0.10              # plate-threading loop margin bound (~0.11 observed)

  fastener_clearance:
    close_mm: 0.10
    normal_mm: 0.25
    # The drilled-hole DRAWING tolerance is a title-block general tolerance, not
    # a fit class -- it lives in title_block.yaml (drilled_hole) with the other
    # $PRPSHEET-stamped tolerances, so a display edit re-stamps parts without a
    # geometry FULL rebuild.
