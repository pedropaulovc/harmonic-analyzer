# Coefficient-error budget for the critical features -- the tolerances that the
# sensitivity model in cad/scripts/error_budget.py (doit: check:budget) derives
# from the whole-device benchmark in cad/docs/michelson-1898-trial-accuracy.md.
# Method and the resulting guidance: cad/docs/tolerance-policy.md.
#
# This file is READ BY NO BUILD SCRIPT: it holds allocation (how much of the
# output error each feature may consume), not geometry, so editing it never
# rebuilds CAD. The nominal each feature is toleranced against stays in the
# spec module named under `nominal` -- check:budget fails if that symbol moves.
# The drawing-facing limits (tolerances.yaml, title_block.yaml, *_spec.py notes)
# must agree with the `tolerance` here; check:budget pins the ones it can read.
units: mm

benchmark:                       # comparison values, NOT acceptance limits (see the 1898 report)
  mae_fs_pct: 0.7                # historical 80-element mean absolute coefficient error, % of greatest term
  max_fs_pct: 2.0                # largest tabulated individual difference

# What the CHANNEL-SPECIFIC scatter of the features below may consume of the
# benchmark, predicted by Monte Carlo over `reference_inputs` with the readout
# procedure of tolerance-policy.md (mean-line zero, calibration-run scale). The
# remainder of the 0.7 % is reserved for the nominal-design residual,
# knife/magnifier hysteresis and readout (all reported by error_budget.py, none
# of them a part tolerance).
targets:
  scatter_mae_fs_pct: 0.30       # mean |e_k| over k, inputs and draws
  scatter_p99_max_fs_pct: 1.5    # 99th percentile of the worst coefficient of a draw
  pair_consistency_p99_pct: 2.0  # worst coefficient of the two-channel input: its scatter p99
                                 # RSS'd with every reserved term evaluated on it, plus its residual

# Per-feature headroom the report prints as `allowable`: the tolerance at which
# a feature ALONE would consume this much (linear scaling). A drawing limit
# looser than its allowable is not accuracy-justified; tighter is a fit,
# process or capability choice, not a benchmark requirement.
allocation_share:
  mae_fs_pct: 0.05
  pair_p99_pct: 0.50

# Inputs the budget is evaluated on (ordinates x_i in [0, 1] on 20 elements --
# the built CAD keeps every bar on the lifting side, build_channel_assembly
# rejects amplitude_mm < 0; a signed function is lifted by a constant before
# analysis -- station d_i = x_i * amplitude.max_travel_mm, coefficient k read
# at theta_k = k*pi/20).  See error_budget.py:reference_inputs.
reference_inputs: [all_ones, rect_half, gaussian_a0p1, alternating, pair_1_20]

# Terms that are NOT part tolerances but are part of the closure: each carries
# the assumption it is evaluated at and the share of the benchmark it may
# consume. budget_closes checks every term against its allowance AND the total
# (nominal residual + RSS of the independent terms + scatter) against the
# benchmark MAE. Changing an assumption here is a stated design/procedure
# decision, not a tuning knob.
reserved:
  nominal_residual_mae:            # what survives the null-station zero + 2nd-harmonic correction
    allowance_pct: 0.05
    # The as-built CAD locks every cylinder gear at Rz(+1.5) -- half its tooth
    # pitch, tooth-in-gap against the phase-0 cones (gear_train.cylinder_lock_
    # phase_deg) -- and the cam lobe is a tooth crest, so at crank home every
    # lobe sits 1.5 deg off vertical. That is a COMMON cam phase: channel i turns
    # i x faster than the crank, so no crank index zeroes all 20, and the error
    # it leaves (h * sum x_i sin(i theta_k), the sine transform the machine does
    # not read) is beyond every procedure step -- ~0.3 % MAE / 1.7 % max on the
    # broad inputs, 6x this allowance. The fix is in the cylinder gear (cut the
    # lobe half a pitch from the crest so the lock leaves it up; #749), not in
    # the budget. The report scores the as-built residual beside the lobe-up
    # one; this waiver is the record that the closure credits the latter.
    waive_cam_home_phase: true
  readout:                         # ordinate reading at the pen. The stroke is the CAD's
                                   # output.yaml pen_trace_half_mm (15, verify:kinematics), NOT set here
    reading_uncertainty_mm: 0.075  # half a 0.15 mm technical-pen line, read against the grid
    # The magnifier is NOT an assumption: error_budget.py fits every reference
    # input to the pen from the CAD's own output chain (spring coupling, the
    # clamp's reachable radius band on the magnifying lever -- collar face to
    # rod tip, output.yaml magnifier_* -- and the wheel's rim/hub wire ratio).
    # The k=0 (greatest) term is made to span the stroke, Michelson's
    # normalisation, book p. 99: where the lever radius that does it is below
    # the clamp's minimum the operator scales the ordinates down instead (the
    # machine's ORDINATE CAPACITY, ~4.7 full-scale bars -- every broad input
    # runs at 0.2-0.5 of full scale), and where it is above the as-built
    # radius the reading falls short and the term grows by the shortfall.
    # The MINIMUM pose -- clamp face against the bracket collar face, 66 mm
    # from the knife -- is what every broad input is scored at, and the CAD
    # builds only the as-built 165 mm pose (build_magnifier_assembly): no
    # clearance or articulation gate exercises the clamp, vertical rod and
    # wire there. That is an OPEN DESIGN ITEM (#748), not a budget
    # assumption: check:budget fails on it unless waived here, and the waiver
    # is the record that the closure is conditional on that pose being
    # buildable. The report prints an offline straight-wire estimate beside
    # the waiver (hook at x 51, same 0.3 mm ring / 1.7 mm spoke
    # z clearance as the built pose -- the wire's z run is x-independent); it is not
    # a proof, and it says nothing about the clamp, rod or collar.
    waive_minimum_pose: true
    allowance_pct: 0.30            # scored as the MAE the benchmark uses: every coefficient
                                   # carries its own read AND the k=0 normaliser's read (scaled
                                   # by the physical r_k/r_0), uniform +/-reading each, averaged
                                   # over k, on the worst broad input; one reading converts
                                   # through s = r_0/(S + C_2), so the idle bars' lift and the
                                   # second harmonic riding the k=0 peak both inflate it. Lands
                                   # at 0.27 on every broad input; the worst SINGLE coefficient
                                   # (Michelson's 0.5-unit table quantisation) is reported
                                   # beside it, not gated.
  timebase:                        # reading coefficient k with the crank stopped on its index,
                                   # scored on the worst reference input
    crank_index_deg: 8.0           # +/- stop repeatability on the crank index (uniform)
    allowance_pct: 0.30
  knife:                           # summing-lever knife-edge hysteresis (stall), scored on the
                                   # worst broad input: the stall is a fixed displacement, so it
                                   # is paid against the trial's greatest term at the ordinate
                                   # scale the pen forces -- every broad input is capped at the
                                   # ~4.7-bar capacity, so all read 0.40 (0.09 if the broad
                                   # inputs could run at full scale). The capacity, not the
                                   # edge, is what this allowance buys: a clamp band reaching
                                   # nearer the knife, or a longer pen stroke, halves it.
    rolling_resistance_mm: 0.005   # hardened edge on a hardened seat; MEASURE as trace width on reversal
    allowance_pct: 0.45
    # The knife load is the 20 channel preloads PLUS the counter spring's
    # balancing reaction (20*preload*a/b). The CAD's counter spring
    # (counter_spring_spec: 0.51 N/mm, at most ~28 mm of extension in its
    # 325.3 installed body) cannot supply that reaction -- the spring pair is
    # unbalanced ~50x and the machine as modelled has no static operating
    # point. That is an OPEN DESIGN ITEM (tolerance-policy.md), not a budget
    # assumption: check:budget fails on it unless waived here, and the waiver
    # is the record that the closure below is conditional on resolving it.
    waive_static_balance: true

monte_carlo:
  draws: 4000
  seed: 20260912
  distribution: uniform          # every feature uniform within +/- tolerance (no process centring credit)

# Channel-specific features. `tolerance` is the +/- half-width of the drawing
# (or matching/setup) limit; `unit` is mm unless stated. `class`:
#   channel  -- scatters independently per channel (enters the sum directly)
#   setup    -- re-introduced every trial by the operator (measuring stick, alignment)
# `quantity`: which transfer quantity the deviation perturbs.
critical_features:
  cam_eccentricity:
    tolerance: 0.025
    nominal: cylinder_gear_spec.ECCENTRICITY
    quantity: gain
    class: channel
    holds: "offset-turn the cam in a 4-jaw, indicate the throw to 0.01"
  rocker_rod_pin_radius:
    tolerance: 0.10
    nominal: rocker_arm_spec.ROD_HOLE_X
    quantity: gain
    class: channel
    holds: "rod-pin hole position from the pivot bore, DRO/CNC"
  lever_bar_pin_arm:
    tolerance: 0.10
    nominal: channel_lever_spec.BAR_PIN_X
    quantity: gain
    class: channel
    holds: "bar-pin hole from the fulcrum bore, DRO/CNC"
  lever_spring_hook_arm:
    tolerance: 0.10
    nominal: channel_lever_spec.LEVER_SPRING_X
    quantity: gain
    class: channel
    holds: "spring hole from the fulcrum bore, DRO/CNC"
  summing_hook_arm:
    tolerance: 0.15
    nominal: summing_lever_spec.HOLE_X
    quantity: gain
    class: channel
    holds: "half of the 0.30 spring-hole pattern position zone (summing_lever_spec.GEOMETRIC_TOLERANCES_MM), normal to the knife line"
  spring_rate:
    tolerance: 1.25
    unit: pct
    nominal: channel_spring_installed_spec.SPRING_RATE_REF
    quantity: gain
    class: channel
    holds: "MATCHED, not machined: measure every channel spring (weights + calipers, two loads) and bin the 20 within +/-1.25 % of their mean (spec-sheet SET QC: two hanging loads at eye c-c 60/70); stock springs scatter +/-10 %"
  cam_phase:
    tolerance: 0.25
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "cam-lobe direction vs the alignment-notch centreline, both on the cylinder gear: index on the same setup (rotary table/dividing head)"
  mesh_lag_spread:
    tolerance: 0.14
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "derived: half the cone<->cylinder gear_mesh backlash band (tolerances.yaml 0.05..0.20 mm) at the 120T pitch radius, one-directional cranking"
  station_setting:
    tolerance: 0.25
    nominal: null
    quantity: ordinate
    class: setup
    holds: "measuring-stick reading: interpolate to 1/5 of the 1.42 minor division (0.28 step, +/-0.14 rounding) plus eye/parallax -- stick drawing note 5; the 0 tick sits at the rocker pivot axis (every station >= 0) and the measured null lift vector is subtracted from every trial (tolerance-policy.md)"
