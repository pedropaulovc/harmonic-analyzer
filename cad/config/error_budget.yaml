# Coefficient-error budget for the critical features -- the tolerances that the
# sensitivity model in cad/scripts/error_budget.py (doit: check:budget) derives
# from the whole-device benchmark in cad/docs/michelson-1898-trial-accuracy.md.
# Method and the resulting guidance: cad/docs/tolerance-policy.md.
#
# This file is READ BY NO BUILD SCRIPT: it holds allocation (how much of the
# output error each feature may consume), not geometry, so editing it never
# rebuilds CAD. The nominal each feature is toleranced against stays in the
# spec module named under `nominal` -- check:budget fails if that symbol moves.
# The drawing-facing limits (tolerances/, title_block.yaml, *_spec.py notes)
# must agree with the `tolerance` here; check:budget pins the ones it can read.
units: mm

benchmark:                       # comparison values, NOT acceptance limits (see the 1898 report)
  mae_fs_pct: 0.7                # historical 80-element mean absolute coefficient error, % of greatest term
  max_fs_pct: 2.0                # largest tabulated individual difference

# What the CHANNEL-SPECIFIC scatter of the features below may consume of the
# benchmark, predicted by Monte Carlo over `reference_inputs` with the readout
# procedure of tolerance-policy.md (mean-line zero, calibration-run scale). The
# remainder of the 0.7 % is reserved for the nominal-design residual,
# knife/magnifier hysteresis and readout (all reported by error_budget.py, none
# of them a part tolerance).
targets:
  scatter_mae_fs_pct: 0.30       # mean |e_k| over k, inputs and draws
  scatter_p99_max_fs_pct: 1.5    # 99th percentile of the worst coefficient of a draw
  pair_consistency_max_fs_pct: 2.0 # EXPECTED worst coefficient of the two-channel input (mean over
                                 # machines of max_k), every error source drawn JOINTLY -- scatter,
                                 # both reads of each coefficient, the stall at each read, the crank
                                 # index -- on the credited machine's residual (report: pair_joint).
                                 # Compared with the benchmark's largest SINGLE tabulated difference,
                                 # which is one machine's worst coefficient, so the comparable model
                                 # statistic is the expected max, not a quantile of an ensemble; the
                                 # p50/p90/p99 and the fraction of machines over 2.0 are reported.

# Per-feature headroom the report prints as `allowable`: the tolerance at which
# a feature ALONE would consume this much (linear scaling). A drawing limit
# looser than its allowable is not accuracy-justified; tighter is a fit,
# process or capability choice, not a benchmark requirement.
allocation_share:
  mae_fs_pct: 0.05
  pair_p99_pct: 0.50

# Inputs the budget is evaluated on (ordinates x_i in [0, 1] on 20 elements --
# the built CAD keeps every bar on the lifting side, build_ch_channel_assembly
# rejects amplitude_mm < 0; a signed function is lifted by a constant before
# analysis -- station d_i = x_i * amplitude.max_travel_mm, coefficient k read
# at theta_k = k*pi/20).  See error_budget.py:reference_inputs.
reference_inputs: [all_ones, rect_half, gaussian_a0p1, alternating, pair_1_20]

# Terms that are NOT part tolerances but are part of the closure: each carries
# the assumption it is evaluated at and the share of the benchmark it may
# consume. budget_closes checks every term against its allowance AND the total
# (nominal residual + RSS of the independent terms + scatter) against the
# benchmark MAE. Changing an assumption here is a stated design/procedure
# decision, not a tuning knob.
reserved:
  nominal_residual_mae:            # what survives the null-station zero + 2nd-harmonic correction
    allowance_pct: 0.05
    # Every cam lobe stands vertical at crank home: MHA-DT-12 cuts it half a
    # tooth pitch clockwise of the crest, so the drive train's tooth-in-gap
    # lock (gear_train.cylinder_lock_phase_deg) turns it up (owner ruling
    # 2026-11-20 on #749, "B"; channel_frame_geom.CAM_HOME_PHASE_DEG). A phase
    # common to all 20 lobes is beyond every procedure step: channel i turns
    # i x faster than the crank, so no crank index zeroes all 20, and the
    # error it leaves (h * sum x_i sin(i theta_k), the sine transform the
    # machine does not read) stays in the residual.
    # The cam turning fixture MHA-DT-12-TL-01 adds such a common cam phase:
    # its hole stations at the shop's +/-.002 row, its register's
    # indication and the jaw pair's line turn every lobe it cuts by the same
    # angle, up to this (dt_cylinder_gear_tl_cam_fixture_spec.PHASE_FIXED_WORST_DEG,
    # .469 deg). The report scores it on top of the CAD's cam home phase
    # (cam_home_phase.residual_fixture_common)
    # and the closure does not credit it. Accepted with MHA-DT-12's NotchPhase
    # band widened to +/-.7 deg, which holds every gear's worst total (.684,
    # this and each gear's own .13 together; cam_phase's gear-to-gear +/-.25 books the .13)
    # (delegated ruling 2026-11-17, #2361 option 1; owner review on #2144).
    fixture_common_cam_phase_deg: 0.47
  readout:                         # ordinate reading at the pen. The stroke is the CAD's
                                   # output.yaml pen_trace_half_mm (15, verify:kinematics), NOT set here
    reading_uncertainty_mm: 0.075  # half a 0.15 mm technical-pen line, read against the grid
    # error_budget.py fits every reference input to the output chain (loaded
    # spring coupling, wire ratio and the conservative COMPONENT operating
    # band from mg_magnifying_lever_geom.operating_clamp_radius_band()).
    # Current knife-to-clamp/bottom-rod-axis bounds are 83.920 / 165 / 193.115 mm.
    # Fitted projection sets the rod position: free tip K=C-N/2-P+L, C=55 mm.
    # Credit the FULL derived 17 mm body bound from the actual interior tap axis,
    # never +/-8.5 mm centring. R_min=max(C-Nmin/2-Pmin+Tmax,C+Nmax/2)+17.
    # Rod length cancels from that runout stop. At the free end use the shortest
    # rod, thickest neck and largest projection together:
    # R_max=Kmin-ROD_DIA_MAX/2-17=193.115 mm. Built 165 mm is unchanged.
    # clamp_radius_band(block_depth) is nominal MODEL travel, not capacity.
    # As-made inspection may admit more travel; published capacity credits none.
    # The pen sees the WIRE MOMENT ARM (error_budget.wire_moment_arm), not the
    # station radius: the fixture's signed HOOK_OFFSET_X is toward the knife,
    # the hook is below it, and the installed wire leans toward the wheel.
    # When the arm needed for full stroke is below the conservative minimum,
    # scale ordinates down using the table-derived capacity. Above the arm at
    # the built station, keep that station and score the stroke shortfall.
    # Only the as-built pose is CAD-gated (build_mg_magnifier_assembly): no
    # clearance or articulation gate exercises the clamp, vertical rod and
    # wire anywhere else, yet every broad input is scored with the clamp at or
    # just above the conservative MINIMUM component station. These component
    # intervals are not native all-machine clearance/articulation proof. That
    # is an OPEN DESIGN ITEM (#748), not a budget assumption: check:budget fails
    # unless waived here, and closure stays conditional on that pose being
    # buildable. The fitter must verify as-made sliding bore clearance and that
    # the entire bore clears runout/thread, bracket and the free hemisphere.
    # The report's straight-wire surface-gap estimate is offline only: it is
    # not proof of the clamp, rod, threaded bracket or full operating stroke.
    # TODO(#748): CAD-gate the magnifier's minimum pose, then drop this waiver.
    waive_minimum_pose: true
    allowance_pct: 0.30            # scored as the MAE the benchmark uses: every coefficient
                                   # carries its own read AND the k=0 normaliser's read (scaled
                                   # by the physical r_k/r_0), uniform +/-reading each, averaged
                                   # over k, on the worst broad input at its conservative-band
                                   # setup; one reading converts through s = r_0/(S + C_2), so
                                   # idle bars' lift and the second harmonic at k=0 inflate it.
                                   # Report the worst SINGLE coefficient beside it, not gated.
  timebase:                        # reading coefficient k with the crank stopped, its arm
                                   # pointing straight down (#2385), scored on the worst
                                   # reference input
    crank_index_deg: 8.0           # +/- stop repeatability of that arm-down pose (uniform)
    allowance_pct: 0.30
  knife:                           # fixed reversal displacement, evaluated at each input's
                                   # actual ordinate scale and available magnifier range
    rolling_resistance_mm: 0.005   # integral gray-iron edge (ASTM A48 class 40C, as machined, not
                                   # hardened; delegated ruling 2026-11-17, #1611 option A, owner
                                   # review on #2144; precedent owner ruling 2026-11-10, #2334 B1)
                                   # on a 28-32 HRC 4140 HT seat. Worst stationary load (rect_half,
                                   # 134.8 N): about 68 N on the rear mount over .55 in, 4.85 N/mm.
                                   # At the R.004 MAX ridge in the Ø.4720 bore, Hertz line contact
                                   # (E 117/205 GPa) peaks at 1.10 GPa over a 2.8 um half-width.
                                   # That peak and any sharper conforming edge exceed class 40's
                                   # ~0.97 GPa compressive strength, so the edge beds in at first
                                   # load to a land of 4.85 N/mm / 0.97 GPa = 5.0 um (1.6 um deep
                                   # on the 115 deg ridge), then rolls on it: contact half-width
                                   # <= 2.8 um at every conforming radius, under this 0.005. Value
                                   # unchanged until measured (#1611 option D pendulum coupon);
                                   # MEASURE as trace width on reversal
    allowance_pct: 0.45
    # Both spring banks pull upward on opposite sides of the knife.
    # Stock rates/initial tensions and loaded perpendicular arms govern the
    # balancing load. Catalog force AND length limits are hard gates; no waiver.
    # Zero-setting slides the gooseneck to include measured preloads and weight.

monte_carlo:
  draws: 4000
  seed: 20260912
  distribution: uniform          # deviations uniform within +/- tolerance; cone_key_play is drawn about the keyway's 0.0508 mm mean

# Channel-specific features. `tolerance` is the +/- half-width of the drawing
# (or matching/setup) limit; `unit` is mm unless stated. `class`:
#   channel  -- scatters independently per channel (enters the sum directly)
#   setup    -- re-introduced every trial by the operator (measuring stick, alignment)
# `quantity`: which transfer quantity the deviation perturbs.
critical_features:
  cam_eccentricity:
    tolerance: 0.0508  # +/-.0020 in on the MHA-DT-12 print (Owner ruling 2026-11-08 (Pedro), #2144 item 8.2)
    nominal: dt_cylinder_gear_spec.ECCENTRICITY
    quantity: gain
    class: channel
    holds: "the cam turned last on the lathe fixture MHA-DT-12-TL-01, its throw set on the fixture's stub by gauge blocks at a dial test indicator's zero (MHA-DT-12-TL-00); worst .0013 in with each gear's bore float (dt_cylinder_gear_tl_cam_fixture_spec.THROW_ERROR_MAX_MM)"
  rocker_rod_pin_radius:
    tolerance: 0.1778  # +/-.007 in, half the inch print's .014 position zone (delegated ruling 2026-11-07, owner review #2144)
    nominal: _rocker_interface.ROD_HOLE_X
    quantity: gain
    class: channel
    holds: "rod-pin hole position from the pivot bore, DRO/CNC"
  lever_bar_pin_arm:
    tolerance: 0.127  # +/-.005 in, the title block's .XXX row (delegated ruling 2026-11-07, owner review #2144)
    nominal: ch_channel_lever_spec.BAR_PIN_X
    quantity: gain
    class: channel
    holds: "bar-pin hole from the fulcrum bore, DRO/CNC"
  lever_spring_hook_arm:
    tolerance: 0.127  # +/-.005 in, the title block's .XXX row (delegated ruling 2026-11-07, owner review #2144)
    nominal: ch_channel_lever_spec.LEVER_SPRING_X
    quantity: gain
    class: channel
    holds: "spring hole from the fulcrum bore, DRO/CNC"
  summing_hook_arm:
    tolerance: 0.127
    nominal: sm_summing_lever_spec.HOLE_X
    quantity: gain
    class: channel
    holds: "half of the Ø.010 (0.254 mm) spring-hole pattern position zone (sm_summing_lever_spec.GEOMETRIC_TOLERANCES_IN), normal to the knife line"
  spring_rate:
    tolerance: 1.25
    unit: pct
    nominal: ch_vn_channel_spring_installed_spec.SPRING_RATE_N_PER_MM
    quantity: gain
    class: channel
    holds: "MATCHED, not machined: measure every channel spring and bin the 20 within +/-1.25 % of their common mean; SET QC uses 60/80 mm inside-hook lengths (58/78 mm pin centres with diameter 2 mm pins); catalog rates scatter +/-10 %"
  spring_initial_tension:
    tolerance: 0.27
    unit: N
    nominal: ch_vn_channel_spring_installed_spec.INITIAL_TENSION_N
    quantity: gain
    class: channel
    holds: "Catalog initial-tension variation is +/-0.06 lbf (0.267 N), bounded here by +/-0.27 N; SET QC records each force-curve intercept. Mean-line zero removes DC, not the small geometric gain contribution."
  cam_phase:
    tolerance: 0.25  # gear to gear; MHA-DT-12 prints +/-.7 with the fixture's common phase (reserved.nominal_residual_mae)
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "cam-lobe direction vs the alignment-notch centreline, gear to gear: each gear turned on MHA-DT-12-TL-01 with its bore on the stub and its notched tooth space seated on the clock pin, .13 deg worst (bore float and tooth form, dt_cylinder_gear_tl_cam_fixture_spec.PHASE_PER_PART_WORST_DEG); the phase common to all 20 is under reserved.nominal_residual_mae"
  mesh_lag_spread:
    tolerance: 0.14
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "derived: half the cone<->cylinder gear_mesh backlash band (tolerances/gear_mesh.yaml 0.05..0.20 mm) at the 120T pitch radius, one-directional cranking"
  cone_flat_clock:
    tolerance: 1.0
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "each keyed cone gear's keyway (T030-T120) on its phase-0 tooth's centreline, the two sharing the sheet's drawn centreline at the title-block +/-1 deg angle (no clock dimension); the bonded T006-T024 have no bore feature, but MHA-DT-03-TL-02 phases them off T030's phase-0 tooth, so T030's draw carries into each (one shared draw, T030's cam phase on every bonded gear: the comb slides by T030's pitch arc) on top of their own cone_tip_bond_clock. Allowable check (error_budget.py, 2026-11-10, PR #2459): alone at 1.0 deg MAE 0.069 / pair p99 0.255 against an equal-share allowable of 0.723 deg (0.05 MAE), so it takes more than its equal share, as cam_eccentricity, spring_rate, station_setting and cone_tip_bond_clock do; the combined budget closes (read the current error_budget.py report, not figures carried here)"
  cone_tip_bond_clock:
    tolerance: 0.866
    unit: mm
    nominal: null
    quantity: phase
    class: channel
    holds: "owner decision C1 keyed (2026-11-09, PR #1992): T024 bonded (LOCTITE 638) on MHA-DT-04's round land 2, T018 and T012 on MHA-DT-37's spigot and the spigot in MHA-DT-04, all clocked to the keyed T030 by the phasing comb MHA-DT-03-TL-02, a single blade dropped in one tooth space of each gear (owner ruling 2026-11-10), engaged until the compound grabs (MHA-DT-00 step 1); the comb is one .020 in sheet cut to shape (owner ruling 2026-11-13), a U clipped over the standing cone's tip (owner, 2026-11-14, #2734) whose spring far arm holds a second blade in T030's mirror space, so it leans only as far as both T030 spaces let it, and yaws (about the radial line through both blades) only as far as T030's face lets its blade slide; the stock's thickness (+/-.002 in), each blade depth at the title block's .XXX with .0005 in of play and .002 in of root air kept, each blade's shortest and longest stretch in its gear's face (its step standing the title block's R.040 inside corner clear of the larger gear), the bonded gears' float round their bond clearance, that lean and that yaw are its limits, and dt_cone_gear_tl_phasing_comb_spec.PHASE_ERROR_MM asserts every bonded gear's worst phase against T030 inside this tolerance (T006 worst, 0.865 mm pitch arc; booking 0.479 -> 0.866 accepted by the owner 2026-11-14, #2734), drawn per gear; at the 120T cam that is 1/(60 m) rad per mm on every bonded gear (error_budget.phase_profiles)"
  cone_key_play:
    tolerance: 0.0508
    unit: mm
    nominal: null
    quantity: phase
    class: channel
    holds: "keyway side clearance on the MHA-DT-VN-71 key, T030-T120 (owner decision C1 keyed, 2026-11-09, PR #1992): 0-.004 in (0-0.1016 mm), keyway width less key width (cone_land_key.KEYWAY_SIDE_CLEARANCE_MM), drawn whole per gear though the one key's width is common to every gear and only the keyway width (+.002/-0, the milled-width row) scatters; split about the key, so cranking one way turns a gear by half its clearance over the key's top, at the key's least height in the shallowest keyseat less the title block's 0.25 edge break (error_budget._key_levers); the keyed land's mean lag is the crank-index reference, so no residual"
  # cone_land_clock (MHA-DT-04 land flats clocked off the keyseat) and
  # cone_flat_play (the D-bore across-flat fit) retired with the flats:
  # owner decision C1 keyed, 2026-11-09, PR #1992.
  # #2434 (delegated ruling 2026-11-17, no precedent, for the owner's review
  # on #2144): the stick sets a bar from the rocker arm's outer tip land, so
  # the land's and the stop face's own deviations move the station the
  # nominal table row assumes (Codjiflo r1 on PR #3099).
  rocker_tip_land:
    tolerance: 0.254
    nominal: null
    quantity: ordinate
    class: channel
    holds: "MHA-CH-06 outer tip land, located BASIC inside the J-K surface profile .020 to A|B|C (+/-.010 in): the MHA-MS-00 stop bears on it to set that channel's bar (MHA-MS-00 steps 11-13A), so each arm's land deviation along the stick moves its bar's every station; READOUT's stick-reading column is the nominal registration (ms_stick_registration), so no procedure step removes it. Allowable check (error_budget.py, 2026-11-18, PR #3099): alone at 0.254 MAE 0.068 / pair p99 1.137 against an equal-share allowable of 0.112, so it takes more than its equal share, as station_setting does; the combined budget closes (pair expected worst 1.959 < 2.0, total MAE 0.497)"
  stop_face_square:
    tolerance: 0.0508
    nominal: null
    quantity: ordinate
    class: channel
    holds: "MHA-MS-02 stop-block end face nearer the 10: it reads the stick at the graduated face and bears on the land 8.94 mm down (ms_stick_registration.STOP_FACE_DEPTH_MM), so its squareness to the stick is a station offset along the stick. MHA-MS-02 leaves it to the title block's +/-1 deg (0.156 mm over the face); MHA-MS-00 steps 10A-10B (ASSEMBLY.md) fit it square at assembly instead: a .002 feeler does not enter along it under a machinist's square standing on the stick's top face (the face the thumbscrew clamps), whose blade spans the floor side of the end face that bears on the land, else it is stoned (0.0508 mm over the face). Delegated ruling 2026-11-18 for #2434, following the owner's fit-at-assembly precedents #2365 and #2416, drawing-simplicity rule 5 keeping the frame off MHA-MS-02; owner review on #2144. One stop sets every bar, so error_budget draws one offset per machine, common to all 20 channels"
  station_setting:
    tolerance: 0.25
    nominal: null
    quantity: ordinate
    class: setup
    holds: "measuring-stick reading: interpolate to 1/5 of the 1.42 minor division (0.28 step, +/-0.14 rounding) plus eye/parallax, at the stop's end face -- READOUT.md step 1 and MHA-MS-00 steps 11-13A (ASSEMBLY.md): stop on the rocker arm's outer tip, bar out to the stick's 10 end (#2434, delegated ruling 2026-11-17, no precedent, option 2, owner review on #2144); the table's stick reading carries the offset of the stick's 0 tick from the rocker pivot axis, zero is the stop on the 0.2 tick (every station >= 0), and the null lift vector is subtracted from every trial (tolerance-policy.md); the land and stop face the stick registers on are booked as rocker_tip_land and stop_face_square"
