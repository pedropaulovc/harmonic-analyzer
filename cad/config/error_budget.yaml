# Coefficient-error budget for the critical features -- the tolerances that the
# sensitivity model in cad/scripts/error_budget.py (doit: check:budget) derives
# from the whole-device benchmark in cad/docs/michelson-1898-trial-accuracy.md.
# Method and the resulting guidance: cad/docs/tolerance-policy.md.
#
# This file is READ BY NO BUILD SCRIPT: it holds allocation (how much of the
# output error each feature may consume), not geometry, so editing it never
# rebuilds CAD. The nominal each feature is toleranced against stays in the
# spec module named under `nominal` -- check:budget fails if that symbol moves.
# The drawing-facing limits (tolerances/, title_block.yaml, *_spec.py notes)
# must agree with the `tolerance` here; check:budget pins the ones it can read.
units: mm

benchmark:                       # comparison values, NOT acceptance limits (see the 1898 report)
  mae_fs_pct: 0.7                # historical 80-element mean absolute coefficient error, % of greatest term
  max_fs_pct: 2.0                # largest tabulated individual difference

# What the CHANNEL-SPECIFIC scatter of the features below may consume of the
# benchmark, predicted by Monte Carlo over `reference_inputs` with the readout
# procedure of tolerance-policy.md (mean-line zero, calibration-run scale). The
# remainder of the 0.7 % is reserved for the nominal-design residual,
# knife/magnifier hysteresis and readout (all reported by error_budget.py, none
# of them a part tolerance).
targets:
  scatter_mae_fs_pct: 0.30       # mean |e_k| over k, inputs and draws
  scatter_p99_max_fs_pct: 1.5    # 99th percentile of the worst coefficient of a draw
  pair_consistency_max_fs_pct: 2.0 # EXPECTED worst coefficient of the two-channel input (mean over
                                 # machines of max_k), every error source drawn JOINTLY -- scatter,
                                 # both reads of each coefficient, the stall at each read, the crank
                                 # index -- on the credited machine's residual (report: pair_joint).
                                 # Compared with the benchmark's largest SINGLE tabulated difference,
                                 # which is one machine's worst coefficient, so the comparable model
                                 # statistic is the expected max, not a quantile of an ensemble; the
                                 # p50/p90/p99 and the fraction of machines over 2.0 are reported.

# Per-feature headroom the report prints as `allowable`: the tolerance at which
# a feature ALONE would consume this much (linear scaling). A drawing limit
# looser than its allowable is not accuracy-justified; tighter is a fit,
# process or capability choice, not a benchmark requirement.
allocation_share:
  mae_fs_pct: 0.05
  pair_p99_pct: 0.50

# Inputs the budget is evaluated on (ordinates x_i in [0, 1] on 20 elements --
# the built CAD keeps every bar on the lifting side, build_ch_channel_assembly
# rejects amplitude_mm < 0; a signed function is lifted by a constant before
# analysis -- station d_i = x_i * amplitude.max_travel_mm, coefficient k read
# at theta_k = k*pi/20).  See error_budget.py:reference_inputs.
reference_inputs: [all_ones, rect_half, gaussian_a0p1, alternating, pair_1_20]

# Terms that are NOT part tolerances but are part of the closure: each carries
# the assumption it is evaluated at and the share of the benchmark it may
# consume. budget_closes checks every term against its allowance AND the total
# (nominal residual + RSS of the independent terms + scatter) against the
# benchmark MAE. Changing an assumption here is a stated design/procedure
# decision, not a tuning knob.
reserved:
  nominal_residual_mae:            # what survives the null-station zero + 2nd-harmonic correction
    allowance_pct: 0.05
    # The as-built CAD locks every cylinder gear at Rz(+1.5) -- half its tooth
    # pitch, tooth-in-gap against the phase-0 cones (gear_train.cylinder_lock_
    # phase_deg) -- and the cam lobe is a tooth crest, so at crank home every
    # lobe sits 1.5 deg off vertical. That is a COMMON cam phase: channel i turns
    # i x faster than the crank, so no crank index zeroes all 20, and the error
    # it leaves (h * sum x_i sin(i theta_k), the sine transform the machine does
    # not read) is beyond every procedure step -- ~0.3 % MAE / 1.7 % max on the
    # broad inputs, 6x this allowance. The fix is in the cylinder gear (cut the
    # lobe half a pitch from the crest so the lock leaves it up; #749), not in
    # the budget. The report scores the as-built residual beside the lobe-up
    # one; this waiver is the record that the closure credits the latter.
    # TODO(#749): cut the cam lobe half a pitch from the crest, then drop this waiver.
    waive_cam_home_phase: true
  readout:                         # ordinate reading at the pen. The stroke is the CAD's
                                   # output.yaml pen_trace_half_mm (15, verify:kinematics), NOT set here
    reading_uncertainty_mm: 0.075  # half a 0.15 mm technical-pen line, read against the grid
    # error_budget.py fits every reference input to the output chain (loaded
    # spring coupling, wire ratio and the conservative COMPONENT operating
    # band from mg_magnifying_lever_geom.operating_clamp_radius_band()).
    # Current knife-to-clamp/bottom-rod-axis bounds are 83.920 / 165 / 193.115 mm.
    # Fitted projection sets the rod position: free tip K=C-N/2-P+L, C=55 mm.
    # Credit the FULL derived 17 mm body bound from the actual interior tap axis,
    # never +/-8.5 mm centring. R_min=max(C-Nmin/2-Pmin+Tmax,C+Nmax/2)+17.
    # Rod length cancels from that runout stop. At the free end use the shortest
    # rod, thickest neck and largest projection together:
    # R_max=Kmin-ROD_DIA_MAX/2-17=193.115 mm. Built 165 mm is unchanged.
    # clamp_radius_band(block_depth) is nominal MODEL travel, not capacity.
    # As-made inspection may admit more travel; published capacity credits none.
    # The pen sees the WIRE MOMENT ARM (error_budget.wire_moment_arm), not the
    # station radius: the fixture's signed HOOK_OFFSET_X is toward the knife,
    # the hook is below it, and the installed wire leans toward the wheel.
    # When the arm needed for full stroke is below the conservative minimum,
    # scale ordinates down using the table-derived capacity. Above the arm at
    # the built station, keep that station and score the stroke shortfall.
    # Only the as-built pose is CAD-gated (build_mg_magnifier_assembly): no
    # clearance or articulation gate exercises the clamp, vertical rod and
    # wire anywhere else, yet every broad input is scored with the clamp at or
    # just above the conservative MINIMUM component station. These component
    # intervals are not native all-machine clearance/articulation proof. That
    # is an OPEN DESIGN ITEM (#748), not a budget assumption: check:budget fails
    # unless waived here, and closure stays conditional on that pose being
    # buildable. The fitter must verify as-made sliding bore clearance and that
    # the entire bore clears runout/thread, bracket and the free hemisphere.
    # The report's straight-wire surface-gap estimate is offline only: it is
    # not proof of the clamp, rod, threaded bracket or full operating stroke.
    # TODO(#748): CAD-gate the magnifier's minimum pose, then drop this waiver.
    waive_minimum_pose: true
    allowance_pct: 0.30            # scored as the MAE the benchmark uses: every coefficient
                                   # carries its own read AND the k=0 normaliser's read (scaled
                                   # by the physical r_k/r_0), uniform +/-reading each, averaged
                                   # over k, on the worst broad input at its conservative-band
                                   # setup; one reading converts through s = r_0/(S + C_2), so
                                   # idle bars' lift and the second harmonic at k=0 inflate it.
                                   # Report the worst SINGLE coefficient beside it, not gated.
  timebase:                        # reading coefficient k with the crank stopped on its index,
                                   # scored on the worst reference input
    crank_index_deg: 8.0           # +/- stop repeatability on the crank index (uniform)
    allowance_pct: 0.30
  knife:                           # fixed reversal displacement, evaluated at each input's
                                   # actual ordinate scale and available magnifier range
    rolling_resistance_mm: 0.005   # hardened edge on a hardened seat; MEASURE as trace width on reversal
    allowance_pct: 0.45
    # Both spring banks pull upward on opposite sides of the knife.
    # Stock rates/initial tensions and loaded perpendicular arms govern the
    # balancing load. Catalog force AND length limits are hard gates; no waiver.
    # Zero-setting slides the gooseneck to include measured preloads and weight.

monte_carlo:
  draws: 4000
  seed: 20260912
  distribution: uniform          # deviations uniform within +/- tolerance; cone_flat_play is drawn about the fit's 0.02032 mm mean

# Channel-specific features. `tolerance` is the +/- half-width of the drawing
# (or matching/setup) limit; `unit` is mm unless stated. `class`:
#   channel  -- scatters independently per channel (enters the sum directly)
#   setup    -- re-introduced every trial by the operator (measuring stick, alignment)
# `quantity`: which transfer quantity the deviation perturbs.
critical_features:
  cam_eccentricity:
    tolerance: 0.0254  # +/-.0010 in on the MHA-DT-12 print
    nominal: dt_cylinder_gear_spec.ECCENTRICITY
    quantity: gain
    class: channel
    holds: "offset-turn the cam in a 4-jaw, indicate the throw to 0.01"
  rocker_rod_pin_radius:
    tolerance: 0.10
    nominal: _rocker_interface.ROD_HOLE_X
    quantity: gain
    class: channel
    holds: "rod-pin hole position from the pivot bore, DRO/CNC"
  lever_bar_pin_arm:
    tolerance: 0.10
    nominal: ch_channel_lever_spec.BAR_PIN_X
    quantity: gain
    class: channel
    holds: "bar-pin hole from the fulcrum bore, DRO/CNC"
  lever_spring_hook_arm:
    tolerance: 0.10
    nominal: ch_channel_lever_spec.LEVER_SPRING_X
    quantity: gain
    class: channel
    holds: "spring hole from the fulcrum bore, DRO/CNC"
  summing_hook_arm:
    tolerance: 0.075
    nominal: sm_summing_lever_spec.HOLE_X
    quantity: gain
    class: channel
    holds: "half of the 0.15 spring-hole pattern position zone (sm_summing_lever_spec.GEOMETRIC_TOLERANCES_MM), normal to the knife line"
  spring_rate:
    tolerance: 1.25
    unit: pct
    nominal: ch_vn_channel_spring_installed_spec.SPRING_RATE_N_PER_MM
    quantity: gain
    class: channel
    holds: "MATCHED, not machined: measure every channel spring and bin the 20 within +/-1.25 % of their common mean; SET QC uses 60/80 mm inside-hook lengths (58/78 mm pin centres with diameter 2 mm pins); catalog rates scatter +/-10 %"
  spring_initial_tension:
    tolerance: 0.27
    unit: N
    nominal: ch_vn_channel_spring_installed_spec.INITIAL_TENSION_N
    quantity: gain
    class: channel
    holds: "Catalog initial-tension variation is +/-0.06 lbf (0.267 N), bounded here by +/-0.27 N; SET QC records each force-curve intercept. Mean-line zero removes DC, not the small geometric gain contribution."
  cam_phase:
    tolerance: 0.25
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "cam-lobe direction vs the alignment-notch centreline, both on the cylinder gear: index on the same setup (rotary table/dividing head)"
  mesh_lag_spread:
    tolerance: 0.14
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "derived: half the cone<->cylinder gear_mesh backlash band (tolerances/gear_mesh.yaml 0.05..0.20 mm) at the 120T pitch radius, one-directional cranking"
  cone_flat_clock:
    tolerance: 0.25
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "index each cone gear's teeth off its D-bore flat on one setup (BoreFlatClock +/-0.25 deg); the shaft flats' own clock is cone_land_clock"
  cone_flat_play:
    tolerance: 0.01016
    unit: mm
    nominal: null
    quantity: phase
    class: channel
    holds: "D-bore across-flat fit: .0004-.0012 in (0.01016-0.03048 mm) clearance on every gear (gear_seat_fit.FLAT_AF_CLEARANCE), acting on the shortest flat half-chord MHA-DT-04 accepts (land at its least diameter and greatest AF) less the title block's 0.25 edge break on its torque corner (error_budget.phase_profiles); subtract the common Ø9.525-land mean lag as a crank-index time shift, retain per-land residual and per-gear scatter"
  cone_land_clock:
    tolerance: 1.0
    unit: deg
    nominal: null
    quantity: phase
    class: channel
    holds: "MHA-DT-04 section A-A callout 4 FLATS IN LINE at the title-block +/-1 deg angle: the Ø6.350, Ø3.175 and Ø0.794 land flats each within 1 deg of the Ø9.525 land's, which carries T030-T120 and the 64T (its own clock is a crank-index shift); one draw per land, shared by its gears (error_budget.draw_groups)"
  station_setting:
    tolerance: 0.25
    nominal: null
    quantity: ordinate
    class: setup
    holds: "measuring-stick reading: interpolate to 1/5 of the 1.42 minor division (0.28 step, +/-0.14 rounding) plus eye/parallax -- stick drawing note 5; the 0 tick sits at the rocker pivot axis (every station >= 0) and the measured null lift vector is subtracted from every trial (tolerance-policy.md)"
