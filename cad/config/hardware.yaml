# COTS tier of every purchased part (#2886), read by hardware_schedule.py,
# which prints the release's HARDWARE.md. No build leaf reads this file.
#
# ASME Y14.24: tier 1 = standard hardware, fully defined by a generic
# designation (a HARDWARE.md row); tier 2 = proprietary/non-standard item, a
# specification-control sheet; tier 3 = shop-altered item, an altered-item
# sheet (MAKE FROM blank + the shop's cuts). The oblique trammel jig's vendor
# parts are not listed: that family is retiring.
#
# Tier-1 rows also carry `designation`, `standard` and, where a head, nut,
# washer or wire must clear its seat, an `envelope`. Each envelope value is
# "<pure provider module> [factor*]<attribute path>": an attribute such as
# HEAD_DIA or DIMS.od_max, or a Supplier* reference dimension; millimetres.
# Heads and nuts print across corners (factor 1/cos(pi/n)). Pins, chain,
# set-screw lengths (a headed set screw keeps its head envelope) and retaining
# rings carry none: their sizes are fits fixed by the designation and, where
# the row names one, its standard; they print "per <standard>" or "per
# designation". A part the assembly steps cut or face keeps its tier-1 row when
# its `why` names that step.
