checks:
  - id: C-01
    check: "BOND_GAP_TILT_DEG"
    kind: joint
    reason: "the ring cannot lean; its face cures off the plate"
    source: "the title block's angular row, 1° (_printed_tolerance.angular_band_deg), the only control on the drilled bore's squareness to the front face; the #11 bore of delegated ruling 2026-11-24 (Main), D17, no precedent; owner review on #2144 (https://github.com/pedropaulovc/harmonic-analyzer/issues/2144#issuecomment-7139937225). The lean is taken at the tightest gap (.191 bore over the .1875 shoulder) over the longest land (.198, no edge-break credit) by the exact short-bore relation D cos t = d + L sin t: 1.0044°. It clears the row by .0044°, which is .000015 in of bore, under what the shop reads: by tolerance-policy.md that is no evidence either way, so MHA-PD-00's dry trial (15C: no daylight under the spacer as made, the screw held down on the plate) accepts each ring. The next drill of the index, #10 (.1935), would open the widest gap to .011, past LOCTITE 638's 0.25 mm (.0098)"
    basis: worst_case
