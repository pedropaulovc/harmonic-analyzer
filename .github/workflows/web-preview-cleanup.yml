name: Web Preview Cleanup

on:
  # Do not path-filter closed PRs: cleanup must also cover changed PR contents.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Exact same-repository branch to clean; blank reconciles every orphan Preview'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  deployments: write

# One cleanup at a time, including scheduled recovery of builds finishing after close.
concurrency:
  group: web-preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: web-preview
      # Cleanup is not a deployment and must not make a new active record.
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_CLEANUP_API_TOKEN: ${{ secrets.CLOUDFLARE_CLEANUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      REQUESTED_BRANCH: ${{ inputs.branch }}
    steps:
      # pull_request_target's base can be any branch; ONLY default-branch code is trusted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: web/scripts/cloudflare-deployments.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Delete closed branch Preview or reconcile stale Previews
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == pull_request_target ]]; then
            if [[ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo 'Fork branches have no native Preview in this repository; no cleanup performed.'
              exit 0
            fi
            node web/scripts/cloudflare-deployments.mjs cleanup "$PR_HEAD_BRANCH"
          elif [[ -n "$REQUESTED_BRANCH" ]]; then
            node web/scripts/cloudflare-deployments.mjs cleanup "$REQUESTED_BRANCH"
          else
            node web/scripts/cloudflare-deployments.mjs reconcile
          fi
