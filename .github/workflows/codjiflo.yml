name: Codjiflo review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@3c5723550c4fdfcf408bf4b2e6404bbef440a9ce
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: 3c5723550c4fdfcf408bf4b2e6404bbef440a9ce
      runner-label: codjiflo-reviewer
      prepare-command: node scripts/prepare-solidworks-docs.mjs
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
