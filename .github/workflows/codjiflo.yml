name: Codjiflo review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@ec8316884ac4810ac885a88dae3fb616304929b1
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: ec8316884ac4810ac885a88dae3fb616304929b1
      runner-label: codjiflo-reviewer
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
