name: Codjiflo review
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@3a30108c98f96089c510c4e2467f23207e9c7103
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: 3a30108c98f96089c510c4e2467f23207e9c7103
      runner-label: codjiflo-reviewer
      prepare-command: node scripts/prepare-solidworks-docs.mjs
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
