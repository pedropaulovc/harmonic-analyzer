name: Codjiflo review
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@0d67a8d36f7bc743c5c18e6051b7abe15722a0ea
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: 0d67a8d36f7bc743c5c18e6051b7abe15722a0ea
      runner-label: codjiflo-reviewer
      prepare-command: node scripts/prepare-solidworks-docs.mjs
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
