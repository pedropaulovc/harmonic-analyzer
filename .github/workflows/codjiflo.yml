name: Codjiflo review
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@aa8e93499215ebb34dad75e63dcaa468b309f073
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: aa8e93499215ebb34dad75e63dcaa468b309f073
      runner-label: codjiflo-reviewer
      source-submodules: '["SolidworksMCP-python"]'
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
