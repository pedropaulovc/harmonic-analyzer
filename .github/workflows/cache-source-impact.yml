name: Cache Source Impact (informational)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: cache-source-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-impact:
    # Informational only: do not configure this workflow as a required merge
    # check. Discovery errors/incomplete evidence remain visible in its result.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Exact head, never GitHub's synthetic merge commit. No credentials remain
      # in the checkout exposed read-only to revision Python.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Fetch exact comparison and public adapter objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          COMPARISON_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          # Never follow a PR-controlled .gitmodules URL or initialize the
          # private references submodule. These are object stores, not code run
          # on the host; each pin is materialized later inside the sandbox.
          if ! git clone --no-checkout https://github.com/pedropaulovc/SolidworksMCP-python.git SolidworksMCP-python; then
            echo '::warning::Public adapter object store unavailable; report will identify incomplete evidence'
          fi
          for sha in "$COMPARISON_BASE" "$HEAD_SHA"; do
            read -r mode kind pin path < <(git ls-tree "$sha" -- SolidworksMCP-python) || true
            if [[ "$mode" != 160000 || "$kind" != commit || ! "$pin" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::warning::Required adapter gitlink missing or invalid; report will identify incomplete evidence'
              continue
            fi
            if ! git -C SolidworksMCP-python fetch --no-tags origin "$pin"; then
              echo '::warning::Adapter pin unavailable; report will identify incomplete evidence'
            fi
          done

      - name: Prepare offline discovery runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-source-impact" "$RUNNER_TEMP/cache-source-impact-scratch"
          # Fixed bootstrap: no PR pyproject, build backend, requirements file,
          # Dockerfile or package-install hook executes on the host or at build.
          # Versions match the repository lock's graph-only import dependencies.
          docker build --tag ha-cache-impact-runtime - <<'DOCKERFILE'
          FROM ghcr.io/astral-sh/uv:0.9.8 AS uv
          FROM python:3.14-slim
          COPY --from=uv /uv /uvx /usr/local/bin/
          RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
          ENV VIRTUAL_ENV=/opt/venv
          ENV PATH="/opt/venv/bin:$PATH"
          ENV UV_PYTHON_DOWNLOADS=never
          RUN uv venv --python /usr/local/bin/python /opt/venv
          RUN uv pip install --python /opt/venv/bin/python --no-cache doit==0.37.0 filelock==3.29.4 PyYAML==6.0.3 opentelemetry-api==1.39.1 opentelemetry-sdk==1.39.1 pytest==9.1.1
          DOCKERFILE

      - name: Exercise focused offline report contracts in CI runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,size=128m,mode=1777 \
            --env HOME=/tmp --env TMPDIR=/scratch --env GIT_CONFIG_NOSYSTEM=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/cache-source-impact,target=/reports" \
            --mount "type=bind,source=$RUNNER_TEMP/cache-source-impact-scratch,target=/scratch" \
            --workdir /tmp ha-cache-impact-runtime \
            python -I -B -m pytest /repo/tests/test_cache_impact.py -q -p no:cacheprovider \
            --basetemp=/scratch/tests --junitxml=/reports/cache-impact-tests.xml

      - name: Report source impact (no count threshold)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          # Revision Python is untrusted. It receives no Actions tokens, secrets,
          # network, host home, Docker socket, capabilities or writable checkout.
          # Only reports and owned disposable scratch are host-writable.
          # Scratch is disk-backed: two full source trees must not consume the
          # container's memory budget through tmpfs. Errors/incomplete inputs
          # are nonzero and visible; any number of impacts is successful.
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g --cpus 2 \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,size=128m,mode=1777 \
            --env HOME=/tmp --env TMPDIR=/scratch --env GIT_CONFIG_NOSYSTEM=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/cache-source-impact,target=/reports" \
            --mount "type=bind,source=$RUNNER_TEMP/cache-source-impact-scratch,target=/scratch" \
            --workdir /tmp ha-cache-impact-runtime \
            python -I -B /repo/cache_impact.py --repo /repo \
            --base "$BASE_SHA" --head "$HEAD_SHA" --merge-base \
            --json /reports/source-impact.json --markdown /reports/source-impact.md

      - name: Reject unsafe report artifacts before host reads
        id: report-files
        if: always()
        shell: bash
        run: |
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          directory = Path(os.environ["RUNNER_TEMP"]) / "cache-source-impact"
          directory.mkdir(parents=True, exist_ok=True)
          allowed = {"source-impact.json", "source-impact.md", "cache-impact-tests.xml"}
          for path in directory.iterdir():
              if path.name not in allowed or not stat.S_ISREG(path.lstat().st_mode):
                  print("Refusing unexpected/nonregular report artifact:", repr(path.name), file=sys.stderr)
                  raise SystemExit(1)
          PY

      - name: Publish informational job summary
        if: ${{ always() && steps.report-files.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cache-source-impact"
          if [[ ! -f "$RUNNER_TEMP/cache-source-impact/source-impact.md" ]]; then
            printf '%s\n' '# Cache source impact — tool error' '' \
              'No impact conclusion is available. See failed step logs.' \
              > "$RUNNER_TEMP/cache-source-impact/source-impact.md"
          fi
          if [[ ! -f "$RUNNER_TEMP/cache-source-impact/source-impact.json" ]]; then
            printf '%s\n' '{"schema_version":1,"kind":"source_impact","error":"Workflow preparation or reporting failed; see job logs. No impact conclusion is available."}' \
              > "$RUNNER_TEMP/cache-source-impact/source-impact.json"
          fi
          # GitHub limits a job summary to 1 MiB. Counts must not turn a large
          # informational report into a failed upload; the artifact stays full.
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "cache-source-impact/source-impact.md"
          with report.open("rb") as handle:
              data = handle.read(900001)
          text = data[:900000].decode("utf-8", errors="ignore")
          if len(data) > 900000:
              text += "\n\nFull causal report continues in the source-impact.md artifact.\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.report-files.outcome == 'success' }}
        with:
          name: cache-source-impact-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/cache-source-impact/source-impact.json
            ${{ runner.temp }}/cache-source-impact/source-impact.md
            ${{ runner.temp }}/cache-source-impact/cache-impact-tests.xml
          if-no-files-found: warn
          retention-days: 14
